<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS DOP-C02 | SET 06 (Q251~Q300)</title>
<style>
[data-theme="dark"] {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#222636; --border:#2e3347;
  --accent:#4f8ef7; --accent2:#38c9a0; --text:#e2e6f0; --text-muted:#7a83a0;
  --correct-bg:#112a22; --wrong-bg:#2a1111; --explain-bg:#1e2030;
  --hover-bg:#1e2236; --sel-bg:#1b2540;
}
[data-theme="light"] {
  --bg:#f0f2f8; --surface:#ffffff; --surface2:#f5f6fa; --border:#d0d5e8;
  --accent:#2e6fe0; --accent2:#1aaa7e; --text:#1a1d2e; --text-muted:#5a6280;
  --correct-bg:#e6faf4; --wrong-bg:#fde8e8; --explain-bg:#f0f2fa;
  --hover-bg:#eaf1ff; --sel-bg:#ddeaff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard','Noto Sans KR','Segoe UI',sans-serif;font-size:15px;line-height:1.75;min-height:100vh;transition:background .25s,color .25s;}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 60px;}

/* Topbar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}

/* ── SET 선택 콤보박스 ── */
.set-select-wrap{position:relative;display:inline-flex;align-items:center;}
.set-select{
  appearance:none;-webkit-appearance:none;
  background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  border:none;border-radius:20px;
  color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;
  padding:4px 28px 4px 12px;
  cursor:pointer;outline:none;
  transition:filter .2s,transform .1s;
  white-space:nowrap;
}
.set-select:hover{filter:brightness(1.12);transform:translateY(-1px);}
.set-select:focus{filter:brightness(1.08);outline:2px solid rgba(255,255,255,.5);outline-offset:2px;}
.set-select option{background:#1a1d27;color:#e2e6f0;font-size:13px;font-weight:600;}
/* 화살표 아이콘 */
.set-select-wrap::after{
  content:'▾';
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:#fff;font-size:10px;pointer-events:none;
}

.badge{background:linear-gradient(135deg,#4f8ef7,#38c9a0);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 12px;border-radius:20px;white-space:nowrap;}
.topbar-title{font-size:13px;color:var(--text-muted);flex:1;min-width:120px;}
.topbar-title strong{color:var(--text);font-size:15px;display:block;}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}

/* 문제 선택 콤보박스 */
.q-select-wrap{display:flex;align-items:center;gap:6px;}
.q-select-label{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.q-select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-weight:600;padding:5px 10px;cursor:pointer;outline:none;transition:border-color .2s;}
.q-select:focus,.q-select:hover{border-color:var(--accent);}
.q-select option.opt-correct{color:#1aaa7e;}
.q-select option.opt-wrong{color:#e05252;}

/* 상단 네비 버튼 + 문제 콤보 높이 통일 */
.topbar-right .btn-nav,
.topbar-right .q-select {
  height: 24px;
  padding: 0 14px;
  font-size: 13px;
}

/* 테마 버튼 */
.theme-btn{background:var(--surface2);border:1px solid var(--border);border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-muted);transition:border-color .2s,color .2s;white-space:nowrap;}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}

/* Progress */
.progress-bar{background:var(--surface2);border-radius:4px;height:6px;margin-bottom:20px;overflow:hidden;}
.progress-fill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:4px;transition:width .4s;}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:16px;transition:background .25s,border-color .25s;}

/* Lang Tabs */
.lang-tabs{display:flex;gap:8px;margin-bottom:20px;}
.lang-tab{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.04em;padding:5px 14px;transition:all .2s;}
.lang-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.lang-tab:hover:not(.active){border-color:var(--accent);color:var(--accent);}

/* Q Label */
.q-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-bottom:10px;}
.q-type-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:10px;margin-left:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);vertical-align:middle;}
.q-type-badge.multi{background:#ede9ff;color:#6d28d9;border-color:#c4b5fd;}
[data-theme="dark"] .q-type-badge.multi{background:#2a1f50;color:#a78bfa;border-color:#4c3a8c;}

/* Q Text */
.q-text{font-size:15px;color:var(--text);line-height:1.85;}
.q-text.en-text{
  font-size:14px;color:var(--text-muted);
  margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--border);
}
.q-text code{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:13px;font-family:'JetBrains Mono','Fira Code',monospace;color:var(--accent2);}

/* Choices */
.choices-section{margin-top:24px;}
.choices-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px;}
.choice{display:flex;align-items:flex-start;gap:14px;background:var(--surface2);border:2px solid var(--border);border-radius:10px;cursor:pointer;margin-bottom:10px;padding:14px 18px;transition:border-color .2s,background .2s;user-select:none;}
.choice:hover{border-color:var(--accent);background:var(--hover-bg);}
.choice.selected{border-color:var(--accent);background:var(--sel-bg);}
.choice.correct{border-color:#38c9a0!important;background:var(--correct-bg)!important;}
.choice.wrong{border-color:#f76f6f!important;background:var(--wrong-bg)!important;}
.choice.disabled{cursor:default;pointer-events:none;}
.choice-key{background:var(--border);border-radius:6px;color:var(--text);font-size:13px;font-weight:700;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:background .2s,color .2s;}
.choice.selected .choice-key{background:var(--accent);color:#fff;}
.choice.correct .choice-key{background:#38c9a0;color:#000;}
.choice.wrong .choice-key{background:#f76f6f;color:#fff;}
.choice-body{flex:1;}
.choice-text{font-size:14px;line-height:1.75;}
.choice-en{font-size:12px;color:var(--text-muted);margin-top:5px;display:none;font-style:italic;}
.result-icon{margin-left:auto;font-size:18px;flex-shrink:0;display:none;}
.choice.correct .result-icon,.choice.wrong .result-icon{display:block;}

/* Actions */
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center;}
.btn{border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.03em;padding:11px 24px;transition:opacity .2s,transform .1s;}
.btn:hover:not(:disabled){opacity:.88;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-nav{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:11px 18px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.hint-text{font-size:12px;color:var(--text-muted);margin-top:8px;min-height:18px;}

/* Review Panel */
.review-panel{display:none;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent2);border-radius:12px;padding:24px 28px;margin-bottom:16px;animation:fadeIn .35s ease;transition:background .25s;}
.review-panel.show{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.answer-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.answer-label{font-size:13px;color:var(--text-muted);}
.answer-badge{background:#38c9a0;color:#000;font-size:13px;font-weight:800;padding:4px 14px;border-radius:20px;}
.vote-badge{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);font-size:12px;padding:3px 10px;border-radius:20px;}
.vote-badge span{color:var(--accent);font-weight:700;}
.section-title{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent2);text-transform:uppercase;margin-bottom:10px;}
.explain-box{background:var(--explain-bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;font-size:14px;line-height:1.8;color:var(--text);}
.explain-box p{margin-bottom:8px;}
.explain-box p:last-child{margin-bottom:0;}
.mark-ok{color:#38c9a0;font-weight:700;}
.mark-no{color:#f76f6f;font-weight:600;}

/* Discussion */
.disc-toggle{background:transparent;border:1px dashed var(--border);border-radius:8px;color:var(--text-muted);cursor:pointer;font-size:13px;margin-top:8px;padding:9px 16px;width:100%;text-align:left;transition:border-color .2s,color .2s;}
.disc-toggle:hover{border-color:var(--accent);color:var(--accent);}
.disc-list{display:none;margin-top:10px;}
.disc-list.show{display:block;}
.disc-item{background:var(--surface2);border-left:3px solid var(--border);border-radius:0 6px 6px 0;font-size:13px;margin-bottom:8px;padding:10px 14px;color:var(--text-muted);line-height:1.7;}
.disc-ans{color:var(--accent);font-weight:700;font-size:12px;margin-bottom:3px;}

/* Bottom Nav */
.nav-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px;}
.nav-info{font-size:13px;color:var(--text-muted);text-align:center;flex:1;}

@media(max-width:600px){
  .card{padding:16px;}
  .btn{padding:10px 16px;font-size:13px;}
  .topbar{gap:8px;}
  .topbar-right{gap:6px;}
}

/* ── 패스워드 모달 ── */
.pw-overlay{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  /* 배경 블러 */
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  background:rgba(10,12,22,.55);
  transition:opacity .3s;
}
.pw-overlay.hidden{
  opacity:0;pointer-events:none;
}
.pw-modal{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 24px 64px rgba(0,0,0,.35);
  padding:40px 36px 34px;
  width:min(400px,90vw);
  display:flex;flex-direction:column;align-items:center;gap:0;
  animation:pwSlideIn .35s cubic-bezier(.22,.9,.36,1) both;
}
@keyframes pwSlideIn{
  from{opacity:0;transform:translateY(28px) scale(.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.pw-logo{
  width:54px;height:54px;border-radius:14px;
  background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;margin-bottom:20px;
  box-shadow:0 8px 24px rgba(79,142,247,.35);
}
.pw-title{
  font-size:18px;font-weight:800;color:var(--text);
  letter-spacing:-.01em;margin-bottom:6px;text-align:center;
}
.pw-sub{
  font-size:13px;color:var(--text-muted);margin-bottom:28px;text-align:center;line-height:1.6;
}
.pw-input-wrap{
  position:relative;width:100%;margin-bottom:14px;
}
.pw-input{
  width:100%;
  background:var(--surface2);
  border:2px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-size:16px;font-weight:700;
  letter-spacing:.15em;
  padding:13px 46px 13px 18px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
  text-align:center;
}
.pw-input::placeholder{letter-spacing:normal;font-weight:400;font-size:14px;}
.pw-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,142,247,.18);}
.pw-input.shake{animation:pwShake .38s ease;}
.pw-input.error{border-color:#f76f6f;box-shadow:0 0 0 3px rgba(247,111,111,.18);}
@keyframes pwShake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-6px);}
  80%{transform:translateX(6px);}
}
.pw-toggle{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:var(--text-muted);font-size:18px;padding:2px 4px;
  transition:color .2s;
}
.pw-toggle:hover{color:var(--accent);}
.pw-error-msg{
  font-size:12px;color:#f76f6f;font-weight:600;
  min-height:18px;margin-bottom:18px;text-align:center;
  transition:opacity .2s;
}
.pw-btn{
  width:100%;background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  border:none;border-radius:10px;color:#fff;
  font-size:15px;font-weight:800;letter-spacing:.04em;
  padding:14px;cursor:pointer;
  transition:filter .2s,transform .1s,box-shadow .2s;
  box-shadow:0 6px 20px rgba(79,142,247,.3);
}
.pw-btn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 8px 28px rgba(79,142,247,.4);}
.pw-btn:active{transform:translateY(0);}
.pw-footer{
  font-size:11px;color:var(--text-muted);margin-top:20px;text-align:center;
}
</style>
</head>
<body>

<!-- ── 패스워드 모달 ── -->
<div class="pw-overlay" id="pw-overlay">
  <div class="pw-modal" role="dialog" aria-modal="true" aria-labelledby="pw-title">
    <div class="pw-logo">🔐</div>
    <div class="pw-title" id="pw-title">학습 콘텐츠 잠금</div>
    <div class="pw-sub">AWS DOP-C02 학습 자료에 접근하려면<br>패스워드를 입력해 주세요.</div>

    <div class="pw-input-wrap">
      <input
        class="pw-input" id="pw-input"
        type="password" placeholder="패스워드 입력"
        maxlength="20"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter') checkPw()"
      />
      <button class="pw-toggle" id="pw-toggle" onclick="togglePwVisible()" tabindex="-1" title="표시/숨김">👁</button>
    </div>

    <div class="pw-error-msg" id="pw-error"></div>

    <button class="pw-btn" onclick="checkPw()">확인</button>

    <div class="pw-footer">🍪 인증 후 쿠키에 저장되어 다음 방문 시 자동 로그인됩니다.</div>
  </div>
</div>

<div class="wrap">

  <!-- Topbar -->
  <div class="topbar">

    <!-- ── SET 선택 콤보박스 (badge 대체) ── -->
    <div class="set-select-wrap">
      <select class="set-select" id="set-select" onchange="goSet(this.value)">
        <option value="01" selected>DOP-C02 · SET 01</option>
        <option value="02">DOP-C02 · SET 02</option>
        <option value="03">DOP-C02 · SET 03</option>
        <option value="04">DOP-C02 · SET 04</option>
        <option value="05">DOP-C02 · SET 05</option>
        <option value="06">DOP-C02 · SET 06</option>
        <option value="07">DOP-C02 · SET 07</option>
        <option value="08">DOP-C02 · SET 08</option>
        <option value="09">DOP-C02 · SET 09</option>
      </select>
    </div>

    <div class="topbar-title">
      <strong>AWS Certified DevOps Engineer – Professional</strong>
      SET 06 · Q251~Q300 실전 학습
    </div>
    <div class="topbar-right">
      <!-- 상단 네비게이션 -->
      <button class="btn btn-nav" onclick="goQWithReset(curQ-1)" id="btn-prev-top">←</button>

      <!-- 문제 선택 콤보박스 -->
      <div class="q-select-wrap">
        <select class="q-select" id="q-select" onchange="goQWithReset(this.value-251)"></select>
      </div>
      <button class="btn btn-nav" onclick="goQWithReset(curQ+1)" id="btn-next-top">→</button>

      <!-- 테마 토글 -->
      <button class="theme-btn" onclick="toggleTheme()">
        <span id="theme-icon">☀️</span>
        <span id="theme-label">라이트</span>
      </button>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:5%"></div></div>

  <!-- Language Tabs -->
  <div class="lang-tabs">
    <button class="lang-tab active" onclick="setLang('ko',this)">한국어</button>
    <button class="lang-tab" onclick="setLang('both',this)">양국어</button>
  </div>

  <!-- Question Card -->
  <div class="card" id="q-card">
    <div class="q-label">
      문제 <span id="q-num-badge">001</span>
      <span id="q-type-badge" class="q-type-badge">단일 선택</span>
    </div>
    <!-- 한국어 문제 -->
    <div class="q-text" id="q-ko-text"></div>
    <!-- 영어 문제 (양국어 모드) -->
    <div class="q-text en-text" id="q-en-text"></div>

    <div class="choices-section">
      <div class="choices-label" id="choices-label">선택지</div>
      <div id="choices-container"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btn-review" onclick="doReview()" disabled>📋 정답 확인</button>
      <button class="btn btn-secondary" onclick="doReset()">↺ 초기화</button>
    </div>
    <div class="hint-text" id="hint-text">선택지를 클릭하면 정답 확인 버튼이 활성화됩니다.</div>
  </div>

  <!-- Review Panel -->
  <div class="review-panel" id="review-panel">
    <div class="answer-row">
      <span class="answer-label">정답</span>
      <span class="answer-badge" id="review-answer-badge"></span>
      <span class="vote-badge" id="review-vote-badge"></span>
    </div>
    <div class="section-title">✦ 정답 해설</div>
    <div class="explain-box" id="review-explain"></div>
    <div class="section-title" style="margin-top:14px;" id="wrong-section-title">✦ 오답 분석</div>
    <div class="explain-box" id="review-wrong"></div>
    <button class="disc-toggle" onclick="document.getElementById('disc-list').classList.toggle('show')">💬 주요 토론 의견 보기 / 숨기기</button>
    <div class="disc-list" id="disc-list"></div>
  </div>

  <!-- Bottom Nav -->
  <!-- <div class="nav-bottom">
    <button class="btn btn-nav" onclick="goQ(curQ-1)" id="btn-prev">← 이전</button>
    <span class="nav-info" id="nav-info"></span>
    <button class="btn btn-nav" onclick="goQ(curQ+1)" id="btn-next">다음 →</button>
  </div> -->

</div>
<script>
// ────────────────────────────────────────────────
// 패스워드 / 쿠키 인증
// ────────────────────────────────────────────────
const PW_CORRECT  = 'DOP2';
const COOKIE_NAME = 'dop2_auth';
const COOKIE_DAYS = 30; // 쿠키 유효기간 (일)

function getCookie(name) {
  const cookies = document.cookie.split(';');
  for (let c of cookies) {
    const [k, v] = c.trim().split('=');
    if (k === name) return decodeURIComponent(v || '');
  }
  return null;
}

function setCookie(name, value, days) {
  const expires = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${expires};path=/;SameSite=Lax`;
}

function unlockPage() {
  const overlay = document.getElementById('pw-overlay');
  overlay.classList.add('hidden');
  // 완전히 숨긴 뒤 DOM에서 제거
  overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
}

function checkPw() {
  const input = document.getElementById('pw-input');
  const errEl = document.getElementById('pw-error');
  const val   = input.value.trim();

  if (val === PW_CORRECT) {
    setCookie(COOKIE_NAME, PW_CORRECT, COOKIE_DAYS);
    errEl.textContent = '';
    input.classList.remove('error');
    unlockPage();
  } else {
    errEl.textContent = '❌ 패스워드가 올바르지 않습니다. 다시 입력해 주세요.';
    input.classList.add('error', 'shake');
    input.select();
    input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
  }
}

function togglePwVisible() {
  const input  = document.getElementById('pw-input');
  const toggle = document.getElementById('pw-toggle');

function goSet(setNum) {
  // 현재 페이지 파일명에서 set 번호만 교체
  const currentPath = window.location.pathname;
  const fileName = currentPath.split('/').pop(); // e.g. "DOP2_set01_v02.html"

  let newFileName;
  if (fileName && fileName.match(/DOP2_set\d{2}/i)) {
    // 파일명에서 set 번호 교체
    newFileName = fileName.replace(/set\d{2}/i, `set${setNum}`);
  } else {
    // 파일명 패턴을 찾지 못한 경우 기본 패턴 사용
    newFileName = `DOP2_set${setNum}_v02.html`;
  }

  const newPath = currentPath.replace(fileName, newFileName);
  window.location.href = newPath;
}

<p>AssumeRole API 호출은 AWS CloudTrail에 기록됩니다. EventBridge는 CloudTrail의 AssumeRole 이벤트를 거의 실시간으로 감지하여 Lambda를 호출하고, Lambda가 SNS 토픽에 알림을 발송합니다. 이 방식은 콘솔, CLI, SDK 등 모든 방법으로 수행된 역할 수임을 감지합니다.</p>`,

<p><span class="mark-no">❌ B</span> — GuardDuty는 위협 탐지용으로, 특정 역할 수임 이벤트를 모니터링하는 용도가 아닙니다.</p>
<p><span class="mark-no">❌ C</span> — 콘솔 로그인 이벤트 패턴은 AssumeRole API 호출과 다릅니다. CLI나 SDK를 통한 역할 수임은 감지하지 못합니다.</p>`,
  disc: [{ ans:'D (100%)', txt:'CloudTrail AssumeRole 이벤트를 EventBridge로 감지하고 Lambda+SNS로 거의 실시간 알림을 구현하는 표준 패턴입니다.' }]
},
{
  n: 255,
  en: `A company needs a strategy for failover and disaster recovery of its data and application. The application uses a MySQL database and Amazon EC2 instances. The company requires a maximum RPO of 2 hours and a maximum RTO of 10 minutes for its data and application at all times.<br><br>Which combination of deployment strategies will meet these requirements? (Choose two.)`,
  ko: `어떤 회사에서는 데이터와 애플리케이션의 장애 조치 및 재해 복구를 위한 전략이 필요합니다. 이 애플리케이션은 MySQL 데이터베이스와 Amazon EC2 인스턴스를 사용합니다. 이 회사는 데이터와 애플리케이션에 대해 항상 최대 RPO 2시간, 최대 RTO 10분이 필요합니다.<br><br>이러한 요구 사항을 충족하는 배포 전략 조합은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Create an Amazon Aurora Single-AZ cluster in multiple AWS Regions as the data store. Use Aurora's automatic recovery capabilities in the event of a disaster.`, ko:`여러 AWS 리전에 Amazon Aurora Single-AZ 클러스터를 데이터 저장소로 만듭니다. 재해 발생 시 Aurora의 자동 복구 기능을 사용합니다.` },
    { k:'B', en:`Create an Amazon Aurora global database in two AWS Regions as the data store. In the event of a failure, promote the secondary Region to the primary for the application. Update the application to use the Aurora cluster endpoint in the secondary Region.`, ko:`두 개의 AWS 리전에 Amazon Aurora 글로벌 데이터베이스를 데이터 저장소로 만듭니다. 장애가 발생하면 보조 리전을 애플리케이션의 기본 리전으로 승격합니다. 보조 리전에서 Aurora 클러스터 엔드포인트를 사용하도록 애플리케이션을 업데이트합니다.` },
    { k:'C', en:`Create an Amazon Aurora cluster in multiple AWS Regions as the data store. Use a Network Load Balancer to balance the database traffic in different Regions.`, ko:`여러 AWS 리전에 Amazon Aurora 클러스터를 데이터 저장소로 만듭니다. Network Load Balancer를 사용하여 다른 리전의 데이터베이스 트래픽을 균형 있게 조정합니다.` },
    { k:'D', en:`Set up the application in two AWS Regions. Use Amazon Route 53 failover routing that points to Application Load Balancers in both Regions. Use health checks and Auto Scaling groups in each Region.`, ko:`두 AWS 리전에 애플리케이션을 설정합니다. 두 리전 모두에서 애플리케이션 로드 밸런서를 가리키는 Amazon Route 53 장애 조치 라우팅을 사용합니다. 각 리전에서 상태 확인 및 Auto Scaling 그룹을 사용합니다.` },
    { k:'E', en:`Set up the application in two AWS Regions. Configure AWS Global Accelerator to point to Application Load Balancers (ALBs) in both Regions. Add both ALBs to a single endpoint group. Use health checks and Auto Scaling groups in each Region.`, ko:`두 AWS 리전에서 애플리케이션을 설정합니다. AWS Global Accelerator를 두 리전의 Application Load Balancer(ALB)를 가리키도록 구성합니다. 두 ALB를 단일 엔드포인트 그룹에 추가합니다. 각 리전에서 상태 확인 및 Auto Scaling 그룹을 사용합니다.` },
  ],
  answer: ['B','D'],
  vote: '90% BD',
  explain: `<p><span class="mark-ok">✅ B — Aurora 글로벌 데이터베이스</span></p>
<p>Aurora 글로벌 데이터베이스는 리전 간 자동 복제로 RPO를 1초 미만으로 유지하며(2시간 RPO 요구 충족), 보조 리전 승격 시간이 1분 미만이어서 10분 RTO도 충족합니다.</p>
<p><span class="mark-ok">✅ D — Route 53 장애 조치 라우팅 + ALB + Auto Scaling</span></p>
<p>Route 53 장애 조치 라우팅은 기본 리전 장애 감지 시 보조 리전으로 자동 전환하여 10분 RTO를 충족합니다. Auto Scaling으로 EC2 인스턴스도 자동 복구됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Single-AZ Aurora를 여러 리전에 별도로 만드는 것은 리전 간 데이터 복제가 없어 RPO를 보장할 수 없습니다.</p>
<p><span class="mark-no">❌ C</span> — NLB는 데이터베이스 트래픽 로드 밸런싱에 적합하지 않으며, 리전 간 데이터 복제 메커니즘이 없습니다.</p>
<p><span class="mark-no">❌ E</span> — Global Accelerator는 네트워크 수준 장애 조치를 지원하지만, Route 53 장애 조치와 기능이 중복되며 이 경우 D가 더 표준적인 솔루션입니다.</p>`,
  disc: [{ ans:'BD (90%)', txt:'Aurora 글로벌 데이터베이스로 낮은 RPO를 보장하고, Route 53 장애 조치로 빠른 RTO를 달성하는 조합입니다.' }]
},
{
  n: 256,
  en: `A developer is using the AWS Serverless Application Model (AWS SAM) to create a prototype for an AWS Lambda function. The AWS SAM template contains an AWS::Serverless::Function resource that has the CodeUri property that points to an Amazon S3 location. The developer wants to identify the correct commands for deployment before creating a CI/CD pipeline.<br><br>The developer creates an archive of the Lambda function code named package.zip. The developer uploads the .zip file archive to the S3 location specified in the CodeUri property. The developer runs the sam deploy command and deploys the Lambda function. The developer updates the Lambda function code and uses the same steps to deploy the new version of the Lambda function. The sam deploy command fails and returns an error of no changes to deploy.<br><br>Which solutions will deploy the new version? (Choose two.)`,
  ko: `개발자는 AWS Serverless Application Model(AWS SAM)을 사용하여 AWS Lambda 함수의 프로토타입을 만들고 있습니다. AWS SAM 템플릿에는 Amazon S3 위치를 가리키는 CodeUri 속성이 있는 AWS::Serverless::Function 리소스가 포함되어 있습니다. 개발자는 CI/CD 파이프라인을 만들기 전에 배포에 대한 올바른 명령을 식별하려고 합니다.<br><br>개발자는 package.zip이라는 이름의 Lambda 함수 코드 아카이브를 만듭니다. 개발자는 CodeUri 속성에 지정된 S3 위치에 .zip 파일 아카이브를 업로드합니다. 개발자는 sam deploy 명령을 실행하고 Lambda 함수를 배포합니다. 개발자는 Lambda 함수 코드를 업데이트하고 동일한 단계를 사용하여 새 버전의 Lambda 함수를 배포합니다. sam deploy 명령이 실패하고 배포할 변경 사항이 없다는 오류를 반환합니다.<br><br>새 버전을 배포할 솔루션은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Use the aws cloudformation update-stack command instead of the sam deploy command.`, ko:`sam deploy 명령 대신 aws cloudformation update-stack 명령을 사용합니다.` },
    { k:'B', en:`Use the aws cloudformation update-stack-instances command instead of the sam deploy command.`, ko:`sam deploy 명령 대신 aws cloudformation update-stack-instances 명령을 사용합니다.` },
    { k:'C', en:`Update the CodeUri property to reference the local application code folder. Use the sam deploy command.`, ko:`로컬 애플리케이션 코드 폴더를 참조하도록 CodeUri 속성을 업데이트합니다. sam deploy 명령을 사용합니다.` },
    { k:'D', en:`Update the CodeUri property to reference the local application code folder. Use the aws cloudformation create-change-set command and the aws cloudformation execute-change-set command.`, ko:`로컬 애플리케이션 코드 폴더를 참조하도록 CodeUri 속성을 업데이트합니다. aws cloudformation create-change-set 명령과 aws cloudformation execute-change-set 명령을 사용합니다.` },
    { k:'E', en:`Update the CodeUri property to reference the local application code folder. Use the aws cloudformation package command and the aws cloudformation deploy command.`, ko:`CodeUri 속성을 업데이트하여 로컬 애플리케이션 코드 폴더를 참조합니다. aws cloudformation package 명령과 aws cloudformation deploy 명령을 사용합니다.` },
  ],
  answer: ['C','E'],
  vote: '85% CE',
  explain: `<p><span class="mark-ok">✅ C — CodeUri를 로컬 폴더로 변경 후 sam deploy</span></p>
<p>CodeUri를 로컬 폴더로 지정하면 sam deploy 실행 시 SAM이 자동으로 코드를 패키징하여 S3에 업로드하고 새 S3 URI로 템플릿을 갱신합니다. 코드 변경이 항상 감지되어 "변경 없음" 오류가 발생하지 않습니다.</p>
<p><span class="mark-ok">✅ E — aws cloudformation package + aws cloudformation deploy</span></p>
<p><code>aws cloudformation package</code>는 로컬 코드를 S3에 업로드하고 새 S3 URI로 템플릿을 갱신합니다. <code>aws cloudformation deploy</code>는 갱신된 템플릿을 배포합니다. C와 동일한 효과를 CloudFormation CLI로 구현합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — <code>aws cloudformation update-stack</code>은 패키징 단계가 없어 S3의 동일한 파일을 참조하므로 코드 변경을 감지하지 못합니다.</p>
<p><span class="mark-no">❌ B</span> — <code>update-stack-instances</code>는 StackSets 전용 명령으로 단일 Lambda 함수 배포에는 사용하지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — 로컬 코드를 S3에 업로드하는 패키징 단계 없이 create-change-set만 사용하면 변경 사항이 올바르게 감지되지 않습니다.</p>`,
  disc: [{ ans:'CE (85%)', txt:'핵심은 CodeUri를 로컬 경로로 변경하여 SAM/CloudFormation이 매번 코드를 패키징하도록 하는 것입니다.' }]
},
{
  n: 257,
  en: `A company runs its container workloads in AWS App Runner. A DevOps engineer manages the company's container repository in Amazon Elastic Container Registry (Amazon ECR).<br><br>The DevOps engineer must implement a solution that continuously monitors the container repository. The solution must create a new container image when the solution detects an operating system vulnerability or language package vulnerability.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 AWS App Runner에서 컨테이너 워크로드를 실행합니다. DevOps 엔지니어가 Amazon Elastic Container Registry(Amazon ECR)에서 회사의 컨테이너 리포지토리를 관리합니다.<br><br>DevOps 엔지니어는 컨테이너 리포지토리를 지속적으로 모니터링하는 솔루션을 구현해야 합니다. 솔루션은 운영 체제 취약성이나 언어 패키지 취약성을 감지하면 새 컨테이너 이미지를 생성해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use EC2 Image Builder to create a container image pipeline. Use Amazon ECR as the target repository. Turn on enhanced scanning on the ECR repository. Create an Amazon EventBridge rule to capture an Inspector finding event. Use the event to invoke the image pipeline. Re-upload the container to the repository.`, ko:`EC2 Image Builder를 사용하여 컨테이너 이미지 파이프라인을 만듭니다. Amazon ECR을 대상 저장소로 사용합니다. ECR 저장소에서 강화된 스캐닝을 켭니다. Inspector 결과 이벤트를 캡처하기 위한 Amazon EventBridge 규칙을 만듭니다. 이벤트를 사용하여 이미지 파이프라인을 호출합니다. 컨테이너를 저장소에 다시 업로드합니다.` },
    { k:'B', en:`Use EC2 Image Builder to create a container image pipeline. Use Amazon ECR as the target repository. Enable Amazon GuardDuty Malware Protection on the container workload. Create an Amazon EventBridge rule to capture a GuardDuty finding event. Use the event to invoke the image pipeline.`, ko:`EC2 Image Builder를 사용하여 컨테이너 이미지 파이프라인을 만듭니다. Amazon ECR을 대상 리포지토리로 사용합니다. 컨테이너 워크로드에서 Amazon GuardDuty Malware Protection을 활성화합니다. GuardDuty 결과 이벤트를 캡처하기 위한 Amazon EventBridge 규칙을 만듭니다. 이벤트를 사용하여 이미지 파이프라인을 호출합니다.` },
    { k:'C', en:`Create an AWS CodeBuild project to create a container image. Use Amazon ECR as the target repository. Turn on basic scanning on the repository. Create an Amazon EventBridge rule to capture an ECR image action event. Use the event to invoke the CodeBuild project. Re-upload the container to the repository.`, ko:`컨테이너 이미지를 생성하기 위해 AWS CodeBuild 프로젝트를 만듭니다. Amazon ECR을 대상 리포지토리로 사용합니다. 리포지토리에서 기본 스캐닝을 켭니다. ECR 이미지 작업 이벤트를 캡처하기 위해 Amazon EventBridge 규칙을 만듭니다. 이벤트를 사용하여 CodeBuild 프로젝트를 호출합니다. 컨테이너를 리포지토리에 다시 업로드합니다.` },
    { k:'D', en:`Create an AWS CodeBuild project to create a container image. Use Amazon ECR as the target repository. Configure AWS Systems Manager Compliance to scan all managed nodes. Create an Amazon EventBridge rule to capture a configuration compliance state change event. Use the event to invoke the CodeBuild project.`, ko:`컨테이너 이미지를 생성하기 위해 AWS CodeBuild 프로젝트를 만듭니다. Amazon ECR을 대상 리포지토리로 사용합니다. 모든 관리 노드를 스캔하도록 AWS Systems Manager Compliance를 구성합니다. 구성 준수 상태 변경 이벤트를 캡처하기 위해 Amazon EventBridge 규칙을 만듭니다. 이벤트를 사용하여 CodeBuild 프로젝트를 호출합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — ECR 강화된 스캐닝 + Inspector 이벤트 + EC2 Image Builder 파이프라인</span></p>
<p>ECR 강화된 스캐닝(Amazon Inspector 통합)은 OS 취약성과 언어 패키지 취약성을 지속적으로 모니터링합니다. 취약성 발견 시 Inspector 이벤트가 EventBridge에 전달되고, EventBridge 규칙이 EC2 Image Builder 파이프라인을 트리거하여 새로운 컨테이너 이미지를 빌드합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — GuardDuty Malware Protection은 악성 코드 탐지용으로, OS/언어 패키지 취약성 스캔을 지원하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — 기본 스캐닝은 언어 패키지 취약성을 지원하지 않습니다. ECR 이미지 작업 이벤트는 취약성 발견이 아닌 이미지 푸시/풀 이벤트입니다.</p>
<p><span class="mark-no">❌ D</span> — SSM Compliance는 EC2 인스턴스의 상태를 검사하는 것으로, ECR 컨테이너 이미지 취약성 스캔과 무관합니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'ECR 강화된 스캐닝(Inspector) → EventBridge → EC2 Image Builder 파이프라인의 자동화 흐름이 요구 사항을 정확히 충족합니다.' }]
},
{
  n: 258,
  en: `A company wants to use AWS Systems Manager documents to bootstrap physical laptops for developers. The bootstrap code is stored in GitHub. A DevOps engineer has already created a Systems Manager activation, installed the Systems Manager agent with the registration code, and installed an activation ID on all the laptops.<br><br>Which set of steps should be taken next?`,
  ko: `한 회사에서는 개발자를 위해 실제 노트북을 부트스트랩하기 위해 AWS Systems Manager 문서를 사용하고자 합니다. 부트스트랩 코드는 GitHub에 저장됩니다. DevOps 엔지니어는 이미 Systems Manager 활성화를 생성하고, 등록 코드로 Systems Manager 에이전트를 설치하고, 모든 노트북에 활성화 ID를 설치했습니다.<br><br>다음에 어떤 단계를 수행해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure the Systems Manager document to use the AWS-RunShellScript command to copy the files from GitHub to Amazon S3, then use the aws-downloadContent plugin with a sourceType of S3.`, ko:`AWS-RunShellScript 명령을 사용하여 GitHub에서 Amazon S3로 파일을 복사하도록 Systems Manager 문서를 구성한 다음, sourceType을 S3로 지정하여 aws-downloadContent 플러그인을 사용합니다.` },
    { k:'B', en:`Configure the Systems Manager document to use the aws-configurePackage plugin with an install action and point to the Git repository.`, ko:`설치 작업과 함께 aws-configurePackage 플러그인을 사용하고 Git 저장소를 가리키도록 Systems Manager 문서를 구성합니다.` },
    { k:'C', en:`Configure the Systems Manager document to use the aws-downloadContent plugin with a sourceType of GitHub and sourceInfo with the repository details.`, ko:`GitHub의 sourceType과 저장소 세부 정보가 있는 sourceInfo를 사용하여 aws-downloadContent 플러그인을 사용하도록 Systems Manager 문서를 구성합니다.` },
    { k:'D', en:`Configure the Systems Manager document to use the aws:softwareInventory plugin and run the script from the Git repository.`, ko:`aws:softwareInventory 플러그인을 사용하여 Systems Manager 문서를 구성하고 Git 저장소에서 스크립트를 실행합니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — aws-downloadContent 플러그인 (sourceType: GitHub)</span></p>
<p>SSM 문서의 <code>aws:downloadContent</code> 플러그인은 GitHub, S3 등 다양한 원격 소스에서 콘텐츠를 직접 다운로드할 수 있습니다. <code>sourceType</code>을 GitHub로 설정하고 <code>sourceInfo</code>에 리포지토리 정보를 제공하면 S3 중간 단계 없이 GitHub에서 직접 부트스트랩 코드를 다운로드합니다.</p>`,

{
  n: 259,
  en: `A company's development team uses AWS CloudFormation to deploy its application resources. The team must use CloudFormation for all changes to the environment. The team cannot use the AWS Management Console or the AWS CLI to make manual changes directly.<br><br>The team uses a developer IAM role to access the environment. The role is configured with the AdministratorAccess managed IAM policy. The company has created a new CloudFormationDeployment IAM role that has the following policy attached:<br><br>[Image showing a policy that grants broad permissions for resource management]<br><br>The company wants to ensure that only CloudFormation can use the new role. The development team cannot make any manual changes to the deployed resources.<br><br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `회사의 개발팀은 AWS CloudFormation을 사용하여 애플리케이션 리소스를 배포합니다. 팀은 환경에 대한 모든 변경 사항에 대해 CloudFormation을 사용해야 합니다. 팀은 AWS Management Console 또는 AWS CLI를 사용하여 직접 수동으로 변경할 수 없습니다.<br><br>팀은 개발자 IAM 역할을 사용하여 환경에 액세스합니다. 역할은 AdministratorAccess 관리형 IAM 정책으로 구성됩니다. 회사는 다음 정책이 첨부된 새 CloudFormationDeployment IAM 역할을 만들었습니다.<br><br>[광범위한 리소스 관리 권한을 부여하는 정책 이미지]<br><br>회사는 CloudFormation만 새 역할을 사용할 수 있도록 하려고 합니다. 개발팀은 배포된 리소스를 수동으로 변경할 수 없습니다.<br><br>이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Remove the AdministratorAccess policy. Assign the ReadOnlyAccess managed IAM policy to the developer role. Instruct the developers to use the CloudFormationDeployment role as a CloudFormation service role when the developers deploy new stacks.`, ko:`AdministratorAccess 정책을 제거합니다. ReadOnlyAccess 관리형 IAM 정책을 개발자 역할에 할당합니다. 개발자가 새 스택을 배포할 때 CloudFormationDeployment 역할을 CloudFormation 서비스 역할로 사용하도록 개발자에게 지시합니다.` },
    { k:'B', en:`Update the trust policy of the CloudFormationDeployment role to allow the developer IAM role to assume the CloudFormationDeployment role.`, ko:`CloudFormationDeployment 역할의 신뢰 정책을 업데이트하여 개발자 IAM 역할이 CloudFormationDeployment 역할을 수임할 수 있도록 허용합니다.` },
    { k:'C', en:`Configure the developer IAM role to be able to get and pass the CloudFormationDeployment role if iam:PassedToService equals cloudformation.amazonaws.com. Configure the CloudFormationDeployment role to allow all cloudformation actions for all resources.`, ko:`iam:PassedToService가 cloudformation.amazonaws.com이면 CloudFormationDeployment 역할을 가져오고 전달할 수 있도록 개발자 IAM 역할을 구성합니다. 모든 리소스에 대한 모든 cloudformation 작업을 허용하도록 CloudFormationDeployment 역할을 구성합니다.` },
    { k:'D', en:`Update the trust policy of the CloudFormationDeployment role to allow the cloudformation.amazonaws.com AWS principal to perform the sts:AssumeRole action.`, ko:`CloudFormationDeployment 역할의 신뢰 정책을 업데이트하여 cloudformation.amazonaws.com AWS 주체가 sts:AssumeRole 작업을 수행할 수 있도록 허용합니다.` },
    { k:'E', en:`Remove the AdministratorAccess policy. Assign the ReadOnlyAccess managed IAM policy to the developer role. Instruct the developers to assume the CloudFormationDeployment role when the developers deploy new stacks.`, ko:`AdministratorAccess 정책을 제거합니다. ReadOnlyAccess 관리형 IAM 정책을 개발자 역할에 할당합니다. 개발자가 새 스택을 배포할 때 CloudFormationDeployment 역할을 수임하도록 개발자에게 지시합니다.` },
    { k:'F', en:`Add an IAM policy to the CloudFormationDeployment role to allow cloudformation:* on all resources. Add a policy that allows the iam:PassRole action for the ARN of the CloudFormationDeployment role if iam:PassedToService equals cloudformation.amazonaws.com.`, ko:`CloudFormationDeployment 역할에 IAM 정책을 추가하여 모든 리소스에서 cloudformation:*를 허용합니다. iam:PassedToService가 cloudformation.amazonaws.com과 같은 경우 CloudFormationDeployment 역할의 ARN에 대한 iam:PassRole 작업을 허용하는 정책을 추가합니다.` },
  ],
  answer: ['A','D','F'],
  vote: '83% ADF',
  explain: `<p><span class="mark-ok">✅ A</span> — 개발자 역할에서 AdministratorAccess를 제거하고 ReadOnlyAccess로 교체하여 수동 변경을 방지합니다. 개발자는 스택 배포 시 CloudFormationDeployment 역할을 <strong>서비스 역할</strong>로 지정합니다(직접 수임하는 것이 아님).</p>
<p><span class="mark-ok">✅ D</span> — CloudFormationDeployment 역할의 신뢰 정책에 <code>cloudformation.amazonaws.com</code>을 허용하면 CloudFormation 서비스만 해당 역할을 수임할 수 있습니다. 개발자가 직접 수임하는 것을 방지합니다.</p>
<p><span class="mark-ok">✅ F</span> — 개발자 역할에 iam:PassRole 권한을 추가하되, <code>iam:PassedToService=cloudformation.amazonaws.com</code> 조건을 걸어 CloudFormation에만 역할을 전달할 수 있도록 제한합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 개발자 IAM 역할이 CloudFormationDeployment 역할을 직접 수임할 수 있으면, 개발자가 해당 역할로 수동 변경을 할 수 있습니다.</p>
<p><span class="mark-no">❌ C</span> — CloudFormationDeployment 역할에 cloudformation:* 권한을 부여하면 스택 삭제 등 의도치 않은 작업이 가능합니다.</p>
<p><span class="mark-no">❌ E</span> — 개발자가 CloudFormationDeployment 역할을 직접 수임하면 수동 변경을 방지할 수 없습니다.</p>`,
  disc: [{ ans:'ADF (83%)', txt:'개발자를 ReadOnly로 제한하고(A), CloudFormation 서비스만 역할을 수임하도록 신뢰 정책 설정(D), iam:PassRole 조건부 허용(F)의 세 단계 조합입니다.' }]
},
{
  n: 260,
  en: `A company is developing a web application's infrastructure using AWS CloudFormation. The database engineering team maintains the database resources in a CloudFormation template, and the software development team maintains the web application resources in a separate CloudFormation template. As the scope of the application grows, the software development team needs to use resources maintained by the database engineering team. However, both teams have their own review and lifecycle management processes that they want to keep. Both teams also require resource-level change-set reviews. The software development team would like to deploy changes to this template using their CI/CD pipeline.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 AWS CloudFormation을 사용하여 웹 애플리케이션의 인프라를 개발하고 있습니다. 데이터베이스 엔지니어링 팀은 CloudFormation 템플릿에서 데이터베이스 리소스를 유지 관리하고 소프트웨어 개발 팀은 별도의 CloudFormation 템플릿에서 웹 애플리케이션 리소스를 유지 관리합니다. 애플리케이션의 범위가 커짐에 따라 소프트웨어 개발 팀은 데이터베이스 엔지니어링 팀이 유지 관리하는 리소스를 사용해야 합니다. 그러나 두 팀 모두 유지하려는 자체 검토 및 수명 주기 관리 프로세스가 있습니다. 두 팀 모두 리소스 수준 변경 세트 검토도 필요합니다. 소프트웨어 개발 팀은 CI/CD 파이프라인을 사용하여 이 템플릿에 변경 사항을 배포하려고 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a stack export from the database CloudFormation template and import those references into the web application CloudFormation template.`, ko:`데이터베이스 CloudFormation 템플릿에서 스택 내보내기를 만들고 해당 참조를 웹 애플리케이션 CloudFormation 템플릿으로 가져옵니다.` },
    { k:'B', en:`Create a CloudFormation nested stack to make cross-stack resource references and parameters available in both stacks.`, ko:`CloudFormation 중첩 스택을 생성하여 두 스택 모두에서 크로스 스택 리소스 참조 및 매개변수를 사용할 수 있도록 합니다.` },
    { k:'C', en:`Create a CloudFormation stack set to make cross-stack resource references and parameters available in both stacks.`, ko:`두 스택 모두에서 크로스 스택 리소스 참조 및 매개변수를 사용할 수 있도록 CloudFormation 스택 세트를 생성합니다.` },
    { k:'D', en:`Create input parameters in the web application CloudFormation template and pass resource names and IDs from the database stack.`, ko:`웹 애플리케이션 CloudFormation 템플릿에서 입력 매개변수를 만들고 데이터베이스 스택에서 리소스 이름과 ID를 전달합니다.` },
  ],
  answer: ['A'],
  vote: '93% A',
  explain: `<p><span class="mark-ok">✅ A — CloudFormation 스택 내보내기(Export) + Fn::ImportValue</span></p>
<p>데이터베이스 스택에서 <code>Outputs</code> 섹션에 Export를 추가하고, 웹 애플리케이션 스택에서 <code>Fn::ImportValue</code>로 가져옵니다. 두 스택은 완전히 독립적으로 관리되며 각 팀의 수명 주기 및 검토 프로세스가 유지됩니다. 변경 세트 검토도 스택별로 가능하며 CI/CD 파이프라인과 호환됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 중첩 스택은 모든 스택을 하나의 부모 스택으로 통합하므로 각 팀의 독립적인 수명 주기 관리가 어렵습니다.</p>
<p><span class="mark-no">❌ C</span> — 스택 세트는 여러 AWS 계정 및 리전에 동일한 스택을 배포하는 용도이며, 크로스 스택 참조 메커니즘이 아닙니다.</p>
<p><span class="mark-no">❌ D</span> — 입력 매개변수 수동 전달은 데이터베이스 스택 변경 시마다 수동으로 값을 업데이트해야 하며 자동화와 추적성이 부족합니다.</p>`,
  disc: [{ ans:'A (93%)', txt:'스택 Export/Import는 독립적인 스택 수명 주기를 유지하면서 리소스를 참조하는 표준 CloudFormation 크로스 스택 참조 방법입니다.' }]
},
{
  n: 261,
  en: `A company has an organization in AWS Organizations. A DevOps engineer needs to maintain multiple AWS accounts that belong to different OUs in the organization. All resources, including IAM policies and Amazon S3 policies within an account, are deployed through AWS CloudFormation. All templates and code are maintained in an AWS CodeCommit repository. Recently, some developers have not been able to access an S3 bucket from some accounts in the organization.<br><br>The following policy is attached to the S3 bucket:<br><br>[Image showing an S3 bucket policy with organization-level conditions]<br><br>What should the DevOps engineer do to resolve this access issue?`,
  ko: `회사에 AWS Organizations에 조직이 있습니다. DevOps 엔지니어는 조직의 여러 OU에 속하는 여러 AWS 계정을 유지 관리해야 합니다. 계정 내의 IAM 정책 및 Amazon S3 정책을 포함한 모든 리소스는 AWS CloudFormation을 통해 배포됩니다. 모든 템플릿과 코드는 AWS CodeCommit 리포지토리에서 유지 관리됩니다. 최근 일부 개발자는 조직의 일부 계정에서 S3 버킷에 액세스할 수 없었습니다.<br><br>다음 정책이 S3 버킷에 첨부되었습니다:<br><br>[조직 수준 조건이 포함된 S3 버킷 정책 이미지]<br><br>DevOps 엔지니어는 이 액세스 문제를 해결하기 위해 무엇을 해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Modify the S3 bucket policy. Turn off the S3 Block Public Access setting on the S3 bucket. In the S3 policy, add the aws:SourceAccount condition. Add the AWS account IDs of all developers who are experiencing the issue.`, ko:`S3 버킷 정책을 수정합니다. S3 버킷에서 S3 Block Public Access 설정을 끕니다. S3 정책에서 aws:SourceAccount 조건을 추가합니다. 문제를 겪고 있는 모든 개발자의 AWS 계정 ID를 추가합니다.` },
    { k:'B', en:`Verify that no IAM permissions boundaries are denying developers access to the S3 bucket. Make the necessary changes to IAM permissions boundaries. Use an AWS Config recorder in the individual developer accounts that are experiencing the issue to revert any changes that are blocking access. Commit the fix back into the CodeCommit repository. Invoke deployment through CloudFormation to apply the changes.`, ko:`개발자가 S3 버킷에 액세스하는 것을 거부하는 IAM 권한 경계가 없는지 확인합니다. IAM 권한 경계에 필요한 변경을 합니다. 문제가 발생한 개별 개발자 계정에서 AWS Config 레코더를 사용하여 액세스를 차단하는 모든 변경 사항을 되돌립니다. 수정 사항을 CodeCommit 리포지토리에 다시 커밋합니다. CloudFormation을 통해 배포를 호출하여 변경 사항을 적용합니다.` },
    { k:'C', en:`Configure an SCP that stops anyone from modifying IAM resources in developer OUs. In the S3 policy, add the aws:SourceAccount condition. Add the AWS account IDs of all developers who are experiencing the issue. Commit the fix back into the CodeCommit repository. Invoke deployment through CloudFormation to apply the changes.`, ko:`개발자 OU에서 IAM 리소스를 수정하는 것을 막는 SCP를 구성합니다. S3 정책에서 aws:SourceAccount 조건을 추가합니다. 문제가 발생한 모든 개발자의 AWS 계정 ID를 추가합니다. 수정 사항을 CodeCommit 리포지토리에 다시 커밋합니다. CloudFormation을 통해 배포를 호출하여 변경 사항을 적용합니다.` },
    { k:'D', en:`Ensure that no SCP is blocking access for developers to the S3 bucket. Ensure that no IAM policy permissions boundaries are denying access to developer IAM users. Make the necessary changes to the SCP and IAM policy permissions boundaries in the CodeCommit repository. Invoke deployment through CloudFormation to apply the changes.`, ko:`SCP가 개발자의 S3 버킷 액세스를 차단하지 않는지 확인합니다. IAM 정책 권한 경계가 개발자 IAM 사용자의 액세스를 거부하지 않는지 확인합니다. CodeCommit 리포지토리에서 SCP 및 IAM 정책 권한 경계를 필요에 따라 변경합니다. CloudFormation을 통해 배포를 호출하여 변경 사항을 적용합니다.` },
  ],
  answer: ['D'],
  vote: '91% D',
  explain: `<p><span class="mark-ok">✅ D — SCP 및 IAM 권한 경계 점검 후 CodeCommit → CloudFormation 배포</span></p>
<p>다중 계정 환경에서 일부 계정에서만 S3 액세스 문제가 발생할 경우, OU별로 적용된 SCP 또는 IAM 권한 경계가 원인일 수 있습니다. SCP와 권한 경계를 모두 확인하고, 모든 변경을 CodeCommit에 커밋 후 CloudFormation으로 배포하는 것이 "모든 리소스는 CloudFormation으로 관리"라는 회사 정책에 부합합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Block Public Access 해제는 보안 위험이 있으며, S3 정책의 문제가 아닌 SCP/권한 경계 문제입니다.</p>
<p><span class="mark-no">❌ B</span> — Config 레코더로 변경을 되돌리는 방식은 "CloudFormation으로만 변경" 정책에 위배됩니다.</p>
<p><span class="mark-no">❌ C</span> — SCP로 IAM 수정을 막는 것은 문제 해결이 아닌 추가 제한이며, SourceAccount 조건 추가는 근본 원인 해결이 아닙니다.</p>`,
  disc: [{ ans:'D (91%)', txt:'SCP와 IAM 권한 경계를 점검하고 CloudFormation으로 수정을 적용하는 표준 다중 계정 트러블슈팅 접근입니다.' }]
},
{
  n: 262,
  en: `A company has an organization in AWS Organizations for its multi-account environment. A DevOps engineer is developing an AWS CodeArtifact based strategy for application package management across the organization. Each application team at the company has its own account in the organization. Each application team also has limited access to a centralized shared services account.<br><br>Each application team needs full access to download, publish, and grant access to its own packages. Some common library packages that the application teams use must also be shared with the entire organization.<br><br>Which combination of steps will meet these requirements with the LEAST administrative overhead? (Choose three.)`,
  ko: `한 회사가 다중 계정 환경을 위해 AWS Organizations에 조직을 두고 있습니다. DevOps 엔지니어가 조직 전체에서 애플리케이션 패키지 관리를 위한 AWS CodeArtifact 기반 전략을 개발하고 있습니다. 회사의 각 애플리케이션 팀은 조직 내에 자체 계정을 가지고 있습니다. 각 애플리케이션 팀은 또한 중앙 집중화된 공유 서비스 계정에 대한 제한된 액세스 권한을 가지고 있습니다.<br><br>각 애플리케이션 팀은 자체 패키지를 다운로드, 게시 및 액세스 권한을 부여하기 위한 전체 액세스 권한이 필요합니다. 애플리케이션 팀이 사용하는 일부 공통 라이브러리 패키지도 전체 조직과 공유해야 합니다.<br><br>최소한의 관리 오버헤드로 이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Create a domain in each application team's account. Grant each application team's account full read access and write access to the application team's domain.`, ko:`각 애플리케이션 팀의 계정에 도메인을 만듭니다. 각 애플리케이션 팀의 계정에 애플리케이션 팀의 도메인에 대한 전체 읽기 액세스 및 쓰기 액세스 권한을 부여합니다.` },
    { k:'B', en:`Create a domain in the shared services account. Grant the organization read access and CreateRepository access.`, ko:`공유 서비스 계정에서 도메인을 만듭니다. 조직에 읽기 액세스 권한과 CreateRepository 액세스 권한을 부여합니다.` },
    { k:'C', en:`Create a repository in each application team's account. Grant each application team's account full read access and write access to its own repository.`, ko:`각 애플리케이션 팀의 계정에 저장소를 만듭니다. 각 애플리케이션 팀의 계정에 자체 저장소에 대한 전체 읽기 액세스 및 쓰기 액세스 권한을 부여합니다.` },
    { k:'D', en:`Create a repository in the shared services account. Grant the organization read access to the repository in the shared services account. Set the repository as the upstream repository in each application team's repository.`, ko:`공유 서비스 계정에서 리포지토리를 만듭니다. 조직에 공유 서비스 계정의 리포지토리에 대한 읽기 액세스 권한을 부여합니다. 각 애플리케이션 팀의 리포지토리에서 해당 리포지토리를 업스트림 리포지토리로 설정합니다.` },
    { k:'E', en:`For teams that require shared packages, create resource-based policies that allow read access to the repository from other application teams' accounts.`, ko:`공유 패키지가 필요한 팀의 경우 다른 애플리케이션 팀의 계정에서 저장소에 대한 읽기 액세스를 허용하는 리소스 기반 정책을 만듭니다.` },
    { k:'F', en:`Set the other application teams' repositories as upstream repositories.`, ko:`다른 애플리케이션 팀의 저장소를 업스트림 저장소로 설정합니다.` },
  ],
  answer: ['B','C','D'],
  vote: '76% BCD',
  explain: `<p><span class="mark-ok">✅ B — 공유 서비스 계정에 중앙 도메인 생성, 조직에 읽기+CreateRepository 권한 부여</span></p>
<p>공통 패키지 관리를 위한 중앙 집중식 도메인을 공유 서비스 계정에 생성합니다. 조직 전체에 CreateRepository 권한을 부여하면 각 팀이 이 도메인 안에서 자체 저장소를 생성할 수 있습니다.</p>
<p><span class="mark-ok">✅ C — 각 팀 계정에 저장소 생성 + 전체 읽기/쓰기 권한</span></p>
<p>각 팀이 자체 패키지에 대한 완전한 제어권을 갖도록 합니다.</p>
<p><span class="mark-ok">✅ D — 공유 서비스 계정에 공통 라이브러리 저장소 + 업스트림 설정</span></p>
<p>공통 라이브러리를 조직 전체에 공유하고, 각 팀의 저장소에서 업스트림으로 연결합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 각 팀 계정에 개별 도메인을 만드는 것은 관리 오버헤드가 증가합니다. 공유 서비스 계정의 중앙 도메인이 더 효율적입니다.</p>
<p><span class="mark-no">❌ E</span> — 리소스 기반 정책을 팀마다 생성하는 것은 관리 오버헤드가 높습니다.</p>
<p><span class="mark-no">❌ F</span> — 다른 팀의 저장소를 업스트림으로 설정하면 복잡한 종속성이 발생합니다.</p>`,
  disc: [{ ans:'BCD (76%)', txt:'공유 서비스 계정에 중앙 도메인과 공통 라이브러리 저장소를 두고, 각 팀이 자체 저장소를 관리하며 업스트림으로 연결하는 구조입니다.' }]
},
{
  n: 263,
  en: `A company deploys an application to Amazon EC2 instances. The application runs Amazon Linux 2 and uses AWS CodeDeploy. The application has the following file structure for its code repository:<br><br>[Image showing file structure: /config/config.txt and /application/web/ files]<br><br>The appspec.yml file has the following contents in the files section:<br><br>[Image showing two file mappings: (1) source: config/config.txt → destination: /usr/local/src and (2) source: / → destination: /var/www/html]<br><br>What will the result be for the deployment of the config.txt file?`,
  ko: `한 회사가 Amazon EC2 인스턴스에 애플리케이션을 배포합니다. 이 애플리케이션은 Amazon Linux 2를 실행하고 AWS CodeDeploy를 사용합니다. 이 애플리케이션은 코드 저장소에 대해 다음과 같은 파일 구조를 갖습니다:<br><br>[파일 구조 이미지: /config/config.txt 및 /application/web/ 파일들]<br><br>appspec.yml 파일의 파일 섹션에는 다음과 같은 내용이 있습니다:<br><br>[두 개의 파일 매핑 이미지: (1) source: config/config.txt → destination: /usr/local/src, (2) source: / → destination: /var/www/html]<br><br>config.txt 파일을 배포하면 어떤 결과가 나옵니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`The config.txt file will be deployed to only /var/www/html/config/config.txt.`, ko:`config.txt 파일은 /var/www/html/config/config.txt에만 배포됩니다.` },
    { k:'B', en:`The config.txt file will be deployed to /usr/local/src/config.txt and to /var/www/html/config/config.txt.`, ko:`config.txt 파일은 /usr/local/src/config.txt와 /var/www/html/config/config.txt에 배포됩니다.` },
    { k:'C', en:`The config.txt file will be deployed to only /usr/local/src/config.txt.`, ko:`config.txt 파일은 /usr/local/src/config.txt에만 배포됩니다.` },
    { k:'D', en:`The config.txt file will be deployed to /usr/local/src/config.txt and to /var/www/html/application/web/config.txt.`, ko:`config.txt 파일은 /usr/local/src/config.txt와 /var/www/html/application/web/config.txt에 배포됩니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — 두 곳에 배포됨</span></p>
<p>appspec.yml의 files 섹션에 두 개의 매핑이 있습니다.<br>
① <code>source: config/config.txt</code> → <code>destination: /usr/local/src</code>: config.txt가 <strong>/usr/local/src/config.txt</strong>에 복사됩니다.<br>
② <code>source: /</code> → <code>destination: /var/www/html</code>: 저장소 루트 전체가 /var/www/html로 복사되므로, config/config.txt도 <strong>/var/www/html/config/config.txt</strong>에 복사됩니다.<br>
두 규칙이 모두 적용되므로 config.txt는 두 위치에 배포됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 첫 번째 매핑(/usr/local/src)도 적용되므로 하나의 위치만 배포되는 것은 아닙니다.</p>
<p><span class="mark-no">❌ C</span> — 두 번째 매핑(루트 → /var/www/html)도 적용되므로 /var/www/html/config/config.txt에도 배포됩니다.</p>
<p><span class="mark-no">❌ D</span> — 두 번째 매핑은 루트(/)를 /var/www/html로 매핑하므로, config.txt는 /var/www/html/config/config.txt에 위치합니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'CodeDeploy appspec.yml의 여러 파일 매핑은 모두 독립적으로 적용되며, 동일한 파일이 여러 목적지에 배포될 수 있습니다.' }]
},
{
  n: 264,
  en: `A company has set up AWS CodeArtifact repositories with public upstream repositories. The company's development team consumes open source dependencies from the repositories in the company's internal network.<br><br>The company's security team recently discovered a critical vulnerability in the most recent version of a package that the development team consumes. The security team has produced a patched version to fix the vulnerability. The company needs to prevent the vulnerable version from being downloaded. The company also needs to allow the security team to publish the patched version.<br><br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `한 회사가 퍼블릭 업스트림 리포지토리와 함께 AWS CodeArtifact 리포지토리를 설정했습니다. 회사의 개발팀은 회사 내부 네트워크의 리포지토리에서 오픈 소스 종속성을 사용합니다.<br><br>회사의 보안팀은 최근 개발팀이 사용하는 패키지의 최신 버전에서 심각한 취약성을 발견했습니다. 보안팀은 취약성을 수정하기 위해 패치 버전을 만들었습니다. 회사는 취약한 버전이 다운로드되는 것을 방지해야 합니다. 또한 회사는 보안팀이 패치 버전을 게시할 수 있도록 허용해야 합니다.<br><br>이러한 요구 사항을 충족하는 단계의 조합은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Update the status of the affected CodeArtifact package version to unlisted.`, ko:`영향을 받는 CodeArtifact 패키지 버전의 상태를 목록에서 제거됨(unlisted)으로 업데이트합니다.` },
    { k:'B', en:`Update the status of the affected CodeArtifact package version to deleted.`, ko:`영향을 받은 CodeArtifact 패키지 버전의 상태를 삭제됨(deleted)으로 업데이트합니다.` },
    { k:'C', en:`Update the status of the affected CodeArtifact package version to archived.`, ko:`영향을 받은 CodeArtifact 패키지 버전의 상태를 보관됨(archived)으로 업데이트합니다.` },
    { k:'D', en:`Update the CodeArtifact package origin control settings to allow direct publishing and to block upstream operations.`, ko:`CodeArtifact 패키지 원본 제어 설정을 업데이트하여 직접 게시를 허용하고 업스트림 작업을 차단합니다.` },
    { k:'E', en:`Update the CodeArtifact package origin control settings to block direct publishing and to allow upstream operations.`, ko:`CodeArtifact 패키지 원본 제어 설정을 업데이트하여 직접 게시를 차단하고 업스트림 작업을 허용합니다.` },
  ],
  answer: ['C','D'],
  vote: '65% CD',
  explain: `<p><span class="mark-ok">✅ C — 패키지 버전 상태를 archived(보관됨)으로 변경</span></p>
<p>CodeArtifact의 패키지 버전 상태는 Published, Unfinished, Unlisted, Archived 4가지입니다(<strong>Deleted는 유효한 상태가 아님</strong>). Archived 상태로 변경하면 해당 버전의 다운로드가 차단되지만 메타데이터는 유지됩니다.</p>
<p><span class="mark-ok">✅ D — 원본 제어를 "직접 게시 허용 + 업스트림 차단"으로 설정</span></p>
<p>직접 게시를 허용하면 보안팀이 패치 버전을 저장소에 직접 게시할 수 있습니다. 업스트림 작업을 차단하면 취약한 버전이 퍼블릭 업스트림에서 다시 가져와지는 것을 방지합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Unlisted 상태는 목록 검색에서만 제외되며 다운로드는 여전히 가능합니다.</p>
<p><span class="mark-no">❌ B</span> — "Deleted"는 CodeArtifact 패키지 버전의 유효한 상태가 아닙니다. AWS 공식 문서 참조.</p>
<p><span class="mark-no">❌ E</span> — 직접 게시를 차단하면 보안팀이 패치 버전을 게시할 수 없게 됩니다.</p>`,
  disc: [{ ans:'CD (65%)', txt:'CodeArtifact 패키지 버전 상태: Published, Unfinished, Unlisted, Archived(다운로드 차단). "Deleted"는 유효한 상태가 아닙니다. 업스트림 차단으로 취약 버전 재다운로드를 방지합니다.' }]
},
{
  n: 265,
  en: `A company is running a custom-built application that processes records. All the components run on Amazon EC2 instances that run in an Auto Scaling group. Each record's processing is a multistep sequential action that is compute-intensive. Each step is always completed in 5 minutes or less.<br><br>A limitation of the current system is that if any steps fail, the application has to reprocess the record from the beginning. The company wants to update the architecture so that the application must reprocess only the failed steps.<br><br>What is the MOST operationally efficient solution that meets these requirements?`,
  ko: `한 회사에서 레코드를 처리하는 맞춤형 애플리케이션을 실행하고 있습니다. 모든 구성 요소는 Auto Scaling 그룹에서 실행되는 Amazon EC2 인스턴스에서 실행됩니다. 각 레코드의 처리 과정은 컴퓨팅 집약적인 다단계 순차적 작업입니다. 각 단계는 항상 5분 이내에 완료됩니다.<br><br>현재 시스템의 한계는 단계가 실패하면 애플리케이션이 처음부터 레코드를 다시 처리해야 한다는 것입니다. 이 회사는 애플리케이션이 실패한 단계만 다시 처리하도록 아키텍처를 업데이트하려고 합니다.<br><br>이러한 요구 사항을 충족하는 가장 운영 효율적인 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a web application to write records to Amazon S3. Use S3 Event Notifications to publish to an Amazon Simple Notification Service (Amazon SNS) topic. Use an EC2 instance to poll Amazon SNS and start processing. Save intermediate results to Amazon S3 to pass on to the next step.`, ko:`Amazon S3에 레코드를 쓸 웹 애플리케이션을 만듭니다. S3 Event Notifications를 사용하여 Amazon SNS 토픽에 게시합니다. EC2 인스턴스를 사용하여 Amazon SNS를 폴링하고 처리를 시작합니다. 중간 결과를 Amazon S3에 저장하여 다음 단계로 전달합니다.` },
    { k:'B', en:`Perform the processing steps by using logic in the application. Convert the application code to run in a container. Use AWS Fargate to manage the container instances. Configure the container to invoke itself to pass the state from one step to the next.`, ko:`애플리케이션의 로직을 사용하여 처리 단계를 수행합니다. 애플리케이션 코드를 컨테이너에서 실행되도록 변환합니다. AWS Fargate를 사용하여 컨테이너 인스턴스를 관리합니다. 컨테이너가 자체를 호출하여 상태를 한 단계에서 다음 단계로 전달하도록 구성합니다.` },
    { k:'C', en:`Create a web application to pass records to an Amazon Kinesis data stream. Decouple the processing by using the Kinesis data stream and AWS Lambda functions.`, ko:`Amazon Kinesis 데이터 스트림에 레코드를 전달하는 웹 애플리케이션을 만듭니다. Kinesis 데이터 스트림과 AWS Lambda 함수를 사용하여 처리를 분리합니다.` },
    { k:'D', en:`Create a web application to pass records to AWS Step Functions. Decouple the processing into Step Functions tasks and AWS Lambda functions.`, ko:`AWS Step Functions에 레코드를 전달하는 웹 애플리케이션을 만듭니다. 처리를 Step Functions 작업과 AWS Lambda 함수로 분리합니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — AWS Step Functions + Lambda</span></p>
<p>Step Functions는 다단계 워크플로의 상태를 관리하며, 특정 단계 실패 시 해당 단계만 재시도하는 재시도 정책과 오류 처리를 기본으로 지원합니다. 처음부터 재처리하는 현재 한계를 해결하는 가장 운영 효율적인 솔루션입니다. 각 단계는 5분 이내 완료(Lambda 최대 15분 내)이므로 Lambda로 구현 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — S3+SNS+EC2 폴링 방식은 단계별 실패 처리 및 상태 관리가 복잡하고 운영 효율이 낮습니다.</p>
<p><span class="mark-no">❌ B</span> — 컨테이너가 자신을 호출하는 패턴은 복잡하며 실패한 단계만 재시도하는 기능이 없습니다.</p>
<p><span class="mark-no">❌ C</span> — Kinesis+Lambda 조합은 스트리밍 데이터 처리에 적합하지만, 다단계 순차 처리의 개별 단계 재시도를 기본 지원하지 않습니다.</p>`,
  disc: [{ ans:'D (100%)', txt:'Step Functions의 재시도 정책(Retry)과 오류 캐처(Catch)로 실패한 단계만 재처리하는 기능을 간단하게 구현할 수 있습니다.' }]
},
{
  n: 266,
  en: `A company is migrating its on-premises Windows applications and Linux applications to AWS. The company will use automation to launch Amazon EC2 instances to mirror the on-premises configurations. The migrated applications require access to shared storage that uses SMB for Windows and NFS for Linux.<br><br>The company is also creating a pilot light disaster recovery (DR) environment in another AWS Region. The company will use automation to launch and configure the EC2 instances in the DR Region. The company needs to replicate the storage to the DR Region.<br><br>Which storage solution will meet these requirements?`,
  ko: `한 회사가 온프레미스 Windows 애플리케이션과 Linux 애플리케이션을 AWS로 마이그레이션하고 있습니다. 이 회사는 자동화를 사용하여 Amazon EC2 인스턴스를 시작하여 온프레미스 구성을 미러링합니다. 마이그레이션된 애플리케이션은 Windows의 경우 SMB를 사용하고 Linux의 경우 NFS를 사용하는 공유 스토리지에 액세스해야 합니다.<br><br>이 회사는 또한 다른 AWS 리전에서 파일럿 라이트 재해 복구(DR) 환경을 만들고 있습니다. 이 회사는 자동화를 사용하여 DR 리전에서 EC2 인스턴스를 시작하고 구성합니다. 이 회사는 스토리지를 DR 리전에 복제해야 합니다.<br><br>어떤 스토리지 솔루션이 이러한 요구 사항을 충족합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use Amazon S3 for the application storage. Create an S3 bucket in the primary Region and an S3 bucket in the DR Region. Configure S3 Cross-Region Replication (CRR) from the primary Region to the DR Region.`, ko:`애플리케이션 스토리지에 Amazon S3를 사용합니다. 기본 리전에 S3 버킷을 만들고 DR 리전에 S3 버킷을 만듭니다. 기본 리전에서 DR 리전으로 S3 크로스 리전 복제(CRR)를 구성합니다.` },
    { k:'B', en:`Use Amazon Elastic Block Store (Amazon EBS) for the application storage. Create a backup plan in AWS Backup that creates snapshots of the EBS volumes that are in the primary Region and replicates the snapshots to the DR Region.`, ko:`애플리케이션 스토리지에 Amazon Elastic Block Store(Amazon EBS)를 사용합니다. AWS Backup에서 기본 리전에 있는 EBS 볼륨의 스냅샷을 생성하고 스냅샷을 DR 리전에 복제하는 백업 계획을 만듭니다.` },
    { k:'C', en:`Use a Volume Gateway in AWS Storage Gateway for the application storage. Configure Cross-Region Replication (CRR) of the Volume Gateway from the primary Region to the DR Region.`, ko:`애플리케이션 스토리지를 위해 AWS Storage Gateway에서 Volume Gateway를 사용합니다. 기본 리전에서 DR 리전으로 Volume Gateway의 크로스 리전 복제(CRR)를 구성합니다.` },
    { k:'D', en:`Use Amazon FSx for NetApp ONTAP for the application storage. Create an FSx for ONTAP instance in the DR Region. Configure NetApp SnapMirror replication from the primary Region to the DR Region.`, ko:`애플리케이션 스토리지에 Amazon FSx for NetApp ONTAP을 사용합니다. DR 리전에서 FSx for ONTAP 인스턴스를 만듭니다. 기본 리전에서 DR 리전으로 NetApp SnapMirror 복제를 구성합니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — Amazon FSx for NetApp ONTAP + SnapMirror</span></p>
<p>Amazon FSx for NetApp ONTAP은 NFS(Linux용)와 SMB(Windows용)를 모두 지원하는 유일한 AWS 완전 관리형 스토리지 서비스입니다. NetApp SnapMirror 기술을 통해 리전 간 데이터 복제를 지원하여 DR 요구 사항도 충족합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — S3는 객체 스토리지로 SMB/NFS 파일 시스템 프로토콜을 지원하지 않습니다.</p>
<p><span class="mark-no">❌ B</span> — EBS는 단일 EC2 인스턴스에 연결되는 블록 스토리지로, SMB/NFS 공유 스토리지에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — Volume Gateway는 iSCSI 블록 스토리지를 제공하며 SMB/NFS를 직접 지원하지 않습니다. 또한 Volume Gateway의 CRR은 지원되지 않습니다.</p>`,
  disc: [{ ans:'D (100%)', txt:'FSx for NetApp ONTAP은 NFS+SMB 멀티 프로토콜 지원과 SnapMirror 리전 간 복제를 동시에 제공하는 유일한 솔루션입니다.' }]
},
{
  n: 267,
  en: `A company's application uses a fleet of Amazon EC2 On-Demand Instances to analyze and process data. The EC2 instances are in an Auto Scaling group. The Auto Scaling group is a target group for an Application Load Balancer (ALB). The application analyzes critical data that cannot tolerate interruption. The application also analyzes noncritical data that can withstand interruption.<br><br>The critical data analysis requires quick scalability in response to real-time application demand. The noncritical data analysis involves memory consumption. A DevOps engineer must implement a solution that reduces scale-out latency for the critical data. The solution also must process the noncritical data.<br><br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `회사의 애플리케이션은 Amazon EC2 온디맨드 인스턴스의 플릿을 사용하여 데이터를 분석하고 처리합니다. EC2 인스턴스는 Auto Scaling 그룹에 있습니다. Auto Scaling 그룹은 Application Load Balancer(ALB)의 대상 그룹입니다. 애플리케이션은 중단을 허용할 수 없는 중요한 데이터를 분석합니다. 또한 애플리케이션은 중단을 견딜 수 있는 비중요한 데이터를 분석합니다.<br><br>중요한 데이터 분석에는 실시간 애플리케이션 수요에 대응하여 빠른 확장성이 필요합니다. 비중요한 데이터 분석에는 메모리 소비가 포함됩니다. DevOps 엔지니어는 중요한 데이터의 확장 지연 시간을 줄이는 솔루션을 구현해야 합니다. 솔루션은 또한 비중요한 데이터를 처리해야 합니다.<br><br>이러한 요구 사항을 충족하는 단계의 조합은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`For the critical data, modify the existing Auto Scaling group. Create a warm pool instance in the stopped state. Define the warm pool size. Create a new version of the launch template that has detailed monitoring enabled. Use Spot Instances.`, ko:`중요 데이터의 경우 기존 Auto Scaling 그룹을 수정합니다. 중지된 상태에서 웜 풀 인스턴스를 만듭니다. 웜 풀 크기를 정의합니다. 자세한 모니터링이 활성화된 새 버전의 시작 템플릿을 만듭니다. 스팟 인스턴스를 사용합니다.` },
    { k:'B', en:`For the critical data, modify the existing Auto Scaling group. Create a warm pool instance in the stopped state. Define the warm pool size. Create a new version of the launch template that has detailed monitoring enabled. Use On-Demand Instances.`, ko:`중요 데이터의 경우 기존 Auto Scaling 그룹을 수정합니다. 중지된 상태에서 웜 풀 인스턴스를 만듭니다. 웜 풀 크기를 정의합니다. 자세한 모니터링이 활성화된 새 버전의 시작 템플릿을 만듭니다. 온디맨드 인스턴스를 사용합니다.` },
    { k:'C', en:`For the critical data, modify the existing Auto Scaling group. Create a lifecycle hook to ensure that bootstrap scripts are completed successfully. Ensure that the application on the instances is ready to accept traffic before the instances are registered. Create a new version of the launch template that has detailed monitoring enabled.`, ko:`중요 데이터의 경우 기존 Auto Scaling 그룹을 수정합니다. 부트스트랩 스크립트가 성공적으로 완료되도록 라이프사이클 후크를 만듭니다. 인스턴스가 등록되기 전에 인스턴스의 애플리케이션이 트래픽을 허용할 준비가 되었는지 확인합니다. 자세한 모니터링이 활성화된 새 버전의 시작 템플릿을 만듭니다.` },
    { k:'D', en:`For the noncritical data, create a second Auto Scaling group that uses a launch template. Configure the launch template to install the unified Amazon CloudWatch agent and to configure the CloudWatch agent with a custom memory utilization metric. Use Spot Instances. Add the new Auto Scaling group as the target group for the ALB. Modify the application to use two target groups for critical data and noncritical data.`, ko:`비중요 데이터의 경우, 시작 템플릿을 사용하는 두 번째 Auto Scaling 그룹을 만듭니다. 시작 템플릿을 구성하여 통합 Amazon CloudWatch 에이전트를 설치하고 사용자 지정 메모리 사용률 메트릭으로 CloudWatch 에이전트를 구성합니다. 스팟 인스턴스를 사용합니다. 새 Auto Scaling 그룹을 ALB의 대상 그룹으로 추가합니다. 애플리케이션을 수정하여 중요 데이터와 비중요 데이터에 대해 두 개의 대상 그룹을 사용합니다.` },
    { k:'E', en:`For the noncritical data, create a second Auto Scaling group. Choose the predefined memory utilization metric type for the target tracking scaling policy. Use Spot Instances. Add the new Auto Scaling group as the target group for the ALB. Modify the application to use two target groups for critical data and noncritical data.`, ko:`비중요 데이터의 경우 두 번째 Auto Scaling 그룹을 만듭니다. 대상 추적 확장 정책에 대해 미리 정의된 메모리 사용률 메트릭 유형을 선택합니다. 스팟 인스턴스를 사용합니다. ALB의 대상 그룹으로 새 Auto Scaling 그룹을 추가합니다. 중요 데이터와 비중요 데이터에 대해 두 개의 대상 그룹을 사용하도록 애플리케이션을 수정합니다.` },
  ],
  answer: ['B','D'],
  vote: '87% BD',
  explain: `<p><span class="mark-ok">✅ B — 중요 데이터: 웜 풀(온디맨드) + 상세 모니터링</span></p>
<p>웜 풀(Warm Pool)은 미리 초기화된 인스턴스를 대기시켜 확장 지연 시간을 크게 줄입니다. 중단을 허용할 수 없는 중요 데이터에는 스팟이 아닌 온디맨드 인스턴스를 사용합니다.</p>
<p><span class="mark-ok">✅ D — 비중요 데이터: 두 번째 ASG + CloudWatch 에이전트 + 사용자 정의 메모리 메트릭 + 스팟</span></p>
<p>AWS Auto Scaling은 메모리 사용률 사전 정의 메트릭을 제공하지 않으므로, CloudWatch 에이전트로 사용자 정의 메모리 메트릭을 수집해야 합니다. 비중요 데이터에는 비용 효율적인 스팟 인스턴스를 사용합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 중요 데이터에 스팟 인스턴스 사용은 부적절합니다. 스팟은 중단될 수 있어 "중단 불가" 요구 사항에 위배됩니다.</p>
<p><span class="mark-no">❌ C</span> — 라이프사이클 후크는 확장 지연을 줄이지 않으며, 오히려 부트스트랩 완료를 기다리므로 지연이 증가합니다.</p>
<p><span class="mark-no">❌ E</span> — AWS Auto Scaling은 사전 정의된 메모리 사용률 메트릭 유형을 제공하지 않습니다. CloudWatch 에이전트로 커스텀 메트릭을 직접 수집해야 합니다.</p>`,
  disc: [{ ans:'BD (87%)', txt:'웜 풀로 중요 데이터 확장 지연 감소, CloudWatch 커스텀 메모리 메트릭 + 스팟으로 비중요 데이터를 비용 효율적으로 처리합니다.' }]
},
{
  n: 268,
  en: `A company recently migrated its application to an Amazon Elastic Kubernetes Service (Amazon EKS) cluster that uses Amazon EC2 instances. The company configured the application to automatically scale based on CPU utilization.<br><br>The application produces memory errors when it experiences heavy loads. The application also does not scale out enough to handle the increased load. The company needs to collect and analyze memory metrics for the application over time.<br><br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `한 회사가 최근 Amazon EC2 인스턴스를 사용하는 Amazon Elastic Kubernetes Service(Amazon EKS) 클러스터로 애플리케이션을 마이그레이션했습니다. 이 회사는 CPU 사용률에 따라 자동으로 확장되도록 애플리케이션을 구성했습니다.<br><br>이 애플리케이션은 부하가 많을 때 메모리 오류를 생성합니다. 또한 애플리케이션은 증가된 부하를 처리할 만큼 충분히 확장되지 않습니다. 이 회사는 시간이 지남에 따라 애플리케이션의 메모리 메트릭을 수집하고 분석해야 합니다.<br><br>이러한 요구 사항을 충족하는 단계의 조합은 무엇입니까? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Attach the CloudWatchAgentServerPolicy managed IAM policy to the IAM instance profile that the cluster uses.`, ko:`CloudWatchAgentServerPolicy 관리형 IAM 정책을 클러스터가 사용하는 IAM 인스턴스 프로필에 연결합니다.` },
    { k:'B', en:`Attach the CloudWatchAgentServerPolicy managed IAM policy to a service account role for the cluster.`, ko:`CloudWatchAgentServerPolicy 관리형 IAM 정책을 클러스터의 서비스 계정 역할에 연결합니다.` },
    { k:'C', en:`Collect performance metrics by deploying the unified Amazon CloudWatch agent to the existing EC2 instances in the cluster. Add the agent to the AMI for any new EC2 instances that are added to the cluster.`, ko:`클러스터의 기존 EC2 인스턴스에 통합 Amazon CloudWatch 에이전트를 배포하여 성능 지표를 수집합니다. 클러스터에 추가된 모든 새 EC2 인스턴스에 대해 AMI에 에이전트를 추가합니다.` },
    { k:'D', en:`Collect performance logs by deploying the AWS Distro for OpenTelemetry collector as a DaemonSet.`, ko:`AWS Distro for OpenTelemetry 수집기를 DaemonSet으로 배포하여 성능 로그를 수집합니다.` },
    { k:'E', en:`Analyze the pod_memory_utilization Amazon CloudWatch metric in the ContainerInsights namespace by using the Service dimension.`, ko:`Service 차원을 사용하여 ContainerInsights 네임스페이스의 pod_memory_utilization Amazon CloudWatch 메트릭을 분석합니다.` },
    { k:'F', en:`Analyze the node_memory_utilization Amazon CloudWatch metric in the ContainerInsights namespace by using the ClusterName dimension.`, ko:`ClusterName 차원을 사용하여 ContainerInsights 네임스페이스의 node_memory_utilization Amazon CloudWatch 메트릭을 분석합니다.` },
  ],
  answer: ['A','C','E'],
  vote: '85% ACE',
  explain: `<p><span class="mark-ok">✅ A — CloudWatchAgentServerPolicy를 IAM 인스턴스 프로필에 연결</span></p>
<p>CloudWatch 에이전트가 EC2 인스턴스에서 메트릭을 수집하고 CloudWatch로 게시하려면 EC2 인스턴스 프로필에 해당 정책이 있어야 합니다.</p>
<p><span class="mark-ok">✅ C — 통합 CloudWatch 에이전트 배포 + AMI에 포함</span></p>
<p>통합 CloudWatch 에이전트는 CPU 외에 메모리 사용률도 수집합니다. AMI에 포함하면 새로 추가되는 인스턴스에도 자동 배포됩니다.</p>
<p><span class="mark-ok">✅ E — pod_memory_utilization 메트릭 분석 (Service 차원)</span></p>
<p>ContainerInsights의 pod_memory_utilization 메트릭으로 파드 수준 메모리 사용량을 분석하고, Service 차원으로 특정 서비스의 메모리 문제를 진단합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — CloudWatch 에이전트는 EC2 인스턴스 수준에서 동작하므로 서비스 계정 역할이 아닌 인스턴스 프로필에 정책을 연결해야 합니다.</p>
<p><span class="mark-no">❌ D</span> — AWS Distro for OpenTelemetry는 주로 애플리케이션 수준 추적과 사용자 정의 메트릭에 사용됩니다. EC2 노드 수준 메모리 메트릭 수집에는 CloudWatch 에이전트가 더 적합합니다.</p>
<p><span class="mark-no">❌ F</span> — node_memory_utilization은 노드 전체 메모리를 보여주며, 파드 수준 메모리 문제를 진단하는 세부 정보를 제공하지 않습니다.</p>`,
  disc: [{ ans:'ACE (85%)', txt:'CloudWatch 에이전트(인스턴스 프로필 권한)로 메모리 메트릭 수집, ContainerInsights의 pod_memory_utilization으로 파드 수준 분석하는 조합입니다.' }]
},
{
  n: 269,
  en: `A company's video streaming platform usage has increased from 10,000 users each day to 50,000 users each day in multiple countries. The company deploys the streaming platform on Amazon Elastic Kubernetes Service (Amazon EKS). The EKS workload scales up to thousands of nodes during peak viewing time.<br><br>The company's users report occurrences of unauthorized logins. Users also report sudden interruptions and logouts from the platform.<br><br>The company wants additional security measures for the entire platform. The company also needs a summarized view of the resource behaviors and interactions across the company's entire AWS environment. The summarized view must show login attempts, API calls, and network traffic. The solution must permit network traffic analysis while minimizing the overhead of managing logs. The solution must also quickly investigate any potential malicious behavior that is associated with the EKS workload.<br><br>Which solution will meet these requirements?`,
  ko: `회사의 비디오 스트리밍 플랫폼 사용량이 여러 국가에서 매일 10,000명에서 매일 50,000명으로 증가했습니다. 이 회사는 Amazon Elastic Kubernetes Service(Amazon EKS)에 스트리밍 플랫폼을 배포합니다. EKS 워크로드는 최대 시청 시간 동안 수천 개의 노드로 확장됩니다.<br><br>이 회사의 사용자는 무단 로그인 발생을 보고합니다. 사용자는 또한 플랫폼에서 갑작스러운 중단 및 로그아웃을 보고합니다.<br><br>이 회사는 전체 플랫폼에 대한 추가 보안 조치를 원합니다. 이 회사는 또한 회사의 전체 AWS 환경에서 리소스 동작 및 상호 작용에 대한 요약된 보기가 필요합니다. 요약된 보기에는 로그인 시도, API 호출 및 네트워크 트래픽이 표시되어야 합니다. 솔루션은 로그 관리 오버헤드를 최소화하면서 네트워크 트래픽 분석을 허용해야 합니다. 솔루션은 또한 EKS 워크로드와 관련된 잠재적인 악의적 동작을 신속하게 조사해야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Enable Amazon GuardDuty for EKS Audit Log Monitoring. Enable AWS CloudTrail logs. Store the EKS audit logs and CloudTrail log files in an Amazon S3 bucket. Use Amazon Athena to create an external table. Use Amazon QuickSight to create a dashboard.`, ko:`EKS 감사 로그 모니터링을 위해 Amazon GuardDuty를 활성화합니다. AWS CloudTrail 로그를 활성화합니다. EKS 감사 로그와 CloudTrail 로그 파일을 Amazon S3 버킷에 저장합니다. Amazon Athena를 사용하여 외부 테이블을 만듭니다. Amazon QuickSight를 사용하여 대시보드를 만듭니다.` },
    { k:'B', en:`Enable Amazon GuardDuty for EKS Audit Log Monitoring. Enable Amazon Detective in the company's AWS account. Enable EKS audit logs from optional source packages in Detective.`, ko:`EKS 감사 로그 모니터링을 위해 Amazon GuardDuty를 활성화합니다. 회사의 AWS 계정에서 Amazon Detective를 활성화합니다. Detective에서 선택적 소스 패키지의 EKS 감사 로그를 활성화합니다.` },
    { k:'C', en:`Enable Amazon CloudWatch Container Insights. Enable AWS CloudTrail logs. Store the EKS audit logs and CloudTrail log files in an Amazon S3 bucket. Use Amazon Athena to create an external table. Use Amazon QuickSight to create a dashboard.`, ko:`Amazon CloudWatch Container Insights를 활성화합니다. AWS CloudTrail 로그를 활성화합니다. EKS 감사 로그와 CloudTrail 로그 파일을 Amazon S3 버킷에 저장합니다. Amazon Athena를 사용하여 외부 테이블을 만듭니다. Amazon QuickSight를 사용하여 대시보드를 만듭니다.` },
    { k:'D', en:`Enable Amazon GuardDuty for EKS Audit Log Monitoring. Enable Amazon CloudWatch Container Insights and VPC Flow Logs. Enable AWS CloudTrail logs.`, ko:`EKS 감사 로그 모니터링을 위해 Amazon GuardDuty를 활성화합니다. Amazon CloudWatch Container Insights 및 VPC Flow Logs를 활성화합니다. AWS CloudTrail 로그를 활성화합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — GuardDuty(EKS 감사 로그) + Amazon Detective</span></p>
<p>Amazon Detective는 GuardDuty 결과를 기반으로 로그인 시도, API 호출, 네트워크 트래픽의 요약된 보기를 자동으로 생성합니다. Detective의 선택적 소스 패키지로 EKS 감사 로그를 활성화하면 EKS 워크로드의 악의적 동작을 빠르게 조사할 수 있습니다. 로그를 별도로 관리하거나 Athena/QuickSight를 구성할 필요가 없어 관리 오버헤드가 최소화됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — S3+Athena+QuickSight 파이프라인은 로그 관리 오버헤드가 높고 실시간 조사에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — Container Insights는 성능 모니터링용이며, 보안 이벤트 조사나 요약된 보안 보기를 제공하지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — GuardDuty와 여러 로그를 활성화하지만, 요약된 보기와 악의적 동작 빠른 조사를 위한 Detective가 없습니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'Detective는 GuardDuty 결과를 기반으로 리소스 동작의 요약 보기를 자동 생성하며, EKS 감사 로그 소스 패키지로 K8s 보안 조사를 지원합니다.' }]
},
{
  n: 270,
  en: `A company uses AWS Organizations to manage hundreds of AWS accounts. The company has a team that is responsible for AWS Identity and Access Management (IAM).<br><br>The IAM team wants to implement AWS IAM Identity Center (AWS Single Sign-On). The IAM team must have only the minimum needed permissions to manage IAM Identity Center. The IAM team must not be able to gain unneeded access to the Organizations management account. The IAM team must be able to provision new IAM Identity Center permission sets and assignments for existing and new member accounts.<br><br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `한 회사가 AWS Organizations를 사용하여 수백 개의 AWS 계정을 관리합니다. 이 회사에는 AWS Identity and Access Management(IAM)를 담당하는 팀이 있습니다.<br><br>IAM 팀은 AWS IAM Identity Center(AWS Single Sign-On)를 구현하려고 합니다. IAM 팀은 IAM Identity Center를 관리하는 데 필요한 최소한의 권한만 있어야 합니다. IAM 팀은 Organizations 관리 계정에 대한 불필요한 액세스 권한을 얻을 수 없어야 합니다. IAM 팀은 기존 및 새 멤버 계정에 대한 새 IAM Identity Center 권한 집합과 할당을 프로비저닝할 수 있어야 합니다.<br><br>이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Create a new AWS account for the IAM team. In the new account, enable IAM Identity Center. In the Organizations management account, register the new account as a delegated administrator for IAM Identity Center.`, ko:`IAM 팀을 위한 새 AWS 계정을 만듭니다. 새 계정에서 IAM Identity Center를 활성화합니다. Organizations 관리 계정에서 새 계정을 IAM Identity Center의 위임된 관리자로 등록합니다.` },
    { k:'B', en:`Create a new AWS account for the IAM team. In the Organizations management account, enable IAM Identity Center. In the Organizations management account, register the new account as a delegated administrator for IAM Identity Center.`, ko:`IAM 팀을 위한 새 AWS 계정을 만듭니다. Organizations 관리 계정에서 IAM Identity Center를 활성화합니다. Organizations 관리 계정에서 새 계정을 IAM Identity Center의 위임된 관리자로 등록합니다.` },
    { k:'C', en:`In IAM Identity Center, create users and a group for the IAM team. Add the users to the group. Create a new permission set. Attach the AWSSSODirectoryAdministrator managed IAM policy to the group.`, ko:`IAM Identity Center에서 IAM 팀의 사용자와 그룹을 만듭니다. 사용자를 그룹에 추가합니다. 새 권한 집합을 만듭니다. AWSSSODirectoryAdministrator 관리형 IAM 정책을 그룹에 연결합니다.` },
    { k:'D', en:`In IAM Identity Center, create users and a group for the IAM team. Add the users to the group. Create a new permission set. Attach the AWSSSOMemberAccountAdministrator managed IAM policy to the group.`, ko:`IAM Identity Center에서 IAM 팀의 사용자와 그룹을 만듭니다. 사용자를 그룹에 추가합니다. 새 권한 집합을 만듭니다. AWSSSOMemberAccountAdministrator 관리형 IAM 정책을 그룹에 연결합니다.` },
    { k:'E', en:`Assign the permission set to the Organizations management account. Allow the IAM team group to use the permission set.`, ko:`조직 관리 계정에 권한 집합을 할당합니다. IAM 팀 그룹이 권한 집합을 사용하도록 허용합니다.` },
    { k:'F', en:`Assign the permission set to the new AWS account. Allow the IAM team group to use the permission set.`, ko:`새로운 AWS 계정에 권한 집합을 할당합니다. IAM 팀 그룹이 권한 집합을 사용하도록 허용합니다.` },
  ],
  answer: ['B','D','F'],
  vote: '42% BDF',
  explain: `<p><span class="mark-ok">✅ B — 관리 계정에서 IAM Identity Center 활성화 후 위임</span></p>
<p>IAM Identity Center는 반드시 Organizations 관리 계정에서 먼저 활성화해야 합니다. 이후 IAM 팀의 새 계정을 위임된 관리자로 등록하면 IAM 팀이 관리 계정에 직접 액세스하지 않아도 됩니다.</p>
<p><span class="mark-ok">✅ D — AWSSSOMemberAccountAdministrator 정책 사용</span></p>
<p>이 정책은 멤버 계정의 권한 집합과 할당을 관리하는 데 필요한 권한을 제공합니다. AWSSSODirectoryAdministrator는 사용자/그룹 디렉토리 관리 권한으로, 권한 집합 관리 권한이 없습니다.</p>
<p><span class="mark-ok">✅ F — 새 계정에 권한 집합 할당</span></p>
<p>IAM 팀이 관리 계정이 아닌 위임된 계정 내에서 작업하도록 새 계정에 권한 집합을 할당합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — IAM Identity Center는 새 계정이 아닌 Organizations 관리 계정에서 먼저 활성화해야 합니다.</p>
<p><span class="mark-no">❌ C</span> — AWSSSODirectoryAdministrator는 사용자/그룹 디렉토리 관리 권한이며 권한 집합(Permission Set) 관리 권한을 포함하지 않습니다.</p>
<p><span class="mark-no">❌ E</span> — 관리 계정에 권한 집합을 할당하면 IAM 팀이 관리 계정에 불필요하게 액세스할 수 있어 요구 사항에 위배됩니다.</p>`,
  disc: [{ ans:'BDF (42%) vs ADF (40%)', txt:'핵심 논쟁: IAM Identity Center 활성화 위치(A: 새 계정 vs B: 관리 계정). AWS 공식 문서에 따르면 IAM Identity Center는 Organizations 관리 계정에서 활성화해야 하므로 B가 정확합니다. AWSSSOMemberAccountAdministrator가 권한 집합 관리 권한을 포함하므로 D가 정확합니다.' }]
},
{
  n: 271,
  en: `A company uses an organization in AWS Organizations that has all features enabled. The company uses AWS Backup in a primary account and uses an AWS Key Management Service (AWS KMS) key to encrypt the backups.<br><br>The company needs to automate a cross-account backup of the resources that AWS Backup backs up in the primary account. The company configures cross-account backup in the Organizations management account. The company creates a new AWS account in the organization and configures an AWS Backup backup vault in the new account. The company creates a KMS key in the new account to encrypt the backups. Finally, the company configures a new backup plan in the primary account. The destination for the new backup plan is the backup vault in the new account.<br><br>When the AWS Backup job in the primary account is invoked, the job creates backups in the primary account. However, the backups are not copied to the new account's backup vault.<br><br>Which combination of steps must the company take so that backups can be copied to the new account's backup vault? (Choose two.)`,
  ko: `한 회사에서 모든 기능이 활성화된 AWS Organizations의 조직을 사용합니다. 이 회사는 기본 계정에서 AWS Backup을 사용하고 AWS Key Management Service(AWS KMS) 키를 사용하여 백업을 암호화합니다.<br><br>이 회사는 AWS Backup이 기본 계정에서 백업하는 리소스의 교차 계정 백업을 자동화해야 합니다. 이 회사는 Organizations 관리 계정에서 교차 계정 백업을 구성합니다. 이 회사는 조직에서 새 AWS 계정을 만들고 새 계정에 AWS Backup 백업 볼트를 구성합니다. 이 회사는 새 계정에 KMS 키를 만들어 백업을 암호화합니다. 마지막으로 이 회사는 기본 계정에서 새 백업 계획을 구성합니다. 새 백업 계획의 대상은 새 계정의 백업 볼트입니다.<br><br>기본 계정에서 AWS Backup 작업이 호출되면 해당 작업이 기본 계정에 백업을 만듭니다. 그러나 백업은 새 계정의 백업 볼트에 복사되지 않습니다.<br><br>백업을 새 계정의 백업 볼트에 복사할 수 있도록 이 회사는 어떤 단계 조합을 수행해야 합니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Edit the backup vault access policy in the new account to allow access to the primary account.`, ko:`새 계정의 백업 볼트 액세스 정책을 편집하여 기본 계정에 대한 액세스를 허용합니다.` },
    { k:'B', en:`Edit the backup vault access policy in the primary account to allow access to the new account.`, ko:`기본 계정의 백업 볼트 액세스 정책을 편집하여 새 계정에 대한 액세스를 허용합니다.` },
    { k:'C', en:`Edit the backup vault access policy in the primary account to allow access to the KMS key in the new account.`, ko:`기본 계정의 백업 볼트 액세스 정책을 편집하여 새 계정에서 KMS 키에 대한 액세스를 허용합니다.` },
    { k:'D', en:`Edit the key policy of the KMS key in the primary account to share the key with the new account.`, ko:`기본 계정의 KMS 키에 대한 키 정책을 편집하여 새 계정과 키를 공유합니다.` },
    { k:'E', en:`Edit the key policy of the KMS key in the new account to share the key with the primary account.`, ko:`새 계정의 KMS 키에 대한 키 정책을 편집하여 기본 계정과 키를 공유합니다.` },
  ],
  answer: ['A','D'],
  vote: '72% AD',
  explain: `<p><span class="mark-ok">✅ A — 새 계정(대상)의 백업 볼트 액세스 정책에 기본 계정 허용</span></p>
<p>AWS Backup 교차 계정 복사 시, 대상 계정의 백업 볼트는 소스 계정이 복사 작업을 수행할 수 있도록 리소스 기반 액세스 정책을 설정해야 합니다.</p>
