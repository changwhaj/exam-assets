<p><span class="mark-ok">✅ D — 기본 계정(소스)의 KMS 키 정책에 대상 계정 허용</span></p>
<p>AWS 공식 문서에 따르면, 소스 계정의 리소스가 고객 관리형 KMS 키로 암호화된 경우, 소스 계정의 KMS 키 정책에서 대상 계정을 허용해야 교차 계정 복사 중 복호화/재암호화가 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 기본 계정의 볼트 정책을 수정하는 것은 대상 볼트 접근과 무관합니다.</p>
<p><span class="mark-no">❌ C</span> — 볼트 액세스 정책에서 KMS 키 접근을 허용하는 것은 올바른 메커니즘이 아닙니다.</p>
<p><span class="mark-no">❌ E</span> — 새 계정의 KMS 키는 새 계정의 백업 암호화에 사용되지만, 교차 계정 복사 시 필요한 것은 소스(기본) 계정의 KMS 키 공유입니다.</p>`,
  disc: [{ ans:'AD (72%) vs AE (28%)', txt:'AWS 공식 문서: 소스 계정에서 고객 관리형 키로 암호화된 경우, 소스 KMS 키 정책이 대상 계정을 허용해야 합니다. D가 정확합니다.' }]
},
{
  n: 272,
  en: `A company runs an application that uses an Amazon S3 bucket to store images. A DevOps engineer needs to implement a multi-Region strategy for the objects that are stored in the S3 bucket. The company needs to be able to fail over to an S3 bucket in another AWS Region. When an image is added to either S3 bucket, the image must be replicated to the other S3 bucket within 15 minutes.<br><br>The DevOps engineer enables two-way replication between the S3 buckets.<br><br>Which combination of steps should the DevOps engineer take next to meet the requirements? (Choose three.)`,
  ko: `한 회사가 Amazon S3 버킷을 사용하여 이미지를 저장하는 애플리케이션을 실행합니다. DevOps 엔지니어는 S3 버킷에 저장된 객체에 대한 다중 리전 전략을 구현해야 합니다. 회사는 다른 AWS 리전의 S3 버킷으로 장애 조치할 수 있어야 합니다. 이미지가 두 S3 버킷 중 하나에 추가되면 15분 이내에 다른 S3 버킷으로 이미지를 복제해야 합니다.<br><br>DevOps 엔지니어는 S3 버킷 간에 양방향 복제를 활성화합니다.<br><br>DevOps 엔지니어는 요구 사항을 충족하기 위해 다음에 어떤 단계 조합을 수행해야 합니까? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Enable S3 Replication Time Control (S3 RTC) on each replication rule.`, ko:`각 복제 규칙에서 S3 복제 시간 제어(S3 RTC)를 활성화합니다.` },
    { k:'B', en:`Create an S3 Multi-Region Access Point in an active-passive configuration.`, ko:`액티브-패시브 구성으로 S3 다중 리전 액세스 포인트를 생성합니다.` },
    { k:'C', en:`Call the SubmitMultiRegionAccessPointRoutes operation in the AWS API when the company needs to fail over to the S3 bucket in the other Region.`, ko:`회사에서 다른 리전의 S3 버킷으로 장애 조치(failover)해야 하는 경우 AWS API에서 SubmitMultiRegionAccessPointRoutes 작업을 호출합니다.` },
    { k:'D', en:`Enable S3 Transfer Acceleration on both S3 buckets.`, ko:`두 S3 버킷 모두에서 S3 전송 가속을 활성화합니다.` },
    { k:'E', en:`Configure a routing control in Amazon Route 53 Recovery Controller. Add the S3 buckets in an active-passive configuration.`, ko:`Amazon Route 53 Recovery Controller에서 라우팅 제어를 구성합니다. 액티브-패시브 구성으로 S3 버킷을 추가합니다.` },
    { k:'F', en:`Call the UpdateRoutingControlStates operation in the AWS API when the company needs to fail over to the S3 bucket in the other Region.`, ko:`회사에서 다른 리전의 S3 버킷으로 장애 조치(failover)해야 하는 경우 AWS API에서 UpdateRoutingControlStates 작업을 호출합니다.` },
  ],
  answer: ['A','B','C'],
  vote: '100% ABC',
  explain: `<p><span class="mark-ok">✅ A — S3 RTC (복제 시간 제어)</span></p>
<p>S3 RTC를 활성화하면 99.99%의 객체가 15분 이내에 복제됩니다. 15분 복제 요구 사항을 충족하는 유일한 옵션입니다.</p>
<p><span class="mark-ok">✅ B — S3 다중 리전 액세스 포인트(액티브-패시브)</span></p>
<p>S3 Multi-Region Access Point를 사용하면 단일 엔드포인트로 여러 리전의 S3 버킷에 접근할 수 있으며, 액티브-패시브 구성으로 장애 조치를 지원합니다.</p>
<p><span class="mark-ok">✅ C — SubmitMultiRegionAccessPointRoutes API 호출</span></p>
<p>S3 Multi-Region Access Point의 라우팅을 변경하여 트래픽을 다른 리전 버킷으로 전환합니다. 이것이 S3 MRAP의 장애 조치 메커니즘입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ D</span> — Transfer Acceleration은 업로드 속도를 향상시키지만 복제 시간을 보장하지 않습니다.</p>
<p><span class="mark-no">❌ E, F</span> — UpdateRoutingControlStates는 Route 53 Recovery Controller용 API로 S3 버킷 장애 조치에 사용하지 않습니다. S3 MRAP은 자체 라우팅 API(SubmitMultiRegionAccessPointRoutes)를 사용합니다.</p>`,
  disc: [{ ans:'ABC (100%)', txt:'S3 RTC(15분 복제 보장) + S3 MRAP 액티브-패시브 구성 + SubmitMultiRegionAccessPointRoutes API 장애 조치의 3단계 조합입니다.' }]
},
{
  n: 273,
  en: `A company uses the AWS Cloud Development Kit (AWS CDK) to define its application. The company uses a pipeline that consists of AWS CodePipeline and AWS CodeBuild to deploy the CDK application.<br><br>The company wants to introduce unit tests to the pipeline to test various infrastructure components. The company wants to ensure that a deployment proceeds if no unit tests result in a failure.<br><br>Which combination of steps will enforce the testing requirement in the pipeline? (Choose two.)`,
  ko: `한 회사에서 AWS Cloud Development Kit(AWS CDK)를 사용하여 애플리케이션을 정의합니다. 이 회사는 AWS CodePipeline과 AWS CodeBuild로 구성된 파이프라인을 사용하여 CDK 애플리케이션을 배포합니다.<br><br>이 회사는 다양한 인프라 구성 요소를 테스트하기 위해 파이프라인에 단위 테스트를 도입하려고 합니다. 이 회사는 단위 테스트에서 실패가 발생하지 않으면 배포가 진행되도록 하려고 합니다.<br><br>파이프라인에서 테스트 요구 사항을 강제할 단계 조합은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Update the CodeBuild build phase commands to run the tests then to deploy the application. Set the OnFailure phase property to ABORT.`, ko:`CodeBuild 빌드 단계 명령을 업데이트하여 테스트를 실행한 다음 애플리케이션을 배포합니다. OnFailure 단계 속성을 ABORT로 설정합니다.` },
    { k:'B', en:`Update the CodeBuild build phase commands to run the tests then to deploy the application. Add the --rollback true flag to the cdk deploy command.`, ko:`CodeBuild 빌드 단계 명령을 업데이트하여 테스트를 실행한 다음 애플리케이션을 배포합니다. cdk deploy 명령에 --rollback true 플래그를 추가합니다.` },
    { k:'C', en:`Update the CodeBuild build phase commands to run the tests then to deploy the application. Add the --require-approval any-change flag to the cdk deploy command.`, ko:`CodeBuild 빌드 단계 명령을 업데이트하여 테스트를 실행한 다음 애플리케이션을 배포합니다. cdk deploy 명령에 --require-approval any-change 플래그를 추가합니다.` },
    { k:'D', en:`Create a test that uses the AWS CDK assertions module. Use the template.hasResourceProperties assertion to test that resources have the expected properties.`, ko:`AWS CDK 어설션 모듈을 사용하는 테스트를 만듭니다. template.hasResourceProperties 어설션을 사용하여 리소스에 예상 속성이 있는지 테스트합니다.` },
    { k:'E', en:`Create a test that uses the cdk diff command. Configure the test to fail if any resources have changed.`, ko:`cdk diff 명령을 사용하는 테스트를 만듭니다. 리소스가 변경되면 테스트가 실패하도록 구성합니다.` },
  ],
  answer: ['A','D'],
  vote: '100% AD',
  explain: `<p><span class="mark-ok">✅ A — CodeBuild 빌드 단계에서 테스트 실행 + OnFailure: ABORT</span></p>
<p>CodeBuild buildspec.yml의 phases에 테스트 명령을 추가하고 <code>on-failure: ABORT</code>를 설정하면 테스트 실패 시 빌드가 즉시 중단되어 배포가 진행되지 않습니다.</p>
<p><span class="mark-ok">✅ D — AWS CDK 어설션 모듈 + template.hasResourceProperties</span></p>
<p>CDK 어설션 모듈은 CloudFormation 템플릿이 예상한 리소스와 속성을 가지고 있는지 검증하는 단위 테스트를 작성할 수 있게 합니다. 인프라 코드의 논리적 정확성을 배포 전에 확인합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — <code>--rollback true</code>는 배포 실패 시 롤백을 활성화하지만, 테스트 실패를 기반으로 배포를 막는 기능이 아닙니다.</p>
<p><span class="mark-no">❌ C</span> — <code>--require-approval any-change</code>는 변경 사항에 대한 수동 승인을 요청하는 플래그로, 자동화된 테스트 강제와 무관합니다.</p>
<p><span class="mark-no">❌ E</span> — <code>cdk diff</code>는 변경 사항을 확인하는 명령이지, 리소스 속성의 정확성을 검증하는 단위 테스트가 아닙니다.</p>`,
  disc: [{ ans:'AD (100%)', txt:'CodeBuild OnFailure ABORT로 테스트 실패 시 파이프라인 중단, CDK 어설션으로 인프라 속성 검증하는 조합입니다.' }]
},
{
  n: 274,
  en: `A company has an application that runs on Amazon EC2 instances behind an Application Load Balancer (ALB). The EC2 instances are in multiple Availability Zones. The application was misconfigured in a single Availability Zone, which caused a partial outage of the application.<br><br>A DevOps engineer made changes to ensure that the unhealthy EC2 instances in one Availability Zone do not affect the healthy EC2 instances in the other Availability Zones. The DevOps engineer needs to test the application's failover and shift where the ALB sends traffic. During failover, the ALB must avoid sending traffic to the Availability Zone where the failure has occurred.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사에는 애플리케이션 로드 밸런서(ALB) 뒤의 Amazon EC2 인스턴스에서 실행되는 애플리케이션이 있습니다. EC2 인스턴스는 여러 가용 영역에 있습니다. 애플리케이션이 단일 가용 영역에서 잘못 구성되어 애플리케이션이 부분적으로 중단되었습니다.<br><br>DevOps 엔지니어는 한 가용 영역의 비정상 EC2 인스턴스가 다른 가용 영역의 정상 EC2 인스턴스에 영향을 미치지 않도록 변경했습니다. DevOps 엔지니어는 애플리케이션의 장애 조치를 테스트하고 ALB가 트래픽을 보내는 위치를 변경해야 합니다. 장애 조치 중에 ALB는 장애가 발생한 가용 영역으로 트래픽을 보내지 않아야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Turn off cross-zone load balancing on the ALB. Use Amazon Route 53 Application Recovery Controller to start a zonal shift away from the Availability Zone.`, ko:`ALB에서 크로스 존 로드 밸런싱을 끕니다. Amazon Route 53 Application Recovery Controller를 사용하여 가용성 영역에서 벗어나 존 이동을 시작합니다.` },
    { k:'B', en:`Turn off cross-zone load balancing on the ALB's target group. Use Amazon Route 53 Application Recovery Controller to start a zonal shift away from the Availability Zone.`, ko:`ALB의 대상 그룹에서 크로스 존 로드 밸런싱을 끕니다. Amazon Route 53 Application Recovery Controller를 사용하여 가용성 영역에서 벗어나 존 이동을 시작합니다.` },
    { k:'C', en:`Create an Amazon Route 53 Application Recovery Controller resource set that uses the DNS hostname of the ALB. Start a zonal shift for the resource set away from the Availability Zone.`, ko:`ALB의 DNS 호스트 이름을 사용하는 Amazon Route 53 Application Recovery Controller 리소스 세트를 만듭니다. 가용성 영역에서 리소스 세트에 대한 영역 이동을 시작합니다.` },
    { k:'D', en:`Create an Amazon Route 53 Application Recovery Controller resource set that uses the ARN of the ALB's target group. Create a readiness check that uses the ElbV2TargetGroupsCanServeTraffic rule.`, ko:`ALB 대상 그룹의 ARN을 사용하는 Amazon Route 53 Application Recovery Controller 리소스 세트를 만듭니다. ElbV2TargetGroupsCanServeTraffic 규칙을 사용하는 준비 상태 확인을 만듭니다.` },
  ],
  answer: ['B'],
  vote: '41% B',
  explain: `<p><span class="mark-ok">✅ B — ALB 대상 그룹에서 크로스 존 로드 밸런싱 비활성화 + 영역 이동(Zonal Shift)</span></p>
<p>ALB는 로드 밸런서 수준에서 크로스 존 로드 밸런싱을 직접 끌 수 없지만, 대상 그룹 수준에서 명시적으로 비활성화할 수 있습니다. Route 53 ARC의 영역 이동(Zonal Shift) 기능을 사용하면 장애가 발생한 AZ로의 트래픽을 신속하게 전환할 수 있습니다. Route 53 ARC의 영역 이동은 크로스 존 로드 밸런싱이 비활성화된 ALB를 지원합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — ALB 수준에서 크로스 존 로드 밸런싱을 직접 끌 수 없습니다. 대상 그룹 수준에서만 비활성화 가능합니다.</p>
<p><span class="mark-no">❌ C</span> — DNS 호스트 이름 기반 리소스 세트는 영역 이동에 사용되지 않습니다. 영역 이동은 ALB 리소스에 직접 적용됩니다.</p>
<p><span class="mark-no">❌ D</span> — 준비 상태 확인(Readiness Check)은 장애 조치 준비 여부를 평가하지만, 트래픽을 직접 전환하지는 않습니다.</p>`,
  disc: [{ ans:'B (41%) vs A (48%)', txt:'논쟁점: ALB 크로스 존 로드 밸런싱 비활성화 위치. AWS 공식 문서에 따르면 ALB 수준에서는 끌 수 없고 대상 그룹 수준에서만 가능하므로 B가 정확합니다.' }]
},
{
  n: 275,
  en: `A company sends its AWS Network Firewall flow logs to an Amazon S3 bucket. The company then analyzes the flow logs by using Amazon Athena.<br><br>The company needs to transform the flow logs and add additional data before the flow logs are delivered to the existing S3 bucket.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 AWS 네트워크 방화벽 플로우 로그를 Amazon S3 버킷으로 보냅니다. 그런 다음 회사는 Amazon Athena를 사용하여 플로우 로그를 분석합니다.<br><br>회사는 플로우 로그를 변환하고 추가 데이터를 추가한 후에 플로우 로그를 기존 S3 버킷에 전달해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an AWS Lambda function to transform the data and to write a new object to the existing S3 bucket. Configure the Lambda function with an S3 trigger for the existing S3 bucket. Specify all object create events for the event type. Acknowledge the recursive invocation.`, ko:`AWS Lambda 함수를 만들어 데이터를 변환하고 기존 S3 버킷에 새 객체를 씁니다. 기존 S3 버킷에 대한 S3 트리거로 Lambda 함수를 구성합니다. 이벤트 유형에 대한 모든 객체 생성 이벤트를 지정합니다. 재귀적 호출을 확인합니다.` },
    { k:'B', en:`Enable Amazon EventBridge notifications on the existing S3 bucket. Create a custom EventBridge event bus. Create an EventBridge rule that is associated with the custom event bus. Configure the rule to react to all object create events for the existing S3 bucket and to invoke an AWS Step Functions workflow. Configure a Step Functions task to transform the data and to write the data into a new S3 bucket.`, ko:`기존 S3 버킷에서 Amazon EventBridge 알림을 활성화합니다. 사용자 지정 EventBridge 이벤트 버스를 만듭니다. 사용자 지정 이벤트 버스와 연결된 EventBridge 규칙을 만듭니다. 기존 S3 버킷의 모든 객체 생성 이벤트에 반응하고 AWS Step Functions 워크플로를 호출하도록 규칙을 구성합니다. 데이터를 변환하고 새 S3 버킷에 데이터를 쓰도록 Step Functions 작업을 구성합니다.` },
    { k:'C', en:`Create an Amazon EventBridge rule that is associated with the default EventBridge event bus. Configure the rule to react to all object create events for the existing S3 bucket. Define a new S3 bucket as the target for the rule. Create an EventBridge input transformation to customize the event before passing the event to the rule target.`, ko:`기본 EventBridge 이벤트 버스와 연결된 Amazon EventBridge 규칙을 만듭니다. 기존 S3 버킷에 대한 모든 객체 생성 이벤트에 반응하도록 규칙을 구성합니다. 규칙의 대상으로 새 S3 버킷을 정의합니다. 이벤트를 규칙 대상으로 전달하기 전에 이벤트를 사용자 지정하기 위해 EventBridge 입력 변환을 만듭니다.` },
    { k:'D', en:`Create an Amazon Kinesis Data Firehose delivery stream that is configured with an AWS Lambda transformer. Specify the existing S3 bucket as the destination. Change the Network Firewall logging destination from Amazon S3 to Kinesis Data Firehose.`, ko:`AWS Lambda 변환기로 구성된 Amazon Kinesis Data Firehose 전송 스트림을 만듭니다. 기존 S3 버킷을 대상으로 지정합니다. 네트워크 방화벽 로깅 대상을 Amazon S3에서 Kinesis Data Firehose로 변경합니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — Kinesis Data Firehose + Lambda 변환기</span></p>
<p>Kinesis Data Firehose는 스트리밍 데이터를 수집하면서 Lambda 변환기로 데이터를 변환하고 추가 데이터를 붙인 후 기존 S3 버킷에 직접 전달하는 기능을 기본으로 지원합니다. AWS Network Firewall은 Kinesis Data Firehose를 로깅 대상으로 지원합니다. 가장 간단하고 직접적인 솔루션입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — S3 트리거로 Lambda를 호출하면 재귀 호출(변환된 객체가 다시 트리거) 위험이 있으며, S3에 이미 도착한 후 변환하므로 "전달 전 변환" 요구 사항과 맞지 않습니다.</p>
<p><span class="mark-no">❌ B</span> — 불필요하게 복잡하며, 데이터를 새 S3 버킷으로 쓰는 것은 기존 버킷 사용 요구 사항과 다릅니다.</p>
<p><span class="mark-no">❌ C</span> — EventBridge 입력 변환은 이벤트 메타데이터를 변환하는 것이지 실제 로그 데이터를 변환하는 기능이 아닙니다.</p>`,
  disc: [{ ans:'D (100%)', txt:'Firehose는 Network Firewall 로그를 수신하면서 Lambda로 변환 후 S3에 전달하는 가장 간단한 파이프라인입니다.' }]
},
{
  n: 276,
  en: `A DevOps engineer needs to implement integration tests into an existing AWS CodePipeline CI/CD workflow for an Amazon Elastic Container Service (Amazon ECS) service. The CI/CD workflow retrieves new application code from an AWS CodeCommit repository and builds a container image. The Cl/CD workflow then uploads the container image to Amazon Elastic Container Registry (Amazon ECR) with a new image tag version.<br><br>The integration tests must ensure that new versions of the service endpoint are reachable and that various API methods return successful response data. The DevOps engineer has already created an ECS cluster to test the service.<br><br>Which combination of steps will meet these requirements with the LEAST management overhead? (Choose three.)`,
  ko: `DevOps 엔지니어는 Amazon Elastic Container Service(Amazon ECS) 서비스에 대한 기존 AWS CodePipeline CI/CD 워크플로에 통합 테스트를 구현해야 합니다. CI/CD 워크플로는 AWS CodeCommit 리포지토리에서 새 애플리케이션 코드를 검색하고 컨테이너 이미지를 빌드합니다. 그런 다음 CI/CD 워크플로는 컨테이너 이미지를 새 이미지 태그 버전과 함께 Amazon Elastic Container Registry(Amazon ECR)에 업로드합니다.<br><br>통합 테스트는 새 버전의 서비스 엔드포인트에 도달할 수 있고 다양한 API 메서드가 성공적인 응답 데이터를 반환하는지 확인해야 합니다. DevOps 엔지니어는 이미 서비스를 테스트하기 위해 ECS 클러스터를 만들었습니다.<br><br>이러한 요구 사항을 가장 적은 관리 오버헤드로 충족하는 단계 조합은 무엇입니까? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Add a deploy stage to the pipeline. Configure Amazon ECS as the action provider.`, ko:`파이프라인에 배포 단계를 추가합니다. Amazon ECS를 작업 공급자로 구성합니다.` },
    { k:'B', en:`Add a deploy stage to the pipeline. Configure AWS CodeDeploy as the action provider.`, ko:`파이프라인에 배포 단계를 추가합니다. AWS CodeDeploy를 작업 공급자로 구성합니다.` },
    { k:'C', en:`Add an appspec.yml file to the CodeCommit repository.`, ko:`CodeCommit 저장소에 appspec.yml 파일을 추가합니다.` },
    { k:'D', en:`Update the image build pipeline stage to output an imagedefinitions.json file that references the new image tag.`, ko:`이미지 빌드 파이프라인 단계를 업데이트하여 새 이미지 태그를 참조하는 imagedefinitions.json 파일을 출력합니다.` },
    { k:'E', en:`Create an AWS Lambda function that runs connectivity checks and API calls against the service. Integrate the Lambda function with CodePipeline by using a Lambda action stage.`, ko:`서비스에 대한 연결 확인 및 API 호출을 실행하는 AWS Lambda 함수를 만듭니다. Lambda 액션 단계를 사용하여 Lambda 함수를 CodePipeline과 통합합니다.` },
    { k:'F', en:`Write a script that runs integration tests against the service. Upload the script to an Amazon S3 bucket. Integrate the script in the S3 bucket with CodePipeline by using an S3 action stage.`, ko:`서비스에 대한 통합 테스트를 실행하는 스크립트를 작성합니다. 스크립트를 Amazon S3 버킷에 업로드합니다. S3 작업 단계를 사용하여 S3 버킷의 스크립트를 CodePipeline과 통합합니다.` },
  ],
  answer: ['A','D','E'],
  vote: '100% ADE',
  explain: `<p><span class="mark-ok">✅ A — ECS 배포 단계 추가</span></p>
<p>CodePipeline에 ECS 작업 공급자로 배포 단계를 추가하면 새 컨테이너 이미지를 테스트 ECS 클러스터에 배포합니다. 최소 관리 오버헤드로 직접 ECS 배포를 지원합니다.</p>
<p><span class="mark-ok">✅ D — imagedefinitions.json 파일 출력</span></p>
<p>ECS 배포 단계가 올바른 이미지 태그를 인식하려면 빌드 단계에서 새 이미지 태그를 참조하는 imagedefinitions.json 파일을 아티팩트로 출력해야 합니다.</p>
<p><span class="mark-ok">✅ E — Lambda 함수로 통합 테스트</span></p>
<p>서버리스 Lambda 함수로 엔드포인트 연결 확인 및 API 호출을 수행하고, CodePipeline Lambda 액션 단계로 통합합니다. 관리 오버헤드가 최소화됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — CodeDeploy는 ECS 블루/그린 배포에 사용되지만, 단순 ECS 배포보다 설정이 복잡합니다.</p>
<p><span class="mark-no">❌ C</span> — appspec.yml은 CodeDeploy 배포에 필요하며, ECS 직접 배포에는 필요하지 않습니다.</p>
<p><span class="mark-no">❌ F</span> — S3 액션 스테이지로 스크립트를 실행하는 것은 Lambda 액션보다 관리 오버헤드가 높습니다.</p>`,
  disc: [{ ans:'ADE (100%)', txt:'ECS 직접 배포(A) + imagedefinitions.json(D) + Lambda 통합 테스트(E)의 최소 오버헤드 조합입니다.' }]
},
{
  n: 277,
  en: `A company runs applications on Windows and Linux Amazon EC2 instances. The instances run across multiple Availability Zones in an AWS Region. The company uses Auto Scaling groups for each application.<br><br>The company needs a durable storage solution for the instances. The solution must use SMB for Windows and must use NFS for Linux. The solution must also have sub-millisecond latencies. All instances will read and write the data.<br><br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `한 회사가 Windows 및 Linux Amazon EC2 인스턴스에서 애플리케이션을 실행합니다. 인스턴스는 AWS 리전의 여러 가용성 영역에서 실행됩니다. 이 회사는 각 애플리케이션에 대해 Auto Scaling 그룹을 사용합니다.<br><br>이 회사는 인스턴스에 대한 내구성 있는 스토리지 솔루션이 필요합니다. 이 솔루션은 Windows의 경우 SMB를 사용하고 Linux의 경우 NFS를 사용해야 합니다. 이 솔루션은 또한 밀리초 미만의 대기 시간을 가져야 합니다. 모든 인스턴스는 데이터를 읽고 씁니다.<br><br>이러한 요구 사항을 충족하는 단계의 조합은 무엇입니까? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Create an Amazon Elastic File System (Amazon EFS) file system that has targets in multiple Availability Zones.`, ko:`여러 가용 영역에 대상이 있는 Amazon Elastic File System(Amazon EFS) 파일 시스템을 만듭니다.` },
    { k:'B', en:`Create an Amazon FSx for NetApp ONTAP Multi-AZ file system.`, ko:`Amazon FSx for NetApp ONTAP Multi-AZ 파일 시스템을 만듭니다.` },
    { k:'C', en:`Create a General Purpose SSD (gp3) Amazon Elastic Block Store (Amazon EBS) volume to use for shared storage.`, ko:`공유 스토리지로 사용할 범용 SSD(gp3) Amazon Elastic Block Store(Amazon EBS) 볼륨을 생성합니다.` },
    { k:'D', en:`Update the user data for each application's launch template to mount the file system.`, ko:`각 애플리케이션의 실행 템플릿에 대한 사용자 데이터를 업데이트하여 파일 시스템을 마운트합니다.` },
    { k:'E', en:`Perform an instance refresh on each Auto Scaling group.`, ko:`각 Auto Scaling 그룹에서 인스턴스 새로 고침을 수행합니다.` },
    { k:'F', en:`Update the EC2 instances for each application to mount the file system when new instances are launched.`, ko:`새 인스턴스가 시작될 때 파일 시스템을 마운트하도록 각 애플리케이션의 EC2 인스턴스를 업데이트합니다.` },
  ],
  answer: ['B','D','E'],
  vote: '75% BDE',
  explain: `<p><span class="mark-ok">✅ B — FSx for NetApp ONTAP Multi-AZ</span></p>
<p>SMB(Windows)와 NFS(Linux)를 모두 지원하며 밀리초 미만 대기 시간을 제공하는 유일한 AWS 스토리지 서비스입니다. Multi-AZ 구성으로 내구성도 보장됩니다.</p>
<p><span class="mark-ok">✅ D — 시작 템플릿 사용자 데이터 업데이트</span></p>
<p>시작 템플릿의 사용자 데이터를 업데이트하여 새로 시작되는 모든 인스턴스가 자동으로 파일 시스템을 마운트하도록 합니다.</p>
<p><span class="mark-ok">✅ E — 각 ASG에서 인스턴스 새로 고침</span></p>
<p>시작 템플릿을 업데이트했으므로, 인스턴스 새로 고침(Instance Refresh)을 수행하여 기존에 실행 중인 인스턴스들도 새 구성(파일 시스템 마운트 포함)으로 교체합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — EFS는 NFS만 지원하며 SMB(Windows)를 지원하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — EBS는 개별 EC2 인스턴스에 연결되는 블록 스토리지로, 여러 인스턴스 간 공유 스토리지에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ F</span> — D와 중복됩니다. D에서 시작 템플릿을 업데이트하면 새 인스턴스에 자동 적용되며, E의 인스턴스 새로 고침으로 기존 인스턴스도 처리됩니다.</p>`,
  disc: [{ ans:'BDE (75%)', txt:'FSx ONTAP(SMB+NFS), 시작 템플릿 사용자 데이터 업데이트, 인스턴스 새로 고침으로 기존 인스턴스까지 모두 적용하는 조합입니다.' }]
},
{
  n: 278,
  en: `A company uses an organization in AWS Organizations that a security team and a DevOps team manage. Both teams access the accounts by using AWS IAM Identity Center.<br><br>A dedicated group has been created for each team. The DevOps team's group has been assigned a permission set named DevOps. The permission set has the AdministratorAccess managed IAM policy attached. The permission set has been applied to all accounts in the organization.<br><br>The security team wants to ensure that the DevOps team does not have access to IAM Identity Center in the organization's management account. The security team has attached the following SCP to the organization root:<br><br>[Image showing an SCP that denies sso:* and sso-directory:* actions]<br><br>After implementing the policy, the security team discovers that the DevOps team can still access IAM Identity Center.<br><br>Which solution will fix the problem?`,
  ko: `한 회사에서 보안 팀과 DevOps 팀이 관리하는 AWS Organizations의 조직을 사용합니다. 두 팀 모두 AWS IAM Identity Center를 사용하여 계정에 액세스합니다.<br><br>각 팀에 대한 전담 그룹이 생성되었습니다. DevOps 팀의 그룹에는 DevOps라는 권한 집합이 할당되었습니다. 권한 집합에는 AdministratorAccess 관리형 IAM 정책이 첨부되었습니다. 권한 집합은 조직의 모든 계정에 적용되었습니다.<br><br>보안 팀은 DevOps 팀이 조직의 관리 계정에서 IAM Identity Center에 액세스할 수 없도록 하려고 합니다. 보안 팀은 다음 SCP를 조직 루트에 첨부했습니다:<br><br>[sso:* 및 sso-directory:* 작업을 거부하는 SCP 이미지]<br><br>정책을 구현한 후 보안 팀은 DevOps 팀이 여전히 IAM Identity Center에 액세스할 수 있음을 발견했습니다.<br><br>어떤 솔루션이 문제를 해결합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`In the organization's management account, create a new OU. Move the organization's management account to the new OU. Detach the SCP from the organization root. Attach the SCP to the new OU.`, ko:`조직의 관리 계정에서 새 OU를 만듭니다. 조직의 관리 계정을 새 OU로 이동합니다. 조직 루트에서 SCP를 분리합니다. SCP를 새 OU에 연결합니다.` },
    { k:'B', en:`In the organization's management account, update the SCP condition reference to the ARN of the DevOps team's group role to include the AWS account ID of the organization's management account.`, ko:`조직의 관리 계정에서 SCP 조건 참조를 DevOps 팀의 그룹 역할의 ARN으로 업데이트하여 조직의 관리 계정의 AWS 계정 ID를 포함합니다.` },
    { k:'C', en:`In IAM Identity Center, create a new permission set. Ensure that the assigned policy has full access but explicitly denies permission for the sso:* action and the sso-directory:* action. Update the assigned permission set for the DevOps team's group role in the organization's management account. Delete the SCP.`, ko:`IAM Identity Center에서 새 권한 집합을 만듭니다. 할당된 정책에 전체 액세스 권한이 있지만 sso:* 작업과 sso-directory:* 작업에 대한 권한을 명시적으로 거부하는지 확인합니다. 조직의 관리 계정에서 DevOps 팀의 그룹 역할에 대한 할당된 권한 집합을 업데이트합니다. SCP를 삭제합니다.` },
    { k:'D', en:`In IAM Identity Center, update the DevOps permission set. Ensure that the assigned policy has full access but explicitly denies permission for the sso:* action and the sso-directory:* action. In the Deny statement, add a StringEquals condition that compares the aws:SourceAccount global condition context key with the organization's management account ID. Delete the SCP.`, ko:`IAM Identity Center에서 DevOps 권한 집합을 업데이트합니다. 할당된 정책에 전체 액세스 권한이 있지만 sso:* 작업과 sso-directory:* 작업에 대한 권한을 명시적으로 거부하는지 확인합니다. Deny 문에서 aws:SourceAccount 글로벌 조건 컨텍스트 키를 조직의 관리 계정 ID와 비교하는 StringEquals 조건을 추가합니다. SCP를 삭제합니다.` },
  ],
  answer: ['D'],
  vote: '56% D',
  explain: `<p><span class="mark-ok">✅ D — DevOps 권한 집합 업데이트 + 관리 계정 조건부 Deny</span></p>
<p>SCP는 Organizations <strong>관리 계정에는 적용되지 않습니다</strong>. 따라서 루트에 SCP를 붙여도 관리 계정 사용자에게는 효과가 없습니다. 해결책은 IAM Identity Center의 DevOps 권한 집합에 인라인 정책을 추가하여 관리 계정(aws:SourceAccount)에서는 sso:* 및 sso-directory:* 작업을 명시적으로 거부하는 것입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Organizations 관리 계정은 OU로 이동할 수 없습니다. 관리 계정은 항상 루트에 존재합니다.</p>
<p><span class="mark-no">❌ B</span> — SCP는 관리 계정에 적용되지 않으므로, SCP 조건을 수정해도 문제가 해결되지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — C와 D의 차이: D는 기존 DevOps 권한 집합을 업데이트하고 조건을 추가하여 관리 계정에만 적용합니다. C는 새 권한 집합을 만들지만 조건 없이 모든 계정에서 SSO를 차단할 수 있습니다.</p>`,
  disc: [{ ans:'D (56%)', txt:'SCP는 Organizations 관리 계정에 적용되지 않습니다. 권한 집합(Permission Set)에 조건부 거부를 추가하여 관리 계정에서만 SSO 액세스를 차단해야 합니다.' }]
},
{
  n: 279,
  en: `An Amazon EC2 Auto Scaling group manages EC2 instances that were created from an AMI. The AMI has the AWS Systems Manager Agent installed. When an EC2 instance is launched into the Auto Scaling group, tags are applied to the EC2 instance.<br><br>EC2 instances that are launched by the Auto Scaling group must have the correct operating system configuration.<br><br>Which solution will meet these requirements?`,
  ko: `Amazon EC2 Auto Scaling 그룹은 AMI에서 생성된 EC2 인스턴스를 관리합니다. AMI에는 AWS Systems Manager Agent가 설치되어 있습니다. EC2 인스턴스가 Auto Scaling 그룹에서 시작되면 태그가 EC2 인스턴스에 적용됩니다.<br><br>Auto Scaling 그룹에서 시작하는 EC2 인스턴스는 올바른 운영 체제 구성을 가져야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a Systems Manager Run Command document that configures the desired instance configuration. Set up Systems Manager Compliance to invoke the Run Command document when the EC2 instances are not in compliance with the most recent patches.`, ko:`원하는 인스턴스 구성을 구성하는 Systems Manager Run Command 문서를 만듭니다. EC2 인스턴스가 최신 패치를 준수하지 않을 때 Run Command 문서를 호출하도록 Systems Manager Compliance를 설정합니다.` },
    { k:'B', en:`Create a Systems Manager State Manager association that links to the Systems Manager command document. Create a tag query that runs immediately.`, ko:`Systems Manager 명령 문서에 연결되는 Systems Manager State Manager 연결을 만듭니다. 즉시 실행되는 태그 쿼리를 만듭니다.` },
    { k:'C', en:`Create a Systems Manager Run Command task that specifies the desired instance configuration. Create a maintenance window in Systems Manager Maintenance Windows that runs daily. Register the Run Command task against the maintenance window. Designate the targets.`, ko:`원하는 인스턴스 구성을 지정하는 Systems Manager Run Command 작업을 만듭니다. Systems Manager Maintenance Windows에서 매일 실행되는 유지 관리 창을 만듭니다. Run Command 작업을 유지 관리 창에 등록합니다. 대상을 지정합니다.` },
    { k:'D', en:`Create a Systems Manager Patch Manager patch baseline and a patch group that use the same tags that the Auto Scaling group applies. Register the patch group with the patch baseline. Define a Systems Manager command document to patch the instances. Invoke the document by using Systems Manager Run Command.`, ko:`Systems Manager Patch Manager 패치 기준선과 Auto Scaling 그룹이 적용하는 것과 동일한 태그를 사용하는 패치 그룹을 만듭니다. 패치 그룹을 패치 기준선에 등록합니다. 인스턴스를 패치하기 위한 Systems Manager 명령 문서를 정의합니다. Systems Manager Run Command를 사용하여 문서를 호출합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — State Manager 연결 + 태그 쿼리(즉시 실행)</span></p>
<p>Systems Manager State Manager 연결은 원하는 상태(OS 구성)를 정의하고 지속적으로 적용합니다. 태그 쿼리를 즉시 실행으로 설정하면 Auto Scaling 그룹에서 새 인스턴스가 시작되어 태그가 적용되는 즉시 올바른 OS 구성이 자동으로 적용됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — SSM Compliance는 규정 준수 상태를 확인하지만, 인스턴스 시작 시 즉시 구성을 적용하는 데 사용하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — 유지 관리 창은 정해진 스케줄에 따라 실행됩니다. 새 인스턴스 시작 즉시 구성을 적용하지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — Patch Manager는 패치 관리에 특화되어 있으며, 전반적인 OS 구성 관리에는 State Manager가 더 적합합니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'State Manager 연결은 인스턴스 시작 즉시 태그 기반으로 OS 구성을 적용하는 가장 적합한 솔루션입니다.' }]
},
{
  n: 280,
  en: `A company uses AWS Organizations to manage its AWS accounts. The organization root has a child OU that is named Department. The Department OU has a child OU that is named Engineering. The default FullAWSAccess policy is attached to the root, the Department OU, and the Engineering OU.<br><br>The company has many AWS accounts in the Engineering OU. Each account has an administrative IAM role with the AdministratorAccess IAM policy attached. The default FullAWSAccessPolicy is also attached to each account.<br><br>A DevOps engineer plans to remove the FullAWSAccess policy from the Department OU. The DevOps engineer will replace the policy with a policy that contains an Allow statement for all Amazon EC2 API operations.<br><br>What will happen to the permissions of the administrative IAM roles as a result of this change?`,
  ko: `한 회사에서 AWS Organizations를 사용하여 AWS 계정을 관리합니다. 조직 루트에는 Department라는 이름의 자식 OU가 있습니다. Department OU에는 Engineering이라는 이름의 자식 OU가 있습니다. 기본 FullAWSAccess 정책은 루트, Department OU 및 Engineering OU에 연결됩니다.<br><br>이 회사는 Engineering OU에 많은 AWS 계정을 가지고 있습니다. 각 계정에는 AdministratorAccess IAM 정책이 연결된 관리 IAM 역할이 있습니다. 기본 FullAWSAccessPolicy도 각 계정에 연결됩니다.<br><br>DevOps 엔지니어는 Department OU에서 FullAWSAccess 정책을 제거할 계획입니다. DevOps 엔지니어는 모든 Amazon EC2 API 작업에 대한 Allow 문이 포함된 정책으로 정책을 대체합니다.<br><br>이 변경으로 인해 관리 IAM 역할의 권한은 어떻게 됩니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`All API actions on all resources will be allowed.`, ko:`모든 리소스에 대한 모든 API 작업이 허용됩니다.` },
    { k:'B', en:`All API actions on EC2 resources will be allowed. All other API actions will be denied.`, ko:`EC2 리소스에 대한 모든 API 작업이 허용됩니다. 다른 모든 API 작업은 거부됩니다.` },
    { k:'C', en:`All API actions on all resources will be denied.`, ko:`모든 리소스에 대한 모든 API 작업이 거부됩니다.` },
    { k:'D', en:`All API actions on EC2 resources will be denied. All other API actions will be allowed.`, ko:`EC2 리소스에 대한 모든 API 작업은 거부됩니다. 다른 모든 API 작업은 허용됩니다.` },
  ],
  answer: ['B'],
  vote: '71% B',
  explain: `<p><span class="mark-ok">✅ B — EC2 API만 허용, 나머지 거부</span></p>
<p>SCP는 <strong>Allow-list 방식</strong>으로 작동합니다. 계층 구조를 따라 모든 상위 SCP의 교집합만 허용됩니다.<br>
• 루트: FullAWSAccess (모든 서비스 Allow)<br>
• Department OU: EC2만 Allow (FullAWSAccess 제거)<br>
• Engineering OU: FullAWSAccess<br>
• 계정: FullAWSAccess<br><br>
계정의 유효 권한 = 루트 ∩ Department OU ∩ Engineering OU ∩ 계정 SCP = EC2만 허용<br>
Department OU에서 EC2만 허용하도록 변경되면, 그 아래 모든 계정은 EC2 작업만 수행 가능합니다. Engineering OU와 계정에 FullAWSAccess가 있어도 상위의 Department OU 제한을 초과할 수 없습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Department OU에서 EC2만 허용하도록 변경되었으므로 전체 액세스가 허용되지 않습니다. Engineering OU와 계정에 FullAWSAccess가 있어도 상위 SCP보다 넓을 수 없습니다.</p>
<p><span class="mark-no">❌ C</span> — SCP에 EC2 허용 문이 있으므로 EC2 작업은 허용됩니다.</p>
<p><span class="mark-no">❌ D</span> — EC2 작업을 명시적으로 허용하는 문이 있으므로 EC2 작업은 허용됩니다.</p>`,
  disc: [{ ans:'B (71%)', txt:'SCP는 교집합(가장 좁은 범위)으로 작동합니다. Department OU의 EC2-only 정책이 하위 계정의 FullAWSAccess를 제한하므로 결과적으로 EC2만 허용됩니다.' }]
},
{
  n: 281,
  en: `A company manages AWS accounts in AWS Organizations. The company needs a solution to send Amazon CloudWatch Logs data to an Amazon S3 bucket in a dedicated AWS account. The solution must support all existing and future CloudWatch Logs log groups.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 AWS Organizations에서 AWS 계정을 관리합니다. 이 회사는 전용 AWS 계정의 Amazon S3 버킷으로 Amazon CloudWatch Logs 데이터를 보내는 솔루션이 필요합니다. 이 솔루션은 모든 기존 및 미래 CloudWatch Logs 로그 그룹을 지원해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Enable Organizations backup policies to back up all log groups to a dedicated S3 bucket. Add an S3 bucket policy that allows access from all accounts that belong to the company.`, ko:`조직 백업 정책을 활성화하여 모든 로그 그룹을 전용 S3 버킷에 백업합니다. 회사에 속한 모든 계정에서 액세스할 수 있는 S3 버킷 정책을 추가합니다.` },
    { k:'B', en:`Create a backup plan in AWS Backup. Specify a dedicated S3 bucket as a backup vault. Assign all CloudWatch Logs log group resources to the backup plan. Create resource assignments in the backup plan for all accounts that belong to the company.`, ko:`AWS Backup에서 백업 계획을 만듭니다. 전용 S3 버킷을 백업 볼트로 지정합니다. 모든 CloudWatch Logs 로그 그룹 리소스를 백업 계획에 할당합니다. 회사에 속한 모든 계정에 대한 백업 계획에서 리소스 할당을 만듭니다.` },
    { k:'C', en:`Create a backup plan in AWS Backup. Specify a dedicated S3 bucket as a backup vault. Assign all existing log groups to the backup plan. Create resource assignments in the backup plan for all accounts that belong to the company. Create an AWS Systems Manager Automation runbook to assign log groups to a backup plan. Create an AWS Config rule that has an automatic remediation action for all noncompliant log groups. Specify the runbook as the rule's target.`, ko:`AWS Backup에서 백업 계획을 만듭니다. 전용 S3 버킷을 백업 볼트로 지정합니다. 모든 기존 로그 그룹을 백업 계획에 할당합니다. 회사에 속한 모든 계정에 대한 백업 계획에서 리소스 할당을 만듭니다. AWS Systems Manager Automation 런북을 만들어 로그 그룹을 백업 계획에 할당합니다. 모든 비준수 로그 그룹에 대한 자동 수정 작업이 있는 AWS Config 규칙을 만듭니다. 런북을 규칙의 대상으로 지정합니다.` },
    { k:'D', en:`Create a CloudWatch Logs destination and an Amazon Kinesis Data Firehose delivery stream in the dedicated AWS account. Specify the S3 bucket as the destination of the delivery stream. Create subscription filters for all existing log groups in all accounts. Create an AWS Lambda function to call the CloudWatch Logs PutSubscriptionFilter API operation. Create an Amazon EventBridge rule to invoke the Lambda function when a CreateLogGroup event occurs.`, ko:`전용 AWS 계정에서 CloudWatch Logs 대상과 Amazon Kinesis Data Firehose 전송 스트림을 만듭니다. 전송 스트림의 대상으로 S3 버킷을 지정합니다. 모든 계정의 모든 기존 로그 그룹에 대한 구독 필터를 만듭니다. CloudWatch Logs PutSubscriptionFilter API 작업을 호출하는 AWS Lambda 함수를 만듭니다. CreateLogGroup 이벤트가 발생할 때 Lambda 함수를 호출하는 Amazon EventBridge 규칙을 만듭니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — CloudWatch Logs 대상 + Firehose → S3 + Lambda(구독 필터 자동 등록)</span></p>
<p>전용 계정에 CloudWatch Logs 대상(Kinesis Data Firehose)을 만들고 기존 로그 그룹에는 구독 필터를 생성합니다. 새로운 로그 그룹이 생성될 때는 EventBridge가 CreateLogGroup 이벤트를 감지하여 Lambda를 호출하고, Lambda가 자동으로 PutSubscriptionFilter를 적용합니다. 이로써 미래 로그 그룹도 자동으로 처리됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A, B, C</span> — AWS Backup은 CloudWatch Logs 로그 그룹을 백업하는 서비스가 아닙니다. CloudWatch Logs의 데이터를 S3로 전송하는 표준 방법은 구독 필터(Subscription Filter) + Kinesis Data Firehose입니다.</p>`,
  disc: [{ ans:'D (100%)', txt:'기존 로그 그룹: 구독 필터 직접 생성. 미래 로그 그룹: EventBridge(CreateLogGroup) → Lambda → PutSubscriptionFilter 자동화.' }]
},
{
  n: 282,
  en: `A DevOps engineer manages a Java-based application that runs in an Amazon Elastic Container Service (Amazon ECS) cluster on AWS Fargate. Auto scaling has not been configured for the application.<br><br>The DevOps engineer has determined that the Java Virtual Machine (JVM) thread count is a good indicator of when to scale the application. The application serves customer traffic on port 8080 and makes JVM metrics available on port 9404.<br><br>Application use has recently increased. The DevOps engineer needs to configure auto scaling for the application.<br><br>Which solution will meet these requirements with the LEAST operational overhead? (Choose two.)`,
  ko: `DevOps 엔지니어가 AWS Fargate의 Amazon Elastic Container Service(Amazon ECS) 클러스터에서 실행되는 Java 기반 애플리케이션을 관리합니다. 애플리케이션에 대한 자동 스케일링이 구성되지 않았습니다.<br><br>DevOps 엔지니어는 Java Virtual Machine(JVM) 스레드 수가 애플리케이션을 스케일링할 시기를 나타내는 좋은 지표라고 판단했습니다. 애플리케이션은 포트 8080에서 고객 트래픽을 처리하고 포트 9404에서 JVM 메트릭을 제공합니다.<br><br>애플리케이션 사용이 최근 증가했습니다. DevOps 엔지니어는 애플리케이션에 대한 자동 스케일링을 구성해야 합니다.<br><br>운영 오버헤드를 최소화하면서 이러한 요구 사항을 충족하는 솔루션은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Deploy the Amazon CloudWatch agent as a container sidecar. Configure the CloudWatch agent to retrieve JVM metrics from port 9404. Create CloudWatch alarms on the JVM thread count metric to scale the application. Add a step scaling policy in Fargate to scale up and scale down based on the CloudWatch alarms.`, ko:`Amazon CloudWatch 에이전트를 컨테이너 사이드카로 배포합니다. CloudWatch 에이전트를 구성하여 포트 9404에서 JVM 메트릭을 검색합니다. JVM 스레드 수 메트릭에 CloudWatch 알람을 생성하여 애플리케이션을 확장합니다. Fargate에 단계적 확장 정책을 추가하여 CloudWatch 알람에 따라 확장 및 축소합니다.` },
    { k:'B', en:`Deploy the Amazon CloudWatch agent as a container sidecar. Configure a metric filter for the JVM thread count metric on the CloudWatch log group for the CloudWatch agent. Add a target tracking policy in Fargate. Select the metric from the metric filter as a scale target.`, ko:`Amazon CloudWatch 에이전트를 컨테이너 사이드카로 배포합니다. CloudWatch 에이전트의 CloudWatch 로그 그룹에서 JVM 스레드 수 메트릭에 대한 메트릭 필터를 구성합니다. Fargate에서 대상 추적 정책을 추가합니다. 메트릭 필터에서 메트릭을 스케일 대상으로 선택합니다.` },
    { k:'C', en:`Create an Amazon Managed Service for Prometheus workspace. Deploy AWS Distro for OpenTelemetry as a container sidecar to publish the JVM metrics from port 9404 to the Prometheus workspace. Configure rules for the workspace to use the JVM thread count metric to scale the application. Add a step scaling policy in Fargate. Select the Prometheus rules to scale up and scale down.`, ko:`Prometheus 작업 공간을 위한 Amazon Managed Service를 만듭니다. AWS Distro for OpenTelemetry를 컨테이너 사이드카로 배포하여 포트 9404에서 Prometheus 작업 공간으로 JVM 메트릭을 게시합니다. 작업 공간이 JVM 스레드 수 메트릭을 사용하여 애플리케이션을 확장하도록 규칙을 구성합니다. Fargate에서 단계적 확장 정책을 추가합니다. 확장 및 축소할 Prometheus 규칙을 선택합니다.` },
    { k:'D', en:`Create an Amazon Managed Service for Prometheus workspace. Deploy AWS Distro for OpenTelemetry as a container sidecar to retrieve JVM metrics from port 9404 and to publish the JVM metrics to the Prometheus workspace. Add a target tracking policy in Fargate. Select the Prometheus metric as a scale target.`, ko:`Prometheus 작업 공간을 위한 Amazon Managed Service를 만듭니다. AWS Distro for OpenTelemetry를 컨테이너 사이드카로 배포하여 포트 9404에서 JVM 메트릭을 검색하여 Prometheus 작업 공간에 JVM 메트릭을 게시합니다. Fargate에서 대상 추적 정책을 추가합니다. Prometheus 메트릭을 스케일 대상으로 선택합니다.` },
  ],
  answer: ['A','D'],
  vote: '100% AD',
  explain: `<p><span class="mark-ok">✅ A — CloudWatch 에이전트 사이드카 + 단계적 확장 정책</span></p>
<p>CloudWatch 에이전트를 사이드카로 배포하여 포트 9404에서 JVM 스레드 수를 수집하고 CloudWatch에 게시합니다. CloudWatch 알람을 기반으로 단계적 확장 정책으로 ECS Fargate를 자동 스케일링합니다.</p>
<p><span class="mark-ok">✅ D — Amazon Managed Service for Prometheus + ADOT + 대상 추적 정책</span></p>
<p>ADOT(AWS Distro for OpenTelemetry) 사이드카로 JVM 메트릭을 AMP(Amazon Managed Prometheus)에 게시하고, Fargate의 대상 추적 정책으로 Prometheus 메트릭을 스케일 대상으로 사용합니다. 대상 추적은 단계적 정책보다 관리 오버헤드가 적습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 메트릭 필터는 로그 데이터에서 메트릭을 추출하는 용도로, JVM 메트릭을 직접 스케일 대상으로 사용하는 최적 방법이 아닙니다.</p>
<p><span class="mark-no">❌ C</span> — Prometheus 규칙으로 확장을 제어하는 것은 표준 ECS 자동 스케일링 방식이 아닙니다.</p>`,
  disc: [{ ans:'AD (100%)', txt:'CloudWatch 에이전트(단계적 확장) 또는 ADOT+AMP(대상 추적 확장) 두 가지 방식 모두 JVM 사용자 정의 메트릭 기반 ECS Fargate 자동 스케일링에 유효합니다.' }]
},
{
  n: 283,
  en: `A company has an application that runs in a single AWS Region. The application runs on an Amazon Elastic Kubernetes Service (Amazon EKS) cluster and connects to an Amazon Aurora MySQL cluster. The application is built in an AWS CodeBuild project. The container images are published to Amazon Elastic Container Registry (Amazon ECR).<br><br>The company needs to replicate the state of the application for the container images and the database to a second Region.<br><br>Which solution will meet these requirements in the MOST operationally efficient way?`,
  ko: `한 회사에 단일 AWS 리전에서 실행되는 애플리케이션이 있습니다. 이 애플리케이션은 Amazon Elastic Kubernetes Service(Amazon EKS) 클러스터에서 실행되고 Amazon Aurora MySQL 클러스터에 연결됩니다. 이 애플리케이션은 AWS CodeBuild 프로젝트에서 빌드됩니다. 컨테이너 이미지는 Amazon Elastic Container Registry(Amazon ECR)에 게시됩니다.<br><br>이 회사는 컨테이너 이미지와 데이터베이스의 애플리케이션 상태를 두 번째 리전에 복제해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 가장 운영 효율적인 방식으로 충족합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Turn on Amazon S3 Cross-Region Replication (CRR) on the bucket that holds the ECR container images. Deploy the application to an EKS cluster in the second Region by referencing the new S3 bucket object URL for the container image in a Kubernetes deployment file. Configure a cross-Region Aurora Replica in the second Region. Configure the new application deployment to use the endpoints for the cross-Region Aurora Replica.`, ko:`ECR 컨테이너 이미지를 보관하는 버킷에서 Amazon S3 Cross-Region Replication(CRR)을 켭니다. Kubernetes 배포 파일에서 컨테이너 이미지에 대한 새 S3 버킷 객체 URL을 참조하여 두 번째 리전의 EKS 클러스터에 애플리케이션을 배포합니다. 두 번째 리전에서 크로스 리전 Aurora Replica를 구성합니다. 크로스 리전 Aurora Replica에 대한 엔드포인트를 사용하도록 새 애플리케이션 배포를 구성합니다.` },

{

  en: `A company is building a serverless application that uses AWS Lambda functions to process data.<br><br>A BeginResponse Lambda function initializes data in response to specific application events. The company needs to ensure that a large number of Lambda functions are invoked after the BeginResponse Lambda function runs. Each Lambda function must be invoked in parallel and depends on only the outputs of the BeginResponse Lambda function. Each Lambda function has retry logic for invocation and must be able to fine-tune concurrency without losing data.<br><br>Which solution will meet these requirements with the MOST operational efficiency?`,
  ko: `한 회사가 AWS Lambda 함수를 사용하여 데이터를 처리하는 서버리스 애플리케이션을 구축하고 있습니다.<br><br>BeginResponse Lambda 함수는 특정 애플리케이션 이벤트에 대한 응답으로 데이터를 초기화합니다. 이 회사는 BeginResponse Lambda 함수가 실행된 후 많은 수의 Lambda 함수가 호출되도록 해야 합니다. 각 Lambda 함수는 병렬로 호출되어야 하며 BeginResponse Lambda 함수의 출력에만 의존합니다. 각 Lambda 함수는 호출을 위한 재시도 논리를 가지고 있으며 데이터 손실 없이 동시성을 미세 조정할 수 있어야 합니다.<br><br>가장 높은 운영 효율성으로 이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',

    { k:'D', en:`Create an AWS Step Functions Standard Workflow. Configure states in the workflow to invoke the Lambda functions sequentially. Create an Amazon Simple Notification Service (Amazon SNS) topic. Modify the BeginResponse Lambda function to publish to the SNS topic before the Lambda function finishes running. Create a new Lambda function that is subscribed to the SNS topic and that invokes the Step Functions workflow.`, ko:`AWS Step Functions Standard Workflow를 만듭니다. Lambda 함수를 순차적으로 호출하도록 워크플로에서 상태를 구성합니다. Amazon Simple Notification Service(Amazon SNS) 토픽을 만듭니다. Lambda 함수가 실행을 마치기 전에 SNS 토픽에 게시하도록 BeginResponse Lambda 함수를 수정합니다. SNS 토픽을 구독하고 Step Functions 워크플로를 호출하는 새 Lambda 함수를 만듭니다.` },

<p>SNS 팬아웃 패턴: BeginResponse 완료 시 SNS에 게시 → SNS가 모든 SQS 대기열에 동시에 메시지 전달(병렬 호출). 각 Lambda 함수는 자체 SQS 대기열에서 메시지를 수신하므로:</p>

<p>ECR에 Docker 이미지를 저장하면 빌드 간 이미지를 재사용할 수 있습니다. CodeBuild의 <code>LOCAL_DOCKER_LAYER_CACHE</code> 설정을 활성화하면 변경되지 않은 Docker 레이어를 로컬에 캐시하여 매 빌드마다 전체 이미지를 다운로드하지 않아도 됩니다. 이는 빌드 시간과 비용을 모두 절감합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — S3에 Docker 이미지를 캐시하는 것은 Docker 계층 캐시가 아닌 일반 파일 캐시로, Docker 빌드 성능 향상에 효과적이지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — 항상 최신 이미지를 사용하도록 설정하는 것은 캐시와 관련이 없으며 성능 개선에 도움되지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — 사용자 지정 AMI를 사용하는 것은 관리 오버헤드가 높고 비용 절감에 효과적이지 않습니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'ECR + CodeBuild LOCAL_DOCKER_LAYER_CACHE는 대형 Docker 이미지 빌드 성능과 비용을 동시에 최적화합니다.' }]
},
{
  n: 287,
  en: `A large company recently acquired a small company. The large company invited the small company to join the large company's existing organization in AWS Organizations as a new OU.<br><br>A DevOps engineer determines that the small company needs to launch t3.small Amazon EC2 instance types for the company's application workloads. The small company needs to deploy the instances only within US-based AWS Regions.<br><br>The DevOps engineer needs to use an SCP in the small company's new OU to ensure that the small company can launch only the required instance types.<br><br>Which solution will meet these requirements?`,
  ko: `대기업이 최근에 소기업을 인수했습니다. 이 대기업은 소기업을 초대하여 AWS Organizations에서 대기업의 기존 조직에 새로운 OU로 가입하도록 했습니다.<br><br>DevOps 엔지니어는 소기업이 회사의 애플리케이션 워크로드에 대해 t3.small Amazon EC2 인스턴스 유형을 시작해야 한다고 판단합니다. 소기업은 미국 기반 AWS 리전 내에서만 인스턴스를 배포해야 합니다.<br><br>DevOps 엔지니어는 소기업의 새로운 OU에서 SCP를 사용하여 소기업이 필요한 인스턴스 유형만 시작할 수 있도록 해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure a statement to deny the ec2:RunInstances action for all EC2 instance resources when the ec2:InstanceType condition is not equal to t3.small.<br>Configure another statement to deny the ec2:RunInstances action for all EC2 instance resources when the aws:RequestedRegion condition is not equal to us-*.`, ko:`ec2:InstanceType 조건이 t3.small과 같지 않을 때 모든 EC2 인스턴스 리소스에 대한 ec2:RunInstances 작업을 거부하는 명령문을 구성합니다.<br>aws:RequestedRegion 조건이 us-*와 같지 않을 때 모든 EC2 인스턴스 리소스에 대한 ec2:RunInstances 작업을 거부하는 또 다른 명령문을 구성합니다.` },
    { k:'B', en:`Configure a statement to allow the ec2:RunInstances action for all EC2 instance resources when the ec2:InstanceType condition is not equal to t3.small.<br>Configure another statement to allow the ec2:RunInstances action for all EC2 instance resources when the aws:RequestedRegion condition is not equal to us-*.`, ko:`ec2:InstanceType 조건이 t3.small과 같지 않을 때 모든 EC2 인스턴스 리소스에 대해 ec2:RunInstances 작업을 허용하는 명령문을 구성합니다.<br>aws:RequestedRegion 조건이 us-*와 같지 않을 때 모든 EC2 인스턴스 리소스에 대해 ec2:RunInstances 작업을 허용하는 또 다른 명령문을 구성합니다.` },
    { k:'C', en:`Configure a statement to deny the ec2:RunInstances action for all EC2 instance resources when the ec2:InstanceType condition is equal to t3.small.<br>Configure another statement to deny the ec2:RunInstances action for all EC2 instance resources when the aws:RequestedRegion condition is equal to us-*.`, ko:`ec2:InstanceType 조건이 t3.small과 같을 때 모든 EC2 인스턴스 리소스에 대한 ec2:RunInstances 작업을 거부하는 명령문을 구성합니다.<br>aws:RequestedRegion 조건이 us-*와 같을 때 모든 EC2 인스턴스 리소스에 대한 ec2:RunInstances 작업을 거부하는 또 다른 명령문을 구성합니다.` },
    { k:'D', en:`Configure a statement to allow the ec2:RunInstances action for all EC2 instance resources when the ec2:InstanceType condition is equal to t3.small.<br>Configure another statement to allow the ec2:RunInstances action for all EC2 instance resources when the aws:RequestedRegion condition is equal to us-*.`, ko:`ec2:InstanceType 조건이 t3.small과 같을 때 모든 EC2 인스턴스 리소스에 대해 ec2:RunInstances 작업을 허용하는 문장을 구성합니다.<br>aws:RequestedRegion 조건이 us-*와 같을 때 모든 EC2 인스턴스 리소스에 대해 ec2:RunInstances 작업을 허용하는 또 다른 문장을 구성합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 조건부 Deny 문 두 개 사용</span></p>
<p>SCP에서 특정 값 이외를 차단하려면 <strong>Deny + StringNotEquals(또는 NotIn)</strong> 패턴을 사용합니다.<br>
① <code>ec2:InstanceType</code>이 t3.small이 아닐 때 RunInstances 거부 → t3.small만 허용<br>
② <code>aws:RequestedRegion</code>이 us-*가 아닐 때 RunInstances 거부 → 미국 리전만 허용</p>
<p><strong>SCP의 중요한 제한 사항:</strong> SCP의 Allow 문은 <code>Condition</code> 요소를 가질 수 없습니다. 따라서 조건부 허용(B, D)은 SCP에서 유효하지 않으며, Deny 문에서만 조건을 사용해야 합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B, D</span> — SCP의 Allow 문은 Condition 요소를 가질 수 없습니다. 따라서 B와 D는 유효하지 않은 SCP 구문입니다.</p>
<p><span class="mark-no">❌ C</span> — t3.small일 때 거부하고 us-*일 때 거부하면 허용하려는 조건을 정반대로 차단합니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'SCP Deny + 부정 조건(NotEquals): t3.small이 아닌 경우 거부, us-*가 아닌 경우 거부. SCP Allow는 Condition을 지원하지 않으므로 Deny 문 사용이 필수입니다.' }]
},
{
  n: 288,
  en: `A DevOps team manages infrastructure for an application. The application uses long-running processes to process items from an Amazon Simple Queue Service (Amazon SQS) queue. The application is deployed to an Auto Scaling group.<br><br>The application recently experienced an issue where items were taking significantly longer to process. The queue exceeded the expected size, which prevented various business processes from functioning properly. The application records all logs to a third-party tool.<br><br>The team is currently subscribed to an Amazon Simple Notification Service (Amazon SNS) topic that the team uses for alerts. The team needs to be alerted if the queue exceeds the expected size.<br><br>Which solution will meet these requirements with the MOST operational efficiency?`,
  ko: `DevOps 팀은 애플리케이션의 인프라를 관리합니다. 이 애플리케이션은 장기 실행 프로세스를 사용하여 Amazon Simple Queue Service(Amazon SQS) 대기열의 항목을 처리합니다. 이 애플리케이션은 Auto Scaling 그룹에 배포됩니다.<br><br>이 애플리케이션은 최근 항목을 처리하는 데 상당히 더 오래 걸리는 문제를 경험했습니다. 대기열이 예상 크기를 초과하여 다양한 비즈니스 프로세스가 제대로 작동하지 못했습니다. 이 애플리케이션은 모든 로그를 타사 도구에 기록합니다.<br><br>이 팀은 현재 알림에 사용하는 Amazon Simple Notification Service(Amazon SNS) 토픽을 구독하고 있습니다. 대기열이 예상 크기를 초과하면 팀에 알림을 보내야 합니다.<br><br>가장 높은 운영 효율성으로 이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an Amazon CloudWatch metric alarm with a period of 1 hour and a static threshold to alarm if the average of the ApproximateNumberOfMessagesDelayed metric is greater than the expected value. Configure the alarm to notify the SNS topic.`, ko:`ApproximateNumberOfMessagesDelayed 메트릭의 평균이 예상 값보다 큰 경우 경보를 울리도록 1시간의 기간과 정적 임계값을 사용하여 Amazon CloudWatch 메트릭 경보를 만듭니다. SNS 토픽에 알리도록 경보를 구성합니다.` },
    { k:'B', en:`Create an Amazon CloudWatch metric alarm with a period of 1 hour and a static threshold to alarm if the sum of the ApproximateNumberOfMessagesVisible metric is greater than the expected value. Configure the alarm to notify the SNS topic.`, ko:`ApproximateNumberOfMessagesVisible 메트릭의 합계가 예상 값보다 큰 경우 경보를 울리도록 1시간의 기간과 정적 임계값을 사용하여 Amazon CloudWatch 메트릭 경보를 만듭니다. SNS 토픽에 알리도록 경보를 구성합니다.` },
    { k:'C', en:`Create an AWS Lambda function that retrieves the ApproximateNumberOfMessages SQS queue attribute value and publishes the value as a new CloudWatch custom metric. Create an Amazon EventBridge rule that is scheduled to run every 5 minutes and that invokes the Lambda function. Configure a CloudWatch metrics alarm with a period of 1 hour and a static threshold to alarm if the sum of the new custom metric is greater than the expected value.`, ko:`ApproximateNumberOfMessages SQS 대기열 속성 값을 검색하고 값을 새 CloudWatch 사용자 지정 메트릭으로 게시하는 AWS Lambda 함수를 만듭니다. 5분마다 실행되도록 예약되고 Lambda 함수를 호출하는 Amazon EventBridge 규칙을 만듭니다. 1시간의 기간과 새 사용자 지정 메트릭의 합계가 예상 값보다 큰 경우 경보를 울리도록 정적 임계값을 사용하여 CloudWatch 메트릭 경보를 구성합니다.` },
    { k:'D', en:`Create an AWS Lambda function that checks the ApproximateNumberOfMessagesDelayed SQS queue attribute and compares the value to a defined expected size in the function. Create an Amazon EventBridge rule that is scheduled to run every 5 minutes and that invokes the Lambda function. When the ApproximateNumberOfMessagesDelayed SQS queue attribute exceeds the expected size, send a notification to the SNS topic.`, ko:`ApproximateNumberOfMessagesDelayed SQS 대기열 속성을 확인하고 값을 함수에서 정의된 예상 크기와 비교하는 AWS Lambda 함수를 만듭니다. 5분마다 실행되도록 예약되고 Lambda 함수를 호출하는 Amazon EventBridge 규칙을 만듭니다. ApproximateNumberOfMessagesDelayed SQS 대기열 속성이 예상 크기를 초과하면 SNS 토픽에 알림을 보냅니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — ApproximateNumberOfMessagesVisible + CloudWatch 알람 + SNS 토픽</span></p>
<p><code>ApproximateNumberOfMessagesVisible</code>은 대기열에서 처리를 기다리는 메시지 수(큐 크기)를 나타내는 핵심 메트릭입니다. CloudWatch 메트릭 알람은 SQS 메트릭을 기본으로 지원하므로 별도 Lambda 없이 직접 SNS에 알림을 보낼 수 있어 운영 효율성이 가장 높습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — <code>ApproximateNumberOfMessagesDelayed</code>는 배달 지연 메시지 수로, 큐가 처리할 수 없어서 쌓인 메시지 수와 다릅니다.</p>
<p><span class="mark-no">❌ C, D</span> — Lambda + EventBridge로 직접 메트릭을 폴링하는 방식은 CloudWatch 기본 메트릭 알람보다 운영 오버헤드가 높습니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'ApproximateNumberOfMessagesVisible은 큐 크기를 직접 나타내며, CloudWatch 알람으로 SNS에 알림을 보내는 것이 가장 간단하고 운영 효율적입니다.' }]
},
{
  n: 289,
  en: `A large company runs critical workloads in multiple AWS accounts. The AWS accounts are managed under AWS Organizations with all features enabled. The company stores confidential customer data in an Amazon S3 bucket. Access to the S3 bucket requires multiple levels of approval.<br><br>The company wants to monitor when the S3 bucket is accessed by using the AWS CLI. The company also wants insights into the various activities performed by other users on all other S3 buckets in the AWS accounts to detect any issues.<br><br>Which solution will meet these requirements?`,
  ko: `대규모 회사가 여러 AWS 계정에서 중요한 워크로드를 실행합니다. AWS 계정은 모든 기능이 활성화된 AWS Organizations에서 관리됩니다. 이 회사는 Amazon S3 버킷에 기밀 고객 데이터를 저장합니다. S3 버킷에 액세스하려면 여러 단계의 승인이 필요합니다.<br><br>이 회사는 AWS CLI를 사용하여 S3 버킷에 액세스하는 시점을 모니터링하려고 합니다. 또한 이 회사는 AWS 계정의 다른 모든 S3 버킷에서 다른 사용자가 수행하는 다양한 활동에 대한 통찰력을 얻어 문제를 감지하려고 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an AWS CloudTrail trail that is delivered to Amazon CloudWatch in each AWS account. Enable data events logs for all S3 buckets. Use Amazon GuardDuty for anomaly detection in all the AWS accounts. Use Amazon Athena to perform SQL queries on the custom metrics created from the CloudTrail logs.`, ko:`각 AWS 계정에서 Amazon CloudWatch에 전달되는 AWS CloudTrail 트레일을 만듭니다. 모든 S3 버킷에 대한 데이터 이벤트 로그를 활성화합니다. 모든 AWS 계정에서 Amazon GuardDuty를 사용하여 이상 탐지를 수행합니다. Amazon Athena를 사용하여 CloudTrail 로그에서 생성된 사용자 지정 메트릭에 대한 SQL 쿼리를 수행합니다.` },
    { k:'B', en:`Create an AWS CloudTrail organization trail that is delivered to Amazon CloudWatch in the Organizations management account. Enable data events logs for all S3 buckets. Use Amazon CloudWatch anomaly detection in all the AWS accounts. Use Amazon Athena to perform SQL queries on the custom metrics created from the CloudTrail logs.`, ko:`Organizations 관리 계정에서 Amazon CloudWatch에 전달되는 AWS CloudTrail 조직 트레일을 만듭니다. 모든 S3 버킷에 대한 데이터 이벤트 로그를 활성화합니다. 모든 AWS 계정에서 Amazon CloudWatch 이상 감지를 사용합니다. Amazon Athena를 사용하여 CloudTrail 로그에서 생성된 사용자 지정 메트릭에 대한 SQL 쿼리를 수행합니다.` },
    { k:'C', en:`Create an AWS CloudTrail organization trail that is delivered to Amazon CloudWatch in the Organizations management account. Enable data events logs for all S3 buckets. Use Amazon CloudWatch anomaly detection in all the AWS accounts. Use Amazon CloudWatch Metrics Insights to perform SQL queries on the custom metrics created from the CloudTrail logs.`, ko:`Organizations 관리 계정에서 Amazon CloudWatch에 전달되는 AWS CloudTrail 조직 트레일을 만듭니다. 모든 S3 버킷에 대한 데이터 이벤트 로그를 활성화합니다. 모든 AWS 계정에서 Amazon CloudWatch 이상 감지를 사용합니다. Amazon CloudWatch Metrics Insights를 사용하여 CloudTrail 로그에서 생성된 사용자 지정 메트릭에 대한 SQL 쿼리를 수행합니다.` },
    { k:'D', en:`Create an AWS CloudTrail trail that is delivered to Amazon CloudWatch in each AWS account. Enable data events logs for all S3 buckets. Use a custom solution for anomaly detection in all the AWS accounts. Use Amazon CloudWatch Metrics Insights to perform SQL queries on the custom metrics created from the CloudTrail logs.`, ko:`각 AWS 계정에서 Amazon CloudWatch에 전달되는 AWS CloudTrail 트레일을 만듭니다. 모든 S3 버킷에 대한 데이터 이벤트 로그를 활성화합니다. 모든 AWS 계정에서 이상 탐지를 위한 사용자 지정 솔루션을 사용합니다. Amazon CloudWatch Metrics Insights를 사용하여 CloudTrail 로그에서 생성된 사용자 지정 메트릭에 대한 SQL 쿼리를 수행합니다.` },
  ],
  answer: ['C'],
  vote: '75% C',
  explain: `<p><span class="mark-ok">✅ C — 조직 CloudTrail + CloudWatch 이상 감지 + CloudWatch Metrics Insights</span></p>
<p>조직 트레일을 사용하면 모든 계정의 로그를 중앙에서 관리합니다. CloudWatch 이상 감지(Anomaly Detection)는 자동으로 이상 패턴을 감지합니다. <strong>Amazon Athena는 S3 버킷 데이터만 쿼리할 수 있으며, CloudWatch 메트릭에는 SQL 쿼리를 수행할 수 없습니다.</strong> CloudWatch 메트릭에 SQL 쿼리를 수행하려면 CloudWatch Metrics Insights를 사용해야 합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 각 계정에 별도 트레일 생성은 관리 오버헤드가 높고, Athena는 CloudWatch 메트릭을 직접 쿼리할 수 없습니다.</p>
<p><span class="mark-no">❌ B</span> — B와 C의 차이: Athena는 CloudWatch 메트릭이 아닌 S3에 저장된 데이터만 쿼리합니다. CloudWatch 메트릭 쿼리에는 Metrics Insights를 사용해야 합니다.</p>
<p><span class="mark-no">❌ D</span> — 각 계정에 별도 트레일과 사용자 정의 이상 탐지는 관리 오버헤드가 높습니다.</p>`,
  disc: [{ ans:'C (75%)', txt:'핵심: Athena는 CloudWatch 메트릭 쿼리 불가. CloudWatch 메트릭 SQL 쿼리는 Metrics Insights가 필요합니다.' }]
},
{
  n: 290,
  en: `A DevOps team is deploying microservices for an application on an Amazon Elastic Kubernetes Service (Amazon EKS) cluster. The cluster uses managed node groups. The DevOps team wants to enable auto scaling for the microservice Pods based on a specific CPU utilization percentage. The DevOps team has already installed the Kubernetes Metrics Server on the cluster.<br><br>Which solution will meet these requirements in the MOST operationally efficient way?`,
  ko: `DevOps 팀은 Amazon Elastic Kubernetes Service(Amazon EKS) 클러스터에서 애플리케이션에 대한 마이크로서비스를 배포하고 있습니다. 클러스터는 관리형 노드 그룹을 사용합니다. DevOps 팀은 특정 CPU 사용률 백분율에 따라 마이크로서비스 Pod에 대한 자동 스케일링을 활성화하려고 합니다. DevOps 팀은 이미 클러스터에 Kubernetes Metrics Server를 설치했습니다.<br><br>어떤 솔루션이 가장 운영적으로 효율적인 방식으로 이러한 요구 사항을 충족합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Edit the Auto Scaling group that is associated with the worker nodes of the EKS cluster. Configure the Auto Scaling group to use a target tracking scaling policy to scale when the average CPU utilization of the Auto Scaling group reaches a specific percentage.`, ko:`EKS 클러스터의 워커 노드와 연관된 자동 확장 그룹을 편집합니다. 자동 확장 그룹의 평균 CPU 사용률이 특정 백분율에 도달하면 확장되도록 대상 추적 확장 정책을 사용하도록 자동 확장 그룹을 구성합니다.` },
    { k:'B', en:`Deploy the Kubernetes Horizontal Pod Autoscaler (HPA) and the Kubernetes Vertical Pod Autoscaler (VPA) in the cluster. Configure the HPA to scale based on the target CPU utilization percentage. Configure the VPA to use the recommender mode setting.`, ko:`클러스터에 Kubernetes Horizontal Pod Autoscaler(HPA)와 Kubernetes Vertical Pod Autoscaler(VPA)를 배포합니다. HPA를 구성하여 대상 CPU 사용률 백분율에 따라 확장합니다. VPA를 구성하여 추천자 모드 설정을 사용합니다.` },
    { k:'C', en:`Run the AWS Systems Manager AWS-UpdateEKSManagedNodeGroup Automation document. Modify the values for NodeGroupDesiredSize, NodeGroupMaxSize, and NodeGroupMinSize to be based on an estimate for the required node size.`, ko:`AWS Systems Manager AWS-UpdateEKSManagedNodeGroup Automation 문서를 실행합니다. NodeGroupDesiredSize, NodeGroupMaxSize 및 NodeGroupMinSize의 값을 필요한 노드 크기에 대한 추정치를 기반으로 수정합니다.` },
    { k:'D', en:`Deploy the Kubernetes Horizontal Pod Autoscaler (HPA) and the Kubernetes Cluster Autoscaler in the cluster. Configure the HPA to scale based on the target CPU utilization percentage. Configure the Cluster Autoscaler to use the auto-discovery setting.`, ko:`클러스터에 Kubernetes Horizontal Pod Autoscaler(HPA)와 Kubernetes Cluster Autoscaler를 배포합니다. HPA를 구성하여 대상 CPU 사용률 백분율에 따라 확장합니다. Cluster Autoscaler를 구성하여 자동 검색 설정을 사용합니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — HPA + Cluster Autoscaler(자동 검색)</span></p>
<p>Kubernetes HPA(Horizontal Pod Autoscaler)는 CPU 사용률 기반으로 Pod 수를 자동 조정합니다. Kubernetes Metrics Server가 이미 설치되어 있으므로 HPA가 바로 사용 가능합니다. Kubernetes Cluster Autoscaler(자동 검색 모드)는 Pod 수가 증가할 때 필요한 노드를 자동으로 EKS 관리형 노드 그룹에 추가합니다. 두 컴포넌트가 협력하여 Pod 수준과 노드 수준 자동 스케일링을 모두 처리합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — ASG의 CPU 기반 확장은 노드(EC2) 수를 늘리지만 Pod 수를 조정하지 않습니다. 마이크로서비스 Pod 자동 스케일링에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ B</span> — VPA(Vertical Pod Autoscaler)는 Pod의 CPU/메모리 리소스 요청을 조정하지 Pod 수를 늘리지 않습니다. 수평 스케일링과 용도가 다릅니다.</p>
<p><span class="mark-no">❌ C</span> — SSM 자동화 문서로 수동으로 노드 그룹 크기를 조정하는 것은 자동 스케일링이 아닙니다.</p>`,
  disc: [{ ans:'D (100%)', txt:'HPA(Pod 수평 확장) + Cluster Autoscaler(노드 자동 추가) 조합이 EKS 마이크로서비스 CPU 기반 자동 스케일링의 표준 솔루션입니다.' }]
},
{
  n: 291,
  en: `A company has multiple AWS accounts. The company uses AWS IAM Identity Center that is integrated with a third-party SAML 2.0 identity provider (IdP).<br><br>The attributes for access control feature is enabled in IAM Identity Center. The attribute mapping list maps the department key from the IdP to the <code>${'{'}path:enterprise.department{'}'}</code> attribute. All existing Amazon EC2 instances have a d1, d2, d3 department tag that corresponds to three company's departments.<br><br>A DevOps engineer must create policies based on the matching attributes. The policies must grant each user access to only the EC2 instances that are tagged with the user's respective department name.<br><br>Which condition key should the DevOps engineer include in the custom permissions policies to meet these requirements?`,
  ko: `회사에 여러 개의 AWS 계정이 있습니다. 이 회사는 타사 SAML 2.0 ID 공급자(IdP)와 통합된 AWS IAM Identity Center를 사용합니다.<br><br>액세스 제어 기능의 속성은 IAM Identity Center에서 활성화됩니다. 속성 매핑 목록은 IdP의 부서 키를 <code>${'{'}path:enterprise.department{'}'}</code> 속성에 매핑합니다. 모든 기존 Amazon EC2 인스턴스에는 회사의 세 부서에 해당하는 d1, d2, d3 부서 태그가 있습니다.<br><br>DevOps 엔지니어는 일치하는 속성을 기반으로 정책을 만들어야 합니다. 정책은 각 사용자에게 사용자의 해당 부서 이름으로 태그가 지정된 EC2 인스턴스에만 액세스 권한을 부여해야 합니다.<br><br>DevOps 엔지니어는 이러한 요구 사항을 충족하기 위해 사용자 지정 권한 정책에 어떤 조건 키를 포함해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Condition using aws:ResourceTag/department equals the static value "d1"`, ko:`aws:ResourceTag/department가 정적 값 "d1"과 같을 때 허용하는 조건` },
    { k:'B', en:`Condition using aws:RequestTag/department equals ${'{'}aws:PrincipalTag/department{'}'}`, ko:`aws:RequestTag/department가 <code>${'{'}aws:PrincipalTag/department{'}'}</code>와 같을 때 허용하는 조건` },
    { k:'C', en:`Condition using ec2:ResourceTag/department equals ${'{'}aws:PrincipalTag/department{'}'}`, ko:`ec2:ResourceTag/department가 <code>${'{'}aws:PrincipalTag/department{'}'}</code>와 같을 때 허용하는 조건` },
    { k:'D', en:`Condition using aws:PrincipalTag/department equals the static value "d1"`, ko:`aws:PrincipalTag/department가 정적 값 "d1"과 같을 때 허용하는 조건` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — ec2:ResourceTag/department = ${'{'}aws:PrincipalTag/department{'}'}</span></p>
<p>IAM Identity Center의 속성 기반 액세스 제어(ABAC)에서는 사용자 속성(PrincipalTag)과 리소스 태그(ResourceTag)를 비교하는 조건을 사용합니다.</p>
<ul style="margin-left:1.5em">
<li><code>ec2:ResourceTag/department</code>: EC2 인스턴스에 태그된 부서 값</li>
<li><code>${'{'}aws:PrincipalTag/department{'}'}</code>: IAM Identity Center를 통해 로그인한 사용자의 부서 속성(IdP에서 매핑된 값)</li>
</ul>
<p>두 값이 일치할 때만 EC2 인스턴스에 액세스를 허용합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A, D</span> — 정적 값을 사용하면 모든 부서에 적용되는 단일 정책을 만들 수 없습니다.</p>
<p><span class="mark-no">❌ B</span> — <code>aws:RequestTag</code>는 리소스 생성 시 태그를 제어하는 조건으로, 기존 리소스 접근 제어에는 적합하지 않습니다.</p>`,
  disc: [{ ans:'C (100%)', txt:'ABAC 패턴: ec2:ResourceTag/{키} = ${aws:PrincipalTag/{키}}로 사용자 속성과 리소스 태그를 동적으로 비교합니다.' }]
},
{
  n: 292,
  en: `A security team wants to use AWS CloudTrail to monitor all actions and API calls in multiple accounts that are in the same organization in AWS Organizations. The security team needs to ensure that account users cannot turn off CloudTrail in the accounts.<br><br>Which solution will meet this requirement?`,
  ko: `보안팀은 AWS CloudTrail을 사용하여 AWS Organizations에서 동일한 조직에 있는 여러 계정의 모든 작업과 API 호출을 모니터링하려고 합니다. 보안팀은 계정 사용자가 계정에서 CloudTrail을 끌 수 없도록 해야 합니다.<br><br>어떤 솔루션이 이 요구 사항을 충족합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Apply an SCP to all OUs to deny the cloudtrail:StopLogging action and the cloudtrail:DeleteTrail action.`, ko:`모든 OU에 SCP를 적용하여 cloudtrail:StopLogging 작업과 cloudtrail:DeleteTrail 작업을 거부합니다.` },
    { k:'B', en:`Create IAM policies in each account to deny the cloudtrail:StopLogging action and the cloudtrail:DeleteTrail action.`, ko:`각 계정에서 IAM 정책을 생성하여 cloudtrail:StopLogging 작업과 cloudtrail:DeleteTrail 작업을 거부합니다.` },
    { k:'C', en:`Set up Amazon CloudWatch alarms to notify the security team when a user disables CloudTrail in an account.`, ko:`사용자가 계정에서 CloudTrail을 비활성화하면 보안 팀에 알리기 위해 Amazon CloudWatch 알람을 설정합니다.` },
    { k:'D', en:`Use AWS Config to automatically re-enable CloudTrail if a user disables CloudTrail in an account.`, ko:`사용자가 계정에서 CloudTrail을 비활성화한 경우 AWS Config를 사용하여 CloudTrail을 자동으로 다시 활성화합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 모든 OU에 SCP 적용하여 StopLogging/DeleteTrail 거부</span></p>
<p>SCP(서비스 제어 정책)는 Organizations의 OU 또는 계정에 적용되며, 계정의 관리자 또는 IAM 관리자 역할을 가진 사용자도 제한할 수 있습니다. SCP로 cloudtrail:StopLogging과 cloudtrail:DeleteTrail을 Deny하면 계정 내 모든 사용자가 CloudTrail을 비활성화할 수 없습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — IAM 정책은 계정 내 사용자에게 적용되지만, 관리자가 해당 IAM 정책을 수정하거나 삭제할 수 있습니다. 관리자를 제한하지 못합니다.</p>
<p><span class="mark-no">❌ C</span> — 알람은 사전 예방적 제한이 아닌 사후 알림입니다.</p>
<p><span class="mark-no">❌ D</span> — Config는 비활성화를 감지한 후 수정하지만, 잠시 동안 CloudTrail이 꺼진 상태가 됩니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'SCP는 계정 관리자도 제한할 수 있는 강제 가드레일로, CloudTrail 비활성화를 사전에 방지하는 가장 효과적인 방법입니다.' }]
},
{
  n: 293,
  en: `A DevOps engineer needs to configure a blue/green deployment for an existing three-tier application. The application runs on Amazon EC2 instances and uses an Amazon RDS database. The EC2 instances run behind an Application Load Balancer (ALB) and are in an Auto Scaling group.<br><br>The DevOps engineer has created launch templates, Auto Scaling groups, and ALB target groups for the blue environment and the green environment. Each target group specifies which application version, blue or green, will be loaded on the EC2 instances. An Amazon Route 53 record for www.example.com points to the ALB.<br><br>The deployment must shift traffic all at once from the blue environment to the green environment.<br><br>Which solution will meet these requirements?`,
  ko: `DevOps 엔지니어는 기존 3계층 애플리케이션에 대한 블루/그린 배포를 구성해야 합니다. 애플리케이션은 Amazon EC2 인스턴스에서 실행되고 Amazon RDS 데이터베이스를 사용합니다. EC2 인스턴스는 ALB(Application Load Balancer) 뒤에서 실행되고 자동 확장 그룹에 있습니다.<br><br>DevOps 엔지니어는 블루 환경과 그린 환경에 대한 시작 템플릿, 자동 확장 그룹 및 ALB 대상 그룹을 만들었습니다. 각 대상 그룹은 EC2 인스턴스에 로드될 애플리케이션 버전(블루 또는 그린)을 지정합니다. www.example.com에 대한 Amazon Route 53 레코드는 ALB를 가리킵니다.<br><br>배포는 트래픽을 모두 블루 환경에서 그린 환경으로 한 번에 전환해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Start a rolling restart of the Auto Scaling group for the green environment to deploy the new application version to the green environment's EC2 instances. When the rolling restart is complete, use an AWS CLI command to update the ALB to send traffic to the green environment's target group.`, ko:`그린 환경의 자동 스케일링 그룹의 롤링 재시작을 시작하여 그린 환경의 EC2 인스턴스에 새 애플리케이션 버전을 배포합니다. 롤링 재시작이 완료되면 AWS CLI 명령을 사용하여 ALB를 업데이트하여 그린 환경의 대상 그룹으로 트래픽을 보냅니다.` },
    { k:'B', en:`Use an AWS CLI command to update the ALB to send traffic to the green environment's target group. Start a rolling restart of the Auto Scaling group for the green environment to deploy the new application version to the green environment's EC2 instances.`, ko:`AWS CLI 명령을 사용하여 ALB를 업데이트하여 트래픽을 그린 환경 대상 그룹으로 보냅니다. 그린 환경의 자동 확장 그룹의 롤링 재시작을 시작하여 그린 환경의 EC2 인스턴스에 새 애플리케이션 버전을 배포합니다.` },
    { k:'C', en:`Update the launch template to deploy the green environment's application version to the blue environment's EC2 instances. Do not change the target groups or the Auto Scaling groups in either environment. Perform a rolling restart of the blue environment's EC2 instances.`, ko:`시작 템플릿을 업데이트하여 그린 환경의 애플리케이션 버전을 블루 환경의 EC2 인스턴스에 배포합니다. 두 환경 모두에서 대상 그룹이나 자동 확장 그룹을 변경하지 마십시오. 블루 환경 EC2 인스턴스의 롤링 재시작을 수행합니다.` },
    { k:'D', en:`Start a rolling restart of the Auto Scaling group for the green environment to deploy the new application version to the green environment's EC2 instances. When the rolling restart is complete, update Route 53 to point to the green environment's endpoint on the ALB.`, ko:`그린 환경의 자동 확장 그룹의 롤링 재시작을 시작하여 그린 환경의 EC2 인스턴스에 새 애플리케이션 버전을 배포합니다. 롤링 재시작이 완료되면 Route 53을 업데이트하여 ALB에서 그린 환경의 엔드포인트를 가리킵니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 그린 환경 롤링 재시작 후 ALB 대상 그룹 전환</span></p>
<p>올바른 블루/그린 배포 순서:<br>
① 그린 환경의 ASG 롤링 재시작으로 새 버전 배포(그린 인스턴스가 준비됨)<br>
② 완료 후 ALB를 업데이트하여 트래픽을 그린 대상 그룹으로 일괄 전환<br>
이 순서로 그린 환경이 준비된 상태에서 트래픽을 한 번에 전환할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 그린 환경이 아직 새 버전으로 업데이트되기 전에 트래픽을 전환하면 사용자가 구 버전에 연결됩니다.</p>
<p><span class="mark-no">❌ C</span> — 블루/그린 배포의 장점을 활용하지 못하고 블루 환경을 직접 수정합니다.</p>
<p><span class="mark-no">❌ D</span> — Route 53 업데이트는 DNS TTL 문제로 즉각적인 트래픽 전환이 보장되지 않습니다. ALB 대상 그룹 전환이 더 빠르고 일관됩니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'블루/그린 배포: 그린 환경 준비 → ALB 대상 그룹 전환으로 한 번에 트래픽을 이동합니다.' }]
},
{
  n: 294,
  en: `A company has an application that runs on Amazon EC2 instances in an Auto Scaling group. The application processes a high volume of messages from an Amazon Simple Queue Service (Amazon SQS) queue.<br><br>A DevOps engineer noticed that the application took several hours to process a group of messages from the SQS queue. The average CPU utilization of the Auto Scaling group did not cross the threshold of a target tracking scaling policy when processing the messages. The application that processes the SQS queue publishes logs to Amazon CloudWatch Logs.<br><br>The DevOps engineer needs to ensure that the queue is processed quickly.<br><br>Which solution meets these requirements with the LEAST operational overhead?`,
  ko: `한 회사에는 Auto Scaling 그룹의 Amazon EC2 인스턴스에서 실행되는 애플리케이션이 있습니다. 이 애플리케이션은 Amazon Simple Queue Service(Amazon SQS) 대기열에서 대량의 메시지를 처리합니다.<br><br>DevOps 엔지니어는 애플리케이션이 SQS 대기열에서 메시지 그룹을 처리하는 데 몇 시간이 걸린다는 것을 알아챘습니다. 메시지를 처리할 때 Auto Scaling 그룹의 평균 CPU 사용률이 대상 추적 확장 정책의 임계값을 넘지 않았습니다. SQS 대기열을 처리하는 애플리케이션은 Amazon CloudWatch Logs에 로그를 게시합니다.<br><br>DevOps 엔지니어는 대기열이 빠르게 처리되도록 해야 합니다.<br><br>운영 오버헤드를 최소화하면서 이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an AWS Lambda function. Configure the Lambda function to publish a custom metric by using the ApproximateNumberOfMessagesVisible SQS queue attribute and the GroupInServiceInstances Auto Scaling group attribute to publish the queue messages for each instance. Schedule an Amazon EventBridge rule to run the Lambda function every hour. Create a target tracking scaling policy for the Auto Scaling group that uses the custom metric to scale in and out.`, ko:`AWS Lambda 함수를 만듭니다. ApproximateNumberOfMessagesVisible SQS 대기열 속성과 GroupInServiceInstances 자동 확장 그룹 속성을 사용하여 각 인스턴스에 대한 대기열 메시지를 게시하여 사용자 지정 메트릭을 게시하도록 Lambda 함수를 구성합니다. 매 시간 Lambda 함수를 실행하도록 Amazon EventBridge 규칙을 예약합니다. 사용자 지정 메트릭을 사용하여 확장 및 축소하는 자동 확장 그룹에 대한 대상 추적 확장 정책을 만듭니다.` },
    { k:'B', en:`Create an AWS Lambda function. Configure the Lambda function to publish a custom metric by using the ApproximateNumberOfMessagesVisible SQS queue attribute and the GroupInServiceInstances Auto Scaling group attribute to publish the queue messages for each instance. Create a CloudWatch subscription filter for the application logs with the Lambda function as the target. Create a target tracking scaling policy for the Auto Scaling group that uses the custom metric to scale in and out.`, ko:`AWS Lambda 함수를 만듭니다. ApproximateNumberOfMessagesVisible SQS 대기열 속성과 GroupInServiceInstances 자동 확장 그룹 속성을 사용하여 각 인스턴스에 대한 대기열 메시지를 게시하여 사용자 지정 메트릭을 게시하도록 Lambda 함수를 구성합니다. Lambda 함수를 대상으로 애플리케이션 로그에 대한 CloudWatch 구독 필터를 만듭니다. 사용자 지정 메트릭을 사용하여 확장 및 축소하는 자동 확장 그룹에 대한 대상 추적 확장 정책을 만듭니다.` },
    { k:'C', en:`Create a target tracking scaling policy for the Auto Scaling group. In the target tracking policy, use the ApproximateNumberOfMessagesVisible SQS queue attribute and the GroupInServiceInstances Auto Scaling group attribute to calculate how many messages are in the queue for each number of instances by using metric math. Use the calculated attribute to scale in and out.`, ko:`자동 확장 그룹에 대한 대상 추적 확장 정책을 만듭니다. 대상 추적 정책에서 ApproximateNumberOfMessagesVisible SQS 대기열 속성과 GroupInServiceInstances 자동 확장 그룹 속성을 사용하여 메트릭 수학을 사용하여 각 인스턴스 수에 대해 대기열에 있는 메시지 수를 계산합니다. 계산된 속성을 사용하여 확장 및 축소합니다.` },
    { k:'D', en:`Create an AWS Lambda function that logs the ApproximateNumberOfMessagesVisible attribute of the SQS queue to a CloudWatch Logs log group. Schedule an Amazon EventBridge rule to run the Lambda function every 5 minutes. Create a metric filter to count the number of log events from a CloudWatch logs group. Create a target tracking scaling policy for the Auto Scaling group that uses the custom metric to scale in and out.`, ko:`SQS 대기열의 ApproximateNumberOfMessagesVisible 속성을 CloudWatch Logs 로그 그룹에 로깅하는 AWS Lambda 함수를 만듭니다. 5분마다 Lambda 함수를 실행하도록 Amazon EventBridge 규칙을 예약합니다. CloudWatch 로그 그룹의 로그 이벤트 수를 계산하는 메트릭 필터를 만듭니다. 사용자 지정 메트릭을 사용하여 확장 및 축소하는 Auto Scaling 그룹에 대한 대상 추적 확장 정책을 만듭니다.` },

  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — 대상 추적 정책 + 메트릭 수학 (Lambda 불필요)</span></p>

{
  n: 295,
  en: `A company has a single AWS account that runs hundreds of Amazon EC2 instances in a single AWS Region. The company launches and terminates new EC2 instances every hour. The account includes existing EC2 instances that have been running for longer than a week.<br><br>The company's security policy requires all running EC2 instances to have an EC2 instance profile attached. The company has created a default EC2 instance profile. The default EC2 instance profile must be attached to any EC2 instances that do not have a profile attached.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사에는 단일 AWS 리전에서 수백 개의 Amazon EC2 인스턴스를 실행하는 단일 AWS 계정이 있습니다. 이 회사는 매시간 새로운 EC2 인스턴스를 시작하고 종료합니다. 이 계정에는 일주일 이상 실행된 기존 EC2 인스턴스가 포함됩니다.<br><br>이 회사의 보안 정책에 따라 실행 중인 모든 EC2 인스턴스에 EC2 인스턴스 프로필을 연결해야 합니다. 이 회사는 기본 EC2 인스턴스 프로필을 만들었습니다. 기본 EC2 인스턴스 프로필은 프로필이 연결되지 않은 모든 EC2 인스턴스에 연결해야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure an Amazon EventBridge rule that matches the Amazon EC2 RunInstances API calls. Configure the rule to invoke an AWS Lambda function to attach the default instance profile to the EC2 instances.`, ko:`Amazon EC2 RunInstances API 호출과 일치하는 Amazon EventBridge 규칙을 구성합니다. AWS Lambda 함수를 호출하여 기본 인스턴스 프로필을 EC2 인스턴스에 연결하도록 규칙을 구성합니다.` },

    { k:'C', en:`Configure an Amazon EventBridge rule that matches the Amazon EC2 StartInstances API calls. Configure the rule to invoke an AWS Systems Manager Automation runbook to attach the default instance profile to the EC2 instances.`, ko:`Amazon EC2 StartInstances API 호출과 일치하는 Amazon EventBridge 규칙을 구성합니다. AWS Systems Manager Automation 런북을 호출하여 기본 인스턴스 프로필을 EC2 인스턴스에 연결하도록 규칙을 구성합니다.` },
    { k:'D', en:`Configure AWS Config. Deploy an AWS Config iam-role-managed-policy-check managed rule. Configure an automatic remediation action that invokes an AWS Lambda function to attach the default instance profile to the EC2 instances.`, ko:`AWS Config를 구성합니다. AWS Config iam-role-managed-policy-check 관리 규칙을 배포합니다. 기본 인스턴스 프로필을 EC2 인스턴스에 연결하기 위해 AWS Lambda 함수를 호출하는 자동 수정 작업을 구성합니다.` },

  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — AWS Config ec2-instance-profile-attached 규칙 + SSM Automation 자동 수정</span></p>
<p>AWS Config의 <code>ec2-instance-profile-attached</code> 관리형 규칙은 인스턴스 프로필이 없는 EC2 인스턴스를 감지합니다. 자동 수정 액션으로 SSM Automation 런북을 실행하여 기본 프로필을 연결합니다. 이 솔루션은 신규 인스턴스(매시간 시작)뿐만 아니라 이미 실행 중인 기존 인스턴스(일주일 이상 실행)도 처리합니다.</p>`,

<p><span class="mark-no">❌ C</span> — StartInstances는 중지된 인스턴스를 재시작할 때의 이벤트로, 새로 시작되는 인스턴스를 모두 커버하지 못합니다.</p>

  disc: [{ ans:'B (100%)', txt:'AWS Config ec2-instance-profile-attached는 기존 인스턴스도 포함하여 모든 EC2 인스턴스를 지속적으로 모니터링하고 자동 수정합니다.' }]
},
{
  n: 296,
  en: `A company uses AWS Organizations to manage hundreds of AWS accounts. The company has a team that is responsible for AWS Identity and Access Management (IAM).<br><br>The IAM team wants to implement AWS IAM Identity Center. The IAM team must have only the minimum required permissions to manage IAM Identity Center. The IAM team must not be able to gain unnecessary access to the Organizations management account. The IAM team must be able to provision new IAM Identity Center permission sets and assignments for new and existing member accounts.<br><br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `한 회사가 AWS Organizations를 사용하여 수백 개의 AWS 계정을 관리합니다. 이 회사에는 AWS Identity and Access Management(IAM)를 담당하는 팀이 있습니다.<br><br>IAM 팀은 AWS IAM Identity Center를 구현하려고 합니다. IAM 팀은 IAM Identity Center를 관리하는 데 필요한 최소한의 권한만 있어야 합니다. IAM 팀은 Organizations 관리 계정에 불필요하게 액세스할 수 없어야 합니다. IAM 팀은 새 멤버 계정과 기존 멤버 계정에 대한 새 IAM Identity Center 권한 집합과 할당을 프로비저닝할 수 있어야 합니다.<br><br>이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Create a new AWS account for the IAM team. Enable IAM Identity Center in the new account. In the Organizations management account, register the new account as a delegated administrator for IAM Identity Center.`, ko:`IAM 팀을 위한 새 AWS 계정을 만듭니다. 새 계정에서 IAM Identity Center를 활성화합니다. Organizations 관리 계정에서 새 계정을 IAM Identity Center의 위임된 관리자로 등록합니다.` },

    { k:'C', en:`Create an SCP in Organizations. Create a new OU for the Organizations management account, and link the new SCP to the OU. Configure the SCP to deny all access to IAM Identity Center.`, ko:`Organizations에서 SCP를 만듭니다. Organizations 관리 계정에 대한 새 OU를 만들고 새 SCP를 OU에 연결합니다. SCP를 구성하여 IAM Identity Center에 대한 모든 액세스를 거부합니다.` },
    { k:'D', en:`Create IAM users and an IAM group for the IAM team in IAM Identity Center. Add the users to the group. Create a new permission set. Attach the AWSSSOMemberAccountAdministrator managed IAM policy to the group.`, ko:`IAM Identity Center에서 IAM 팀에 대한 IAM 사용자와 IAM 그룹을 만듭니다. 사용자를 그룹에 추가합니다. 새 권한 집합을 만듭니다. AWSSSOMemberAccountAdministrator 관리형 IAM 정책을 그룹에 연결합니다.` },
    { k:'E', en:`Assign the new permission set to the Organizations management account. Allow the IAM team's group to use the permission set.`, ko:`조직 관리 계정에 새 권한 집합을 할당합니다. IAM 팀의 그룹이 권한 집합을 사용하도록 허용합니다.` },
    { k:'F', en:`Assign the new permission set to the new AWS account. Allow the IAM team's group to use the permission set.`, ko:`새 AWS 계정에 새 권한 집합을 할당합니다. IAM 팀의 그룹이 권한 집합을 사용하도록 허용합니다.` },

  answer: ['B','D','F'],
  vote: '91% BDF',
  explain: `<p><span class="mark-ok">✅ B</span> — IAM Identity Center는 Organizations <strong>관리 계정에서 먼저 활성화</strong>해야 합니다. 그 후 IAM 팀의 새 계정을 위임된 관리자로 등록합니다.</p>

  disc: [{ ans:'BDF (91%)', txt:'Q270과 동일 유형. 핵심: 관리 계정에서 IAM IDC 활성화(B) + AWSSSOMemberAccountAdministrator(D) + 새 계정에 할당(F).' }]

{
  n: 297,
  en: `A company uses an Amazon Aurora PostgreSQL global database that has two secondary AWS Regions. A DevOps engineer has configured the database parameter group to guarantee an RPO of 60 seconds. Write operations on the primary cluster are occasionally blocked because of the RPO setting.<br><br>The DevOps engineer needs to reduce the frequency of blocked write operations.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사에서는 두 개의 보조 AWS 리전이 있는 Amazon Aurora PostgreSQL 글로벌 데이터베이스를 사용합니다. DevOps 엔지니어가 데이터베이스 매개변수 그룹을 구성하여 RPO를 60초로 보장했습니다. 기본 클러스터의 쓰기 작업은 RPO 설정으로 인해 가끔 차단됩니다.<br><br>DevOps 엔지니어는 차단된 쓰기 작업의 빈도를 줄여야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Add an additional secondary cluster to the global database.`, ko:`글로벌 데이터베이스에 보조 클러스터를 추가합니다.` },
    { k:'B', en:`Enable write forwarding for the global database.`, ko:`글로벌 데이터베이스에 대한 쓰기 전달을 활성화합니다.` },
    { k:'C', en:`Remove one of the secondary clusters from the global database.`, ko:`글로벌 데이터베이스에서 보조 클러스터 중 하나를 제거합니다.` },
    { k:'D', en:`Configure synchronous replication for the global database.`, ko:`글로벌 데이터베이스에 대한 동기 복제를 구성합니다.` },
  ],
  answer: ['C'],
  vote: '54% C',
  explain: `<p><span class="mark-ok">✅ C — 보조 클러스터 하나 제거</span></p>
<p>RPO 60초 설정은 기본 클러스터에서 보조 클러스터로의 복제 지연이 60초를 초과하면 쓰기를 차단합니다. 보조 클러스터가 많을수록 모든 클러스터에 복제해야 하므로 복제 오버헤드가 증가합니다. 보조 클러스터 하나를 제거하면 복제 대상이 줄어들어 복제 지연이 감소하고, 쓰기 차단 빈도가 줄어듭니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 보조 클러스터를 추가하면 복제 오버헤드가 더 증가하여 차단이 더 빈번해집니다.</p>
<p><span class="mark-no">❌ B</span> — 쓰기 전달(Write Forwarding)은 보조 클러스터에서 기본 클러스터로 쓰기를 전달하는 기능으로, 기본 클러스터의 쓰기 차단과 무관합니다.</p>
<p><span class="mark-no">❌ D</span> — 동기 복제는 모든 클러스터가 동기화될 때까지 쓰기를 차단하므로 차단 빈도가 오히려 증가합니다.</p>`,
  disc: [{ ans:'C (54%) vs B (31%)', txt:'핵심: RPO로 인한 쓰기 차단은 복제 지연 때문입니다. 보조 클러스터를 줄이면 복제 오버헤드가 감소하여 차단 빈도가 줄어듭니다.' }]
