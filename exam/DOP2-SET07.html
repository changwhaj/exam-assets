{
  n: 346,
  en: `A DevOps team supports an application that runs on a large number of Amazon EC2 instances in an Auto Scaling group. The DevOps team uses AWS CloudFormation to deploy the EC2 instances. The application recently experienced an issue. A single instance returned errors to a large percentage of requests. The EC2 instance responded as healthy to both Amazon EC2 and Elastic Load Balancing health checks.<br>The DevOps team collects application logs in Amazon CloudWatch by using the embedded metric format. The DevOps team needs to receive an alert if any EC2 instance is responsible for more than half of all errors.<br>Which combination of steps will meet these requirements with the LEAST operational overhead? (Choose two.)`,
  ko: `DevOps 팀은 Auto Scaling 그룹의 많은 수의 Amazon EC2 인스턴스에서 실행되는 애플리케이션을 지원합니다. DevOps 팀은 AWS CloudFormation을 사용하여 EC2 인스턴스를 배포합니다. 최근 단일 인스턴스에서 많은 비율의 요청에 오류가 반환되었습니다. EC2와 ELB 상태 검사 모두에서 정상으로 응답했습니다.<br>DevOps 팀은 임베디드 메트릭 형식을 사용하여 Amazon CloudWatch에서 애플리케이션 로그를 수집합니다. 모든 오류의 절반 이상을 담당하는 EC2 인스턴스가 있는 경우 알림을 받아야 합니다.<br>가장 적은 운영 오버헤드로 이 요구 사항을 충족하는 단계 조합은 무엇입니까? (2개 선택)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Create a CloudWatch Contributor Insights rule that groups logs from the CloudWatch application logs based on instance ID and errors.`, ko:`인스턴스 ID와 오류를 기준으로 CloudWatch 애플리케이션 로그의 로그를 그룹화하는 CloudWatch Contributor Insights 규칙을 생성합니다.` },
    { k:'B', en:`Create a resource group in AWS Resource Groups. Use the CloudFormation stack to group the resources for the application. Add the application to CloudWatch Application Insights. Use the resource group to identify the application.`, ko:`AWS Resource Groups에서 리소스 그룹을 생성합니다. CloudFormation 스택을 사용하여 애플리케이션의 리소스를 그룹화합니다. 애플리케이션을 CloudWatch Application Insights에 추가합니다. 리소스 그룹을 사용하여 애플리케이션을 식별합니다.` },
    { k:'C', en:`Create a metric filter for the application logs to count the occurrence of the term "Error." Create a CloudWatch alarm that uses the METRIC_COUNT function to determine whether errors have occurred. Configure the CloudWatch alarm to send a notification to an Amazon Simple Notification Service (Amazon SNS) topic to notify the DevOps team.`, ko:`애플리케이션 로그에 대한 메트릭 필터를 생성하여 "Error"라는 용어의 발생 횟수를 계산합니다. METRIC_COUNT 함수를 사용하는 CloudWatch 알람을 생성하여 오류가 발생했는지 여부를 확인합니다. DevOps 팀에 알리기 위해 Amazon SNS 토픽에 알림을 보내도록 CloudWatch 알람을 구성합니다.` },
    { k:'D', en:`Create a CloudWatch alarm that uses the INSIGHT_RULE_METRIC function to determine whether a specific instance is responsible for more than half of all errors reported by EC2 instances. Configure the CloudWatch alarm to send a notification to an Amazon Simple Notification Service (Amazon SNS) topic to notify the DevOps team.`, ko:`INSIGHT_RULE_METRIC 함수를 사용하여 특정 인스턴스가 EC2 인스턴스에서 보고된 모든 오류의 절반 이상을 담당하는지 여부를 확인하는 CloudWatch 알람을 생성합니다. DevOps 팀에 알리기 위해 Amazon SNS 토픽에 알림을 보내도록 CloudWatch 알람을 구성합니다.` },
    { k:'E', en:`Create a CloudWatch subscription filter for the application logs that filters for errors and invokes an AWS Lambda function. Configure the Lambda function to send the instance ID and error and in a notification to an Amazon Simple Notification Service (Amazon SNS) topic to notify the DevOps team.`, ko:`오류를 필터링하고 AWS Lambda 함수를 호출하는 애플리케이션 로그에 대한 CloudWatch 구독 필터를 생성합니다. Lambda 함수를 구성하여 인스턴스 ID와 오류를 Amazon SNS 토픽에 알림으로 보내 DevOps 팀에 알립니다.` },
  ],
  answer: ['A','D'],
  vote: '100% AD',
  explain: `<p><span class="mark-ok">✅ A — CloudWatch Contributor Insights 규칙</span></p><p>Contributor Insights는 CloudWatch 로그를 분석하여 인스턴스 ID 등의 차원별로 오류를 집계합니다. 가장 많은 오류를 기여하는 EC2 인스턴스를 식별합니다.</p><p><span class="mark-ok">✅ D — INSIGHT_RULE_METRIC 함수 기반 CloudWatch 알람</span></p><p>Contributor Insights 규칙 메트릭을 기반으로 특정 인스턴스가 전체 오류의 50% 이상을 담당하는지 확인하고 SNS로 알림을 전송합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — Application Insights는 개별 인스턴스별 오류 기여도를 분석하는 도구가 아닙니다.</p><p><span class="mark-no">❌ C</span> — METRIC_COUNT는 총 오류 수를 계산하지만 인스턴스별 오류 비율을 계산하지 않습니다.</p><p><span class="mark-no">❌ E</span> — Lambda 구독 필터는 불필요한 복잡성을 추가합니다.</p>`,
  disc: [{ ans:'AD (100%)', txt:'Contributor Insights로 인스턴스별 오류 집계 + INSIGHT_RULE_METRIC으로 50% 이상 기여 인스턴스 알람이 최적 솔루션입니다.' }]
},
{
  n: 347,
  en: `A company is using AWS CloudFormation to perform deployments of its application environment. A deployment failed during a recent update to the existing CloudFormation stack. A DevOps engineer discovered that some resources in the stack were manually modified.<br>The DevOps engineer needs a solution that detects manual modification of resources and sends an alert to the DevOps lead.<br>Which solution will meet these requirements with the LEAST operational effort?`,
  ko: `한 회사가 AWS CloudFormation을 사용하여 애플리케이션 환경의 배포를 수행하고 있습니다. 기존 CloudFormation 스택을 최근에 업데이트하는 동안 배포가 실패했습니다. DevOps 엔지니어가 스택의 일부 리소스가 수동으로 수정되었음을 발견했습니다.<br>DevOps 엔지니어는 리소스의 수동 수정을 감지하고 DevOps 리드에게 알림을 보내는 솔루션이 필요합니다.<br>최소한의 운영 노력으로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an Amazon Simple Notification Service (Amazon SNS) topic. Subscribe the DevOps lead to the topic by using an email address. Create an AWS Config managed rule that has the CLOUDFORMATION_STACK_DRIFT_DETECTION_CHECK identifier. Create an Amazon EventBridge rule that is invoked on the NON_COMPLIANT resources status. Set the SNS topic as the rule target.`, ko:`Amazon SNS 토픽을 생성합니다. 이메일 주소를 사용하여 DevOps 리드를 토픽에 구독합니다. CLOUDFORMATION_STACK_DRIFT_DETECTION_CHECK 식별자가 있는 AWS Config 관리 규칙을 생성합니다. NON_COMPLIANT 리소스 상태에서 호출되는 Amazon EventBridge 규칙을 생성합니다. SNS 토픽을 규칙 대상으로 설정합니다.` },
    { k:'B', en:`Tag all CloudFormation resources with a specific tag. Create an AWS Config custom rule by using the AWS Config Rules Development Kit Library (RDKlib) that checks all resource changes that have the specific tag. Configure the custom rule to mark all the tagged resource changes as NON_COMPLIANT when the change is not performed by CloudFormation. Create an Amazon EventBridge rule that is invoked on the NON_COMPLIANT resources status. Create an AWS Lambda function that sends an email message to the DevOps lead. Set the Lambda function as the rule target.`, ko:`모든 CloudFormation 리소스에 특정 태그를 지정합니다. 특정 태그가 있는 모든 리소스 변경 사항을 확인하는 AWS Config 사용자 지정 규칙을 RDKlib를 사용하여 생성합니다. Lambda 함수를 규칙 대상으로 설정합니다.` },
    { k:'C', en:`Create an Amazon Simple Notification Service (Amazon SNS) topic. Subscribe the DevOps lead to the topic by using an email address. Create an AWS Config managed rule that has the CLOUDFORMATION_STACK_DRIFT_DETECTION_CHECK identifier. Create an Amazon EventBridge rule that is invoked on the COMPLIANT resources status. Set the SNS topic as the rule target.`, ko:`Amazon SNS 토픽을 생성합니다. 이메일 주소를 사용하여 DevOps 리드를 토픽에 구독합니다. CLOUDFORMATION_STACK_DRIFT_DETECTION_CHECK 식별자가 있는 AWS Config 관리 규칙을 생성합니다. COMPLIANT 리소스 상태에서 호출되는 Amazon EventBridge 규칙을 생성합니다. SNS 토픽을 규칙 대상으로 설정합니다.` },
    { k:'D', en:`Create an AWS Config managed rule that has the CLOUDFORMATION_STACK_DRIFT_DETECTION_CHECK identifier. Create an Amazon EventBridge rule that is invoked on the NON_COMPLIANT resources status. Create an AWS Lambda function that sends an email message to the DevOps lead. Set the Lambda function as the rule target.`, ko:`CLOUDFORMATION_STACK_DRIFT_DETECTION_CHECK 식별자가 있는 AWS Config 관리 규칙을 생성합니다. NON_COMPLIANT 리소스 상태에서 호출되는 Amazon EventBridge 규칙을 생성합니다. DevOps 리드에게 이메일 메시지를 보내는 AWS Lambda 함수를 생성합니다. Lambda 함수를 규칙 대상으로 설정합니다.` },
  ],
  answer: ['A'],
  vote: '93% A',
  explain: `<p><span class="mark-ok">✅ A — Config CLOUDFORMATION_STACK_DRIFT_DETECTION_CHECK + EventBridge NON_COMPLIANT + SNS</span></p><p>CLOUDFORMATION_STACK_DRIFT_DETECTION_CHECK는 CloudFormation 관리 리소스의 드리프트(수동 변경)를 자동으로 감지합니다. NON_COMPLIANT 상태에서 EventBridge 규칙을 통해 SNS로 알림을 전송합니다. Lambda 없이 SNS 직접 연결이 더 간단합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 사용자 지정 Config 규칙과 Lambda 알림은 관리형 규칙 + SNS보다 복잡합니다.</p><p><span class="mark-no">❌ C</span> — COMPLIANT 상태에서 알림을 보내는 것은 잘못된 설정입니다. 드리프트(NON_COMPLIANT)를 감지해야 합니다.</p><p><span class="mark-no">❌ D</span> — Lambda로 이메일을 보내는 것은 SNS 직접 사용보다 복잡합니다.</p>`,
  disc: [{ ans:'A (93%)', txt:'AWS 관리형 드리프트 감지 규칙 + EventBridge + SNS의 조합이 최소 오버헤드로 수동 변경을 감지하고 알림을 전송합니다.' }]
},
{
  n: 348,
  en: `A DevOps engineer deployed multiple AWS accounts by using AWS Control Tower to support different business, technical, and administrative units in a company. A security team needs the DevOps engineer to automate AWS Control Tower guardrails for the company. The guardrails must be applied to all accounts in an OU of the company's organization in AWS Organizations.<br>The security team needs a solution that has version control and can be reviewed and rolled back if necessary. The security team will maintain the management of the solution in its OU. The security team wants to limit the type of guardrails that are allowed and allow only new guardrails that are approved by the security team.<br>Which solution will meet these requirements with the MOST operational efficiency?`,
  ko: `DevOps 엔지니어가 AWS Control Tower를 사용하여 회사의 다양한 비즈니스, 기술 및 관리 부서를 지원하기 위해 여러 AWS 계정을 배포했습니다. 보안 팀은 DevOps 엔지니어가 회사의 AWS Control Tower 가드레일을 자동화해야 합니다. 가드레일은 AWS Organizations에서 회사 조직의 OU에 있는 모든 계정에 적용해야 합니다.<br>보안 팀은 버전 제어가 가능하고 필요한 경우 검토 및 롤백이 가능한 솔루션이 필요합니다. 보안 팀은 OU에서 솔루션 관리를 유지합니다. 보안 팀은 허용되는 가드레일 유형을 제한하고 보안 팀이 승인한 새 가드레일만 허용하려 합니다.<br>가장 높은 운영 효율성으로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create individual AWS CloudFormation templates that align to a guardrail. Store the templates in an AWS CodeCommit repository. Create an AWS::ControlTower::EnableControl logical resource in the template for each OU in the organization. Configure an AWS CodeBuild project that an Amazon EventBridge rule will invoke for the security team's AWS CodeCommit changes.`, ko:`가드레일에 맞춰 개별 AWS CloudFormation 템플릿을 생성합니다. AWS CodeCommit 리포지토리에 템플릿을 저장합니다. 조직의 각 OU에 대한 템플릿에서 AWS::ControlTower::EnableControl 논리적 리소스를 생성합니다. 보안 팀의 AWS CodeCommit 변경 사항에 대해 Amazon EventBridge 규칙이 호출하는 AWS CodeBuild 프로젝트를 구성합니다.` },
    { k:'B', en:`Create individual AWS CloudFormation templates that align to a guardrail. Store the templates in an AWS CodeCommit repository. Create an AWS::ControlTower::EnableControl logical resource in the template for each account in the organization. Configure an AWS CodePipeline pipeline in the security team's account. Advise the security team to invoke the pipeline and provide these parameters when starting the pipeline.`, ko:`각 조직 계정에 대한 템플릿에서 논리적 리소스를 생성합니다. 보안 팀의 계정에서 AWS CodePipeline 파이프라인을 구성합니다. 보안 팀이 파이프라인을 호출하도록 권고합니다.` },
    { k:'C', en:`Create individual AWS CloudFormation templates that align to a guardrail. Store the templates in an AWS CodeCommit repository. Create an AWS::ControlTower::EnableControl logical resource in the template for each OU in the organization. Configure an AWS CodePipeline pipeline in the security team's account that an Amazon EventBridge rule will invoke for the security team's CodeCommit changes.`, ko:`가드레일에 맞춰 개별 AWS CloudFormation 템플릿을 생성합니다. AWS CodeCommit 리포지토리에 템플릿을 저장합니다. 조직의 각 OU에 대한 템플릿에서 AWS::ControlTower::EnableControl 논리적 리소스를 생성합니다. 보안 팀의 계정에서 Amazon EventBridge 규칙이 보안 팀의 CodeCommit 변경 사항에 대해 호출할 AWS CodePipeline 파이프라인을 구성합니다.` },
    { k:'D', en:`Configure an AWS CodePipeline pipeline in the security team's account that an Amazon EventBridge rule will invoke for PutObject events to an Amazon S3 bucket. Create individual AWS CloudFormation templates that align to a guardrail. Store the templates in the S3 bucket. Create an AWS::ControlTower::EnableControl logical resource in the template for each OU in the organization.`, ko:`S3 버킷에 대한 PutObject 이벤트에 대해 Amazon EventBridge 규칙이 호출하는 AWS CodePipeline 파이프라인을 구성합니다. 가드레일에 맞춰 개별 AWS CloudFormation 템플릿을 생성합니다. 템플릿을 S3 버킷에 저장합니다. 조직의 각 OU에 대해 템플릿에서 AWS::ControlTower::EnableControl 논리적 리소스를 생성합니다.` },
  ],
  answer: ['C'],
  vote: '78% C',
  explain: `<p><span class="mark-ok">✅ C — CloudFormation 템플릿 + CodeCommit + CodePipeline + EventBridge 트리거</span></p><p>CodeCommit으로 버전 관리(검토 및 롤백 가능), CodePipeline으로 CI/CD 자동화, EventBridge로 코드 변경 시 자동 배포. 보안 팀이 CodeCommit에서 코드 변경을 통해 승인된 가드레일만 배포하는 통제 메커니즘을 유지합니다. A와의 차이: A는 CodeBuild만 사용하여 전체 파이프라인(승인 게이트 등)이 없습니다.</p>`,

{
  n: 349,
  en: `A company runs a web application on Amazon Elastic Kubernetes Service (Amazon EKS). The company uses Amazon CloudFront to distribute the application. The company recently enabled AWS WAF. The company set up Amazon CloudWatch Logs to send logs to an aws-waf-logs log group.<br>The company wants a DevOps engineer to receive alerts if there are sudden changes in blocked traffic. The company does not want to receive alerts for other changes in AWS WAF log behavior. The company will tune AWS WAF rules over time.<br>The DevOps engineer is currently subscribed to an Amazon Simple Notification Service (Amazon SNS) topic in the environment.<br>Which solution will meet these requirements?`,
  ko: `한 회사가 Amazon EKS에서 웹 애플리케이션을 실행합니다. 회사는 Amazon CloudFront를 사용하여 애플리케이션을 배포합니다. 회사는 최근 AWS WAF를 활성화했습니다. 회사는 Amazon CloudWatch Logs를 설정하여 aws-waf-logs 로그 그룹으로 로그를 전송합니다.<br>회사는 차단된 트래픽에 갑작스러운 변화가 있는 경우 DevOps 엔지니어가 알림을 받길 원합니다. 회사는 AWS WAF 로그 동작의 다른 변화에 대한 알림을 받고 싶어하지 않습니다. 회사는 시간이 지남에 따라 AWS WAF 규칙을 조정할 것입니다.<br>DevOps 엔지니어는 현재 환경에서 Amazon SNS 토픽을 구독하고 있습니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a CloudWatch Logs metrics filter for blocked requests on the AWS WAF log group to create a custom metric. Create a CloudWatch alarm by using CloudWatch anomaly detection and the published custom metric. Configure the alarm to notify the SNS topic to alert the DevOps engineer.`, ko:`AWS WAF 로그 그룹에서 차단된 요청에 대한 CloudWatch Logs 메트릭 필터를 생성하여 사용자 지정 메트릭을 생성합니다. CloudWatch 이상 탐지와 게시된 사용자 지정 메트릭을 사용하여 CloudWatch 알람을 생성합니다. DevOps 엔지니어에게 경고하도록 SNS 토픽에 알림을 보내도록 알람을 구성합니다.` },
    { k:'B', en:`Create a CloudWatch anomaly detector for the log group. Create a CloudWatch alarm by using metrics that the CloudWatch anomaly detector publishes. Use the high setting for the LogAnomalyPriority metric. Configure the alarm to go into alarm state if a static threshold of one anomaly is detected. Configure the alarm to notify the SNS topic to alert the DevOps engineer.`, ko:`로그 그룹에 대한 CloudWatch 이상 감지기를 생성합니다. CloudWatch 이상 감지기가 게시하는 메트릭을 사용하여 CloudWatch 알람을 생성합니다. LogAnomalyPriority 메트릭에 대해 높은 설정을 사용합니다. 정적 임계값인 이상 하나가 감지되면 알람이 알람 상태로 전환되도록 구성합니다.` },
    { k:'C', en:`Create a CloudWatch metrics filter for counted requests on the AWS WAF log group to create a custom metric. Create a CloudWatch alarm that activates when the sum of blocked requests in the custom metric during a period of 1 hour is greater than a static estimate for the acceptable number of blocked requests in 1 hour. Configure the alarm to notify the SNS topic to alert the DevOps engineer.`, ko:`AWS WAF 로그 그룹에서 계산된 요청에 대한 CloudWatch 메트릭 필터를 생성하여 사용자 지정 메트릭을 생성합니다. 1시간 동안 차단된 요청의 합계가 정적 추정치보다 클 때 활성화되는 CloudWatch 알람을 생성합니다.` },
    { k:'D', en:`Create a CloudWatch anomaly detector for the log group. Create a CloudWatch alarm by using metrics that the CloudWatch anomaly detector publishes. Use the medium setting for the LogAnomalyPriority metric. Configure the alarm to go into alarm state if a sum of anomalies over 1 hour is greater than an expected value. Configure the alarm to notify the SNS topic to alert the DevOps engineer.`, ko:`로그 그룹에 대한 CloudWatch 이상 탐지기를 생성합니다. CloudWatch 이상 탐지기가 게시하는 메트릭을 사용하여 CloudWatch 알람을 생성합니다. LogAnomalyPriority 메트릭에 대해 medium 설정을 사용합니다. 1시간 동안 이상 탐지의 합이 예상 값보다 클 경우 알람이 알람 상태로 전환되도록 구성합니다.` },

  vote: '91% A',
  explain: `<p><span class="mark-ok">✅ A — 차단된 요청 메트릭 필터 + CloudWatch 이상 탐지 알람 + SNS</span></p><p>차단된 요청만을 필터링하는 메트릭 필터를 생성하여 다른 WAF 로그 동작에 대한 알림은 받지 않습니다. CloudWatch 이상 탐지는 WAF 규칙이 시간이 지남에 따라 조정되더라도 동적 기준선을 자동으로 조정하므로 정적 임계값 대신 적응형 모니터링이 가능합니다.</p>`,

  disc: [{ ans:'A (91%)', txt:'차단된 요청에만 초점을 맞춘 메트릭 필터와 이상 탐지 조합이 WAF 규칙 조정에도 적응 가능한 솔루션입니다.' }]
},
{

  choices: [

    { k:'B', en:`Implement an authorization token check in CloudFront Functions. Enable CloudWatch logging for the CloudFront function. Attach the CloudFront function to the CloudFront distribution. Implement CloudFront continuous deployment to perform updates.`, ko:`CloudFront Functions에서 권한 부여 토큰 확인을 구현합니다. CloudFront 함수에 대한 CloudWatch 로깅을 활성화합니다. CloudFront 함수를 CloudFront 배포에 연결합니다. CloudFront 지속적 배포를 구현하여 업데이트를 수행합니다.` },
    { k:'C', en:`Implement an authorization token check in the application code that is installed on the EC2 instances. Install the CloudWatch agent on the EC2 instances. Configure the application to log to the CloudWatch agent. Implement a second CloudFront distribution. Migrate the traffic from the first CloudFront distribution by using Amazon Route 53 weighted routing.`, ko:`EC2 인스턴스에 설치된 애플리케이션 코드에서 권한 부여 토큰 확인을 구현합니다. EC2 인스턴스에 CloudWatch 에이전트를 설치합니다. CloudWatch 에이전트에 로깅하도록 애플리케이션을 구성합니다. 두 번째 CloudFront 배포를 구현합니다. Amazon Route 53 가중치 라우팅을 사용하여 첫 번째 CloudFront 배포에서 트래픽을 마이그레이션합니다.` },
    { k:'D', en:`Implement an authorization token check in CloudFront Functions. Enable CloudWatch logging for the CloudFront function. Attach the CloudFront function to the CloudFront distribution. Implement a second CloudFront distribution. Migrate the traffic from the first CloudFront distribution by using Amazon Route 53 weighted routing.`, ko:`CloudFront Functions에서 권한 부여 토큰 확인을 구현합니다. CloudFront 함수에 대한 CloudWatch 로깅을 활성화합니다. CloudFront 함수를 CloudFront 배포에 연결합니다. 두 번째 CloudFront 배포를 구현합니다. Amazon Route 53 가중치 라우팅을 사용하여 첫 번째 CloudFront 배포에서 트래픽을 마이그레이션합니다.` },
  ],
  answer: ['B'],

  wrong: `<p><span class="mark-no">❌ A</span> — Lambda@Edge는 복잡한 로직에 적합하지만 운영 오버헤드가 더 높습니다. CloudFront Functions가 더 간단합니다.</p><p><span class="mark-no">❌ C</span> — EC2에서 토큰 검증은 서버리스 접근 방식보다 운영 오버헤드가 높습니다.</p><p><span class="mark-no">❌ D</span> — 두 번째 CloudFront 배포와 Route 53 가중치 라우팅은 불필요한 복잡성을 추가합니다. CloudFront 지속적 배포가 더 간단합니다.</p>`,
  disc: [{ ans:'B (62%) vs A (38%)', txt:'CloudFront Functions이 Lambda@Edge보다 간단하고 운영 오버헤드가 낮으며 CloudFront 지속적 배포로 롤링 업데이트가 가능합니다.' }]
},

// ────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────
let curQ = 0;
let state = QS.map(() => ({ sel: [], done: false }));
let curLang = 'ko';

// ────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────
function init() {
  buildSelect();
  renderQ(0);
  // 현재 SET 번호를 콤보박스에 반영
  syncSetSelect();
}

function syncSetSelect() {
  const fileName = window.location.pathname.split('/').pop();
  const match = fileName.match(/set(\d{2})/i);
  if (match) {
    document.getElementById('set-select').value = match[1];
  }
}

function buildSelect() {
  const sel = document.getElementById('q-select');
  sel.innerHTML = '';
  QS.forEach((q, i) => {
    const opt = document.createElement('option');
    opt.value = q.n;
    opt.textContent = `Q${String(q.n).padStart(3,'0')}`;
    sel.appendChild(opt);
  });
}

function updateSelectStatus() {
  const sel = document.getElementById('q-select');
  Array.from(sel.options).forEach((opt, i) => {
    const s = state[i];
    const q = QS[i];
    opt.className = '';
    if (s.done) {
      const correct = arraysEqual(s.sel.slice().sort(), q.answer.slice().sort());
      opt.textContent = `Q${String(q.n).padStart(3,'0')} ${correct ? '✓' : '✗'}`;
      opt.className = correct ? 'opt-correct' : 'opt-wrong';
    } else {
      opt.textContent = `Q${String(q.n).padStart(3,'0')}`;
    }
  });
  sel.selectedIndex = curQ;
}

// ────────────────────────────────────────────────
// RENDER
// ────────────────────────────────────────────────
function renderQ(idx) {
  if (idx < 0 || idx >= QS.length) return;
  curQ = idx;
  const q = QS[idx];
  const s = state[idx];

  // counter / progress
  document.getElementById('progress-fill').style.width = `${((idx+1)/QS.length)*100}%`;
  document.getElementById('q-num-badge').textContent = String(q.n).padStart(3,'0');

  // type badge
  const tb = document.getElementById('q-type-badge');
  if (q.type === 'multi') {
    tb.textContent = `복수 선택 (${q.multiCount}개)`;
    tb.className = 'q-type-badge multi';
  } else {
    tb.textContent = '단일 선택';
    tb.className = 'q-type-badge';
  }

  // question text
  document.getElementById('q-ko-text').innerHTML = q.ko;
  document.getElementById('q-en-text').innerHTML = q.en;

  // choices label
  document.getElementById('choices-label').textContent =
    q.type === 'multi' ? `선택지 — ${q.multiCount}개 선택` : '선택지 — 단일 선택';

  // choices
  const cc = document.getElementById('choices-container');
  cc.innerHTML = '';
  q.choices.forEach(ch => {
    const div = document.createElement('div');
    let cls = 'choice';
    if (s.done) {
      cls += ' disabled';
      if (q.answer.includes(ch.k)) cls += ' correct';
      else if (s.sel.includes(ch.k)) cls += ' wrong';
    } else if (s.sel.includes(ch.k)) {
      cls += ' selected';
    }
    div.className = cls;
    div.id = `choice-${idx}-${ch.k}`;

    let icon = '';
    if (s.done) {
      if (q.answer.includes(ch.k)) icon = '✓';
      else if (s.sel.includes(ch.k)) icon = '✗';
    }

    div.innerHTML = `
      <div class="choice-key">${ch.k}</div>
      <div class="choice-body">
        <div class="choice-text">${ch.ko}</div>
        <div class="choice-en">${ch.en}</div>
      </div>
      <div class="result-icon">${icon}</div>`;

    if (!s.done) div.onclick = () => doSelect(idx, ch.k);
    cc.appendChild(div);
    document.getElementById('btn-prev-top').disabled = idx === 0;
    document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
  });

  applyLang(curLang);

  // review button
  document.getElementById('btn-review').disabled = s.done || s.sel.length === 0;

  // hint
  const hint = document.getElementById('hint-text');
  if (s.done) {
    const correct = arraysEqual(s.sel.slice().sort(), q.answer.slice().sort());
    hint.textContent = correct ? '🎉 정답입니다!' : `❌ 오답입니다. 정답은 ${q.answer.join(', ')} 입니다.`;
  } else if (s.sel.length > 0) {
    const remaining = q.type === 'multi' ? q.multiCount - s.sel.length : 0;
    if (q.type === 'multi' && remaining > 0) {
      hint.textContent = `${s.sel.join(', ')}번 선택됨. ${remaining}개 더 선택하세요.`;
    } else {
      hint.textContent = `${s.sel.join(', ')}번을 선택했습니다. 정답 확인 버튼을 눌러주세요.`;
    }
  } else {
    hint.textContent = '선택지를 클릭하면 정답 확인 버튼이 활성화됩니다.';
  }

  // review panel
  const rp = document.getElementById('review-panel');
  if (s.done) { renderReview(q); rp.classList.add('show'); }
  else rp.classList.remove('show');

  // nav buttons
  document.getElementById('btn-prev-top').disabled = idx === 0;
  document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
  // document.getElementById('nav-info').textContent = `${idx+1} / ${QS.length} 문제`;

  // select 동기화
  updateSelectStatus();
}

function renderReview(q) {
  document.getElementById('review-answer-badge').textContent = '✓ ' + q.answer.join(', ');
  document.getElementById('review-vote-badge').innerHTML = `커뮤니티 투표 <span>${q.vote}</span>`;
  document.getElementById('review-explain').innerHTML = q.explain;

  const ws = document.getElementById('review-wrong');
  const wt = document.getElementById('wrong-section-title');
  if (q.wrong) { ws.innerHTML = q.wrong; ws.style.display=''; wt.style.display=''; }
  else { ws.style.display='none'; wt.style.display='none'; }

  const dl = document.getElementById('disc-list');
  dl.innerHTML = '';
  dl.classList.remove('show');
  (q.disc||[]).forEach(d => {
    dl.innerHTML += `<div class="disc-item"><div class="disc-ans">${d.ans}</div>${d.txt}</div>`;
  });
}

// ────────────────────────────────────────────────
// INTERACTION
// ────────────────────────────────────────────────
function doSelect(idx, key) {
  const q = QS[idx];
  const s = state[idx];
  if (s.done) return;
  if (q.type === 'single') {
    s.sel = [key];
  } else {
    const pos = s.sel.indexOf(key);
    if (pos >= 0) s.sel.splice(pos, 1);
    else if (s.sel.length < q.multiCount) s.sel.push(key);
  }
  renderQ(idx);
}

function doReview() {
  const s = state[curQ];
  if (s.sel.length === 0 || s.done) return;
  s.done = true;
  renderQ(curQ);
  document.getElementById('review-panel').scrollIntoView({behavior:'smooth',block:'start'});
}

function doReset() {
  state[curQ] = { sel: [], done: false };
  renderQ(curQ);
}

function goQ(idx) {
  idx = parseInt(idx);
  if (isNaN(idx) || idx < 0 || idx >= QS.length) return;
  renderQ(idx);
  window.scrollTo({top:0, behavior:'smooth'});
}

function goQWithReset(idx) {
  idx = parseInt(idx);
  if (isNaN(idx) || idx < 0 || idx >= QS.length) return;

  // 🔥 언어 강제 한국어
  curLang = 'ko';
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.lang-tab')[0].classList.add('active');

  // 🔥 해당 문제 상태 초기화
  state[idx] = { sel: [], done: false };

  renderQ(idx);
  window.scrollTo({top:0, behavior:'smooth'});
  document.getElementById('btn-prev-top').disabled = idx === 0;
  document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
}

// ────────────────────────────────────────────────
// LANG  (한국어 / 양국어)
// ────────────────────────────────────────────────
function setLang(lang, btn) {
  curLang = lang;
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  applyLang(lang);
}

function applyLang(lang) {
  // 문제 영어 텍스트 — 'both'일 때 block으로 명시해야 CSS display:none을 덮어씀
  const enQ = document.getElementById('q-en-text');
  enQ.style.display = (lang === 'both') ? 'block' : 'none';
  // 선택지 영어 텍스트
  document.querySelectorAll('.choice-en').forEach(e => {
    e.style.display = (lang === 'both') ? 'block' : 'none';
  });
}

// ────────────────────────────────────────────────
// THEME
// ────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('theme-icon').textContent = dark ? '☀️' : '🌙';
  document.getElementById('theme-label').textContent = dark ? '라이트' : '다크';
}

// ────────────────────────────────────────────────
// UTILS
// ────────────────────────────────────────────────
function arraysEqual(a, b) {
  return a.length === b.length && a.every((v,i) => v === b[i]);
}

init();
</script>
</body>
</html>
