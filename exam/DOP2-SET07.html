<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS DOP-C02 | SET 07 (Q301~Q350)</title>
<style>
[data-theme="dark"] {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#222636; --border:#2e3347;
  --accent:#4f8ef7; --accent2:#38c9a0; --text:#e2e6f0; --text-muted:#7a83a0;
  --correct-bg:#112a22; --wrong-bg:#2a1111; --explain-bg:#1e2030;
  --hover-bg:#1e2236; --sel-bg:#1b2540;
}
[data-theme="light"] {
  --bg:#f0f2f8; --surface:#ffffff; --surface2:#f5f6fa; --border:#d0d5e8;
  --accent:#2e6fe0; --accent2:#1aaa7e; --text:#1a1d2e; --text-muted:#5a6280;
  --correct-bg:#e6faf4; --wrong-bg:#fde8e8; --explain-bg:#f0f2fa;
  --hover-bg:#eaf1ff; --sel-bg:#ddeaff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard','Noto Sans KR','Segoe UI',sans-serif;font-size:15px;line-height:1.75;min-height:100vh;transition:background .25s,color .25s;}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 60px;}

/* Topbar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}

/* ── SET 선택 콤보박스 ── */
.set-select-wrap{position:relative;display:inline-flex;align-items:center;}
.set-select{
  appearance:none;-webkit-appearance:none;
  background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  border:none;border-radius:20px;
  color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;
  padding:4px 28px 4px 12px;
  cursor:pointer;outline:none;
  transition:filter .2s,transform .1s;
  white-space:nowrap;
}
.set-select:hover{filter:brightness(1.12);transform:translateY(-1px);}
.set-select:focus{filter:brightness(1.08);outline:2px solid rgba(255,255,255,.5);outline-offset:2px;}
.set-select option{background:#1a1d27;color:#e2e6f0;font-size:13px;font-weight:600;}
/* 화살표 아이콘 */
.set-select-wrap::after{
  content:'▾';
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:#fff;font-size:10px;pointer-events:none;
}

.badge{background:linear-gradient(135deg,#4f8ef7,#38c9a0);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 12px;border-radius:20px;white-space:nowrap;}
.topbar-title{font-size:13px;color:var(--text-muted);flex:1;min-width:120px;}
.topbar-title strong{color:var(--text);font-size:15px;display:block;}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}

/* 문제 선택 콤보박스 */
.q-select-wrap{display:flex;align-items:center;gap:6px;}
.q-select-label{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.q-select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-weight:600;padding:5px 10px;cursor:pointer;outline:none;transition:border-color .2s;}
.q-select:focus,.q-select:hover{border-color:var(--accent);}
.q-select option.opt-correct{color:#1aaa7e;}
.q-select option.opt-wrong{color:#e05252;}

/* 상단 네비 버튼 + 문제 콤보 높이 통일 */
.topbar-right .btn-nav,
.topbar-right .q-select {
  height: 24px;
  padding: 0 14px;
  font-size: 13px;
}

/* 테마 버튼 */
.theme-btn{background:var(--surface2);border:1px solid var(--border);border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-muted);transition:border-color .2s,color .2s;white-space:nowrap;}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}

/* Progress */
.progress-bar{background:var(--surface2);border-radius:4px;height:6px;margin-bottom:20px;overflow:hidden;}
.progress-fill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:4px;transition:width .4s;}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:16px;transition:background .25s,border-color .25s;}

/* Lang Tabs */
.lang-tabs{display:flex;gap:8px;margin-bottom:20px;}
.lang-tab{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.04em;padding:5px 14px;transition:all .2s;}
.lang-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.lang-tab:hover:not(.active){border-color:var(--accent);color:var(--accent);}

/* Q Label */
.q-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-bottom:10px;}
.q-type-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:10px;margin-left:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);vertical-align:middle;}
.q-type-badge.multi{background:#ede9ff;color:#6d28d9;border-color:#c4b5fd;}
[data-theme="dark"] .q-type-badge.multi{background:#2a1f50;color:#a78bfa;border-color:#4c3a8c;}

/* Q Text */
.q-text{font-size:15px;color:var(--text);line-height:1.85;}
.q-text.en-text{
  font-size:14px;color:var(--text-muted);
  margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--border);
}
.q-text code{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:13px;font-family:'JetBrains Mono','Fira Code',monospace;color:var(--accent2);}

/* Choices */
.choices-section{margin-top:24px;}
.choices-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px;}
.choice{display:flex;align-items:flex-start;gap:14px;background:var(--surface2);border:2px solid var(--border);border-radius:10px;cursor:pointer;margin-bottom:10px;padding:14px 18px;transition:border-color .2s,background .2s;user-select:none;}
.choice:hover{border-color:var(--accent);background:var(--hover-bg);}
.choice.selected{border-color:var(--accent);background:var(--sel-bg);}
.choice.correct{border-color:#38c9a0!important;background:var(--correct-bg)!important;}
.choice.wrong{border-color:#f76f6f!important;background:var(--wrong-bg)!important;}
.choice.disabled{cursor:default;pointer-events:none;}
.choice-key{background:var(--border);border-radius:6px;color:var(--text);font-size:13px;font-weight:700;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:background .2s,color .2s;}
.choice.selected .choice-key{background:var(--accent);color:#fff;}
.choice.correct .choice-key{background:#38c9a0;color:#000;}
.choice.wrong .choice-key{background:#f76f6f;color:#fff;}
.choice-body{flex:1;}
.choice-text{font-size:14px;line-height:1.75;}
.choice-en{font-size:12px;color:var(--text-muted);margin-top:5px;display:none;font-style:italic;}
.result-icon{margin-left:auto;font-size:18px;flex-shrink:0;display:none;}
.choice.correct .result-icon,.choice.wrong .result-icon{display:block;}

/* Actions */
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center;}
.btn{border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.03em;padding:11px 24px;transition:opacity .2s,transform .1s;}
.btn:hover:not(:disabled){opacity:.88;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-nav{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:11px 18px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.hint-text{font-size:12px;color:var(--text-muted);margin-top:8px;min-height:18px;}

/* Review Panel */
.review-panel{display:none;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent2);border-radius:12px;padding:24px 28px;margin-bottom:16px;animation:fadeIn .35s ease;transition:background .25s;}
.review-panel.show{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.answer-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.answer-label{font-size:13px;color:var(--text-muted);}
.answer-badge{background:#38c9a0;color:#000;font-size:13px;font-weight:800;padding:4px 14px;border-radius:20px;}
.vote-badge{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);font-size:12px;padding:3px 10px;border-radius:20px;}
.vote-badge span{color:var(--accent);font-weight:700;}
.section-title{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent2);text-transform:uppercase;margin-bottom:10px;}
.explain-box{background:var(--explain-bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;font-size:14px;line-height:1.8;color:var(--text);}
.explain-box p{margin-bottom:8px;}
.explain-box p:last-child{margin-bottom:0;}
.mark-ok{color:#38c9a0;font-weight:700;}
.mark-no{color:#f76f6f;font-weight:600;}

/* Discussion */
.disc-toggle{background:transparent;border:1px dashed var(--border);border-radius:8px;color:var(--text-muted);cursor:pointer;font-size:13px;margin-top:8px;padding:9px 16px;width:100%;text-align:left;transition:border-color .2s,color .2s;}
.disc-toggle:hover{border-color:var(--accent);color:var(--accent);}
.disc-list{display:none;margin-top:10px;}
.disc-list.show{display:block;}
.disc-item{background:var(--surface2);border-left:3px solid var(--border);border-radius:0 6px 6px 0;font-size:13px;margin-bottom:8px;padding:10px 14px;color:var(--text-muted);line-height:1.7;}
.disc-ans{color:var(--accent);font-weight:700;font-size:12px;margin-bottom:3px;}

/* Bottom Nav */
.nav-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px;}
.nav-info{font-size:13px;color:var(--text-muted);text-align:center;flex:1;}

@media(max-width:600px){
  .card{padding:16px;}
  .btn{padding:10px 16px;font-size:13px;}
  .topbar{gap:8px;}
  .topbar-right{gap:6px;}
}

/* ── 패스워드 모달 ── */
.pw-overlay{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  /* 배경 블러 */
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  background:rgba(10,12,22,.55);
  transition:opacity .3s;
}
.pw-overlay.hidden{
  opacity:0;pointer-events:none;
}
.pw-modal{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 24px 64px rgba(0,0,0,.35);
  padding:40px 36px 34px;
  width:min(400px,90vw);
  display:flex;flex-direction:column;align-items:center;gap:0;
  animation:pwSlideIn .35s cubic-bezier(.22,.9,.36,1) both;
}
@keyframes pwSlideIn{
  from{opacity:0;transform:translateY(28px) scale(.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.pw-logo{
  width:54px;height:54px;border-radius:14px;
  background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;margin-bottom:20px;
  box-shadow:0 8px 24px rgba(79,142,247,.35);
}
.pw-title{
  font-size:18px;font-weight:800;color:var(--text);
  letter-spacing:-.01em;margin-bottom:6px;text-align:center;
}
.pw-sub{
  font-size:13px;color:var(--text-muted);margin-bottom:28px;text-align:center;line-height:1.6;
}
.pw-input-wrap{
  position:relative;width:100%;margin-bottom:14px;
}
.pw-input{
  width:100%;
  background:var(--surface2);
  border:2px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-size:16px;font-weight:700;
  letter-spacing:.15em;
  padding:13px 46px 13px 18px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
  text-align:center;
}
.pw-input::placeholder{letter-spacing:normal;font-weight:400;font-size:14px;}
.pw-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,142,247,.18);}
.pw-input.shake{animation:pwShake .38s ease;}
.pw-input.error{border-color:#f76f6f;box-shadow:0 0 0 3px rgba(247,111,111,.18);}
@keyframes pwShake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-6px);}
  80%{transform:translateX(6px);}
}
.pw-toggle{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:var(--text-muted);font-size:18px;padding:2px 4px;
  transition:color .2s;
}
.pw-toggle:hover{color:var(--accent);}
.pw-error-msg{
  font-size:12px;color:#f76f6f;font-weight:600;
  min-height:18px;margin-bottom:18px;text-align:center;
  transition:opacity .2s;
}
.pw-btn{
  width:100%;background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  border:none;border-radius:10px;color:#fff;
  font-size:15px;font-weight:800;letter-spacing:.04em;
  padding:14px;cursor:pointer;
  transition:filter .2s,transform .1s,box-shadow .2s;
  box-shadow:0 6px 20px rgba(79,142,247,.3);
}
.pw-btn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 8px 28px rgba(79,142,247,.4);}
.pw-btn:active{transform:translateY(0);}
.pw-footer{
  font-size:11px;color:var(--text-muted);margin-top:20px;text-align:center;
}
</style>
</head>
<body>

<!-- ── 패스워드 모달 ── -->
<div class="pw-overlay" id="pw-overlay">
  <div class="pw-modal" role="dialog" aria-modal="true" aria-labelledby="pw-title">
    <div class="pw-logo">🔐</div>
    <div class="pw-title" id="pw-title">학습 콘텐츠 잠금</div>
    <div class="pw-sub">AWS DOP-C02 학습 자료에 접근하려면<br>패스워드를 입력해 주세요.</div>

    <div class="pw-input-wrap">
      <input
        class="pw-input" id="pw-input"
        type="password" placeholder="패스워드 입력"
        maxlength="20"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter') checkPw()"
      />
      <button class="pw-toggle" id="pw-toggle" onclick="togglePwVisible()" tabindex="-1" title="표시/숨김">👁</button>
    </div>

    <div class="pw-error-msg" id="pw-error"></div>

    <button class="pw-btn" onclick="checkPw()">확인</button>

    <div class="pw-footer">🍪 인증 후 쿠키에 저장되어 다음 방문 시 자동 로그인됩니다.</div>
  </div>
</div>

<div class="wrap">

  <!-- Topbar -->
  <div class="topbar">

    <!-- ── SET 선택 콤보박스 (badge 대체) ── -->
    <div class="set-select-wrap">
      <select class="set-select" id="set-select" onchange="goSet(this.value)">
        <option value="01" selected>DOP-C02 · SET 01</option>
        <option value="02">DOP-C02 · SET 02</option>
        <option value="03">DOP-C02 · SET 03</option>
        <option value="04">DOP-C02 · SET 04</option>
        <option value="05">DOP-C02 · SET 05</option>
        <option value="06">DOP-C02 · SET 06</option>
        <option value="07">DOP-C02 · SET 07</option>
        <option value="08">DOP-C02 · SET 08</option>
        <option value="09">DOP-C02 · SET 09</option>
      </select>
    </div>

    <div class="topbar-title">
      <strong>AWS Certified DevOps Engineer – Professional</strong>
      SET 07 · Q301~Q350 실전 학습
    </div>
    <div class="topbar-right">
      <!-- 상단 네비게이션 -->
      <button class="btn btn-nav" onclick="goQWithReset(curQ-1)" id="btn-prev-top">←</button>

      <!-- 문제 선택 콤보박스 -->
      <div class="q-select-wrap">
        <select class="q-select" id="q-select" onchange="goQWithReset(this.selectedIndex)"></select>
      </div>
      <button class="btn btn-nav" onclick="goQWithReset(curQ+1)" id="btn-next-top">→</button>

      <!-- 테마 토글 -->
      <button class="theme-btn" onclick="toggleTheme()">
        <span id="theme-icon">☀️</span>
        <span id="theme-label">라이트</span>
      </button>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:5%"></div></div>

  <!-- Language Tabs -->
  <div class="lang-tabs">
    <button class="lang-tab active" onclick="setLang('ko',this)">한국어</button>
    <button class="lang-tab" onclick="setLang('both',this)">양국어</button>
  </div>

  <!-- Question Card -->
  <div class="card" id="q-card">
    <div class="q-label">
      문제 <span id="q-num-badge">001</span>
      <span id="q-type-badge" class="q-type-badge">단일 선택</span>
    </div>
    <!-- 한국어 문제 -->
    <div class="q-text" id="q-ko-text"></div>
    <!-- 영어 문제 (양국어 모드) -->
    <div class="q-text en-text" id="q-en-text"></div>

    <div class="choices-section">
      <div class="choices-label" id="choices-label">선택지</div>
      <div id="choices-container"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btn-review" onclick="doReview()" disabled>📋 정답 확인</button>
      <button class="btn btn-secondary" onclick="doReset()">↺ 초기화</button>
    </div>
    <div class="hint-text" id="hint-text">선택지를 클릭하면 정답 확인 버튼이 활성화됩니다.</div>
  </div>

  <!-- Review Panel -->
  <div class="review-panel" id="review-panel">
    <div class="answer-row">
      <span class="answer-label">정답</span>
      <span class="answer-badge" id="review-answer-badge"></span>
      <span class="vote-badge" id="review-vote-badge"></span>
    </div>
    <div class="section-title">✦ 정답 해설</div>
    <div class="explain-box" id="review-explain"></div>
    <div class="section-title" style="margin-top:14px;" id="wrong-section-title">✦ 오답 분석</div>
    <div class="explain-box" id="review-wrong"></div>
    <button class="disc-toggle" onclick="document.getElementById('disc-list').classList.toggle('show')">💬 주요 토론 의견 보기 / 숨기기</button>
    <div class="disc-list" id="disc-list"></div>
  </div>

  <!-- Bottom Nav -->
  <!-- <div class="nav-bottom">
    <button class="btn btn-nav" onclick="goQ(curQ-1)" id="btn-prev">← 이전</button>
    <span class="nav-info" id="nav-info"></span>
    <button class="btn btn-nav" onclick="goQ(curQ+1)" id="btn-next">다음 →</button>
  </div> -->

</div>
<script>
// ────────────────────────────────────────────────
// 패스워드 / 쿠키 인증
// ────────────────────────────────────────────────
const PW_CORRECT  = 'DOP2';
const COOKIE_NAME = 'dop2_auth';
const COOKIE_DAYS = 30; // 쿠키 유효기간 (일)

function getCookie(name) {
  const cookies = document.cookie.split(';');
  for (let c of cookies) {
    const [k, v] = c.trim().split('=');
    if (k === name) return decodeURIComponent(v || '');
  }
  return null;
}

function setCookie(name, value, days) {
  const expires = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${expires};path=/;SameSite=Lax`;
}

function unlockPage() {
  const overlay = document.getElementById('pw-overlay');
  overlay.classList.add('hidden');
  // 완전히 숨긴 뒤 DOM에서 제거
  overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
}

function checkPw() {
  const input = document.getElementById('pw-input');
  const errEl = document.getElementById('pw-error');
  const val   = input.value.trim();

  if (val === PW_CORRECT) {
    setCookie(COOKIE_NAME, PW_CORRECT, COOKIE_DAYS);
    errEl.textContent = '';
    input.classList.remove('error');
    unlockPage();
  } else {
    errEl.textContent = '❌ 패스워드가 올바르지 않습니다. 다시 입력해 주세요.';
    input.classList.add('error', 'shake');
    input.select();
    input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
  }
}

function togglePwVisible() {
  const input  = document.getElementById('pw-input');
  const toggle = document.getElementById('pw-toggle');

(function checkAuth() {

    const overlay = document.getElementById('pw-overlay');

// 실제 환경에 맞게 URL 패턴을 수정하세요.
// ────────────────────────────────────────────────
function goSet(setNum) {
  // 현재 페이지 파일명에서 set 번호만 교체
  const currentPath = window.location.pathname;
  const fileName = currentPath.split('/').pop(); // e.g. "DOP2-SET01.html"

  let newFileName;
  if (fileName && fileName.match(/DOP2-SET\d{2}/i)) {
    // 파일명에서 set 번호 교체
    newFileName = fileName.replace(/SET\d{2}/i, `SET${setNum}`);
  } else {
    // 파일명 패턴을 찾지 못한 경우 기본 패턴 사용
    newFileName = `DOP2-SET${setNum}.html`;
  }

  const newPath = currentPath.replace(fileName, newFileName);
  window.location.href = newPath;
}

  wrong: `<p><span class="mark-no">❌ B</span> — 인스턴스 수동 제거는 운영 오버헤드가 높고 신속한 롤백에 적합하지 않습니다.</p><p><span class="mark-no">❌ C</span> — 크로스 존 로드 밸런싱이 활성화된 상태에서는 존 이동이 제대로 작동하지 않을 수 있습니다.</p><p><span class="mark-no">❌ D</span> — 서브넷 제거는 영구적인 변경으로 롤백 중 가용성에 영향을 미칩니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'크로스 존 로드 밸런싱 비활성화 후 Zonal Shift를 사용하면 가장 효율적으로 특정 AZ에서 트래픽을 분리할 수 있다는 의견이 일치합니다.' }]
},
{
  n: 305,
  en: `A company has several AWS accounts. An Amazon Connect instance runs in each account. The company uses an Amazon EventBridge default event bus in each account for event handling.<br>A DevOps team needs to receive all the Amazon Connect events in a single DevOps account.<br>Which solution meets these requirements?`,
  ko: `한 회사에 여러 AWS 계정이 있습니다. 각 계정에서 Amazon Connect 인스턴스가 실행됩니다. 회사는 각 계정에서 이벤트 처리를 위해 Amazon EventBridge 기본 이벤트 버스를 사용합니다.<br>DevOps 팀은 단일 DevOps 계정에서 모든 Amazon Connect 이벤트를 수신해야 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Update the resource-based policy of the default event bus in each account to allow the DevOps account to replay events. Configure an EventBridge rule in the DevOps account that matches Amazon Connect events and has a target of the default event bus in the other accounts.`, ko:`각 계정의 기본 이벤트 버스의 리소스 기반 정책을 업데이트하여 DevOps 계정이 이벤트를 재생할 수 있도록 합니다. DevOps 계정에서 Amazon Connect 이벤트와 일치하고 다른 계정의 기본 이벤트 버스를 대상으로 하는 EventBridge 규칙을 구성합니다.` },
    { k:'B', en:`Update the resource-based policy of the default event bus in each account to allow the DevOps account to receive events. Configure an EventBridge rule in the DevOps account that matches Amazon Connect events and has a target of the default event bus in the other accounts.`, ko:`각 계정의 기본 이벤트 버스의 리소스 기반 정책을 업데이트하여 DevOps 계정이 이벤트를 수신할 수 있도록 합니다. DevOps 계정에서 Amazon Connect 이벤트와 일치하고 다른 계정의 기본 이벤트 버스를 대상으로 하는 EventBridge 규칙을 구성합니다.` },
    { k:'C', en:`Update the resource-based policy of the default event bus in the DevOps account. Update the policy to allow events to be received from the accounts. Configure an EventBridge rule in each account that matches Amazon Connect events and has a target of the DevOps account's default event bus.`, ko:`DevOps 계정의 기본 이벤트 버스의 리소스 기반 정책을 업데이트합니다. 계정에서 이벤트를 수신할 수 있도록 정책을 업데이트합니다. 각 계정에서 Amazon Connect 이벤트와 일치하고 DevOps 계정의 기본 이벤트 버스를 대상으로 하는 EventBridge 규칙을 구성합니다.` },
    { k:'D', en:`Update the resource-based policy of the default event bus in the DevOps account. Update the policy to allow events to be replayed by the accounts. Configure an EventBridge rule in each account that matches Amazon Connect events and has a target of the DevOps account's default event bus.`, ko:`DevOps 계정의 기본 이벤트 버스의 리소스 기반 정책을 업데이트합니다. 계정에서 이벤트를 재생할 수 있도록 정책을 업데이트합니다. 각 계정에서 Amazon Connect 이벤트와 일치하고 DevOps 계정의 기본 이벤트 버스를 대상으로 하는 EventBridge 규칙을 구성합니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — DevOps 계정 이벤트 버스 정책 + 각 계정에 EventBridge 규칙</span></p><p>교차 계정 이벤트 라우팅의 올바른 패턴은 이벤트를 수신하는 DevOps 계정의 이벤트 버스에 리소스 기반 정책을 설정하여 다른 계정의 이벤트 게시를 허용하고, 소스 계정(각 Amazon Connect 계정)에서 DevOps 계정의 이벤트 버스를 대상으로 하는 EventBridge 규칙을 구성합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A, B</span> — 이벤트 흐름 방향이 반대입니다. 이벤트는 각 계정에서 DevOps 계정으로 전송되어야 합니다.</p><p><span class="mark-no">❌ D</span> — "replay" 대신 "receive"가 올바른 권한입니다.</p>`,
  disc: [{ ans:'C (100%)', txt:'EventBridge 공식 문서(eb-cross-account.html)에 따르면 수신 계정 이벤트 버스에 정책을 설정하고 소스 계정에 규칙을 생성하는 것이 올바른 패턴입니다.' }]
},
{
  n: 306,
  en: `A company has deployed an Amazon Elastic Kubernetes Service (Amazon EKS) cluster with Amazon EC2 node groups. The company's DevOps team uses the Kubernetes Horizontal Pod Autoscaler and recently installed a supported EKS cluster Autoscaler.<br>The DevOps team needs to implement a solution to collect metrics and logs of the EKS cluster to establish a baseline for performance. The DevOps team will create an initial set of thresholds for specific metrics and will update the thresholds over time as the cluster is used. The DevOps team must receive an Amazon Simple Notification Service (Amazon SNS) email notification if the initial set of thresholds is exceeded or if the EKS cluster Autoscaler is not functioning properly.<br>The solution must collect cluster, node, and pod metrics. The solution also must capture logs in Amazon CloudWatch.<br>Which combination of steps should the DevOps team take to meet these requirements? (Choose three.)`,
  ko: `한 회사가 Amazon EC2 노드 그룹이 있는 Amazon EKS 클러스터를 배포했습니다. DevOps 팀은 Kubernetes Horizontal Pod Autoscaler를 사용하고 EKS 클러스터 Autoscaler를 최근 설치했습니다.<br>DevOps 팀은 성능 기준선 수립을 위해 EKS 클러스터의 메트릭과 로그를 수집하는 솔루션을 구현해야 합니다. 초기 임계값을 설정하고 시간이 지남에 따라 업데이트합니다. 임계값 초과 또는 EKS 클러스터 Autoscaler가 제대로 작동하지 않으면 SNS 이메일 알림을 받아야 합니다.<br>솔루션은 클러스터, 노드, Pod 메트릭과 CloudWatch 로그를 캡처해야 합니다.<br>이 요구 사항을 충족하기 위해 취해야 하는 단계 조합은 무엇입니까? (3개 선택)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Deploy the CloudWatch agent and Fluent Bit to the cluster. Ensure that the EKS cluster has appropriate permissions to send metrics and logs to CloudWatch.`, ko:`CloudWatch 에이전트와 Fluent Bit를 클러스터에 배포합니다. EKS 클러스터에 메트릭과 로그를 CloudWatch로 보낼 수 있는 적절한 권한이 있는지 확인합니다.` },
    { k:'B', en:`Deploy AWS Distro for OpenTelemetry to the cluster. Ensure that the EKS cluster has appropriate permissions to send metrics and logs to CloudWatch.`, ko:`AWS Distro for OpenTelemetry를 클러스터에 배포합니다. EKS 클러스터에 메트릭과 로그를 CloudWatch로 보낼 수 있는 적절한 권한이 있는지 확인합니다.` },
    { k:'C', en:`Create CloudWatch alarms to monitor the CPU, memory, and node failure metrics of the cluster. Configure the alarms to send an SNS email notification to the DevOps team if thresholds are exceeded.`, ko:`클러스터의 CPU, 메모리 및 노드 장애 메트릭을 모니터링하는 CloudWatch 알람을 생성합니다. 임계값 초과 시 DevOps 팀에 SNS 이메일 알림을 보내도록 알람을 구성합니다.` },
    { k:'D', en:`Create a CloudWatch composite alarm to monitor a metric log filter of the CPU, memory, and node metrics of the cluster. Configure the alarm to send an SNS email notification to the DevOps team when anomalies are detected.`, ko:`클러스터의 CPU, 메모리, 노드 메트릭의 메트릭 로그 필터를 모니터링하는 CloudWatch 복합 알람을 생성합니다. 이상 감지 시 DevOps 팀에 SNS 이메일 알림을 보내도록 알람을 구성합니다.` },
    { k:'E', en:`Create a CloudWatch alarm to monitor the logs of the Autoscaler deployments for errors. Configure the alarm to send an SNS email notification to the DevOps team if thresholds are exceeded.`, ko:`Autoscaler 배포 로그에서 오류를 모니터링하는 CloudWatch 알람을 생성합니다. 임계값 초과 시 DevOps 팀에 SNS 이메일 알림을 보내도록 알람을 구성합니다.` },
    { k:'F', en:`Create a CloudWatch alarm to monitor a metric log filter of the Autoscaler deployments for errors. Configure the alarm to send an SNS email notification to the DevOps team if thresholds are exceeded.`, ko:`Autoscaler 배포의 메트릭 로그 필터에서 오류를 모니터링하는 CloudWatch 알람을 생성합니다. 임계값 초과 시 DevOps 팀에 SNS 이메일 알림을 보내도록 알람을 구성합니다.` },
  ],
  answer: ['A','C','F'],
  vote: '73% ACF',
  explain: `<p><span class="mark-ok">✅ A — CloudWatch 에이전트 + Fluent Bit</span></p><p>CloudWatch 에이전트와 Fluent Bit를 EKS에 배포하면 클러스터, 노드, Pod 메트릭과 로그를 CloudWatch로 전송할 수 있습니다.</p><p><span class="mark-ok">✅ C — CPU/메모리/노드 알람</span></p><p>수집된 메트릭에 대한 CloudWatch 알람으로 성능 임계값 초과 시 SNS로 알림을 전송합니다.</p><p><span class="mark-ok">✅ F — Autoscaler 로그 필터 기반 알람</span></p><p>Autoscaler 배포 로그의 메트릭 로그 필터를 통해 오류를 모니터링하고 SNS로 알림을 전송합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — AWS Distro for OpenTelemetry도 동작하지만, CloudWatch 로그 캡처 요구사항에는 CloudWatch 에이전트와 Fluent Bit가 더 직접적입니다.</p><p><span class="mark-no">❌ D</span> — 복합 알람은 이상 탐지 기반으로 초기 임계값 설정과 맞지 않습니다.</p><p><span class="mark-no">❌ E</span> — 단순 로그 모니터링보다 메트릭 로그 필터 기반 알람(F)이 더 효과적입니다.</p>`,
  disc: [{ ans:'ACF (73%)', txt:'A로 로그/메트릭 수집, C로 성능 알람, F로 Autoscaler 오류 알람을 구성하는 것이 적합하다는 의견이 지배적입니다.' }]
},
{
  n: 307,
  en: `A company discovers that its production environment and disaster recovery (DR) environment are deployed to the same AWS Region. All the production applications run on Amazon EC2 instances and are deployed by AWS CloudFormation. The applications use an Amazon FSx for NetApp ONTAP volume for application storage. No application data resides on the EC2 instances.<br>A DevOps engineer copies the required AMIs to a new DR Region. The DevOps engineer also updates the CloudFormation code to accept a Region as a parameter. The storage needs to have an RPO of 10 minutes in the DR Region.<br>Which solution will meet these requirements?`,
  ko: `한 회사에서 프로덕션 환경과 DR 환경이 동일한 AWS 리전에 배포되어 있음을 발견했습니다. 모든 프로덕션 애플리케이션은 Amazon EC2 인스턴스에서 실행되고 AWS CloudFormation으로 배포됩니다. 애플리케이션은 Amazon FSx for NetApp ONTAP 볼륨을 사용합니다. EC2 인스턴스에는 애플리케이션 데이터가 없습니다.<br>DevOps 엔지니어는 필요한 AMI를 새 DR 리전에 복사하고 CloudFormation 코드를 업데이트하여 리전을 파라미터로 허용합니다. 스토리지는 DR 리전에서 10분의 RPO를 가져야 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an Amazon S3 bucket in both Regions. Configure S3 Cross-Region Replication (CRR) for the S3 buckets. Create a scheduled AWS Lambda function to copy any new content from the FSx for ONTAP volume to the S3 bucket in the production Region.`, ko:`두 리전 모두에 Amazon S3 버킷을 생성합니다. S3 버킷에 대해 S3 Cross-Region Replication(CRR)을 구성합니다. FSx for ONTAP 볼륨에서 프로덕션 리전의 S3 버킷으로 새 콘텐츠를 복사하는 예약된 AWS Lambda 함수를 생성합니다.` },
    { k:'B', en:`Use AWS Backup to create a backup vault and a custom backup plan that has a 10-minute frequency. Specify the DR Region as the target Region. Assign the EC2 instances in the production Region to the backup plan.`, ko:`AWS Backup을 사용하여 백업 볼트와 10분 주기의 사용자 지정 백업 계획을 생성합니다. DR 리전을 대상 리전으로 지정합니다. 프로덕션 리전의 EC2 인스턴스를 백업 계획에 할당합니다.` },
    { k:'C', en:`Create an AWS Lambda function to create snapshots of the instance store volumes that are attached to the EC2 instances. Configure the Lambda function to copy the snapshots to the DR Region and to remove the previous copies. Create an Amazon EventBridge scheduled rule that invokes the Lambda function every 10 minutes.`, ko:`EC2 인스턴스에 연결된 인스턴스 스토어 볼륨의 스냅샷을 생성하는 AWS Lambda 함수를 생성합니다. 스냅샷을 DR 리전에 복사하고 이전 복사본을 제거하도록 Lambda 함수를 구성합니다. 10분마다 Lambda 함수를 호출하는 Amazon EventBridge 예약 규칙을 생성합니다.` },
    { k:'D', en:`Create an FSx for ONTAP instance in the DR Region. Configure a 5-minute schedule for a volume-level NetApp SnapMirror to replicate the volume from the production Region to the DR Region.`, ko:`DR 리전에 FSx for ONTAP 인스턴스를 생성합니다. 프로덕션 리전에서 DR 리전으로 볼륨을 복제하는 볼륨 수준 NetApp SnapMirror에 대해 5분 일정을 구성합니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — FSx for ONTAP SnapMirror 5분 일정</span></p><p>FSx for NetApp ONTAP은 NetApp SnapMirror를 통해 교차 리전 볼륨 복제를 지원합니다. 5분 간격 복제 일정을 설정하면 10분 RPO 요구 사항을 충족할 수 있습니다. 이는 애플리케이션 데이터가 FSx 볼륨에만 있는 상황에 가장 적합합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — FSx 볼륨 데이터를 S3로 복사하는 것은 FSx 파일시스템 구조를 보존하지 못하며 복잡성이 높습니다.</p><p><span class="mark-no">❌ B</span> — EC2 인스턴스에는 데이터가 없으므로 EC2 백업은 효과가 없습니다.</p><p><span class="mark-no">❌ C</span> — EC2 인스턴스 스토어 볼륨은 퍼시스턴트 스토리지가 아니며, 데이터는 FSx에 있습니다.</p>`,
  disc: [{ ans:'D (100%)', txt:'FSx for ONTAP의 SnapMirror 기능이 교차 리전 복제와 RPO 요구 사항을 가장 효율적으로 충족한다는 의견이 일치합니다.' }]
},
{
  n: 308,
  en: `During a security audit, a company discovered that some security groups allow SSH traffic from 0.0.0.0/0. A security team must implement a solution to detect and remediate this issue as soon as possible. The company uses one organization in AWS Organizations to manage all the company's AWS accounts.<br>Which solution will meet these requirements?`,
  ko: `보안 감사 중에 회사에서 일부 보안 그룹이 0.0.0.0/0에서 SSH 트래픽을 허용한다는 것을 발견했습니다. 보안 팀은 가능한 한 빨리 이 문제를 탐지하고 해결하는 솔루션을 구현해야 합니다. 회사는 AWS Organizations의 하나의 조직을 사용하여 모든 AWS 계정을 관리합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Enable AWS Config for all AWS accounts. Use a periodic trigger to activate the vpe-sg-port-restriction-check AWS Config rule. Create an AWS Lambda function to remediate any noncompliant rules.`, ko:`모든 AWS 계정에 대해 AWS Config를 활성화합니다. 주기적 트리거를 사용하여 vpe-sg-port-restriction-check AWS Config 규칙을 활성화합니다. 규정 미준수 규칙을 수정하는 AWS Lambda 함수를 생성합니다.` },
    { k:'B', en:`Create an AWS Lambda function in each AWS account to delete all the security group rules. Create an Amazon EventBridge rule to match security group update events or creation events. Set the Lambda function in each account as a target for the rule.`, ko:`각 AWS 계정에서 모든 보안 그룹 규칙을 삭제하는 AWS Lambda 함수를 생성합니다. 보안 그룹 업데이트 또는 생성 이벤트와 일치하도록 Amazon EventBridge 규칙을 생성합니다. 각 계정의 Lambda 함수를 규칙의 대상으로 설정합니다.` },
    { k:'C', en:`Enable AWS Config for all AWS accounts. Create a custom AWS Config rule to run on the restricted-ssh configuration change trigger. Configure the rule to invoke an AWS Lambda function to remediate any noncompliant resources.`, ko:`모든 AWS 계정에 대해 AWS Config를 활성화합니다. restricted-ssh 구성 변경 트리거에서 실행할 사용자 지정 AWS Config 규칙을 생성합니다. 규칙이 규정 미준수 리소스를 수정하기 위해 AWS Lambda 함수를 호출하도록 구성합니다.` },
    { k:'D', en:`Create an AWS Systems Manager Automation document in each account to inspect all security groups and to delete noncompliant rules. Use an Amazon EventBridge rule to run the Automation document every hour.`, ko:`각 계정에서 모든 보안 그룹을 검사하고 규정 미준수 규칙을 삭제하는 AWS Systems Manager Automation 문서를 생성합니다. Amazon EventBridge 규칙을 사용하여 매시간 Automation 문서를 실행합니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — AWS Config restricted-ssh 규칙 + Lambda 자동 수정</span></p><p><code>restricted-ssh</code>는 AWS Config 관리형 규칙으로, 0.0.0.0/0에서 포트 22(SSH) 트래픽을 허용하는 보안 그룹을 탐지합니다. 구성 변경 트리거를 사용하면 실시간 감지가 가능하며, Lambda 자동 수정으로 규정 미준수 리소스를 즉시 해결할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 주기적 트리거는 실시간 감지가 아니며, vpe-sg-port-restriction-check는 이 특정 사용 사례에 최적화된 규칙이 아닙니다.</p><p><span class="mark-no">❌ B</span> — 모든 보안 그룹 규칙 삭제는 과도한 조치입니다.</p><p><span class="mark-no">❌ D</span> — 매시간 실행은 즉각적인 수정이 되지 않습니다.</p>`,
  disc: [{ ans:'C (100%)', txt:'restricted-ssh 관리형 규칙과 변경 트리거 기반 Lambda 수정이 즉각적이고 정확한 탐지 및 수정을 제공한다는 의견이 일치합니다.' }]
},
{
  n: 309,
  en: `A company's DevOps engineer must install a software package on 30 on-premises VMs and 15 Amazon EC2 instances.<br>The DevOps engineer needs to ensure that all VMs receive the package in a process that is auditable and that any configuration drift on the VMs is automatically identified and alerted on. The company uses AWS Direct Connect to connect its on-premises data center to AWS.<br>Which solution will meet these requirements with the MOST operational efficiency?`,
  ko: `회사의 DevOps 엔지니어는 30개의 온프레미스 VM과 15개의 Amazon EC2 인스턴스에 소프트웨어 패키지를 설치해야 합니다.<br>모든 VM이 감사 가능한 프로세스에서 패키지를 수신하고, VM의 모든 구성 드리프트가 자동으로 식별되어 경고되도록 해야 합니다. 회사는 AWS Direct Connect를 사용하여 온프레미스 데이터 센터를 AWS에 연결합니다.<br>가장 높은 운영 효율성으로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Write a script that iterates through the list of VMs once a week. Configure the script to check for the package and install the package if the package is not found. Configure the script to send an email message notification to the system administrator if the package is not found.`, ko:`일주일에 한 번 VM 목록을 반복하는 스크립트를 작성합니다. 패키지를 확인하고 없으면 설치하도록 구성합니다. 패키지가 없으면 시스템 관리자에게 이메일 알림을 보내도록 구성합니다.` },
    { k:'B', en:`Install the AWS Systems Manager Agent (SSM Agent) on all VMs. Use the SSM Agent to install the package. Use AWS Config to monitor for configuration drift. Use Amazon Simple Notification Service (Amazon SNS) to notify the system administrator if any drift is found.`, ko:`모든 VM에 AWS Systems Manager Agent(SSM Agent)를 설치합니다. SSM Agent를 사용하여 패키지를 설치합니다. AWS Config를 사용하여 구성 드리프트를 모니터링합니다. 드리프트가 발견되면 Amazon SNS를 사용하여 시스템 관리자에게 알립니다.` },
    { k:'C', en:`Write a script that checks if the package is installed across the environment. Configure the script to create a list of all VMs that are noncompliant. Configure the script to send the list to the system administrator, who will install the package on the noncompliant VMs.`, ko:`환경 전체에서 패키지가 설치되어 있는지 확인하는 스크립트를 작성합니다. 규정 미준수 VM 목록을 생성하도록 구성합니다. 목록을 시스템 관리자에게 전송하도록 구성합니다.` },
    { k:'D', en:`Log in to each VM. Use a local package manager to install the package. Use AWS Config to monitor the AWS resources for configuration changes. Write a script to monitor the on-premises resources.`, ko:`각 VM에 로그인합니다. 로컬 패키지 관리자를 사용하여 패키지를 설치합니다. AWS Config를 사용하여 AWS 리소스의 구성 변경 사항을 모니터링합니다. 온프레미스 리소스를 모니터링하는 스크립트를 작성합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — SSM Agent + AWS Config + SNS</span></p><p>AWS Systems Manager Agent를 온프레미스 VM과 EC2 인스턴스 모두에 설치하면 AWS Direct Connect를 통해 하이브리드 환경에서 통합 관리가 가능합니다. Run Command로 패키지 설치 과정이 감사 가능하며, AWS Config로 구성 드리프트를 자동으로 감지하고 SNS로 알림을 전송합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A, C</span> — 스크립트 기반 접근 방식은 자동화 수준이 낮고 운영 오버헤드가 높습니다.</p><p><span class="mark-no">❌ D</span> — 수동 로그인 방식은 확장성이 없고 감사 추적이 어렵습니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'SSM Agent를 통한 하이브리드 환경 통합 관리와 Config를 통한 드리프트 감지가 최적의 솔루션이라는 의견이 일치합니다.' }]
},
{
  n: 310,
  en: `A company has an AWS CodePipeline pipeline in the eu-west-1 Region. The pipeline stores the build artifacts in an Amazon S3 bucket. The pipeline builds and deploys an AWS Lambda function by using an AWS CloudFormation deploy action.<br>A DevOps engineer needs to update the existing pipeline to also deploy the Lambda function to the us-east-1 Region. The pipeline has already been updated to create an additional artifact to deploy to us-east-1.<br>Which combination of steps should the DevOps engineer take to meet these requirements? (Choose two.)`,
  ko: `한 회사가 eu-west-1 리전에 AWS CodePipeline 파이프라인을 보유하고 있습니다. 이 파이프라인은 Amazon S3 버킷에 빌드 아티팩트를 저장합니다. 파이프라인은 AWS CloudFormation 배포 작업을 사용하여 AWS Lambda 함수를 빌드하고 배포합니다.<br>DevOps 엔지니어는 기존 파이프라인을 업데이트하여 Lambda 함수를 us-east-1 리전에도 배포해야 합니다. 파이프라인은 이미 us-east-1에 배포할 추가 아티팩트를 생성하도록 업데이트되었습니다.<br>이 요구 사항을 충족하기 위해 취해야 하는 단계 조합은 무엇입니까? (2개 선택)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Modify the CloudFormation template to include a parameter for the Lambda function code's .zip file location. Create a new CloudFormation deploy action for us-east-1 in the pipeline. Configure the new deploy action to pass in the us-east-1 artifact location as a parameter override.`, ko:`Lambda 함수 코드의 .zip 파일 위치에 대한 파라미터를 포함하도록 CloudFormation 템플릿을 수정합니다. 파이프라인에서 us-east-1에 대한 새 CloudFormation 배포 작업을 생성합니다. us-east-1 아티팩트 위치를 파라미터 재정의로 전달하도록 새 배포 작업을 구성합니다.` },
    { k:'B', en:`Create a new CloudFormation deploy action for us-east-1 in the pipeline. Configure the new deploy action to use the CloudFormation template from the additional artifact that was created for us-east-1.`, ko:`파이프라인에서 us-east-1에 대한 새 CloudFormation 배포 작업을 생성합니다. us-east-1용으로 생성된 추가 아티팩트의 CloudFormation 템플릿을 사용하도록 새 배포 작업을 구성합니다.` },
    { k:'C', en:`Create an S3 bucket in us-east-1. Configure the S3 bucket policy to allow CodePipeline to have read and write access.`, ko:`us-east-1에 S3 버킷을 생성합니다. CodePipeline에 읽기 및 쓰기 액세스 권한을 부여하도록 S3 버킷 정책을 구성합니다.` },
    { k:'D', en:`Create an S3 bucket in us-east-1. Configure S3 Cross-Region Replication (CRR) from the S3 bucket in eu-west-1 to the S3 bucket in us-east-1.`, ko:`us-east-1에 S3 버킷을 생성합니다. eu-west-1의 S3 버킷에서 us-east-1의 S3 버킷으로 S3 Cross-Region Replication(CRR)을 구성합니다.` },
    { k:'E', en:`Modify the pipeline to include the S3 bucket for us-east-1 as an artifact store. Create a new CloudFormation deploy action for us-east-1 in the pipeline. Configure the new deploy action to use the CloudFormation template from the us-east-1 artifact.`, ko:`파이프라인을 수정하여 us-east-1의 S3 버킷을 아티팩트 저장소로 포함합니다. 파이프라인에서 us-east-1에 대한 새 CloudFormation 배포 작업을 생성합니다. us-east-1 아티팩트의 CloudFormation 템플릿을 사용하도록 새 배포 작업을 구성합니다.` },
  ],
  answer: ['C','E'],
  vote: '92% CE',
  explain: `<p><span class="mark-ok">✅ C — us-east-1에 S3 버킷 생성 및 CodePipeline 접근 허용</span></p><p>CodePipeline이 여러 리전에 배포하려면 각 대상 리전에 아티팩트 저장소(S3 버킷)가 필요합니다. CodePipeline 서비스 역할에 읽기/쓰기 권한이 있어야 합니다.</p><p><span class="mark-ok">✅ E — 파이프라인 아티팩트 저장소 업데이트 + 새 배포 작업</span></p><p>파이프라인에 us-east-1 S3 버킷을 아티팩트 저장소로 추가하고, us-east-1 아티팩트의 CloudFormation 템플릿을 사용하는 새 배포 작업을 생성합니다. 리전별 독립적인 템플릿이 필요합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 기존 템플릿에 파라미터만 추가하는 것은 리전별 VPC ID, 서브넷 등 다른 구성을 처리할 수 없습니다.</p><p><span class="mark-no">❌ B</span> — 파이프라인에 아티팩트 저장소(S3 버킷)를 추가하지 않으면 교차 리전 배포가 작동하지 않습니다.</p><p><span class="mark-no">❌ D</span> — CRR은 필요하지 않으며, CodePipeline이 각 리전에 직접 아티팩트를 관리합니다.</p>`,
  disc: [{ ans:'CE (92%)', txt:'교차 리전 CodePipeline 배포에는 각 리전의 아티팩트 저장소와 리전별 독립 배포 작업이 필요하다는 의견이 지배적입니다.' }]
},
{
  n: 311,
  en: `A company uses an AWS Cloud Development Kit (AWS CDK) application for its infrastructure. The AWS CDK application creates AWS Lambda functions and the IAM roles that are attached to the functions. The company also uses AWS Organizations. The company's developers can assume the AWS CDK application deployment role.<br>The company's security team discovered that the developers and the role used to deploy the AWS CDK application have more permissions than necessary. The security team also discovered that the roles attached to the Lambda functions that the CDK application creates have more permissions than necessary. The developers must not have the ability to grant additional permissions.<br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `한 회사가 인프라에 AWS CDK 애플리케이션을 사용합니다. CDK 애플리케이션은 AWS Lambda 함수와 함수에 연결된 IAM 역할을 생성합니다. 회사는 AWS Organizations도 사용합니다. 개발자는 AWS CDK 애플리케이션 배포 역할을 수임할 수 있습니다.<br>보안 팀은 개발자와 CDK 애플리케이션 배포에 사용된 역할에 필요 이상의 권한이 있음을 발견했습니다. 또한 CDK 애플리케이션이 생성한 Lambda 함수에 연결된 역할에도 필요 이상의 권한이 있습니다. 개발자는 추가 권한을 부여할 수 없어야 합니다.<br>최소한의 운영 오버헤드로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an SCP that denies the iam:CreateRole action and the iam:UpdateRole action for the developer role and the AWS CDK application deployment role. Centrally create new IAM roles to attach to the Lambda functions for the developers to use to provision Lambda functions.`, ko:`개발자 역할과 AWS CDK 애플리케이션 배포 역할에 대해 iam:CreateRole 및 iam:UpdateRole 작업을 거부하는 SCP를 생성합니다. Lambda 함수에 연결할 새 IAM 역할을 중앙에서 생성합니다.` },
    { k:'B', en:`Create an IAM permission boundary policy. Define the maximum actions that the AWS CDK application requires in the policy. Update the account's AWS CDK bootstrapping to use the permission boundary. Update the configuration in the AWS CDK application for the default permissions boundary to use the policy.`, ko:`IAM 권한 경계 정책을 생성합니다. AWS CDK 애플리케이션이 필요로 하는 최대 작업을 정책에 정의합니다. 권한 경계를 사용하도록 계정의 AWS CDK 부트스트래핑을 업데이트합니다. 기본 권한 경계에 대해 해당 정책을 사용하도록 AWS CDK 애플리케이션의 구성을 업데이트합니다.` },
    { k:'C', en:`Create an IAM permission boundary policy. Define the maximum actions that the AWS CDK application requires in the policy. Instruct the developers to use the permission boundary policy name when they create a role in the AWS CDK application code.`, ko:`IAM 권한 경계 정책을 생성합니다. AWS CDK 애플리케이션이 필요로 하는 최대 작업을 정책에 정의합니다. AWS CDK 애플리케이션 코드에서 역할을 생성할 때 권한 경계 정책 이름을 사용하도록 개발자에게 지시합니다.` },
    { k:'D', en:`Create an SCP that denies the iam:CreateRole action and the iam:UpdateRole action for the developer role. Give the AWS CDK deployment role access to create roles associated with Lambda functions. Run AWS Identity and Access Management Access Analyzer to verify that the Lambda functions role does not have permissions.`, ko:`개발자 역할에 대해 iam:CreateRole 및 iam:UpdateRole 작업을 거부하는 SCP를 생성합니다. AWS CDK 배포 역할에 Lambda 함수와 연결된 역할을 생성할 수 있는 액세스 권한을 부여합니다. IAM Access Analyzer를 실행하여 Lambda 함수 역할에 권한이 없는지 확인합니다.` },
  ],
  answer: ['B'],
  vote: '63% B',
  explain: `<p><span class="mark-ok">✅ B — IAM 권한 경계 + CDK 부트스트래핑 업데이트</span></p><p>CDK 부트스트래핑 수준에서 권한 경계를 설정하면 CDK 애플리케이션이 생성하는 모든 IAM 역할(개발자 역할 포함, Lambda 역할 포함)에 자동으로 권한 경계가 적용됩니다. 이 방식은 사용자 지정 코드 없이 CDK 워크플로와 완벽하게 통합되어 운영 오버헤드를 최소화합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — SCP로 역할 생성을 거부하면 CDK 애플리케이션 자체가 역할을 생성할 수 없어 동작하지 않습니다.</p><p><span class="mark-no">❌ C</span> — 개발자에게 수동으로 정책 이름을 사용하도록 지시하는 것은 강제적이지 않고 오류 가능성이 있습니다.</p><p><span class="mark-no">❌ D</span> — Access Analyzer는 사후 감지 도구이며 예방적 통제가 아닙니다.</p>`,
  disc: [{ ans:'B (63%)', txt:'CDK 부트스트래핑에 권한 경계를 설정하면 모든 생성된 역할에 자동으로 적용된다는 의견이 우세합니다.' }]
},
{
  n: 312,
  en: `A company uses Amazon Elastic Container Registry (Amazon ECR) private registries to store container images.<br>A DevOps team needs to ensure that the container images are regularly scanned for software package vulnerabilities.<br>Which solution will meet this requirement?`,
  ko: `한 회사가 컨테이너 이미지를 저장하기 위해 Amazon ECR 프라이빗 레지스트리를 사용합니다.<br>DevOps 팀은 컨테이너 이미지가 소프트웨어 패키지 취약성에 대해 정기적으로 스캔되도록 해야 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Enable enhanced scanning for private registries in Amazon ECR.`, ko:`Amazon ECR에서 프라이빗 레지스트리에 대한 향상된 스캐닝을 활성화합니다.` },
    { k:'B', en:`Enable basic continuous scanning for private registries in Amazon ECR.`, ko:`Amazon ECR에서 프라이빗 레지스트리에 대한 기본적인 연속 스캔을 활성화합니다.` },
    { k:'C', en:`Create an AWS System Manager Automation document to scan images by using the AWS SDK. Configure the Automation document to run when a new image is pushed to an ECR registry.`, ko:`AWS SDK를 사용하여 이미지를 스캔하는 AWS Systems Manager Automation 문서를 생성합니다. ECR 레지스트리에 새 이미지가 푸시될 때 실행되도록 Automation 문서를 구성합니다.` },
    { k:'D', en:`Create an AWS Lambda function that scans all images in Amazon ECR by using the AWS SDK. Create an Amazon EventBridge rule to invoke the Lambda function each day.`, ko:`AWS SDK를 사용하여 Amazon ECR의 모든 이미지를 스캔하는 AWS Lambda 함수를 생성합니다. 매일 Lambda 함수를 호출하는 Amazon EventBridge 규칙을 생성합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — Amazon ECR 향상된 스캐닝 활성화</span></p><p>Amazon ECR의 향상된 스캐닝은 Amazon Inspector를 사용하여 컨테이너 이미지를 지속적으로 스캔합니다. 이미지 푸시 시 자동 스캔, 새 취약성 게시 시 재스캔을 지원하며 자세한 취약성 보고서를 제공합니다. AWS가 완전 관리하므로 운영 오버헤드가 최소화됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 기본 연속 스캔은 향상된 스캔보다 기능이 제한적입니다.</p><p><span class="mark-no">❌ C, D</span> — 사용자 지정 스캐닝 솔루션은 불필요한 복잡성을 추가합니다. AWS 관리형 스캐닝 기능을 사용하는 것이 효율적입니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'향상된 스캐닝은 지속적 자동 스캔과 취약성 게시 시 재스캔을 제공하는 최적의 솔루션입니다.' }]
},
{
  n: 313,
  en: `A security team sets up a workflow that invokes an AWS Step Functions workflow when Amazon EventBridge matches specific events. The events can be generated by several AWS services. AWS CloudTrail records user activities.<br>The security team notices that some important events do not invoke the workflow as expected. The CloudTrail logs do not indicate any direct errors related to the missing events.<br>Which combination of steps will identify the root cause of the missing event invocations? (Choose three.)`,
  ko: `보안팀은 Amazon EventBridge가 특정 이벤트와 일치할 때 AWS Step Functions 워크플로를 호출하는 워크플로를 설정합니다. 이벤트는 여러 AWS 서비스에서 생성될 수 있습니다. AWS CloudTrail은 사용자 활동을 기록합니다.<br>보안팀은 일부 중요한 이벤트가 예상대로 워크플로를 호출하지 않는다는 것을 알아챕니다. CloudTrail 로그는 누락된 이벤트와 관련된 직접적인 오류를 나타내지 않습니다.<br>누락된 이벤트 호출의 근본 원인을 식별하는 단계 조합은 무엇입니까? (3개 선택)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Enable EventBridge schema discovery on the event bus to determine whether the event patterns match the expected schema.`, ko:`이벤트 버스에서 EventBridge 스키마 검색을 활성화하여 이벤트 패턴이 예상 스키마와 일치하는지 확인합니다.` },
    { k:'B', en:`Configure Amazon CloudWatch to monitor EventBridge metrics and Step Functions metrics. Set up alerts for anomalies in event patterns and workflow invocations.`, ko:`Amazon CloudWatch를 구성하여 EventBridge 메트릭과 Step Functions 메트릭을 모니터링합니다. 이벤트 패턴과 워크플로 호출의 이상에 대한 알림을 설정합니다.` },
    { k:'C', en:`Configure an AWS Lambda logging function to monitor and log events from EventBridge to provide more details about the processed events.`, ko:`EventBridge에서 이벤트를 모니터링하고 기록하여 처리된 이벤트에 대한 자세한 정보를 제공하는 AWS Lambda 로깅 함수를 구성합니다.` },
    { k:'D', en:`Review the Step Functions execution history for patterns of failures or timeouts that could correlate to the missing event invocations.`, ko:`누락된 이벤트 호출과 연관이 있을 수 있는 실패 또는 시간 초과 패턴을 확인하기 위해 Step Functions 실행 기록을 검토합니다.` },
    { k:'E', en:`Review metrics for the EventBridge failed invocations to ensure that the IAM execution role that is attached to the rule has sufficient permissions.`, ko:`규칙에 연결된 IAM 실행 역할에 충분한 권한이 있는지 확인하기 위해 EventBridge 실패한 호출에 대한 메트릭을 검토합니다.` },
    { k:'F', en:`Verify that the Step Functions workflow has the correct permissions to be invoked by EventBridge.`, ko:`EventBridge에서 Step Functions 워크플로를 호출하는 데 필요한 올바른 권한이 있는지 확인합니다.` },
  ],
  answer: ['A','B','E'],
  vote: '100% ABE',
  explain: `<p><span class="mark-ok">✅ A — EventBridge 스키마 검색으로 이벤트 구조 검증</span></p><p>이벤트 패턴이 예상 스키마와 일치하지 않으면 EventBridge 규칙이 이벤트를 매칭하지 못합니다. 스키마 검색으로 이를 확인합니다.</p><p><span class="mark-ok">✅ B — CloudWatch 메트릭으로 이상 모니터링</span></p><p>EventBridge와 Step Functions 메트릭을 모니터링하여 이벤트 패턴과 워크플로 호출의 이상을 감지합니다.</p><p><span class="mark-ok">✅ E — EventBridge 실패 호출 메트릭 검토</span></p><p>EventBridge 규칙의 IAM 실행 역할에 Step Functions를 호출할 권한이 있는지 확인합니다. Step Functions는 리소스 기반 정책을 지원하지 않으므로 EventBridge 규칙의 역할 권한이 중요합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ C</span> — Lambda 로깅 함수를 추가하는 것은 불필요한 복잡성을 추가합니다.</p><p><span class="mark-no">❌ D</span> — Step Functions 실행이 시작되지 않은 경우 실행 기록이 없으므로 근본 원인 파악에 도움이 안 됩니다.</p><p><span class="mark-no">❌ F</span> — Step Functions는 리소스 기반 정책이 없으므로 EventBridge 규칙의 역할 권한(E)이 올바른 접근입니다.</p>`,
  disc: [{ ans:'ABE (100%)', txt:'스키마 검증, CloudWatch 모니터링, EventBridge 실패 호출 메트릭 검토가 핵심 진단 단계라는 의견이 일치합니다.' }]
},
{
  n: 314,
  en: `A company's DevOps engineer uses AWS Systems Manager to perform maintenance tasks. The company has a few Amazon EC2 instances that require a restart after notifications from AWS Health.<br>The DevOps engineer must implement an automated solution that uses Amazon EventBridge to remediate the notifications during the company's scheduled maintenance windows.<br>How should the DevOps engineer configure an EventBridge rule to meet these requirements?`,
  ko: `회사의 DevOps 엔지니어는 AWS Systems Manager를 사용하여 유지 관리 작업을 수행합니다. 회사에는 AWS Health에서 알림을 받은 후 재시작이 필요한 Amazon EC2 인스턴스가 몇 개 있습니다.<br>DevOps 엔지니어는 회사의 예약된 유지 관리 기간 동안 알림을 수정하기 위해 Amazon EventBridge를 사용하는 자동화된 솔루션을 구현해야 합니다.<br>이 요구 사항을 충족하기 위해 EventBridge 규칙을 어떻게 구성해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure an event source of AWS Health. Configure event types that indicate scheduled instance termination and retirement. Target the AWS-RestartEC2Instance Systems Manager Automation runbook to restart the EC2 instances.`, ko:`AWS Health의 이벤트 소스를 구성합니다. 예약된 인스턴스 종료 및 서비스 해제를 나타내는 이벤트 유형을 구성합니다. EC2 인스턴스를 재시작하려면 AWS-RestartEC2Instance Systems Manager Automation 런북을 대상으로 합니다.` },
    { k:'B', en:`Configure an event source of Systems Manager. Configure an event type that indicates a maintenance window. Target the AWS-RestartEC2Instance Systems Manager Automation runbook to restart the EC2 instances.`, ko:`Systems Manager의 이벤트 소스를 구성합니다. 유지 관리 기간을 나타내는 이벤트 유형을 구성합니다. EC2 인스턴스를 재시작하려면 AWS-RestartEC2Instance Systems Manager Automation 런북을 대상으로 합니다.` },
    { k:'C', en:`Configure an event source of AWS Health. Configure event types that indicate scheduled instance termination and retirement. Target a newly created AWS Lambda function that registers a Systems Manager maintenance window task to restart the EC2 instances.`, ko:`AWS Health의 이벤트 소스를 구성합니다. 예약된 인스턴스 종료 및 서비스 해제를 나타내는 이벤트 유형을 구성합니다. EC2 인스턴스를 재시작하기 위해 Systems Manager 유지 관리 기간 작업을 등록하는 새로 생성된 AWS Lambda 함수를 대상으로 합니다.` },
    { k:'D', en:`Configure an event source of EC2. Configure an event type that indicates instance state notification. Target a newly created AWS Lambda function that registers a Systems Manager maintenance window task to restart the EC2 instances.`, ko:`EC2의 이벤트 소스를 구성합니다. 인스턴스 상태 알림을 나타내는 이벤트 유형을 구성합니다. EC2 인스턴스를 재시작하기 위해 Systems Manager 유지 관리 기간 작업을 등록하는 새로 생성된 AWS Lambda 함수를 대상으로 합니다.` },
  ],
  answer: ['A'],
  vote: '67% A',
  explain: `<p><span class="mark-ok">✅ A — AWS Health 이벤트 + AWS-RestartEC2Instance 런북</span></p><p>AWS Health는 예약된 인스턴스 종료 및 서비스 해제 이벤트를 발생시킵니다. EventBridge에서 이러한 이벤트를 감지하고 AWS-RestartEC2Instance Systems Manager Automation 런북을 직접 호출하면 중간 Lambda 함수 없이 간결한 솔루션이 됩니다. 유지 관리 기간과 통합된 SSM이 재시작을 관리합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — Systems Manager는 Health 알림과 관련된 이벤트 소스를 제공하지 않습니다.</p><p><span class="mark-no">❌ C</span> — Lambda로 유지 관리 기간 작업을 등록하는 방식은 불필요한 복잡성을 추가합니다.</p><p><span class="mark-no">❌ D</span> — EC2 인스턴스 상태 알림은 AWS Health 이벤트와 다릅니다.</p>`,
  disc: [{ ans:'A (67%) vs C (33%)', txt:'A가 간단하지만, C는 유지 관리 기간을 더 정확히 준수한다는 논쟁이 있습니다. AWS Health 이벤트가 인스턴스 재시작의 직접적 트리거로 적합합니다.' }]
},
{
  n: 315,
  en: `A DevOps engineer manages an AWS CodePipeline pipeline that builds and deploys a web application on AWS. The pipeline has a source stage, a build stage, and a deploy stage. When deployed properly, the web application responds with a 200 OK HTTP response code when the URL of the home page is requested.<br>The home page recently returned a 503 HTTP response code after CodePipeline deployed the application. The DevOps engineer needs to add an automated test into the pipeline. The automated test must ensure that the application returns a 200 OK HTTP response code after the application is deployed. The pipeline must fail if the response code is not present during the test. The DevOps engineer has added a CheckURL stage after the deploy stage in the pipeline.<br>What should the DevOps engineer do next to implement the automated test?`,
  ko: `DevOps 엔지니어는 AWS에서 웹 애플리케이션을 빌드하고 배포하는 AWS CodePipeline 파이프라인을 관리합니다. 파이프라인에는 소스, 빌드, 배포 스테이지가 있습니다. 올바르게 배포된 경우 웹 애플리케이션은 홈페이지 URL 요청 시 200 OK HTTP 응답 코드로 응답합니다.<br>최근에 CodePipeline이 애플리케이션을 배포한 후 홈페이지에서 503 HTTP 응답 코드가 반환되었습니다. 배포 후 애플리케이션이 200 OK HTTP 응답 코드를 반환하는지 확인하는 자동화된 테스트를 파이프라인에 추가해야 합니다. DevOps 엔지니어는 파이프라인의 배포 스테이지 뒤에 CheckURL 스테이지를 추가했습니다.<br>자동화된 테스트를 구현하기 위해 다음에 무엇을 해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure the CheckURL stage to use an Amazon CloudWatch action. Configure the action to use a canary synthetic monitoring check on the application URL and to report a success or failure to CodePipeline.`, ko:`CheckURL 스테이지를 구성하여 Amazon CloudWatch 작업을 사용합니다. 애플리케이션 URL에서 카나리아 합성 모니터링 검사를 사용하고 CodePipeline에 성공 또는 실패를 보고하도록 작업을 구성합니다.` },
    { k:'B', en:`Create an AWS Lambda function to check the response code status of the URL and to report a success or failure to CodePipeline. Configure an action in the CheckURL stage to invoke the Lambda function.`, ko:`URL의 응답 코드 상태를 확인하고 CodePipeline에 성공 또는 실패를 보고하는 AWS Lambda 함수를 생성합니다. CheckURL 스테이지에서 Lambda 함수를 호출하는 작업을 구성합니다.` },
    { k:'C', en:`Configure the CheckURL stage to use an AWS CodeDeploy action. Configure the action with an input artifact that is the URL of the application and to report a success or failure to CodePipeline.`, ko:`CheckURL 스테이지를 구성하여 AWS CodeDeploy 작업을 사용합니다. 애플리케이션 URL을 입력 아티팩트로 사용하고 CodePipeline에 성공 또는 실패를 보고하도록 작업을 구성합니다.` },
    { k:'D', en:`Deploy an Amazon API Gateway HTTP API that checks the response code status of the URL and that reports success or failure to CodePipeline. Configure the CheckURL stage to use the AWS Device Farm test action and to provide the API Gateway HTTP API as an input artifact.`, ko:`URL의 응답 코드 상태를 확인하고 CodePipeline에 성공 또는 실패를 보고하는 Amazon API Gateway HTTP API를 배포합니다. CheckURL 스테이지를 구성하여 AWS Device Farm 테스트 작업을 사용하고 API Gateway HTTP API를 입력 아티팩트로 제공합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — Lambda 함수로 URL 응답 코드 확인 + CodePipeline 보고</span></p><p>AWS Lambda 함수는 애플리케이션의 홈페이지 URL에 HTTP 요청을 보내고 응답 코드를 확인합니다. 200 OK가 아닌 경우 실패를 CodePipeline에 보고하면 파이프라인이 실패합니다. Lambda 작업은 CodePipeline과 기본 통합되어 있어 가장 직접적이고 간단한 구현 방법입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CloudWatch 합성 모니터링은 지속적인 모니터링을 위한 것으로 파이프라인 단일 테스트에 적합하지 않습니다.</p><p><span class="mark-no">❌ C</span> — CodeDeploy는 애플리케이션 배포 도구로 URL 응답 코드 검사 기능이 없습니다.</p><p><span class="mark-no">❌ D</span> — API Gateway + Device Farm은 불필요하게 복잡합니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'Lambda를 CheckURL 스테이지의 작업으로 사용하는 것이 가장 간단하고 직접적인 솔루션이라는 의견이 일치합니다.' }]
},
{
  n: 316,
  en: `A company has an application that uploads access logs to an Amazon CloudWatch Logs log group. The fields in the log lines include the response code and the application name.<br>The company wants to create a CloudWatch metric to track the number of requests by response code in a specific range and with a specific application name.<br>Which solution will meet these requirements?`,
  ko: `한 회사의 애플리케이션이 액세스 로그를 Amazon CloudWatch Logs 로그 그룹에 업로드합니다. 로그 줄의 필드에는 응답 코드와 애플리케이션 이름이 포함됩니다.<br>이 회사는 특정 범위와 특정 애플리케이션 이름을 가진 응답 코드별 요청 수를 추적하는 CloudWatch 메트릭을 생성하려 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a CloudWatch Logs log event filter on the CloudWatch Logs log stream to match the response code range. Configure the log event filter to increment a metric. Set the response code and application name as dimensions.`, ko:`CloudWatch Logs 로그 스트림에서 응답 코드 범위와 일치하도록 CloudWatch Logs 로그 이벤트 필터를 생성합니다. 메트릭을 증가시키도록 로그 이벤트 필터를 구성합니다. 응답 코드와 애플리케이션 이름을 차원으로 설정합니다.` },
    { k:'B', en:`Create a CloudWatch Logs metric filter on the CloudWatch Logs log group to match the response code range. Configure the metric filter to increment a metric. Set the response code and application name as dimensions.`, ko:`CloudWatch Logs 로그 그룹에서 응답 코드 범위와 일치하도록 CloudWatch Logs 메트릭 필터를 생성합니다. 메트릭을 증가시키도록 메트릭 필터를 구성합니다. 응답 코드와 애플리케이션 이름을 차원으로 설정합니다.` },
    { k:'C', en:`Create a CloudWatch Contributor Insights rule on the CloudWatch Logs log stream with a filter to match the response code range. Configure the Contributor Insights rule to increment a CloudWatch metric with the response code and application name as dimensions.`, ko:`응답 코드 범위와 일치하는 필터가 있는 CloudWatch Logs 로그 스트림에서 CloudWatch Contributor Insights 규칙을 생성합니다. 응답 코드와 애플리케이션 이름을 차원으로 사용하여 CloudWatch 메트릭을 증가시키도록 Contributor Insights 규칙을 구성합니다.` },
    { k:'D', en:`Create a CloudWatch Logs Insights query on the CloudWatch Logs log group to match the response code range. Configure the Logs Insights query to increment a CloudWatch metric with the response code and application name as dimensions.`, ko:`응답 코드 범위와 일치하도록 CloudWatch Logs 로그 그룹에 CloudWatch Logs Insights 쿼리를 생성합니다. 응답 코드와 애플리케이션 이름을 차원으로 사용하여 CloudWatch 메트릭을 증가시키도록 Logs Insights 쿼리를 구성합니다.` },

  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — CloudWatch Logs 메트릭 필터 (로그 그룹 수준)</span></p><p>CloudWatch Logs 메트릭 필터는 로그 그룹 수준에서 특정 패턴을 추출하여 CloudWatch 메트릭을 생성합니다. 응답 코드 범위와 일치하는 필터 패턴을 설정하고, 응답 코드와 애플리케이션 이름을 메트릭 차원으로 지정하면 요청 수를 추적하는 메트릭을 생성할 수 있습니다.</p>`,

  disc: [{ ans:'B (100%)', txt:'로그 그룹에서 메트릭 필터를 생성하고 응답 코드와 애플리케이션 이름을 차원으로 사용하는 것이 올바른 방법이라는 의견이 일치합니다.' }]

{
  n: 317,
  en: `A DevOps engineer provisioned an Amazon Elastic Kubernetes Service (Amazon EKS) cluster with managed node groups. The DevOps engineer associated an OpenID Connect (OIDC) issuer with the cluster.<br>The DevOps engineer is configuring Amazon Elastic Block Store (Amazon EBS) General Purpose SSD (gp3) volumes for the cluster. The DevOps engineer attempts to initiate a PersistentVolumeClaim (PVC) request but is unable to provision a volume. To troubleshoot the issue, the DevOps engineer runs the <code>kubectl describe pvc</code> command. The DevOps engineer receives a failed to provision volume with StorageClass error and a could not create volume in EC2:UnauthorizedOperation error.<br>Which solution will resolve these errors?`,
  ko: `DevOps 엔지니어가 관리형 노드 그룹이 있는 Amazon EKS 클러스터를 프로비저닝했습니다. DevOps 엔지니어는 OIDC 발급자를 클러스터와 연결했습니다.<br>EKS 클러스터에 Amazon EBS gp3 볼륨을 구성하고 있습니다. PersistentVolumeClaim(PVC) 요청을 시작하려 하지만 볼륨을 프로비저닝할 수 없습니다. <code>kubectl describe pvc</code> 명령을 실행하면 StorageClass 오류와 함께 볼륨 프로비저닝 실패 및 EC2:UnauthorizedOperation 오류를 수신합니다.<br>이 오류를 해결하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a Kubernetes cluster role that allows the persistent volumes to perform get, list, watch, create, and delete operations. Configure the cluster role to allow get, list, and watch operations for storage in the cluster.`, ko:`영구 볼륨이 get, list, watch, create, delete 작업을 수행할 수 있도록 하는 Kubernetes 클러스터 역할을 생성합니다. 클러스터의 스토리지에 대한 get, list, watch 작업을 허용하도록 클러스터 역할을 구성합니다.` },
    { k:'B', en:`Create an Amazon EBS Container Storage Interface (CSI) driver IAM role that has the required permissions and trust relationships. Attach the IAM role to the Amazon EBS CSI driver add-on in the cluster.`, ko:`필요한 권한과 신뢰 관계가 있는 Amazon EBS CSI 드라이버 IAM 역할을 생성합니다. 클러스터의 Amazon EBS CSI 드라이버 애드온에 IAM 역할을 연결합니다.` },
    { k:'C', en:`Add the ebs.csi.aws.com/volumeType:gp3 annotation to the PersistentVolumeClaim object in the cluster.`, ko:`클러스터의 PersistentVolumeClaim 객체에 ebs.csi.aws.com/volumeType:gp3 주석을 추가합니다.` },
    { k:'D', en:`Create a Kubernetes storage class object. Set the provisioner value to ebs.csi.aws.com. Set the volumeBindingMode value to WaitForFirstConsumer in the cluster.`, ko:`Kubernetes 스토리지 클래스 객체를 생성합니다. provisioner 값을 ebs.csi.aws.com으로 설정합니다. 클러스터에서 volumeBindingMode 값을 WaitForFirstConsumer로 설정합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — EBS CSI 드라이버 IAM 역할 생성 및 연결</span></p><p>오류 메시지 "EC2:UnauthorizedOperation"은 EBS CSI 드라이버에 EC2 API를 통해 EBS 볼륨을 프로비저닝하는 데 필요한 IAM 권한이 없음을 나타냅니다. OIDC가 구성되어 있으므로 IAM 역할을 생성하여 서비스 계정에 연결하고 EBS CSI 드라이버 애드온에 적용해야 합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Kubernetes RBAC는 Kubernetes API 권한을 제어하며, EC2 API 호출 권한과 무관합니다.</p><p><span class="mark-no">❌ C</span> — 볼륨 유형 주석은 스토리지 유형을 지정하는 것으로 IAM 권한 오류를 해결하지 않습니다.</p><p><span class="mark-no">❌ D</span> — StorageClass 구성은 스토리지 프로비저닝 방식이지 IAM 권한 문제의 해결책이 아닙니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'EC2:UnauthorizedOperation 오류는 EBS CSI 드라이버의 IAM 권한 부재가 원인이며, IAM 역할 생성 및 연결이 올바른 해결책입니다.' }]
},
{
  n: 318,
  en: `A company runs a fleet of Amazon EC2 instances in a VPC. The company's employees remotely access the EC2 instances by using the Remote Desktop Protocol (RDP).<br>The company wants to collect metrics about how many RDP sessions the employees initiate every day.<br>Which combination of steps will meet this requirement? (Choose three.)`,
  ko: `한 회사가 VPC에서 Amazon EC2 인스턴스 플릿을 운영합니다. 회사 직원들은 RDP(Remote Desktop Protocol)를 사용하여 EC2 인스턴스에 원격으로 액세스합니다.<br>회사는 직원들이 매일 시작하는 RDP 세션 수에 대한 메트릭을 수집하려 합니다.<br>이 요구 사항을 충족하는 단계 조합은 무엇입니까? (3개 선택)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Create an Amazon EventBridge rule that reacts to EC2 Instance State-change Notification events.`, ko:`EC2 인스턴스 상태 변경 알림 이벤트에 반응하는 Amazon EventBridge 규칙을 생성합니다.` },
    { k:'B', en:`Create an Amazon CloudWatch Logs log group. Specify the log group as a target for the EventBridge rule.`, ko:`Amazon CloudWatch Logs 로그 그룹을 생성합니다. 로그 그룹을 EventBridge 규칙의 대상으로 지정합니다.` },
    { k:'C', en:`Create a flow log in VPC Flow Logs.`, ko:`VPC Flow Logs에 흐름 로그를 생성합니다.` },
    { k:'D', en:`Create an Amazon CloudWatch Logs log group. Specify the log group as a destination for the flow log.`, ko:`Amazon CloudWatch Logs 로그 그룹을 생성합니다. 로그 그룹을 흐름 로그의 대상으로 지정합니다.` },
    { k:'E', en:`Create a log group metric filter.`, ko:`로그 그룹 메트릭 필터를 생성합니다.` },
    { k:'F', en:`Create a log group subscription filter. Use EventBridge as the destination.`, ko:`로그 그룹 구독 필터를 생성합니다. EventBridge를 대상으로 사용합니다.` },
  ],
  answer: ['C','D','E'],
  vote: '90% CDE',
  explain: `<p><span class="mark-ok">✅ C — VPC Flow Logs 흐름 로그 생성</span></p><p>VPC Flow Logs는 TCP 포트 3389(RDP)를 포함한 VPC의 네트워크 트래픽을 캡처합니다. 에이전트 설치 없이 네트워크 관점에서 RDP 세션을 감지하는 유일한 방법입니다.</p><p><span class="mark-ok">✅ D — CloudWatch Logs 로그 그룹을 흐름 로그 대상으로 지정</span></p><p>흐름 로그 데이터를 CloudWatch Logs에 저장하여 분석할 수 있도록 합니다.</p><p><span class="mark-ok">✅ E — 로그 그룹 메트릭 필터 생성</span></p><p>포트 3389와 ACCEPT 작업을 필터링하는 메트릭 필터를 생성하여 RDP 연결 수를 계산하는 CloudWatch 메트릭을 만듭니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A, B</span> — EC2 상태 변경 이벤트는 RDP 세션 시작과 직접 관련이 없습니다.</p><p><span class="mark-no">❌ F</span> — 구독 필터는 로그를 다른 서비스로 스트리밍하는 용도이며 메트릭 생성이 아닙니다.</p>`,
  disc: [{ ans:'CDE (90%)', txt:'VPC Flow Logs로 네트워크 트래픽 캡처, CloudWatch Logs로 저장, 메트릭 필터로 RDP 세션 수 계산하는 것이 올바른 패턴입니다.' }]
},
{
  n: 319,
  en: `A company is using Amazon Elastic Kubernetes Service (Amazon EKS) to run its applications. The EKS cluster is successfully running multiple pods. The company stores the pod images in Amazon Elastic Container Registry (Amazon ECR).<br>The company needs to configure Pod Identity access for the EKS cluster. The company has already updated the node IAM role by using the permissions for Pod Identity access.<br>Which solution will meet these requirements?`,
  ko: `한 회사가 Amazon EKS를 사용하여 애플리케이션을 실행합니다. EKS 클러스터는 여러 포드를 성공적으로 실행 중입니다. 회사는 포드 이미지를 Amazon ECR에 저장합니다.<br>회사는 EKS 클러스터에 대한 Pod Identity 액세스를 구성해야 합니다. 회사는 이미 Pod Identity 액세스 권한을 사용하여 노드 IAM 역할을 업데이트했습니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an IAM OpenID Connect (OIDC) provider for the EKS cluster.`, ko:`EKS 클러스터에 대한 IAM OpenID Connect(OIDC) 공급자를 생성합니다.` },
    { k:'B', en:`Ensure that the nodes can reach the EKS Auth API. Add and configure the EKS Pod Identity Agent add-on for the EKS cluster.`, ko:`노드가 EKS Auth API에 도달할 수 있는지 확인합니다. EKS 클러스터에 EKS Pod Identity Agent 애드온을 추가하고 구성합니다.` },
    { k:'C', en:`Create an EKS access entry that uses the API_AND_CONFIG_MAP cluster authentication mode.`, ko:`API_AND_CONFIG_MAP 클러스터 인증 모드를 사용하는 EKS 액세스 항목을 생성합니다.` },
    { k:'D', en:`Configure the AWS Security Token Service (AWS STS) endpoint for the Kubernetes service account that the pods in the EKS cluster use.`, ko:`EKS 클러스터의 포드가 사용하는 Kubernetes 서비스 계정에 대한 AWS STS 엔드포인트를 구성합니다.` },
  ],
  answer: ['B'],
  vote: '85% B',
  explain: `<p><span class="mark-ok">✅ B — EKS Pod Identity Agent 애드온 추가</span></p><p>EKS Pod Identity는 IRSA(서비스 계정용 IAM 역할)의 새로운 대안으로, OIDC에 의존하지 않습니다. Pod Identity를 사용하려면 다음이 필요합니다: (1) 노드 IAM 역할 업데이트(이미 완료), (2) EKS Auth API 접근 가능 여부 확인, (3) EKS Pod Identity Agent 애드온 설치 및 구성.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — OIDC는 IRSA를 위한 것이며, Pod Identity는 OIDC가 필요 없습니다.</p><p><span class="mark-no">❌ C</span> — EKS 액세스 항목은 클러스터 인증 설정이며 Pod Identity와 무관합니다.</p><p><span class="mark-no">❌ D</span> — AWS STS 엔드포인트 구성은 Pod Identity 설정과 관련 없습니다.</p>`,
  disc: [{ ans:'B (85%)', txt:'EKS Pod Identity는 OIDC 불필요, Pod Identity Agent 애드온 설치가 핵심 단계라는 의견이 우세합니다.' }]
