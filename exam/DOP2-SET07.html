{
  n: 320,
  en: `A company has multiple AWS accounts in an organization in AWS Organizations that has all features enabled. The company's DevOps administrator needs to improve security across all the company's AWS accounts. The administrator needs to identify the top users and roles in use across all accounts.<br>Which solution will meet these requirements with the MOST operational efficiency?`,
  ko: `한 회사가 모든 기능이 활성화된 AWS Organizations의 조직에 여러 AWS 계정을 보유하고 있습니다. 회사의 DevOps 관리자는 모든 AWS 계정에서 보안을 개선해야 합니다. 관리자는 모든 계정에서 사용 중인 상위 사용자와 역할을 식별해야 합니다.<br>가장 높은 운영 효율성으로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a new organization trail in AWS CloudTrail. Configure the trail to send log events to Amazon CloudWatch Logs. Create a CloudWatch Contributor Insights rule for the userIdentity.arn log field. View the results in CloudWatch Contributor Insights.`, ko:`AWS CloudTrail에서 새 조직 트레일을 생성합니다. 로그 이벤트를 Amazon CloudWatch Logs로 보내도록 트레일을 구성합니다. userIdentity.arn 로그 필드에 대한 CloudWatch Contributor Insights 규칙을 생성합니다. CloudWatch Contributor Insights에서 결과를 확인합니다.` },
    { k:'B', en:`Use AWS Identity and Access Management Access Analyzer to create an unused access analysis for the organization. Review the analyzer results and determine if each finding has the intended level of permissions required for the workload.`, ko:`AWS IAM Access Analyzer를 사용하여 조직에 대한 사용되지 않은 액세스 분석을 생성합니다. 분석기 결과를 검토하고 각 결과에 워크로드에 필요한 의도된 수준의 권한이 있는지 확인합니다.` },
    { k:'C', en:`Create a new organization trail in AWS CloudTrail. Create a table in Amazon Athena that uses partition projection. Load the Athena table with CloudTrail data. Query the Athena table to find the top users and roles.`, ko:`AWS CloudTrail에서 새 조직 트레일을 생성합니다. 파티션 프로젝션을 사용하는 Amazon Athena에서 테이블을 생성합니다. CloudTrail 데이터로 Athena 테이블을 로드합니다. Athena 테이블을 쿼리하여 상위 사용자와 역할을 찾습니다.` },
    { k:'D', en:`Generate a Service access report for each account by using Organizations. From the results, pull the last accessed date and last accessed by account fields to find the top users and roles.`, ko:`Organizations를 사용하여 각 계정에 대한 서비스 액세스 보고서를 생성합니다. 결과에서 마지막으로 액세스한 날짜와 계정별 마지막으로 액세스한 필드를 가져와 상위 사용자와 역할을 찾습니다.` },
  ],
  answer: ['C'],
  vote: '58% C',
  explain: `<p><span class="mark-ok">✅ C — CloudTrail 조직 트레일 + Athena 파티션 프로젝션</span></p><p>조직 트레일로 모든 계정의 CloudTrail 로그를 집계하고, Athena의 파티션 프로젝션으로 대규모 로그를 효율적으로 쿼리합니다. SQL 쿼리로 자동화 반복 가능하게 상위 사용자와 역할을 파악할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Contributor Insights는 실시간 분석에 적합하지만, 대규모 멀티 계정 환경에서 역사적 데이터 분석은 Athena가 더 효율적입니다.</p><p><span class="mark-no">❌ B</span> — IAM Access Analyzer는 사용되지 않는 액세스를 찾는 도구로, 상위 사용자 식별과 목적이 다릅니다.</p><p><span class="mark-no">❌ D</span> — 서비스 액세스 보고서는 개별 사용자/역할별 활동을 추적하는 데 적합하지 않습니다.</p>`,
  disc: [{ ans:'C (58%) vs A (42%)', txt:'Athena 파티션 프로젝션이 운영 효율성 측면에서 더 강력하다는 의견과 Contributor Insights가 더 간단하다는 의견이 나뉩니다.' }]
},
{
  n: 321,
  en: `A company has an organization in AWS Organizations with many OUs that contain many AWS accounts. The organization has a dedicated delegated administrator AWS account.<br>The company needs the accounts in one OU to have server-side encryption enforced for all Amazon Elastic Block Store (Amazon EBS) volumes and Amazon Simple Queue Service (Amazon SQS) queues that are created or updated on an AWS CloudFormation stack.<br>Which solution will enforce this policy before a CloudFormation stack operation in the accounts of this OU?`,
  ko: `한 회사가 많은 AWS 계정이 포함된 여러 OU를 가진 AWS Organizations 조직을 보유하고 있습니다. 조직에는 전담 위임 관리자 AWS 계정이 있습니다.<br>회사는 한 OU의 계정에서 AWS CloudFormation 스택에서 생성되거나 업데이트되는 모든 Amazon EBS 볼륨과 Amazon SQS 대기열에 대해 서버 측 암호화가 적용되어야 합니다.<br>이 OU의 계정에서 CloudFormation 스택 작업 전에 이 정책을 적용하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Activate trusted access to CloudFormation StackSets. Create a CloudFormation Hook that enforces server-side encryption on EBS volumes and SQS queues. Deploy the Hook across the accounts in the OU by using StackSets.`, ko:`CloudFormation StackSets에 대한 신뢰할 수 있는 액세스를 활성화합니다. EBS 볼륨과 SQS 대기열에 서버 측 암호화를 적용하는 CloudFormation Hook을 생성합니다. StackSets를 사용하여 OU의 계정 전체에 Hook을 배포합니다.` },
    { k:'B', en:`Set up AWS Config in all the accounts in the OU. Use AWS Systems Manager to deploy AWS Config rules that enforce server-side encryption for EBS volumes and SQS queues across the accounts in the OU.`, ko:`OU의 모든 계정에서 AWS Config를 설정합니다. AWS Systems Manager를 사용하여 OU의 계정 전체에서 EBS 볼륨과 SQS 대기열에 대한 서버 측 암호화를 적용하는 AWS Config 규칙을 배포합니다.` },
    { k:'C', en:`Write an SCP to deny the creation of EBS volumes and SQS queues unless the EBS volumes and SQS queues have server-side encryption. Attach the SCP to the OU.`, ko:`EBS 볼륨과 SQS 큐에 서버 측 암호화가 없는 한 EBS 볼륨과 SQS 큐의 생성을 거부하는 SCP를 작성합니다. SCP를 OU에 연결합니다.` },
    { k:'D', en:`Create an AWS Lambda function in the delegated administrator account that checks whether server-side encryption is enforced for EBS volumes and SQS queues. Create an IAM role to provide the Lambda function access to the accounts in the OU.`, ko:`위임된 관리자 계정에서 EBS 볼륨 및 SQS 대기열에 서버 측 암호화가 적용되는지 확인하는 AWS Lambda 함수를 생성합니다. Lambda 함수에 OU의 계정에 대한 액세스 권한을 제공하는 IAM 역할을 생성합니다.` },
  ],
  answer: ['A'],
  vote: '94% A',
  explain: `<p><span class="mark-ok">✅ A — CloudFormation Hooks + StackSets 배포</span></p><p>CloudFormation Hooks는 스택 작업 전에 리소스 구성을 검증하고 정책을 적용할 수 있습니다. EBS 볼륨과 SQS 대기열에 서버 측 암호화가 활성화되어 있는지 확인하는 Hook을 생성하고, StackSets로 OU 전체에 배포하면 스택 작업 전에 정책이 적용됩니다. 키워드: "CloudFormation 스택 작업 전에 적용"</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — AWS Config는 구성 후 감지 및 수정이며 스택 작업 전 예방적 통제가 아닙니다.</p><p><span class="mark-no">❌ C</span> — SCP는 CloudFormation을 통하지 않은 직접 API 호출에만 적용되며 CloudFormation 스택 작업 자체를 차단하지 않을 수 있습니다.</p><p><span class="mark-no">❌ D</span> — Lambda 기반 사후 검사는 스택 작업 전 정책 적용이 아닙니다.</p>`,
  disc: [{ ans:'A (94%)', txt:'CloudFormation Hooks가 스택 작업 전 암호화 정책을 적용하는 올바른 메커니즘이라는 의견이 압도적입니다.' }]
},
{
  n: 322,
  en: `A company is running an internal application in an Amazon Elastic Container Service (Amazon ECS) cluster on Amazon EC2. The ECS cluster instances can connect to the public internet. The ECS tasks that run on the cluster instances are configured to use images from both private Amazon Elastic Container Registry (Amazon ECR) repositories and a public ECR registry repository.<br>A new security policy requires the company to remove the ECS cluster's direct access to the internet. The company must remove any NAT gateways and internet gateways from the VPC that hosts the cluster. A DevOps engineer needs to ensure the ECS cluster can still download images from both the public ECR registry and the private ECR repositories. Images from the public ECR registry must remain up-to-date. New versions of the images must be available to the ECS cluster within 24 hours of publication.<br>Which combination of steps will meet these requirements with the LEAST operational overhead? (Choose three.)`,
  ko: `한 회사가 Amazon EC2의 Amazon ECS 클러스터에서 내부 애플리케이션을 실행하고 있습니다. ECS 클러스터 인스턴스는 퍼블릭 인터넷에 연결할 수 있습니다. 클러스터 인스턴스에서 실행되는 ECS 작업은 프라이빗 Amazon ECR 리포지토리와 퍼블릭 ECR 레지스트리 리포지토리의 이미지를 모두 사용하도록 구성되어 있습니다.<br>새 보안 정책에 따라 회사는 ECS 클러스터의 인터넷 직접 액세스를 제거해야 합니다. VPC에서 모든 NAT 게이트웨이와 인터넷 게이트웨이를 제거해야 합니다. ECS 클러스터가 퍼블릭 ECR 레지스트리와 프라이빗 ECR 리포지토리에서 이미지를 계속 다운로드할 수 있는지 확인해야 합니다. 퍼블릭 ECR 레지스트리의 이미지는 게시 후 24시간 이내에 ECS 클러스터에서 사용할 수 있어야 합니다.<br>운영 오버헤드를 최소화하면서 이 요구 사항을 충족하는 단계 조합은 무엇입니까? (3개 선택)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Create an AWS CodeBuild project and a new private ECR repository for each image that is downloaded from the public ECR registry. Configure each project to pull the image from the public ECR repository and push the image to the new private ECR repository. Create an Amazon EventBridge rule that invokes the CodeBuild project once every 24 hours. Update each task definition in the ECS cluster to refer to the new private ECR repository.`, ko:`퍼블릭 ECR 레지스트리에서 다운로드한 각 이미지에 대해 AWS CodeBuild 프로젝트와 새 프라이빗 ECR 리포지토리를 생성합니다. 각 프로젝트를 구성하여 퍼블릭 ECR 리포지토리에서 이미지를 가져와 새 프라이빗 ECR 리포지토리에 푸시합니다. 24시간마다 CodeBuild 프로젝트를 호출하는 Amazon EventBridge 규칙을 생성합니다. 각 작업 정의를 업데이트하여 새 프라이빗 ECR 리포지토리를 참조합니다.` },
    { k:'B', en:`Create a new Amazon ECR pull through cache rule for each image that is downloaded from the public ECR registry. Create an AWS Lambda function that invokes each pull through cache rule. Create an Amazon EventBridge rule that invokes the Lambda function once every 24 hours. Update each task definition in the ECS cluster to refer to the image from the pull through cache.`, ko:`퍼블릭 ECR 레지스트리에서 다운로드한 각 이미지에 대해 새로운 Amazon ECR 풀스루 캐시 규칙을 생성합니다. 각 풀스루 캐시 규칙을 호출하는 AWS Lambda 함수를 생성합니다. 24시간마다 Lambda 함수를 호출하는 Amazon EventBridge 규칙을 생성합니다. 풀스루 캐시의 이미지를 참조하도록 각 작업 정의를 업데이트합니다.` },
    { k:'C', en:`Create a new Amazon ECR pull through cache rule for the public ECR registry. Update each task definition in the ECS cluster to refer to the image from the pull through cache. Ensure each public image has been downloaded through the pull through cache at least once before removing internet access from the VPC.`, ko:`퍼블릭 ECR 레지스트리에 대한 새로운 Amazon ECR 풀스루 캐시 규칙을 생성합니다. 풀스루 캐시의 이미지를 참조하도록 각 작업 정의를 업데이트합니다. VPC에서 인터넷 액세스를 제거하기 전에 각 퍼블릭 이미지가 풀스루 캐시를 통해 최소한 한 번 다운로드되었는지 확인합니다.` },
    { k:'D', en:`Create an Amazon ECR interface VPC endpoint for the public ECR repositories that are in the VPC.`, ko:`VPC에 있는 퍼블릭 ECR 리포지토리에 대한 Amazon ECR 인터페이스 VPC 엔드포인트를 생성합니다.` },
    { k:'E', en:`Create an Amazon ECR interface VPC endpoint for the private ECR repositories that are in the VPC.`, ko:`VPC에 있는 프라이빗 ECR 리포지토리에 대한 Amazon ECR 인터페이스 VPC 엔드포인트를 생성합니다.` },
    { k:'F', en:`Create an Amazon S3 gateway endpoint in the VPC.`, ko:`VPC에 Amazon S3 게이트웨이 엔드포인트를 생성합니다.` },
  ],
  answer: ['C','E','F'],
  vote: '100% CEF',
  explain: `<p><span class="mark-ok">✅ C — ECR 풀스루 캐시 규칙</span></p><p>퍼블릭 ECR 이미지를 프라이빗 ECR에 캐시하면 인터넷 없이 이미지에 접근 가능합니다. 새 버전이 게시되면 자동으로 업데이트됩니다.</p><p><span class="mark-ok">✅ E — 프라이빗 ECR 인터페이스 VPC 엔드포인트</span></p><p>인터넷 또는 NAT 게이트웨이 없이 VPC에서 프라이빗 ECR에 접근하기 위해 필요합니다.</p><p><span class="mark-ok">✅ F — S3 게이트웨이 엔드포인트</span></p><p>ECR은 이미지 레이어를 S3에 저장합니다. ECS가 이미지를 가져올 때 S3 레이어 다운로드가 필요하므로 S3 게이트웨이 엔드포인트가 필요합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CodeBuild를 통한 수동 동기화는 불필요한 운영 오버헤드를 추가합니다.</p><p><span class="mark-no">❌ B</span> — Lambda로 풀스루 캐시를 수동 호출하는 것은 불필요합니다. 풀스루 캐시는 이미지 요청 시 자동 업데이트됩니다.</p><p><span class="mark-no">❌ D</span> — AWS 공식 문서에 따르면 VPC 엔드포인트는 퍼블릭 ECR 리포지토리를 직접 지원하지 않습니다. 풀스루 캐시로 프라이빗 ECR에 호스팅해야 합니다.</p>`,
  disc: [{ ans:'CEF (100%)', txt:'풀스루 캐시로 퍼블릭 이미지 호스팅, 프라이빗 ECR VPC 엔드포인트, S3 게이트웨이 엔드포인트가 인터넷 없는 ECS 이미지 접근의 올바른 패턴입니다.' }]
},
{
  n: 323,
  en: `A company has a continuous integration pipeline where the company creates container images by using AWS CodeBuild. The created images are stored in Amazon Elastic Container Registry (Amazon ECR).<br>Checking for and fixing the vulnerabilities in the images takes the company too much time. The company wants to identify the image vulnerabilities quickly and notify the security team of the vulnerabilities.<br>Which combination of steps will meet these requirements with the LEAST operational overhead? (Choose two.)`,
  ko: `한 회사에 AWS CodeBuild를 사용하여 컨테이너 이미지를 생성하는 지속적인 통합 파이프라인이 있습니다. 생성된 이미지는 Amazon ECR에 저장됩니다.<br>이미지의 취약성을 확인하고 수정하는 데 너무 많은 시간이 소모됩니다. 회사는 이미지 취약성을 신속하게 식별하고 보안 팀에 취약성을 알리고 싶어합니다.<br>운영 오버헤드를 최소화하면서 이 요구 사항을 충족하는 단계 조합은 무엇입니까? (2개 선택)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Activate Amazon Inspector enhanced scanning for Amazon ECR. Configure the enhanced scanning to use continuous scanning. Set up a topic in Amazon Simple Notification Service (Amazon SNS).`, ko:`Amazon ECR에 대한 Amazon Inspector 향상된 스캐닝을 활성화합니다. 지속적인 스캐닝을 사용하도록 향상된 스캐닝을 구성합니다. Amazon SNS에서 토픽을 설정합니다.` },
    { k:'B', en:`Create an Amazon EventBridge rule for Amazon Inspector findings. Set an Amazon Simple Notification Service (Amazon SNS) topic as the rule target.`, ko:`Amazon Inspector 결과에 대한 Amazon EventBridge 규칙을 생성합니다. Amazon SNS 토픽을 규칙 대상으로 설정합니다.` },
    { k:'C', en:`Activate AWS Lambda enhanced scanning for Amazon ECR. Configure the enhanced scanning to use continuous scanning. Set up a topic in Amazon Simple Email Service (Amazon SES).`, ko:`Amazon ECR에 대한 AWS Lambda 향상된 스캐닝을 활성화합니다. 지속적인 스캐닝을 사용하도록 향상된 스캐닝을 구성합니다. Amazon SES에서 토픽을 설정합니다.` },
    { k:'D', en:`Create a new AWS Lambda function. Invoke the new Lambda function when scan findings are detected.`, ko:`새 AWS Lambda 함수를 생성합니다. 스캔 결과가 감지되면 새 Lambda 함수를 호출합니다.` },
    { k:'E', en:`Activate default basic scanning for Amazon ECR for all container images. Configure the default basic scanning to use continuous scanning. Set up a topic in Amazon Simple Notification Service (Amazon SNS).`, ko:`모든 컨테이너 이미지에 대해 Amazon ECR에 대한 기본 기본 스캐닝을 활성화합니다. 기본 기본 스캐닝을 구성하여 연속 스캐닝을 사용합니다. Amazon SNS에서 토픽을 설정합니다.` },
  ],
  answer: ['A','B'],
  vote: '100% AB',
  explain: `<p><span class="mark-ok">✅ A — Amazon Inspector 향상된 스캐닝 + SNS 토픽</span></p><p>Amazon Inspector는 ECR 이미지 푸시 시 자동 스캔 및 지속적 재스캔을 지원합니다. SNS 토픽 설정으로 알림 전송 준비를 합니다.</p><p><span class="mark-ok">✅ B — Inspector 결과에 대한 EventBridge 규칙 + SNS 대상</span></p><p>Inspector 결과가 EventBridge 이벤트로 생성됩니다. EventBridge 규칙으로 SNS에 알림을 전송하면 보안 팀이 즉시 통보됩니다. 사용자 지정 로직 불필요합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ C</span> — "AWS Lambda 향상된 스캐닝"은 존재하지 않습니다. Amazon Inspector를 사용해야 합니다.</p><p><span class="mark-no">❌ D</span> — Lambda 함수 추가는 불필요한 복잡성을 추가합니다. EventBridge → SNS가 더 간단합니다.</p><p><span class="mark-no">❌ E</span> — 기본 스캐닝은 향상된 스캐닝보다 기능이 제한적입니다.</p>`,
  disc: [{ ans:'AB (100%)', txt:'Inspector 향상된 스캐닝과 EventBridge → SNS 알림 조합이 가장 적은 운영 오버헤드로 취약성 탐지 및 알림을 제공합니다.' }]
},
{
  n: 324,
  en: `A DevOps administrator is configuring a repository to store a company's container images. The administrator needs to configure a lifecycle rule that automatically deletes container images that have a specific tag and that are older than 15 days.<br>Which solution will meet these requirements with the MOST operational efficiency?`,
  ko: `DevOps 관리자가 회사의 컨테이너 이미지를 저장하기 위해 리포지토리를 구성하고 있습니다. 관리자는 특정 태그가 있고 15일 이상 된 컨테이너 이미지를 자동으로 삭제하는 수명 주기 규칙을 구성해야 합니다.<br>가장 높은 운영 효율성으로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a repository in Amazon Elastic Container Registry (Amazon ECR). Add a lifecycle policy to the repository to expire images that have the matching tag after 15 days.`, ko:`Amazon ECR에서 리포지토리를 생성합니다. 일치하는 태그가 있는 이미지를 15일 후에 만료시키는 수명 주기 정책을 리포지토리에 추가합니다.` },
    { k:'B', en:`Create a repository in AWS CodeArtifact. Add a repository policy to the CodeArtifact repository to expire old assets that have the matching tag after 15 days.`, ko:`AWS CodeArtifact에서 리포지토리를 생성합니다. 일치하는 태그가 있는 오래된 자산을 15일 후에 만료시키는 리포지토리 정책을 CodeArtifact 리포지토리에 추가합니다.` },
    { k:'C', en:`Create a bucket in Amazon S3. Add a bucket lifecycle policy to expire old objects that have the matching tag after 15 days.`, ko:`Amazon S3에 버킷을 생성합니다. 일치하는 태그가 있는 오래된 객체를 15일 후에 만료시키기 위한 버킷 수명 주기 정책을 추가합니다.` },
    { k:'D', en:`Create an EC2 Image Builder container recipe. Add a build component to expire the container that has the matching tag after 15 days.`, ko:`EC2 Image Builder 컨테이너 레시피를 생성합니다. 일치하는 태그가 있는 컨테이너를 15일 후에 만료시키는 빌드 컴포넌트를 추가합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — Amazon ECR 수명 주기 정책</span></p><p>Amazon ECR은 컨테이너 이미지의 보존 기간을 자동으로 관리하는 수명 주기 정책을 지원합니다. 특정 태그를 기준으로 이미지를 매칭하고 15일이 지난 이미지를 자동으로 삭제할 수 있습니다. 컨테이너 이미지 수명 주기 관리를 위해 특별히 설계된 솔루션입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — CodeArtifact는 패키지 저장소이며 컨테이너 이미지 저장에 적합하지 않습니다.</p><p><span class="mark-no">❌ C</span> — S3는 컨테이너 이미지를 위한 전용 서비스가 아닙니다.</p><p><span class="mark-no">❌ D</span> — EC2 Image Builder는 이미지 빌드 도구이며 수명 주기 관리 기능이 없습니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'ECR의 수명 주기 정책이 컨테이너 이미지의 태그 기반 자동 만료를 위한 최적 솔루션입니다.' }]
},
{
  n: 325,
  en: `A company uses Amazon Redshift as its data warehouse solution. The company wants to create a dashboard to view changes to the Redshift users and the queries the users perform.<br>Which combination of steps will meet this requirement? (Choose two.)`,
  ko: `한 회사가 Amazon Redshift를 데이터 웨어하우스 솔루션으로 사용합니다. 회사는 Redshift 사용자와 사용자가 수행하는 쿼리에 대한 변경 사항을 볼 수 있는 대시보드를 생성하려 합니다.<br>이 요구 사항을 충족하는 단계 조합은 무엇입니까? (2개 선택)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Create an Amazon CloudWatch log group. Create an AWS CloudTrail trail that writes to the CloudWatch log group.`, ko:`Amazon CloudWatch 로그 그룹을 생성합니다. CloudWatch 로그 그룹에 쓰는 AWS CloudTrail 트레일을 생성합니다.` },
    { k:'B', en:`Create a new Amazon S3 bucket. Configure default audit logging on the Redshift cluster. Configure the S3 bucket as the target.`, ko:`새 Amazon S3 버킷을 생성합니다. Redshift 클러스터에서 기본 감사 로깅을 구성합니다. S3 버킷을 대상으로 구성합니다.` },
    { k:'C', en:`Configure the Redshift cluster database audit logging to include user activity logs. Configure Amazon CloudWatch as the target.`, ko:`사용자 활동 로그를 포함하도록 Redshift 클러스터 데이터베이스 감사 로깅을 구성합니다. Amazon CloudWatch를 대상으로 구성합니다.` },
    { k:'D', en:`Create an Amazon CloudWatch dashboard that has a log widget. Configure the widget to display user details from the Redshift logs.`, ko:`로그 위젯이 있는 Amazon CloudWatch 대시보드를 생성합니다. Redshift 로그에서 사용자 세부 정보를 표시하도록 위젯을 구성합니다.` },
    { k:'E', en:`Create an AWS Lambda function that uses Amazon Athena to query the Redshift logs. Create an Amazon CloudWatch dashboard that has a custom widget type that uses the Lambda function.`, ko:`Amazon Athena를 사용하여 Redshift 로그를 쿼리하는 AWS Lambda 함수를 생성합니다. Lambda 함수를 사용하는 사용자 지정 위젯 유형이 있는 Amazon CloudWatch 대시보드를 생성합니다.` },
  ],
  answer: ['C','D'],
  vote: '80% CD',
  explain: `<p><span class="mark-ok">✅ C — Redshift 감사 로깅을 CloudWatch로 전송</span></p><p>사용자 활동 로그를 포함하는 Redshift 감사 로깅을 활성화하고 Amazon CloudWatch를 대상으로 설정합니다. 이를 통해 쿼리 실행과 사용자 활동이 기록됩니다.</p><p><span class="mark-ok">✅ D — CloudWatch 로그 위젯 대시보드</span></p><p>CloudWatch에 저장된 Redshift 로그를 로그 위젯으로 표시하는 대시보드를 생성합니다. E에서 요구하는 S3 기반 로그가 필요 없어 더 간단합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CloudTrail은 API 호출을 기록하지만 Redshift SQL 쿼리 내용은 기록하지 않습니다.</p><p><span class="mark-no">❌ B</span> — S3를 대상으로 하면 E의 방식이 필요하지만, CloudWatch를 대상으로 하는 C + D가 더 간단합니다.</p><p><span class="mark-no">❌ E</span> — Lambda + Athena 방식은 로그가 S3에 있을 때 필요하며, C를 선택하면 불필요합니다.</p>`,
  disc: [{ ans:'CD (80%)', txt:'Redshift 감사 로깅을 CloudWatch로 전송하면 S3와 Athena 없이 직접 대시보드를 구성할 수 있어 더 효율적입니다.' }]
},
{
  n: 326,
  en: `A company uses an organization in AWS Organizations to manage its 500 AWS accounts. The organization has all features enabled. The AWS accounts are in a single OU. The developers need to use the CostCenter tag key for all resources in the organization's member accounts. Some teams do not use the CostCenter tag key to tag their Amazon EC2 instances.<br>The cloud team wrote a script that scans all EC2 instances in the organization's member accounts. If the EC2 instances do not have a CostCenter tag key, the script will notify AWS account administrators. To avoid this notification, some developers use the CostCenter tag key with an arbitrary string in the tag value.<br>The cloud team needs to ensure that all EC2 instances in the organization use a CostCenter tag key with the appropriate cost center value.<br>Which solution will meet these requirements?`,
  ko: `한 회사가 AWS Organizations의 조직을 사용하여 500개의 AWS 계정을 관리합니다. 조직에는 모든 기능이 활성화되어 있습니다. AWS 계정은 단일 OU에 있습니다. 개발자는 조직의 멤버 계정에 있는 모든 리소스에 CostCenter 태그 키를 사용해야 합니다. 일부 팀은 Amazon EC2 인스턴스에 CostCenter 태그 키를 사용하지 않습니다.<br>클라우드 팀은 스크립트를 작성하여 스캔합니다. 일부 개발자는 알림을 피하기 위해 임의의 문자열 값으로 CostCenter 태그 키를 사용합니다.<br>모든 EC2 인스턴스가 적절한 비용 센터 값이 있는 CostCenter 태그 키를 사용하도록 보장하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an SCP that prevents the creation of EC2 instances without the CostCenter tag key. Create a tag policy that requires the CostCenter tag to be values from a known list of cost centers for all EC2 instances. Attach the policy to the OU. Update the script to scan the tag keys and tag values. Modify the script to update noncompliant resources with a default approved tag value for the CostCenter tag key.`, ko:`CostCenter 태그 키 없이 EC2 인스턴스를 생성하지 못하게 하는 SCP를 생성합니다. CostCenter 태그가 모든 EC2 인스턴스에 대해 알려진 비용 센터 목록에서 나온 값이 되도록 요구하는 태그 정책을 생성합니다. 정책을 OU에 연결합니다. 태그 키와 태그 값을 스캔하도록 스크립트를 업데이트합니다. 규정 미준수 리소스를 CostCenter 태그 키에 대한 기본 승인된 태그 값으로 업데이트하도록 스크립트를 수정합니다.` },
    { k:'B', en:`Create an SCP that prevents the creation of EC2 instances without the CostCenter tag key. Attach the policy to the OU. Update the script to scan the tag keys and tag values and notify the administrators when the tag values are not valid.`, ko:`CostCenter 태그 키 없이 EC2 인스턴스를 생성하지 못하게 하는 SCP를 생성합니다. 정책을 OU에 연결합니다. 태그 키와 태그 값을 스캔하고 태그 값이 유효하지 않을 때 관리자에게 알리도록 스크립트를 업데이트합니다.` },
    { k:'C', en:`Create an SCP that prevents the creation of EC2 instances without the CostCenter tag key. Attach the policy to the OU. Create an IAM permission boundary in the organization's member accounts that restricts the CostCenter tag values to a list of valid cost centers.`, ko:`CostCenter 태그 키 없이 EC2 인스턴스를 생성하지 못하게 하는 SCP를 생성합니다. 정책을 OU에 연결합니다. CostCenter 태그 값을 유효한 비용 센터 목록으로 제한하는 IAM 권한 경계를 조직의 멤버 계정에 생성합니다.` },
    { k:'D', en:`Create a tag policy that requires the CostCenter tag to be values from a known list of cost centers for all EC2 instances. Attach the policy to the OU. Configure an AWS Lambda function that adds an empty CostCenter tag key to an EC2 instance. Create an Amazon EventBridge rule that matches events to the RunInstances API action with the Lambda function as the target.`, ko:`CostCenter 태그가 모든 EC2 인스턴스에 대해 알려진 비용 센터 목록에서 나온 값이 되도록 요구하는 태그 정책을 생성합니다. 정책을 OU에 연결합니다. EC2 인스턴스에 빈 CostCenter 태그 키를 추가하는 AWS Lambda 함수를 구성합니다. RunInstances API 작업의 이벤트를 Lambda 함수를 대상으로 매칭하는 Amazon EventBridge 규칙을 생성합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — SCP + 태그 정책 + 스크립트 업데이트</span></p><p>세 가지 통제를 결합합니다: (1) SCP로 CostCenter 태그 없는 EC2 생성 방지, (2) 태그 정책으로 허용된 비용 센터 값 목록 적용, (3) 업데이트된 스크립트로 태그 값 검증 및 기존 미준수 리소스를 기본값으로 수정. 이는 태그 존재 여부와 값의 유효성 모두를 처리하는 종합적인 솔루션입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 알림만으로는 태그 값 유효성 문제가 해결되지 않습니다.</p><p><span class="mark-no">❌ C</span> — IAM 권한 경계는 태그 값 제한에 적합한 메커니즘이 아닙니다.</p><p><span class="mark-no">❌ D</span> — 빈 태그 값으로 추가하는 것은 기존 문제(임의 문자열 값)를 해결하지 못합니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'SCP, 태그 정책, 스크립트 업데이트의 조합이 태그 키 존재와 유효한 값을 모두 보장하는 종합적인 솔루션입니다.' }]
},
{
  n: 327,
  en: `A DevOps engineer uses a pipeline in AWS CodePipeline. The pipeline has a build action and a deploy action for a single-page web application that is delivered to an Amazon S3 bucket. Amazon CloudFront serves the web application. The build action creates an artifact for the web application.<br>The DevOps engineer has created an AWS CloudFormation template that defines the S3 bucket and configures the S3 bucket to host the application. The DevOps engineer has configured a CloudFormation deploy action before the S3 action. The CloudFormation deploy action creates the S3 bucket. The DevOps engineer needs to configure the S3 deploy action to use the S3 bucket from the CloudFormation template.<br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `DevOps 엔지니어가 AWS CodePipeline에서 파이프라인을 사용합니다. 파이프라인에는 Amazon S3 버킷에 전달되는 단일 페이지 웹 애플리케이션에 대한 빌드 작업과 배포 작업이 있습니다. Amazon CloudFront가 웹 애플리케이션을 제공합니다.<br>DevOps 엔지니어는 S3 버킷을 정의하고 애플리케이션을 호스팅하도록 S3 버킷을 구성하는 AWS CloudFormation 템플릿을 생성했습니다. S3 작업 전에 CloudFormation 배포 작업을 구성했습니다. CloudFormation 배포 작업은 S3 버킷을 생성합니다. DevOps 엔지니어는 CloudFormation 템플릿의 S3 버킷을 사용하도록 S3 배포 작업을 구성해야 합니다.<br>이 요구 사항을 충족하는 단계 조합은 무엇입니까? (2개 선택)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Add an output named BucketName to the CloudFormation template. Set the output's value to refer to the S3 bucket from the CloudFormation template. Configure the output value to export to an AWS::SSM::Parameter resource named Stackvariables.`, ko:`CloudFormation 템플릿에 BucketName이라는 이름의 출력을 추가합니다. 출력의 값을 CloudFormation 템플릿의 S3 버킷을 참조하도록 설정합니다. 출력 값을 Stackvariables라는 이름의 AWS::SSM::Parameter 리소스로 내보내도록 구성합니다.` },
    { k:'B', en:`Add an output named BucketName to the CloudFormation template. Set the output's value to refer to the S3 bucket from the CloudFormation template. Set the CloudFormation action's namespace to StackVariables in the pipeline.`, ko:`CloudFormation 템플릿에 BucketName이라는 이름의 출력을 추가합니다. 출력의 값을 CloudFormation 템플릿의 S3 버킷을 참조하도록 설정합니다. 파이프라인에서 CloudFormation 작업의 네임스페이스를 StackVariables로 설정합니다.` },
    { k:'C', en:`Configure the output artifacts of the CloudFormation action in the pipeline to be an AWS Systems Manager Parameter Store parameter named StackVariables. Name the artifact BucketName.`, ko:`파이프라인에서 CloudFormation 작업의 출력 아티팩트를 StackVariables라는 이름의 AWS Systems Manager Parameter Store 파라미터로 구성합니다. 아티팩트 이름을 BucketName으로 지정합니다.` },
    { k:'D', en:`Configure the build artifact from the build action as the input to the CodePipeline S3 deploy action. Configure the deploy action to deploy to the S3 bucket by using the StackVariables.BucketName variable.`, ko:`빌드 작업의 빌드 아티팩트를 CodePipeline S3 배포 작업의 입력으로 구성합니다. StackVariables.BucketName 변수를 사용하여 배포 작업을 S3 버킷에 배포하도록 구성합니다.` },
    { k:'E', en:`Configure the build artifact from the build action and the AWS Systems Manager parameter as the inputs to the deploy action. Configure the deploy action to deploy to the S3 bucket by using the StackVariables.BucketName variable.`, ko:`빌드 작업의 빌드 아티팩트와 AWS Systems Manager 파라미터를 배포 작업의 입력으로 구성합니다. StackVariables.BucketName 변수를 사용하여 S3 버킷에 배포하도록 배포 작업을 구성합니다.` },
  ],
  answer: ['B','D'],
  vote: '100% BD',
  explain: `<p><span class="mark-ok">✅ B — CloudFormation 템플릿에 BucketName 출력 + 네임스페이스 설정</span></p><p>CloudFormation 작업에 네임스페이스(StackVariables)를 설정하면 스택 출력(BucketName)이 파이프라인 변수로 노출됩니다. 다른 작업에서 <code>#{StackVariables.BucketName}</code>으로 참조할 수 있습니다.</p><p><span class="mark-ok">✅ D — 빌드 아티팩트를 S3 배포 작업 입력으로 + StackVariables.BucketName 사용</span></p><p>빌드 아티팩트를 S3 배포 작업의 입력으로 구성하고, CloudFormation 출력 변수를 사용하여 동적으로 S3 버킷을 지정합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — SSM Parameter로 내보내는 것은 파이프라인 변수를 사용하는 것보다 복잡합니다.</p><p><span class="mark-no">❌ C</span> — CloudFormation 작업 출력 아티팩트를 SSM 파라미터로 직접 구성할 수 없습니다.</p><p><span class="mark-no">❌ E</span> — SSM 파라미터를 추가 입력으로 구성하는 것은 불필요합니다.</p>`,
  disc: [{ ans:'BD (100%)', txt:'CloudFormation 네임스페이스 변수를 통해 스택 출력을 파이프라인 변수로 참조하는 것이 올바른 패턴입니다.' }]
},
{
  n: 328,
  en: `A company used a lift and shift strategy to migrate a workload to AWS. The company has an Auto Scaling group of Amazon EC2 instances. Each EC2 instance runs a web application, a database, and a Redis cache.<br>Users are experiencing large variations in the web application's response times. Requests to the web application go to a single EC2 instance that is under significant load. The company wants to separate the application components to improve availability and performance.<br>Which solution will meet these requirements?`,
  ko: `한 회사가 리프트 앤 시프트 전략을 사용하여 워크로드를 AWS로 마이그레이션했습니다. 회사에는 Amazon EC2 인스턴스의 Auto Scaling 그룹이 있습니다. 각 EC2 인스턴스는 웹 애플리케이션, 데이터베이스, Redis 캐시를 실행합니다.<br>사용자는 웹 애플리케이션의 응답 시간에 큰 차이를 경험하고 있습니다. 웹 애플리케이션에 대한 요청은 상당한 부하가 걸린 단일 EC2 인스턴스로 이동합니다. 회사는 가용성과 성능을 개선하기 위해 애플리케이션 구성 요소를 분리하려 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a Network Load Balancer and an Auto Scaling group for the web application. Migrate the database to an Amazon Aurora Serverless database. Create an Application Load Balancer and an Auto Scaling group for the Redis cache.`, ko:`웹 애플리케이션에 대한 Network Load Balancer와 Auto Scaling 그룹을 생성합니다. 데이터베이스를 Amazon Aurora Serverless 데이터베이스로 마이그레이션합니다. Redis 캐시에 대한 Application Load Balancer와 Auto Scaling 그룹을 생성합니다.` },
    { k:'B', en:`Create an Application Load Balancer and an Auto Scaling group for the web application. Migrate the database to an Amazon Aurora database that has a Multi-AZ deployment. Create a Network Load Balancer and an Auto Scaling group in a single Availability Zone for the Redis cache.`, ko:`웹 애플리케이션에 대한 Application Load Balancer와 Auto Scaling 그룹을 생성합니다. 데이터베이스를 Multi-AZ 배포가 있는 Amazon Aurora 데이터베이스로 마이그레이션합니다. Redis 캐시에 대한 단일 가용 영역의 Network Load Balancer와 Auto Scaling 그룹을 생성합니다.` },
    { k:'C', en:`Create a Network Load Balancer and an Auto Scaling group for the web application. Migrate the database to an Amazon Aurora Serverless database. Create an Amazon ElastiCache (Redis OSS) cluster for the cache. Create a target group that has a DNS target type that contains the ElastiCache (Redis OSS) cluster hostname.`, ko:`웹 애플리케이션에 대한 Network Load Balancer와 Auto Scaling 그룹을 생성합니다. 데이터베이스를 Amazon Aurora Serverless 데이터베이스로 마이그레이션합니다. 캐시에 대한 Amazon ElastiCache(Redis OSS) 클러스터를 생성합니다. ElastiCache(Redis OSS) 클러스터 호스트 이름이 포함된 DNS 대상 유형이 있는 대상 그룹을 생성합니다.` },
    { k:'D', en:`Create an Application Load Balancer and an Auto Scaling group for the web application. Migrate the database to an Amazon Aurora database that has a Multi-AZ deployment. Create an Amazon ElastiCache (Redis OSS) cluster for the cache.`, ko:`웹 애플리케이션에 대한 Application Load Balancer와 Auto Scaling 그룹을 생성합니다. 데이터베이스를 Multi-AZ 배포가 있는 Amazon Aurora 데이터베이스로 마이그레이션합니다. 캐시에 대한 Amazon ElastiCache(Redis OSS) 클러스터를 생성합니다.` },

  explain: `<p><span class="mark-ok">✅ D — ALB + Auto Scaling + Aurora Multi-AZ + ElastiCache</span></p><p>웹 애플리케이션: ALB + Auto Scaling 그룹으로 트래픽을 여러 인스턴스에 분산합니다. 데이터베이스: Aurora Multi-AZ 배포로 고가용성을 보장하고 EC2 인스턴스에서 DB 부하를 분리합니다. 캐시: ElastiCache(Redis OSS)로 캐싱을 전담 관리형 서비스로 분리합니다. 각 구성 요소를 분리하여 가용성과 성능을 개선합니다.</p>`,

{
  n: 329,
  en: `A company is using AWS Organizations and wants to implement a governance strategy with the following requirements:<br>• AWS resource access is restricted to the same two Regions for all accounts.<br>• AWS services are limited to a specific group of authorized services for all accounts.<br>• Authentication is provided by Active Directory.<br>• Access permissions are organized by job function and are identical in each account.<br>Which solution will meet these requirements?`,
  ko: `한 회사가 AWS Organizations를 사용하고 있으며 다음 요구 사항을 갖춘 거버넌스 전략을 구현하려 합니다:<br>• AWS 리소스 액세스는 모든 계정에 대해 동일한 두 리전으로 제한됩니다.<br>• AWS 서비스는 모든 계정에 대해 특정 승인된 서비스 그룹으로 제한됩니다.<br>• 인증은 Active Directory에서 제공합니다.<br>• 액세스 권한은 직무별로 구성되며 각 계정에서 동일합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Establish an organizational unit (OU) with group policies in the management account to restrict Regions and authorized services. Use AWS CloudFormation StackSets to provision roles with permissions for each job function, including an IAM trust policy for IAM identity provider authentication in each account.`, ko:`관리 계정에서 그룹 정책이 있는 OU를 설정하여 리전과 승인된 서비스를 제한합니다. AWS CloudFormation StackSets를 사용하여 각 계정에서 IAM ID 공급자 인증을 위한 IAM 신뢰 정책을 포함하여 각 직무에 대한 권한이 있는 역할을 프로비저닝합니다.` },
    { k:'B', en:`Establish a permission boundary in the management account to restrict Regions and authorized services. Use AWS CloudFormation StackSets to provision roles with permissions for each job function, including an IAM trust policy for IAM identity provider authentication in each account.`, ko:`관리 계정에서 권한 경계를 설정하여 리전과 승인된 서비스를 제한합니다. AWS CloudFormation StackSets를 사용하여 각 계정에서 IAM ID 공급자 인증을 위한 IAM 신뢰 정책을 포함하여 각 직무에 대한 권한이 있는 역할을 프로비저닝합니다.` },
    { k:'C', en:`Establish a service control policy in the management account to restrict Regions and authorized services. Use AWS Resource Access Manager (AWS RAM) to share management account roles with permissions for each job function, including AWS IAM Identity Center for authentication in each account.`, ko:`관리 계정에서 서비스 제어 정책을 수립하여 리전과 승인된 서비스를 제한합니다. AWS Resource Access Manager(AWS RAM)를 사용하여 각 계정의 인증을 위한 AWS IAM Identity Center를 포함하여 각 직무에 대한 권한과 관리 계정 역할을 공유합니다.` },
    { k:'D', en:`Establish a service control policy in the management account to restrict Regions and authorized services. Use AWS CloudFormation StackSets to provision roles with permissions for each job function, including an IAM trust policy for IAM identity provider authentication in each account.`, ko:`관리 계정에서 서비스 제어 정책을 수립하여 리전과 승인된 서비스를 제한합니다. AWS CloudFormation StackSets를 사용하여 각 계정에서 IAM ID 공급자 인증을 위한 IAM 신뢰 정책을 포함하여 각 직무에 대한 권한이 있는 역할을 프로비저닝합니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — SCP(리전/서비스 제한) + StackSets(직무별 역할 + IAM ID 공급자)</span></p><p>SCP: 조직 수준에서 AWS 리전 및 서비스 액세스를 제한합니다. CloudFormation StackSets: 모든 계정에서 표준화된 직무별 역할을 자동으로 생성합니다. IAM 신뢰 정책: Active Directory(IAM ID 공급자)를 통한 인증을 허용합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — AWS Organizations는 그룹 정책(GPO)이 아닌 SCP를 사용합니다.</p><p><span class="mark-no">❌ B</span> — 권한 경계는 개별 계정 수준 통제이며 조직 전체 리전/서비스 제한에 적합하지 않습니다.</p><p><span class="mark-no">❌ C</span> — AWS RAM은 역할 공유에 적합하지 않으며, Active Directory 요구 사항에 IAM Identity Center가 부적합할 수 있습니다.</p>`,
  disc: [{ ans:'D (100%)', txt:'SCP + StackSets + IAM ID 공급자의 조합이 모든 거버넌스 요구 사항을 충족하는 표준 패턴입니다.' }]

{
  n: 330,
  en: `A company detects unusual login attempts in many of its AWS accounts. A DevOps engineer must implement a solution that sends a notification to the company's security team when multiple failed login attempts occur. The DevOps engineer has already created an Amazon Simple Notification Service (Amazon SNS) topic and has subscribed the security team to the SNS topic.<br>Which solution will provide the notification with the LEAST operational effort?`,
  ko: `한 회사가 여러 AWS 계정에서 비정상적인 로그인 시도를 감지했습니다. DevOps 엔지니어는 여러 번 로그인 시도가 실패하면 회사 보안 팀에 알림을 보내는 솔루션을 구현해야 합니다. DevOps 엔지니어는 이미 Amazon SNS 토픽을 생성했고 보안 팀을 SNS 토픽에 구독했습니다.<br>가장 적은 운영 노력으로 알림을 제공하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure AWS CloudTrail to send management events to an Amazon CloudWatch Logs log group. Create a CloudWatch Logs metric filter to match failed ConsoleLogin events. Create a CloudWatch alarm that is based on the metric filter. Configure an alarm action to send messages to the SNS topic.`, ko:`AWS CloudTrail을 구성하여 관리 이벤트를 Amazon CloudWatch Logs 로그 그룹으로 보냅니다. 실패한 ConsoleLogin 이벤트와 일치하도록 CloudWatch Logs 메트릭 필터를 생성합니다. 메트릭 필터를 기반으로 하는 CloudWatch 알람을 생성합니다. SNS 토픽으로 메시지를 보내도록 알람 작업을 구성합니다.` },
    { k:'B', en:`Configure AWS CloudTrail to send management events to an Amazon S3 bucket. Create an Amazon Athena query that returns a failure if the query finds failed logins in the logs in the S3 bucket. Create an Amazon EventBridge rule to periodically run the query. Create a second EventBridge rule to detect when the query fails and to send a message to the SNS topic.`, ko:`AWS CloudTrail을 구성하여 관리 이벤트를 Amazon S3 버킷으로 보냅니다. S3 버킷의 로그에서 실패한 로그인을 발견하면 실패를 반환하는 Amazon Athena 쿼리를 생성합니다. Amazon EventBridge 규칙을 생성하여 주기적으로 쿼리를 실행합니다. 쿼리가 실패할 때를 감지하고 SNS 토픽에 메시지를 보내는 두 번째 EventBridge 규칙을 생성합니다.` },
    { k:'C', en:`Configure AWS CloudTrail to send data events to an Amazon CloudWatch Logs log group. Create a CloudWatch logs metric filter to match failed ConsoleLogin events. Create a CloudWatch alarm that is based on the metric filter. Configure an alarm action to send messages to the SNS topic.`, ko:`AWS CloudTrail을 구성하여 데이터 이벤트를 Amazon CloudWatch Logs 로그 그룹으로 전송합니다. 실패한 ConsoleLogin 이벤트와 일치하도록 CloudWatch Logs 메트릭 필터를 생성합니다. 메트릭 필터를 기반으로 하는 CloudWatch 알람을 생성합니다. SNS 토픽으로 메시지를 전송하도록 알람 작업을 구성합니다.` },
    { k:'D', en:`Configure AWS CloudTrail to send data events to an Amazon S3 bucket. Configure an Amazon S3 event notification for the s3:ObjectCreated event type. Filter the event type by ConsoleLogin failed events. Configure the event notification to forward to the SNS topic.`, ko:`AWS CloudTrail을 구성하여 데이터 이벤트를 Amazon S3 버킷으로 전송합니다. s3:ObjectCreated 이벤트 유형에 대한 Amazon S3 이벤트 알림을 구성합니다. ConsoleLogin 실패 이벤트로 이벤트 유형을 필터링합니다. 이벤트 알림을 SNS 토픽으로 전달하도록 구성합니다.` },
  ],
  answer: ['A'],
  vote: '93% A',
  explain: `<p><span class="mark-ok">✅ A — CloudTrail 관리 이벤트 → CloudWatch Logs → 메트릭 필터 → 알람 → SNS</span></p><p>ConsoleLogin은 CloudTrail 관리 이벤트입니다. CloudTrail을 CloudWatch Logs로 전송하도록 구성하면 메트릭 필터로 실패한 ConsoleLogin 이벤트를 감지하고, CloudWatch 알람이 임계값 초과 시 SNS로 알림을 전송합니다. 간단하고 통합된 워크플로입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — Athena + EventBridge 두 개 규칙 방식은 훨씬 복잡하고 운영 오버헤드가 높습니다.</p><p><span class="mark-no">❌ C</span> — ConsoleLogin은 데이터 이벤트가 아닌 관리 이벤트입니다.</p><p><span class="mark-no">❌ D</span> — S3 이벤트 알림은 CloudTrail 로그 파일 생성 이벤트를 감지하지만, 파일 내 특정 이벤트를 필터링할 수 없습니다.</p>`,
  disc: [{ ans:'A (93%)', txt:'CloudTrail 관리 이벤트를 CloudWatch Logs로 전송하고 메트릭 필터로 실패한 로그인을 감지하는 것이 가장 간단하고 직접적인 솔루션입니다.' }]
},
{

  en: `A company runs a website by using an Amazon Elastic Container Service (Amazon ECS) service that is connected to an Application Load Balancer (ALB). The service was in a steady state with tasks responding to requests successfully.<br>A DevOps engineer updated the task definition with a new container image and deployed the new task definition to the service. The DevOps engineer noticed that the service is frequently stopping and starting new tasks because the ALB health checks are failing.<br>What should the DevOps engineer do to troubleshoot the failed deployment?`,
  ko: `한 회사가 ALB에 연결된 Amazon ECS 서비스를 사용하여 웹사이트를 운영합니다. 서비스는 작업이 요청에 성공적으로 응답하는 안정적인 상태였습니다.<br>DevOps 엔지니어가 새 컨테이너 이미지로 작업 정의를 업데이트하고 새 작업 정의를 서비스에 배포했습니다. ALB 상태 검사 실패로 서비스가 자주 중지되고 새 작업이 시작된다는 것을 알아챘습니다.<br>실패한 배포 문제를 해결하기 위해 무엇을 해야 합니까?`,

  explain: `<p><span class="mark-ok">✅ B — ALB 상태 검사 유예 기간 증가</span></p><p>새 컨테이너 이미지를 배포할 때 컨테이너가 시작되고 정상 상태가 되는 데 시간이 걸릴 수 있습니다. ALB 상태 검사 유예 기간이 너무 짧으면 컨테이너가 완전히 준비되기 전에 ALB가 비정상으로 표시합니다. 유예 기간을 늘리면 새 작업이 ALB에서 비정상으로 표시되기 전에 시작되고 정상 상태로 될 충분한 시간을 확보합니다.</p>`,

{
  n: 333,
  en: `A company that uses electronic patient health records runs a fleet of Amazon EC2 instances with an Amazon Linux operating system. The company must continuously ensure that the EC2 instances are running operating system patches and application patches that are in compliance with current privacy regulations. The company uses a custom repository to store application patches.<br>A DevOps engineer needs to automate the deployment of operating system patches and application patches. The DevOps engineer wants to use both the default operating system patch repository and the custom patch repository.<br>Which solution will meet these requirements with the LEAST effort?`,
  ko: `전자 환자 건강 기록을 사용하는 회사가 Amazon Linux 운영 체제를 사용하여 Amazon EC2 인스턴스 플릿을 실행합니다. 회사는 EC2 인스턴스가 현재 개인 정보 보호 규정을 준수하는 운영 체제 패치와 애플리케이션 패치를 실행하고 있는지 지속적으로 확인해야 합니다. 회사는 애플리케이션 패치를 저장하기 위해 사용자 지정 리포지토리를 사용합니다.<br>DevOps 엔지니어는 운영 체제 패치와 애플리케이션 패치의 배포를 자동화해야 합니다. 기본 운영 체제 패치 리포지토리와 사용자 지정 패치 리포지토리를 모두 사용하려 합니다.<br>최소한의 노력으로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use AWS Systems Manager to create a new custom patch baseline that includes the default operating system repository and the custom repository. Run the AWS-RunPatchBaseline document by using the Run command to verify and install patches. Use the BaselineOverride API to configure the new custom patch baseline.`, ko:`AWS Systems Manager를 사용하여 기본 운영 체제 리포지토리와 사용자 지정 리포지토리를 포함하는 새 사용자 지정 패치 기준선을 생성합니다. Run 명령을 사용하여 AWS-RunPatchBaseline 문서를 실행하여 패치를 확인하고 설치합니다. BaselineOverride API를 사용하여 새 사용자 지정 패치 기준선을 구성합니다.` },
    { k:'B', en:`Use AWS Direct Connect to integrate the custom repository with the EC2 instances. Use Amazon EventBridge events to deploy the patches.`, ko:`AWS Direct Connect를 사용하여 사용자 지정 리포지토리를 EC2 인스턴스와 통합합니다. Amazon EventBridge 이벤트를 사용하여 패치를 배포합니다.` },
    { k:'C', en:`Use the yum-config-manager command to add the custom repository to the /etc/yum.repos.d configuration. Run the yum-config-manager-enable command to activate the new repository.`, ko:`yum-config-manager 명령을 사용하여 사용자 지정 리포지토리를 /etc/yum.repos.d 구성에 추가합니다. yum-config-manager-enable 명령을 실행하여 새 리포지토리를 활성화합니다.` },
    { k:'D', en:`Use AWS Systems Manager to create a patch baseline for the default operating system repository and a second patch baseline for the custom repository. Run the AWS-RunPatchBaseline document by using the Run command to verify and install patches. Use the BaselineOverride API to configure the default patch baseline and the custom patch baseline.`, ko:`AWS Systems Manager를 사용하여 기본 운영 체제 리포지토리에 대한 패치 기준선과 사용자 지정 리포지토리에 대한 두 번째 패치 기준선을 생성합니다. Run 명령을 사용하여 AWS-RunPatchBaseline 문서를 실행하여 패치를 확인하고 설치합니다. BaselineOverride API를 사용하여 기본 패치 기준선과 사용자 지정 패치 기준선을 구성합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 단일 사용자 지정 패치 기준선으로 통합</span></p><p>AWS Systems Manager Patch Manager는 기본 OS 리포지토리와 사용자 지정 리포지토리를 모두 포함하는 단일 사용자 지정 패치 기준선을 지원합니다. AWS-RunPatchBaseline 문서와 BaselineOverride API를 사용하여 패치 검증 및 설치를 자동화합니다. 단일 패치 기준선으로 관리가 간소화됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — Direct Connect는 네트워크 연결 서비스이며 패치 관리와 관련 없습니다.</p><p><span class="mark-no">❌ C</span> — 수동 yum 명령은 자동화되지 않고 규모 확장이 어렵습니다.</p><p><span class="mark-no">❌ D</span> — 두 개의 별도 패치 기준선을 관리하는 것은 단일 기준선(A)보다 복잡하고 불필요합니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'기본 OS 리포지토리와 사용자 지정 리포지토리를 단일 패치 기준선으로 통합하는 것이 최소 노력 솔루션입니다.' }]
},
{
  n: 334,
  en: `A company use an organization in AWS Organizations to manage multiple AWS accounts. The company has enabled all features enabled for the organization. The company configured the organization as a hierarchy of OUs under the root OU. The company recently registered all its OUs and enrolled all its AWS accounts in AWS Control Tower.<br>The company needs to customize the AWS Control Tower managed AWS Config configuration recorder in each of the company's AWS accounts. The company needs to apply the customizations to both the existing AWS accounts and to any new AWS accounts that the company enrolls in AWS Control Tower in the future.<br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `한 회사가 AWS Organizations의 조직을 사용하여 여러 AWS 계정을 관리합니다. 회사는 모든 기능이 활성화되어 있습니다. 회사는 조직을 루트 OU 아래의 OU 계층으로 구성했습니다. 회사는 최근에 모든 OU를 등록하고 모든 AWS 계정을 AWS Control Tower에 등록했습니다.<br>회사는 각 AWS 계정에서 AWS Control Tower 관리 AWS Config 구성 레코더를 사용자 지정해야 합니다. 기존 AWS 계정과 앞으로 등록하는 새 AWS 계정 모두에 사용자 지정을 적용해야 합니다.<br>이 요구 사항을 충족하는 단계 조합은 무엇입니까? (3개 선택)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Create a new AWS account. Create an AWS Lambda function in the new account to apply the customizations to the AWS Config configuration recorder in each AWS account in the organization.`, ko:`새 AWS 계정을 생성합니다. 조직의 각 AWS 계정에서 AWS Config 구성 레코더에 사용자 지정을 적용하기 위해 새 계정에서 AWS Lambda 함수를 생성합니다.` },
    { k:'B', en:`Create a new AWS account as an AWS Config delegated administrator. Create an AWS Lambda function in the delegated administrator account to apply the customizations to the AWS Config configuration recorder in the delegated administrator account.`, ko:`AWS Config 위임 관리자로 새 AWS 계정을 생성합니다. 위임 관리자 계정에서 AWS Lambda 함수를 생성하여 위임 관리자 계정의 AWS Config 구성 레코더에 사용자 지정을 적용합니다.` },
    { k:'C', en:`Configure an Amazon EventBridge rule in the AWS Control Tower management account to invoke an AWS Lambda function when the Organizations OU is registered or reregistered. Re-register the root Organizations OU.`, ko:`AWS Control Tower 관리 계정에서 Organizations OU가 등록되거나 재등록될 때 AWS Lambda 함수를 호출하는 Amazon EventBridge 규칙을 구성합니다. 루트 Organizations OU를 재등록합니다.` },
    { k:'D', en:`Configure the AWSControlTowerExecution IAM role in each AWS account in the organization to be assumable by an AWS Lambda function. Configure the Lambda function to assume the AWSControlTowerExecution IAM role.`, ko:`조직의 각 AWS 계정에서 AWSControlTowerExecution IAM 역할을 AWS Lambda 함수에서 맡을 수 있도록 구성합니다. Lambda 함수가 AWSControlTowerExecution IAM 역할을 맡도록 구성합니다.` },
    { k:'E', en:`Create an IAM role in the AWS Control Tower management account that an AWS Lambda function can assume. Grant the IAM role permission to assume the AWSControlTowerExecution IAM role in any account in the organization. Configure the Lambda function to use the new IAM role.`, ko:`AWS Lambda 함수가 맡을 수 있는 AWS Control Tower 관리 계정에서 IAM 역할을 생성합니다. 조직의 모든 계정에서 AWSControlTowerExecution IAM 역할을 맡을 수 있는 IAM 역할 권한을 부여합니다. Lambda 함수가 새 IAM 역할을 사용하도록 구성합니다.` },
    { k:'F', en:`Configure an Amazon EventBridge rule in the AWS Control Tower management account to invoke an AWS Lambda function when an AWS account is updated or enrolled in AWS Control Tower or when the landing zone is updated. Re-register each Organizations OU in the organization.`, ko:`AWS Control Tower 관리 계정에서 AWS 계정이 업데이트되거나 AWS Control Tower에 등록되거나 랜딩 존이 업데이트될 때 AWS Lambda 함수를 호출하는 Amazon EventBridge 규칙을 구성합니다. 조직의 각 Organizations OU를 재등록합니다.` },
  ],
  answer: ['A','E','F'],
  vote: '50% AEF',
  explain: `<p><span class="mark-ok">✅ A — AWS Config 위임 관리자 계정에서 Lambda 함수</span></p><p>Config 위임 관리자 계정(옵션 A에 오타가 있지만)에서 Lambda 함수를 생성하여 중앙에서 모든 계정의 Config 레코더를 사용자 지정합니다.</p><p><span class="mark-ok">✅ E — 관리 계정 IAM 역할 + AWSControlTowerExecution 역할 수임</span></p><p>Lambda 함수가 멤버 계정에서 AWSControlTowerExecution 역할을 수임하여 Config 레코더를 수정할 수 있도록 합니다.</p><p><span class="mark-ok">✅ F — 계정 등록/랜딩 존 업데이트 시 EventBridge 트리거</span></p><p>새 계정 등록 또는 랜딩 존 업데이트 시 자동으로 Lambda를 호출하여 새 계정에도 사용자 지정이 적용됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ C</span> — EventBridge는 OU 등록/재등록 이벤트를 발생시키지 않습니다.</p><p><span class="mark-no">❌ D</span> — 각 계정의 AWSControlTowerExecution 역할을 수정하면 Control Tower 관리 역할이 손상됩니다.</p>`,
  disc: [{ ans:'AEF (50%) vs CEF (20%)', txt:'AEF와 CEF 중 커뮤니티 의견이 나뉘지만, AWS 공식 가이드(customizing-aws-config-resources-in-aws-control-tower)에 따르면 AEF가 권장됩니다.' }]
},
{
  n: 335,
  en: `A company runs an application in an Auto Scaling group of Amazon EC2 instances behind an Application Load Balancer (ALB). The EC2 instances run Docker containers that make requests to a MySQL database that runs on separate EC2 instances.<br>A DevOps engineer needs to update the application to use a serverless architecture.<br>Which solution will meet this requirement with the FEWEST changes?`,
  ko: `한 회사가 ALB 뒤의 Amazon EC2 인스턴스의 Auto Scaling 그룹에서 애플리케이션을 실행합니다. EC2 인스턴스는 별도의 EC2 인스턴스에서 실행되는 MySQL 데이터베이스에 요청을 하는 Docker 컨테이너를 실행합니다.<br>DevOps 엔지니어는 서버리스 아키텍처를 사용하도록 애플리케이션을 업데이트해야 합니다.<br>가장 적은 변경으로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Replace the containers that run on EC2 instances and the ALB with AWS Lambda functions. Replace the MySQL database with an Amazon Aurora Serverless v2 database that is compatible with MySQL.`, ko:`EC2 인스턴스와 ALB에서 실행되는 컨테이너를 AWS Lambda 함수로 교체합니다. MySQL 데이터베이스를 MySQL과 호환되는 Amazon Aurora Serverless v2 데이터베이스로 교체합니다.` },
    { k:'B', en:`Replace the containers that run on EC2 instances with AWS Fargate. Replace the MySQL database with an Amazon Aurora Serverless v2 database that is compatible with MySQL.`, ko:`EC2 인스턴스에서 실행되는 컨테이너를 AWS Fargate로 교체합니다. MySQL 데이터베이스를 MySQL과 호환되는 Amazon Aurora Serverless v2 데이터베이스로 교체합니다.` },
    { k:'C', en:`Replace the containers that run on EC2 instances and the ALB with AWS Lambda functions. Replace the MySQL database with Amazon DynamoDB tables.`, ko:`EC2 인스턴스와 ALB에서 실행되는 컨테이너를 AWS Lambda 함수로 교체합니다. MySQL 데이터베이스를 Amazon DynamoDB 테이블로 교체합니다.` },
    { k:'D', en:`Replace the containers that run on EC2 instances with AWS Fargate. Replace the MySQL database with Amazon DynamoDB tables.`, ko:`EC2 인스턴스에서 실행되는 컨테이너를 AWS Fargate로 교체합니다. MySQL 데이터베이스를 Amazon DynamoDB 테이블로 교체합니다.` },
  ],
  answer: ['B'],
  vote: '86% B',
  explain: `<p><span class="mark-ok">✅ B — AWS Fargate + Aurora Serverless v2(MySQL 호환)</span></p><p>가장 적은 변경으로 서버리스 전환: Docker 컨테이너는 그대로 AWS Fargate에서 실행(EC2 관리 불필요), ALB는 유지(변경 없음), MySQL은 Aurora Serverless v2(MySQL 호환)로 마이그레이션(코드 변경 최소화).</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Docker에서 Lambda로 전환은 코드 재작성이 필요합니다. Lambda는 컨테이너 실행 방식과 다릅니다.</p><p><span class="mark-no">❌ C, D</span> — MySQL에서 DynamoDB로 전환은 SQL에서 NoSQL로의 대규모 코드 변경이 필요합니다.</p>`,
  disc: [{ ans:'B (86%)', txt:'Fargate로 컨테이너 유지 + Aurora Serverless v2 MySQL 호환이 가장 적은 변경으로 서버리스 전환을 달성합니다.' }]
},
{
  n: 336,
  en: `A company uses an organization in AWS Organizations to manage 10 AWS accounts. All features are enabled, and trusted access for AWS CloudFormation is enabled.<br>A DevOps engineer needs to use CloudFormation to deploy an IAM role to the Organizations management account and all member accounts in the organization.<br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `한 회사가 AWS Organizations의 조직을 사용하여 10개의 AWS 계정을 관리합니다. 모든 기능이 활성화되어 있고 AWS CloudFormation에 대한 신뢰할 수 있는 액세스가 활성화되어 있습니다.<br>DevOps 엔지니어는 CloudFormation을 사용하여 Organizations 관리 계정과 조직의 모든 멤버 계정에 IAM 역할을 배포해야 합니다.<br>최소한의 운영 오버헤드로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a CloudFormation StackSet that has service-managed permissions. Set the root OU as a deployment target.`, ko:`서비스 관리 권한이 있는 CloudFormation StackSet을 생성합니다. 루트 OU를 배포 대상으로 설정합니다.` },
    { k:'B', en:`Create a CloudFormation StackSet that has service-managed permissions. Set the root OU as a deployment target. Deploy a separate CloudFormation stack in the Organizations management account.`, ko:`서비스 관리 권한이 있는 CloudFormation StackSet을 생성합니다. 루트 OU를 배포 대상으로 설정합니다. Organizations 관리 계정에 별도의 CloudFormation 스택을 배포합니다.` },
    { k:'C', en:`Create a CloudFormation StackSet that has self-managed permissions. Set the root OU as a deployment target.`, ko:`자체 관리 권한이 있는 CloudFormation StackSet을 생성합니다. 루트 OU를 배포 대상으로 설정합니다.` },
    { k:'D', en:`Create a CloudFormation StackSet that has self-managed permissions. Set the root OU as a deployment target. Deploy a separate CloudFormation stack in the Organizations management account.`, ko:`자체 관리 권한이 있는 CloudFormation StackSet을 생성합니다. 루트 OU를 배포 대상으로 설정합니다. Organizations 관리 계정에 별도의 CloudFormation 스택을 배포합니다.` },
  ],
  answer: ['B'],
  vote: '59% B',
  explain: `<p><span class="mark-ok">✅ B — 서비스 관리 StackSet + 루트 OU + 관리 계정 별도 스택</span></p><p>AWS 공식 문서에 따르면 서비스 관리 권한이 있는 StackSet은 관리 계정에 스택 인스턴스를 배포하지 않습니다. 관리 계정에도 IAM 역할을 배포하려면 별도의 CloudFormation 스택을 관리 계정에 직접 배포해야 합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 서비스 관리 StackSet은 관리 계정에 배포하지 않으므로 관리 계정이 누락됩니다.</p><p><span class="mark-no">❌ C, D</span> — 자체 관리 권한은 수동으로 역할을 설정해야 하므로 운영 오버헤드가 높습니다.</p>`,
  disc: [{ ans:'B (59%) vs A (41%)', txt:'AWS 공식 문서에 따르면 서비스 관리 StackSet은 관리 계정을 제외하므로, 관리 계정에 별도 스택 배포가 필요합니다.' }]
},
{
  n: 337,
  en: `A company runs an application that stores artifacts in an Amazon S3 bucket. The application has a large user base. The application writes a high volume of objects to the S3 bucket. The company has enabled event notifications for the S3 bucket.<br>When the application writes an object to the S3 bucket, several processing tasks need to be performed simultaneously. The company's DevOps team needs to create an AWS Step Functions workflow to orchestrate the processing tasks.<br>Which combination of steps should the DevOps team take to meet these requirements with the LEAST operational overhead? (Choose two.)`,
  ko: `한 회사가 Amazon S3 버킷에 아티팩트를 저장하는 애플리케이션을 실행합니다. 애플리케이션은 사용자 기반이 크고 S3 버킷에 많은 양의 객체를 씁니다. 회사는 S3 버킷에 대한 이벤트 알림을 활성화했습니다.<br>애플리케이션이 S3 버킷에 객체를 쓸 때 여러 처리 작업을 동시에 수행해야 합니다. 회사의 DevOps 팀은 처리 작업을 조정하기 위해 AWS Step Functions 워크플로를 생성해야 합니다.<br>최소한의 운영 오버헤드로 이 요구 사항을 충족하기 위해 DevOps 팀이 취해야 하는 단계 조합은 무엇입니까? (2개 선택)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Create a Standard workflow that contains a parallel state that defines the processing tasks. Create an Asynchronous Express workflow that contains a parallel state that defines the processing tasks.`, ko:`처리 작업을 정의하는 병렬 상태를 포함하는 표준 워크플로를 생성합니다. 처리 작업을 정의하는 병렬 상태를 포함하는 비동기 익스프레스 워크플로를 생성합니다.` },

  explain: `<p><span class="mark-ok">✅ A — 표준 워크플로 + 병렬 상태</span></p><p>여러 처리 작업을 동시에 수행하려면 Step Functions 표준 워크플로의 병렬 상태를 사용합니다. 표준 워크플로는 장기 실행, 내구성, 감사 가능한 워크플로에 적합합니다.</p><p><span class="mark-ok">✅ D — EventBridge 규칙으로 Step Functions 직접 호출</span></p><p>EventBridge는 Step Functions 워크플로를 Lambda 중간 단계 없이 직접 호출할 수 있습니다. 이는 운영 오버헤드를 줄이는 더 간단한 아키텍처입니다.</p>`,

{
  n: 338,
  en: `A DevOps team supports an application that runs in an Amazon Elastic Container Service (Amazon ECS) cluster behind an Application Load Balancer (ALB). Currently, the DevOps team uses AWS CodeDeploy to deploy the application by using a blue/green all-at-once strategy. Recently, the DevOps team had to roll back a deployment when a new version of the application dramatically increased response times for requests.<br>The DevOps team needs use to a deployment strategy that will allow the team to monitor a new version of the application before the team shifts all traffic to the new version. If a new version of the application increases response times, the deployment should be rolled back as quickly as possible.<br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `DevOps 팀은 ALB 뒤의 Amazon ECS 클러스터에서 실행되는 애플리케이션을 지원합니다. 현재 AWS CodeDeploy를 사용하여 blue/green all-at-once 전략으로 애플리케이션을 배포합니다. 최근 새 버전의 애플리케이션이 응답 시간을 극적으로 늘리자 배포를 롤백해야 했습니다.<br>DevOps 팀은 모든 트래픽을 새 버전으로 전환하기 전에 팀이 애플리케이션의 새 버전을 모니터링할 수 있는 배포 전략을 사용해야 합니다. 응답 시간이 늘어나면 가능한 한 빨리 배포를 롤백해야 합니다.<br>이 요구 사항을 충족하는 단계 조합은 무엇입니까? (2개 선택)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Modify the CodeDeploy deployment to use the CodeDeployDefault.ECSCanary10Percent5Minutes configuration.`, ko:`CodeDeployDefault.ECSCanary10Percent5Minutes 구성을 사용하도록 CodeDeploy 배포를 수정합니다.` },
    { k:'B', en:`Modify the CodeDeploy deployment to use the CodeDeployDefault.ECSLinear10PercentEvery3Minutes configuration.`, ko:`CodeDeployDefault.ECSLinear10PercentEvery3Minutes 구성을 사용하도록 CodeDeploy 배포를 수정합니다.` },
    { k:'C', en:`Create an Amazon CloudWatch alarm to monitor the UnHealthyHostCount metric for the ALB. Set the alarm to activate if the metric is higher than the desired value. Associate the alarm with the CodeDeploy deployment group. Modify the deployment group to roll back when a deployment fails.`, ko:`ALB에 대한 UnHealthyHostCount 메트릭을 모니터링하는 Amazon CloudWatch 알람을 생성합니다. 메트릭이 원하는 값보다 높으면 알람이 활성화되도록 설정합니다. 알람을 CodeDeploy 배포 그룹과 연결합니다. 배포가 실패하면 롤백하도록 배포 그룹을 수정합니다.` },
    { k:'D', en:`Create an Amazon CloudWatch alarm to monitor the TargetResponseTime metric for the ALB. Set the alarm to activate if the metric is higher than the desired value. Associate the alarm with the CodeDeploy deployment group. Modify the deployment group to roll back when alarm thresholds are met.`, ko:`ALB에 대한 TargetResponseTime 메트릭을 모니터링하는 Amazon CloudWatch 알람을 생성합니다. 메트릭이 원하는 값보다 높으면 알람이 활성화되도록 설정합니다. 알람을 CodeDeploy 배포 그룹과 연결합니다. 알람 임계값에 도달하면 롤백하도록 배포 그룹을 수정합니다.` },
    { k:'E', en:`Create an Amazon CloudWatch alarm to monitor the TargetConnectionErrorCount metric for the ALB. Set the alarm to activate if the metric is higher than the desired value. Associate the alarm with the CodeDeploy deployment group. Modify the deployment group to roll back when alarm thresholds are met.`, ko:`ALB에 대한 TargetConnectionErrorCount 메트릭을 모니터링하는 Amazon CloudWatch 알람을 생성합니다. 메트릭이 원하는 값보다 높으면 알람이 활성화되도록 설정합니다. 알람을 CodeDeploy 배포 그룹과 연결합니다. 알람 임계값에 도달하면 롤백하도록 배포 그룹을 수정합니다.` },
  ],
  answer: ['A','D'],
  vote: '100% AD',
  explain: `<p><span class="mark-ok">✅ A — ECSCanary10Percent5Minutes 배포 구성</span></p><p>카나리아 배포 전략으로 먼저 10%의 트래픽을 새 버전으로 전환하고 5분 동안 모니터링합니다. 문제가 없으면 나머지 트래픽을 전환합니다. 모든 트래픽 전환 전에 새 버전을 모니터링할 수 있습니다.</p><p><span class="mark-ok">✅ D — TargetResponseTime 알람 + 자동 롤백</span></p><p>응답 시간 문제가 발생했으므로 TargetResponseTime 메트릭을 모니터링하는 알람을 CodeDeploy 배포 그룹과 연결하면 임계값 초과 시 자동으로 롤백됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — Linear 배포는 천천히 모든 트래픽을 이전하는 것으로 빠른 롤백보다는 점진적 이전에 초점입니다.</p><p><span class="mark-no">❌ C</span> — UnHealthyHostCount는 건강하지 않은 호스트를 감지하지만 응답 시간 증가를 직접 모니터링하지 않습니다.</p><p><span class="mark-no">❌ E</span> — TargetConnectionErrorCount는 연결 오류이며 응답 시간 증가와 다릅니다.</p>`,
  disc: [{ ans:'AD (100%)', txt:'카나리아 배포와 TargetResponseTime 기반 자동 롤백이 응답 시간 문제를 신속하게 감지하고 롤백하는 최적 조합입니다.' }]
},
{
  n: 339,
  en: `A security team must record the configuration of AWS resources, detect issues, and send notifications for findings. The main workload in the AWS account consists of an Amazon EC2 Auto Scaling group that scales in and out several times during the day.<br>The team wants to be notified within 2 days if any Amazon EC2 security group allows traffic on port 22 for 0.0.0.0/0. The team also needs a snapshot of the configuration of the AWS resources to be taken routinely.<br>The security team has already created and subscribed to an Amazon Simple Notification Service (Amazon SNS) topic.<br>Which solution meets these requirements?`,
  ko: `보안팀은 AWS 리소스 구성을 기록하고, 문제를 탐지하고, 결과에 대한 알림을 보내야 합니다. AWS 계정의 주요 워크로드는 하루 중 여러 번 확장 및 축소되는 Amazon EC2 Auto Scaling 그룹으로 구성됩니다.<br>팀은 EC2 보안 그룹이 0.0.0.0/0에 대해 포트 22에서 트래픽을 허용하는 경우 2일 이내에 알림을 받고 싶어합니다. 또한 AWS 리소스 구성의 스냅샷을 정기적으로 가져와야 합니다.<br>보안팀은 이미 Amazon SNS 토픽을 생성하고 구독했습니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure AWS Config to use periodic recording for the AWS account. Deploy the vpc-sg-port-restriction-check AWS Config managed rule. Configure AWS Config to use the SNS topic as the target for notifications.`, ko:`AWS Config를 구성하여 AWS 계정에 대한 주기적 기록을 사용합니다. vpc-sg-port-restriction-check AWS Config 관리 규칙을 배포합니다. AWS Config를 구성하여 알림 대상으로 SNS 토픽을 사용합니다.` },
    { k:'B', en:`Configure AWS Config to use configuration change recording for the AWS account. Deploy the vpc-sg-open-only-to-authorized-ports AWS Config managed rule. Configure AWS Config to use the SNS topic as the target for notifications.`, ko:`AWS Config를 구성하여 AWS 계정에 대한 구성 변경 기록을 사용합니다. vpc-sg-open-only-to-authorized-ports AWS Config 관리 규칙을 배포합니다. AWS Config를 구성하여 알림 대상으로 SNS 토픽을 사용합니다.` },
    { k:'C', en:`Configure AWS Config to use configuration change recording for the AWS account. Deploy the ssh-restricted AWS Config managed rule. Configure AWS Config to use the SNS topic as the target for notifications.`, ko:`AWS Config를 구성하여 AWS 계정에 대한 구성 변경 기록을 사용합니다. ssh-restricted AWS Config 관리 규칙을 배포합니다. AWS Config를 구성하여 알림 대상으로 SNS 토픽을 사용합니다.` },
    { k:'D', en:`Create an AWS Lambda function to evaluate security groups and publish a message to the SNS topic. Use an Amazon EventBridge rule to schedule the Lambda function to run once a day.`, ko:`보안 그룹을 평가하고 SNS 토픽에 메시지를 게시하는 AWS Lambda 함수를 생성합니다. Amazon EventBridge 규칙을 사용하여 Lambda 함수가 하루에 한 번 실행되도록 예약합니다.` },
  ],
  answer: ['C'],
  vote: '79% C',
  explain: `<p><span class="mark-ok">✅ C — 구성 변경 기록 + ssh-restricted 규칙 + SNS</span></p><p><code>ssh-restricted</code>는 0.0.0.0/0에서 포트 22(SSH) 트래픽을 허용하는 보안 그룹을 확인하는 AWS Config 관리형 규칙입니다. 구성 변경 기록은 Auto Scaling 그룹처럼 동적 환경에서 변경 시 즉시 기록되므로 적합합니다. SNS를 알림 대상으로 구성하면 2일 이내에 알림을 받을 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 주기적 기록은 즉각적인 변경 감지가 아니지만, ssh-restricted 대신 vpe-sg-port-restriction-check도 다소 차이가 있습니다.</p><p><span class="mark-no">❌ B</span> — vpc-sg-open-only-to-authorized-ports는 특정 포트만 허용하는지 확인하는 규칙으로, SSH 전용은 아닙니다.</p><p><span class="mark-no">❌ D</span> — 사용자 지정 Lambda는 불필요한 복잡성을 추가합니다.</p>`,
  disc: [{ ans:'C (79%)', txt:'ssh-restricted 관리형 규칙과 구성 변경 기록이 포트 22 SSH 무제한 허용을 즉시 감지하는 최적의 솔루션입니다.' }]
},
{
  n: 340,
  en: `A company has proprietary data available by using an Amazon CloudFront distribution. The company needs to ensure that the distribution is accessible by only users from the corporate office that have a known set of IP address ranges. An AWS WAF web ACL is associated with the distribution and has a default action set to Count.<br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `한 회사가 Amazon CloudFront 배포를 사용하여 독점 데이터를 사용할 수 있습니다. 회사는 IP 주소 범위가 알려진 회사 사무실의 사용자만 배포에 액세스할 수 있도록 해야 합니다. AWS WAF 웹 ACL이 배포와 연결되어 있으며 기본 작업이 Count로 설정되어 있습니다.<br>가장 적은 운영 오버헤드로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a new regex pattern set. Add the regex pattern set to a new rule group. Create a new web ACL that has a default action set to Block. Associate the web ACL with the CloudFront distribution. Add a rule that allows traffic based on the new rule group.`, ko:`새 정규식 패턴 세트를 생성합니다. 정규식 패턴 세트를 새 규칙 그룹에 추가합니다. 기본 작업이 차단으로 설정된 새 웹 ACL을 생성합니다. 웹 ACL을 CloudFront 배포와 연결합니다. 새 규칙 그룹에 따라 트래픽을 허용하는 규칙을 추가합니다.` },
    { k:'B', en:`Create an AWS WAF IP address set that matches the corporate office IP address range. Create a new web ACL that has a default action set to Allow. Associate the web ACL with the CloudFront distribution. Add a rule that allows traffic from the IP address set.`, ko:`회사 사무실 IP 주소 범위와 일치하는 AWS WAF IP 주소 집합을 생성합니다. 기본 작업이 허용으로 설정된 새 웹 ACL을 생성합니다. 웹 ACL을 CloudFront 배포와 연결합니다. IP 주소 집합에서 트래픽을 허용하는 규칙을 추가합니다.` },
    { k:'C', en:`Create a new regex pattern set. Add the regex pattern set to a new rule group. Set the default action on the existing web ACL to Allow. Add a rule that has priority 0 that allows traffic based on the regex pattern set.`, ko:`새 정규식 패턴 세트를 생성합니다. 정규식 패턴 세트를 새 규칙 그룹에 추가합니다. 기존 웹 ACL의 기본 동작을 허용으로 설정합니다. 정규식 패턴 세트에 따라 트래픽을 허용하는 우선순위 0의 규칙을 추가합니다.` },
    { k:'D', en:`Create a WAF IP address set that matches the corporate office IP address range. Set the default action on the existing web ACL to Block. Add a rule that has priority 0 that allows traffic from the IP address set.`, ko:`회사 사무실 IP 주소 범위와 일치하는 WAF IP 주소 집합을 생성합니다. 기존 웹 ACL의 기본 동작을 차단으로 설정합니다. IP 주소 집합에서 트래픽을 허용하는 우선순위 0 규칙을 추가합니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — 기존 WAF IP 주소 집합 + 기본 동작 차단 + 우선순위 0 허용 규칙</span></p><p>기존 웹 ACL을 재사용(새 ACL 생성 불필요)하므로 운영 오버헤드가 최소화됩니다. 기본 동작을 차단으로 설정하여 모든 트래픽을 차단하고, 우선순위 0(가장 높은 우선순위) 규칙으로 회사 IP 주소 집합의 트래픽만 허용합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — IP 주소에 정규식 패턴은 적합하지 않으며 새 웹 ACL 생성은 불필요합니다.</p><p><span class="mark-no">❌ B</span> — 기본 허용 + 규칙 허용은 논리적으로 맞지 않습니다. 기본 차단 + 허용 규칙이 올바른 패턴입니다.</p><p><span class="mark-no">❌ C</span> — 정규식은 IP 주소 범위 매칭에 적합하지 않습니다.</p>`,
  disc: [{ ans:'D (100%)', txt:'기존 WAF 웹 ACL을 재사용하고, 기본 차단 + IP 집합 허용 규칙으로 가장 간단하게 VPC 접근 제한을 구현합니다.' }]
},
{
  n: 341,
  en: `A company runs several applications in the same AWS account. The applications send logs to Amazon CloudWatch.<br>A data analytics team needs to collect performance metrics and custom metrics from the applications. The analytics team needs to transform the metrics data before storing the data in an Amazon S3 bucket. The analytics team must automatically collect any new metrics that are added to the CloudWatch namespace.<br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `한 회사가 동일한 AWS 계정에서 여러 애플리케이션을 실행합니다. 애플리케이션은 Amazon CloudWatch에 로그를 보냅니다.<br>데이터 분석 팀은 애플리케이션에서 성능 메트릭과 사용자 지정 메트릭을 수집해야 합니다. 분석 팀은 데이터를 Amazon S3 버킷에 저장하기 전에 메트릭 데이터를 변환해야 합니다. 분석 팀은 CloudWatch 네임스페이스에 추가된 모든 새 메트릭을 자동으로 수집해야 합니다.<br>가장 적은 운영 오버헤드로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure a CloudWatch metric stream to include metrics from the application and the CloudWatch namespace. Configure the metric stream to deliver the metrics to an Amazon Data Firehose delivery stream. Configure the Firehose delivery stream to invoke an AWS Lambda function to transform the data. Configure the delivery stream to send the transformed data to the S3 bucket.`, ko:`애플리케이션과 CloudWatch 네임스페이스의 메트릭을 포함하도록 CloudWatch 메트릭 스트림을 구성합니다. 메트릭 스트림을 구성하여 메트릭을 Amazon Data Firehose 전달 스트림으로 전달합니다. Firehose 전달 스트림을 구성하여 AWS Lambda 함수를 호출하여 데이터를 변환합니다. 전달 스트림을 구성하여 변환된 데이터를 S3 버킷으로 보냅니다.` },
    { k:'B', en:`Configure a CloudWatch metrics stream to include all the metrics and to deliver the metrics to an Amazon Data Firehose delivery stream. Configure the Firehose delivery stream to invoke an AWS Lambda function to transform the data. Configure the delivery stream to send the transformed data to the S3 bucket.`, ko:`모든 메트릭을 포함하고 메트릭을 Amazon Data Firehose 전달 스트림에 전달하도록 CloudWatch 메트릭 스트림을 구성합니다. Firehose 전달 스트림을 구성하여 AWS Lambda 함수를 호출하여 데이터를 변환합니다. 전달 스트림을 구성하여 변환된 데이터를 S3 버킷으로 보냅니다.` },
    { k:'C', en:`Configure metric filters for the CloudWatch logs to create custom metrics. Configure a CloudWatch metric stream to deliver the application metrics to the S3 bucket.`, ko:`CloudWatch 로그에 대한 메트릭 필터를 구성하여 사용자 지정 메트릭을 생성합니다. CloudWatch 메트릭 스트림을 구성하여 애플리케이션 메트릭을 S3 버킷에 전달합니다.` },
    { k:'D', en:`Configure subscription filters on the application log groups to target an Amazon Data Firehose delivery stream. Configure the Firehose delivery stream to invoke an AWS Lambda function to transform the data. Configure the delivery stream to send the transformed data to the S3 bucket.`, ko:`애플리케이션 로그 그룹에서 구독 필터를 구성하여 Amazon Data Firehose 전송 스트림을 대상으로 합니다. Firehose 전송 스트림을 구성하여 AWS Lambda 함수를 호출하여 데이터를 변환합니다. 전송 스트림을 구성하여 변환된 데이터를 S3 버킷으로 보냅니다.` },
  ],
  answer: ['B'],
  vote: '50% B',
  explain: `<p><span class="mark-ok">✅ B — "모든 메트릭" CloudWatch 메트릭 스트림 + Firehose + Lambda + S3</span></p><p>"모든 메트릭"을 포함하도록 설정하면 CloudWatch 네임스페이스에 새 메트릭이 추가되더라도 자동으로 수집됩니다. 아키텍처: CloudWatch → Firehose(Lambda 변환) → S3. A와의 차이: A는 특정 네임스페이스/메트릭을 지정하므로 새 메트릭이 추가될 때 수동 업데이트가 필요합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 특정 네임스페이스를 지정하면 새 메트릭이 추가될 때 자동으로 포함되지 않을 수 있습니다.</p><p><span class="mark-no">❌ C</span> — 메트릭 필터는 로그에서 메트릭을 추출하는 것으로, 메트릭 스트림이 아니며 Lambda 변환도 없습니다.</p><p><span class="mark-no">❌ D</span> — 구독 필터는 로그 기반으로, 성능 메트릭(CloudWatch 메트릭)을 수집하는 것이 아닙니다.</p>`,
  disc: [{ ans:'B (50%) vs A (50%)', txt:'50% 대 50% 논쟁: B는 "모든 메트릭"으로 새 메트릭 자동 포함, A는 특정 네임스페이스 지정. 새 메트릭 자동 수집 요구사항으로 B가 더 적합하다는 의견이 우세합니다.' }]
},
{
  n: 342,
  en: `A company uses an HPC platform to run analysis jobs for data. The company uses AWS CodeBuild to create container images and store the images on Amazon Elastic Container Registry (Amazon ECR). The images are then deployed on Amazon Elastic Kubernetes Service (Amazon EKS).<br>To maintain compliance, the company needs to ensure that the images are signed before the images are deployed on Amazon EKS. The signing keys must be rotated periodically and must be managed automatically. The company needs to track who generates the signatures.<br>Which solution will meet these requirements with the LEAST operational effort?`,
  ko: `한 회사가 HPC 플랫폼을 사용하여 데이터에 대한 분석 작업을 실행합니다. 회사는 AWS CodeBuild를 사용하여 컨테이너 이미지를 생성하고 Amazon ECR에 이미지를 저장합니다. 이미지는 Amazon EKS에 배포됩니다.<br>규정 준수를 유지하기 위해 회사는 Amazon EKS에 이미지를 배포하기 전에 이미지에 서명해야 합니다. 서명 키는 주기적으로 순환해야 하며 자동으로 관리해야 합니다. 회사는 서명을 생성하는 사람을 추적해야 합니다.<br>최소한의 운영 노력으로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use CodeBuild to retrieve the image that was previously pushed to Amazon ECR. Use AWS Signer to sign the image. Use AWS CloudTrail to track who generates the signatures.`, ko:`CodeBuild를 사용하여 이전에 Amazon ECR에 푸시된 이미지를 검색합니다. AWS Signer를 사용하여 이미지에 서명합니다. AWS CloudTrail을 사용하여 서명을 생성하는 사람을 추적합니다.` },
    { k:'B', en:`Use AWS Lambda to retrieve the image that was previously pushed to Amazon ECR. Use a Lambda function to sign the image. Use Amazon CloudWatch to track who generates the signatures.`, ko:`AWS Lambda를 사용하여 이전에 Amazon ECR에 푸시된 이미지를 검색합니다. Lambda 함수를 사용하여 이미지에 서명합니다. Amazon CloudWatch를 사용하여 서명을 생성하는 사람을 추적합니다.` },
    { k:'C', en:`Use AWS Lambda to retrieve the image that was previously pushed to Amazon ECR. Use AWS Signer to sign the image. Use Amazon CloudWatch to track who generates the signatures.`, ko:`AWS Lambda를 사용하여 이전에 Amazon ECR에 푸시된 이미지를 검색합니다. AWS Signer를 사용하여 이미지에 서명합니다. Amazon CloudWatch를 사용하여 서명을 생성하는 사람을 추적합니다.` },
    { k:'D', en:`Use CodeBuild to build the image. Sign the image by using AWS Signer before pushing the image to Amazon ECR. Use AWS CloudTrail to track who generates the signatures.`, ko:`CodeBuild를 사용하여 이미지를 빌드합니다. 이미지를 Amazon ECR에 푸시하기 전에 AWS Signer를 사용하여 이미지에 서명합니다. AWS CloudTrail을 사용하여 서명을 생성하는 사람을 추적합니다.` },
  ],
  answer: ['D'],
  vote: '83% D',
  explain: `<p><span class="mark-ok">✅ D — CodeBuild에서 빌드 + AWS Signer로 서명(ECR 푸시 전) + CloudTrail 추적</span></p><p>CodeBuild가 이미지를 빌드하고 ECR에 푸시하기 전에 AWS Signer로 서명합니다. AWS Signer는 키 로테이션을 자동으로 관리합니다(AWS KMS 사용). CloudTrail은 Signer API 호출(서명 생성)을 자동으로 기록하여 누가 서명을 생성했는지 추적합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — ECR에 이미 푸시된 이미지를 다시 가져와 서명하는 것은 불필요한 단계를 추가합니다.</p><p><span class="mark-no">❌ B</span> — Lambda 서명은 AWS Signer를 사용하지 않아 자동 키 로테이션이 없습니다. CloudWatch는 서명 추적에 적합하지 않습니다.</p><p><span class="mark-no">❌ C</span> — CloudWatch는 서명 생성자 추적에 적합하지 않습니다. CloudTrail이 올바른 도구입니다.</p>`,
  disc: [{ ans:'D (83%)', txt:'빌드 파이프라인에서 ECR 푸시 전 Signer 서명이 가장 효율적이며, CloudTrail로 서명 활동 추적이 권장됩니다.' }]
},
{
  n: 343,
  en: `A company uses an AWS CodeArtifact repository to store Python packages that the company developed internally. A DevOps engineer needs to use AWS CodeDeploy to deploy an application to an Amazon EC2 instance. The application uses a Python package that is stored in the CodeArtifact repository. A BeforeInstall lifecycle event hook will install the package.<br>The DevOps engineer needs to grant the EC2 instance access to the CodeArtifact repository.<br>Which solution will meet this requirement?`,
  ko: `한 회사가 AWS CodeArtifact 리포지토리를 사용하여 회사가 내부적으로 개발한 Python 패키지를 저장합니다. DevOps 엔지니어는 AWS CodeDeploy를 사용하여 Amazon EC2 인스턴스에 애플리케이션을 배포해야 합니다. 애플리케이션은 CodeArtifact 리포지토리에 저장된 Python 패키지를 사용합니다. BeforeInstall 라이프사이클 이벤트 후크가 패키지를 설치합니다.<br>DevOps 엔지니어는 EC2 인스턴스에 CodeArtifact 리포지토리에 대한 액세스 권한을 부여해야 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a service-linked role for CodeArtifact. Associate the role with the EC2 instance. Use the aws codeartifact get-authorization-token CLI command on the instance.`, ko:`CodeArtifact에 대한 서비스 연결 역할을 생성합니다. 역할을 EC2 인스턴스와 연결합니다. 인스턴스에서 aws codeartifact get-authorization-token CLI 명령을 사용합니다.` },
    { k:'B', en:`Configure a resource-based policy for the CodeArtifact repository that allows the ReadFromRepository action for the EC2 instance principal.`, ko:`EC2 인스턴스 주체에 대한 ReadFromRepository 작업을 허용하는 CodeArtifact 리포지토리에 대한 리소스 기반 정책을 구성합니다.` },
    { k:'C', en:`Configure ACLs on the CodeArtifact repository to allow the EC2 instance to access the Python package.`, ko:`EC2 인스턴스가 Python 패키지에 액세스할 수 있도록 CodeArtifact 리포지토리에서 ACL을 구성합니다.` },
    { k:'D', en:`Create an instance profile that contains an IAM role that has access to CodeArtifact. Associate the instance profile with the EC2 instance. Use the aws codeartifact login CLI command on the instance.`, ko:`CodeArtifact에 액세스할 수 있는 IAM 역할이 포함된 인스턴스 프로파일을 생성합니다. 인스턴스 프로파일을 EC2 인스턴스와 연결합니다. 인스턴스에서 aws codeartifact login CLI 명령을 사용합니다.` },
  ],
  answer: ['D'],
  vote: '71% D',
  explain: `<p><span class="mark-ok">✅ D — IAM 인스턴스 프로파일 + aws codeartifact login</span></p><p>CodeArtifact에 액세스하려면 EC2 인스턴스에 IAM 인스턴스 프로파일이 필요합니다. <code>aws codeartifact login</code> 명령은 인스턴스 역할의 임시 자격 증명을 사용하여 pip 등의 Python 환경을 CodeArtifact 리포지토리에 인증합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CodeArtifact에 대한 서비스 연결 역할은 없습니다. EC2 인스턴스 역할(인스턴스 프로파일)을 사용해야 합니다.</p><p><span class="mark-no">❌ B</span> — CodeArtifact는 EC2 인스턴스를 주체로 직접 지정하는 리소스 기반 정책 방식보다 IAM 역할 + login CLI 방식을 권장합니다.</p><p><span class="mark-no">❌ C</span> — CodeArtifact는 ACL을 지원하지 않습니다.</p>`,
  disc: [{ ans:'D (71%) vs B (29%)', txt:'IAM 인스턴스 프로파일 + codeartifact login이 공식 권장 방법이며, 리소스 기반 정책도 가능하지만 EC2 인스턴스 주체를 지정하는 것은 일반적이지 않습니다.' }]
},
{
  n: 344,
  en: `A company has a file-reading application that saves files to a database that runs on Amazon EC2 instances. Regulations require the company to delete files from EC2 instances every day at a specific time. The company must delete database records that are older than 60 days.<br>The database record deletion must occur after the file deletions. The company has created scripts to delete files and database records. The company needs to receive an email notification for any failure of the deletion scripts.<br>Which solution will meet these requirements with the LEAST development effort?`,
  ko: `한 회사에 Amazon EC2 인스턴스에서 실행되는 데이터베이스에 파일을 저장하는 파일 읽기 애플리케이션이 있습니다. 규정에 따라 회사는 매일 특정 시간에 EC2 인스턴스에서 파일을 삭제해야 합니다. 회사는 60일 이상 된 데이터베이스 레코드를 삭제해야 합니다.<br>데이터베이스 레코드 삭제는 파일 삭제 후에 이루어져야 합니다. 회사는 파일과 데이터베이스 레코드를 삭제하는 스크립트를 생성했습니다. 회사는 삭제 스크립트가 실패할 경우 이메일 알림을 받아야 합니다.<br>최소한의 개발 노력으로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use AWS Systems Manager State Manager to automatically invoke a Systems Manager Automation document at the specified time each day. Configure the Automation document to use a run command to run the deletion scripts in sequential order. Create an Amazon EventBridge rule to use Amazon Simple Notification Service (Amazon SNS) to send failure notifications to the company.`, ko:`AWS Systems Manager State Manager를 사용하여 매일 지정된 시간에 Systems Manager Automation 문서를 자동으로 호출합니다. Automation 문서를 구성하여 실행 명령을 사용하여 삭제 스크립트를 순차적으로 실행합니다. Amazon SNS를 사용하여 회사에 실패 알림을 보내는 Amazon EventBridge 규칙을 생성합니다.` },
    { k:'B', en:`Use AWS Systems Manager State Manager to automatically invoke a Systems Manager Automation document at the specified time each day. Configure the Automation document to use a run command to run the deletion scripts in sequential order. Create a conditional statement inside the Automation document as the last step to check for errors. Use Amazon Simple Email Service (Amazon SES) to send failure notifications as email messages to the company.`, ko:`AWS Systems Manager State Manager를 사용하여 매일 지정된 시간에 Systems Manager Automation 문서를 자동으로 호출합니다. Automation 문서를 구성하여 실행 명령을 사용하여 삭제 스크립트를 순차적으로 실행합니다. Automation 문서 내부에 조건문을 생성하여 오류를 확인하는 마지막 단계를 수행합니다. Amazon SES를 사용하여 회사에 이메일 메시지로 실패 알림을 보냅니다.` },
    { k:'C', en:`Create an Amazon EventBridge rule that invokes an AWS Lambda function at the specified time. Add the necessary permissions for the invocation to the Lambda function's resource-based policy. Configure the Lambda function to run the deletion scripts in sequential order. Configure the Lambda function to use Amazon Simple Notification Service (Amazon SNS) to send failure notifications to the company.`, ko:`지정된 시간에 AWS Lambda 함수를 호출하는 Amazon EventBridge 규칙을 생성합니다. Lambda 함수의 리소스 기반 정책에 호출에 필요한 권한을 추가합니다. Lambda 함수를 구성하여 삭제 스크립트를 순차적으로 실행합니다. Lambda 함수를 구성하여 Amazon SNS를 사용하여 회사에 실패 알림을 보냅니다.` },
    { k:'D', en:`Create an Amazon EventBridge rule that invokes an AWS Lambda function at the specified time. Add the necessary permissions for the invocation to the Lambda function's resource-based policy. Configure the Lambda function to run the deletion scripts in sequential order. Configure the Lambda function to use Amazon Simple Email Service (Amazon SES) to send failure notifications as email messages to the company.`, ko:`지정된 시간에 AWS Lambda 함수를 호출하는 Amazon EventBridge 규칙을 생성합니다. Lambda 함수의 리소스 기반 정책에 호출에 필요한 권한을 추가합니다. Lambda 함수를 구성하여 삭제 스크립트를 순차적으로 실행합니다. Lambda 함수를 구성하여 Amazon SES를 사용하여 회사에 이메일 메시지로 실패 알림을 보냅니다.` },
  ],
  answer: ['A'],
  vote: '83% A',
  explain: `<p><span class="mark-ok">✅ A — SSM State Manager + Automation 문서 + EventBridge + SNS</span></p><p>SSM State Manager는 매일 지정 시간에 Automation 문서를 자동으로 실행합니다. Automation 문서는 Run Command로 EC2 인스턴스에서 삭제 스크립트를 순차적으로 실행합니다. EventBridge + SNS로 실패 시 이메일 알림이 전송됩니다. 코드 작성 없이 관리형 서비스로 구현 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — SES 사용은 불필요한 복잡성을 추가합니다. SNS가 더 간단합니다.</p><p><span class="mark-no">❌ C, D</span> — Lambda는 EC2 인스턴스에서 실행되는 스크립트를 직접 실행할 수 없습니다. SSM Automation이 적합합니다.</p>`,
  disc: [{ ans:'A (83%)', txt:'SSM State Manager + Automation + SNS가 EC2에서 스크립트를 순차 실행하고 실패 알림을 보내는 가장 간단한 솔루션입니다.' }]
},
{
  n: 345,
  en: `A company uses an organization in AWS Organizations that has all features enabled to manage its AWS accounts. Amazon EC2 instances run in the AWS accounts.<br>The company requires that all current EC2 instances must use Instance Metadata Service Version 2 (IMDSv2). The company needs to block AWS API calls that originate from EC2 instances that do not use IMDSv2.<br>Which solution will meet these requirements?`,
  ko: `한 회사가 모든 기능이 활성화된 AWS Organizations의 조직을 사용합니다. Amazon EC2 인스턴스가 AWS 계정에서 실행됩니다.<br>회사는 모든 현재 EC2 인스턴스가 IMDSv2를 사용해야 한다고 요구합니다. 회사는 IMDSv2를 사용하지 않는 EC2 인스턴스에서 발생하는 AWS API 호출을 차단해야 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a new SCP statement that denies the ec2:RunInstances action when the ec2:MetadataHttpTokens condition key is not equal to the value of required. Attach the SCP to the root of the organization.`, ko:`ec2:MetadataHttpTokens 조건 키가 required 값과 같지 않을 때 ec2:RunInstances 작업을 거부하는 새 SCP 문을 생성합니다. SCP를 조직의 루트에 연결합니다.` },

  explain: `<p><span class="mark-ok">✅ D — ec2:MetadataHttpTokens 조건으로 모든 작업 거부(기존 인스턴스 포함)</span></p><p>A와의 차이점: A는 <code>ec2:RunInstances</code>만 거부하여 새 인스턴스 생성만 차단하지만, 기존 인스턴스는 IMDSv1로 계속 API 호출이 가능합니다. D는 <code>ec2:MetadataHttpTokens</code> 조건으로 모든 AWS API 호출을 거부하여 기존 IMDSv1 인스턴스도 차단합니다. 이는 "현재 실행 중인 EC2 인스턴스"에도 적용되어야 한다는 요구사항을 충족합니다.</p>`,
