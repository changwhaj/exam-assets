  disc: [{ ans:'B (100%)', txt:'로그가 이미 CloudWatch Logs에 있으므로 메트릭 필터 → 알람 → SNS가 가장 단순하고 직접적인 접근법. GuardDuty나 Firewall Manager는 이 시나리오와 무관.' }]
},
{
  n: 104,
  en: `A company is divided into teams. Each team has an AWS account, and all the accounts are in an organization in AWS Organizations. Each team must retain full administrative rights to its AWS account. Each team also must be allowed to access only AWS services that the company approves for use. AWS services must gain approval through a request and approval process.<br><br>How should a DevOps engineer configure the accounts to meet these requirements?`,
  ko: `한 회사가 팀으로 나뉩니다. 각 팀에는 AWS 계정이 있으며, 모든 계정은 AWS Organizations의 조직에 있습니다. 각 팀은 자신의 AWS 계정에 대한 전체 관리 권한을 유지해야 합니다. 또한, 각 팀은 회사에서 사용을 승인한 AWS 서비스에만 액세스할 수 있어야 합니다. AWS 서비스는 요청 및 승인 프로세스를 통해 승인을 받아야 합니다.<br><br>DevOps 엔지니어는 이러한 요구 사항을 충족하기 위해 계정을 어떻게 구성해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use AWS CloudFormation StackSets to provision IAM policies in each account to deny access to restricted AWS services. In each account, configure AWS Config rules that ensure that the policies are attached to IAM principals in the account.`, ko:`AWS CloudFormation StackSets를 사용하여 각 계정에서 IAM 정책을 프로비저닝하여 제한된 AWS 서비스에 대한 액세스를 거부합니다. 각 계정에서 정책이 계정의 IAM 주체에 연결되도록 하는 AWS Config 규칙을 구성합니다.` },
    { k:'B', en:`Use AWS Control Tower to provision the accounts into OUs within the organization. Configure AWS Control Tower to enable AWS IAM Identity Center (AWS Single Sign-On). Configure IAM Identity Center to provide administrative access. Include deny policies on user roles for restricted AWS services.`, ko:`AWS Control Tower를 사용하여 조직 내의 OU에 계정을 프로비저닝합니다. AWS Control Tower를 구성하여 AWS IAM Identity Center(AWS Single Sign-On)를 활성화합니다. IAM Identity Center를 구성하여 관리 액세스를 제공합니다. 제한된 AWS 서비스에 대한 사용자 역할에 거부 정책을 포함합니다.` },
    { k:'C', en:`Place all the accounts under a new top-level OU within the organization. Create an SCP that denies access to restricted AWS services. Attach the SCP to the OU.`, ko:`조직 내의 새로운 최상위 OU에 모든 계정을 배치합니다. 제한된 AWS 서비스에 대한 액세스를 거부하는 SCP를 만듭니다. SCP를 OU에 연결합니다.` },
    { k:'D', en:`Create an SCP that allows access to only approved AWS services. Attach the SCP to the root OU of the organization. Remove the FullAWSAccess SCP from the root OU of the organization.`, ko:`승인된 AWS 서비스에만 액세스할 수 있는 SCP를 만듭니다. SCP를 조직의 루트 OU에 연결합니다. 조직의 루트 OU에서 FullAWSAccess SCP를 제거합니다.` },
  ],
  answer: ['D'],
  vote: '53% D',
  explain: `<p><span class="mark-ok">✅ D — 허용 목록(Allow-list) 기반 SCP</span></p><p>AWS 서비스가 요청 및 승인 프로세스를 통해 승인되어야 한다는 요구사항은 화이트리스트(허용 목록) 전략이 필요함을 의미합니다. FullAWSAccess SCP를 제거하고 승인된 서비스만 허용하는 SCP를 루트 OU에 연결하면, 모든 팀 계정에서 승인된 서비스만 사용할 수 있게 됩니다. SCP는 관리 계정에는 영향을 미치지 않으므로, 각 팀의 관리 권한은 유지됩니다. C(거부 목록)는 새로운 AWS 서비스가 출시될 때마다 거부 목록에 추가해야 하는 유지보수 부담이 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 로컬 계정 관리자가 IAM 정책을 변경할 수 있어 제어가 불완전합니다.</p>
<p><span class="mark-no">❌ B</span> — 복잡하며, 로컬 관리자가 관리 권한을 통해 우회할 수 있습니다.</p>
<p><span class="mark-no">❌ C</span> — 거부 목록 방식은 승인되지 않은 새 서비스에 대한 묵시적 허용이 발생하여 요구사항을 위반할 수 있습니다.</p>`,
  disc: [{ ans:'D (53%) vs C (45%)', txt:'D(허용 목록)는 새 서비스 출시 시 자동 차단되는 장점이 있고, C(거부 목록)는 관리가 더 간단하다는 의견이 팽팽히 갈림. AWS 권장 사항상 D가 승인 기반 접근에 더 적합.' }]
},
{
  n: 105,
  en: `A DevOps engineer used an AWS CloudFormation custom resource to set up AD Connector. The AWS Lambda function ran and created AD Connector, but CloudFormation is not transitioning from CREATE_IN_PROGRESS to CREATE_COMPLETE.<br><br>Which action should the engineer take to resolve this issue?`,
  ko: `DevOps 엔지니어가 AWS CloudFormation 사용자 지정 리소스를 사용하여 AD 커넥터를 설정했습니다. AWS Lambda 함수가 실행되어 AD 커넥터를 생성했지만 CloudFormation이 CREATE_IN_PROGRESS에서 CREATE_COMPLETE로 전환되지 않습니다.<br><br>이 문제를 해결하기 위해 엔지니어는 어떤 조치를 취해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Ensure the Lambda function code has exited successfully.`, ko:`Lambda 함수 코드가 성공적으로 종료되었는지 확인합니다.` },
    { k:'B', en:`Ensure the Lambda function code returns a response to the pre-signed URL.`, ko:`Lambda 함수 코드가 미리 서명된 URL에 대한 응답을 반환하는지 확인합니다.` },
    { k:'C', en:`Ensure the Lambda function IAM role has cloudformation:UpdateStack permissions for the stack ARN.`, ko:`Lambda 함수 IAM 역할에 스택 ARN에 대한 cloudformation:UpdateStack 권한이 있는지 확인합니다.` },
    { k:'D', en:`Ensure the Lambda function IAM role has ds:ConnectDirectory permissions for the AWS account.`, ko:`Lambda 함수 IAM 역할에 AWS 계정에 대한 ds:ConnectDirectory 권한이 있는지 확인합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — 미리 서명된 URL에 응답 반환</span></p><p>CloudFormation 사용자 지정 리소스에서 Lambda 함수는 작업 완료 후 반드시 CloudFormation이 제공한 미리 서명된 URL(ResponseURL)에 SUCCESS 또는 FAILED 응답을 보내야 합니다. 이 응답이 없으면 CloudFormation은 무한히 CREATE_IN_PROGRESS 상태로 유지되다가 결국 타임아웃됩니다. Lambda가 AD Connector를 생성하는 데 성공했더라도, CloudFormation에 완료 신호를 보내지 않으면 상태가 전환되지 않습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 함수가 성공적으로 종료되었더라도 presigned URL에 응답을 보내지 않으면 CloudFormation은 완료를 인식하지 못합니다.</p>
<p><span class="mark-no">❌ C</span> — CloudFormation 업데이트 권한이 아닌, presigned URL에 대한 응답 전송이 핵심입니다.</p>
<p><span class="mark-no">❌ D</span> — AD Connector가 이미 생성되었으므로 ds 권한 부족이 원인이 아닙니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'CloudFormation 사용자 지정 리소스의 가장 흔한 문제 패턴. Lambda가 작업을 완료해도 cfn-response 또는 직접 HTTP PUT으로 presigned URL에 응답하지 않으면 스택이 무한 대기.' }]
},
{
  n: 106,
  en: `A company uses AWS CodeCommit for source code control. Developers apply their changes to various feature branches and create pull requests to move those changes to the main branch when the changes are ready for production.<br><br>The developers should not be able to push changes directly to the main branch. The company applied the AWSCodeCommitPowerUser managed policy to the developers' IAM role, and now these developers can push changes to the main branch directly on every repository in the AWS account.<br><br>What should the company do to restrict the developers' ability to push changes to the main branch directly?`,
  ko: `한 회사에서 소스 코드 제어를 위해 AWS CodeCommit을 사용합니다. 개발자는 다양한 기능 브랜치에 변경 사항을 적용하고 변경 사항이 프로덕션에 준비되면 해당 변경 사항을 메인 브랜치로 옮기기 위한 풀 요청을 생성합니다.<br><br>개발자는 변경 사항을 메인 브랜치에 직접 푸시할 수 없어야 합니다. 이 회사는 개발자의 IAM 역할에 AWSCodeCommitPowerUser 관리형 정책을 적용했으며, 이제 이 개발자들은 AWS 계정의 모든 리포지토리에서 메인 브랜치에 직접 변경 사항을 푸시할 수 있습니다.<br><br>메인 브랜치에 직접 변경 사항을 푸시하는 기능을 제한하기 위해 회사는 무엇을 해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an additional policy to include a Deny rule for the GitPush and PutFile actions. Include a restriction for the specific repositories in the policy statement with a condition that references the main branch.`, ko:`GitPush 및 PutFile 작업에 대한 Deny 규칙을 포함하는 추가 정책을 만듭니다. 정책 문에 특정 리포지토리에 대한 제한을 포함하고 메인 브랜치를 참조하는 조건을 포함합니다.` },
    { k:'B', en:`Remove the IAM policy, and add an AWSCodeCommitReadOnly managed policy. Add an Allow rule for the GitPush and PutFile actions for the specific repositories in the policy statement with a condition that references the main branch.`, ko:`IAM 정책을 제거하고 AWSCodeCommitReadOnly 관리형 정책을 추가합니다. 메인 브랜치를 참조하는 조건과 함께 특정 리포지토리의 GitPush 및 PutFile 작업에 대한 허용 규칙을 정책 문에 추가합니다.` },
    { k:'C', en:`Modify the IAM policy. Include a Deny rule for the GitPush and PutFile actions for the specific repositories in the policy statement with a condition that references the main branch.`, ko:`IAM 정책을 수정합니다. 메인 브랜치를 참조하는 조건과 함께 특정 리포지토리의 GitPush 및 PutFile 작업에 대한 Deny 규칙을 정책 문에 포함합니다.` },
    { k:'D', en:`Create an additional policy to include an Allow rule for the GitPush and PutFile actions. Include a restriction for the specific repositories in the policy statement with a condition that references the feature branches.`, ko:`GitPush 및 PutFile 작업에 대한 Allow 규칙을 포함하는 추가 정책을 만듭니다. 기능 브랜치를 참조하는 조건과 함께 특정 리포지토리에 대한 제한을 정책 문에 포함합니다.` },
  ],
  answer: ['A'],
  vote: '94% A',
  explain: `<p><span class="mark-ok">✅ A — 추가 Deny 정책 생성</span></p><p>AWSCodeCommitPowerUser는 AWS에서 관리하는 정책으로 수정할 수 없습니다. 따라서 메인 브랜치에 대한 GitPush 및 PutFile 작업을 명시적으로 거부하는 별도의 추가 정책을 만들어 개발자 IAM 역할에 연결해야 합니다. IAM에서 명시적 거부(Deny)는 허용(Allow)보다 우선하므로, 이 방식으로 메인 브랜치 직접 푸시를 효과적으로 차단할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — AWSCodeCommitPowerUser는 AWS 관리형 정책이므로 제거할 수 없습니다. 또한 ReadOnly로 교체하면 기능 브랜치 푸시도 불가능해집니다.</p>
<p><span class="mark-no">❌ C</span> — AWS 관리형 정책은 수정할 수 없습니다. 고객 관리형 정책 사본을 만들어야 합니다.</p>
<p><span class="mark-no">❌ D</span> — Allow 규칙 추가로는 기존 PowerUser 정책의 메인 브랜치 접근을 차단할 수 없습니다.</p>`,
  disc: [{ ans:'A (94%)', txt:'AWS 관리형 정책은 수정 불가라는 핵심 원칙. 추가 Deny 정책 생성이 유일한 올바른 방법. codecommit:GitPush와 codecommit:PutFile에 refs/heads/main 조건 사용.' }]
},
{
  n: 107,
  en: `A company manages a web application that runs on Amazon EC2 instances behind an Application Load Balancer (ALB). The EC2 instances run in an Auto Scaling group across multiple Availability Zones. The application uses an Amazon RDS for MySQL DB instance to store the data. The company has configured Amazon Route 53 with an alias record that points to the ALB.<br><br>A new company guideline requires a geographically isolated disaster recovery (DR) site with an RTO of 4 hours and an RPO of 15 minutes.<br><br>Which DR strategy will meet these requirements with the LEAST change to the application stack?`,
  ko: `한 회사가 Application Load Balancer(ALB) 뒤의 Amazon EC2 인스턴스에서 실행되는 웹 애플리케이션을 관리합니다. EC2 인스턴스는 여러 가용성 영역에 걸쳐 Auto Scaling 그룹에서 실행됩니다. 애플리케이션은 Amazon RDS for MySQL DB 인스턴스를 사용하여 데이터를 저장합니다. 회사는 ALB를 가리키는 별칭 레코드로 Amazon Route 53을 구성했습니다.<br><br>새로운 회사 지침은 RTO 4시간, RPO 15분의 지리적으로 고립된 재해 복구(DR) 사이트를 요구합니다.<br><br>애플리케이션 스택에 대한 변경을 최소화하면서 이러한 요구 사항을 충족하는 DR 전략은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Launch a replica environment of everything except Amazon RDS in a different Availability Zone. Create an RDS read replica in the new Availability Zone, and configure the new stack to point to the local RDS DB instance. Add the new stack to the Route 53 record set by using a health check to configure a failover routing policy.`, ko:`다른 가용성 영역에서 Amazon RDS를 제외한 모든 항목의 복제 환경을 시작합니다. 새 가용성 영역에서 RDS 읽기 복제본을 만들고 새 스택이 로컬 RDS DB 인스턴스를 가리키도록 구성합니다. 상태 확인을 사용하여 장애 조치 라우팅 정책을 구성하여 새 스택을 Route 53 레코드 세트에 추가합니다.` },
    { k:'B', en:`Launch a replica environment of everything except Amazon RDS in a different AWS Region. Create an RDS read replica in the new Region, and configure the new stack to point to the local RDS DB instance. Add the new stack to the Route 53 record set by using a health check to configure a latency routing policy.`, ko:`다른 AWS 리전에서 Amazon RDS를 제외한 모든 항목의 복제 환경을 시작합니다. 새 리전에서 RDS 읽기 복제본을 만들고 새 스택이 로컬 RDS DB 인스턴스를 가리키도록 구성합니다. 상태 확인을 사용하여 지연 시간 라우팅 정책을 구성하여 새 스택을 Route 53 레코드 세트에 추가합니다.` },
    { k:'C', en:`Launch a replica environment of everything except Amazon RDS in a different AWS Region. In the event of an outage, copy and restore the latest RDS snapshot from the primary Region to the DR Region. Adjust the Route 53 record set to point to the ALB in the DR Region.`, ko:`다른 AWS 리전에서 Amazon RDS를 제외한 모든 것의 복제 환경을 시작합니다. 중단이 발생하는 경우 기본 리전에서 DR 리전으로 최신 RDS 스냅샷을 복사하여 복원합니다. DR 리전의 ALB를 가리키도록 Route 53 레코드 세트를 조정합니다.` },
    { k:'D', en:`Launch a replica environment of everything except Amazon RDS in a different AWS Region. Create an RDS read replica in the new Region, and configure the new environment to point to the local RDS DB instance. Add the new stack to the Route 53 record set by using a health check to configure a failover routing policy. In the event of an outage, promote the read replica to primary.`, ko:`다른 AWS 리전에서 Amazon RDS를 제외한 모든 항목의 복제 환경을 시작합니다. 새 리전에서 RDS 읽기 복제본을 만들고 새 환경이 로컬 RDS DB 인스턴스를 가리키도록 구성합니다. 상태 확인을 사용하여 장애 조치 라우팅 정책을 구성하여 새 스택을 Route 53 레코드 세트에 추가합니다. 중단이 발생하면 읽기 복제본을 기본으로 승격합니다.` },
  ],
  answer: ['D'],
  vote: '90% D',
  explain: `<p><span class="mark-ok">✅ D — 다른 리전에 읽기 복제본 + 장애 조치 라우팅 + 승격</span></p><p>"지리적으로 고립된" DR 사이트는 다른 AWS 리전을 의미합니다. RDS 읽기 복제본을 DR 리전에 생성하면 RPO 15분 내의 지속적인 데이터 복제가 가능합니다. Route 53 장애 조치 라우팅과 상태 확인을 통해 자동으로 DR 리전으로 트래픽이 전환됩니다. 장애 시 읽기 복제본을 기본으로 승격하면 쓰기 작업도 가능해집니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 다른 가용성 영역은 지리적으로 고립된 DR 사이트가 아닙니다. 같은 리전 내 AZ는 동일한 지역 재해에 영향을 받을 수 있습니다.</p>
<p><span class="mark-no">❌ B</span> — 지연 시간 라우팅은 DR 장애 조치가 아닌 성능 최적화 목적입니다.</p>
<p><span class="mark-no">❌ C</span> — 스냅샷 복원은 RTO 4시간을 초과할 수 있으며, RPO 15분을 보장하지 못합니다.</p>`,
  disc: [{ ans:'D (90%)', txt:'지리적 고립 = 다른 리전. 읽기 복제본은 연속적인 복제로 RPO 보장. 장애 조치 라우팅은 C(수동 DNS 변경)보다 자동화됨. 중단 시 읽기 복제본을 승격해야 쓰기 가능.' }]
},
{
  n: 108,
  en: `A large enterprise is deploying a web application on AWS. The application runs on Amazon EC2 instances behind an Application Load Balancer. The instances run in an Auto Scaling group across multiple Availability Zones. The application stores data in an Amazon RDS for Oracle DB instance and Amazon DynamoDB. There are separate environments for development, testing, and production.<br><br>What is the MOST secure and flexible way to obtain password credentials during deployment?`,
  ko: `대기업이 AWS에 웹 애플리케이션을 배포하고 있습니다. 애플리케이션은 Application Load Balancer 뒤의 Amazon EC2 인스턴스에서 실행됩니다. 인스턴스는 여러 가용성 영역에 걸쳐 Auto Scaling 그룹에서 실행됩니다. 애플리케이션은 Amazon RDS for Oracle DB 인스턴스와 Amazon DynamoDB에 데이터를 저장합니다. 개발, 테스트 및 프로덕션을 위한 별도의 환경이 있습니다.<br><br>배포 중에 암호 자격 증명을 얻는 가장 안전하고 유연한 방법은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Retrieve an access key from an AWS Systems Manager SecureString parameter to access AWS services. Retrieve the database credentials from a Systems Manager SecureString parameter.`, ko:`AWS Systems Manager SecureString 파라미터에서 액세스 키를 검색하여 AWS 서비스에 액세스합니다. Systems Manager SecureString 파라미터에서 데이터베이스 자격 증명을 검색합니다.` },
    { k:'B', en:`Launch the EC2 instances with an EC2 IAM role to access AWS services. Retrieve the database credentials from AWS Secrets Manager.`, ko:`EC2 IAM 역할로 EC2 인스턴스를 시작하여 AWS 서비스에 액세스합니다. AWS Secrets Manager에서 데이터베이스 자격 증명을 검색합니다.` },
    { k:'C', en:`Retrieve an access key from an AWS Systems Manager plaintext parameter to access AWS services. Retrieve the database credentials from a Systems Manager SecureString parameter.`, ko:`AWS Systems Manager 일반 텍스트 파라미터에서 액세스 키를 검색하여 AWS 서비스에 액세스합니다. Systems Manager SecureString 파라미터에서 데이터베이스 자격 증명을 검색합니다.` },
    { k:'D', en:`Launch the EC2 instances with an EC2 IAM role to access AWS services. Store the database passwords in an encrypted config file with the application artifacts.`, ko:`EC2 IAM 역할로 EC2 인스턴스를 시작하여 AWS 서비스에 액세스합니다. 애플리케이션 아티팩트와 함께 암호화된 구성 파일에 데이터베이스 비밀번호를 저장합니다.` },
  ],
  answer: ['B'],
  vote: '96% B',
  explain: `<p><span class="mark-ok">✅ B — IAM 역할 + AWS Secrets Manager</span></p><p>AWS 서비스 접근에는 액세스 키 대신 EC2 IAM 역할(인스턴스 프로파일)을 사용하는 것이 모범 사례입니다. 데이터베이스 자격 증명에는 AWS Secrets Manager가 가장 안전하고 유연한 옵션입니다. Secrets Manager는 자격 증명 자동 교체, 세밀한 접근 제어, RDS와의 네이티브 통합을 제공합니다. Systems Manager Parameter Store의 SecureString보다 비용이 높지만 보안 기능이 더 뛰어납니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — EC2에서 액세스 키를 사용하는 것은 모범 사례가 아닙니다. IAM 역할을 사용해야 합니다.</p>
<p><span class="mark-no">❌ C</span> — 일반 텍스트 파라미터에 액세스 키를 저장하는 것은 매우 위험합니다.</p>
<p><span class="mark-no">❌ D</span> — 암호화된 구성 파일도 아티팩트에 자격 증명을 포함하는 것은 보안 위험입니다.</p>`,
  disc: [{ ans:'B (96%)', txt:'AWS 서비스 접근 = IAM 역할(액세스 키 금지), DB 자격 증명 = Secrets Manager(자동 교체 + RDS 통합). 가장 안전하고 유연한 조합.' }]
},
{
  n: 109,
  en: `The security team depends on AWS CloudTrail to detect sensitive security issues in the company's AWS account. The DevOps engineer needs a solution to auto-remediate CloudTrail being turned off in an AWS account.<br><br>What solution ensures the LEAST amount of downtime for the CloudTrail log deliveries?`,
  ko: `보안 팀은 회사의 AWS 계정에서 민감한 보안 문제를 감지하기 위해 AWS CloudTrail에 의존합니다. DevOps 엔지니어는 AWS 계정에서 CloudTrail이 꺼지는 것을 자동으로 수정하는 솔루션이 필요합니다.<br><br>CloudTrail 로그 전달에 대한 최소 다운타임을 보장하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an Amazon EventBridge rule for the CloudTrail StopLogging event. Create an AWS Lambda function that uses the AWS SDK to call StartLogging on the ARN of the resource in which StopLogging was called. Add the Lambda function ARN as a target to the EventBridge rule.`, ko:`CloudTrail StopLogging 이벤트에 대한 Amazon EventBridge 규칙을 만듭니다. AWS SDK를 사용하여 StopLogging이 호출된 리소스의 ARN에서 StartLogging을 호출하는 AWS Lambda 함수를 만듭니다. Lambda 함수 ARN을 EventBridge 규칙에 대상으로 추가합니다.` },
    { k:'B', en:`Deploy the AWS-managed CloudTrail-enabled AWS Config rule, set with a periodic interval of 1 hour. Create an Amazon EventBridge rule for AWS Config rules compliance change. Create an AWS Lambda function that uses the AWS SDK to call StartLogging on the ARN of the resource in which StopLogging was called. Add the Lambda function ARN as a target to the EventBridge rule.`, ko:`주기적 간격을 1시간으로 설정하여 AWS 관리형 CloudTrail 지원 AWS Config 규칙을 배포합니다. AWS Config 규칙 준수 변경에 대한 Amazon EventBridge 규칙을 만듭니다. AWS SDK를 사용하여 StopLogging이 호출된 리소스의 ARN에서 StartLogging을 호출하는 AWS Lambda 함수를 만듭니다. Lambda 함수 ARN을 EventBridge 규칙에 대상으로 추가합니다.` },
    { k:'C', en:`Create an Amazon EventBridge rule for a scheduled event every 5 minutes. Create an AWS Lambda function that uses the AWS SDK to call StartLogging on a CloudTrail trail in the AWS account. Add the Lambda function ARN as a target to the EventBridge rule.`, ko:`5분마다 예약된 이벤트에 대한 Amazon EventBridge 규칙을 만듭니다. AWS SDK를 사용하여 AWS 계정의 CloudTrail 트레일에서 StartLogging을 호출하는 AWS Lambda 함수를 만듭니다. Lambda 함수 ARN을 EventBridge 규칙에 대상으로 추가합니다.` },
    { k:'D', en:`Launch a t2.nano instance with a script running every 5 minutes that uses the AWS SDK to query CloudTrail in the current account. If the CloudTrail trail is disabled, have the script re-enable the trail.`, ko:`현재 계정에서 AWS SDK를 사용하여 CloudTrail을 쿼리하는 5분마다 실행되는 스크립트로 t2.nano 인스턴스를 시작합니다. CloudTrail 트레일이 비활성화된 경우 스크립트가 트레일을 다시 활성화하도록 합니다.` },
  ],
  answer: ['A'],
  vote: '93% A',
  explain: `<p><span class="mark-ok">✅ A — EventBridge + Lambda 이벤트 기반 즉각 수정</span></p><p>CloudTrail StopLogging 이벤트가 발생하는 즉시 EventBridge 규칙이 트리거되고 Lambda 함수가 StartLogging을 호출합니다. 이 이벤트 기반 방식은 거의 실시간으로 수정이 이루어지므로 다운타임이 최소화됩니다. B는 1시간 주기로 검사하여 최대 1시간의 다운타임이 발생할 수 있고, C는 5분 간격 스케줄이며, D는 EC2 인스턴스가 필요한 비효율적인 방법입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 1시간 주기적 간격으로 인해 최대 1시간의 다운타임이 발생할 수 있어 "최소 다운타임" 조건에 부합하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — 5분 스케줄로 최대 5분 다운타임. 또한 트레일이 꺼진 경우에만 동작하지 않고 항상 StartLogging을 호출합니다.</p>
<p><span class="mark-no">❌ D</span> — EC2 인스턴스를 실행하는 것은 불필요하게 복잡하고 비용이 발생합니다.</p>`,
  disc: [{ ans:'A (93%)', txt:'이벤트 기반(StopLogging 발생 즉시) vs 주기적 검사(B:1시간, C:5분). 최소 다운타임 조건에서 이벤트 기반이 압도적으로 유리. AWS 블로그에서도 이 패턴을 권장.' }]
},
{
  n: 110,
  en: `A company uses AWS CodeArtifact to centrally store Python packages. The CodeArtifact repository is configured with the following repository policy:<br><br><img src="https://img.examtopics.com/aws-certified-devops-engineer-professional-dop-c02/image7.png" alt="Repository Policy" /><br><br>A development team is building a new project in an account that is in an organization in AWS Organizations. The development team wants to use a Python library that has already been stored in the CodeArtifact repository in the organization. The development team uses AWS CodePipeline and AWS CodeBuild to build the new application. The CodeBuild job that the development team uses to build the application is configured to run in a VPC. Because of compliance requirements, the VPC has no internet connectivity.<br><br>The development team creates the VPC endpoints for CodeArtifact and updates the CodeBuild buildspec.yaml file. However, the development team cannot download the Python library from the repository.<br><br>Which combination of steps should a DevOps engineer take so that the development team can use CodeArtifact? (Choose two.)`,
  ko: `한 회사에서 AWS CodeArtifact를 사용하여 Python 패키지를 중앙에서 저장합니다. CodeArtifact 리포지토리는 다음과 같은 리포지토리 정책으로 구성되어 있습니다:<br><br><img src="https://img.examtopics.com/aws-certified-devops-engineer-professional-dop-c02/image7.png" alt="리포지토리 정책" /><br><br>개발 팀이 AWS Organizations 조직에 있는 계정에서 새 프로젝트를 빌드하고 있습니다. 개발 팀은 조직의 CodeArtifact 리포지토리에 이미 저장된 Python 라이브러리를 사용하려고 합니다. 개발 팀은 AWS CodePipeline과 AWS CodeBuild를 사용하여 새 애플리케이션을 빌드합니다. 애플리케이션 빌드에 사용하는 CodeBuild 작업은 VPC에서 실행되도록 구성되어 있습니다. 규정 준수 요구 사항으로 인해 VPC에 인터넷 연결이 없습니다.<br><br>개발 팀은 CodeArtifact에 대한 VPC 엔드포인트를 만들고 CodeBuild buildspec.yaml 파일을 업데이트합니다. 그러나 개발 팀은 리포지토리에서 Python 라이브러리를 다운로드할 수 없습니다.<br><br>개발 팀이 CodeArtifact를 사용할 수 있도록 DevOps 엔지니어는 어떤 단계 조합을 수행해야 합니까? (두 가지 선택)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Create an Amazon S3 gateway endpoint. Update the route tables for the subnets that are running the CodeBuild job.`, ko:`Amazon S3 게이트웨이 엔드포인트를 만듭니다. CodeBuild 작업을 실행 중인 서브넷에 대한 경로 테이블을 업데이트합니다.` },
    { k:'B', en:`Update the repository policy's Principal statement to include the ARN of the role that the CodeBuild project uses.`, ko:`CodeBuild 프로젝트가 사용하는 역할의 ARN을 포함하도록 리포지토리 정책의 Principal 문을 업데이트합니다.` },
    { k:'C', en:`Share the CodeArtifact repository with the organization by using AWS Resource Access Manager (AWS RAM).`, ko:`AWS Resource Access Manager(AWS RAM)를 사용하여 CodeArtifact 리포지토리를 조직과 공유합니다.` },
    { k:'D', en:`Update the role that the CodeBuild project uses so that the role has sufficient permissions to use the CodeArtifact repository.`, ko:`CodeBuild 프로젝트가 사용하는 역할을 업데이트하여 해당 역할이 CodeArtifact 리포지토리를 사용할 수 있는 충분한 권한을 갖도록 합니다.` },
    { k:'E', en:`Specify the account that hosts the repository as the delegated administrator for CodeArtifact in the organization.`, ko:`조직에서 CodeArtifact에 대한 위임된 관리자로 리포지토리를 호스팅하는 계정을 지정합니다.` },
  ],
  answer: ['A','D'],
  vote: '53% AD',
  explain: `<p><span class="mark-ok">✅ A — S3 게이트웨이 엔드포인트 생성</span></p><p>AWS CodeArtifact는 패키지 자산을 Amazon S3에 저장합니다. 인터넷 연결이 없는 VPC에서 CodeArtifact를 사용하려면 CodeArtifact VPC 엔드포인트 외에도 S3 게이트웨이 엔드포인트가 필요합니다. (참고: 현재 AWS 문서에는 Python/Swift 패키지에는 S3 엔드포인트가 불필요하다는 주석이 있으나, 시험 문제 출제 당시에는 해당 예외가 없었음)</p>
<p><span class="mark-ok">✅ D — CodeBuild 역할에 CodeArtifact 권한 추가</span></p><p>CodeBuild 프로젝트가 사용하는 IAM 역할에 CodeArtifact 리포지토리에서 패키지를 읽을 수 있는 권한(codeartifact:GetAuthorizationToken, codeartifact:ReadFromRepository 등)이 없을 경우 다운로드가 실패합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 리포지토리 정책의 Principal이 이미 <code>*</code>로 설정되어 있으며, <code>aws:PrincipalOrgID</code> 조건으로 조직 전체를 허용하고 있습니다. 특정 역할 ARN 추가는 불필요합니다.</p>
<p><span class="mark-no">❌ C</span> — CodeArtifact는 AWS RAM을 통한 공유를 지원하지 않습니다.</p>
<p><span class="mark-no">❌ E</span> — CodeArtifact 위임 관리자 지정은 이 문제와 무관합니다.</p>`,
  disc: [{ ans:'AD (53%) vs BD (39%)', txt:'논란의 핵심: Python 패키지에 S3 엔드포인트 필요 여부. 현재 AWS 문서는 Python에는 불필요하다고 명시하나, 시험 출제 당시 문서 기준으로는 AD가 정답. 리포지토리 정책 Principal이 이미 *이므로 B는 불필요.' }]
},
{
  n: 111,
  en: `A company uses a series of individual Amazon CloudFormation templates to deploy its multi-Region applications. These templates must be deployed in a specific order. The company is making more changes to the templates than previously expected and wants to deploy new templates more efficiently. Additionally, the data engineering team must be notified of all changes to the templates.<br><br>What should the company do to accomplish these goals?`,
  ko: `한 회사는 다중 리전 애플리케이션을 배포하기 위해 일련의 개별 Amazon CloudFormation 템플릿을 사용합니다. 이러한 템플릿은 특정 순서로 배포해야 합니다. 회사는 예상보다 더 많은 템플릿 변경 작업을 하고 있으며 새로운 템플릿을 보다 효율적으로 배포하려고 합니다. 또한 데이터 엔지니어링 팀에 템플릿의 모든 변경 사항을 알려야 합니다.<br><br>이러한 목표를 달성하기 위해 회사는 무엇을 해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an AWS Lambda function to deploy the CloudFormation templates in the required order. Use stack policies to alert the data engineering team.`, ko:`필요한 순서대로 CloudFormation 템플릿을 배포하기 위한 AWS Lambda 함수를 만듭니다. 스택 정책을 사용하여 데이터 엔지니어링 팀에 경고합니다.` },
    { k:'B', en:`Host the CloudFormation templates in Amazon S3. Use Amazon S3 events to directly trigger CloudFormation updates and Amazon SNS notifications.`, ko:`Amazon S3에서 CloudFormation 템플릿을 호스팅합니다. Amazon S3 이벤트를 사용하여 CloudFormation 업데이트 및 Amazon SNS 알림을 직접 트리거합니다.` },
    { k:'C', en:`Implement CloudFormation StackSets and use drift detection to trigger update alerts to the data engineering team.`, ko:`CloudFormation StackSets를 구현하고 드리프트 감지를 사용하여 데이터 엔지니어링 팀에 업데이트 알림을 트리거합니다.` },
    { k:'D', en:`Leverage CloudFormation nested stacks and stack sets for deployments. Use Amazon SNS to notify the data engineering team.`, ko:`배포를 위해 CloudFormation 중첩 스택과 스택 세트를 활용합니다. Amazon SNS를 사용하여 데이터 엔지니어링 팀에 알립니다.` },
  ],
  answer: ['D'],
  vote: '94% D',
  explain: `<p><span class="mark-ok">✅ D — CloudFormation 중첩 스택 + StackSets + SNS</span></p><p>중첩 스택(Nested Stacks)은 여러 상호 종속 템플릿을 올바른 순서로 관리하고 배포하는 것을 단순화합니다. StackSets는 단일 작업으로 여러 리전에 스택을 생성·업데이트·삭제할 수 있어 다중 리전 배포를 효율화합니다. Amazon SNS를 통해 CloudFormation 스택 변경 사항을 데이터 엔지니어링 팀에 자동으로 알릴 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 스택 정책(Stack Policy)은 리소스 업데이트를 보호하는 용도이며, 알림을 보내는 기능이 없습니다.</p>
<p><span class="mark-no">❌ B</span> — S3 이벤트로 CloudFormation 업데이트를 직접 트리거할 수 없습니다.</p>
<p><span class="mark-no">❌ C</span> — 드리프트 감지(Drift Detection)는 배포된 리소스와 템플릿 간의 차이를 감지하는 것으로, 템플릿 변경 알림을 보내는 내장 솔루션이 없습니다. 또한 특정 배포 순서를 보장하지 않습니다.</p>`,
  disc: [{ ans:'D (94%)', txt:'중첩 스택으로 배포 순서 보장, StackSets로 다중 리전 효율화, SNS로 알림. C의 드리프트 감지는 배포된 스택의 구성 변경을 감지하는 것이지 템플릿 자체 변경 알림이 아님.' }]
},
{
  n: 112,
  en: `A DevOps engineer has implemented a CI/CD pipeline to deploy an AWS CloudFormation template that provisions a web application. The web application consists of an Application Load Balancer (ALB), a target group, a launch template that uses an Amazon Linux 2 AMI, an Auto Scaling group of Amazon EC2 instances, a security group, and an Amazon RDS for MySQL database. The launch template includes user data that specifies a script to install and start the application.<br><br>The initial deployment of the application was successful. The DevOps engineer made changes to update the version of the application with the user data. The CI/CD pipeline has deployed a new version of the template. However, the health checks on the ALB are now failing. The health checks have marked all targets as unhealthy.<br><br>During investigation, the DevOps engineer notices that the CloudFormation stack has a status of UPDATE_COMPLETE. However, when the DevOps engineer connects to one of the EC2 instances and checks /var/log/messages, the DevOps engineer notices that the Apache web server failed to start successfully because of a configuration error.<br><br>How can the DevOps engineer ensure that the CloudFormation deployment will fail if the user data fails to successfully finish running?`,
  ko: `DevOps 엔지니어가 웹 애플리케이션을 프로비저닝하는 AWS CloudFormation 템플릿을 배포하기 위한 CI/CD 파이프라인을 구현했습니다. 웹 애플리케이션은 ALB(Application Load Balancer), 대상 그룹, Amazon Linux 2 AMI를 사용하는 시작 템플릿, Amazon EC2 인스턴스의 Auto Scaling 그룹, 보안 그룹, MySQL 데이터베이스용 Amazon RDS로 구성됩니다. 시작 템플릿에는 애플리케이션을 설치하고 시작하는 스크립트를 지정하는 사용자 데이터가 포함됩니다.<br><br>애플리케이션의 초기 배포는 성공적이었습니다. DevOps 엔지니어는 사용자 데이터로 애플리케이션 버전을 업데이트하기 위해 변경했습니다. CI/CD 파이프라인은 템플릿의 새 버전을 배포했습니다. 그러나 ALB의 상태 검사가 이제 실패하고 있습니다. 상태 검사에서 모든 대상이 비정상으로 표시되었습니다.<br><br>조사 중에 DevOps 엔지니어는 CloudFormation 스택의 상태가 UPDATE_COMPLETE임을 알아챘습니다. 하지만 EC2 인스턴스 중 하나에 연결하여 /var/log/messages를 확인하면 구성 오류로 인해 Apache 웹 서버가 성공적으로 시작되지 않았다는 것을 알게 됩니다.<br><br>DevOps 엔지니어는 사용자 데이터가 성공적으로 실행을 완료하지 못하면 CloudFormation 배포가 실패하도록 어떻게 보장할 수 있습니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use the cfn-signal helper script to signal success or failure to CloudFormation. Use the WaitOnResourceSignals update policy within the CloudFormation template. Set an appropriate timeout for the update policy.`, ko:`cfn-signal 헬퍼 스크립트를 사용하여 CloudFormation에 성공 또는 실패를 알립니다. CloudFormation 템플릿 내에서 WaitOnResourceSignals 업데이트 정책을 사용합니다. 업데이트 정책에 대한 적절한 시간 초과를 설정합니다.` },
    { k:'B', en:`Create an Amazon CloudWatch alarm for the UnhealthyHostCount metric. Include an appropriate alarm threshold for the target group. Create an Amazon Simple Notification Service (Amazon SNS) topic as the target to signal success or failure to CloudFormation.`, ko:`UnhealthyHostCount 메트릭에 대한 Amazon CloudWatch 알람을 만듭니다. 대상 그룹에 대한 적절한 알람 임계값을 포함합니다. Amazon SNS 주제를 대상으로 만들어 CloudFormation에 성공 또는 실패를 알립니다.` },
    { k:'C', en:`Create a lifecycle hook on the Auto Scaling group by using the AWS::AutoScaling::LifecycleHook resource. Create an Amazon Simple Notification Service (Amazon SNS) topic as the target to signal success or failure to CloudFormation. Set an appropriate timeout on the lifecycle hook.`, ko:`AWS::AutoScaling::LifecycleHook 리소스를 사용하여 Auto Scaling 그룹에 라이프사이클 후크를 만듭니다. Amazon SNS 주제를 대상으로 만들어 CloudFormation에 성공 또는 실패를 알립니다. 라이프사이클 후크에 적절한 시간 초과를 설정합니다.` },
    { k:'D', en:`Use the Amazon CloudWatch agent to stream the cloud-init logs. Create a subscription filter that includes an AWS Lambda function with an appropriate invocation timeout. Configure the Lambda function to use the SignalResource API operation to signal success or failure to CloudFormation.`, ko:`Amazon CloudWatch 에이전트를 사용하여 cloud-init 로그를 스트리밍합니다. 적절한 호출 시간 제한이 있는 AWS Lambda 함수를 포함하는 구독 필터를 만듭니다. Lambda 함수를 구성하여 SignalResource API 작업을 사용하여 CloudFormation에 성공 또는 실패를 알립니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — cfn-signal + WaitOnResourceSignals 정책</span></p><p>cfn-signal 헬퍼 스크립트는 사용자 데이터 스크립트 실행 결과를 CloudFormation에 알리는 공식 메커니즘입니다. Auto Scaling 그룹에 WaitOnResourceSignals 업데이트 정책을 설정하면 CloudFormation은 지정된 수의 성공 신호를 받을 때까지 업데이트 완료로 간주하지 않습니다. 사용자 데이터 스크립트 마지막에 <code>cfn-signal -e $? ...</code>를 추가하면 스크립트 실패 시 CloudFormation 배포가 실패하고 롤백됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — CloudWatch 알람은 배포 후 모니터링에 사용되지만, 배포 중 실패를 CloudFormation에 신호로 보내는 공식 메커니즘이 아닙니다.</p>
<p><span class="mark-no">❌ C</span> — 라이프사이클 후크는 인스턴스 시작/종료 중 작업을 수행하는 데 사용되지만, 사용자 데이터 실패를 CloudFormation에 직접 신호로 보내지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — 복잡한 솔루션이며, A의 cfn-signal이 이미 이 목적을 위해 설계된 표준 방법입니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'cfn-signal은 CloudFormation 사용자 데이터 통합의 표준 패턴. 스크립트 끝에 cfn-signal -e $?를 추가하고 WaitOnResourceSignals를 활성화하면 실패 시 자동 롤백.' }]
},
{
  n: 113,
  en: `A company has a data ingestion application that runs across multiple AWS accounts. The accounts are in an organization in AWS Organizations. The company needs to monitor the application and consolidate access to the application. Currently, the company is running the application on Amazon EC2 instances from several Auto Scaling groups. The EC2 instances have no access to the internet because the data is sensitive. Engineers have deployed the necessary VPC endpoints. The EC2 instances run a custom AMI that is built specifically for the application.<br><br>To maintain and troubleshoot the application, system administrators need the ability to log in to the EC2 instances. This access must be automated and controlled centrally. The company's security team must receive a notification whenever the instances are accessed.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사에 여러 AWS 계정에서 실행되는 데이터 수집 애플리케이션이 있습니다. 계정은 AWS Organizations의 조직에 있습니다. 이 회사는 애플리케이션을 모니터링하고 애플리케이션에 대한 액세스를 통합해야 합니다. 현재 이 회사는 여러 Auto Scaling 그룹의 Amazon EC2 인스턴스에서 애플리케이션을 실행하고 있습니다. 데이터가 민감하기 때문에 EC2 인스턴스는 인터넷에 액세스할 수 없습니다. 엔지니어는 필요한 VPC 엔드포인트를 배포했습니다. EC2 인스턴스는 애플리케이션을 위해 특별히 구축된 사용자 지정 AMI를 실행합니다.<br><br>애플리케이션을 유지 관리하고 문제를 해결하려면 시스템 관리자가 EC2 인스턴스에 로그인할 수 있어야 합니다. 이 액세스는 자동화되어야 하며 중앙에서 제어되어야 합니다. 인스턴스에 액세스할 때마다 회사의 보안 팀은 알림을 받아야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an Amazon EventBridge rule to send notifications to the security team whenever a user logs in to an EC2 instance. Use EC2 Instance Connect to log in to the instances. Deploy Auto Scaling groups by using AWS CloudFormation. Use the cfn-init helper script to deploy appropriate VPC routes for external access. Rebuild the custom AMI so that the custom AMI includes AWS Systems Manager Agent.`, ko:`사용자가 EC2 인스턴스에 로그인할 때마다 보안 팀에 알림을 보내는 Amazon EventBridge 규칙을 만듭니다. EC2 Instance Connect를 사용하여 인스턴스에 로그인합니다. AWS CloudFormation을 사용하여 Auto Scaling 그룹을 배포합니다. cfn-init 헬퍼 스크립트를 사용하여 외부 액세스를 위한 적절한 VPC 경로를 배포합니다. 사용자 지정 AMI에 AWS Systems Manager Agent가 포함되도록 사용자 지정 AMI를 다시 빌드합니다.` },
    { k:'B', en:`Deploy a NAT gateway and a bastion host that has internet access. Create a security group that allows incoming traffic on all the EC2 instances from the bastion host. Install AWS Systems Manager Agent on all the EC2 instances. Use Auto Scaling group lifecycle hooks for monitoring and auditing access. Use Systems Manager Session Manager to log in to the instances. Send logs to a log group in Amazon CloudWatch Logs. Export data to Amazon S3 for auditing. Send notifications to the security team by using S3 event notifications.`, ko:`인터넷에 액세스할 수 있는 NAT 게이트웨이와 베스천 호스트를 배포합니다. 베스천 호스트에서 모든 EC2 인스턴스로 들어오는 트래픽을 허용하는 보안 그룹을 만듭니다. 모든 EC2 인스턴스에 AWS Systems Manager Agent를 설치합니다. Auto Scaling 그룹 라이프사이클 후크를 사용하여 액세스를 모니터링하고 감사합니다. Systems Manager Session Manager를 사용하여 인스턴스에 로그인합니다. Amazon CloudWatch Logs의 로그 그룹으로 로그를 보냅니다. 감사를 위해 Amazon S3로 데이터를 내보냅니다. S3 이벤트 알림을 사용하여 보안 팀에 알림을 보냅니다.` },
    { k:'C', en:`Use EC2 Image Builder to rebuild the custom AMI. Include the most recent version of AWS Systems Manager Agent in the image. Configure the Auto Scaling group to attach the AmazonSSMManagedInstanceCore role to all the EC2 instances. Use Systems Manager Session Manager to log in to the instances. Enable logging of session details to Amazon S3. Create an S3 event notification for new file uploads to send a message to the security team through an Amazon Simple Notification Service (Amazon SNS) topic.`, ko:`EC2 Image Builder를 사용하여 사용자 지정 AMI를 다시 빌드합니다. 이미지에 최신 버전의 AWS Systems Manager Agent를 포함합니다. 모든 EC2 인스턴스에 AmazonSSMManagedInstanceCore 역할을 연결하도록 Auto Scaling 그룹을 구성합니다. Systems Manager Session Manager를 사용하여 인스턴스에 로그인합니다. Amazon S3에 세션 세부 정보 로깅을 활성화합니다. 새 파일 업로드에 대한 S3 이벤트 알림을 만들어 Amazon SNS 주제를 통해 보안 팀에 메시지를 보냅니다.` },
    { k:'D', en:`Use AWS Systems Manager Automation to build Systems Manager Agent into the custom AMI. Configure AWS Config to attach an SCP to the root organization account to allow the EC2 instances to connect to Systems Manager. Use Systems Manager Session Manager to log in to the instances. Enable logging of session details to Amazon S3. Create an S3 event notification for new file uploads to send a message to the security team through an Amazon Simple Notification Service (Amazon SNS) topic.`, ko:`AWS Systems Manager Automation을 사용하여 Systems Manager Agent를 사용자 지정 AMI에 빌드합니다. AWS Config를 구성하여 EC2 인스턴스가 Systems Manager에 연결할 수 있도록 루트 조직 계정에 SCP를 연결합니다. Systems Manager Session Manager를 사용하여 인스턴스에 로그인합니다. Amazon S3에 세션 세부 정보 로깅을 활성화합니다. 새 파일 업로드에 대한 S3 이벤트 알림을 만들어 Amazon SNS 주제를 통해 보안 팀에 메시지를 보냅니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — EC2 Image Builder + SSM Session Manager + S3 로깅 + SNS</span></p><p>EC2 인터넷 연결이 없으므로 베스천 호스트나 EC2 Instance Connect는 사용 불가합니다. EC2 Image Builder로 SSM Agent가 포함된 AMI를 재빌드하고, AmazonSSMManagedInstanceCore 역할을 Auto Scaling 그룹에 연결하면 VPC 엔드포인트를 통해 Session Manager로 인스턴스에 접근할 수 있습니다. S3에 세션 로그를 저장하고 S3 이벤트 알림으로 SNS를 통해 보안 팀에 알림을 보내면 모든 요구사항이 충족됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — EC2 Instance Connect는 인터넷 연결이 없는 환경에서 작동하지 않습니다.</p>
<p><span class="mark-no">❌ B</span> — NAT 게이트웨이와 베스천 호스트를 추가하면 인터넷 연결이 없다는 보안 요구사항을 위반합니다.</p>
<p><span class="mark-no">❌ D</span> — AWS Config는 SCP를 연결하는 데 사용할 수 없습니다. 또한 SCP는 권한을 허용하는 것이 아니라 거부하는 데 사용됩니다. EC2 Image Builder 대신 SSM Automation으로 AMI를 빌드하는 것도 적절하지 않습니다.</p>`,
  disc: [{ ans:'C (100%)', txt:'인터넷 없는 환경 = SSM Session Manager(VPC 엔드포인트 이미 배포됨). EC2 Image Builder로 SSM Agent 포함 AMI 재빌드, IAM 역할 연결, S3 세션 로그 + SNS 알림이 완전한 솔루션.' }]
},
{
  n: 114,
  en: `A company uses Amazon S3 to store proprietary information. The development team creates buckets for new projects on a daily basis. The security team wants to ensure that all existing and future buckets have encryption, logging, and versioning enabled. Additionally, no buckets should ever be publicly read or write accessible.<br><br>What should a DevOps engineer do to meet these requirements?`,
  ko: `한 회사가 Amazon S3를 사용하여 독점 정보를 저장합니다. 개발 팀은 매일 새로운 프로젝트를 위한 버킷을 만듭니다. 보안 팀은 모든 기존 및 미래 버킷에 암호화, 로깅 및 버전 관리가 활성화되어 있는지 확인하려고 합니다. 또한 어떤 버킷도 공개적으로 읽거나 쓸 수 있는 권한이 없어야 합니다.<br><br>DevOps 엔지니어는 이러한 요구 사항을 충족하기 위해 무엇을 해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Enable AWS CloudTrail and configure automatic remediation using AWS Lambda.`, ko:`AWS CloudTrail을 활성화하고 AWS Lambda를 사용하여 자동 수정을 구성합니다.` },
    { k:'B', en:`Enable AWS Config rules and configure automatic remediation using AWS Systems Manager documents.`, ko:`AWS Config 규칙을 활성화하고 AWS Systems Manager 문서를 사용하여 자동 수정을 구성합니다.` },
    { k:'C', en:`Enable AWS Trusted Advisor and configure automatic remediation using Amazon EventBridge.`, ko:`AWS Trusted Advisor를 활성화하고 Amazon EventBridge를 사용하여 자동 수정을 구성합니다.` },
    { k:'D', en:`Enable AWS Systems Manager and configure automatic remediation using Systems Manager documents.`, ko:`AWS Systems Manager를 활성화하고 Systems Manager 문서를 사용하여 자동 수정을 구성합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — AWS Config 규칙 + Systems Manager 자동 수정</span></p><p>AWS Config는 리소스 구성을 평가하는 규칙을 지원합니다. S3 버킷에 대한 관리형 규칙(s3-bucket-server-side-encryption-enabled, s3-bucket-logging-enabled, s3-bucket-versioning-enabled, s3-bucket-public-read-prohibited 등)을 활성화하면 기존 및 신규 버킷을 지속적으로 모니터링할 수 있습니다. 비준수 리소스는 AWS Systems Manager Automation 문서를 사용하여 자동으로 수정할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CloudTrail은 API 호출 로깅 서비스이며, 리소스 구성 규정 준수 평가 기능이 없습니다.</p>
<p><span class="mark-no">❌ C</span> — Trusted Advisor는 권장 사항을 제공하지만 실시간 규정 준수 모니터링과 자동 수정 기능이 Config보다 제한적입니다.</p>
<p><span class="mark-no">❌ D</span> — Systems Manager만으로는 S3 구성을 지속적으로 평가하는 규칙 기반 모니터링을 제공하지 않습니다. Config의 규칙 평가 엔진이 핵심입니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'AWS Config 관리형 규칙으로 S3 암호화/로깅/버전관리/공개접근 차단을 지속 모니터링. 비준수 시 SSM Automation Document로 자동 수정 — 이것이 Config 자동 수정의 표준 패턴.' }]
},
{
  n: 115,
  en: `A DevOps engineer is researching the least expensive way to implement an image batch processing cluster on AWS. The application cannot run in Docker containers and must run on Amazon EC2. The batch job stores checkpoint data on an NFS volume and can tolerate interruptions. Configuring the cluster software from a generic EC2 Linux image takes 30 minutes.<br><br>What is the MOST cost-effective solution?`,
  ko: `DevOps 엔지니어가 AWS에서 이미지 일괄 처리 클러스터를 구현하는 가장 저렴한 방법을 연구하고 있습니다. 이 애플리케이션은 Docker 컨테이너에서 실행할 수 없으며 Amazon EC2에서 실행해야 합니다. 일괄 작업은 NFS 볼륨에 체크포인트 데이터를 저장하며 중단을 허용할 수 있습니다. 일반 EC2 Linux 이미지에서 클러스터 소프트웨어를 구성하는 데 30분이 걸립니다.<br><br>가장 비용 효율적인 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use Amazon EFS for checkpoint data. To complete the job, use an EC2 Auto Scaling group and an On-Demand pricing model to provision EC2 instances temporarily.`, ko:`체크포인트 데이터에 Amazon EFS를 사용합니다. 작업을 완료하려면 EC2 Auto Scaling 그룹과 On-Demand 가격 책정 모델을 사용하여 EC2 인스턴스를 임시로 프로비저닝합니다.` },
    { k:'B', en:`Use GlusterFS on EC2 instances for checkpoint data. To run the batch job, configure EC2 instances manually. When the job completes, shut down the instances manually.`, ko:`체크포인트 데이터에 대해 EC2 인스턴스에서 GlusterFS를 사용합니다. 일괄 작업을 실행하려면 EC2 인스턴스를 수동으로 구성합니다. 작업이 완료되면 인스턴스를 수동으로 종료합니다.` },
    { k:'C', en:`Use Amazon EFS for checkpoint data. Use EC2 Fleet to launch EC2 Spot Instances, and utilize user data to configure the EC2 Linux instance on startup.`, ko:`체크포인트 데이터에 Amazon EFS를 사용합니다. EC2 Fleet를 사용하여 EC2 Spot 인스턴스를 시작하고, 사용자 데이터를 활용하여 시작 시 EC2 Linux 인스턴스를 구성합니다.` },
    { k:'D', en:`Use Amazon EFS for checkpoint data. Use EC2 Fleet to launch EC2 Spot Instances. Create a custom AMI for the cluster and use the latest AMI when creating instances.`, ko:`체크포인트 데이터에 Amazon EFS를 사용합니다. EC2 Fleet를 사용하여 EC2 Spot 인스턴스를 시작합니다. 클러스터에 대한 사용자 지정 AMI를 만들고 인스턴스를 만들 때 최신 AMI를 사용합니다.` },
  ],
  answer: ['D'],
  vote: '81% D',
  explain: `<p><span class="mark-ok">✅ D — EFS + EC2 Fleet Spot 인스턴스 + 사용자 지정 AMI</span></p><p>"중단을 허용할 수 있다"는 것은 Spot 인스턴스 사용이 적합함을 의미합니다. 사용자 지정 AMI에 클러스터 소프트웨어를 미리 포함하면 인스턴스 시작 시 30분 구성 시간을 제거할 수 있어 비용이 절감됩니다. 여러 번의 스케일링 이벤트가 발생하면 각 인스턴스마다 30분의 비용이 낭비되므로, 미리 구성된 AMI가 장기적으로 더 비용 효율적입니다. Amazon EFS는 NFS 볼륨 역할을 하여 체크포인트 데이터를 저장합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — On-Demand 가격은 Spot 인스턴스보다 비용이 높습니다.</p>
<p><span class="mark-no">❌ B</span> — 수동 구성과 종료는 비효율적이며 비용 최적화가 없습니다.</p>
<p><span class="mark-no">❌ C</span> — Spot 인스턴스는 올바르지만, 사용자 데이터로 매 시작마다 30분 구성이 필요해 비용이 더 발생합니다. 사용자 지정 AMI(D)가 더 비용 효율적입니다.</p>`,
  disc: [{ ans:'D (81%) vs C', txt:'핵심: 30분 부트스트래핑 × 스케일 횟수 = 낭비 비용. 사용자 지정 AMI로 구성 시간 제거가 장기적으로 더 경제적. C는 Spot 사용은 좋지만 매번 30분 구성 비용 발생.' }]
},
{
  n: 116,
  en: `A company recently migrated its legacy application from on-premises to AWS. The application is hosted on Amazon EC2 instances behind an Application Load Balancer, which is behind Amazon API Gateway. The company wants to ensure users experience minimal disruptions during any deployment of a new version of the application. The company also wants to ensure it can quickly roll back updates if there is an issue.<br><br>Which solution will meet these requirements with MINIMAL changes to the application?`,
  ko: `한 회사가 최근 온프레미스에서 AWS로 레거시 애플리케이션을 마이그레이션했습니다. 이 애플리케이션은 Amazon API Gateway 뒤에 있는 Application Load Balancer 뒤의 Amazon EC2 인스턴스에서 호스팅됩니다. 이 회사는 새 버전의 애플리케이션을 배포하는 동안 사용자가 최소한의 중단을 경험하도록 하려고 합니다. 또한 문제가 있는 경우 업데이트를 신속하게 롤백할 수 있도록 하려고 합니다.<br><br>애플리케이션에 대한 최소한의 변경으로 이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Introduce changes as a separate environment parallel to the existing one. Configure API Gateway to use a canary release deployment to send a small subset of user traffic to the new environment.`, ko:`기존 환경과 병행되는 별도의 환경으로 변경 사항을 도입합니다. API Gateway를 구성하여 카나리 릴리스 배포를 사용해 사용자 트래픽의 작은 하위 집합을 새 환경으로 보냅니다.` },
    { k:'B', en:`Introduce changes as a separate environment parallel to the existing one. Update the application's DNS alias records to point to the new environment.`, ko:`기존 환경과 병행되는 별도의 환경으로 변경 사항을 도입합니다. 새 환경을 가리키도록 애플리케이션의 DNS 별칭 레코드를 업데이트합니다.` },
    { k:'C', en:`Introduce changes as a separate target group behind the existing Application Load Balancer. Configure API Gateway to route user traffic to the new target group in steps.`, ko:`기존 Application Load Balancer 뒤에 별도의 대상 그룹으로 변경 사항을 도입합니다. API Gateway를 구성하여 사용자 트래픽을 새 대상 그룹으로 단계적으로 라우팅합니다.` },
    { k:'D', en:`Introduce changes as a separate target group behind the existing Application Load Balancer. Configure API Gateway to route all traffic to the Application Load Balancer, which then sends the traffic to the new target group.`, ko:`기존 Application Load Balancer 뒤에 별도의 대상 그룹으로 변경 사항을 도입합니다. 모든 트래픽을 Application Load Balancer로 라우팅하도록 API Gateway를 구성한 다음, 트래픽을 새 대상 그룹으로 보냅니다.` },
  ],
  answer: ['A'],
  vote: '79% A',
  explain: `<p><span class="mark-ok">✅ A — 병렬 환경 + API Gateway 카나리 릴리스</span></p><p>API Gateway는 카나리 릴리스 배포를 기본 지원합니다. 기존 환경과 병렬로 새 환경을 구축하고, API Gateway에서 카나리 설정으로 소량의 트래픽을 새 환경으로 라우팅합니다. 이 방식은 최소한의 중단으로 점진적 롤아웃이 가능하며, 문제 발생 시 카나리 트래픽을 즉시 0%로 설정하여 신속한 롤백이 가능합니다. 애플리케이션 자체 변경 없이 API Gateway 설정만으로 구현됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — DNS 별칭 레코드 업데이트는 TTL 캐시로 인해 즉각적인 롤백이 어렵습니다.</p>
<p><span class="mark-no">❌ C</span> — API Gateway는 단순히 ALB로 트래픽을 전달하며, ALB 내 대상 그룹 간 단계적 트래픽 분배를 API Gateway가 직접 제어하는 기능은 제한적입니다.</p>
<p><span class="mark-no">❌ D</span> — 모든 트래픽을 한 번에 새 대상 그룹으로 전환하는 것은 "최소한의 중단" 요구사항에 부합하지 않습니다.</p>`,
  disc: [{ ans:'A (79%)', txt:'API Gateway 카나리 배포는 별도 단계를 생성하고 % 트래픽을 조절하는 기능을 제공. 병렬 환경 + 트래픽 분할 + 즉각 롤백 가능 = 최소 중단 + 최소 변경 조건 충족.' }]
},
{
  n: 117,
  en: `A company is storing 100 GB of log data in .csv format in an Amazon S3 bucket. SQL developers want to query this data and generate graphs to visualize it. The SQL developers also need an efficient, automated way to store metadata from the .csv file.<br><br>Which combination of steps will meet these requirements with the LEAST amount of effort? (Choose three.)`,
  ko: `한 회사가 Amazon S3 버킷에 .csv 형식으로 100GB의 로그 데이터를 저장하고 있습니다. SQL 개발자는 이 데이터를 쿼리하고 그래프를 생성하여 시각화하려고 합니다. SQL 개발자는 또한 .csv 파일의 메타데이터를 저장하는 효율적이고 자동화된 방법이 필요합니다.<br><br>최소한의 노력으로 이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (세 가지 선택)`,
  type: 'multi',
  multiCount: 3,
  choices: [
    { k:'A', en:`Filter the data through AWS X-Ray to visualize the data.`, ko:`AWS X-Ray를 통해 데이터를 필터링하여 데이터를 시각화합니다.` },
    { k:'B', en:`Filter the data through Amazon QuickSight to visualize the data.`, ko:`Amazon QuickSight를 통해 데이터를 필터링하여 데이터를 시각화합니다.` },
    { k:'C', en:`Query the data with Amazon Athena.`, ko:`Amazon Athena를 사용하여 데이터를 쿼리합니다.` },
    { k:'D', en:`Query the data with Amazon Redshift.`, ko:`Amazon Redshift로 데이터를 쿼리합니다.` },
    { k:'E', en:`Use the AWS Glue Data Catalog as the persistent metadata store.`, ko:`AWS Glue 데이터 카탈로그를 영구 메타데이터 저장소로 사용합니다.` },
    { k:'F', en:`Use Amazon DynamoDB as the persistent metadata store.`, ko:`Amazon DynamoDB를 영구 메타데이터 저장소로 사용합니다.` },
  ],
  answer: ['B','C','E'],
  vote: '100% BCE',
  explain: `<p><span class="mark-ok">✅ B — Amazon QuickSight로 시각화</span></p><p>QuickSight는 Athena와 직접 통합되어 SQL 쿼리 결과를 그래프와 대시보드로 시각화합니다.</p>
<p><span class="mark-ok">✅ C — Amazon Athena로 S3 데이터 쿼리</span></p><p>Athena는 서버리스 SQL 쿼리 서비스로, S3에 저장된 .csv 파일을 별도의 데이터 로딩 없이 직접 쿼리할 수 있습니다. 최소 노력으로 구현 가능합니다.</p>
<p><span class="mark-ok">✅ E — AWS Glue 데이터 카탈로그로 메타데이터 관리</span></p><p>Glue 데이터 카탈로그는 S3 버킷을 크롤링하여 .csv 파일의 스키마와 메타데이터를 자동으로 저장합니다. Athena는 Glue 데이터 카탈로그를 직접 참조합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — AWS X-Ray는 분산 추적 서비스이며 데이터 시각화 도구가 아닙니다.</p>
<p><span class="mark-no">❌ D</span> — Amazon Redshift는 데이터 웨어하우스로 데이터를 로드해야 하며, S3 직접 쿼리에 비해 더 많은 비용과 설정이 필요합니다.</p>
<p><span class="mark-no">❌ F</span> — DynamoDB는 NoSQL 데이터베이스로 .csv 파일 메타데이터 저장에 최적화되어 있지 않습니다. Athena는 DynamoDB를 직접 참조하지 않습니다.</p>`,
  disc: [{ ans:'BCE (100%)', txt:'S3 CSV 데이터 분석의 표준 서버리스 아키텍처: Glue 크롤러로 메타데이터 자동 수집 → Athena로 SQL 쿼리 → QuickSight로 시각화. 최소 설정, 서버리스, 비용 효율적.' }]
},
{
  n: 118,
  en: `A company deploys its corporate infrastructure on AWS across multiple AWS Regions and Availability Zones. The infrastructure is deployed on Amazon EC2 instances and connects with AWS IoT Greengrass devices. The company deploys additional resources on on-premises servers that are located in the corporate headquarters.<br><br>The company wants to reduce the overhead involved in maintaining and updating its resources. The company's DevOps team plans to use AWS Systems Manager to implement automated management and application of patches. The DevOps team confirms that Systems Manager is available in the Regions that the resources are deployed in. Systems Manager also is available in a Region near the corporate headquarters.<br><br>Which combination of steps must the DevOps team take to implement automated patch and configuration management across the company's EC2 instances, IoT devices, and on-premises infrastructure? (Choose three.)`,
  ko: `한 회사가 여러 AWS 리전 및 가용성 영역에 걸쳐 AWS에서 기업 인프라를 배포합니다. 인프라는 Amazon EC2 인스턴스에 배포되고 AWS IoT Greengrass 기기와 연결됩니다. 이 회사는 본사에 있는 온프레미스 서버에 추가 리소스를 배포합니다.<br><br>이 회사는 리소스 유지 관리 및 업데이트에 관련된 오버헤드를 줄이고자 합니다. DevOps 팀은 AWS Systems Manager를 사용하여 패치의 자동화된 관리 및 적용을 구현할 계획입니다. DevOps 팀은 리소스가 배포된 리전에서 Systems Manager를 사용할 수 있는지 확인합니다. Systems Manager는 본사 근처 리전에서도 사용할 수 있습니다.<br><br>회사의 EC2 인스턴스, IoT 기기 및 온프레미스 인프라에서 자동화된 패치 및 구성 관리를 구현하기 위해 DevOps 팀은 어떤 단계 조합을 취해야 합니까? (세 가지 선택)`,
  type: 'multi',
  multiCount: 3,
  choices: [
    { k:'A', en:`Apply tags to all the EC2 instances, AWS IoT Greengrass devices, and on-premises servers. Use Systems Manager Session Manager to push patches to all the tagged devices.`, ko:`모든 EC2 인스턴스, AWS IoT Greengrass 디바이스 및 온프레미스 서버에 태그를 적용합니다. Systems Manager Session Manager를 사용하여 태그가 지정된 모든 디바이스에 패치를 푸시합니다.` },
    { k:'B', en:`Use Systems Manager Run Command to schedule patching for the EC2 instances, AWS IoT Greengrass devices, and on-premises servers.`, ko:`Systems Manager Run Command를 사용하여 EC2 인스턴스, AWS IoT Greengrass 디바이스 및 온프레미스 서버에 대한 패치를 예약합니다.` },
    { k:'C', en:`Use Systems Manager Patch Manager to schedule patching for the EC2 instances, AWS IoT Greengrass devices, and on-premises servers as a Systems Manager maintenance window task.`, ko:`Systems Manager Patch Manager를 사용하여 EC2 인스턴스, AWS IoT Greengrass 디바이스 및 온프레미스 서버에 대한 패치를 Systems Manager 유지 관리 창 작업으로 예약합니다.` },
    { k:'D', en:`Configure Amazon EventBridge to monitor Systems Manager Patch Manager for updates to patch baselines. Associate Systems Manager Run Command with the event to initiate a patch action for all EC2 instances, AWS IoT Greengrass devices, and on-premises servers.`, ko:`Amazon EventBridge를 구성하여 Systems Manager Patch Manager에서 패치 기준선 업데이트를 모니터링합니다. Systems Manager Run Command를 이벤트와 연결하여 모든 EC2 인스턴스, AWS IoT Greengrass 디바이스 및 온프레미스 서버에 대한 패치 작업을 시작합니다.` },
    { k:'E', en:`Create an IAM instance profile for Systems Manager. Attach the instance profile to all the EC2 instances in the AWS account. For the AWS IoT Greengrass devices and on-premises servers, create an IAM service role for Systems Manager.`, ko:`Systems Manager에 대한 IAM 인스턴스 프로필을 만듭니다. 인스턴스 프로필을 AWS 계정의 모든 EC2 인스턴스에 연결합니다. AWS IoT Greengrass 디바이스와 온프레미스 서버의 경우 Systems Manager에 대한 IAM 서비스 역할을 만듭니다.` },
    { k:'F', en:`Generate a managed-instance activation. Use the Activation Code and Activation ID to install Systems Manager Agent (SSM Agent) on each server in the on-premises environment. Update the AWS IoT Greengrass IAM token exchange role. Use the role to deploy SSM Agent on all the IoT devices.`, ko:`관리형 인스턴스 활성화를 생성합니다. 활성화 코드와 활성화 ID를 사용하여 온프레미스 환경의 각 서버에 Systems Manager Agent(SSM Agent)를 설치합니다. AWS IoT Greengrass IAM 토큰 교환 역할을 업데이트합니다. 이 역할을 사용하여 모든 IoT 디바이스에 SSM Agent를 배포합니다.` },
  ],
  answer: ['C','E','F'],
  vote: '100% CEF',
  explain: `<p><span class="mark-ok">✅ C — Patch Manager + 유지 관리 창 작업</span></p><p>Systems Manager Patch Manager는 패치 기준선 정의 및 예약 패치 적용을 지원합니다. 유지 관리 창(Maintenance Window) 작업으로 설정하면 정해진 일정에 자동으로 패치가 적용됩니다.</p>
<p><span class="mark-ok">✅ E — EC2용 IAM 인스턴스 프로필, IoT/온프레미스용 IAM 서비스 역할</span></p><p>EC2에는 IAM 인스턴스 프로필, 비 EC2 리소스(IoT Greengrass, 온프레미스)에는 IAM 서비스 역할이 필요합니다.</p>
<p><span class="mark-ok">✅ F — 관리형 인스턴스 활성화 + SSM Agent 설치</span></p><p>온프레미스 서버에 SSM Agent를 설치하려면 관리형 인스턴스 활성화(Activation Code/ID)가 필요합니다. IoT Greengrass 디바이스에는 IAM 토큰 교환 역할을 통해 SSM Agent를 배포합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Session Manager는 대화형 셸 세션용이며, 패치 예약에 사용되지 않습니다.</p>
<p><span class="mark-no">❌ B</span> — Run Command는 일회성 명령 실행에 사용되며, C(Patch Manager + 유지 관리 창)가 패치 예약에 더 적합합니다.</p>
<p><span class="mark-no">❌ D</span> — EventBridge + Run Command로 패치 예약하는 것은 C보다 복잡하며, C에 이미 유지 관리 창이 포함됩니다.</p>`,
  disc: [{ ans:'CEF (100%)', txt:'SSM으로 이기종 환경(EC2+IoT+온프레미스) 패치 관리: EC2=인스턴스 프로필, 온프레미스=활성화 코드+SSM Agent, IoT=토큰 교환 역할. 패치 예약=Patch Manager+유지 관리 창.' }]
},
{
  n: 119,
  en: `A company is testing a web application that runs on Amazon EC2 instances behind an Application Load Balancer. The instances run in an Auto Scaling group across multiple Availability Zones. The company uses a blue/green deployment process with immutable instances when deploying new software.<br><br>During testing, users are being automatically logged out of the application at random times. Testers also report that, when a new version of the application is deployed, all users are logged out. The development team needs a solution to ensure users remain logged in across scaling events and application deployments.<br><br>What is the MOST operationally efficient way to ensure users remain logged in?`,
  ko: `한 회사가 Application Load Balancer 뒤의 Amazon EC2 인스턴스에서 실행되는 웹 애플리케이션을 테스트하고 있습니다. 인스턴스는 여러 가용성 영역에 걸쳐 Auto Scaling 그룹에서 실행됩니다. 이 회사는 새 소프트웨어를 배포할 때 변경 불가능한 인스턴스가 있는 블루/그린 배포 프로세스를 사용합니다.<br><br>테스트 중에 사용자가 무작위 시간에 애플리케이션에서 자동으로 로그아웃됩니다. 테스터는 또한 애플리케이션의 새 버전이 배포될 때 모든 사용자가 로그아웃된다고 보고합니다. 개발 팀은 확장 이벤트와 애플리케이션 배포에서 사용자가 로그인 상태를 유지하도록 하는 솔루션이 필요합니다.<br><br>사용자가 로그인 상태를 유지하도록 하는 가장 운영 효율적인 방법은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Enable smart sessions on the load balancer and modify the application to check for an existing session.`, ko:`로드 밸런서에서 스마트 세션을 활성화하고 기존 세션을 확인하도록 애플리케이션을 수정합니다.` },
    { k:'B', en:`Enable session sharing on the load balancer and modify the application to read from the session store.`, ko:`로드 밸런서에서 세션 공유를 활성화하고 세션 저장소에서 읽도록 애플리케이션을 수정합니다.` },
    { k:'C', en:`Store user session information in an Amazon S3 bucket and modify the application to read session information from the bucket.`, ko:`Amazon S3 버킷에 사용자 세션 정보를 저장하고 버킷에서 세션 정보를 읽도록 애플리케이션을 수정합니다.` },
    { k:'D', en:`Modify the application to store user session information in an Amazon ElastiCache cluster.`, ko:`Amazon ElastiCache 클러스터에 사용자 세션 정보를 저장하도록 애플리케이션을 수정합니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — Amazon ElastiCache를 세션 저장소로 사용</span></p><p>블루/그린 배포 시 인스턴스가 교체되고 스케일링 이벤트 시 인스턴스가 추가/제거되면 로컬 인스턴스에 저장된 세션이 소실됩니다. Amazon ElastiCache(Redis/Memcached)를 중앙 세션 저장소로 사용하면 어떤 인스턴스도 세션 데이터에 접근할 수 있습니다. 많은 웹 프레임워크가 Redis/Memcached 세션 저장소를 기본 지원합니다. S3(C)보다 지연 시간이 낮아 운영 효율성이 높습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — ALB에는 "스마트 세션" 기능이 없습니다. 스티키 세션(Sticky Session)은 있지만, 이는 특정 인스턴스에 세션을 고정하는 것으로 블루/그린 배포 시 여전히 로그아웃됩니다.</p>
<p><span class="mark-no">❌ B</span> — 로드 밸런서는 세션 데이터를 저장하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — S3는 높은 읽기 지연 시간과 비용으로 인해 세션 저장소로 적합하지 않습니다. ElastiCache가 더 운영 효율적입니다.</p>`,
  disc: [{ ans:'D (100%)', txt:'분산 세션 관리의 표준: 외부 캐시(ElastiCache Redis/Memcached)에 세션 저장. 인스턴스 교체(블루/그린, 스케일링)와 무관하게 세션 유지. S3는 레이턴시 문제로 세션 저장에 부적합.' }]
},
{
  n: 120,
  en: `A DevOps engineer needs to configure a blue/green deployment for an existing three-tier application. The application runs on Amazon EC2 instances and uses an Amazon RDS database. The EC2 instances run behind an Application Load Balancer (ALB) and are in an Auto Scaling group.<br><br>The DevOps engineer has created a launch template and an Auto Scaling group for the blue environment. The DevOps engineer also has created a launch template and an Auto Scaling group for the green environment. Each Auto Scaling group deploys to a matching blue or green target group. The target group also specifies which software, blue or green, gets loaded on the EC2 instances. The ALB can be configured to send traffic to the blue environment's target group or the green environment's target group. An Amazon Route 53 record for www.example.com points to the ALB.<br><br>The deployment must move traffic all at once between the software on the blue environment's EC2 instances to the newly deployed software on the green environment's EC2 instances.<br><br>What should the DevOps engineer do to meet these requirements?`,
  ko: `DevOps 엔지니어는 기존 3계층 애플리케이션에 대한 블루/그린 배포를 구성해야 합니다. 애플리케이션은 Amazon EC2 인스턴스에서 실행되고 Amazon RDS 데이터베이스를 사용합니다. EC2 인스턴스는 ALB(Application Load Balancer) 뒤에서 실행되고 Auto Scaling 그룹에 있습니다.<br><br>DevOps 엔지니어는 블루 환경에 대한 시작 템플릿과 Auto Scaling 그룹을 만들었습니다. DevOps 엔지니어는 또한 그린 환경에 대한 시작 템플릿과 Auto Scaling 그룹을 만들었습니다. 각 Auto Scaling 그룹은 일치하는 블루 또는 그린 대상 그룹에 배포됩니다. 대상 그룹은 또한 EC2 인스턴스에 로드되는 블루 또는 그린 소프트웨어를 지정합니다. ALB는 트래픽을 블루 환경의 대상 그룹 또는 그린 환경의 대상 그룹으로 보내도록 구성할 수 있습니다. www.example.com의 Amazon Route 53 레코드는 ALB를 가리킵니다.<br><br>배포는 블루 환경의 EC2 인스턴스에 있는 소프트웨어와 그린 환경의 EC2 인스턴스에 새로 배포된 소프트웨어 간에 트래픽을 한 번에 모두 이동해야 합니다.<br><br>DevOps 엔지니어는 이러한 요구 사항을 충족하기 위해 무엇을 해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Start a rolling restart of the Auto Scaling group for the green environment to deploy the new software on the green environment's EC2 instances. When the rolling restart is complete, use an AWS CLI command to update the ALB to send traffic to the green environment's target group.`, ko:`그린 환경의 Auto Scaling 그룹의 롤링 재시작을 시작하여 그린 환경의 EC2 인스턴스에 새 소프트웨어를 배포합니다. 롤링 재시작이 완료되면 AWS CLI 명령을 사용하여 ALB를 업데이트하여 그린 환경의 대상 그룹으로 트래픽을 보냅니다.` },
    { k:'B', en:`Use an AWS CLI command to update the ALB to send traffic to the green environment's target group. Then start a rolling restart of the Auto Scaling group for the green environment to deploy the new software on the green environment's EC2 instances.`, ko:`AWS CLI 명령을 사용하여 ALB를 업데이트하여 트래픽을 그린 환경의 대상 그룹으로 보냅니다. 그런 다음 그린 환경의 Auto Scaling 그룹의 롤링 재시작을 시작하여 그린 환경의 EC2 인스턴스에 새 소프트웨어를 배포합니다.` },
    { k:'C', en:`Update the launch template to deploy the green environment's software on the blue environment's EC2 instances. Keep the target groups and Auto Scaling groups unchanged in both environments. Perform a rolling restart of the blue environment's EC2 instances.`, ko:`시작 템플릿을 업데이트하여 그린 환경의 소프트웨어를 블루 환경의 EC2 인스턴스에 배포합니다. 두 환경 모두에서 대상 그룹과 Auto Scaling 그룹을 변경하지 않습니다. 블루 환경의 EC2 인스턴스를 롤링 재시작합니다.` },
    { k:'D', en:`Start a rolling restart of the Auto Scaling group for the green environment to deploy the new software on the green environment's EC2 instances. When the rolling restart is complete, update the Route 53 DNS to point to the green environment's endpoint on the ALB.`, ko:`그린 환경의 Auto Scaling 그룹의 롤링 재시작을 시작하여 그린 환경의 EC2 인스턴스에 새 소프트웨어를 배포합니다. 롤링 재시작이 완료되면 Route 53 DNS를 업데이트하여 ALB에서 그린 환경의 엔드포인트를 가리킵니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 그린 환경 롤링 재시작 후 ALB 대상 그룹 전환</span></p><p>올바른 순서: ① 그린 환경의 ASG 롤링 재시작으로 새 소프트웨어를 그린 인스턴스에 배포 → ② 새 소프트웨어 배포 완료 후 ALB의 리스너 규칙을 수정하여 트래픽을 그린 대상 그룹으로 한 번에 전환. Route 53에는 단일 ALB를 가리키는 레코드 하나만 있으므로 DNS를 변경할 필요가 없습니다. ALB 대상 그룹 전환이 DNS 변경보다 즉각적으로 트래픽을 이동할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 소프트웨어가 아직 배포되지 않은 그린 인스턴스로 먼저 트래픽을 전환하면 사용자가 이전 버전 또는 잘못된 환경으로 라우팅될 수 있습니다.</p>
<p><span class="mark-no">❌ C</span> — 블루/그린 배포의 핵심은 두 환경을 분리하여 유지하는 것입니다. 블루 환경에 그린 소프트웨어를 배포하는 것은 블루/그린 패턴이 아닙니다.</p>
<p><span class="mark-no">❌ D</span> — Route 53은 단일 ALB를 가리키고 있으며, ALB 내에서 대상 그룹 전환으로 트래픽을 제어합니다. Route 53 DNS를 변경해도 동일한 ALB를 가리키므로 효과가 없습니다. 또한 DNS 변경은 TTL 캐시로 인해 즉각적이지 않습니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'단일 ALB에 블루/그린 대상 그룹 2개. Route 53 → ALB → 대상 그룹. 트래픽 전환은 ALB 리스너 규칙 수정으로. 순서: 그린 배포 완료 후 ALB 전환. D는 잘못된 이해(ALB가 하나뿐).' }]
},
{
  n: 121,
  en: `A company is building a new pipeline by using AWS CodePipeline and AWS CodeBuild in a build account. The pipeline consists of two stages. The first stage is a CodeBuild job to build and package an AWS Lambda function. The second stage consists of deployment actions that operate on two different AWS accounts: a development environment account and a production environment account. The deployment stages use the AWS CloudFormation action that CodePipeline invokes to deploy the infrastructure that the Lambda function requires.<br><br>A DevOps engineer creates the CodePipeline pipeline and configures the pipeline to encrypt build artifacts by using the AWS Key Management Service (AWS KMS) AWS managed key for Amazon S3 (the aws/s3 key). The artifacts are stored in an S3 bucket. When the pipeline runs, the CloudFormation actions fail with an access denied error.<br><br>Which combination of actions must the DevOps engineer perform to resolve this error? (Choose two.)`,
  ko: `한 회사가 빌드 계정에서 AWS CodePipeline과 AWS CodeBuild를 사용하여 새로운 파이프라인을 빌드하고 있습니다. 파이프라인은 두 단계로 구성되어 있습니다. 첫 번째 단계는 AWS Lambda 함수를 빌드하고 패키징하는 CodeBuild 작업입니다. 두 번째 단계는 개발 환경 계정과 프로덕션 환경 계정이라는 두 개의 다른 AWS 계정에서 작동하는 배포 작업으로 구성됩니다. 배포 단계에서는 CodePipeline이 호출하는 AWS CloudFormation 작업을 사용하여 Lambda 함수에 필요한 인프라를 배포합니다.<br><br>DevOps 엔지니어가 CodePipeline 파이프라인을 만들고 Amazon S3에 대한 AWS KMS AWS 관리 키(aws/s3 키)를 사용하여 빌드 아티팩트를 암호화하도록 파이프라인을 구성합니다. 아티팩트는 S3 버킷에 저장됩니다. 파이프라인이 실행되면 CloudFormation 작업이 액세스 거부 오류와 함께 실패합니다.<br><br>DevOps 엔지니어가 이 오류를 해결하기 위해 수행해야 하는 작업 조합은 무엇입니까? (두 가지 선택)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Create an S3 bucket in each AWS account for the artifacts. Allow the pipeline to write to the S3 buckets. Create a CodePipeline S3 action to copy the artifacts to the S3 bucket in each AWS account. Update the CloudFormation actions to reference the artifacts S3 bucket in the production account.`, ko:`아티팩트에 대한 각 AWS 계정에서 S3 버킷을 만듭니다. 파이프라인이 S3 버킷에 쓸 수 있도록 합니다. CodePipeline S3 작업을 만들어 각 AWS 계정의 S3 버킷에 아티팩트를 복사합니다. CloudFormation 작업을 업데이트하여 프로덕션 계정의 아티팩트 S3 버킷을 참조합니다.` },
    { k:'B', en:`Create a customer managed KMS key. Configure the KMS key policy to allow the IAM roles used by the CloudFormation action to perform decrypt operations. Modify the pipeline to use the customer managed KMS key to encrypt artifacts.`, ko:`고객 관리 KMS 키를 만듭니다. CloudFormation 작업에서 사용하는 IAM 역할이 암호 해독 작업을 수행할 수 있도록 KMS 키 정책을 구성합니다. 고객 관리 KMS 키를 사용하여 아티팩트를 암호화하도록 파이프라인을 수정합니다.` },
    { k:'C', en:`Create an AWS managed KMS key. Configure the KMS key policy to allow the development account and the production account to perform decrypt operations. Modify the pipeline to use the KMS key to encrypt artifacts.`, ko:`AWS 관리형 KMS 키를 만듭니다. 개발 계정과 프로덕션 계정이 암호 해독 작업을 수행할 수 있도록 KMS 키 정책을 구성합니다. 파이프라인을 수정하여 KMS 키를 사용하여 아티팩트를 암호화합니다.` },
    { k:'D', en:`In the development account and in the production account, create an IAM role for CodePipeline. Configure the roles with permissions to perform CloudFormation operations and with permissions to retrieve and decrypt objects from the artifacts S3 bucket. In the CodePipeline account, configure the CodePipeline CloudFormation action to use the roles.`, ko:`개발 계정과 프로덕션 계정에서 CodePipeline에 대한 IAM 역할을 만듭니다. CloudFormation 작업을 수행할 수 있는 권한과 아티팩트 S3 버킷에서 객체를 검색하고 복호화할 수 있는 권한이 있는 역할을 구성합니다. CodePipeline 계정에서 역할을 사용하도록 CodePipeline CloudFormation 작업을 구성합니다.` },
    { k:'E', en:`In the development account and in the production account, create an IAM role for CodePipeline. Configure the roles with permissions to perform CloudFormation operations and with permissions to retrieve and decrypt objects from the artifacts S3 bucket. In the CodePipeline account, modify the artifacts S3 bucket policy to allow the roles access. Configure the CodePipeline CloudFormation action to use the roles.`, ko:`개발 계정과 프로덕션 계정에서 CodePipeline에 대한 IAM 역할을 만듭니다. CloudFormation 작업을 수행할 수 있는 권한과 아티팩트 S3 버킷에서 객체를 검색하고 복호화할 수 있는 권한이 있는 역할을 구성합니다. CodePipeline 계정에서 역할 액세스를 허용하도록 아티팩트 S3 버킷 정책을 수정합니다. 역할을 사용하도록 CodePipeline CloudFormation 작업을 구성합니다.` },
  ],
  answer: ['B','E'],
  vote: '80% BE',
  explain: `<p><span class="mark-ok">✅ B — 고객 관리 KMS 키 생성 및 교차 계정 복호화 권한 부여</span></p><p>AWS 관리 KMS 키(aws/s3)는 교차 계정 사용을 위한 키 정책 수정이 불가능합니다. 교차 계정 접근에는 반드시 고객 관리 KMS 키(CMK)를 사용해야 합니다. CMK 키 정책에 개발/프로덕션 계정의 CloudFormation 역할에 복호화 권한을 부여합니다.</p>
<p><span class="mark-ok">✅ E — 교차 계정 IAM 역할 + S3 버킷 정책 수정</span></p><p>교차 계정에서 S3 버킷에 접근할 때는 IAM 역할 권한만으로는 부족하고 S3 버킷 정책에서도 해당 역할의 접근을 명시적으로 허용해야 합니다. D는 버킷 정책 수정이 누락되어 교차 계정 접근이 실패할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 각 계정에 S3 버킷을 만드는 것은 불필요한 복잡성을 추가합니다.</p>
<p><span class="mark-no">❌ C</span> — AWS 관리형 KMS 키는 생성하거나 키 정책을 수정할 수 없습니다. 읽기 전용입니다.</p>
<p><span class="mark-no">❌ D</span> — IAM 역할 권한은 설정하지만, 교차 계정 S3 접근에 필요한 버킷 정책 수정이 누락되었습니다.</p>`,
  disc: [{ ans:'BE (80%)', txt:'핵심: AWS 관리형 KMS 키 = 수정 불가 = 교차 계정 불가. 교차 계정 CodePipeline 공식 가이드: 고객 관리 KMS 키 + S3 버킷 정책 + 교차 계정 IAM 역할 3가지 모두 필요.' }]
},
{
  n: 122,
  en: `A company is using an organization in AWS Organizations to manage multiple AWS accounts. The company's development team wants to use AWS Lambda functions to meet resiliency requirements and is rewriting all applications to work with Lambda functions that are deployed in a VPC. The development team is using Amazon Elastic File System (Amazon EFS) as shared storage in Account A in the organization.<br><br>The company wants to continue to use Amazon EFS with Lambda. Company policy requires all serverless projects to be deployed in Account B.<br><br>A DevOps engineer needs to reconfigure an existing EFS file system to allow Lambda functions to access the data through an existing EFS access point.<br><br>Which combination of steps should the DevOps engineer take to meet these requirements? (Choose three.)`,
  ko: `한 회사가 AWS Organizations의 조직을 사용하여 여러 AWS 계정을 관리하고 있습니다. 개발 팀은 복원성 요구 사항을 충족하기 위해 AWS Lambda 함수를 사용하려 하며 VPC에 배포된 Lambda 함수와 함께 작동하도록 모든 애플리케이션을 다시 작성하고 있습니다. 개발 팀은 조직의 계정 A에서 공유 스토리지로 Amazon EFS를 사용하고 있습니다.<br><br>이 회사는 Lambda와 함께 Amazon EFS를 계속 사용하려고 합니다. 회사 정책에 따라 모든 서버리스 프로젝트는 계정 B에 배포해야 합니다.<br><br>DevOps 엔지니어는 기존 EFS 파일 시스템을 재구성하여 Lambda 함수가 기존 EFS 액세스 포인트를 통해 데이터에 액세스할 수 있도록 해야 합니다.<br><br>DevOps 엔지니어는 이러한 요구 사항을 충족하기 위해 어떤 단계 조합을 취해야 합니까? (세 가지 선택)`,
  type: 'multi',
  multiCount: 3,
  choices: [
    { k:'A', en:`Update the EFS file system policy to provide Account B with access to mount and write to the EFS file system in Account A.`, ko:`EFS 파일 시스템 정책을 업데이트하여 계정 B가 계정 A의 EFS 파일 시스템을 마운트하고 쓸 수 있는 액세스 권한을 부여합니다.` },
    { k:'B', en:`Create SCPs to set permission guardrails with fine-grained control for Amazon EFS.`, ko:`Amazon EFS에 대한 세부적인 제어를 통해 권한 보호 장치를 설정하기 위해 SCP를 만듭니다.` },
    { k:'C', en:`Create a new EFS file system in Account B. Use AWS Database Migration Service (AWS DMS) to keep data from Account A and Account B synchronized.`, ko:`계정 B에 새 EFS 파일 시스템을 만듭니다. AWS Database Migration Service(AWS DMS)를 사용하여 계정 A와 계정 B의 데이터를 동기화합니다.` },
    { k:'D', en:`Update the Lambda execution roles with permission to access the VPC and the EFS file system.`, ko:`VPC 및 EFS 파일 시스템에 액세스할 수 있는 권한으로 Lambda 실행 역할을 업데이트합니다.` },
    { k:'E', en:`Create a VPC peering connection to connect Account A to Account B.`, ko:`계정 A를 계정 B에 연결하기 위해 VPC 피어링 연결을 생성합니다.` },
    { k:'F', en:`Configure the Lambda functions in Account B to assume an existing IAM role in Account A.`, ko:`계정 B에서 Lambda 함수를 구성하여 계정 A의 기존 IAM 역할을 맡습니다.` },
  ],
  answer: ['A','D','E'],
  vote: '75% ADE',
  explain: `<p><span class="mark-ok">✅ A — EFS 파일 시스템 정책 업데이트</span></p><p>계정 A의 EFS 파일 시스템 정책을 업데이트하여 계정 B가 마운트하고 쓸 수 있도록 허용합니다. 이것이 교차 계정 EFS 접근의 핵심입니다.</p>
<p><span class="mark-ok">✅ D — Lambda 실행 역할에 VPC 및 EFS 권한 추가</span></p><p>계정 B의 Lambda 실행 역할에 VPC 네트워크 인터페이스 생성 권한(<code>ec2:CreateNetworkInterface</code> 등)과 EFS 마운트 권한(<code>elasticfilesystem:ClientMount</code> 등)이 필요합니다.</p>
<p><span class="mark-ok">✅ E — VPC 피어링 연결</span></p><p>EFS는 네트워크를 통해 접근하므로, 계정 A(EFS가 있는 VPC)와 계정 B(Lambda가 있는 VPC) 간에 VPC 피어링이 필요합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — SCP는 권한을 거부하는 데 사용되며, 교차 계정 EFS 접근 설정과 무관합니다.</p>
<p><span class="mark-no">❌ C</span> — 기존 EFS 파일 시스템을 재구성하는 것이 목적이므로, 새 EFS 생성과 DMS 동기화는 불필요합니다.</p>
<p><span class="mark-no">❌ F</span> — Lambda 함수가 계정 A의 IAM 역할을 맡을 필요가 없습니다. D(Lambda 실행 역할에 직접 권한 부여)로 충분합니다.</p>`,
  disc: [{ ans:'ADE (75%) vs AEF (19%)', txt:'AWS 공식 문서: Lambda에서 교차 계정 EFS 사용 시 VPC 피어링 + EFS 파일 시스템 정책 + Lambda 실행 역할 권한(VPC+EFS)이 필요. F(역할 가정)보다 D(직접 권한)가 더 간단하고 AWS 권장 방식.' }]
},
{
  n: 123,
  en: `A media company has several thousand Amazon EC2 instances in an AWS account. The company is using Slack and a shared email inbox for team communications and important updates. A DevOps engineer needs to send all AWS-scheduled EC2 maintenance notifications to the Slack channel and the shared inbox. The solution must include the instances' Name and Owner tags.<br><br>Which solution will meet these requirements?`,
  ko: `미디어 회사가 AWS 계정에 수천 개의 Amazon EC2 인스턴스를 보유하고 있습니다. 이 회사는 Slack과 공유 이메일 받은 편지함을 사용하여 팀 커뮤니케이션과 중요한 업데이트를 진행합니다. DevOps 엔지니어는 모든 AWS 예약 EC2 유지 관리 알림을 Slack 채널과 공유 받은 편지함으로 보내야 합니다. 솔루션에는 인스턴스의 Name 및 Owner 태그가 포함되어야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Integrate AWS Trusted Advisor with AWS Config. Configure a custom AWS Config rule to invoke an AWS Lambda function to publish notifications to an Amazon Simple Notification Service (Amazon SNS) topic. Subscribe a Slack channel endpoint and the shared inbox to the topic.`, ko:`AWS Trusted Advisor를 AWS Config와 통합합니다. Amazon SNS 주제에 알림을 게시하기 위해 AWS Lambda 함수를 호출하는 사용자 지정 AWS Config 규칙을 구성합니다. Slack 채널 엔드포인트와 공유된 받은 편지함을 주제에 구독합니다.` },
    { k:'B', en:`Use Amazon EventBridge to monitor for AWS Health events. Configure the maintenance events to target an Amazon Simple Notification Service (Amazon SNS) topic. Subscribe an AWS Lambda function to the SNS topic to send notifications to the Slack channel and the shared inbox.`, ko:`Amazon EventBridge를 사용하여 AWS Health 이벤트를 모니터링합니다. 유지 관리 이벤트를 구성하여 Amazon SNS 주제를 대상으로 합니다. AWS Lambda 함수를 SNS 주제에 구독하여 Slack 채널과 공유 받은 편지함에 알림을 보냅니다.` },
    { k:'C', en:`Create an AWS Lambda function that sends EC2 maintenance notifications to the Slack channel and the shared inbox. Monitor EC2 health events by using Amazon CloudWatch metrics. Configure a CloudWatch alarm that invokes the Lambda function when a maintenance notification is received.`, ko:`Slack 채널과 공유된 받은 편지함에 EC2 유지 관리 알림을 보내는 AWS Lambda 함수를 만듭니다. Amazon CloudWatch 메트릭을 사용하여 EC2 상태 이벤트를 모니터링합니다. 유지 관리 알림을 받으면 Lambda 함수를 호출하는 CloudWatch 알람을 구성합니다.` },
    { k:'D', en:`Configure AWS Support integration with AWS CloudTrail. Create a CloudTrail lookup event to invoke an AWS Lambda function to pass EC2 maintenance notifications to Amazon Simple Notification Service (Amazon SNS). Configure Amazon SNS to target the Slack channel and the shared inbox.`, ko:`AWS CloudTrail과 AWS Support 통합을 구성합니다. CloudTrail 조회 이벤트를 생성하여 AWS Lambda 함수를 호출하여 EC2 유지 관리 알림을 Amazon SNS로 전달합니다. Amazon SNS를 구성하여 Slack 채널과 공유 받은 편지함을 타겟팅합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — EventBridge + AWS Health + SNS + Lambda</span></p><p>AWS 예약 EC2 유지 관리 이벤트는 AWS Health 서비스를 통해 발생하며 Amazon EventBridge로 캡처할 수 있습니다. AWS Health 이벤트에는 영향받는 인스턴스 정보가 포함되어 있으며, Lambda 함수가 EC2 태그(Name, Owner)를 추가로 조회하여 Slack과 이메일로 풍부한 알림을 전송할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Trusted Advisor는 EC2 예약 유지 관리 이벤트 알림과 관련이 없습니다.</p>
<p><span class="mark-no">❌ C</span> — CloudWatch 메트릭으로는 AWS Health 유지 관리 이벤트를 직접 감지할 수 없습니다.</p>
<p><span class="mark-no">❌ D</span> — AWS Support와 CloudTrail 통합으로는 EC2 유지 관리 알림을 처리할 수 없습니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'AWS 예약 유지 관리 = AWS Health 이벤트 → EventBridge로 캡처. Lambda로 EC2 태그(Name/Owner) 조회 후 Slack + 이메일로 알림 전송. 표준 AWS 패턴.' }]
},
{
  n: 124,
  en: `An AWS CodePipeline pipeline has implemented a code release process. The pipeline is integrated with AWS CodeDeploy to deploy versions of an application to multiple Amazon EC2 instances for each CodePipeline stage.<br><br>During a recent deployment, the pipeline failed due to a CodeDeploy issue. The DevOps team wants to improve monitoring and notifications during deployment to decrease resolution times.<br><br>What should the DevOps engineer do to create notifications when issues are discovered?`,
  ko: `AWS CodePipeline 파이프라인은 코드 릴리스 프로세스를 구현했습니다. 파이프라인은 AWS CodeDeploy와 통합되어 각 CodePipeline 단계에 대해 여러 Amazon EC2 인스턴스에 애플리케이션 버전을 배포합니다.<br><br>최근 배포 중에 파이프라인이 CodeDeploy 문제로 인해 실패했습니다. DevOps 팀은 배포 중 모니터링 및 알림을 개선하여 해결 시간을 단축하고자 합니다.<br><br>문제가 발견될 때 알림을 생성하기 위해 DevOps 엔지니어는 무엇을 해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Implement Amazon CloudWatch Logs for CodePipeline and CodeDeploy, create an AWS Config rule to evaluate code deployment issues, and create an Amazon Simple Notification Service (Amazon SNS) topic to notify stakeholders of deployment issues.`, ko:`CodePipeline 및 CodeDeploy에 대한 Amazon CloudWatch Logs를 구현하고, 코드 배포 문제를 평가하기 위한 AWS Config 규칙을 생성하고, 배포 문제를 이해 관계자에게 알리기 위한 Amazon SNS 주제를 생성합니다.` },
    { k:'B', en:`Implement Amazon EventBridge for CodePipeline and CodeDeploy, create an AWS Lambda function to evaluate code deployment issues, and create an Amazon Simple Notification Service (Amazon SNS) topic to notify stakeholders of deployment issues.`, ko:`CodePipeline 및 CodeDeploy에 대해 Amazon EventBridge를 구현하고, 코드 배포 문제를 평가하는 AWS Lambda 함수를 생성하고, 배포 문제를 이해 관계자에게 알리는 Amazon SNS 주제를 생성합니다.` },
    { k:'C', en:`Implement AWS CloudTrail to record CodePipeline and CodeDeploy API call information, create an AWS Lambda function to evaluate code deployment issues, and create an Amazon Simple Notification Service (Amazon SNS) topic to notify stakeholders of deployment issues.`, ko:`CodePipeline 및 CodeDeploy API 호출 정보를 기록하는 AWS CloudTrail을 구현하고, 코드 배포 문제를 평가하는 AWS Lambda 함수를 생성하고, 배포 문제를 이해 관계자에게 알리는 Amazon SNS 주제를 생성합니다.` },
    { k:'D', en:`Implement Amazon EventBridge for CodePipeline and CodeDeploy, create an Amazon Inspector assessment target to evaluate code deployment issues, and create an Amazon Simple Notification Service (Amazon SNS) topic to notify stakeholders of deployment issues.`, ko:`CodePipeline 및 CodeDeploy에 대해 Amazon EventBridge를 구현하고, 코드 배포 문제를 평가하기 위한 Amazon Inspector 평가 대상을 생성하고, 배포 문제를 이해 관계자에게 알리기 위한 Amazon SNS 주제를 생성합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — EventBridge + Lambda + SNS</span></p><p>CodePipeline과 CodeDeploy는 모두 Amazon EventBridge와 통합되어 파이프라인 상태 변경, 배포 실패 등의 이벤트를 실시간으로 발행합니다. EventBridge 규칙으로 이벤트를 캡처하고 Lambda로 분석 후 SNS로 이해 관계자에게 알림을 보내는 것이 표준 패턴입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — AWS Config는 리소스 구성 변경을 평가하는 서비스로, 배포 중 실시간 이벤트 알림에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — CloudTrail은 API 호출을 5분 지연으로 기록하므로 배포 중 실시간 모니터링에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — Amazon Inspector는 취약성 평가 서비스이며, 배포 문제 평가와 무관합니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'배포 중 실시간 모니터링 = EventBridge(근실시간 이벤트). CodePipeline/CodeDeploy 상태 변경 이벤트 → Lambda 분석 → SNS 알림이 표준 패턴.' }]
},
{
  n: 125,
  en: `A global company manages multiple AWS accounts by using AWS Control Tower. The company hosts internal applications and public applications.<br><br>Each application team in the company has its own AWS account for application hosting. The accounts are consolidated in an organization in AWS Organizations. One of the AWS Control Tower member accounts serves as a centralized DevOps account with CI/CD pipelines that application teams use to deploy applications to their respective target AWS accounts. An IAM role for deployment exists in the centralized DevOps account.<br><br>An application team is attempting to deploy its application to an Amazon Elastic Kubernetes Service (Amazon EKS) cluster in an application AWS account. An IAM role for deployment exists in the application AWS account. The deployment is through an AWS CodeBuild project that is set up in the centralized DevOps account. The CodeBuild project uses an IAM service role for CodeBuild. The deployment is failing with an Unauthorized error during attempts to connect to the cross-account EKS cluster from CodeBuild.<br><br>Which solution will resolve this error?`,
  ko: `글로벌 회사가 AWS Control Tower를 사용하여 여러 AWS 계정을 관리합니다. 이 회사는 내부 애플리케이션과 퍼블릭 애플리케이션을 호스팅합니다.<br><br>회사의 각 애플리케이션 팀은 애플리케이션 호스팅을 위한 자체 AWS 계정을 가지고 있습니다. 계정은 AWS Organizations의 조직에 통합됩니다. AWS Control Tower 멤버 계정 중 하나는 애플리케이션 팀이 해당 대상 AWS 계정에 애플리케이션을 배포하는 데 사용하는 CI/CD 파이프라인이 있는 중앙 집중식 DevOps 계정 역할을 합니다. 중앙 집중식 DevOps 계정에 배포를 위한 IAM 역할이 있습니다.<br><br>애플리케이션 팀은 애플리케이션 AWS 계정의 Amazon EKS 클러스터에 애플리케이션을 배포하려고 합니다. 애플리케이션 AWS 계정에 배포를 위한 IAM 역할이 있습니다. 배포는 중앙 집중식 DevOps 계정에 설정된 AWS CodeBuild 프로젝트를 통해 이루어집니다. CodeBuild가 교차 계정 EKS 클러스터에 연결을 시도하는 동안 배포가 권한 없음 오류로 실패합니다.<br><br>이 오류를 해결하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [

{
  n: 128,
  en: `A development team manually builds an artifact locally and then places it in an Amazon S3 bucket. The application has a local cache that must be cleared when a deployment occurs. The team runs a command to do this, downloads the artifact from Amazon S3, and unzips the artifact to complete the deployment.<br><br>A DevOps team wants to migrate to a CI/CD process and build in checks to stop and roll back the deployment when a failure occurs. This requires the team to track the progression of the deployment.<br><br>Which combination of actions will accomplish this? (Choose three.)`,
  ko: `개발 팀은 로컬에서 아티팩트를 수동으로 빌드한 다음 Amazon S3 버킷에 넣습니다. 애플리케이션에는 배포가 발생할 때 지워야 하는 로컬 캐시가 있습니다. 팀은 이를 위해 명령을 실행하고 Amazon S3에서 아티팩트를 다운로드한 다음 아티팩트의 압축을 풀어 배포를 완료합니다.<br><br>DevOps 팀은 CI/CD 프로세스로 마이그레이션하고 오류가 발생할 때 배포를 중지하고 롤백하는 검사를 빌드하려고 합니다. 이를 위해 팀은 배포 진행 상황을 추적해야 합니다.<br><br>이를 달성하는 작업 조합은 무엇입니까? (세 가지 선택)`,
  type: 'multi',
  multiCount: 3,
  choices: [

    { k:'C', en:`Create user data for each Amazon EC2 instance that contains the clear cache script. Once deployed, test the application. If it is not successful, deploy it again.`, ko:`캐시 지우기 스크립트가 포함된 각 Amazon EC2 인스턴스에 대한 사용자 데이터를 만듭니다. 배포되면 애플리케이션을 테스트합니다. 성공하지 못하면 다시 배포합니다.` },
    { k:'D', en:`Set up AWS CodePipeline to deploy the application. Allow developers to check the code into a code repository as a source for the pipeline.`, ko:`AWS CodePipeline을 설정하여 애플리케이션을 배포합니다. 개발자가 파이프라인의 소스로 코드 저장소에 코드를 체크인할 수 있도록 허용합니다.` },

  answer: ['B','D','E'],

  explain: `<p><span class="mark-ok">✅ B — AppSpec BeforeInstall 후크로 캐시 지우기</span></p><p>CodeDeploy의 AppSpec 파일에서 BeforeInstall 라이프사이클 후크에 캐시 지우기 스크립트를 지정하면 새 버전 설치 전에 자동으로 캐시가 지워집니다.</p>
<p><span class="mark-ok">✅ D — AWS CodePipeline 설정</span></p><p>CodePipeline은 배포 진행 상황 추적, 오류 시 중지, 롤백 기능을 제공합니다. 코드 저장소를 소스로 사용하여 CI/CD를 자동화합니다.</p>
<p><span class="mark-ok">✅ E — CodeBuild + CodeDeploy</span></p><p>CodeBuild로 아티팩트 빌드를 자동화하고, CodeDeploy로 EC2 인스턴스에 배포합니다. 이 조합이 CI/CD 파이프라인의 핵심입니다.</p>`,

<p><span class="mark-no">❌ C</span> — 사용자 데이터는 인스턴스 시작 시 실행되며, 배포마다 캐시를 지우는 데 적합하지 않습니다. 또한 실패 시 "다시 배포"는 자동화된 롤백이 아닙니다.</p>
<p><span class="mark-no">❌ F</span> — Systems Manager로 배포하면 CodeDeploy의 라이프사이클 후크, 배포 추적, 롤백 기능을 활용할 수 없습니다.</p>`,
  disc: [{ ans:'BDE (100%)', txt:'CI/CD 마이그레이션 = CodePipeline(D) + CodeBuild(E) + CodeDeploy(E). 캐시 지우기 = AppSpec BeforeInstall 후크(B). 배포 추적 + 실패 시 롤백은 CodePipeline+CodeDeploy가 내장 지원.' }]
