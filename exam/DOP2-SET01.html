{
  n:23,
  ko:`한 회사가 eu-west-1의 CodePipeline 파이프라인을 사용하여 Lambda 애플리케이션을 eu-west-1에 배포합니다. 파이프라인은 AWS CodeBuild 프로젝트 빌드 작업과 AWS CloudFormation 배포 작업으로 구성됩니다. 회사는 eu-west-1의 파이프라인을 사용하여 Lambda 애플리케이션을 us-east-1에도 배포하려고 합니다. DevOps 엔지니어는 이미 CodeBuild 프로젝트를 업데이트하여 us-east-1에 대한 추가 출력 아티팩트를 생성하도록 했습니다.<br><br><strong>DevOps 엔지니어가 수행해야 할 추가 단계 조합은 무엇입니까? (두 가지를 선택하세요.)</strong>`,
  en:`A company has an AWS CodePipeline pipeline that is configured with an Amazon S3 bucket in the eu-west-1 Region. The pipeline deploys an AWS Lambda application to the same Region. The pipeline consists of an AWS CodeBuild project build action and an AWS CloudFormation deploy action. The company wants to also deploy the Lambda application to the us-east-1 Region by using the pipeline in eu-west-1. A DevOps engineer has already updated the CodeBuild project to use the aws cloudformation package command to produce an additional output artifact for us-east-1. Which combination of additional steps should the DevOps engineer take to meet these requirements? (Choose two.)`,
  type:'multi',
  multiCount:2,
  choices:[
    {k:'A', ko:`Lambda 함수 코드의 zip 파일 위치에 대한 매개변수를 포함하도록 CloudFormation 템플릿을 수정합니다. 파이프라인에서 us-east-1에 대한 새 CloudFormation 배포 작업을 만듭니다. 매개변수 재정의로 us-east-1 아티팩트 위치를 전달하도록 새 배포 작업을 구성합니다.`, en:`Modify the CloudFormation template to include a parameter for the Lambda function code's zip file location. Create a new CloudFormation deploy action for us-east-1 in the pipeline. Configure the new deploy action to pass in the us-east-1 artifact location as a parameter override.`},
    {k:'B', ko:`파이프라인에서 us-east-1에 대한 새 CloudFormation 배포 작업을 만듭니다. us-east-1 출력 아티팩트의 CloudFormation 템플릿을 사용하도록 새 배포 작업을 구성합니다.`, en:`Create a new CloudFormation deploy action for us-east-1 in the pipeline. Configure the new deploy action to use the CloudFormation template from the us-east-1 output artifact.`},
    {k:'C', ko:`us-east-1에 S3 버킷을 만듭니다. CodePipeline이 읽기 및 쓰기 액세스 권한을 가질 수 있도록 S3 버킷 정책을 구성합니다.`, en:`Create an S3 bucket in us-east-1. Configure the S3 bucket policy to allow CodePipeline to have read and write access.`},
    {k:'D', ko:`us-east-1에 S3 버킷을 만듭니다. eu-west-1의 S3 버킷에서 us-east-1의 S3 버킷으로 S3 Cross-Region Replication(CRR)을 구성합니다.`, en:`Create an S3 bucket in us-east-1. Configure S3 Cross-Region Replication (CRR) from the S3 bucket in eu-west-1 to the S3 bucket in us-east-1.`},
    {k:'E', ko:`파이프라인을 수정하여 us-east-1의 S3 버킷을 아티팩트 저장소로 포함합니다. 파이프라인에서 us-east-1에 대한 새 CloudFormation 배포 작업을 만듭니다. us-east-1 출력 아티팩트의 CloudFormation 템플릿을 사용하도록 새 배포 작업을 구성합니다.`, en:`Modify the pipeline to include the S3 bucket for us-east-1 as an artifact store. Create a new CloudFormation deploy action for us-east-1 in the pipeline. Configure the new deploy action to use the CloudFormation template from the us-east-1 output artifact.`},
  ],
  answer:['C','E'],
  vote:'62% CE',
  explain:`<p><span class="mark-ok">✅ C</span>: CodePipeline이 교차 리전 작업을 수행하려면 각 배포 리전에 S3 아티팩트 버킷이 필요합니다. us-east-1에 S3 버킷을 생성하고 CodePipeline이 접근할 수 있도록 정책을 설정합니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ E</span>: 파이프라인에 us-east-1 S3 버킷을 아티팩트 저장소로 추가하고, us-east-1 출력 아티팩트의 CloudFormation 템플릿을 사용하는 새 배포 작업을 추가합니다.</p><p><a href="https://docs.aws.amazon.com/codepipeline/latest/userguide/actions-create-cross-region.html" target="_blank">📎 AWS 공식 문서</a></p>`,
  wrong:`<p><span class="mark-no">❌ D</span> — DevOps 엔지니어가 이미 us-east-1용 아티팩트를 CodeBuild에서 직접 생성하도록 설정했으므로 CRR이 불필요합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — us-east-1 S3 아티팩트 버킷 없이 배포 작업만 추가하면 동작하지 않습니다.</p>`,
  disc:[{ans:'CE (62%)',txt:'CodePipeline 교차 리전 배포: 각 리전에 아티팩트 저장소용 S3 버킷 필요. CLI/CFN 사용 시 직접 버킷 생성 필요. — AWS Docs'}]
},
{
  n:24,
  ko:`한 회사가 Amazon EC2 인스턴스 하나에서 애플리케이션을 실행합니다. 애플리케이션 메타데이터는 Amazon S3에 저장되며 인스턴스가 재시작되면 검색해야 합니다. 인스턴스가 응답하지 않으면 인스턴스가 자동으로 재시작되거나 다시 시작되어야 합니다.<br><br><strong>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?</strong>`,
  en:`A company runs an application on one Amazon EC2 instance. Application metadata is stored in Amazon S3 and must be retrieved if the instance is restarted. The instance must restart or relaunch automatically if the instance becomes unresponsive. Which solution will meet these requirements?`,
  type:'single',
  choices:[
    {k:'A', ko:`StatusCheckFailed 메트릭에 대한 Amazon CloudWatch 알람을 만듭니다. 복구 작업을 사용하여 인스턴스를 중지하고 시작합니다. S3 이벤트 알림을 사용하여 인스턴스가 다시 작동하고 실행될 때 메타데이터를 인스턴스에 푸시합니다.`, en:`Create an Amazon CloudWatch alarm for the StatusCheckFailed metric. Use the recover action to stop and start the instance. Use an S3 event notification to push the metadata to the instance when the instance is back up and running.`},
    {k:'B', ko:`AWS OpsWorks를 구성하고 자동 복구 기능을 사용하여 인스턴스를 중지하고 시작합니다. OpsWorks의 라이프사이클 이벤트를 사용하여 Amazon S3에서 메타데이터를 가져와 인스턴스에 업데이트합니다.`, en:`Configure AWS OpsWorks, and use the auto healing feature to stop and start the instance. Use a lifecycle event in OpsWorks to pull the metadata from Amazon S3 and update it on the instance.`},
    {k:'C', ko:`EC2 자동 복구를 사용하여 장애 발생 시 인스턴스를 자동으로 중지하고 시작합니다. S3 이벤트 알림을 사용하여 인스턴스가 다시 작동하고 실행 중일 때 메타데이터를 인스턴스에 푸시합니다.`, en:`Use EC2 Auto Recovery to automatically stop and start the instance in case of a failure. Use an S3 event notification to push the metadata to the instance when the instance is back up and running.`},
    {k:'D', ko:`AWS CloudFormation을 사용하여 EC2 리소스에 대한 UserData 속성을 포함하는 EC2 인스턴스를 만듭니다. UserData에 명령을 추가하여 Amazon S3에서 애플리케이션 메타데이터를 검색합니다.`, en:`Use AWS CloudFormation to create an EC2 instance that includes the UserData property for the EC2 resource. Add a command in UserData to retrieve the application metadata from Amazon S3.`},
  ],
  answer:['B'],
  vote:'97% B',
  explain:`<p><span class="mark-ok">✅ B — AWS OpsWorks Auto Healing + 라이프사이클 이벤트</span></p><p>A와 C의 EC2 복구(recover)는 시스템 상태 검사 실패(하드웨어 이슈)에만 대응하며, 인스턴스 내부 문제(OS 레벨)에는 반응하지 않습니다. OpsWorks의 Auto Healing은 시스템·인스턴스 상태 검사 모두에 대응합니다. 또한 복구 후 Configure 라이프사이클 이벤트를 통해 S3에서 메타데이터를 자동으로 가져옵니다.</p><p><a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-IMDS-existing-instances.html" target="_blank">📎 AWS 공식 문서</a></p>`,
  wrong:`<p><span class="mark-no">❌ A, C</span> — S3 이벤트 알림은 S3 객체가 변경될 때 발생합니다. 인스턴스 재시작 자체가 S3 알림을 트리거하지 않습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — UserData는 최초 시작 시에만 실행되며 자동 재시작 기능을 제공하지 않습니다.</p>`,
  disc:[{ans:'B (97%)',txt:'A와 C가 매력적으로 보이지만 S3 이벤트 알림은 S3 객체 변경 시에만 발생합니다. 인스턴스 재시작 이벤트는 S3 알림을 트리거하지 않습니다.'}]
},
{
  n:25,
  ko:`한 회사가 여러 AWS 계정을 가지고 있습니다. AWS IAM Identity Center(AWS Single Sign-On)가 AWS Toolkit for Microsoft Azure DevOps와 통합되어 사용됩니다. 액세스 제어를 위한 속성 기능이 IAM Identity Center에서 활성화됩니다. 속성 매핑에는 department 키가 <code>\${path:enterprise.department}</code>에 매핑되어 있습니다. 모든 기존 Amazon EC2 인스턴스에는 department 태그(d1, d2, d3)가 있습니다. DevOps 엔지니어는 일치하는 속성을 기반으로 정책을 만들어야 합니다. 정책은 관리 작업을 최소화해야 하며 각 Azure AD 사용자에게 사용자의 해당 부서 이름으로 태그가 지정된 EC2 인스턴스에만 액세스 권한을 부여해야 합니다.<br><br><strong>DevOps 엔지니어는 사용자 지정 권한 정책에 어떤 조건 키를 포함해야 합니까?</strong>`,
  en:`A company has multiple AWS accounts. The company uses AWS IAM Identity Center (AWS Single Sign-On) that is integrated with AWS Toolkit for Microsoft Azure DevOps. The attributes for access control feature is enabled in IAM Identity Center. The attribute mapping list contains an entry where the department key is mapped to \${path:enterprise.department}. All existing Amazon EC2 instances have a department tag that corresponds to three company departments (d1, d2, d3). A DevOps engineer must create policies based on the matching attributes. The policies must minimize administrative effort and must grant each Azure AD user access to only the EC2 instances that are tagged with the user's respective department name. Which condition key should the DevOps engineer include in the custom permissions policies to meet these requirements?`,
  type:'single',
  choices:[
    {k:'A', ko:`<pre style="background:var(--surface2);padding:10px;border-radius:6px;font-size:12px;">"Condition": {
  "ForAllValues:StringEquals": {
    "aws:TagKeys": ["department"]
  }
}</pre>`, en:`Condition using ForAllValues:StringEquals on aws:TagKeys: ["department"]`},
    {k:'B', ko:`<pre style="background:var(--surface2);padding:10px;border-radius:6px;font-size:12px;">"Condition": {
  "StringEquals": {
    "aws:PrincipalTag/department":
      "\${aws:ResourceTag/department}"
  }
}</pre>`, en:`Condition using StringEquals: aws:PrincipalTag/department equals aws:ResourceTag/department`},
    {k:'C', ko:`<pre style="background:var(--surface2);padding:10px;border-radius:6px;font-size:12px;">"Condition": {
  "StringEquals": {
    "ec2:ResourceTag/department":
      "\${aws:PrincipalTag/department}"
  }
}</pre>`, en:`Condition using StringEquals: ec2:ResourceTag/department equals aws:PrincipalTag/department`},
    {k:'D', ko:`<pre style="background:var(--surface2);padding:10px;border-radius:6px;font-size:12px;">"Condition": {
  "ForAllValues:StringEquals": {
    "ec2:ResourceTag/department":
      ["d1", "d2", "d3"]
  }
}</pre>`, en:`Condition using ForAllValues:StringEquals: ec2:ResourceTag/department equals ["d1", "d2", "d3"]`},
  ],
  answer:['C'],
  vote:'100% C',
  explain:`<p><span class="mark-ok">✅ C — ec2:ResourceTag/department = aws:PrincipalTag/department</span></p><p>이것이 ABAC(Attribute-Based Access Control) 패턴입니다. <code>ec2:ResourceTag/department</code>는 EC2 리소스의 department 태그 값이고, <code>\${aws:PrincipalTag/department}</code>는 현재 사용자의 department 속성 값입니다. 이 두 값이 일치할 때만 접근을 허용하므로, 단일 정책으로 모든 부서 사용자를 관리할 수 있어 관리 오버헤드가 최소화됩니다.</p><p><a href="https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetsconcept.html" target="_blank">📎 AWS 공식 문서</a></p>`,
  wrong:`<p><span class="mark-no">❌ D</span> — 부서 값을 하드코딩하면 새 부서가 추가될 때마다 정책을 수정해야 합니다.</p>`,
  disc:[{ans:'C (100%)',txt:'ABAC 패턴: 사용자 속성(PrincipalTag)과 리소스 태그(ResourceTag)를 매칭. EC2 리소스에는 ec2:ResourceTag를 사용합니다.'}]
},
{
  n:26,
  ko:`한 회사가 AWS 계정에서 보안 감사 애플리케이션을 호스팅합니다. 감사 애플리케이션은 IAM 역할을 사용하여 다른 AWS 계정에 액세스합니다. 모든 계정은 AWS Organizations에서 동일한 조직에 있습니다. 최근 보안 감사에서 감사된 AWS 계정의 사용자가 감사 애플리케이션의 IAM 역할을 수정하거나 삭제할 수 있음이 밝혀졌습니다. 이 회사는 신뢰할 수 있는 관리자 IAM 역할이 아닌 다른 엔터티가 감사 애플리케이션의 IAM 역할을 수정하는 것을 방지해야 합니다.<br><br><strong>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?</strong>`,
  en:`A company hosts a security auditing application in an AWS account. The auditing application uses an IAM role to access other AWS accounts. All the accounts are in the same organization in AWS Organizations. A recent security audit revealed that users in the audited AWS accounts could modify or delete the auditing application's IAM role. The company needs to prevent any modification to the auditing application's IAM role by any entity other than a trusted administrator IAM role. Which solution will meet these requirements?`,
  type:'single',
  choices:[
    {k:'A', ko:`감사 애플리케이션의 IAM 역할에 대한 변경에 대한 Deny 문이 포함된 SCP를 만듭니다. 신뢰할 수 있는 관리자 IAM 역할이 변경을 수행할 수 있도록 허용하는 조건을 포함합니다. SCP를 조직의 루트에 연결합니다.`, en:`Create an SCP that includes a Deny statement for changes to the auditing application's IAM role. Include a condition that allows the trusted administrator IAM role to make changes. Attach the SCP to the root of the organization.`},
    {k:'B', ko:`신뢰할 수 있는 관리자 IAM 역할에 의한 감사 애플리케이션의 IAM 역할 변경에 대한 허용 명령문을 포함하는 SCP를 만듭니다. 다른 모든 IAM 주체에 의한 변경에 대한 거부 명령문을 포함합니다. 감사 애플리케이션에 IAM 역할이 있는 각 AWS 계정의 IAM 서비스에 SCP를 연결합니다.`, en:`Create an SCP that includes an Allow statement for changes to the auditing application's IAM role by the trusted administrator IAM role. Include a Deny statement for changes by all other IAM principals. Attach the SCP to the IAM service in each AWS account where the auditing application has an IAM role.`},
    {k:'C', ko:`감사 애플리케이션의 IAM 역할에 대한 변경에 대한 Deny 문을 포함하는 IAM 권한 경계를 만듭니다. 신뢰할 수 있는 관리자 IAM 역할이 변경을 수행할 수 있도록 허용하는 조건을 포함합니다. 감사된 AWS 계정에 권한 경계를 연결합니다.`, en:`Create an IAM permissions boundary that includes a Deny statement for changes to the auditing application's IAM role. Include a condition that allows the trusted administrator IAM role to make changes. Attach the permissions boundary to the audited AWS accounts.`},
    {k:'D', ko:`감사 애플리케이션의 IAM 역할에 대한 변경에 대한 Deny 문을 포함하는 IAM 권한 경계를 만듭니다. 신뢰할 수 있는 관리자 IAM 역할이 변경을 수행할 수 있도록 허용하는 조건을 포함합니다. AWS 계정에서 감사 애플리케이션의 IAM 역할에 권한 경계를 연결합니다.`, en:`Create an IAM permissions boundary that includes a Deny statement for changes to the auditing application's IAM role. Include a condition that allows the trusted administrator IAM role to make changes. Attach the permissions boundary to the auditing application's IAM role in the AWS accounts.`},
  ],
  answer:['A'],
  vote:'89% A',
  explain:`<p><span class="mark-ok">✅ A — SCP(서비스 제어 정책) + 조건부 Deny</span></p><p>AWS Organizations의 SCP를 조직 루트에 연결하면 모든 멤버 계정에 일괄 적용됩니다. SCP에 Deny 문과 함께 신뢰할 수 있는 관리자일 때는 허용하는 조건을 추가하면, 단일 정책으로 조직 전체의 역할 보호가 가능합니다.</p><p><a href="https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_cross-account-with-roles.html" target="_blank">📎 AWS 공식 문서</a></p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — SCP는 Allow 문을 지원하지 않습니다. 또한 SCP를 IAM 서비스에 직접 연결할 수 없습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C, D</span> — IAM 권한 경계는 계정이 아닌 IAM 엔터티(사용자/역할)에 적용됩니다.</p>`,
  disc:[{ans:'A (89%)',txt:'SCP 조건부 Deny 패턴: Deny + 조건(aws:PrincipalArn이 관리자 역할이 아닐 때). 조직 루트 연결로 모든 멤버 계정에 적용됩니다.'}]
},
{
  n:27,
  ko:`한 회사에 Go로 작성된 온프레미스 애플리케이션이 있습니다. DevOps 엔지니어는 애플리케이션을 AWS로 옮겨야 합니다. 회사의 개발팀은 블루/그린 배포를 활성화하고 A/B 테스트를 수행하려고 합니다.<br><br><strong>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?</strong>`,
  en:`A company has an on-premises application that is written in Go. A DevOps engineer must move the application to AWS. The company's development team wants to enable blue/green deployments and perform A/B testing. Which solution will meet these requirements?`,
  type:'single',
  choices:[
    {k:'A', ko:`Amazon EC2 인스턴스에 애플리케이션을 배포하고 인스턴스의 AMI를 만듭니다. AMI를 사용하여 Auto Scaling 그룹에서 사용되는 자동 스케일링 시작 구성을 만듭니다. Elastic Load Balancing을 사용하여 트래픽을 분산합니다. 애플리케이션에 변경 사항이 있으면 새 AMI가 생성되어 EC2 인스턴스 새로 고침이 시작됩니다.`, en:`Deploy the application on an Amazon EC2 instance, and create an AMI of the instance. Use the AMI to create an automatic scaling launch configuration that is used in an Auto Scaling group. Use Elastic Load Balancing to distribute traffic. When changes are made to the application, a new AMI will be created, which will initiate an EC2 instance refresh.`},
    {k:'B', ko:`Amazon Lightsail을 사용하여 애플리케이션을 배포합니다. 애플리케이션을 Amazon S3 버킷에 압축 형식으로 저장합니다. 이 압축 버전을 사용하여 애플리케이션의 새 버전을 Lightsail에 배포합니다. Lightsail 배포 옵션을 사용하여 배포를 관리합니다.`, en:`Use Amazon Lightsail to deploy the application. Store the application in a zipped format in an Amazon S3 bucket. Use this zipped version to deploy new versions of the application to Lightsail. Use Lightsail deployment options to manage the deployment.`},
    {k:'C', ko:`AWS CodeArtifact를 사용하여 애플리케이션 코드를 저장합니다. AWS CodeDeploy를 사용하여 Amazon EC2 인스턴스 플릿에 애플리케이션을 배포합니다. Elastic Load Balancing을 사용하여 트래픽을 EC2 인스턴스에 분산합니다. 애플리케이션을 변경할 때 CodeArtifact에 새 버전을 업로드하고 새 CodeDeploy 배포를 만듭니다.`, en:`Use AWS CodeArtifact to store the application code. Use AWS CodeDeploy to deploy the application to a fleet of Amazon EC2 instances. Use Elastic Load Balancing to distribute the traffic to the EC2 instances. When making changes to the application, upload a new version to CodeArtifact and create a new CodeDeploy deployment.`},
    {k:'D', ko:`AWS Elastic Beanstalk를 사용하여 애플리케이션을 호스팅합니다. Amazon S3에 애플리케이션의 압축 버전을 저장합니다. 해당 위치를 사용하여 애플리케이션의 새 버전을 배포합니다. Elastic Beanstalk를 사용하여 배포 옵션을 관리합니다.`, en:`Use AWS Elastic Beanstalk to host the application. Store a zipped version of the application in Amazon S3. Use that location to deploy new versions of the application. Use Elastic Beanstalk to manage the deployment options.`},
  ],
  answer:['D'],
  vote:'100% D',
  explain:`<p><span class="mark-ok">✅ D — AWS Elastic Beanstalk</span></p><p>Elastic Beanstalk는 Go를 포함한 다양한 언어를 지원하며, 블루/그린 배포와 A/B 테스트를 기본 제공합니다. 환경 교체(Environment swap)로 블루/그린 전환이 가능하고, 트래픽 분할로 A/B 테스트를 수행할 수 있습니다.</p><p><a href="https://docs.aws.amazon.com/codebuild/latest/userguide/build-env-ref.html" target="_blank">📎 AWS 공식 문서</a></p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — Lightsail은 블루/그린 배포나 A/B 테스트를 기본 제공하지 않습니다.</p>`,
  disc:[{ans:'D (100%)',txt:'Elastic Beanstalk 지원 플랫폼: Go, Java, .NET, Node.js, Python, PHP, Ruby, Docker 등. 배포 정책: All at once, Rolling, Immutable, Blue/Green.'}]
},
{
  n:28,
  ko:`개발자는 50대의 Amazon EC2 Linux 서버를 유지 관리하고 있습니다. 이 서버는 Amazon EC2 Auto Scaling 그룹의 일부이며, 부하 분산을 위해 Elastic Load Balancing도 사용합니다. 가끔 일부 애플리케이션 서버가 ELB HTTP 상태 검사에 실패한 후 종료됩니다. 개발자는 이 문제에 대한 근본 원인 분석을 수행하고 싶지만 애플리케이션 로그에 액세스하기 전에 서버가 종료됩니다.<br><br><strong>로그 수집을 어떻게 자동화할 수 있습니까?</strong>`,
  en:`A developer is maintaining a fleet of 50 Amazon EC2 Linux servers. The servers are part of an Amazon EC2 Auto Scaling group, and also use Elastic Load Balancing for load balancing. Occasionally, some application servers are being terminated after failing ELB HTTP health checks. The developer would like to perform a root cause analysis on the issue, but before being able to access application logs, the server is terminated. How can log collection be automated?`,
  type:'single',
  choices:[
    {k:'A', ko:`Auto Scaling 라이프사이클 후크를 사용하여 인스턴스를 Pending:Wait 상태로 만듭니다. EC2 인스턴스 종료 성공에 대한 Amazon CloudWatch 알람을 만들고 SSM Run Command 스크립트를 호출하여 로그를 수집하고 Amazon S3에 푸시하고 로그가 수집되면 라이프사이클 작업을 완료하는 AWS Lambda 함수를 트리거합니다.`, en:`Use Auto Scaling lifecycle hooks to put instances in a Pending:Wait state. Create an Amazon CloudWatch alarm for EC2 Instance Terminate Successful and trigger an AWS Lambda function that invokes an SSM Run Command script to collect logs, push them to Amazon S3, and complete the lifecycle action once logs are collected.`},
    {k:'B', ko:`Auto Scaling 라이프사이클 후크를 사용하여 인스턴스를 Terminating:Wait 상태로 만듭니다. EC2 Instance-terminate 라이프사이클 액션에 대한 AWS Config 규칙을 만들고 로그를 수집하고 Amazon S3에 푸시하고 로그가 수집되면 라이프사이클 액션을 완료하는 스크립트를 호출하는 단계 함수를 트리거합니다.`, en:`Use Auto Scaling lifecycle hooks to put instances in a Terminating:Wait state. Create an AWS Config rule for EC2 Instance-terminate Lifecycle Action and trigger a step function that invokes a script to collect logs, push them to Amazon S3, and complete the lifecycle action once logs are collected.`},
    {k:'C', ko:`Auto Scaling 라이프사이클 후크를 사용하여 인스턴스를 Terminating:Wait 상태로 만듭니다. EC2 Instance Terminate Successful에 대한 Amazon CloudWatch 구독 필터를 만들고 로그를 수집하고 Amazon S3에 푸시하고 로그가 수집되면 라이프사이클 작업을 완료하는 스크립트를 호출하는 CloudWatch 에이전트를 트리거합니다.`, en:`Use Auto Scaling lifecycle hooks to put instances in a Terminating:Wait state. Create an Amazon CloudWatch subscription filter for EC2 Instance Terminate Successful and trigger a CloudWatch agent that invokes a script to collect logs, push them to Amazon S3, and complete the lifecycle action once logs are collected.`},
    {k:'D', ko:`Auto Scaling 라이프사이클 후크를 사용하여 인스턴스를 Terminating:Wait 상태로 만듭니다. EC2 Instance-terminate 라이프사이클 액션에 대한 Amazon EventBridge 규칙을 만들고 SSM Run Command 스크립트를 호출하여 로그를 수집하고 Amazon S3에 푸시하고 로그가 수집되면 라이프사이클 액션을 완료하는 AWS Lambda 함수를 트리거합니다.`, en:`Use Auto Scaling lifecycle hooks to put instances in a Terminating:Wait state. Create an Amazon EventBridge rule for EC2 Instance-terminate Lifecycle Action and trigger an AWS Lambda function that invokes an SSM Run Command script to collect logs, push them to Amazon S3, and complete the lifecycle action once logs are collected.`},
  ],
  answer:['D'],
  vote:'86% D',
  explain:`<p><span class="mark-ok">✅ D — Terminating:Wait + EventBridge + Lambda + SSM Run Command</span></p><p>스케일-인 이벤트 시 라이프사이클 후크가 인스턴스를 <code>Terminating:Wait</code> 상태로 일시 중지합니다. EventBridge 규칙이 이 이벤트를 감지하여 Lambda를 호출하고, Lambda는 SSM Run Command로 인스턴스에서 로그를 수집하여 S3에 저장한 후 라이프사이클 작업을 완료합니다.</p><p><a href="https://docs.aws.amazon.com/systems-manager/latest/userguide/send-commands-multiple.html" target="_blank">📎 AWS 공식 문서</a></p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — <code>Pending:Wait</code>는 인스턴스가 시작될 때의 상태이며, 종료 시에는 <code>Terminating:Wait</code>를 사용해야 합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — CloudWatch 에이전트는 스크립트를 직접 실행하는 기능이 없습니다.</p>`,
  disc:[{ans:'D (86%)',txt:'"스케일-인 이벤트가 발생하면 라이프사이클 후크가 인스턴스를 일시 중지하고 EventBridge로 알림을 보냅니다." — AWS Blog'}]
},
{
  n:29,
  ko:`회사에 AWS Organizations에 조직이 있습니다. 조직에는 엔터프라이즈 애플리케이션이 포함된 워크로드 계정이 포함됩니다. 회사는 운영 계정에서 사용자를 중앙에서 관리합니다. 워크로드 계정에서 사용자를 만들 수 없습니다. 회사는 최근에 운영 팀을 추가했으며 운영 팀 구성원에게 각 워크로드 계정에 대한 관리자 액세스 권한을 제공해야 합니다.<br><br><strong>이 액세스를 제공하는 작업 조합은 무엇입니까? (세 가지를 선택하세요.)</strong>`,
  en:`A company has an organization in AWS Organizations. The organization includes workload accounts that contain enterprise applications. The company centrally manages users from an operations account. No users can be created in the workload accounts. The company recently added an operations team and must provide the operations team members with administrator access to each workload account. Which combination of actions will provide this access? (Choose three.)`,
  type:'multi',
  multiCount:3,
  choices:[
    {k:'A', ko:`운영 계정에서 SysAdmin 역할을 만듭니다. AdministratorAccess 정책을 역할에 연결합니다. 신뢰 관계를 수정하여 워크로드 계정에서 sts:AssumeRole 작업을 허용합니다.`, en:`Create a SysAdmin role in the operations account. Attach the AdministratorAccess policy to the role. Modify the trust relationship to allow the sts:AssumeRole action from the workload accounts.`},
    {k:'B', ko:`각 워크로드 계정에서 SysAdmin 역할을 만듭니다. AdministratorAccess 정책을 역할에 연결합니다. 운영 계정에서 sts:AssumeRole 작업을 허용하도록 신뢰 관계를 수정합니다.`, en:`Create a SysAdmin role in each workload account. Attach the AdministratorAccess policy to the role. Modify the trust relationship to allow the sts:AssumeRole action from the operations account.`},
    {k:'C', ko:`운영 계정에서 Amazon Cognito ID 풀을 만듭니다. SysAdmin 역할을 인증된 역할로 연결합니다.`, en:`Create an Amazon Cognito identity pool in the operations account. Attach the SysAdmin role as an authenticated role.`},
    {k:'D', ko:`운영 계정에서 각 운영 팀 구성원에 대한 IAM 사용자를 만듭니다.`, en:`In the operations account, create an IAM user for each operations team member.`},
    {k:'E', ko:`운영 계정에서 SysAdmins라는 이름의 IAM 사용자 그룹을 만듭니다. 각 워크로드 계정에서 SysAdmin 역할에 대한 sts:AssumeRole 작업을 허용하는 IAM 정책을 추가합니다. 모든 운영 팀 구성원을 그룹에 추가합니다.`, en:`In the operations account, create an IAM user group that is named SysAdmins. Add an IAM policy that allows the sts:AssumeRole action for the SysAdmin role in each workload account. Add all operations team members to the group.`},
    {k:'F', ko:`운영 계정에서 Amazon Cognito 사용자 풀을 만듭니다. 각 운영 팀원에 대해 Amazon Cognito 사용자를 만듭니다.`, en:`Create an Amazon Cognito user pool in the operations account. Create an Amazon Cognito user for each operations team member.`},
  ],
  answer:['B','D','E'],

{
  n:30,
  ko:`한 회사가 AWS Organizations의 조직에 여러 계정을 가지고 있습니다. 조직의 계정이 Amazon S3 버킷에서 Block Public Access 기능을 끄면 회사의 SecOps 팀은 Amazon Simple Notification Service(Amazon SNS) 알림을 받아야 합니다. DevOps 엔지니어는 AWS 계정의 운영에 영향을 미치지 않고 이 변경 사항을 구현해야 합니다. 구현은 조직의 개별 멤버 계정이 알림을 끌 수 없도록 해야 합니다.<br><br><strong>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?</strong>`,
  en:`A company has multiple accounts in an organization in AWS Organizations. The company's SecOps team needs to receive an Amazon Simple Notification Service (Amazon SNS) notification if any account in the organization turns off the Block Public Access feature on an Amazon S3 bucket. A DevOps engineer must implement this change without affecting the operation of any AWS accounts. The implementation must ensure that individual member accounts in the organization cannot turn off the notification. Which solution will meet these requirements?`,
  type:'single',
  choices:[
    {k:'A', ko:`위임된 Amazon GuardDuty 관리자 계정이 될 계정을 지정합니다. 조직 전체의 모든 계정에 대해 GuardDuty를 켭니다. GuardDuty 관리자 계정에서 SNS 토픽을 만듭니다. SecOps 팀의 이메일 주소를 SNS 토픽에 구독합니다. 동일한 계정에서 GuardDuty 결과에 대한 이벤트 패턴과 SNS 토픽의 대상을 사용하는 Amazon EventBridge 규칙을 만듭니다.`, en:`Designate an account to be the delegated Amazon GuardDuty administrator account. Turn on GuardDuty for all accounts across the organization. In the GuardDuty administrator account, create an SNS topic. Subscribe the SecOps team's email address to the SNS topic. In the same account, create an Amazon EventBridge rule that uses an event pattern for GuardDuty findings and a target of the SNS topic.`},
    {k:'B', ko:`SNS 토픽을 만들고 SecOps 팀의 이메일 주소를 SNS 토픽에 구독하는 AWS CloudFormation 템플릿을 만듭니다. 템플릿에 s3:PutBucketPublicAccessBlock에 대한 CloudTrail 활동의 이벤트 패턴과 SNS 토픽의 대상을 사용하는 Amazon EventBridge 규칙을 포함합니다. CloudFormation StackSets를 사용하여 조직의 모든 계정에 스택을 배포합니다.`, en:`Create an AWS CloudFormation template that creates an SNS topic and subscribes the SecOps team's email address to the SNS topic. In the template, include an Amazon EventBridge rule that uses an event pattern of CloudTrail activity for s3:PutBucketPublicAccessBlock and a target of the SNS topic. Deploy the stack to every account in the organization by using CloudFormation StackSets.`},
    {k:'C', ko:`조직 전체에서 AWS Config를 켭니다. 위임된 관리자 계정에서 SNS 토픽을 만듭니다. SecOps 팀의 이메일 주소를 SNS 토픽에 구독합니다. 각 계정에서 s3-bucket-level-public-access-prohibited AWS Config 관리 규칙을 사용하고 AWS Systems Manager 문서를 사용하여 SecOps 팀에 알리기 위해 SNS 토픽에 이벤트를 게시하는 적합성 팩을 배포합니다.`, en:`Turn on AWS Config across the organization. In the delegated administrator account, create an SNS topic. Subscribe the SecOps team's email address to the SNS topic. Deploy a conformance pack that uses the s3-bucket-level-public-access-prohibited AWS Config managed rule in each account and uses an AWS Systems Manager document to publish an event to the SNS topic to notify the SecOps team.`},
    {k:'D', ko:`조직 전체에서 Amazon Inspector를 켭니다. Amazon Inspector 위임 관리자 계정에서 SNS 토픽을 만듭니다. SecOps 팀의 이메일 주소를 SNS 토픽에 구독합니다. 같은 계정에서 S3 버킷의 퍼블릭 네트워크 노출에 대한 이벤트 패턴을 사용하고 SecOps 팀에 알리기 위해 SNS 토픽에 이벤트를 게시하는 Amazon EventBridge 규칙을 만듭니다.`, en:`Turn on Amazon Inspector across the organization. In the Amazon Inspector delegated administrator account, create an SNS topic. Subscribe the SecOps team's email address to the SNS topic. In the same account, create an Amazon EventBridge rule that uses an event pattern for public network exposure of the S3 bucket and publishes an event to the SNS topic to notify the SecOps team.`},
  ],
  answer:['C'],
  vote:'69% C (25% A)',
  explain:`<p><span class="mark-ok">✅ C — AWS Config 적합성 팩 + SSM Automation</span></p><p>AWS Config 적합성 팩을 사용하면 조직 전체에 Config 규칙을 중앙에서 배포할 수 있으며, 위임된 관리자를 통해 멤버 계정이 규칙을 비활성화할 수 없습니다. SSM Automation 런북으로 SNS 알림을 전송합니다.</p><p><a href="https://docs.aws.amazon.com/config/latest/developerguide/conformance-packs.html" target="_blank">📎 AWS 공식 문서</a></p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — StackSets로 배포하면 각 계정에서 관리자 권한을 가진 사용자가 EventBridge 규칙을 비활성화하여 알림을 끌 수 있습니다.</p>`,
  disc:[{ans:'C (69%)',txt:'AWS Config 적합성 팩은 조직 전체에 중앙에서 배포되며 멤버 계정이 수정할 수 없습니다.'}]
},
{
  n:31,
  ko:`한 회사가 컨테이너 기반 애플리케이션을 Amazon EKS로 마이그레이션했고 자동화된 이메일 알림을 설정하려고 합니다. 각 이메일 주소로 전송된 알림은 EKS 구성 요소와 관련된 특정 활동을 위한 것입니다. 이 솔루션에는 Amazon SNS 토픽과 들어오는 로그 이벤트를 평가하고 올바른 SNS 토픽에 메시지를 게시하는 AWS Lambda 함수가 포함됩니다.<br><br><strong>어떤 로깅 솔루션이 이러한 요구 사항을 지원할까요?</strong>`,
  en:`A company has migrated its container-based applications to Amazon EKS and want to establish automated email notifications. The notifications sent to each email address are for specific activities related to EKS components. The solution will include Amazon SNS topics and an AWS Lambda function to evaluate incoming log events and publish messages to the correct SNS topic. Which logging solution will support these requirements?`,
  type:'single',
  choices:[
    {k:'A', ko:`Amazon CloudWatch Logs를 활성화하여 EKS 구성 요소를 로깅합니다. Lambda를 구독 피드 대상으로 하여 각 구성 요소에 대한 CloudWatch 구독 필터를 만듭니다.`, en:`Enable Amazon CloudWatch Logs to log the EKS components. Create a CloudWatch subscription filter for each component with Lambda as the subscription feed destination.`},
    {k:'B', ko:`Amazon CloudWatch Logs를 활성화하여 EKS 구성 요소를 로깅합니다. Lambda를 호출하는 Amazon EventBridge 이벤트에 연결된 CloudWatch Logs Insights 쿼리를 만듭니다.`, en:`Enable Amazon CloudWatch Logs to log the EKS components. Create CloudWatch Logs Insights queries linked to Amazon EventBridge events that invoke Lambda.`},
    {k:'C', ko:`EKS 구성 요소에 대한 Amazon S3 로깅을 활성화합니다. Lambda를 구독 피드 대상으로 하여 각 구성 요소에 대한 Amazon CloudWatch 구독 필터를 구성합니다.`, en:`Enable Amazon S3 logging for the EKS components. Configure an Amazon CloudWatch subscription filter for each component with Lambda as the subscription feed destination.`},
    {k:'D', ko:`EKS 구성 요소에 대한 Amazon S3 로깅을 활성화합니다. AWS Lambda를 대상으로 S3 PUT Object 이벤트 알림을 구성합니다.`, en:`Enable Amazon S3 logging for the EKS components. Configure S3 PUT Object event notifications with AWS Lambda as the destination.`},
  ],
  answer:['A'],
  vote:'97% A',
  explain:`<p><span class="mark-ok">✅ A — CloudWatch Logs + 구독 필터 → Lambda</span></p><p>Amazon EKS는 CloudWatch Logs와 통합되어 클러스터 컴포넌트 로그를 수집합니다. CloudWatch Logs 구독 필터를 사용하면 특정 패턴의 로그 이벤트가 발생할 때 실시간으로 Lambda를 호출할 수 있습니다.</p>`,
  wrong:`<p><span class="mark-no">❌ C, D</span> — EKS는 S3에 직접 로그를 저장하는 네이티브 통합이 없습니다.</p>`,
  disc:[{ans:'A (97%)',txt:'CloudWatch Logs 구독 필터 → Lambda 패턴은 실시간 로그 처리의 표준 방식입니다.'}]
},
{
  n:32,
  ko:`한 회사가 Amazon Elastic Container Service(Amazon ECS) 클러스터를 구현하고 있습니다. 회사 아키텍처는 클러스터에서 여러 ECS 서비스를 실행합니다. 아키텍처에는 프런트 엔드에 Application Load Balancer가 포함되어 있으며 여러 대상 그룹을 사용하여 트래픽을 라우팅합니다. DevOps 엔지니어는 애플리케이션과 액세스 로그를 수집해야 합니다. 그런 다음 DevOps 엔지니어는 거의 실시간 분석을 위해 로그를 Amazon S3 버킷으로 보내야 합니다.<br><br><strong>이러한 요구 사항을 충족하기 위해 DevOps 엔지니어는 어떤 단계 조합을 취해야 합니까? (세 가지를 선택하세요.)</strong>`,
  en:`A company is implementing an Amazon Elastic Container Service (Amazon ECS) cluster to run its workload. The company architecture will run multiple ECS services on the cluster. The architecture includes an Application Load Balancer on the front end and uses multiple target groups to route traffic. A DevOps engineer must collect application and access logs. The DevOps engineer then needs to send the logs to an Amazon S3 bucket for near-real-time analysis. Which combination of steps must the DevOps engineer take to meet these requirements? (Choose three.)`,
  type:'multi',
  multiCount:3,
  choices:[
    {k:'A', ko:`AWS에서 Amazon CloudWatch Logs 컨테이너 인스턴스를 다운로드합니다. 이 인스턴스를 작업으로 구성합니다. 로깅 작업을 포함하도록 애플리케이션 서비스 정의를 업데이트합니다.`, en:`Download the Amazon CloudWatch Logs container instance from AWS. Configure this instance as a task. Update the application service definitions to include the logging task.`},
    {k:'B', ko:`ECS 인스턴스에 Amazon CloudWatch Logs 에이전트를 설치합니다. ECS 작업 정의의 로깅 드라이버를 awslogs로 변경합니다.`, en:`Install the Amazon CloudWatch Logs agent on the ECS instances. Change the logging driver in the ECS task definition to awslogs.`},
    {k:'C', ko:`Amazon EventBridge를 사용하여 60초마다 실행되고 Amazon CloudWatch Logs create-export-task 명령을 실행하는 AWS Lambda 함수를 예약합니다. 그런 다음 출력을 로깅 S3 버킷으로 가리킵니다.`, en:`Use Amazon EventBridge to schedule an AWS Lambda function that will run every 60 seconds and will run the Amazon CloudWatch Logs create-export-task command. Then point the output to the logging S3 bucket.`},
    {k:'D', ko:`ALB에서 액세스 로깅을 활성화합니다. 그런 다음 ALB를 로깅 S3 버킷으로 직접 가리킵니다.`, en:`Activate access logging on the ALB. Then point the ALB directly to the logging S3 bucket.`},
    {k:'E', ko:`ECS 서비스가 사용하는 대상 그룹에서 액세스 로깅을 활성화합니다. 그런 다음 로깅 S3 버킷으로 직접 로그를 보냅니다.`, en:`Activate access logging on the target groups that the ECS services use. Then send the logs directly to the logging S3 bucket.`},
    {k:'F', ko:`로깅 S3 버킷의 목적지가 있는 Amazon Kinesis Data Firehose 전달 스트림을 만듭니다. 그런 다음 Kinesis Data Firehose에 대한 Amazon CloudWatch Logs 구독 필터를 만듭니다.`, en:`Create an Amazon Kinesis Data Firehose delivery stream that has a destination of the logging S3 bucket. Then create an Amazon CloudWatch Logs subscription filter for Kinesis Data Firehose.`},
  ],
  answer:['B','D','F'],
  vote:'100% BDF',
  explain:`<p><span class="mark-ok">✅ B</span>: ECS 작업 정의에서 로깅 드라이버를 awslogs로 설정하면 컨테이너 로그가 CloudWatch Logs로 전송됩니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ D</span>: ALB 액세스 로그는 ALB에서 직접 S3 버킷으로 전송됩니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ F</span>: CloudWatch Logs → Kinesis Data Firehose → S3 경로는 거의 실시간 로그 전달을 제공합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ E</span> — ALB 액세스 로그는 대상 그룹이 아닌 ALB 수준에서 설정합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — create-export-task는 비동기 배치 내보내기이며 거의 실시간이 아닙니다.</p>`,
  disc:[{ans:'BDF (100%)',txt:'B: 앱 로그 → CW, D: 액세스 로그 → S3 (ALB 직접), F: CW → Kinesis Firehose → S3 (거의 실시간).'}]
},
{
  n:33,
  ko:`전자 건강 기록을 사용하는 한 회사가 Amazon Linux 운영 체제를 사용하여 Amazon EC2 인스턴스 플릿을 실행하고 있습니다. 환자 개인 정보 보호 요구 사항의 일환으로 회사는 EC2 인스턴스에서 실행되는 운영 체제 및 애플리케이션에 대한 패치에 대한 지속적인 준수를 보장해야 합니다. 기본 및 사용자 지정 리포지토리를 사용하여 운영 체제 및 애플리케이션 패치의 배포를 자동화할 수 있는 방법은 무엇입니까?`,
  en:`A company that uses electronic health records is running a fleet of Amazon EC2 instances with an Amazon Linux operating system. As part of patient privacy requirements, the company must ensure continuous compliance for patches for operating system and applications running on the EC2 instances. How can the deployments of the operating system and application patches be automated using a default and custom repository?`,
  type:'single',
  choices:[
    {k:'A', ko:`AWS Systems Manager를 사용하여 사용자 정의 리포지토리를 포함한 새 패치 베이스라인을 만듭니다. run 명령을 사용하여 AWS-RunPatchBaseline 문서를 실행하여 패치를 확인하고 설치합니다.`, en:`Use AWS Systems Manager to create a new patch baseline including the custom repository. Run the AWS-RunPatchBaseline document using the run command to verify and install patches.`},
    {k:'B', ko:`AWS Direct Connect를 사용하여 기업 리포지토리를 통합하고 Amazon CloudWatch 예약 이벤트를 사용하여 패치를 배포한 다음 CloudWatch 대시보드를 사용하여 보고서를 만듭니다.`, en:`Use AWS Direct Connect to integrate the corporate repository and deploy the patches using Amazon CloudWatch scheduled events, then use the CloudWatch dashboard to create reports.`},
    {k:'C', ko:`yum-config-manager를 사용하여 /etc/yum.repos.d에 사용자 정의 저장소를 추가하고 yum-config-manager-enable을 실행하여 저장소를 활성화합니다.`, en:`Use yum-config-manager to add the custom repository under /etc/yum.repos.d and run yum-config-manager-enable to activate the repository.`},
    {k:'D', ko:`AWS Systems Manager를 사용하여 기업 리포지토리를 포함한 새로운 패치 베이스라인을 만듭니다. run 명령을 사용하여 AWS-AmazonLinuxDefaultPatchBaseline 문서를 실행하여 패치를 확인하고 설치합니다.`, en:`Use AWS Systems Manager to create a new patch baseline including the corporate repository. Run the AWS-AmazonLinuxDefaultPatchBaseline document using the run command to verify and install patches.`},
  ],
  answer:['A'],
  vote:'100% A',
  explain:`<p><span class="mark-ok">✅ A — SSM Patch Manager + AWS-RunPatchBaseline</span></p><p>AWS Systems Manager Patch Manager에서 사용자 지정 리포지토리를 포함하는 패치 베이스라인을 생성할 수 있습니다. <code>AWS-RunPatchBaseline</code> SSM 문서는 인스턴스에 등록된 패치 베이스라인(기본 + 사용자 지정 포함)을 기반으로 패치를 스캔하고 설치합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ D</span> — <code>AWS-AmazonLinuxDefaultPatchBaseline</code>은 미리 정의된 기본 베이스라인을 적용하는 문서로 수정이 불가능하며, 사용자 지정 리포지토리를 포함할 수 없습니다.</p>`,
  disc:[{ans:'A (100%)',txt:'핵심 차이: AWS-RunPatchBaseline(A)은 사용자 정의 베이스라인 적용. AWS-AmazonLinuxDefaultPatchBaseline(D)은 수정 불가한 기본 베이스라인만 사용.'}]
},
{
  n:34,
  ko:`한 회사에서 AWS CodePipeline을 사용하여 릴리스 파이프라인을 자동화하고 있습니다. AWS CodeDeploy는 파이프라인에서 블루/그린 배포 모델을 사용하여 Amazon Elastic Container Service(Amazon ECS)에 애플리케이션을 배포하는 데 사용되고 있습니다. 이 회사는 트래픽을 전환하기 전에 그린 버전의 애플리케이션을 테스트하는 스크립트를 구현하려고 합니다. 이러한 스크립트는 5분 이내에 완료됩니다. 이러한 테스트 중에 오류가 발견되면 애플리케이션을 롤백해야 합니다.<br><br><strong>이러한 요구 사항을 충족하는 전략은 무엇입니까?</strong>`,
  en:`A company is using AWS CodePipeline to automate its release pipeline. AWS CodeDeploy is being used in the pipeline to deploy an application to Amazon Elastic Container Service (Amazon ECS) using the blue/green deployment model. The company wants to implement scripts to test the green version of the application before shifting traffic. These scripts will complete in 5 minutes or less. If errors are discovered during these tests, the application must be rolled back. Which strategy will meet these requirements?`,
  type:'single',
  choices:[
    {k:'A', ko:`소스와 배포 단계 사이에 CodePipeline 파이프라인에 단계를 추가합니다. AWS CodeBuild를 사용하여 런타임 환경을 만들고 buildspec 파일에서 명령을 빌드하여 테스트 스크립트를 호출합니다. 오류가 발견되면 aws deploy stop-deployment 명령을 사용하여 배포를 중지합니다.`, en:`Add a stage to the CodePipeline pipeline between the source and deploy stages. Use AWS CodeBuild to create a runtime environment and build commands in the buildspec file to invoke test scripts. If errors are found, use the aws deploy stop-deployment command to stop the deployment.`},

    {k:'D', ko:`CodeDeploy AppSpec 파일에 hooks 섹션을 추가합니다. AfterAllowTraffic 라이프사이클 이벤트를 사용하여 테스트 스크립트를 호출합니다. 오류가 발견되면 aws deploy stop-deployment CLI 명령을 사용하여 배포를 중지합니다.`, en:`Add a hooks section to the CodeDeploy AppSpec file. Use the AfterAllowTraffic lifecycle event to invoke the test scripts. If errors are found, use the aws deploy stop-deployment CLI command to stop the deployment.`},

  vote:'100% C',
  explain:`<p><span class="mark-ok">✅ C — AfterAllowTestTraffic + Lambda 오류 종료 → 자동 롤백</span></p><p><code>AfterAllowTestTraffic</code>은 테스트 트래픽이 그린 환경으로 전환된 후, 전체 프로덕션 트래픽 전환 전에 실행됩니다. Lambda 함수에서 오류와 함께 종료(exit with error)하면 CodeDeploy가 자동 롤백을 시작합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A, B</span> — 소스와 배포 단계 사이의 테스트는 배포 전 테스트입니다. 그린 환경에 실제 배포된 후의 테스트가 아닙니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — AfterAllowTraffic은 전체 트래픽이 전환된 후이며, stop-deployment는 롤백이 아닙니다.</p>`,

{
  n:35,
  ko:`한 회사가 여러 리소스에서 사용하는 Amazon S3 버킷 앞에서 파일 게이트웨이 모드로 AWS Storage Gateway를 사용합니다. 업무가 시작되는 아침에 사용자는 전날 저녁에 타사에서 처리한 객체를 볼 수 없습니다. DevOps 엔지니어가 S3 버킷을 직접 보면 데이터는 있지만 Storage Gateway에는 없습니다.<br><br><strong>어떤 솔루션이 모든 업데이트된 타사 파일을 아침에 사용할 수 있도록 보장합니까?</strong>`,
  en:`A company uses AWS Storage Gateway in file gateway mode in front of an Amazon S3 bucket that is used by multiple resources. In the morning when business begins, users do not see the objects processed by a third party the previous evening. When a DevOps engineer looks directly at the S3 bucket, the data is there, but it is missing in Storage Gateway. Which solution ensures that all the updated third-party files are available in the morning?`,
  type:'single',
  choices:[
    {k:'A', ko:`Storage Gateway에 대한 RefreshCache 명령을 실행하기 위해 AWS Lambda 함수를 호출하도록 매일 밤 Amazon EventBridge 이벤트를 구성합니다.`, en:`Configure a nightly Amazon EventBridge event to invoke an AWS Lambda function to run the RefreshCache command for Storage Gateway.`},
    {k:'B', ko:`AWS Transfer for SFTP를 사용하여 제3자에게 S3 버킷에 데이터를 넣도록 지시합니다.`, en:`Instruct the third party to put data into the S3 bucket using AWS Transfer for SFTP.`},
    {k:'C', ko:`볼륨 게이트웨이 모드에서 실행되도록 Storage Gateway를 수정합니다.`, en:`Modify Storage Gateway to run in volume gateway mode.`},
    {k:'D', ko:`S3 동일 지역 복제를 사용하여 S3 버킷에서 직접 변경한 모든 내용을 Storage Gateway에 복제합니다.`, en:`Use S3 Same-Region Replication to replicate any changes made directly in the S3 bucket to Storage Gateway.`},
  ],
  answer:['A'],
  vote:'97% A',
  explain:`<p><span class="mark-ok">✅ A — EventBridge 야간 스케줄 + Lambda RefreshCache</span></p><p>Storage Gateway 파일 게이트웨이는 S3 버킷에 직접 업로드된 파일은 캐시를 자동 업데이트하지 않습니다. EventBridge 야간 스케줄로 Lambda를 실행하여 RefreshCache API를 호출하면 S3의 최신 상태가 게이트웨이에 반영됩니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — AWS Transfer for SFTP를 사용해도 S3에 PutObject하는 것은 동일하며, Storage Gateway 캐시는 자동 갱신되지 않습니다.</p>`,
  disc:[{ans:'A (97%)',txt:'"Storage Gateway doesn\'t automatically update the cache when you upload a file directly to Amazon S3. You must perform a RefreshCache operation." — AWS 공식 문서'}]
},
{
  n:36,
  ko:`DevOps 엔지니어는 S3 크로스 리전 복제 기능을 사용하여 개인 버킷 정책이 있는 S3 버킷에 저장된 민감한 Amazon S3 객체를 백업해야 합니다. 객체를 다른 AWS 리전 및 계정의 대상 버킷에 복사해야 합니다.<br><br><strong>이 복제를 활성화하려면 어떤 작업 조합을 수행해야 합니까? (세 가지를 선택하세요.)</strong>`,
  en:`A DevOps engineer needs to back up sensitive Amazon S3 objects that are stored within an S3 bucket with a private bucket policy using S3 cross-Region replication functionality. The objects need to be copied to a target bucket in a different AWS Region and account. Which combination of actions should be performed to enable this replication? (Choose three.)`,
  type:'multi',
  multiCount:3,
  choices:[
    {k:'A', ko:`소스 계정에서 복제 IAM 역할 생성`, en:`Create a replication IAM role in the source account`},
    {k:'B', ko:`대상 계정에서 복제 IAM 역할을 생성합니다.`, en:`Create a replication IAM role in the target account.`},
    {k:'C', ko:`소스 버킷 정책에 명령문을 추가하여 복제 IAM 역할이 개체를 복제할 수 있도록 허용합니다.`, en:`Add statements to the source bucket policy allowing the replication IAM role to replicate objects.`},
    {k:'D', ko:`복제 IAM 역할이 개체를 복제할 수 있도록 대상 버킷 정책에 명령문을 추가합니다.`, en:`Add statements to the target bucket policy allowing the replication IAM role to replicate objects.`},
    {k:'E', ko:`복제를 활성화하려면 소스 버킷에서 복제 규칙을 만듭니다.`, en:`Create a replication rule in the source bucket to enable the replication.`},
    {k:'F', ko:`대상 버킷에서 복제 규칙을 생성하여 복제를 활성화합니다.`, en:`Create a replication rule in the target bucket to enable the replication.`},
  ],

  explain:`<p><span class="mark-ok">✅ A</span>: S3가 객체를 복제하는 데 사용할 IAM 역할을 소스 계정에 생성합니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ D</span>: 교차 계정 복제 시 대상 계정의 버킷 정책에 소스 계정의 복제 역할이 객체를 쓸 수 있도록 허용하는 구문을 추가합니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ E</span>: 소스 버킷에 복제 규칙을 생성하여 복제를 활성화합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — 복제 IAM 역할은 소스 계정에 생성합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ F</span> — 복제 규칙은 소스 버킷에 설정합니다.</p>`,
  disc:[{ans:'ADE (100%)',txt:'교차 계정 S3 복제 단계: 1) 소스 계정에 IAM 역할 생성 2) 대상 버킷 정책에 허용 구문 추가 3) 소스 버킷에 복제 규칙 생성.'}]
},
{
  n:37,
  ko:`회사에 AWS Organizations의 조직에 속하는 여러 멤버 계정이 있습니다. 보안팀은 모든 Amazon EC2 보안 그룹과 해당 인바운드 및 아웃바운드 규칙을 검토해야 합니다. 보안팀은 조직의 관리 계정에서 AWS Lambda 함수를 사용하여 멤버 계정에서 이 정보를 프로그래밍 방식으로 검색하려고 합니다.<br><br><strong>이러한 요구 사항을 충족하는 액세스 변경 조합은 무엇입니까? (세 가지를 선택하십시오.)</strong>`,
  en:`A company has multiple member accounts that are part of an organization in AWS Organizations. The security team needs to review every Amazon EC2 security group and their inbound and outbound rules. The security team wants to programmatically retrieve this information from the member accounts using an AWS Lambda function in the management account of the organization. Which combination of access changes will meet these requirements? (Choose three.)`,
  type:'multi',
  multiCount:3,
  choices:[
    {k:'A', ko:`멤버 계정의 사용자가 관리 계정 IAM 역할을 맡을 수 있도록 하는 신뢰 관계를 만듭니다.`, en:`Create a trust relationship that allows users in the member accounts to assume the management account IAM role.`},
    {k:'B', ko:`관리 계정의 사용자가 멤버 계정의 IAM 역할을 맡을 수 있도록 하는 신뢰 관계를 만듭니다.`, en:`Create a trust relationship that allows users in the management account to assume the IAM roles of the member accounts.`},
    {k:'C', ko:`AmazonEC2ReadOnlyAccess 관리 정책에 액세스할 수 있는 각 멤버 계정에 IAM 역할을 생성합니다.`, en:`Create an IAM role in each member account that has access to the AmazonEC2ReadOnlyAccess managed policy.`},
    {k:'D', ko:`각 구성원 계정에서 IAM 역할을 생성하여 관리 계정 IAM 역할의 ARN에 대해 sts:AssumeRole 작업을 허용합니다.`, en:`Create an IAM role in each member account to allow the sts:AssumeRole action against the management account IAM role's ARN.`},
    {k:'E', ko:`멤버 계정 IAM 역할의 ARN에 대해 sts:AssumeRole 작업을 허용하는 관리 계정에서 IAM 역할을 생성합니다.`, en:`Create an IAM role in the management account that allows the sts:AssumeRole action against the member account IAM role's ARN.`},
    {k:'F', ko:`AmazonEC2ReadOnlyAccess 관리 정책에 액세스할 수 있는 관리 계정에서 IAM 역할을 생성합니다.`, en:`Create an IAM role in the management account that has access to the AmazonEC2ReadOnlyAccess managed policy.`},
  ],
  answer:['B','C','E'],
  vote:'80% BCE',
  explain:`<p><span class="mark-ok">✅ B</span>: 관리 계정의 Lambda 역할이 멤버 계정 역할을 Assume할 수 있도록 신뢰 관계를 설정합니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ C</span>: 각 멤버 계정에 EC2 읽기 전용 권한을 가진 IAM 역할을 생성합니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ E</span>: 관리 계정에 멤버 계정 IAM 역할을 Assume할 수 있는 권한을 가진 IAM 역할을 생성합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — 방향이 반대입니다. 관리 계정이 멤버 계정 역할을 맡아야 합니다.</p>`,
  disc:[{ans:'BCE (80%)',txt:'교차 계정 접근 패턴: 관리 계정(Lambda) → AssumeRole → 멤버 계정 역할(EC2ReadOnly). B=신뢰관계, C=멤버역할(권한), E=관리역할(AssumeRole 권한).'}]

{
  n:38,
  ko:`우주 탐사 회사가 여러 위성에서 원격 측정 데이터를 수신합니다. 소량의 데이터 패킷은 Amazon API Gateway를 통해 수신되어 Amazon Simple Queue Service(Amazon SQS) 표준 대기열에 직접 배치됩니다. 사용자 지정 애플리케이션이 대기열에 구독되어 데이터를 표준 형식으로 변환합니다. 위성에서 생성되는 데이터의 불일치로 인해 애플리케이션이 가끔 데이터를 변환할 수 없습니다. 이러한 경우 메시지는 SQS 대기열에 남아 있습니다. DevOps 엔지니어는 실패한 메시지를 보관하고 과학자가 검토하고 향후 처리할 수 있도록 제공하는 솔루션을 개발해야 합니다.<br><br><strong>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?</strong>`,
  en:`A space exploration company receives telemetry data from multiple satellites. Small packets of data are received through Amazon API Gateway and are placed directly into an Amazon Simple Queue Service (Amazon SQS) standard queue. A custom application is subscribed to the queue and transforms the data into a standard format. Because of inconsistencies in the data that the satellites produce, the application is occasionally unable to transform the data. In these cases, the messages remain in the SQS queue. A DevOps engineer must develop a solution that retains the failed messages and makes them available to scientists for review and future processing. Which solution will meet these requirements?`,
  type:'single',
  choices:[
    {k:'A', ko:`AWS Lambda를 구성하여 SQS 대기열을 폴링하고 Lambda 함수를 호출하여 대기열 메시지가 유효한지 확인합니다. 검증이 실패하면 유효하지 않은 데이터의 사본을 Amazon S3 버킷으로 보내 과학자가 데이터를 검토하고 수정할 수 있도록 합니다. 데이터가 수정되면 수정된 데이터로 재생 Lambda 함수를 사용하여 SQS 대기열의 메시지를 수정합니다.`, en:`Configure AWS Lambda to poll the SQS queue and invoke a Lambda function to check whether the queue messages are valid. If validation fails, send a copy of the data that is not valid to an Amazon S3 bucket so that the scientists can review and correct the data. When the data is corrected, amend the message in the SQS queue by using a replay Lambda function with the corrected data.`},
    {k:'B', ko:`SQS 표준 대기열을 SQS FIFO 대기열로 변환합니다. Amazon EventBridge 일정을 사용하여 10분마다 SQS 대기열을 폴링하도록 AWS Lambda를 구성합니다. Lambda 함수를 호출하여 5분보다 오래된 SentTimestamp 값이 있는 메시지를 식별하고, 데이터를 애플리케이션의 출력 위치와 동일한 위치로 푸시하고, 대기열에서 메시지를 제거합니다.`, en:`Convert the SQS standard queue to an SQS FIFO queue. Configure AWS Lambda to poll the SQS queue every 10 minutes by using an Amazon EventBridge schedule. Invoke the Lambda function to identify any messages with a SentTimestamp value that is older than 5 minutes, push the data to the same location as the application's output location, and remove the messages from the queue.`},
    {k:'C', ko:`SQS 배달 못한 편지 대기열을 만듭니다. 최대 수신 설정을 1로 설정하고 배달 못한 편지 대기열 ARN을 새로 만든 대기열의 ARN으로 설정하는 재구동 정책을 포함하여 기존 대기열을 수정합니다. 과학자들에게 배달 못한 편지 대기열을 사용하여 유효하지 않은 데이터를 검토하도록 지시합니다. 나중에 이 데이터를 다시 처리합니다.`, en:`Create an SQS dead-letter queue. Modify the existing queue by including a redrive policy that sets the Maximum Receives setting to 1 and sets the dead-letter queue ARN to the ARN of the newly created queue. Instruct the scientists to use the dead-letter queue to review the data that is not valid. Reprocess this data at a later time.`},
    {k:'D', ko:`API Gateway를 구성하여 각 위성에 대해 명명된 다른 SQS 가상 대기열에 메시지를 보냅니다. 변환할 수 없는 모든 데이터에 대해 새 가상 대기열을 사용하도록 애플리케이션을 업데이트하고 메시지를 새 가상 대기열로 보냅니다. 과학자들에게 가상 대기열을 사용하여 유효하지 않은 데이터를 검토하도록 지시합니다. 나중에 이 데이터를 다시 처리합니다.`, en:`Configure API Gateway to send messages to different SQS virtual queues that are named for each of the satellites. Update the application to use a new virtual queue for any data that it cannot transform, and send the message to the new virtual queue. Instruct the scientists to use the virtual queue to review the data that is not valid. Reprocess this data at a later time.`},
  ],
  answer:['C'],
  vote:'100% C',
  explain:`<p><span class="mark-ok">✅ C — SQS Dead-Letter Queue (DLQ)</span></p><p>SQS DLQ는 처리에 실패한 메시지를 자동으로 격리하는 AWS 표준 패턴입니다. Maximum Receives=1로 설정하면 애플리케이션이 한 번 변환에 실패한 메시지를 즉시 DLQ로 이동합니다. 과학자들은 DLQ에서 직접 메시지를 검토하고 나중에 재처리할 수 있습니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — Lambda로 별도 검증 레이어를 추가하는 것은 복잡하며 SQS의 DLQ 메커니즘을 활용하는 것이 더 효율적입니다.</p>`,
  disc:[{ans:'C (100%)',txt:'DLQ 사용 사례: 처리 실패 메시지 격리, 분석, 재처리. Maximum Receives=1로 설정하면 한 번 실패 시 즉시 DLQ로 이동합니다.'}]
},
{
  n:39,
  ko:`한 회사가 인프라 배포에 AWS CloudFormation을 사용하고자 합니다. 이 회사는 엄격한 태그 지정 및 리소스 요구 사항을 가지고 있으며 배포를 두 개의 지역으로 제한하고자 합니다. 개발자는 동일한 애플리케이션의 여러 버전을 배포해야 합니다.<br><br><strong>어떤 솔루션이 회사 정책에 따라 리소스가 배포되도록 보장합니까?</strong>`,
  en:`A company wants to use AWS CloudFormation for infrastructure deployment. The company has strict tagging and resource requirements and wants to limit the deployment to two Regions. Developers will need to deploy multiple versions of the same application. Which solution ensures resources are deployed in accordance with company policy?`,
  type:'single',
  choices:[
    {k:'A', ko:`AWS Trusted Advisor 검사를 생성하여 승인되지 않은 CloudFormation StackSets를 찾아 해결합니다.`, en:`Create AWS Trusted Advisor checks to find and remediate unapproved CloudFormation StackSets.`},
    {k:'B', ko:`승인되지 않은 CloudFormation StackSets를 찾아 해결하기 위해 Cloud Formation 드리프트 감지 작업을 생성합니다.`, en:`Create a Cloud Formation drift detection operation to find and remediate unapproved CloudFormation StackSets.`},
    {k:'C', ko:`승인된 CloudFormation 템플릿을 사용하여 CloudFormation StackSets를 만듭니다.`, en:`Create CloudFormation StackSets with approved CloudFormation templates.`},
    {k:'D', ko:`승인된 CloudFormation 템플릿을 사용하여 AWS 서비스 카탈로그 제품을 만듭니다.`, en:`Create AWS Service Catalog products with approved CloudFormation templates.`},
  ],
  answer:['D'],
  vote:'78% D (22% C)',
  explain:`<p><span class="mark-ok">✅ D — AWS Service Catalog</span></p><p>AWS Service Catalog를 사용하면 승인된 CloudFormation 템플릿으로 제품을 만들고 배포 가능한 리전, 허용되는 인스턴스 유형, 필수 태그 등 제약을 강제할 수 있습니다. 개발자는 카탈로그에서 버전을 선택하여 배포하므로 회사 정책을 자동으로 준수합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ C</span> — CloudFormation StackSets는 여러 계정/리전에 배포할 수 있지만, 개발자가 직접 사용하면 승인되지 않은 템플릿이나 다른 리전 선택을 막을 수 없습니다.</p>`,
  disc:[{ans:'D (78%) vs C (22%)',txt:'"Service Catalog를 사용하면 조직 내 최종 사용자는 조직이 설정한 제약에 따라 승인된 IT 서비스만 빠르게 배포할 수 있습니다." — AWS Service Catalog 문서.'}]
},
{
  n:40,
  ko:`어떤 회사에서는 내부적으로 마주하는 웹 애플리케이션이 고가용성을 요구합니다. 이 아키텍처는 Amazon EC2 웹 서버 인스턴스 하나와 업데이트 및 공개 데이터 액세스를 위한 아웃바운드 인터넷 액세스를 제공하는 NAT 인스턴스 하나로 구성됩니다.<br><br><strong>이 회사는 고가용성을 달성하기 위해 어떤 아키텍처 조정 조합을 구현해야 합니까? (두 가지를 선택하세요.)</strong>`,
  en:`A company requires that its internally facing web application be highly available. The architecture is made up of one Amazon EC2 web server instance and one NAT instance that provides outbound internet access for updates and accessing public data. Which combination of architecture adjustments should the company implement to achieve high availability? (Choose two.)`,
  type:'multi',
  multiCount:2,
  choices:[
    {k:'A', ko:`여러 가용성 영역에 걸쳐 있는 EC2 자동 확장 그룹에 NAT 인스턴스를 추가합니다. 경로 테이블을 업데이트합니다.`, en:`Add the NAT instance to an EC2 Auto Scaling group that spans multiple Availability Zones. Update the route tables.`},
    {k:'B', ko:`여러 가용성 영역에 걸쳐 추가 EC2 인스턴스를 만듭니다. 애플리케이션 로드 밸런서를 추가하여 로드를 이들 간에 분할합니다.`, en:`Create additional EC2 instances spanning multiple Availability Zones. Add an Application Load Balancer to split the load between them.`},
    {k:'C', ko:`EC2 인스턴스 앞에 애플리케이션 로드 밸런서를 구성합니다. 호스트 장애 시 EC2 인스턴스를 복구하도록 Amazon CloudWatch 알람을 구성합니다.`, en:`Configure an Application Load Balancer in front of the EC2 instance. Configure Amazon CloudWatch alarms to recover the EC2 instance upon host failure.`},
    {k:'D', ko:`각 가용성 영역에서 NAT 인스턴스를 NAT 게이트웨이로 교체합니다. 경로 테이블을 업데이트합니다.`, en:`Replace the NAT instance with a NAT gateway in each Availability Zone. Update the route tables.`},
    {k:'E', ko:`NAT 인스턴스를 여러 가용성 영역에 걸쳐 있는 NAT 게이트웨이로 교체합니다. 경로 테이블을 업데이트합니다.`, en:`Replace the NAT instance with a NAT gateway that spans multiple Availability Zones. Update the route tables.`},
  ],
  answer:['B','D'],
  vote:'82% BD',
  explain:`<p><span class="mark-ok">✅ B</span>: 여러 AZ에 EC2 인스턴스를 배포하고 ALB로 트래픽을 분산하면 단일 인스턴스 장애에도 서비스가 지속됩니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ D</span>: NAT 게이트웨이는 단일 AZ 내에서만 동작합니다. 고가용성을 위해 각 AZ에 하나의 NAT 게이트웨이를 배포합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ E</span> — NAT 게이트웨이는 단일 서브넷(단일 AZ)에 배포됩니다. 여러 AZ에 걸쳐 있는 NAT 게이트웨이는 존재하지 않습니다.</p>`,
  disc:[{ans:'BD (82%)',txt:'"여러 AZ의 리소스가 하나의 NAT 게이트웨이를 공유하면, 해당 AZ가 다운될 때 다른 AZ의 리소스가 인터넷 액세스를 잃습니다. 각 AZ에 NAT 게이트웨이를 생성하세요." — AWS VPC 문서'}]
},
{
  n:41,
  en:`A DevOps engineer is building a multistage pipeline with AWS CodePipeline to build, verify, stage, test, and deploy an application. A manual approval stage is required between the test stage and the deploy stage. The development team uses a custom chat tool with webhook support that requires near-real-time notifications.<br><br><strong>How should the DevOps engineer configure status updates for pipeline activity and approval requests to post to the chat tool?</strong>`,
  ko:`DevOps 엔지니어가 AWS CodePipeline을 사용하여 애플리케이션을 빌드, 검증, 스테이징, 테스트 및 배포하기 위한 다단계 파이프라인을 구축하고 있습니다. 테스트 단계와 배포 단계 사이에 수동 승인 단계가 필요합니다. 개발팀은 거의 실시간 알림이 필요한 웹훅 지원이 있는 사용자 지정 채팅 도구를 사용합니다.<br><br><strong>DevOps 엔지니어는 파이프라인 활동 및 채팅 도구에 게시할 승인 요청에 대한 상태 업데이트를 어떻게 구성해야 합니까?</strong>`,
  type:'single',
  choices:[
    {k:'A', en:`Create an Amazon CloudWatch Logs subscription that filters on CodePipeline Pipeline Execution State Change. Publish subscription events to an Amazon Simple Notification Service (Amazon SNS) topic. Subscribe the chat webhook URL to the SNS topic, and complete the subscription validation.`, ko:`CodePipeline 파이프라인 실행 상태 변경을 필터링하는 Amazon CloudWatch Logs 구독을 만듭니다. Amazon SNS 토픽에 구독 이벤트를 게시합니다. 채팅 웹훅 URL을 SNS 토픽에 구독하고 구독 검증을 완료합니다.`},
    {k:'B', en:`Create an AWS Lambda function that is invoked by AWS CloudTrail events. When a CodePipeline Pipeline Execution State Change event is detected, send the event details to the chat webhook URL.`, ko:`AWS CloudTrail 이벤트에서 호출되는 AWS Lambda 함수를 만듭니다. CodePipeline 파이프라인 실행 상태 변경 이벤트가 감지되면 이벤트 세부 정보를 채팅 웹훅 URL로 보냅니다.`},
    {k:'C', en:`Create an Amazon EventBridge rule that filters on CodePipeline Pipeline Execution State Change. Publish the events to an Amazon Simple Notification Service (Amazon SNS) topic. Create an AWS Lambda function that sends event details to the chat webhook URL. Subscribe the function to the SNS topic.`, ko:`CodePipeline 파이프라인 실행 상태 변경을 필터링하는 Amazon EventBridge 규칙을 만듭니다. Amazon SNS 토픽에 이벤트를 게시합니다. 채팅 웹훅 URL에 이벤트 세부 정보를 보내는 AWS Lambda 함수를 만듭니다. 함수를 SNS 토픽에 구독합니다.`},
    {k:'D', en:`Modify the pipeline code to send the event details to the chat webhook URL at the end of each stage. Parameterize the URL so that each pipeline can send to a different URL based on the pipeline environment.`, ko:`파이프라인 코드를 수정하여 각 단계의 끝에 이벤트 세부 정보를 채팅 웹훅 URL로 보냅니다. 각 파이프라인이 파이프라인 환경에 따라 다른 URL로 보낼 수 있도록 URL을 매개변수화합니다.`},
  ],
  answer:['C'],
  vote:'100% C',
  explain:`<p><span class="mark-ok">✅ C — EventBridge → SNS → Lambda → 채팅 웹훅</span></p><p>CodePipeline 파이프라인 실행 상태 변경 이벤트는 <strong>Amazon EventBridge</strong>(기본 이벤트 버스)에서 발생합니다. EventBridge 규칙 → SNS 토픽 → Lambda 함수(웹훅 호출) 순서로 연결하면 거의 실시간으로 채팅 도구에 알림을 보낼 수 있습니다. SNS에 Lambda를 구독시켜 채팅 웹훅 URL에 맞는 요청 형식으로 변환해 전송합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — CloudWatch Logs 구독 필터는 로그 분석용이며 CodePipeline 상태 이벤트를 직접 구독할 수 없습니다. 또한 SNS가 임의 웹훅 URL을 직접 구독할 수 없습니다(HTTPS 엔드포인트 구독 검증 필요).</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — CloudTrail은 API 호출 로깅용이며 Lambda를 직접 트리거하지 않습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — 파이프라인 코드를 수정하는 것은 불필요한 복잡성을 추가하며 유지 관리 부담이 큽니다.</p>`,
  disc:[{ans:'C (100%)',txt:'시험 팁: 이벤트 또는 액션과 관련된 문제라면 → EventBridge를 활용합니다. CodePipeline 실행 상태 변경은 API 호출이 아닌 이벤트이므로 EventBridge로 캡처해야 합니다.'}]
},
{
  n:42,
  en:`A company's application development team uses Linux-based Amazon EC2 instances as bastion hosts. Inbound SSH access to the bastion hosts is restricted to specific IP addresses, as defined in the associated security groups. The company's security team wants to receive a notification if the security group rules are modified to allow SSH access from any IP address.<br><br><strong>What should a DevOps engineer do to meet this requirement?</strong>`,
  ko:`회사의 애플리케이션 개발팀은 Linux 기반 Amazon EC2 인스턴스를 베스천 호스트로 사용합니다. 베스천 호스트에 대한 인바운드 SSH 액세스는 연관된 보안 그룹에 정의된 대로 특정 IP 주소로 제한됩니다. 회사의 보안팀은 보안 그룹 규칙이 모든 IP 주소에서 SSH 액세스를 허용하도록 수정되면 알림을 받고 싶어합니다.<br><br><strong>DevOps 엔지니어는 이 요구 사항을 충족하기 위해 무엇을 해야 합니까?</strong>`,
  type:'single',
  choices:[
    {k:'A', en:`Create an Amazon EventBridge rule with a source of aws.cloudtrail and the event name AuthorizeSecurityGroupIngress. Define an Amazon Simple Notification Service (Amazon SNS) topic as the target.`, ko:`aws.cloudtrail 소스와 AuthorizeSecurityGroupIngress 이벤트 이름으로 Amazon EventBridge 규칙을 만듭니다. Amazon SNS 토픽을 대상으로 정의합니다.`},
    {k:'B', en:`Enable Amazon GuardDuty and check the findings for security groups in AWS Security Hub. Configure an Amazon EventBridge rule with a custom pattern that matches GuardDuty events with an output of NON_COMPLIANT. Define an Amazon Simple Notification Service (Amazon SNS) topic as the target.`, ko:`Amazon GuardDuty를 활성화하고 AWS Security Hub에서 보안 그룹에 대한 결과를 확인합니다. NON_COMPLIANT 출력이 있는 GuardDuty 이벤트와 일치하는 사용자 지정 패턴으로 Amazon EventBridge 규칙을 구성합니다. Amazon SNS 토픽을 대상으로 정의합니다.`},
    {k:'C', en:`Create an AWS Config rule by using the restricted-ssh managed rule to check whether security groups disallow unrestricted incoming SSH traffic. Configure automatic remediation to publish a message to an Amazon Simple Notification Service (Amazon SNS) topic.`, ko:`restricted-ssh 관리 규칙을 사용하여 AWS Config 규칙을 만들어 보안 그룹이 무제한 수신 SSH 트래픽을 허용하지 않는지 확인합니다. Amazon SNS 토픽에 메시지를 게시하도록 자동 수정을 구성합니다.`},
    {k:'D', en:`Enable Amazon Inspector. Include the Common Vulnerabilities and Exposures-1.1 rules package to check the security groups that are associated with the bastion hosts. Configure Amazon Inspector to publish a message to an Amazon Simple Notification Service (Amazon SNS) topic.`, ko:`Amazon Inspector를 활성화합니다. Common Vulnerabilities and Exposures-1.1 규칙 패키지를 포함하여 베스천 호스트와 연관된 보안 그룹을 확인합니다. Amazon Inspector를 구성하여 Amazon SNS 토픽에 메시지를 게시합니다.`},
  ],
  answer:['C'],
  vote:'69% C',
  explain:`<p><span class="mark-ok">✅ C — AWS Config restricted-ssh 관리형 규칙 + SNS</span></p><p>AWS Config의 <strong>restricted-ssh</strong> 관리형 규칙은 보안 그룹의 수신 SSH 트래픽 IP 주소가 <code>0.0.0.0/0</code>인 경우(모든 IP 허용) NON_COMPLIANT로 표시합니다. 이는 정확히 "모든 IP 주소에서 SSH 접근 허용" 조건을 탐지합니다. SNS 토픽에 알림을 게시하도록 구성하면 요구 사항을 충족합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — AuthorizeSecurityGroupIngress 이벤트는 보안 그룹에 대한 <em>모든</em> 인바운드 규칙 변경을 캡처합니다. 0.0.0.0/0(모든 IP) 여부를 구분하지 않으므로 너무 광범위합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — GuardDuty는 위협 탐지 서비스이며 보안 그룹 설정의 규정 준수를 직접 확인하지 않습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — Inspector는 EC2 인스턴스의 취약점을 스캔하는 서비스이며 이 사용 사례에 적합하지 않습니다.</p>`,
  disc:[{ans:'C (69%) vs A (31%)',txt:'논쟁: A는 모든 SG 변경에 알림을 보내고, C는 0.0.0.0/0만 탐지합니다. "모든 IP 주소에서 SSH 허용"은 0.0.0.0/0을 의미하므로 C가 요구사항에 더 정확합니다. restricted-ssh 규칙: CIDR이 0.0.0.0/0이면 NON_COMPLIANT 반환.'}]
},
{
  n:43,
  en:`A DevOps team manages an API running on-premises that serves as a backend for an Amazon API Gateway endpoint. Customers have been complaining about high response latencies, which the development team has verified using the API Gateway latency metrics in Amazon CloudWatch. To identify the cause, the team needs to collect relevant data without introducing additional latency.<br><br><strong>Which actions should be taken to accomplish this? (Choose two.)</strong>`,
  ko:`DevOps 팀은 Amazon API Gateway 엔드포인트의 백엔드 역할을 하는 온프레미스에서 실행되는 API를 관리합니다. 고객들은 높은 응답 지연에 대해 불평해 왔으며, 개발 팀은 Amazon CloudWatch의 API Gateway 지연 메트릭을 사용하여 이를 확인했습니다. 원인을 파악하기 위해 팀은 추가 지연을 발생시키지 않고 관련 데이터를 수집해야 합니다.<br><br><strong>이를 달성하기 위해 어떤 조치를 취해야 합니까? (두 가지를 선택하세요.)</strong>`,
  type:'multi',
  multiCount:2,
  choices:[
    {k:'A', en:`Install the CloudWatch agent server side and configure the agent to upload relevant logs to CloudWatch.`, ko:`CloudWatch 에이전트 서버 측을 설치하고 에이전트가 관련 로그를 CloudWatch에 업로드하도록 구성합니다.`},
    {k:'B', en:`Enable AWS X-Ray tracing in API Gateway, modify the application to capture request segments, and upload those segments to X-Ray during each request.`, ko:`API Gateway에서 AWS X-Ray 추적을 활성화하고, 요청 세그먼트를 캡처하도록 애플리케이션을 수정하고, 각 요청 중에 해당 세그먼트를 X-Ray에 업로드합니다.`},
    {k:'C', en:`Enable AWS X-Ray tracing in API Gateway, modify the application to capture request segments, and use the X-Ray daemon to upload segments to X-Ray.`, ko:`API Gateway에서 AWS X-Ray 추적을 활성화하고, 요청 세그먼트를 캡처하도록 애플리케이션을 수정하고, X-Ray 데몬을 사용하여 세그먼트를 X-Ray에 업로드합니다.`},
    {k:'D', en:`Modify the on-premises application to send log information back to API Gateway with each request.`, ko:`온프레미스 애플리케이션을 수정하여 각 요청과 함께 로그 정보를 API Gateway로 다시 보냅니다.`},
    {k:'E', en:`Modify the on-premises application to calculate and upload statistical data relevant to the API service requests to CloudWatch metrics.`, ko:`온프레미스 애플리케이션을 수정하여 API 서비스 요청과 관련된 통계 데이터를 계산하고 CloudWatch 메트릭에 업로드합니다.`},
  ],
  answer:['A','C'],
  vote:'88% AC',
  explain:`<p><span class="mark-ok">✅ A</span>: 온프레미스 서버에 <strong>CloudWatch 에이전트</strong>를 설치하면 애플리케이션 로그를 CloudWatch Logs에 업로드합니다. 에이전트는 백그라운드에서 동작하므로 추가 지연이 없습니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ C</span>: API Gateway에서 X-Ray 추적을 활성화하고, <strong>X-Ray 데몬</strong>을 사용하면 세그먼트를 비동기적으로 배치 업로드하므로 요청 처리 중 추가 지연이 발생하지 않습니다.</p>`,

{
  n:44,
  en:`A company has an application that is using a MySQL-compatible Amazon Aurora Multi-AZ DB cluster as the database. A cross-Region read replica has been created for disaster recovery purposes. A DevOps engineer wants to automate the promotion of the replica so it becomes the primary database instance in the event of a failure.<br><br><strong>Which solution will accomplish this?</strong>`,
  ko:`한 회사에 MySQL 호환 Amazon Aurora Multi-AZ DB 클러스터를 데이터베이스로 사용하는 애플리케이션이 있습니다. 재해 복구 목적으로 교차 리전 읽기 복제본이 생성되었습니다. DevOps 엔지니어는 장애 발생 시 복제본이 기본 데이터베이스 인스턴스가 되도록 복제본의 승격을 자동화하려고 합니다.<br><br><strong>어떤 솔루션이 이를 달성합니까?</strong>`,
  type:'single',
  choices:[
    {k:'A', en:`Configure a latency-based Amazon Route 53 CNAME with health checks so it points to both the primary and replica endpoints. Subscribe an Amazon SNS topic to Amazon RDS failure notifications from AWS CloudTrail and use that topic to invoke an AWS Lambda function that will promote the replica instance as the primary.`, ko:`상태 점검을 통해 지연 기반 Amazon Route 53 CNAME을 구성하여 기본 및 복제본 엔드포인트를 모두 가리키도록 합니다. Amazon SNS 토픽을 AWS CloudTrail의 Amazon RDS 실패 알림에 구독하고 해당 토픽을 사용하여 복제본 인스턴스를 기본으로 승격하는 AWS Lambda 함수를 호출합니다.`},
    {k:'B', en:`Create an Aurora custom endpoint to point to the primary database instance. Configure the application to use this endpoint. Configure AWS CloudTrail to run an AWS Lambda function to promote the replica instance and modify the custom endpoint to point to the newly promoted instance.`, ko:`기본 데이터베이스 인스턴스를 가리키도록 Aurora 사용자 지정 엔드포인트를 만듭니다. 이 엔드포인트를 사용하도록 애플리케이션을 구성합니다. AWS CloudTrail을 구성하여 AWS Lambda 함수를 실행하여 복제본 인스턴스를 승격시키고 사용자 지정 엔드포인트를 수정하여 새로 승격된 인스턴스를 가리키도록 합니다.`},
    {k:'C', en:`Create an AWS Lambda function to modify the application's AWS CloudFormation template to promote the replica, apply the template to update the stack, and point the application to the newly promoted instance. Create an Amazon CloudWatch alarm to invoke this Lambda function after the failure event occurs.`, ko:`AWS Lambda 함수를 생성하여 복제본을 승격시키고, 템플릿을 적용하여 스택을 업데이트하고, 애플리케이션을 새로 승격된 인스턴스로 가리키도록 애플리케이션의 AWS CloudFormation 템플릿을 수정합니다. 실패 이벤트가 발생한 후 이 Lambda 함수를 호출하기 위해 Amazon CloudWatch 알람을 생성합니다.`},
    {k:'D', en:`Store the Aurora endpoint in AWS Systems Manager Parameter Store. Create an Amazon EventBridge event that detects the database failure and runs an AWS Lambda function to promote the replica instance and update the endpoint URL stored in AWS Systems Manager Parameter Store. Code the application to reload the endpoint from Parameter Store if a database connection fails.`, ko:`AWS Systems Manager Parameter Store에 Aurora 엔드포인트를 저장합니다. 데이터베이스 장애를 감지하고 AWS Lambda 함수를 실행하여 복제본 인스턴스를 승격하고 AWS Systems Manager Parameter Store에 저장된 엔드포인트 URL을 업데이트하는 Amazon EventBridge 이벤트를 만듭니다. 데이터베이스 연결이 실패하면 Parameter Store에서 엔드포인트를 다시 로드하도록 애플리케이션을 코딩합니다.`},
  ],
  answer:['D'],
  vote:'100% D',
  explain:`<p><span class="mark-ok">✅ D — EventBridge → Lambda → 복제본 승격 + Parameter Store 업데이트</span></p><p>EventBridge가 RDS 장애 이벤트를 감지하면 Lambda 함수를 트리거하여 교차 리전 읽기 복제본을 기본 인스턴스로 승격합니다. 새 엔드포인트를 <strong>Parameter Store</strong>에 저장하고, 애플리케이션은 연결 실패 시 Parameter Store에서 엔드포인트를 다시 로드합니다. 엔드포인트를 하드코딩하지 않아 자동 장애 조치가 가능합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — CloudTrail에서 SNS → Lambda로 복제본을 승격하는 방식은 자동화가 불완전합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — CloudTrail로 Lambda를 직접 트리거할 수 없습니다. EventBridge를 사용해야 합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — CloudFormation 템플릿 수정은 수동 개입이 필요하고 자동화하기 어렵습니다.</p>`,
  disc:[{ans:'D (100%)',txt:'교차 리전 Aurora DR 자동화 패턴: EventBridge(장애 감지) → Lambda(복제본 승격 + Parameter Store 업데이트) → 애플리케이션(연결 실패 시 Parameter Store에서 새 엔드포인트 로드).'}]
},
{
  n:45,
  en:`A company hosts its staging website using an Amazon EC2 instance backed with Amazon EBS storage. The company wants to recover quickly with minimal data losses in the event of network connectivity issues or power failures on the EC2 instance.<br><br><strong>Which solution will meet these requirements?</strong>`,
  ko:`한 회사가 Amazon EBS 스토리지로 백업된 Amazon EC2 인스턴스를 사용하여 스테이징 웹사이트를 호스팅합니다. 이 회사는 EC2 인스턴스에서 네트워크 연결 문제나 정전이 발생할 경우 최소한의 데이터 손실로 빠르게 복구하려고 합니다.<br><br><strong>어떤 솔루션이 이러한 요구 사항을 충족합니까?</strong>`,
  type:'single',
  choices:[
    {k:'A', en:`Add the instance to an EC2 Auto Scaling group with the minimum, maximum, and desired capacity set to 1.`, ko:`최소, 최대 및 원하는 용량을 1로 설정하여 EC2 Auto Scaling 그룹에 인스턴스를 추가합니다.`},
    {k:'B', en:`Add the instance to an EC2 Auto Scaling group with a lifecycle hook to detach the EBS volume when the EC2 instance shuts down or terminates.`, ko:`EC2 인스턴스가 종료되거나 종료될 때 EBS 볼륨을 분리하기 위해 라이프사이클 후크를 사용하여 EC2 Auto Scaling 그룹에 인스턴스를 추가합니다.`},
    {k:'C', en:`Create an Amazon CloudWatch alarm for the StatusCheckFailed System metric and select the EC2 action to recover the instance.`, ko:`StatusCheckFailed System 메트릭에 대한 Amazon CloudWatch 알람을 생성하고 인스턴스를 복구하기 위한 EC2 작업을 선택합니다.`},
    {k:'D', en:`Create an Amazon CloudWatch alarm for the StatusCheckFailed Instance metric and select the EC2 action to reboot the instance.`, ko:`StatusCheckFailed Instance 메트릭에 대한 Amazon CloudWatch 알람을 생성하고 EC2 작업을 선택하여 인스턴스를 재부팅합니다.`},
  ],
  answer:['C'],
  vote:'95% C',
  explain:`<p><span class="mark-ok">✅ C — StatusCheckFailed_System + CloudWatch EC2 복구 작업</span></p><p><strong>StatusCheckFailed_System</strong>은 AWS 기반 시스템(네트워크 연결, 시스템 전원, 물리 호스트 소프트웨어 등) 문제를 감지합니다. CloudWatch 알람의 <strong>"이 인스턴스 복구"</strong> EC2 작업을 설정하면 시스템 장애 발생 시 동일한 EBS 볼륨을 유지한 채 자동으로 인스턴스를 복구합니다. 데이터 손실이 최소화됩니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — Auto Scaling 그룹에 속한 인스턴스는 간소화된 자동 복구가 시작되지 않습니다. ASG는 손상된 인스턴스를 교체(새 인스턴스 시작)하므로 EBS 데이터가 손실될 수 있습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — StatusCheckFailed_Instance는 인스턴스 소프트웨어/설정 문제를 감지하며 재부팅만 수행합니다. 네트워크 연결 문제나 정전(시스템 레벨 문제)에는 적합하지 않습니다.</p>`,
  disc:[{ans:'C (95%)',txt:'EC2 인스턴스 복구 조건: EBS 백업 인스턴스, Auto Scaling 그룹에 속하지 않아야 함. 복구 후 동일한 인스턴스 ID, EIP, EBS 볼륨, 프라이빗 IP 유지. — AWS EC2 문서'}]
},
{
  n:46,
  en:`A company wants to use AWS development tools to replace its current bash deployment scripts. The company currently deploys a LAMP application to a group of Amazon EC2 instances behind an Application Load Balancer (ALB). During the deployments, the company unit tests the committed application, stops and starts services, unregisters and re-registers instances with the load balancer, and updates file permissions. The company wants to maintain the same deployment functionality through the shift to using AWS services.<br><br><strong>Which solution will meet these requirements?</strong>`,
  ko:`한 회사에서 AWS 개발 도구를 사용하여 현재 bash 배포 스크립트를 대체하려고 합니다. 이 회사는 현재 Application Load Balancer(ALB) 뒤에 있는 Amazon EC2 인스턴스 그룹에 LAMP 애플리케이션을 배포합니다. 배포 중에 회사는 커밋된 애플리케이션을 단위 테스트하고, 서비스를 중지하고 시작하고, 로드 밸런서에서 인스턴스를 등록 취소하고 다시 등록하고, 파일 권한을 업데이트합니다. 이 회사는 AWS 서비스 사용으로 전환하는 동안 동일한 배포 기능을 유지하려고 합니다.<br><br><strong>어떤 솔루션이 이러한 요구 사항을 충족합니까?</strong>`,
  type:'single',
  choices:[
    {k:'A', en:`Use AWS CodeBuild to test the application. Use bash scripts invoked by AWS CodeDeploy's appspec.yml file to restart services, and deregister and register instances with the ALB. Use the appspec.yml file to update file permissions without a custom script.`, ko:`AWS CodeBuild를 사용하여 애플리케이션을 테스트합니다. AWS CodeDeploy의 appspec.yml 파일에서 호출한 bash 스크립트를 사용하여 서비스를 다시 시작하고 ALB에 인스턴스를 등록 해제하고 등록합니다. appspec.yml 파일을 사용하여 사용자 지정 스크립트 없이 파일 권한을 업데이트합니다.`},
    {k:'B', en:`Use AWS CodePipeline to move the application from the AWS CodeCommit repository to AWS CodeDeploy. Use CodeDeploy's deployment group to test the application, unregister and re-register instances with the ALB, and restart services. Use the appspec.yml file to update file permissions without a custom script.`, ko:`AWS CodePipeline을 사용하여 AWS CodeCommit 리포지토리에서 AWS CodeDeploy로 애플리케이션을 이동합니다. CodeDeploy의 배포 그룹을 사용하여 애플리케이션을 테스트하고, ALB로 인스턴스를 등록 해제하고 다시 등록하고, 서비스를 다시 시작합니다. appspec.yml 파일을 사용하여 사용자 지정 스크립트 없이 파일 권한을 업데이트합니다.`},
    {k:'C', en:`Use AWS CodePipeline to move the application source code from the AWS CodeCommit repository to AWS CodeDeploy. Use CodeDeploy to test the application. Use CodeDeploy's appspec.yml file to restart services and update permissions without a custom script. Use AWS CodeBuild to unregister and re-register instances with the ALB.`, ko:`AWS CodePipeline을 사용하여 애플리케이션 소스 코드를 AWS CodeCommit 리포지토리에서 AWS CodeDeploy로 옮깁니다. CodeDeploy를 사용하여 애플리케이션을 테스트합니다. CodeDeploy의 appspec.yml 파일을 사용하여 서비스를 다시 시작하고 사용자 지정 스크립트 없이 권한을 업데이트합니다. AWS CodeBuild를 사용하여 ALB에 인스턴스를 등록 취소하고 다시 등록합니다.`},
    {k:'D', en:`Use AWS CodePipeline to trigger AWS CodeBuild to test the application. Use bash scripts invoked by AWS CodeDeploy's appspec.yml file to restart services. Unregister and re-register the instances in the AWS CodeDeploy deployment group with the ALB. Update the appspec.yml file to update file permissions without a custom script.`, ko:`AWS CodePipeline을 사용하여 AWS CodeBuild를 트리거하여 애플리케이션을 테스트합니다. AWS CodeDeploy의 appspec.yml 파일에서 호출한 bash 스크립트를 사용하여 서비스를 다시 시작합니다. ALB에서 AWS CodeDeploy 배포 그룹의 인스턴스를 등록 해제했다가 다시 등록합니다. 사용자 지정 스크립트 없이 파일 권한을 업데이트하려면 appspec.yml 파일을 업데이트합니다.`},
  ],
  answer:['D'],
  vote:'88% D',
  explain:`<p><span class="mark-ok">✅ D — CodePipeline → CodeBuild(테스트) → CodeDeploy(배포)</span></p><p>CodePipeline이 전체 파이프라인을 조율합니다. CodeBuild가 단위 테스트를 수행하고, CodeDeploy의 appspec.yml이 서비스 재시작·파일 권한 업데이트를 처리합니다. CodeDeploy 배포 그룹이 ALB와 연동하여 인스턴스 등록 해제/재등록을 자동으로 처리합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — CodePipeline 없이 CodeBuild → CodeDeploy 연결이 없으므로 파이프라인을 조율할 수 없습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B, C</span> — CodeCommit 저장소를 직접 CodeDeploy로 이동하는 것은 불가능합니다. CodeDeploy는 코드를 저장하지 않습니다. 또한 CodeDeploy가 애플리케이션을 테스트하는 것이 아닌 CodeBuild가 테스트해야 합니다.</p>`,
  disc:[{ans:'D (88%)',txt:'AWS LAMP 배포 모범 사례: CodePipeline(조율) → CodeBuild(테스트) → CodeDeploy(배포, appspec.yml로 서비스 관리, 배포 그룹으로 ALB 인스턴스 등록/해제).'}]
},
{
  n:47,
  en:`A company runs an application with an Amazon EC2 and on-premises configuration. A DevOps engineer needs to standardize patching across both environments. Company policy dictates that patching only happens during non-business hours.<br><br><strong>Which combination of actions will meet these requirements? (Choose three.)</strong>`,
  ko:`한 회사가 Amazon EC2와 온프레미스 구성으로 애플리케이션을 실행합니다. DevOps 엔지니어는 두 환경에서 패치를 표준화해야 합니다. 회사 정책에 따르면 패치는 비업무 시간에만 실행해야 합니다.<br><br><strong>이러한 요구 사항을 충족하는 작업 조합은 무엇입니까? (세 가지를 선택하세요.)</strong>`,
  type:'multi',
  multiCount:3,
  choices:[
    {k:'A', en:`Add the physical machines into AWS Systems Manager using Systems Manager Hybrid Activations.`, ko:`Systems Manager Hybrid Activations를 사용하여 물리적 머신을 AWS Systems Manager에 추가합니다.`},
    {k:'B', en:`Attach an IAM role to the EC2 instances, allowing them to be managed by AWS Systems Manager.`, ko:`EC2 인스턴스에 IAM 역할을 연결하여 AWS Systems Manager에서 관리할 수 있도록 합니다.`},
    {k:'C', en:`Create IAM access keys for the on-premises machines to interact with AWS Systems Manager.`, ko:`온프레미스 머신이 AWS Systems Manager와 상호 작용할 수 있도록 IAM 액세스 키를 생성합니다.`},
    {k:'D', en:`Run an AWS Systems Manager Automation document to patch the systems every hour.`, ko:`AWS Systems Manager Automation 문서를 실행하여 매시간 시스템에 패치를 적용합니다.`},
    {k:'E', en:`Use Amazon EventBridge scheduled events to schedule a patch window.`, ko:`Amazon EventBridge 예약된 이벤트를 사용하여 패치 창을 예약합니다.`},
    {k:'F', en:`Use AWS Systems Manager Maintenance Windows to schedule a patch window.`, ko:`AWS Systems Manager Maintenance Windows를 사용하여 패치 창을 예약합니다.`},
  ],
  answer:['A','B','F'],
