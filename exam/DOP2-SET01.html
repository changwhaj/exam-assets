<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS DOP-C02 | SET 01 (Q001~Q050)</title>
<style>
[data-theme="dark"] {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#222636; --border:#2e3347;
  --accent:#4f8ef7; --accent2:#38c9a0; --text:#e2e6f0; --text-muted:#7a83a0;
  --correct-bg:#112a22; --wrong-bg:#2a1111; --explain-bg:#1e2030;
  --hover-bg:#1e2236; --sel-bg:#1b2540;
}
[data-theme="light"] {
  --bg:#f0f2f8; --surface:#ffffff; --surface2:#f5f6fa; --border:#d0d5e8;
  --accent:#2e6fe0; --accent2:#1aaa7e; --text:#1a1d2e; --text-muted:#5a6280;
  --correct-bg:#e6faf4; --wrong-bg:#fde8e8; --explain-bg:#f0f2fa;
  --hover-bg:#eaf1ff; --sel-bg:#ddeaff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard','Noto Sans KR','Segoe UI',sans-serif;font-size:15px;line-height:1.75;min-height:100vh;transition:background .25s,color .25s;}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 60px;}

/* Topbar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.badge{background:linear-gradient(135deg,#4f8ef7,#38c9a0);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 12px;border-radius:20px;white-space:nowrap;}
.topbar-title{font-size:13px;color:var(--text-muted);flex:1;min-width:120px;}
.topbar-title strong{color:var(--text);font-size:15px;display:block;}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}

/* 문제 선택 콤보박스 */
.q-select-wrap{display:flex;align-items:center;gap:6px;}
.q-select-label{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.q-select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-weight:600;padding:5px 10px;cursor:pointer;outline:none;transition:border-color .2s;}
.q-select:focus,.q-select:hover{border-color:var(--accent);}
.q-select option.opt-correct{color:#1aaa7e;}
.q-select option.opt-wrong{color:#e05252;}

/* 상단 네비 버튼 + 문제 콤보 높이 통일 */
.topbar-right .btn-nav,
.topbar-right .q-select {
  height: 24px;
  padding: 0 14px;
  font-size: 13px;
}

/* 테마 버튼 */
.theme-btn{background:var(--surface2);border:1px solid var(--border);border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-muted);transition:border-color .2s,color .2s;white-space:nowrap;}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}

/* Progress */
.progress-bar{background:var(--surface2);border-radius:4px;height:6px;margin-bottom:20px;overflow:hidden;}
.progress-fill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:4px;transition:width .4s;}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:16px;transition:background .25s,border-color .25s;}

/* Lang Tabs */
.lang-tabs{display:flex;gap:8px;margin-bottom:20px;}
.lang-tab{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.04em;padding:5px 14px;transition:all .2s;}
.lang-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.lang-tab:hover:not(.active){border-color:var(--accent);color:var(--accent);}

/* Q Label */
.q-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-bottom:10px;}
.q-type-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:10px;margin-left:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);vertical-align:middle;}
.q-type-badge.multi{background:#ede9ff;color:#6d28d9;border-color:#c4b5fd;}
[data-theme="dark"] .q-type-badge.multi{background:#2a1f50;color:#a78bfa;border-color:#4c3a8c;}

/* Q Text */
.q-text{font-size:15px;color:var(--text);line-height:1.85;}
.q-text.en-text{
  font-size:14px;color:var(--text-muted);
  margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--border);
}
.q-text code{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:13px;font-family:'JetBrains Mono','Fira Code',monospace;color:var(--accent2);}

/* Choices */
.choices-section{margin-top:24px;}
.choices-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px;}
.choice{display:flex;align-items:flex-start;gap:14px;background:var(--surface2);border:2px solid var(--border);border-radius:10px;cursor:pointer;margin-bottom:10px;padding:14px 18px;transition:border-color .2s,background .2s;user-select:none;}
.choice:hover{border-color:var(--accent);background:var(--hover-bg);}
.choice.selected{border-color:var(--accent);background:var(--sel-bg);}
.choice.correct{border-color:#38c9a0!important;background:var(--correct-bg)!important;}
.choice.wrong{border-color:#f76f6f!important;background:var(--wrong-bg)!important;}
.choice.disabled{cursor:default;pointer-events:none;}
.choice-key{background:var(--border);border-radius:6px;color:var(--text);font-size:13px;font-weight:700;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:background .2s,color .2s;}
.choice.selected .choice-key{background:var(--accent);color:#fff;}
.choice.correct .choice-key{background:#38c9a0;color:#000;}
.choice.wrong .choice-key{background:#f76f6f;color:#fff;}
.choice-body{flex:1;}
.choice-text{font-size:14px;line-height:1.75;}
.choice-en{font-size:12px;color:var(--text-muted);margin-top:5px;display:none;font-style:italic;}
.result-icon{margin-left:auto;font-size:18px;flex-shrink:0;display:none;}
.choice.correct .result-icon,.choice.wrong .result-icon{display:block;}

/* Actions */
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center;}
.btn{border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.03em;padding:11px 24px;transition:opacity .2s,transform .1s;}
.btn:hover:not(:disabled){opacity:.88;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-nav{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:11px 18px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.hint-text{font-size:12px;color:var(--text-muted);margin-top:8px;min-height:18px;}

/* Review Panel */
.review-panel{display:none;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent2);border-radius:12px;padding:24px 28px;margin-bottom:16px;animation:fadeIn .35s ease;transition:background .25s;}
.review-panel.show{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.answer-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.answer-label{font-size:13px;color:var(--text-muted);}
.answer-badge{background:#38c9a0;color:#000;font-size:13px;font-weight:800;padding:4px 14px;border-radius:20px;}
.vote-badge{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);font-size:12px;padding:3px 10px;border-radius:20px;}
.vote-badge span{color:var(--accent);font-weight:700;}
.section-title{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent2);text-transform:uppercase;margin-bottom:10px;}
.explain-box{background:var(--explain-bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;font-size:14px;line-height:1.8;color:var(--text);}
.explain-box p{margin-bottom:8px;}
.explain-box p:last-child{margin-bottom:0;}
.mark-ok{color:#38c9a0;font-weight:700;}
.mark-no{color:#f76f6f;font-weight:600;}

/* Discussion */
.disc-toggle{background:transparent;border:1px dashed var(--border);border-radius:8px;color:var(--text-muted);cursor:pointer;font-size:13px;margin-top:8px;padding:9px 16px;width:100%;text-align:left;transition:border-color .2s,color .2s;}
.disc-toggle:hover{border-color:var(--accent);color:var(--accent);}
.disc-list{display:none;margin-top:10px;}
.disc-list.show{display:block;}
.disc-item{background:var(--surface2);border-left:3px solid var(--border);border-radius:0 6px 6px 0;font-size:13px;margin-bottom:8px;padding:10px 14px;color:var(--text-muted);line-height:1.7;}
.disc-ans{color:var(--accent);font-weight:700;font-size:12px;margin-bottom:3px;}

/* Bottom Nav */
.nav-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px;}
.nav-info{font-size:13px;color:var(--text-muted);text-align:center;flex:1;}

@media(max-width:600px){
  .card{padding:16px;}
  .btn{padding:10px 16px;font-size:13px;}
  .topbar{gap:8px;}
  .topbar-right{gap:6px;}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- Topbar -->
  <div class="topbar">
    <span class="badge">AWS DOP-C02</span>
    <div class="topbar-title">
      <strong>AWS Certified DevOps Engineer – Professional</strong>
      SET 01 · Q001~Q050 실전 학습
    </div>
    <div class="topbar-right">
      <!-- 상단 네비게이션 -->
      <button class="btn btn-nav" onclick="goQWithReset(curQ-1)" id="btn-prev-top">←</button>

      <!-- 문제 선택 콤보박스 -->
      <div class="q-select-wrap">
        <select class="q-select" id="q-select" onchange="goQWithReset(this.value-1)"></select>
      </div>
      <button class="btn btn-nav" onclick="goQWithReset(curQ+1)" id="btn-next-top">→</button>

      <!-- 테마 토글 -->
      <button class="theme-btn" onclick="toggleTheme()">
        <span id="theme-icon">☀️</span>
        <span id="theme-label">라이트</span>
      </button>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:5%"></div></div>

  <!-- Language Tabs -->
  <div class="lang-tabs">
    <button class="lang-tab active" onclick="setLang('ko',this)">한국어</button>
    <button class="lang-tab" onclick="setLang('both',this)">양국어</button>
  </div>

  <!-- Question Card -->
  <div class="card" id="q-card">
    <div class="q-label">
      문제 <span id="q-num-badge">001</span>
      <span id="q-type-badge" class="q-type-badge">단일 선택</span>
    </div>
    <!-- 한국어 문제 -->
    <div class="q-text" id="q-ko-text"></div>
    <!-- 영어 문제 (양국어 모드) -->
    <div class="q-text en-text" id="q-en-text"></div>

    <div class="choices-section">
      <div class="choices-label" id="choices-label">선택지</div>
      <div id="choices-container"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btn-review" onclick="doReview()" disabled>📋 정답 확인</button>
      <button class="btn btn-secondary" onclick="doReset()">↺ 초기화</button>
    </div>
    <div class="hint-text" id="hint-text">선택지를 클릭하면 정답 확인 버튼이 활성화됩니다.</div>
  </div>

  <!-- Review Panel -->
  <div class="review-panel" id="review-panel">
    <div class="answer-row">
      <span class="answer-label">정답</span>
      <span class="answer-badge" id="review-answer-badge"></span>
      <span class="vote-badge" id="review-vote-badge"></span>
    </div>
    <div class="section-title">✦ 정답 해설</div>
    <div class="explain-box" id="review-explain"></div>
    <div class="section-title" style="margin-top:14px;" id="wrong-section-title">✦ 오답 분석</div>
    <div class="explain-box" id="review-wrong"></div>
    <button class="disc-toggle" onclick="document.getElementById('disc-list').classList.toggle('show')">💬 주요 토론 의견 보기 / 숨기기</button>
    <div class="disc-list" id="disc-list"></div>
  </div>

  <!-- Bottom Nav -->
  <!-- <div class="nav-bottom">
    <button class="btn btn-nav" onclick="goQ(curQ-1)" id="btn-prev">← 이전</button>
    <span class="nav-info" id="nav-info"></span>
    <button class="btn btn-nav" onclick="goQ(curQ+1)" id="btn-next">다음 →</button>
  </div> -->

</div>
<script>
const QS = [
{
  n:1,
  ko:`한 회사의 모바일 애플리케이션은 ALB(Application Load Balancer)로 HTTP API를 호출합니다. ALB는 요청을 AWS Lambda 함수로 라우팅합니다. 테스트 중인 버전을 포함하여 언제든지 여러 버전의 애플리케이션이 동시에 사용됩니다. 애플리케이션 버전은 API 요청마다 전송되는 <code>user-agent</code> 헤더에 정의되어 있습니다.<br><br>최근 API에 대한 일련의 변경 이후, 회사는 애플리케이션에서 문제가 발생하고 있음을 확인했습니다. 회사는 현재 사용 중인 <strong>각 애플리케이션 버전별로, 응답 코드와 함께 각 API 작업에 대한 메트릭을 수집</strong>해야 합니다. DevOps 엔지니어는 이미 Lambda 함수를 수정하여 API 작업 이름, <code>user-agent</code> 헤더의 버전 정보, 응답 코드를 추출하도록 했습니다.<br><br><strong>필요한 메트릭을 수집하기 위해 DevOps 엔지니어가 추가로 수행해야 할 작업은 무엇입니까?</strong>`,
  en:`A company has a mobile application that makes HTTP API calls to an Application Load Balancer (ALB). The ALB routes requests to an AWS Lambda function. Many different versions of the application are in use at any given time, including versions that are in testing by a subset of users. The version of the application is defined in the user-agent header that is sent with all requests to the API.<br><br>After a series of recent changes to the API, the company has observed issues with the application. The company needs to gather a metric for each API operation by response code for each version of the application that is in use. A DevOps engineer has modified the Lambda function to extract the API operation name, version information from the user-agent header and response code.<br><br><strong>Which additional set of actions should the DevOps engineer take to gather the required metrics?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`Lambda 함수를 수정하여 API 작업 이름, 응답 코드, 버전 번호를 Amazon CloudWatch Logs 로그 그룹에 로그 라인으로 기록합니다. 각 API 작업 이름마다 메트릭을 증가시키는 <strong>CloudWatch Logs 메트릭 필터</strong>를 구성합니다. 메트릭의 차원(dimension)으로 응답 코드와 애플리케이션 버전을 지정합니다.`, en:`Modify the Lambda function to write the API operation name, response code, and version number as a log line to an Amazon CloudWatch Logs log group. Configure a CloudWatch Logs metric filter that increments a metric for each API operation name. Specify response code and application version as dimensions for the metric.`},
    {k:'B', ko:`Lambda 함수를 수정하여 API 작업 이름, 응답 코드, 버전 번호를 Amazon CloudWatch Logs 로그 그룹에 로그 라인으로 기록합니다. <strong>CloudWatch Logs Insights 쿼리</strong>를 구성하여 로그 라인으로부터 CloudWatch 메트릭을 채웁니다. 메트릭의 차원으로 응답 코드와 애플리케이션 버전을 지정합니다.`, en:`Modify the Lambda function to write the API operation name, response code, and version number as a log line to an Amazon CloudWatch Logs log group. Configure a CloudWatch Logs Insights query to populate CloudWatch metrics from the log lines. Specify response code and application version as dimensions for the metric.`},
    {k:'C', ko:`<strong>ALB 액세스 로그</strong>를 Amazon CloudWatch Logs 로그 그룹에 기록하도록 구성합니다. Lambda 함수를 수정하여 API 작업 이름, 응답 코드, 버전 번호를 응답 메타데이터로 포함해 ALB에 반환합니다. 각 API 작업 이름마다 메트릭을 증가시키는 CloudWatch Logs 메트릭 필터를 구성합니다. 메트릭의 차원으로 응답 코드와 애플리케이션 버전을 지정합니다.`, en:`Configure the ALB access logs to write to an Amazon CloudWatch Logs log group. Modify the Lambda function to respond to the ALB with the API operation name, response code, and version number as response metadata. Configure a CloudWatch Logs metric filter. Specify response code and application version as dimensions for the metric.`},
    {k:'D', ko:`Lambda 함수에 <strong>AWS X-Ray 통합</strong>을 구성합니다. Lambda 함수를 수정하여 API 작업 이름, 응답 코드, 버전 번호로 X-Ray 서브 세그먼트를 생성합니다. X-Ray Insights를 구성하여 각 API 작업 이름에 대한 집계 메트릭을 추출하고 Amazon CloudWatch에 게시합니다.`, en:`Configure AWS X-Ray integration on the Lambda function. Modify the Lambda function to create an X-Ray subsegment with the API operation name, response code, and version number. Configure X-Ray insights to extract an aggregated metric for each API operation name and to publish the metric to Amazon CloudWatch.`},
  ],
  answer:['A'],
  vote:'87% A',
  explain:`<p><span class="mark-ok">✅ A — CloudWatch Logs 메트릭 필터</span></p><p>Lambda 함수에서 CloudWatch Logs에 로그 라인을 기록하고, <strong>메트릭 필터(Metric Filter)</strong>로 패턴을 자동 파싱해 메트릭을 생성하는 것은 AWS 공식 권장 패턴입니다. API 작업 이름을 메트릭으로, 응답 코드와 애플리케이션 버전을 <strong>차원(Dimension)</strong>으로 지정하면 버전별·코드별 세분화 메트릭을 실시간 자동 수집할 수 있습니다. 추가 인프라 불필요, 구현 간단, 알람·Lambda 트리거·이상 탐지까지 연동 가능합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — Logs Insights는 대화형 임시 분석 도구로, 쿼리 결과를 CloudWatch 메트릭으로 자동 게시하는 기능이 없습니다.</p><p style="margin-top:10px;"><span class="mark-no">❌ C</span> — ALB 액세스 로그는 S3에 기록되며 CloudWatch Logs로 직접 스트리밍되지 않습니다.</p><p style="margin-top:10px;"><span class="mark-no">❌ D</span> — X-Ray는 분산 추적 목적 도구로 커스텀 차원 메트릭을 CloudWatch로 게시하는 직접 경로가 없습니다.</p>`,
  disc:[{ans:'A (높은 추천)',txt:'메트릭 필터는 Insights 쿼리와 달리 자동으로 시계열 메트릭 데이터를 생성하여 알람, Lambda 실행, 이상 탐지 모델 연동이 가능합니다. — AWS Blog'}]
},
{
  n:2,
  ko:`한 회사의 모바일 애플리케이션은 Amazon API Gateway REST API를 통해 AWS Lambda 함수를 호출합니다. Lambda 함수는 초기화 시 DynamoDB 테이블에서 대량의 데이터를 로드하여 <strong>8~10초의 콜드 스타트</strong> 시간이 발생합니다. DynamoDB 테이블에는 DAX가 구성되어 있습니다.<br><br>애플리케이션은 하루 종일 수천 개의 요청을 받으며, 정오에는 평소보다 10배 많은 트래픽이 발생하고, 하루 말에는 10%로 감소합니다.<br><br><strong>하루 종일 Lambda 함수의 지연 시간을 줄이기 위한 솔루션은 무엇입니까?</strong>`,
  en:`A company provides an application that has an Amazon API Gateway REST API invoking an AWS Lambda function. On initialization, the Lambda function loads a large amount of data from DynamoDB causing long cold-start times of 8–10 seconds. The application experiences 10x more requests midday and drops to 10% near end of day.<br><br><strong>Which solution will reduce Lambda latency at all times of the day?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`Lambda 함수에서 <strong>프로비저닝된 동시성</strong>을 동시성 값 1로 구성합니다. DynamoDB 테이블의 DAX 클러스터를 삭제합니다.`, en:`Configure provisioned concurrency on the Lambda function with a concurrency value of 1. Delete the DAX cluster for the DynamoDB table.`},
    {k:'B', ko:`Lambda 함수에서 <strong>예약된 동시성</strong>을 동시성 값 0으로 구성합니다.`, en:`Configure reserved concurrency on the Lambda function with a concurrency value of 0.`},
    {k:'C', ko:`Lambda 함수에서 <strong>프로비저닝된 동시성</strong>을 구성합니다. Lambda 함수에서 AWS Application Auto Scaling을 프로비저닝된 동시성 <strong>최솟값 1, 최댓값 100</strong>으로 구성합니다.`, en:`Configure provisioned concurrency on the Lambda function. Configure AWS Application Auto Scaling on the Lambda function with provisioned concurrency values set to a minimum of 1 and a maximum of 100.`},
    {k:'D', ko:`Lambda 함수에서 <strong>예약된 동시성</strong>을 구성합니다. API Gateway API에서 예약된 동시성 최댓값 100으로 AWS Application Auto Scaling을 구성합니다.`, en:`Configure reserved concurrency on the Lambda function. Configure AWS Application Auto Scaling on the API Gateway API with a reserved concurrency maximum value of 100.`},
  ],
  answer:['C'],
  vote:'100% C',
  explain:`<p><span class="mark-ok">✅ C — 프로비저닝된 동시성 + Application Auto Scaling</span></p><p><strong>프로비저닝된 동시성(Provisioned Concurrency)</strong>은 Lambda 인스턴스를 미리 초기화된 상태로 유지해 콜드 스타트를 제거합니다. 여기에 Application Auto Scaling을 최솟값 1 / 최댓값 100으로 설정하면 정오의 트래픽 급증에는 스케일 아웃, 하루 말 저트래픽 시에는 스케일 인하여 비용을 최적화할 수 있습니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — 동시성 1만으로는 트래픽 급증 대응 불가, DAX 삭제는 성능 저하.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — 예약된 동시성 0은 Lambda 실행 자체를 차단합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — API Gateway에는 Auto Scaling이 직접 적용되지 않습니다.</p>`,
  disc:[{ans:'C (100%)',txt:'프로비저닝된 동시성은 미리 초기화된 인스턴스를 준비 상태로 유지하여 콜드 스타트를 방지합니다. Auto Scaling으로 수요 변화에 동적으로 대응할 수 있습니다.'}]
},
{
  n:3,
  ko:`한 회사가 AWS CodeDeploy를 사용하여 Java-Apache Tomcat 애플리케이션 배포를 자동화하고 있습니다. 팀은 개발/스테이징/프로덕션 3개 배포 그룹을 만들었으며, 배포 시 Apache 로그 수준을 배포 그룹에 따라 <strong>동적으로 변경</strong>하려 합니다.<br><br><strong>각 배포 그룹에 다른 스크립트 버전 없이, 최소 관리 오버헤드로 요구 사항을 충족하는 방법은 무엇입니까?</strong>`,
  en:`A company uses AWS CodeDeploy for a Java-Apache Tomcat application. The team wants to set different Apache log level configurations per deployment group (dev/staging/prod) without requiring different application revisions per group.<br><br><strong>How can these requirements be met with LEAST management overhead?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`배포 그룹에 따라 EC2 인스턴스에 태그를 지정합니다. 메타데이터 서비스와 EC2 API를 호출하여 배포 그룹을 식별하는 스크립트를 작성합니다. appspec.yml의 <strong>AfterInstall</strong> 후크에서 참조합니다.`, en:`Tag the Amazon EC2 instances depending on the deployment group. Place a script that calls the metadata service and the EC2 API to identify the deployment group. Reference the script as part of the AfterInstall lifecycle hook.`},
    {k:'B', ko:`CodeDeploy 환경 변수 <code>DEPLOYMENT_GROUP_NAME</code>을 사용하여 배포 그룹을 식별하는 스크립트를 만듭니다. appspec.yml의 <strong>BeforeInstall</strong> 후크에서 참조합니다.`, en:`Create a script that uses the CodeDeploy environment variable DEPLOYMENT_GROUP_NAME to identify the deployment group. Reference this script as part of the BeforeInstall lifecycle hook in the appspec.yml file.`},
    {k:'C', ko:`각 환경에 대한 CodeDeploy <strong>사용자 지정 환경 변수</strong>를 만들어 배포 그룹을 식별하는 스크립트를 작성합니다. appspec.yml의 <strong>ValidateService</strong> 후크에서 참조합니다.`, en:`Create a CodeDeploy custom environment variable for each environment. Place a script that checks this variable to identify the deployment group. Reference this script as part of the ValidateService lifecycle hook.`},
    {k:'D', ko:`CodeDeploy 환경 변수 <code>DEPLOYMENT_GROUP_ID</code>를 사용하여 로그 수준을 설정하는 스크립트를 만듭니다. appspec.yml의 <strong>Install</strong> 후크에서 참조합니다.`, en:`Create a script that uses the CodeDeploy environment variable DEPLOYMENT_GROUP_ID to configure the log level settings. Reference this script as part of the Install lifecycle hook in the appspec.yml file.`},
  ],
  answer:['B'],
  vote:'73% B',
  explain:`<p><span class="mark-ok">✅ B — DEPLOYMENT_GROUP_NAME + BeforeInstall</span></p><p>CodeDeploy는 <code>DEPLOYMENT_GROUP_NAME</code> 내장 환경 변수를 제공합니다. 이를 스크립트에서 읽어 배포 그룹에 따라 Apache 로그 수준을 설정하면 단일 스크립트로 모든 환경을 처리할 수 있습니다. <strong>BeforeInstall</strong>은 애플리케이션 파일 설치 전에 실행되므로 로그 수준을 미리 설정하기에 적합합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A, C</span> — "애플리케이션 개정판에 스크립트를 배치"한다는 의미로 각 그룹마다 다른 개정판이 필요해져 요구사항에 위배됩니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — <strong>Install 라이프사이클 후크는 스크립트 실행이 불가</strong>합니다. (AWS 공식 문서 명시)</p>`,
  disc:[{ans:'B (높은 추천)',txt:'AWS 블로그의 예제가 정확히 이 시나리오를 다룹니다: DEPLOYMENT_GROUP_NAME으로 Staging 여부를 확인하여 httpd.conf의 로그 수준을 변경합니다. BeforeInstall 후크에서 실행합니다.'}]
},
{
  n:4,
  ko:`한 회사는 개발자가 모든 Amazon EBS 볼륨에 <code>Backup_Frequency</code> 태그(값: none / daily / weekly)를 붙이도록 요구합니다. 감사 결과 개발자가 종종 태그를 누락합니다.<br><br>DevOps 엔지니어는 모든 EBS 볼륨에 <strong>항상</strong> <code>Backup_Frequency</code> 태그가 있도록 보장하고, 누락 시 자동으로 <strong>weekly</strong> 값을 설정해야 합니다.<br><br><strong>요구 사항을 충족하는 솔루션은 무엇입니까?</strong>`,
  en:`A company requires developers to tag all EBS volumes with a Backup_Frequency tag (values: none/daily/weekly). An audit finds developers occasionally don't tag EBS volumes. A DevOps engineer must ensure all EBS volumes always have the tag, auto-applying weekly as default.<br><br><strong>Which solution will meet these requirements?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`AWS Config를 설정합니다. <code>Backup_Frequency</code> 태그가 없는 모든 Amazon EC2 리소스에 규정 위반을 반환하는 <strong>사용자 지정 규칙</strong>을 만듭니다. 사용자 지정 SSM Automation 런북으로 weekly 태그를 적용하는 수정 작업을 구성합니다.`, en:`Set up AWS Config. Create a custom rule that returns a compliance failure for all Amazon EC2 resources without the Backup_Frequency tag. Configure a remediation action using a custom SSM Automation runbook to apply the tag with a value of weekly.`},
    {k:'B', ko:`AWS Config를 설정합니다. <code>Backup_Frequency</code> 태그가 없는 <strong>EC2::Volume 리소스</strong>에 규정 위반을 반환하는 <strong>관리형 규칙</strong>을 사용합니다. 사용자 지정 SSM Automation 런북으로 weekly 태그를 적용하는 수정 작업을 구성합니다.`, en:`Set up AWS Config. Use a managed rule that returns a compliance failure for EC2::Volume resources without the Backup_Frequency tag. Configure a remediation action using a custom SSM Automation runbook to apply the tag with a value of weekly.`},
    {k:'C', ko:`AWS CloudTrail을 활성화합니다. EBS <strong>CreateVolume</strong> 이벤트에 반응하는 Amazon EventBridge 규칙을 만듭니다. 사용자 지정 SSM Automation 런북으로 weekly 태그를 적용합니다.`, en:`Turn on AWS CloudTrail. Create an Amazon EventBridge rule that reacts to EBS CreateVolume events. Configure a custom SSM Automation runbook to apply the Backup_Frequency tag with a value of weekly.`},
    {k:'D', ko:`AWS CloudTrail을 활성화합니다. EBS <strong>CreateVolume 또는 ModifyVolume</strong> 이벤트에 반응하는 Amazon EventBridge 규칙을 만듭니다. 사용자 지정 SSM Automation 런북으로 weekly 태그를 적용합니다.`, en:`Turn on AWS CloudTrail. Create an Amazon EventBridge rule that reacts to EBS CreateVolume or EBS ModifyVolume events. Configure a custom SSM Automation runbook to apply the Backup_Frequency tag with a value of weekly.`},
  ],
  answer:['B'],
  vote:'95% B',
  explain:`<p><span class="mark-ok">✅ B — AWS Config 관리형 규칙 + SSM Automation</span></p><p>AWS Config의 관리형 규칙(required-tags)은 <strong>EC2::Volume 리소스</strong>에만 정확하게 적용할 수 있습니다. 관리형 규칙을 사용하면 사용자 지정 규칙 개발이 불필요합니다. 규정 위반 시 사용자 지정 SSM Automation 런북으로 weekly 태그를 자동 적용하는 수정 작업을 설정합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — 모든 EC2 리소스(인스턴스, ELB, EIP 등)에 적용되어 범위가 불필요하게 넓어집니다. EBS 볼륨만 대상으로 해야 합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C, D</span> — CloudTrail + EventBridge는 생성/수정 시점에만 반응하며, <strong>기존에 태그 없는 볼륨을 수정하지 못합니다.</strong></p>`,
  disc:[{ans:'B (95%)',txt:'AWS Config managed rule과 custom SSM 런북 조합이 권장 방식입니다. C/D의 CloudTrail 접근법은 기존 볼륨을 처리할 수 없습니다.'}]
},
{
  n:5,
  ko:`한 회사가 단일 DB 인스턴스로 구성된 Amazon Aurora 클러스터를 사용합니다. 애플리케이션은 클러스터의 <strong>인스턴스 엔드포인트</strong>로 읽기/쓰기 작업을 수행합니다.<br><br>다가오는 유지 관리 기간 동안 <strong>가능한 한 최소한의 중단</strong>으로 클러스터를 사용 가능하게 유지해야 합니다.<br><br><strong>DevOps 엔지니어는 무엇을 해야 합니까?</strong>`,
  en:`A company uses an Amazon Aurora cluster configured with a single DB instance. The application uses the cluster's instance endpoint for reads and writes. An update is scheduled for an upcoming maintenance window. The cluster must remain available with the least possible interruption.<br><br><strong>What should a DevOps engineer do?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`Aurora 클러스터에 <strong>리더 인스턴스</strong>를 추가합니다. 쓰기 작업에 Aurora <strong>클러스터 엔드포인트</strong>를 사용하도록 애플리케이션을 업데이트합니다. 읽기에 Aurora <strong>리더 엔드포인트</strong>를 사용합니다.`, en:`Add a reader instance to the Aurora cluster. Update the application to use the Aurora cluster endpoint for write operations and the reader endpoint for reads.`},
    {k:'B', ko:`Aurora 클러스터에 리더 인스턴스를 추가합니다. 클러스터에 대한 <strong>사용자 지정 ANY 엔드포인트</strong>를 만들어 읽기/쓰기 모두에 사용합니다.`, en:`Add a reader instance to the Aurora cluster. Create a custom ANY endpoint. Update the application to use the Aurora cluster's custom ANY endpoint for reads and writes.`},
    {k:'C', ko:`Aurora 클러스터에서 <strong>Multi-AZ 옵션을 켭니다.</strong> 쓰기에 클러스터 엔드포인트, 읽기에 리더 엔드포인트를 사용하도록 업데이트합니다.`, en:`Turn on the Multi-AZ option on the Aurora cluster. Update the application to use the Aurora cluster endpoint for writes and the reader endpoint for reads.`},
    {k:'D', ko:`Aurora 클러스터에서 <strong>Multi-AZ 옵션을 켭니다.</strong> 클러스터에 대한 사용자 지정 ANY 엔드포인트를 만들어 읽기/쓰기 모두에 사용합니다.`, en:`Turn on the Multi-AZ option on the Aurora cluster. Create a custom ANY endpoint for reads and writes.`},
  ],
  answer:['A'],
  vote:'77% A',
  explain:`<p><span class="mark-ok">✅ A — 리더 인스턴스 추가 + 클러스터/리더 엔드포인트</span></p><p>Aurora의 리더 인스턴스를 추가하면 기본 인스턴스에 업데이트가 적용될 때 리더 인스턴스가 자동으로 새 기본 인스턴스로 승격됩니다. <strong>클러스터 엔드포인트</strong>는 항상 현재 기본 인스턴스를 가리키므로 장애 조치 시 자동으로 재라우팅되고, <strong>리더 엔드포인트</strong>는 읽기 트래픽을 분산합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ C, D</span> — Aurora는 기존 클러스터 생성 후 별도의 Multi-AZ 옵션 토글이 없습니다. 리더 인스턴스를 다른 AZ에 추가하는 것이 Multi-AZ를 구현하는 방법입니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — 사용자 지정 ANY 엔드포인트는 읽기/쓰기를 구분하지 않아 쓰기가 리더 인스턴스로 전달될 위험이 있습니다.</p>`,
  disc:[{ans:'A (높은 추천)',txt:'리더 인스턴스 추가가 기존 Aurora 클러스터를 Multi-AZ로 만드는 방법입니다. — AWS 공식 문서'}]
},
{
  n:6,
  ko:`회사는 계정 간 공유하는 모든 AMI를 암호화해야 합니다. DevOps 엔지니어는 소스 계정의 암호화되지 않은 사용자 지정 AMI를 대상 계정(EC2 Auto Scaling 그룹이 있음)과 공유해야 합니다. 소스 계정에 AWS KMS 키가 생성되어 있습니다.<br><br><strong>요구 사항을 충족하기 위해 수행해야 할 추가 단계 3가지는 무엇입니까?</strong>`,
  en:`A company must encrypt all AMIs shared across accounts. A DevOps engineer has access to a source account with an unencrypted custom AMI and a target account where an EC2 Auto Scaling group will launch EC2 instances. A KMS key exists in the source account.<br><br><strong>Which additional steps should the DevOps engineer perform? (Choose three.)</strong>`,
  type:'multi',
  multiCount:3,
  choices:[
    {k:'A', ko:`소스 계정에서 암호화되지 않은 AMI를 <strong>암호화된 AMI로 복사</strong>합니다. 복사 작업에서 <strong>KMS 키</strong>를 지정합니다.`, en:`In the source account, copy the unencrypted AMI to an encrypted AMI. Specify the KMS key in the copy action.`},
    {k:'B', ko:`소스 계정에서 암호화되지 않은 AMI를 암호화된 AMI로 복사합니다. 복사 작업에서 <strong>기본 EBS 암호화 키</strong>를 지정합니다.`, en:`In the source account, copy the unencrypted AMI to an encrypted AMI. Specify the default Amazon EBS encryption key in the copy action.`},
    {k:'C', ko:`소스 계정에서 대상 계정의 Auto Scaling 그룹 서비스 연결 역할에 권한을 위임하는 <strong>KMS 권한 부여</strong>를 만듭니다.`, en:`In the source account, create a KMS grant that delegates permissions to the Auto Scaling group service-linked role in the target account.`},
    {k:'D', ko:`소스 계정에서 <strong>키 정책을 수정</strong>하여 대상 계정에 권한 부여 생성 권한을 부여합니다. 대상 계정에서 Auto Scaling 그룹 서비스 연결 역할에 권한을 위임하는 <strong>KMS 권한 부여</strong>를 생성합니다.`, en:`In the source account, modify the key policy to give the target account permissions to create a grant. In the target account, create a KMS grant that delegates permissions to the Auto Scaling group service-linked role.`},
    {k:'E', ko:`소스 계정에서 <strong>암호화되지 않은 AMI</strong>를 대상 계정과 공유합니다.`, en:`In the source account, share the unencrypted AMI with the target account.`},
    {k:'F', ko:`소스 계정에서 <strong>암호화된 AMI</strong>를 대상 계정과 공유합니다.`, en:`In the source account, share the encrypted AMI with the target account.`},
  ],
  answer:['A','D','F'],
  vote:'96% ADF',

{
  n:7,
  ko:`한 회사가 AWS CodePipeline(빌드/테스트/배포 3단계)을 사용하여 애플리케이션 릴리스를 자동화합니다. 애플리케이션은 <strong>RPM 패키지</strong>로 패키징되어 있으며 EC2 Auto Scaling 그룹에 배포해야 합니다. 이제 배포 단계에 AWS CodeDeploy를 사용하려 합니다.<br><br><strong>DevOps 엔지니어가 수행해야 할 단계 2가지는 무엇입니까?</strong>`,
  en:`A company uses AWS CodePipeline (build/test/deploy stages) to automate releases. The application is packaged as an RPM and must be deployed to an EC2 Auto Scaling group. The company now wants to use AWS CodeDeploy for the deployment stage.<br><br><strong>Which combination of steps should the DevOps engineer perform? (Choose two.)</strong>`,
  type:'multi',
  multiCount:2,
  choices:[

    {k:'B', ko:`CodeDeploy 에이전트가 설치된 공통 AMI의 새 버전을 만듭니다. 애플리케이션 배포 스크립트를 포함하고 CodeDeploy에 대한 액세스 권한을 부여하는 <strong>AppSpec 파일</strong>을 만듭니다.`, en:`Create a new version of the common AMI with the CodeDeploy agent installed. Create an AppSpec file that contains application deployment scripts and grants access to CodeDeploy.`},
    {k:'C', ko:`CodeDeploy에서 애플리케이션을 만듭니다. 인플레이스 배포를 구성합니다. Auto Scaling 그룹을 배포 대상으로 지정합니다. <strong>EC2 Image Builder</strong>를 사용하여 새 AMI를 만드는 파이프라인 단계를 추가합니다.`, en:`Create an application in CodeDeploy. Configure an in-place deployment type. Specify the Auto Scaling group as target. Add a step to use EC2 Image Builder to create a new AMI. Configure CodeDeploy to deploy the new AMI.`},
    {k:'D', ko:`CodeDeploy에서 애플리케이션을 만듭니다. 인플레이스 배포를 구성합니다. <strong>Auto Scaling 그룹</strong>을 배포 대상으로 지정합니다. CodePipeline 파이프라인을 업데이트하여 <strong>CodeDeploy 작업</strong>을 사용하여 애플리케이션을 배포합니다.`, en:`Create an application in CodeDeploy. Configure an in-place deployment type. Specify the Auto Scaling group as the deployment target. Update the CodePipeline pipeline to use the CodeDeploy action to deploy the application.`},
    {k:'E', ko:`CodeDeploy에서 애플리케이션을 만듭니다. 인플레이스 배포를 구성합니다. 공통 AMI에서 시작된 <strong>개별 EC2 인스턴스</strong>를 배포 대상으로 지정합니다. CodePipeline을 업데이트하여 CodeDeploy 작업을 사용합니다.`, en:`Create an application in CodeDeploy. Configure an in-place deployment type. Specify the EC2 instances launched from the common AMI as the deployment target. Update the CodePipeline pipeline to use the CodeDeploy action.`},
  ],

  vote:'100% AD',
  explain:`<p><span class="mark-ok">✅ A</span>: EC2 인스턴스에 <strong>CodeDeploy 에이전트</strong>가 설치되어 있어야 합니다. 에이전트가 CodeDeploy 서비스와 통신하려면 IAM 역할(인스턴스 프로필)에 적절한 권한이 필요합니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ D</span>: CodeDeploy에서 인플레이스 배포를 만들고, <strong>Auto Scaling 그룹을 대상</strong>으로 지정한 후 CodePipeline에 CodeDeploy 작업을 추가합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — AppSpec 파일은 CodeDeploy에 대한 권한을 부여할 수 없습니다. 권한은 IAM 역할로 관리합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — RPM 배포 시마다 새 AMI를 만드는 것은 불필요한 복잡성입니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ E</span> — ASG가 대상인 경우 개별 인스턴스가 아닌 Auto Scaling 그룹을 대상으로 해야 합니다.</p>`,

{
  n:8,
  ko:`한 회사의 보안 팀은 모든 외부 ALB와 Amazon API Gateway API가 <strong>AWS WAF 웹 ACL</strong>과 연결되어야 한다고 요구합니다. 이 회사는 단일 AWS Organizations 조직에 수백 개의 계정을 가지고 있으며 AWS Config가 구성되어 있습니다. 감사 중 AWS WAF 웹 ACL이 연결되지 않은 외부 ALB가 발견되었습니다.<br><br><strong>향후 위반을 방지하기 위한 단계 2가지는 무엇입니까?</strong>`,
  en:`A company's security team requires all external ALBs and API Gateway APIs to be associated with AWS WAF web ACLs. The company has hundreds of AWS accounts in a single AWS Organizations organization with AWS Config configured. An audit finds some external ALBs not associated with WAF web ACLs.<br><br><strong>Which combination of steps should prevent future violations? (Choose two.)</strong>`,

{
  n:9,
  ko:`한 회사가 AWS KMS 키와 <strong>수동 키 로테이션</strong>을 사용하여 규정 준수 요건을 충족합니다. 보안 팀은 <strong>90일 후에도 키가 로테이션되지 않은 경우</strong> 알림을 받고 싶어합니다.<br><br><strong>이를 달성할 솔루션은 무엇입니까?</strong>`,
  en:`A company uses AWS KMS keys and manual key rotation to meet regulatory compliance requirements. The security team wants to be notified when any keys have not been rotated after 90 days.<br><br><strong>Which solution will accomplish this?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`AWS KMS를 구성하여 키가 90일 이상 지난 경우 Amazon SNS 토픽에 게시합니다.`, en:`Configure AWS KMS to publish to an Amazon SNS topic when keys are more than 90 days old.`},
    {k:'B', ko:`Amazon EventBridge 이벤트를 구성하여 AWS Lambda 함수를 시작하고 AWS Trusted Advisor API를 호출한 후 Amazon SNS 토픽에 게시합니다.`, en:`Configure an Amazon EventBridge event to launch an AWS Lambda function to call the AWS Trusted Advisor API and publish to an Amazon SNS topic.`},
    {k:'C', ko:`키가 90일 이상 경과한 경우 Amazon SNS 토픽에 게시하는 <strong>AWS Config 사용자 지정 규칙</strong>을 개발합니다.`, en:`Develop an AWS Config custom rule that publishes to an Amazon SNS topic when keys are more than 90 days old.`},
    {k:'D', ko:`키가 90일 이상 경과한 경우 Amazon SNS 토픽에 게시하도록 AWS Security Hub를 구성합니다.`, en:`Configure AWS Security Hub to publish to an Amazon SNS topic when keys are more than 90 days old.`},
  ],

  vote:'100% C',

  disc:[{ans:'C',txt:'KMS는 직접 SNS 게시 기능이 없고, Trusted Advisor도 KMS 키 로테이션 체크가 없습니다. Config 사용자 지정 규칙으로 구현해야 합니다.'}]

{
  n:10,
  ko:`보안 검토에서 AWS CodeBuild 프로젝트가 Amazon S3 버킷에서 데이터베이스 채우기 스크립트를 <strong>인증되지 않은 요청</strong>으로 다운로드하고 있다는 사실이 확인되었습니다. 보안 팀은 이를 허용하지 않습니다.<br><br><strong>가장 안전한 방식으로 이 문제를 수정하는 방법은 무엇입니까?</strong>`,
  en:`A security review identified that an AWS CodeBuild project downloads a database population script from an Amazon S3 bucket using an unauthenticated request. The security team does not allow unauthenticated requests to S3 buckets for this project.<br><br><strong>How can this issue be corrected in the MOST secure manner?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`CodeBuild 프로젝트 설정의 AllowedBuckets 섹션에 버킷 이름을 추가합니다. AWS CLI를 사용하여 데이터베이스 채우기 스크립트를 다운로드하도록 빌드 스펙을 업데이트합니다.`, en:`Add the bucket name to the AllowedBuckets section of the CodeBuild project settings. Update the build spec to use the AWS CLI to download the script.`},
    {k:'B', ko:`S3 버킷 설정을 수정하여 HTTPS 기본 인증을 활성화하고 토큰을 지정합니다. 빌드 스펙을 업데이트하여 cURL로 토큰을 전달해 스크립트를 다운로드합니다.`, en:`Modify the S3 bucket settings to enable HTTPS basic authentication and specify a token. Update the build spec to use cURL to pass the token and download the script.`},
    {k:'C', ko:`버킷 정책을 사용하여 S3 버킷에서 <strong>인증되지 않은 액세스를 제거</strong>합니다. CodeBuild 프로젝트의 <strong>서비스 역할</strong>을 수정하여 Amazon S3 액세스를 포함합니다. AWS CLI를 사용하여 데이터베이스 채우기 스크립트를 다운로드합니다.`, en:`Remove unauthenticated access from the S3 bucket with a bucket policy. Modify the service role for the CodeBuild project to include Amazon S3 access. Use the AWS CLI to download the database population script.`},
    {k:'D', ko:`버킷 정책을 사용하여 S3 버킷에서 인증되지 않은 액세스를 제거합니다. AWS CLI를 사용하여 <strong>IAM 액세스 키와 비밀 액세스 키</strong>를 사용하여 스크립트를 다운로드합니다.`, en:`Remove unauthenticated access from the S3 bucket with a bucket policy. Use the AWS CLI to download the script using an IAM access key and a secret access key.`},
  ],
  answer:['C'],
  vote:'100% C',
  explain:`<p><span class="mark-ok">✅ C — 버킷 정책으로 익명 액세스 제거 + 서비스 역할로 인증</span></p><p>가장 안전한 AWS 방식은 서비스 역할(IAM 역할)을 사용하는 것입니다. 버킷 정책으로 인증되지 않은 액세스를 제거하고, CodeBuild의 서비스 역할에 S3 버킷 읽기 권한을 추가하면 장기 자격 증명 없이도 안전하게 접근할 수 있습니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — CodeBuild에 AllowedBuckets 설정은 존재하지 않습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — S3는 HTTPS 기본 인증을 지원하지 않습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — IAM 액세스 키/비밀 키를 빌드 스펙에 하드코딩하거나 환경 변수로 관리하는 것은 보안 위험이 큽니다. 서비스 역할 사용이 권장됩니다.</p>`,
  disc:[{ans:'C (100%)',txt:'AWS 내부에서는 서비스 역할 사용이 모범 사례입니다. 장기 자격 증명(액세스 키)을 코드에 포함하지 않아야 합니다.'}]
},
{
  n:11,
  ko:`한 전자상거래 회사가 AWS Control Tower 랜딩 존을 구축하고 있습니다. IAM Identity Center의 ID 저장소를 외부 IdP(SAML 2.0)로 설정했습니다.<br><br>DevOps 팀은 <strong>최소 권한 원칙</strong>을 적용하고, 팀이 자신의 리소스만 빌드/관리할 수 있는 강력한 권한 모델을 원합니다.<br><br><strong>요구 사항을 충족하는 단계 3가지는 무엇입니까?</strong>`,
  en:`An ecommerce company is building an AWS Control Tower landing zone with IAM Identity Center (AWS SSO) set to external IdP with SAML 2.0. The DevOps team wants a robust permission model applying least privilege, allowing teams to build and manage only their own resources.<br><br><strong>Which combination of steps will meet these requirements? (Choose three.)</strong>`,
  type:'multi',
  multiCount:3,
  choices:[
    {k:'A', ko:`필요한 권한을 포함하는 <strong>IAM 정책</strong>을 만듭니다. <code>aws:PrincipalTag</code> 조건 키를 포함합니다.`, en:`Create IAM policies that include the required permissions. Include the aws:PrincipalTag condition key.`},
    {k:'B', ko:`<strong>권한 집합(Permission Sets)</strong>을 만듭니다. 필요한 권한을 포함하고 <code>aws:PrincipalTag</code> 조건 키를 사용하는 인라인 정책을 첨부합니다.`, en:`Create permission sets. Attach an inline policy that includes the required permissions and uses the aws:PrincipalTag condition key to scope the permissions.`},
    {k:'C', ko:`IdP에서 그룹을 만듭니다. 그룹에 사용자를 배치합니다. 그룹을 IAM Identity Center의 <strong>계정 및 권한 집합에 할당</strong>합니다.`, en:`Create a group in the IdP. Place users in the group. Assign the group to accounts and the permission sets in IAM Identity Center.`},
    {k:'D', ko:`IdP에서 그룹을 만듭니다. 그룹에 사용자를 배치합니다. 그룹을 OU 및 <strong>IAM 정책에 할당</strong>합니다.`, en:`Create a group in the IdP. Place users in the group. Assign the group to OUs and IAM policies.`},
    {k:'E', ko:`IAM Identity Center에서 액세스 제어를 위한 속성을 활성화합니다. 사용자에게 <strong>태그를 적용</strong>합니다. 태그를 키-값 쌍으로 매핑합니다.`, en:`Enable attributes for access control in IAM Identity Center. Apply tags to users. Map the tags as key-value pairs.`},
    {k:'F', ko:`IAM Identity Center에서 액세스 제어를 위한 속성을 활성화합니다. <strong>IdP에서 속성을 키-값 쌍으로 매핑</strong>합니다.`, en:`Enable attributes for access control in IAM Identity Center. Map attributes from the IdP as key-value pairs.`},
  ],
  answer:['B','C','F'],
  vote:'100% BCF',
  explain:`<p><span class="mark-ok">✅ B</span>: IAM Identity Center에서는 <strong>권한 집합(Permission Sets)</strong>을 사용합니다. IAM 정책 직접 생성이 아닌 권한 집합에 인라인 정책을 첨부하여 ABAC(속성 기반 액세스 제어)를 구현합니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ C</span>: IdP 그룹을 IAM Identity Center의 계정과 권한 집합에 할당합니다. (IAM 정책에 직접 할당 X)</p><p style="margin-top:8px;"><span class="mark-ok">✅ F</span>: 외부 IdP 사용 시 IAM Identity Center에서 IdP 속성을 키-값 쌍으로 매핑합니다. (태그 직접 적용 X — IdP에는 태그가 아닌 속성이 있음)</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — IAM 정책 직접 생성은 IAM Identity Center 환경에 적합하지 않습니다. 권한 집합을 사용해야 합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — OU에 그룹을 할당하거나 IAM 정책에 직접 그룹을 할당할 수 없습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ E</span> — 외부 IdP를 사용할 때는 IAM Identity Center에서 태그를 수동으로 적용하지 않고 IdP 속성을 매핑합니다.</p>`,
  disc:[{ans:'BCF (100%)',txt:'IAM Identity Center에서는 IAM 역할/정책 대신 권한 집합을 사용합니다. 외부 IdP 연동 시 속성 매핑(F)으로 ABAC를 구현합니다.'}]
},
{
  n:12,
  ko:`한 전자상거래 회사의 주문 처리 시스템은 <strong>예약된 동시성</strong>을 사용하는 AWS Lambda 함수로 구성됩니다. Lambda 함수는 Amazon SQS 대기열에서 주문 메시지를 처리하고 DynamoDB 테이블에 삽입합니다. DynamoDB 테이블은 읽기/쓰기 용량 자동 확장이 활성화되어 있습니다.<br><br>고객들이 주문 처리 상태 반영에 지연이 발생한다고 보고합니다.<br><br><strong>이 지연을 해결하기 위한 조치 2가지는 무엇입니까?</strong>`,
  en:`An ecommerce company's order processing system uses an AWS Lambda function with reserved concurrency, processing from an Amazon SQS queue and inserting into a DynamoDB table with auto scaling. Customers report delays in order history page.<br><br><strong>Which actions should the DevOps engineer take? (Choose two.)</strong>`,
  type:'multi',
  multiCount:2,
  choices:[
    {k:'A', ko:`SQS 대기열의 <strong>ApproximateAgeOfOldestMessage</strong> 메트릭을 확인합니다. Lambda 함수 <strong>동시성 제한을 늘립니다.</strong>`, en:`Check the ApproximateAgeOfOldestMessage metric for the SQS queue. Increase the Lambda function concurrency limit.`},
    {k:'B', ko:`SQS 대기열의 ApproximateAgeOfOldestMessage 메트릭을 확인합니다. SQS 대기열에 대한 <strong>리드라이브 정책</strong>을 구성합니다.`, en:`Check the ApproximateAgeOfOldestMessage metric for the SQS queue. Configure a redrive policy on the SQS queue.`},
    {k:'C', ko:`SQS 대기열의 <strong>NumberOfMessagesSent</strong> 메트릭을 확인합니다. SQS 대기열 <strong>가시성 시간 초과</strong>를 늘립니다.`, en:`Check the NumberOfMessagesSent metric for the SQS queue. Increase the SQS queue visibility timeout.`},
    {k:'D', ko:`DynamoDB 테이블의 <strong>WriteThrottleEvents</strong> 메트릭을 확인합니다. 테이블의 확장 정책에 대한 <strong>최대 쓰기 용량 단위(WCU)를 늘립니다.</strong>`, en:`Check the WriteThrottleEvents metric for the DynamoDB table. Increase the maximum write capacity units (WCUs) for the table's scaling policy.`},
    {k:'E', ko:`Lambda 함수의 <strong>Throttles</strong> 메트릭을 확인합니다. Lambda 함수 <strong>시간 초과</strong>를 늘립니다.`, en:`Check the Throttles metric for the Lambda function. Increase the Lambda function timeout.`},
  ],
  answer:['A','D'],
  vote:'100% AD',
  explain:`<p><span class="mark-ok">✅ A</span>: <strong>ApproximateAgeOfOldestMessage</strong>가 높으면 SQS 메시지가 처리되지 않고 쌓이고 있음을 의미합니다. Lambda의 <strong>예약된 동시성 제한</strong>을 늘려 더 많은 메시지를 병렬 처리합니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ D</span>: <strong>WriteThrottleEvents</strong>가 높으면 DynamoDB가 쓰기를 제한하고 있습니다. 자동 확장이 활성화되어 있어도 최대 WCU 상한이 낮으면 피크 시 제한이 발생할 수 있습니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — 리드라이브 정책은 Dead Letter Queue(DLQ) 관련이며 처리 속도 향상과 무관합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — 가시성 시간 초과는 메시지가 재처리되는 문제 해결용이며, 처리 지연의 주요 원인이 아닙니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ E</span> — Lambda 시간 초과 연장은 처리 속도를 높이지 않습니다.</p>`,
  disc:[{ans:'AD',txt:'A: ApproximateAgeOfOldestMessage 확인 후 동시성 증가. D: WriteThrottleEvents 확인 후 최대 WCU 증가. 이 두 가지가 병목 지점입니다.'}]
},
{
  n:13,
  ko:`한 회사는 단일 AWS 계정에서 수백 개의 EC2 인스턴스를 실행합니다. 매 시간 새 인스턴스가 시작/종료됩니다. 보안 정책에 따라 <strong>모든 실행 중인 EC2 인스턴스는 EC2 인스턴스 프로필을 사용해야 합니다.</strong> 인스턴스 프로필이 없으면 IAM 권한이 없는 기본 인스턴스 프로필을 사용해야 합니다.<br><br>DevOps 엔지니어는 인스턴스 프로필 없이 실행되는 기존 인스턴스와 새로 시작되는 인스턴스 모두를 발견했습니다.<br><br><strong>모든 기존 및 향후 EC2 인스턴스에 인스턴스 프로필이 연결되도록 하는 솔루션은 무엇입니까?</strong>`,
  en:`A company runs hundreds of EC2 instances in a single AWS account. New instances are launched and terminated each hour. Security policy requires all running EC2 instances to use an instance profile. Instances without a profile must use a default instance profile with no IAM permissions. The DevOps engineer finds instances running without a profile.<br><br><strong>Which solution ensures an instance profile is attached to all existing and future EC2 instances?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`EC2 RunInstances API 호출에 반응하는 Amazon EventBridge 규칙을 구성합니다. AWS Lambda 함수를 호출하여 기본 인스턴스 프로필을 EC2 인스턴스에 연결하도록 규칙을 구성합니다.`, en:`Configure an Amazon EventBridge rule that reacts to EC2 RunInstances API calls. Configure the rule to invoke an AWS Lambda function to attach the default instance profile to the EC2 instances.`},
    {k:'B', ko:`트리거 유형을 <strong>구성 변경</strong>으로 설정한 <code>ec2-instance-profile-attached</code> AWS Config <strong>관리형 규칙</strong>을 구성합니다. AWS Systems Manager Automation 런북을 호출하는 <strong>자동 수정 작업</strong>을 구성합니다.`, en:`Configure the ec2-instance-profile-attached AWS Config managed rule with a trigger type of configuration changes. Configure an automatic remediation action that invokes an AWS Systems Manager Automation runbook to attach the default instance profile to the EC2 instances.`},
    {k:'C', ko:`EC2 <strong>StartInstances</strong> API 호출에 반응하는 Amazon EventBridge 규칙을 구성합니다. AWS Systems Manager Automation 런북을 호출하도록 규칙을 구성합니다.`, en:`Configure an Amazon EventBridge rule that reacts to EC2 StartInstances API calls. Configure the rule to invoke an AWS Systems Manager Automation runbook to attach the default instance profile.`},
    {k:'D', ko:`트리거 유형을 구성 변경으로 설정한 <code>iam-role-managed-policy-check</code> AWS Config 관리형 규칙을 구성합니다. AWS Lambda 함수를 호출하는 자동 수정 작업을 구성합니다.`, en:`Configure the iam-role-managed-policy-check AWS Config managed rule with a trigger type of configuration changes. Configure an automatic remediation action that invokes an AWS Lambda function to attach the default instance profile.`},
  ],
  answer:['B'],
  vote:'100% B',
  explain:`<p><span class="mark-ok">✅ B — AWS Config 관리형 규칙 + SSM Automation 수정</span></p><p><code>ec2-instance-profile-attached</code>는 EC2 인스턴스에 인스턴스 프로필이 연결되어 있는지 모니터링하는 AWS Config 관리형 규칙입니다. 구성 변경 트리거로 신규/기존 인스턴스 모두 대응 가능하며, SSM Automation 런북으로 기본 인스턴스 프로필을 자동 연결합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — RunInstances는 신규 인스턴스에만 반응하며, 기존 프로필 없는 인스턴스를 수정하지 못합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — StartInstances는 중지 후 시작하는 인스턴스에만 반응합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — iam-role-managed-policy-check는 IAM 역할의 정책 확인 규칙으로 이 목적에 맞지 않습니다.</p>`,
  disc:[{ans:'B (100%)',txt:'ec2-instance-profile-attached Config 관리형 규칙과 SSM Automation 런북 조합이 기존 및 신규 인스턴스 모두를 처리하는 올바른 방법입니다.'}]
},
{
  n:14,
  ko:`DevOps 엔지니어가 AWS Lambda 함수를 사용하는 서버리스 애플리케이션에 대한 <strong>지속적 배포 파이프라인</strong>을 구축하고 있습니다. 회사는 실패한 배포의 고객 영향을 줄이고 문제를 모니터링하고 싶습니다.<br><br><strong>이 요구 사항을 충족하는 배포 단계 구성은 무엇입니까?</strong>`,
  en:`A DevOps engineer is building a continuous deployment pipeline for a serverless application using AWS Lambda functions. The company wants to reduce customer impact of unsuccessful deployments and monitor for issues.<br><br><strong>Which deploy stage configuration will meet these requirements?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`<strong>AWS SAM</strong> 템플릿을 사용하여 서버리스 애플리케이션을 정의합니다. AWS CodeDeploy를 사용하여 <strong>Canary10Percent15Minutes</strong> 배포 기본 설정 유형으로 Lambda 함수를 배포합니다. Amazon CloudWatch 알람을 사용하여 함수 상태를 모니터링합니다.`, en:`Use an AWS SAM template to define the serverless application. Use AWS CodeDeploy to deploy the Lambda functions with the Canary10Percent15Minutes Deployment Preference Type. Use Amazon CloudWatch alarms to monitor the health of the functions.`},
    {k:'B', ko:`AWS CloudFormation을 사용하여 새 스택 업데이트를 게시하고 모든 리소스에 CloudWatch 알람을 포함합니다. 개발자가 변경 세트를 검토하고 승인할 수 있도록 AWS CodePipeline 승인 작업을 설정합니다.`, en:`Use AWS CloudFormation to publish a new stack update, and include Amazon CloudWatch alarms on all resources. Set up an AWS CodePipeline approval action for a developer to verify and approve the CloudFormation change set.`},
    {k:'C', ko:`AWS CloudFormation을 사용하여 모든 스택 업데이트에 새 버전을 게시하고 모든 리소스에 CloudWatch 알람을 포함합니다. <code>AWS::Lambda::Alias</code> 리소스의 <strong>RoutingConfig</strong> 속성을 사용하여 트래픽 라우팅을 업데이트합니다.`, en:`Use AWS CloudFormation to publish a new version on every stack update, and include CloudWatch alarms on all resources. Use the RoutingConfig property of the AWS::Lambda::Alias resource to update traffic routing during the stack update.`},
    {k:'D', ko:`AWS CodeBuild를 사용하여 Lambda 함수에 테스트용 샘플 이벤트 페이로드를 추가합니다. 함수의 새 버전을 게시하고 CloudWatch 알람을 포함합니다. 프로덕션 별칭을 업데이트하여 새 버전을 가리킵니다. 알람이 ALARM 상태일 때 롤백이 발생하도록 구성합니다.`, en:`Use AWS CodeBuild to add sample event payloads for testing to the Lambda functions. Publish a new version of the functions, and include CloudWatch alarms. Update the production alias to point to the new version. Configure rollbacks to occur when an alarm is in the ALARM state.`},
  ],
  answer:['A'],
  vote:'83% A',
  explain:`<p><span class="mark-ok">✅ A — AWS SAM + CodeDeploy Canary 배포 + CloudWatch 알람</span></p><p>서버리스 애플리케이션 배포에는 <strong>AWS SAM</strong>이 권장됩니다. SAM의 <code>DeploymentPreference</code>에서 <strong>Canary10Percent15Minutes</strong>를 지정하면 처음 10%의 트래픽만 새 버전으로 전환하고 15분간 관찰한 후 나머지를 전환합니다. CloudWatch 알람 설정 시 알람이 발생하면 자동 롤백됩니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — 수동 승인은 지속적 배포(CD) 요구사항에 반합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — RoutingConfig는 가중치 기반 트래픽 분할을 지원하지만 SAM의 자동화된 Canary 배포에 비해 덜 편리합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — CodeBuild는 빌드/테스트 도구이며 지속적 배포 오케스트레이션에 적합하지 않습니다.</p>`,
  disc:[{ans:'A (83%)',txt:'인증 팁: Lambda와 CloudFormation 관련 문제의 99%는 SAM과 관련된 답변입니다. Canary 배포로 고객 영향을 최소화합니다.'}]
},
{
  n:15,
  ko:`DevOps 엔지니어가 퍼블릭 서브넷에서 퍼블릭 IP 주소로 EC2 인스턴스를 시작하고, 사용자 데이터 스크립트로 애플리케이션 아티팩트를 가져와 설치합니다. 이제 <strong>인터넷에 액세스할 수 없이 인스턴스를 실행</strong>해야 하는 보안 분류 변경이 발생했습니다. 인스턴스는 정상으로 표시되지만 애플리케이션이 설치되지 않습니다.<br><br><strong>새 규칙을 준수하면서 애플리케이션을 성공적으로 설치하는 방법은 무엇입니까?</strong>`,
  en:`A DevOps engineer launches an EC2 instance with a public IP in a public subnet. A user data script obtains and installs application artifacts. A security change now requires instances to run with no access to the internet. Instances launch successfully but the application does not install.<br><br><strong>Which solution successfully installs the application while complying with the new rule?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`Elastic IP 주소가 연결된 퍼블릭 서브넷에서 인스턴스를 시작합니다. 애플리케이션이 설치되면 Elastic IP 주소를 분리하는 스크립트를 실행합니다.`, en:`Launch the instances in a public subnet with Elastic IP addresses attached. Once the application is installed, run a script to disassociate the Elastic IP addresses afterwards.`},
    {k:'B', ko:`NAT 게이트웨이를 설정합니다. EC2 인스턴스를 <strong>프라이빗 서브넷</strong>에 배포합니다. 프라이빗 서브넷의 경로 테이블을 업데이트하여 NAT 게이트웨이를 기본 경로로 사용합니다.`, en:`Set up a NAT gateway. Deploy the EC2 instances to a private subnet. Update the private subnet's route table to use the NAT gateway as the default route.`},
    {k:'C', ko:`Amazon S3 버킷에 애플리케이션 아티팩트를 게시하고 <strong>S3에 대한 VPC 엔드포인트</strong>를 만듭니다. EC2 인스턴스에 <strong>IAM 인스턴스 프로필</strong>을 할당하여 S3 버킷에서 아티팩트를 읽을 수 있도록 합니다.`, en:`Publish the application artifacts to an Amazon S3 bucket and create a VPC endpoint for S3. Assign an IAM instance profile to the EC2 instances so they can read the application artifacts from the S3 bucket.`},
    {k:'D', ko:`애플리케이션 인스턴스에 대한 보안 그룹을 만들고 아티팩트 리포지토리로의 아웃바운드 트래픽만 허용합니다. 설치가 완료되면 보안 그룹 규칙을 제거합니다.`, en:`Create a security group for the application instances and allow only outbound traffic to the artifact repository. Remove the security group rule once the install is complete.`},
  ],
  answer:['C'],
  vote:'91% C',
  explain:`<p><span class="mark-ok">✅ C — S3 VPC 엔드포인트 + IAM 인스턴스 프로필</span></p><p>인터넷 접속 없이 AWS 서비스에 접근하려면 <strong>VPC 엔드포인트</strong>를 사용합니다. S3 게이트웨이 엔드포인트를 생성하면 EC2 인스턴스가 인터넷 게이트웨이나 NAT 없이 S3에 접근할 수 있습니다. IAM 인스턴스 프로필로 S3 버킷 읽기 권한을 부여합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — 설치 중 인터넷에 잠시 접근하는 것은 새 보안 규칙 위반입니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — NAT 게이트웨이는 인스턴스에서 인터넷으로 아웃바운드 액세스를 허용합니다. "인터넷 액세스 없음" 요구사항에 위배됩니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — 설치 중 아티팩트 리포지토리로의 트래픽을 허용하는 것은 인터넷 액세스입니다.</p>`,
  disc:[{ans:'C (91%)',txt:'인터넷 없이 AWS 서비스 접근 = VPC 엔드포인트. NAT는 인터넷 접속을 허용하므로 요구사항에 위배됩니다.'}]
},
{
  n:16,
  ko:`개발 팀이 AWS CodeCommit으로 버전 관리를 하고 AWS CodePipeline으로 소프트웨어 배포를 조율합니다. 팀은 원격 <strong>main 브랜치</strong>를 파이프라인 트리거로 사용하기로 했습니다. 개발자가 CodeCommit 리포지토리에 코드를 푸시했지만, <strong>10분이 지나도 파이프라인에 아무 반응이 없습니다.</strong><br><br><strong>이 문제를 해결하기 위한 조치는 무엇입니까?</strong>`,
  en:`A development team uses AWS CodeCommit for version control and AWS CodePipeline to orchestrate deployments. The team decided to use a remote main branch as the pipeline trigger. A developer pushed code changes to the CodeCommit repository, but the pipeline had no reaction even after 10 minutes.<br><br><strong>Which action should be taken to troubleshoot this issue?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`파이프라인을 트리거하기 위해 <strong>main 브랜치에 대한 Amazon EventBridge 규칙</strong>이 생성되었는지 확인합니다.`, en:`Check that an Amazon EventBridge rule has been created for the main branch to trigger the pipeline.`},
    {k:'B', ko:`<strong>CodePipeline 서비스 역할</strong>에 CodeCommit 저장소에 액세스할 수 있는 권한이 있는지 확인합니다.`, en:`Check that the CodePipeline service role has permission to access the CodeCommit repository.`},
    {k:'C', ko:`<strong>개발자의 IAM 역할</strong>에 CodeCommit 저장소에 푸시할 수 있는 권한이 있는지 확인합니다.`, en:`Check that the developer's IAM role has permission to push to the CodeCommit repository.`},
    {k:'D', ko:`Amazon CloudWatch Logs의 CodeCommit 오류로 인해 파이프라인이 시작되지 않았는지 확인합니다.`, en:`Check to see if the pipeline failed to start because of CodeCommit errors in Amazon CloudWatch Logs.`},
  ],
  answer:['A'],
  vote:'60% A / 37% B (논쟁)',
  explain:`<p><span class="mark-ok">✅ A — EventBridge 규칙 확인 (권장)</span></p><p>CodePipeline은 CodeCommit 변경 감지의 기본 방식으로 <strong>Amazon EventBridge 규칙</strong>을 사용합니다. 콘솔에서 파이프라인 생성 시 자동으로 EventBridge 규칙이 생성되지만, CLI나 IaC로 생성한 경우 직접 만들어야 합니다. 파이프라인에 <strong>10분간 아무런 반응이 없다</strong>는 것은 트리거 자체가 작동하지 않음을 의미하므로 EventBridge 규칙을 먼저 확인합니다.</p><p style="margin-top:8px;"><em>참고: B(서비스 역할 권한 문제)라면 파이프라인이 시작된 후 즉시 오류가 발생했을 것입니다.</em></p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — 권한 문제가 있다면 파이프라인이 시작되어 소스 단계에서 즉시 오류 메시지를 표시했을 것입니다. "아무 반응 없음"과는 다릅니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — 개발자가 이미 성공적으로 코드를 푸시했으므로 푸시 권한은 문제 없습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — 파이프라인이 시작조차 안 됐으므로 로그에 기록이 없습니다.</p>`,
  disc:[{ans:'A (60%) vs B (37%) — 논쟁',txt:'AWS 공식 튜토리얼에서 CodeCommit 소스 선택 시 CloudWatch Events(EventBridge) 규칙이 생성됨을 명시합니다. B라면 즉시 오류가 발생했을 것이므로 A가 더 적합합니다.'}]
},
{
  n:17,
  ko:`한 회사의 개발자가 Amazon EC2 인스턴스를 원격 워크스테이션으로 사용합니다. 회사는 사용자가 EC2 보안 그룹을 만들거나 수정하여 <strong>무제한 인바운드 액세스</strong>를 허용할 수 있다는 점을 우려합니다.<br><br>DevOps 엔지니어는 거의 실시간으로 무제한 보안 그룹 규칙을 감지하고 제거하며, 보안 팀에 이메일 알림을 보내야 합니다. DevOps 엔지니어는 이미 Lambda 함수(보안 그룹 ID 확인, 무제한 규칙 제거, SNS 알림 전송)를 만들었습니다.<br><br><strong>요구 사항을 충족하기 위해 다음에 무엇을 해야 합니까?</strong>`,
  en:`A company's developers use EC2 instances as remote workstations. The company is concerned users can create or modify EC2 security groups to allow unrestricted inbound access. A DevOps engineer needs to detect when unrestricted security group rules are created in near real time, remove the rules, and send email notifications. The engineer has created an AWS Lambda function for this purpose.<br><br><strong>What should the DevOps engineer do next?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`SNS 토픽에서 호출할 Lambda 함수를 구성합니다. SNS 토픽에 대한 AWS CloudTrail 구독을 만듭니다. 보안 그룹 수정 이벤트에 대한 구독 필터를 구성합니다.`, en:`Configure the Lambda function to be invoked by the SNS topic. Create an AWS CloudTrail subscription for the SNS topic. Configure a subscription filter for security group modification events.`},
    {k:'B', ko:`Lambda 함수를 호출하기 위한 Amazon EventBridge <strong>예약 규칙</strong>을 만듭니다. 매 시간 Lambda 함수를 실행하는 스케줄 패턴을 정의합니다.`, en:`Create an Amazon EventBridge scheduled rule to invoke the Lambda function. Define a schedule pattern that runs the Lambda function every hour.`},
    {k:'C', ko:`<strong>기본 이벤트 버스</strong>를 소스로 하는 Amazon EventBridge 이벤트 규칙을 만듭니다. EC2 보안 그룹 <strong>생성 및 수정 이벤트</strong>와 일치하도록 규칙의 이벤트 패턴을 정의합니다. Lambda 함수를 호출하도록 규칙을 구성합니다.`, en:`Create an Amazon EventBridge event rule that has the default event bus as the source. Define the rule's event pattern to match EC2 security group creation and modification events. Configure the rule to invoke the Lambda function.`},
    {k:'D', ko:`모든 AWS 서비스의 이벤트를 구독하는 Amazon EventBridge <strong>사용자 지정 이벤트 버스</strong>를 만듭니다. 사용자 지정 이벤트 버스에서 호출할 Lambda 함수를 구성합니다.`, en:`Create an Amazon EventBridge custom event bus that subscribes to events from all AWS services. Configure the Lambda function to be invoked by the custom event bus.`},
  ],
  answer:['C'],
  vote:'100% C',
  explain:`<p><span class="mark-ok">✅ C — EventBridge 기본 이벤트 버스 + 이벤트 패턴 규칙</span></p><p>AWS 서비스 이벤트(EC2 포함)는 <strong>기본 이벤트 버스(default event bus)</strong>를 통해 발생합니다. EC2 보안 그룹 생성/수정 이벤트 패턴을 정의하여 Lambda 함수를 즉시 호출하면 거의 실시간으로 감지하고 수정할 수 있습니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — Lambda가 SNS에서 호출되는 것이 아니라 EventBridge에서 호출되어야 합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — 1시간 주기 스케줄은 "거의 실시간" 요구사항에 위배됩니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — AWS 서비스 이벤트는 기본 이벤트 버스에서 발생하므로 사용자 지정 이벤트 버스가 불필요합니다. 모든 서비스 이벤트 구독은 불필요한 비용이 발생합니다.</p>`,
  disc:[{ans:'C (100%)',txt:'AWS 서비스 이벤트는 기본 이벤트 버스에서 발생합니다. 사용자 지정 이벤트 버스는 다른 계정/리전 또는 SaaS 파트너 이벤트 수신에 사용됩니다.'}]
},
{
  n:18,
  ko:`DevOps 엔지니어가 AWS CloudFormation 템플릿으로 웹 서비스를 배포하고 있습니다. 웹 서비스는 ALB 뒤의 프라이빗 서브넷에 있는 EC2 인스턴스에서 실행됩니다. DevOps 엔지니어는 서비스가 <strong>IPv6 주소가 있는 클라이언트의 요청을 수락</strong>할 수 있는지 확인해야 합니다.<br><br><strong>CloudFormation 템플릿으로 무엇을 해야 합니까?</strong>`,
  en:`A DevOps engineer is creating an AWS CloudFormation template to deploy a web service running on EC2 instances in a private subnet behind an ALB. The DevOps engineer must ensure the service can accept requests from clients that have IPv6 addresses.<br><br><strong>What should the DevOps engineer do with the CloudFormation template?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`EC2 인스턴스의 VPC와 프라이빗 서브넷에 IPv6 CIDR 블록을 추가합니다. IPv6 네트워크에 대한 경로 테이블 항목을 만들고 각 EC2 인스턴스에 IPv6 주소를 할당합니다.`, en:`Add an IPv6 CIDR block to the VPC and the private subnet for the EC2 instances. Create route table entries for the IPv6 network and assign IPv6 addresses to each EC2 instance.`},
    {k:'B', ko:`각 EC2 인스턴스에 IPv6 Elastic IP 주소를 할당합니다. 대상 그룹을 만들고 EC2 인스턴스를 대상으로 추가합니다. ALB의 포트 443에 리스너를 만들고 대상 그룹을 ALB와 연결합니다.`, en:`Assign each EC2 instance an IPv6 Elastic IP address. Create a target group, and add the EC2 instances as targets. Create a listener on port 443 of the ALB, and associate the target group with the ALB.`},
    {k:'C', ko:`ALB를 <strong>Network Load Balancer(NLB)</strong>로 교체합니다. NLB의 VPC와 서브넷에 IPv6 CIDR 블록을 추가하고 NLB에 IPv6 탄력적 IP 주소를 할당합니다.`, en:`Replace the ALB with a Network Load Balancer (NLB). Add an IPv6 CIDR block to the VPC and subnets for the NLB, and assign the NLB an IPv6 Elastic IP address.`},
    {k:'D', ko:`ALB의 VPC와 서브넷에 IPv6 CIDR 블록을 추가합니다. 포트 443에 리스너를 만들고 ALB에서 <strong>dualstack IP 주소 유형</strong>을 지정합니다. 대상 그룹을 만들고 EC2 인스턴스를 대상으로 추가합니다. 대상 그룹을 ALB와 연결합니다.`, en:`Add an IPv6 CIDR block to the VPC and subnets for the ALB. Create a listener on port 443 and specify the dualstack IP address type on the ALB. Create a target group, and add the EC2 instances as targets. Associate the target group with the ALB.`},
  ],
  answer:['D'],
  vote:'100% D',
  explain:`<p><span class="mark-ok">✅ D — ALB dualstack + IPv6 CIDR</span></p><p>IPv6를 지원하려면 ALB에 <strong>dualstack IP 주소 유형</strong>을 설정해야 합니다. 이를 통해 ALB의 DNS 이름이 IPv4(A 레코드)와 IPv6(AAAA 레코드)를 모두 제공합니다. ALB의 VPC와 서브넷에 IPv6 CIDR 블록을 추가하여 ALB가 IPv6 주소를 받을 수 있도록 합니다. 백엔드 EC2 인스턴스는 IPv4를 그대로 사용할 수 있습니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — EC2 인스턴스에 IPv6 주소를 할당하지만 ALB에 dualstack을 설정하지 않아 클라이언트가 IPv6로 접근할 수 없습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — 프라이빗 서브넷의 EC2 인스턴스에 Elastic IP를 할당할 수 없습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — ALB를 NLB로 교체할 필요가 없습니다. ALB도 dualstack을 지원합니다.</p>`,
  disc:[{ans:'D (100%)',txt:'키워드: dualstack. ALB/NLB에서 IPv6 지원을 위해 dualstack IP 주소 유형으로 구성합니다. 백엔드 인스턴스는 IPv4 그대로 사용 가능합니다.'}]
},
{
  n:19,
  ko:`한 회사가 AWS Organizations와 AWS Control Tower를 사용하여 모든 AWS 계정을 관리합니다. 이 회사는 Enterprise Support 플랜을 사용합니다.<br><br>DevOps 엔지니어가 <strong>Account Factory for Terraform(AFT)</strong>을 사용하여 새 계정을 프로비저닝하면 지원 플랜이 <strong>Basic Support 플랜</strong>으로 설정됩니다. Enterprise Support 플랜으로 새 계정을 프로비저닝해야 합니다.<br><br><strong>요구 사항을 충족하는 솔루션은 무엇입니까?</strong>`,
  en:`A company uses AWS Organizations and AWS Control Tower. The company uses the Enterprise Support plan. A DevOps engineer using Account Factory for Terraform (AFT) notices new accounts are provisioned with Basic Support plan. The engineer needs to provision new accounts with the Enterprise Support plan.<br><br><strong>Which solution will meet these requirements?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`AWS Config 적합성 팩을 사용하여 조직의 일부인 계정에 AWS Config 규칙을 배포하고 규정을 준수하지 않는 계정을 자동으로 수정합니다.`, en:`Use an AWS Config conformance pack to deploy the account-part-of-organizations AWS Config rule and to automatically remediate any noncompliant accounts.`},
    {k:'B', ko:`AWS Lambda 함수를 만들어 AWS Support에 Enterprise Support 플랜에 계정을 추가하기 위한 티켓을 만듭니다. Lambda 함수에 <code>support:ResolveCase</code> 권한을 부여합니다.`, en:`Create an AWS Lambda function to create a ticket for AWS Support to add the account to the Enterprise Support plan. Grant the Lambda function the support:ResolveCase permission.`},
    {k:'C', ko:`<code>control_tower_parameters</code> 입력에 추가 값을 추가하여 <code>AWSEnterpriseSupport</code> 매개변수를 조직의 관리 계정 번호로 설정합니다.`, en:`Add an additional value to the control_tower_parameters input to set the AWSEnterpriseSupport parameter as the organization's management account number.`},
    {k:'D', ko:`AFT 배포 입력 구성에서 <strong><code>aft_feature_enterprise_support</code> 기능 플래그를 True</strong>로 설정합니다. AFT를 다시 배포하고 변경 사항을 적용합니다.`, en:`Set the aft_feature_enterprise_support feature flag to True in the AFT deployment input configuration. Redeploy AFT and apply the changes.`},
  ],
  answer:['D'],
  vote:'100% D',
  explain:`<p><span class="mark-ok">✅ D — AFT 기능 플래그 활성화</span></p><p>AFT에는 Enterprise Support 플랜을 활성화하는 내장 기능 플래그가 있습니다. AFT 배포 입력 구성에서 <code>aft_feature_enterprise_support = true</code>로 설정하고 재배포하면 이후 프로비저닝되는 모든 새 계정에 Enterprise Support 플랜이 자동 적용됩니다. — AWS 공식 문서 확인</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — Config 적합성 팩은 지원 플랜 변경과 무관합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — Lambda로 지원 티켓을 만드는 것은 비효율적이고 수동적입니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — control_tower_parameters에 AWSEnterpriseSupport 매개변수는 존재하지 않습니다.</p>`,
  disc:[{ans:'D (100%)',txt:'IaC(Terraform, CDK)를 사용할 때는 모든 설정 변경을 IaC 코드에서 구현해야 합니다. AFT의 aft_feature_enterprise_support 플래그가 바로 이 목적으로 설계되었습니다.'}]
},
{
  n:20,
  ko:`회사의 DevOps 엔지니어가 AWS Systems Manager를 사용하여 유지 관리 기간 동안 유지 관리 작업을 수행합니다. <strong>AWS Health 알림</strong>을 받은 후 재시작이 필요한 Amazon EC2 인스턴스가 몇 개 있습니다. DevOps 엔지니어는 이러한 알림을 수정하기 위한 <strong>자동화된 솔루션</strong>을 구현해야 합니다. Amazon EventBridge 규칙을 만들었습니다.<br><br><strong>이러한 요구 사항을 충족하기 위해 EventBridge 규칙을 어떻게 구성해야 합니까?</strong>`,
  en:`A company's DevOps engineer uses AWS Systems Manager for maintenance tasks. Some EC2 instances require a restart after notifications from AWS Health. The DevOps engineer needs an automated solution. The engineer creates an Amazon EventBridge rule.<br><br><strong>How should the DevOps engineer configure the EventBridge rule?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`EC2의 서비스인 <strong>AWS Health</strong>의 이벤트 소스와 인스턴스 유지 관리를 나타내는 이벤트 유형을 구성합니다. EC2 인스턴스를 다시 시작하는 <strong>Systems Manager 문서(Automation 런북)</strong>를 대상으로 지정합니다.`, en:`Configure an event source of AWS Health, a service of EC2, and an event type that indicates instance maintenance. Target a Systems Manager document to restart the EC2 instance.`},
