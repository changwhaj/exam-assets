    {k:'C', ko:`EC2의 서비스인 AWS Health의 이벤트 소스와 인스턴스 유지 관리를 나타내는 이벤트 유형을 구성합니다. 유지 관리 기간 동안 EC2 인스턴스를 다시 시작하는 자동화 작업을 등록하는 <strong>새로 생성된 AWS Lambda 함수</strong>를 대상으로 합니다.`, en:`Configure an event source of AWS Health, a service of EC2, and an event type that indicates instance maintenance. Target a newly created AWS Lambda function that registers an automation task to restart the EC2 instance during a maintenance window.`},
    {k:'D', ko:`<strong>EC2</strong>의 이벤트 소스와 인스턴스 유지 관리를 나타내는 이벤트 유형을 구성합니다. 유지 관리 기간 동안 EC2 인스턴스를 다시 시작하는 자동화 작업을 등록하는 새로 생성된 AWS Lambda 함수를 대상으로 합니다.`, en:`Configure an event source of EC2 and an event type that indicates instance maintenance. Target a newly created AWS Lambda function that registers an automation task to restart the EC2 instance during a maintenance window.`},
  ],
  answer:['A'],
  vote:'65% A / 31% C (논쟁)',
  explain:`<p><span class="mark-ok">✅ A — AWS Health 이벤트 + SSM Automation 런북</span></p><p>이벤트 소스는 <strong>AWS Health(EC2 서비스)</strong>이며, 인스턴스 유지 관리 이벤트 유형을 트리거로 설정합니다. EventBridge는 <strong>AWS Systems Manager Automation</strong>을 직접 대상으로 지정할 수 있으며, <code>AWS-RestartEC2Instance</code> 런북으로 EC2를 재시작합니다. 회사가 이미 SSM을 사용 중이므로 Lambda를 별도로 만들 필요가 없습니다. — AWS 공식 문서(Training & Certification) 확인</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — 이벤트 소스는 Systems Manager가 아닌 AWS Health여야 합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C, D</span> — 이미 SSM Automation이 있으므로 Lambda를 별도로 만들 필요가 없습니다. EventBridge는 SSM Automation을 직접 타겟으로 지정할 수 있습니다.</p>`,
  disc:[{ans:'A (65%) vs C (31%) — 논쟁',txt:'AWS Training & Certification 연습 시험에서 A가 정답으로 확인되었습니다. EventBridge → SSM Automation(AWS-RestartEC2Instance)을 직접 연결할 수 있습니다.'}]
},
{
  n:21,
  ko:`한 회사가 사내 품질 관리 애플리케이션을 모두 컨테이너화했습니다. 이 회사는 Amazon EC2 인스턴스에서 Jenkins를 실행하고 있으며, 패치 및 업그레이드가 필요합니다. 규정 준수 책임자는 빌드 아티팩트에 회사 지적 재산이 포함되어 있으므로 <strong>암호화를 시작</strong>하도록 요청했습니다.<br><br><strong>가장 유지 관리하기 쉬운 방식으로 이를 달성하기 위해 DevOps 엔지니어는 무엇을 해야 합니까?</strong>`,
  en:`A company has containerized all of its in-house quality control applications. The company is running Jenkins on Amazon EC2 instances, which require patching and upgrading. The compliance officer has requested a DevOps engineer begin encrypting build artifacts since they contain company intellectual property.<br><br><strong>What should the DevOps engineer do to accomplish this in the MOST maintainable manner?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`AWS Systems Manager를 사용하여 EC2 인스턴스에서 패치 및 업그레이드를 자동화하고 기본적으로 Amazon EBS 볼륨을 암호화합니다.`, en:`Automate patching and upgrading using AWS Systems Manager on EC2 instances and encrypt Amazon EBS volumes by default.`},
    {k:'B', ko:`Amazon ECS 클러스터에 Jenkins를 배포하고 기본 암호화가 활성화된 Amazon S3 버킷에 빌드 아티팩트를 복사합니다.`, en:`Deploy Jenkins to an Amazon ECS cluster and copy build artifacts to an Amazon S3 bucket with default encryption enabled.`},
    {k:'C', ko:`AWS CodePipeline을 빌드 작업과 함께 활용하고 AWS Secrets Manager를 사용하여 아티팩트를 암호화합니다.`, en:`Leverage AWS CodePipeline with a build action and encrypt the artifacts using AWS Secrets Manager.`},
    {k:'D', ko:`EC2 인스턴스에서 실행되는 Jenkins 인스턴스를 <strong>아티팩트 암호화가 포함된 AWS CodeBuild</strong>로 대체합니다.`, en:`Use AWS CodeBuild with artifact encryption to replace the Jenkins instance running on EC2 instances.`},
  ],
  answer:['D'],
  vote:'82% D',
  explain:`<p><span class="mark-ok">✅ D — AWS CodeBuild (완전 관리형 서비스)</span></p><p>AWS CodeBuild는 완전 관리형 CI 서비스로 패치·업그레이드가 불필요합니다. CodeBuild는 S3에 아티팩트를 저장할 때 KMS를 사용한 <strong>자동 암호화</strong>를 기본 제공합니다. "가장 유지 관리하기 쉬운" 방식이므로 서버를 직접 관리할 필요 없는 완전 관리형 서비스가 정답입니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B (18% 지지)</span> — ECS에서 Jenkins를 운영해도 Jenkins 자체의 유지 관리(플러그인 업데이트, OS 관리)는 여전히 필요합니다. 가장 유지 관리하기 쉬운 솔루션은 Jenkins를 아예 대체하는 D입니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — Secrets Manager는 비밀 관리 도구이며 빌드 아티팩트 암호화 목적에 맞지 않습니다.</p>`,
  disc:[{ans:'D (82%)',txt:'관리형 서비스 관련 질문: "가장 유지 관리하기 쉬운"이라는 키워드가 보이면 CodeBuild 같은 완전 관리형 서비스를 선택하세요. Jenkins는 아무리 컨테이너화해도 자체 유지 관리 부담이 있습니다.'}]
},
{
  n:22,
  ko:`IT 팀이 AWS CloudFormation 템플릿으로 EC2 인스턴스(사용자 데이터 스크립트로 앱 설치)와 S3 버킷을 생성합니다. CloudFormation 스택 삭제 시 모든 리소스가 제거되어야 합니다. 그러나 스택 삭제 중 오류가 발생하고 <strong>S3 버킷이 삭제되지 않습니다.</strong><br><br><strong>가장 효율적인 방식으로 오류를 해결하는 방법은 무엇입니까?</strong>`,
  en:`An IT team built an AWS CloudFormation template that creates an EC2 instance with a user data script and an Amazon S3 bucket for static webpages. All resources should be removed when the CloudFormation stack is deleted. However, CloudFormation reports an error during stack deletion and the S3 bucket is not deleted.<br><br><strong>How can the team resolve the error in the MOST efficient manner to ensure all resources are deleted without errors?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`S3 버킷 리소스에 <code>DeletionPolicy: Delete</code> 속성을 추가하여 스택 삭제 시 버킷을 강제 제거합니다.`, en:`Add a DeletionPolicy attribute with the value Delete to the S3 bucket resource, forcing the bucket to be removed when the stack is deleted.`},
    {k:'B', ko:`S3 버킷과 IAM 역할을 지정하는 <code>DependsOn</code> 속성이 있는 AWS Lambda 함수로 <strong>사용자 지정 리소스</strong>를 추가합니다. <code>RequestType</code>이 Delete일 때 버킷에서 모든 객체를 삭제하는 Lambda 함수를 작성합니다.`, en:`Add a custom resource with an AWS Lambda function with the DependsOn attribute specifying the S3 bucket and an IAM role. Write the Lambda function to delete all objects from the bucket when RequestType is Delete.`},
    {k:'C', ko:`삭제되지 않은 리소스를 식별합니다. S3 버킷을 <strong>수동으로 비운 다음 삭제</strong>합니다.`, en:`Identify the resource that was not deleted. Manually empty the S3 bucket and then delete it.`},
    {k:'D', ko:`EC2 및 S3 버킷 리소스를 단일 AWS OpsWorks Stacks 리소스로 교체합니다. 사용자 지정 레시피를 정의하여 EC2 인스턴스와 S3 버킷을 만들고 삭제합니다.`, en:`Replace the EC2 and S3 bucket resources with a single AWS OpsWorks Stacks resource. Define a custom recipe to create and delete the EC2 instance and the S3 bucket.`},
  ],
  answer:['B'],
  vote:'100% B',
  explain:`<p><span class="mark-ok">✅ B — CloudFormation 사용자 지정 리소스 + Lambda</span></p><p>CloudFormation이 S3 버킷을 삭제하지 못하는 이유는 <strong>버킷이 비어있지 않기 때문</strong>입니다(AWS 공식 문서: "For Amazon S3 buckets, you must delete all objects for deletion to succeed"). <code>DeletionPolicy: Delete</code>(A)를 추가해도 버킷 안의 객체가 있으면 여전히 실패합니다. Lambda 사용자 지정 리소스를 이용해 스택 삭제 시 먼저 버킷을 비우고 제거하는 것이 올바른 자동화 방식입니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — DeletionPolicy: Delete를 추가해도 객체가 있는 버킷은 삭제되지 않습니다. AWS 문서에 명시된 제약 사항입니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — 수동 작업은 자동화 요구사항에 위배됩니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — OpsWorks로 전환하는 것은 과도한 변경입니다.</p>`,
  disc:[{ans:'B (100%)',txt:'"For Amazon S3 buckets, you must delete all objects in the bucket for deletion to succeed." — AWS 공식 문서. 따라서 Lambda 사용자 지정 리소스로 먼저 버킷을 비워야 합니다.'}]
},
{
  n:23,
  ko:`한 회사가 eu-west-1의 CodePipeline 파이프라인에서 같은 리전에 Lambda 애플리케이션을 배포합니다. 이 파이프라인을 사용하여 <strong>us-east-1에도 동일한 Lambda 애플리케이션을 배포</strong>하려 합니다. DevOps 엔지니어가 이미 CodeBuild를 업데이트하여 us-east-1용 추가 출력 아티팩트를 생성하도록 했습니다.<br><br><strong>추가로 수행해야 할 단계 2가지는 무엇입니까?</strong>`,
  en:`A company has an AWS CodePipeline pipeline in eu-west-1 that deploys a Lambda application to the same Region. The company wants to also deploy the Lambda application to us-east-1 using the same pipeline. A DevOps engineer has already updated the CodeBuild project to produce an additional output artifact for us-east-1.<br><br><strong>Which combination of additional steps should the DevOps engineer take? (Choose two.)</strong>`,
  type:'multi',
  multiCount:2,
  choices:[
    {k:'A', ko:`CloudFormation 템플릿을 수정하여 Lambda 함수 코드 zip 파일 위치를 매개변수로 추가합니다. 파이프라인에 us-east-1용 새 CloudFormation 배포 작업을 만들고, 매개변수 재정의로 us-east-1 아티팩트 위치를 전달합니다.`, en:`Modify the CloudFormation template to include a parameter for the Lambda function code zip file location. Create a new CloudFormation deploy action for us-east-1 in the pipeline. Configure the new deploy action to pass in the us-east-1 artifact location as a parameter override.`},
    {k:'B', ko:`파이프라인에 us-east-1용 새 CloudFormation 배포 작업을 만듭니다. us-east-1 출력 아티팩트의 CloudFormation 템플릿을 사용하도록 새 배포 작업을 구성합니다.`, en:`Create a new CloudFormation deploy action for us-east-1 in the pipeline. Configure the new deploy action to use the CloudFormation template from the us-east-1 output artifact.`},
    {k:'C', ko:`us-east-1에 S3 버킷을 만듭니다. CodePipeline이 읽기/쓰기 액세스 권한을 가질 수 있도록 S3 버킷 정책을 구성합니다.`, en:`Create an S3 bucket in us-east-1. Configure the S3 bucket policy to allow CodePipeline to have read and write access.`},
    {k:'D', ko:`us-east-1에 S3 버킷을 만듭니다. eu-west-1 버킷에서 us-east-1 버킷으로 S3 Cross-Region Replication(CRR)을 구성합니다.`, en:`Create an S3 bucket in us-east-1. Configure S3 Cross-Region Replication (CRR) from the S3 bucket in eu-west-1 to the S3 bucket in us-east-1.`},
    {k:'E', ko:`파이프라인을 수정하여 us-east-1의 S3 버킷을 <strong>아티팩트 저장소</strong>로 포함합니다. 파이프라인에 us-east-1용 새 CloudFormation 배포 작업을 만들고, us-east-1 출력 아티팩트의 CloudFormation 템플릿을 사용하도록 구성합니다.`, en:`Modify the pipeline to include the S3 bucket for us-east-1 as an artifact store. Create a new CloudFormation deploy action for us-east-1 in the pipeline. Configure the new deploy action to use the CloudFormation template from the us-east-1 output artifact.`},
  ],
  answer:['C','E'],
  vote:'62% CE',
  explain:`<p><span class="mark-ok">✅ C</span>: CodePipeline이 교차 리전 작업을 수행하려면 <strong>각 배포 리전에 S3 아티팩트 버킷이 필요</strong>합니다. us-east-1에 S3 버킷을 생성하고 CodePipeline이 접근할 수 있도록 정책을 설정합니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ E</span>: 파이프라인에 us-east-1 S3 버킷을 아티팩트 저장소로 추가하고, us-east-1 출력 아티팩트의 CloudFormation 템플릿을 사용하는 새 배포 작업을 추가합니다. — AWS 공식 문서(cross-region pipeline)</p>`,
  wrong:`<p><span class="mark-no">❌ D</span> — DevOps 엔지니어가 이미 us-east-1용 아티팩트를 CodeBuild에서 직접 생성하도록 설정했으므로 CRR이 불필요합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — us-east-1 S3 아티팩트 버킷 없이 배포 작업만 추가하면 동작하지 않습니다. E가 B를 포함하면서 아티팩트 저장소 설정까지 포함합니다.</p>`,
  disc:[{ans:'CE (62%)',txt:'CodePipeline 교차 리전 배포 시 각 리전에 아티팩트 저장소용 S3 버킷이 필요합니다. 콘솔이 아닌 CLI/CFN을 사용할 경우 직접 버킷을 생성해야 합니다. — AWS Docs'}]
},
{
  n:24,
  ko:`한 회사가 Amazon EC2 인스턴스 하나에서 애플리케이션을 실행합니다. 애플리케이션 메타데이터는 Amazon S3에 저장되며 인스턴스가 재시작되면 검색해야 합니다. <strong>인스턴스가 응답하지 않으면 자동으로 재시작 또는 재기동되어야 합니다.</strong><br><br><strong>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?</strong>`,
  en:`A company runs an application on one Amazon EC2 instance. Application metadata is stored in Amazon S3 and must be retrieved if the instance is restarted. The instance must restart or relaunch automatically if it becomes unresponsive.<br><br><strong>Which solution will meet these requirements?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`StatusCheckFailed 메트릭에 대한 Amazon CloudWatch 알람을 만듭니다. 복구 작업으로 인스턴스를 중지/시작합니다. S3 이벤트 알림을 사용하여 인스턴스가 복구되면 메타데이터를 푸시합니다.`, en:`Create an Amazon CloudWatch alarm for the StatusCheckFailed metric. Use the recover action to stop and start the instance. Use S3 event notifications to push the metadata to the instance when it is back up.`},
    {k:'B', ko:`AWS OpsWorks를 구성하고 <strong>자동 복구(Auto Healing)</strong> 기능을 사용하여 인스턴스를 중지/시작합니다. OpsWorks의 라이프사이클 이벤트를 사용하여 Amazon S3에서 메타데이터를 가져와 인스턴스에 업데이트합니다.`, en:`Configure AWS OpsWorks and use the auto healing feature to stop and start the instance. Use a lifecycle event in OpsWorks to pull the metadata from Amazon S3 and update it on the instance.`},
    {k:'C', ko:`EC2 자동 복구를 사용하여 장애 발생 시 인스턴스를 자동으로 중지/시작합니다. S3 이벤트 알림을 사용하여 인스턴스가 복구되면 메타데이터를 푸시합니다.`, en:`Use EC2 Auto Recovery to automatically stop and start the instance in case of failure. Use S3 event notifications to push the metadata to the instance when it is back up.`},
    {k:'D', ko:`AWS CloudFormation을 사용하여 <code>UserData</code> 속성이 있는 EC2 인스턴스를 만듭니다. UserData에 Amazon S3에서 애플리케이션 메타데이터를 검색하는 명령을 추가합니다.`, en:`Use AWS CloudFormation to create an EC2 instance with a UserData property. Add a command in UserData to retrieve the application metadata from Amazon S3.`},
  ],
  answer:['B'],
  vote:'97% B',
  explain:`<p><span class="mark-ok">✅ B — AWS OpsWorks Auto Healing + 라이프사이클 이벤트</span></p><p>A와 C의 EC2 복구(recover)는 <strong>시스템 상태 검사 실패(하드웨어 이슈)에만 대응</strong>하며, 인스턴스 내부 문제(OS 레벨)에는 반응하지 않습니다. OpsWorks의 Auto Healing은 시스템·인스턴스 상태 검사 모두에 대응합니다. 또한 복구 후 Configure 라이프사이클 이벤트를 통해 S3에서 메타데이터를 자동으로 가져옵니다.</p><p style="margin-top:8px;"><em>참고: OpsWorks는 2024년 EOL이 되었으나 현재 시험 정답 기준으로는 B입니다.</em></p>`,
  wrong:`<p><span class="mark-no">❌ A, C</span> — S3 이벤트 알림은 S3 객체가 변경될 때 발생합니다. 인스턴스 재시작 자체가 S3 알림을 트리거하지 않습니다. 또한 EC2 복구는 인스턴스 상태 검사 실패에 반응하지 않습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — UserData는 최초 시작 시에만 실행되며 자동 재시작 기능을 제공하지 않습니다.</p>`,
  disc:[{ans:'B (97%)',txt:'A와 C가 매력적으로 보이지만 S3 이벤트 알림은 S3 객체 변경 시에만 발생합니다. 인스턴스 재시작 이벤트는 S3 알림을 트리거하지 않으므로 메타데이터 재로드가 불가능합니다.'}]
},
{
  n: 25,
  ko: `한 회사가 여러 AWS 계정에서 AWS IAM Identity Center(SSO)와 Microsoft Azure DevOps 툴킷을 통합하여 사용합니다. 액세스 제어를 위한 속성 기능이 활성화되어 있으며, <code>department</code> 키가 매핑되어 있습니다.<br><br>모든 EC2 인스턴스에는 <code>department</code> 태그(d1, d2, d3)가 있습니다. <strong>각 Azure AD 사용자에게 자신의 부서 태그가 붙은 EC2 인스턴스에만 접근 권한을 부여</strong>해야 합니다. 관리 작업을 최소화해야 합니다.<br><br><strong>사용자 지정 권한 정책에 포함해야 할 조건 키는 무엇입니까?</strong>`,
  en: `A company uses AWS IAM Identity Center (AWS SSO) integrated with AWS Toolkit for Microsoft Azure DevOps across multiple AWS accounts. The attributes for access control feature is enabled. The department key is mapped to \${path:enterprise.department}.<br><br>All existing EC2 instances have a department tag (d1, d2, d3). A DevOps engineer must create policies that grant each Azure AD user access only to EC2 instances tagged with the user's department name.<br><br><strong>Which condition key should be included in the custom permissions policies?</strong>`,
  type: 'single',
  choices: [
    {
      k: 'A',
      ko: `<pre style="background:var(--surface2);padding:10px;border-radius:6px;font-size:12px;">"Condition": {
  "ForAllValues:StringEquals": {
    "aws:TagKeys": ["department"]
  }
}</pre>`,
      en: ``
    },
    {
      k: 'B',
      ko: `<pre style="background:var(--surface2);padding:10px;border-radius:6px;font-size:12px;">"Condition": {
  "StringEquals": {
    "aws:PrincipalTag/department":
      "\${aws:ResourceTag/department}"
  }
}</pre>`,
      en: ``
    },
    {
      k: 'C',
      ko: `<pre style="background:var(--surface2);padding:10px;border-radius:6px;font-size:12px;">"Condition": {
  "StringEquals": {
    "ec2:ResourceTag/department":
      "\${aws:PrincipalTag/department}"
  }
}</pre>`,
      en: ``
    },
    {
      k: 'D',
      ko: `<pre style="background:var(--surface2);padding:10px;border-radius:6px;font-size:12px;">"Condition": {
  "ForAllValues:StringEquals": {
    "ec2:ResourceTag/department":
      ["d1", "d2", "d3"]
  }
}</pre>`,
      en: ``
    }
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — ec2:ResourceTag/department = aws:PrincipalTag/department</span></p><p>이것이 <strong>ABAC(Attribute-Based Access Control)</strong> 패턴입니다.<code>ec2:ResourceTag/department</code>는 EC2 리소스의 department 태그 값이고,<code>\${aws:PrincipalTag/department}</code>는 현재 사용자(Principal)의 department 속성 값입니다. 이 두 값이 일치할 때만 접근을 허용하므로, 단일 정책으로 모든 부서 사용자를 관리할 수 있어 관리 오버헤드가 최소화됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — <code>aws:ResourceTag</code>는 모든 AWS 서비스 리소스 태그에 적용되는 글로벌 컨텍스트 키이지만, EC2 리소스 태그에는 <code>ec2:ResourceTag</code>가 더 정확합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — 부서 값을 하드코딩하면 새 부서가 추가될 때마다 정책을 수정해야 하므로 관리 오버헤드가 증가합니다.</p>`,
  disc: [
    {
      ans: 'C (100%)',
      txt: 'ABAC 패턴: 사용자 속성(PrincipalTag)과 리소스 태그(ResourceTag)를 매칭. EC2 리소스에는 ec2:ResourceTag를 사용합니다. — AWS IAM Identity Center ABAC 문서'
    }
  ]
},
{
  n:26,
  ko:`한 회사가 AWS 계정에서 보안 감사 애플리케이션을 호스팅합니다. 감사 애플리케이션은 IAM 역할을 사용하여 다른 AWS 계정에 액세스합니다. 모든 계정은 AWS Organizations 동일 조직에 있습니다.<br><br>최근 보안 감사에서 감사된 AWS 계정의 사용자가 감사 애플리케이션의 IAM 역할을 <strong>수정하거나 삭제</strong>할 수 있음이 밝혀졌습니다. <strong>신뢰할 수 있는 관리자 IAM 역할 외에는 수정을 방지</strong>해야 합니다.<br><br><strong>이 요구 사항을 충족하는 솔루션은 무엇입니까?</strong>`,
  en:`A company hosts a security auditing application in an AWS account. The auditing application uses an IAM role to access other AWS accounts. All accounts are in the same organization in AWS Organizations.<br><br>A recent audit revealed that users in audited AWS accounts could modify or delete the auditing application's IAM role. The company needs to prevent any modification by any entity other than a trusted administrator IAM role.<br><br><strong>Which solution will meet these requirements?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`감사 애플리케이션의 IAM 역할 변경에 대한 <strong>Deny 문이 포함된 SCP</strong>를 만듭니다. 신뢰할 수 있는 관리자 IAM 역할이 변경을 수행할 수 있도록 허용하는 조건을 포함합니다. <strong>SCP를 조직의 루트에 연결</strong>합니다.`, en:`Create an SCP that includes a Deny statement for changes to the auditing application's IAM role. Include a condition that allows the trusted administrator IAM role to make changes. Attach the SCP to the root of the organization.`},
    {k:'B', ko:`신뢰할 수 있는 관리자에 대한 Allow 문과 다른 모든 주체에 대한 Deny 문이 포함된 SCP를 만듭니다. 각 AWS 계정의 IAM 서비스에 SCP를 연결합니다.`, en:`Create an SCP with Allow for trusted admin and Deny for all others. Attach to the IAM service in each AWS account.`},
    {k:'C', ko:`감사 애플리케이션의 IAM 역할 변경에 대한 Deny 문을 포함하는 IAM <strong>권한 경계</strong>를 만듭니다. 감사된 AWS 계정에 권한 경계를 연결합니다.`, en:`Create an IAM permissions boundary that includes a Deny statement for changes to the auditing application's IAM role. Attach the permissions boundary to the audited AWS accounts.`},
    {k:'D', ko:`감사 애플리케이션의 IAM 역할 변경에 대한 Deny 문을 포함하는 IAM 권한 경계를 만듭니다. AWS 계정에서 감사 애플리케이션의 IAM 역할에 권한 경계를 연결합니다.`, en:`Create an IAM permissions boundary with a Deny statement for changes. Attach the permissions boundary to the auditing application's IAM role in the AWS accounts.`},
  ],
  answer:['A'],
  vote:'89% A',
  explain:`<p><span class="mark-ok">✅ A — SCP(서비스 제어 정책) + 조건부 Deny</span></p><p>AWS Organizations의 SCP를 조직 루트에 연결하면 모든 멤버 계정에 일괄 적용됩니다. SCP에 Deny 문과 함께 <strong>"신뢰할 수 있는 관리자일 때는 허용"하는 조건</strong>을 추가하면, 단일 정책으로 조직 전체의 역할 보호가 가능합니다. 예시: <code>aws:PrincipalArn</code> 조건으로 관리자 역할을 예외 처리합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — SCP는 Allow 문을 지원하지 않습니다. SCP는 최대 권한 경계를 설정하는 Deny 기반 정책입니다. 또한 SCP를 IAM 서비스에 직접 연결할 수 없습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C, D</span> — IAM 권한 경계는 계정이 아닌 IAM 엔터티(사용자/역할)에 적용됩니다. 조직 전체에 일괄 적용하기 위해서는 SCP가 더 적합합니다.</p>`,
  disc:[{ans:'A (89%)',txt:'SCP 조건부 Deny 예시: {"Effect":"Deny","Action":"iam:*","Resource":"arn:aws:iam::*:role/AuditRole","Condition":{"ArnNotLike":{"aws:PrincipalArn":"arn:aws:iam::*:role/TrustedAdmin"}}} — AWS Organizations SCP 예시 문서'}]
},
{
  n:27,
  ko:`한 회사에 Go로 작성된 온프레미스 애플리케이션이 있습니다. AWS로 이전하면서 개발팀은 <strong>블루/그린 배포</strong>와 <strong>A/B 테스트</strong>를 활성화하려 합니다.<br><br><strong>이 요구 사항을 충족하는 솔루션은 무엇입니까?</strong>`,
  en:`A company has an on-premises application written in Go. A DevOps engineer must move the application to AWS. The development team wants to enable blue/green deployments and perform A/B testing.<br><br><strong>Which solution will meet these requirements?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`Amazon EC2 인스턴스에 애플리케이션을 배포하고 인스턴스의 AMI를 만듭니다. AMI를 사용하여 Auto Scaling 시작 구성을 만들고 Elastic Load Balancing으로 트래픽을 분산합니다. 변경 시 새 AMI를 생성하고 EC2 인스턴스 새로 고침을 시작합니다.`, en:`Deploy to EC2, create an AMI, use it in an Auto Scaling launch configuration with ELB. Create a new AMI on changes and initiate an EC2 instance refresh.`},
    {k:'B', ko:`Amazon Lightsail을 사용하여 애플리케이션을 배포합니다. 압축 형식으로 Amazon S3 버킷에 저장하고 Lightsail 배포 옵션을 사용합니다.`, en:`Use Amazon Lightsail to deploy the application. Store in a zipped format in an S3 bucket and use Lightsail deployment options.`},
    {k:'C', ko:`AWS CodeArtifact에 코드를 저장하고 AWS CodeDeploy로 EC2 인스턴스 플릿에 배포합니다. Elastic Load Balancing으로 트래픽을 분산합니다.`, en:`Use AWS CodeArtifact to store code and AWS CodeDeploy to deploy to an EC2 fleet. Use ELB to distribute traffic.`},
    {k:'D', ko:`<strong>AWS Elastic Beanstalk</strong>를 사용하여 애플리케이션을 호스팅합니다. Amazon S3에 압축 버전을 저장하고 새 버전을 배포합니다. Elastic Beanstalk의 <strong>배포 옵션</strong>을 사용하여 블루/그린 및 A/B 테스트를 관리합니다.`, en:`Use AWS Elastic Beanstalk to host the application. Store a zipped version in S3. Use Elastic Beanstalk to manage the deployment options including blue/green and A/B testing.`},
  ],
  answer:['D'],
  vote:'100% D',
  explain:`<p><span class="mark-ok">✅ D — AWS Elastic Beanstalk</span></p><p>Elastic Beanstalk는 Go를 포함한 다양한 언어를 지원하며, <strong>블루/그린 배포와 A/B 테스트를 기본 제공</strong>합니다. 환경 교체(Environment swap)로 블루/그린 전환이 가능하고, 트래픽 분할로 A/B 테스트를 수행할 수 있습니다. AWS로 빠르게 이전하면서 배포 유연성을 제공하는 최적의 솔루션입니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — Lightsail은 블루/그린 배포나 A/B 테스트를 기본 제공하지 않습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ A, C</span> — EC2 + AMI 방식이나 CodeDeploy는 블루/그린을 구성할 수 있지만 Elastic Beanstalk에 비해 훨씬 복잡한 설정이 필요합니다.</p>`,
  disc:[{ans:'D (100%)',txt:'Elastic Beanstalk 지원 플랫폼: Go, Java, .NET, Node.js, Python, PHP, Ruby, Docker 등. 배포 정책: All at once, Rolling, Rolling with additional batch, Immutable, Blue/Green.'}]
},
{
  n:28,
  ko:`개발자가 50대의 Amazon EC2 Linux 서버(EC2 Auto Scaling 그룹, ELB)를 유지 관리합니다. 일부 애플리케이션 서버가 ELB HTTP 상태 검사에 실패한 후 종료됩니다. 개발자는 근본 원인 분석을 하고 싶지만 <strong>애플리케이션 로그에 액세스하기 전에 서버가 종료</strong>됩니다.<br><br><strong>로그 수집을 어떻게 자동화할 수 있습니까?</strong>`,
  en:`A developer maintains a fleet of 50 EC2 Linux servers in an Auto Scaling group with ELB. Some application servers are terminated after failing ELB HTTP health checks. The developer wants to perform root cause analysis but the server is terminated before being able to access application logs.<br><br><strong>How can log collection be automated?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`Auto Scaling 라이프사이클 후크로 인스턴스를 <code>Pending:Wait</code> 상태로 만듭니다. EC2 Instance Terminate Successful CloudWatch 알람을 만들어 SSM Run Command 스크립트를 실행하고 로그를 S3로 보내는 Lambda 함수를 트리거합니다.`, en:`Use lifecycle hooks to put instances in Pending:Wait state. Create a CloudWatch alarm for EC2 Instance Terminate Successful and trigger a Lambda function that invokes SSM Run Command to collect logs and push to S3.`},
    {k:'B', ko:`Auto Scaling 라이프사이클 후크로 인스턴스를 <code>Terminating:Wait</code> 상태로 만듭니다. EC2 Instance-terminate 라이프사이클 작업에 대한 AWS Config 규칙을 만들고 로그를 수집하는 Step Functions를 트리거합니다.`, en:`Use lifecycle hooks to put instances in Terminating:Wait state. Create an AWS Config rule for EC2 Instance-terminate Lifecycle Action and trigger a Step Functions that collects logs.`},
    {k:'C', ko:`Auto Scaling 라이프사이클 후크로 인스턴스를 <code>Terminating:Wait</code> 상태로 만듭니다. EC2 Instance Terminate Successful CloudWatch 구독 필터를 만들어 CloudWatch 에이전트를 트리거합니다.`, en:`Use lifecycle hooks to put instances in Terminating:Wait state. Create a CloudWatch subscription filter for EC2 Instance Terminate Successful and trigger a CloudWatch agent.`},
    {k:'D', ko:`Auto Scaling 라이프사이클 후크로 인스턴스를 <code>Terminating:Wait</code> 상태로 만듭니다. <strong>EC2 Instance-terminate 라이프사이클 작업에 대한 Amazon EventBridge 규칙</strong>을 만들고 SSM Run Command 스크립트를 호출하여 로그를 S3로 전송하고 라이프사이클 작업을 완료하는 <strong>Lambda 함수</strong>를 트리거합니다.`, en:`Use lifecycle hooks to put instances in Terminating:Wait state. Create an Amazon EventBridge rule for EC2 Instance-terminate Lifecycle Action and trigger an AWS Lambda function that invokes SSM Run Command to collect logs, push to S3, and complete the lifecycle action.`},
  ],
  answer:['D'],
  vote:'86% D',
  explain:`<p><span class="mark-ok">✅ D — Terminating:Wait + EventBridge + Lambda + SSM Run Command</span></p><p>스케일-인 이벤트 시 <strong>라이프사이클 후크</strong>가 인스턴스를 <code>Terminating:Wait</code> 상태로 일시 중지합니다. EventBridge 규칙이 이 이벤트를 감지하여 Lambda를 호출하고, Lambda는 SSM Run Command로 인스턴스에서 로그를 수집하여 S3에 저장한 후 라이프사이클 작업을 완료합니다. — AWS 공식 블로그 권장 패턴</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — <code>Pending:Wait</code>는 인스턴스가 시작될 때의 상태이며, 종료 시에는 <code>Terminating:Wait</code>를 사용해야 합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — AWS Config는 라이프사이클 이벤트 트리거를 지원하지 않습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — CloudWatch 에이전트는 스크립트를 직접 실행하는 기능이 없습니다.</p>`,
  disc:[{ans:'D (86%)',txt:'"스케일-인 이벤트가 발생하면 라이프사이클 후크가 인스턴스를 일시 중지하고 EventBridge로 알림을 보냅니다. Lambda 함수를 호출하거나 인스턴스에 연결하여 로그를 다운로드할 수 있습니다." — AWS Blog'}]
},
{
  n:29,
  ko:`한 회사가 AWS Organizations의 조직에 여러 계정을 가지고 있습니다. 사용자는 운영 계정에서 중앙 관리되며 워크로드 계정에서는 사용자를 만들 수 없습니다. 회사는 최근 운영 팀을 추가했으며 <strong>각 워크로드 계정에 대한 관리자 액세스 권한</strong>을 제공해야 합니다.<br><br><strong>이 액세스를 제공하는 작업 조합 3가지는 무엇입니까?</strong>`,
  en:`A company has multiple accounts in an organization in AWS Organizations. Users are centrally managed from an operations account. No users can be created in the workload accounts. The company must provide operations team members with administrator access to each workload account.<br><br><strong>Which combination of actions will provide this access? (Choose three.)</strong>`,
  type:'multi',
  multiCount:3,
  choices:[
    {k:'A', ko:`운영 계정에서 SysAdmin 역할을 만듭니다. AdministratorAccess 정책을 연결합니다. 워크로드 계정에서 <code>sts:AssumeRole</code>을 허용하는 신뢰 관계를 설정합니다.`, en:`Create a SysAdmin role in the operations account. Attach AdministratorAccess. Modify the trust relationship to allow sts:AssumeRole from the workload accounts.`},
    {k:'B', ko:`각 <strong>워크로드 계정</strong>에서 SysAdmin 역할을 만듭니다. AdministratorAccess 정책을 연결합니다. <strong>운영 계정</strong>에서 <code>sts:AssumeRole</code>을 허용하는 신뢰 관계를 설정합니다.`, en:`Create a SysAdmin role in each workload account. Attach AdministratorAccess. Modify the trust relationship to allow sts:AssumeRole from the operations account.`},
    {k:'C', ko:`운영 계정에서 Amazon Cognito ID 풀을 만들고 SysAdmin 역할을 인증된 역할로 연결합니다.`, en:`Create an Amazon Cognito identity pool in the operations account. Attach the SysAdmin role as an authenticated role.`},
    {k:'D', ko:`운영 계정에서 각 운영 팀 구성원에 대한 <strong>IAM 사용자</strong>를 만듭니다.`, en:`In the operations account, create an IAM user for each operations team member.`},
    {k:'E', ko:`운영 계정에서 <strong>SysAdmins IAM 사용자 그룹</strong>을 만듭니다. 각 워크로드 계정의 SysAdmin 역할에 대한 <code>sts:AssumeRole</code>을 허용하는 IAM 정책을 추가합니다. 모든 운영 팀 구성원을 그룹에 추가합니다.`, en:`In the operations account, create an IAM user group named SysAdmins. Add an IAM policy that allows sts:AssumeRole for the SysAdmin role in each workload account. Add all operations team members to the group.`},
    {k:'F', ko:`운영 계정에서 Amazon Cognito 사용자 풀을 만들고 각 운영 팀원에 대해 Cognito 사용자를 만듭니다.`, en:`Create an Amazon Cognito user pool in the operations account. Create an Amazon Cognito user for each operations team member.`},
  ],
  answer:['B','D','E'],
  vote:'84% BDE',
  explain:`<p><span class="mark-ok">✅ B</span>: 워크로드 계정에 SysAdmin 역할을 생성하고, 운영 계정을 신뢰할 수 있도록 신뢰 관계를 설정합니다. (역할은 접근되는 계정에 생성)</p><p style="margin-top:8px;"><span class="mark-ok">✅ D</span>: 운영 계정에 IAM 사용자를 생성합니다. (워크로드 계정에는 사용자를 만들 수 없으므로)</p><p style="margin-top:8px;"><span class="mark-ok">✅ E</span>: 운영 계정의 SysAdmins 그룹에 각 워크로드 계정 역할로의 AssumeRole 권한을 부여합니다. 팀원을 그룹에 추가하여 관리를 단순화합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — 역할은 접근하는 계정(운영)이 아닌 접근받는 계정(워크로드)에 있어야 합니다. 신뢰 관계 방향이 반대입니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C, F</span> — Amazon Cognito는 애플리케이션 ID 관리용 서비스로 이 시나리오와 무관합니다.</p>`,
  disc:[{ans:'BDE (84%)',txt:'교차 계정 접근: 1단계-워크로드 계정에 역할 생성(운영 계정 신뢰). 2단계-운영 계정에 사용자 생성. 3단계-그룹에 AssumeRole 권한 부여. Cognito는 애플리케이션 인증용이므로 제외.'}]
},
{
  n:30,
  ko:`한 회사가 AWS Organizations의 여러 계정을 가지고 있습니다. 어떤 계정이든 S3 버킷에서 <strong>Block Public Access 기능을 끄면 SecOps 팀이 SNS 알림</strong>을 받아야 합니다. AWS 계정의 운영에 영향을 주지 않아야 하며, <strong>개별 멤버 계정에서 알림을 끌 수 없도록</strong> 해야 합니다.<br><br><strong>이 요구 사항을 충족하는 솔루션은 무엇입니까?</strong>`,
  en:`A company has multiple accounts in an AWS Organizations organization. The company's SecOps team needs to receive an Amazon SNS notification if any account turns off the Block Public Access feature on an Amazon S3 bucket. This must not affect the operation of any AWS accounts. Individual member accounts must not be able to turn off the notification.<br><br><strong>Which solution will meet these requirements?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`위임된 Amazon GuardDuty 관리자 계정을 지정합니다. 조직 전체에서 GuardDuty를 켭니다. GuardDuty 관리자 계정에서 SNS 토픽을 만들고 SecOps 팀 이메일을 구독합니다. GuardDuty 결과에 대한 EventBridge 규칙을 만들어 SNS 토픽을 대상으로 지정합니다.`, en:`Designate a delegated Amazon GuardDuty administrator account. Turn on GuardDuty for all accounts. Create an SNS topic in the GuardDuty administrator account. Create an EventBridge rule for GuardDuty findings targeting the SNS topic.`},
    {k:'B', ko:`AWS CloudFormation 템플릿으로 SNS 토픽을 만들고 SecOps 팀 이메일을 구독합니다. 템플릿에 <code>s3:PutBucketPublicAccessBlock</code> CloudTrail 이벤트 패턴과 SNS 토픽 대상의 EventBridge 규칙을 포함합니다. CloudFormation StackSets로 조직의 모든 계정에 배포합니다.`, en:`Create a CloudFormation template creating an SNS topic and subscribing SecOps team email. Include an EventBridge rule for s3:PutBucketPublicAccessBlock CloudTrail activity targeting the SNS topic. Deploy using CloudFormation StackSets to all accounts.`},
    {k:'C', ko:`조직 전체에서 AWS Config를 켭니다. 위임된 관리자 계정에서 SNS 토픽을 만들고 SecOps 팀 이메일을 구독합니다. <code>s3-bucket-level-public-access-prohibited</code> AWS Config 관리 규칙을 사용하고 <strong>AWS Systems Manager 문서를 사용하여 SNS 토픽에 이벤트를 게시하는 적합성 팩</strong>을 배포합니다.`, en:`Turn on AWS Config across the organization. Create an SNS topic in the delegated administrator account. Subscribe the SecOps team email. Deploy a conformance pack that uses the s3-bucket-level-public-access-prohibited Config managed rule and an AWS Systems Manager document to publish events to the SNS topic.`},
    {k:'D', ko:`조직 전체에서 Amazon Inspector를 켭니다. Amazon Inspector 위임 관리자 계정에서 SNS 토픽을 만들고 S3 버킷의 퍼블릭 네트워크 노출에 대한 EventBridge 규칙을 만듭니다.`, en:`Turn on Amazon Inspector across the organization. Create an SNS topic in the Inspector administrator account. Create an EventBridge rule for public network exposure of S3 buckets.`},
  ],
  answer:['C'],
  vote:'69% C (25% A)',
  explain:`<p><span class="mark-ok">✅ C — AWS Config 적합성 팩 + SSM Automation</span></p><p>AWS Config는 리소스 구성 변경을 추적하는 도구로 이 목적에 적합합니다. 적합성 팩(Conformance Pack)을 사용하면 <strong>조직 전체에 Config 규칙을 중앙에서 배포</strong>할 수 있으며, 위임된 관리자를 통해 멤버 계정이 규칙을 비활성화할 수 없습니다. SSM Automation 런북(<code>AWS-PublishSNSNotification</code>)으로 SNS 알림을 전송합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — StackSets로 배포하면 각 계정에서 관리자 권한을 가진 사용자가 EventBridge 규칙을 비활성화하여 알림을 끌 수 있습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ A</span> — GuardDuty는 위협 탐지에 특화된 서비스이며, S3 구성 변경 모니터링이 주목적이 아닙니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — Amazon Inspector는 EC2/컨테이너 취약성 스캔 도구로 S3 구성 변경 알림에 부적합합니다.</p>`,
  disc:[{ans:'C (69%)',txt:'AWS Config 적합성 팩은 조직 전체에 중앙에서 배포되며 멤버 계정이 수정할 수 없습니다. GuardDuty(A)는 Policy:S3/BucketBlockPublicAccessDisabled 발견 사항을 제공하지만 구성 모니터링보다는 위협 탐지 도구입니다.'}]
},
{
  n:31,
  ko:`한 회사가 컨테이너 기반 애플리케이션을 Amazon EKS로 마이그레이션했고 자동화된 이메일 알림을 설정하려 합니다. EKS 구성 요소 관련 특정 활동에 대해 각 이메일 주소로 알림을 보내야 합니다. 솔루션에는 Amazon SNS 토픽과 들어오는 로그 이벤트를 평가하고 올바른 SNS 토픽에 메시지를 게시하는 AWS Lambda 함수가 포함됩니다.<br><br><strong>이 요구 사항을 지원하는 로깅 솔루션은 무엇입니까?</strong>`,
  en:`A company migrated container-based applications to Amazon EKS and wants to establish automated email notifications. Notifications sent to each email address are for specific activities related to EKS components. The solution includes Amazon SNS topics and an AWS Lambda function to evaluate incoming log events and publish messages to the correct SNS topic.<br><br><strong>Which logging solution will support these requirements?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`Amazon CloudWatch Logs를 활성화하여 EKS 구성 요소를 로깅합니다. <strong>Lambda를 구독 피드 대상으로</strong> 하여 각 구성 요소에 대한 <strong>CloudWatch 구독 필터</strong>를 만듭니다.`, en:`Enable Amazon CloudWatch Logs to log the EKS components. Create a CloudWatch subscription filter for each component with Lambda as the subscription feed destination.`},
    {k:'B', ko:`Amazon CloudWatch Logs를 활성화하여 EKS 구성 요소를 로깅합니다. Lambda를 호출하는 Amazon EventBridge 이벤트에 연결된 CloudWatch Logs Insights 쿼리를 만듭니다.`, en:`Enable Amazon CloudWatch Logs to log EKS components. Create CloudWatch Logs Insights queries linked to Amazon EventBridge events that invoke Lambda.`},
    {k:'C', ko:`EKS 구성 요소에 대한 Amazon S3 로깅을 활성화합니다. Lambda를 구독 피드 대상으로 하여 각 구성 요소에 대한 Amazon CloudWatch 구독 필터를 구성합니다.`, en:`Enable Amazon S3 logging for EKS components. Configure a CloudWatch subscription filter for each component with Lambda as the destination.`},
    {k:'D', ko:`EKS 구성 요소에 대한 Amazon S3 로깅을 활성화합니다. AWS Lambda를 대상으로 S3 PUT Object 이벤트 알림을 구성합니다.`, en:`Enable Amazon S3 logging for EKS components. Configure S3 PUT Object event notifications with AWS Lambda as the destination.`},
  ],
  answer:['A'],
  vote:'97% A',
  explain:`<p><span class="mark-ok">✅ A — CloudWatch Logs + 구독 필터 → Lambda</span></p><p>Amazon EKS는 CloudWatch Logs와 통합되어 클러스터 컴포넌트 로그를 수집합니다. <strong>CloudWatch Logs 구독 필터</strong>를 사용하면 특정 패턴의 로그 이벤트가 발생할 때 실시간으로 Lambda를 호출할 수 있습니다. Lambda는 이벤트를 평가하고 올바른 SNS 토픽에 메시지를 게시합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — CloudWatch Logs Insights는 대화형 분석 도구이며 EventBridge 이벤트에 직접 연결할 수 없습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C, D</span> — EKS는 S3에 직접 로그를 저장하는 네이티브 통합이 없습니다. EKS 로그는 CloudWatch Logs에 기록됩니다.</p>`,
  disc:[{ans:'A (97%)',txt:'CloudWatch Logs 구독 필터 → Lambda 패턴은 실시간 로그 처리의 표준 방식입니다. EKS 컨트롤 플레인 로그는 CloudWatch Logs에 직접 스트리밍됩니다.'}]
},
{
  n:32,
  ko:`한 회사가 Amazon ECS 클러스터를 구현하고 있습니다. 아키텍처에는 ALB(Application Load Balancer)와 여러 ECS 서비스가 포함됩니다. DevOps 엔지니어는 애플리케이션과 액세스 로그를 수집하여 <strong>거의 실시간 분석을 위해 Amazon S3 버킷으로</strong> 보내야 합니다.<br><br><strong>이 요구 사항을 충족하는 단계 조합 3가지는 무엇입니까?</strong>`,
  en:`A company is implementing an Amazon ECS cluster. The architecture includes an Application Load Balancer and multiple ECS services. A DevOps engineer must collect application and access logs and send them to an Amazon S3 bucket for near-real-time analysis.<br><br><strong>Which combination of steps must the DevOps engineer take? (Choose three.)</strong>`,
  type:'multi',
  multiCount:3,
  choices:[
    {k:'A', ko:`AWS에서 Amazon CloudWatch Logs 컨테이너 인스턴스를 다운로드합니다. 이 인스턴스를 작업으로 구성하고 로깅 작업을 포함하도록 애플리케이션 서비스 정의를 업데이트합니다.`, en:`Download the Amazon CloudWatch Logs container instance from AWS. Configure as a task and update application service definitions to include the logging task.`},
    {k:'B', ko:`ECS 인스턴스에 Amazon CloudWatch Logs 에이전트를 설치합니다. <strong>ECS 작업 정의의 로깅 드라이버를 <code>awslogs</code>로 변경</strong>합니다.`, en:`Install the Amazon CloudWatch Logs agent on ECS instances. Change the logging driver in the ECS task definition to awslogs.`},
    {k:'C', ko:`Amazon EventBridge를 사용하여 60초마다 AWS Lambda를 예약하고 <code>create-export-task</code> 명령을 실행하여 출력을 로깅 S3 버킷으로 가리킵니다.`, en:`Use Amazon EventBridge to schedule an AWS Lambda function every 60 seconds to run the CloudWatch Logs create-export-task command pointing to the logging S3 bucket.`},
    {k:'D', ko:`<strong>ALB에서 액세스 로깅을 활성화</strong>합니다. ALB를 로깅 S3 버킷으로 직접 가리킵니다.`, en:`Activate access logging on the ALB. Then point the ALB directly to the logging S3 bucket.`},
    {k:'E', ko:`ECS 서비스가 사용하는 대상 그룹에서 액세스 로깅을 활성화하여 로깅 S3 버킷으로 직접 로그를 보냅니다.`, en:`Activate access logging on the target groups that the ECS services use. Send the logs directly to the logging S3 bucket.`},
    {k:'F', ko:`로깅 S3 버킷을 목적지로 하는 <strong>Amazon Kinesis Data Firehose 전달 스트림</strong>을 만듭니다. Kinesis Data Firehose에 대한 Amazon CloudWatch Logs <strong>구독 필터</strong>를 만듭니다.`, en:`Create an Amazon Kinesis Data Firehose delivery stream with a destination of the logging S3 bucket. Then create an Amazon CloudWatch Logs subscription filter for Kinesis Data Firehose.`},
  ],
  answer:['B','D','F'],
  vote:'100% BDF',
  explain:`<p><span class="mark-ok">✅ B</span>: ECS 작업 정의에서 로깅 드라이버를 <code>awslogs</code>로 설정하면 컨테이너 로그가 CloudWatch Logs로 전송됩니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ D</span>: ALB 액세스 로그는 ALB에서 직접 S3 버킷으로 전송됩니다. 대상 그룹 수준에서는 액세스 로그를 설정할 수 없습니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ F</span>: CloudWatch Logs → Kinesis Data Firehose → S3 경로는 <strong>거의 실시간</strong> 로그 전달을 제공합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ E</span> — ALB 액세스 로그는 대상 그룹이 아닌 ALB 수준에서 설정합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — CloudWatch Logs의 <code>create-export-task</code>는 비동기 배치 내보내기이며 거의 실시간이 아닙니다. Firehose가 거의 실시간을 위한 올바른 방법입니다.</p>`,
  disc:[{ans:'BDF (100%)',txt:'B: 앱 로그 → CW, D: 액세스 로그 → S3 (ALB 직접), F: CW → Kinesis Firehose → S3 (거의 실시간). 세 가지 경로를 합쳐야 모든 요구사항을 충족합니다.'}]
},
{
  n:33,
  ko:`전자 건강 기록을 사용하는 회사가 Amazon Linux 운영 체제의 EC2 인스턴스 플릿을 운영합니다. 환자 개인 정보 요구 사항으로 <strong>OS 및 애플리케이션 패치에 대한 지속적인 규정 준수</strong>를 보장해야 합니다.<br><br><strong>기본 및 사용자 지정 리포지토리를 사용하여 패치 배포를 자동화하는 방법은 무엇입니까?</strong>`,
  en:`A company running a fleet of Amazon EC2 instances with Amazon Linux must ensure continuous compliance for patches for operating system and applications. How can deployments of OS and application patches be automated using a default and custom repository?`,
  type:'single',
  choices:[
    {k:'A', ko:`AWS Systems Manager를 사용하여 <strong>사용자 지정 리포지토리를 포함하는 새 패치 베이스라인</strong>을 만듭니다. run 명령을 사용하여 <strong>AWS-RunPatchBaseline</strong> 문서를 실행하여 패치를 확인하고 설치합니다.`, en:`Use AWS Systems Manager to create a new patch baseline including the custom repository. Run the AWS-RunPatchBaseline document using the run command to verify and install patches.`},
    {k:'B', ko:`AWS Direct Connect를 사용하여 기업 리포지토리를 통합하고 Amazon CloudWatch 예약 이벤트를 사용하여 패치를 배포합니다.`, en:`Use AWS Direct Connect to integrate the corporate repository and deploy patches using Amazon CloudWatch scheduled events.`},
    {k:'C', ko:`yum-config-manager를 사용하여 사용자 지정 저장소를 <code>/etc/yum.repos.d</code>에 추가하고 활성화합니다.`, en:`Use yum-config-manager to add the custom repository under /etc/yum.repos.d and run yum-config-manager-enable to activate it.`},
    {k:'D', ko:`AWS Systems Manager를 사용하여 기업 리포지토리를 포함하는 새 패치 베이스라인을 만듭니다. run 명령을 사용하여 <strong>AWS-AmazonLinuxDefaultPatchBaseline</strong> 문서를 실행합니다.`, en:`Use AWS Systems Manager to create a new patch baseline including the corporate repository. Run the AWS-AmazonLinuxDefaultPatchBaseline document to verify and install patches.`},
  ],
  answer:['A'],
  vote:'100% A',
  explain:`<p><span class="mark-ok">✅ A — SSM Patch Manager + AWS-RunPatchBaseline</span></p><p>AWS Systems Manager Patch Manager에서 <strong>사용자 지정 리포지토리를 포함하는 패치 베이스라인</strong>을 생성할 수 있습니다. <code>AWS-RunPatchBaseline</code> SSM 문서는 인스턴스에 등록된 패치 베이스라인(기본 + 사용자 지정 포함)을 기반으로 패치를 스캔하고 설치합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ D</span> — <code>AWS-AmazonLinuxDefaultPatchBaseline</code>은 미리 정의된 기본 베이스라인을 적용하는 문서로 수정이 불가능하며, 사용자 지정 리포지토리를 포함할 수 없습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — 수동 yum 명령은 자동화 및 규정 준수 추적에 적합하지 않습니다.</p>`,
  disc:[{ans:'A (100%)',txt:'핵심 차이: AWS-RunPatchBaseline(A)은 사용자 정의 베이스라인을 적용. AWS-AmazonLinuxDefaultPatchBaseline(D)은 수정 불가한 기본 베이스라인만 사용.'}]
},
{
  n:34,
  ko:`한 회사가 AWS CodePipeline을 사용하여 릴리스를 자동화합니다. CodeDeploy로 ECS에 애플리케이션을 <strong>블루/그린 배포</strong> 합니다. 트래픽을 전환하기 전에 <strong>그린 버전을 테스트하는 스크립트를 구현</strong>하려 합니다(5분 이내 완료). 오류 발견 시 롤백해야 합니다.<br><br><strong>이 요구 사항을 충족하는 전략은 무엇입니까?</strong>`,
  en:`A company uses AWS CodePipeline to automate releases. AWS CodeDeploy deploys to Amazon ECS using blue/green deployment. The company wants to implement scripts to test the green version before shifting traffic (scripts complete in 5 minutes). If errors are discovered, the application must be rolled back.<br><br><strong>Which strategy will meet these requirements?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`소스와 배포 단계 사이에 CodePipeline 단계를 추가합니다. AWS CodeBuild로 런타임 환경을 만들고 buildspec 파일에서 테스트 스크립트를 호출합니다. 오류 시 <code>aws deploy stop-deployment</code> 명령으로 배포를 중지합니다.`, en:`Add a stage between source and deploy in CodePipeline. Use AWS CodeBuild to run test scripts. If errors are found, use aws deploy stop-deployment to stop the deployment.`},
    {k:'B', ko:`소스와 배포 단계 사이에 CodePipeline 단계를 추가합니다. 이 단계를 사용하여 테스트 스크립트를 실행하는 AWS Lambda 함수를 호출합니다. 오류 시 <code>aws deploy stop-deployment</code> 명령으로 배포를 중지합니다.`, en:`Add a stage between source and deploy in CodePipeline to invoke an AWS Lambda function that runs test scripts. If errors are found, use aws deploy stop-deployment to stop the deployment.`},
    {k:'C', ko:`CodeDeploy AppSpec 파일에 <code>hooks</code> 섹션을 추가합니다. <strong>AfterAllowTestTraffic</strong> 라이프사이클 이벤트를 사용하여 AWS Lambda 함수를 호출하여 테스트 스크립트를 실행합니다. <strong>오류 발견 시 Lambda 함수를 오류와 함께 종료하여 롤백을 시작</strong>합니다.`, en:`Add a hooks section to the CodeDeploy AppSpec file. Use the AfterAllowTestTraffic lifecycle event to invoke an AWS Lambda function to run test scripts. If errors are found, exit the Lambda function with an error to initiate rollback.`},
    {k:'D', ko:`CodeDeploy AppSpec 파일에 <code>hooks</code> 섹션을 추가합니다. <strong>AfterAllowTraffic</strong> 라이프사이클 이벤트를 사용하여 테스트 스크립트를 호출합니다. 오류 시 <code>aws deploy stop-deployment</code> CLI 명령으로 배포를 중지합니다.`, en:`Add a hooks section to the AppSpec file. Use the AfterAllowTraffic lifecycle event to invoke test scripts. If errors are found, use aws deploy stop-deployment to stop the deployment.`},
  ],
  answer:['C'],
  vote:'100% C',
  explain:`<p><span class="mark-ok">✅ C — AfterAllowTestTraffic + Lambda 오류 종료 → 자동 롤백</span></p><p>ECS 블루/그린 배포의 라이프사이클: BeforeAllowTraffic → <strong>AfterAllowTestTraffic</strong> → AfterAllowTraffic. <code>AfterAllowTestTraffic</code>은 테스트 트래픽이 그린 환경으로 전환된 후, 전체 프로덕션 트래픽 전환 전에 실행됩니다. Lambda 함수에서 오류와 함께 종료(exit with error)하면 CodeDeploy가 <strong>자동 롤백</strong>을 시작합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A, B</span> — 소스와 배포 단계 사이에 테스트를 추가하면 배포 전 테스트입니다. 그린 환경에 실제 배포된 후의 테스트가 아닙니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — <code>AfterAllowTraffic</code>은 전체 트래픽이 그린으로 전환된 후 실행됩니다. 이 시점에서는 이미 전체 트래픽이 전환되었으므로 롤백 시 영향이 더 큽니다. 또한 <code>stop-deployment</code>는 롤백이 아닌 배포 중지입니다.</p>`,
  disc:[{ans:'C (100%)',txt:'ECS Blue/Green 라이프사이클 이벤트 순서: BeforeInstall → Install → AfterInstall → AllowTestTraffic → AfterAllowTestTraffic → BeforeAllowTraffic → AllowTraffic → AfterAllowTraffic. AfterAllowTestTraffic에서 Lambda 오류 반환 시 롤백 트리거됨.'}]
},
{
  n:35,
  ko:`한 회사가 여러 리소스에서 사용하는 Amazon S3 버킷 앞에서 파일 게이트웨이 모드로 AWS Storage Gateway를 사용합니다. 업무가 시작되는 아침에 사용자는 <strong>전날 저녁에 타사에서 처리한 객체를 볼 수 없습니다.</strong> DevOps 엔지니어가 S3 버킷을 직접 보면 데이터는 있지만 Storage Gateway에는 없습니다.<br><br><strong>모든 업데이트된 타사 파일을 아침에 사용할 수 있도록 보장하는 솔루션은 무엇입니까?</strong>`,
  en:`A company uses AWS Storage Gateway in file gateway mode in front of an Amazon S3 bucket. In the morning, users do not see objects processed by a third party the previous evening. When a DevOps engineer looks directly at the S3 bucket, the data is there, but it is missing in Storage Gateway.<br><br><strong>Which solution ensures all updated third-party files are available in the morning?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`Storage Gateway에 대한 <strong>RefreshCache 명령</strong>을 실행하기 위해 AWS Lambda 함수를 호출하도록 <strong>매일 밤 Amazon EventBridge 이벤트</strong>를 구성합니다.`, en:`Configure a nightly Amazon EventBridge event to invoke an AWS Lambda function to run the RefreshCache command for Storage Gateway.`},
    {k:'B', ko:`AWS Transfer for SFTP를 사용하여 제3자에게 S3 버킷에 데이터를 넣도록 지시합니다.`, en:`Instruct the third party to put data into the S3 bucket using AWS Transfer for SFTP.`},
    {k:'C', ko:`볼륨 게이트웨이 모드에서 실행되도록 Storage Gateway를 수정합니다.`, en:`Modify Storage Gateway to run in volume gateway mode.`},
    {k:'D', ko:`S3 동일 리전 복제를 사용하여 S3 버킷에서 직접 변경한 모든 내용을 Storage Gateway에 복제합니다.`, en:`Use S3 Same-Region Replication to replicate any changes made directly in the S3 bucket to Storage Gateway.`},
  ],
  answer:['A'],
  vote:'97% A',
  explain:`<p><span class="mark-ok">✅ A — EventBridge 야간 스케줄 + Lambda RefreshCache</span></p><p>Storage Gateway 파일 게이트웨이는 파일 공유를 통해 쓰기 시 캐시를 자동 업데이트하지만, <strong>S3 버킷에 직접 업로드된 파일은 캐시를 자동 업데이트하지 않습니다.</strong> 타사가 S3에 직접 파일을 올리므로 캐시 갱신이 필요합니다. EventBridge 야간 스케줄로 Lambda를 실행하여 <code>RefreshCache</code> API를 호출하면 S3의 최신 상태가 게이트웨이에 반영됩니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — AWS Transfer for SFTP를 사용해도 S3에 PutObject하는 것은 동일하며, Storage Gateway 캐시는 자동 갱신되지 않아 같은 문제가 발생합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — S3 복제는 S3 버킷 간의 기능이며, Storage Gateway 캐시를 갱신하는 메커니즘이 아닙니다.</p>`,
  disc:[{ans:'A (97%)',txt:'"Storage Gateway doesn\'t automatically update the cache when you upload a file directly to Amazon S3. When you do this, you must perform a RefreshCache operation." — AWS 공식 문서'}]
},
{
  n:36,
  ko:`DevOps 엔지니어가 <strong>개인 버킷 정책이 있는 S3 버킷의 민감한 객체를 S3 Cross-Region Replication</strong>으로 백업해야 합니다. 객체를 다른 AWS 리전 및 다른 계정의 대상 버킷에 복사해야 합니다.<br><br><strong>이 복제를 활성화하기 위해 수행해야 할 작업 3가지는 무엇입니까?</strong>`,
  en:`A DevOps engineer needs to back up sensitive Amazon S3 objects stored in a bucket with a private bucket policy using S3 cross-Region replication. The objects need to be copied to a target bucket in a different AWS Region and account.<br><br><strong>Which combination of actions should be performed? (Choose three.)</strong>`,
  type:'multi',
  multiCount:3,
  choices:[
    {k:'A', ko:`소스 계정에서 <strong>복제 IAM 역할</strong>을 생성합니다.`, en:`Create a replication IAM role in the source account.`},
    {k:'B', ko:`대상 계정에서 복제 IAM 역할을 생성합니다.`, en:`Create a replication IAM role in the target account.`},
    {k:'C', ko:`소스 버킷 정책에 복제 IAM 역할이 객체를 복제할 수 있도록 허용하는 명령문을 추가합니다.`, en:`Add statements to the source bucket policy allowing the replication IAM role to replicate objects.`},
    {k:'D', ko:`<strong>대상 버킷 정책</strong>에 복제 IAM 역할이 객체를 복제할 수 있도록 허용하는 명령문을 추가합니다.`, en:`Add statements to the target bucket policy allowing the replication IAM role to replicate objects.`},
    {k:'E', ko:`소스 버킷에서 <strong>복제 규칙</strong>을 만들어 복제를 활성화합니다.`, en:`Create a replication rule in the source bucket to enable the replication.`},
    {k:'F', ko:`대상 버킷에서 복제 규칙을 생성하여 복제를 활성화합니다.`, en:`Create a replication rule in the target bucket to enable the replication.`},
  ],
  answer:['A','D','E'],
  vote:'100% ADE',
  explain:`<p><span class="mark-ok">✅ A</span>: S3가 객체를 복제하는 데 사용할 IAM 역할을 <strong>소스 계정</strong>에 생성합니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ D</span>: 교차 계정 복제 시 대상 계정의 버킷 정책에 소스 계정의 복제 역할이 객체를 쓸 수 있도록 허용하는 구문을 추가합니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ E</span>: 소스 버킷에 복제 규칙(대상 버킷 ARN, IAM 역할, 필터 등)을 생성하여 복제를 활성화합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — 복제 IAM 역할은 소스 계정에 생성합니다. S3가 소스 계정 역할을 수임하여 대상 버킷에 복사합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ F</span> — 복제 규칙은 소스 버킷에 설정합니다. 대상 버킷에는 버킷 정책만 필요합니다.</p>`,
  disc:[{ans:'ADE (100%)',txt:'교차 계정 S3 복제 단계: 1) 소스 계정에 IAM 역할 생성 2) 대상 버킷 정책에 허용 구문 추가 3) 소스 버킷에 복제 규칙 생성. — AWS S3 교차 계정 복제 문서'}]
},
{
  n:37,
  ko:`한 회사가 AWS Organizations의 여러 멤버 계정을 가지고 있습니다. 보안 팀은 관리 계정의 <strong>AWS Lambda 함수</strong>를 사용하여 <strong>모든 EC2 보안 그룹과 인바운드/아웃바운드 규칙을 프로그래밍 방식으로 검색</strong>해야 합니다.<br><br><strong>이 요구 사항을 충족하는 액세스 변경 조합 3가지는 무엇입니까?</strong>`,
  en:`A company has multiple member accounts in an organization in AWS Organizations. The security team wants to programmatically retrieve all Amazon EC2 security groups and their inbound and outbound rules from member accounts using an AWS Lambda function in the management account.<br><br><strong>Which combination of access changes will meet these requirements? (Choose three.)</strong>`,
  type:'multi',
  multiCount:3,
  choices:[
    {k:'A', ko:`멤버 계정의 사용자가 관리 계정 IAM 역할을 맡을 수 있도록 하는 신뢰 관계를 만듭니다.`, en:`Create a trust relationship that allows users in the member accounts to assume the management account IAM role.`},
    {k:'B', ko:`<strong>관리 계정의 사용자</strong>가 멤버 계정의 IAM 역할을 맡을 수 있도록 하는 신뢰 관계를 만듭니다.`, en:`Create a trust relationship that allows users in the management account to assume the IAM roles of the member accounts.`},
    {k:'C', ko:`각 <strong>멤버 계정</strong>에서 <strong>AmazonEC2ReadOnlyAccess</strong> 관리 정책에 액세스할 수 있는 IAM 역할을 생성합니다.`, en:`Create an IAM role in each member account that has access to the AmazonEC2ReadOnlyAccess managed policy.`},
    {k:'D', ko:`각 멤버 계정에서 IAM 역할을 생성하여 관리 계정 IAM 역할의 ARN에 대해 <code>sts:AssumeRole</code> 작업을 허용합니다.`, en:`Create an IAM role in each member account to allow the sts:AssumeRole action against the management account IAM role's ARN.`},
    {k:'E', ko:`멤버 계정 IAM 역할의 ARN에 대해 <code>sts:AssumeRole</code> 작업을 허용하는 IAM 역할을 <strong>관리 계정</strong>에서 생성합니다.`, en:`Create an IAM role in the management account that allows the sts:AssumeRole action against the member account IAM role's ARN.`},
    {k:'F', ko:`AmazonEC2ReadOnlyAccess 관리 정책에 액세스할 수 있는 IAM 역할을 관리 계정에서 생성합니다.`, en:`Create an IAM role in the management account that has access to the AmazonEC2ReadOnlyAccess managed policy.`},
  ],
  answer:['B','C','E'],
  vote:'80% BCE',
  explain:`<p><span class="mark-ok">✅ B</span>: 관리 계정의 Lambda 역할이 멤버 계정 역할을 Assume할 수 있도록 신뢰 관계를 설정합니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ C</span>: 각 멤버 계정에 EC2 읽기 전용 권한(<code>AmazonEC2ReadOnlyAccess</code>)을 가진 IAM 역할을 생성합니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ E</span>: 관리 계정에 멤버 계정 IAM 역할을 Assume할 수 있는 권한을 가진 IAM 역할을 생성합니다. Lambda는 이 역할을 사용합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — 방향이 반대입니다. 관리 계정이 멤버 계정 역할을 맡아야 하며, 멤버가 관리 계정 역할을 맡는 것이 아닙니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ F</span> — EC2ReadOnly 권한을 관리 계정에 두어도 다른 계정의 EC2에 접근할 수 없습니다. 각 멤버 계정에 권한이 있어야 합니다.</p>`,
  disc:[{ans:'BCE (80%)',txt:'교차 계정 접근 패턴: 관리 계정(Lambda) → AssumeRole → 멤버 계정 역할(EC2ReadOnly). B=신뢰관계, C=멤버역할(권한), E=관리역할(AssumeRole 권한).'}]
},
{
  n:38,
  ko:`우주 탐사 회사가 여러 위성에서 원격 측정 데이터를 수신합니다. 소량의 데이터 패킷이 Amazon API Gateway를 통해 수신되어 Amazon SQS 표준 대기열에 배치됩니다. 사용자 지정 애플리케이션이 데이터를 표준 형식으로 변환합니다.<br><br>데이터 불일치로 <strong>애플리케이션이 가끔 데이터를 변환할 수 없고</strong>, 해당 메시지는 SQS 대기열에 남습니다. DevOps 엔지니어는 <strong>실패한 메시지를 보관하고 과학자가 검토할 수 있도록</strong> 해야 합니다.<br><br><strong>이 요구 사항을 충족하는 솔루션은 무엇입니까?</strong>`,
  en:`A space exploration company receives telemetry data from multiple satellites through Amazon API Gateway and places it in an Amazon SQS standard queue. A custom application transforms the data. Due to inconsistencies, the application is occasionally unable to transform the data, and the messages remain in the SQS queue. A DevOps engineer must retain the failed messages and make them available to scientists for review.<br><br><strong>Which solution will meet these requirements?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`AWS Lambda를 구성하여 SQS 대기열을 폴링하고 메시지가 유효한지 확인합니다. 검증 실패 시 데이터 사본을 Amazon S3 버킷으로 보내 과학자가 검토할 수 있도록 합니다. 수정 후 재생 Lambda 함수로 SQS 대기열의 메시지를 수정합니다.`, en:`Configure AWS Lambda to poll the SQS queue and check validity. If validation fails, send a copy to an S3 bucket for review. Amend the message using a replay Lambda function.`},
    {k:'B', ko:`SQS 표준 대기열을 SQS FIFO 대기열로 변환합니다. Amazon EventBridge 일정으로 10분마다 Lambda를 구성하여 5분보다 오래된 메시지를 식별하고 처리합니다.`, en:`Convert the SQS standard queue to FIFO. Configure Lambda via EventBridge schedule every 10 minutes to identify messages older than 5 minutes.`},
    {k:'C', ko:`<strong>SQS Dead-Letter Queue(배달 못한 편지 대기열)</strong>를 만듭니다. Maximum Receives를 1로 설정하고 DLQ ARN을 지정하는 <strong>재구동 정책</strong>을 포함하여 기존 대기열을 수정합니다. 과학자들에게 DLQ를 사용하여 유효하지 않은 데이터를 검토하도록 지시합니다.`, en:`Create an SQS dead-letter queue. Modify the existing queue by including a redrive policy that sets Maximum Receives to 1 and sets the DLQ ARN. Instruct scientists to use the dead-letter queue to review invalid data.`},

      { k:'B', ko:`<strong>지연 기반 라우팅(Latency-based routing)</strong>과 <strong>상태 확인</strong>을 사용하여 <strong>북미 및 유럽의 API Gateway API</strong>를 가리키도록 <strong>Amazon Route 53</strong>을 구성합니다. 해당 리전의 Lambda 함수로 요청을 전달하도록 API를 구성합니다. <strong>DynamoDB 글로벌 테이블</strong>에서 데이터를 검색하고 업데이트합니다.`, en:`Configure <strong>Amazon Route 53</strong> to point to <strong>API Gateway APIs in North America and Europe</strong> using <strong>latency-based routing and health checks</strong>. Configure the APIs to forward requests to a Lambda function in that Region. Configure the Lambda functions to retrieve and update the data in a <strong>DynamoDB global table</strong>.` },
      { k:'C', ko:`<strong>Amazon Route 53</strong>을 <strong>북미의 API Gateway</strong>를 가리키도록 구성하고, 유럽에 <strong>재해 복구 API</strong>를 만듭니다. <strong>DynamoDB 글로벌 테이블</strong>에서 데이터를 검색합니다. Lambda 함수를 배포하여 <strong>5분마다 북미 API 상태를 확인</strong>하고 장애 발생 시 Route 53을 업데이트합니다.`, en:`Configure <strong>Amazon Route 53</strong> to point to <strong>API Gateway in North America</strong>, create a <strong>disaster recovery API in Europe</strong>. Retrieve the data from a <strong>DynamoDB global table</strong>. Deploy a Lambda function to <strong>check the North America API health every 5 minutes</strong>. In the event of a failure, update Route 53 to point to the disaster recovery API.` },
      { k:'D', ko:`<strong>지연 기반 라우팅</strong>을 사용하여 <strong>북미의 API Gateway API만</strong> 가리키도록 Amazon Route 53을 구성합니다. 사용자에게 가장 가까운 리전의 Lambda 함수로 요청을 전달하도록 API를 구성합니다.`, en:`Configure <strong>Amazon Route 53</strong> to point to <strong>API Gateway API in North America only</strong> using latency-based routing. Configure the API to forward requests to the Lambda function in the Region nearest to the user.` },
    ],
    answer: ['B'],
    vote: 'B 100%',
    explain: `<p><span class="mark-ok">✅ B — Route 53 지연 기반 라우팅 + 상태 확인 + 리전별 API Gateway/Lambda + DynamoDB 글로벌 테이블</span></p>
<p><strong>지연 기반 라우팅</strong>으로 사용자를 가장 가까운 API Gateway 엔드포인트(북미 또는 유럽)로 안내하여 빠른 응답을 보장합니다. <strong>상태 확인</strong>으로 비정상 엔드포인트에서 트래픽을 우회하여 고신뢰성을 제공합니다. <strong>DynamoDB 글로벌 테이블</strong>로 모든 리전에서 일관된 데이터에 저지연 액세스가 가능합니다.</p>`,
    wrong: `<p><span class="mark-no">❌ A</span> — 상태 확인만으로는 빠른 응답이 보장되지 않습니다. 지연 기반 라우팅이 없으면 유럽 사용자가 북미 API로 라우팅될 수 있습니다.</p>
<p style="margin-top:8px;"><span class="mark-no">❌ C</span> — 5분 주기 상태 확인은 실시간 자동 장애 조치가 아닙니다. Route 53 상태 확인이 이미 자동으로 처리합니다.</p>
<p style="margin-top:8px;"><span class="mark-no">❌ D</span> — 북미 API Gateway만 사용하면 유럽 사용자에게 높은 지연이 발생합니다.</p>`,
    disc: [
      { ans: 'B (100%)', txt: '신뢰성(Reliability) = 상태 확인 + 장애 조치. 빠른 응답(Fast response) = 지연 기반 라우팅 + 리전별 배포. 두 가지 모두 필요하므로 B가 정답입니다.' }
    ]
  },
];
// ────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────
let curQ = 0;
let state = QS.map(() => ({ sel: [], done: false }));
let curLang = 'ko';

// ────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────
function init() {
  buildSelect();
  renderQ(0);
}

function buildSelect() {
  const sel = document.getElementById('q-select');
  sel.innerHTML = '';
  QS.forEach((q, i) => {
    const opt = document.createElement('option');
    opt.value = q.n;
    opt.textContent = `Q${String(q.n).padStart(3,'0')}`;
    sel.appendChild(opt);
  });
}

function updateSelectStatus() {
  const sel = document.getElementById('q-select');
  Array.from(sel.options).forEach((opt, i) => {
    const s = state[i];
    const q = QS[i];
    opt.className = '';
    if (s.done) {
      const correct = arraysEqual(s.sel.slice().sort(), q.answer.slice().sort());
      opt.textContent = `Q${String(q.n).padStart(3,'0')} ${correct ? '✓' : '✗'}`;
      opt.className = correct ? 'opt-correct' : 'opt-wrong';
    } else {
      opt.textContent = `Q${String(q.n).padStart(3,'0')}`;
    }
  });
  sel.value = QS[curQ].n;
}

// ────────────────────────────────────────────────
// RENDER
// ────────────────────────────────────────────────
function renderQ(idx) {
  if (idx < 0 || idx >= QS.length) return;
  curQ = idx;
  const q = QS[idx];
  const s = state[idx];

  // counter / progress
  document.getElementById('progress-fill').style.width = `${((idx+1)/QS.length)*100}%`;
  document.getElementById('q-num-badge').textContent = String(q.n).padStart(3,'0');

  // type badge
  const tb = document.getElementById('q-type-badge');
  if (q.type === 'multi') {
    tb.textContent = `복수 선택 (${q.multiCount}개)`;
    tb.className = 'q-type-badge multi';
  } else {
    tb.textContent = '단일 선택';
    tb.className = 'q-type-badge';
  }

  // question text
  document.getElementById('q-ko-text').innerHTML = q.ko;
  document.getElementById('q-en-text').innerHTML = q.en;

  // choices label
  document.getElementById('choices-label').textContent =
    q.type === 'multi' ? `선택지 — ${q.multiCount}개 선택` : '선택지 — 단일 선택';

  // choices
  const cc = document.getElementById('choices-container');
  cc.innerHTML = '';
  q.choices.forEach(ch => {
    const div = document.createElement('div');
    let cls = 'choice';
    if (s.done) {
      cls += ' disabled';
      if (q.answer.includes(ch.k)) cls += ' correct';
      else if (s.sel.includes(ch.k)) cls += ' wrong';
    } else if (s.sel.includes(ch.k)) {
      cls += ' selected';
    }
    div.className = cls;
    div.id = `choice-${idx}-${ch.k}`;

    let icon = '';
    if (s.done) {
      if (q.answer.includes(ch.k)) icon = '✓';
      else if (s.sel.includes(ch.k)) icon = '✗';
    }

    div.innerHTML = `
      <div class="choice-key">${ch.k}</div>
      <div class="choice-body">
        <div class="choice-text">${ch.ko}</div>
        <div class="choice-en">${ch.en}</div>
      </div>
      <div class="result-icon">${icon}</div>`;

    if (!s.done) div.onclick = () => doSelect(idx, ch.k);
    cc.appendChild(div);
    document.getElementById('btn-prev-top').disabled = idx === 0;
    document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
  });

  applyLang(curLang);

  // review button
  document.getElementById('btn-review').disabled = s.done || s.sel.length === 0;

  // hint
  const hint = document.getElementById('hint-text');
  if (s.done) {
    const correct = arraysEqual(s.sel.slice().sort(), q.answer.slice().sort());
    hint.textContent = correct ? '🎉 정답입니다!' : `❌ 오답입니다. 정답은 ${q.answer.join(', ')} 입니다.`;
  } else if (s.sel.length > 0) {
    const remaining = q.type === 'multi' ? q.multiCount - s.sel.length : 0;
    if (q.type === 'multi' && remaining > 0) {
      hint.textContent = `${s.sel.join(', ')}번 선택됨. ${remaining}개 더 선택하세요.`;
    } else {
      hint.textContent = `${s.sel.join(', ')}번을 선택했습니다. 정답 확인 버튼을 눌러주세요.`;
    }
  } else {
    hint.textContent = '선택지를 클릭하면 정답 확인 버튼이 활성화됩니다.';
  }

  // review panel
  const rp = document.getElementById('review-panel');
  if (s.done) { renderReview(q); rp.classList.add('show'); }
  else rp.classList.remove('show');

  // nav buttons
  document.getElementById('btn-prev-top').disabled = idx === 0;
  document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
  //document.getElementById('nav-info').textContent = `${idx+1} / ${QS.length} 문제`;

  // select 동기화
  updateSelectStatus();
}

function renderReview(q) {
  document.getElementById('review-answer-badge').textContent = '✓ ' + q.answer.join(', ');
  document.getElementById('review-vote-badge').innerHTML = `커뮤니티 투표 <span>${q.vote}</span>`;
  document.getElementById('review-explain').innerHTML = q.explain;

  const ws = document.getElementById('review-wrong');
  const wt = document.getElementById('wrong-section-title');
  if (q.wrong) { ws.innerHTML = q.wrong; ws.style.display=''; wt.style.display=''; }
  else { ws.style.display='none'; wt.style.display='none'; }

  const dl = document.getElementById('disc-list');
  dl.innerHTML = '';
  dl.classList.remove('show');
  (q.disc||[]).forEach(d => {
    dl.innerHTML += `<div class="disc-item"><div class="disc-ans">${d.ans}</div>${d.txt}</div>`;
  });
}

// ────────────────────────────────────────────────
// INTERACTION
// ────────────────────────────────────────────────
function doSelect(idx, key) {
  const q = QS[idx];
  const s = state[idx];
  if (s.done) return;
  if (q.type === 'single') {
    s.sel = [key];
  } else {
    const pos = s.sel.indexOf(key);
    if (pos >= 0) s.sel.splice(pos, 1);
    else if (s.sel.length < q.multiCount) s.sel.push(key);
  }
  renderQ(idx);
}

function doReview() {
  const s = state[curQ];
  if (s.sel.length === 0 || s.done) return;
  s.done = true;
  renderQ(curQ);
  document.getElementById('review-panel').scrollIntoView({behavior:'smooth',block:'start'});
}

function doReset() {
  state[curQ] = { sel: [], done: false };
  renderQ(curQ);
}

function goQ(idx) {
  idx = parseInt(idx);
  if (isNaN(idx) || idx < 0 || idx >= QS.length) return;
  renderQ(idx);
  window.scrollTo({top:0, behavior:'smooth'});
}

function goQWithReset(idx) {
  idx = parseInt(idx);
  if (isNaN(idx) || idx < 0 || idx >= QS.length) return;

  // 🔥 언어 강제 한국어
  curLang = 'ko';
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.lang-tab')[0].classList.add('active');

  // 🔥 해당 문제 상태 초기화
//  state[idx] = { sel: [], done: false };

  renderQ(idx);
  window.scrollTo({top:0, behavior:'smooth'});
//  document.getElementById('btn-prev-top').disabled = idx === 0;
//  document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
}

// ────────────────────────────────────────────────
// LANG  (한국어 / 양국어)
// ────────────────────────────────────────────────
function setLang(lang, btn) {
  curLang = lang;
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  applyLang(lang);
}

function applyLang(lang) {
  // 문제 영어 텍스트 — 'both'일 때 block으로 명시해야 CSS display:none을 덮어씀
  const enQ = document.getElementById('q-en-text');
  enQ.style.display = (lang === 'both') ? 'block' : 'none';
  // 선택지 영어 텍스트
  document.querySelectorAll('.choice-en').forEach(e => {
    e.style.display = (lang === 'both') ? 'block' : 'none';
  });
}

// ────────────────────────────────────────────────
// THEME
// ────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('theme-icon').textContent = dark ? '☀️' : '🌙';
  document.getElementById('theme-label').textContent = dark ? '라이트' : '다크';
}

// ────────────────────────────────────────────────
// UTILS
// ────────────────────────────────────────────────
function arraysEqual(a, b) {
  return a.length === b.length && a.every((v,i) => v === b[i]);
}

init();
</script>
</body>
</html>
