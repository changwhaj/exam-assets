<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS DOP-C02 | SET 01 (Q001~Q050)</title>
<style>
[data-theme="dark"] {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#222636; --border:#2e3347;
  --accent:#4f8ef7; --accent2:#38c9a0; --text:#e2e6f0; --text-muted:#7a83a0;
  --correct-bg:#112a22; --wrong-bg:#2a1111; --explain-bg:#1e2030;
  --hover-bg:#1e2236; --sel-bg:#1b2540;
}
[data-theme="light"] {
  --bg:#f0f2f8; --surface:#ffffff; --surface2:#f5f6fa; --border:#d0d5e8;
  --accent:#2e6fe0; --accent2:#1aaa7e; --text:#1a1d2e; --text-muted:#5a6280;
  --correct-bg:#e6faf4; --wrong-bg:#fde8e8; --explain-bg:#f0f2fa;
  --hover-bg:#eaf1ff; --sel-bg:#ddeaff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard','Noto Sans KR','Segoe UI',sans-serif;font-size:15px;line-height:1.75;min-height:100vh;transition:background .25s,color .25s;}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 60px;}

/* Topbar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.badge{background:linear-gradient(135deg,#4f8ef7,#38c9a0);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 12px;border-radius:20px;white-space:nowrap;}
.topbar-title{font-size:13px;color:var(--text-muted);flex:1;min-width:120px;}
.topbar-title strong{color:var(--text);font-size:15px;display:block;}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}

/* 문제 선택 콤보박스 */
.q-select-wrap{display:flex;align-items:center;gap:6px;}
.q-select-label{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.q-select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-weight:600;padding:5px 10px;cursor:pointer;outline:none;transition:border-color .2s;}
.q-select:focus,.q-select:hover{border-color:var(--accent);}
.q-select option.opt-correct{color:#1aaa7e;}
.q-select option.opt-wrong{color:#e05252;}

/* 상단 네비 버튼 + 문제 콤보 높이 통일 */
.topbar-right .btn-nav,
.topbar-right .q-select {
  height: 24px;
  padding: 0 14px;
  font-size: 13px;
}

/* 테마 버튼 */
.theme-btn{background:var(--surface2);border:1px solid var(--border);border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-muted);transition:border-color .2s,color .2s;white-space:nowrap;}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}

/* Progress */
.progress-bar{background:var(--surface2);border-radius:4px;height:6px;margin-bottom:20px;overflow:hidden;}
.progress-fill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:4px;transition:width .4s;}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:16px;transition:background .25s,border-color .25s;}

/* Lang Tabs */
.lang-tabs{display:flex;gap:8px;margin-bottom:20px;}
.lang-tab{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.04em;padding:5px 14px;transition:all .2s;}
.lang-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.lang-tab:hover:not(.active){border-color:var(--accent);color:var(--accent);}

/* Q Label */
.q-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-bottom:10px;}
.q-type-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:10px;margin-left:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);vertical-align:middle;}
.q-type-badge.multi{background:#ede9ff;color:#6d28d9;border-color:#c4b5fd;}
[data-theme="dark"] .q-type-badge.multi{background:#2a1f50;color:#a78bfa;border-color:#4c3a8c;}

/* Q Text */
.q-text{font-size:15px;color:var(--text);line-height:1.85;}
.q-text.en-text{
  font-size:14px;color:var(--text-muted);
  margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--border);
}
.q-text code{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:13px;font-family:'JetBrains Mono','Fira Code',monospace;color:var(--accent2);}

/* Choices */
.choices-section{margin-top:24px;}
.choices-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px;}
.choice{display:flex;align-items:flex-start;gap:14px;background:var(--surface2);border:2px solid var(--border);border-radius:10px;cursor:pointer;margin-bottom:10px;padding:14px 18px;transition:border-color .2s,background .2s;user-select:none;}
.choice:hover{border-color:var(--accent);background:var(--hover-bg);}
.choice.selected{border-color:var(--accent);background:var(--sel-bg);}
.choice.correct{border-color:#38c9a0!important;background:var(--correct-bg)!important;}
.choice.wrong{border-color:#f76f6f!important;background:var(--wrong-bg)!important;}
.choice.disabled{cursor:default;pointer-events:none;}
.choice-key{background:var(--border);border-radius:6px;color:var(--text);font-size:13px;font-weight:700;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:background .2s,color .2s;}
.choice.selected .choice-key{background:var(--accent);color:#fff;}
.choice.correct .choice-key{background:#38c9a0;color:#000;}
.choice.wrong .choice-key{background:#f76f6f;color:#fff;}
.choice-body{flex:1;}
.choice-text{font-size:14px;line-height:1.75;}
.choice-en{font-size:12px;color:var(--text-muted);margin-top:5px;display:none;font-style:italic;}
.result-icon{margin-left:auto;font-size:18px;flex-shrink:0;display:none;}
.choice.correct .result-icon,.choice.wrong .result-icon{display:block;}

/* Actions */
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center;}
.btn{border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.03em;padding:11px 24px;transition:opacity .2s,transform .1s;}
.btn:hover:not(:disabled){opacity:.88;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-nav{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:11px 18px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.hint-text{font-size:12px;color:var(--text-muted);margin-top:8px;min-height:18px;}

/* Review Panel */
.review-panel{display:none;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent2);border-radius:12px;padding:24px 28px;margin-bottom:16px;animation:fadeIn .35s ease;transition:background .25s;}
.review-panel.show{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.answer-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.answer-label{font-size:13px;color:var(--text-muted);}
.answer-badge{background:#38c9a0;color:#000;font-size:13px;font-weight:800;padding:4px 14px;border-radius:20px;}
.vote-badge{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);font-size:12px;padding:3px 10px;border-radius:20px;}
.vote-badge span{color:var(--accent);font-weight:700;}
.section-title{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent2);text-transform:uppercase;margin-bottom:10px;}
.explain-box{background:var(--explain-bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;font-size:14px;line-height:1.8;color:var(--text);}
.explain-box p{margin-bottom:8px;}
.explain-box p:last-child{margin-bottom:0;}
.mark-ok{color:#38c9a0;font-weight:700;}
.mark-no{color:#f76f6f;font-weight:600;}

/* Discussion */
.disc-toggle{background:transparent;border:1px dashed var(--border);border-radius:8px;color:var(--text-muted);cursor:pointer;font-size:13px;margin-top:8px;padding:9px 16px;width:100%;text-align:left;transition:border-color .2s,color .2s;}
.disc-toggle:hover{border-color:var(--accent);color:var(--accent);}
.disc-list{display:none;margin-top:10px;}
.disc-list.show{display:block;}
.disc-item{background:var(--surface2);border-left:3px solid var(--border);border-radius:0 6px 6px 0;font-size:13px;margin-bottom:8px;padding:10px 14px;color:var(--text-muted);line-height:1.7;}
.disc-ans{color:var(--accent);font-weight:700;font-size:12px;margin-bottom:3px;}

/* Bottom Nav */
.nav-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px;}
.nav-info{font-size:13px;color:var(--text-muted);text-align:center;flex:1;}

@media(max-width:600px){
  .card{padding:16px;}
  .btn{padding:10px 16px;font-size:13px;}
  .topbar{gap:8px;}
  .topbar-right{gap:6px;}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- Topbar -->
  <div class="topbar">
    <span class="badge">AWS DOP-C02</span>
    <div class="topbar-title">
      <strong>AWS Certified DevOps Engineer – Professional</strong>
      SET 01 · Q001~Q050 실전 학습
    </div>
    <div class="topbar-right">
      <!-- 상단 네비게이션 -->
      <button class="btn btn-nav" onclick="goQWithReset(curQ-1)" id="btn-prev-top">←</button>

      <!-- 문제 선택 콤보박스 -->
      <div class="q-select-wrap">
        <select class="q-select" id="q-select" onchange="goQWithReset(this.value-1)"></select>
      </div>
      <button class="btn btn-nav" onclick="goQWithReset(curQ+1)" id="btn-next-top">→</button>

      <!-- 테마 토글 -->
      <button class="theme-btn" onclick="toggleTheme()">
        <span id="theme-icon">☀️</span>
        <span id="theme-label">라이트</span>
      </button>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:5%"></div></div>

  <!-- Language Tabs -->
  <div class="lang-tabs">
    <button class="lang-tab active" onclick="setLang('ko',this)">한국어</button>
    <button class="lang-tab" onclick="setLang('both',this)">양국어</button>
  </div>

  <!-- Question Card -->
  <div class="card" id="q-card">
    <div class="q-label">
      문제 <span id="q-num-badge">001</span>
      <span id="q-type-badge" class="q-type-badge">단일 선택</span>
    </div>
    <!-- 한국어 문제 -->
    <div class="q-text" id="q-ko-text"></div>
    <!-- 영어 문제 (양국어 모드) -->
    <div class="q-text en-text" id="q-en-text"></div>

    <div class="choices-section">
      <div class="choices-label" id="choices-label">선택지</div>
      <div id="choices-container"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btn-review" onclick="doReview()" disabled>📋 정답 확인</button>
      <button class="btn btn-secondary" onclick="doReset()">↺ 초기화</button>
    </div>
    <div class="hint-text" id="hint-text">선택지를 클릭하면 정답 확인 버튼이 활성화됩니다.</div>
  </div>

  <!-- Review Panel -->
  <div class="review-panel" id="review-panel">
    <div class="answer-row">
      <span class="answer-label">정답</span>
      <span class="answer-badge" id="review-answer-badge"></span>
      <span class="vote-badge" id="review-vote-badge"></span>
    </div>
    <div class="section-title">✦ 정답 해설</div>
    <div class="explain-box" id="review-explain"></div>
    <div class="section-title" style="margin-top:14px;" id="wrong-section-title">✦ 오답 분석</div>
    <div class="explain-box" id="review-wrong"></div>
    <button class="disc-toggle" onclick="document.getElementById('disc-list').classList.toggle('show')">💬 주요 토론 의견 보기 / 숨기기</button>
    <div class="disc-list" id="disc-list"></div>
  </div>

  <!-- Bottom Nav -->
  <!-- <div class="nav-bottom">
    <button class="btn btn-nav" onclick="goQ(curQ-1)" id="btn-prev">← 이전</button>
    <span class="nav-info" id="nav-info"></span>
    <button class="btn btn-nav" onclick="goQ(curQ+1)" id="btn-next">다음 →</button>
  </div> -->

</div>
<script>
const QS = [
{
  n:1,
  en:`A company has a mobile application that makes HTTP API calls to an Application Load Balancer (ALB). The ALB routes requests to an AWS Lambda function. Many different versions of the application are in use at any given time, including versions that are in testing by a subset of users. The version of the application is defined in the user-agent header that is sent with all requests to the API.<br><br>After a series of recent changes to the API, the company has observed issues with the application. The company needs to gather a metric for each API operation by response code for each version of the application that is in use. A DevOps engineer has modified the Lambda function to extract the API operation name, version information from the user-agent header and response code.<br><br><strong>Which additional set of actions should the DevOps engineer take to gather the required metrics?</strong>`,
  ko:`한 회사에 ALB(Application Load Balancer)로 HTTP API를 호출하는 모바일 애플리케이션이 있습니다. ALB는 요청을 AWS Lambda 함수로 라우팅합니다. 사용자 하위 집합이 테스트 중인 버전을 포함하여 언제든지 여러 다른 버전의 애플리케이션이 사용 중입니다. 애플리케이션 버전은 API에 대한 모든 요청과 함께 전송되는 user-agent 헤더에 정의되어 있습니다.<br><br>API에 대한 최근 일련의 변경 이후, 회사는 애플리케이션에 문제가 있음을 발견했습니다. 회사는 사용 중인 애플리케이션의 각 버전에 대한 응답 코드로 각 API 작업에 대한 메트릭을 수집해야 합니다. DevOps 엔지니어는 API 작업 이름, user-agent 헤더의 버전 정보 및 응답 코드를 추출하도록 Lambda 함수를 수정했습니다.<br><br><strong>필요한 메트릭을 수집하기 위해 DevOps 엔지니어가 추가로 수행해야 할 작업은 무엇입니까?</strong>`,
  type:'single',
  choices:[
    {k:'A', en:`Modify the Lambda function to write the API operation name, response code, and version number as a log line to an Amazon CloudWatch Logs log group. Configure a CloudWatch Logs metric filter that increments a metric for each API operation name. Specify response code and application version as dimensions for the metric.`, ko:`Lambda 함수를 수정하여 API 작업 이름, 응답 코드, 버전 번호를 Amazon CloudWatch Logs 로그 그룹에 로그 줄로 씁니다. 각 API 작업 이름에 대한 메트릭을 증가시키는 CloudWatch Logs 메트릭 필터를 구성합니다. 메트릭에 대한 차원으로 응답 코드와 애플리케이션 버전을 지정합니다.`},
    {k:'B', en:`Modify the Lambda function to write the API operation name, response code, and version number as a log line to an Amazon CloudWatch Logs log group. Configure a CloudWatch Logs Insights query to populate CloudWatch metrics from the log lines. Specify response code and application version as dimensions for the metric.`, ko:`Lambda 함수를 수정하여 API 작업 이름, 응답 코드, 버전 번호를 Amazon CloudWatch Logs 로그 그룹에 로그 줄로 씁니다. CloudWatch Logs Insights 쿼리를 구성하여 로그 줄에서 CloudWatch 메트릭을 채웁니다. 메트릭의 차원으로 응답 코드와 애플리케이션 버전을 지정합니다.`},
    {k:'C', en:`Configure the ALB access logs to write to an Amazon CloudWatch Logs log group. Modify the Lambda function to respond to the ALB with the API operation name, response code, and version number as response metadata. Configure a CloudWatch Logs metric filter that increments a metric for each API operation name. Specify response code and application version as dimensions for the metric.`, ko:`ALB 액세스 로그를 Amazon CloudWatch Logs 로그 그룹에 쓰도록 구성합니다. API 작업 이름, 응답 코드 및 버전 번호를 응답 메타데이터로 ALB에 응답하도록 Lambda 함수를 수정합니다. 각 API 작업 이름에 대한 메트릭을 증가시키는 CloudWatch Logs 메트릭 필터를 구성합니다. 메트릭의 차원으로 응답 코드와 애플리케이션 버전을 지정합니다.`},
    {k:'D', en:`Configure AWS X-Ray integration on the Lambda function. Modify the Lambda function to create an X-Ray subsegment with the API operation name, response code, and version number. Configure X-Ray insights to extract an aggregated metric for each API operation name and to publish the metric to Amazon CloudWatch. Specify response code and application version as dimensions for the metric.`, ko:`Lambda 함수에서 AWS X-Ray 통합을 구성합니다. API 작업 이름, 응답 코드 및 버전 번호로 X-Ray 하위 세그먼트를 만들도록 Lambda 함수를 수정합니다. X-Ray 인사이트를 구성하여 각 API 작업 이름에 대한 집계된 메트릭을 추출하고 Amazon CloudWatch에 게시합니다. 메트릭의 차원으로 응답 코드와 애플리케이션 버전을 지정합니다.`},
  ],
  answer:['A'],
  vote:'87% A',
  explain:`<p><span class="mark-ok">✅ A — CloudWatch Logs 메트릭 필터</span></p><p>Lambda에서 로그 줄을 CloudWatch Logs에 기록하고, <strong>메트릭 필터(Metric Filter)</strong>로 패턴을 파싱하여 메트릭을 생성하는 것이 AWS 권장 패턴입니다. 응답 코드와 애플리케이션 버전을 메트릭 차원으로 지정하면 버전·응답코드별 API 작업 메트릭을 자동으로 수집할 수 있습니다. 메트릭 필터는 시계열 데이터를 생성하여 알람, Lambda 트리거, 이상 탐지 모델 등에 활용 가능합니다.</p><p><a href="https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/FilterAndPatternSyntaxForMetricFilters.html" target="_blank">📎 AWS 공식 문서</a></p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — CloudWatch Logs Insights는 대화형 임시 분석 도구이며, 쿼리 결과로 CloudWatch 메트릭을 자동으로 생성할 수 없습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — ALB 액세스 로그는 Lambda 응답 메타데이터를 직접 기록하지 않으며, 구성이 불필요하게 복잡합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — X-Ray는 분산 추적(tracing) 목적이며, 이 사용 사례에 과도하게 복잡한 솔루션입니다.</p>`,
  disc:[{ans:'A (87%)',txt:'메트릭 필터는 로그 데이터에서 자동으로 시계열 메트릭을 생성합니다. Logs Insights는 인터랙티브 분석용이며 자동 액션을 트리거할 수 없습니다. — AWS 공식 블로그'}]
},
{
  n:2,
  en:`A company provides an application to customers. The application has an Amazon API Gateway REST API that invokes an AWS Lambda function. On initialization, the Lambda function loads a large amount of data from an Amazon DynamoDB table. The data load process results in long cold-start times of 8-10 seconds. The DynamoDB table has DynamoDB Accelerator (DAX) configured.<br><br>Customers report that the application intermittently takes a long time to respond to requests. The application receives thousands of requests throughout the day. In the middle of the day, the application experiences 10 times more requests than at any other time of the day. Near the end of the day, the application's request volume decreases to 10% of its normal total.<br><br>A DevOps engineer needs to reduce the latency of the Lambda function at all times of the day.<br><br><strong>Which solution will meet these requirements?</strong>`,
  ko:`한 회사가 고객에게 애플리케이션을 제공합니다. 이 애플리케이션에는 AWS Lambda 함수를 호출하는 Amazon API Gateway REST API가 있습니다. 초기화 시 Lambda 함수는 Amazon DynamoDB 테이블에서 대량의 데이터를 로드합니다. 데이터 로드 프로세스로 인해 8~10초의 긴 콜드 스타트 시간이 발생합니다. DynamoDB 테이블에는 DynamoDB Accelerator(DAX)가 구성되어 있습니다.<br><br>고객들은 애플리케이션이 요청에 응답하는 데 간헐적으로 오랜 시간이 걸린다고 보고합니다. 이 애플리케이션은 하루 종일 수천 개의 요청을 받습니다. 하루 중간에 다른 시간대보다 10배 더 많은 요청을 경험합니다. 하루가 끝나갈 무렵 요청 볼륨은 일반적인 총량의 10%로 감소합니다.<br><br>DevOps 엔지니어는 하루 종일 Lambda 함수의 지연 시간을 줄여야 합니다.<br><br><strong>어떤 솔루션이 이러한 요구 사항을 충족합니까?</strong>`,
  type:'single',
  choices:[
    {k:'A', en:`Configure provisioned concurrency on the Lambda function with a concurrency value of 1. Delete the DAX cluster for the DynamoDB table.`, ko:`Lambda 함수에서 동시성 값 1로 프로비저닝된 동시성을 구성합니다. DynamoDB 테이블의 DAX 클러스터를 삭제합니다.`},
    {k:'B', en:`Configure reserved concurrency on the Lambda function with a concurrency value of 0.`, ko:`Lambda 함수에서 동시성 값 0으로 예약된 동시성을 구성합니다.`},
    {k:'C', en:`Configure provisioned concurrency on the Lambda function. Configure AWS Application Auto Scaling on the Lambda function with provisioned concurrency values set to a minimum of 1 and a maximum of 100.`, ko:`Lambda 함수에서 프로비저닝된 동시성을 구성합니다. Lambda 함수에서 AWS Application Auto Scaling을 프로비저닝된 동시성 값을 최소 1, 최대 100으로 설정하여 구성합니다.`},
    {k:'D', en:`Configure reserved concurrency on the Lambda function. Configure AWS Application Auto Scaling on the API Gateway API with a reserved concurrency maximum value of 100.`, ko:`Lambda 함수에서 예약된 동시성을 구성합니다. API Gateway API에서 예약된 동시성 최대값 100으로 AWS Application Auto Scaling을 구성합니다.`},
  ],
  answer:['C'],
  vote:'100% C',
  explain:`<p><span class="mark-ok">✅ C — 프로비저닝된 동시성 + Application Auto Scaling</span></p><p><strong>프로비저닝된 동시성</strong>은 미리 초기화된 실행 환경을 준비하여 콜드 스타트를 제거합니다. Application Auto Scaling을 함께 구성하면 낮에 트래픽이 10배 증가할 때 자동으로 확장(최대 100)하고, 하루 끝에 트래픽이 줄면 자동으로 축소(최소 1)하여 비용을 최적화합니다.</p><p><a href="https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html" target="_blank">📎 AWS 공식 문서</a></p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — 동시성 1로 고정하면 트래픽 급증 시 대응 불가하며, DAX 삭제는 성능을 저하시킵니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — 예약된 동시성 0은 Lambda 함수 호출을 완전히 차단합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — API Gateway에는 Auto Scaling으로 제어할 수 있는 동시성 개념이 없습니다.</p>`,
  disc:[{ans:'C (100%)',txt:'프로비저닝된 동시성(Provisioned Concurrency)은 콜드 스타트를 방지합니다. Application Auto Scaling과 함께 사용하면 시간대별 트래픽 변화에 자동으로 대응할 수 있습니다. — AWS Lambda 공식 문서'}]
},
{
  n:3,
  en:`A company is adopting AWS CodeDeploy to automate its application deployments for a Java-Apache Tomcat application with an Apache web server. The development team started with a proof of concept, created a deployment group for a developer environment, and performed functional tests within the application. After completion, the team will create additional deployment groups for staging and production.<br><br>The current log level is configured within the Apache settings, but the team wants to change this configuration dynamically when the deployment occurs, so that they can set different log level configurations depending on the deployment group without having a different application revision for each group.<br><br><strong>How can these requirements be met with the LEAST management overhead and without requiring different script versions for each deployment group?</strong>`,
  ko:`한 회사가 Apache 웹서버가 있는 Java-Apache Tomcat 애플리케이션에 대한 애플리케이션 배포를 자동화하기 위해 AWS CodeDeploy를 도입하고 있습니다. 개발팀은 개념 증명으로 시작하여 개발자 환경을 위한 배포 그룹을 만들고 애플리케이션 내에서 기능 테스트를 수행했습니다. 완료 후 팀은 스테이징 및 프로덕션을 위한 추가 배포 그룹을 만들 예정입니다.<br><br>현재 로그 수준은 Apache 설정 내에서 구성되지만, 팀은 배포가 발생할 때 이 구성을 동적으로 변경하여 각 그룹에 대해 다른 애플리케이션 개정 없이 배포 그룹에 따라 다른 로그 수준 구성을 설정하려고 합니다.<br><br><strong>각 배포 그룹에 대해 다른 스크립트 버전을 요구하지 않고도 최소한의 관리 오버헤드로 이러한 요구 사항을 어떻게 충족할 수 있습니까?</strong>`,
  type:'single',
  choices:[
    {k:'A', en:`Tag the Amazon EC2 instances depending on the deployment group. Then place a script into the application revision that calls the metadata service and the EC2 API to identify which deployment group the instance is part of. Use this information to configure the log level settings. Reference the script as part of the AfterInstall lifecycle hook in the appspec.yml file.`, ko:`배포 그룹에 따라 Amazon EC2 인스턴스에 태그를 지정합니다. 그런 다음 메타데이터 서비스와 EC2 API를 호출하여 인스턴스가 속한 배포 그룹을 식별하는 스크립트를 애플리케이션 개정판에 배치합니다. 이 정보를 사용하여 로그 수준 설정을 구성합니다. appspec.yml 파일에서 AfterInstall 라이프사이클 후크의 일부로 스크립트를 참조합니다.`},
    {k:'B', en:`Create a script that uses the CodeDeploy environment variable DEPLOYMENT_GROUP_NAME to identify which deployment group the instance is part of. Use this information to configure the log level settings. Reference this script as part of the BeforeInstall lifecycle hook in the appspec.yml file.`, ko:`CodeDeploy 환경 변수 DEPLOYMENT_GROUP_NAME을 사용하여 인스턴스가 속한 배포 그룹을 식별하는 스크립트를 만듭니다. 이 정보를 사용하여 로그 수준 설정을 구성합니다. appspec.yml 파일에서 BeforeInstall 라이프사이클 후크의 일부로 이 스크립트를 참조합니다.`},
    {k:'C', en:`Create a CodeDeploy custom environment variable for each environment. Then place a script into the application revision that checks this environment variable to identify which deployment group the instance is part of. Use this information to configure the log level settings. Reference this script as part of the ValidateService lifecycle hook in the appspec.yml file.`, ko:`각 환경에 대한 CodeDeploy 사용자 지정 환경 변수를 만듭니다. 그런 다음 인스턴스가 속한 배포 그룹을 식별하기 위해 이 환경 변수를 확인하는 스크립트를 애플리케이션 개정판에 넣습니다. 이 정보를 사용하여 로그 수준 설정을 구성합니다. appspec.yml 파일에서 ValidateService 라이프사이클 후크의 일부로 이 스크립트를 참조합니다.`},
    {k:'D', en:`Create a script that uses the CodeDeploy environment variable DEPLOYMENT_GROUP_ID to identify which deployment group the instance is part of to configure the log level settings. Reference this script as part of the Install lifecycle hook in the appspec.yml file.`, ko:`CodeDeploy 환경 변수 DEPLOYMENT_GROUP_ID를 사용하여 인스턴스가 속한 배포 그룹을 식별하여 로그 수준 설정을 구성하는 스크립트를 만듭니다. appspec.yml 파일에서 Install lifecycle 후크의 일부로 이 스크립트를 참조합니다.`},
  ],
  answer:['B'],
  vote:'73% B',
  explain:`<p><span class="mark-ok">✅ B — DEPLOYMENT_GROUP_NAME + BeforeInstall 후크</span></p><p>CodeDeploy는 <strong>DEPLOYMENT_GROUP_NAME</strong> 환경 변수를 제공하여 현재 배포 그룹 이름을 스크립트에서 바로 사용할 수 있습니다. 단일 스크립트에서 이 변수를 분기하여 각 그룹별 로그 수준을 설정합니다. <code>BeforeInstall</code> 후크에서 실행하면 설치 전에 Apache 설정을 사전 구성할 수 있습니다.</p><p><a href="https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-hooks.html" target="_blank">📎 AWS 공식 문서</a></p>`,
  wrong:`<p><span class="mark-no">❌ D</span> — CodeDeploy AppSpec에서 <code>Install</code> 라이프사이클 이벤트는 스크립팅할 수 없습니다. (Start, Install, TestTraffic, AllowTraffic, End는 스크립트 불가)</p><p style="margin-top:8px;"><span class="mark-no">❌ A, C</span> — "애플리케이션 개정판에 스크립트 배치"는 각 그룹마다 다른 개정판이 필요하다는 것을 의미하여 요구사항에 위배됩니다.</p>`,
  disc:[{ans:'B (73%)',txt:'AWS 공식 블로그에서 정확히 이 시나리오를 설명합니다: DEPLOYMENT_GROUP_NAME을 사용하여 배포 그룹별 Apache 로그 수준 설정. BeforeInstall 후크에서 실행. — AWS DevOps Blog'}]
},
{
  n:4,
  en:`A company requires its developers to tag all Amazon Elastic Block Store (Amazon EBS) volumes in an account to indicate a desired backup frequency. This requirement includes EBS volumes that do not require backups. The company uses custom tags named Backup_Frequency that have values of none, daily, or weekly that correspond to the desired backup frequency. An audit finds that developers are occasionally not tagging the EBS volumes.<br><br>A DevOps engineer needs to ensure that all EBS volumes always have the Backup_Frequency tag so that the company can perform backups at least weekly unless a different value is specified.<br><br><strong>Which solution will meet these requirements?</strong>`,
  ko:`한 회사는 개발자가 계정의 모든 Amazon EBS(Elastic Block Store) 볼륨에 태그를 지정하여 원하는 백업 빈도를 표시하도록 요구합니다. 이 요구 사항에는 백업이 필요하지 않은 EBS 볼륨이 포함됩니다. 회사는 원하는 백업 빈도에 해당하는 none, daily, weekly 값을 갖는 Backup_Frequency라는 사용자 지정 태그를 사용합니다. 감사 결과 개발자가 가끔 EBS 볼륨에 태그를 지정하지 않는 것으로 나타났습니다.<br><br>DevOps 엔지니어는 다른 값이 지정되지 않는 한 회사에서 최소한 주 1회 백업을 수행할 수 있도록 모든 EBS 볼륨에 항상 Backup_Frequency 태그가 있는지 확인해야 합니다.<br><br><strong>어떤 솔루션이 이러한 요구 사항을 충족합니까?</strong>`,
  type:'single',
  choices:[
    {k:'A', en:`Set up AWS Config in the account. Create a custom rule that returns a compliance failure for all Amazon EC2 resources that do not have a Backup Frequency tag applied. Configure a remediation action that uses a custom AWS Systems Manager Automation runbook to apply the Backup_Frequency tag with a value of weekly.`, ko:`계정에서 AWS Config를 설정합니다. Backup Frequency 태그가 적용되지 않은 모든 Amazon EC2 리소스에 대해 규정 준수 실패를 반환하는 사용자 지정 규칙을 만듭니다. 사용자 지정 AWS Systems Manager Automation 런북을 사용하여 weekly 값으로 Backup_Frequency 태그를 적용하는 수정 작업을 구성합니다.`},
    {k:'B', en:`Set up AWS Config in the account. Use a managed rule that returns a compliance failure for EC2::Volume resources that do not have a Backup Frequency tag applied. Configure a remediation action that uses a custom AWS Systems Manager Automation runbook to apply the Backup_Frequency tag with a value of weekly.`, ko:`계정에서 AWS Config를 설정합니다. Backup Frequency 태그가 적용되지 않은 EC2::Volume 리소스에 대해 규정 준수 실패를 반환하는 관리형 규칙을 사용합니다. 사용자 지정 AWS Systems Manager Automation 런북을 사용하여 weekly 값으로 Backup_Frequency 태그를 적용하는 수정 작업을 구성합니다.`},
    {k:'C', en:`Turn on AWS CloudTrail in the account. Create an Amazon EventBridge rule that reacts to EBS CreateVolume events. Configure a custom AWS Systems Manager Automation runbook to apply the Backup_Frequency tag with a value of weekly. Specify the runbook as the target of the rule.`, ko:`계정에서 AWS CloudTrail을 켭니다. EBS CreateVolume 이벤트에 반응하는 Amazon EventBridge 규칙을 만듭니다. 사용자 지정 AWS Systems Manager Automation 런북을 구성하여 weekly 값으로 Backup_Frequency 태그를 적용합니다. 런북을 규칙의 대상으로 지정합니다.`},
    {k:'D', en:`Turn on AWS CloudTrail in the account. Create an Amazon EventBridge rule that reacts to EBS CreateVolume events or EBS ModifyVolume events. Configure a custom AWS Systems Manager Automation runbook to apply the Backup_Frequency tag with a value of weekly. Specify the runbook as the target of the rule.`, ko:`계정에서 AWS CloudTrail을 켭니다. EBS CreateVolume 이벤트 또는 EBS ModifyVolume 이벤트에 반응하는 Amazon EventBridge 규칙을 만듭니다. 사용자 지정 AWS Systems Manager Automation 런북을 구성하여 weekly 값으로 Backup_Frequency 태그를 적용합니다. 런북을 규칙의 대상으로 지정합니다.`},
  ],
  answer:['B'],
  vote:'95% B',
  explain:`<p><span class="mark-ok">✅ B — AWS Config 관리형 규칙(required-tags) + 사용자 지정 SSM 런북</span></p><p>AWS Config의 <strong>관리형 규칙 required-tags</strong>는 <code>EC2::Volume</code> 리소스 유형을 대상으로 특정 태그 존재 여부를 검사합니다. 비준수 볼륨에 대해 사용자 지정 SSM Automation 런북으로 자동 수정(weekly 태그 적용)을 구성합니다. 관리형 규칙은 EC2 볼륨에만 정확히 적용되어 불필요한 오버헤드가 없습니다.</p><p><a href="https://docs.aws.amazon.com/config/latest/developerguide/required-tags.html" target="_blank">📎 AWS 공식 문서</a></p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — 사용자 지정 규칙은 <em>모든 EC2 리소스</em>(인스턴스, ELB 등 포함)에 적용되어 볼륨 이외의 리소스에도 불필요하게 규정 준수 오류를 반환합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C, D</span> — CloudTrail/EventBridge는 새로 생성된 볼륨에만 반응하며, 기존의 태그 없는 볼륨은 탐지하지 못합니다. AWS Config는 기존 리소스도 지속적으로 평가합니다.</p>`,
  disc:[{ans:'B (95%)',txt:'AWS Config required-tags 관리형 규칙은 EC2::Volume 리소스 유형을 지원합니다. 단, AWS-SetRequiredTags SSM 문서는 이 규칙의 수정에 사용 불가하므로 사용자 지정 런북이 필요합니다. — AWS Config 문서'}]
},
{
  n:5,
  en:`A company is using an Amazon Aurora cluster as the data store for its application. The Aurora cluster is configured with a single DB instance. The application performs read and write operations on the database by using the cluster's instance endpoint.<br><br>The company has scheduled an update to be applied to the cluster during an upcoming maintenance window. The cluster must remain available with the least possible interruption during the maintenance window.<br><br><strong>What should a DevOps engineer do to meet these requirements?</strong>`,
  ko:`한 회사가 애플리케이션의 데이터 저장소로 Amazon Aurora 클러스터를 사용하고 있습니다. Aurora 클러스터는 단일 DB 인스턴스로 구성되어 있습니다. 애플리케이션은 클러스터의 인스턴스 엔드포인트를 사용하여 데이터베이스에서 읽기 및 쓰기 작업을 수행합니다.<br><br>회사는 다가올 유지 관리 기간 동안 클러스터에 적용할 업데이트를 예약했습니다. 클러스터는 유지 관리 기간 동안 가능한 한 최소한의 중단으로 사용 가능해야 합니다.<br><br><strong>DevOps 엔지니어는 이러한 요구 사항을 충족하기 위해 무엇을 해야 합니까?</strong>`,
  type:'single',
  choices:[
    {k:'A', en:`Add a reader instance to the Aurora cluster. Update the application to use the Aurora cluster endpoint for write operations. Update the Aurora cluster's reader endpoint for reads.`, ko:`Aurora 클러스터에 리더 인스턴스를 추가합니다. 쓰기 작업에 Aurora 클러스터 엔드포인트를 사용하도록 애플리케이션을 업데이트합니다. 읽기에 Aurora 클러스터의 리더 엔드포인트를 업데이트합니다.`},
    {k:'B', en:`Add a reader instance to the Aurora cluster. Create a custom ANY endpoint for the cluster. Update the application to use the Aurora cluster's custom ANY endpoint for read and write operations.`, ko:`Aurora 클러스터에 리더 인스턴스를 추가합니다. 클러스터에 대한 사용자 정의 ANY 엔드포인트를 만듭니다. 읽기 및 쓰기 작업에 Aurora 클러스터의 사용자 정의 ANY 엔드포인트를 사용하도록 애플리케이션을 업데이트합니다.`},

  n:9,
  en:`A company uses AWS Key Management Service (AWS KMS) keys and manual key rotation to meet regulatory compliance requirements. The security team wants to be notified when any keys have not been rotated after 90 days.<br><br><strong>Which solution will accomplish this?</strong>`,
  ko:`한 회사에서 규정 준수 요구 사항을 충족하기 위해 AWS KMS(Key Management Service) 키와 수동 키 로테이션을 사용합니다. 보안 팀은 90일 후에도 키가 로테이션되지 않은 경우 알림을 받고 싶어합니다.<br><br><strong>어떤 솔루션이 이를 달성합니까?</strong>`,
  type:'single',
  choices:[
    {k:'A', en:`Configure AWS KMS to publish to an Amazon Simple Notification Service (Amazon SNS) topic when keys are more than 90 days old.`, ko:`키가 90일 이상 지난 경우 Amazon SNS 토픽에 게시하도록 AWS KMS를 구성합니다.`},
    {k:'B', en:`Configure an Amazon EventBridge event to launch an AWS Lambda function to call the AWS Trusted Advisor API and publish to an Amazon Simple Notification Service (Amazon SNS) topic.`, ko:`AWS Lambda 함수를 시작하여 AWS Trusted Advisor API를 호출하고 Amazon SNS 토픽에 게시하도록 Amazon EventBridge 이벤트를 구성합니다.`},
    {k:'C', en:`Develop an AWS Config custom rule that publishes to an Amazon Simple Notification Service (Amazon SNS) topic when keys are more than 90 days old.`, ko:`키가 90일 이상 경과한 경우 Amazon SNS 토픽에 게시하는 AWS Config 사용자 지정 규칙을 개발합니다.`},
    {k:'D', en:`Configure AWS Security Hub to publish to an Amazon Simple Notification Service (Amazon SNS) topic when keys are more than 90 days old.`, ko:`키가 90일 이상 경과한 경우 Amazon SNS 토픽에 게시하도록 AWS Security Hub를 구성합니다.`},
  ],
  answer:['C'],
  vote:'100% C',
  explain:`<p><span class="mark-ok">✅ C — AWS Config 사용자 지정 규칙</span></p><p>KMS 키의 마지막 로테이션 날짜를 기준으로 90일 초과 여부를 평가하는 <strong>사용자 지정 Config 규칙</strong>을 개발합니다. 비준수 키 발견 시 SNS 토픽에 게시하는 수정 작업을 구성합니다. AWS Config 관리형 규칙 <code>access-keys-rotated</code>는 IAM 액세스 키용이며 KMS 키에는 적용되지 않으므로 사용자 지정 규칙이 필요합니다.</p><p><a href="https://docs.aws.amazon.com/config/latest/developerguide/access-keys-rotated.html" target="_blank">📎 AWS 공식 문서</a></p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — AWS KMS는 키 연령 기반 자동 SNS 게시 기능을 제공하지 않습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — AWS Trusted Advisor에는 KMS 키 로테이션 기간을 확인하는 검사가 없습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — Security Hub는 Config/GuardDuty 발견 사항을 집계하는 서비스이며, KMS 키 연령을 직접 모니터링하는 기능이 없습니다.</p>`,
  disc:[{ans:'C (100%)',txt:'AWS Config 사용자 지정 규칙(Lambda 기반): KMS DescribeKey API로 키 생성일 및 마지막 로테이션 날짜를 확인하여 90일 초과 시 NON_COMPLIANT 반환 후 SNS 알림.'}]
},
{
  n:10,
  en:`A security review has identified that an AWS CodeBuild project is downloading a database population script from an Amazon S3 bucket using an unauthenticated request. The security team does not allow unauthenticated requests to S3 buckets for this project.<br><br><strong>How can this issue be corrected in the MOST secure manner?</strong>`,
  ko:`보안 검토에서 AWS CodeBuild 프로젝트가 인증되지 않은 요청을 사용하여 Amazon S3 버킷에서 데이터베이스 채우기 스크립트를 다운로드하고 있다는 사실이 확인되었습니다. 보안팀은 이 프로젝트에 대해 S3 버킷에 대한 인증되지 않은 요청을 허용하지 않습니다.<br><br><strong>이 문제를 가장 안전한 방식으로 어떻게 수정할 수 있습니까?</strong>`,
  type:'single',
  choices:[
    {k:'A', en:`Add the bucket name to the AllowedBuckets section of the CodeBuild project settings. Update the build spec to use the AWS CLI to download the database population script.`, ko:`CodeBuild 프로젝트 설정의 AllowedBuckets 섹션에 버킷 이름을 추가합니다. AWS CLI를 사용하여 데이터베이스 채우기 스크립트를 다운로드하도록 빌드 사양을 업데이트합니다.`},
    {k:'B', en:`Modify the S3 bucket settings to enable HTTPS basic authentication and specify a token. Update the build spec to use cURL to pass the token and download the database population script.`, ko:`S3 버킷 설정을 수정하여 HTTPS 기본 인증을 활성화하고 토큰을 지정합니다. 빌드 사양을 업데이트하여 cURL을 사용하여 토큰을 전달하고 데이터베이스 채우기 스크립트를 다운로드합니다.`},
    {k:'C', en:`Remove unauthenticated access from the S3 bucket with a bucket policy. Modify the service role for the CodeBuild project to include Amazon S3 access. Use the AWS CLI to download the database population script.`, ko:`버킷 정책을 사용하여 S3 버킷에서 인증되지 않은 액세스를 제거합니다. CodeBuild 프로젝트의 서비스 역할을 수정하여 Amazon S3 액세스를 포함합니다. AWS CLI를 사용하여 데이터베이스 채우기 스크립트를 다운로드합니다.`},
    {k:'D', en:`Remove unauthenticated access from the S3 bucket with a bucket policy. Use the AWS CLI to download the database population script using an IAM access key and a secret access key.`, ko:`버킷 정책을 사용하여 S3 버킷에서 인증되지 않은 액세스를 제거합니다. AWS CLI를 사용하여 IAM 액세스 키와 비밀 액세스 키를 사용하여 데이터베이스 채우기 스크립트를 다운로드합니다.`},
  ],
  answer:['C'],
  vote:'100% C',
  explain:`<p><span class="mark-ok">✅ C — 버킷 정책으로 익명 접근 제거 + CodeBuild 서비스 역할에 S3 권한 추가</span></p><p>가장 안전한 방식은 <strong>서비스 역할(IAM 역할)</strong>을 사용하는 것입니다. 버킷 정책으로 익명 접근을 차단하고, CodeBuild 서비스 역할에 S3 읽기 권한을 부여합니다. AWS CLI는 서비스 역할의 임시 자격 증명을 자동으로 사용하여 인증된 요청을 수행합니다. 장기 자격 증명(액세스 키)이 아닌 임시 자격 증명을 사용하므로 보안 위험이 최소화됩니다.</p><p><a href="https://docs.aws.amazon.com/codebuild/latest/userguide/setting-up-service-role.html" target="_blank">📎 AWS 공식 문서</a></p>`,
  wrong:`<p><span class="mark-no">❌ D</span> — IAM 액세스 키와 비밀 액세스 키(장기 자격 증명)를 코드/환경 변수에 저장하는 것은 보안 위험이 있습니다. 서비스 역할의 임시 자격 증명이 더 안전합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ A</span> — CodeBuild 프로젝트 설정에 "AllowedBuckets" 섹션은 존재하지 않습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — Amazon S3는 HTTPS 기본 인증을 지원하지 않습니다.</p>`,
  disc:[{ans:'C (100%)',txt:'AWS 보안 모범 사례: IAM 역할(서비스 역할)을 사용하여 장기 자격 증명 노출을 방지합니다. CodeBuild는 실행 시 서비스 역할의 임시 자격 증명을 자동으로 AWS CLI에 제공합니다.'}]
},
{
  n:11,
  ko:`전자상거래 회사가 새로운 플랫폼을 호스팅하기 위해 AWS를 선택했습니다. 이 회사의 DevOps 팀은 AWS Control Tower 랜딩 존을 구축하기 시작했습니다. DevOps 팀은 AWS IAM Identity Center(AWS Single Sign-On) 내의 ID 저장소를 외부 ID 공급자(IdP)로 설정하고 SAML 2.0을 구성했습니다.<br><br>DevOps 팀은 최소 권한 원칙을 적용하는 강력한 권한 모델을 원합니다. 이 모델은 팀이 팀 자체 리소스만 빌드하고 관리할 수 있도록 허용해야 합니다.<br><br><strong>이러한 요구 사항을 충족하는 단계의 조합은 무엇입니까? (세 가지를 선택하십시오.)</strong>`,
  en:`An ecommerce company has chosen AWS to host its new platform. The company's DevOps team has started building an AWS Control Tower landing zone. The DevOps team has set the identity store within AWS IAM Identity Center (AWS Single Sign-On) to external identity provider (IdP) and has configured SAML 2.0.<br><br>The DevOps team wants a robust permission model that applies the principle of least privilege. The model must allow the team to build and manage only the team's own resources.<br><br><strong>Which combination of steps will meet these requirements? (Choose three.)</strong>`,
  type:'multi',
  multiCount:3,
  choices:[
    {k:'A', ko:`필요한 권한을 포함하는 IAM 정책을 만듭니다. <code>aws:PrincipalTag</code> 조건 키를 포함합니다.`, en:`Create IAM policies that include the required permissions. Include the aws:PrincipalTag condition key.`},
    {k:'B', ko:`권한 집합을 만듭니다. 필요한 권한을 포함하고 <code>aws:PrincipalTag</code> 조건 키를 사용하여 권한 범위를 지정하는 인라인 정책을 연결합니다.`, en:`Create permission sets. Attach an inline policy that includes the required permissions and uses the aws:PrincipalTag condition key to scope the permissions.`},
    {k:'C', ko:`IdP에서 그룹을 만듭니다. 그룹에 사용자를 배치합니다. 그룹을 IAM Identity Center의 계정 및 권한 집합에 할당합니다.`, en:`Create a group in the IdP. Place users in the group. Assign the group to accounts and the permission sets in IAM Identity Center.`},
    {k:'D', ko:`IdP에서 그룹을 만듭니다. 그룹에 사용자를 배치합니다. 그룹을 OU 및 IAM 정책에 할당합니다.`, en:`Create a group in the IdP. Place users in the group. Assign the group to OUs and IAM policies.`},
    {k:'E', ko:`IAM Identity Center에서 액세스 제어를 위한 속성을 활성화합니다. 사용자에게 태그를 적용합니다. 태그를 키-값 쌍으로 매핑합니다.`, en:`Enable attributes for access control in IAM Identity Center. Apply tags to users. Map the tags as key-value pairs.`},
    {k:'F', ko:`IAM Identity Center에서 액세스 제어를 위한 속성을 활성화합니다. IdP에서 속성을 키-값 쌍으로 매핑합니다.`, en:`Enable attributes for access control in IAM Identity Center. Map attributes from the IdP as key-value pairs.`},
  ],
  answer:['B','C','F'],
  vote:'100% BCF',
  explain:`<p><span class="mark-ok">✅ B</span>: IAM Identity Center에서는 <strong>권한 집합(Permission Set)</strong>을 사용합니다. 인라인 정책에 <code>aws:PrincipalTag</code> 조건 키를 포함하면 사용자 속성(태그)에 따라 리소스 접근을 동적으로 제한할 수 있습니다(ABAC 패턴).</p><p style="margin-top:8px;"><span class="mark-ok">✅ C</span>: IdP에서 그룹을 생성하고 사용자를 배치한 후, 그룹을 IAM Identity Center의 계정과 권한 집합에 할당합니다. 이것이 IAM Identity Center의 표준 사용 방식입니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ F</span>: IdP의 속성(예: department, team)을 키-값 쌍으로 매핑하여 ABAC에 사용합니다. 외부 IdP에는 태그가 아닌 <strong>속성(Attribute)</strong>이 있으므로 F가 E보다 적절합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — IAM Identity Center에서는 IAM 정책이 아닌 권한 집합을 사용합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — 그룹을 OU에 할당하거나 IAM 정책에 직접 할당할 수 없습니다. 권한 집합을 통해 계정에 할당해야 합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ E</span> — 외부 IdP 사용 시 태그를 직접 IAM Identity Center 사용자에게 적용하는 것이 아니라 IdP의 속성(Attribute)을 매핑해야 합니다.</p>`,
  disc:[{ans:'BCF (100%)',txt:'IAM Identity Center + 외부 IdP + ABAC 구성: B(권한 집합+PrincipalTag 조건), C(IdP 그룹→계정+권한집합 할당), F(IdP 속성→키-값 쌍 매핑). IAM 정책 직접 사용(A)이나 태그 직접 적용(E)은 IAM Identity Center 패턴과 맞지 않습니다.'}]
},
{
  n:12,
  ko:`전자상거래 회사에서 주문 내역 페이지에서 주문 처리 상태를 반영하는 데 지연이 발생한다는 보고를 받고 있습니다. 주문 처리 시스템은 예약된 동시성을 사용하는 AWS Lambda 함수로 구성되어 있습니다. Lambda 함수는 Amazon Simple Queue Service(Amazon SQS) 대기열에서 주문 메시지를 처리하고 처리된 주문을 Amazon DynamoDB 테이블에 삽입합니다. DynamoDB 테이블은 읽기 및 쓰기 용량에 대해 자동 확장이 활성화되어 있습니다.<br><br><strong>DevOps 엔지니어는 이 지연을 해결하기 위해 어떤 조치를 취해야 합니까? (두 가지를 선택하십시오.)</strong>`,
  en:`An ecommerce company is receiving reports that its order history page is experiencing delays in reflecting the processing status of orders. The order processing system consists of an AWS Lambda function that uses reserved concurrency. The Lambda function processes order messages from an Amazon Simple Queue Service (Amazon SQS) queue and inserts processed orders into an Amazon DynamoDB table. The DynamoDB table has auto scaling enabled for read and write capacity.<br><br><strong>Which actions should a DevOps engineer take to resolve this delay? (Choose two.)</strong>`,
  type:'multi',
  multiCount:2,
  choices:[
    {k:'A', ko:`SQS 대기열에 대한 <code>ApproximateAgeOfOldestMessage</code> 메트릭을 확인합니다. Lambda 함수 동시성 한도를 늘립니다.`, en:`Check the ApproximateAgeOfOldestMessage metric for the SQS queue. Increase the Lambda function concurrency limit.`},
    {k:'B', ko:`SQS 대기열의 <code>ApproximateAgeOfOldestMessage</code> 메트릭을 확인합니다. SQS 대기열에 대한 재구동(redrive) 정책을 구성합니다.`, en:`Check the ApproximateAgeOfOldestMessage metric for the SQS queue. Configure a redrive policy on the SQS queue.`},
    {k:'C', ko:`SQS 대기열에 대한 <code>NumberOfMessagesSent</code> 메트릭을 확인합니다. SQS 대기열 가시성 타임아웃을 늘립니다.`, en:`Check the NumberOfMessagesSent metric for the SQS queue. Increase the SQS queue visibility timeout.`},
    {k:'D', ko:`DynamoDB 테이블에 대한 <code>WriteThrottleEvents</code> 메트릭을 확인합니다. 테이블의 확장 정책에 대한 최대 쓰기 용량 단위(WCU)를 늘립니다.`, en:`Check the WriteThrottleEvents metric for the DynamoDB table. Increase the maximum write capacity units (WCUs) for the table's scaling policy.`},
    {k:'E', ko:`Lambda 함수의 <code>Throttles</code> 메트릭을 확인합니다. Lambda 함수 타임아웃을 늘립니다.`, en:`Check the Throttles metric for the Lambda function. Increase the Lambda function timeout.`},
  ],
  answer:['A','D'],
  vote:'100% AD',
  explain:`<p><span class="mark-ok">✅ A</span>: <code>ApproximateAgeOfOldestMessage</code>가 높으면 메시지가 오랫동안 처리되지 않고 있다는 신호입니다. Lambda의 예약된 동시성이 너무 낮아 처리 속도가 부족한 경우 동시성 한도를 늘려 처리량을 높입니다.</p><p style="margin-top:8px;"><span class="mark-ok">✅ D</span>: <code>WriteThrottleEvents</code>가 높으면 DynamoDB가 쓰기 작업을 제한하고 있다는 의미입니다. 자동 확장이 활성화되어 있어도 최대 WCU 한도가 낮으면 급격한 트래픽 증가에 대응하지 못합니다. 최대 WCU를 늘려 확장 범위를 넓힙니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — 재구동 정책은 처리에 실패한 메시지를 DLQ로 이동하는 기능으로, 처리 속도 지연을 해결하지 않습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — 가시성 타임아웃 증가는 메시지 처리 중 중복 처리를 방지하는 설정이며 처리 지연의 직접적인 해결책이 아닙니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ E</span> — Lambda 타임아웃을 늘려도 처리 속도(동시성)는 향상되지 않습니다.</p>`,
  disc:[{ans:'AD (100%)',txt:'지연 원인 진단: A=SQS 대기열 백로그(메시지 처리 지연) → Lambda 동시성 증가로 처리량 향상. D=DynamoDB 쓰기 제한 → 최대 WCU 증가로 자동 확장 범위 확대. 두 가지 병목을 함께 해결해야 합니다.'}]
},
{
  n:13,
  ko:`한 회사에 단일 AWS 리전에서 수백 개의 Amazon EC2 인스턴스를 실행하는 단일 AWS 계정이 있습니다. 계정에서 매 시간 새로운 EC2 인스턴스가 시작되고 종료됩니다. 이 계정에는 1주일 이상 실행된 기존 EC2 인스턴스도 포함됩니다.<br><br>회사의 보안 정책에 따라 실행 중인 모든 EC2 인스턴스는 EC2 인스턴스 프로필을 사용해야 합니다. EC2 인스턴스에 인스턴스 프로필이 연결되지 않은 경우 EC2 인스턴스는 IAM 권한이 할당되지 않은 기본 인스턴스 프로필을 사용해야 합니다.<br><br>DevOps 엔지니어가 계정을 검토하고 인스턴스 프로필 없이 실행 중인 EC2 인스턴스를 발견합니다. 검토하는 동안 DevOps 엔지니어는 인스턴스 프로필 없이 새로운 EC2 인스턴스가 시작되고 있다는 사실도 관찰합니다.<br><br><strong>어떤 솔루션으로 해당 리전의 모든 기존 및 향후 EC2 인스턴스에 인스턴스 프로필이 연결되도록 할 수 있습니까?</strong>`,
  en:`A company has a single AWS account that runs hundreds of Amazon EC2 instances in a single AWS Region. New EC2 instances are launched and terminated each hour in the account. The account also includes existing EC2 instances that have been running for longer than a week.<br><br>The company's security policy requires all running EC2 instances to use an EC2 instance profile. If an EC2 instance does not have an instance profile attached, the EC2 instance must use a default instance profile that has no IAM permissions assigned.<br><br>A DevOps engineer reviews the account and discovers EC2 instances that are running without an instance profile. During the review, the DevOps engineer also observes that new EC2 instances are being launched without an instance profile.<br><br><strong>Which solution will ensure that an instance profile is attached to all existing and future EC2 instances in the Region?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`EC2 RunInstances API 호출에 반응하는 Amazon EventBridge 규칙을 구성합니다. AWS Lambda 함수를 호출하여 기본 인스턴스 프로필을 EC2 인스턴스에 연결하도록 규칙을 구성합니다.`, en:`Configure an Amazon EventBridge rule that reacts to EC2 RunInstances API calls. Configure the rule to invoke an AWS Lambda function to attach the default instance profile to the EC2 instances.`},
    {k:'B', ko:`구성 변경의 트리거 유형으로 <code>ec2-instance-profile-attached</code> AWS Config 관리형 규칙을 구성합니다. 기본 인스턴스 프로필을 EC2 인스턴스에 연결하기 위해 AWS Systems Manager Automation 런북을 호출하는 자동 수정 작업을 구성합니다.`, en:`Configure the ec2-instance-profile-attached AWS Config managed rule with a trigger type of configuration changes. Configure an automatic remediation action that invokes an AWS Systems Manager Automation runbook to attach the default instance profile to the EC2 instances.`},
    {k:'C', ko:`EC2 StartInstances API 호출에 반응하는 Amazon EventBridge 규칙을 구성합니다. AWS Systems Manager Automation 런북을 호출하여 기본 인스턴스 프로필을 EC2 인스턴스에 연결하도록 규칙을 구성합니다.`, en:`Configure an Amazon EventBridge rule that reacts to EC2 StartInstances API calls. Configure the rule to invoke an AWS Systems Manager Automation runbook to attach the default instance profile to the EC2 instances.`},
    {k:'D', ko:`구성 변경의 트리거 유형으로 <code>iam-role-managed-policy-check</code> AWS Config 관리형 규칙을 구성합니다. 기본 인스턴스 프로필을 EC2 인스턴스에 연결하기 위해 AWS Lambda 함수를 호출하는 자동 수정 작업을 구성합니다.`, en:`Configure the iam-role-managed-policy-check AWS Config managed rule with a trigger type of configuration changes. Configure an automatic remediation action that invokes an AWS Lambda function to attach the default instance profile to the EC2 instances.`},
  ],
  answer:['B'],
  vote:'100% B',
  explain:`<p><span class="mark-ok">✅ B — ec2-instance-profile-attached Config 관리형 규칙 + SSM Automation 수정 작업</span></p><p>AWS Config의 <code>ec2-instance-profile-attached</code> 관리형 규칙은 <strong>기존 인스턴스와 새 인스턴스 모두</strong>에 대해 지속적으로 인스턴스 프로필 연결 여부를 평가합니다. 구성 변경 트리거로 설정하면 새 인스턴스 시작 시에도 즉시 평가됩니다. SSM Automation 런북(<code>AWSSupport-GrantPermissionsToIAMUser</code> 등)을 수정 작업으로 지정하여 자동으로 기본 프로필을 연결합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — RunInstances API는 새로 시작되는 인스턴스만 처리합니다. 기존에 실행 중인 인스턴스는 처리하지 못합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — StartInstances는 중지된 인스턴스를 시작할 때의 이벤트입니다. 모든 케이스를 커버하지 못합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — <code>iam-role-managed-policy-check</code>는 IAM 역할의 관리형 정책을 검사하는 규칙으로, EC2 인스턴스 프로필 연결 여부 확인에 적합하지 않습니다.</p>`,
  disc:[{ans:'B (100%)',txt:'ec2-instance-profile-attached Config 관리형 규칙은 인스턴스 프로필이 연결되지 않은 EC2 인스턴스를 식별합니다. SSM Automation으로 수정 작업을 자동화합니다. — AWS Config 문서'}]
},
{
  n:14,
  ko:`DevOps 엔지니어가 AWS Lambda 함수를 사용하는 서버리스 애플리케이션에 대한 지속적인 배포 파이프라인을 구축하고 있습니다. 이 회사는 실패한 배포로 인한 고객 영향을 줄이고자 합니다. 또한 이 회사는 문제를 모니터링하고자 합니다.<br><br><strong>어떤 배포 단계 구성이 이러한 요구 사항을 충족합니까?</strong>`,
  en:`A DevOps engineer is building a continuous deployment pipeline for a serverless application that uses AWS Lambda functions. The company wants to reduce the customer impact of an unsuccessful deployment. The company also wants to monitor for issues.<br><br><strong>Which deploy stage configuration will meet these requirements?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`AWS Serverless Application Model(AWS SAM) 템플릿을 사용하여 서버리스 애플리케이션을 정의합니다. AWS CodeDeploy를 사용하여 <code>Canary10Percent15Minutes</code> 배포 기본 설정 유형으로 Lambda 함수를 배포합니다. Amazon CloudWatch 알람을 사용하여 함수의 상태를 모니터링합니다.`, en:`Use an AWS Serverless Application Model (AWS SAM) template to define the serverless application. Use AWS CodeDeploy to deploy the Lambda functions with the Canary10Percent15Minutes Deployment Preference Type. Use Amazon CloudWatch alarms to monitor the health of the functions.`},
    {k:'B', ko:`AWS CloudFormation을 사용하여 새 스택 업데이트를 게시하고 모든 리소스에 Amazon CloudWatch 알람을 포함합니다. 개발자가 AWS CloudFormation 변경 세트를 확인하고 승인할 수 있도록 AWS CodePipeline 승인 작업을 설정합니다.`, en:`Use AWS CloudFormation to publish a new stack update, and include Amazon CloudWatch alarms on all resources. Set up an AWS CodePipeline approval action for a developer to verify and approve the AWS CloudFormation change set.`},
    {k:'C', ko:`AWS CloudFormation을 사용하여 모든 스택 업데이트에 새 버전을 게시하고 모든 리소스에 Amazon CloudWatch 알람을 포함합니다. <code>AWS::Lambda::Alias</code> 리소스의 <code>RoutingConfig</code> 속성을 사용하여 스택 업데이트 중에 트래픽 라우팅을 업데이트합니다.`, en:`Use AWS CloudFormation to publish a new version on every stack update, and include Amazon CloudWatch alarms on all resources. Use the RoutingConfig property of the AWS::Lambda::Alias resource to update the traffic routing during the stack update.`},
    {k:'D', ko:`AWS CodeBuild를 사용하여 Lambda 함수에 테스트용 샘플 이벤트 페이로드를 추가합니다. 함수의 새 버전을 게시하고 Amazon CloudWatch 알람을 포함합니다. 프로덕션 별칭을 업데이트하여 새 버전을 가리킵니다. 알람이 ALARM 상태일 때 롤백이 발생하도록 구성합니다.`, en:`Use AWS CodeBuild to add sample event payloads for testing to the Lambda functions. Publish a new version of the functions, and include Amazon CloudWatch alarms. Update the production alias to point to the new version. Configure rollbacks to occur when an alarm is in the ALARM state.`},
  ],
  answer:['A'],
  vote:'83% A',
  explain:`<p><span class="mark-ok">✅ A — AWS SAM + CodeDeploy Canary + CloudWatch 알람</span></p><p>AWS SAM은 서버리스 애플리케이션 정의에 최적화된 프레임워크입니다. <code>Canary10Percent15Minutes</code> 배포 유형은 처음 15분간 트래픽의 10%만 새 버전으로 전송하고, 문제가 없으면 나머지를 전환합니다. CloudWatch 알람이 ALARM 상태가 되면 CodeDeploy가 자동으로 롤백합니다.</p><p style="margin-top:8px;"><em>💡 팁: Lambda + CloudFormation 관련 시험 문제는 대부분 SAM이 정답입니다.</em></p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — 수동 승인 작업은 배포 속도를 늦추며 자동화된 롤백 메커니즘을 제공하지 않습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — CodeBuild는 빌드와 테스트를 위한 도구이며 점진적 배포(카나리아)를 직접 지원하지 않습니다.</p>`,
  disc:[{ans:'A (83%)',txt:'SAM 배포 기본 설정 유형: Canary10Percent15Minutes, Canary10Percent5Minutes, Linear10PercentEvery10Minutes 등. CloudWatch 알람과 연동하여 자동 롤백이 구성됩니다. — AWS SAM 공식 문서'}]
},
{
  n:15,
  ko:`애플리케이션을 실행하기 위해 DevOps 엔지니어는 퍼블릭 서브넷에서 퍼블릭 IP 주소로 Amazon EC2 인스턴스를 시작합니다. 사용자 데이터 스크립트는 애플리케이션 아티팩트를 가져와서 시작 시 인스턴스에 설치합니다. 이제 애플리케이션의 보안 분류가 변경되어 인스턴스가 인터넷에 액세스할 수 없이 실행되어야 합니다. 인스턴스가 성공적으로 시작되고 정상으로 표시되지만 애플리케이션이 설치되지 않은 것 같습니다.<br><br><strong>다음 중 어떤 것이 새 규칙을 준수하면서 애플리케이션을 성공적으로 설치합니까?</strong>`,
  en:`To run an application, a DevOps engineer launches an Amazon EC2 instance with public IP addresses in a public subnet. A user data script obtains the application artifacts and installs them on the instances upon launch. A change to the security classification of the application now requires the instances to run with no access to the internet. While the instances launch successfully and show as healthy, the application does not seem to be installed.<br><br><strong>Which of the following should successfully install the application while complying with the new rule?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`Elastic IP 주소가 연결된 퍼블릭 서브넷에서 인스턴스를 시작합니다. 애플리케이션이 설치되고 실행되면 나중에 Elastic IP 주소를 분리하기 위한 스크립트를 실행합니다.`, en:`Launch the instances in a public subnet with Elastic IP addresses attached. Once the application is installed and running, run a script to disassociate the Elastic IP addresses afterwards.`},
    {k:'B', ko:`NAT 게이트웨이를 설정합니다. EC2 인스턴스를 프라이빗 서브넷에 배포합니다. 프라이빗 서브넷의 경로 테이블을 업데이트하여 NAT 게이트웨이를 기본 경로로 사용합니다.`, en:`Set up a NAT gateway. Deploy the EC2 instances to a private subnet. Update the private subnet's route table to use the NAT gateway as the default route.`},
    {k:'C', ko:`Amazon S3 버킷에 애플리케이션 아티팩트를 게시하고 S3에 대한 VPC 엔드포인트를 만듭니다. EC2 인스턴스에 IAM 인스턴스 프로필을 할당하여 S3 버킷에서 애플리케이션 아티팩트를 읽을 수 있도록 합니다.`, en:`Publish the application artifacts to an Amazon S3 bucket and create a VPC endpoint for S3. Assign an IAM instance profile to the EC2 instances so they can read the application artifacts from the S3 bucket.`},
    {k:'D', ko:`애플리케이션 인스턴스에 대한 보안 그룹을 만들고 아티팩트 저장소로의 아웃바운드 트래픽만 허용합니다. 설치가 완료되면 보안 그룹 규칙을 제거합니다.`, en:`Create a security group for the application instances and allow only outbound traffic to the artifact repository. Remove the security group rule once the install is complete.`},
  ],
  answer:['C'],
  vote:'91% C',
  explain:`<p><span class="mark-ok">✅ C — S3 버킷 + VPC 엔드포인트 + IAM 인스턴스 프로필</span></p><p>S3 VPC 게이트웨이 엔드포인트를 사용하면 EC2 인스턴스에서 인터넷 게이트웨이나 NAT 장치 없이 Amazon S3에 직접 접근할 수 있습니다. 이는 완전히 인터넷을 통하지 않는 AWS 내부 네트워크를 사용합니다. IAM 인스턴스 프로필로 S3 버킷 읽기 권한을 부여합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — NAT 게이트웨이는 인스턴스에서 인터넷으로 아웃바운드 접근을 허용합니다. 요구사항은 "인터넷에 액세스할 수 없이"이므로 NAT 게이트웨이도 규정을 위반합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ A</span> — 설치 중에 잠시라도 인터넷에 접근하는 것은 새 보안 규정을 위반합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — 여전히 인터넷에 있는 외부 저장소에 접근하는 것이므로 규정을 위반합니다.</p>`,
  disc:[{ans:'C (91%)',txt:'S3 VPC 게이트웨이 엔드포인트는 추가 비용 없이 VPC에서 S3에 직접 접근합니다. 인터넷 게이트웨이나 NAT 장치가 필요하지 않습니다. — AWS VPC PrivateLink 문서'}]
},
{
  n:16,
  ko:`개발팀은 AWS CodeCommit을 사용하여 애플리케이션 코드의 버전을 제어하고 AWS CodePipeline을 사용하여 소프트웨어 배포를 조율합니다. 이 팀은 파이프라인이 코드 변경 사항을 통합하도록 원격 메인 브랜치를 트리거로 사용하기로 결정했습니다. 개발자는 코드 변경 사항을 CodeCommit 리포지토리에 푸시했지만 파이프라인이 10분이 지나도 아무런 반응이 없다는 것을 알아챘습니다.<br><br><strong>이 문제를 해결하려면 다음 중 어떤 조치를 취해야 합니까?</strong>`,
  en:`A development team is using AWS CodeCommit to version control application code and AWS CodePipeline to orchestrate software deployments. The team has decided to use a remote main branch as the trigger for the pipeline to integrate code changes. A developer has pushed code changes to the CodeCommit repository, but noticed that the pipeline had no reaction, even after 10 minutes.<br><br><strong>Which of the following actions should be taken to troubleshoot this issue?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`파이프라인을 트리거하기 위해 메인 브랜치에 대한 Amazon EventBridge 규칙이 생성되었는지 확인합니다.`, en:`Check that an Amazon EventBridge rule has been created for the main branch to trigger the pipeline.`},
    {k:'B', ko:`CodePipeline 서비스 역할에 CodeCommit 저장소에 액세스할 수 있는 권한이 있는지 확인합니다.`, en:`Check that the CodePipeline service role has permission to access the CodeCommit repository.`},
    {k:'C', ko:`개발자의 IAM 역할에 CodeCommit 저장소에 푸시할 수 있는 권한이 있는지 확인합니다.`, en:`Check that the developer's IAM role has permission to push to the CodeCommit repository.`},
    {k:'D', ko:`Amazon CloudWatch Logs의 CodeCommit 오류로 인해 파이프라인이 시작되지 않았는지 확인합니다.`, en:`Check to see if the pipeline failed to start because of CodeCommit errors in Amazon CloudWatch Logs.`},
  ],
  answer:['A'],
  vote:'60% A (37% B)',
  explain:`<p><span class="mark-ok">✅ A — EventBridge 규칙 확인</span></p><p>CodePipeline이 CodeCommit 소스에서 자동으로 트리거되려면 <strong>Amazon EventBridge 규칙</strong>이 필요합니다. 콘솔을 통해 파이프라인을 생성하면 자동으로 EventBridge 규칙이 생성되지만, CLI나 IaC로 생성 시 직접 만들어야 합니다. 파이프라인에 "아무 반응이 없다"는 것은 트리거 자체가 작동하지 않았다는 의미로, EventBridge 규칙 미설정이 가장 가능성 높은 원인입니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — 권한 문제였다면 파이프라인이 시작은 되었다가 "권한 거부" 오류와 함께 즉시 실패했을 것입니다. 10분간 아무 반응 없음은 트리거 자체 문제를 시사합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — 개발자가 이미 저장소에 성공적으로 푸시했으므로 푸시 권한은 문제없습니다.</p><p style="margin-top:8px;"><em>참고: B도 일부 전문가들이 지지(37%)하지만, A가 공식 권장 사항입니다.</em></p>`,
  disc:[{ans:'A (60%) vs B (37%) — 논쟁',txt:'"After you select the repository name and branch, a message displays the Amazon CloudWatch Events rule to be created for this pipeline." — AWS CodePipeline 튜토리얼. 기본 이벤트 기반 트리거 방식은 EventBridge 규칙입니다.'}]
},
{
  n:17,
  ko:`한 회사의 개발자가 Amazon EC2 인스턴스를 원격 워크스테이션으로 사용합니다. 이 회사는 사용자가 EC2 보안 그룹을 만들거나 수정하여 무제한 인바운드 액세스를 허용할 수 있다는 점에 대해 우려하고 있습니다.<br><br>DevOps 엔지니어는 사용자가 무제한 보안 그룹 규칙을 만들 때 이를 감지하는 솔루션을 개발해야 합니다. 이 솔루션은 거의 실시간으로 보안 그룹 규칙의 변경 사항을 감지하고, 무제한 규칙을 제거하고, 보안 팀에 이메일 알림을 보내야 합니다. DevOps 엔지니어는 입력에서 보안 그룹 ID를 확인하고, 무제한 액세스를 허용하는 규칙을 제거하고, Amazon Simple Notification Service(Amazon SNS)를 통해 알림을 보내는 AWS Lambda 함수를 만들었습니다.<br><br><strong>DevOps 엔지니어는 요구 사항을 충족하기 위해 다음에 무엇을 해야 합니까?</strong>`,
  en:`A company's developers use Amazon EC2 instances as remote workstations. The company is concerned that users can create or modify EC2 security groups to allow unrestricted inbound access.<br><br>A DevOps engineer needs to develop a solution to detect when users create unrestricted security group rules. The solution must detect changes to security group rules in near real time, remove unrestricted rules, and send email notifications to the security team. The DevOps engineer has created an AWS Lambda function that checks for security group ID from input, removes rules that grant unrestricted access, and sends notifications through Amazon Simple Notification Service (Amazon SNS).<br><br><strong>What should the DevOps engineer do next to meet the requirements?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`SNS 토픽에서 호출할 Lambda 함수를 구성합니다. SNS 토픽에 대한 AWS CloudTrail 구독을 만듭니다. 보안 그룹 수정 이벤트에 대한 구독 필터를 구성합니다.`, en:`Configure the Lambda function to be invoked by the SNS topic. Create an AWS CloudTrail subscription for the SNS topic. Configure a subscription filter for security group modification events.`},
    {k:'B', ko:`Lambda 함수를 호출하기 위한 Amazon EventBridge 예약 규칙을 만듭니다. 매 시간 Lambda 함수를 실행하는 스케줄 패턴을 정의합니다.`, en:`Create an Amazon EventBridge scheduled rule to invoke the Lambda function. Define a schedule pattern that runs the Lambda function every hour.`},
    {k:'C', ko:`기본 이벤트 버스를 소스로 하는 Amazon EventBridge 이벤트 규칙을 만듭니다. EC2 보안 그룹 생성 및 수정 이벤트와 일치하도록 규칙의 이벤트 패턴을 정의합니다. Lambda 함수를 호출하도록 규칙을 구성합니다.`, en:`Create an Amazon EventBridge event rule that has the default event bus as the source. Define the rule's event pattern to match EC2 security group creation and modification events. Configure the rule to invoke the Lambda function.`},
    {k:'D', ko:`모든 AWS 서비스의 이벤트를 구독하는 Amazon EventBridge 사용자 지정 이벤트 버스를 만듭니다. 사용자 지정 이벤트 버스에서 호출할 Lambda 함수를 구성합니다.`, en:`Create an Amazon EventBridge custom event bus that subscribes to events from all AWS services. Configure the Lambda function to be invoked by the custom event bus.`},
  ],
  answer:['C'],
  vote:'100% C',
  explain:`<p><span class="mark-ok">✅ C — EventBridge 기본 이벤트 버스 + EC2 보안 그룹 이벤트 패턴 → Lambda</span></p><p>AWS 서비스 이벤트는 <strong>기본 이벤트 버스</strong>로 전달됩니다. EventBridge 이벤트 규칙에서 EC2 보안 그룹 생성/수정 이벤트를 패턴으로 정의하면 거의 실시간으로 변경을 감지합니다. Lambda 함수를 대상으로 지정하여 자동으로 무제한 규칙을 제거하고 SNS로 알림을 전송합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — 매 시간 실행하는 스케줄은 "거의 실시간" 요구사항을 충족하지 않습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ D</span> — AWS 서비스 이벤트는 기본 이벤트 버스에서 발생합니다. 사용자 지정 이벤트 버스는 교차 계정/리전 이벤트나 파트너 이벤트에 사용합니다. 모든 AWS 서비스를 구독하면 불필요한 비용이 발생합니다.</p>`,
  disc:[{ans:'C (100%)',txt:'기본 이벤트 버스: 계정 내 AWS 서비스 이벤트 수신. 사용자 지정 이벤트 버스: 다른 계정/파트너 이벤트 수신. EC2 보안 그룹 변경은 기본 이벤트 버스에서 처리합니다.'}]
},
{
  n:18,
  ko:`DevOps 엔지니어가 웹 서비스를 배포하기 위해 AWS CloudFormation 템플릿을 만들고 있습니다. 웹 서비스는 Application Load Balancer(ALB) 뒤의 프라이빗 서브넷에 있는 Amazon EC2 인스턴스에서 실행됩니다. DevOps 엔지니어는 서비스가 IPv6 주소가 있는 클라이언트의 요청을 수락할 수 있는지 확인해야 합니다.<br><br><strong>IPv6 클라이언트가 웹 서비스에 액세스할 수 있도록 DevOps 엔지니어는 CloudFormation 템플릿으로 무엇을 해야 합니까?</strong>`,
  en:`A DevOps engineer is creating an AWS CloudFormation template to deploy a web service. The web service will run on Amazon EC2 instances in a private subnet behind an Application Load Balancer (ALB). The DevOps engineer must ensure that the service can accept requests from clients that have IPv6 addresses.<br><br><strong>What should the DevOps engineer do with the CloudFormation template so that IPv6 clients can access the web service?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`EC2 인스턴스의 VPC와 프라이빗 서브넷에 IPv6 CIDR 블록을 추가합니다. IPv6 네트워크에 대한 경로 테이블 항목을 만들고, IPv6를 지원하는 EC2 인스턴스 유형을 사용하고, 각 EC2 인스턴스에 IPv6 주소를 할당합니다.`, en:`Add an IPv6 CIDR block to the VPC and the private subnet for the EC2 instances. Create route table entries for the IPv6 network, use EC2 instance types that support IPv6, and assign IPv6 addresses to each EC2 instance.`},
    {k:'B', ko:`각 EC2 인스턴스에 IPv6 Elastic IP 주소를 할당합니다. 대상 그룹을 만들고 EC2 인스턴스를 대상으로 추가합니다. ALB의 포트 443에 리스너를 만들고 대상 그룹을 ALB와 연결합니다.`, en:`Assign each EC2 instance an IPv6 Elastic IP address. Create a target group, and add the EC2 instances as targets. Create a listener on port 443 of the ALB, and associate the target group with the ALB.`},
    {k:'C', ko:`ALB를 Network Load Balancer(NLB)로 교체합니다. NLB의 VPC와 서브넷에 IPv6 CIDR 블록을 추가하고 NLB에 IPv6 탄력적 IP 주소를 할당합니다.`, en:`Replace the ALB with a Network Load Balancer (NLB). Add an IPv6 CIDR block to the VPC and subnets for the NLB, and assign the NLB an IPv6 Elastic IP address.`},
    {k:'D', ko:`ALB의 VPC와 서브넷에 IPv6 CIDR 블록을 추가합니다. 포트 443에 리스너를 만들고 ALB에서 <code>dualstack</code> IP 주소 유형을 지정합니다. 대상 그룹을 만들고 EC2 인스턴스를 대상으로 추가합니다. 대상 그룹을 ALB와 연결합니다.`, en:`Add an IPv6 CIDR block to the VPC and subnets for the ALB. Create a listener on port 443, and specify the dualstack IP address type on the ALB. Create a target group, and add the EC2 instances as targets. Associate the target group with the ALB.`},
  ],
  answer:['D'],
  vote:'100% D',
  explain:`<p><span class="mark-ok">✅ D — ALB dualstack IP 주소 유형</span></p><p>IPv6를 지원하려면 ALB를 <strong>dualstack</strong> IP 주소 유형으로 구성합니다. Dualstack 모드에서 ALB는 IPv4와 IPv6 주소를 모두 제공하고 A와 AAAA DNS 레코드를 생성합니다. 백엔드 EC2 인스턴스는 IPv4만 사용해도 됩니다. ALB의 VPC와 서브넷에 IPv6 CIDR 블록을 추가해야 ALB가 IPv6 주소를 받을 수 있습니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — 프라이빗 서브넷의 EC2 인스턴스에 IPv6를 직접 할당하는 방식입니다. 인터넷에서 IPv6로 직접 접근은 보안상 문제가 있으며, 요구사항은 ALB를 통한 접근입니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — ALB를 NLB로 교체할 필요가 없습니다. ALB도 dualstack을 지원합니다.</p>`,
  disc:[{ans:'D (100%)',txt:'"To support IPv6, configure your ALBs or NLBs with the dualstack IP address type. This means clients can communicate using both IPv4 and IPv6 addresses." — AWS IPv6 아키텍처 문서'}]
},
{
  n:19,
  ko:`한 회사에서는 AWS Organizations와 AWS Control Tower를 사용하여 회사의 모든 AWS 계정을 관리합니다. 이 회사는 Enterprise Support 플랜을 사용합니다.<br><br>DevOps 엔지니어는 Account Factory for Terraform(AFT)을 사용하여 새 계정을 프로비저닝합니다. 새 계정이 프로비저닝되면 DevOps 엔지니어는 새 계정에 대한 지원 플랜이 Basic Support 플랜으로 설정되어 있음을 알게 됩니다. DevOps 엔지니어는 Enterprise Support 플랜으로 새 계정을 프로비저닝하는 솔루션을 구현해야 합니다.<br><br><strong>어떤 솔루션이 이러한 요구 사항을 충족합니까?</strong>`,
  en:`A company uses AWS Organizations and AWS Control Tower to manage all the company's AWS accounts. The company uses the Enterprise Support plan.<br><br>A DevOps engineer is using Account Factory for Terraform (AFT) to provision new accounts. When new accounts are provisioned, the DevOps engineer notices that the support plan for the new accounts is set to the Basic Support plan. The DevOps engineer needs to implement a solution to provision the new accounts with the Enterprise Support plan.<br><br><strong>Which solution will meet these requirements?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`AWS Config 적합성 팩을 사용하여 조직의 일부인 계정 AWS Config 규칙을 배포하고 규정을 준수하지 않는 모든 계정을 자동으로 수정합니다.`, en:`Use an AWS Config conformance pack to deploy the account-part-of-organizations AWS Config rule and to automatically remediate any noncompliant accounts.`},
    {k:'B', ko:`AWS Lambda 함수를 만들어 AWS Support에서 Enterprise Support 플랜에 계정을 추가하기 위한 티켓을 만듭니다. Lambda 함수에 <code>support:ResolveCase</code> 권한을 부여합니다.`, en:`Create an AWS Lambda function to create a ticket for AWS Support to add the account to the Enterprise Support plan. Grant the Lambda function the support:ResolveCase permission.`},
    {k:'C', ko:`<code>control_tower_parameters</code> 입력에 추가 값을 추가하여 <code>AWSEnterpriseSupport</code> 매개변수를 조직의 관리 계정 번호로 설정합니다.`, en:`Add an additional value to the control_tower_parameters input to set the AWSEnterpriseSupport parameter as the organization's management account number.`},
    {k:'D', ko:`AFT 배포 입력 구성에서 <code>aft_feature_enterprise_support</code> 기능 플래그를 True로 설정합니다. AFT를 다시 배포하고 변경 사항을 적용합니다.`, en:`Set the aft_feature_enterprise_support feature flag to True in the AFT deployment input configuration. Redeploy AFT and apply the changes.`},
  ],
  answer:['D'],
  vote:'100% D',
  explain:`<p><span class="mark-ok">✅ D — aft_feature_enterprise_support 기능 플래그</span></p><p>AFT(Account Factory for Terraform)는 <code>aft_feature_enterprise_support</code> 기능 플래그를 제공합니다. 이 플래그를 <code>True</code>로 설정하면 AFT로 프로비저닝되는 새 계정에 자동으로 Enterprise Support 플랜이 적용됩니다. IaC 도구(Terraform)를 사용할 때는 콘솔에서 직접 변경하는 대신 구성 파일에서 변경해야 합니다.</p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — AWS Config 적합성 팩은 지원 플랜 변경과 무관합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ B</span> — <code>support:ResolveCase</code>는 지원 케이스를 해결하는 권한이며 지원 플랜 변경과 관련 없습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — AFT의 <code>control_tower_parameters</code>에는 <code>AWSEnterpriseSupport</code> 매개변수가 없습니다.</p>`,
  disc:[{ans:'D (100%)',txt:'AFT 기능 플래그: aft_feature_enterprise_support=true. 이 설정으로 프로비저닝되는 모든 새 계정에 Enterprise Support가 자동 적용됩니다. — AWS Control Tower AFT 기능 옵션 문서'}]
},
{
  n:20,
  ko:`한 회사의 DevOps 엔지니어가 AWS Systems Manager를 사용하여 유지 관리 기간 동안 유지 관리 작업을 수행합니다. 이 회사에는 AWS Health에서 알림을 받은 후 재시작이 필요한 Amazon EC2 인스턴스가 몇 개 있습니다. DevOps 엔지니어는 이러한 알림을 수정하기 위한 자동화된 솔루션을 구현해야 합니다. DevOps 엔지니어가 Amazon EventBridge 규칙을 만듭니다.<br><br><strong>DevOps 엔지니어는 이러한 요구 사항을 충족하기 위해 EventBridge 규칙을 어떻게 구성해야 합니까?</strong>`,
  en:`A company's DevOps engineer uses AWS Systems Manager to perform maintenance tasks during maintenance windows. The company has a few Amazon EC2 instances that require a restart after notifications from AWS Health. The DevOps engineer needs to implement an automated solution to remediate these notifications. The DevOps engineer creates an Amazon EventBridge rule.<br><br><strong>How should the DevOps engineer configure the EventBridge rule to meet these requirements?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`EC2의 서비스인 AWS Health의 이벤트 소스와 인스턴스 유지 관리를 나타내는 이벤트 유형을 구성합니다. EC2 인스턴스를 다시 시작하려면 Systems Manager 문서를 대상으로 지정합니다.`, en:`Configure an event source of AWS Health, a service of EC2, and an event type that indicates instance maintenance. Target a Systems Manager document to restart the EC2 instance.`},
    {k:'B', ko:`Systems Manager의 이벤트 소스와 유지 관리 기간을 나타내는 이벤트 유형을 구성합니다. EC2 인스턴스를 다시 시작하려면 Systems Manager 문서를 대상으로 지정합니다.`, en:`Configure an event source of Systems Manager and an event type that indicates a maintenance window. Target a Systems Manager document to restart the EC2 instance.`},
    {k:'C', ko:`EC2의 서비스인 AWS Health의 이벤트 소스와 인스턴스 유지 관리를 나타내는 이벤트 유형을 구성합니다. 유지 관리 기간 동안 EC2 인스턴스를 다시 시작하는 자동화 작업을 등록하는 새로 생성된 AWS Lambda 함수를 대상으로 합니다.`, en:`Configure an event source of AWS Health, a service of EC2, and an event type that indicates instance maintenance. Target a newly created AWS Lambda function that registers an automation task to restart the EC2 instance during a maintenance window.`},
    {k:'D', ko:`EC2의 이벤트 소스와 인스턴스 유지 관리를 나타내는 이벤트 유형을 구성합니다. 유지 관리 기간 동안 EC2 인스턴스를 다시 시작하기 위한 자동화 작업을 등록하는 새로 생성된 AWS Lambda 함수를 대상으로 합니다.`, en:`Configure an event source of EC2 and an event type that indicates instance maintenance. Target a newly created AWS Lambda function that registers an automation task to restart the EC2 instance during a maintenance window.`},
  ],
  answer:['A'],
  vote:'65% A (31% C)',
  explain:`<p><span class="mark-ok">✅ A — AWS Health 이벤트 소스 + SSM Automation 문서 대상</span></p><p>AWS Health가 EC2 인스턴스 유지 관리 이벤트를 발생시키면 EventBridge 규칙이 이를 감지합니다. EventBridge 대상으로 <strong>Systems Manager Automation</strong>을 지정하고 <code>AWS-RestartEC2Instance</code> 런북을 실행합니다. 회사가 이미 SSM을 사용 중이므로 별도의 Lambda를 만들 필요가 없습니다. AWS Training & Certification 연습 시험에서 A가 정답으로 확인되었습니다.</p>`,
  wrong:`<p><span class="mark-no">❌ B</span> — 이벤트 소스는 AWS Health여야 합니다. Systems Manager 이벤트는 SSM 내부 작업 이벤트이며 AWS Health 알림과 무관합니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C, D</span> — 회사에서 이미 SSM을 사용하고 있으므로 Lambda를 별도로 만들 필요가 없습니다. EventBridge는 SSM Automation을 직접 대상으로 지정할 수 있습니다.</p>`,
  disc:[{ans:'A (65%) vs C (31%) — 논쟁',txt:'AWS Training & Certification 연습 시험에서 A가 정답으로 확인됩니다. EventBridge → SSM Automation(AWS-RestartEC2Instance)을 직접 연결할 수 있습니다. Lambda는 이미 SSM이 있는 환경에서 불필요한 복잡성을 추가합니다.'}]
},
{
  n:21,
  ko:`한 회사가 사내 품질 관리 애플리케이션을 모두 컨테이너화했습니다. 이 회사는 Amazon EC2 인스턴스에서 Jenkins를 실행하고 있으며, 패치 및 업그레이드가 필요합니다. 규정 준수 책임자는 빌드 아티팩트에 회사 지적 재산이 포함되어 있으므로 암호화를 시작하도록 요청했습니다.<br><br><strong>가장 유지 관리하기 쉬운 방식으로 이를 달성하기 위해 DevOps 엔지니어는 무엇을 해야 합니까?</strong>`,
  en:`A company has containerized all of its in-house quality control applications. The company is running Jenkins on Amazon EC2 instances, which require patching and upgrading. The compliance officer has requested a DevOps engineer begin encrypting build artifacts since they contain company intellectual property.<br><br><strong>What should the DevOps engineer do to accomplish this in the MOST maintainable manner?</strong>`,
  type:'single',
  choices:[
    {k:'A', ko:`AWS Systems Manager를 사용하여 EC2 인스턴스에서 패치 및 업그레이드를 자동화하고 기본적으로 Amazon EBS 볼륨을 암호화합니다.`, en:`Automate patching and upgrading using AWS Systems Manager on EC2 instances and encrypt Amazon EBS volumes by default.`},
    {k:'B', ko:`Amazon ECS 클러스터에 Jenkins를 배포하고 기본 암호화가 활성화된 Amazon S3 버킷에 빌드 아티팩트를 복사합니다.`, en:`Deploy Jenkins to an Amazon ECS cluster and copy build artifacts to an Amazon S3 bucket with default encryption enabled.`},

    {k:'D', ko:`EC2 인스턴스에서 실행되는 Jenkins 인스턴스를 아티팩트 암호화가 포함된 AWS CodeBuild로 대체합니다.`, en:`Use AWS CodeBuild with artifact encryption to replace the Jenkins instance running on EC2 instances.`},

{
  n:22,
  ko:`IT 팀이 AWS CloudFormation 템플릿을 구축했습니다. 이 템플릿은 사용자 데이터 스크립트가 있는 Amazon EC2 인스턴스와 애플리케이션이 실행되는 동안 사용하는 Amazon S3 버킷을 만듭니다. CloudFormation 스택을 삭제하면 모든 리소스가 제거되어야 합니다. 그러나 팀은 스택 삭제 중에 오류가 발생하고 S3 버킷이 삭제되지 않는다는 것을 확인합니다.<br><br><strong>가장 효율적인 방식으로 오류를 해결하는 방법은 무엇입니까?</strong>`,
  en:`An IT team has built an AWS CloudFormation template so others in the company can quickly and reliably deploy and terminate an application. The template creates an Amazon EC2 instance with a user data script to install the application and an Amazon S3 bucket that the application uses to serve static webpages while it is running. All resources should be removed when the CloudFormation stack is deleted. However, the team observes that CloudFormation reports an error during stack deletion, and the S3 bucket created by the stack is not deleted. How can the team resolve the error in the MOST efficient manner to ensure that all resources are deleted without errors?`,
  type:'single',
  choices:[
    {k:'A', ko:`S3 버킷 리소스에 DeletionPolicy 속성을 추가하고 값에 Delete를 지정하면 스택이 삭제될 때 버킷도 제거됩니다.`, en:`Add a DeletionPolicy attribute to the S3 bucket resource, with the value Delete forcing the bucket to be removed when the stack is deleted.`},
    {k:'B', ko:`S3 버킷과 IAM 역할을 지정하는 DependsOn 속성이 있는 AWS Lambda 함수로 사용자 지정 리소스를 추가합니다. RequestType이 Delete일 때 버킷에서 모든 객체를 삭제하는 Lambda 함수를 작성합니다.`, en:`Add a custom resource with an AWS Lambda function with the DependsOn attribute specifying the S3 bucket, and an IAM role. Write the Lambda function to delete all objects from the bucket when RequestType is Delete.`},
    {k:'C', ko:`삭제되지 않은 리소스를 식별합니다. S3 버킷을 수동으로 비운 다음 삭제합니다.`, en:`Identify the resource that was not deleted. Manually empty the S3 bucket and then delete it.`},
    {k:'D', ko:`EC2 및 S3 버킷 리소스를 단일 AWS OpsWorks Stacks 리소스로 교체합니다. 스택에 대한 사용자 지정 레시피를 정의하여 EC2 인스턴스와 S3 버킷을 만들고 삭제합니다.`, en:`Replace the EC2 and S3 bucket resources with a single AWS OpsWorks Stacks resource. Define a custom recipe for the stack to create and delete the EC2 instance and the S3 bucket.`},
  ],

  vote:'100% B',
  explain:`<p><span class="mark-ok">✅ B — CloudFormation 사용자 지정 리소스 + Lambda</span></p><p>CloudFormation이 S3 버킷을 삭제하지 못하는 이유는 버킷이 비어있지 않기 때문입니다(AWS 공식 문서: "For Amazon S3 buckets, you must delete all objects for deletion to succeed"). DeletionPolicy: Delete를 추가해도 버킷 안의 객체가 있으면 여전히 실패합니다. Lambda 사용자 지정 리소스를 이용해 스택 삭제 시 먼저 버킷을 비우고 제거하는 것이 올바른 자동화 방식입니다.</p><p><a href="https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/cfn-init.html" target="_blank">📎 AWS 공식 문서</a></p>`,
  wrong:`<p><span class="mark-no">❌ A</span> — DeletionPolicy: Delete를 추가해도 객체가 있는 버킷은 삭제되지 않습니다.</p><p style="margin-top:8px;"><span class="mark-no">❌ C</span> — 수동 작업은 자동화 요구사항에 위배됩니다.</p>`,
  disc:[{ans:'B (100%)',txt:'"For Amazon S3 buckets, you must delete all objects in the bucket for deletion to succeed." — AWS 공식 문서. Lambda 사용자 지정 리소스로 먼저 버킷을 비워야 합니다.'}]
