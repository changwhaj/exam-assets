{
  n: 176,
  en: `A company has configured an Amazon S3 event source on an AWS Lambda function. The company needs the Lambda function to run when a new object is created or an existing object is modified in a particular S3 bucket. The Lambda function will use the S3 bucket name and the S3 object key of the incoming event to read the contents of the created or modified S3 object. The Lambda function will parse the contents and save the parsed contents to an Amazon DynamoDB table.<br><br>The Lambda function's execution role has permissions to read from the S3 bucket and to write to the DynamoDB table. During testing, a DevOps engineer discovers that the Lambda function does not run when objects are added to the S3 bucket or when existing objects are modified.<br><br>Which solution will resolve this problem?`,
  ko: `한 회사가 AWS Lambda 함수에서 Amazon S3 이벤트 소스를 구성했습니다. 회사는 특정 S3 버킷에서 새 객체가 생성되거나 기존 객체가 수정될 때 Lambda 함수가 실행되어야 합니다. Lambda 함수는 들어오는 이벤트의 S3 버킷 이름과 S3 객체 키를 사용하여 생성되거나 수정된 S3 객체의 내용을 읽습니다. Lambda 함수는 내용을 구문 분석하고 구문 분석된 내용을 Amazon DynamoDB 테이블에 저장합니다.<br><br>Lambda 함수의 실행 역할에는 S3 버킷에서 읽고 DynamoDB 테이블에 쓸 수 있는 권한이 있습니다. 테스트하는 동안 DevOps 엔지니어는 객체가 S3 버킷에 추가되거나 기존 객체가 수정될 때 Lambda 함수가 실행되지 않는다는 것을 발견했습니다.<br><br>이 문제를 해결하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Increase the memory of the Lambda function to give the function the ability to process large files from the S3 bucket.`, ko:`Lambda 함수의 메모리를 늘려서 함수가 S3 버킷에서 대용량 파일을 처리할 수 있도록 합니다.` },
    { k:'B', en:`Create a resource policy on the Lambda function to grant Amazon S3 the permission to invoke the Lambda function for the S3 bucket.`, ko:`Lambda 함수에서 리소스 정책을 생성하여 Amazon S3가 S3 버킷에 대해 Lambda 함수를 호출할 수 있는 권한을 부여합니다.` },
    { k:'C', en:`Configure an Amazon Simple Queue Service (Amazon SQS) queue as an OnFailure destination for the Lambda function.`, ko:`Lambda 함수에 대한 OnFailure 대상으로 Amazon Simple Queue Service(Amazon SQS) 대기열을 구성합니다.` },
    { k:'D', en:`Provision space in the /tmp folder of the Lambda function to give the function the ability to process large files from the S3 bucket.`, ko:`Lambda 함수의 /tmp 폴더에 공간을 프로비저닝하여 함수가 S3 버킷에서 대용량 파일을 처리할 수 있도록 합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>
<p>Lambda 함수가 실행되지 않는 이유는 <strong>권한(Permission) 문제</strong>입니다. Lambda 실행 역할(execution role)에는 S3에서 읽기 권한이 있지만, S3가 Lambda를 호출하려면 Lambda 함수의 <strong>리소스 기반 정책(resource-based policy)</strong>에서 Amazon S3 서비스가 해당 함수를 호출할 수 있도록 허용해야 합니다. 이는 실행 역할과 별개입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A, D</span> — 메모리 및 /tmp 공간 문제는 함수가 실행되지 않는 원인이 아닙니다. 실행 자체가 안 되는 상황입니다.</p>
<p><span class="mark-no">❌ C</span> — OnFailure 대상은 함수 실행 실패 시의 처리이며, 함수가 트리거되지 않는 문제와 무관합니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'S3 → Lambda 호출: 실행 역할(Lambda→S3 읽기)과 리소스 정책(S3→Lambda 호출 허용)은 별개. 리소스 정책이 없으면 S3가 Lambda를 호출 불가.' }]
},
{
  n: 177,
  en: `A company has deployed a critical application in two AWS Regions. The application uses an Application Load Balancer (ALB) in both Regions. The company has Amazon Route 53 alias DNS records for both ALBs.<br><br>The company uses Amazon Route 53 Application Recovery Controller to ensure that the application can fail over between the two Regions. The Route 53 ARC configuration includes a routing control for both Regions. The company uses Route 53 ARC to perform quarterly disaster recovery (DR) tests.<br><br>During the most recent DR test, a DevOps engineer accidentally turned off both routing controls. The company needs to ensure that at least one routing control is turned on at all times.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 두 AWS 리전에 중요한 애플리케이션을 배포했습니다. 이 애플리케이션은 두 리전 모두에서 Application Load Balancer(ALB)를 사용합니다. 회사는 두 ALB에 대한 Amazon Route 53 별칭 DNS 레코드를 가지고 있습니다.<br><br>회사는 Amazon Route 53 Application Recovery Controller를 사용하여 애플리케이션이 두 리전 간에 장애 조치를 수행할 수 있도록 합니다. Route 53 ARC 구성에는 두 리전에 대한 라우팅 제어가 포함되어 있습니다. 회사는 Route 53 ARC를 사용하여 분기별 재해 복구(DR) 테스트를 수행합니다.<br><br>가장 최근의 DR 테스트 중에 DevOps 엔지니어가 실수로 두 라우팅 제어를 모두 껐습니다. 회사는 항상 최소한 하나의 라우팅 제어가 켜져 있는지 확인해야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`In Route 53 ARC, create a new assertion safety rule. Apply the assertion safety rule to the two routing controls. Configure the rule with the ATLEAST type with a threshold of 1.`, ko:`Route 53 ARC에서 새로운 어설션 안전 규칙을 생성합니다. 두 개의 라우팅 제어에 어설션 안전 규칙을 적용합니다. 임계값이 1인 ATLEAST 유형으로 규칙을 구성합니다.` },
    { k:'B', en:`In Route 53 ARC, create a new gating safety rule. Apply the assertion safety rule to the two routing controls. Configure the rule with the OR type with a threshold of 1.`, ko:`Route 53 ARC에서 새로운 게이팅 안전 규칙을 생성합니다. 두 개의 라우팅 제어에 어설션 안전 규칙을 적용합니다. 임계값이 1인 OR 유형으로 규칙을 구성합니다.` },
    { k:'C', en:`In Route 53 ARC, create a new resource set. Configure the resource set with an AWS::Route53::HealthCheck resource type. Specify the ARNs of the two routing controls as the target resource. Create a new readiness check for the resource set.`, ko:`Route 53 ARC에서 새 리소스 세트를 생성합니다. AWS::Route53::HealthCheck 리소스 유형으로 리소스 세트를 구성합니다. 두 라우팅 제어의 ARN을 대상 리소스로 지정합니다. 리소스 세트에 대한 새 준비성 검사를 생성합니다.` },
    { k:'D', en:`In Route 53 ARC, create a new resource set. Configure the resource set with an AWS::Route53RecoveryReadiness::DNSTargetResource resource type. Add the domain names of the two Route 53 alias DNS records as the target resource. Create a new readiness check for the resource set.`, ko:`Route 53 ARC에서 새 리소스 세트를 생성합니다. AWS::Route53RecoveryReadiness::DNSTargetResource 리소스 유형으로 리소스 세트를 구성합니다. 두 Route 53 별칭 DNS 레코드의 도메인 이름을 대상 리소스로 추가합니다. 리소스 세트에 대한 새 준비 상태 검사를 생성합니다.` },
  ],
  answer: ['A'],
  vote: '93% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>Route 53 ARC의 <strong>어설션 안전 규칙(Assertion Safety Rule)</strong>은 사용자가 할 수 없는 작업을 정의합니다. <strong>ATLEAST 유형, 임계값 1</strong>로 구성하면 "적어도 1개의 라우팅 제어가 ON 상태여야 함"을 강제하여, 모든 라우팅 제어를 끄려는 시도를 차단합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 게이팅 안전 규칙(Gating Safety Rule)은 특정 제어가 ON일 때만 다른 제어 변경을 허용하는 "게이트" 역할이며, 이 시나리오에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ C, D</span> — 리소스 세트와 준비성 검사는 DR 준비 상태 모니터링용이며 라우팅 제어 동작을 제한하지 않습니다.</p>`,
  disc: [{ ans:'A (93%)', txt:'어설션 안전 규칙(ATLEAST, 임계값 1)으로 "항상 최소 1개 ON" 강제. AWS 공식 문서: routing-control.safety-rules.html' }]
},
{
  n: 178,
  en: `A healthcare services company is concerned about the growing costs of software licensing for an application for monitoring patient wellness. The company wants to create an audit process to ensure that the application is running exclusively on Amazon EC2 Dedicated Hosts. A DevOps engineer must create a workflow to audit the application to ensure compliance.<br><br>What steps should the engineer take to meet this requirement with the LEAST administrative overhead?`,
  ko: `의료 서비스 회사가 환자 건강 모니터링 애플리케이션의 소프트웨어 라이선스 비용이 증가하는 것에 대해 우려하고 있습니다. 회사는 애플리케이션이 Amazon EC2 전용 호스트에서만 실행되도록 감사 프로세스를 만들고자 합니다. DevOps 엔지니어는 규정 준수를 보장하기 위해 애플리케이션을 감사하는 워크플로를 생성해야 합니다.<br><br>최소한의 관리 오버헤드로 이 요구 사항을 충족하기 위해 엔지니어는 어떤 단계를 거쳐야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use AWS Systems Manager Configuration Compliance. Use calls to the put-compliance-items API action to scan and build a database of noncompliant EC2 instances based on their host placement configuration. Use an Amazon DynamoDB table to store these instance IDs for fast access. Generate a report through Systems Manager by calling the list-compliance-summaries API action.`, ko:`AWS Systems Manager Configuration Compliance를 사용합니다. put-compliance-items API 작업에 대한 호출을 사용하여 호스트 배치 구성에 따라 비준수 EC2 인스턴스의 데이터베이스를 스캔하고 빌드합니다. 빠른 액세스를 위해 Amazon DynamoDB 테이블을 사용하여 이러한 인스턴스 ID를 저장합니다. list-compliance-summaries API 작업을 호출하여 Systems Manager를 통해 보고서를 생성합니다.` },
    { k:'B', en:`Use custom Java code running on an EC2 instance. Set up EC2 Auto Scaling for the instance depending on the number of instances to be checked. Send the list of noncompliant EC2 instance IDs to an Amazon SQS queue. Set up another worker instance to process instance IDs from the SQS queue and write them to Amazon DynamoDB. Use an AWS Lambda function to terminate noncompliant instance IDs obtained from the queue, and send them to an Amazon SNS email topic for distribution.`, ko:`EC2 인스턴스에서 실행되는 사용자 지정 Java 코드를 사용합니다. 확인할 인스턴스 수에 따라 인스턴스에 대한 EC2 Auto Scaling을 설정합니다. 비준수 EC2 인스턴스 ID 목록을 Amazon SQS 대기열로 보냅니다. SQS 대기열에서 인스턴스 ID를 처리하고 Amazon DynamoDB에 쓸 다른 작업자 인스턴스를 설정합니다. AWS Lambda 함수를 사용하여 대기열에서 얻은 비준수 인스턴스 ID를 종료하고 배포를 위해 Amazon SNS 이메일 토픽으로 보냅니다.` },
    { k:'C', en:`Use AWS Config. Identify all EC2 instances to be audited by enabling Config Recording on all Amazon EC2 resources for the region. Create a custom AWS Config rule that triggers an AWS Lambda function by using the "config-rule-change-triggered" blueprint. Modify the Lambda evaluateCompliance() function to verify host placement to return a NON_COMPLIANT result if the instance is not running on an EC2 Dedicated Host. Use the AWS Config report to address noncompliant instances.`, ko:`AWS Config를 사용합니다. 해당 리전의 모든 Amazon EC2 리소스에서 Config Recording을 활성화하여 감사할 모든 EC2 인스턴스를 식별합니다. "config-rule-change-triggered" 블루프린트를 사용하여 AWS Lambda 함수를 트리거하는 사용자 지정 AWS Config 규칙을 생성합니다. 인스턴스가 EC2 전용 호스트에서 실행되지 않는 경우 NON_COMPLIANT 결과를 반환하도록 Lambda evaluateCompliance() 함수를 수정하여 호스트 배치를 확인합니다. AWS Config 보고서를 사용하여 비준수 인스턴스를 처리합니다.` },
    { k:'D', en:`Use AWS CloudTrail. Identify all EC2 instances to be audited by analyzing all calls to the EC2 RunCommand API action. Invoke an AWS Lambda function that analyzes the host placement of the instance. Store the EC2 instance ID of noncompliant resources in an Amazon RDS for MySQL DB instance. Generate a report by querying the RDS instance and exporting the query results to a CSV text file.`, ko:`AWS CloudTrail을 사용합니다. EC2 RunCommand API 작업에 대한 모든 호출을 분석하여 감사할 모든 EC2 인스턴스를 식별합니다. 인스턴스의 호스트 배치를 분석하는 AWS Lambda 함수를 호출합니다. 비준수 리소스의 EC2 인스턴스 ID를 Amazon RDS for MySQL DB 인스턴스에 저장합니다. RDS 인스턴스를 쿼리하고 쿼리 결과를 CSV 텍스트 파일로 내보내 보고서를 생성합니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — 핵심 이유</span></p>
<p><strong>AWS Config</strong>는 EC2 인스턴스의 구성을 지속적으로 모니터링하고 규정 준수를 평가하는 데 최적화된 서비스입니다. 사용자 지정 Config 규칙과 Lambda 함수를 조합하여 전용 호스트 배치 여부를 자동으로 확인하고 Config 보고서로 비준수 인스턴스를 관리할 수 있습니다. 최소 관리 오버헤드로 감사 워크플로를 구현합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — SSM Configuration Compliance는 패치 및 상태 관리용이며 DynamoDB 저장은 불필요한 복잡성을 추가합니다.</p>
<p><span class="mark-no">❌ B</span> — 사용자 지정 Java 코드 + SQS + 작업자 인스턴스는 매우 높은 관리 오버헤드를 요구합니다.</p>
<p><span class="mark-no">❌ D</span> — CloudTrail은 API 호출 감사용이며 인스턴스의 실시간 구성 상태를 모니터링하지 않습니다. RDS + CSV 내보내기도 불필요한 복잡성입니다.</p>`,
  disc: [{ ans:'C (100%)', txt:'AWS Config + 사용자 지정 규칙(전용 호스트 확인) + Config 보고서가 최소 오버헤드로 감사 요건을 충족.' }]
},
{
  n: 179,
  en: `A DevOps engineer is planning to deploy a Ruby-based application to production. The application needs to interact with an Amazon RDS for MySQL database and should have automatic scaling and high availability. The stored data in the database is critical and should persist regardless of the state of the application stack.<br><br>The DevOps engineer needs to set up an automated deployment strategy for the application with automatic rollbacks. The solution also must alert the application team when a deployment fails.<br><br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `DevOps 엔지니어가 Ruby 기반 애플리케이션을 프로덕션에 배포하려고 계획하고 있습니다. 이 애플리케이션은 Amazon RDS for MySQL 데이터베이스와 상호 작용해야 하며 자동 확장 및 고가용성이 있어야 합니다. 데이터베이스에 저장된 데이터는 중요하며 애플리케이션 스택의 상태와 관계없이 유지되어야 합니다.<br><br>DevOps 엔지니어는 자동 롤백을 사용하여 애플리케이션에 대한 자동화된 배포 전략을 설정해야 합니다. 또한 솔루션은 배포가 실패할 때 애플리케이션 팀에 경고해야 합니다.<br><br>이러한 요구 사항을 충족하는 단계의 조합은 무엇입니까? (세 가지를 선택하십시오.)`,
  type: 'multi',
  multiCount: 3,
  choices: [
    { k:'A', en:`Deploy the application on AWS Elastic Beanstalk. Deploy an Amazon RDS for MySQL DB instance as part of the Elastic Beanstalk configuration.`, ko:`AWS Elastic Beanstalk에 애플리케이션을 배포합니다. Elastic Beanstalk 구성의 일부로 Amazon RDS for MySQL DB 인스턴스를 배포합니다.` },
    { k:'B', en:`Deploy the application on AWS Elastic Beanstalk. Deploy a separate Amazon RDS for MySQL DB instance outside of Elastic Beanstalk.`, ko:`AWS Elastic Beanstalk에 애플리케이션을 배포합니다. Elastic Beanstalk 외부에 별도의 Amazon RDS for MySQL DB 인스턴스를 배포합니다.` },
    { k:'C', en:`Configure a notification email address that alerts the application team in the AWS Elastic Beanstalk configuration.`, ko:`AWS Elastic Beanstalk 구성에서 애플리케이션 팀에 알림을 보내는 알림 이메일 주소를 구성합니다.` },
    { k:'D', en:`Configure an Amazon EventBridge rule to monitor AWS Health events. Use an Amazon Simple Notification Service (Amazon SNS) topic as a target to alert the application team.`, ko:`AWS Health 이벤트를 모니터링하기 위해 Amazon EventBridge 규칙을 구성합니다. 애플리케이션 팀에 경고하기 위해 Amazon Simple Notification Service(Amazon SNS) 토픽을 대상으로 사용합니다.` },
    { k:'E', en:`Use the immutable deployment method to deploy new application versions.`, ko:`새로운 애플리케이션 버전을 배포하기 위해 변경 불가능한(immutable) 배포 방법을 사용합니다.` },
    { k:'F', en:`Use the rolling deployment method to deploy new application versions.`, ko:`새로운 애플리케이션 버전을 배포하기 위해 롤링 배포 방법을 사용합니다.` },
  ],
  answer: ['B','C','E'],
  vote: '83% BCE',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>
<p>데이터가 중요하므로 RDS를 Elastic Beanstalk <strong>외부에 별도로</strong> 배포해야 합니다. Beanstalk 구성에 포함된 RDS는 환경 삭제 시 함께 삭제될 수 있습니다.</p>
<p><span class="mark-ok">✅ C — 핵심 이유</span></p>
<p>Elastic Beanstalk는 SNS를 통해 알림 이메일 주소로 직접 알림을 보낼 수 있는 기능이 내장되어 있습니다.</p>
<p><span class="mark-ok">✅ E — 핵심 이유</span></p>
<p><strong>Immutable 배포</strong>는 새 인스턴스가 상태 검사를 통과하지 못하면 자동으로 종료하고 원래 인스턴스를 유지하여 자동 롤백을 지원합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — RDS를 Beanstalk 구성에 포함하면 환경 재생성 시 데이터가 손실될 수 있습니다.</p>
<p><span class="mark-no">❌ D</span> — AWS Health 이벤트는 서비스 상태 모니터링용이며 배포 실패 알림에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ F</span> — 롤링 배포는 원본 인스턴스를 점진적으로 교체하므로 배포 실패 시 롤백이 복잡합니다.</p>`,
  disc: [{ ans:'BCE (83%)', txt:'RDS 외부 분리(B) + Beanstalk 알림 이메일(C) + Immutable 배포로 자동 롤백(E).' }]
},
{
  n: 180,
  en: `A company is using AWS CodePipeline to deploy an application. According to a new guideline, a member of the company's security team must sign off on any application changes before the changes are deployed into production. The approval must be recorded and retained.<br><br>Which combination of actions will meet these requirements? (Choose two.)`,
  ko: `한 회사가 AWS CodePipeline을 사용하여 애플리케이션을 배포하고 있습니다. 새로운 가이드라인에 따라 회사 보안팀 구성원은 변경 사항을 프로덕션에 배포하기 전에 모든 애플리케이션 변경 사항에 서명해야 합니다. 승인은 기록하고 보관해야 합니다.<br><br>이러한 요구 사항을 충족하는 작업의 조합은 무엇입니까? (두 가지를 선택하십시오.)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Configure CodePipeline to write actions to Amazon CloudWatch Logs.`, ko:`CodePipeline을 구성하여 Amazon CloudWatch Logs에 작업을 기록합니다.` },
    { k:'B', en:`Configure CodePipeline to write actions to an Amazon S3 bucket at the end of each pipeline stage.`, ko:`각 파이프라인 단계가 끝날 때 Amazon S3 버킷에 작업을 쓰도록 CodePipeline을 구성합니다.` },
    { k:'C', en:`Create an AWS CloudTrail trail to deliver logs to Amazon S3.`, ko:`Amazon S3에 로그를 전송하기 위한 AWS CloudTrail 트레일을 생성합니다.` },
    { k:'D', en:`Create a CodePipeline custom action to invoke an AWS Lambda function for approval. Create a policy that gives the security team access to manage CodePipeline custom actions.`, ko:`승인을 위해 AWS Lambda 함수를 호출하는 CodePipeline 사용자 지정 작업을 생성합니다. 보안 팀에 CodePipeline 사용자 지정 작업을 관리할 수 있는 액세스 권한을 부여하는 정책을 생성합니다.` },
    { k:'E', en:`Create a CodePipeline manual approval action before the deployment step. Create a policy that grants the security team access to approve manual approval stages.`, ko:`배포 단계 전에 CodePipeline 수동 승인 작업을 생성합니다. 보안 팀에 수동 승인 단계를 승인할 수 있는 액세스 권한을 부여하는 정책을 생성합니다.` },
  ],
  answer: ['C','E'],
  vote: '87% CE',
  explain: `<p><span class="mark-ok">✅ E — 핵심 이유</span></p>
<p>CodePipeline의 <strong>수동 승인 작업(Manual Approval Action)</strong>은 배포 단계 전에 보안팀이 명시적으로 승인해야 파이프라인이 계속 진행되도록 합니다. IAM 정책으로 보안팀에게만 승인 권한을 부여합니다.</p>
<p><span class="mark-ok">✅ C — 핵심 이유</span></p>
<p><strong>AWS CloudTrail</strong>은 CodePipeline의 모든 API 호출(수동 승인 포함)을 기록합니다. CloudTrail 트레일을 생성하여 S3 버킷에 로그를 전송하면 승인 기록을 영구적으로 보관할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CloudWatch Logs는 EC2 등의 AWS 리소스 로그 저장용이며 CodePipeline 승인 기록에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ B</span> — CodePipeline 작업을 S3에 직접 쓰는 구성은 지원되지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — Lambda를 사용한 사용자 지정 승인은 불필요한 복잡성을 추가하며, 수동 승인 작업이 이미 기본 지원됩니다.</p>`,
  disc: [{ ans:'CE (87%)', txt:'수동 승인 작업(E)으로 서명 + CloudTrail(C)로 기록/보관. CodePipeline 승인은 CloudTrail API 이벤트로 기록됨.' }]
},
{
  n: 181,
  en: `A company requires its internal business teams to launch resources through pre-approved AWS CloudFormation templates only. The security team requires automated monitoring when resources drift from their expected state.<br><br>Which strategy should be used to meet these requirements?`,
  ko: `한 회사에서 내부 사업팀이 사전 승인된 AWS CloudFormation 템플릿을 통해서만 리소스를 시작하도록 요구합니다. 보안팀은 리소스가 예상 상태에서 벗어나는 경우 자동화된 모니터링을 요구합니다.<br><br>이러한 요구 사항을 충족하기 위해 어떤 전략을 사용해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Allow users to deploy CloudFormation stacks using a CloudFormation service role only. Use CloudFormation drift detection to detect when resources have drifted from their expected state.`, ko:`사용자가 CloudFormation 서비스 역할만 사용하여 CloudFormation 스택을 배포하도록 허용합니다. CloudFormation 드리프트 감지를 사용하여 리소스가 예상 상태에서 벗어나는 경우를 감지합니다.` },
    { k:'B', en:`Allow users to deploy CloudFormation stacks using a CloudFormation service role only. Use AWS Config rules to detect when resources have drifted from their expected state.`, ko:`사용자가 CloudFormation 서비스 역할만 사용하여 CloudFormation 스택을 배포하도록 허용합니다. AWS Config 규칙을 사용하여 리소스가 예상 상태에서 벗어난 경우를 감지합니다.` },
    { k:'C', en:`Allow users to deploy CloudFormation stacks using AWS Service Catalog only. Enforce the use of a launch constraint. Use AWS Config rules to detect when resources have drifted from their expected state.`, ko:`사용자가 AWS Service Catalog만 사용하여 CloudFormation 스택을 배포하도록 허용합니다. 시작 제약 조건의 사용을 강제합니다. AWS Config 규칙을 사용하여 리소스가 예상 상태에서 벗어난 경우를 감지합니다.` },
    { k:'D', en:`Allow users to deploy CloudFormation stacks using AWS Service Catalog only. Enforce the use of a template constraint. Use Amazon EventBridge notifications to detect when resources have drifted from their expected state.`, ko:`사용자가 AWS Service Catalog만 사용하여 CloudFormation 스택을 배포하도록 허용합니다. 템플릿 제약 조건의 사용을 강제합니다. Amazon EventBridge 알림을 사용하여 리소스가 예상 상태에서 벗어나는 경우를 감지합니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — 핵심 이유</span></p>
<p><strong>AWS Service Catalog</strong>는 사전 승인된 CloudFormation 템플릿(제품)만 배포할 수 있도록 강제하는 가장 적합한 서비스입니다. 시작 제약 조건(Launch Constraint)으로 배포 권한을 제어합니다. <strong>AWS Config</strong>의 <code>cloudformation-stack-drift-detection-check</code> 관리형 규칙은 스택 드리프트를 자동으로 모니터링합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A, B</span> — CloudFormation 서비스 역할만으로는 사전 승인된 템플릿만 사용하도록 강제할 수 없습니다.</p>
<p><span class="mark-no">❌ A</span> — CloudFormation 드리프트 감지는 수동 실행이 필요하며 자동 모니터링이 아닙니다.</p>
<p><span class="mark-no">❌ D</span> — EventBridge 알림만으로는 드리프트를 감지할 수 없습니다.</p>`,
  disc: [{ ans:'C (100%)', txt:'Service Catalog(사전 승인 템플릿 강제) + AWS Config(자동 드리프트 모니터링)의 조합.' }]
},
{
  n: 182,
  en: `A company has multiple development groups working in a single shared AWS account. The senior manager of the groups wants to be alerted via a third-party API call when the creation of resources approaches the service limits for the account.<br><br>Which solution will accomplish this with the LEAST amount of development effort?`,
  ko: `한 회사에는 단일 공유 AWS 계정에서 작업하는 여러 개발 그룹이 있습니다. 그룹의 상급 관리자는 리소스 생성이 계정의 서비스 한도에 도달하면 타사 API 호출을 통해 알림을 받고 싶어합니다.<br><br>최소한의 개발 노력으로 이를 달성하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an Amazon EventBridge rule that runs periodically and targets an AWS Lambda function. Within the Lambda function, evaluate the current state of the AWS environment and compare deployed resource values to resource limits on the account. Notify the senior manager if the account is approaching a service limit.`, ko:`주기적으로 실행되고 AWS Lambda 함수를 대상으로 하는 Amazon EventBridge 규칙을 생성합니다. Lambda 함수 내에서 AWS 환경의 현재 상태를 평가하고 배포된 리소스 값을 계정의 리소스 제한과 비교합니다. 계정이 서비스 한도에 접근하는 경우 상급 관리자에게 알립니다.` },
    { k:'B', en:`Deploy an AWS Lambda function that refreshes AWS Trusted Advisor checks, and configure an Amazon EventBridge rule to run the Lambda function periodically. Create another EventBridge rule with an event pattern matching Trusted Advisor events and a target Lambda function. In the target Lambda function, notify the senior manager.`, ko:`AWS Trusted Advisor 검사를 새로 고치는 AWS Lambda 함수를 배포하고 Lambda 함수를 주기적으로 실행하도록 Amazon EventBridge 규칙을 구성합니다. Trusted Advisor 이벤트와 대상 Lambda 함수가 일치하는 이벤트 패턴으로 다른 EventBridge 규칙을 생성합니다. 대상 Lambda 함수에서 상급 관리자에게 알립니다.` },
    { k:'C', en:`Deploy an AWS Lambda function that refreshes AWS Health Dashboard checks, and configure an Amazon EventBridge rule to run the Lambda function periodically. Create another EventBridge rule with an event pattern matching Health Dashboard events and a target Lambda function. In the target Lambda function, notify the senior manager.`, ko:`AWS Health Dashboard 검사를 새로 고치는 AWS Lambda 함수를 배포하고 Lambda 함수를 주기적으로 실행하도록 Amazon EventBridge 규칙을 구성합니다. Health Dashboard 이벤트와 대상 Lambda 함수가 일치하는 이벤트 패턴으로 다른 EventBridge 규칙을 생성합니다. 대상 Lambda 함수에서 상급 관리자에게 알립니다.` },
    { k:'D', en:`Add an AWS Config custom rule that runs periodically, checks the AWS service limit status, and streams notifications to an Amazon Simple Notification Service (Amazon SNS) topic. Deploy an AWS Lambda function that notifies the senior manager, and subscribe the Lambda function to the SNS topic.`, ko:`주기적으로 실행되고 AWS 서비스 한도 상태를 확인하고 Amazon Simple Notification Service(Amazon SNS) 토픽으로 알림을 스트리밍하는 AWS Config 사용자 지정 규칙을 추가합니다. 상급 관리자에게 알리는 AWS Lambda 함수를 배포하고 Lambda 함수를 SNS 토픽에 구독합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>
<p><strong>AWS Trusted Advisor</strong>는 서비스 한도 모니터링 기능을 내장하고 있으며 현재 10개 서비스에 걸쳐 39개 한도를 추적합니다. Lambda로 Trusted Advisor 검사를 새로 고치고, EventBridge 규칙으로 Trusted Advisor 이벤트를 감지하여 타사 API를 호출하는 Lambda를 트리거하면 최소 개발 노력으로 요구사항을 충족할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 직접 API를 통해 서비스 한도를 비교하는 Lambda 함수를 작성하는 것은 개발 노력이 더 큽니다.</p>
<p><span class="mark-no">❌ C</span> — AWS Health Dashboard는 서비스 상태 이벤트를 위한 것이며 서비스 한도 모니터링이 아닙니다.</p>
<p><span class="mark-no">❌ D</span> — Config 사용자 지정 규칙 개발은 Trusted Advisor를 활용하는 것보다 개발 노력이 큽니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'서비스 한도 = Trusted Advisor. 내장 기능 활용이 가장 적은 개발 노력.' }]
},
{
  n: 183,
  en: `A DevOps engineer is setting up a container-based architecture. The engineer has decided to use AWS CloudFormation to automatically provision an Amazon ECS cluster and an Amazon EC2 Auto Scaling group to launch the EC2 container instances. After successfully creating the CloudFormation stack, the engineer noticed that, even though the ECS cluster and the EC2 instances were created successfully and the stack finished the creation, the EC2 instances were associating with a different cluster.<br><br>How should the DevOps engineer update the CloudFormation template to resolve this issue?`,
  ko: `DevOps 엔지니어가 컨테이너 기반 아키텍처를 설정하고 있습니다. 엔지니어는 AWS CloudFormation을 사용하여 Amazon ECS 클러스터와 Amazon EC2 Auto Scaling 그룹을 자동으로 프로비저닝하여 EC2 컨테이너 인스턴스를 시작하기로 결정했습니다. CloudFormation 스택을 성공적으로 생성한 후, 엔지니어는 ECS 클러스터와 EC2 인스턴스가 성공적으로 생성되었고 스택이 생성을 완료했지만 EC2 인스턴스가 다른 클러스터와 연결되어 있다는 것을 알게 되었습니다.<br><br>DevOps 엔지니어는 이 문제를 해결하기 위해 CloudFormation 템플릿을 어떻게 업데이트해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Reference the EC2 instances in the AWS::ECS::Cluster resource and reference the ECS cluster in the AWS::ECS::Service resource.`, ko:`AWS::ECS::Cluster 리소스에서 EC2 인스턴스를 참조하고 AWS::ECS::Service 리소스에서 ECS 클러스터를 참조합니다.` },
    { k:'B', en:`Reference the ECS cluster in the AWS::AutoScaling::LaunchConfiguration resource of the UserData property.`, ko:`UserData 속성의 AWS::AutoScaling::LaunchConfiguration 리소스에서 ECS 클러스터를 참조합니다.` },
    { k:'C', en:`Reference the ECS cluster in the AWS::EC2::Instance resource of the UserData property.`, ko:`UserData 속성의 AWS::EC2::Instance 리소스에서 ECS 클러스터를 참조합니다.` },

{
  n: 184,
  en: `A DevOps engineer is implementing governance controls for a company that requires its infrastructure to be housed within the United States. The engineer must restrict which AWS Regions can be used, and ensure an alert is sent as soon as possible if any activity outside the governance policy takes place. The controls should be automatically enabled on any new Region outside the United States (US).<br><br>Which combination of actions will meet these requirements? (Choose two.)`,
  ko: `DevOps 엔지니어가 인프라를 미국 내에 두어야 하는 회사에 대한 거버넌스 제어를 구현하고 있습니다. 엔지니어는 사용할 수 있는 AWS 리전을 제한해야 하며 거버넌스 정책 외부의 활동이 발생하면 가능한 한 빨리 알림을 보내야 합니다. 미국(US) 외부의 모든 새 리전에서 제어를 자동으로 활성화해야 합니다.<br><br>이러한 요구 사항을 충족하는 작업의 조합은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi',

  choices: [

    { k:'C', en:`Use an AWS Lambda function that checks for AWS service activity and deploy it to all Regions. Write an Amazon EventBridge rule that runs the Lambda function every hour, sending an alert if activity is found in a non-US Region.`, ko:`AWS 서비스 활동을 확인하는 AWS Lambda 함수를 사용하여 모든 리전에 배포합니다. 매 시간 Lambda 함수를 실행하고 미국 이외 리전에서 활동이 발견되면 알림을 보내는 Amazon EventBridge 규칙을 작성합니다.` },
    { k:'D', en:`Use an AWS Lambda function to query Amazon Inspector to look for service activity in non-US Regions and send alerts if any activity is found.`, ko:`AWS Lambda 함수를 사용하여 Amazon Inspector에 쿼리를 보내 미국 이외 리전의 서비스 활동을 확인하고 활동이 발견되면 알림을 보냅니다.` },
    { k:'E', en:`Write an SCP using the aws:RequestedRegion condition key limiting access to US Regions. Apply the policy to all users, groups, and roles.`, ko:`aws:RequestedRegion 조건 키를 사용하여 미국 리전으로 액세스를 제한하는 SCP를 작성합니다. 모든 사용자, 그룹 및 역할에 정책을 적용합니다.` },

  vote: '91% AB',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>조직 루트에 SCP를 연결하면 새로 추가되는 리전에도 자동으로 적용됩니다. 미국 외 리전의 비 글로벌 서비스를 거부하는 SCP로 리전을 제한합니다.</p>
<p><span class="mark-ok">✅ B — 핵심 이유</span></p>
<p>CloudTrail을 모든 리전에 활성화하고 CloudWatch Logs 메트릭 필터로 미국 외 리전 활동을 탐지하면 실시간 알림이 가능합니다. 새 리전에서도 자동으로 작동합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ C</span> — 매 시간 실행으로는 "가능한 한 빨리" 알림 요건을 충족하지 못합니다.</p>
<p><span class="mark-no">❌ D</span> — Amazon Inspector는 취약점 스캐닝용이며 서비스 활동 모니터링이 아닙니다.</p>
<p><span class="mark-no">❌ E</span> — SCP는 사용자/그룹/역할이 아닌 OU나 계정에 연결합니다.</p>`,

{
  n: 185,
  en: `A company sells products through an ecommerce web application. The company wants a dashboard that shows a pie chart of product transaction details. The company wants to integrate the dashboard with the company's existing Amazon CloudWatch dashboards.<br><br>Which solution will meet these requirements with the MOST operational efficiency?`,
  ko: `한 회사가 전자상거래 웹 애플리케이션을 통해 제품을 판매합니다. 회사는 제품 거래 세부 정보의 파이 차트를 보여주는 대시보드를 원합니다. 회사는 대시보드를 회사의 기존 Amazon CloudWatch 대시보드와 통합하려고 합니다.<br><br>가장 높은 운영 효율성으로 이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Update the ecommerce application to emit a JSON object to a CloudWatch log group for each processed transaction. Use CloudWatch Logs Insights to query the log group and to visualize the results in a pie chart format. Attach the results to the desired CloudWatch dashboard.`, ko:`처리된 각 거래에 대해 CloudWatch 로그 그룹에 JSON 객체를 방출하도록 전자상거래 애플리케이션을 업데이트합니다. CloudWatch Logs Insights를 사용하여 로그 그룹을 쿼리하고 파이 차트 형식으로 결과를 시각화합니다. 결과를 원하는 CloudWatch 대시보드에 연결합니다.` },
    { k:'B', en:`Update the ecommerce application to emit a JSON object to an Amazon S3 bucket for each processed transaction. Use Amazon Athena to query the S3 bucket and to visualize the results in a pie chart format. Export the results from Athena. Attach the results to the desired CloudWatch dashboard.`, ko:`처리된 각 거래에 대해 Amazon S3 버킷에 JSON 객체를 내보내도록 전자상거래 애플리케이션을 업데이트합니다. Amazon Athena를 사용하여 S3 버킷을 쿼리하고 파이 차트 형식으로 결과를 시각화합니다. Athena에서 결과를 내보냅니다. 결과를 원하는 CloudWatch 대시보드에 첨부합니다.` },
    { k:'C', en:`Update the ecommerce application to use AWS X-Ray for instrumentation. Create a new X-Ray subsegment. Add an annotation for each processed transaction. Use X-Ray traces to query the data and to visualize the results in a pie chart format. Attach the results to the desired CloudWatch dashboard.`, ko:`AWS X-Ray를 계측에 사용하도록 전자상거래 애플리케이션을 업데이트합니다. 새로운 X-Ray 하위 세그먼트를 생성합니다. 처리된 각 거래에 대한 주석을 추가합니다. X-Ray 추적을 사용하여 데이터를 쿼리하고 파이 차트 형식으로 결과를 시각화합니다. 결과를 원하는 CloudWatch 대시보드에 연결합니다.` },
    { k:'D', en:`Update the ecommerce application to emit a JSON object to a CloudWatch log group for each processed transaction. Create an AWS Lambda function to aggregate and write the results to Amazon DynamoDB. Create a Lambda subscription filter for the log file. Attach the results to the desired CloudWatch dashboard.`, ko:`처리된 각 거래에 대해 CloudWatch 로그 그룹에 JSON 객체를 내보내도록 전자상거래 애플리케이션을 업데이트합니다. 결과를 집계하여 Amazon DynamoDB에 쓰는 AWS Lambda 함수를 생성합니다. 로그 파일에 대한 Lambda 구독 필터를 생성합니다. 결과를 원하는 CloudWatch 대시보드에 첨부합니다.` },
  ],
  answer: ['A'],
  vote: '92% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p><strong>CloudWatch Logs Insights</strong>는 로그를 쿼리하고 파이 차트를 포함한 다양한 시각화를 지원합니다. 쿼리 결과를 CloudWatch 대시보드에 직접 위젯으로 추가할 수 있어 기존 대시보드와의 통합이 가장 쉽습니다. 추가 서비스 없이 CloudWatch 생태계 내에서 완결됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — S3 + Athena는 CloudWatch 대시보드와의 통합이 복잡하고 추가 서비스가 필요합니다.</p>
<p><span class="mark-no">❌ C</span> — X-Ray는 분산 추적 도구로 장기 비즈니스 모니터링에 적합하지 않습니다.</p>

  disc: [{ ans:'A (92%)', txt:'CloudWatch Logs Insights로 로그 쿼리 + 파이 차트 시각화 + CloudWatch 대시보드 위젯으로 추가. 단일 서비스 내에서 완결.' }]

{

    { k:'D', en:`Create an SCP that allows the services that IAM Access Analyzer identifies. Create an OU for the account. Move the account into the new OU. Attach the new SCP to the management account. Detach the default FullAWSAccess SCP from the new OU.`, ko:`IAM Access Analyzer가 식별하는 서비스를 허용하는 SCP를 생성합니다. 계정에 대한 OU를 생성합니다. 계정을 새 OU로 이동합니다. 새 SCP를 관리 계정에 연결합니다. 새 OU에서 기본 FullAWSAccess SCP를 분리합니다.` },

<p><span class="mark-no">❌ D</span> — SCP는 관리 계정이 아닌 OU에 연결해야 합니다.</p>`,

{
  n: 187,
  en: `A company has multiple development teams in different business units that work in a shared single AWS account. All Amazon EC2 resources that are created in the account must include tags that specify who created the resources. The tagging must occur within the first hour of resource creation.<br><br>A DevOps engineer needs to add tags to the created resources that include the user ID that created the resource and the cost center ID. The DevOps engineer configures an AWS Lambda function with the cost center mappings to tag the resources. The DevOps engineer also sets up AWS CloudTrail in the AWS account. An Amazon S3 bucket stores the CloudTrail event logs.<br><br>Which solution will meet the tagging requirements?`,
  ko: `한 회사에는 공유된 단일 AWS 계정에서 작업하는 여러 사업부에 여러 개발 팀이 있습니다. 계정에서 생성된 모든 Amazon EC2 리소스에는 리소스를 생성한 사람을 지정하는 태그가 포함되어야 합니다. 태그 지정은 리소스 생성 후 첫 시간 내에 이루어져야 합니다.<br><br>DevOps 엔지니어는 리소스를 생성한 사용자 ID와 비용 센터 ID를 포함하는 태그를 생성된 리소스에 추가해야 합니다. DevOps 엔지니어는 비용 센터 매핑을 사용하여 리소스에 태그를 지정하기 위해 AWS Lambda 함수를 구성합니다. DevOps 엔지니어는 또한 AWS 계정에서 AWS CloudTrail을 설정합니다. Amazon S3 버킷은 CloudTrail 이벤트 로그를 저장합니다.<br><br>태그 지정 요구 사항을 충족하는 솔루션은 무엇입니까?`,

    { k:'B', en:`Enable server access logging on the S3 bucket. Create an S3 event notification on the S3 bucket for s3:ObjectTagging:* events.`, ko:`S3 버킷에서 서버 액세스 로깅을 활성화합니다. s3:ObjectTagging:* 이벤트에 대한 S3 버킷에서 S3 이벤트 알림을 생성합니다.` },
    { k:'C', en:`Create a recurring hourly Amazon EventBridge scheduled rule that invokes the Lambda function. Modify the Lambda function to read the logs from the S3 bucket.`, ko:`Lambda 함수를 호출하는 반복되는 시간별 Amazon EventBridge 예약 규칙을 생성합니다. S3 버킷에서 로그를 읽도록 Lambda 함수를 수정합니다.` },
    { k:'D', en:`Create an Amazon EventBridge rule that uses Amazon EC2 as the event source. Configure the rule to match events delivered by CloudTrail. Configure the rule to target the Lambda function.`, ko:`Amazon EC2를 이벤트 소스로 사용하는 Amazon EventBridge 규칙을 생성합니다. CloudTrail에서 전달한 이벤트와 일치하도록 규칙을 구성합니다. Lambda 함수를 대상으로 하도록 규칙을 구성합니다.` },

  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — 핵심 이유</span></p>
<p><strong>Amazon EventBridge + CloudTrail</strong> 조합이 EC2 리소스 생성 이벤트를 실시간으로 감지하는 가장 효율적인 방법입니다. EC2 RunInstances API 호출이 CloudTrail에 의해 캡처되고 EventBridge 규칙이 이를 감지하여 즉시 Lambda 함수를 트리거합니다. 이를 통해 1시간 이내 태그 지정 요건을 충족합니다.</p>`,

{
  n: 188,
  en: `A company runs an application for multiple environments in a single AWS account. An AWS CodePipeline pipeline uses a development Amazon Elastic Container Service (Amazon ECS) cluster to test an image for the application from an Amazon Elastic Container Registry (Amazon ECR) repository. The pipeline promotes the image to a production ECS cluster.<br><br>The company needs to move the production cluster into a separate AWS account in the same AWS Region. The production cluster must be able to download the images over a private connection.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 단일 AWS 계정에서 여러 환경에 대한 애플리케이션을 실행합니다. AWS CodePipeline 파이프라인은 개발 Amazon ECS 클러스터를 사용하여 Amazon ECR 리포지토리에서 애플리케이션 이미지를 테스트합니다. 파이프라인은 이미지를 프로덕션 ECS 클러스터로 승격합니다.<br><br>회사는 프로덕션 클러스터를 동일한 AWS 리전의 별도 AWS 계정으로 이동해야 합니다. 프로덕션 클러스터는 개인 연결을 통해 이미지를 다운로드할 수 있어야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use Amazon ECR VPC endpoints and an Amazon S3 gateway endpoint. In the separate AWS account, create an ECR repository. Set the repository policy to allow the production ECS tasks to pull images from the main AWS account. Configure the production ECS task execution role to have permission to download the image from the ECR repository.`, ko:`Amazon ECR VPC 엔드포인트와 Amazon S3 게이트웨이 엔드포인트를 사용합니다. 별도의 AWS 계정에서 ECR 리포지토리를 생성합니다. 프로덕션 ECS 작업이 기본 AWS 계정에서 이미지를 가져올 수 있도록 리포지토리 정책을 설정합니다. 프로덕션 ECS 작업 실행 역할을 구성하여 ECR 리포지토리에서 이미지를 다운로드할 수 있는 권한을 갖도록 합니다.` },
    { k:'B', en:`Set a repository policy on the production ECR repository in the main AWS account. Configure the repository policy to allow the production ECS tasks in the separate AWS account to pull images from the main account. Configure the production ECS task execution role to have permission to download the image from the ECR repository.`, ko:`기본 AWS 계정의 프로덕션 ECR 리포지토리에 리포지토리 정책을 설정합니다. 리포지토리 정책을 구성하여 별도의 AWS 계정에서 프로덕션 ECS 작업이 기본 계정에서 이미지를 가져올 수 있도록 합니다. 프로덕션 ECS 작업 실행 역할에 ECR 리포지토리에서 이미지를 다운로드할 수 있는 권한을 부여합니다.` },
    { k:'C', en:`Configure ECR private image replication in the main AWS account. Activate cross-account replication. Define the destination account ID of the separate AWS account.`, ko:`기본 AWS 계정에서 ECR 개인 이미지 복제를 구성합니다. 계정 간 복제를 활성화합니다. 별도의 AWS 계정의 대상 계정 ID를 정의합니다.` },
    { k:'D', en:`Use Amazon ECR VPC endpoints and an Amazon S3 gateway endpoint. Set a repository policy on the production ECR repository in the main AWS account. Configure the repository policy to allow the production ECS tasks in the separate AWS account to pull images from the main account. Configure the production ECS task execution role to have permission to download the image from the ECR repository.`, ko:`Amazon ECR VPC 엔드포인트와 Amazon S3 게이트웨이 엔드포인트를 사용합니다. 기본 AWS 계정의 프로덕션 ECR 리포지토리에 리포지토리 정책을 설정합니다. 리포지토리 정책을 구성하여 별도의 AWS 계정에서 프로덕션 ECS 작업이 기본 계정에서 이미지를 가져올 수 있도록 합니다. 프로덕션 ECS 작업 실행 역할을 구성하여 ECR 리포지토리에서 이미지를 다운로드할 수 있는 권한을 갖도록 합니다.` },

  explain: `<p><span class="mark-ok">✅ D — 핵심 이유</span></p>
<p><strong>개인 연결(private connection)</strong> 요건을 충족하려면 <strong>Amazon ECR VPC 엔드포인트</strong>와 <strong>Amazon S3 게이트웨이 엔드포인트</strong>가 필요합니다(ECR이 이미지 레이어를 S3에 저장하기 때문). 기본 계정의 ECR 리포지토리에 계정 간 접근을 허용하는 리포지토리 정책을 설정하고, 프로덕션 ECS 태스크 실행 역할에 다운로드 권한을 부여합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 별도 계정에 ECR 리포지토리를 새로 생성하는 것은 불필요합니다.</p>
<p><span class="mark-no">❌ B</span> — VPC 엔드포인트가 없어 개인 연결 요건을 충족하지 못합니다.</p>
<p><span class="mark-no">❌ C</span> — ECR 이미지 복제는 가능하지만 개인 연결 요건(VPC 엔드포인트)을 명시하지 않습니다.</p>`,
  disc: [{ ans:'D (78%)', txt:'개인 연결 = ECR VPC 엔드포인트 + S3 게이트웨이 엔드포인트 필수. + 계정 간 리포지토리 정책.' }]
},
{
  n: 189,
  en: `A company needs to ensure that flow logs remain configured for all existing and new VPCs in its AWS account. The company uses an AWS CloudFormation stack to manage its VPCs. The company needs a solution that will work for any VPCs that any IAM user creates.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 AWS 계정의 모든 기존 및 새 VPC에 대해 플로우 로그가 구성된 상태로 유지되도록 해야 합니다. 회사는 AWS CloudFormation 스택을 사용하여 VPC를 관리합니다. 회사는 모든 IAM 사용자가 생성한 모든 VPC에 적합한 솔루션이 필요합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Add the AWS::EC2::FlowLog resource to the CloudFormation stack that creates the VPCs.`, ko:`VPC를 생성하는 CloudFormation 스택에 AWS::EC2::FlowLog 리소스를 추가합니다.` },
    { k:'B', en:`Create an organization in AWS Organizations. Add the company's AWS account to the organization. Create an SCP to prevent users from modifying VPC flow logs.`, ko:`AWS Organizations에서 조직을 생성합니다. 회사의 AWS 계정을 조직에 추가합니다. 사용자가 VPC 플로우 로그를 수정하지 못하도록 SCP를 생성합니다.` },
    { k:'C', en:`Turn on AWS Config. Create an AWS Config rule to check whether VPC flow logs are turned on. Configure automatic remediation to turn on VPC flow logs.`, ko:`AWS Config를 켭니다. VPC 플로우 로그가 켜져 있는지 확인하기 위한 AWS Config 규칙을 생성합니다. VPC 플로우 로그를 켜기 위한 자동 수정을 구성합니다.` },
    { k:'D', en:`Create an IAM policy to deny the use of API calls for VPC flow logs. Attach the IAM policy to all IAM users.`, ko:`VPC 플로우 로그에 대한 API 호출 사용을 거부하는 IAM 정책을 생성합니다. 모든 IAM 사용자에게 IAM 정책을 연결합니다.` },
  ],
  answer: ['C'],
  vote: '94% C',
  explain: `<p><span class="mark-ok">✅ C — 핵심 이유</span></p>
<p><strong>AWS Config</strong>는 모든 기존 및 새로 생성되는 VPC를 지속적으로 모니터링하고 플로우 로그가 없는 경우 자동 수정을 트리거합니다. CloudFormation 스택 외부에서 생성된 VPC도 포함하며, 어떤 IAM 사용자가 생성하든 모두 적용됩니다. AWS 공식 블로그에서도 이 패턴을 권장합니다.</p>`,

<p><span class="mark-no">❌ B</span> — SCP는 플로우 로그 삭제 방지는 할 수 있지만, 플로우 로그가 켜져 있음을 보장하거나 자동으로 활성화하지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — API 호출 거부는 플로우 로그를 비활성화하는 것이므로 요구사항과 반대됩니다.</p>`,

{
  n: 190,
  en: `A company's application teams use AWS CodeCommit repositories for their applications. The application teams have repositories in multiple AWS accounts. All accounts are in an organization in AWS Organizations.<br><br>Each application team uses AWS IAM Identity Center (AWS Single Sign-On) configured with an external IdP to assume a developer IAM role. The developer role allows the application teams to use Git to work with the code in the repositories.<br><br>A security audit reveals that the application teams can modify the main branch in any repository. A DevOps engineer must implement a solution that allows the application teams to modify the main branch of only the repositories that they manage.<br><br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `회사의 애플리케이션 팀은 애플리케이션에 AWS CodeCommit 리포지토리를 사용합니다. 애플리케이션 팀은 여러 AWS 계정에 리포지토리를 가지고 있습니다. 모든 계정은 AWS Organizations의 조직에 있습니다.<br><br>각 애플리케이션 팀은 외부 IdP로 구성된 AWS IAM Identity Center(AWS Single Sign-On)를 사용하여 개발자 IAM 역할을 맡습니다. 개발자 역할을 통해 애플리케이션 팀은 Git을 사용하여 리포지토리의 코드로 작업할 수 있습니다.<br><br>보안 감사 결과 애플리케이션 팀은 모든 리포지토리의 메인 브랜치를 수정할 수 있음이 밝혀졌습니다. DevOps 엔지니어는 애플리케이션 팀이 관리하는 리포지토리의 메인 브랜치만 수정할 수 있는 솔루션을 구현해야 합니다.<br><br>이러한 요구 사항을 충족하는 단계의 조합은 무엇입니까? (세 가지를 선택하십시오.)`,
  type: 'multi',
  multiCount: 3,
  choices: [
    { k:'A', en:`Update the SAML assertion to pass the user's team name. Update the IAM role's trust policy to add an access-team session tag that has the team name.`, ko:`SAML 어설션을 업데이트하여 사용자의 팀 이름을 전달합니다. IAM 역할의 신뢰 정책을 업데이트하여 팀 이름이 있는 access-team 세션 태그를 추가합니다.` },
    { k:'B', en:`Create an approval rule template for each team in the Organizations management account. Associate the template with all the repositories. Add the developer role ARN as an approver.`, ko:`조직 관리 계정에서 각 팀에 대한 승인 규칙 템플릿을 생성합니다. 템플릿을 모든 리포지토리와 연결합니다. 개발자 역할 ARN을 승인자로 추가합니다.` },
    { k:'C', en:`Create an approval rule template for each account. Associate the template with all repositories. Add the "aws:ResourceTag/access-team": "\${aws:PrincipalTag/access-team}" condition to the approval rule template.`, ko:`각 계정에 대한 승인 규칙 템플릿을 생성합니다. 템플릿을 모든 리포지토리와 연결합니다. 승인 규칙 템플릿에 "aws:ResourceTag/access-team": "\${aws:PrincipalTag/access-team}" 조건을 추가합니다.` },
    { k:'D', en:`For each CodeCommit repository, add an access-team tag that has the value set to the name of the associated team.`, ko:`각 CodeCommit 리포지토리에 대해 연관된 팀의 이름으로 설정된 값을 갖는 access-team 태그를 추가합니다.` },
    { k:'E', en:`Attach an SCP to the accounts. Include a statement that denies codecommit:GitPush, codecommit:PutFile, and codecommit:MergeBranchesByFastForward actions if aws:ResourceTag/access-team does not match aws:PrincipalTag/access-team.`, ko:`계정에 SCP를 연결합니다. aws:ResourceTag/access-team이 aws:PrincipalTag/access-team과 일치하지 않을 경우 codecommit:GitPush, codecommit:PutFile 및 codecommit:MergeBranchesByFastForward 작업을 거부하는 문을 포함합니다.` },
    { k:'F', en:`Create an IAM permissions boundary in each account. Include a statement that allows codecommit:GitPush, codecommit:PutFile, and codecommit:MergeBranchesByFastForward actions if aws:ResourceTag/access-team matches aws:PrincipalTag/access-team.`, ko:`각 계정에서 IAM 권한 경계를 생성합니다. aws:ResourceTag/access-team이 aws:PrincipalTag/access-team과 일치하는 경우 codecommit:GitPush, codecommit:PutFile 및 codecommit:MergeBranchesByFastForward 작업을 허용하는 문을 포함합니다.` },
  ],
  answer: ['A','D','E'],
  vote: '71% ADE',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>외부 IdP의 SAML 어설션에 팀 이름을 포함하고 IAM 역할 신뢰 정책에서 이를 <strong>access-team 세션 태그</strong>로 설정합니다. 이를 통해 Principal의 팀 정보를 조건으로 사용할 수 있습니다.</p>
<p><span class="mark-ok">✅ D — 핵심 이유</span></p>
<p>각 CodeCommit 리포지토리에 <strong>access-team 태그</strong>를 추가하여 어떤 팀이 소유하는지 표시합니다. 이를 통해 리소스 태그와 Principal 태그를 비교할 수 있습니다.</p>
<p><span class="mark-ok">✅ E — 핵심 이유</span></p>
<p>SCP로 <code>aws:ResourceTag/access-team != aws:PrincipalTag/access-team</code>인 경우 GitPush 등을 거부합니다. 이를 통해 팀이 자신의 리포지토리만 수정할 수 있도록 제한합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B, C</span> — 승인 규칙 템플릿은 풀 리퀘스트 관리용이며 직접 푸시 제어에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ F</span> — 권한 경계는 허용 정책이며 SCP처럼 조직 전체에 일괄 적용하기 어렵고 각 역할마다 설정해야 합니다.</p>`,
  disc: [{ ans:'ADE (71%), ADF (17%)', txt:'ABAC 패턴: SAML 세션 태그(A) + 리소스 태그(D) + SCP 거부(E). 팀 태그 불일치 시 main 브랜치 수정 차단.' }]
},
{
  n: 191,
  en: `A company uses AWS WAF to protect its cloud infrastructure. A DevOps engineer needs to give an operations team the ability to analyze log messages from AWS WAF. The operations team needs to be able to create alarms for specific patterns in the log output.<br><br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `한 회사가 AWS WAF를 사용하여 클라우드 인프라를 보호합니다. DevOps 엔지니어는 운영 팀에 AWS WAF의 로그 메시지를 분석할 수 있는 기능을 제공해야 합니다. 운영 팀은 로그 출력의 특정 패턴에 대한 알람을 생성할 수 있어야 합니다.<br><br>최소한의 운영 오버헤드로 이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an Amazon CloudWatch Logs log group. Configure the appropriate AWS WAF web ACL to send log messages to the log group. Instruct the operations team to create CloudWatch metric filters.`, ko:`Amazon CloudWatch Logs 로그 그룹을 생성합니다. 적절한 AWS WAF 웹 ACL을 구성하여 로그 메시지를 로그 그룹으로 보냅니다. 운영 팀에 CloudWatch 메트릭 필터를 생성하도록 지시합니다.` },

<p><span class="mark-no">❌ E</span> — 메모리 저장소에 데이터를 오래 유지하면 비용은 증가하지만 일일 쿼리 성능에는 도움이 되지 않습니다.</p>`,
  disc: [{ ans:'ADF (67%), ADE (19%)', txt:'Timestream 최적: 배치 쓰기 + 다중 측정 레코드 + 자기 저장소 중심 보존 전략.' }]
},
{
  n: 196,
  en: `A DevOps engineer has created an AWS CloudFormation template that deploys an application on Amazon EC2 instances. The EC2 instances run Amazon Linux. The application is deployed to the EC2 instances by using shell scripts that contain user data. The EC2 instances have an IAM instance profile that has an IAM role with the AmazonSSMManagedinstanceCore managed policy attached.<br><br>The DevOps engineer has modified the user data in the CloudFormation template to install a new version of the application. The engineer has also applied the stack update. However, the application was not updated on the running EC2 instances. The engineer needs to ensure that the changes to the application are installed on the running EC2 instances.<br><br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `DevOps 엔지니어가 Amazon EC2 인스턴스에 애플리케이션을 배포하는 AWS CloudFormation 템플릿을 생성했습니다. EC2 인스턴스는 Amazon Linux를 실행합니다. 애플리케이션은 사용자 데이터가 포함된 셸 스크립트를 사용하여 EC2 인스턴스에 배포됩니다. EC2 인스턴스에는 AmazonSSMManagedinstanceCore 관리형 정책이 연결된 IAM 역할이 있는 IAM 인스턴스 프로필이 있습니다.<br><br>DevOps 엔지니어는 새 버전의 애플리케이션을 설치하기 위해 CloudFormation 템플릿의 사용자 데이터를 수정했습니다. 엔지니어는 또한 스택 업데이트를 적용했습니다. 그러나 실행 중인 EC2 인스턴스에서 애플리케이션이 업데이트되지 않았습니다. 엔지니어는 애플리케이션의 변경 사항이 실행 중인 EC2 인스턴스에 설치되었는지 확인해야 합니다.<br><br>이러한 요구 사항을 충족하는 단계의 조합은 무엇입니까? (두 가지를 선택하십시오.)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Configure the user data content to use the Multipurpose Internet Mail Extensions (MIME) multipart format. Set the scripts-user parameter to always in the text/cloud-config section.`, ko:`Multipurpose Internet Mail Extensions(MIME) 멀티파트 형식을 사용하도록 사용자 데이터 콘텐츠를 구성합니다. text/cloud-config 섹션에서 scripts-user 파라미터를 always로 설정합니다.` },
    { k:'B', en:`Refactor the user data commands to use the cfn-init helper script. Update the user data to install and configure the cfn-hup and cfn-init helper scripts to monitor and apply the metadata changes.`, ko:`cfn-init 헬퍼 스크립트를 사용하도록 사용자 데이터 명령을 리팩토링합니다. 사용자 데이터를 업데이트하여 cfn-hup 및 cfn-init 헬퍼 스크립트를 설치 및 구성하여 메타데이터 변경 사항을 모니터링하고 적용합니다.` },
    { k:'C', en:`Configure an EC2 launch template for the EC2 instances. Create a new EC2 Auto Scaling group. Associate the Auto Scaling group with the EC2 launch template. Use the AutoScalingScheduledAction update policy for the Auto Scaling group.`, ko:`EC2 인스턴스에 대한 EC2 시작 템플릿을 구성합니다. 새 EC2 Auto Scaling 그룹을 생성합니다. Auto Scaling 그룹을 EC2 시작 템플릿과 연결합니다. Auto Scaling 그룹에 대해 AutoScalingScheduledAction 업데이트 정책을 사용합니다.` },
    { k:'D', en:`Refactor the user data commands to use an AWS Systems Manager document (SSM document). Add an AWS CLI command in the user data to use Systems Manager Run Command to apply the SSM document to the EC2 instances.`, ko:`AWS Systems Manager 문서(SSM 문서)를 사용하도록 사용자 데이터 명령을 리팩토링합니다. 사용자 데이터에 AWS CLI 명령을 추가하여 Systems Manager Run Command를 사용하여 SSM 문서를 EC2 인스턴스에 적용합니다.` },
    { k:'E', en:`Refactor the user data command to use an AWS Systems Manager document (SSM document). Use Systems Manager State Manager to create an association between the SSM document and the EC2 instances.`, ko:`AWS Systems Manager 문서(SSM 문서)를 사용하도록 사용자 데이터 명령을 리팩토링합니다. Systems Manager State Manager를 사용하여 SSM 문서와 EC2 인스턴스 간의 연결을 생성합니다.` },
  ],
  answer: ['B','E'],
  vote: '71% BE',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>
<p><strong>cfn-init</strong>는 CloudFormation 메타데이터 변경을 EC2 인스턴스에 적용하는 헬퍼 스크립트입니다. <strong>cfn-hup</strong>는 스택 메타데이터 변경을 감지하여 cfn-init를 자동으로 재실행합니다. 이를 통해 CloudFormation 스택 업데이트 시 실행 중인 인스턴스에도 변경이 적용됩니다.</p>
<p><span class="mark-ok">✅ E — 핵심 이유</span></p>
<p><strong>SSM State Manager의 연결(Association)</strong>은 SSM 문서와 EC2 인스턴스를 지속적으로 연결하여 구성이 항상 적용되도록 합니다. 새 SSM 문서 버전 배포 시 자동으로 실행 중인 인스턴스에 적용됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — MIME 멀티파트는 초기 부팅 시에만 적용되며 실행 중 인스턴스 업데이트에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — Auto Scaling 그룹 생성은 요구사항과 무관합니다.</p>
<p><span class="mark-no">❌ D</span> — 사용자 데이터의 Run Command는 초기 시작 시에만 실행되어 실행 중 인스턴스를 업데이트하지 않습니다.</p>`,
  disc: [{ ans:'BE (71%), BD (25%)', txt:'cfn-hup+cfn-init(B)로 CloudFormation 메타데이터 변경 감지+적용, State Manager 연결(E)로 SSM 문서 지속 적용.' }]
},
{
  n: 197,
  en: `A company is refactoring applications to use AWS. The company identifies an internal web application that needs to make Amazon S3 API calls in a specific AWS account.<br><br>The company wants to use its existing identity provider (IdP) auth.company.com for authentication. The IdP supports only OpenID Connect (OIDC). A DevOps engineer needs to secure the web application's access to the AWS account.<br><br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `한 회사가 AWS를 사용하도록 애플리케이션을 리팩토링하고 있습니다. 회사는 특정 AWS 계정에서 Amazon S3 API 호출을 해야 하는 내부 웹 애플리케이션을 식별합니다.<br><br>회사는 인증에 기존 ID 공급자(IdP) auth.company.com을 사용하려고 합니다. IdP는 OpenID Connect(OIDC)만 지원합니다. DevOps 엔지니어는 AWS 계정에 대한 웹 애플리케이션의 액세스를 보호해야 합니다.<br><br>이러한 요구 사항을 충족하는 단계의 조합은 무엇입니까? (세 가지를 선택하십시오.)`,
  type: 'multi',
  multiCount: 3,
  choices: [
    { k:'A', en:`Configure AWS IAM Identity Center (AWS Single Sign-On). Configure an IdP. Upload the IdP metadata from the existing IdP.`, ko:`AWS IAM Identity Center(AWS Single Sign-On)를 구성합니다. IdP를 구성합니다. 기존 IdP에서 IdP 메타데이터를 업로드합니다.` },
    { k:'B', en:`Create an IAM IdP by using the provider URL, audience, and signature from the existing IdP.`, ko:`기존 IdP의 공급자 URL, 대상 및 서명을 사용하여 IAM IdP를 생성합니다.` },
    { k:'C', en:`Create an IAM role that has a policy that allows the necessary S3 actions. Configure the role's trust policy to allow the OIDC IdP to assume the role if the sts.amazon.com:aud context key is appid_from_idp.`, ko:`필요한 S3 작업을 허용하는 정책이 있는 IAM 역할을 생성합니다. sts.amazon.com:aud 컨텍스트 키가 appid_from_idp인 경우 OIDC IdP가 역할을 맡을 수 있도록 역할의 신뢰 정책을 구성합니다.` },
    { k:'D', en:`Create an IAM role that has a policy that allows the necessary S3 actions. Configure the role's trust policy to allow the OIDC IdP to assume the role if the auth.company.com:aud context key is appid_from_idp.`, ko:`필요한 S3 작업을 허용하는 정책이 있는 IAM 역할을 생성합니다. auth.company.com:aud 컨텍스트 키가 appid_from_idp인 경우 OIDC IdP가 역할을 맡을 수 있도록 역할의 신뢰 정책을 구성합니다.` },
    { k:'E', en:`Configure the web application to use the AssumeRoleWithWebIdentity API operation to retrieve temporary credentials. Use the temporary credentials to make the S3 API calls.`, ko:`AssumeRoleWithWebIdentity API 작업을 사용하여 임시 자격 증명을 검색하도록 웹 애플리케이션을 구성합니다. 임시 자격 증명을 사용하여 S3 API 호출을 수행합니다.` },
    { k:'F', en:`Configure the web application to use the GetFederationToken API operation to retrieve temporary credentials. Use the temporary credentials to make the S3 API calls.`, ko:`GetFederationToken API 작업을 사용하여 임시 자격 증명을 검색하도록 웹 애플리케이션을 구성합니다. 임시 자격 증명을 사용하여 S3 API 호출을 수행합니다.` },
  ],
  answer: ['B','D','E'],
  vote: '73% BDE',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>
<p>기존 OIDC IdP를 AWS에 등록하려면 <strong>IAM OIDC IdP</strong>를 생성해야 합니다. 공급자 URL과 대상(audience) 정보를 사용합니다.</p>
<p><span class="mark-ok">✅ D — 핵심 이유</span></p>
<p>OIDC 신뢰 정책의 조건 키는 <strong>IdP URL:aud</strong> 형식입니다. auth.company.com이 IdP이므로 <code>auth.company.com:aud</code>를 사용합니다.</p>
<p><span class="mark-ok">✅ E — 핵심 이유</span></p>
<p><strong>AssumeRoleWithWebIdentity</strong>는 웹 기반 IdP(OIDC 포함)로 인증된 사용자를 위한 임시 자격 증명 획득 API입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — IAM Identity Center는 멀티 계정 관리와 SSO를 위한 서비스이며 이 시나리오에는 과도합니다.</p>
<p><span class="mark-no">❌ C</span> — <code>sts.amazonaws.com:aud</code>는 OIDC 조건 키 형식이 아닙니다.</p>
<p><span class="mark-no">❌ F</span> — GetFederationToken은 SAML 페더레이션에 사용되며 OIDC에 직접 사용되지 않습니다.</p>`,
  disc: [{ ans:'BDE (73%)', txt:'OIDC 패턴: IAM OIDC IdP 생성(B) + auth.company.com:aud 신뢰 정책(D) + AssumeRoleWithWebIdentity(E).' }]
},
{
  n: 198,
  en: `A company uses Amazon RDS for all databases in its AWS accounts. The company uses AWS Control Tower to build a landing zone that has an audit and logging account. All databases must be encrypted at rest for compliance reasons. The company's security engineer needs to receive notification about any noncompliant databases that are in the company's accounts.<br><br>Which solution will meet these requirements with the MOST operational efficiency?`,
  ko: `한 회사가 AWS 계정의 모든 데이터베이스에 Amazon RDS를 사용합니다. 회사는 AWS Control Tower를 사용하여 감사 및 로깅 계정이 있는 랜딩 존을 구축합니다. 모든 데이터베이스는 규정 준수를 위해 휴면 상태에서 암호화되어야 합니다. 회사의 보안 엔지니어는 회사 계정에 있는 모든 비준수 데이터베이스에 대한 알림을 받아야 합니다.<br><br>가장 높은 운영 효율성으로 이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use AWS Control Tower to activate the optional detective control (guardrail) to determine whether the RDS storage is encrypted. Create an Amazon Simple Notification Service (Amazon SNS) topic in the company's audit account. Create an Amazon EventBridge rule to filter noncompliant events from the AWS Control Tower control (guardrail) to notify the SNS topic. Subscribe the security engineer's email address to the SNS topic.`, ko:`AWS Control Tower를 사용하여 RDS 스토리지가 암호화되었는지 확인하기 위해 선택적 탐지 제어(가드레일)를 활성화합니다. 회사의 감사 계정에서 Amazon SNS 토픽을 생성합니다. AWS Control Tower 제어(가드레일)에서 비준수 이벤트를 필터링하여 SNS 토픽에 알리는 Amazon EventBridge 규칙을 생성합니다. 보안 엔지니어의 이메일 주소를 SNS 토픽에 구독합니다.` },
    { k:'B', en:`Use AWS CloudFormation StackSets to deploy AWS Lambda functions to every account. Write the Lambda function code to determine whether the RDS storage is encrypted in the account the function is deployed to. Send the findings as an Amazon CloudWatch metric to the management account. Create an Amazon Simple Notification Service (Amazon SNS) topic. Create a CloudWatch alarm that notifies the SNS topic when metric thresholds are met. Subscribe the security engineer's email address to the SNS topic.`, ko:`AWS CloudFormation StackSets를 사용하여 모든 계정에 AWS Lambda 함수를 배포합니다. Lambda 함수 코드를 작성하여 함수가 배포된 계정에서 RDS 스토리지가 암호화되었는지 확인합니다. 결과를 Amazon CloudWatch 메트릭으로 관리 계정에 보냅니다. Amazon SNS 토픽을 생성합니다. 메트릭 임계값에 도달하면 SNS 토픽에 알리는 CloudWatch 알람을 생성합니다. 보안 엔지니어의 이메일 주소를 SNS 토픽에 구독합니다.` },
    { k:'C', en:`Create a custom AWS Config rule in every account to determine whether the RDS storage is encrypted. Create an Amazon Simple Notification Service (Amazon SNS) topic in the audit account. Create an Amazon EventBridge rule to filter noncompliant events from the AWS Control Tower control (guardrail) to notify the SNS topic. Subscribe the security engineer's email address to the SNS topic.`, ko:`모든 계정에서 사용자 지정 AWS Config 규칙을 생성하여 RDS 스토리지가 암호화되었는지 확인합니다. 감사 계정에서 Amazon SNS 토픽을 생성합니다. AWS Control Tower 제어(가드레일)에서 비준수 이벤트를 필터링하여 SNS 토픽에 알리는 Amazon EventBridge 규칙을 생성합니다. 보안 엔지니어의 이메일 주소를 SNS 토픽에 구독합니다.` },
    { k:'D', en:`Launch an Amazon EC2 instance. Run an hourly cron job by using the AWS CLI to determine whether the RDS storage is encrypted in each AWS account. Store the results in an RDS database. Notify the security engineer by sending email messages from the EC2 instance when noncompliance is detected.`, ko:`Amazon EC2 인스턴스를 시작합니다. AWS CLI를 사용하여 매시간 cron 작업을 실행하여 각 AWS 계정에서 RDS 스토리지가 암호화되었는지 확인합니다. 결과를 RDS 데이터베이스에 저장합니다. 비준수가 감지되면 EC2 인스턴스에서 이메일 메시지를 보내 보안 엔지니어에게 알립니다.` },
  ],
  answer: ['A'],
  vote: '71% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>AWS Control Tower에는 <strong>RDS 스토리지 암호화 여부를 확인하는 내장 가드레일</strong>이 있습니다. 이를 활성화하면 모든 계정에 자동으로 적용됩니다. EventBridge + SNS로 비준수 알림을 설정하면 최소 운영 오버헤드로 요구사항을 충족합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 각 계정에 Lambda 함수를 배포하는 것은 높은 운영 오버헤드를 요구합니다.</p>
<p><span class="mark-no">❌ C</span> — 모든 계정에서 개별 Config 규칙을 생성하는 것은 Control Tower 내장 가드레일보다 오버헤드가 높습니다.</p>
<p><span class="mark-no">❌ D</span> — EC2 + cron 방식은 가장 낮은 운영 효율입니다.</p>`,
  disc: [{ ans:'A (71%), C (29%)', txt:'Control Tower 내장 RDS 암호화 가드레일(A) 활성화가 가장 효율적. C도 유효하나 모든 계정에 개별 Config 규칙 생성이 필요.' }]
},
{
  n: 199,
  en: `A company is migrating from its on-premises data center to AWS. The company currently uses a custom on-premises CI/CD pipeline solution to build and package software.<br><br>The company wants its software packages and dependent public repositories to be available in AWS CodeArtifact to facilitate the creation of application-specific pipelines.<br><br>Which combination of steps should the company take to update the CI/CD pipeline solution and to configure CodeArtifact with the LEAST operational overhead? (Choose two.)`,
  ko: `한 회사가 온프레미스 데이터 센터에서 AWS로 마이그레이션하고 있습니다. 회사는 현재 소프트웨어를 빌드하고 패키징하기 위해 맞춤형 온프레미스 CI/CD 파이프라인 솔루션을 사용하고 있습니다.<br><br>회사는 소프트웨어 패키지와 종속 퍼블릭 리포지토리를 AWS CodeArtifact에서 사용할 수 있도록 하여 애플리케이션별 파이프라인을 쉽게 만들고자 합니다.<br><br>최소한의 운영 오버헤드로 CI/CD 파이프라인 솔루션을 업데이트하고 CodeArtifact를 구성하기 위해 회사가 취해야 할 단계의 조합은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi',
  multiCount: 2,
  choices: [

  disc: [{ ans:'BD (95%)', txt:'온프레미스 → CodeArtifact: IAM Roles Anywhere(B). 퍼블릭 리포지토리: 외부 연결 + 업스트림(D).' }]

{

// ────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────
let curQ = 0;
let state = QS.map(() => ({ sel: [], done: false }));
let curLang = 'ko';

// ────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────
function init() {
  buildSelect();
  renderQ(0);
  // 현재 SET 번호를 콤보박스에 반영
  syncSetSelect();
}

function syncSetSelect() {
  const fileName = window.location.pathname.split('/').pop();
  const match = fileName.match(/set(\d{2})/i);
  if (match) {
    document.getElementById('set-select').value = match[1];
  }
}

function buildSelect() {
  const sel = document.getElementById('q-select');
  sel.innerHTML = '';
  QS.forEach((q, i) => {
    const opt = document.createElement('option');
    opt.value = q.n;
    opt.textContent = `Q${String(q.n).padStart(3,'0')}`;
    sel.appendChild(opt);
  });
}

function updateSelectStatus() {
  const sel = document.getElementById('q-select');
  Array.from(sel.options).forEach((opt, i) => {
    const s = state[i];
    const q = QS[i];
    opt.className = '';
    if (s.done) {
      const correct = arraysEqual(s.sel.slice().sort(), q.answer.slice().sort());
      opt.textContent = `Q${String(q.n).padStart(3,'0')} ${correct ? '✓' : '✗'}`;
      opt.className = correct ? 'opt-correct' : 'opt-wrong';
    } else {
      opt.textContent = `Q${String(q.n).padStart(3,'0')}`;
    }
  });
  sel.selectedIndex = curQ;
}

// ────────────────────────────────────────────────
// RENDER
// ────────────────────────────────────────────────
function renderQ(idx) {
  if (idx < 0 || idx >= QS.length) return;
  curQ = idx;
  const q = QS[idx];
  const s = state[idx];

  // counter / progress
  document.getElementById('progress-fill').style.width = `${((idx+1)/QS.length)*100}%`;
  document.getElementById('q-num-badge').textContent = String(q.n).padStart(3,'0');

  // type badge
  const tb = document.getElementById('q-type-badge');
  if (q.type === 'multi') {
    tb.textContent = `복수 선택 (${q.multiCount}개)`;
    tb.className = 'q-type-badge multi';
  } else {
    tb.textContent = '단일 선택';
    tb.className = 'q-type-badge';
  }

  // question text
  document.getElementById('q-ko-text').innerHTML = q.ko;
  document.getElementById('q-en-text').innerHTML = q.en;

  // choices label
  document.getElementById('choices-label').textContent =
    q.type === 'multi' ? `선택지 — ${q.multiCount}개 선택` : '선택지 — 단일 선택';

  // choices
  const cc = document.getElementById('choices-container');
  cc.innerHTML = '';
  q.choices.forEach(ch => {
    const div = document.createElement('div');
    let cls = 'choice';
    if (s.done) {
      cls += ' disabled';
      if (q.answer.includes(ch.k)) cls += ' correct';
      else if (s.sel.includes(ch.k)) cls += ' wrong';
    } else if (s.sel.includes(ch.k)) {
      cls += ' selected';
    }
    div.className = cls;
    div.id = `choice-${idx}-${ch.k}`;

    let icon = '';
    if (s.done) {
      if (q.answer.includes(ch.k)) icon = '✓';
      else if (s.sel.includes(ch.k)) icon = '✗';
    }

    div.innerHTML = `
      <div class="choice-key">${ch.k}</div>
      <div class="choice-body">
        <div class="choice-text">${ch.ko}</div>
        <div class="choice-en">${ch.en}</div>
      </div>
      <div class="result-icon">${icon}</div>`;

    if (!s.done) div.onclick = () => doSelect(idx, ch.k);
    cc.appendChild(div);
    document.getElementById('btn-prev-top').disabled = idx === 0;
    document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
  });

  applyLang(curLang);

  // review button
  document.getElementById('btn-review').disabled = s.done || s.sel.length === 0;

  // hint
  const hint = document.getElementById('hint-text');
  if (s.done) {
    const correct = arraysEqual(s.sel.slice().sort(), q.answer.slice().sort());
    hint.textContent = correct ? '🎉 정답입니다!' : `❌ 오답입니다. 정답은 ${q.answer.join(', ')} 입니다.`;
  } else if (s.sel.length > 0) {
    const remaining = q.type === 'multi' ? q.multiCount - s.sel.length : 0;
    if (q.type === 'multi' && remaining > 0) {
      hint.textContent = `${s.sel.join(', ')}번 선택됨. ${remaining}개 더 선택하세요.`;
    } else {
      hint.textContent = `${s.sel.join(', ')}번을 선택했습니다. 정답 확인 버튼을 눌러주세요.`;
    }
  } else {
    hint.textContent = '선택지를 클릭하면 정답 확인 버튼이 활성화됩니다.';
  }

  // review panel
  const rp = document.getElementById('review-panel');
  if (s.done) { renderReview(q); rp.classList.add('show'); }
  else rp.classList.remove('show');

  // nav buttons
  document.getElementById('btn-prev-top').disabled = idx === 0;
  document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
  // document.getElementById('nav-info').textContent = `${idx+1} / ${QS.length} 문제`;

  // select 동기화
  updateSelectStatus();
}

function renderReview(q) {
  document.getElementById('review-answer-badge').textContent = '✓ ' + q.answer.join(', ');
  document.getElementById('review-vote-badge').innerHTML = `커뮤니티 투표 <span>${q.vote}</span>`;
  document.getElementById('review-explain').innerHTML = q.explain;

  const ws = document.getElementById('review-wrong');
  const wt = document.getElementById('wrong-section-title');
  if (q.wrong) { ws.innerHTML = q.wrong; ws.style.display=''; wt.style.display=''; }
  else { ws.style.display='none'; wt.style.display='none'; }

  const dl = document.getElementById('disc-list');
  dl.innerHTML = '';
  dl.classList.remove('show');
  (q.disc||[]).forEach(d => {
    dl.innerHTML += `<div class="disc-item"><div class="disc-ans">${d.ans}</div>${d.txt}</div>`;
  });
}

// ────────────────────────────────────────────────
// INTERACTION
// ────────────────────────────────────────────────
function doSelect(idx, key) {
  const q = QS[idx];
  const s = state[idx];
  if (s.done) return;
  if (q.type === 'single') {
    s.sel = [key];
  } else {
    const pos = s.sel.indexOf(key);
    if (pos >= 0) s.sel.splice(pos, 1);
    else if (s.sel.length < q.multiCount) s.sel.push(key);
  }
  renderQ(idx);
}

function doReview() {
  const s = state[curQ];
  if (s.sel.length === 0 || s.done) return;
  s.done = true;
  renderQ(curQ);
  document.getElementById('review-panel').scrollIntoView({behavior:'smooth',block:'start'});
}

function doReset() {
  state[curQ] = { sel: [], done: false };
  renderQ(curQ);
}

function goQ(idx) {
  idx = parseInt(idx);
  if (isNaN(idx) || idx < 0 || idx >= QS.length) return;
  renderQ(idx);
  window.scrollTo({top:0, behavior:'smooth'});
}

function goQWithReset(idx) {
  idx = parseInt(idx);
  if (isNaN(idx) || idx < 0 || idx >= QS.length) return;

  // 🔥 언어 강제 한국어
  curLang = 'ko';
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.lang-tab')[0].classList.add('active');

  // 🔥 해당 문제 상태 초기화
  state[idx] = { sel: [], done: false };

  renderQ(idx);
  window.scrollTo({top:0, behavior:'smooth'});
  document.getElementById('btn-prev-top').disabled = idx === 0;
  document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
}

// ────────────────────────────────────────────────
// LANG  (한국어 / 양국어)
// ────────────────────────────────────────────────
function setLang(lang, btn) {
  curLang = lang;
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  applyLang(lang);
}

function applyLang(lang) {
  // 문제 영어 텍스트 — 'both'일 때 block으로 명시해야 CSS display:none을 덮어씀
  const enQ = document.getElementById('q-en-text');
  enQ.style.display = (lang === 'both') ? 'block' : 'none';
  // 선택지 영어 텍스트
  document.querySelectorAll('.choice-en').forEach(e => {
    e.style.display = (lang === 'both') ? 'block' : 'none';
  });
}

// ────────────────────────────────────────────────
// THEME
// ────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('theme-icon').textContent = dark ? '☀️' : '🌙';
  document.getElementById('theme-label').textContent = dark ? '라이트' : '다크';
}

// ────────────────────────────────────────────────
// UTILS
// ────────────────────────────────────────────────
function arraysEqual(a, b) {
  return a.length === b.length && a.every((v,i) => v === b[i]);
}

init();
</script>
</body>
</html>
