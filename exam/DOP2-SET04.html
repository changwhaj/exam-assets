<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS DOP-C02 | SET 04 (Q151~Q200)</title>
<style>
[data-theme="dark"] {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#222636; --border:#2e3347;
  --accent:#4f8ef7; --accent2:#38c9a0; --text:#e2e6f0; --text-muted:#7a83a0;
  --correct-bg:#112a22; --wrong-bg:#2a1111; --explain-bg:#1e2030;
  --hover-bg:#1e2236; --sel-bg:#1b2540;
}
[data-theme="light"] {
  --bg:#f0f2f8; --surface:#ffffff; --surface2:#f5f6fa; --border:#d0d5e8;
  --accent:#2e6fe0; --accent2:#1aaa7e; --text:#1a1d2e; --text-muted:#5a6280;
  --correct-bg:#e6faf4; --wrong-bg:#fde8e8; --explain-bg:#f0f2fa;
  --hover-bg:#eaf1ff; --sel-bg:#ddeaff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard','Noto Sans KR','Segoe UI',sans-serif;font-size:15px;line-height:1.75;min-height:100vh;transition:background .25s,color .25s;}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 60px;}

/* Topbar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}

/* ── SET 선택 콤보박스 ── */
.set-select-wrap{position:relative;display:inline-flex;align-items:center;}
.set-select{
  appearance:none;-webkit-appearance:none;
  background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  border:none;border-radius:20px;
  color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;
  padding:4px 28px 4px 12px;
  cursor:pointer;outline:none;
  transition:filter .2s,transform .1s;
  white-space:nowrap;
}
.set-select:hover{filter:brightness(1.12);transform:translateY(-1px);}
.set-select:focus{filter:brightness(1.08);outline:2px solid rgba(255,255,255,.5);outline-offset:2px;}
.set-select option{background:#1a1d27;color:#e2e6f0;font-size:13px;font-weight:600;}
/* 화살표 아이콘 */
.set-select-wrap::after{
  content:'▾';
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:#fff;font-size:10px;pointer-events:none;
}

.badge{background:linear-gradient(135deg,#4f8ef7,#38c9a0);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 12px;border-radius:20px;white-space:nowrap;}
.topbar-title{font-size:13px;color:var(--text-muted);flex:1;min-width:120px;}
.topbar-title strong{color:var(--text);font-size:15px;display:block;}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}

/* 문제 선택 콤보박스 */
.q-select-wrap{display:flex;align-items:center;gap:6px;}
.q-select-label{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.q-select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-weight:600;padding:5px 10px;cursor:pointer;outline:none;transition:border-color .2s;}
.q-select:focus,.q-select:hover{border-color:var(--accent);}
.q-select option.opt-correct{color:#1aaa7e;}
.q-select option.opt-wrong{color:#e05252;}

/* 상단 네비 버튼 + 문제 콤보 높이 통일 */
.topbar-right .btn-nav,
.topbar-right .q-select {
  height: 24px;
  padding: 0 14px;
  font-size: 13px;
}

/* 테마 버튼 */
.theme-btn{background:var(--surface2);border:1px solid var(--border);border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-muted);transition:border-color .2s,color .2s;white-space:nowrap;}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}

/* Progress */
.progress-bar{background:var(--surface2);border-radius:4px;height:6px;margin-bottom:20px;overflow:hidden;}
.progress-fill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:4px;transition:width .4s;}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:16px;transition:background .25s,border-color .25s;}

/* Lang Tabs */
.lang-tabs{display:flex;gap:8px;margin-bottom:20px;}
.lang-tab{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.04em;padding:5px 14px;transition:all .2s;}
.lang-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.lang-tab:hover:not(.active){border-color:var(--accent);color:var(--accent);}

/* Q Label */
.q-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-bottom:10px;}
.q-type-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:10px;margin-left:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);vertical-align:middle;}
.q-type-badge.multi{background:#ede9ff;color:#6d28d9;border-color:#c4b5fd;}
[data-theme="dark"] .q-type-badge.multi{background:#2a1f50;color:#a78bfa;border-color:#4c3a8c;}

/* Q Text */
.q-text{font-size:15px;color:var(--text);line-height:1.85;}
.q-text.en-text{
  font-size:14px;color:var(--text-muted);
  margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--border);
}
.q-text code{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:13px;font-family:'JetBrains Mono','Fira Code',monospace;color:var(--accent2);}

/* Choices */
.choices-section{margin-top:24px;}
.choices-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px;}
.choice{display:flex;align-items:flex-start;gap:14px;background:var(--surface2);border:2px solid var(--border);border-radius:10px;cursor:pointer;margin-bottom:10px;padding:14px 18px;transition:border-color .2s,background .2s;user-select:none;}
.choice:hover{border-color:var(--accent);background:var(--hover-bg);}
.choice.selected{border-color:var(--accent);background:var(--sel-bg);}
.choice.correct{border-color:#38c9a0!important;background:var(--correct-bg)!important;}
.choice.wrong{border-color:#f76f6f!important;background:var(--wrong-bg)!important;}
.choice.disabled{cursor:default;pointer-events:none;}
.choice-key{background:var(--border);border-radius:6px;color:var(--text);font-size:13px;font-weight:700;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:background .2s,color .2s;}
.choice.selected .choice-key{background:var(--accent);color:#fff;}
.choice.correct .choice-key{background:#38c9a0;color:#000;}
.choice.wrong .choice-key{background:#f76f6f;color:#fff;}
.choice-body{flex:1;}
.choice-text{font-size:14px;line-height:1.75;}
.choice-en{font-size:12px;color:var(--text-muted);margin-top:5px;display:none;font-style:italic;}
.result-icon{margin-left:auto;font-size:18px;flex-shrink:0;display:none;}
.choice.correct .result-icon,.choice.wrong .result-icon{display:block;}

/* Actions */
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center;}
.btn{border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.03em;padding:11px 24px;transition:opacity .2s,transform .1s;}
.btn:hover:not(:disabled){opacity:.88;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-nav{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:11px 18px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.hint-text{font-size:12px;color:var(--text-muted);margin-top:8px;min-height:18px;}

/* Review Panel */
.review-panel{display:none;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent2);border-radius:12px;padding:24px 28px;margin-bottom:16px;animation:fadeIn .35s ease;transition:background .25s;}
.review-panel.show{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.answer-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.answer-label{font-size:13px;color:var(--text-muted);}
.answer-badge{background:#38c9a0;color:#000;font-size:13px;font-weight:800;padding:4px 14px;border-radius:20px;}
.vote-badge{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);font-size:12px;padding:3px 10px;border-radius:20px;}
.vote-badge span{color:var(--accent);font-weight:700;}
.section-title{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent2);text-transform:uppercase;margin-bottom:10px;}
.explain-box{background:var(--explain-bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;font-size:14px;line-height:1.8;color:var(--text);}
.explain-box p{margin-bottom:8px;}
.explain-box p:last-child{margin-bottom:0;}
.mark-ok{color:#38c9a0;font-weight:700;}
.mark-no{color:#f76f6f;font-weight:600;}

/* Discussion */
.disc-toggle{background:transparent;border:1px dashed var(--border);border-radius:8px;color:var(--text-muted);cursor:pointer;font-size:13px;margin-top:8px;padding:9px 16px;width:100%;text-align:left;transition:border-color .2s,color .2s;}
.disc-toggle:hover{border-color:var(--accent);color:var(--accent);}
.disc-list{display:none;margin-top:10px;}
.disc-list.show{display:block;}
.disc-item{background:var(--surface2);border-left:3px solid var(--border);border-radius:0 6px 6px 0;font-size:13px;margin-bottom:8px;padding:10px 14px;color:var(--text-muted);line-height:1.7;}
.disc-ans{color:var(--accent);font-weight:700;font-size:12px;margin-bottom:3px;}

/* Bottom Nav */
.nav-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px;}
.nav-info{font-size:13px;color:var(--text-muted);text-align:center;flex:1;}

@media(max-width:600px){
  .card{padding:16px;}
  .btn{padding:10px 16px;font-size:13px;}
  .topbar{gap:8px;}
  .topbar-right{gap:6px;}
}

/* ── 패스워드 모달 ── */
.pw-overlay{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  /* 배경 블러 */
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  background:rgba(10,12,22,.55);
  transition:opacity .3s;
}
.pw-overlay.hidden{
  opacity:0;pointer-events:none;
}
.pw-modal{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 24px 64px rgba(0,0,0,.35);
  padding:40px 36px 34px;
  width:min(400px,90vw);
  display:flex;flex-direction:column;align-items:center;gap:0;
  animation:pwSlideIn .35s cubic-bezier(.22,.9,.36,1) both;
}
@keyframes pwSlideIn{
  from{opacity:0;transform:translateY(28px) scale(.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.pw-logo{
  width:54px;height:54px;border-radius:14px;
  background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;margin-bottom:20px;
  box-shadow:0 8px 24px rgba(79,142,247,.35);
}
.pw-title{
  font-size:18px;font-weight:800;color:var(--text);
  letter-spacing:-.01em;margin-bottom:6px;text-align:center;
}
.pw-sub{
  font-size:13px;color:var(--text-muted);margin-bottom:28px;text-align:center;line-height:1.6;
}
.pw-input-wrap{
  position:relative;width:100%;margin-bottom:14px;
}
.pw-input{
  width:100%;
  background:var(--surface2);
  border:2px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-size:16px;font-weight:700;
  letter-spacing:.15em;
  padding:13px 46px 13px 18px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
  text-align:center;
}
.pw-input::placeholder{letter-spacing:normal;font-weight:400;font-size:14px;}
.pw-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,142,247,.18);}
.pw-input.shake{animation:pwShake .38s ease;}
.pw-input.error{border-color:#f76f6f;box-shadow:0 0 0 3px rgba(247,111,111,.18);}
@keyframes pwShake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-6px);}
  80%{transform:translateX(6px);}
}
.pw-toggle{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:var(--text-muted);font-size:18px;padding:2px 4px;
  transition:color .2s;
}
.pw-toggle:hover{color:var(--accent);}
.pw-error-msg{
  font-size:12px;color:#f76f6f;font-weight:600;
  min-height:18px;margin-bottom:18px;text-align:center;
  transition:opacity .2s;
}
.pw-btn{
  width:100%;background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  border:none;border-radius:10px;color:#fff;
  font-size:15px;font-weight:800;letter-spacing:.04em;
  padding:14px;cursor:pointer;
  transition:filter .2s,transform .1s,box-shadow .2s;
  box-shadow:0 6px 20px rgba(79,142,247,.3);
}
.pw-btn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 8px 28px rgba(79,142,247,.4);}
.pw-btn:active{transform:translateY(0);}
.pw-footer{
  font-size:11px;color:var(--text-muted);margin-top:20px;text-align:center;
}
</style>
</head>
<body>

<!-- ── 패스워드 모달 ── -->
<div class="pw-overlay" id="pw-overlay">
  <div class="pw-modal" role="dialog" aria-modal="true" aria-labelledby="pw-title">
    <div class="pw-logo">🔐</div>
    <div class="pw-title" id="pw-title">학습 콘텐츠 잠금</div>
    <div class="pw-sub">AWS DOP-C02 학습 자료에 접근하려면<br>패스워드를 입력해 주세요.</div>

    <div class="pw-input-wrap">
      <input
        class="pw-input" id="pw-input"
        type="password" placeholder="패스워드 입력"
        maxlength="20"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter') checkPw()"
      />
      <button class="pw-toggle" id="pw-toggle" onclick="togglePwVisible()" tabindex="-1" title="표시/숨김">👁</button>
    </div>

    <div class="pw-error-msg" id="pw-error"></div>

    <button class="pw-btn" onclick="checkPw()">확인</button>

    <div class="pw-footer">🍪 인증 후 쿠키에 저장되어 다음 방문 시 자동 로그인됩니다.</div>
  </div>
</div>

<div class="wrap">

  <!-- Topbar -->
  <div class="topbar">

    <!-- ── SET 선택 콤보박스 (badge 대체) ── -->
    <div class="set-select-wrap">
      <select class="set-select" id="set-select" onchange="goSet(this.value)">
        <option value="01" selected>DOP-C02 · SET 01</option>
        <option value="02">DOP-C02 · SET 02</option>
        <option value="03">DOP-C02 · SET 03</option>
        <option value="04">DOP-C02 · SET 04</option>
        <option value="05">DOP-C02 · SET 05</option>
        <option value="06">DOP-C02 · SET 06</option>
        <option value="07">DOP-C02 · SET 07</option>
        <option value="08">DOP-C02 · SET 08</option>
        <option value="09">DOP-C02 · SET 09</option>
      </select>
    </div>

    <div class="topbar-title">
      <strong>AWS Certified DevOps Engineer – Professional</strong>
      SET 04 · Q151~Q200 실전 학습
    </div>
    <div class="topbar-right">
      <!-- 상단 네비게이션 -->
      <button class="btn btn-nav" onclick="goQWithReset(curQ-1)" id="btn-prev-top">←</button>

      <!-- 문제 선택 콤보박스 -->
      <div class="q-select-wrap">
        <select class="q-select" id="q-select" onchange="goQWithReset(this.selectedIndex)"></select>
      </div>
      <button class="btn btn-nav" onclick="goQWithReset(curQ+1)" id="btn-next-top">→</button>

      <!-- 테마 토글 -->
      <button class="theme-btn" onclick="toggleTheme()">
        <span id="theme-icon">☀️</span>
        <span id="theme-label">라이트</span>
      </button>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:5%"></div></div>

  <!-- Language Tabs -->
  <div class="lang-tabs">
    <button class="lang-tab active" onclick="setLang('ko',this)">한국어</button>
    <button class="lang-tab" onclick="setLang('both',this)">양국어</button>
  </div>

  <!-- Question Card -->
  <div class="card" id="q-card">
    <div class="q-label">
      문제 <span id="q-num-badge">001</span>
      <span id="q-type-badge" class="q-type-badge">단일 선택</span>
    </div>
    <!-- 한국어 문제 -->
    <div class="q-text" id="q-ko-text"></div>
    <!-- 영어 문제 (양국어 모드) -->
    <div class="q-text en-text" id="q-en-text"></div>

    <div class="choices-section">
      <div class="choices-label" id="choices-label">선택지</div>
      <div id="choices-container"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btn-review" onclick="doReview()" disabled>📋 정답 확인</button>
      <button class="btn btn-secondary" onclick="doReset()">↺ 초기화</button>
    </div>
    <div class="hint-text" id="hint-text">선택지를 클릭하면 정답 확인 버튼이 활성화됩니다.</div>
  </div>

  <!-- Review Panel -->
  <div class="review-panel" id="review-panel">
    <div class="answer-row">
      <span class="answer-label">정답</span>
      <span class="answer-badge" id="review-answer-badge"></span>
      <span class="vote-badge" id="review-vote-badge"></span>
    </div>
    <div class="section-title">✦ 정답 해설</div>
    <div class="explain-box" id="review-explain"></div>
    <div class="section-title" style="margin-top:14px;" id="wrong-section-title">✦ 오답 분석</div>
    <div class="explain-box" id="review-wrong"></div>
    <button class="disc-toggle" onclick="document.getElementById('disc-list').classList.toggle('show')">💬 주요 토론 의견 보기 / 숨기기</button>
    <div class="disc-list" id="disc-list"></div>
  </div>

  <!-- Bottom Nav -->
  <!-- <div class="nav-bottom">
    <button class="btn btn-nav" onclick="goQ(curQ-1)" id="btn-prev">← 이전</button>
    <span class="nav-info" id="nav-info"></span>
    <button class="btn btn-nav" onclick="goQ(curQ+1)" id="btn-next">다음 →</button>
  </div> -->

</div>
<script>
// ────────────────────────────────────────────────
// 패스워드 / 쿠키 인증
// ────────────────────────────────────────────────
const PW_CORRECT  = 'DOP2';
const COOKIE_NAME = 'dop2_auth';
const COOKIE_DAYS = 30; // 쿠키 유효기간 (일)

function getCookie(name) {
  const cookies = document.cookie.split(';');
  for (let c of cookies) {
    const [k, v] = c.trim().split('=');
    if (k === name) return decodeURIComponent(v || '');
  }
  return null;
}

function setCookie(name, value, days) {
  const expires = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${expires};path=/;SameSite=Lax`;
}

function unlockPage() {
  const overlay = document.getElementById('pw-overlay');
  overlay.classList.add('hidden');
  // 완전히 숨긴 뒤 DOM에서 제거
  overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
}

function checkPw() {
  const input = document.getElementById('pw-input');
  const errEl = document.getElementById('pw-error');
  const val   = input.value.trim();

  if (val === PW_CORRECT) {
    setCookie(COOKIE_NAME, PW_CORRECT, COOKIE_DAYS);
    errEl.textContent = '';
    input.classList.remove('error');
    unlockPage();
  } else {
    errEl.textContent = '❌ 패스워드가 올바르지 않습니다. 다시 입력해 주세요.';
    input.classList.add('error', 'shake');
    input.select();
    input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
  }
}

function togglePwVisible() {
  const input  = document.getElementById('pw-input');
  const toggle = document.getElementById('pw-toggle');

// 실제 환경에 맞게 URL 패턴을 수정하세요.
// ────────────────────────────────────────────────
function goSet(setNum) {
  // 현재 페이지 파일명에서 set 번호만 교체
  const currentPath = window.location.pathname;
  const fileName = currentPath.split('/').pop(); // e.g. "DOP2-SET01.html"

  let newFileName;
  if (fileName && fileName.match(/DOP2-SET\d{2}/i)) {
    // 파일명에서 set 번호 교체
    newFileName = fileName.replace(/SET\d{2}/i, `SET${setNum}`);
  } else {
    // 파일명 패턴을 찾지 못한 경우 기본 패턴 사용
    newFileName = `DOP2-SET${setNum}.html`;
  }

  const newPath = currentPath.replace(fileName, newFileName);
  window.location.href = newPath;
}

<p><span class="mark-no">❌ D</span> — Parameter Store는 AMI ID를 저장할 수 있지만, 계정 간 AMI 공유는 RAM이 담당해야 합니다.</p>`,
  disc: [{ ans:'B (86%)', txt:'EC2 Image Builder + RAM 조합이 골든 이미지 생성 및 배포 자동화의 표준 패턴.' }]
},
{
  n: 155,
  en: `A company has a mission-critical application on AWS that uses automatic scaling. The company wants the deployment lifecycle to meet the following parameters:<br><br>• The application must be deployed one instance at a time to ensure the remaining fleet continues to serve traffic.<br>• The application is CPU intensive and must be closely monitored.<br>• The deployment must automatically roll back if the CPU utilization of the deployment instance exceeds 85%.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 AWS에서 자동 스케일링을 사용하는 미션 크리티컬 애플리케이션을 보유하고 있습니다. 회사는 배포 라이프사이클이 다음 조건을 충족하기를 원합니다:<br><br>• 나머지 플릿이 트래픽을 계속 처리할 수 있도록 한 번에 하나의 인스턴스씩 애플리케이션을 배포해야 합니다.<br>• 애플리케이션은 CPU 집약적이며 면밀히 모니터링해야 합니다.<br>• 배포 인스턴스의 CPU 사용률이 85%를 초과하면 배포가 자동으로 롤백되어야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use AWS CloudFormation to create an AWS Step Functions state machine and Auto Scaling lifecycle hooks to move to one instance at a time into a wait state. Use AWS Systems Manager automation to deploy the update to each instance and move it back into the Auto Scaling group using the heartbeat timeout.`, ko:`AWS CloudFormation을 사용하여 AWS Step Functions 상태 머신과 Auto Scaling 라이프사이클 후크를 생성하여 한 번에 한 인스턴스씩 대기 상태로 이동합니다. AWS Systems Manager 자동화를 사용하여 각 인스턴스에 업데이트를 배포하고 하트비트 타임아웃을 사용하여 Auto Scaling 그룹으로 다시 이동합니다.` },
    { k:'B', en:`Use AWS CodeDeploy with Amazon EC2 Auto Scaling. Configure an alarm tied to the CPU utilization metric. Use the CodeDeployDefault.OneAtATime configuration as a deployment strategy. Configure automatic rollbacks within the deployment group to roll back the deployment if the alarm thresholds are breached.`, ko:`Amazon EC2 Auto Scaling과 함께 AWS CodeDeploy를 사용합니다. CPU 사용률 메트릭에 연결된 알람을 구성합니다. 배포 전략으로 CodeDeployDefault.OneAtATime 구성을 사용합니다. 알람 임계값이 초과되면 배포를 롤백하도록 배포 그룹 내에서 자동 롤백을 구성합니다.` },
    { k:'C', en:`Use AWS Elastic Beanstalk for load balancing and AWS Auto Scaling. Configure an alarm tied to the CPU utilization metric. Configure rolling deployments with a fixed batch size of one instance. Enable enhanced health to monitor the status of the deployment and roll back based on the alarm previously created.`, ko:`로드 밸런싱 및 AWS 자동 확장을 위해 AWS Elastic Beanstalk를 사용합니다. CPU 사용률 메트릭에 연결된 알람을 구성합니다. 고정 배치 크기가 인스턴스 하나인 롤링 배포를 구성합니다. 향상된 상태 모니터링을 활성화하여 배포 상태를 모니터링하고 이전에 생성된 알람을 기반으로 롤백합니다.` },
    { k:'D', en:`Use AWS Systems Manager to perform a blue/green deployment with Amazon EC2 Auto Scaling. Configure an alarm tied to the CPU utilization metric. Deploy updates one at a time. Configure automatic rollbacks within the Auto Scaling group to roll back the deployment if the alarm thresholds are breached.`, ko:`AWS Systems Manager를 사용하여 Amazon EC2 Auto Scaling으로 블루/그린 배포를 수행합니다. CPU 사용률 메트릭에 연결된 알람을 구성합니다. 한 번에 하나씩 업데이트를 배포합니다. 알람 임계값이 초과되면 배포를 롤백하도록 Auto Scaling 그룹 내에서 자동 롤백을 구성합니다.` },
  ],
  answer: ['B'],
  vote: '93% B',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>
<p>CodeDeploy의 <strong>CodeDeployDefault.OneAtATime</strong> 전략은 한 번에 한 인스턴스씩 배포를 지원합니다. CloudWatch 알람을 배포 그룹에 연결하면 CPU 사용률 85% 초과 시 자동 롤백이 트리거됩니다. Amazon EC2 Auto Scaling과 통합되어 확장성도 보장합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Step Functions은 배포 기능을 제공하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — Elastic Beanstalk은 CPU 사용률 기반 자동 롤백을 지원하지 않습니다. 롤백은 수동으로 재배포해야 합니다.</p>
<p><span class="mark-no">❌ D</span> — AWS SSM은 배포 기능을 제공하지 않으며, Auto Scaling 그룹에서 알람 기반 자동 롤백을 구성할 수 없습니다.</p>`,
  disc: [{ ans:'B (93%)', txt:'CodeDeploy OneAtATime + CloudWatch 알람 + 자동 롤백이 세 가지 요구사항을 모두 충족하는 유일한 솔루션.' }]
},
{
  n: 156,
  en: `A company has a single developer writing code for an automated deployment pipeline. The developer is storing source code in an Amazon S3 bucket for each project. The company wants to add more developers to the team but is concerned about code conflicts and lost work. The company also wants to build a test environment to deploy newer versions of code for testing and allow developers to automatically deploy to both environments when code is changed in the repository.<br><br>What is the MOST efficient way to meet these requirements?`,
  ko: `한 회사에 자동화된 배포 파이프라인을 위한 코드를 작성하는 개발자가 한 명 있습니다. 개발자는 각 프로젝트의 Amazon S3 버킷에 소스 코드를 저장하고 있습니다. 회사는 팀에 개발자를 더 추가하고 싶지만 코드 충돌과 작업 손실에 대해 우려하고 있습니다. 회사는 또한 새 버전의 코드를 테스트하기 위한 테스트 환경을 구축하고, 리포지토리에서 코드가 변경될 때 개발자가 두 환경 모두에 자동으로 배포할 수 있기를 원합니다.<br><br>이러한 요구 사항을 충족하는 가장 효율적인 방법은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an AWS CodeCommit repository for each project, use the main branch for production code, and create a testing branch for code deployed to testing. Use feature branches to develop new features and pull requests to merge code to testing and main branches.`, ko:`각 프로젝트에 대한 AWS CodeCommit 리포지토리를 생성하고, 프로덕션 코드에는 main 브랜치를 사용하며, 테스트에 배포되는 코드에 대한 테스트 브랜치를 생성합니다. 기능 브랜치를 사용하여 새로운 기능을 개발하고, 풀 리퀘스트를 사용하여 코드를 테스트 및 main 브랜치에 병합합니다.` },
    { k:'B', en:`Create another S3 bucket for each project for testing code, and use an AWS Lambda function to promote code changes between testing and production buckets. Enable versioning on all buckets to prevent code conflicts.`, ko:`각 프로젝트에 대해 테스트 코드용 S3 버킷을 별도로 생성하고, AWS Lambda 함수를 사용하여 테스트 버킷과 프로덕션 버킷 간의 코드 변경을 승격합니다. 코드 충돌을 방지하기 위해 모든 버킷에서 버전 관리를 활성화합니다.` },
    { k:'C', en:`Create an AWS CodeCommit repository for each project, and use the main branch for production and test code with different deployment pipelines for each environment. Use feature branches to develop new features.`, ko:`각 프로젝트에 대한 AWS CodeCommit 리포지토리를 생성하고, 프로덕션 및 테스트 코드 모두에 main 브랜치를 사용하되 각 환경에 대해 서로 다른 배포 파이프라인을 사용합니다. 기능 브랜치를 사용하여 새로운 기능을 개발합니다.` },
    { k:'D', en:`Enable versioning and branching on each S3 bucket, use the main branch for production code, and create a testing branch for code deployed to testing. Have developers use each branch for developing in each environment.`, ko:`각 S3 버킷에서 버전 관리 및 브랜칭을 활성화하고, 프로덕션 코드에는 main 브랜치를 사용하며, 테스트에 배포되는 코드에는 테스트 브랜치를 생성합니다. 개발자가 각 환경에서 각 브랜치를 사용하도록 합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>AWS CodeCommit은 Git 기반 버전 관리 시스템으로 코드 충돌 방지와 협업을 지원합니다. <strong>main 브랜치(프로덕션) + testing 브랜치 + feature 브랜치</strong> 전략은 업계 표준 Git 브랜칭 패턴이며, 풀 리퀘스트를 통한 코드 리뷰 및 브랜치 변경 시 자동 배포 트리거를 지원합니다. S3는 소스 코드 버전 관리 도구가 아닙니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B, D</span> — S3는 소스 코드 협업에 적합하지 않습니다. 브랜칭 개념이 없으며 코드 충돌 해결 기능이 없습니다.</p>
<p><span class="mark-no">❌ C</span> — 프로덕션과 테스트 코드 모두에 main 브랜치를 사용하는 것은 좋지 않은 관행입니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'CodeCommit + Git 브랜칭 전략이 코드 충돌 방지, 협업, 자동 배포 요구사항을 모두 충족.' }]
},
{
  n: 157,
  en: `A DevOps engineer notices that all Amazon EC2 instances running behind an Application Load Balancer in an Auto Scaling group are failing to respond to user requests. The EC2 instances are also failing target group HTTP health checks.<br><br>Upon inspection, the engineer notices the application process was not running in any EC2 instances. There are a significant number of out of memory messages in the system logs. The engineer needs to improve the resilience of the application to cope with a potential application memory leak. Monitoring and notifications should be enabled to alert when there is an issue.<br><br>Which combination of actions will meet these requirements? (Choose two.)`,
  ko: `DevOps 엔지니어는 Auto Scaling 그룹의 Application Load Balancer 뒤에서 실행되는 모든 Amazon EC2 인스턴스가 사용자 요청에 응답하지 않는다는 것을 알게 되었습니다. EC2 인스턴스는 대상 그룹 HTTP 상태 검사에도 실패하고 있습니다.<br><br>검사 결과, 어떤 EC2 인스턴스에서도 애플리케이션 프로세스가 실행되지 않고 있었습니다. 시스템 로그에 메모리 부족 메시지가 상당히 많이 있습니다. 엔지니어는 잠재적인 애플리케이션 메모리 누수에 대처하기 위해 애플리케이션의 복원력을 개선해야 합니다. 문제 발생 시 경고하도록 모니터링 및 알림을 활성화해야 합니다.<br><br>이러한 요구 사항을 충족하는 작업의 조합은 무엇입니까? (두 가지를 선택하십시오.)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Change the Auto Scaling configuration to replace the instances when they fail the load balancer's health checks.`, ko:`로드 밸런서의 상태 검사에 실패할 경우 인스턴스를 교체하도록 Auto Scaling 구성을 변경합니다.` },
    { k:'B', en:`Change the target group health check HealthCheckIntervalSeconds parameter to reduce the interval between health checks.`, ko:`대상 그룹 상태 검사 HealthCheckIntervalSeconds 파라미터를 변경하여 상태 검사 간격을 줄입니다.` },
    { k:'C', en:`Change the target group health checks from HTTP to TCP to check if the port where the application is listening is reachable.`, ko:`대상 그룹 상태 검사를 HTTP에서 TCP로 변경하여 애플리케이션이 수신 대기하는 포트에 도달 가능한지 확인합니다.` },
    { k:'D', en:`Enable the available memory consumption metric within the Amazon CloudWatch dashboard for the entire Auto Scaling group. Create an alarm when the memory utilization is high. Associate an Amazon SNS topic to the alarm to receive notifications when the alarm goes off.`, ko:`전체 Auto Scaling 그룹에 대해 Amazon CloudWatch 대시보드 내에서 사용 가능한 메모리 소비 메트릭을 활성화합니다. 메모리 사용률이 높을 때 알람을 생성합니다. 알람이 울릴 때 알림을 받으려면 Amazon SNS 토픽을 알람에 연결합니다.` },
    { k:'E', en:`Use the Amazon CloudWatch agent to collect the memory utilization of the EC2 instances in the Auto Scaling group. Create an alarm when the memory utilization is high and associate an Amazon SNS topic to receive a notification.`, ko:`Amazon CloudWatch 에이전트를 사용하여 Auto Scaling 그룹의 EC2 인스턴스 메모리 사용률을 수집합니다. 메모리 사용률이 높을 때 알람을 생성하고 Amazon SNS 토픽을 연결하여 알림을 받습니다.` },
  ],
  answer: ['A','E'],
  vote: '87% AE',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>기본적으로 Auto Scaling은 EC2 인스턴스 상태 검사를 사용하지만, <strong>ELB/ALB 상태 검사를 사용하도록 구성</strong>해야 로드 밸런서 상태 검사 실패 시 인스턴스를 자동 교체할 수 있습니다. 이를 통해 메모리 누수로 응답 불가 상태가 되면 자동으로 교체됩니다.</p>
<p><span class="mark-ok">✅ E — 핵심 이유</span></p>
<p>EC2의 기본 CloudWatch 메트릭에는 메모리 사용률이 포함되지 않습니다. <strong>CloudWatch 에이전트</strong>를 설치해야만 메모리 메트릭을 수집할 수 있습니다. SNS 토픽 연결로 높은 메모리 사용 시 알림을 받을 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 검사 간격을 줄이면 더 빨리 감지할 수 있지만, 복원력(자동 교체)을 개선하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — HTTP에서 TCP로 변경하면 애플리케이션 수준 상태 검사 능력이 떨어집니다.</p>
<p><span class="mark-no">❌ D</span> — CloudWatch 대시보드에서 메모리 메트릭을 직접 활성화할 수 없습니다. 에이전트가 필요합니다.</p>`,
  disc: [{ ans:'AE (87%)', txt:'복원력 향상에는 ALB 상태 검사 기반 자동 교체(A), 메모리 모니터링에는 CloudWatch 에이전트(E)가 필요.' }]
},
{
  n: 158,
  en: `An ecommerce company uses a large number of Amazon Elastic Block Store (Amazon EBS) backed Amazon EC2 instances. To decrease manual work across all the instances, a DevOps engineer is tasked with automating restart actions when EC2 instance retirement events are scheduled.<br><br>How can this be accomplished?`,
  ko: `전자상거래 회사가 많은 수의 Amazon Elastic Block Store(Amazon EBS) 지원 Amazon EC2 인스턴스를 사용합니다. 모든 인스턴스에서 수동 작업을 줄이기 위해 DevOps 엔지니어는 EC2 인스턴스 은퇴 이벤트가 예약될 때 재시작 작업을 자동화하는 업무를 맡았습니다.<br><br>이를 어떻게 달성할 수 있습니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a scheduled Amazon EventBridge rule to run an AWS Systems Manager Automation runbook that checks if any EC2 instances are scheduled for retirement once a week. If the instance is scheduled for retirement, the runbook will hibernate the instance.`, ko:`일주일에 한 번 EC2 인스턴스가 은퇴를 위해 예약되어 있는지 확인하는 AWS Systems Manager Automation 런북을 실행하기 위해 예약된 Amazon EventBridge 규칙을 생성합니다. 인스턴스가 은퇴를 위해 예약된 경우 런북이 인스턴스를 최대 절전 모드로 전환합니다.` },
    { k:'B', en:`Enable EC2 Auto Recovery on all of the instances. Create an AWS Config rule to limit the recovery to occur during a maintenance window only.`, ko:`모든 인스턴스에서 EC2 자동 복구를 활성화합니다. 유지 관리 기간 동안만 복구가 발생하도록 제한하는 AWS Config 규칙을 생성합니다.` },
    { k:'C', en:`Reboot all EC2 instances during an approved maintenance window that is outside of standard business hours. Set up Amazon CloudWatch alarms to send a notification in case any instance is failing EC2 instance status checks.`, ko:`표준 업무 시간 외의 승인된 유지 관리 기간 동안 모든 EC2 인스턴스를 재부팅합니다. 인스턴스가 EC2 인스턴스 상태 검사에 실패하는 경우 알림을 보내도록 Amazon CloudWatch 알람을 설정합니다.` },
    { k:'D', en:`Set up an AWS Health Amazon EventBridge rule to run AWS Systems Manager Automation runbooks that stop and start the EC2 instance when a retirement scheduled event occurs.`, ko:`은퇴 예약 이벤트가 발생할 때 EC2 인스턴스를 중지하고 시작하는 AWS Systems Manager Automation 런북을 실행하기 위한 AWS Health Amazon EventBridge 규칙을 설정합니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — 핵심 이유</span></p>
<p>EC2 인스턴스 은퇴 이벤트는 <strong>AWS Health</strong>를 통해 발생합니다. AWS Health EventBridge 규칙을 설정하면 은퇴 이벤트 발생 시 자동으로 SSM Automation 런북을 트리거할 수 있습니다. EBS 지원 인스턴스는 <strong>중지 후 시작(stop-start)</strong>으로 다른 물리적 호스트로 재배치되어 은퇴 문제를 해결합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 주 1회 예약 검사는 실시간 대응이 아니며, 최대 절전 모드(hibernate)는 은퇴 이벤트 해결 방법이 아닙니다.</p>
<p><span class="mark-no">❌ B</span> — AWS Config 규칙은 복구를 제한할 수 없습니다. 규정 준수 보고만 가능합니다.</p>
<p><span class="mark-no">❌ C</span> — 수동 재부팅은 자동화된 작업이 아닙니다.</p>`,
  disc: [{ ans:'D (100%)', txt:'EC2 은퇴 이벤트 → AWS Health → EventBridge → SSM Automation (stop/start)이 자동화 표준 패턴.' }]
},
{
  n: 159,
  en: `A company manages AWS accounts for application teams in AWS Control Tower. Individual application teams are responsible for securing their respective AWS accounts.<br><br>A DevOps engineer needs to enable Amazon GuardDuty for all AWS accounts in which the application teams have not already enabled GuardDuty. The DevOps engineer is using AWS CloudFormation StackSets from the AWS Control Tower management account.<br><br>How should the DevOps engineer configure the CloudFormation template to prevent failure during the StackSets deployment?`,
  ko: `한 회사가 AWS Control Tower에서 애플리케이션 팀의 AWS 계정을 관리합니다. 개별 애플리케이션 팀은 각자의 AWS 계정을 보안하는 책임이 있습니다.<br><br>DevOps 엔지니어는 애플리케이션 팀이 아직 GuardDuty를 활성화하지 않은 모든 AWS 계정에 대해 Amazon GuardDuty를 활성화해야 합니다. DevOps 엔지니어는 AWS Control Tower 관리 계정에서 AWS CloudFormation StackSets를 사용하고 있습니다.<br><br>StackSets 배포 중 실패를 방지하기 위해 CloudFormation 템플릿을 어떻게 구성해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a CloudFormation custom resource that invokes an AWS Lambda function. Configure the Lambda function to conditionally enable GuardDuty if GuardDuty is not already enabled in the accounts.`, ko:`AWS Lambda 함수를 호출하는 CloudFormation 사용자 지정 리소스를 생성합니다. GuardDuty가 계정에서 아직 활성화되지 않은 경우 조건부로 GuardDuty를 활성화하도록 Lambda 함수를 구성합니다.` },
    { k:'B', en:`Use the Conditions section of the CloudFormation template to enable GuardDuty in accounts where GuardDuty is not already enabled.`, ko:`CloudFormation 템플릿의 조건 섹션을 사용하여 GuardDuty가 아직 활성화되지 않은 계정에서 GuardDuty를 활성화합니다.` },
    { k:'C', en:`Use the CloudFormation Fn::GetAtt intrinsic function to check whether GuardDuty is already enabled. If GuardDuty is not already enabled, use the Resources section of the CloudFormation template to enable GuardDuty.`, ko:`CloudFormation Fn::GetAtt 내장 함수를 사용하여 GuardDuty가 이미 활성화되었는지 확인합니다. GuardDuty가 아직 활성화되지 않은 경우 CloudFormation 템플릿의 리소스 섹션을 사용하여 GuardDuty를 활성화합니다.` },
    { k:'D', en:`Manually discover the list of AWS account IDs where GuardDuty is not enabled. Use the CloudFormation Fn::ImportValue intrinsic function to import the list of account IDs into the CloudFormation template to skip deployment for the listed AWS accounts.`, ko:`GuardDuty가 활성화되지 않은 AWS 계정 ID 목록을 수동으로 검색합니다. CloudFormation Fn::ImportValue 내장 함수를 사용하여 계정 ID 목록을 CloudFormation 템플릿으로 가져와 나열된 AWS 계정에 대한 배포를 건너뜁니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>CloudFormation은 기본적으로 GuardDuty 활성화 여부를 조건부로 처리하는 내장 기능이 없습니다. <strong>Lambda 함수를 사용하는 사용자 지정 리소스</strong>는 GuardDuty API를 호출하여 이미 활성화된 경우를 감지하고 조건부로 활성화할 수 있어 StackSets 배포 실패를 방지합니다. AWS 공식 처방 지침(Prescriptive Guidance)에서도 이 패턴을 권장합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — CloudFormation Conditions 섹션은 리소스를 생성할지 여부를 결정하지만, 런타임 상태(GuardDuty 활성화 여부)를 동적으로 조회하지 못합니다.</p>
<p><span class="mark-no">❌ C</span> — Fn::GetAtt는 동일 템플릿 내 리소스 속성 조회에만 사용됩니다. 기존 GuardDuty 상태를 조회할 수 없습니다.</p>
<p><span class="mark-no">❌ D</span> — 수동 검색은 자동화가 아니며, Fn::ImportValue는 이 목적에 적합하지 않습니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'Lambda 기반 Custom Resource로 GuardDuty 상태를 조건부 확인 후 활성화하는 것이 StackSets 배포 실패 방지 표준 패턴.' }]
},
{
  n: 160,
  en: `A company has an AWS Control Tower landing zone. The company's DevOps team creates a workload OU. A development OU and a production OU are nested under the workload OU. The company grants users full access to the company's AWS accounts to deploy applications.<br><br>The DevOps team needs to allow only a specific management IAM role to manage the IAM roles and policies of any AWS accounts in only the production OU.<br><br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `한 회사에 AWS Control Tower 랜딩 존이 있습니다. 회사의 DevOps 팀이 워크로드 OU를 생성합니다. 개발 OU와 프로덕션 OU는 워크로드 OU 아래에 중첩됩니다. 회사는 애플리케이션을 배포하기 위해 사용자에게 회사의 AWS 계정에 대한 전체 액세스 권한을 부여합니다.<br><br>DevOps 팀은 프로덕션 OU에서만 특정 관리 IAM 역할이 모든 AWS 계정의 IAM 역할과 정책을 관리하도록 허용해야 합니다.<br><br>이러한 요구 사항을 충족하는 단계의 조합은 무엇입니까? (두 가지를 선택하십시오.)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Create an SCP that denies full access with a condition to exclude the management IAM role for the organization root.`, ko:`조직 루트에 대한 관리 IAM 역할을 제외하는 조건으로 전체 액세스를 거부하는 SCP를 생성합니다.` },
    { k:'B', en:`Ensure that the FullAWSAccess SCP is applied at the organization root.`, ko:`FullAWSAccess SCP가 조직 루트에 적용되어 있는지 확인합니다.` },
    { k:'C', en:`Create an SCP that allows IAM related actions. Attach the SCP to the development OU.`, ko:`IAM 관련 작업을 허용하는 SCP를 생성합니다. SCP를 개발 OU에 연결합니다.` },
    { k:'D', en:`Create an SCP that denies IAM related actions with a condition to exclude the management IAM role. Attach the SCP to the workload OU.`, ko:`관리 IAM 역할을 제외하는 조건으로 IAM 관련 작업을 거부하는 SCP를 생성합니다. SCP를 워크로드 OU에 연결합니다.` },
    { k:'E', en:`Create an SCP that denies IAM related actions with a condition to exclude the management IAM role. Attach the SCP to the production OU.`, ko:`관리 IAM 역할을 제외하는 조건으로 IAM 관련 작업을 거부하는 SCP를 생성합니다. SCP를 프로덕션 OU에 연결합니다.` },
  ],
  answer: ['B','E'],
  vote: '95% BE',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>
<p>SCP는 허용(Allow) 정책이 없으면 기본적으로 모든 것이 거부됩니다. 조직 루트에 <strong>FullAWSAccess SCP</strong>가 적용되어 있어야 하위 OU에서 권한이 부여됩니다. SCP 상속 구조상 루트의 허용 정책이 없으면 전체 조직이 잠길 수 있습니다.</p>
<p><span class="mark-ok">✅ E — 핵심 이유</span></p>
<p>프로덕션 OU만을 대상으로 IAM 관련 작업을 거부하는 SCP를 생성하되, <strong>관리 IAM 역할을 예외 조건</strong>으로 설정합니다. 이렇게 하면 관리 역할만 프로덕션 OU의 IAM을 관리할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 조직 루트에 전체 액세스 거부 SCP를 적용하면 개발 OU를 포함한 전체 조직에 영향을 미칩니다.</p>
<p><span class="mark-no">❌ C</span> — 개발 OU에 IAM 허용 SCP를 추가하는 것은 요구사항(프로덕션만 제한)과 무관합니다.</p>
<p><span class="mark-no">❌ D</span> — 워크로드 OU에 SCP를 연결하면 개발 OU와 프로덕션 OU 모두에 영향을 미칩니다. 프로덕션만 제한해야 합니다.</p>`,
  disc: [{ ans:'BE (95%)', txt:'FullAWSAccess를 루트에 확보(B) + 프로덕션 OU에만 IAM 거부 SCP 연결(E). 개발 OU는 영향 없음.' }]
},
{
  n: 161,
  en: `A company hired a penetration tester to simulate an internal security breach. The tester performed port scans on the company's Amazon EC2 instances. The company's security measures did not detect the port scans.<br><br>The company needs a solution that automatically provides notification when port scans are performed on EC2 instances. The company creates and subscribes to an Amazon Simple Notification Service (Amazon SNS) topic.<br><br>What should the company do next to meet the requirement?`,
  ko: `한 회사가 내부 보안 침해를 시뮬레이션하기 위해 침투 테스터를 고용했습니다. 테스터가 회사의 Amazon EC2 인스턴스에서 포트 스캔을 수행했습니다. 회사의 보안 조치는 포트 스캔을 감지하지 못했습니다.<br><br>회사는 EC2 인스턴스에서 포트 스캔이 수행될 때 자동으로 알림을 제공하는 솔루션이 필요합니다. 회사는 Amazon SNS 토픽을 생성하고 구독합니다.<br><br>요구 사항을 충족하기 위해 회사는 다음에 무엇을 해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Ensure that Amazon GuardDuty is enabled. Create an Amazon CloudWatch alarm for detected EC2 and port scan findings. Connect the alarm to the SNS topic.`, ko:`Amazon GuardDuty가 활성화되어 있는지 확인합니다. 감지된 EC2 및 포트 스캔 결과에 대한 Amazon CloudWatch 알람을 생성합니다. 알람을 SNS 토픽에 연결합니다.` },
    { k:'B', en:`Ensure that Amazon Inspector is enabled. Create an Amazon EventBridge event for detected network reachability findings that indicate port scans. Connect the event to the SNS topic.`, ko:`Amazon Inspector가 활성화되어 있는지 확인합니다. 포트 스캔을 나타내는 감지된 네트워크 도달 가능성 결과에 대한 Amazon EventBridge 이벤트를 생성합니다. 이벤트를 SNS 토픽에 연결합니다.` },
    { k:'C', en:`Ensure that Amazon Inspector is enabled. Create an Amazon EventBridge event for detected CVEs that cause open port vulnerabilities. Connect the event to the SNS topic.`, ko:`Amazon Inspector가 활성화되어 있는지 확인합니다. 오픈 포트 취약성을 유발하는 감지된 CVE에 대한 Amazon EventBridge 이벤트를 생성합니다. 이벤트를 SNS 토픽에 연결합니다.` },
    { k:'D', en:`Ensure that AWS CloudTrail is enabled. Create an AWS Lambda function to analyze the CloudTrail logs for unusual amounts of traffic from an IP address range. Connect the Lambda function to the SNS topic.`, ko:`AWS CloudTrail이 활성화되어 있는지 확인합니다. IP 주소 범위에서 비정상적인 양의 트래픽에 대해 CloudTrail 로그를 분석하는 AWS Lambda 함수를 생성합니다. Lambda 함수를 SNS 토픽에 연결합니다.` },
  ],
  answer: ['A'],
  vote: '93% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p><strong>Amazon GuardDuty</strong>는 VPC 흐름 로그, DNS 로그, CloudTrail 이벤트를 분석하여 실시간으로 포트 스캔 같은 위협 활동을 탐지합니다. GuardDuty의 발견 항목(findings)은 CloudWatch Events/EventBridge를 통해 SNS 토픽으로 알림을 보낼 수 있습니다. Inspector는 취약점 평가 도구로 포트 스캔을 수행하는 주체(공격자)를 감지하지 못합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B, C</span> — Amazon Inspector는 EC2 인스턴스의 취약점(열린 포트, CVE)을 스캔하는 도구이지, 외부 포트 스캔 공격을 탐지하는 도구가 아닙니다.</p>
<p><span class="mark-no">❌ D</span> — CloudTrail은 API 호출 로그이며 네트워크 수준 포트 스캔을 기록하지 않습니다.</p>`,
  disc: [{ ans:'A (93%)', txt:'포트 스캔 탐지 = GuardDuty. Inspector는 취약점 스캔 도구, GuardDuty는 위협 탐지 도구.' }]
},
{
  n: 162,
  en: `A company runs applications in an Amazon Elastic Kubernetes Service (Amazon EKS) cluster. The EKS cluster uses an Application Load Balancer to route traffic to the applications that run in the cluster.<br><br>A new application that was migrated to the EKS cluster is performing poorly. All the other applications in the EKS cluster maintain appropriate operation. The new application scales out horizontally to the preconfigured maximum number of pods immediately upon deployment, before any user traffic routes to the web application.<br><br>Which solution will resolve the scaling behavior of the web application in the EKS cluster?`,
  ko: `한 회사가 Amazon Elastic Kubernetes Service(Amazon EKS) 클러스터에서 애플리케이션을 실행합니다. EKS 클러스터는 Application Load Balancer를 사용하여 클러스터에서 실행되는 애플리케이션으로 트래픽을 라우팅합니다.<br><br>EKS 클러스터로 마이그레이션된 새 애플리케이션의 성능이 좋지 않습니다. EKS 클러스터의 다른 모든 애플리케이션은 정상적으로 작동합니다. 새 애플리케이션은 배포 즉시 사용자 트래픽이 웹 애플리케이션으로 라우팅되기 전에 사전 구성된 최대 포드 수로 수평적으로 확장됩니다.<br><br>EKS 클러스터에서 웹 애플리케이션의 확장 동작을 해결할 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Implement the Horizontal Pod Autoscaler in the EKS cluster.`, ko:`EKS 클러스터에 Horizontal Pod Autoscaler를 구현합니다.` },
    { k:'B', en:`Implement the Vertical Pod Autoscaler in the EKS cluster.`, ko:`EKS 클러스터에 Vertical Pod Autoscaler를 구현합니다.` },
    { k:'C', en:`Implement the Cluster Autoscaler.`, ko:`클러스터 오토스케일러를 구현합니다.` },
    { k:'D', en:`Implement the AWS Load Balancer Controller in the EKS cluster.`, ko:`EKS 클러스터에 AWS 로드 밸런서 컨트롤러를 구현합니다.` },
  ],
  answer: ['B'],
  vote: '61% B',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>
<p>트래픽이 없는데도 배포 즉시 최대 포드 수까지 확장된다는 것은 각 포드에 할당된 리소스(CPU/메모리)가 부족하여 리소스 요청 임계값을 초과하기 때문입니다. <strong>Vertical Pod Autoscaler(VPA)</strong>는 각 포드에 적절한 CPU/메모리 리소스를 자동으로 권장하고 할당하여 "적절한 크기(right-sizing)"를 달성합니다. 이를 통해 불필요한 수평 확장을 방지할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Horizontal Pod Autoscaler(HPA)는 트래픽/메트릭 기반으로 포드 수를 조정합니다. 트래픽 없이 최대로 확장되는 문제는 리소스 할당 문제이므로 HPA로는 해결할 수 없습니다.</p>
<p><span class="mark-no">❌ C</span> — Cluster Autoscaler는 노드 수를 조정하며 포드 리소스 문제와 무관합니다.</p>
<p><span class="mark-no">❌ D</span> — 로드 밸런서 컨트롤러는 트래픽 라우팅 관련 도구입니다.</p>`,
  disc: [{ ans:'B (61%)', txt:'커뮤니티 의견 분분. 트래픽 없이 최대 확장 → 리소스 부족으로 인한 확장 → VPA(B)로 적절한 리소스 할당. 일부는 정적 복제본 설정 문제로 HPA(A)를 선택.' }]
},
{
  n: 163,
  en: `A company has an AWS Control Tower landing zone that manages its organization in AWS Organizations. The company created an OU structure that is based on the company's requirements. The company's DevOps team has established the core accounts for the solution and an account for all centralized AWS CloudFormation and AWS Service Catalog solutions.<br><br>The company wants to offer a series of customizations that an account can request through AWS Control Tower.<br><br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `한 회사에 AWS Organizations에서 조직을 관리하는 AWS Control Tower 랜딩 존이 있습니다. 회사는 회사의 요구 사항에 따라 OU 구조를 만들었습니다. 회사의 DevOps 팀은 솔루션의 핵심 계정과 모든 중앙 집중식 AWS CloudFormation 및 AWS Service Catalog 솔루션에 대한 계정을 설정했습니다.<br><br>회사는 AWS Control Tower를 통해 계정이 요청할 수 있는 일련의 사용자 지정을 제공하려고 합니다.<br><br>이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (세 가지를 선택하십시오.)`,
  type: 'multi',
  multiCount: 3,

    { k:'A', en:`Create an Amazon EventBridge rule in the automation account to send account creation events to the default event bus in the services accounts. Update the default event bus in the services accounts to allow events from the automation account.`, ko:`자동화 계정에서 Amazon EventBridge 규칙을 생성하여 서비스 계정의 기본 이벤트 버스로 계정 생성 이벤트를 보냅니다. 자동화 계정의 이벤트를 허용하도록 서비스 계정의 기본 이벤트 버스를 업데이트합니다.` },
    { k:'B', en:`Create a custom Amazon EventBridge event bus in the services accounts. Update the custom event bus to allow events from the automation account. Create an EventBridge rule in the services account that directly listens to CloudTrail events from the automation account.`, ko:`서비스 계정에서 사용자 지정 Amazon EventBridge 이벤트 버스를 생성합니다. 자동화 계정의 이벤트를 허용하도록 사용자 지정 이벤트 버스를 업데이트합니다. 자동화 계정의 CloudTrail 이벤트를 직접 수신하는 EventBridge 규칙을 서비스 계정에 생성합니다.` },
    { k:'C', en:`Create a custom Amazon EventBridge event bus in the automation account and the services accounts. Create an EventBridge rule and policy that connects the custom event buses that are in the automation account and the services accounts.`, ko:`자동화 계정과 서비스 계정에서 사용자 지정 Amazon EventBridge 이벤트 버스를 생성합니다. 자동화 계정과 서비스 계정에 있는 사용자 지정 이벤트 버스를 연결하는 EventBridge 규칙과 정책을 생성합니다.` },
    { k:'D', en:`Create a custom Amazon EventBridge event bus in the automation account. Create an EventBridge rule and policy that connects the custom event bus to the default event buses in the services accounts.`, ko:`자동화 계정에서 사용자 지정 Amazon EventBridge 이벤트 버스를 생성합니다. 사용자 지정 이벤트 버스를 서비스 계정의 기본 이벤트 버스에 연결하는 EventBridge 규칙과 정책을 생성합니다.` },

  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>교차 계정 이벤트 전달의 표준 패턴입니다: ① 소스 계정(자동화 계정)에 <strong>EventBridge 규칙</strong>을 생성하여 특정 이벤트(계정 생성)를 대상 이벤트 버스로 전송하고, ② 대상 계정(서비스 계정)의 기본 이벤트 버스에 소스 계정으로부터의 이벤트를 허용하는 리소스 정책을 업데이트합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 서비스 계정의 규칙이 자동화 계정의 CloudTrail 이벤트를 "직접" 수신하는 것은 불가능합니다. 이벤트는 자동화 계정에서 푸시해야 합니다.</p>
<p><span class="mark-no">❌ C, D</span> — 사용자 지정 이벤트 버스는 필요하지 않으며, C와 D는 계정 생성 이벤트만 필터링하지 않고 모든 이벤트를 전달합니다.</p>`,

{
  n: 168,
  en: `A DevOps engineer is building a solution that uses Amazon Simple Queue Service (Amazon SQS) standard queues. The solution also includes an AWS Lambda function and an Amazon DynamoDB table. The Lambda function pulls content from an SQS queue event source and writes the content to the DynamoDB table.<br><br>The solution must maximize the scalability of Lambda and must prevent successfully processed SQS messages from being processed multiple times.<br><br>Which solution will meet these requirements?`,
  ko: `DevOps 엔지니어가 Amazon Simple Queue Service(Amazon SQS) 표준 대기열을 사용하는 솔루션을 구축하고 있습니다. 솔루션에는 AWS Lambda 함수와 Amazon DynamoDB 테이블도 포함됩니다. Lambda 함수는 SQS 대기열 이벤트 소스에서 콘텐츠를 가져와 DynamoDB 테이블에 씁니다.<br><br>솔루션은 Lambda의 확장성을 극대화하고 성공적으로 처리된 SQS 메시지가 여러 번 처리되는 것을 방지해야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Decrease the batch window to 1 second when configuring the Lambda function's event source mapping.`, ko:`Lambda 함수의 이벤트 소스 매핑을 구성할 때 배치 창을 1초로 줄입니다.` },
    { k:'B', en:`Decrease the batch size to 1 when configuring the Lambda function's event source mapping.`, ko:`Lambda 함수의 이벤트 소스 매핑을 구성할 때 배치 크기를 1로 줄입니다.` },
    { k:'C', en:`Include the ReportBatchItemFailures value in the FunctionResponseTypes list in the Lambda function's event source mapping.`, ko:`Lambda 함수의 이벤트 소스 매핑에서 FunctionResponseTypes 목록에 ReportBatchItemFailures 값을 포함합니다.` },
    { k:'D', en:`Set the queue visibility timeout on the Lambda function's event source mapping to account for invocation throttling of the Lambda function.`, ko:`Lambda 함수의 호출 제한을 고려하기 위해 Lambda 함수의 이벤트 소스 매핑에서 대기열 가시성 시간 초과를 설정합니다.` },
  ],
  answer: ['C'],
  vote: '86% C',
  explain: `<p><span class="mark-ok">✅ C — 핵심 이유</span></p>
<p>Lambda가 SQS 배치를 처리할 때 일부 메시지만 실패하면 전체 배치가 대기열로 반환되어 성공한 메시지도 다시 처리됩니다. <strong><code>ReportBatchItemFailures</code></strong>를 FunctionResponseTypes에 포함하면 <strong>부분 배치 응답(Partial Batch Response)</strong>이 활성화되어, 실패한 메시지만 대기열에 다시 표시됩니다. 이를 통해 성공 메시지 중복 처리를 방지하면서도 큰 배치 크기로 Lambda 확장성을 극대화할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 배치 창(batch window)은 메시지 집계 시간 간격이며 중복 처리와 무관합니다.</p>
<p><span class="mark-no">❌ B</span> — 배치 크기 1은 중복 처리를 방지하지만 Lambda 확장성이 저하됩니다(처리량 감소). 확장성 극대화 요건을 충족하지 못합니다.</p>
<p><span class="mark-no">❌ D</span> — 가시성 타임아웃은 메시지 재처리 방지와 관련 있지만, 이미 성공한 메시지의 중복 처리는 해결하지 못합니다.</p>`,
  disc: [{ ans:'C (86%)', txt:'ReportBatchItemFailures = 부분 배치 응답. 실패 메시지만 재처리 → 성공 메시지 중복 방지 + 큰 배치 크기 유지(확장성 극대화).' }]
},
{
  n: 169,
  en: `A company has a new AWS account that teams will use to deploy various applications. The teams will create many Amazon S3 buckets for application-specific purposes and to store AWS CloudTrail logs. The company has enabled Amazon Macie for the account.<br><br>A DevOps engineer needs to optimize the Macie costs for the account without compromising the account's functionality.<br><br>Which solutions will meet these requirements? (Choose two.)`,
  ko: `한 회사에 팀이 다양한 애플리케이션을 배포하는 데 사용할 새로운 AWS 계정이 있습니다. 팀은 애플리케이션별 목적과 AWS CloudTrail 로그 저장을 위해 많은 Amazon S3 버킷을 생성합니다. 회사는 계정에 Amazon Macie를 활성화했습니다.<br><br>DevOps 엔지니어는 계정의 기능을 손상시키지 않으면서 Macie 비용을 최적화해야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Exclude S3 buckets that contain CloudTrail logs from automated discovery.`, ko:`CloudTrail 로그가 포함된 S3 버킷을 자동 검색에서 제외합니다.` },
    { k:'B', en:`Exclude S3 buckets that have public read access from automated discovery.`, ko:`공개 읽기 액세스 권한이 있는 S3 버킷을 자동 검색에서 제외합니다.` },
    { k:'C', en:`Configure scheduled daily discovery jobs for all S3 buckets in the account.`, ko:`계정의 모든 S3 버킷에 대해 예약된 일일 검색 작업을 구성합니다.` },
    { k:'D', en:`Configure discovery jobs to include S3 objects based on the last modified criterion.`, ko:`마지막으로 수정된 기준에 따라 S3 객체를 포함하도록 검색 작업을 구성합니다.` },
    { k:'E', en:`Configure discovery jobs to include S3 objects that are tagged as production only.`, ko:`프로덕션으로만 태그가 지정된 S3 객체를 포함하도록 검색 작업을 구성합니다.` },
  ],
  answer: ['A','D'],
  vote: '84% AD',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>CloudTrail 로그는 민감한 데이터가 아닌 인프라 로그이므로 Macie 자동 검색에서 제외하면 불필요한 스캔 비용을 절감할 수 있습니다. AWS 공식 블로그에서도 CloudTrail 로그 버킷 제외를 비용 최적화 방법으로 권장합니다.</p>
<p><span class="mark-ok">✅ D — 핵심 이유</span></p>
<p><strong>"마지막 수정" 기준</strong>으로 객체를 필터링하면 새로 추가되거나 변경된 객체만 스캔하여 중복 스캔 비용을 줄일 수 있습니다. AWS 공식 비용 최적화 가이드에서 권장하는 방법입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 공개 읽기 버킷을 제외하면 오히려 민감한 데이터 노출 위험이 높은 버킷을 스캔하지 않게 되어 보안 기능이 저하됩니다.</p>
<p><span class="mark-no">❌ C</span> — 모든 버킷에 대한 일일 예약 작업은 비용을 증가시킵니다.</p>
<p><span class="mark-no">❌ E</span> — 모든 버킷이 실질적으로 프로덕션 용도이므로 태그 필터링 효과가 없습니다.</p>`,
  disc: [{ ans:'AD (84%)', txt:'CloudTrail 로그 제외(A) + 마지막 수정 기준 필터링(D). AWS 공식 비용 최적화 가이드 기준.' }]
},
{
  n: 170,
  en: `A company uses an organization in AWS Organizations to manage its AWS accounts. The company recently acquired another company that has standalone AWS accounts. The acquiring company's DevOps team needs to consolidate the administration of the AWS accounts for both companies and retain full administrative control of the accounts. The DevOps team also needs to collect and group findings across all the accounts to implement and maintain a security posture.<br><br>Which combination of steps should the DevOps team take to meet these requirements? (Choose two.)`,
  ko: `한 회사가 AWS Organizations에서 조직을 사용하여 AWS 계정을 관리합니다. 이 회사는 최근 독립형 AWS 계정이 있는 다른 회사를 인수했습니다. 인수한 회사의 DevOps 팀은 두 회사의 AWS 계정 관리를 통합하고 계정에 대한 전체 관리 제어권을 유지해야 합니다. DevOps 팀은 또한 보안 태세를 구현하고 유지하기 위해 모든 계정에서 결과를 수집하고 그룹화해야 합니다.<br><br>DevOps 팀이 이러한 요구 사항을 충족하기 위해 취해야 하는 단계의 조합은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Invite the acquired company's AWS accounts to join the organization. Create an SCP that has full administrative privileges. Attach the SCP to the management account.`, ko:`인수한 회사의 AWS 계정을 조직에 가입하도록 초대합니다. 전체 관리자 권한이 있는 SCP를 생성합니다. SCP를 관리 계정에 연결합니다.` },
    { k:'B', en:`Invite the acquired company's AWS accounts to join the organization. Create the OrganizationAccountAccessRole IAM role in the invited accounts. Grant permission to the management account to assume the role.`, ko:`인수한 회사의 AWS 계정을 조직에 가입하도록 초대합니다. 초대된 계정에서 OrganizationAccountAccessRole IAM 역할을 생성합니다. 관리 계정이 역할을 맡을 수 있는 권한을 부여합니다.` },
    { k:'C', en:`Use AWS Security Hub to collect and group findings across all accounts. Use Security Hub to automatically detect new accounts as the accounts are added to the organization.`, ko:`AWS Security Hub를 사용하여 모든 계정에서 결과를 수집하고 그룹화합니다. 계정이 조직에 추가될 때 Security Hub를 사용하여 자동으로 새 계정을 감지합니다.` },
    { k:'D', en:`Use AWS Firewall Manager to collect and group findings across all accounts. Enable all features for the organization. Designate an account in the organization as the delegated administrator account for Firewall Manager.`, ko:`AWS Firewall Manager를 사용하여 모든 계정에서 결과를 수집하고 그룹화합니다. 조직의 모든 기능을 활성화합니다. 조직의 계정을 Firewall Manager의 위임된 관리자 계정으로 지정합니다.` },
    { k:'E', en:`Use Amazon Inspector to collect and group findings across all accounts. Designate an account in the organization as the delegated administrator account for Amazon Inspector.`, ko:`Amazon Inspector를 사용하여 모든 계정에서 결과를 수집하고 그룹화합니다. 조직의 계정을 Amazon Inspector의 위임된 관리자 계정으로 지정합니다.` },
  ],
  answer: ['B','C'],
  vote: '100% BC',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>
<p>독립형 계정을 Organizations에 초대한 후, <strong>OrganizationAccountAccessRole</strong> IAM 역할을 생성하면 관리 계정이 해당 역할을 수임하여 인수된 계정에 대한 전체 관리 제어권을 가질 수 있습니다. Organizations에서 직접 생성한 계정에는 이 역할이 자동 생성되지만, 초대된 계정에는 수동으로 생성해야 합니다.</p>
<p><span class="mark-ok">✅ C — 핵심 이유</span></p>
<p><strong>AWS Security Hub</strong>는 여러 계정의 보안 결과를 수집, 집계, 그룹화하는 데 최적화된 서비스입니다. Organizations와 통합하여 새 계정이 추가될 때 자동으로 감지하고 관리합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — SCP를 관리 계정에 연결하는 것은 무의미합니다. SCP는 관리 계정에 적용되지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — Firewall Manager는 방화벽 정책 중앙 관리 도구이며 보안 결과 수집/그룹화에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ E</span> — Amazon Inspector는 취약점 스캐닝 도구이며 일반 보안 태세 결과 수집/그룹화에는 Security Hub가 더 적합합니다.</p>`,
  disc: [{ ans:'BC (100%)', txt:'계정 통합 + 전체 관리(B) + Security Hub로 보안 결과 수집/그룹화(C). Inspector는 취약점 스캔, Firewall Manager는 FW 정책 관리.' }]
},
{
  n: 171,
  en: `A company has an application and a CI/CD pipeline. The CI/CD pipeline consists of an AWS CodePipeline pipeline and an AWS CodeBuild project. The CodeBuild project runs tests against the application as part of the build process and outputs a test report. The company must keep the test reports for 90 days.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사에 애플리케이션과 CI/CD 파이프라인이 있습니다. CI/CD 파이프라인은 AWS CodePipeline 파이프라인과 AWS CodeBuild 프로젝트로 구성됩니다. CodeBuild 프로젝트는 빌드 프로세스의 일부로 애플리케이션에 대한 테스트를 실행하고 테스트 보고서를 출력합니다. 회사는 테스트 보고서를 90일 동안 보관해야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Add a new stage in the CodePipeline pipeline after the stage that contains the CodeBuild project. Create an Amazon S3 bucket to store the reports. Configure an S3 deploy action type in the new CodePipeline stage with the appropriate path and format for the reports.`, ko:`CodeBuild 프로젝트가 포함된 단계 이후 CodePipeline 파이프라인에 새 단계를 추가합니다. 보고서를 저장할 Amazon S3 버킷을 생성합니다. 보고서에 적합한 경로와 형식으로 새 CodePipeline 단계에서 S3 배포 작업 유형을 구성합니다.` },
    { k:'B', en:`Add a report group in the CodeBuild project buildspec file with the appropriate path and format for the reports. Create an Amazon S3 bucket to store the reports. Configure an Amazon EventBridge rule that invokes an AWS Lambda function to copy the reports to the S3 bucket when a build is completed. Create an S3 Lifecycle rule to expire the objects after 90 days.`, ko:`CodeBuild 프로젝트 buildspec 파일에 보고서의 적절한 경로와 형식으로 보고서 그룹을 추가합니다. 보고서를 저장할 Amazon S3 버킷을 생성합니다. 빌드가 완료되면 보고서를 S3 버킷에 복사하기 위해 AWS Lambda 함수를 호출하는 Amazon EventBridge 규칙을 구성합니다. 90일 후 객체를 만료시키는 S3 수명 주기 규칙을 생성합니다.` },
    { k:'C', en:`Add a new stage in the CodePipeline pipeline. Configure a test action type with the appropriate path and format for the reports. Configure the report expiration time to be 90 days in the CodeBuild project buildspec file.`, ko:`CodePipeline 파이프라인에 새 단계를 추가합니다. 보고서에 적합한 경로와 형식으로 테스트 작업 유형을 구성합니다. CodeBuild 프로젝트 buildspec 파일에서 보고서 만료 시간을 90일로 구성합니다.` },
    { k:'D', en:`Add a report group in the CodeBuild project buildspec file with the appropriate path and format for the reports. Create an Amazon S3 bucket to store the reports. Configure the report group as an artifact in the CodeBuild project buildspec file. Configure the S3 bucket as the artifact destination. Set the object expiration to 90 days.`, ko:`CodeBuild 프로젝트 buildspec 파일에 보고서의 적절한 경로와 형식으로 보고서 그룹을 추가합니다. 보고서를 저장할 Amazon S3 버킷을 생성합니다. CodeBuild 프로젝트 buildspec 파일에서 보고서 그룹을 아티팩트로 구성합니다. S3 버킷을 아티팩트 대상으로 구성합니다. 객체 만료를 90일로 설정합니다.` },

{
  n: 172,
  en: `A company uses an Amazon API Gateway regional REST API to host its application API. The REST API has a custom domain. The REST API's default endpoint is deactivated.<br><br>The company's internal teams consume the API. The company wants to use mutual TLS between the API and the internal teams as an additional layer of authentication.<br><br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `한 회사가 Amazon API Gateway 지역 REST API를 사용하여 애플리케이션 API를 호스팅합니다. REST API에는 사용자 지정 도메인이 있습니다. REST API의 기본 엔드포인트는 비활성화되어 있습니다.<br><br>회사의 내부 팀이 API를 사용합니다. 회사는 API와 내부 팀 간의 추가 인증 계층으로 상호 TLS를 사용하려고 합니다.<br><br>이러한 요구 사항을 충족하는 단계의 조합은 무엇입니까? (두 가지를 선택하십시오.)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Use AWS Certificate Manager (ACM) to create a private certificate authority (CA). Provision a client certificate that is signed by the private CA.`, ko:`AWS Certificate Manager(ACM)를 사용하여 개인 인증 기관(CA)을 생성합니다. 개인 CA에서 서명한 클라이언트 인증서를 프로비저닝합니다.` },
    { k:'B', en:`Provision a client certificate that is signed by a public certificate authority (CA). Import the certificate into AWS Certificate Manager (ACM).`, ko:`공개 인증 기관(CA)에서 서명한 클라이언트 인증서를 프로비저닝합니다. 인증서를 AWS Certificate Manager(ACM)로 가져옵니다.` },
    { k:'C', en:`Upload the provisioned client certificate to an Amazon S3 bucket. Configure the API Gateway mutual TLS to use the client certificate that is stored in the S3 bucket as the trust store.`, ko:`프로비저닝된 클라이언트 인증서를 Amazon S3 버킷에 업로드합니다. S3 버킷에 저장된 클라이언트 인증서를 신뢰 저장소로 사용하도록 API Gateway 상호 TLS를 구성합니다.` },
    { k:'D', en:`Upload the provisioned client certificate private key to an Amazon S3 bucket. Configure the API Gateway mutual TLS to use the private key that is stored in the S3 bucket as the trust store.`, ko:`프로비저닝된 클라이언트 인증서 개인 키를 Amazon S3 버킷에 업로드합니다. S3 버킷에 저장된 개인 키를 신뢰 저장소로 사용하도록 API Gateway 상호 TLS를 구성합니다.` },
    { k:'E', en:`Upload the root private certificate authority (CA) certificate to an Amazon S3 bucket. Configure the API Gateway mutual TLS to use the private CA certificate that is stored in the S3 bucket as the trust store.`, ko:`루트 개인 인증 기관(CA) 인증서를 Amazon S3 버킷에 업로드합니다. S3 버킷에 저장된 개인 CA 인증서를 신뢰 저장소로 사용하도록 API Gateway 상호 TLS를 구성합니다.` },
  ],
  answer: ['A','E'],
  vote: '79% AE',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>

<p><span class="mark-ok">✅ E — 핵심 이유</span></p>

  wrong: `<p><span class="mark-no">❌ B</span> — 공개 CA는 내부 팀 전용 시나리오에 불필요합니다.</p>

<p><span class="mark-no">❌ D</span> — 개인 키를 S3에 업로드하면 보안상 위험합니다. 신뢰 저장소에는 개인 키가 아닌 CA 인증서가 필요합니다.</p>`,
  disc: [{ ans:'AE (79%)', txt:'상호 TLS: ACM Private CA(A) + 루트 CA 인증서를 S3에 업로드하여 신뢰 저장소로 구성(E). AWS 공식 문서 기준.' }]
},
{
  n: 173,
  en: `A company uses AWS Directory Service for Microsoft Active Directory as its identity provider (IdP). The company requires all infrastructure to be defined and deployed by AWS CloudFormation.<br><br>A DevOps engineer needs to create a fleet of Windows-based Amazon EC2 instances to host an application. The DevOps engineer has created a CloudFormation template that contains an EC2 launch template, IAM role, EC2 security group, and EC2 Auto Scaling group. The DevOps engineer must implement a solution that joins all EC2 instances to the domain of the AWS Managed Microsoft AD directory.<br><br>Which solution will meet these requirements with the MOST operational efficiency?`,

  type: 'single',
  choices: [
    { k:'A', en:`In the CloudFormation template, create an AWS::SSM::Document resource that joins the EC2 instance to the AWS Managed Microsoft AD domain by using the parameters for the existing directory. Update the launch template to include the SSMAssociation property to use the new SSM document. Attach the AmazonSSMManagedInstanceCore and AmazonSSMDirectoryServiceAccess AWS managed policies to the IAM role that the EC2 instances use.`, ko:`CloudFormation 템플릿에서 기존 디렉터리의 파라미터를 사용하여 EC2 인스턴스를 AWS Managed Microsoft AD 도메인에 조인하는 AWS::SSM::Document 리소스를 생성합니다. 새 SSM 문서를 사용하도록 시작 템플릿에 SSMAssociation 속성을 포함하도록 업데이트합니다. AmazonSSMManagedInstanceCore 및 AmazonSSMDirectoryServiceAccess AWS 관리형 정책을 EC2 인스턴스가 사용하는 IAM 역할에 연결합니다.` },
    { k:'B', en:`In the CloudFormation template, update the launch template to include specific tags that propagate on launch. Create an AWS::SSM::Association resource to associate the AWS-JoinDirectoryServiceDomain Automation runbook with the EC2 instances that have the specified tags. Define the required parameters to join the AWS Managed Microsoft AD directory. Attach the AmazonSSMManagedInstanceCore and AmazonSSMDirectoryServiceAccess AWS managed policies to the IAM role that the EC2 instances use.`, ko:`CloudFormation 템플릿에서 시작 시 전파되는 특정 태그를 포함하도록 시작 템플릿을 업데이트합니다. AWS-JoinDirectoryServiceDomain Automation 런북을 지정된 태그가 있는 EC2 인스턴스와 연결하는 AWS::SSM::Association 리소스를 생성합니다. AWS Managed Microsoft AD 디렉터리에 가입하는 데 필요한 파라미터를 정의합니다. AmazonSSMManagedInstanceCore 및 AmazonSSMDirectoryServiceAccess AWS 관리형 정책을 EC2 인스턴스가 사용하는 IAM 역할에 연결합니다.` },
    { k:'C', en:`Store the existing AWS Managed Microsoft AD domain connection details in AWS Secrets Manager. In the CloudFormation template, create an AWS::SSM::Association resource to associate the AWS-CreateManagedWindowsInstanceWithApproval Automation runbook with the EC2 Auto Scaling group. Pass the ARNs for the parameters from Secrets Manager to join the domain. Attach the AmazonSSMDirectoryServiceAccess and SecretsManagerReadWrite AWS managed policies to the IAM role that the EC2 instances use.`, ko:`기존 AWS Managed Microsoft AD 도메인 연결 세부 정보를 AWS Secrets Manager에 저장합니다. CloudFormation 템플릿에서 AWS-CreateManagedWindowsInstanceWithApproval Automation 런북을 EC2 Auto Scaling 그룹과 연결하는 AWS::SSM::Association 리소스를 생성합니다. 도메인에 가입하기 위해 Secrets Manager의 파라미터에 대한 ARN을 전달합니다. AmazonSSMDirectoryServiceAccess 및 SecretsManagerReadWrite AWS 관리형 정책을 EC2 인스턴스가 사용하는 IAM 역할에 연결합니다.` },
    { k:'D', en:`Store the existing AWS Managed Microsoft AD domain administrator credentials in AWS Secrets Manager. In the CloudFormation template, update the EC2 launch template to include user data. Configure the user data to pull the administrator credentials from Secrets Manager and to join the AWS Managed Microsoft AD domain. Attach the AmazonSSMManagedInstanceCore and SecretsManagerReadWrite AWS managed policies to the IAM role that the EC2 instances use.`, ko:`기존 AWS Managed Microsoft AD 도메인 관리자 자격 증명을 AWS Secrets Manager에 저장합니다. CloudFormation 템플릿에서 사용자 데이터를 포함하도록 EC2 시작 템플릿을 업데이트합니다. Secrets Manager에서 관리자 자격 증명을 가져와 AWS Managed Microsoft AD 도메인에 가입하도록 사용자 데이터를 구성합니다. AmazonSSMManagedInstanceCore 및 SecretsManagerReadWrite AWS 관리형 정책을 EC2 인스턴스가 사용하는 IAM 역할에 연결합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>

<p><span class="mark-no">❌ C</span> — AWS-CreateManagedWindowsInstanceWithApproval은 도메인 조인이 아닌 Windows 인스턴스 생성을 위한 런북입니다.</p>
<p><span class="mark-no">❌ D</span> — 사용자 데이터로 도메인 가입을 처리하는 것은 SSM Automation보다 운영 효율성이 낮습니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'AWS-JoinDirectoryServiceDomain 런북 + SSM Association + 태그 기반 연결 + 올바른 IAM 정책이 표준 패턴.' }]

    { k:'D', en:`Create a new SCP that allows all actions for Amazon EC2. Attach the SCP to the root OU.`, ko:`Amazon EC2에 대한 모든 작업을 허용하는 새 SCP를 생성합니다. SCP를 루트 OU에 연결합니다.` },

  type: 'single',

    { k:'B', en:`Configure an Amazon EventBridge rule to receive new AMI events from Image Builder. Target an AWS Lambda function that updates the launch templates of the Auto Scaling groups with the newest AMI ID.`, ko:`Amazon EventBridge 규칙을 구성하여 Image Builder에서 새 AMI 이벤트를 수신합니다. 최신 AMI ID로 Auto Scaling 그룹의 시작 템플릿을 업데이트하는 AWS Lambda 함수를 대상으로 합니다.` },

  vote: '60% D',
  explain: `<p><span class="mark-ok">✅ D — 핵심 이유</span></p>
<p>EC2 Image Builder의 <strong>배포 설정(distribution settings)</strong>에는 새 AMI가 빌드될 때 시작 템플릿을 자동으로 업데이트하는 기능이 내장되어 있습니다. Auto Scaling 그룹을 "최신 버전"을 사용하도록 구성하면 새 AMI로 자동 업데이트됩니다. 추가 서비스(Lambda, EventBridge) 없이 Image Builder 기능만으로 구현되므로 운영 효율성이 가장 높습니다.</p>`,

<p><span class="mark-no">❌ B</span> — Lambda + EventBridge는 추가 구성 요소가 필요하여 운영 오버헤드가 증가합니다.</p>
