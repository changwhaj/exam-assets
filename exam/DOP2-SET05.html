    { k:'C', en:`On all the S3 buckets, configure resource-based policies that allow only the new range of IP addresses to access the S3 buckets. Create a new SCP that denies access to the S3 buckets. Attach the SCP to the two OUs.`, ko:`모든 S3 버킷에서 새 IP 주소 범위만 S3 버킷에 액세스할 수 있도록 허용하는 리소스 기반 정책을 구성합니다. S3 버킷에 대한 액세스를 거부하는 새 SCP를 만듭니다. SCP를 두 OU에 연결합니다.` },
    { k:'D', en:`On all the S3 buckets, configure resource-based policies that allow only the new range of IP addresses to access the S3 buckets. Set a permissions boundary for the OrganizationAccountAccessRole role in the two OUs to deny access to the S3 buckets.`, ko:`모든 S3 버킷에서 새 IP 주소 범위만 S3 버킷에 액세스할 수 있도록 허용하는 리소스 기반 정책을 구성합니다. 두 OU에서 OrganizationAccountAccessRole 역할에 대한 권한 경계를 설정하여 S3 버킷에 대한 액세스를 거부합니다.` },
  ],
  answer: ['C'],
  vote: '94% C',
  explain: `<p><span class="mark-ok">✅ C — S3 리소스 기반 정책으로 IP 업데이트 + SCP로 두 OU 차단</span></p><p>두 가지 요구 사항을 각각 적합한 도구로 해결합니다. IP 범위 변경은 S3 버킷 정책(리소스 기반 정책)을 통해 직접 적용하는 것이 가장 정확합니다. 두 OU에 대한 권한 취소는 SCP를 해당 OU에 연결하여 S3 버킷 액세스를 거부합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A, B</span> — SCP는 S3 버킷에 대한 IP 기반 허용 정책을 효과적으로 적용할 수 없습니다. SCP의 Allow 문은 권한을 부여하지 않으며, IP 기반 S3 접근 제어는 버킷 정책으로 구현해야 합니다.</p><p><span class="mark-no">❌ D</span> — 권한 경계는 IAM 역할의 최대 권한을 설정하는 것으로, 리소스 기반 정책(S3 버킷 정책)을 통한 직접 액세스를 차단하지 못합니다.</p>`,
  disc: [{ ans:'C (94%)', txt:'S3 IP 접근 제어 = 버킷 정책(리소스 기반), OU 차단 = SCP. 두 도구의 올바른 조합.' }]
},
{
  n: 222,
  en: `A company has started using AWS across several teams. Each team has multiple accounts and unique security profiles. The company manages the accounts in an organization in AWS Organizations. Each account has its own configuration and security controls.<br><br>The company's DevOps team wants to use preventive and detective controls to govern all accounts. The DevOps team needs to ensure the security of accounts now and in the future as the company creates new accounts in the organization.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 여러 팀에서 AWS를 사용하기 시작했습니다. 각 팀에는 여러 계정과 고유한 보안 프로필이 있습니다. 이 회사는 AWS Organizations의 조직에서 계정을 관리합니다. 각 계정에는 고유한 구성과 보안 제어가 있습니다.<br><br>이 회사의 DevOps 팀은 예방적(preventive) 및 탐지적(detective) 컨트롤을 사용하여 모든 계정을 관리하려고 합니다. DevOps 팀은 현재와 미래에 회사가 조직에 새 계정을 만들 때 계정의 보안을 보장해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use Organizations to create OUs that have appropriate SCPs attached for each team. Place team accounts in the appropriate OUs to apply security controls. Create any new team accounts in the appropriate OUs.`, ko:`Organizations를 사용하여 각 팀에 적합한 SCP가 연결된 OU를 만듭니다. 보안 제어를 적용하려면 적절한 OU에 팀 계정을 배치합니다. 적절한 OU에 새 팀 계정을 만듭니다.` },
    { k:'B', en:`Create an AWS Control Tower landing zone. Configure OUs and appropriate controls in AWS Control Tower for the existing teams. Configure trusted access for AWS Control Tower. Enroll the existing accounts in the appropriate OUs that match the appropriate security policies for each team. Use AWS Control Tower to provision any new accounts.`, ko:`AWS Control Tower 랜딩 존을 만듭니다. 기존 팀에 대한 AWS Control Tower에서 OU와 적절한 컨트롤을 구성합니다. AWS Control Tower에 대한 신뢰할 수 있는 액세스를 구성합니다. 각 팀의 적절한 보안 정책과 일치하는 적절한 OU에 기존 계정을 등록합니다. AWS Control Tower를 사용하여 모든 새 계정을 프로비저닝합니다.` },
    { k:'C', en:`Create AWS CloudFormation stack sets in the organization's management account. Configure a stack set that deploys AWS Config with configuration rules and remediation actions for all controls to each account in the organization. Update the stack sets to deploy to new accounts as the accounts are created.`, ko:`조직의 관리 계정에서 AWS CloudFormation 스택 세트를 만듭니다. 조직의 각 계정에 모든 컨트롤에 대한 구성 규칙 및 수정 조치와 함께 AWS Config를 배포하는 스택 세트를 구성합니다. 계정이 생성됨에 따라 새 계정에 배포하도록 스택 세트를 업데이트합니다.` },
    { k:'D', en:`Configure AWS Config to manage the AWS Config rules across all AWS accounts in the organization. Deploy conformance packs that provide AWS Config rules and remediation actions across the organization.`, ko:`조직의 모든 AWS 계정에서 AWS Config 규칙을 관리하도록 AWS Config를 구성합니다. 조직 전체에서 AWS Config 규칙과 수정 조치를 제공하는 적합성 팩을 배포합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — AWS Control Tower 랜딩 존 + 컨트롤 구성</span></p><p>AWS Control Tower는 예방적(SCP), 탐지적(AWS Config 규칙), 사전적(CloudFormation 후크) 컨트롤을 통합적으로 제공합니다. 랜딩 존을 설정하면 새 계정 프로비저닝 시 자동으로 기준 보안 제어가 적용되어 현재와 미래의 계정 모두를 일관되게 관리할 수 있습니다. Account Factory를 통해 새 계정을 프로비저닝하면 모든 컨트롤이 자동으로 상속됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — SCP만으로는 예방적 컨트롤만 제공하며 탐지적 컨트롤이 없습니다. 새 계정에 대한 자동 기준선 적용도 보장하지 않습니다.</p><p><span class="mark-no">❌ C, D</span> — CloudFormation StackSets나 Config 적합성 팩은 탐지 컨트롤을 제공하지만, 예방적 컨트롤과 새 계정 자동 기준선 적용을 위한 통합 솔루션이 아닙니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'키워드: 예방+탐지 컨트롤, 신규 계정 자동 적용 = AWS Control Tower의 핵심 기능. (docs.aws.amazon.com/controltower/latest/userguide/controls.html)' }]
},
{
  n: 223,
  en: `A company uses an AWS CodeCommit repository to store its source code and corresponding unit tests. The company has configured an AWS CodePipeline pipeline that includes an AWS CodeBuild project that runs when code is merged to the main branch of the repository.<br><br>The company wants the CodeBuild project to run the unit tests. If the unit tests pass, the CodeBuild project must tag the most recent commit.<br><br>How should the company configure the CodeBuild project to meet these requirements?`,
  ko: `한 회사가 AWS CodeCommit 리포지토리를 사용하여 소스 코드와 해당 단위 테스트를 저장합니다. 이 회사는 리포지토리의 메인 브랜치에 코드가 병합될 때 실행되는 AWS CodeBuild 프로젝트를 포함하는 AWS CodePipeline 파이프라인을 구성했습니다.<br><br>이 회사는 CodeBuild 프로젝트에서 단위 테스트를 실행하기를 원합니다. 단위 테스트가 통과하면 CodeBuild 프로젝트는 가장 최근의 커밋에 태그를 지정해야 합니다.<br><br>이 회사는 이러한 요구 사항을 충족하기 위해 CodeBuild 프로젝트를 어떻게 구성해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure the CodeBuild project to use native Git to clone the CodeCommit repository. Configure the project to run the unit tests. Configure the project to use native Git to create a tag and to push the Git tag to the repository if the code passes the unit tests.`, ko:`네이티브 Git을 사용하여 CodeCommit 리포지토리를 클론하도록 CodeBuild 프로젝트를 구성합니다. 단위 테스트를 실행하도록 프로젝트를 구성합니다. 코드가 단위 테스트를 통과하면 네이티브 Git을 사용하여 태그를 만들고 Git 태그를 리포지토리에 푸시하도록 프로젝트를 구성합니다.` },
    { k:'B', en:`Configure the CodeBuild project to use native Git to clone the CodeCommit repository. Configure the project to run the unit tests. Configure the project to use AWS CLI commands to create a new repository tag in the repository if the code passes the unit tests.`, ko:`네이티브 Git을 사용하여 CodeCommit 리포지토리를 클론하도록 CodeBuild 프로젝트를 구성합니다. 단위 테스트를 실행하도록 프로젝트를 구성합니다. 코드가 단위 테스트를 통과하면 AWS CLI 명령을 사용하여 리포지토리에 새 리포지토리 태그를 만들도록 프로젝트를 구성합니다.` },
    { k:'C', en:`Configure the CodeBuild project to use AWS CLI commands to copy the code from the CodeCommit repository. Configure the project to run the unit tests. Configure the project to use AWS CLI commands to create a new Git tag in the repository if the code passes the unit tests.`, ko:`AWS CLI 명령을 사용하여 CodeCommit 리포지토리에서 코드를 복사하도록 CodeBuild 프로젝트를 구성합니다. 단위 테스트를 실행하도록 프로젝트를 구성합니다. 코드가 단위 테스트를 통과하면 AWS CLI 명령을 사용하여 리포지토리에 새 Git 태그를 생성하도록 프로젝트를 구성합니다.` },
    { k:'D', en:`Configure the CodeBuild project to use AWS CLI commands to copy the code from the CodeCommit repository. Configure the project to run the unit tests. Configure the project to use AWS CLI commands to create a new repository tag in the repository if the code passes the unit tests.`, ko:`AWS CLI 명령을 사용하여 CodeCommit 리포지토리에서 코드를 복사하도록 CodeBuild 프로젝트를 구성합니다. 단위 테스트를 실행하도록 프로젝트를 구성합니다. 코드가 단위 테스트를 통과하면 AWS CLI 명령을 사용하여 리포지토리에 새 리포지토리 태그를 생성하도록 프로젝트를 구성합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 네이티브 Git으로 클론 + Git 태그 생성 및 푸시</span></p><p>네이티브 Git을 사용하여 CodeCommit 리포지토리를 클론하면 전체 Git 기능(태그 생성, 푸시 등)을 사용할 수 있습니다. 단위 테스트 통과 후 <code>git tag</code> 명령으로 태그를 만들고 <code>git push origin &lt;tag&gt;</code>로 리포지토리에 푸시하는 것이 표준 Git 워크플로입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — AWS CLI의 <code>create-tag</code> 명령은 CodeCommit '리포지토리 태그'를 만드는 것으로, Git 태그와 다릅니다. 요건은 커밋에 Git 태그를 지정하는 것입니다.</p><p><span class="mark-no">❌ C, D</span> — AWS CLI로 코드를 '복사'하는 방식은 Git 저장소 컨텍스트가 없어 태그 생성 후 푸시할 수 없습니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'Git 태그 = git tag + git push. 네이티브 Git 클론이 필수. CLI create-tag는 CodeCommit 리소스 태그로 Git 태그와 다름.' }]
},
{
  n: 224,
  en: `A DevOps engineer manages a company's Amazon Elastic Container Service (Amazon ECS) cluster. The cluster runs on several Amazon EC2 instances that are in an Auto Scaling group. The DevOps engineer must implement a solution that logs and reviews all stopped tasks for errors.<br><br>Which solution will meet these requirements?`,
  ko: `DevOps 엔지니어가 회사의 Amazon Elastic Container Service(Amazon ECS) 클러스터를 관리합니다. 클러스터는 Auto Scaling 그룹에 있는 여러 Amazon EC2 인스턴스에서 실행됩니다. DevOps 엔지니어는 중단된 모든 작업을 기록하고 오류를 검토하는 솔루션을 구현해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an Amazon EventBridge rule to capture task state changes. Send the event to Amazon CloudWatch Logs. Use CloudWatch Logs Insights to investigate stopped tasks.`, ko:`작업 상태 변경을 캡처하기 위한 Amazon EventBridge 규칙을 만듭니다. 이벤트를 Amazon CloudWatch Logs로 보냅니다. CloudWatch Logs Insights를 사용하여 중지된 작업을 조사합니다.` },
    { k:'B', en:`Configure tasks to write log data in the embedded metric format. Store the logs in Amazon CloudWatch Logs. Monitor the ContainerInstanceCount metric for changes.`, ko:`임베디드 메트릭 형식으로 로그 데이터를 작성하도록 작업을 구성합니다. Amazon CloudWatch Logs에 로그를 저장합니다. ContainerInstanceCount 메트릭의 변경 사항을 모니터링합니다.` },
    { k:'C', en:`Configure the EC2 instances to store logs in Amazon CloudWatch Logs. Create a CloudWatch Contributor Insights rule that uses the EC2 instance log data. Use the Contributor Insights rule to investigate stopped tasks.`, ko:`Amazon CloudWatch Logs에 로그를 저장하도록 EC2 인스턴스를 구성합니다. EC2 인스턴스 로그 데이터를 사용하는 CloudWatch Contributor Insights 규칙을 만듭니다. Contributor Insights 규칙을 사용하여 중지된 작업을 조사합니다.` },
    { k:'D', en:`Configure an EC2 Auto Scaling lifecycle hook for the EC2_INSTANCE_TERMINATING scale-in event. Write the SystemEventLog file to Amazon S3. Use Amazon Athena to query the log file for errors.`, ko:`EC2_INSTANCE_TERMINATING 스케일인 이벤트에 대한 EC2 Auto Scaling 라이프사이클 후크를 구성합니다. SystemEventLog 파일을 Amazon S3에 씁니다. Amazon Athena를 사용하여 로그 파일에서 오류를 쿼리합니다.` },
  ],
  answer: ['A'],
  vote: '90% A',
  explain: `<p><span class="mark-ok">✅ A — EventBridge로 ECS 작업 상태 변경 캡처 + CloudWatch Logs Insights</span></p><p>Amazon EventBridge는 ECS 작업 상태 변경 이벤트(예: <code>STOPPED</code>)를 직접 캡처할 수 있습니다. 이벤트를 CloudWatch Logs로 전송하면 CloudWatch Logs Insights를 사용하여 중지 이유, 오류 코드 등을 임시로 쿼리하고 분석할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — ContainerInstanceCount 메트릭은 중지된 작업의 오류를 조사하는 데 관련이 없습니다.</p><p><span class="mark-no">❌ C</span> — Contributor Insights는 상위 기여자를 분석하는 도구로, ECS 작업 중지 오류를 조사하는 데 적합하지 않습니다. 또한 EC2 인스턴스 로그가 아닌 ECS 작업 이벤트를 추적해야 합니다.</p><p><span class="mark-no">❌ D</span> — EC2 인스턴스 종료 이벤트는 ECS 작업 중지와 다르며, S3 + Athena 방식은 불필요하게 복잡합니다.</p>`,
  disc: [{ ans:'A (90%)', txt:'ECS 작업 중지 = EventBridge로 상태 변경 이벤트 캡처 → CloudWatch Logs → Logs Insights로 분석. 표준 패턴.' }]
},
{
  n: 225,
  en: `A company wants to deploy a workload on several hundred Amazon EC2 instances. The company will provision the EC2 instances in an Auto Scaling group by using a launch template.<br><br>The workload will pull files from an Amazon S3 bucket, process the data, and put the results into a different S3 bucket. The EC2 instances must have least-privilege permissions and must use temporary security credentials.<br><br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `한 회사가 수백 개의 Amazon EC2 인스턴스에 워크로드를 배포하려고 합니다. 이 회사는 시작 템플릿을 사용하여 Auto Scaling 그룹에서 EC2 인스턴스를 프로비저닝합니다.<br><br>워크로드는 Amazon S3 버킷에서 파일을 가져오고, 데이터를 처리하고, 결과를 다른 S3 버킷에 넣습니다. EC2 인스턴스는 최소 권한 권한이 있어야 하며 임시 보안 자격 증명을 사용해야 합니다.<br><br>이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Create an IAM role that has the appropriate permissions for S3 buckets. Add the IAM role to an instance profile.`, ko:`S3 버킷에 대한 적절한 권한이 있는 IAM 역할을 생성합니다. 인스턴스 프로필에 IAM 역할을 추가합니다.` },
    { k:'B', en:`Update the launch template to include the IAM instance profile.`, ko:`IAM 인스턴스 프로필을 포함하도록 시작 템플릿을 업데이트합니다.` },
    { k:'C', en:`Create an IAM user that has the appropriate permissions for Amazon S3. Generate a secret key and token.`, ko:`Amazon S3에 대한 적절한 권한이 있는 IAM 사용자를 생성합니다. 비밀 키와 토큰을 생성합니다.` },
    { k:'D', en:`Create a trust anchor and profile. Attach the IAM role to the profile.`, ko:`신뢰 앵커와 프로필을 만듭니다. 프로필에 IAM 역할을 연결합니다.` },
    { k:'E', en:`Update the launch template. Modify the user data to use the new secret key and token.`, ko:`시작 템플릿을 업데이트합니다. 새로운 비밀 키와 토큰을 사용하도록 사용자 데이터를 수정합니다.` },
  ],
  answer: ['A','B'],
  vote: '100% AB',
  explain: `<p><span class="mark-ok">✅ A — IAM 역할 생성 + 인스턴스 프로필 추가</span></p><p>EC2 인스턴스에 S3 접근 권한을 부여하는 IAM 역할을 만들고 인스턴스 프로필에 추가합니다. EC2 인스턴스 프로필을 통한 IAM 역할은 임시 보안 자격 증명(STS 토큰)을 자동으로 제공합니다.</p><p><span class="mark-ok">✅ B — 시작 템플릿에 인스턴스 프로필 포함</span></p><p>시작 템플릿에 IAM 인스턴스 프로필을 지정하면 Auto Scaling 그룹에서 시작되는 모든 EC2 인스턴스에 자동으로 IAM 역할이 연결됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ C</span> — IAM 사용자의 장기 자격 증명(액세스 키)을 사용하는 것은 임시 보안 자격 증명 요건을 위반하며 보안 위험이 있습니다.</p><p><span class="mark-no">❌ D</span> — 신뢰 앵커(Trust Anchor)는 IAM Roles Anywhere 서비스와 관련된 것으로, EC2 인스턴스의 IAM 역할 연결과 다릅니다.</p><p><span class="mark-no">❌ E</span> — 사용자 데이터에 비밀 키를 저장하는 것은 심각한 보안 위험이며, 임시 자격 증명이 아닙니다.</p>`,
  disc: [{ ans:'AB (100%)', txt:'EC2 + S3 최소 권한 + 임시 자격 증명의 표준 패턴 = IAM 역할 → 인스턴스 프로필 → 시작 템플릿.' }]
},
{
  n: 226,
  en: `A company is using AWS CodeDeploy to automate software deployment. The deployment must meet these requirements:<br><br>• A number of instances must be available to serve traffic during the deployment. Traffic must be balanced across those instances, and the instances must automatically heal in the event of failure. • A new fleet of instances must be launched for deploying a new revision automatically, with no manual provisioning.<br>• Traffic must be rerouted to the new environment to half of the new instances at a time. The deployment should succeed if traffic is rerouted to at least half of the instances; otherwise, it should fail.<br>• Before routing traffic to the new fleet of instances, the temporary files generated during the deployment process must be deleted.<br>• At the end of a successful deployment, the original instances in the deployment group must be deleted immediately to reduce costs.<br><br>How can a DevOps engineer meet these requirements?`,
  ko: `한 회사에서 AWS CodeDeploy를 사용하여 소프트웨어 배포를 자동화하고 있습니다. 배포는 다음 요구 사항을 충족해야 합니다.<br><br>• 배포 중에 트래픽을 처리할 수 있는 여러 인스턴스가 있어야 합니다. 트래픽은 해당 인스턴스 간에 균형을 이루어야 하며, 장애 발생 시 인스턴스가 자동으로 복구되어야 합니다. • 수동 프로비저닝 없이 새 개정판을 자동으로 배포하기 위해 새 인스턴스 플릿을 시작해야 합니다.<br>• 트래픽은 한 번에 새 인스턴스의 절반으로 새 환경으로 다시 라우팅해야 합니다. 트래픽이 인스턴스의 절반 이상으로 다시 라우팅되면 배포가 성공해야 합니다. 그렇지 않으면 실패해야 합니다.<br>• 새 인스턴스 플릿으로 트래픽을 라우팅하기 전에 배포 프로세스 중에 생성된 임시 파일을 삭제해야 합니다.<br>• 배포가 성공적으로 끝나면 비용을 줄이기 위해 배포 그룹의 원래 인스턴스를 즉시 삭제해야 합니다.<br><br>DevOps 엔지니어는 이러한 요구 사항을 어떻게 충족할 수 있습니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use an Application Load Balancer and an in-place deployment. Associate the Auto Scaling group with the deployment group. Use the Automatically copy Auto Scaling group option, and use CodeDeployDefault.OneAtAtime as the deployment configuration. Instruct AWS CodeDeploy to terminate the original instances in the deployment group, and use the AllowTraffic hook within appspec.yml to delete the temporary files.`, ko:`Application Load Balancer와 인플레이스 배포를 사용합니다. 배포 그룹과 Auto Scaling 그룹을 연결합니다. Automatically copy Auto Scaling group 옵션을 사용하고 CodeDeployDefault.OneAtAtime을 배포 구성으로 사용합니다. AWS CodeDeploy에 배포 그룹의 원래 인스턴스를 종료하도록 지시하고 appspec.yml 내의 AllowTraffic 후크를 사용하여 임시 파일을 삭제합니다.` },
    { k:'B', en:`Use an Application Load Balancer and a blue/green deployment. Associate the Auto Scaling group and Application Load Balancer target group with the deployment group. Use the Automatically copy Auto Scaling group option, create a custom deployment configuration with minimum healthy hosts defined as 50%, and assign the configuration to the deployment group. Instruct AWS CodeDeploy to terminate the original instances in the deployment group, and use the BeforeBlockTraffic hook within appspec.yml to delete the temporary files.`, ko:`Application Load Balancer와 블루/그린 배포를 사용합니다. 배포 그룹과 Auto Scaling 그룹 및 Application Load Balancer 대상 그룹을 연결합니다. Automatically copy Auto Scaling group 옵션을 사용하고, 최소 정상 호스트를 50%로 정의하는 사용자 지정 배포 구성을 만들고 배포 그룹에 할당합니다. AWS CodeDeploy에 배포 그룹의 원래 인스턴스를 종료하도록 지시하고 appspec.yml 내의 BeforeBlockTraffic 후크를 사용하여 임시 파일을 삭제합니다.` },
    { k:'C', en:`Use an Application Load Balancer and a blue/green deployment. Associate the Auto Scaling group and the Application Load Balancer target group with the deployment group. Use the Automatically copy Auto Scaling group option, and use CodeDeployDefault.HalfAtAtime as the deployment configuration. Instruct AWS CodeDeploy to terminate the original instances in the deployment group, and use the BeforeAllowTraffic hook within appspec.yml to delete the temporary files.`, ko:`Application Load Balancer와 블루/그린 배포를 사용합니다. 배포 그룹과 Auto Scaling 그룹 및 Application Load Balancer 대상 그룹을 연결합니다. Automatically copy Auto Scaling group 옵션을 사용하고 CodeDeployDefault.HalfAtAtime을 배포 구성으로 사용합니다. AWS CodeDeploy에 배포 그룹의 원래 인스턴스를 종료하도록 지시하고 appspec.yml 내의 BeforeAllowTraffic 후크를 사용하여 임시 파일을 삭제합니다.` },
    { k:'D', en:`Use an Application Load Balancer and an in-place deployment. Associate the Auto Scaling group and Application Load Balancer target group with the deployment group. Use the Automatically copy Auto Scaling group option, and use CodeDeployDefault.AllAtOnce as a deployment configuration. Instruct AWS CodeDeploy to terminate the original instances in the deployment group, and use the BlockTraffic hook within appspec.yml to delete the temporary files.`, ko:`Application Load Balancer와 인플레이스 배포를 사용합니다. 배포 그룹과 Auto Scaling 그룹 및 Application Load Balancer 대상 그룹을 연결합니다. Automatically copy Auto Scaling group 옵션을 사용하고 CodeDeployDefault.AllAtOnce를 배포 구성으로 사용합니다. AWS CodeDeploy에 배포 그룹의 원래 인스턴스를 종료하도록 지시하고 appspec.yml 내의 BlockTraffic 후크를 사용하여 임시 파일을 삭제합니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — 블루/그린 + ALB + HalfAtATime + BeforeAllowTraffic 후크</span></p><ul><li><strong>블루/그린 배포</strong>: 새 인스턴스 플릿 자동 시작(Automatically copy Auto Scaling group) 요건 충족</li><li><strong>ALB + Auto Scaling 연결</strong>: 트래픽 균형 및 자동 복구 요건 충족</li><li><strong>CodeDeployDefault.HalfAtAtime</strong>: 한 번에 절반씩 트래픽 전환, 절반 이상 성공 시 성공 요건 충족</li><li><strong>BeforeAllowTraffic 후크</strong>: 트래픽 허용 전 임시 파일 삭제 요건 충족</li><li><strong>원래 인스턴스 즉시 종료</strong>: 비용 절감 요건 충족</li></ul>`,
  wrong: `<p><span class="mark-no">❌ A, D</span> — 인플레이스 배포는 새 인스턴스 플릿을 시작하지 않으며, 원래 인스턴스 삭제와 맞지 않습니다.</p><p><span class="mark-no">❌ B</span> — BeforeBlockTraffic 후크는 기존 인스턴스에서 트래픽을 차단하기 전에 실행되는 것으로, 새 인스턴스로 트래픽 허용 전 임시 파일 삭제를 위한 올바른 타이밍이 아닙니다.</p>`,
  disc: [{ ans:'C (100%)', txt:'블루/그린 + HalfAtATime + BeforeAllowTraffic이 모든 요건(새 플릿, 절반 라우팅, 트래픽 전 정리, 즉시 종료)을 정확히 충족.' }]
},
{
  n: 227,
  en: `A company needs to adopt a multi-account strategy to deploy its applications and the associated CI/CD infrastructure. The company has created an organization in AWS Organizations that has all features enabled. The company has configured AWS Control Tower and has set up a landing zone.<br><br>The company needs to use AWS Control Tower controls (guardrails) in all AWS accounts in the organization. The company must create the accounts for a multi-environment application and must ensure that all accounts are configured to an initial baseline.<br><br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `한 회사에서 애플리케이션과 관련 CI/CD 인프라를 배포하기 위해 다중 계정 전략을 채택해야 합니다. 이 회사는 모든 기능이 활성화된 AWS Organizations에서 조직을 만들었습니다. 이 회사는 AWS Control Tower를 구성하고 랜딩 존을 설정했습니다.<br><br>이 회사는 조직의 모든 AWS 계정에서 AWS Control Tower 컨트롤(가드레일)을 사용해야 합니다. 이 회사는 다중 환경 애플리케이션에 대한 계정을 만들어야 하며 모든 계정이 초기 기준선에 맞게 구성되었는지 확인해야 합니다.<br><br>어떤 솔루션이 최소한의 운영 오버헤드로 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an AWS Control Tower Account Factory Customization (AFC) blueprint that uses the baseline configuration. Use AWS Control Tower Account Factory to provision a dedicated AWS account for each environment and a CI/CD account by using the blueprint.`, ko:`기준 구성을 사용하는 AWS Control Tower Account Factory Customization(AFC) 블루프린트를 만듭니다. AWS Control Tower Account Factory를 사용하여 블루프린트를 통해 각 환경에 대한 전용 AWS 계정과 CI/CD 계정을 프로비저닝합니다.` },
    { k:'B', en:`Use AWS Control Tower Account Factory to provision a dedicated AWS account for each environment and a CI/CD account. Use AWS CloudFormation StackSets to apply the baseline configuration to the new accounts.`, ko:`AWS Control Tower Account Factory를 사용하여 각 환경에 대한 전용 AWS 계정과 CI/CD 계정을 프로비저닝합니다. AWS CloudFormation StackSets를 사용하여 기준 구성을 새 계정에 적용합니다.` },
    { k:'C', en:`Use Organizations to provision a multi-environment AWS account and a CI/CD account. In the Organizations management account, create an AWS Lambda function that assumes the Organizations access role to apply the baseline configuration to the new accounts.`, ko:`Organizations를 사용하여 다중 환경 AWS 계정과 CI/CD 계정을 프로비저닝합니다. Organizations 관리 계정에서 Organizations 액세스 역할을 수임하여 새 계정에 기준 구성을 적용하는 AWS Lambda 함수를 만듭니다.` },
    { k:'D', en:`Use Organizations to provision a dedicated AWS account for each environment, an audit account, and a CI/CD account. Use AWS CloudFormation StackSets to apply the baseline configuration to the new accounts.`, ko:`Organizations를 사용하여 각 환경에 대한 전용 AWS 계정, 감사 계정 및 CI/CD 계정을 프로비저닝합니다. AWS CloudFormation StackSets를 사용하여 기준 구성을 새 계정에 적용합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — AFC 블루프린트 + Account Factory</span></p><p>AWS Control Tower Account Factory Customization(AFC) 블루프린트를 사용하면 초기 기준선 구성을 코드로 정의하고, Account Factory로 계정을 프로비저닝할 때 블루프린트가 자동으로 적용됩니다. Control Tower 컨트롤(가드레일)도 자동으로 상속되어 운영 오버헤드가 최소화됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — Account Factory만 사용하고 별도로 StackSets를 관리하는 것은 A보다 더 많은 운영 오버헤드가 필요합니다.</p><p><span class="mark-no">❌ C, D</span> — Organizations + Lambda 또는 StackSets 방식은 Control Tower의 기본 기능을 활용하지 않아 복잡성이 높습니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'AFC 블루프린트 = 기준선 구성 자동화의 핵심. Control Tower + Account Factory 조합이 최소 운영 오버헤드로 가드레일+기준선 자동 적용.' }]
},
{
  n: 228,
  en: `A DevOps team has created a Custom Lambda rule in AWS Config. The rule monitors Amazon Elastic Container Repository (Amazon ECR) policy statements for ecr:* actions. When a noncompliant repository is detected, Amazon EventBridge uses Amazon Simple Notification Service (Amazon SNS) to route the notification to a security team.<br><br>When the custom AWS Config rule is evaluated, the AWS Lambda function fails to run.<br><br>Which solution will resolve the issue?`,
  ko: `DevOps 팀이 AWS Config에서 사용자 지정 Lambda 규칙을 만들었습니다. 이 규칙은 Amazon Elastic Container Repository(Amazon ECR) 정책 문에서 <code>ecr:*</code> 작업을 모니터링합니다. 규정을 준수하지 않는 리포지토리가 감지되면 Amazon EventBridge는 Amazon Simple Notification Service(Amazon SNS)를 사용하여 보안 팀으로 알림을 라우팅합니다.<br><br>사용자 지정 AWS Config 규칙이 평가되면 AWS Lambda 함수가 실행되지 않습니다.<br><br>어떤 솔루션으로 이 문제를 해결할 수 있을까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Modify the Lambda function's resource policy to grant AWS Config permission to invoke the function.`, ko:`Lambda 함수의 리소스 정책을 수정하여 AWS Config가 해당 함수를 호출할 수 있는 권한을 부여합니다.` },
    { k:'B', en:`Modify the SNS topic policy to include configuration changes for EventBridge to publish to the SNS topic.`, ko:`EventBridge가 SNS 토픽에 게시할 수 있도록 구성 변경 사항을 포함하도록 SNS 토픽 정책을 수정합니다.` },
    { k:'C', en:`Modify the Lambda function's execution role to include configuration changes for custom AWS Config rules.`, ko:`사용자 지정 AWS Config 규칙에 대한 구성 변경 사항을 포함하도록 Lambda 함수의 실행 역할을 수정합니다.` },
    { k:'D', en:`Modify all the ECR repository policies to grant AWS Config access to the necessary ECR API actions.`, ko:`모든 ECR 리포지토리 정책을 수정하여 AWS Config에 필요한 ECR API 작업에 대한 액세스 권한을 부여합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — Lambda 리소스 정책에 AWS Config 호출 권한 부여</span></p><p>AWS Config 사용자 지정 규칙에서 Lambda 함수를 사용할 때, Lambda 함수의 리소스 기반 정책(resource policy)에 <code>config.amazonaws.com</code> 서비스 주체가 <code>lambda:InvokeFunction</code>을 호출할 수 있도록 허용해야 합니다. 이 권한이 없으면 AWS Config가 Lambda 함수를 호출할 수 없어 규칙 평가가 실패합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — SNS 토픽 정책 수정은 Config→Lambda 호출 실패와 무관합니다. 이는 EventBridge→SNS 알림 경로의 문제입니다.</p><p><span class="mark-no">❌ C</span> — Lambda 실행 역할은 Lambda 함수가 다른 AWS 서비스에 접근하는 권한을 정의합니다. Config의 Lambda 호출을 허용하는 것은 Lambda 리소스 정책(A)으로 해결해야 합니다.</p><p><span class="mark-no">❌ D</span> — ECR 리포지토리 정책 수정은 Config의 Lambda 호출 권한과 무관합니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'Config 사용자 지정 규칙에서 Lambda가 실행되지 않는 원인 = Lambda 리소스 정책에 config.amazonaws.com 호출 권한 부재.' }]
},
{
  n: 229,
  en: `A developer is creating a proof of concept for a new software as a service (SaaS) application. The application is in a shared development AWS account that is part of an organization in AWS Organizations.<br><br>The developer needs to create service-linked IAM roles for the AWS services that are being considered for the proof of concept. The solution needs to give the developer the ability to create and configure the service-linked roles only.<br><br>Which solution will meet these requirements?`,
  ko: `개발자가 새로운 SaaS(Software as a Service) 애플리케이션에 대한 개념 증명을 만들고 있습니다. 애플리케이션은 AWS Organizations의 조직에 속하는 공유 개발 AWS 계정에 있습니다.<br><br>개발자는 개념 증명을 위해 고려 중인 AWS 서비스에 대한 서비스 연결 IAM 역할을 만들어야 합니다. 솔루션은 개발자에게 서비스 연결 역할만 만들고 구성할 수 있는 기능을 제공해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an IAM user for the developer in the organization's management account. Configure a cross-account role in the development account for the developer to use. Limit the scope of the cross-account role to common services.`, ko:`조직의 관리 계정에서 개발자를 위한 IAM 사용자를 만듭니다. 개발자가 사용할 수 있도록 개발 계정에서 교차 계정 역할을 구성합니다. 교차 계정 역할의 범위를 공통 서비스로 제한합니다.` },
    { k:'B', en:`Add the developer to an IAM group. Attach the PowerUserAccess managed policy to the IAM group. Enforce multi-factor authentication (MFA) on the user account.`, ko:`개발자를 IAM 그룹에 추가합니다. PowerUserAccess 관리형 정책을 IAM 그룹에 연결합니다. 사용자 계정에 다중 요소 인증(MFA)을 적용합니다.` },
    { k:'C', en:`Add an SCP to the development account in Organizations. Configure the SCP with a Deny rule for iam:* to limit the developer's access.`, ko:`Organizations에서 개발 계정에 SCP를 추가합니다. 개발자의 액세스를 제한하기 위해 <code>iam:*</code>에 대한 Deny 규칙으로 SCP를 구성합니다.` },
    { k:'D', en:`Create an IAM role that has the necessary IAM access to allow the developer to create policies and roles. Create and attach a permissions boundary to the role. Grant the developer access to assume the role.`, ko:`개발자가 정책과 역할을 만들 수 있도록 필요한 IAM 액세스 권한이 있는 IAM 역할을 만듭니다. 역할에 권한 경계를 만들고 연결합니다. 개발자에게 역할을 수임할 수 있는 액세스 권한을 부여합니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — 권한 경계가 있는 IAM 역할 + 역할 수임</span></p><p>권한 경계(Permissions Boundary)를 사용하면 IAM 역할이 가질 수 있는 최대 권한을 제한할 수 있습니다. 개발자가 서비스 연결 역할만 만들고 구성할 수 있도록 권한 경계를 설정하면 개발자가 의도된 범위를 초과하는 역할을 만드는 것을 방지합니다. 이것이 최소 권한 원칙을 준수하는 방법입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 관리 계정 IAM 사용자 + 교차 계정 역할은 불필요한 복잡성을 추가합니다.</p><p><span class="mark-no">❌ B</span> — PowerUserAccess는 서비스 연결 역할 생성 이상의 광범위한 권한을 부여합니다. 최소 권한 원칙에 위배됩니다.</p><p><span class="mark-no">❌ C</span> — SCP는 권한을 부여하지 않고 제한만 합니다. <code>iam:*</code> 거부는 서비스 연결 역할 생성도 차단합니다.</p>`,
  disc: [{ ans:'D (100%)', txt:'권한 경계 = 개발자가 서비스 연결 역할 생성 권한을 갖되 과도한 권한을 부여하지 못하도록 제한. 최소 권한 원칙의 핵심 메커니즘.' }]
},
{
  n: 230,
  en: `A company uses AWS Organizations to manage its AWS accounts. The company wants its monitoring system to receive an alert when a root user logs in. The company also needs a dashboard to display any log activity that the root user generates.<br><br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `한 회사가 AWS Organizations를 사용하여 AWS 계정을 관리합니다. 이 회사는 루트 사용자가 로그인할 때 모니터링 시스템에 알림을 받고 싶어합니다. 또한 이 회사는 루트 사용자가 생성하는 모든 로그 활동을 표시하는 대시보드가 필요합니다.<br><br>이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Enable AWS Config with a multi-account aggregator. Configure log forwarding to Amazon CloudWatch Logs.`, ko:`다중 계정 애그리게이터로 AWS Config를 활성화합니다. Amazon CloudWatch Logs로 로그 전달을 구성합니다.` },
    { k:'B', en:`Create an Amazon QuickSight dashboard that uses an Amazon CloudWatch Logs query.`, ko:`Amazon CloudWatch Logs 쿼리를 사용하는 Amazon QuickSight 대시보드를 만듭니다.` },
    { k:'C', en:`Create an Amazon CloudWatch Logs metric filter to match root user login events. Configure a CloudWatch alarm and an Amazon Simple Notification Service (Amazon SNS) topic to send alerts to the company's monitoring system.`, ko:`루트 사용자 로그인 이벤트와 일치하도록 Amazon CloudWatch Logs 메트릭 필터를 만듭니다. CloudWatch 알람과 Amazon Simple Notification Service(Amazon SNS) 토픽을 구성하여 회사 모니터링 시스템에 알림을 보냅니다.` },
    { k:'D', en:`Create an Amazon CloudWatch Logs subscription filter to match root user login events. Configure the filter to forward events to an Amazon Simple Notification Service (Amazon SNS) topic. Configure the SNS topic to send alerts to the company's monitoring system.`, ko:`루트 사용자 로그인 이벤트와 일치하도록 Amazon CloudWatch Logs 구독 필터를 만듭니다. SNS 토픽으로 이벤트를 전달하도록 필터를 구성합니다. 회사의 모니터링 시스템으로 알림을 보내도록 SNS 토픽을 구성합니다.` },
    { k:'E', en:`Create an AWS CloudTrail organization trail. Configure the organization trail to send events to Amazon CloudWatch Logs.`, ko:`AWS CloudTrail 조직 트레일을 만듭니다. 조직 트레일을 구성하여 Amazon CloudWatch Logs로 이벤트를 보냅니다.` },
    { k:'F', en:`Create an Amazon CloudWatch dashboard that uses a CloudWatch Logs Insights query.`, ko:`CloudWatch Logs Insights 쿼리를 사용하는 Amazon CloudWatch 대시보드를 만듭니다.` },
  ],
  answer: ['C','E','F'],
  vote: '100% CEF',
  explain: `<p><span class="mark-ok">✅ E — CloudTrail 조직 트레일 → CloudWatch Logs</span></p><p>조직 트레일을 만들면 조직의 모든 계정에서 루트 사용자 로그인을 포함한 모든 이벤트가 캡처됩니다. 이를 CloudWatch Logs로 전송하여 중앙에서 분석합니다.</p><p><span class="mark-ok">✅ C — 메트릭 필터 + CloudWatch 알람 + SNS</span></p><p>CloudWatch Logs의 메트릭 필터로 루트 사용자 로그인 이벤트 패턴을 감지하고, 알람이 트리거되면 SNS를 통해 모니터링 시스템에 알림을 보냅니다.</p><p><span class="mark-ok">✅ F — CloudWatch Logs Insights 쿼리 + 대시보드</span></p><p>CloudWatch Logs Insights 쿼리를 CloudWatch 대시보드에 추가하여 루트 사용자 활동 로그를 시각화합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — AWS Config는 리소스 구성 변경을 모니터링하며, 루트 사용자 로그인 이벤트 캡처에는 적합하지 않습니다. CloudTrail(E)이 올바른 도구입니다.</p><p><span class="mark-no">❌ B</span> — Amazon QuickSight는 비즈니스 인텔리전스 도구로, CloudWatch Logs를 직접 쿼리하지 않습니다. CloudWatch 대시보드(F)가 더 간단합니다.</p><p><span class="mark-no">❌ D</span> — 구독 필터는 로그를 실시간으로 Lambda나 Elasticsearch로 스트리밍하는 데 사용되며, 알람 기반 알림(C)이 더 적합합니다.</p>`,
  disc: [{ ans:'CEF (100%)', txt:'루트 로그인 모니터링: E(CloudTrail→Logs) → C(메트릭 필터+알람→SNS) → F(대시보드). 3단계 조합이 모든 요건 충족.' }]
},
{
  n: 231,
  en: `A company uses AWS Organizations to manage its AWS accounts. A DevOps engineer must ensure that all users who access the AWS Management Console are authenticated through the company's corporate identity provider (IdP).<br><br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `한 회사가 AWS Organizations를 사용하여 AWS 계정을 관리합니다. DevOps 엔지니어는 AWS Management Console에 액세스하는 모든 사용자가 회사의 기업 ID 공급자(IdP)를 통해 인증되었는지 확인해야 합니다.<br><br>이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Use Amazon GuardDuty with a delegated administrator account. Use GuardDuty to enforce denial of IAM user logins.`, ko:`위임된 관리자 계정으로 Amazon GuardDuty를 사용합니다. GuardDuty를 사용하여 IAM 사용자 로그인 거부를 시행합니다.` },
    { k:'B', en:`Use AWS IAM Identity Center to configure identity federation with SAML 2.0.`, ko:`AWS IAM Identity Center를 사용하여 SAML 2.0으로 ID 페더레이션을 구성합니다.` },
    { k:'C', en:`Create a permissions boundary in AWS IAM Identity Center to deny password logins for IAM users.`, ko:`AWS IAM Identity Center에서 권한 경계를 만들어 IAM 사용자의 비밀번호 로그인을 거부합니다.` },
    { k:'D', en:`Create IAM groups in the Organizations management account to apply consistent permissions for all IAM users.`, ko:`조직 관리 계정에서 IAM 그룹을 만들어 모든 IAM 사용자에게 일관된 권한을 적용합니다.` },
    { k:'E', en:`Create an SCP in Organizations to deny password creation for IAM users.`, ko:`조직에서 SCP를 만들어 IAM 사용자의 비밀번호 생성을 거부합니다.` },
  ],
  answer: ['B','E'],
  vote: '86% BE',
  explain: `<p><span class="mark-ok">✅ B — IAM Identity Center + SAML 2.0 페더레이션</span></p><p>AWS IAM Identity Center에서 SAML 2.0으로 기업 IdP와의 ID 페더레이션을 구성하면 모든 사용자가 콘솔 접근 시 기업 IdP를 통해 인증됩니다.</p><p><span class="mark-ok">✅ E — SCP로 IAM 사용자 비밀번호 생성 거부</span></p><p><code>iam:CreateLoginProfile</code> 및 <code>iam:UpdateLoginProfile</code> 작업을 거부하는 SCP를 적용하면 IAM 사용자 자격 증명으로는 콘솔에 로그인할 수 없어 모든 사용자가 IdP를 통해 인증해야 합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — GuardDuty는 보안 위협 탐지 서비스로, 콘솔 로그인 방법을 제어하지 않습니다.</p><p><span class="mark-no">❌ C</span> — 권한 경계는 IAM 엔티티가 가질 수 있는 최대 권한을 정의하는 것으로, 로그인 방법(비밀번호 로그인)을 직접 제어하지 않습니다.</p><p><span class="mark-no">❌ D</span> — IAM 그룹은 권한을 관리하는 것으로, 인증 방법을 제어하지 않습니다.</p>`,
  disc: [{ ans:'BE (86%)', txt:'B로 IdP 페더레이션 설정 + E로 IAM 비밀번호 생성 차단 = 모든 콘솔 접근이 IdP 경유 강제. SCP 예시: iam:CreateLoginProfile, iam:UpdateLoginProfile 거부.' }]
},
{
  n: 232,
  en: `A company has deployed a new platform that runs on Amazon Elastic Kubernetes Service (Amazon EKS). The new platform hosts web applications that users frequently update. The application developers build the Docker images for the applications and deploy the Docker images manually to the platform.<br><br>The platform usage has increased to more than 500 users every day. Frequent updates, building the updated Docker images for the applications, and deploying the Docker images on the platform manually have all become difficult to manage.<br><br>The company needs to receive an Amazon Simple Notification Service (Amazon SNS) notification if Docker image scanning returns any HIGH or CRITICAL findings for operating system or programming language package vulnerabilities.<br><br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `한 회사가 Amazon Elastic Kubernetes Service(Amazon EKS)에서 실행되는 새로운 플랫폼을 배포했습니다. 새로운 플랫폼은 사용자가 자주 업데이트하는 웹 애플리케이션을 호스팅합니다. 애플리케이션 개발자는 애플리케이션의 Docker 이미지를 빌드하고 플랫폼에 수동으로 배포합니다.<br><br>플랫폼 사용량은 매일 500명 이상의 사용자로 증가했습니다. 빈번한 업데이트, 업데이트된 Docker 이미지 빌드, 수동 배포 모두 관리하기 어려워졌습니다.<br><br>Docker 이미지 스캐닝에서 운영 체제 또는 프로그래밍 언어 패키지 취약성에 대한 HIGH 또는 CRITICAL 결과가 반환되면 회사는 Amazon SNS 알림을 받아야 합니다.<br><br>이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Create an AWS CodeCommit repository to store the Dockerfile and Kubernetes deployment files. Create a pipeline in AWS CodePipeline. Use an Amazon S3 event to invoke the pipeline when a newer version of the Dockerfile is committed. Add a step to the pipeline to initiate the AWS CodeBuild project.`, ko:`Dockerfile 및 Kubernetes 배포 파일을 저장할 AWS CodeCommit 리포지토리를 만듭니다. AWS CodePipeline에서 파이프라인을 만듭니다. Dockerfile의 새 버전이 커밋될 때 파이프라인을 호출하는 Amazon S3 이벤트를 사용합니다. 파이프라인에 AWS CodeBuild 프로젝트를 시작하는 단계를 추가합니다.` },
    { k:'B', en:`Create an AWS CodeCommit repository to store the Dockerfile and Kubernetes deployment files. Create a pipeline in AWS CodePipeline. Use an Amazon EventBridge event to invoke the pipeline when a newer version of the Dockerfile is committed. Add a step to the pipeline to initiate the AWS CodeBuild project.`, ko:`Dockerfile 및 Kubernetes 배포 파일을 저장할 AWS CodeCommit 리포지토리를 만듭니다. AWS CodePipeline에서 파이프라인을 만듭니다. Dockerfile의 새 버전이 커밋될 때 파이프라인을 호출하는 Amazon EventBridge 이벤트를 사용합니다. 파이프라인에 AWS CodeBuild 프로젝트를 시작하는 단계를 추가합니다.` },
    { k:'C', en:`Create an AWS CodeBuild project that builds the Docker images and stores the Docker images in an Amazon Elastic Container Registry (Amazon ECR) repository. Turn on basic scanning for the ECR repository. Create an Amazon EventBridge rule that monitors Amazon GuardDuty events. Configure the EventBridge rule to send an event to an SNS topic when the finding-severity-counts parameter is more than 0 at a CRITICAL or HIGH level.`, ko:`Docker 이미지를 빌드하고 Amazon ECR 리포지토리에 저장하는 AWS CodeBuild 프로젝트를 만듭니다. ECR 리포지토리에 대한 기본 스캐닝을 켭니다. Amazon GuardDuty 이벤트를 모니터링하는 Amazon EventBridge 규칙을 만듭니다. finding-severity-counts 매개변수가 CRITICAL 또는 HIGH 수준에서 0보다 클 때 SNS 토픽에 이벤트를 보내도록 EventBridge 규칙을 구성합니다.` },
    { k:'D', en:`Create an AWS CodeBuild project that builds the Docker images and stores the Docker images in an Amazon Elastic Container Registry (Amazon ECR) repository. Turn on enhanced scanning for the ECR repository. Create an Amazon EventBridge rule that monitors ECR image scan events. Configure the EventBridge rule to send an event to an SNS topic when the finding-severity-counts parameter is more than 0 at a CRITICAL or HIGH level.`, ko:`Docker 이미지를 빌드하고 Amazon ECR 리포지토리에 저장하는 AWS CodeBuild 프로젝트를 만듭니다. ECR 리포지토리에 대한 향상된 스캐닝을 켭니다. ECR 이미지 스캔 이벤트를 모니터링하는 Amazon EventBridge 규칙을 만듭니다. finding-severity-counts 매개변수가 CRITICAL 또는 HIGH 수준에서 0보다 클 때 SNS 토픽에 이벤트를 보내도록 EventBridge 규칙을 구성합니다.` },
    { k:'E', en:`Create an AWS CodeBuild project that scans the Dockerfile. Configure the project to build the Docker images and store the Docker images in an Amazon Elastic Container Registry (Amazon ECR) repository if the scan is successful. Configure an SNS topic to provide notification if the scan returns any vulnerabilities.`, ko:`Dockerfile을 스캔하는 AWS CodeBuild 프로젝트를 만듭니다. 스캔이 성공하면 Docker 이미지를 빌드하고 Amazon ECR 리포지토리에 저장하도록 프로젝트를 구성합니다. 스캔에서 취약점이 반환되면 알림을 제공하도록 SNS 토픽을 구성합니다.` },
  ],
  answer: ['B','D'],
  vote: '100% BD',
  explain: `<p><span class="mark-ok">✅ B — CodeCommit + EventBridge + CodePipeline</span></p><p>CodeCommit 리포지토리에 새 Dockerfile이 커밋될 때 EventBridge 이벤트가 CodePipeline을 트리거하여 자동 빌드·배포를 수행합니다. CodePipeline은 CodeCommit과의 통합에 S3 이벤트가 아닌 EventBridge를 사용합니다.</p><p><span class="mark-ok">✅ D — ECR 향상된 스캐닝 + EventBridge → SNS</span></p><p>ECR의 향상된 스캐닝(Enhanced Scanning)은 Amazon Inspector를 활용하여 OS 및 프로그래밍 언어 패키지 취약성을 모두 탐지합니다. ECR 이미지 스캔 이벤트를 EventBridge 규칙으로 감지하고 HIGH/CRITICAL 발견 시 SNS로 알림을 전송합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CodeCommit → CodePipeline 트리거는 S3 이벤트가 아닌 EventBridge 이벤트를 사용해야 합니다.</p><p><span class="mark-no">❌ C</span> — 기본 스캐닝(Basic Scanning)은 OS 취약성만 탐지하며 프로그래밍 언어 패키지 취약성을 감지하지 못합니다. 또한 GuardDuty 이벤트가 아닌 ECR 스캔 이벤트를 모니터링해야 합니다.</p><p><span class="mark-no">❌ E</span> — Dockerfile 스캔은 이미지 레이어의 취약성을 탐지하지 않으며, SNS 알림 연동이 불완전합니다.</p>`,
  disc: [{ ans:'BD (100%)', txt:'CodeCommit→CodePipeline 트리거 = EventBridge(B). ECR 향상된 스캐닝 = OS+언어 패키지 취약성 모두 탐지(D). 기본 스캐닝은 OS만 탐지.' }]
},
{
  n: 233,
  en: `A company groups its AWS accounts in OUs in an organization in AWS Organizations. The company has deployed a set of Amazon API Gateway APIs in one of the Organizations accounts. The APIs are bound to the account's VPC and have no existing authentication mechanism. Only principals in a specific OU can have permissions to invoke the APIs.<br><br>The company applies a policy to the API Gateway interface VPC endpoint. The company also updates the API Gateway resource policies to deny invocations that do not come through the interface VPC endpoint. After the updates, the following error message appears during attempts to use the interface VPC endpoint URL to invoke an API: "User: anonymous is not authorized."<br><br>Which combination of steps will solve this problem? (Choose two.)`,
  ko: `한 회사가 AWS Organizations의 조직에 있는 OU에서 AWS 계정을 그룹화합니다. 이 회사는 Organizations 계정 중 하나에 Amazon API Gateway API 세트를 배포했습니다. API는 계정의 VPC에 바인딩되어 있으며 기존 인증 메커니즘이 없습니다. 특정 OU의 주체만 API를 호출할 수 있는 권한을 가질 수 있습니다.<br><br>회사는 API Gateway 인터페이스 VPC 엔드포인트에 정책을 적용하고, 인터페이스 VPC 엔드포인트를 통해 들어오지 않는 호출을 거부하도록 API Gateway 리소스 정책을 업데이트합니다. 업데이트 후 인터페이스 VPC 엔드포인트 URL을 사용하여 API를 호출하려고 시도하는 동안 다음 오류 메시지가 나타납니다. "User: anonymous is not authorized."<br><br>이 문제를 해결하는 단계 조합은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Enable IAM authentication on all API methods by setting AWS IAM as the authorization method.`, ko:`AWS IAM을 인증 방법으로 설정하여 모든 API 메서드에서 IAM 인증을 활성화합니다.` },
    { k:'B', en:`Create a token-based AWS Lambda authorizer that passes the caller's identity in a bearer token.`, ko:`호출자의 ID를 베어러 토큰으로 전달하는 토큰 기반 AWS Lambda 권한 부여자를 만듭니다.` },
    { k:'C', en:`Create a request parameter-based AWS Lambda authorizer that passes the caller's identity in a combination of headers, query string parameters, stage variables, and $context variables.`, ko:`헤더, 쿼리 문자열 매개변수, 단계 변수 및 $context 변수를 조합하여 호출자의 ID를 전달하는 요청 매개변수 기반 AWS Lambda 권한 부여자를 만듭니다.` },
    { k:'D', en:`Use Amazon Cognito user pools as the authorizer to control access to the API.`, ko:`Amazon Cognito 사용자 풀을 권한 부여자로 사용하여 API에 대한 액세스를 제어합니다.` },
    { k:'E', en:`Verify the identity of the requester by using Signature Version 4 to sign client requests by using AWS credentials.`, ko:`AWS 자격 증명을 사용하여 Signature Version 4로 클라이언트 요청에 서명하여 요청자의 신원을 확인합니다.` },
  ],
  answer: ['A','E'],
  vote: '92% AE',
  explain: `<p><span class="mark-ok">✅ A — 모든 API 메서드에 IAM 인증 활성화</span></p><p>"User: anonymous" 오류는 인증되지 않은 요청을 의미합니다. IAM 인증을 활성화하면 모든 요청이 AWS IAM 자격 증명으로 인증되어야 하며, VPC 엔드포인트 정책의 OU 조건과 결합하여 특정 OU 주체만 API를 호출할 수 있습니다.</p><p><span class="mark-ok">✅ E — Signature Version 4로 요청 서명</span></p><p>IAM 인증이 활성화된 API를 호출하려면 클라이언트가 AWS 자격 증명으로 Signature Version 4(SigV4)를 사용하여 요청에 서명해야 합니다. 이것이 "anonymous" 오류를 해결하는 방법입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B, C</span> — Lambda 권한 부여자는 외부 자격 증명(토큰, 요청 파라미터)을 검증하는 용도입니다. VPC 내부 IAM 주체를 대상으로 하는 이 시나리오에서는 필요하지 않습니다.</p><p><span class="mark-no">❌ D</span> — Cognito 사용자 풀은 외부 사용자 인증에 적합하며, 특정 OU의 IAM 주체를 대상으로 하는 이 시나리오에 적합하지 않습니다.</p>`,
  disc: [{ ans:'AE (92%)', txt:'anonymous 오류 = IAM 인증 없음. A로 IAM 인증 활성화 + E로 SigV4 서명. VPC 엔드포인트를 통한 내부 IAM 주체 접근에 최적. (문제의 "AWS JAM"은 "AWS IAM"의 오타)' }]
},
{
  n: 234,
  en: `A company wants to decrease the time it takes to develop new features. The company uses AWS CodeBuild and AWS CodeDeploy to build and deploy its applications. The company uses AWS CodePipeline to deploy each microservice with its own CI/CD pipeline.<br><br>The company needs more visibility into the average time between the release of new features and the average time to recover after a failed deployment.<br><br>Which solution will provide this visibility with the LEAST configuration effort?`,
  ko: `한 회사가 새로운 기능을 개발하는 데 걸리는 시간을 줄이고 싶어합니다. 이 회사는 AWS CodeBuild와 AWS CodeDeploy를 사용하여 애플리케이션을 빌드하고 배포합니다. 이 회사는 AWS CodePipeline을 사용하여 각 마이크로서비스를 자체 CI/CD 파이프라인으로 배포합니다.<br><br>이 회사는 새로운 기능의 릴리스와 실패한 배포 후 복구하는 데 걸리는 평균 시간 사이의 가시성이 더 필요합니다.<br><br>어떤 솔루션이 가장 적은 구성 노력으로 이러한 가시성을 제공할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Program an AWS Lambda function that creates Amazon CloudWatch custom metrics with information about successful runs and failed runs for each pipeline. Create an Amazon EventBridge rule to invoke the Lambda function every 5 minutes. Use the metrics to build a CloudWatch dashboard.`, ko:`각 파이프라인에 대한 성공한 실행 및 실패한 실행에 대한 정보로 Amazon CloudWatch 사용자 지정 메트릭을 만드는 AWS Lambda 함수를 프로그래밍합니다. 5분마다 Lambda 함수를 호출하는 Amazon EventBridge 규칙을 만듭니다. 메트릭을 사용하여 CloudWatch 대시보드를 빌드합니다.` },
    { k:'B', en:`Program an AWS Lambda function that creates Amazon CloudWatch custom metrics with information about successful runs and failed runs for each pipeline. Create an Amazon EventBridge rule to invoke the Lambda function after every successful run and after every failed run. Use the metrics to build a CloudWatch dashboard.`, ko:`각 파이프라인에 대한 성공한 실행 및 실패한 실행에 대한 정보로 Amazon CloudWatch 사용자 지정 메트릭을 만드는 AWS Lambda 함수를 프로그래밍합니다. 모든 성공한 실행과 모든 실패한 실행 후에 Lambda 함수를 호출하는 Amazon EventBridge 규칙을 만듭니다. 메트릭을 사용하여 CloudWatch 대시보드를 빌드합니다.` },
    { k:'C', en:`Program an AWS Lambda function that writes information about successful runs and failed runs to Amazon DynamoDB. Create an Amazon EventBridge rule to invoke the Lambda function after every successful run and after every failed run. Build an Amazon QuickSight dashboard to show the information from DynamoDB.`, ko:`성공한 실행과 실패한 실행에 대한 정보를 Amazon DynamoDB에 쓰는 AWS Lambda 함수를 프로그래밍합니다. 모든 성공한 실행과 모든 실패한 실행 후에 Lambda 함수를 호출하는 Amazon EventBridge 규칙을 만듭니다. DynamoDB의 정보를 표시하는 Amazon QuickSight 대시보드를 빌드합니다.` },
    { k:'D', en:`Program an AWS Lambda function that writes information about successful runs and failed runs to Amazon DynamoDB. Create an Amazon EventBridge rule to invoke the Lambda function every 5 minutes. Build an Amazon QuickSight dashboard to show the information from DynamoDB.`, ko:`성공한 실행과 실패한 실행에 대한 정보를 Amazon DynamoDB에 쓰는 AWS Lambda 함수를 프로그래밍합니다. 5분마다 Lambda 함수를 호출하는 Amazon EventBridge 규칙을 만듭니다. DynamoDB의 정보를 표시하는 Amazon QuickSight 대시보드를 빌드합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — 이벤트 기반 Lambda + CloudWatch 메트릭 + 대시보드</span></p><p>성공/실패 실행 이벤트가 발생할 때 EventBridge 규칙이 Lambda를 즉시 트리거하여 CloudWatch 사용자 지정 메트릭을 생성합니다. 이 방식은 이벤트 기반이라 실시간 데이터를 제공하며, CloudWatch 대시보드는 추가 서비스 없이 구성할 수 있어 구성 노력이 최소화됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 5분마다 폴링하는 방식은 이벤트 기반(B)보다 비효율적이며, 정확한 타이밍 데이터를 제공하지 못할 수 있습니다.</p><p><span class="mark-no">❌ C, D</span> — DynamoDB + QuickSight 조합은 CloudWatch 대시보드보다 훨씬 많은 구성 노력이 필요합니다(QuickSight 설정, DynamoDB 데이터 소스 연결 등).</p>`,
  disc: [{ ans:'B (100%)', txt:'이벤트 기반(성공/실패 시 즉시 호출) + CloudWatch(추가 설정 최소) = 가장 적은 구성 노력. 5분 폴링(A)은 비효율적, DynamoDB+QuickSight(C/D)는 복잡.' }]
},
{
  n: 235,
  en: `A company has developed a static website hosted on an Amazon S3 bucket. The website is deployed using AWS CloudFormation. The CloudFormation template defines an S3 bucket and a custom resource that copies content into the bucket from a source location.<br><br>The company has decided that it needs to move the website to a new location, so the existing CloudFormation stack must be deleted and re-created. However, CloudFormation reports that the stack could not be deleted cleanly.<br><br>What is the MOST likely cause and how can the DevOps engineer mitigate this problem for this and future versions of the website?`,
  ko: `한 회사가 Amazon S3 버킷에 호스팅된 정적 웹사이트를 개발했습니다. 웹사이트는 AWS CloudFormation을 사용하여 배포됩니다. CloudFormation 템플릿은 S3 버킷과 소스 위치에서 버킷으로 콘텐츠를 복사하는 사용자 지정 리소스를 정의합니다.<br><br>이 회사는 웹사이트를 새 위치로 옮겨야 하므로 기존 CloudFormation 스택을 삭제하고 다시 만들어야 합니다. 그러나 CloudFormation은 스택을 깨끗하게 삭제할 수 없다고 보고합니다.<br><br>가장 가능성 있는 원인은 무엇이며 DevOps 엔지니어는 이 버전과 향후 버전의 웹사이트에서 이 문제를 어떻게 완화할 수 있습니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Deletion has failed because the S3 bucket has an active website configuration. Modify the CloudFormation template to remove the WebsiteConfiguration property from the S3 bucket resource.`, ko:`S3 버킷에 활성 웹사이트 구성이 있기 때문에 삭제가 실패했습니다. CloudFormation 템플릿을 수정하여 S3 버킷 리소스에서 WebsiteConfiguration 속성을 제거합니다.` },
    { k:'B', en:`Deletion has failed because the S3 bucket is not empty. Modify the custom resource's AWS Lambda function code to recursively empty the bucket when RequestType is Delete.`, ko:`S3 버킷이 비어 있지 않아 삭제가 실패했습니다. RequestType이 Delete일 때 버킷을 재귀적으로 비우도록 사용자 지정 리소스의 AWS Lambda 함수 코드를 수정합니다.` },
    { k:'C', en:`Deletion has failed because the custom resource does not define a deletion policy. Add a DeletionPolicy property to the custom resource definition with a value of RemoveOnDeletion.`, ko:`사용자 지정 리소스가 삭제 정책을 정의하지 않았기 때문에 삭제가 실패했습니다. RemoveOnDeletion 값을 사용하여 사용자 지정 리소스 정의에 DeletionPolicy 속성을 추가합니다.` },
    { k:'D', en:`Deletion has failed because the S3 bucket is not empty. Modify the S3 bucket resource in the CloudFormation template to add a DeletionPolicy property with a value of Empty.`, ko:`S3 버킷이 비어 있지 않아 삭제가 실패했습니다. CloudFormation 템플릿에서 S3 버킷 리소스를 수정하여 Empty 값을 갖는 DeletionPolicy 속성을 추가합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — 비어 있지 않은 S3 버킷 + 사용자 지정 리소스 Lambda로 삭제 시 비우기</span></p><p>CloudFormation은 기본적으로 비어 있지 않은 S3 버킷을 삭제할 수 없습니다. 사용자 지정 리소스(Custom Resource)의 Lambda 함수가 이미 콘텐츠를 버킷에 복사했으므로, 스택 삭제 시 Lambda 함수의 <code>RequestType: Delete</code> 처리에서 버킷의 모든 객체를 재귀적으로 삭제한 후 버킷을 비워야 합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 웹사이트 구성 속성은 S3 버킷 삭제 실패의 원인이 아닙니다.</p><p><span class="mark-no">❌ C</span> — <code>RemoveOnDeletion</code>은 유효한 DeletionPolicy 값이 아닙니다.</p><p><span class="mark-no">❌ D</span> — CloudFormation S3 버킷 리소스의 DeletionPolicy에 <code>Empty</code> 값은 존재하지 않습니다. 유효한 값은 Delete, Retain, Snapshot입니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'CloudFormation의 S3 버킷 삭제 실패 = 버킷 비어 있지 않음. 사용자 지정 리소스 Lambda에서 Delete 요청 시 버킷 내용 삭제 처리가 정답.' }]
},
{
  n: 236,
  en: `A company uses Amazon EC2 as its primary compute platform. A DevOps team wants to audit the company's EC2 instances to check whether any prohibited applications have been installed on the EC2 instances.<br><br>Which solution will meet these requirements with the MOST operational efficiency?`,
  ko: `한 회사가 Amazon EC2를 기본 컴퓨팅 플랫폼으로 사용합니다. DevOps 팀은 회사의 EC2 인스턴스를 감사하여 EC2 인스턴스에 금지된 애플리케이션이 설치되었는지 확인하려고 합니다.<br><br>어떤 솔루션이 가장 높은 운영 효율성으로 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure AWS Systems Manager on each instance. Use AWS Systems Manager Inventory. Use Systems Manager resource data sync to synchronize and store findings in an Amazon S3 bucket. Create an AWS Lambda function that runs when new objects are added to the S3 bucket. Configure the Lambda function to identify prohibited applications.`, ko:`각 인스턴스에서 AWS Systems Manager를 구성합니다. AWS Systems Manager Inventory를 사용합니다. Systems Manager 리소스 데이터 동기화를 사용하여 Amazon S3 버킷에서 결과를 동기화하고 저장합니다. S3 버킷에 새 객체가 추가될 때 실행되는 AWS Lambda 함수를 만듭니다. 금지된 애플리케이션을 식별하도록 Lambda 함수를 구성합니다.` },
    { k:'B', en:`Configure AWS Systems Manager on each instance. Use Systems Manager Inventory. Create AWS Config rules that monitor changes from Systems Manager Inventory to identify prohibited applications.`, ko:`각 인스턴스에서 AWS Systems Manager를 구성합니다. Systems Manager Inventory를 사용합니다. Systems Manager Inventory의 변경 사항을 모니터링하여 금지된 애플리케이션을 식별하는 AWS Config 규칙을 만듭니다.` },
    { k:'C', en:`Configure AWS Systems Manager on each instance. Use Systems Manager Inventory. Filter a trail in AWS CloudTrail for Systems Manager Inventory events to identify prohibited applications.`, ko:`각 인스턴스에서 AWS Systems Manager를 구성합니다. Systems Manager Inventory를 사용합니다. Systems Manager Inventory 이벤트에 대한 AWS CloudTrail의 트레일을 필터링하여 금지된 애플리케이션을 식별합니다.` },
    { k:'D', en:`Designate Amazon CloudWatch Logs as the log destination for all application instances. Run an automated script across all instances to create an inventory of installed applications. Configure the script to forward the results to CloudWatch Logs. Create a CloudWatch alarm that uses filter patterns to search log data to identify prohibited applications.`, ko:`모든 애플리케이션 인스턴스의 로그 대상으로 Amazon CloudWatch Logs를 지정합니다. 모든 인스턴스에서 자동화된 스크립트를 실행하여 설치된 애플리케이션의 인벤토리를 만듭니다. 스크립트를 구성하여 결과를 CloudWatch Logs로 전달합니다. 필터 패턴을 사용하여 로그 데이터를 검색하여 금지된 애플리케이션을 식별하는 CloudWatch 알람을 만듭니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — Systems Manager Inventory + AWS Config 규칙</span></p><p>AWS Systems Manager Inventory는 EC2 인스턴스에 설치된 애플리케이션 데이터를 자동으로 수집합니다. AWS Config와 통합하면 Inventory 데이터의 변경 사항을 모니터링하는 Config 규칙을 만들어 금지된 애플리케이션이 설치되면 자동으로 감지할 수 있습니다. 이 방식은 AWS 공식 권장 패턴으로 운영 효율성이 가장 높습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — S3 + Lambda를 사용하는 것은 B보다 더 많은 구성 요소가 필요하여 운영 오버헤드가 높습니다.</p><p><span class="mark-no">❌ C</span> — CloudTrail은 API 호출 감사에 특화되어 있으며, 설치된 애플리케이션 인벤토리 모니터링에는 적합하지 않습니다.</p><p><span class="mark-no">❌ D</span> — 자동화 스크립트 + CloudWatch Logs 방식은 많은 수동 구성과 관리가 필요합니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'SSM Inventory + AWS Config = 금지 앱 탐지의 표준 패턴. AWS 블로그(preventing-blacklisted-applications-with-aws-systems-manager-and-aws-config) 참조.' }]
},
{
  n: 237,
  en: `A company has an event-driven JavaScript application. The application uses decoupled AWS managed services that publish, consume, and route events. During application testing, events are not delivered to the target that is specified by an Amazon EventBridge rule.<br><br>A DevOps team must provide application testers with additional functionality to view, troubleshoot, and prevent the loss of events without redeployment of the application.<br><br>Which combination of steps should the DevOps team take to meet these requirements? (Choose three.)`,
  ko: `한 회사에 이벤트 기반 JavaScript 애플리케이션이 있습니다. 이 애플리케이션은 이벤트를 게시, 소비, 라우팅하는 분리된 AWS 관리 서비스를 사용합니다. 애플리케이션 테스트 중에 이벤트는 Amazon EventBridge 규칙에서 지정한 대상에 전달되지 않습니다.<br><br>DevOps 팀은 애플리케이션 테스터에게 애플리케이션을 재배포하지 않고도 이벤트를 보고, 문제를 해결하고, 손실을 방지할 수 있는 추가 기능을 제공해야 합니다.<br><br>DevOps 팀은 이러한 요구 사항을 충족하기 위해 어떤 단계 조합을 취해야 합니까? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Launch AWS Device Farm with a standard test environment and project to run a specific build of the application.`, ko:`표준 테스트 환경과 프로젝트로 AWS Device Farm을 시작하여 애플리케이션의 특정 빌드를 실행합니다.` },
    { k:'B', en:`Create an Amazon S3 bucket. Enable AWS CloudTrail. Create a CloudTrail trail that specifies the S3 bucket as the storage location.`, ko:`Amazon S3 버킷을 만듭니다. AWS CloudTrail을 활성화합니다. S3 버킷을 저장 위치로 지정하는 CloudTrail 트레일을 만듭니다.` },
    { k:'C', en:`Configure the EventBridge rule to use an Amazon Simple Queue Service (Amazon SQS) standard queue as a dead-letter queue.`, ko:`Amazon Simple Queue Service(Amazon SQS) 표준 대기열을 배달 못한 편지 대기열(DLQ)로 사용하도록 EventBridge 규칙을 구성합니다.` },
    { k:'D', en:`Configure the EventBridge rule to use an Amazon Simple Queue Service (Amazon SQS) FIFO queue as a dead-letter queue.`, ko:`Amazon Simple Queue Service(Amazon SQS) FIFO 대기열을 배달 못한 편지 대기열(DLQ)로 사용하도록 EventBridge 규칙을 구성합니다.` },
    { k:'E', en:`Create a log group in Amazon CloudWatch Logs. Specify the log group as an additional target of the EventBridge rule.`, ko:`Amazon CloudWatch Logs에서 로그 그룹을 만듭니다. 로그 그룹을 EventBridge 규칙의 추가 대상으로 지정합니다.` },
    { k:'F', en:`Update the application code base to use the AWS X-Ray SDK tracing feature to instrument the code with support for the X-Amzn-Trace-Id header.`, ko:`AWS X-Ray SDK 추적 기능을 사용하여 X-Amzn-Trace-Id 헤더를 지원하는 코드를 구현하기 위해 애플리케이션 코드 베이스를 업데이트합니다.` },
  ],
  answer: ['B','C','E'],
  vote: '69% BCE',
  explain: `<p><span class="mark-ok">✅ B — CloudTrail 활성화</span></p><p>CloudTrail을 통해 AWS API 호출(이벤트 라우팅 관련)을 기록하여 테스터가 이벤트 흐름을 추적하고 문제를 해결할 수 있습니다. 애플리케이션 재배포 없이 구성 가능합니다.</p><p><span class="mark-ok">✅ C — SQS 표준 대기열을 DLQ로 구성</span></p><p>EventBridge 규칙에 SQS 표준 대기열을 DLQ로 설정하면 전달 실패 이벤트가 캡처되어 손실을 방지합니다. EventBridge는 SQS 표준 대기열만 DLQ로 지원합니다(FIFO 미지원).</p><p><span class="mark-ok">✅ E — CloudWatch Logs를 추가 대상으로 지정</span></p><p>EventBridge 규칙에 CloudWatch Logs 로그 그룹을 추가 대상으로 설정하면 모든 이벤트가 로깅되어 실시간으로 확인할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — AWS Device Farm은 모바일/웹 애플리케이션 테스트 서비스로, 이벤트 라우팅 문제 해결과 무관합니다.</p><p><span class="mark-no">❌ D</span> — EventBridge는 SQS FIFO 대기열을 DLQ로 지원하지 않습니다. 표준 대기열만 지원됩니다.</p><p><span class="mark-no">❌ F</span> — X-Ray SDK를 사용하려면 코드베이스 변경이 필요하며, 이는 애플리케이션 재배포가 필요합니다. "재배포 없이" 조건에 위배됩니다.</p>`,
  disc: [{ ans:'BCE (69%) vs CEF (23%)', txt:'핵심 조건: "애플리케이션 재배포 없이". F(X-Ray SDK)는 코드 변경 = 재배포 필요 → 제외. EventBridge DLQ는 SQS 표준만 지원(FIFO 미지원).' }]
},
{
  n: 238,
  en: `A company is migrating its container-based workloads to an AWS Organizations multi-account environment. The environment consists of application workload accounts that the company uses to deploy and run the containerized workloads. The company has also provisioned a shared services account for shared workloads in the organization.<br><br>The company must follow strict compliance regulations. All container images must receive security scanning before they are deployed to any environment. Images can be consumed by downstream deployment mechanisms after the images pass a scan with no critical vulnerabilities. Pre-scan and post-scan images must be isolated from one another so that a deployment can never use pre-scan images.<br><br>A DevOps engineer needs to create a strategy to centralize this process.<br><br>Which combination of steps will meet these requirements with the LEAST administrative overhead? (Choose two.)`,
  ko: `한 회사가 컨테이너 기반 워크로드를 AWS Organizations 다중 계정 환경으로 마이그레이션하고 있습니다. 이 환경은 컨테이너화된 워크로드를 배포하고 실행하는 데 사용하는 애플리케이션 워크로드 계정으로 구성되어 있습니다. 이 회사는 조직의 공유 워크로드에 대한 공유 서비스 계정도 프로비저닝했습니다.<br><br>이 회사는 엄격한 규정을 따라야 합니다. 모든 컨테이너 이미지는 모든 환경에 배포되기 전에 보안 검사를 받아야 합니다. 이미지는 심각한 취약점 없이 스캔을 통과한 후 다운스트림 배포 메커니즘에서 사용할 수 있습니다. 사전 검사 및 사후 검사 이미지는 배포에서 사전 검사 이미지를 사용할 수 없도록 서로 분리해야 합니다.<br><br>DevOps 엔지니어는 이 프로세스를 중앙 집중화하기 위한 전략을 만들어야 합니다.<br><br>어떤 단계 조합이 최소한의 관리 오버헤드로 이러한 요구 사항을 충족할 수 있을까요? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Create Amazon Elastic Container Registry (Amazon ECR) repositories in the shared services account: one repository for each pre-scan image and one repository for each post-scan image. Configure Amazon ECR image scanning to run on new image pushes to the pre-scan repositories. Use resource-based policies to grant the organization write access to the pre-scan repositories and read access to the post-scan repositories.`, ko:`공유 서비스 계정에서 Amazon ECR 리포지토리를 만듭니다. 사전 검사 이미지마다 리포지토리 하나, 사후 검사 이미지마다 리포지토리 하나. 사전 검사 리포지토리에 새 이미지가 푸시될 때 실행되도록 Amazon ECR 이미지 스캐닝을 구성합니다. 리소스 기반 정책을 사용하여 조직에 사전 검사 리포지토리에 대한 쓰기 액세스 권한과 사후 검사 리포지토리에 대한 읽기 액세스 권한을 부여합니다.` },
    { k:'B', en:`Create pre-scan Amazon Elastic Container Registry (Amazon ECR) repositories in each account that publishes container images. Create repositories for post-scan images in the shared services account. Configure Amazon ECR image scanning to run on new image pushes to the pre-scan repositories. Use resource-based policies to grant the organization read access to the post-scan repositories.`, ko:`컨테이너 이미지를 게시하는 각 계정에서 사전 검사 Amazon ECR 리포지토리를 만듭니다. 공유 서비스 계정에서 사후 검사 이미지에 대한 리포지토리를 만듭니다. 사전 검사 리포지토리에 대한 새 이미지 푸시에서 실행되도록 Amazon ECR 이미지 스캐닝을 구성합니다. 리소스 기반 정책을 사용하여 조직에 사후 검사 리포지토리에 대한 읽기 액세스 권한을 부여합니다.` },
    { k:'C', en:`Configure image replication for each image from the image's pre-scan repository to the image's post-scan repository.`, ko:`각 이미지에 대해 이미지의 사전 스캔 리포지토리에서 사후 스캔 리포지토리로 이미지 복제를 구성합니다.` },
    { k:'D', en:`Create a pipeline in AWS CodePipeline for each pre-scan repository. Create a source stage that runs when new images are pushed to the pre-scan repositories. Create a stage that uses AWS CodeBuild as the action provider. Write a buildspec.yaml definition that determines the image scanning status and pushes images without critical vulnerabilities to the post-scan repositories.`, ko:`각 사전 검사 리포지토리에 대해 AWS CodePipeline에서 파이프라인을 만듭니다. 사전 검사 리포지토리에 새 이미지가 푸시될 때 실행되는 소스 단계를 만듭니다. AWS CodeBuild를 작업 공급자로 사용하는 단계를 만듭니다. 이미지 스캐닝 상태를 결정하고 심각한 취약점이 없는 이미지를 사후 검사 리포지토리에 푸시하는 buildspec.yaml 정의를 작성합니다.` },
    { k:'E', en:`Create an AWS Lambda function. Create an Amazon EventBridge rule that reacts to image scanning completed events and invokes the Lambda function. Write function code that determines the image scanning status and pushes images without critical vulnerabilities to the post-scan repositories.`, ko:`AWS Lambda 함수를 만듭니다. 이미지 스캐닝 완료 이벤트에 반응하고 Lambda 함수를 호출하는 Amazon EventBridge 규칙을 만듭니다. 이미지 스캐닝 상태를 확인하고 심각한 취약점이 없는 이미지를 사후 검사 리포지토리에 푸시하는 함수 코드를 작성합니다.` },
  ],
  answer: ['A','E'],
  vote: '58% AE',
  explain: `<p><span class="mark-ok">✅ A — 공유 서비스 계정에 중앙화된 ECR 리포지토리</span></p><p>공유 서비스 계정에 사전/사후 스캔 리포지토리를 중앙화하면 관리가 단순해집니다. 리소스 기반 정책으로 조직 전체에 적절한 접근 권한을 부여하고, 사전 스캔 리포지토리에 이미지 스캐닝을 자동으로 실행합니다.</p><p><span class="mark-ok">✅ E — Lambda + EventBridge로 스캔 결과 기반 이미지 프로모션</span></p><p>이미지 스캐닝 완료 이벤트를 EventBridge로 감지하고 Lambda 함수로 스캔 결과를 확인하여 취약점이 없는 이미지만 사후 스캔 리포지토리로 복사합니다. 파이프라인(D)보다 단순하고 관리 오버헤드가 낮습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 각 계정에 사전 스캔 리포지토리를 분산 생성하면 관리 오버헤드가 증가합니다.</p><p><span class="mark-no">❌ C</span> — 단순 이미지 복제는 스캔 결과 기반 필터링을 제공하지 않아 취약한 이미지도 복제될 수 있습니다.</p><p><span class="mark-no">❌ D</span> — 각 리포지토리마다 CodePipeline을 생성하면 관리 오버헤드가 크게 증가합니다.</p>`,
  disc: [{ ans:'AE(58%) vs AD(42%)', txt:'최소 관리 오버헤드: A(공유 서비스 계정 중앙화) + E(단일 Lambda로 모든 리포지토리 처리) vs D(리포지토리마다 파이프라인 생성 필요). E가 D보다 단순.' }]
},
{
  n: 239,
  en: `A company uses an Amazon Elastic Kubernetes Service (Amazon EKS) cluster to deploy its web applications on containers. The web applications contain confidential data that cannot be decrypted without specific credentials.<br><br>A DevOps engineer has stored the credentials in AWS Secrets Manager. The secrets are encrypted by an AWS Key Management Service (AWS KMS) customer managed key. A Kubernetes service account for a third-party tool makes the secrets available to the applications. The service account assumes an IAM role that the company created to access the secrets.<br><br>The service account receives an Access Denied (403 Forbidden) error while trying to retrieve the secrets from Secrets Manager.<br><br>What is the root cause of this issue?`,
  ko: `한 회사가 Amazon Elastic Kubernetes Service(Amazon EKS) 클러스터를 사용하여 컨테이너에 웹 애플리케이션을 배포합니다. 웹 애플리케이션에는 특정 자격 증명 없이는 해독할 수 없는 기밀 데이터가 포함되어 있습니다.<br><br>DevOps 엔지니어가 AWS Secrets Manager에 자격 증명을 저장했습니다. 비밀은 AWS Key Management Service(AWS KMS) 고객 관리형 키로 암호화됩니다. 타사 도구의 Kubernetes 서비스 계정이 애플리케이션에서 비밀을 사용할 수 있도록 합니다. 서비스 계정은 회사에서 비밀에 액세스하기 위해 만든 IAM 역할을 수임합니다.<br><br>서비스 계정은 Secrets Manager에서 비밀을 검색하는 동안 액세스 거부(403 Forbidden) 오류를 수신합니다.<br><br>이 문제의 근본 원인은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`The IAM role that is attached to the EKS cluster does not have access to retrieve the secrets from Secrets Manager.`, ko:`EKS 클러스터에 연결된 IAM 역할에는 Secrets Manager에서 비밀을 검색할 수 있는 액세스 권한이 없습니다.` },
    { k:'B', en:`The key policy for the customer managed key does not allow the Kubernetes service account IAM role to use the key.`, ko:`고객 관리형 키에 대한 키 정책이 Kubernetes 서비스 계정 IAM 역할이 키를 사용하는 것을 허용하지 않습니다.` },
    { k:'C', en:`The key policy for the customer managed key does not allow the EKS cluster IAM role to use the key.`, ko:`고객 관리형 키에 대한 키 정책이 EKS 클러스터 IAM 역할이 키를 사용하는 것을 허용하지 않습니다.` },
    { k:'D', en:`The IAM role that is assumed by the Kubernetes service account does not have permission to access the EKS cluster.`, ko:`Kubernetes 서비스 계정에서 수임하는 IAM 역할에는 EKS 클러스터에 액세스할 수 있는 권한이 없습니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — KMS 키 정책이 서비스 계정 IAM 역할의 키 사용을 허용하지 않음</span></p><p>Secrets Manager의 비밀이 고객 관리형 KMS 키로 암호화되어 있을 때, IAM 역할이 Secrets Manager 접근 권한을 가지고 있어도 KMS 키 정책이 해당 IAM 역할의 키 사용(<code>kms:Decrypt</code>)을 명시적으로 허용하지 않으면 403 오류가 발생합니다. KMS 키는 리소스 기반 정책(키 정책)으로 접근을 제어합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 서비스 계정은 EKS 클러스터 IAM 역할이 아닌 특별히 만든 IAM 역할을 수임합니다. 클러스터 IAM 역할은 이 문제와 무관합니다.</p><p><span class="mark-no">❌ C</span> — EKS 클러스터 IAM 역할이 아닌 Kubernetes 서비스 계정이 수임하는 IAM 역할이 KMS 키를 사용해야 합니다.</p><p><span class="mark-no">❌ D</span> — 서비스 계정이 수임한 IAM 역할의 EKS 클러스터 접근 권한 문제가 아닙니다. 역할은 이미 Secrets Manager에 요청을 보내고 있습니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'Secrets Manager + CMK 암호화 시나리오: IAM 정책에 Secrets Manager 권한이 있어도 KMS 키 정책에 서비스 계정 IAM 역할의 kms:Decrypt 허용이 없으면 403 오류.' }]
},
{
  n: 240,
  en: `A company is migrating its product development teams from an on-premises data center to a hybrid environment. The new environment will add four AWS Regions and will give the developers the ability to use the Region that is geographically closest to them.<br><br>All the development teams use a shared set of Linux applications. The on-premises data center stores the applications on a NetApp ONTAP storage device. The storage volume is mounted read-only on the development on-premises VMs. The company updates the applications on the shared volume once a week.<br><br>A DevOps engineer needs to replicate the data to all the new Regions. The DevOps engineer must ensure that the data is always up to date with deduplication. The data also must not be dependent on the availability of the on-premises storage device.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 온프레미스 데이터 센터에서 하이브리드 환경으로 제품 개발 팀을 이전하고 있습니다. 새로운 환경에는 4개의 AWS 리전이 추가되고 개발자는 지리적으로 가장 가까운 리전을 사용할 수 있습니다.<br><br>모든 개발 팀은 공유 Linux 애플리케이션 세트를 사용합니다. 온프레미스 데이터 센터는 NetApp ONTAP 스토리지 디바이스에 애플리케이션을 저장합니다. 스토리지 볼륨은 개발 온프레미스 VM에서 읽기 전용으로 마운트됩니다. 회사는 일주일에 한 번 공유 볼륨에서 애플리케이션을 업데이트합니다.<br><br>DevOps 엔지니어는 모든 새로운 리전에 데이터를 복제해야 합니다. DevOps 엔지니어는 중복 제거를 통해 데이터가 항상 최신 상태인지 확인해야 합니다. 또한 데이터는 온프레미스 스토리지 디바이스의 가용성에 종속되어서는 안 됩니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an Amazon S3 File Gateway in the on-premises data center. Create S3 buckets in each Region. Set up a cron job to copy the data from the storage device to the S3 File Gateway. Set up S3 Cross-Region Replication (CRR) to the S3 buckets in each Region.`, ko:`온프레미스 데이터 센터에 Amazon S3 파일 게이트웨이를 만듭니다. 각 리전에 S3 버킷을 만듭니다. 스토리지 디바이스에서 S3 파일 게이트웨이로 데이터를 복사하는 cron 작업을 설정합니다. 각 리전의 S3 버킷에 S3 Cross-Region Replication(CRR)을 설정합니다.` },
    { k:'B', en:`Create an Amazon FSx File Gateway in one Region. Create file servers in Amazon FSx for Windows File Server in each Region. Set up a cron job to copy the data from the storage device to the FSx File Gateway.`, ko:`한 리전에서 Amazon FSx 파일 게이트웨이를 만듭니다. 각 리전에서 Amazon FSx for Windows 파일 서버에 파일 서버를 만듭니다. 스토리지 디바이스에서 FSx 파일 게이트웨이로 데이터를 복사하는 cron 작업을 설정합니다.` },
    { k:'C', en:`Create Multi-AZ Amazon FSx for NetApp ONTAP instances and volumes in each Region. Configure a scheduled SnapMirror relationship between the on-premises storage device and the FSx for ONTAP instances.`, ko:`각 리전에서 NetApp ONTAP 인스턴스 및 볼륨을 위한 Multi-AZ Amazon FSx를 만듭니다. 온프레미스 스토리지 디바이스와 FSx for ONTAP 인스턴스 간에 예약된 SnapMirror 관계를 구성합니다.` },
    { k:'D', en:`Create an Amazon Elastic File System (Amazon EFS) file system in each Region. Deploy an AWS DataSync agent in the on-premises data center. Configure a schedule for DataSync to copy the data to Amazon EFS daily.`, ko:`각 리전에 Amazon Elastic File System(Amazon EFS) 파일 시스템을 만듭니다. 온프레미스 데이터 센터에 AWS DataSync 에이전트를 배포합니다. DataSync가 매일 Amazon EFS에 데이터를 복사하도록 일정을 구성합니다.` },
  ],
  answer: ['C'],
  vote: '86% C',
  explain: `<p><span class="mark-ok">✅ C — FSx for NetApp ONTAP + SnapMirror</span></p><p>소스가 NetApp ONTAP이므로 Amazon FSx for NetApp ONTAP이 자연스러운 선택입니다. SnapMirror는 NetApp의 기본 복제 기술로 중복 제거(deduplication)를 지원하며, 온프레미스 NetApp 디바이스와 각 리전의 FSx for ONTAP 인스턴스 간에 예약된 복제를 설정할 수 있습니다. 각 리전에 Multi-AZ FSx가 있으므로 온프레미스 디바이스 가용성에 의존하지 않습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — S3는 파일 시스템 볼륨 마운트에 적합하지 않으며, Linux 애플리케이션이 읽기 전용으로 마운트해야 하는 요건에 맞지 않습니다.</p><p><span class="mark-no">❌ B</span> — FSx for Windows File Server는 Linux 애플리케이션 환경에 적합하지 않으며, 중복 제거 기능이 ONTAP만큼 강력하지 않습니다.</p><p><span class="mark-no">❌ D</span> — EFS는 Linux 호환이지만 중복 제거를 지원하지 않으며, DataSync는 NetApp ONTAP의 고급 데이터 관리 기능을 활용할 수 없습니다.</p>`,
  disc: [{ ans:'C (86%)', txt:'NetApp ONTAP 소스 → FSx for NetApp ONTAP 대상 + SnapMirror = 중복 제거 + 예약 복제 + 온프레미스 독립성. AWS 블로그(cross-region-disaster-recovery-with-amazon-fsx-for-netapp-ontap) 참조.' }]
},
{
  n: 241,
  en: `A company has an application that stores data that includes personally identifiable information (PII) in an Amazon S3 bucket. All data is encrypted with AWS Key Management Service (AWS KMS) customer managed keys. All AWS resources are deployed from an AWS CloudFormation template.<br><br>A DevOps engineer needs to set up a development environment for the application in a different AWS account. The data in the development environment's S3 bucket needs to be updated once a week from the production environment's S3 bucket.<br><br>The company must not move PII from the production environment without anonymizing the PII first. The data in each environment must be encrypted with different KMS customer managed keys.<br><br>Which combination of steps should the DevOps engineer take to meet these requirements? (Choose two.)`,
  ko: `한 회사에 Amazon S3 버킷에 개인 식별 정보(PII)가 포함된 데이터를 저장하는 애플리케이션이 있습니다. 모든 데이터는 AWS KMS 고객 관리형 키로 암호화됩니다. 모든 AWS 리소스는 AWS CloudFormation 템플릿에서 배포됩니다.<br><br>DevOps 엔지니어는 다른 AWS 계정에서 애플리케이션에 대한 개발 환경을 설정해야 합니다. 개발 환경의 S3 버킷에 있는 데이터는 프로덕션 환경의 S3 버킷에서 일주일에 한 번 업데이트해야 합니다.<br><br>회사는 PII를 먼저 익명화하지 않고 프로덕션 환경에서 PII를 이동해서는 안 됩니다. 각 환경의 데이터는 다른 KMS 고객 관리형 키로 암호화해야 합니다.<br><br>DevOps 엔지니어는 이러한 요구 사항을 충족하기 위해 어떤 단계 조합을 취해야 합니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Activate Amazon Macie on the S3 bucket in the production account. Create an AWS Step Functions state machine to initiate a discovery job and redact all PII before copying files to the S3 bucket in the development account. Give the state machine tasks decrypt permissions on the KMS key in the production account. Give the state machine tasks encrypt permissions on the KMS key in the development account.`, ko:`프로덕션 계정의 S3 버킷에서 Amazon Macie를 활성화합니다. AWS Step Functions 상태 머신을 만들어 검색 작업을 시작하고 파일을 개발 계정의 S3 버킷에 복사하기 전에 모든 PII를 수정합니다. 상태 머신 작업에 프로덕션 계정의 KMS 키에 대한 복호화 권한을 부여합니다. 상태 머신 작업에 개발 계정의 KMS 키에 대한 암호화 권한을 부여합니다.` },
    { k:'B', en:`Set up S3 replication between the production S3 bucket and the development S3 bucket. Activate Amazon Macie on the development S3 bucket. Create an AWS Step Functions state machine to initiate a discovery job and redact all PII as the files are copied to the development S3 bucket. Give the state machine tasks encrypt and decrypt permissions on the KMS key in the development account.`, ko:`프로덕션 S3 버킷과 개발 S3 버킷 간에 S3 복제를 설정합니다. 개발 S3 버킷에서 Amazon Macie를 활성화합니다. AWS Step Functions 상태 머신을 생성하여 검색 작업을 시작하고 파일이 개발 S3 버킷에 복사될 때 모든 PII를 삭제합니다. 상태 머신 작업에 개발 계정의 KMS 키에 대한 암호화 및 복호화 권한을 부여합니다.` },
    { k:'C', en:`Set up an S3 Batch Operations job to copy files from the production S3 bucket to the development S3 bucket. In the development account, configure an AWS Lambda function to redact all PII. Configure S3 Object Lambda to use the Lambda function for S3 GET requests. Give the Lambda function's IAM role encrypt and decrypt permissions on the KMS key in the development account.`, ko:`프로덕션 S3 버킷에서 개발 S3 버킷으로 파일을 복사하기 위한 S3 Batch Operations 작업을 설정합니다. 개발 계정에서 모든 PII를 수정하도록 AWS Lambda 함수를 구성합니다. S3 GET 요청에 Lambda 함수를 사용하도록 S3 Object Lambda를 구성합니다. 개발 계정에서 Lambda 함수의 IAM 역할에 KMS 키에 대한 암호화 및 복호화 권한을 부여합니다.` },
    { k:'D', en:`Create a development environment from the CloudFormation template in the development account. Schedule an Amazon EventBridge rule to start the AWS Step Functions state machine once a week.`, ko:`개발 계정의 CloudFormation 템플릿에서 개발 환경을 만듭니다. 일주일에 한 번 AWS Step Functions 상태 머신을 시작하도록 Amazon EventBridge 규칙을 예약합니다.` },
    { k:'E', en:`Create a development environment from the CloudFormation template in the development account. Schedule a cron job on an Amazon EC2 instance to run once a week to start the S3 Batch Operations job.`, ko:`개발 계정의 CloudFormation 템플릿에서 개발 환경을 만듭니다. Amazon EC2 인스턴스에서 일주일에 한 번 실행되도록 cron 작업을 예약하여 S3 Batch Operations 작업을 시작합니다.` },
  ],
  answer: ['A','D'],
  vote: '100% AD',
  explain: `<p><span class="mark-ok">✅ A — Macie로 PII 탐지 + Step Functions으로 이동 전 수정 + KMS 교차 계정 암호화</span></p><p>PII를 <strong>이동하기 전</strong>에 프로덕션 계정에서 익명화하는 것이 요건의 핵심입니다. Amazon Macie로 PII를 탐지하고 Step Functions 상태 머신이 수정(redact) 후 개발 계정으로 복사합니다. 프로덕션 KMS 키(복호화)와 개발 KMS 키(암호화)에 각각 적절한 권한을 부여합니다.</p><p><span class="mark-ok">✅ D — CloudFormation + EventBridge로 주간 자동화</span></p><p>개발 환경을 CloudFormation 템플릿으로 생성하고 EventBridge 예약 규칙으로 Step Functions를 매주 자동 실행합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — PII를 먼저 개발 버킷에 복제한 후 수정하는 방식은 PII를 익명화 전에 이동하므로 요건 위반입니다.</p><p><span class="mark-no">❌ C</span> — S3 Object Lambda는 데이터를 복사하기 전이 아니라 검색 시 변환합니다. PII가 개발 버킷에 먼저 저장될 수 있어 요건을 충족하지 못합니다.</p><p><span class="mark-no">❌ E</span> — EC2 cron 작업은 EventBridge 예약(D)보다 관리 오버헤드가 높습니다.</p>`,
  disc: [{ ans:'AD (100%)', txt:'핵심: PII는 복사 전(프로덕션 계정에서) 익명화. A가 수정 프로세스, D가 주간 자동화 트리거.' }]
},
{
  n: 242,
  en: `A company uses an Amazon Elastic Kubernetes Service (Amazon EKS) cluster to host its machine learning (ML) application. As the ML model and the container image size grow, the time that new pods take to start up has increased to several minutes.<br><br>A DevOps engineer needs to reduce the startup time to seconds. The solution must also reduce the startup time to seconds when the pod runs on nodes that were recently added to the cluster.<br><br>The DevOps engineer creates an Amazon EventBridge rule that invokes an automation in AWS Systems Manager. The automation prefetches the container images from an Amazon Elastic Container Registry (Amazon ECR) repository when new images are pushed to the repository. The DevOps engineer also configures tags to be applied to the cluster and the node groups.<br><br>What should the DevOps engineer do next to meet the requirements?`,
  ko: `한 회사가 Amazon EKS 클러스터를 사용하여 머신 러닝(ML) 애플리케이션을 호스팅합니다. ML 모델과 컨테이너 이미지 크기가 커짐에 따라 새 포드가 시작하는 데 걸리는 시간이 몇 분으로 늘어났습니다.<br><br>DevOps 엔지니어는 시작 시간을 몇 초로 줄여야 합니다. 솔루션은 포드가 최근에 클러스터에 추가된 노드에서 실행되는 경우에도 시작 시간을 몇 초로 줄여야 합니다.<br><br>DevOps 엔지니어는 AWS Systems Manager에서 자동화를 호출하는 Amazon EventBridge 규칙을 만들었습니다. 이 자동화는 새 이미지가 리포지토리에 푸시될 때 Amazon ECR 리포지토리에서 컨테이너 이미지를 미리 가져옵니다. DevOps 엔지니어는 또한 클러스터와 노드 그룹에 적용할 태그를 구성합니다.<br><br>DevOps 엔지니어는 요구 사항을 충족하기 위해 다음에 무엇을 해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an IAM role that has a policy that allows EventBridge to use Systems Manager to run commands in the EKS cluster's control plane nodes. Create a Systems Manager State Manager association that uses the control plane nodes' tags to prefetch corresponding container images.`, ko:`EventBridge가 Systems Manager를 사용하여 EKS 클러스터의 제어 평면 노드에서 명령을 실행할 수 있도록 허용하는 정책이 있는 IAM 역할을 만듭니다. 제어 평면 노드의 태그를 사용하여 해당 컨테이너 이미지를 미리 가져오는 Systems Manager State Manager 연결을 만듭니다.` },
    { k:'B', en:`Create an IAM role that has a policy that allows EventBridge to use Systems Manager to run commands in the EKS cluster's nodes. Create a Systems Manager State Manager association that uses the nodes' machine size to prefetch corresponding container images.`, ko:`EventBridge가 Systems Manager를 사용하여 EKS 클러스터 노드에서 명령을 실행할 수 있도록 허용하는 정책이 있는 IAM 역할을 만듭니다. 노드의 머신 크기를 사용하여 해당 컨테이너 이미지를 미리 가져오는 Systems Manager State Manager 연결을 만듭니다.` },
    { k:'C', en:`Create an IAM role that has a policy that allows EventBridge to use Systems Manager to run commands in the EKS cluster's nodes. Create a Systems Manager State Manager association that uses the nodes' tags to prefetch corresponding container images.`, ko:`EventBridge가 Systems Manager를 사용하여 EKS 클러스터 노드에서 명령을 실행할 수 있도록 허용하는 정책이 있는 IAM 역할을 만듭니다. 노드의 태그를 사용하여 해당 컨테이너 이미지를 미리 가져오는 Systems Manager State Manager 연결을 만듭니다.` },
    { k:'D', en:`Create an IAM role that has a policy that allows EventBridge to use Systems Manager to run commands in the EKS cluster's control plane nodes. Create a Systems Manager State Manager association that uses the nodes' tags to prefetch corresponding container images.`, ko:`EventBridge가 Systems Manager를 사용하여 EKS 클러스터의 제어 평면 노드에서 명령을 실행할 수 있도록 허용하는 정책이 있는 IAM 역할을 만듭니다. 노드의 태그를 사용하여 해당 컨테이너 이미지를 미리 가져오는 Systems Manager State Manager 연결을 만듭니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — 워커 노드에 명령 실행 + 노드 태그 사용</span></p><p>컨테이너 이미지를 미리 가져오려면 실제 컨테이너가 실행되는 <strong>워커 노드</strong>에서 이미지를 사전 다운로드해야 합니다. EKS 제어 평면은 AWS에서 완전히 관리되며 SSM으로 접근할 수 없습니다. DevOps 엔지니어가 이미 태그를 구성했으므로 State Manager 연결에서 태그를 사용하여 대상 노드를 식별하는 것이 올바른 방법입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A, D</span> — EKS 제어 평면 노드는 AWS에서 완전 관리되며 Systems Manager를 통해 접근하거나 명령을 실행할 수 없습니다.</p><p><span class="mark-no">❌ B</span> — 머신 크기(인스턴스 타입)로 노드를 식별하는 것은 비실용적이며 유연성이 없습니다. 이미 태그가 구성되어 있으므로 태그를 사용해야 합니다.</p>`,
  disc: [{ ans:'C (100%)', txt:'제어 평면 = AWS 관리 = SSM 접근 불가(A/D 오류). 머신 크기 식별은 비유연(B 오류). 워커 노드 + 태그 = 정답. AWS 블로그(start-pods-faster-by-prefetching-images) 참조.' }]
},
{
  n: 243,
  en: `A company's application has an API that retrieves workload metrics. The company needs to audit, analyze, and visualize these metrics from the application to detect issues at scale.<br><br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `회사의 애플리케이션에는 워크로드 메트릭을 검색하는 API가 있습니다. 회사는 애플리케이션에서 이러한 메트릭을 감사, 분석 및 시각화하여 대규모 문제를 감지해야 합니다.<br><br>이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Configure an Amazon EventBridge schedule to invoke an AWS Lambda function that calls the API to retrieve workload metrics. Store the workload metric data in an Amazon S3 bucket.`, ko:`Amazon EventBridge 일정을 구성하여 API를 호출하여 워크로드 메트릭을 검색하는 AWS Lambda 함수를 호출합니다. 워크로드 메트릭 데이터를 Amazon S3 버킷에 저장합니다.` },
    { k:'B', en:`Configure an Amazon EventBridge schedule to invoke an AWS Lambda function that calls the API to retrieve workload metrics. Store the workload metric data in an Amazon DynamoDB table that has a DynamoDB stream enabled.`, ko:`Amazon EventBridge 일정을 구성하여 API를 호출하여 워크로드 메트릭을 검색하는 AWS Lambda 함수를 호출합니다. DynamoDB 스트림이 활성화된 Amazon DynamoDB 테이블에 워크로드 메트릭 데이터를 저장합니다.` },
    { k:'C', en:`Create an AWS Glue crawler to catalog the workload metric data in the Amazon S3 bucket. Create views in Amazon Athena for the cataloged data.`, ko:`Amazon S3 버킷의 워크로드 메트릭 데이터를 카탈로그화하기 위해 AWS Glue 크롤러를 만듭니다. 카탈로그화된 데이터에 대한 Amazon Athena에서 뷰를 만듭니다.` },
    { k:'D', en:`Connect an AWS Glue crawler to the Amazon DynamoDB stream to catalog the workload metric data. Create views in Amazon Athena for the cataloged data.`, ko:`AWS Glue 크롤러를 Amazon DynamoDB 스트림에 연결하여 워크로드 메트릭 데이터를 카탈로그화합니다. 카탈로그화된 데이터에 대한 Amazon Athena에서 뷰를 만듭니다.` },
    { k:'E', en:`Create Amazon QuickSight datasets from the Amazon Athena views. Create a QuickSight analysis to visualize the workload metric data as a dashboard.`, ko:`Amazon Athena 뷰에서 Amazon QuickSight 데이터 세트를 만듭니다. QuickSight 분석을 만들어 워크로드 메트릭 데이터를 대시보드로 시각화합니다.` },
    { k:'F', en:`Create an Amazon CloudWatch dashboard that has custom widgets that invoke AWS Lambda functions. Configure the Lambda functions to query the workload metrics data from the Amazon Athena views.`, ko:`AWS Lambda 함수를 호출하는 사용자 지정 위젯이 있는 Amazon CloudWatch 대시보드를 만듭니다. Amazon Athena 뷰에서 워크로드 메트릭 데이터를 쿼리하도록 Lambda 함수를 구성합니다.` },
  ],
  answer: ['A','C','E'],
  vote: '100% ACE',
  explain: `<p><span class="mark-ok">✅ A — EventBridge + Lambda + S3 (데이터 수집·저장)</span></p><p>EventBridge 일정 규칙으로 Lambda를 주기적으로 호출하여 API에서 메트릭을 가져오고 S3에 저장합니다.</p><p><span class="mark-ok">✅ C — Glue 크롤러 + Athena 뷰 (데이터 카탈로그·쿼리)</span></p><p>Glue 크롤러가 S3의 데이터를 카탈로그화하고 Athena로 SQL 쿼리가 가능합니다.</p><p><span class="mark-ok">✅ E — QuickSight + Athena 뷰 (시각화)</span></p><p>Athena 뷰에서 QuickSight 데이터셋을 생성하고 대시보드로 시각화합니다. 이것이 감사, 분석, 시각화 3가지 요건을 모두 충족하는 표준 데이터 파이프라인입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — DynamoDB는 대규모 메트릭 데이터의 임시 분석보다 키-값 액세스에 더 적합합니다. S3+Athena가 더 효율적입니다.</p><p><span class="mark-no">❌ D</span> — DynamoDB 스트림을 Glue 크롤러에 직접 연결하는 것은 실용적이지 않습니다.</p><p><span class="mark-no">❌ F</span> — CloudWatch + Lambda + Athena 방식은 QuickSight(E)보다 복잡하고 대화형 대시보드 기능이 제한됩니다.</p>`,
  disc: [{ ans:'ACE (100%)', txt:'표준 데이터 파이프라인: A(수집→S3) → C(Glue+Athena 분석) → E(QuickSight 시각화). AWS 블로그(analyzing-cloudwatch-internet-monitor-logs-using-athena-quicksight) 참조.' }]
},
{
  n: 244,
  en: `A DevOps engineer is building the infrastructure for an application. The application needs to run on an Amazon Elastic Kubernetes Service (Amazon EKS) cluster that includes Amazon EC2 instances. The EC2 instances need to use an Amazon Elastic File System (Amazon EFS) file system as a storage backend. The Amazon EFS Container Storage Interface (CSI) driver is installed on the EKS cluster.<br><br>When the DevOps engineer starts the application, the EC2 instances do not mount the EFS file system.<br><br>Which solutions will fix the problem? (Choose three.)`,
