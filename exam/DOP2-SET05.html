<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS DOP-C02 | SET 05 (Q201~Q250)</title>
<style>
[data-theme="dark"] {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#222636; --border:#2e3347;
  --accent:#4f8ef7; --accent2:#38c9a0; --text:#e2e6f0; --text-muted:#7a83a0;
  --correct-bg:#112a22; --wrong-bg:#2a1111; --explain-bg:#1e2030;
  --hover-bg:#1e2236; --sel-bg:#1b2540;
}
[data-theme="light"] {
  --bg:#f0f2f8; --surface:#ffffff; --surface2:#f5f6fa; --border:#d0d5e8;
  --accent:#2e6fe0; --accent2:#1aaa7e; --text:#1a1d2e; --text-muted:#5a6280;
  --correct-bg:#e6faf4; --wrong-bg:#fde8e8; --explain-bg:#f0f2fa;
  --hover-bg:#eaf1ff; --sel-bg:#ddeaff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard','Noto Sans KR','Segoe UI',sans-serif;font-size:15px;line-height:1.75;min-height:100vh;transition:background .25s,color .25s;}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 60px;}

/* Topbar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}

/* ── SET 선택 콤보박스 ── */
.set-select-wrap{position:relative;display:inline-flex;align-items:center;}
.set-select{
  appearance:none;-webkit-appearance:none;
  background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  border:none;border-radius:20px;
  color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;
  padding:4px 28px 4px 12px;
  cursor:pointer;outline:none;
  transition:filter .2s,transform .1s;
  white-space:nowrap;
}
.set-select:hover{filter:brightness(1.12);transform:translateY(-1px);}
.set-select:focus{filter:brightness(1.08);outline:2px solid rgba(255,255,255,.5);outline-offset:2px;}
.set-select option{background:#1a1d27;color:#e2e6f0;font-size:13px;font-weight:600;}
/* 화살표 아이콘 */
.set-select-wrap::after{
  content:'▾';
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:#fff;font-size:10px;pointer-events:none;
}

.badge{background:linear-gradient(135deg,#4f8ef7,#38c9a0);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 12px;border-radius:20px;white-space:nowrap;}
.topbar-title{font-size:13px;color:var(--text-muted);flex:1;min-width:120px;}
.topbar-title strong{color:var(--text);font-size:15px;display:block;}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}

/* 문제 선택 콤보박스 */
.q-select-wrap{display:flex;align-items:center;gap:6px;}
.q-select-label{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.q-select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-weight:600;padding:5px 10px;cursor:pointer;outline:none;transition:border-color .2s;}
.q-select:focus,.q-select:hover{border-color:var(--accent);}
.q-select option.opt-correct{color:#1aaa7e;}
.q-select option.opt-wrong{color:#e05252;}

/* 상단 네비 버튼 + 문제 콤보 높이 통일 */
.topbar-right .btn-nav,
.topbar-right .q-select {
  height: 24px;
  padding: 0 14px;
  font-size: 13px;
}

/* 테마 버튼 */
.theme-btn{background:var(--surface2);border:1px solid var(--border);border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-muted);transition:border-color .2s,color .2s;white-space:nowrap;}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}

/* Progress */
.progress-bar{background:var(--surface2);border-radius:4px;height:6px;margin-bottom:20px;overflow:hidden;}
.progress-fill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:4px;transition:width .4s;}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:16px;transition:background .25s,border-color .25s;}

/* Lang Tabs */
.lang-tabs{display:flex;gap:8px;margin-bottom:20px;}
.lang-tab{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.04em;padding:5px 14px;transition:all .2s;}
.lang-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.lang-tab:hover:not(.active){border-color:var(--accent);color:var(--accent);}

/* Q Label */
.q-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-bottom:10px;}
.q-type-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:10px;margin-left:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);vertical-align:middle;}
.q-type-badge.multi{background:#ede9ff;color:#6d28d9;border-color:#c4b5fd;}
[data-theme="dark"] .q-type-badge.multi{background:#2a1f50;color:#a78bfa;border-color:#4c3a8c;}

/* Q Text */
.q-text{font-size:15px;color:var(--text);line-height:1.85;}
.q-text.en-text{
  font-size:14px;color:var(--text-muted);
  margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--border);
}
.q-text code{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:13px;font-family:'JetBrains Mono','Fira Code',monospace;color:var(--accent2);}

/* Choices */
.choices-section{margin-top:24px;}
.choices-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px;}
.choice{display:flex;align-items:flex-start;gap:14px;background:var(--surface2);border:2px solid var(--border);border-radius:10px;cursor:pointer;margin-bottom:10px;padding:14px 18px;transition:border-color .2s,background .2s;user-select:none;}
.choice:hover{border-color:var(--accent);background:var(--hover-bg);}
.choice.selected{border-color:var(--accent);background:var(--sel-bg);}
.choice.correct{border-color:#38c9a0!important;background:var(--correct-bg)!important;}
.choice.wrong{border-color:#f76f6f!important;background:var(--wrong-bg)!important;}
.choice.disabled{cursor:default;pointer-events:none;}
.choice-key{background:var(--border);border-radius:6px;color:var(--text);font-size:13px;font-weight:700;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:background .2s,color .2s;}
.choice.selected .choice-key{background:var(--accent);color:#fff;}
.choice.correct .choice-key{background:#38c9a0;color:#000;}
.choice.wrong .choice-key{background:#f76f6f;color:#fff;}
.choice-body{flex:1;}
.choice-text{font-size:14px;line-height:1.75;}
.choice-en{font-size:12px;color:var(--text-muted);margin-top:5px;display:none;font-style:italic;}
.result-icon{margin-left:auto;font-size:18px;flex-shrink:0;display:none;}
.choice.correct .result-icon,.choice.wrong .result-icon{display:block;}

/* Actions */
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center;}
.btn{border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.03em;padding:11px 24px;transition:opacity .2s,transform .1s;}
.btn:hover:not(:disabled){opacity:.88;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-nav{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:11px 18px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.hint-text{font-size:12px;color:var(--text-muted);margin-top:8px;min-height:18px;}

/* Review Panel */
.review-panel{display:none;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent2);border-radius:12px;padding:24px 28px;margin-bottom:16px;animation:fadeIn .35s ease;transition:background .25s;}
.review-panel.show{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.answer-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.answer-label{font-size:13px;color:var(--text-muted);}
.answer-badge{background:#38c9a0;color:#000;font-size:13px;font-weight:800;padding:4px 14px;border-radius:20px;}
.vote-badge{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);font-size:12px;padding:3px 10px;border-radius:20px;}
.vote-badge span{color:var(--accent);font-weight:700;}
.section-title{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent2);text-transform:uppercase;margin-bottom:10px;}
.explain-box{background:var(--explain-bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;font-size:14px;line-height:1.8;color:var(--text);}
.explain-box p{margin-bottom:8px;}
.explain-box p:last-child{margin-bottom:0;}
.mark-ok{color:#38c9a0;font-weight:700;}
.mark-no{color:#f76f6f;font-weight:600;}

/* Discussion */
.disc-toggle{background:transparent;border:1px dashed var(--border);border-radius:8px;color:var(--text-muted);cursor:pointer;font-size:13px;margin-top:8px;padding:9px 16px;width:100%;text-align:left;transition:border-color .2s,color .2s;}
.disc-toggle:hover{border-color:var(--accent);color:var(--accent);}
.disc-list{display:none;margin-top:10px;}
.disc-list.show{display:block;}
.disc-item{background:var(--surface2);border-left:3px solid var(--border);border-radius:0 6px 6px 0;font-size:13px;margin-bottom:8px;padding:10px 14px;color:var(--text-muted);line-height:1.7;}
.disc-ans{color:var(--accent);font-weight:700;font-size:12px;margin-bottom:3px;}

/* Bottom Nav */
.nav-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px;}
.nav-info{font-size:13px;color:var(--text-muted);text-align:center;flex:1;}

@media(max-width:600px){
  .card{padding:16px;}
  .btn{padding:10px 16px;font-size:13px;}
  .topbar{gap:8px;}
  .topbar-right{gap:6px;}
}

/* ── 패스워드 모달 ── */
.pw-overlay{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  /* 배경 블러 */
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  background:rgba(10,12,22,.55);
  transition:opacity .3s;
}
.pw-overlay.hidden{
  opacity:0;pointer-events:none;
}
.pw-modal{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 24px 64px rgba(0,0,0,.35);
  padding:40px 36px 34px;
  width:min(400px,90vw);
  display:flex;flex-direction:column;align-items:center;gap:0;
  animation:pwSlideIn .35s cubic-bezier(.22,.9,.36,1) both;
}
@keyframes pwSlideIn{
  from{opacity:0;transform:translateY(28px) scale(.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.pw-logo{
  width:54px;height:54px;border-radius:14px;
  background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;margin-bottom:20px;
  box-shadow:0 8px 24px rgba(79,142,247,.35);
}
.pw-title{
  font-size:18px;font-weight:800;color:var(--text);
  letter-spacing:-.01em;margin-bottom:6px;text-align:center;
}
.pw-sub{
  font-size:13px;color:var(--text-muted);margin-bottom:28px;text-align:center;line-height:1.6;
}
.pw-input-wrap{
  position:relative;width:100%;margin-bottom:14px;
}
.pw-input{
  width:100%;
  background:var(--surface2);
  border:2px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-size:16px;font-weight:700;
  letter-spacing:.15em;
  padding:13px 46px 13px 18px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
  text-align:center;
}
.pw-input::placeholder{letter-spacing:normal;font-weight:400;font-size:14px;}
.pw-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,142,247,.18);}
.pw-input.shake{animation:pwShake .38s ease;}
.pw-input.error{border-color:#f76f6f;box-shadow:0 0 0 3px rgba(247,111,111,.18);}
@keyframes pwShake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-6px);}
  80%{transform:translateX(6px);}
}
.pw-toggle{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:var(--text-muted);font-size:18px;padding:2px 4px;
  transition:color .2s;
}
.pw-toggle:hover{color:var(--accent);}
.pw-error-msg{
  font-size:12px;color:#f76f6f;font-weight:600;
  min-height:18px;margin-bottom:18px;text-align:center;
  transition:opacity .2s;
}
.pw-btn{
  width:100%;background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  border:none;border-radius:10px;color:#fff;
  font-size:15px;font-weight:800;letter-spacing:.04em;
  padding:14px;cursor:pointer;
  transition:filter .2s,transform .1s,box-shadow .2s;
  box-shadow:0 6px 20px rgba(79,142,247,.3);
}
.pw-btn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 8px 28px rgba(79,142,247,.4);}
.pw-btn:active{transform:translateY(0);}
.pw-footer{
  font-size:11px;color:var(--text-muted);margin-top:20px;text-align:center;
}
</style>
</head>
<body>

<!-- ── 패스워드 모달 ── -->
<div class="pw-overlay" id="pw-overlay">
  <div class="pw-modal" role="dialog" aria-modal="true" aria-labelledby="pw-title">
    <div class="pw-logo">🔐</div>
    <div class="pw-title" id="pw-title">학습 콘텐츠 잠금</div>
    <div class="pw-sub">AWS DOP-C02 학습 자료에 접근하려면<br>패스워드를 입력해 주세요.</div>

    <div class="pw-input-wrap">
      <input
        class="pw-input" id="pw-input"
        type="password" placeholder="패스워드 입력"
        maxlength="20"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter') checkPw()"
      />
      <button class="pw-toggle" id="pw-toggle" onclick="togglePwVisible()" tabindex="-1" title="표시/숨김">👁</button>
    </div>

    <div class="pw-error-msg" id="pw-error"></div>

    <button class="pw-btn" onclick="checkPw()">확인</button>

    <div class="pw-footer">🍪 인증 후 쿠키에 저장되어 다음 방문 시 자동 로그인됩니다.</div>
  </div>
</div>

<div class="wrap">

  <!-- Topbar -->
  <div class="topbar">

    <!-- ── SET 선택 콤보박스 (badge 대체) ── -->
    <div class="set-select-wrap">
      <select class="set-select" id="set-select" onchange="goSet(this.value)">
        <option value="01" selected>DOP-C02 · SET 01</option>
        <option value="02">DOP-C02 · SET 02</option>
        <option value="03">DOP-C02 · SET 03</option>
        <option value="04">DOP-C02 · SET 04</option>
        <option value="05">DOP-C02 · SET 05</option>
        <option value="06">DOP-C02 · SET 06</option>
        <option value="07">DOP-C02 · SET 07</option>
        <option value="08">DOP-C02 · SET 08</option>
        <option value="09">DOP-C02 · SET 09</option>
      </select>
    </div>

    <div class="topbar-title">
      <strong>AWS Certified DevOps Engineer – Professional</strong>
      SET 05 · Q201~Q250 실전 학습
    </div>
    <div class="topbar-right">
      <!-- 상단 네비게이션 -->
      <button class="btn btn-nav" onclick="goQWithReset(curQ-1)" id="btn-prev-top">←</button>

      <!-- 문제 선택 콤보박스 -->
      <div class="q-select-wrap">
        <select class="q-select" id="q-select" onchange="goQWithReset(this.value-201)"></select>
      </div>
      <button class="btn btn-nav" onclick="goQWithReset(curQ+1)" id="btn-next-top">→</button>

      <!-- 테마 토글 -->
      <button class="theme-btn" onclick="toggleTheme()">
        <span id="theme-icon">☀️</span>
        <span id="theme-label">라이트</span>
      </button>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:5%"></div></div>

  <!-- Language Tabs -->
  <div class="lang-tabs">
    <button class="lang-tab active" onclick="setLang('ko',this)">한국어</button>
    <button class="lang-tab" onclick="setLang('both',this)">양국어</button>
  </div>

  <!-- Question Card -->
  <div class="card" id="q-card">
    <div class="q-label">
      문제 <span id="q-num-badge">001</span>
      <span id="q-type-badge" class="q-type-badge">단일 선택</span>
    </div>
    <!-- 한국어 문제 -->
    <div class="q-text" id="q-ko-text"></div>
    <!-- 영어 문제 (양국어 모드) -->
    <div class="q-text en-text" id="q-en-text"></div>

    <div class="choices-section">
      <div class="choices-label" id="choices-label">선택지</div>
      <div id="choices-container"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btn-review" onclick="doReview()" disabled>📋 정답 확인</button>
      <button class="btn btn-secondary" onclick="doReset()">↺ 초기화</button>
    </div>
    <div class="hint-text" id="hint-text">선택지를 클릭하면 정답 확인 버튼이 활성화됩니다.</div>
  </div>

  <!-- Review Panel -->
  <div class="review-panel" id="review-panel">
    <div class="answer-row">
      <span class="answer-label">정답</span>
      <span class="answer-badge" id="review-answer-badge"></span>
      <span class="vote-badge" id="review-vote-badge"></span>
    </div>
    <div class="section-title">✦ 정답 해설</div>
    <div class="explain-box" id="review-explain"></div>
    <div class="section-title" style="margin-top:14px;" id="wrong-section-title">✦ 오답 분석</div>
    <div class="explain-box" id="review-wrong"></div>
    <button class="disc-toggle" onclick="document.getElementById('disc-list').classList.toggle('show')">💬 주요 토론 의견 보기 / 숨기기</button>
    <div class="disc-list" id="disc-list"></div>
  </div>

  <!-- Bottom Nav -->
  <!-- <div class="nav-bottom">
    <button class="btn btn-nav" onclick="goQ(curQ-1)" id="btn-prev">← 이전</button>
    <span class="nav-info" id="nav-info"></span>
    <button class="btn btn-nav" onclick="goQ(curQ+1)" id="btn-next">다음 →</button>
  </div> -->

</div>
<script>
// ────────────────────────────────────────────────
// 패스워드 / 쿠키 인증
// ────────────────────────────────────────────────
const PW_CORRECT  = 'DOP2';
const COOKIE_NAME = 'dop2_auth';
const COOKIE_DAYS = 30; // 쿠키 유효기간 (일)

function getCookie(name) {
  const cookies = document.cookie.split(';');
  for (let c of cookies) {
    const [k, v] = c.trim().split('=');
    if (k === name) return decodeURIComponent(v || '');
  }
  return null;
}

function setCookie(name, value, days) {
  const expires = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${expires};path=/;SameSite=Lax`;
}

function unlockPage() {
  const overlay = document.getElementById('pw-overlay');
  overlay.classList.add('hidden');
  // 완전히 숨긴 뒤 DOM에서 제거
  overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
}

function checkPw() {
  const input = document.getElementById('pw-input');
  const errEl = document.getElementById('pw-error');
  const val   = input.value.trim();

  if (val === PW_CORRECT) {
    setCookie(COOKIE_NAME, PW_CORRECT, COOKIE_DAYS);
    errEl.textContent = '';
    input.classList.remove('error');
    unlockPage();
  } else {
    errEl.textContent = '❌ 패스워드가 올바르지 않습니다. 다시 입력해 주세요.';
    input.classList.add('error', 'shake');
    input.select();
    input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
  }
}

function togglePwVisible() {
  const input  = document.getElementById('pw-input');
  const toggle = document.getElementById('pw-toggle');

function goSet(setNum) {
  // 현재 페이지 파일명에서 set 번호만 교체
  const currentPath = window.location.pathname;
  const fileName = currentPath.split('/').pop(); // e.g. "DOP2-SET01.html"

  let newFileName;
  if (fileName && fileName.match(/DOP2-SET\d{2}/i)) {
    // 파일명에서 set 번호 교체
    newFileName = fileName.replace(/SET\d{2}/i, `SET${setNum}`);
  } else {
    // 파일명 패턴을 찾지 못한 경우 기본 패턴 사용
    newFileName = `DOP2-SET${setNum}.html`;
  }

  const newPath = currentPath.replace(fileName, newFileName);
  window.location.href = newPath;
}

  n: 204,
  en: `A company has an AWS CodeDeploy application. The application has a deployment group that uses a single tag group to identify instances for the deployment of Application. The single tag group configuration identifies instances that have Environment=Production and Name=ApplicationA tags for the deployment of ApplicationA.<br><br>The company launches an additional Amazon EC2 instance with Department=Marketing, Environment=Production, and Name=ApplicationB tags. On the next CodeDeploy deployment of Application, the additional instance has ApplicationA installed on it. A DevOps engineer needs to configure the existing deployment group to prevent ApplicationA from being installed on the additional instance.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사에 AWS CodeDeploy 애플리케이션이 있습니다. 이 애플리케이션에는 단일 태그 그룹을 사용하여 배포 대상 인스턴스를 식별하는 배포 그룹이 있습니다. 단일 태그 그룹 구성은 Environment=Production 및 Name=ApplicationA 태그가 있는 인스턴스를 ApplicationA 배포 대상으로 식별합니다.<br><br>회사는 Department=Marketing, Environment=Production, Name=ApplicationB 태그가 있는 추가 Amazon EC2 인스턴스를 시작합니다. ApplicationA의 다음 CodeDeploy 배포에서 추가 인스턴스에 ApplicationA가 설치되었습니다. DevOps 엔지니어는 추가 인스턴스에 ApplicationA가 설치되지 않도록 기존 배포 그룹을 구성해야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Change the current single tag group to include only the Environment=Production tag. Add another single tag group that includes only the Name=ApplicationA tag.`, ko:`현재 단일 태그 그룹을 변경하여 Environment=Production 태그만 포함합니다. Name=ApplicationA 태그만 포함하는 또 다른 단일 태그 그룹을 추가합니다.` },
    { k:'B', en:`Change the current single tag group to include the Department=Marketing, Environment=Production, and Name=ApplicationA tags.`, ko:`현재 단일 태그 그룹을 변경하여 Department=Marketing, Environment=Production, Name=ApplicationA 태그를 포함시킵니다.` },
    { k:'C', en:`Add another single tag group that includes only the Department=Marketing tag. Keep the Environment=Production and Name=ApplicationA tags with the current single tag group.`, ko:`Department=Marketing 태그만 포함하는 또 다른 단일 태그 그룹을 추가합니다. Environment=Production 및 Name=ApplicationA 태그는 현재 단일 태그 그룹과 함께 유지합니다.` },
    { k:'D', en:`Change the current single tag group to include only the Environment=Production tag. Add another single tag group that includes only the Department=Marketing tag.`, ko:`현재 단일 태그 그룹을 변경하여 Environment=Production 태그만 포함합니다. Department=Marketing 태그만 포함하는 또 다른 단일 태그 그룹을 추가합니다.` },
  ],
  answer: ['A'],
  vote: '93% A',
  explain: `<p><span class="mark-ok">✅ A — 두 개의 단일 태그 그룹 사용 (AND 논리)</span></p><p>CodeDeploy의 태그 그룹 논리: <strong>단일 태그 그룹 내</strong>의 태그는 OR 연산자이고, <strong>여러 태그 그룹 간</strong>은 AND 연산자입니다. 태그 그룹1(Environment=Production) AND 태그 그룹2(Name=ApplicationA)를 모두 만족해야만 배포 대상이 됩니다. 새 인스턴스는 Name=ApplicationB이므로 태그 그룹2와 일치하지 않아 배포에서 제외됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 하나의 태그 그룹에 세 태그를 넣으면 OR 연산자가 적용되어, 세 태그 중 하나만 있어도 배포 대상이 됩니다. 새 인스턴스는 Environment=Production을 갖고 있으므로 여전히 배포됩니다.</p><p><span class="mark-no">❌ C, D</span> — Department=Marketing 태그를 별도 그룹으로 추가하면 새 인스턴스가 오히려 배포 대상에 포함될 수 있습니다.</p>`,
  disc: [{ ans:'A (93%)', txt:'CodeDeploy 다중 태그 그룹 = AND 연산자 이해가 핵심. 단일 그룹 내 = OR. 두 그룹 분리 = AND로 Name=ApplicationA만 타겟팅.' }]
},
{
  n: 205,
  en: `A company is launching an application that stores raw data in an Amazon S3 bucket. Three applications need to access the data to generate reports. The data must be redacted differently for each application before the applications can access the data.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 Amazon S3 버킷에 원시 데이터를 저장하는 애플리케이션을 출시하고 있습니다. 세 개의 애플리케이션이 보고서를 생성하기 위해 데이터에 액세스해야 합니다. 애플리케이션이 데이터에 액세스하기 전에 각 애플리케이션에 맞게 데이터를 다르게 편집해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an S3 bucket for each application. Configure S3 Same-Region Replication (SRR) from the raw data's S3 bucket to each application's S3 bucket. Configure each application to consume data from its own S3 bucket.`, ko:`각 애플리케이션에 대해 S3 버킷을 만듭니다. 원시 데이터의 S3 버킷에서 각 애플리케이션의 S3 버킷으로 S3 동일 지역 복제(SRR)를 구성합니다. 각 애플리케이션이 자체 S3 버킷에서 데이터를 사용하도록 구성합니다.` },
    { k:'B', en:`Create an Amazon Kinesis data stream. Create an AWS Lambda function that is invoked by object creation events in the raw data's S3 bucket. Program the Lambda function to redact data for each application. Publish the data on the Kinesis data stream. Configure each application to consume data from the Kinesis data stream.`, ko:`Amazon Kinesis 데이터 스트림을 만듭니다. 원시 데이터의 S3 버킷에서 객체 생성 이벤트에 의해 호출되는 AWS Lambda 함수를 만듭니다. Lambda 함수가 각 애플리케이션의 데이터를 편집하도록 프로그래밍합니다. Kinesis 데이터 스트림에 데이터를 게시합니다. 각 애플리케이션이 Kinesis 데이터 스트림의 데이터를 사용하도록 구성합니다.` },
    { k:'C', en:`For each application, create an S3 access point that uses the raw data's S3 bucket as the destination. Create an AWS Lambda function that is invoked by object creation events in the raw data's S3 bucket. Program the Lambda function to redact data for each application. Store the data in each application's S3 access point. Configure each application to consume data from its own S3 access point.`, ko:`각 애플리케이션에 대해 원시 데이터의 S3 버킷을 대상으로 사용하는 S3 액세스 포인트를 만듭니다. 원시 데이터의 S3 버킷에서 객체 생성 이벤트에 의해 호출되는 AWS Lambda 함수를 만듭니다. Lambda 함수가 각 애플리케이션의 데이터를 편집하도록 프로그래밍합니다. 각 애플리케이션의 S3 액세스 포인트에 데이터를 저장합니다. 각 애플리케이션이 자체 S3 액세스 포인트에서 데이터를 사용하도록 구성합니다.` },
    { k:'D', en:`Create an S3 access point that uses the raw data's S3 bucket as the destination. For each application, create an S3 Object Lambda access point that uses the S3 access point. Configure the AWS Lambda function for each S3 Object Lambda access point to redact data when objects are retrieved. Configure each application to consume data from its own S3 Object Lambda access point.`, ko:`원시 데이터의 S3 버킷을 대상으로 사용하는 S3 액세스 포인트를 만듭니다. 각 애플리케이션에 대해 S3 액세스 포인트를 사용하는 S3 Object Lambda 액세스 포인트를 만듭니다. 각 S3 Object Lambda 액세스 포인트에 대해 객체를 검색할 때 데이터를 편집하도록 AWS Lambda 함수를 구성합니다. 각 애플리케이션이 자체 S3 Object Lambda 액세스 포인트에서 데이터를 사용하도록 구성합니다.` },
  ],
  answer: ['D'],
  vote: '89% D',
  explain: `<p><span class="mark-ok">✅ D — S3 Object Lambda</span></p><p>S3 Object Lambda를 사용하면 S3 GET 요청 시 Lambda 함수가 데이터를 동적으로 변환·편집한 후 애플리케이션에 반환합니다. 각 애플리케이션마다 별도의 Object Lambda 액세스 포인트를 생성하여 각기 다른 편집 규칙을 적용할 수 있습니다. 원시 데이터의 단일 사본을 유지하므로 스토리지 비용도 절감됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — SRR은 데이터를 그대로 복제하며 편집 기능이 없습니다. 또한 세 개의 추가 버킷을 유지해야 하므로 비용이 증가합니다.</p><p><span class="mark-no">❌ B</span> — Kinesis 데이터 스트림은 스트리밍 데이터에 적합하며, S3 기반의 보고서 생성 시나리오에 불필요한 복잡성을 추가합니다.</p><p><span class="mark-no">❌ C</span> — 일반 S3 액세스 포인트는 데이터 편집 기능이 없습니다. 미리 편집된 데이터를 저장해야 하므로 데이터 중복 문제가 발생합니다.</p>`,
  disc: [{ ans:'D (89%)', txt:'S3 Object Lambda는 검색 시 동적으로 변환하는 정확한 솔루션. 원시 데이터 단일 사본 유지 + 앱별 편집 규칙 적용.' }]
},
{
  n: 206,
  en: `A company uses AWS Control Tower and AWS CloudFormation to manage its AWS accounts and to create AWS resources. The company requires all Amazon S3 buckets to be encrypted with AWS Key Management Service (AWS KMS) when the S3 buckets are created in a CloudFormation stack.<br><br>Which solution will meet this requirement?`,
  ko: `한 회사가 AWS Control Tower와 AWS CloudFormation을 사용하여 AWS 계정을 관리하고 AWS 리소스를 생성합니다. 이 회사는 CloudFormation 스택에서 S3 버킷을 생성할 때 모든 Amazon S3 버킷을 AWS Key Management Service(AWS KMS)로 암호화하도록 요구합니다.<br><br>어떤 솔루션이 이 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use AWS Organizations. Attach an SCP that denies the s3:PutObject permission if the request does not include an x-amz-server-side-encryption header that requests server-side encryption with AWS KMS keys (SSE-KMS).`, ko:`AWS Organizations를 사용합니다. 요청에 AWS KMS 키(SSE-KMS)를 사용한 서버 측 암호화를 요청하는 x-amz-server-side-encryption 헤더가 포함되지 않은 경우 s3:PutObject 권한을 거부하는 SCP를 연결합니다.` },
    { k:'B', en:`Use AWS Control Tower with a multi-account environment. Configure and enable proactive AWS Control Tower controls on all OUs with CloudFormation hooks.`, ko:`다중 계정 환경에서 AWS Control Tower를 사용합니다. CloudFormation 후크를 사용하여 모든 OU에서 사전 예방적(proactive) AWS Control Tower 컨트롤을 구성하고 활성화합니다.` },
    { k:'C', en:`Use AWS Control Tower with a multi-account environment. Configure and enable detective AWS Control Tower controls on all OUs with CloudFormation hooks.`, ko:`다중 계정 환경에서 AWS Control Tower를 사용합니다. CloudFormation 후크를 사용하여 모든 OU에서 탐지(detective) AWS Control Tower 컨트롤을 구성하고 활성화합니다.` },
    { k:'D', en:`Use AWS Organizations. Create an AWS Config organizational rule to check whether a KMS encryption key is enabled for all S3 buckets. Deploy the rule. Create and apply an SCP to prevent users from stopping and deleting AWS Config across all AWS accounts.`, ko:`AWS Organizations를 사용합니다. AWS Config 조직 규칙을 만들어 모든 S3 버킷에 KMS 암호화 키가 활성화되어 있는지 확인합니다. 규칙을 배포합니다. SCP를 만들어 적용하여 모든 AWS 계정에서 사용자가 AWS Config를 중지하거나 삭제하지 못하도록 합니다.` },
  ],
  answer: ['B'],
  vote: '95% B',
  explain: `<p><span class="mark-ok">✅ B — 사전 예방적(Proactive) Control Tower 컨트롤 + CloudFormation 후크</span></p><p>사전 예방적(Proactive) 컨트롤은 CloudFormation 후크를 통해 스택 배포 전에 리소스 구성을 검사하고, 정책을 위반하는 리소스 생성을 사전에 차단합니다. Control Tower에는 "S3 버킷에 AWS KMS 서버 측 암호화 요구" 사전 예방적 컨트롤([CT.S3.PR.10])이 내장되어 있습니다. 이 방식은 CloudFormation 스택 내에서 KMS 암호화 없이 S3 버킷이 생성되는 것을 원천 차단합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — SCP의 s3:PutObject 거부는 객체 업로드 시 암호화를 강제하지만, 버킷 생성(s3:CreateBucket) 자체를 제어하지 못합니다.</p><p><span class="mark-no">❌ C</span> — 탐지(Detective) 컨트롤은 기존 리소스를 모니터링하고 보고하지만, 비준수 리소스 생성을 사전에 차단하지 않습니다.</p><p><span class="mark-no">❌ D</span> — AWS Config는 사후 감지에 적합하며, CloudFormation 스택 배포 시 실시간으로 차단하는 기능이 없습니다.</p>`,
  disc: [{ ans:'B (95%)', txt:'CloudFormation 스택에서 생성 시점에 강제 적용하려면 Proactive 컨트롤이 필수. Detective는 생성 후 감지만 함.' }]
},
{
  n: 207,
  en: `A DevOps engineer has developed an AWS Lambda function. The Lambda function starts an AWS CloudFormation drift detection operation on all supported resources for a specific CloudFormation stack. The Lambda function then exits its invocation.<br><br>The DevOps engineer has created an Amazon EventBridge scheduled rule that invokes the Lambda function every hour. An Amazon Simple Notification Service (Amazon SNS) topic already exists in the AWS account. The DevOps engineer has subscribed to the SNS topic to receive notifications.<br><br>The DevOps engineer needs to receive a notification as soon as possible when drift is detected in this specific stack configuration.<br><br>Which solution will meet these requirements?`,
  ko: `DevOps 엔지니어가 AWS Lambda 함수를 개발했습니다. Lambda 함수는 특정 CloudFormation 스택의 모든 지원 리소스에 대해 AWS CloudFormation 드리프트 감지 작업을 시작합니다. 그런 다음 Lambda 함수는 호출을 종료합니다.<br><br>DevOps 엔지니어는 매시간 Lambda 함수를 호출하는 Amazon EventBridge 예약 규칙을 만들었습니다. AWS 계정에 Amazon Simple Notification Service(Amazon SNS) 토픽이 이미 있습니다. DevOps 엔지니어는 알림을 받기 위해 SNS 토픽을 구독했습니다.<br><br>DevOps 엔지니어는 이 특정 스택 구성에서 드리프트가 감지되는 즉시 가능한 한 빨리 알림을 받아야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure the existing EventBridge rule to also target the SNS topic. Configure an SNS subscription filter policy to match the CloudFormation stack. Attach the subscription filter policy to the SNS topic.`, ko:`기존 EventBridge 규칙을 구성하여 SNS 토픽도 대상으로 지정합니다. CloudFormation 스택과 일치하도록 SNS 구독 필터 정책을 구성합니다. 구독 필터 정책을 SNS 토픽에 연결합니다.` },
    { k:'B', en:`Create a second Lambda function to query the CloudFormation API for the drift detection results for the stack. Configure the second Lambda function to publish a message to the SNS topic if drift is detected. Adjust the existing EventBridge rule to also target the second Lambda function.`, ko:`스택의 드리프트 감지 결과에 대해 CloudFormation API를 쿼리하는 두 번째 Lambda 함수를 만듭니다. 드리프트가 감지되면 두 번째 Lambda 함수가 SNS 토픽에 메시지를 게시하도록 구성합니다. 기존 EventBridge 규칙을 조정하여 두 번째 Lambda 함수도 대상으로 지정합니다.` },
    { k:'C', en:`Configure Amazon GuardDuty in the account with drift detection for all CloudFormation stacks. Create a second EventBridge rule that reacts to the GuardDuty drift detection event finding for the specific CloudFormation stack. Configure the SNS topic as a target of the second EventBridge rule.`, ko:`모든 CloudFormation 스택에 대해 드리프트 감지가 있는 계정에서 Amazon GuardDuty를 구성합니다. 특정 CloudFormation 스택에 대한 GuardDuty 드리프트 감지 이벤트 발견에 반응하는 두 번째 EventBridge 규칙을 만듭니다. SNS 토픽을 두 번째 EventBridge 규칙의 대상으로 구성합니다.` },
    { k:'D', en:`Configure AWS Config in the account. Use the cloudformation-stack-drift-detection-check managed rule. Create a second EventBridge rule that reacts to a compliance change event for the CloudFormation stack. Configure the SNS topic as a target of the second EventBridge rule.`, ko:`계정에서 AWS Config를 구성합니다. <code>cloudformation-stack-drift-detection-check</code> 관리형 규칙을 사용합니다. CloudFormation 스택의 규정 준수 변경 이벤트에 반응하는 두 번째 EventBridge 규칙을 만듭니다. SNS 토픽을 두 번째 EventBridge 규칙의 대상으로 구성합니다.` },
  ],
  answer: ['D'],
  vote: '73% D',
  explain: `<p><span class="mark-ok">✅ D — AWS Config의 cloudformation-stack-drift-detection-check + EventBridge</span></p><p>AWS Config의 <code>cloudformation-stack-drift-detection-check</code> 관리형 규칙은 CloudFormation 스택의 드리프트를 지속적으로 감지하며, 규정 준수 상태가 변경될 때 EventBridge 이벤트를 트리거합니다. 이 이벤트를 두 번째 EventBridge 규칙으로 포착하여 SNS 토픽에 알림을 보내면 드리프트 감지 즉시 알림을 받을 수 있습니다. 이는 시간 기반 폴링보다 더 신속한 반응이 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — EventBridge 예약 규칙은 드리프트 감지 결과가 아닌 예약된 시간에 Lambda를 호출합니다. SNS에 드리프트 결과를 직접 게시하지 않습니다.</p><p><span class="mark-no">❌ B</span> — 두 번째 Lambda도 동일한 시간 기반 EventBridge 규칙(매 1시간)에 묶여 있어 '가능한 한 빨리' 요건을 충족하지 못합니다.</p><p><span class="mark-no">❌ C</span> — GuardDuty는 보안 위협 감지 서비스로, CloudFormation 드리프트 감지 기능을 제공하지 않습니다.</p>`,
  disc: [{ ans:'D (73%)', txt:'AWS Config의 드리프트 감지 규칙이 규정 비준수 이벤트를 EventBridge로 전달 → SNS 알림. 매시간 폴링보다 즉각적. B는 여전히 1시간 주기로 동작.' }]
},
{
  n: 208,
  en: `A company has deployed a complex container-based workload on AWS. The workload uses Amazon Managed Service for Prometheus for monitoring. The workload runs in an Amazon Elastic Kubernetes Service (Amazon EKS) cluster in an AWS account.<br><br>The company's DevOps team wants to receive workload alerts by using the company's Amazon Simple Notification Service (Amazon SNS) topic. The SNS topic is in the same AWS account as the EKS cluster.<br><br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `한 회사가 AWS에 복잡한 컨테이너 기반 워크로드를 배포했습니다. 워크로드는 모니터링을 위해 Amazon Managed Service for Prometheus를 사용합니다. 워크로드는 AWS 계정의 Amazon Elastic Kubernetes Service(Amazon EKS) 클러스터에서 실행됩니다.<br><br>회사의 DevOps 팀은 회사의 Amazon Simple Notification Service(Amazon SNS) 토픽을 사용하여 워크로드 알림을 받으려고 합니다. SNS 토픽은 EKS 클러스터와 동일한 AWS 계정에 있습니다.<br><br>이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Use the Amazon Managed Service for Prometheus remote write URL to send alerts to the SNS topic.`, ko:`Amazon Managed Service for Prometheus 원격 쓰기 URL을 사용하여 SNS 토픽에 알림을 보냅니다.` },
    { k:'B', en:`Create an alerting rule that checks the availability of each of the workload's containers.`, ko:`각 워크로드 컨테이너의 가용성을 확인하는 알림 규칙을 만듭니다.` },
    { k:'C', en:`Create an alert manager configuration for the SNS topic.`, ko:`SNS 토픽에 대한 알림 관리자(Alert Manager) 구성을 만듭니다.` },
    { k:'D', en:`Modify the access policy of the SNS topic. Grant the aps.amazonaws.com service principal the sns:Publish permission and the sns:GetTopicAttributes permission for the SNS topic.`, ko:`SNS 토픽의 액세스 정책을 수정합니다. <code>aps.amazonaws.com</code> 서비스 주체에게 SNS 토픽에 대한 <code>sns:Publish</code> 권한과 <code>sns:GetTopicAttributes</code> 권한을 부여합니다.` },
    { k:'E', en:`Modify the IAM role that Amazon Managed Service for Prometheus uses. Grant the role the sns:Publish permission and the sns:GetTopicAttributes permission for the SNS topic.`, ko:`Amazon Managed Service for Prometheus가 사용하는 IAM 역할을 수정합니다. 역할에 SNS 토픽에 대한 <code>sns:Publish</code> 권한과 <code>sns:GetTopicAttributes</code> 권한을 부여합니다.` },
    { k:'F', en:`Create an OpenID Connect (OIDC) provider for the EKS cluster. Create a cluster service account. Grant the account the sns:Publish permission and the sns:GetTopicAttributes permission by using an IAM role.`, ko:`EKS 클러스터에 대한 OpenID Connect(OIDC) 공급자를 만듭니다. 클러스터 서비스 계정을 만듭니다. IAM 역할을 사용하여 계정에 <code>sns:Publish</code> 권한과 <code>sns:GetTopicAttributes</code> 권한을 부여합니다.` },
  ],
  answer: ['B','C','D'],
  vote: '67% BCD',
  explain: `<p><span class="mark-ok">✅ B — 알림 규칙 생성</span></p><p>Amazon Managed Service for Prometheus의 Alertmanager를 사용하려면 먼저 컨테이너 가용성 등을 체크하는 알림 규칙을 정의해야 합니다.</p><p><span class="mark-ok">✅ C — Alert Manager 구성 생성</span></p><p>SNS 수신자(receiver)를 포함하는 Alertmanager 구성을 생성하여 알림이 SNS 토픽으로 라우팅되도록 합니다.</p><p><span class="mark-ok">✅ D — SNS 액세스 정책 수정</span></p><p>Amazon Managed Service for Prometheus가 SNS 토픽에 메시지를 게시할 수 있도록 SNS 액세스 정책에 <code>aps.amazonaws.com</code> 서비스 주체에게 <code>sns:Publish</code> 및 <code>sns:GetTopicAttributes</code> 권한을 부여해야 합니다. 이는 AWS 공식 문서에서 명시된 방법입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 원격 쓰기(remote write) URL은 메트릭 데이터를 원격 저장소로 전송하는 데 사용되며, SNS에 직접 알림을 보내는 기능이 아닙니다.</p><p><span class="mark-no">❌ E</span> — Amazon Managed Service for Prometheus는 서비스 주체를 통해 SNS와 상호작용하므로, IAM 역할보다 SNS 리소스 정책(D)을 수정하는 것이 올바른 방법입니다.</p><p><span class="mark-no">❌ F</span> — OIDC와 EKS 서비스 계정은 워크로드 파드가 AWS 서비스에 접근할 때 사용되며, AMP→SNS 알림 경로와 무관합니다.</p>`,
  disc: [{ ans:'BCD (67%)', txt:'AWS 문서(AMP-alertmanager-receiver-AMPpermission.html) 확인 결과 D(SNS 액세스 정책의 aps.amazonaws.com 서비스 주체 허용)가 공식 방법.' }]
},
{
  n: 209,
  en: `A company's organization in AWS Organizations has a single OU. The company runs Amazon EC2 instances in the OU accounts. The company needs to limit the use of each EC2 instance's credentials to the specific EC2 instance that the credential is assigned to. A DevOps engineer must configure security for the EC2 instances.<br><br>Which solution will meet these requirements?`,
  ko: `AWS Organizations의 회사 조직에는 단일 OU가 있습니다. 회사는 OU 계정에서 Amazon EC2 인스턴스를 실행합니다. 회사는 각 EC2 인스턴스의 자격 증명 사용을 해당 자격 증명이 할당된 특정 EC2 인스턴스로 제한해야 합니다. DevOps 엔지니어는 EC2 인스턴스에 대한 보안을 구성해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an SCP that specifies the VPC CIDR block. Configure the SCP to check whether the value of the aws:VpcSourceIp condition key is in the specified block. In the same SCP check, check whether the values of the aws:EC2InstanceSourcePrivateIPv4 and aws:SourceVpc condition keys are the same. Deny access if either condition is false. Apply the SCP to the OU.`, ko:`VPC CIDR 블록을 지정하는 SCP를 만듭니다. SCP를 구성하여 <code>aws:VpcSourceIp</code> 조건 키의 값이 지정된 블록에 있는지 확인합니다. 동일한 SCP 검사에서 <code>aws:EC2InstanceSourcePrivateIPv4</code>와 <code>aws:SourceVpc</code> 조건 키의 값이 동일한지 확인합니다. 두 조건 중 하나가 거짓이면 액세스를 거부합니다. SCP를 OU에 적용합니다.` },
    { k:'B', en:`Create an SCP that checks whether the values of the aws:EC2InstanceSourceVPC and aws:SourceVpc condition keys are the same. Deny access if the values are not the same. In the same SCP check, check whether the values of the aws:EC2InstanceSourcePrivateIPv4 and aws:VpcSourceIp condition keys are the same. Deny access if the values are not the same. Apply the SCP to the OU.`, ko:`<code>aws:EC2InstanceSourceVPC</code>와 <code>aws:SourceVpc</code> 조건 키의 값이 동일한지 확인하는 SCP를 만듭니다. 값이 동일하지 않으면 액세스를 거부합니다. 동일한 SCP 검사에서 <code>aws:EC2InstanceSourcePrivateIPv4</code>와 <code>aws:VpcSourceIp</code> 조건 키의 값이 동일한지 확인합니다. 값이 동일하지 않으면 액세스를 거부합니다. SCP를 OU에 적용합니다.` },
    { k:'C', en:`Create an SCP that includes a list of acceptable VPC values and checks whether the value of the aws:SourceVpc condition key is in the list. In the same SCP check, define a list of acceptable IP address values and check whether the value of the aws:VpcSourceIp condition key is in the list. Deny access if either condition is false. Apply the SCP to each account in the organization.`, ko:`허용 가능한 VPC 값 목록을 포함하고 <code>aws:SourceVpc</code> 조건 키 값이 목록에 있는지 확인하는 SCP를 만듭니다. 동일한 SCP 검사에서 허용 가능한 IP 주소 값 목록을 정의하고 <code>aws:VpcSourceIp</code> 조건 키 값이 목록에 있는지 확인합니다. 두 조건 중 하나가 거짓이면 액세스를 거부합니다. 조직의 각 계정에 SCP를 적용합니다.` },
    { k:'D', en:`Create an SCP that checks whether the values of the aws:EC2InstanceSourceVPC and aws:VpcSourceIp condition keys are the same. Deny access if the values are not the same. In the same SCP check, check whether the values of the aws:EC2InstanceSourcePrivateIPv4 and aws:SourceVpc condition keys are the same. Deny access if the values are not the same. Apply the SCP to each account in the organization.`, ko:`<code>aws:EC2InstanceSourceVPC</code>와 <code>aws:VpcSourceIp</code> 조건 키의 값이 동일한지 확인하는 SCP를 만듭니다. 값이 동일하지 않으면 액세스를 거부합니다. 동일한 SCP 검사에서 <code>aws:EC2InstanceSourcePrivateIPv4</code>와 <code>aws:SourceVpc</code> 조건 키의 값이 동일한지 확인합니다. 값이 동일하지 않으면 액세스를 거부합니다. 조직의 각 계정에 SCP를 적용합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — 올바른 조건 키 쌍 비교 + OU에 적용</span></p><p>EC2 인스턴스 자격 증명을 해당 인스턴스로만 제한하려면 두 쌍의 조건 키를 비교해야 합니다.</p><ul><li><code>aws:EC2InstanceSourceVPC</code> == <code>aws:SourceVpc</code>: 요청이 해당 인스턴스가 속한 VPC에서 왔는지 확인</li><li><code>aws:EC2InstanceSourcePrivateIPv4</code> == <code>aws:VpcSourceIp</code>: 요청이 해당 인스턴스의 IP에서 왔는지 확인</li></ul><p>두 조건이 모두 일치해야만 해당 EC2 인스턴스의 자격 증명으로 API를 호출할 수 있습니다. SCP는 계정이 아닌 OU에 적용합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CIDR 블록으로 범위를 지정하는 방식은 특정 인스턴스로 제한하는 것이 아니라 IP 범위로만 제한하므로 요건 미충족.</p><p><span class="mark-no">❌ C</span> — 허용 IP 목록을 하드코딩하면 인스턴스가 변경될 때마다 유지 관리가 필요하며, 인스턴스별 동적 제한이 불가능합니다.</p><p><span class="mark-no">❌ D</span> — 조건 키 쌍이 잘못됩니다. <code>aws:EC2InstanceSourceVPC</code>와 <code>aws:VpcSourceIp</code>는 비교 대상이 다릅니다(VPC ID vs IP 주소).</p>`,
  disc: [{ ans:'B (100%)', txt:'AWS 보안 블로그(how-to-use-policies-to-restrict-where-ec2-instance-credentials-can-be-used-from) 기준. 올바른 쌍: EC2InstanceSourceVPC=SourceVpc, EC2InstanceSourcePrivateIPv4=VpcSourceIp.' }]
},
{
  n: 210,
  en: `A company has a fleet of Amazon EC2 instances that run Linux in a single AWS account. The company is using an AWS Systems Manager Automation task across the EC2 instances.<br><br>During the most recent patch cycle, several EC2 instances went into an error state because of insufficient available disk space. A DevOps engineer needs to ensure that the EC2 instances have sufficient available disk space during the patching process in the future.<br><br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `한 회사에는 단일 AWS 계정에서 Linux를 실행하는 Amazon EC2 인스턴스 집합이 있습니다. 이 회사는 EC2 인스턴스 전반에 AWS Systems Manager Automation 작업을 사용하고 있습니다.<br><br>가장 최근의 패치 주기 동안 여러 EC2 인스턴스가 사용 가능한 디스크 공간 부족으로 오류 상태가 되었습니다. DevOps 엔지니어는 향후 패치 프로세스 중에 EC2 인스턴스에 충분한 사용 가능 디스크 공간이 있는지 확인해야 합니다.<br><br>이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Ensure that the Amazon CloudWatch agent is installed on all EC2 instances.`, ko:`모든 EC2 인스턴스에 Amazon CloudWatch 에이전트가 설치되어 있는지 확인합니다.` },
    { k:'B', en:`Create a cron job that is installed on each EC2 instance to periodically delete temporary files.`, ko:`각 EC2 인스턴스에 설치되는 cron 작업을 생성하여 임시 파일을 주기적으로 삭제합니다.` },
    { k:'C', en:`Create an Amazon CloudWatch log group for the EC2 instances. Configure a cron job that is installed on each EC2 instance to write the available disk space to a CloudWatch log stream for the relevant EC2 instance.`, ko:`EC2 인스턴스에 대한 Amazon CloudWatch 로그 그룹을 만듭니다. 각 EC2 인스턴스에 설치된 cron 작업을 구성하여 관련 EC2 인스턴스에 대한 CloudWatch 로그 스트림에 사용 가능한 디스크 공간을 씁니다.` },
    { k:'D', en:`Create an Amazon CloudWatch alarm to monitor available disk space on all EC2 instances. Add the alarm as a safety control to the Systems Manager Automation task.`, ko:`모든 EC2 인스턴스에서 사용 가능한 디스크 공간을 모니터링하기 위해 Amazon CloudWatch 알람을 만듭니다. 알람을 Systems Manager Automation 작업에 안전 제어(safety control)로 추가합니다.` },
    { k:'E', en:`Create an AWS Lambda function to periodically check for sufficient available disk space on all EC2 instances by evaluating each EC2 instance's respective Amazon CloudWatch log stream.`, ko:`각 EC2 인스턴스의 Amazon CloudWatch 로그 스트림을 평가하여 모든 EC2 인스턴스에 충분한 사용 가능 디스크 공간이 있는지 주기적으로 확인하는 AWS Lambda 함수를 생성합니다.` },
  ],
  answer: ['A','D'],
  vote: '100% AD',
  explain: `<p><span class="mark-ok">✅ A — CloudWatch 에이전트 설치</span></p><p>CloudWatch 에이전트는 디스크 공간 사용량을 포함한 시스템 수준 메트릭을 수집하여 CloudWatch로 전송합니다. 별도의 cron 작업 없이 에이전트 구성만으로 사용 가능 디스크 공간 메트릭을 수집할 수 있습니다.</p><p><span class="mark-ok">✅ D — CloudWatch 알람을 Systems Manager 안전 제어로 추가</span></p><p>디스크 공간을 모니터링하는 CloudWatch 알람을 Systems Manager Automation 작업의 안전 제어(safety control)로 추가하면, 알람이 발생 상태(ALARM)일 때 패치 작업이 진행되지 않습니다. 디스크 공간 부족 시 패치를 자동으로 중단합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — cron으로 임시 파일을 삭제하는 것은 임시 해결책으로 근본적인 모니터링과 예방 제어를 제공하지 않습니다.</p><p><span class="mark-no">❌ C</span> — cron + 로그 스트림 방식은 CloudWatch 에이전트(A)보다 복잡하고, 로그 기반으로는 알람 안전 제어를 직접 연동하기 어렵습니다.</p><p><span class="mark-no">❌ E</span> — Lambda 함수로 로그 스트림을 평가하는 것은 불필요하게 복잡한 아키텍처입니다. A+D 조합이 훨씬 간결하고 효과적입니다.</p>`,
  disc: [{ ans:'AD (100%)', txt:'AWS 블로그(avoid-patching-failures-due-to-low-disk-space-with-aws-systems-manager-automation-and-cloudwatch-alarms)에서 정확히 이 패턴을 설명. CloudWatch 에이전트 + 알람을 SSM 안전 제어로 연동.' }]
},
{
  n: 211,
  en: `A DevOps engineer is building an application that uses an AWS Lambda function to query an Amazon Aurora MySQL DB cluster. The Lambda function performs only read queries. Amazon EventBridge events invoke the Lambda function.<br><br>As more events invoke the Lambda function each second, the database's latency increases and the database's throughput decreases. The DevOps engineer needs to improve the performance of the application.<br><br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `DevOps 엔지니어가 AWS Lambda 함수를 사용하여 Amazon Aurora MySQL DB 클러스터를 쿼리하는 애플리케이션을 빌드하고 있습니다. Lambda 함수는 읽기 쿼리만 수행합니다. Amazon EventBridge 이벤트가 Lambda 함수를 호출합니다.<br><br>초당 Lambda 함수를 호출하는 이벤트가 많아질수록 데이터베이스의 지연 시간이 증가하고 처리량이 감소합니다. DevOps 엔지니어는 애플리케이션의 성능을 개선해야 합니다.<br><br>이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Use Amazon RDS Proxy to create a proxy. Connect the proxy to the Aurora cluster reader endpoint. Set a maximum connections percentage on the proxy.`, ko:`Amazon RDS Proxy를 사용하여 프록시를 만듭니다. 프록시를 Aurora 클러스터 리더 엔드포인트에 연결합니다. 프록시에서 최대 연결 백분율을 설정합니다.` },
    { k:'B', en:`Implement database connection pooling inside the Lambda code. Set a maximum number of connections on the database connection pool.`, ko:`Lambda 코드 내에서 데이터베이스 연결 풀링을 구현합니다. 데이터베이스 연결 풀에서 최대 연결 수를 설정합니다.` },
    { k:'C', en:`Implement the database connection opening outside the Lambda event handler code.`, ko:`Lambda 이벤트 핸들러 코드 외부에서 데이터베이스 연결 열기를 구현합니다.` },
    { k:'D', en:`Implement the database connection opening and closing inside the Lambda event handler code.`, ko:`Lambda 이벤트 핸들러 코드 내에서 데이터베이스 연결 열기 및 닫기를 구현합니다.` },
    { k:'E', en:`Connect to the proxy endpoint from the Lambda function.`, ko:`Lambda 함수에서 프록시 엔드포인트에 연결합니다.` },
    { k:'F', en:`Connect to the Aurora cluster endpoint from the Lambda function.`, ko:`Lambda 함수에서 Aurora 클러스터 엔드포인트에 연결합니다.` },
  ],
  answer: ['A','C','E'],
  vote: '83% ACE',
  explain: `<p><span class="mark-ok">✅ A — RDS Proxy를 리더 엔드포인트에 연결</span></p><p>RDS Proxy는 데이터베이스 연결을 풀링·재사용하여 Aurora에 대한 연결 부하를 줄입니다. 읽기 전용 쿼리이므로 리더 엔드포인트를 대상으로 하는 것이 적합합니다.</p><p><span class="mark-ok">✅ C — 핸들러 외부에서 DB 연결 초기화</span></p><p>Lambda 핸들러 외부에서 DB 연결을 열면 실행 환경이 재사용될 때 연결이 유지(warm 상태)되어 매 호출마다 새 연결을 맺는 오버헤드를 줄일 수 있습니다.</p><p><span class="mark-ok">✅ E — 프록시 엔드포인트에 연결</span></p><p>Lambda 함수가 Aurora 클러스터 직접이 아닌 RDS Proxy 엔드포인트에 연결하도록 업데이트해야 프록시의 연결 풀링 이점을 실제로 활용할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — Lambda 코드 내에서 수동으로 연결 풀링을 구현하는 것은 RDS Proxy보다 복잡하고, Lambda의 무상태 특성상 실질적인 풀링 효과가 제한됩니다.</p><p><span class="mark-no">❌ D</span> — 핸들러 내부에서 연결 열기/닫기를 구현하면 매 Lambda 호출마다 새 연결이 생성·소멸되어 오버헤드가 증가합니다.</p><p><span class="mark-no">❌ F</span> — Aurora 클러스터 엔드포인트에 직접 연결하면 RDS Proxy의 이점을 활용할 수 없습니다.</p>`,
  disc: [{ ans:'ACE (83%)', txt:'RDS Proxy + 핸들러 외부 연결 초기화 + 프록시 엔드포인트 사용이 공식 AWS 권장 패턴(Lambda + RDS Proxy 블로그 포스트 참조).' }]
},
{
  n: 212,
  en: `A company has an AWS CloudFormation stack that is deployed in a single AWS account. The company has configured the stack to send event notifications to an Amazon Simple Notification Service (Amazon SNS) topic.<br><br>A DevOps engineer must implement an automated solution that applies a tag to the specific CloudFormation stack instance only after a successful stack update occurs. The DevOps engineer has created an AWS Lambda function that applies and updates this tag for the specific stack instance.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사에 단일 AWS 계정에 배포된 AWS CloudFormation 스택이 있습니다. 이 회사는 스택이 Amazon Simple Notification Service(Amazon SNS) 토픽에 이벤트 알림을 보내도록 구성했습니다.<br><br>DevOps 엔지니어는 성공적인 스택 업데이트가 발생한 후에만 특정 CloudFormation 스택 인스턴스에 태그를 적용하는 자동화된 솔루션을 구현해야 합니다. DevOps 엔지니어는 특정 스택 인스턴스에 이 태그를 적용하고 업데이트하는 AWS Lambda 함수를 만들었습니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Run the AWS-UpdateCloudFormationStack AWS Systems Manager Automation runbook when Systems Manager detects an UPDATE_COMPLETE event for the instance status of the CloudFormation stack. Configure the runbook to invoke the Lambda function.`, ko:`Systems Manager가 CloudFormation 스택의 인스턴스 상태에 대한 UPDATE_COMPLETE 이벤트를 감지하면 AWS-UpdateCloudFormationStack AWS Systems Manager Automation 런북을 실행합니다. Lambda 함수를 호출하도록 런북을 구성합니다.` },
    { k:'B', en:`Create a custom AWS Config rule that produces a compliance change event if the CloudFormation stack has an UPDATE_COMPLETE instance status. Configure AWS Config to directly invoke the Lambda function to automatically remediate the change event.`, ko:`CloudFormation 스택에 UPDATE_COMPLETE 인스턴스 상태가 있는 경우 규정 준수 변경 이벤트를 생성하는 사용자 지정 AWS Config 규칙을 만듭니다. AWS Config를 구성하여 Lambda 함수를 직접 호출하여 변경 이벤트를 자동으로 수정합니다.` },
    { k:'C', en:`Create an Amazon EventBridge rule that matches the UPDATE_COMPLETE event pattern for the instance status of the CloudFormation stack. Configure the rule to invoke the Lambda function.`, ko:`CloudFormation 스택의 인스턴스 상태에 대한 UPDATE_COMPLETE 이벤트 패턴과 일치하는 Amazon EventBridge 규칙을 만듭니다. Lambda 함수를 호출하도록 규칙을 구성합니다.` },
    { k:'D', en:`Adjust the configuration of the CloudFormation stack to send notifications for only an UPDATE_COMPLETE instance status event to the SNS topic. Subscribe the Lambda function to the SNS topic.`, ko:`CloudFormation 스택의 구성을 조정하여 UPDATE_COMPLETE 인스턴스 상태 이벤트에 대한 알림만 SNS 토픽으로 보냅니다. Lambda 함수를 SNS 토픽에 구독합니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — EventBridge 규칙 + Lambda</span></p><p>Amazon EventBridge는 CloudFormation의 <code>UPDATE_COMPLETE</code> 상태 변경 이벤트를 직접 감지할 수 있습니다. EventBridge 규칙을 통해 해당 이벤트가 발생할 때 Lambda 함수를 즉시 트리거할 수 있어 가장 직접적이고 효율적인 방법입니다. 추가 SNS 구성이 필요 없습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — AWS Systems Manager의 AWS-UpdateCloudFormationStack 런북은 스택 업데이트를 수행하는 용도이며, UPDATE_COMPLETE 이벤트를 자동으로 감지하지 않습니다.</p><p><span class="mark-no">❌ B</span> — AWS Config 규칙은 구성 변경을 평가하지만 CloudFormation 스택 업데이트 상태를 실시간으로 감지하는 데는 적합하지 않으며, 불필요한 복잡성을 추가합니다.</p><p><span class="mark-no">❌ D</span> — D도 동작하지만, SNS 구독 + Lambda 방식은 C보다 더 많은 구성 단계가 필요합니다. C가 더 간단하고 직접적입니다.</p>`,
  disc: [{ ans:'C (100%)', txt:'EventBridge + Lambda는 CloudFormation 이벤트 기반 자동화의 표준 패턴. D는 작동하지만 불필요한 SNS 레이어 추가.' }]
},
{
  n: 213,
  en: `A company deploys an application to two AWS Regions. The application creates and stores objects in an Amazon S3 bucket that is in the same Region as the application. Both deployments of the application need to have access to all the objects and their metadata from both Regions. The company has configured two-way replication between the S3 buckets and has enabled S3 Replication metrics on each S3 bucket.<br><br>A DevOps engineer needs to implement a solution that retries the replication process if an object fails to replicate.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 두 개의 AWS 리전에 애플리케이션을 배포합니다. 애플리케이션은 애플리케이션과 동일한 리전에 있는 Amazon S3 버킷에 객체를 생성하고 저장합니다. 두 애플리케이션 배포 모두 두 리전의 모든 객체와 해당 메타데이터에 액세스할 수 있어야 합니다. 회사는 S3 버킷 간에 양방향 복제를 구성하고 각 S3 버킷에서 S3 복제 메트릭을 활성화했습니다.<br><br>DevOps 엔지니어는 객체가 복제에 실패하면 복제 프로세스를 재시도하는 솔루션을 구현해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an Amazon EventBridge rule that listens to S3 event notifications for failed replication events. Create an AWS Lambda function that downloads the failed replication object and then runs a PutObject command for the object to the destination bucket. Configure the EventBridge rule to invoke the Lambda function to handle the object that failed to replicate.`, ko:`실패한 복제 이벤트에 대한 S3 이벤트 알림을 수신하는 Amazon EventBridge 규칙을 만듭니다. 실패한 복제 객체를 다운로드한 다음 대상 버킷에 객체에 대한 PutObject 명령을 실행하는 AWS Lambda 함수를 만듭니다. 복제에 실패한 객체를 처리하기 위해 Lambda 함수를 호출하도록 EventBridge 규칙을 구성합니다.` },
    { k:'B', en:`Create an Amazon Simple Queue Service (Amazon SQS) queue. Configure S3 event notifications to send failed replication notifications to the SQS queue. Create an AWS Lambda function that downloads the failed replication object and then runs a PutObject command for the object to the destination bucket. Configure the Lambda function to poll the queue for notifications to process.`, ko:`Amazon Simple Queue Service(Amazon SQS) 대기열을 만듭니다. S3 이벤트 알림을 구성하여 실패한 복제 알림을 SQS 대기열로 보냅니다. 실패한 복제 객체를 다운로드한 다음 대상 버킷에 객체에 대한 PutObject 명령을 실행하는 AWS Lambda 함수를 만듭니다. Lambda 함수가 알림 처리를 위해 대기열을 폴링하도록 구성합니다.` },
    { k:'C', en:`Create an Amazon EventBridge rule that listens to S3 event notifications for failed replications. Create an AWS Lambda function that downloads the failed replication object and then runs a PutObject command for the object to the destination bucket.`, ko:`실패한 복제에 대한 S3 이벤트 알림을 수신하는 Amazon EventBridge 규칙을 만듭니다. 실패한 복제 객체를 다운로드한 다음 대상 버킷에 객체에 대한 PutObject 명령을 실행하는 AWS Lambda 함수를 만듭니다.` },
    { k:'D', en:`Create an AWS Lambda function that will use S3 batch operations to retry the replication on the existing object for a failed replication. Configure S3 event notifications to send failed replication notifications to the Lambda function.`, ko:`S3 배치 작업을 사용하여 실패한 복제에 대한 기존 객체에서 복제를 재시도하는 AWS Lambda 함수를 만듭니다. 실패한 복제 알림을 Lambda 함수로 보내도록 S3 이벤트 알림을 구성합니다.` },
  ],
  answer: ['D'],
  vote: '85% D',
  explain: `<p><span class="mark-ok">✅ D — S3 배치 작업으로 복제 재시도</span></p><p>S3 배치 복제(S3 Batch Replication)는 복제에 실패한 객체를 포함하여 기존 객체에 대해 복제를 재시도할 수 있는 AWS 공식 기능입니다. S3 이벤트 알림으로 실패를 감지하고 Lambda를 통해 S3 배치 작업을 트리거하는 것이 AWS 권장 패턴입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A, B, C</span> — 객체를 다운로드 후 PutObject로 재업로드하는 방식은 메타데이터(복제 상태, ETag 등)를 보존하지 않을 수 있으며, S3 배치 복제에 비해 신뢰성이 낮습니다. A와 C는 EventBridge 규칙을 구성하지만 Lambda에서 복제를 트리거하는 연결이 불완전합니다.</p>`,
  disc: [{ ans:'D (85%)', txt:'AWS 공식 문서(s3-batch-replication-batch.html): S3 배치 복제는 복제 실패 객체 재시도에 특화된 기능. PutObject 방식(A/B/C)은 복제 메타데이터 손실 위험.' }]
},
{
  n: 214,
  en: `A company needs to implement failover for its application. The application includes an Amazon CloudFront distribution and a public Application Load Balancer (ALB) in an AWS Region. The company has configured the ALB as the default origin for the distribution.<br><br>After some recent application outages, the company wants a zero-second RTO. The company deploys the application to a secondary Region in a warm standby configuration. A DevOps engineer needs to automate the failover of the application to the secondary Region so that HTTP GET requests meet the desired RTO.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 애플리케이션에 대한 장애 조치를 구현해야 합니다. 애플리케이션에는 Amazon CloudFront 배포와 AWS 리전의 퍼블릭 Application Load Balancer(ALB)가 포함됩니다. 회사는 ALB를 배포의 기본 오리진으로 구성했습니다.<br><br>최근 애플리케이션 중단 후 회사는 0초 RTO를 원합니다. 회사는 웜 스탠바이 구성에서 보조 리전에 애플리케이션을 배포합니다. DevOps 엔지니어는 HTTP GET 요청이 원하는 RTO를 충족하도록 보조 리전으로의 애플리케이션 장애 조치를 자동화해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a second CloudFront distribution that has the secondary ALB as the default origin. Create Amazon Route 53 alias records that have a failover policy and Evaluate Target Health set to Yes for both CloudFront distributions. Update the application to use the new record set.`, ko:`보조 ALB를 기본 오리진으로 하는 두 번째 CloudFront 배포를 만듭니다. 두 CloudFront 배포 모두에 대해 장애 조치 정책 및 Evaluate Target Health를 Yes로 설정한 Amazon Route 53 별칭 레코드를 만듭니다. 새 레코드 세트를 사용하도록 애플리케이션을 업데이트합니다.` },
    { k:'B', en:`Create a new origin on the distribution for the secondary ALB. Create a new origin group. Set the original ALB as the primary origin. Configure the origin group to fail over for HTTP 5xx status codes. Update the default behavior to use the origin group.`, ko:`보조 ALB에 대한 배포에서 새 오리진을 만듭니다. 새 오리진 그룹을 만듭니다. 원래 ALB를 기본 오리진으로 설정합니다. HTTP 5xx 상태 코드에 대해 장애 조치하도록 오리진 그룹을 구성합니다. 오리진 그룹을 사용하도록 기본 동작을 업데이트합니다.` },
    { k:'C', en:`Create Amazon Route 53 alias records that have a failover policy and Evaluate Target Health set to Yes for both ALBs. Set the TTL of both records to 0. Update the distribution's origin to use the new record set.`, ko:`두 ALB 모두에 대해 장애 조치 정책 및 Evaluate Target Health를 Yes로 설정한 Amazon Route 53 별칭 레코드를 만듭니다. 두 레코드의 TTL을 0으로 설정합니다. 배포의 오리진을 업데이트하여 새 레코드 세트를 사용합니다.` },
    { k:'D', en:`Create a CloudFront function that detects HTTP 5xx status codes. Configure the function to return a 307 Temporary Redirect error response to the secondary ALB if the function detects 5xx status codes. Update the distribution's default behavior to send origin responses to the function.`, ko:`HTTP 5xx 상태 코드를 감지하는 CloudFront 함수를 만듭니다. 함수가 5xx 상태 코드를 감지하면 보조 ALB에 307 임시 리디렉션 오류 응답을 반환하도록 함수를 구성합니다. 배포의 기본 동작을 업데이트하여 원본 응답을 함수에 보냅니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — CloudFront 오리진 그룹 + 오리진 장애 조치</span></p><p>CloudFront의 오리진 그룹(Origin Group) 기능을 사용하면 기본 오리진이 HTTP 5xx 오류를 반환할 때 자동으로 보조 오리진으로 요청을 라우팅합니다. 이 전환은 CloudFront 엣지 레벨에서 자동으로 발생하므로 DNS TTL이나 Route 53 헬스 체크 전파 지연 없이 실질적인 0초 RTO에 가까운 장애 조치가 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Route 53 장애 조치는 DNS 기반으로 TTL 및 헬스 체크 전파 시간이 있어 RTO가 0초를 보장하지 않습니다.</p><p><span class="mark-no">❌ C</span> — Route 53 별칭 레코드 TTL을 0으로 설정해도 헬스 체크 감지 및 전파에 수십 초가 소요될 수 있습니다.</p><p><span class="mark-no">❌ D</span> — CloudFront 함수는 요청/응답 변환에 사용되며, 5xx를 감지하여 클라이언트에 307 리디렉션을 반환하면 추가 왕복이 필요해 RTO가 증가합니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'CloudFront 오리진 장애 조치는 엣지에서 즉시 발생하여 0초 RTO에 가장 가깝습니다. AWS 문서(high_availability_origin_failover.html) 참조.' }]
},
{
  n: 215,
  en: `A cloud team uses AWS Organizations and AWS IAM Identity Center (AWS Single Sign-On) to manage a company's AWS accounts. The company recently established a research team. The research team requires the ability to fully manage the resources in its account. The research team must not be able to create IAM users.<br><br>The cloud team creates a Research Administrator permission set in IAM Identity Center for the research team. The permission set has the AdministratorAccess AWS managed policy attached. The cloud team must ensure that no one on the research team can create IAM users.<br><br>Which solution will meet these requirements?`,
  ko: `클라우드 팀은 AWS Organizations와 AWS IAM Identity Center(AWS Single Sign-On)를 사용하여 회사의 AWS 계정을 관리합니다. 이 회사는 최근 연구팀을 구성했습니다. 연구팀에는 계정의 리소스를 완전히 관리할 수 있는 기능이 필요합니다. 연구팀은 IAM 사용자를 만들 수 없어야 합니다.<br><br>클라우드 팀은 연구팀을 위해 IAM Identity Center에서 Research Administrator 권한 집합을 만듭니다. 권한 집합에는 AdministratorAccess AWS 관리형 정책이 연결되어 있습니다. 클라우드 팀은 연구팀의 누구도 IAM 사용자를 만들 수 없도록 해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an IAM policy that denies the iam:CreateUser action. Attach the IAM policy to the Research Administrator permission set.`, ko:`<code>iam:CreateUser</code> 작업을 거부하는 IAM 정책을 만듭니다. IAM 정책을 Research Administrator 권한 집합에 연결합니다.` },
    { k:'B', en:`Create an IAM policy that allows all actions except the iam:CreateUser action. Use the IAM policy to set the permissions boundary for the Research Administrator permission set.`, ko:`<code>iam:CreateUser</code> 작업을 제외한 모든 작업을 허용하는 IAM 정책을 만듭니다. IAM 정책을 사용하여 Research Administrator 권한 집합에 대한 권한 경계를 설정합니다.` },
    { k:'C', en:`Create an SCP that denies the iam:CreateUser action. Attach the SCP to the research team's AWS account.`, ko:`<code>iam:CreateUser</code> 작업을 거부하는 SCP를 만듭니다. SCP를 연구팀의 AWS 계정에 연결합니다.` },
    { k:'D', en:`Create an AWS Lambda function that deletes IAM users. Create an Amazon EventBridge rule that detects the IAM CreateUser event. Configure the rule to invoke the Lambda function.`, ko:`IAM 사용자를 삭제하는 AWS Lambda 함수를 만듭니다. IAM CreateUser 이벤트를 감지하는 Amazon EventBridge 규칙을 만듭니다. Lambda 함수를 호출하도록 규칙을 구성합니다.` },
  ],
  answer: ['C'],
  vote: '51% C / 49% A',
  explain: `<p><span class="mark-ok">✅ C — SCP로 계정 수준 차단 (제안 정답)</span></p><p>SCP는 AWS 계정 또는 OU에 직접 연결할 수 있으며, 연결된 계정 내의 모든 IAM 엔티티(사용자, 역할, 루트 포함)에 대해 <code>iam:CreateUser</code>를 거부합니다. 이 방식은 연구팀 계정 전체에 일관되게 적용되어 권한 우회를 방지합니다.</p><p><strong>※ 논쟁 포인트:</strong> A(커뮤니티 49%)도 유효합니다. 권한 집합에 거부 정책을 직접 추가하면 연구팀 사용자에게만 적용되어 더 세밀한 제어가 가능합니다. 시험에서는 C가 제안 정답입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 권한 경계는 최대 허용 권한을 설정하는 것으로, 단순히 CreateUser를 제외하는 방식은 AdministratorAccess와 결합 시 예상치 못한 제한이 생길 수 있습니다.</p><p><span class="mark-no">❌ D</span> — Lambda로 생성된 사용자를 삭제하는 것은 반응적(reactive) 접근으로, 사용자가 일시적으로 존재하는 보안 공백이 발생합니다. 예방적(preventive) 제어가 아닙니다.</p>`,
  disc: [{ ans:'C(51%) vs A(49%) 팽팽', txt:'C는 계정 전체 적용(SCP), A는 연구팀 권한 집합에만 적용. 모두 요건을 충족하지만 시험 제안 정답은 C. SCP는 계정에 직접 연결 가능(docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_attach.html).' }]
},
{
  n: 216,
  en: `A company releases a new application in a new AWS account. The application includes an AWS Lambda function that processes messages from an Amazon Simple Queue Service (Amazon SQS) standard queue. The Lambda function stores the results in an Amazon S3 bucket for further downstream processing. The Lambda function needs to process the messages within a specific period of time after the messages are published. The Lambda function has a batch size of 10 messages and takes a few seconds to process a batch of messages.<br><br>As load increases on the application's first day of service, messages in the queue accumulate at a greater rate than the Lambda function can process the messages. Some messages miss the required processing timelines. The logs show that many messages in the queue have data that is not valid. The company needs to meet the timeline requirements for messages that have valid data.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 새 AWS 계정에서 새 애플리케이션을 출시합니다. 이 애플리케이션에는 Amazon Simple Queue Service(Amazon SQS) 표준 대기열에서 메시지를 처리하는 AWS Lambda 함수가 포함되어 있습니다. Lambda 함수는 추가 다운스트림 처리를 위해 Amazon S3 버킷에 결과를 저장합니다. Lambda 함수는 메시지가 게시된 후 특정 기간 내에 메시지를 처리해야 합니다. Lambda 함수의 배치 크기는 10개 메시지이며 메시지 배치를 처리하는 데 몇 초가 걸립니다.<br><br>첫 서비스 날 부하가 증가함에 따라 대기열의 메시지가 Lambda 함수가 처리할 수 있는 속도보다 더 빠른 속도로 누적됩니다. 일부 메시지는 필요한 처리 타임라인을 놓칩니다. 로그에 따르면 대기열의 많은 메시지에 유효하지 않은 데이터가 있습니다. 이 회사는 유효한 데이터가 있는 메시지에 대한 타임라인 요구 사항을 충족해야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Increase the Lambda function's batch size. Change the SQS standard queue to an SQS FIFO queue. Request a Lambda concurrency increase in the AWS Region.`, ko:`Lambda 함수의 배치 크기를 늘립니다. SQS 표준 대기열을 SQS FIFO 대기열로 변경합니다. AWS 리전에서 Lambda 동시성 증가를 요청합니다.` },
    { k:'B', en:`Reduce the Lambda function's batch size. Increase the SQS message throughput quota. Request a Lambda concurrency increase in the AWS Region.`, ko:`Lambda 함수의 배치 크기를 줄입니다. SQS 메시지 처리량 할당량을 늘립니다. AWS 리전에서 Lambda 동시성 증가를 요청합니다.` },
    { k:'C', en:`Increase the Lambda function's batch size. Configure S3 Transfer Acceleration on the S3 bucket. Configure an SQS dead-letter queue.`, ko:`Lambda 함수의 배치 크기를 늘립니다. S3 버킷에서 S3 Transfer Acceleration을 구성합니다. SQS Dead-Letter 대기열을 구성합니다.` },
    { k:'D', en:`Keep the Lambda function's batch size the same. Configure the Lambda function to report failed batch items. Configure an SQS dead-letter queue.`, ko:`Lambda 함수의 배치 크기를 동일하게 유지합니다. 실패한 배치 항목을 보고하도록 Lambda 함수를 구성합니다. SQS Dead-Letter 대기열을 구성합니다.` },
  ],
  answer: ['D'],
  vote: '89% D',
  explain: `<p><span class="mark-ok">✅ D — 실패 항목 보고 + DLQ</span></p><p>핵심 문제는 유효하지 않은 데이터가 있는 메시지가 배치 전체를 실패시켜 유효한 메시지까지 지연시키는 것입니다. Lambda의 <code>ReportBatchItemFailures</code> 기능을 활성화하면 배치 내 특정 메시지만 실패로 표시하고 나머지 유효한 메시지는 정상 처리됩니다. SQS Dead-Letter Queue(DLQ)를 구성하면 반복 실패 메시지를 격리하여 유효한 메시지의 처리 흐름이 차단되지 않습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — FIFO 대기열로 변경하면 Lambda 동시성이 제한되어 오히려 처리 속도가 느려질 수 있습니다.</p><p><span class="mark-no">❌ B</span> — 배치 크기를 줄이면 Lambda 호출 횟수가 늘어나 오히려 동시성 부하가 증가할 수 있습니다.</p><p><span class="mark-no">❌ C</span> — S3 Transfer Acceleration은 S3 업로드 속도를 개선하지만 SQS 처리 병목을 해결하지 못합니다. DLQ만으로는 유효하지 않은 메시지로 인한 배치 전체 실패 문제를 해결하지 못합니다.</p>`,
  disc: [{ ans:'D (89%)', txt:'ReportBatchItemFailures로 부분 배치 실패 보고 + DLQ로 무효 메시지 격리가 핵심. 유효 메시지의 타임라인 요건 충족. AWS prescriptive guidance 참조.' }]
},
{
  n: 217,
  en: `A company has an application that runs on AWS Lambda and sends logs to Amazon CloudWatch Logs. An Amazon Kinesis data stream is subscribed to the log groups in CloudWatch Logs. A single consumer Lambda function processes the logs from the data stream and stores the logs in an Amazon S3 bucket.<br><br>The company's DevOps team has noticed high latency during the processing and ingestion of some logs.<br><br>Which combination of steps will reduce the latency? (Choose three.)`,
  ko: `한 회사에 AWS Lambda에서 실행되고 Amazon CloudWatch Logs에 로그를 보내는 애플리케이션이 있습니다. Amazon Kinesis 데이터 스트림이 CloudWatch Logs의 로그 그룹에 구독되어 있습니다. 단일 소비자 Lambda 함수가 데이터 스트림의 로그를 처리하고 Amazon S3 버킷에 로그를 저장합니다.<br><br>회사의 DevOps 팀은 일부 로그의 처리 및 수집 중에 높은 지연 시간을 발견했습니다.<br><br>어떤 단계 조합이 지연 시간을 줄일 수 있을까요? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Create a data stream consumer with enhanced fan-out. Set the Lambda function that processes the logs as the consumer.`, ko:`향상된 팬아웃(enhanced fan-out)을 사용하여 데이터 스트림 소비자를 만듭니다. 로그를 처리하는 Lambda 함수를 소비자로 설정합니다.` },
    { k:'B', en:`Increase the ParallelizationFactor setting in the Lambda event source mapping.`, ko:`Lambda 이벤트 소스 매핑에서 ParallelizationFactor 설정을 늘립니다.` },
    { k:'C', en:`Configure reserved concurrency for the Lambda function that processes the logs.`, ko:`로그를 처리하는 Lambda 함수에 대해 예약된 동시성을 구성합니다.` },
    { k:'D', en:`Increase the batch size in the Kinesis data stream.`, ko:`Kinesis 데이터 스트림의 배치 크기를 늘립니다.` },
    { k:'E', en:`Turn off the ReportBatchItemFailures setting in the Lambda event source mapping.`, ko:`Lambda 이벤트 소스 매핑에서 ReportBatchItemFailures 설정을 끕니다.` },
    { k:'F', en:`Increase the number of shards in the Kinesis data stream.`, ko:`Kinesis 데이터 스트림의 샤드 수를 늘립니다.` },
  ],
  answer: ['A','B','F'],
  vote: '100% ABF',
  explain: `<p><span class="mark-ok">✅ A — Enhanced Fan-Out 소비자</span></p><p>Kinesis Enhanced Fan-Out을 사용하면 소비자가 샤드당 초당 최대 2MB의 전용 처리량으로 데이터를 수신합니다. 다른 소비자와 처리량을 공유하지 않아 지연 시간이 크게 줄어듭니다.</p><p><span class="mark-ok">✅ B — ParallelizationFactor 증가</span></p><p>Kinesis와 Lambda의 이벤트 소스 매핑에서 ParallelizationFactor를 늘리면 동일 샤드에서 여러 Lambda 인스턴스가 병렬로 처리할 수 있어 처리량이 향상됩니다.</p><p><span class="mark-ok">✅ F — 샤드 수 증가</span></p><p>Kinesis 데이터 스트림의 샤드 수를 늘리면 스트림의 총 데이터 용량과 처리 병렬성이 증가하여 지연 시간이 감소합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ C</span> — 예약된 동시성은 최대 동시 인스턴스를 제한하며 지연 시간 개선에 직접적인 도움이 되지 않습니다.</p><p><span class="mark-no">❌ D</span> — 배치 크기 증가는 처리량은 늘리지만 각 레코드의 지연 시간은 오히려 증가할 수 있습니다.</p><p><span class="mark-no">❌ E</span> — ReportBatchItemFailures 비활성화는 오류 처리 방식에만 영향을 미치며 지연 시간 개선과 무관합니다.</p>`,
  disc: [{ ans:'ABF (100%)', txt:'Enhanced fan-out(A) + ParallelizationFactor(B) + 샤드 수 증가(F)의 조합이 Kinesis→Lambda 처리 지연 감소의 3대 요소.' }]
},
{
  n: 218,
  en: `A company operates sensitive workloads across the AWS accounts that are in the company's organization in AWS Organizations. The company uses an IP address range to delegate IP addresses for Amazon VPC CIDR blocks and all non-cloud hardware.<br><br>The company needs a solution that prevents principals that are outside the company's IP address range from performing AWS actions in the organization's accounts.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 AWS Organizations의 회사 조직에 있는 AWS 계정 전반에서 민감한 워크로드를 운영합니다. 이 회사는 Amazon VPC CIDR 블록과 모든 비클라우드 하드웨어에 대한 IP 주소를 위임하기 위해 IP 주소 범위를 사용합니다.<br><br>이 회사는 회사의 IP 주소 범위 밖에 있는 주체가 조직의 계정에서 AWS 작업을 수행하지 못하도록 하는 솔루션이 필요합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure AWS Firewall Manager for the organization. Create an AWS Network Firewall policy that allows only source traffic from the company's IP address range. Set the policy scope to all accounts in the organization.`, ko:`조직에 대한 AWS Firewall Manager를 구성합니다. 회사의 IP 주소 범위에서만 소스 트래픽을 허용하는 AWS Network Firewall 정책을 만듭니다. 정책 범위를 조직의 모든 계정으로 설정합니다.` },
    { k:'B', en:`In Organizations, create an SCP that denies source IP addresses that are outside of the company's IP address range. Attach the SCP to the organization's root.`, ko:`조직에서 회사의 IP 주소 범위 밖의 소스 IP 주소를 거부하는 SCP를 만듭니다. SCP를 조직의 루트에 연결합니다.` },
    { k:'C', en:`Configure Amazon GuardDuty for the organization. Create a GuardDuty trusted IP address list for the company's IP range. Activate the trusted IP list for the organization.`, ko:`조직에 Amazon GuardDuty를 구성합니다. 회사의 IP 범위에 대한 GuardDuty 신뢰할 수 있는 IP 주소 목록을 만듭니다. 조직에 대한 신뢰할 수 있는 IP 목록을 활성화합니다.` },
    { k:'D', en:`In Organizations, create an SCP that allows source IP addresses that are inside of the company's IP address range. Attach the SCP to the organization's root.`, ko:`조직에서 회사의 IP 주소 범위 내에 있는 소스 IP 주소를 허용하는 SCP를 만듭니다. SCP를 조직의 루트에 연결합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — SCP로 IP 범위 밖 거부 + 루트에 연결</span></p><p>SCP에서 <code>aws:SourceIp</code> 조건 키를 사용하여 회사의 IP 주소 범위 밖에서 오는 요청을 거부하면 조직의 모든 계정에서 일관되게 적용됩니다. SCP를 조직 루트에 연결하면 모든 계정과 OU에 자동으로 상속됩니다. 이 방식은 AWS IAM 공식 예제(deny-ip)에도 소개된 표준 패턴입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — AWS Network Firewall은 VPC 내 네트워크 트래픽을 제어하는 것으로, AWS API 호출(콘솔, CLI, SDK)을 차단하지 않습니다.</p><p><span class="mark-no">❌ C</span> — GuardDuty의 신뢰할 수 있는 IP 목록은 해당 IP에서 발생하는 활동에 대한 GuardDuty 경고를 억제하는 것이지, 접근을 차단하지 않습니다.</p><p><span class="mark-no">❌ D</span> — SCP는 허용 목록(Allow)만으로는 동작하지 않습니다. SCP는 최대 허용 권한을 제한하는 것이며, Allow만으로는 다른 IP 주소를 차단할 수 없습니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'SCP + aws:SourceIp 조건으로 IP 범위 외 거부는 AWS IAM 공식 예제(reference_policies_examples_aws_deny-ip.html)에 명시된 표준 패턴.' }]
},
{
  n: 219,
  en: `A company deploys an application in two AWS Regions. The application currently uses an Amazon S3 bucket in the primary Region to store data.<br><br>A DevOps engineer needs to ensure that the application is highly available in both Regions. The DevOps engineer has created a new S3 bucket in the secondary Region. All existing and new objects must be in both S3 buckets. The application must fail over between the Regions with no data loss.<br><br>Which combination of steps will meet these requirements with the MOST operational efficiency? (Choose three.)`,
  ko: `한 회사가 두 개의 AWS 리전에 애플리케이션을 배포합니다. 애플리케이션은 현재 기본 리전의 Amazon S3 버킷을 사용하여 데이터를 저장합니다.<br><br>DevOps 엔지니어는 두 리전 모두에서 애플리케이션이 고가용성인지 확인해야 합니다. DevOps 엔지니어는 보조 리전에 새 S3 버킷을 만들었습니다. 모든 기존 및 새 객체는 두 S3 버킷 모두에 있어야 합니다. 애플리케이션은 데이터 손실 없이 두 리전 간에 장애 조치되어야 합니다.<br><br>어떤 단계 조합이 이러한 요구 사항을 가장 높은 운영 효율성으로 충족할 수 있을까요? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Create a new IAM role that allows the Amazon S3 and S3 Batch Operations service principals to assume the role that has the necessary permissions for S3 replication.`, ko:`Amazon S3 및 S3 Batch Operations 서비스 주체가 S3 복제에 필요한 권한이 있는 역할을 수임할 수 있도록 새로운 IAM 역할을 생성합니다.` },
    { k:'B', en:`Create a new IAM role that allows the AWS Batch service principal to assume the role that has the necessary permissions for S3 replication.`, ko:`AWS Batch 서비스 주체가 S3 복제에 필요한 권한이 있는 역할을 수임할 수 있도록 새로운 IAM 역할을 생성합니다.` },
    { k:'C', en:`Create an S3 Cross-Region Replication (CRR) rule on the source S3 bucket. Configure the rule to use the IAM role for Amazon S3 to replicate to the target S3 bucket.`, ko:`소스 S3 버킷에서 S3 Cross-Region Replication(CRR) 규칙을 만듭니다. Amazon S3의 IAM 역할을 사용하여 대상 S3 버킷에 복제하도록 규칙을 구성합니다.` },
    { k:'D', en:`Create a two-way replication rule on the source S3 bucket. Configure the rule to use the IAM role for Amazon S3 to replicate to the target S3 bucket.`, ko:`소스 S3 버킷에서 양방향 복제 규칙을 만듭니다. Amazon S3의 IAM 역할을 사용하여 대상 S3 버킷에 복제하도록 규칙을 구성합니다.` },
    { k:'E', en:`Create an AWS Batch job that has an AWS Fargate orchestration type. Configure the job to use the IAM role for AWS Batch. Specify a Bash command to use the AWS CLI to synchronize the contents of the source S3 bucket and the target S3 bucket.`, ko:`AWS Fargate 오케스트레이션 유형이 있는 AWS Batch 작업을 만듭니다. AWS Batch에 대한 IAM 역할을 사용하도록 작업을 구성합니다. AWS CLI를 사용하여 소스 S3 버킷과 대상 S3 버킷의 내용을 동기화하는 Bash 명령을 지정합니다.` },
    { k:'F', en:`Create an operation in S3 Batch Operations to replicate the contents of the source S3 bucket to the target S3 bucket. Configure the operation to use the IAM role for Amazon S3.`, ko:`S3 Batch Operations에서 소스 S3 버킷의 내용을 대상 S3 버킷으로 복제하는 작업을 만듭니다. Amazon S3에 대한 IAM 역할을 사용하도록 작업을 구성합니다.` },
  ],
  answer: ['A','D','F'],
  vote: '66% ADF',
  explain: `<p><span class="mark-ok">✅ A — S3 및 S3 Batch Operations 서비스 주체를 위한 IAM 역할</span></p><p>S3 복제와 S3 배치 작업 모두 실행하려면 Amazon S3 서비스 주체(<code>s3.amazonaws.com</code>)와 S3 배치 작업 서비스 주체(<code>batchoperations.s3.amazonaws.com</code>) 모두가 역할을 수임할 수 있어야 합니다.</p><p><span class="mark-ok">✅ D — 양방향 복제 규칙</span></p><p>두 리전 모두에서 쓰기가 발생하는 액티브-액티브 구성에서는 양방향 복제가 필요합니다. 장애 조치 후 보조 리전에서 생성된 데이터도 기본 리전으로 복제되어야 데이터 손실이 없습니다.</p><p><span class="mark-ok">✅ F — S3 Batch Operations으로 기존 객체 복제</span></p><p>CRR/양방향 복제 규칙은 설정 이후 생성된 새 객체에만 적용됩니다. 기존 객체를 복제하려면 S3 Batch Operations의 복제 작업을 별도로 실행해야 합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — AWS Batch 서비스 주체는 S3 복제와 관련이 없습니다.</p><p><span class="mark-no">❌ C</span> — CRR은 단방향 복제로, 보조 리전에서 기본 리전으로 복제되지 않아 데이터 손실 위험이 있습니다.</p><p><span class="mark-no">❌ E</span> — AWS Batch + CLI 동기화는 수동적이고 비효율적인 방법으로, 운영 효율성이 낮습니다.</p>`,
  disc: [{ ans:'ADF(66%) vs ACF(34%)', txt:'데이터 손실 없는 장애 조치를 위해 양방향 복제(D)가 필수. C는 단방향이라 보조→기본 복제 없음. F는 기존 객체 복제. A는 S3+BatchOps 서비스 주체 모두 포함.' }]
},
{
  n: 220,
  en: `A company uses an organization in AWS Organizations to manage multiple AWS accounts. The company needs an automated process across all AWS accounts to isolate any compromised Amazon EC2 instances when the instances receive a specific tag.<br><br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `한 회사가 AWS Organizations의 조직을 사용하여 여러 AWS 계정을 관리합니다. 이 회사는 인스턴스가 특정 태그를 받을 때 손상된 Amazon EC2 인스턴스를 격리하기 위해 모든 AWS 계정에서 자동화된 프로세스가 필요합니다.<br><br>이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Use AWS CloudFormation StackSets to deploy the CloudFormation stacks in all AWS accounts.`, ko:`AWS CloudFormation StackSets를 사용하여 모든 AWS 계정에 CloudFormation 스택을 배포합니다.` },
    { k:'B', en:`Create an SCP that has a Deny statement for the ec2:* action with a condition of "aws:RequestTag/isolation": false.`, ko:`<code>"aws:RequestTag/isolation": false</code> 조건이 있는 <code>ec2:*</code> 작업에 대한 Deny 문이 있는 SCP를 만듭니다.` },
    { k:'C', en:`Attach the SCP to the root of the organization.`, ko:`SCP를 조직의 루트에 연결합니다.` },
    { k:'D', en:`Create an AWS CloudFormation template that creates an EC2 instance role that has no IAM policies attached. Configure the template to have a security group that has an explicit Deny rule on all traffic. Use the CloudFormation template to create an AWS Lambda function that attaches the IAM role to instances. Configure the Lambda function to add a network ACL. Set up an Amazon EventBridge rule to invoke the Lambda function when a specific tag is applied to a compromised EC2 instance.`, ko:`IAM 정책이 연결되지 않은 EC2 인스턴스 역할을 만드는 AWS CloudFormation 템플릿을 만듭니다. 모든 트래픽에 대한 명시적 거부 규칙이 있는 보안 그룹을 갖도록 템플릿을 구성합니다. CloudFormation 템플릿을 사용하여 인스턴스에 IAM 역할을 연결하는 AWS Lambda 함수를 만듭니다. Lambda 함수를 구성하여 네트워크 ACL을 추가합니다. 특정 태그가 손상된 EC2 인스턴스에 적용될 때 Lambda 함수를 호출하도록 Amazon EventBridge 규칙을 설정합니다.` },
    { k:'E', en:`Create an AWS CloudFormation template that creates an EC2 instance role that has no IAM policies attached. Configure the template to have a security group that has no inbound rules or outbound rules. Use the CloudFormation template to create an AWS Lambda function that attaches the IAM role to instances. Configure the Lambda function to replace any existing security groups with the new security group. Set up an Amazon EventBridge rule to invoke the Lambda function when a specific tag is applied to a compromised EC2 instance.`, ko:`IAM 정책이 연결되지 않은 EC2 인스턴스 역할을 만드는 AWS CloudFormation 템플릿을 만듭니다. 인바운드 규칙이나 아웃바운드 규칙이 없는 보안 그룹을 갖도록 템플릿을 구성합니다. CloudFormation 템플릿을 사용하여 인스턴스에 IAM 역할을 연결하는 AWS Lambda 함수를 만듭니다. 기존 보안 그룹을 새 보안 그룹으로 교체하도록 Lambda 함수를 구성합니다. 특정 태그가 손상된 EC2 인스턴스에 적용될 때 Lambda 함수를 호출하도록 Amazon EventBridge 규칙을 설정합니다.` },
  ],
  answer: ['A','E'],
  vote: '79% AE',
  explain: `<p><span class="mark-ok">✅ A — CloudFormation StackSets로 전 계정 배포</span></p><p>StackSets를 사용하면 조직 내 모든 AWS 계정에 동일한 CloudFormation 스택(Lambda 함수, EventBridge 규칙, 격리용 보안 그룹 등)을 일관되게 배포할 수 있습니다.</p><p><span class="mark-ok">✅ E — 빈 보안 그룹 교체 + Lambda + EventBridge</span></p><p>인바운드/아웃바운드 규칙이 없는 보안 그룹으로 교체하면 모든 네트워크 트래픽이 차단되어 EC2 인스턴스가 네트워크적으로 격리됩니다. IAM 역할도 교체하여 AWS API 접근도 차단합니다. EventBridge 규칙이 태그 적용 이벤트를 감지하여 Lambda를 트리거합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B, C</span> — SCP로 <code>ec2:*</code>를 거부하면 손상된 인스턴스에 대한 네트워크 격리가 아니라 EC2 API 호출 자체를 차단합니다. 이는 격리가 아닌 API 레벨의 차단으로 인스턴스는 여전히 네트워크에 연결되어 있습니다.</p><p><span class="mark-no">❌ D</span> — 보안 그룹은 명시적 거부(Deny) 규칙을 지원하지 않습니다. 보안 그룹은 허용(Allow) 기반으로 동작하며, 규칙이 없으면 기본적으로 거부됩니다. D는 잘못된 설명입니다.</p>`,
  disc: [{ ans:'AE (79%)', txt:'격리 = 네트워크 트래픽 차단. 빈 보안 그룹으로 교체(E) + StackSets로 전 계정 배포(A). SCP(B/C)는 API 차단이지 네트워크 격리가 아님. 보안 그룹은 명시적 Deny 불지원(D 오류).' }]
},
{
  n: 221,
  en: `A company manages multiple AWS accounts by using AWS Organizations with OUs for the different business divisions. The company is updating their corporate network to use new IP address ranges. The company has 10 Amazon S3 buckets in different AWS accounts. The S3 buckets store reports for the different divisions. The S3 bucket configurations allow only private corporate network IP addresses to access the S3 buckets.<br><br>A DevOps engineer needs to change the range of IP addresses that have permission to access the contents of the S3 buckets. The DevOps engineer also needs to revoke the permissions of two OUs in the company.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 다양한 사업부별로 OU가 있는 AWS Organizations를 사용하여 여러 AWS 계정을 관리합니다. 이 회사는 새로운 IP 주소 범위를 사용하도록 회사 네트워크를 업데이트하고 있습니다. 이 회사는 다양한 AWS 계정에 Amazon S3 버킷 10개를 가지고 있습니다. S3 버킷은 다양한 사업부에 대한 보고서를 저장합니다. S3 버킷 구성은 개인 회사 네트워크 IP 주소만 S3 버킷에 액세스할 수 있도록 허용합니다.<br><br>DevOps 엔지니어는 S3 버킷의 콘텐츠에 액세스할 수 있는 권한이 있는 IP 주소 범위를 변경해야 합니다. 또한 DevOps 엔지니어는 회사의 두 OU에 대한 권한을 취소해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a new SCP that has two statements, one that allows access to the new range of IP addresses for all the S3 buckets and one that denies access to the old range of IP addresses for all the S3 buckets. Set a permissions boundary for the OrganizationAccountAccessRole role in the two OUs to deny access to the S3 buckets.`, ko:`두 개의 문장이 있는 새 SCP를 만듭니다. 하나는 모든 S3 버킷에 대한 새로운 IP 주소 범위에 대한 액세스를 허용하고 다른 하나는 모든 S3 버킷에 대한 이전 IP 주소 범위에 대한 액세스를 거부합니다. 두 OU에서 OrganizationAccountAccessRole 역할에 대한 권한 경계를 설정하여 S3 버킷에 대한 액세스를 거부합니다.` },
    { k:'B', en:`Create a new SCP that has a statement that allows only the new range of IP addresses to access the S3 buckets. Create another SCP that denies access to the S3 buckets. Attach the second SCP to the two OUs.`, ko:`S3 버킷에 액세스할 수 있는 새로운 IP 주소 범위만 허용하는 문장이 있는 새 SCP를 만듭니다. S3 버킷에 대한 액세스를 거부하는 또 다른 SCP를 만듭니다. 두 번째 SCP를 두 OU에 연결합니다.` },
