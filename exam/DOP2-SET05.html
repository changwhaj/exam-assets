  ko: `DevOps 엔지니어가 애플리케이션의 인프라를 구축하고 있습니다. 애플리케이션은 Amazon EC2 인스턴스를 포함하는 Amazon EKS 클러스터에서 실행되어야 합니다. EC2 인스턴스는 Amazon EFS 파일 시스템을 스토리지 백엔드로 사용해야 합니다. Amazon EFS CSI 드라이버가 EKS 클러스터에 설치됩니다.<br><br>DevOps 엔지니어가 애플리케이션을 시작하면 EC2 인스턴스는 EFS 파일 시스템을 마운트하지 않습니다.<br><br>어떤 솔루션이 문제를 해결할까요? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Switch the EKS nodes from Amazon EC2 to AWS Fargate.`, ko:`EKS 노드를 Amazon EC2에서 AWS Fargate로 전환합니다.` },
    { k:'B', en:`Add an inbound rule to the EFS file system's security group to allow NFS traffic from the EKS cluster.`, ko:`EKS 클러스터에서 NFS 트래픽을 허용하기 위해 EFS 파일 시스템의 보안 그룹에 인바운드 규칙을 추가합니다.` },
    { k:'C', en:`Create an IAM role that allows the Amazon EFS CSI driver to interact with the file system.`, ko:`Amazon EFS CSI 드라이버가 파일 시스템과 상호 작용할 수 있도록 하는 IAM 역할을 만듭니다.` },
    { k:'D', en:`Set up AWS DataSync to configure file transfer between the EFS file system and the EKS nodes.`, ko:`AWS DataSync를 설정하여 EFS 파일 시스템과 EKS 노드 간 파일 전송을 구성합니다.` },
    { k:'E', en:`Create a mount target for the EFS file system in the subnet of the EKS nodes.`, ko:`EKS 노드의 서브넷에 있는 EFS 파일 시스템에 대한 마운트 대상을 만듭니다.` },
    { k:'F', en:`Disable encryption on the EFS file system.`, ko:`EFS 파일 시스템에서 암호화를 비활성화합니다.` },
  ],
  answer: ['B','C','E'],
  vote: '100% BCE',
  explain: `<p><span class="mark-ok">✅ B — EFS 보안 그룹에 NFS 인바운드 규칙 추가</span></p><p>EFS 파일 시스템의 보안 그룹이 EKS 노드에서 NFS 포트(2049)로의 인바운드 트래픽을 허용하지 않으면 마운트가 실패합니다.</p><p><span class="mark-ok">✅ C — EFS CSI 드라이버용 IAM 역할 생성</span></p><p>EFS CSI 드라이버가 EFS 파일 시스템과 상호작용(<code>elasticfilesystem:DescribeFileSystems</code> 등)하려면 적절한 IAM 권한이 필요합니다.</p><p><span class="mark-ok">✅ E — EKS 노드 서브넷에 EFS 마운트 대상 생성</span></p><p>EFS는 EC2 인스턴스가 위치한 각 서브넷에 마운트 대상이 있어야 파일 시스템에 접근할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Fargate로 전환해도 EFS 마운팅 문제를 해결하지 못합니다. 또한 Fargate는 EFS를 기본적으로 지원하지 않습니다.</p><p><span class="mark-no">❌ D</span> — DataSync는 파일 전송 서비스로 EFS 마운팅과 무관합니다.</p><p><span class="mark-no">❌ F</span> — 암호화 비활성화는 보안을 손상시키며 마운팅 문제의 원인이 아닙니다.</p>`,
  disc: [{ ans:'BCE (100%)', txt:'EFS 마운팅 3대 요건: B(NFS 포트 허용) + C(CSI 드라이버 IAM 권한) + E(서브넷 마운트 대상).' }]
},
{
  n: 245,
  en: `A company deploys an application on on-premises devices in the company's on-premises data center. The company uses an AWS Direct Connect connection between the data center and the company's AWS account. During initial setup of the on-premises devices and during application updates, the application needs to retrieve configuration files from an Amazon Elastic File System (Amazon EFS) file system.<br><br>All traffic from the on-premises devices to Amazon EFS must remain private and encrypted. The on-premises devices must follow the principle of least privilege for AWS access. The company's DevOps team needs the ability to revoke access from a single device without affecting the access of the other devices.<br><br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `한 회사가 온프레미스 데이터 센터에 있는 온프레미스 디바이스에 애플리케이션을 배포합니다. 회사는 데이터 센터와 AWS 계정 간에 AWS Direct Connect 연결을 사용합니다. 온프레미스 디바이스의 초기 설정과 애플리케이션 업데이트 중에 애플리케이션은 Amazon EFS 파일 시스템에서 구성 파일을 검색해야 합니다.<br><br>온프레미스 디바이스에서 Amazon EFS로의 모든 트래픽은 비공개로 유지되고 암호화되어야 합니다. 온프레미스 디바이스는 AWS 액세스에 대한 최소 권한 원칙을 따라야 합니다. 회사의 DevOps 팀은 다른 디바이스의 액세스에 영향을 미치지 않고 단일 디바이스의 액세스를 취소할 수 있어야 합니다.<br><br>이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Create an IAM user that has an access key and a secret key for each device. Attach the AmazonElasticFileSystemFullAccess policy to all IAM users. Configure the AWS CLI on the on-premises devices to use the IAM user's access key and secret key.`, ko:`각 디바이스에 대한 액세스 키와 비밀 키가 있는 IAM 사용자를 만듭니다. 모든 IAM 사용자에게 AmazonElasticFileSystemFullAccess 정책을 연결합니다. 온프레미스 디바이스에서 AWS CLI를 구성하여 IAM 사용자의 액세스 키와 비밀 키를 사용합니다.` },
    { k:'B', en:`Generate certificates for each on-premises device in AWS Private Certificate Authority. Create a trust anchor in IAM Roles Anywhere that references an AWS Private CA. Create an IAM role that trusts IAM Roles Anywhere. Attach the AmazonElasticFileSystemClientReadWriteAccess to the role. Create an IAM Roles Anywhere profile for the IAM role. Configure the AWS CLI on the on-premises devices to use the aws_signing_helper command to obtain credentials.`, ko:`AWS Private Certificate Authority에서 온프레미스 디바이스마다 인증서를 생성합니다. AWS Private CA를 참조하는 IAM Roles Anywhere에서 신뢰 앵커를 만듭니다. IAM Roles Anywhere를 신뢰하는 IAM 역할을 만듭니다. 역할에 AmazonElasticFileSystemClientReadWriteAccess를 연결합니다. IAM 역할에 대한 IAM Roles Anywhere 프로필을 만듭니다. 온프레미스 디바이스에서 AWS CLI를 구성하여 <code>aws_signing_helper</code> 명령을 사용하여 자격 증명을 얻습니다.` },
    { k:'C', en:`Create an IAM user that has an access key and a secret key for all devices. Attach the AmazonElasticFileSystemClientReadWriteAccess policy to the IAM user. Configure the AWS CLI on the on-premises devices to use the IAM user's access key and secret key.`, ko:`모든 디바이스에 대한 액세스 키와 비밀 키가 있는 IAM 사용자를 만듭니다. AmazonElasticFileSystemClientReadWriteAccess 정책을 IAM 사용자에게 연결합니다. 온프레미스 디바이스에서 AWS CLI를 구성하여 IAM 사용자의 액세스 키와 비밀 키를 사용합니다.` },
    { k:'D', en:`Use the amazon-efs-utils package to mount the EFS file system.`, ko:`amazon-efs-utils 패키지를 사용하여 EFS 파일 시스템을 마운트합니다.` },
    { k:'E', en:`Use the native Linux NFS client to mount the EFS file system.`, ko:`기본 Linux NFS 클라이언트를 사용하여 EFS 파일 시스템을 마운트합니다.` },
  ],
  answer: ['B','D'],
  vote: '100% BD',
  explain: `<p><span class="mark-ok">✅ B — IAM Roles Anywhere + 디바이스별 인증서</span></p><p>IAM Roles Anywhere를 사용하면 온프레미스 디바이스가 X.509 인증서를 통해 임시 AWS 자격 증명을 받을 수 있습니다. 각 디바이스에 고유한 인증서를 발급하면 특정 디바이스의 인증서만 취소하여 해당 디바이스의 접근을 독립적으로 철회할 수 있습니다. <code>AmazonElasticFileSystemClientReadWriteAccess</code> 정책으로 최소 권한을 준수합니다.</p><p><span class="mark-ok">✅ D — amazon-efs-utils 패키지 사용</span></p><p>amazon-efs-utils 패키지는 기본적으로 전송 중 암호화(TLS)를 지원하여 Direct Connect를 통한 트래픽을 암호화합니다. 기본 NFS 클라이언트(E)는 기본 암호화를 제공하지 않습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — FullAccess 정책은 최소 권한 원칙에 위배됩니다.</p><p><span class="mark-no">❌ C</span> — 모든 디바이스에 단일 IAM 사용자를 사용하면 특정 디바이스의 접근만 독립적으로 취소할 수 없습니다.</p><p><span class="mark-no">❌ E</span> — 기본 Linux NFS 클라이언트는 기본적으로 전송 중 암호화를 제공하지 않아 "암호화" 요건을 충족하지 못합니다.</p>`,
  disc: [{ ans:'BD (100%)', txt:'IAM Roles Anywhere = 임시 자격 증명 + 인증서 기반 디바이스별 취소. amazon-efs-utils = TLS 암호화 마운트. AWS 블로그(amazon-efs-update-on-premises-access-via-direct-connect-vpc) 참조.' }]
},
{
  n: 246,
  en: `A DevOps engineer is setting up an Amazon Elastic Container Service (Amazon ECS) blue/green deployment for an application by using AWS CodeDeploy and AWS CloudFormation. During the deployment window, the application must be highly available and CodeDeploy must shift 10% of traffic to a new version of the application every minute until all traffic is shifted.<br><br>Which configuration should the DevOps engineer add in the CloudFormation template to meet these requirements?`,
  ko: `DevOps 엔지니어가 AWS CodeDeploy와 AWS CloudFormation을 사용하여 애플리케이션에 대한 Amazon ECS 블루/그린 배포를 설정하고 있습니다. 배포 기간 동안 애플리케이션은 고가용성이어야 하며 CodeDeploy는 모든 트래픽이 전환될 때까지 매분 트래픽의 10%를 애플리케이션의 새 버전으로 전환해야 합니다.<br><br>이러한 요구 사항을 충족하기 위해 DevOps 엔지니어는 CloudFormation 템플릿에 어떤 구성을 추가해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Add an AppSpec file with the CodeDeployDefault.ECSLinear10PercentEvery1Minutes deployment configuration.`, ko:`CodeDeployDefault.ECSLinear10PercentEvery1Minutes 배포 구성을 포함하는 AppSpec 파일을 추가합니다.` },
    { k:'B', en:`Add the AWS::CodeDeployBlueGreen transform and the AWS::CodeDeploy::BlueGreen hook parameter with the CodeDeployDefault.ECSLinear10PercentEvery1Minutes deployment configuration.`, ko:`CodeDeployDefault.ECSLinear10PercentEvery1Minutes 배포 구성으로 AWS::CodeDeployBlueGreen 변환과 AWS::CodeDeploy::BlueGreen 후크 매개변수를 추가합니다.` },
    { k:'C', en:`Add an AppSpec file with the ECSCanary10Percent5Minutes deployment configuration.`, ko:`ECSCanary10Percent5Minutes 배포 구성을 사용하여 AppSpec 파일을 추가합니다.` },
    { k:'D', en:`Add the AWS::CodeDeployBlueGreen transform and the AWS::CodeDeploy::BlueGreen hook parameter with the ECSCanary10Percent5Minutes deployment configuration.`, ko:`ECSCanary10Percent5Minutes 배포 구성으로 AWS::CodeDeployBlueGreen 변환과 AWS::CodeDeploy::BlueGreen 후크 매개변수를 추가합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — AWS::CodeDeployBlueGreen 변환 + Linear10PercentEvery1Minutes</span></p><p>CloudFormation에서 ECS 블루/그린 배포를 구성하려면 <code>AWS::CodeDeployBlueGreen</code> 변환과 <code>AWS::CodeDeploy::BlueGreen</code> 후크를 사용해야 합니다. 배포 구성 <code>CodeDeployDefault.ECSLinear10PercentEvery1Minutes</code>는 매분 10%씩 선형적으로 트래픽을 전환하여 10분 만에 100% 전환을 달성합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — AppSpec 파일만으로는 CloudFormation 템플릿에서 ECS 블루/그린 배포를 직접 구성할 수 없습니다.</p><p><span class="mark-no">❌ C, D</span> — ECSCanary10Percent5Minutes는 처음 10%를 즉시 전환하고 5분 후 나머지 90%를 전환합니다. 매분 10%씩 선형 전환 요건을 충족하지 않습니다.</p>`,
  disc: [{ ans:'B (100%)', txt:'CloudFormation ECS 블루/그린 = AWS::CodeDeployBlueGreen 변환 필수. Linear10PercentEvery1Minutes = 매분 10% 선형 전환. Canary는 두 단계(10%→나머지)로 나뉨.' }]
},
{
  n: 247,
  en: `A company uses an organization in AWS Organizations to manage its AWS accounts. The company's DevOps team has developed an AWS Lambda function that calls the Organizations API to create new AWS accounts.<br><br>The Lambda function runs in the organization's management account. The DevOps team needs to move the Lambda function from the management account to a dedicated AWS account. The DevOps team must ensure that the Lambda function has the ability to create new AWS accounts only in Organizations before the team deploys the Lambda function to the new account.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 AWS Organizations의 조직을 사용하여 AWS 계정을 관리합니다. 회사의 DevOps 팀은 Organizations API를 호출하여 새 AWS 계정을 만드는 AWS Lambda 함수를 개발했습니다.<br><br>Lambda 함수는 조직의 관리 계정에서 실행됩니다. DevOps 팀은 Lambda 함수를 관리 계정에서 전용 AWS 계정으로 옮겨야 합니다. DevOps 팀은 Lambda 함수를 새 계정에 배포하기 전에 Lambda 함수가 Organizations에서만 새 AWS 계정을 만들 수 있는지 확인해야 합니다.<br><br>어떤 솔루션이 이러한 요구 사항을 충족할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`In the management account, create a new IAM role that has the necessary permission to create new accounts in Organizations. Allow the role to be assumed by the Lambda execution role in the new AWS account. Update the Lambda function code to assume the role when the Lambda function creates new AWS accounts. Update the Lambda execution role to ensure that it has permission to assume the new role.`, ko:`관리 계정에서 Organizations에서 새 계정을 만드는 데 필요한 권한이 있는 새 IAM 역할을 만듭니다. 새 AWS 계정에서 Lambda 실행 역할이 해당 역할을 수임할 수 있도록 허용합니다. Lambda 함수가 새 AWS 계정을 만들 때 역할을 수임하도록 Lambda 함수 코드를 업데이트합니다. Lambda 실행 역할을 업데이트하여 새 역할을 수임할 수 있는 권한이 있는지 확인합니다.` },
    { k:'B', en:`In the management account, turn on delegated administration for Organizations. Create a new delegation policy that grants the new AWS account permission to create new AWS accounts in Organizations. Ensure that the Lambda execution role has the organizations:CreateAccount permission.`, ko:`관리 계정에서 Organizations에 대한 위임된 관리를 켭니다. 새 AWS 계정에 Organizations에서 새 AWS 계정을 만들 수 있는 권한을 부여하는 새 위임 정책을 만듭니다. Lambda 실행 역할에 <code>organizations:CreateAccount</code> 권한이 있는지 확인합니다.` },
    { k:'C', en:`In the management account, create a new IAM role that has the necessary permission to create new accounts in Organizations. Allow the role to be assumed by the Lambda service principal. Update the Lambda function code to assume the role when the Lambda function creates new AWS accounts. Update the Lambda execution role to ensure that it has permission to assume the new role.`, ko:`관리 계정에서 Organizations에서 새 계정을 만드는 데 필요한 권한이 있는 새 IAM 역할을 만듭니다. Lambda 서비스 주체가 역할을 수임할 수 있도록 허용합니다. Lambda 함수가 새 AWS 계정을 만들 때 역할을 수임하도록 Lambda 함수 코드를 업데이트합니다. Lambda 실행 역할을 업데이트하여 새 역할을 수임할 수 있는 권한이 있는지 확인합니다.` },

let curQ = 0;
let state = QS.map(() => ({ sel: [], done: false }));
let curLang = 'ko';

// ────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────
function init() {
  buildSelect();
  renderQ(0);
  // 현재 SET 번호를 콤보박스에 반영
  syncSetSelect();
}

function syncSetSelect() {
  const fileName = window.location.pathname.split('/').pop();
  const match = fileName.match(/set(\d{2})/i);
  if (match) {
    document.getElementById('set-select').value = match[1];
  }
}

function buildSelect() {
  const sel = document.getElementById('q-select');
  sel.innerHTML = '';
  QS.forEach((q, i) => {
    const opt = document.createElement('option');
    opt.value = q.n;
    opt.textContent = `Q${String(q.n).padStart(3,'0')}`;
    sel.appendChild(opt);
  });
}

function updateSelectStatus() {
  const sel = document.getElementById('q-select');
  Array.from(sel.options).forEach((opt, i) => {
    const s = state[i];
    const q = QS[i];
    opt.className = '';
    if (s.done) {
      const correct = arraysEqual(s.sel.slice().sort(), q.answer.slice().sort());
      opt.textContent = `Q${String(q.n).padStart(3,'0')} ${correct ? '✓' : '✗'}`;
      opt.className = correct ? 'opt-correct' : 'opt-wrong';
    } else {
      opt.textContent = `Q${String(q.n).padStart(3,'0')}`;
    }
  });
  sel.value = QS[curQ].n;
}

// ────────────────────────────────────────────────
// RENDER
// ────────────────────────────────────────────────
function renderQ(idx) {
  if (idx < 0 || idx >= QS.length) return;
  curQ = idx;
  const q = QS[idx];
  const s = state[idx];

  // counter / progress
  document.getElementById('progress-fill').style.width = `${((idx+1)/QS.length)*100}%`;
  document.getElementById('q-num-badge').textContent = String(q.n).padStart(3,'0');

  // type badge
  const tb = document.getElementById('q-type-badge');
  if (q.type === 'multi') {
    tb.textContent = `복수 선택 (${q.multiCount}개)`;
    tb.className = 'q-type-badge multi';
  } else {
    tb.textContent = '단일 선택';
    tb.className = 'q-type-badge';
  }

  // question text
  document.getElementById('q-ko-text').innerHTML = q.ko;
  document.getElementById('q-en-text').innerHTML = q.en;

  // choices label
  document.getElementById('choices-label').textContent =
    q.type === 'multi' ? `선택지 — ${q.multiCount}개 선택` : '선택지 — 단일 선택';

  // choices
  const cc = document.getElementById('choices-container');
  cc.innerHTML = '';
  q.choices.forEach(ch => {
    const div = document.createElement('div');
    let cls = 'choice';
    if (s.done) {
      cls += ' disabled';
      if (q.answer.includes(ch.k)) cls += ' correct';
      else if (s.sel.includes(ch.k)) cls += ' wrong';
    } else if (s.sel.includes(ch.k)) {
      cls += ' selected';
    }
    div.className = cls;
    div.id = `choice-${idx}-${ch.k}`;

    let icon = '';
    if (s.done) {
      if (q.answer.includes(ch.k)) icon = '✓';
      else if (s.sel.includes(ch.k)) icon = '✗';
    }

    div.innerHTML = `
      <div class="choice-key">${ch.k}</div>
      <div class="choice-body">
        <div class="choice-text">${ch.ko}</div>
        <div class="choice-en">${ch.en}</div>
      </div>
      <div class="result-icon">${icon}</div>`;

    if (!s.done) div.onclick = () => doSelect(idx, ch.k);
    cc.appendChild(div);
    document.getElementById('btn-prev-top').disabled = idx === 0;
    document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
  });

  applyLang(curLang);

  // review button
  document.getElementById('btn-review').disabled = s.done || s.sel.length === 0;

  // hint
  const hint = document.getElementById('hint-text');
  if (s.done) {
    const correct = arraysEqual(s.sel.slice().sort(), q.answer.slice().sort());
    hint.textContent = correct ? '🎉 정답입니다!' : `❌ 오답입니다. 정답은 ${q.answer.join(', ')} 입니다.`;
  } else if (s.sel.length > 0) {
    const remaining = q.type === 'multi' ? q.multiCount - s.sel.length : 0;
    if (q.type === 'multi' && remaining > 0) {
      hint.textContent = `${s.sel.join(', ')}번 선택됨. ${remaining}개 더 선택하세요.`;
    } else {
      hint.textContent = `${s.sel.join(', ')}번을 선택했습니다. 정답 확인 버튼을 눌러주세요.`;
    }
  } else {
    hint.textContent = '선택지를 클릭하면 정답 확인 버튼이 활성화됩니다.';
  }

  // review panel
  const rp = document.getElementById('review-panel');
  if (s.done) { renderReview(q); rp.classList.add('show'); }
  else rp.classList.remove('show');

  // nav buttons
  document.getElementById('btn-prev-top').disabled = idx === 0;
  document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
  // document.getElementById('nav-info').textContent = `${idx+1} / ${QS.length} 문제`;

  // select 동기화
  updateSelectStatus();
}

function renderReview(q) {
  document.getElementById('review-answer-badge').textContent = '✓ ' + q.answer.join(', ');
  document.getElementById('review-vote-badge').innerHTML = `커뮤니티 투표 <span>${q.vote}</span>`;
  document.getElementById('review-explain').innerHTML = q.explain;

  const ws = document.getElementById('review-wrong');
  const wt = document.getElementById('wrong-section-title');
  if (q.wrong) { ws.innerHTML = q.wrong; ws.style.display=''; wt.style.display=''; }
  else { ws.style.display='none'; wt.style.display='none'; }

  const dl = document.getElementById('disc-list');
  dl.innerHTML = '';
  dl.classList.remove('show');
  (q.disc||[]).forEach(d => {
    dl.innerHTML += `<div class="disc-item"><div class="disc-ans">${d.ans}</div>${d.txt}</div>`;
  });
}

// ────────────────────────────────────────────────
// INTERACTION
// ────────────────────────────────────────────────
function doSelect(idx, key) {
  const q = QS[idx];
  const s = state[idx];
  if (s.done) return;
  if (q.type === 'single') {
    s.sel = [key];
  } else {
    const pos = s.sel.indexOf(key);
    if (pos >= 0) s.sel.splice(pos, 1);
    else if (s.sel.length < q.multiCount) s.sel.push(key);
  }
  renderQ(idx);
}

function doReview() {
  const s = state[curQ];
  if (s.sel.length === 0 || s.done) return;
  s.done = true;
  renderQ(curQ);
  document.getElementById('review-panel').scrollIntoView({behavior:'smooth',block:'start'});
}

function doReset() {
  state[curQ] = { sel: [], done: false };
  renderQ(curQ);
}

function goQ(idx) {
  idx = parseInt(idx);
  if (isNaN(idx) || idx < 0 || idx >= QS.length) return;
  renderQ(idx);
  window.scrollTo({top:0, behavior:'smooth'});
}

function goQWithReset(idx) {
  idx = parseInt(idx);
  if (isNaN(idx) || idx < 0 || idx >= QS.length) return;

  // 🔥 언어 강제 한국어
  curLang = 'ko';
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.lang-tab')[0].classList.add('active');

  // 🔥 해당 문제 상태 초기화
  state[idx] = { sel: [], done: false };

  renderQ(idx);
  window.scrollTo({top:0, behavior:'smooth'});
  document.getElementById('btn-prev-top').disabled = idx === 0;
  document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
}

// ────────────────────────────────────────────────
// LANG  (한국어 / 양국어)
// ────────────────────────────────────────────────
function setLang(lang, btn) {
  curLang = lang;
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  applyLang(lang);
}

function applyLang(lang) {
  // 문제 영어 텍스트 — 'both'일 때 block으로 명시해야 CSS display:none을 덮어씀
  const enQ = document.getElementById('q-en-text');
  enQ.style.display = (lang === 'both') ? 'block' : 'none';
  // 선택지 영어 텍스트
  document.querySelectorAll('.choice-en').forEach(e => {
    e.style.display = (lang === 'both') ? 'block' : 'none';
  });
}

// ────────────────────────────────────────────────
// THEME
// ────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('theme-icon').textContent = dark ? '☀️' : '🌙';
  document.getElementById('theme-label').textContent = dark ? '라이트' : '다크';
}

// ────────────────────────────────────────────────
// UTILS
// ────────────────────────────────────────────────
function arraysEqual(a, b) {
  return a.length === b.length && a.every((v,i) => v === b[i]);
}

init();
</script>
</body>
</html>
