<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS DOP-C02 | SET 08 (Q351~Q400)</title>
<style>
[data-theme="dark"] {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#222636; --border:#2e3347;
  --accent:#4f8ef7; --accent2:#38c9a0; --text:#e2e6f0; --text-muted:#7a83a0;
  --correct-bg:#112a22; --wrong-bg:#2a1111; --explain-bg:#1e2030;
  --hover-bg:#1e2236; --sel-bg:#1b2540;
}
[data-theme="light"] {
  --bg:#f0f2f8; --surface:#ffffff; --surface2:#f5f6fa; --border:#d0d5e8;
  --accent:#2e6fe0; --accent2:#1aaa7e; --text:#1a1d2e; --text-muted:#5a6280;
  --correct-bg:#e6faf4; --wrong-bg:#fde8e8; --explain-bg:#f0f2fa;
  --hover-bg:#eaf1ff; --sel-bg:#ddeaff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard','Noto Sans KR','Segoe UI',sans-serif;font-size:15px;line-height:1.75;min-height:100vh;transition:background .25s,color .25s;}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 60px;}

/* Topbar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.badge{background:linear-gradient(135deg,#4f8ef7,#38c9a0);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 12px;border-radius:20px;white-space:nowrap;}
.topbar-title{font-size:13px;color:var(--text-muted);flex:1;min-width:120px;}
.topbar-title strong{color:var(--text);font-size:15px;display:block;}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}

/* 문제 선택 콤보박스 */
.q-select-wrap{display:flex;align-items:center;gap:6px;}
.q-select-label{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.q-select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-weight:600;padding:5px 10px;cursor:pointer;outline:none;transition:border-color .2s;}
.q-select:focus,.q-select:hover{border-color:var(--accent);}
.q-select option.opt-correct{color:#1aaa7e;}
.q-select option.opt-wrong{color:#e05252;}

/* 상단 네비 버튼 + 문제 콤보 높이 통일 */
.topbar-right .btn-nav,
.topbar-right .q-select {
  height: 24px;
  padding: 0 14px;
  font-size: 13px;
}

/* 테마 버튼 */
.theme-btn{background:var(--surface2);border:1px solid var(--border);border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-muted);transition:border-color .2s,color .2s;white-space:nowrap;}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}

/* Progress */
.progress-bar{background:var(--surface2);border-radius:4px;height:6px;margin-bottom:20px;overflow:hidden;}
.progress-fill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:4px;transition:width .4s;}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:16px;transition:background .25s,border-color .25s;}

/* Lang Tabs */
.lang-tabs{display:flex;gap:8px;margin-bottom:20px;}
.lang-tab{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.04em;padding:5px 14px;transition:all .2s;}
.lang-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.lang-tab:hover:not(.active){border-color:var(--accent);color:var(--accent);}

/* Q Label */
.q-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-bottom:10px;}
.q-type-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:10px;margin-left:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);vertical-align:middle;}
.q-type-badge.multi{background:#ede9ff;color:#6d28d9;border-color:#c4b5fd;}
[data-theme="dark"] .q-type-badge.multi{background:#2a1f50;color:#a78bfa;border-color:#4c3a8c;}

/* Q Text */
.q-text{font-size:15px;color:var(--text);line-height:1.85;}
.q-text.en-text{
  font-size:14px;color:var(--text-muted);
  margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--border);
}
.q-text code{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:13px;font-family:'JetBrains Mono','Fira Code',monospace;color:var(--accent2);}

/* Choices */
.choices-section{margin-top:24px;}
.choices-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px;}
.choice{display:flex;align-items:flex-start;gap:14px;background:var(--surface2);border:2px solid var(--border);border-radius:10px;cursor:pointer;margin-bottom:10px;padding:14px 18px;transition:border-color .2s,background .2s;user-select:none;}
.choice:hover{border-color:var(--accent);background:var(--hover-bg);}
.choice.selected{border-color:var(--accent);background:var(--sel-bg);}
.choice.correct{border-color:#38c9a0!important;background:var(--correct-bg)!important;}
.choice.wrong{border-color:#f76f6f!important;background:var(--wrong-bg)!important;}
.choice.disabled{cursor:default;pointer-events:none;}
.choice-key{background:var(--border);border-radius:6px;color:var(--text);font-size:13px;font-weight:700;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:background .2s,color .2s;}
.choice.selected .choice-key{background:var(--accent);color:#fff;}
.choice.correct .choice-key{background:#38c9a0;color:#000;}
.choice.wrong .choice-key{background:#f76f6f;color:#fff;}
.choice-body{flex:1;}
.choice-text{font-size:14px;line-height:1.75;}
.choice-en{font-size:12px;color:var(--text-muted);margin-top:5px;display:none;font-style:italic;}
.result-icon{margin-left:auto;font-size:18px;flex-shrink:0;display:none;}
.choice.correct .result-icon,.choice.wrong .result-icon{display:block;}

/* Actions */
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center;}
.btn{border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.03em;padding:11px 24px;transition:opacity .2s,transform .1s;}
.btn:hover:not(:disabled){opacity:.88;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-nav{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:11px 18px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.hint-text{font-size:12px;color:var(--text-muted);margin-top:8px;min-height:18px;}

/* Review Panel */
.review-panel{display:none;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent2);border-radius:12px;padding:24px 28px;margin-bottom:16px;animation:fadeIn .35s ease;transition:background .25s;}
.review-panel.show{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.answer-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.answer-label{font-size:13px;color:var(--text-muted);}
.answer-badge{background:#38c9a0;color:#000;font-size:13px;font-weight:800;padding:4px 14px;border-radius:20px;}
.vote-badge{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);font-size:12px;padding:3px 10px;border-radius:20px;}
.vote-badge span{color:var(--accent);font-weight:700;}
.section-title{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent2);text-transform:uppercase;margin-bottom:10px;}
.explain-box{background:var(--explain-bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;font-size:14px;line-height:1.8;color:var(--text);}
.explain-box p{margin-bottom:8px;}
.explain-box p:last-child{margin-bottom:0;}
.mark-ok{color:#38c9a0;font-weight:700;}
.mark-no{color:#f76f6f;font-weight:600;}

/* Discussion */
.disc-toggle{background:transparent;border:1px dashed var(--border);border-radius:8px;color:var(--text-muted);cursor:pointer;font-size:13px;margin-top:8px;padding:9px 16px;width:100%;text-align:left;transition:border-color .2s,color .2s;}
.disc-toggle:hover{border-color:var(--accent);color:var(--accent);}
.disc-list{display:none;margin-top:10px;}
.disc-list.show{display:block;}
.disc-item{background:var(--surface2);border-left:3px solid var(--border);border-radius:0 6px 6px 0;font-size:13px;margin-bottom:8px;padding:10px 14px;color:var(--text-muted);line-height:1.7;}
.disc-ans{color:var(--accent);font-weight:700;font-size:12px;margin-bottom:3px;}

/* Bottom Nav */
.nav-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px;}
.nav-info{font-size:13px;color:var(--text-muted);text-align:center;flex:1;}

@media(max-width:600px){
  .card{padding:16px;}
  .btn{padding:10px 16px;font-size:13px;}
  .topbar{gap:8px;}
  .topbar-right{gap:6px;}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- Topbar -->
  <div class="topbar">
    <span class="badge">AWS DOP-C02</span>
    <div class="topbar-title">
      <strong>AWS Certified DevOps Engineer – Professional</strong>
      SET 08 · Q351~Q400 실전 학습
    </div>
    <div class="topbar-right">
      <!-- 상단 네비게이션 -->
      <button class="btn btn-nav" onclick="goQWithReset(curQ-1)" id="btn-prev-top">←</button>

      <!-- 문제 선택 콤보박스 -->
      <div class="q-select-wrap">
        <select class="q-select" id="q-select" onchange="goQWithReset(this.value-351)"></select>
      </div>
      <button class="btn btn-nav" onclick="goQWithReset(curQ+1)" id="btn-next-top">→</button>

      <!-- 테마 토글 -->
      <button class="theme-btn" onclick="toggleTheme()">
        <span id="theme-icon">☀️</span>
        <span id="theme-label">라이트</span>
      </button>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:5%"></div></div>

  <!-- Language Tabs -->
  <div class="lang-tabs">
    <button class="lang-tab active" onclick="setLang('ko',this)">한국어</button>
    <button class="lang-tab" onclick="setLang('both',this)">양국어</button>
  </div>

  <!-- Question Card -->
  <div class="card" id="q-card">
    <div class="q-label">
      문제 <span id="q-num-badge">001</span>
      <span id="q-type-badge" class="q-type-badge">단일 선택</span>
    </div>
    <!-- 한국어 문제 -->
    <div class="q-text" id="q-ko-text"></div>
    <!-- 영어 문제 (양국어 모드) -->
    <div class="q-text en-text" id="q-en-text"></div>

    <div class="choices-section">
      <div class="choices-label" id="choices-label">선택지</div>
      <div id="choices-container"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btn-review" onclick="doReview()" disabled>📋 정답 확인</button>
      <button class="btn btn-secondary" onclick="doReset()">↺ 초기화</button>
    </div>
    <div class="hint-text" id="hint-text">선택지를 클릭하면 정답 확인 버튼이 활성화됩니다.</div>
  </div>

  <!-- Review Panel -->
  <div class="review-panel" id="review-panel">
    <div class="answer-row">
      <span class="answer-label">정답</span>
      <span class="answer-badge" id="review-answer-badge"></span>
      <span class="vote-badge" id="review-vote-badge"></span>
    </div>
    <div class="section-title">✦ 정답 해설</div>
    <div class="explain-box" id="review-explain"></div>
    <div class="section-title" style="margin-top:14px;" id="wrong-section-title">✦ 오답 분석</div>
    <div class="explain-box" id="review-wrong"></div>
    <button class="disc-toggle" onclick="document.getElementById('disc-list').classList.toggle('show')">💬 주요 토론 의견 보기 / 숨기기</button>
    <div class="disc-list" id="disc-list"></div>
  </div>

  <!-- Bottom Nav -->
  <!-- <div class="nav-bottom">
    <button class="btn btn-nav" onclick="goQ(curQ-1)" id="btn-prev">← 이전</button>
    <span class="nav-info" id="nav-info"></span>
    <button class="btn btn-nav" onclick="goQ(curQ+1)" id="btn-next">다음 →</button>
  </div> -->

</div>
<script>
const QS = [
{
  n: 351,
  en: `A company uses an organization in AWS Organizations to manage multiple AWS accounts in a hierarchical structure. An SCP that is associated with the organization root allows IAM users to be created. A DevOps team must be able to create IAM users with any level of permissions. Developers must also be able to create IAM users. However, developers must not be able to grant new IAM users excessive permissions. The developers have the <code>CreateAndManageUsers</code> role in each account. The DevOps team must be able to prevent other users from creating IAM users.<br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `회사는 AWS Organizations의 조직을 사용하여 계층적 구조로 여러 AWS 계정을 관리합니다. 조직 루트에 연결된 SCP는 IAM 사용자 생성을 허용합니다. DevOps 팀은 모든 수준의 권한으로 IAM 사용자를 생성할 수 있어야 합니다. 개발자도 IAM 사용자를 생성할 수 있어야 합니다. 그러나 개발자는 새 IAM 사용자에게 과도한 권한을 부여할 수 없어야 합니다. 개발자는 각 계정에서 <code>CreateAndManageUsers</code> 역할을 보유합니다. DevOps 팀은 다른 사용자가 IAM 사용자를 생성하는 것을 막을 수 있어야 합니다.<br>이 요구 사항을 충족하는 단계 조합은 무엇입니까? (두 가지 선택)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Create an SCP in the organization to deny users the ability to create and modify IAM users. Attach the SCP to the root of the organization. Attach the <code>CreateAndManageUsers</code> role to developers.`, ko:`조직에서 SCP를 생성하여 사용자가 IAM 사용자를 생성·수정하지 못하도록 거부합니다. 해당 SCP를 조직 루트에 연결합니다. <code>CreateAndManageUsers</code> 역할을 개발자에게 연결합니다.` },
    { k:'B', en:`Create an SCP in the organization to grant users that have the <code>DeveloperBoundary</code> policy attached the ability to create new IAM users and to modify IAM users.`, ko:`조직에서 SCP를 생성하여 <code>DeveloperBoundary</code> 정책이 연결된 사용자가 새 IAM 사용자를 생성하고 수정할 수 있도록 허용합니다.` },
    { k:'C', en:`Create an IAM permissions boundary policy named <code>DeveloperBoundary</code> within each account. Configure the <code>DeveloperBoundary</code> policy to allow any IAM actions but only on IAM users that have the <code>PermissionBoundaries</code> policy as the permissions boundary. Attach the <code>DeveloperBoundary</code> policy to the <code>CreateAndManageUsers</code> role within each account.`, ko:`각 계정 내에 <code>DeveloperBoundary</code>라는 IAM 권한 경계 정책을 생성합니다. <code>DeveloperBoundary</code> 정책이 <code>PermissionBoundaries</code> 정책을 권한 경계로 사용하는 IAM 사용자에게만 모든 IAM 작업을 허용하도록 구성합니다. 각 계정의 <code>CreateAndManageUsers</code> 역할에 <code>DeveloperBoundary</code> 정책을 연결합니다.` },
    { k:'D', en:`Create an IAM permissions boundary policy named <code>PermissionBoundaries</code> within each account. Configure the <code>PermissionBoundaries</code> policy to allow any IAM actions but deny the ability to create more than five IAM users. Attach the <code>PermissionBoundaries</code> policy to the <code>CreateAndManageUsers</code> role within each account.`, ko:`각 계정 내에 <code>PermissionBoundaries</code>라는 IAM 권한 경계 정책을 생성합니다. <code>PermissionBoundaries</code> 정책이 모든 IAM 작업은 허용하지만 5명 이상의 IAM 사용자 생성은 거부하도록 구성합니다. 각 계정의 <code>CreateAndManageUsers</code> 역할에 <code>PermissionBoundaries</code> 정책을 연결합니다.` },
    { k:'E', en:`Create an IAM permissions policy named <code>DeveloperBoundary</code> within each account. Configure the <code>DeveloperBoundary</code> policy to allow developers to create IAM users and to assign policies to IAM users only if the developer includes the <code>PermissionBoundaries</code> policy as the permissions boundary. Attach the <code>DeveloperBoundary</code> policy to the <code>CreateAndManageUsers</code> role within each account.`, ko:`각 계정 내에 <code>DeveloperBoundary</code>라는 IAM 권한 정책을 생성합니다. <code>DeveloperBoundary</code> 정책이 개발자가 <code>PermissionBoundaries</code> 정책을 권한 경계로 포함하는 경우에만 IAM 사용자 생성 및 정책 할당을 허용하도록 구성합니다. 각 계정의 <code>CreateAndManageUsers</code> 역할에 <code>DeveloperBoundary</code> 정책을 연결합니다.` },
  ],
  answer: ['A','E'],
  vote: '73% AE',
  explain: `<p><span class="mark-ok">✅ A — IAM 사용자 생성 차단 SCP</span></p><p>조직 루트에 IAM 사용자 생성·수정을 거부하는 SCP를 연결하면 DevOps 역할(<code>CreateAndManageUsers</code>)을 가진 사람 외에는 아무도 IAM 사용자를 생성할 수 없습니다. SCP는 역할의 권한보다 우선하므로, <code>CreateAndManageUsers</code> 역할 자체가 SCP에 예외 처리되거나 OU 분리를 통해 DevOps 계정은 적용 제외됩니다.</p>
<p><span class="mark-ok">✅ E — 권한 경계 강제를 통한 개발자 제한</span></p><p>개발자가 IAM 사용자를 생성할 때 반드시 <code>PermissionBoundaries</code>를 권한 경계로 설정하도록 조건을 부여합니다(<code>iam:PermissionsBoundary</code> 조건 키 사용). 이렇게 하면 개발자가 생성하는 IAM 사용자는 <code>PermissionBoundaries</code> 범위를 초과하는 권한을 가질 수 없으므로 과도한 권한 부여를 방지합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — SCP는 허용(Grant)이 아니라 최대 권한 경계 역할을 합니다. SCP로 특정 정책 보유자에게만 허용하는 방식은 SCP의 올바른 사용법이 아닙니다.</p>
<p><span class="mark-no">❌ C</span> — 권한 경계 정책이 아닌 인라인 IAM 정책 방식으로 구성되어 있어, 실제로 개발자가 과도한 권한을 부여하는 것을 막는 강제 메커니즘이 부족합니다.</p>
<p><span class="mark-no">❌ D</span> — 사용자 수(5명)를 제한하는 것은 요구 사항(과도한 권한 부여 방지)과 맞지 않습니다.</p>`,
  disc: [{ ans:'AE (73%)', txt:'A는 DevOps 외 사용자의 IAM 생성을 SCP로 차단, E는 개발자가 생성 시 반드시 권한 경계를 설정하도록 강제하여 두 요구 사항 모두 충족' }]
},
{
  n: 352,
  en: `A company has deployed a landing zone that has a well-defined AWS Organizations structure and an SCP. The company's development team can create their AWS resources only by using AWS CloudFormation and the AWS Cloud Development Kit (AWS CDK). A DevOps engineer notices that Amazon Simple Queue Service (Amazon SQS) queues that are deployed in different CloudFormation stacks have different configurations. The DevOps engineer also notices that the application cost allocation tag is not always set. The DevOps engineer needs a solution that will enforce tagging and promote the reuse of code. The DevOps engineer needs to avoid different configurations for the deployed SQS queues.<br>What should the DevOps engineer do to meet these requirements?`,
  ko: `회사는 잘 정의된 AWS Organizations 구조와 SCP를 갖춘 랜딩 존을 배포했습니다. 회사의 개발 팀은 AWS CloudFormation 및 AWS Cloud Development Kit(AWS CDK)만을 사용하여 AWS 리소스를 생성할 수 있습니다. DevOps 엔지니어는 서로 다른 CloudFormation 스택에 배포된 Amazon SQS 큐의 구성이 서로 다름을 발견합니다. 또한 애플리케이션 비용 할당 태그가 항상 설정되지 않는 것도 발견합니다. DevOps 엔지니어는 태깅을 강제하고 코드 재사용을 장려하는 솔루션이 필요합니다. 배포된 SQS 큐의 구성이 서로 달라지는 것을 방지해야 합니다.<br>이 요구 사항을 충족하려면 어떻게 해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an Organizations tag policy to enforce the cost allocation tag in CloudFormation stacks. Instruct the development team to use CloudFormation to define SQS queues. Instruct the development team to deploy the SQS queues by using CloudFormation StackSets.`, ko:`Organizations 태그 정책을 생성하여 CloudFormation 스택의 비용 할당 태그를 강제합니다. 개발 팀이 CloudFormation을 사용하여 SQS 큐를 정의하도록 지시합니다. 개발 팀이 CloudFormation StackSets을 사용하여 SQS 큐를 배포하도록 지시합니다.` },
    { k:'B', en:`Update the SCP to enforce the cost allocation tag in CloudFormation stacks. Instruct the development team to use CloudFormation modules to define SQS queues. Instruct the development team to deploy the SQS queues by using CloudFormation stacks.`, ko:`SCP를 업데이트하여 CloudFormation 스택의 비용 할당 태그를 강제합니다. 개발 팀이 CloudFormation 모듈을 사용하여 SQS 큐를 정의하도록 지시합니다. 개발 팀이 CloudFormation 스택을 사용하여 SQS 큐를 배포하도록 지시합니다.` },
    { k:'C', en:`Use AWS CDK tagging to enforce the cost allocation tag in CloudFormation StackSets. Instruct the development team to use the AWS CDK to define SQS queues. Instruct the development team to deploy the SQS queues by using CDK stacks.`, ko:`AWS CDK 태깅을 사용하여 CloudFormation StackSets의 비용 할당 태그를 강제합니다. 개발 팀이 AWS CDK를 사용하여 SQS 큐를 정의하도록 지시합니다. 개발 팀이 CDK 스택을 사용하여 SQS 큐를 배포하도록 지시합니다.` },
    { k:'D', en:`Use AWS CDK tagging to enforce the cost allocation tag in CloudFormation stacks. Instruct the development team to use the AWS CDK to define SQS queues. Instruct the development team to deploy the SQS queues by using CDK feature flags.`, ko:`AWS CDK 태깅을 사용하여 CloudFormation 스택의 비용 할당 태그를 강제합니다. 개발 팀이 AWS CDK를 사용하여 SQS 큐를 정의하도록 지시합니다. 개발 팀이 CDK 기능 플래그를 사용하여 SQS 큐를 배포하도록 지시합니다.` },
  ],
  answer: ['B'],
  vote: '62% B',
  explain: `<p><span class="mark-ok">✅ B — SCP + CloudFormation 모듈</span></p><p>SCP(서비스 제어 정책)는 조직 수준에서 비용 할당 태그 없이 SQS 큐를 생성하는 API 호출을 거부할 수 있어 태깅을 강제로 적용합니다. CloudFormation 모듈(Modules)은 재사용 가능한 CloudFormation 컴포넌트로, 표준 SQS 큐 구성(일관된 설정)을 모듈화하여 모든 팀이 동일한 구성을 사용하도록 강제합니다. 이 조합이 태깅 강제 + 코드 재사용 + 일관된 구성이라는 세 가지 요구 사항을 모두 충족합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Organizations 태그 정책은 태그 값의 형식을 강제하지만 태그 미설정 시 생성을 차단하지는 않으며, CloudFormation 자체를 쓰도록 하는 것은 코드 재사용(일관된 SQS 구성)을 보장하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — CDK 태깅은 개발자가 코드에서 태그를 빠뜨리면 강제할 수 없습니다. CDK Stacks는 코드 재사용 측면에서 모듈보다 덜 구조적입니다.</p>
<p><span class="mark-no">❌ D</span> — CDK 기능 플래그(feature flags)는 CDK 동작 변경에 사용되며, 태깅 강제나 코드 재사용 목적에 적합하지 않습니다.</p>`,
  disc: [{ ans:'B (62%)', txt:'SCP로 태깅을 강제하고, CloudFormation Modules로 SQS 표준 구성을 재사용 가능한 컴포넌트화하여 일관성 확보' }]
},
{
  n: 353,
  en: `A DevOps team manages a company's AWS account. The company wants to ensure that specific AWS resource configuration changes are automatically reverted.<br>Which solution will meet this requirement?`,
  ko: `DevOps 팀은 회사의 AWS 계정을 관리합니다. 회사는 특정 AWS 리소스 구성 변경이 자동으로 되돌려지기를 원합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use AWS Config rules to detect changes in resource configurations. Configure remediation action that uses AWS Systems Manager Automation documents to revert the configuration changes.`, ko:`AWS Config 규칙을 사용하여 리소스 구성 변경을 감지합니다. AWS Systems Manager Automation 문서를 사용하는 수정 작업을 구성하여 구성 변경을 되돌립니다.` },
    { k:'B', en:`Use Amazon CloudWatch alarms to monitor resource metrics. When an alarm is activated, use an Amazon Simple Notification Service (Amazon SNS) topic to notify an administrator to manually revert the configuration changes.`, ko:`Amazon CloudWatch 경보를 사용하여 리소스 지표를 모니터링합니다. 경보가 활성화되면 Amazon SNS 토픽을 사용하여 관리자에게 구성 변경을 수동으로 되돌리도록 알립니다.` },
    { k:'C', en:`Use AWS CloudFormation to create a stack that deploys the necessary configuration changes. Update the stack when configuration changes need to be reverted.`, ko:`AWS CloudFormation을 사용하여 필요한 구성 변경을 배포하는 스택을 생성합니다. 구성 변경을 되돌려야 할 때 스택을 업데이트합니다.` },
    { k:'D', en:`Use AWS Trusted Advisor to check for noncompliant configurations. Manually apply necessary changes based on Trusted Advisor recommendations.`, ko:`AWS Trusted Advisor를 사용하여 비준수 구성을 확인합니다. Trusted Advisor 권장 사항을 기반으로 필요한 변경 사항을 수동으로 적용합니다.` },
  ],
  answer: ['A'],
  vote: '95% A',
  explain: `<p><span class="mark-ok">✅ A — AWS Config + SSM Automation 자동 수정</span></p><p>AWS Config 규칙은 리소스 구성 변경을 실시간으로 감지하고 비준수 상태를 식별합니다. Config 규칙의 자동 수정(Auto Remediation) 기능을 사용하면 SSM Automation 문서를 트리거하여 변경된 구성을 원래 상태로 자동 되돌릴 수 있습니다. 이 조합은 감지 및 자동 수정의 전체 흐름을 완전 자동화합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — CloudWatch 경보는 메트릭 기반이며, 관리자에게 수동 수정을 알리는 방식은 자동 수정 요구 사항을 충족하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — CloudFormation 스택 업데이트는 수동 작업이 필요하며 자동으로 변경을 되돌리지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — Trusted Advisor는 수동 검토 도구이며 자동 수정 기능이 없습니다.</p>`,
  disc: [{ ans:'A (95%)', txt:'AWS Config의 자동 수정 기능이 SSM Automation과 결합되면 구성 변경을 완전 자동으로 감지하고 되돌리는 유일한 솔루션' }]
},
{
  n: 354,
  en: `A company releases a new application in a new AWS account. The application includes an AWS Lambda function that processes messages from an Amazon Simple Queue Service (Amazon SQS) standard queue. The Lambda function stores the results in an Amazon S3 bucket for further downstream processing. The Lambda function needs to process the messages within a specific period of time after the messages are published. The Lambda function has a batch size of 10 messages and takes a few seconds to process a batch of messages. As load increases on the application's first day of service, messages in the queue accumulate at a greater rate than the Lambda function can process the messages. Some messages miss the required processing timelines. The logs show that many messages in the queue have data that is not valid. The company needs to meet the timeline requirements for messages that have valid data.<br>Which solution will meet these requirements?`,
  ko: `회사는 새 AWS 계정에 새 애플리케이션을 출시합니다. 애플리케이션에는 Amazon SQS 표준 큐에서 메시지를 처리하는 AWS Lambda 함수가 포함되어 있습니다. Lambda 함수는 추가 다운스트림 처리를 위해 결과를 Amazon S3 버킷에 저장합니다. Lambda 함수는 메시지가 게시된 후 특정 기간 내에 메시지를 처리해야 합니다. Lambda 함수의 배치 크기는 10개 메시지이며 메시지 배치를 처리하는 데 몇 초가 걸립니다. 서비스 첫날에 부하가 증가함에 따라 큐의 메시지가 Lambda 함수가 처리할 수 있는 속도보다 빠르게 축적됩니다. 일부 메시지는 필요한 처리 타임라인을 놓칩니다. 로그에는 큐의 많은 메시지에 유효하지 않은 데이터가 있는 것으로 나타납니다. 회사는 유효한 데이터를 가진 메시지에 대한 타임라인 요구 사항을 충족해야 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Increase the Lambda function's reserved concurrency. Configure S3 Transfer Acceleration on the S3 bucket. Configure an SQS dead-letter queue.`, ko:`Lambda 함수의 예약된 동시성을 늘립니다. S3 버킷에 S3 Transfer Acceleration을 구성합니다. SQS 데드 레터 큐를 구성합니다.` },
    { k:'B', en:`Increase the Lambda function's batch size. Decrease the Lambda function's reserved concurrency. Configure an SQS dead-letter queue.`, ko:`Lambda 함수의 배치 크기를 늘립니다. Lambda 함수의 예약된 동시성을 줄입니다. SQS 데드 레터 큐를 구성합니다.` },
    { k:'C', en:`Increase the Lambda function's batch size. Configure S3 Transfer Acceleration on the S3 bucket. Configure an SQS dead-letter queue.`, ko:`Lambda 함수의 배치 크기를 늘립니다. S3 버킷에 S3 Transfer Acceleration을 구성합니다. SQS 데드 레터 큐를 구성합니다.` },
    { k:'D', en:`Keep the Lambda function's batch size the same. Configure the Lambda function to report failed batch items. Configure an SQS dead-letter queue.`, ko:`Lambda 함수의 배치 크기를 그대로 유지합니다. Lambda 함수가 실패한 배치 항목을 보고하도록 구성합니다. SQS 데드 레터 큐를 구성합니다.` },
  ],
  answer: ['D'],
  vote: '81% D',
  explain: `<p><span class="mark-ok">✅ D — 실패 배치 항목 보고 + DLQ</span></p><p>핵심 문제는 유효하지 않은 데이터를 가진 메시지가 배치 전체를 재처리하게 만들어 유효한 메시지의 처리 타임라인을 놓치게 한다는 점입니다. <strong>배치 항목 실패 보고(ReportBatchItemFailures)</strong>를 구성하면 Lambda는 부분적으로 성공한 배치에서 실패한 항목만 SQS로 반환하고, 성공한 항목은 재처리하지 않습니다. 유효하지 않은 데이터는 <strong>데드 레터 큐(DLQ)</strong>로 이동하여 유효한 메시지 처리를 방해하지 않습니다. 배치 크기를 유지하면 처리량에 영향을 주지 않으면서 처리 효율성을 개선할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — S3 Transfer Acceleration은 S3 업로드 속도를 높이지만 메시지 처리 병목과 무관합니다. 예약된 동시성 증가만으로는 유효하지 않은 메시지로 인한 배치 재처리 문제를 해결하지 못합니다.</p>
<p><span class="mark-no">❌ B</span> — 배치 크기를 늘리면 유효하지 않은 메시지가 더 많은 유효 메시지와 함께 처리되어 실패 시 더 많은 재처리가 발생합니다. 동시성 감소는 처리량을 더욱 줄입니다.</p>
<p><span class="mark-no">❌ C</span> — 배치 크기를 늘리면 문제가 악화됩니다. S3 Transfer Acceleration은 관련이 없습니다.</p>`,
  disc: [{ ans:'D (81%)', txt:'ReportBatchItemFailures로 유효하지 않은 메시지만 격리하고 유효한 메시지는 계속 처리, DLQ로 유효하지 않은 메시지를 보관하여 타임라인 충족' }]
},
{
  n: 355,
  en: `A software team is using AWS CodePipeline to automate its Java application release pipeline. The pipeline consists of a source stage, then a build stage, and then a deploy stage. Each stage contains a single action that has a <code>runOrder</code> value of 1. The team wants to integrate unit tests into the existing release pipeline. The team needs a solution that deploys only the code changes that pass all unit tests.<br>Which solution will meet these requirements?`,
  ko: `소프트웨어 팀은 AWS CodePipeline을 사용하여 Java 애플리케이션 릴리스 파이프라인을 자동화하고 있습니다. 파이프라인은 소스 스테이지, 빌드 스테이지, 배포 스테이지로 구성됩니다. 각 스테이지에는 <code>runOrder</code> 값이 1인 단일 액션이 포함됩니다. 팀은 기존 릴리스 파이프라인에 단위 테스트를 통합하려고 합니다. 팀은 모든 단위 테스트를 통과한 코드 변경 사항만 배포하는 솔루션이 필요합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Modify the build stage. Add a test action that has a <code>runOrder</code> value of 1. Use AWS CodeDeploy as the action provider to run unit tests.`, ko:`빌드 스테이지를 수정합니다. <code>runOrder</code> 값이 1인 테스트 액션을 추가합니다. AWS CodeDeploy를 액션 공급자로 사용하여 단위 테스트를 실행합니다.` },
    { k:'B', en:`Modify the build stage. Add a test action that has a <code>runOrder</code> value of 2. Use AWS CodeBuild as the action provider to run unit tests.`, ko:`빌드 스테이지를 수정합니다. <code>runOrder</code> 값이 2인 테스트 액션을 추가합니다. AWS CodeBuild를 액션 공급자로 사용하여 단위 테스트를 실행합니다.` },
    { k:'C', en:`Modify the deploy stage. Add a test action that has a <code>runOrder</code> value of 1. Use AWS CodeDeploy as the action provider to run unit tests.`, ko:`배포 스테이지를 수정합니다. <code>runOrder</code> 값이 1인 테스트 액션을 추가합니다. AWS CodeDeploy를 액션 공급자로 사용하여 단위 테스트를 실행합니다.` },
    { k:'D', en:`Modify the deploy stage. Add a test action that has a <code>runOrder</code> value of 2. Use AWS CodeBuild as the action provider to run unit tests.`, ko:`배포 스테이지를 수정합니다. <code>runOrder</code> 값이 2인 테스트 액션을 추가합니다. AWS CodeBuild를 액션 공급자로 사용하여 단위 테스트를 실행합니다.` },
  ],
  answer: ['B'],
  vote: '92% B',
  explain: `<p><span class="mark-ok">✅ B — 빌드 스테이지에 runOrder 2로 CodeBuild 테스트 액션 추가</span></p><p>빌드 스테이지에 테스트 액션을 추가하면 빌드 완료 후 배포 전에 단위 테스트가 실행됩니다. <code>runOrder</code> 값을 2로 설정하면 기존 빌드 액션(runOrder 1) 이후에 순차적으로 실행됩니다. AWS CodeBuild는 단위 테스트 실행에 적합한 완전 관리형 빌드 서비스입니다. 테스트가 실패하면 파이프라인이 중단되어 배포 스테이지로 진행하지 않습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CodeDeploy는 배포 서비스로, 단위 테스트 실행에 적합하지 않습니다. runOrder 1은 기존 빌드 액션과 병렬로 실행됩니다.</p>
<p><span class="mark-no">❌ C, D</span> — 배포 스테이지에 테스트를 추가하면 이미 배포가 시작된 후에 테스트가 실행되므로 "테스트 통과 후 배포" 요구 사항을 충족하지 않습니다.</p>`,
  disc: [{ ans:'B (92%)', txt:'빌드 스테이지에서 빌드 후 테스트를 순차 실행(runOrder 2)하여 테스트 실패 시 배포 스테이지 진입을 차단하는 표준 패턴' }]
},
{
  n: 356,
  en: `A company uses AWS WAF to protect its cloud infrastructure. A DevOps engineer needs to give an operations team the ability to analyze log messages from AWS WAF. The operations team needs to be able to create alarms for specific patterns in the log output.<br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `회사는 AWS WAF를 사용하여 클라우드 인프라를 보호합니다. DevOps 엔지니어는 운영 팀이 AWS WAF의 로그 메시지를 분석할 수 있도록 해야 합니다. 운영 팀은 로그 출력의 특정 패턴에 대한 경보를 생성할 수 있어야 합니다.<br>최소한의 운영 오버헤드로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an Amazon CloudWatch Logs log group. Configure the appropriate AWS WAF web ACL to send log messages to the log group. Instruct the operations team to create CloudWatch metric filters.`, ko:`Amazon CloudWatch Logs 로그 그룹을 생성합니다. 적절한 AWS WAF 웹 ACL이 로그 메시지를 로그 그룹으로 보내도록 구성합니다. 운영 팀이 CloudWatch 지표 필터를 생성하도록 지시합니다.` },
    { k:'B', en:`Create an Amazon OpenSearch Service cluster and appropriate indexes. Configure an Amazon Kinesis Data Firehose delivery stream to stream log data to the indexes. Use OpenSearch Dashboards to create filters and widgets.`, ko:`Amazon OpenSearch Service 클러스터 및 적절한 인덱스를 생성합니다. Amazon Kinesis Data Firehose 전송 스트림을 구성하여 로그 데이터를 인덱스로 스트리밍합니다. OpenSearch Dashboards를 사용하여 필터와 위젯을 생성합니다.` },
    { k:'C', en:`Create an Amazon S3 bucket for the log output. Configure AWS WAF to send log outputs to the S3 bucket. Instruct the operations team to create AWS Lambda functions that detect each desired log message pattern. Configure the Lambda functions to publish to an Amazon Simple Notification Service (Amazon SNS) topic.`, ko:`로그 출력을 위한 Amazon S3 버킷을 생성합니다. AWS WAF가 로그 출력을 S3 버킷으로 보내도록 구성합니다. 운영 팀이 각 원하는 로그 메시지 패턴을 감지하는 AWS Lambda 함수를 생성하도록 지시합니다. Lambda 함수가 Amazon SNS 토픽에 게시하도록 구성합니다.` },
    { k:'D', en:`Create an Amazon S3 bucket for the log output. Configure AWS WAF to send log outputs to the S3 bucket. Use Amazon Athena to create an external table definition that fits the log message pattern. Instruct the operations team to write SQL queries and to create Amazon CloudWatch metric filters for the Athena queries.`, ko:`로그 출력을 위한 Amazon S3 버킷을 생성합니다. AWS WAF가 로그 출력을 S3 버킷으로 보내도록 구성합니다. Amazon Athena를 사용하여 로그 메시지 패턴에 맞는 외부 테이블 정의를 생성합니다. 운영 팀이 SQL 쿼리를 작성하고 Athena 쿼리에 대한 Amazon CloudWatch 지표 필터를 생성하도록 지시합니다.` },
  ],
  answer: ['A'],
  vote: '78% A',
  explain: `<p><span class="mark-ok">✅ A — CloudWatch Logs + 지표 필터</span></p><p>AWS WAF는 Amazon CloudWatch Logs로 직접 로그를 전송하도록 지원합니다. CloudWatch Logs에 저장된 WAF 로그에 대해 운영 팀은 <strong>지표 필터(Metric Filters)</strong>를 생성하여 특정 패턴을 감지하고 CloudWatch 경보를 설정할 수 있습니다. 추가 인프라(Kinesis, OpenSearch, S3 등) 없이 완전히 관리형 서비스만으로 로그 분석과 경보 생성이 가능하므로 운영 오버헤드가 가장 낮습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — OpenSearch + Kinesis Data Firehose 설정은 복잡하고 비용이 많이 들며, 경보 생성 기능이 CloudWatch만큼 직관적이지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — S3에 저장 후 Lambda 함수를 별도로 작성하는 방식은 운영 팀에게 개발 부담을 주므로 운영 오버헤드가 높습니다.</p>
<p><span class="mark-no">❌ D</span> — S3 + Athena + CloudWatch 지표 필터 조합은 불필요하게 복잡합니다. Athena 쿼리에 대해 직접 CloudWatch 지표 필터를 생성하는 것도 기술적으로 맞지 않습니다.</p>`,
  disc: [{ ans:'A (78%)', txt:'WAF→CloudWatch Logs→지표 필터→경보로 이어지는 완전 관리형 파이프라인이 최소 오버헤드 솔루션' }]
},
{
  n: 357,
  en: `A DevOps engineer is setting up an Amazon Elastic Container Service (Amazon ECS) blue/green deployment for an application by using AWS CodeDeploy and AWS CloudFormation. During the deployment window, the application must be highly available and CodeDeploy must shift 10% of traffic to a new version of the application every minute until all traffic is shifted.<br>Which configuration should the DevOps engineer add in the CloudFormation template to meet these requirements?`,
  ko: `DevOps 엔지니어는 AWS CodeDeploy 및 AWS CloudFormation을 사용하여 애플리케이션의 Amazon ECS 블루/그린 배포를 설정하고 있습니다. 배포 창 동안 애플리케이션은 고가용성을 유지해야 하며, CodeDeploy는 모든 트래픽이 전환될 때까지 매 분마다 새 버전의 애플리케이션으로 트래픽의 10%를 전환해야 합니다.<br>이 요구 사항을 충족하기 위해 DevOps 엔지니어가 CloudFormation 템플릿에 추가해야 하는 구성은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Add an AppSpec file with the <code>CodeDeployDefault.ECSLinear10PercentEvery1Minutes</code> deployment configuration.`, ko:`<code>CodeDeployDefault.ECSLinear10PercentEvery1Minutes</code> 배포 구성으로 AppSpec 파일을 추가합니다.` },
    { k:'B', en:`Add the <code>AWS::CodeDeployBlueGreen</code> transform and the <code>AWS::CodeDeploy::BlueGreen</code> hook parameter with the <code>CodeDeployDefault.ECSLinear10PercentEvery1Minutes</code> deployment configuration.`, ko:`<code>CodeDeployDefault.ECSLinear10PercentEvery1Minutes</code> 배포 구성과 함께 <code>AWS::CodeDeployBlueGreen</code> 변환 및 <code>AWS::CodeDeploy::BlueGreen</code> 훅 파라미터를 추가합니다.` },
    { k:'C', en:`Add an AppSpec file with the <code>ECSCanary10Percent5Minutes</code> deployment configuration.`, ko:`<code>ECSCanary10Percent5Minutes</code> 배포 구성으로 AppSpec 파일을 추가합니다.` },
    { k:'D', en:`Add the <code>AWS::CodeDeployBlueGreen</code> transform and the <code>AWS::CodeDeploy::BlueGreen</code> hook parameter with the <code>ECSCanary10Percent5Minutes</code> deployment configuration.`, ko:`<code>ECSCanary10Percent5Minutes</code> 배포 구성과 함께 <code>AWS::CodeDeployBlueGreen</code> 변환 및 <code>AWS::CodeDeploy::BlueGreen</code> 훅 파라미터를 추가합니다.` },
  ],
  answer: ['B'],
  vote: '89% B',
  explain: `<p><span class="mark-ok">✅ B — CloudFormation BlueGreen 변환 + Linear10PercentEvery1Minutes</span></p><p>CloudFormation 템플릿에서 ECS 블루/그린 배포를 구성하려면 <code>AWS::CodeDeployBlueGreen</code> 변환과 <code>AWS::CodeDeploy::BlueGreen</code> 훅이 필요합니다. AppSpec 파일은 독립 배포 시 사용하지만, CloudFormation 통합에서는 이 훅을 통해 배포 구성을 지정합니다. <code>CodeDeployDefault.ECSLinear10PercentEvery1Minutes</code>는 매 분마다 10%씩 선형적으로 트래픽을 전환하는 배포 구성으로, 요구 사항(매 분 10%)에 정확히 부합합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A, C</span> — CloudFormation 통합 배포에서 AppSpec 파일을 직접 지정하지 않습니다. AppSpec은 직접 CodeDeploy 배포 시 사용합니다.</p>
<p><span class="mark-no">❌ D</span> — ECSCanary10Percent5Minutes는 처음 10%를 전환하고 5분 대기 후 나머지를 전환하는 카나리 방식으로, "매 분마다 10%씩" 요구 사항과 다릅니다.</p>`,
  disc: [{ ans:'B (89%)', txt:'CloudFormation 블루/그린 배포는 AWS::CodeDeployBlueGreen 변환 필수, ECSLinear10PercentEvery1Minutes가 매분 10% 선형 전환 요건 충족' }]
},
{
  n: 358,
  en: `A company is using AWS CodePipeline to automate its release pipeline. AWS CodeDeploy is being used in the pipeline to deploy an application to Amazon Elastic Container Service (Amazon ECS) using the blue/green deployment model. The company wants to implement scripts to test the green version of the application before shifting traffic. These scripts will complete in 5 minutes or less. If errors are discovered during these tests, the application must be rolled back.<br>Which strategy will meet these requirements?`,
  ko: `회사는 AWS CodePipeline을 사용하여 릴리스 파이프라인을 자동화하고 있습니다. AWS CodeDeploy가 파이프라인에서 블루/그린 배포 모델을 사용하여 Amazon ECS에 애플리케이션을 배포하는 데 사용됩니다. 회사는 트래픽을 전환하기 전에 그린 버전의 애플리케이션을 테스트하는 스크립트를 구현하려고 합니다. 이 스크립트는 5분 이내에 완료됩니다. 테스트 중 오류가 발견되면 애플리케이션을 롤백해야 합니다.<br>이 요구 사항을 충족하는 전략은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Add a stage to the CodePipeline pipeline between the source and deploy stages. Use AWS CodeBuild to create a runtime environment and build commands in the buildspec file to invoke test scripts. If errors are found, use the <code>aws deploy stop-deployment</code> command to stop the deployment.`, ko:`소스 스테이지와 배포 스테이지 사이에 CodePipeline 파이프라인에 스테이지를 추가합니다. AWS CodeBuild를 사용하여 런타임 환경을 생성하고 buildspec 파일의 빌드 명령으로 테스트 스크립트를 호출합니다. 오류가 발견되면 <code>aws deploy stop-deployment</code> 명령을 사용하여 배포를 중지합니다.` },
    { k:'B', en:`Add a stage to the CodePipeline pipeline between the source and deploy stages. Use an AWS Lambda function to run the test scripts. If errors are found, use the <code>aws deploy stop-deployment</code> command to stop the deployment.`, ko:`소스 스테이지와 배포 스테이지 사이에 CodePipeline 파이프라인에 스테이지를 추가합니다. AWS Lambda 함수를 사용하여 테스트 스크립트를 실행합니다. 오류가 발견되면 <code>aws deploy stop-deployment</code> 명령을 사용하여 배포를 중지합니다.` },
    { k:'C', en:`Add a hooks section to the CodeDeploy AppSpec file. Use the <code>AfterAllowTestTraffic</code> lifecycle event to invoke an AWS Lambda function to run the test scripts. If errors are found, exit the Lambda function with an error to initiate rollback.`, ko:`CodeDeploy AppSpec 파일에 훅 섹션을 추가합니다. <code>AfterAllowTestTraffic</code> 수명 주기 이벤트를 사용하여 AWS Lambda 함수를 호출하여 테스트 스크립트를 실행합니다. 오류가 발견되면 Lambda 함수를 오류와 함께 종료하여 롤백을 시작합니다.` },
    { k:'D', en:`Add a hooks section to the CodeDeploy AppSpec file. Use the <code>AfterAllowTraffic</code> lifecycle event to invoke the test scripts. If errors are found, create a CloudWatch alarm to initiate a rollback.`, ko:`CodeDeploy AppSpec 파일에 훅 섹션을 추가합니다. <code>AfterAllowTraffic</code> 수명 주기 이벤트를 사용하여 테스트 스크립트를 호출합니다. 오류가 발견되면 CloudWatch 경보를 생성하여 롤백을 시작합니다.` },
  ],
  answer: ['C'],
  vote: '84% C',
  explain: `<p><span class="mark-ok">✅ C — AppSpec AfterAllowTestTraffic + Lambda 롤백</span></p><p>ECS 블루/그린 배포에서 CodeDeploy AppSpec 파일의 <code>AfterAllowTestTraffic</code> 수명 주기 훅은 테스트 트래픽이 그린(새 버전) 환경으로 허용된 후, 실제 프로덕션 트래픽이 전환되기 전에 실행됩니다. 이 시점에 Lambda 함수로 테스트 스크립트를 실행하고, 오류 발생 시 Lambda가 실패 상태로 종료하면 CodeDeploy가 자동으로 롤백을 트리거합니다. 5분 이내 완료되는 테스트에 Lambda가 적합하며, 트래픽 전환 전 테스트와 자동 롤백 요구 사항을 모두 충족합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A, B</span> — 소스/배포 스테이지 사이에 추가하는 테스트는 그린 환경이 배포되기 전에 실행되므로 실제 배포된 그린 버전을 테스트할 수 없습니다.</p>
<p><span class="mark-no">❌ D</span> — <code>AfterAllowTraffic</code>은 프로덕션 트래픽이 이미 그린으로 전환된 후에 실행되므로 "트래픽 전환 전 테스트" 요구 사항을 충족하지 않습니다.</p>`,
  disc: [{ ans:'C (84%)', txt:'AfterAllowTestTraffic은 테스트 트래픽만 허용된 상태에서 검증 가능, Lambda 오류 시 CodeDeploy 자동 롤백으로 트래픽 전환 전 보호 가능' }]
},
{
  n: 359,
  en: `A company runs applications on Amazon EC2 instances that are in an Amazon EC2 Auto Scaling group. The EC2 instances are behind an Application Load Balancer (ALB). Users recently began to experience errors when traffic was directed to some of the EC2 instances. A DevOps engineer discovers that the Auto Scaling group reports the problematic instances are healthy despite the application errors. User experience returns to normal after the DevOps engineer resolves the application errors on the problematic instances. The company wants to ensure that traffic is routed only to healthy instances that are not experiencing application errors. The company also wants a support team to receive a notification if the traffic routing configuration changes.<br>Which solution will meet these requirements?`,
  ko: `회사는 Amazon EC2 Auto Scaling 그룹의 Amazon EC2 인스턴스에서 애플리케이션을 실행합니다. EC2 인스턴스는 Application Load Balancer(ALB) 뒤에 있습니다. 사용자들이 일부 EC2 인스턴스로 트래픽이 라우팅될 때 오류가 발생하기 시작했습니다. DevOps 엔지니어는 Auto Scaling 그룹이 애플리케이션 오류에도 불구하고 문제가 있는 인스턴스를 정상으로 보고하는 것을 발견합니다. DevOps 엔지니어가 문제가 있는 인스턴스의 애플리케이션 오류를 해결한 후 사용자 경험이 정상으로 돌아옵니다. 회사는 애플리케이션 오류가 발생하지 않는 정상 인스턴스로만 트래픽이 라우팅되도록 보장하려고 합니다. 또한 지원 팀이 트래픽 라우팅 구성이 변경되면 알림을 받기를 원합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure the Auto Scaling group to use ELB health checks. Enable AWS Config. Create an AWS Config rule to detect changes to the Auto Scaling group health check configuration. Configure an Amazon Simple Notification Service (Amazon SNS) topic to receive Config rule compliance change notifications.`, ko:`ELB 상태 확인을 사용하도록 Auto Scaling 그룹을 구성합니다. AWS Config를 활성화합니다. Auto Scaling 그룹 상태 확인 구성 변경을 감지하는 AWS Config 규칙을 생성합니다. Config 규칙 준수 변경 알림을 받도록 Amazon SNS 토픽을 구성합니다.` },
    { k:'B', en:`Configure the Auto Scaling group to use EC2 health checks. Enable AWS CloudTrail. Create an Amazon EventBridge rule to detect changes to the Auto Scaling group health check configuration. Configure an Amazon Simple Notification Service (Amazon SNS) topic to receive EventBridge notifications.`, ko:`EC2 상태 확인을 사용하도록 Auto Scaling 그룹을 구성합니다. AWS CloudTrail을 활성화합니다. Auto Scaling 그룹 상태 확인 구성 변경을 감지하는 Amazon EventBridge 규칙을 생성합니다. EventBridge 알림을 받도록 Amazon SNS 토픽을 구성합니다.` },
    { k:'C', en:`Configure the Auto Scaling group to use ELB health checks. Enable AWS CloudTrail. Create an Amazon EventBridge rule to detect changes to the Auto Scaling group health check configuration. Configure an Amazon Simple Notification Service (Amazon SNS) topic to receive EventBridge notifications.`, ko:`ELB 상태 확인을 사용하도록 Auto Scaling 그룹을 구성합니다. AWS CloudTrail을 활성화합니다. Auto Scaling 그룹 상태 확인 구성 변경을 감지하는 Amazon EventBridge 규칙을 생성합니다. EventBridge 알림을 받도록 Amazon SNS 토픽을 구성합니다.` },
    { k:'D', en:`Configure the Auto Scaling group to use ELB health checks. Create an Amazon CloudWatch synthetic canary to monitor the application. Create a CloudWatch alarm that is triggered when the CloudWatch canary fails. Configure the alarm to notify the support team when the alarm state is in alarm.`, ko:`ELB 상태 확인을 사용하도록 Auto Scaling 그룹을 구성합니다. 애플리케이션을 모니터링하는 Amazon CloudWatch 합성 카나리를 생성합니다. CloudWatch 카나리가 실패할 때 트리거되는 CloudWatch 경보를 생성합니다. 경보 상태가 경보 상태일 때 지원 팀에게 알리도록 경보를 구성합니다.` },
  ],
  answer: ['A'],
  vote: '71% A',
  explain: `<p><span class="mark-ok">✅ A — ELB 상태 확인 + AWS Config 규칙 + SNS</span></p><p><strong>ELB 상태 확인(ELB Health Checks)</strong>으로 전환하면 ALB가 각 인스턴스의 애플리케이션 수준 상태를 직접 확인합니다. 기본 EC2 상태 확인은 인스턴스 자체(OS)가 실행 중인지만 확인하지만, ELB 상태 확인은 실제 HTTP 응답을 확인하여 애플리케이션 오류가 있는 인스턴스를 비정상으로 표시합니다. <strong>AWS Config 규칙</strong>은 Auto Scaling 그룹의 상태 확인 구성 변경을 추적하고 변경 시 SNS를 통해 지원 팀에 알립니다. Config는 구성 변경 거버넌스 및 알림에 최적화된 서비스입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — EC2 상태 확인은 인스턴스 OS 수준 상태만 확인하여 애플리케이션 오류를 감지하지 못합니다. ELB 상태 확인이 필요합니다.</p>
<p><span class="mark-no">❌ C</span> — ELB 상태 확인은 맞지만, CloudTrail + EventBridge 조합은 Config보다 구성 변경 감지에 복잡합니다. Config가 구성 거버넌스에 더 적합합니다.</p>
<p><span class="mark-no">❌ D</span> — CloudWatch 합성 카나리는 애플리케이션 모니터링에는 유용하지만, 라우팅 구성 변경 알림 요구 사항을 충족하지 않습니다.</p>`,
  disc: [{ ans:'A (71%)', txt:'ELB 헬스체크로 앱 오류 감지, AWS Config로 헬스체크 설정 변경을 추적하여 거버넌스 제어 및 SNS 알림 제공' }]
},
{
  n: 360,
  en: `A company's developers use Amazon EC2 instances as remote workstations. The company is concerned that users can create or modify EC2 security groups to allow unrestricted inbound access. A DevOps engineer needs to develop a solution to detect when users create unrestricted security group rules. The solution must detect changes to security group rules in near real time, remove unrestricted rules, and send email notifications to the security team. The DevOps engineer has created an AWS Lambda function that checks for security group ID from input, removes rules that grant unrestricted access, and sends notifications through Amazon Simple Notification Service (Amazon SNS).<br>What should the DevOps engineer do next to meet the requirements?`,
  ko: `회사의 개발자들은 원격 워크스테이션으로 Amazon EC2 인스턴스를 사용합니다. 회사는 사용자들이 무제한 인바운드 액세스를 허용하는 EC2 보안 그룹을 생성하거나 수정할 수 있다는 점을 우려하고 있습니다. DevOps 엔지니어는 사용자가 무제한 보안 그룹 규칙을 생성하는 시점을 감지하는 솔루션을 개발해야 합니다. 솔루션은 보안 그룹 규칙 변경을 거의 실시간으로 감지하고, 무제한 규칙을 제거하며, 보안 팀에 이메일 알림을 보내야 합니다. DevOps 엔지니어는 입력에서 보안 그룹 ID를 확인하고, 무제한 액세스를 허용하는 규칙을 제거하고, Amazon SNS를 통해 알림을 보내는 AWS Lambda 함수를 생성했습니다.<br>요구 사항을 충족하려면 DevOps 엔지니어가 다음에 무엇을 해야 합니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure the Lambda function to be invoked by the SNS topic. Create an AWS CloudTrail subscription for the SNS topic.`, ko:`Lambda 함수가 SNS 토픽에 의해 호출되도록 구성합니다. SNS 토픽에 대한 AWS CloudTrail 구독을 생성합니다.` },
    { k:'B', en:`Create an AWS Config rule for the Lambda function. Configure the rule to run when security group configurations change.`, ko:`Lambda 함수에 대한 AWS Config 규칙을 생성합니다. 보안 그룹 구성이 변경될 때 규칙이 실행되도록 구성합니다.` },
    { k:'C', en:`Create an Amazon EventBridge event rule that has the default event bus as the source. Define the rule's event pattern to match EC2 security group creation and modification events. Configure the rule to invoke the Lambda function.`, ko:`기본 이벤트 버스를 소스로 사용하는 Amazon EventBridge 이벤트 규칙을 생성합니다. EC2 보안 그룹 생성 및 수정 이벤트와 일치하도록 규칙의 이벤트 패턴을 정의합니다. 규칙이 Lambda 함수를 호출하도록 구성합니다.` },
    { k:'D', en:`Create an Amazon EventBridge custom event bus that subscribes to events from all AWS services. Configure the Lambda function to be invoked by the custom event bus.`, ko:`모든 AWS 서비스의 이벤트를 구독하는 Amazon EventBridge 사용자 지정 이벤트 버스를 생성합니다. Lambda 함수가 사용자 지정 이벤트 버스에 의해 호출되도록 구성합니다.` },
  ],
  answer: ['C'],
  vote: '93% C',
  explain: `<p><span class="mark-ok">✅ C — EventBridge 기본 이벤트 버스 + EC2 보안 그룹 이벤트 패턴 + Lambda</span></p><p>Amazon EventBridge의 기본 이벤트 버스는 AWS 서비스 이벤트를 자동으로 수신합니다. EC2 보안 그룹 생성(<code>AuthorizeSecurityGroupIngress</code>) 및 수정 이벤트를 필터링하는 이벤트 패턴을 규칙에 정의하면, 보안 그룹 변경 시 거의 실시간으로 이미 생성된 Lambda 함수가 트리거됩니다. Lambda는 무제한 규칙을 제거하고 SNS를 통해 이메일 알림을 발송합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CloudTrail이 SNS에 직접 구독하는 방식은 지원되지 않습니다. CloudTrail 이벤트를 SNS로 직접 보내려면 EventBridge가 필요합니다.</p>
<p><span class="mark-no">❌ B</span> — AWS Config는 구성 변경 감지에 사용할 수 있지만, Config 규칙에서 Lambda를 직접 실행하면 실시간 대응이 EventBridge보다 느립니다. Lambda 함수 자체를 Config 규칙으로 등록하면 구조가 불필요하게 복잡해집니다.</p>
<p><span class="mark-no">❌ D</span> — 사용자 지정 이벤트 버스는 외부 이벤트 소스 또는 계정 간 이벤트에 사용됩니다. AWS 서비스 이벤트는 기본 이벤트 버스에서 수신해야 합니다.</p>`,
  disc: [{ ans:'C (93%)', txt:'EC2 보안 그룹 변경 이벤트는 기본 EventBridge 이벤트 버스에서 자동 수신, 이벤트 패턴 매칭 후 Lambda 직접 호출이 가장 간단하고 빠른 솔루션' }]
},
{
  n: 361,
  en: `A company's DevOps team uses Node Package Manager (NPM) open source libraries to build applications. The DevOps team runs its application build process in an AWS CodeBuild project that downloads the NPM libraries from public NPM repositories. The company wants to host the NPM libraries in private NPM repositories. The company also needs to be able to run checks on new versions of the libraries before the DevOps team uses the libraries.<br>Which solution will meet these requirements with the LEAST operational effort?`,
  ko: `회사의 DevOps 팀은 Node Package Manager(NPM) 오픈 소스 라이브러리를 사용하여 애플리케이션을 빌드합니다. DevOps 팀은 공개 NPM 저장소에서 NPM 라이브러리를 다운로드하는 AWS CodeBuild 프로젝트에서 애플리케이션 빌드 프로세스를 실행합니다. 회사는 NPM 라이브러리를 비공개 NPM 저장소에 호스팅하려고 합니다. 또한 DevOps 팀이 라이브러리를 사용하기 전에 새 버전의 라이브러리에 대한 검사를 실행할 수 있어야 합니다.<br>최소한의 운영 오버헤드로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an AWS CodeArtifact repository with an upstream repository named <code>npm-store</code>. Configure the application build process to use the CodeArtifact repository as the default source for NPM. Create an AWS CodePipeline pipeline to perform the required checks on package versions in the CodeArtifact repository. Set the package status to <code>unlisted</code> if a failure occurs.`, ko:`<code>npm-store</code>라는 업스트림 저장소를 사용하여 AWS CodeArtifact 저장소를 생성합니다. 애플리케이션 빌드 프로세스가 CodeArtifact 저장소를 NPM의 기본 소스로 사용하도록 구성합니다. CodeArtifact 저장소의 패키지 버전에 필요한 검사를 수행하는 AWS CodePipeline 파이프라인을 생성합니다. 오류가 발생하면 패키지 상태를 <code>unlisted</code>로 설정합니다.` },
    { k:'B', en:`Enable Amazon S3 caching in the CodeBuild project configuration. Add a step in the <code>buildspec.yaml</code> config file to perform the required checks on the package versions in the cache.`, ko:`CodeBuild 프로젝트 구성에서 Amazon S3 캐싱을 활성화합니다. <code>buildspec.yaml</code> 구성 파일에 캐시의 패키지 버전에 필요한 검사를 수행하는 단계를 추가합니다.` },
    { k:'C', en:`Create an AWS CodeCommit repository for each library. Clone the required NPM libraries to the appropriate CodeCommit repository. Modify the CodeBuild <code>buildspec.yaml</code> config file to use the private CodeCommit repositories. Add a step to perform the required checks on the package versions.`, ko:`각 라이브러리에 대한 AWS CodeCommit 저장소를 생성합니다. 필요한 NPM 라이브러리를 적절한 CodeCommit 저장소에 클론합니다. CodeBuild <code>buildspec.yaml</code> 구성 파일을 수정하여 비공개 CodeCommit 저장소를 사용합니다. 패키지 버전에 필요한 검사를 수행하는 단계를 추가합니다.` },
    { k:'D', en:`Create an AWS CodeCommit repository for each library. Clone the required NPM libraries to the appropriate CodeCommit repository. Modify the CodeBuild <code>buildspec.yaml</code> config file so that NPM uses the private CodeCommit repositories. Add an AWS CodePipeline pipeline that performs the required checks on the package versions for each new commit to the repositories. Configure the pipeline to revert to the most recent commit in the event of a failure.`, ko:`각 라이브러리에 대한 AWS CodeCommit 저장소를 생성합니다. 필요한 NPM 라이브러리를 적절한 CodeCommit 저장소에 클론합니다. CodeBuild <code>buildspec.yaml</code> 구성 파일을 수정하여 NPM이 비공개 CodeCommit 저장소를 사용하도록 합니다. 저장소의 각 새 커밋에 대한 패키지 버전에 필요한 검사를 수행하는 AWS CodePipeline 파이프라인을 추가합니다. 오류가 발생하면 가장 최근 커밋으로 되돌리도록 파이프라인을 구성합니다.` },
  ],
  answer: ['A'],
  vote: '85% A',
  explain: `<p><span class="mark-ok">✅ A — CodeArtifact + 업스트림 저장소 + CodePipeline</span></p><p>AWS CodeArtifact는 NPM을 포함한 여러 패키지 형식을 지원하는 완전 관리형 아티팩트 저장소입니다. <code>npm-store</code>라는 업스트림 저장소를 구성하면 공개 NPM 저장소에서 패키지를 자동으로 프록시하여 비공개 저장소에 캐싱합니다. CodeBuild 빌드 프로세스가 CodeArtifact를 기본 NPM 소스로 사용하도록 구성하면 됩니다. CodePipeline으로 새 패키지 버전 검사를 자동화하고, 실패 시 패키지를 <code>unlisted</code> 상태로 설정하면 팀이 검사를 통과하지 않은 버전을 사용하는 것을 방지합니다. 이 방식이 가장 운영 오버헤드가 낮습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — S3 캐싱은 빌드 속도를 높이지만 비공개 NPM 저장소 호스팅 요구 사항을 충족하지 않습니다.</p>
<p><span class="mark-no">❌ C, D</span> — CodeCommit은 소스 코드 저장소로, NPM 패키지 저장소로 사용하는 것은 지원되지 않으며 운영 오버헤드가 훨씬 높습니다. 각 라이브러리마다 저장소를 생성하고 수동으로 클론하는 작업이 필요합니다.</p>`,
  disc: [{ ans:'A (85%)', txt:'CodeArtifact의 업스트림 프록시 기능으로 공개 NPM 패키지를 자동 캐싱하고, CodePipeline으로 버전 검사를 자동화하는 최소 오버헤드 솔루션' }]
},
{
  n: 362,
  en: `A company uses AWS CodePipeline and AWS CodeDeploy to deploy application code to Amazon EC2 instances. The EC2 instances send application logs and CodeDeploy logs to Amazon CloudWatch. Recently, the company manually rolled back a deployment because of application errors. The company wants to automate the rollback process when application errors occur.<br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `회사는 AWS CodePipeline 및 AWS CodeDeploy를 사용하여 Amazon EC2 인스턴스에 애플리케이션 코드를 배포합니다. EC2 인스턴스는 애플리케이션 로그와 CodeDeploy 로그를 Amazon CloudWatch로 전송합니다. 최근 회사는 애플리케이션 오류로 인해 배포를 수동으로 롤백했습니다. 회사는 애플리케이션 오류가 발생할 때 롤백 프로세스를 자동화하려고 합니다.<br>최소한의 운영 오버헤드로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a CloudWatch metric based on the application logs. Create a CloudWatch alarm based on the metric that will activate when application errors occur. Change the deployment group settings to use the CloudWatch alarm configuration. Configure the deployment group to use an auto rollback configuration.`, ko:`애플리케이션 로그를 기반으로 CloudWatch 지표를 생성합니다. 애플리케이션 오류가 발생할 때 활성화되는 지표 기반 CloudWatch 경보를 생성합니다. CloudWatch 경보 구성을 사용하도록 배포 그룹 설정을 변경합니다. 자동 롤백 구성을 사용하도록 배포 그룹을 구성합니다.` },
    { k:'B', en:`Configure a CloudWatch alarm that uses a custom metric for application errors that are recorded in the CodeDeploy agent logs. Configure the current deployment to use the CloudWatch alarm for its alarm configuration.`, ko:`CodeDeploy 에이전트 로그에 기록된 애플리케이션 오류에 대한 사용자 지정 지표를 사용하는 CloudWatch 경보를 구성합니다. 현재 배포가 경보 구성에 CloudWatch 경보를 사용하도록 구성합니다.` },
    { k:'C', en:`Create an Amazon EventBridge rule that is triggered by CodeDeploy events. Configure the rule to invoke an AWS Lambda function when a deployment fails. Configure the Lambda function to call the CodeDeploy rollback API.`, ko:`CodeDeploy 이벤트에 의해 트리거되는 Amazon EventBridge 규칙을 생성합니다. 배포가 실패할 때 AWS Lambda 함수를 호출하도록 규칙을 구성합니다. CodeDeploy 롤백 API를 호출하도록 Lambda 함수를 구성합니다.` },
    { k:'D', en:`Create a CloudWatch dashboard that displays application error metrics. Create an Amazon SNS notification that is triggered when the number of application errors exceeds a threshold. Configure the SNS notification to alert an administrator to manually initiate a rollback.`, ko:`애플리케이션 오류 지표를 표시하는 CloudWatch 대시보드를 생성합니다. 애플리케이션 오류 수가 임계값을 초과할 때 트리거되는 Amazon SNS 알림을 생성합니다. 관리자가 수동으로 롤백을 시작하도록 SNS 알림을 구성합니다.` },
  ],
  answer: ['A'],
  vote: '88% A',
  explain: `<p><span class="mark-ok">✅ A — CloudWatch 경보 + CodeDeploy 자동 롤백</span></p><p>CodeDeploy는 배포 그룹 수준에서 CloudWatch 경보와 연동하는 내장 자동 롤백 기능을 제공합니다. 애플리케이션 로그에서 CloudWatch 지표 필터를 생성하고, 오류 임계값을 초과할 때 경보가 활성화되면 CodeDeploy가 자동으로 롤백을 트리거합니다. 추가 Lambda 함수나 수동 개입 없이 CodeDeploy 자체 기능만으로 구현되므로 운영 오버헤드가 최소화됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — CodeDeploy 에이전트 로그는 배포 관련 로그이지 애플리케이션 오류 로그가 아닙니다. 요구 사항은 애플리케이션 오류 감지입니다.</p>
<p><span class="mark-no">❌ C</span> — EventBridge + Lambda 조합은 CodeDeploy 내장 기능보다 운영 오버헤드가 높습니다. 배포 실패 이벤트는 이미 롤백이 필요한 상태이며, 애플리케이션 오류를 선제적으로 감지하지 못합니다.</p>
<p><span class="mark-no">❌ D</span> — 수동 개입이 필요하므로 자동화 요구 사항을 충족하지 않습니다.</p>`,
  disc: [{ ans:'A (88%)', txt:'CloudWatch 지표 필터로 앱 오류를 감지하고 CodeDeploy 배포 그룹의 내장 자동 롤백 기능과 연동하는 가장 단순한 자동화 패턴' }]
},
{
  n: 363,
  en: `A company has an application that runs on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. The company has been experiencing issues with application availability during Auto Scaling group scale-in events. During these events, the ALB continues to route traffic to instances that are being terminated, causing errors. A DevOps engineer needs to solve this problem.<br>Which solution will meet these requirements?`,
  ko: `회사는 Application Load Balancer 뒤의 Auto Scaling 그룹에 있는 Amazon EC2 인스턴스에서 실행되는 애플리케이션을 보유하고 있습니다. 회사는 Auto Scaling 그룹 스케일-인 이벤트 중 애플리케이션 가용성 문제를 경험하고 있습니다. 이러한 이벤트 중에 ALB는 종료되고 있는 인스턴스로 계속 트래픽을 라우팅하여 오류를 발생시킵니다. DevOps 엔지니어는 이 문제를 해결해야 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Enable connection draining on the ALB target group. Set an appropriate draining timeout that allows existing connections to complete before instance termination.`, ko:`ALB 대상 그룹에서 연결 드레이닝을 활성화합니다. 인스턴스 종료 전에 기존 연결이 완료될 수 있도록 적절한 드레이닝 타임아웃을 설정합니다.` },
    { k:'B', en:`Configure an Auto Scaling lifecycle hook for the <code>EC2_INSTANCE_TERMINATING</code> transition. Use an Amazon EventBridge rule to detect the lifecycle hook event. Invoke an AWS Lambda function to deregister the instance from the ALB target group before proceeding with termination.`, ko:`<code>EC2_INSTANCE_TERMINATING</code> 전환에 대한 Auto Scaling 수명 주기 훅을 구성합니다. Amazon EventBridge 규칙을 사용하여 수명 주기 훅 이벤트를 감지합니다. AWS Lambda 함수를 호출하여 종료를 진행하기 전에 ALB 대상 그룹에서 인스턴스를 등록 취소합니다.` },
    { k:'C', en:`Create an Amazon SNS topic that is triggered when instances are terminated by Auto Scaling. Configure the SNS topic to notify developers to manually update the ALB target group.`, ko:`Auto Scaling에 의해 인스턴스가 종료될 때 트리거되는 Amazon SNS 토픽을 생성합니다. 개발자에게 ALB 대상 그룹을 수동으로 업데이트하도록 알리도록 SNS 토픽을 구성합니다.` },
    { k:'D', en:`Increase the health check grace period on the Auto Scaling group to give instances more time to complete processing before termination.`, ko:`Auto Scaling 그룹의 상태 확인 유예 기간을 늘려 인스턴스가 종료 전에 처리를 완료할 수 있는 시간을 더 많이 줍니다.` },
  ],
  answer: ['A'],
  vote: '82% A',
  explain: `<p><span class="mark-ok">✅ A — ALB 연결 드레이닝(Deregistration Delay)</span></p><p>ALB 대상 그룹의 <strong>연결 드레이닝(Deregistration Delay)</strong> 기능은 인스턴스가 대상 그룹에서 등록 취소될 때 진행 중인 기존 요청이 완료될 때까지 새 요청은 차단하고 기존 연결은 유지합니다. Auto Scaling 스케일-인 시 인스턴스는 자동으로 ALB에서 등록 취소되고, 드레이닝 타임아웃(기본 300초) 동안 기존 연결이 완료된 후 종료됩니다. 이것이 이 문제를 해결하는 가장 직접적이고 운영 오버헤드가 낮은 솔루션입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 수명 주기 훅 + Lambda 조합은 작동하지만 ALB 드레이닝보다 복잡하고 이미 ALB가 이 기능을 내장 지원합니다.</p>
<p><span class="mark-no">❌ C</span> — 수동 개입이 필요하여 자동화 요구 사항을 충족하지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — 상태 확인 유예 기간은 인스턴스 시작 후 상태 확인을 지연시키는 것으로, 종료 시 연결 드레이닝과 무관합니다.</p>`,
  disc: [{ ans:'A (82%)', txt:'ALB Deregistration Delay(연결 드레이닝)는 스케일-인 시 진행 중 요청 보호를 위한 표준 설정으로 추가 인프라 없이 해결 가능' }]
},
{
  n: 364,
  en: `A company's DevOps engineer is responsible for managing infrastructure for a web application. The application runs on Amazon EC2 instances behind an Application Load Balancer. The company uses Amazon CloudWatch to monitor the application. The company wants to receive automated alerts when the application error rate exceeds acceptable thresholds and wants to automatically restart the problematic EC2 instances when errors are detected.<br>Which solution will meet these requirements with the LEAST development effort?`,
  ko: `회사의 DevOps 엔지니어는 웹 애플리케이션의 인프라를 관리할 책임이 있습니다. 애플리케이션은 Application Load Balancer 뒤의 Amazon EC2 인스턴스에서 실행됩니다. 회사는 Amazon CloudWatch를 사용하여 애플리케이션을 모니터링합니다. 회사는 애플리케이션 오류율이 허용 임계값을 초과할 때 자동 경보를 받고 오류가 감지되면 문제가 있는 EC2 인스턴스를 자동으로 재시작하려고 합니다.<br>최소한의 개발 노력으로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a CloudWatch alarm for the ALB <code>HTTPCode_Target_5XX_Count</code> metric. Configure the alarm to send a notification to an Amazon SNS topic. Create an AWS Systems Manager Automation runbook to reboot instances. Configure the SNS topic to invoke the runbook when the alarm is triggered.`, ko:`ALB <code>HTTPCode_Target_5XX_Count</code> 지표에 대한 CloudWatch 경보를 생성합니다. 경보가 Amazon SNS 토픽에 알림을 보내도록 구성합니다. 인스턴스를 재부팅하는 AWS Systems Manager Automation 런북을 생성합니다. 경보가 트리거될 때 런북을 호출하도록 SNS 토픽을 구성합니다.` },
    { k:'B', en:`Create a CloudWatch alarm for the ALB <code>HTTPCode_Target_5XX_Count</code> metric. Add an EC2 reboot action to the alarm. Configure the alarm to send a notification to an Amazon SNS topic.`, ko:`ALB <code>HTTPCode_Target_5XX_Count</code> 지표에 대한 CloudWatch 경보를 생성합니다. 경보에 EC2 재부팅 액션을 추가합니다. 경보가 Amazon SNS 토픽에 알림을 보내도록 구성합니다.` },
    { k:'C', en:`Enable AWS Config for the account. Create an AWS Config rule that evaluates EC2 instance health. Configure automatic remediation to reboot noncompliant instances.`, ko:`계정에 대해 AWS Config를 활성화합니다. EC2 인스턴스 상태를 평가하는 AWS Config 규칙을 생성합니다. 비준수 인스턴스를 재부팅하도록 자동 수정을 구성합니다.` },
    { k:'D', en:`Create an Amazon EventBridge rule that detects ALB access log entries containing 5XX errors. Configure the rule to invoke an AWS Lambda function that reboots the problematic instances. Configure the Lambda function to send a notification to an Amazon SNS topic.`, ko:`5XX 오류가 포함된 ALB 액세스 로그 항목을 감지하는 Amazon EventBridge 규칙을 생성합니다. 문제가 있는 인스턴스를 재부팅하는 AWS Lambda 함수를 호출하도록 규칙을 구성합니다. Lambda 함수가 Amazon SNS 토픽에 알림을 보내도록 구성합니다.` },
  ],
  answer: ['B'],
  vote: '79% B',
  explain: `<p><span class="mark-ok">✅ B — CloudWatch 경보 EC2 재부팅 액션 + SNS</span></p><p>CloudWatch 경보는 EC2 인스턴스에 대한 내장 재부팅 액션을 지원합니다. ALB의 <code>HTTPCode_Target_5XX_Count</code> 지표로 애플리케이션 오류율을 모니터링하고, 임계값 초과 시 경보가 EC2 재부팅 액션을 트리거합니다. SNS 알림도 동시에 발송됩니다. 추가 Lambda 함수나 SSM 런북 없이 CloudWatch 경보 하나로 두 요구 사항을 모두 충족하므로 개발 노력이 최소화됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — SNS → SSM Automation 호출은 추가 구성이 필요하여 개발 노력이 더 많이 듭니다. CloudWatch 경보의 내장 EC2 액션이 더 간단합니다.</p>
<p><span class="mark-no">❌ C</span> — AWS Config는 구성 준수 관리 도구로, 실시간 오류율 모니터링에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — ALB 액세스 로그는 S3에 저장되며 실시간 이벤트가 아닙니다. EventBridge + Lambda 조합은 개발 노력이 더 많이 듭니다.</p>`,
  disc: [{ ans:'B (79%)', txt:'CloudWatch 경보의 내장 EC2 재부팅 액션과 SNS 알림을 조합하면 추가 Lambda/SSM 없이 두 요구 사항을 동시에 충족' }]
},
{
  n: 365,
  en: `A company is implementing a multi-account AWS environment using AWS Organizations. The company's security team needs to ensure that all new AWS accounts created in the organization automatically have specific AWS Config rules enabled. The security team also wants to receive consolidated compliance reports across all accounts.<br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `회사는 AWS Organizations을 사용하여 멀티 계정 AWS 환경을 구현하고 있습니다. 회사의 보안 팀은 조직에서 생성된 모든 새 AWS 계정이 자동으로 특정 AWS Config 규칙을 활성화하도록 해야 합니다. 보안 팀은 또한 모든 계정에 걸쳐 통합된 규정 준수 보고서를 받기를 원합니다.<br>이 요구 사항을 충족하는 단계 조합은 무엇입니까? (두 가지 선택)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Enable AWS Config in the management account. Create AWS Config rules in the management account. Use the rules to evaluate compliance across all member accounts.`, ko:`관리 계정에서 AWS Config를 활성화합니다. 관리 계정에서 AWS Config 규칙을 생성합니다. 규칙을 사용하여 모든 멤버 계정의 규정 준수를 평가합니다.` },
    { k:'B', en:`Create an AWS Config conformance pack. Deploy the conformance pack to the organization using AWS CloudFormation StackSets.`, ko:`AWS Config 준수 팩을 생성합니다. AWS CloudFormation StackSets를 사용하여 조직에 준수 팩을 배포합니다.` },
    { k:'C', en:`Designate a delegated administrator account for AWS Config. Enable AWS Config with organization-wide settings from the delegated administrator account. Deploy an organizational conformance pack from the delegated administrator account.`, ko:`AWS Config의 위임된 관리자 계정을 지정합니다. 위임된 관리자 계정에서 조직 전체 설정으로 AWS Config를 활성화합니다. 위임된 관리자 계정에서 조직 준수 팩을 배포합니다.` },
    { k:'D', en:`Create an AWS Service Catalog portfolio with Config rules. Share the portfolio with all member accounts using AWS Organizations. Configure each member account to automatically accept the portfolio.`, ko:`Config 규칙을 포함한 AWS Service Catalog 포트폴리오를 생성합니다. AWS Organizations를 사용하여 모든 멤버 계정과 포트폴리오를 공유합니다. 각 멤버 계정이 포트폴리오를 자동으로 수락하도록 구성합니다.` },
    { k:'E', en:`Enable AWS Security Hub in the management account. Configure AWS Security Hub to aggregate findings from all accounts. Use the aggregated findings to generate compliance reports.`, ko:`관리 계정에서 AWS Security Hub를 활성화합니다. 모든 계정의 결과를 집계하도록 AWS Security Hub를 구성합니다. 집계된 결과를 사용하여 규정 준수 보고서를 생성합니다.` },
  ],
  answer: ['B','C'],
  vote: '76% BC',
  explain: `<p><span class="mark-ok">✅ B — 준수 팩 생성 + StackSets 배포</span></p><p>AWS Config 준수 팩(Conformance Pack)은 여러 Config 규칙과 수정 작업을 하나의 패키지로 묶은 것입니다. CloudFormation StackSets를 사용하면 조직의 모든 계정과 리전에 동시에 배포할 수 있습니다.</p>
<p><span class="mark-ok">✅ C — 위임된 관리자 + 조직 준수 팩</span></p><p>위임된 관리자 계정을 통해 조직 수준의 Config 설정을 관리하고, 조직 준수 팩을 배포하면 새 계정이 자동으로 규칙을 적용받습니다. 통합 규정 준수 보고서도 중앙에서 확인 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 관리 계정의 Config 규칙은 자동으로 멤버 계정에 적용되지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — Service Catalog는 이 요구 사항에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ E</span> — Security Hub는 보안 결과 집계에 사용되지만 Config 규칙 자동 적용은 지원하지 않습니다.</p>`,
  disc: [{ ans:'BC (76%)', txt:'조직 준수 팩과 위임된 관리자 조합이 새 계정 자동 규칙 적용 + 통합 보고를 가장 효율적으로 구현' }]
},
{
  n: 366,
  en: `A DevOps engineer is working on a data archival project that requires the migration of on-premises data to an Amazon S3 bucket. The DevOps engineer develops a script that incrementally archives on-premises data that is older than 1 month to Amazon S3. The DevOps engineer needs to verify the integrity of the transferred data. The solution must have the LEAST operational overhead.<br>Which solution will meet these requirements?`,
  ko: `DevOps 엔지니어는 온프레미스 데이터를 Amazon S3 버킷으로 마이그레이션해야 하는 데이터 보관 프로젝트를 진행하고 있습니다. DevOps 엔지니어는 1개월 이상 된 온프레미스 데이터를 Amazon S3로 점진적으로 보관하는 스크립트를 개발합니다. DevOps 엔지니어는 전송된 데이터의 무결성을 확인해야 합니다. 솔루션은 최소한의 운영 오버헤드를 가져야 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use the AWS CLI <code>s3 sync</code> command with the <code>--checksum-algorithm</code> option to transfer files to S3. Use the S3 ETag value to verify the integrity of the transferred files.`, ko:`<code>--checksum-algorithm</code> 옵션이 있는 AWS CLI <code>s3 sync</code> 명령을 사용하여 파일을 S3로 전송합니다. 전송된 파일의 무결성을 확인하기 위해 S3 ETag 값을 사용합니다.` },
    { k:'B', en:`Use AWS DataSync to transfer the on-premises data to Amazon S3. Configure DataSync to run data integrity checks during transfer by enabling the verification option.`, ko:`AWS DataSync를 사용하여 온프레미스 데이터를 Amazon S3로 전송합니다. 확인 옵션을 활성화하여 전송 중에 데이터 무결성 검사를 실행하도록 DataSync를 구성합니다.` },
    { k:'C', en:`Calculate MD5 checksums for all on-premises files before transfer. Upload files to S3 using a multipart upload with each part's checksum. After upload, compare the original checksums with the S3 object checksums.`, ko:`전송 전에 모든 온프레미스 파일에 대한 MD5 체크섬을 계산합니다. 각 파트의 체크섬을 사용한 멀티파트 업로드를 사용하여 파일을 S3에 업로드합니다. 업로드 후 원래 체크섬을 S3 객체 체크섬과 비교합니다.` },
    { k:'D', en:`Set up an AWS Transfer Family server to handle file transfers from on-premises to Amazon S3. Use CloudWatch Logs to monitor transfer activity and verify successful transfers.`, ko:`온프레미스에서 Amazon S3로의 파일 전송을 처리하는 AWS Transfer Family 서버를 설정합니다. CloudWatch Logs를 사용하여 전송 활동을 모니터링하고 성공적인 전송을 확인합니다.` },
  ],
  answer: ['B'],
  vote: '83% B',
  explain: `<p><span class="mark-ok">✅ B — AWS DataSync + 무결성 검사</span></p><p>AWS DataSync는 온프레미스에서 AWS 스토리지 서비스로의 데이터 이동을 위해 설계된 완전 관리형 서비스입니다. DataSync는 전송 중 및 전송 후 데이터 무결성 검사를 내장으로 수행하며, 체크섬을 자동으로 계산하고 비교합니다. 별도의 체크섬 계산 스크립트나 추가 검증 코드 없이 무결성 검증이 자동화되므로 운영 오버헤드가 가장 낮습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CLI s3 sync는 기능적으로 작동하지만 ETag는 멀티파트 업로드 시 단순 MD5가 아니어서 무결성 검증이 복잡할 수 있습니다. DataSync보다 오버헤드가 높습니다.</p>
<p><span class="mark-no">❌ C</span> — 수동 체크섬 계산과 비교는 개발 작업이 많이 필요합니다.</p>
<p><span class="mark-no">❌ D</span> — AWS Transfer Family는 SFTP/FTP 프로토콜 기반 전송용이며 데이터 무결성 검사 기능이 DataSync만큼 강력하지 않습니다.</p>`,
  disc: [{ ans:'B (83%)', txt:'DataSync는 내장 체크섬 검증과 자동 무결성 확인으로 추가 개발 없이 완전 자동화된 안전한 데이터 마이그레이션 제공' }]
},
{
  n: 367,
  en: `A company has a fleet of Amazon EC2 instances that run in multiple AWS Regions. The company uses AWS Systems Manager to manage the fleet. The company needs to ensure that all EC2 instances are patched with the latest security updates within 24 hours of the updates becoming available. The company also needs a report that shows the patch compliance status of all instances.<br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `회사는 여러 AWS 리전에서 실행되는 Amazon EC2 인스턴스 플리트를 보유하고 있습니다. 회사는 AWS Systems Manager를 사용하여 플리트를 관리합니다. 회사는 업데이트가 제공된 후 24시간 이내에 모든 EC2 인스턴스에 최신 보안 업데이트가 패치되도록 해야 합니다. 회사는 또한 모든 인스턴스의 패치 규정 준수 상태를 보여주는 보고서가 필요합니다.<br>최소한의 운영 오버헤드로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use AWS Systems Manager Patch Manager to create a patch baseline. Create a maintenance window that runs every 24 hours. Associate the patch baseline with the maintenance window and target all EC2 instances. Use Patch Manager compliance reporting to generate patch status reports.`, ko:`AWS Systems Manager Patch Manager를 사용하여 패치 기준을 생성합니다. 24시간마다 실행되는 유지 관리 창을 생성합니다. 패치 기준을 유지 관리 창과 연결하고 모든 EC2 인스턴스를 대상으로 지정합니다. Patch Manager 규정 준수 보고를 사용하여 패치 상태 보고서를 생성합니다.` },
    { k:'B', en:`Use AWS Lambda functions scheduled with Amazon EventBridge to run the <code>yum update</code> or <code>apt-get update</code> commands via SSH on all EC2 instances every 24 hours. Use CloudWatch Logs to track the output and generate compliance reports.`, ko:`Amazon EventBridge로 예약된 AWS Lambda 함수를 사용하여 24시간마다 모든 EC2 인스턴스에서 SSH를 통해 <code>yum update</code> 또는 <code>apt-get update</code> 명령을 실행합니다. CloudWatch Logs를 사용하여 출력을 추적하고 규정 준수 보고서를 생성합니다.` },
    { k:'C', en:`Configure AWS Config rules to check if EC2 instances have the latest patches. Set up AWS Config remediation to apply patches automatically when noncompliant instances are detected.`, ko:`EC2 인스턴스에 최신 패치가 있는지 확인하는 AWS Config 규칙을 구성합니다. 비준수 인스턴스가 감지될 때 자동으로 패치를 적용하도록 AWS Config 수정을 설정합니다.` },
    { k:'D', en:`Install a third-party patch management tool on each EC2 instance. Configure the tool to check for and apply patches every 24 hours. Generate compliance reports from the tool's dashboard.`, ko:`각 EC2 인스턴스에 타사 패치 관리 도구를 설치합니다. 도구가 24시간마다 패치를 확인하고 적용하도록 구성합니다. 도구의 대시보드에서 규정 준수 보고서를 생성합니다.` },
  ],
  answer: ['A'],
  vote: '95% A',
  explain: `<p><span class="mark-ok">✅ A — Systems Manager Patch Manager + 유지 관리 창</span></p><p>AWS Systems Manager Patch Manager는 EC2 인스턴스 패치를 자동화하는 완전 관리형 서비스입니다. 패치 기준(Patch Baseline)으로 승인된 패치를 정의하고, 유지 관리 창(Maintenance Window)으로 패치 일정을 설정합니다. 24시간 주기 유지 관리 창으로 최신 보안 업데이트를 24시간 내 적용 가능하며, Patch Manager의 규정 준수 보고 기능으로 모든 인스턴스의 패치 상태를 중앙에서 확인할 수 있습니다. 추가 도구 없이 Systems Manager만으로 구현 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — Lambda + SSH 방식은 SSH 접근성, 보안 그룹, 키 관리 등 복잡한 설정이 필요합니다.</p>
<p><span class="mark-no">❌ C</span> — AWS Config는 규정 준수 감사 도구이며 패치 관리에는 Patch Manager가 더 적합합니다.</p>
<p><span class="mark-no">❌ D</span> — 타사 도구는 운영 오버헤드가 높고 AWS 네이티브 솔루션보다 비효율적입니다.</p>`,
  disc: [{ ans:'A (95%)', txt:'Systems Manager Patch Manager는 AWS 표준 패치 자동화 솔루션으로, 유지 관리 창과 규정 준수 보고를 모두 기본 제공' }]
},
{
  n: 368,
  en: `A company is running an application on a fleet of Amazon EC2 instances behind an Application Load Balancer. The company wants to implement a blue/green deployment strategy for the application. During the deployment, the company wants to be able to shift traffic gradually to the new version while maintaining the ability to quickly roll back. The company uses AWS CodeDeploy for deployments.<br>Which configuration will meet these requirements?`,
  ko: `회사는 Application Load Balancer 뒤의 Amazon EC2 인스턴스 플리트에서 애플리케이션을 실행하고 있습니다. 회사는 애플리케이션에 블루/그린 배포 전략을 구현하려고 합니다. 배포 중에 회사는 빠른 롤백 능력을 유지하면서 새 버전으로 트래픽을 점진적으로 전환할 수 있기를 원합니다. 회사는 배포에 AWS CodeDeploy를 사용합니다.<br>이 요구 사항을 충족하는 구성은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure a CodeDeploy deployment group with a blue/green deployment type. Set the traffic routing to <code>TimeBasedLinear</code> to gradually shift traffic. Configure the deployment group to terminate the original instances immediately after deployment.`, ko:`블루/그린 배포 유형으로 CodeDeploy 배포 그룹을 구성합니다. 트래픽을 점진적으로 전환하도록 트래픽 라우팅을 <code>TimeBasedLinear</code>로 설정합니다. 배포 후 즉시 원래 인스턴스를 종료하도록 배포 그룹을 구성합니다.` },
    { k:'B', en:`Configure a CodeDeploy deployment group with a blue/green deployment type. Set the traffic routing to <code>TimeBasedLinear</code> or <code>TimeBasedCanary</code> to gradually shift traffic. Configure the deployment group to keep the original instances running for a specified period after deployment to enable quick rollback.`, ko:`블루/그린 배포 유형으로 CodeDeploy 배포 그룹을 구성합니다. 트래픽을 점진적으로 전환하도록 트래픽 라우팅을 <code>TimeBasedLinear</code> 또는 <code>TimeBasedCanary</code>로 설정합니다. 빠른 롤백을 활성화하기 위해 배포 후 지정된 기간 동안 원래 인스턴스가 계속 실행되도록 배포 그룹을 구성합니다.` },
    { k:'C', en:`Configure a CodeDeploy deployment group with an in-place deployment type. Set the deployment configuration to <code>CodeDeployDefault.HalfAtATime</code> to gradually update instances. Use CodeDeploy rollback features to revert to the previous version.`, ko:`인플레이스 배포 유형으로 CodeDeploy 배포 그룹을 구성합니다. 인스턴스를 점진적으로 업데이트하도록 배포 구성을 <code>CodeDeployDefault.HalfAtATime</code>으로 설정합니다. 이전 버전으로 되돌리기 위해 CodeDeploy 롤백 기능을 사용합니다.` },
    { k:'D', en:`Configure a CodeDeploy deployment group with a blue/green deployment type. Set the traffic routing to <code>AllAtOnce</code> to ensure the new version receives all traffic immediately. Configure the deployment group to keep the original instances running for 1 hour after deployment.`, ko:`블루/그린 배포 유형으로 CodeDeploy 배포 그룹을 구성합니다. 새 버전이 즉시 모든 트래픽을 받도록 트래픽 라우팅을 <code>AllAtOnce</code>로 설정합니다. 배포 후 1시간 동안 원래 인스턴스가 계속 실행되도록 배포 그룹을 구성합니다.` },
  ],
  answer: ['B'],
  vote: '91% B',
  explain: `<p><span class="mark-ok">✅ B — 블루/그린 + 점진적 트래픽 전환 + 원래 인스턴스 유지</span></p><p>CodeDeploy 블루/그린 배포에서 <code>TimeBasedLinear</code>(선형 점진적 전환) 또는 <code>TimeBasedCanary</code>(카나리 방식) 트래픽 라우팅으로 새 버전(그린)으로 트래픽을 서서히 전환합니다. 배포 후 원래 인스턴스(블루)를 지정된 기간 동안 유지하면 문제 발생 시 즉시 트래픽을 블루로 되돌릴 수 있어 빠른 롤백이 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 원래 인스턴스를 즉시 종료하면 롤백이 불가능하거나 느려집니다.</p>
<p><span class="mark-no">❌ C</span> — 인플레이스 배포는 진정한 블루/그린이 아니며, 빠른 롤백 능력이 블루/그린보다 제한적입니다.</p>
<p><span class="mark-no">❌ D</span> — AllAtOnce는 점진적 트래픽 전환이 아닙니다.</p>`,
  disc: [{ ans:'B (91%)', txt:'블루/그린 배포에서 점진적 트래픽 전환 + 원래 환경 유지는 안전한 배포와 빠른 롤백의 표준 패턴' }]
},
{
  n: 369,
  en: `A company uses AWS CloudFormation to provision its infrastructure. The company has multiple environments (development, staging, production) that use different configurations. The company wants to ensure that infrastructure changes are tested in lower environments before being applied to production. The company also wants to prevent unauthorized changes to production infrastructure.<br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `회사는 AWS CloudFormation을 사용하여 인프라를 프로비저닝합니다. 회사는 서로 다른 구성을 사용하는 여러 환경(개발, 스테이징, 프로덕션)을 보유하고 있습니다. 회사는 인프라 변경 사항이 프로덕션에 적용되기 전에 하위 환경에서 테스트되도록 해야 합니다. 또한 프로덕션 인프라에 대한 무단 변경을 방지하려고 합니다.<br>이 요구 사항을 충족하는 단계 조합은 무엇입니까? (두 가지 선택)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Use a single AWS CodePipeline pipeline that deploys to development, staging, and production environments sequentially. Add manual approval actions between each environment stage. Use CloudFormation change sets to preview changes before deployment.`, ko:`개발, 스테이징, 프로덕션 환경에 순차적으로 배포하는 단일 AWS CodePipeline 파이프라인을 사용합니다. 각 환경 스테이지 사이에 수동 승인 액션을 추가합니다. CloudFormation 변경 세트를 사용하여 배포 전에 변경 사항을 미리 봅니다.` },
    { k:'B', en:`Create separate AWS accounts for each environment. Use AWS Organizations SCPs to restrict CloudFormation stack operations in the production account to only authorized IAM roles.`, ko:`각 환경에 대한 별도의 AWS 계정을 생성합니다. AWS Organizations SCP를 사용하여 프로덕션 계정의 CloudFormation 스택 작업을 권한이 있는 IAM 역할로만 제한합니다.` },
    { k:'C', en:`Enable AWS CloudTrail in the production account. Create an Amazon EventBridge rule to detect CloudFormation stack changes. Configure the rule to send alerts to the security team.`, ko:`프로덕션 계정에서 AWS CloudTrail을 활성화합니다. CloudFormation 스택 변경을 감지하는 Amazon EventBridge 규칙을 생성합니다. 규칙이 보안 팀에 경보를 보내도록 구성합니다.` },
    { k:'D', en:`Use a single AWS account for all environments with different VPCs. Apply resource-based policies to limit access to production resources.`, ko:`서로 다른 VPC가 있는 모든 환경에 단일 AWS 계정을 사용합니다. 리소스 기반 정책을 적용하여 프로덕션 리소스에 대한 액세스를 제한합니다.` },
    { k:'E', en:`Enable CloudFormation drift detection on production stacks. Set up a scheduled AWS Lambda function to check for drift daily and notify the team when drift is detected.`, ko:`프로덕션 스택에서 CloudFormation 드리프트 감지를 활성화합니다. 드리프트를 매일 확인하고 드리프트가 감지되면 팀에 알리는 예약된 AWS Lambda 함수를 설정합니다.` },
  ],
  answer: ['A','B'],
  vote: '80% AB',
  explain: `<p><span class="mark-ok">✅ A — CodePipeline 순차 배포 + 수동 승인 + 변경 세트</span></p><p>단일 파이프라인에서 개발→스테이징→프로덕션 순서로 배포하고, 각 환경 간 수동 승인을 요구하면 하위 환경 테스트 후 프로덕션 배포를 보장합니다. CloudFormation 변경 세트로 배포 전 변경 내용을 검토할 수 있습니다.</p>
<p><span class="mark-ok">✅ B — 계정 분리 + SCP로 프로덕션 보호</span></p><p>환경별 계정 분리는 강력한 격리를 제공합니다. SCP로 프로덕션 계정에서 CloudFormation 스택 작업을 특정 IAM 역할로만 제한하면 무단 변경을 방지합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ C</span> — CloudTrail + EventBridge는 변경 감지 후 알림을 보내지만 무단 변경 자체를 방지하지는 않습니다.</p>
<p><span class="mark-no">❌ D</span> — 단일 계정 + VPC 분리는 계정 수준 격리보다 훨씬 약합니다. SCP를 적용할 수 없습니다.</p>
<p><span class="mark-no">❌ E</span> — 드리프트 감지는 현재 상태 모니터링이며 무단 변경 방지와 환경 간 순차 배포 요구 사항을 충족하지 않습니다.</p>`,
  disc: [{ ans:'AB (80%)', txt:'파이프라인 순차 배포로 하위 환경 테스트 보장, 계정 분리+SCP로 프로덕션 무단 변경 방지' }]
},
{
  n: 370,
  en: `A company uses Amazon Elastic Container Service (Amazon ECS) to run containerized applications. The company stores container images in Amazon Elastic Container Registry (Amazon ECR). A DevOps engineer needs to implement a solution that automatically scans new container images for vulnerabilities when they are pushed to ECR. The solution must alert the security team about critical vulnerabilities.<br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `회사는 Amazon Elastic Container Service(Amazon ECS)를 사용하여 컨테이너화된 애플리케이션을 실행합니다. 회사는 Amazon Elastic Container Registry(Amazon ECR)에 컨테이너 이미지를 저장합니다. DevOps 엔지니어는 새 컨테이너 이미지가 ECR에 푸시될 때 자동으로 취약점을 스캔하는 솔루션을 구현해야 합니다. 솔루션은 중요한 취약점에 대해 보안 팀에 경보를 보내야 합니다.<br>최소한의 운영 오버헤드로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Enable Amazon Inspector enhanced scanning for the ECR repository. Create an Amazon EventBridge rule that detects Amazon Inspector findings with a severity of CRITICAL. Configure the rule to send notifications to an Amazon SNS topic that alerts the security team.`, ko:`ECR 저장소에 대해 Amazon Inspector 향상된 스캔을 활성화합니다. CRITICAL 심각도의 Amazon Inspector 결과를 감지하는 Amazon EventBridge 규칙을 생성합니다. 보안 팀에 경보를 보내는 Amazon SNS 토픽에 알림을 보내도록 규칙을 구성합니다.` },
    { k:'B', en:`Enable basic scanning on the ECR repository. Create an AWS Lambda function that runs after each image push to parse the scan results. Configure the Lambda function to send critical vulnerability alerts to an Amazon SNS topic.`, ko:`ECR 저장소에서 기본 스캔을 활성화합니다. 각 이미지 푸시 후 스캔 결과를 분석하는 AWS Lambda 함수를 생성합니다. Lambda 함수가 Amazon SNS 토픽에 중요 취약점 경보를 보내도록 구성합니다.` },
    { k:'C', en:`Deploy a third-party vulnerability scanning tool on an EC2 instance. Configure the tool to poll ECR for new images and scan them. Configure the tool to send alerts when critical vulnerabilities are found.`, ko:`EC2 인스턴스에 타사 취약점 스캐닝 도구를 배포합니다. ECR에서 새 이미지를 폴링하고 스캔하도록 도구를 구성합니다. 중요 취약점이 발견될 때 경보를 보내도록 도구를 구성합니다.` },
    { k:'D', en:`Create an AWS CodeBuild project that runs a vulnerability scan using open source tools as part of the CI/CD pipeline. Configure the pipeline to fail and send an SNS notification if critical vulnerabilities are found.`, ko:`CI/CD 파이프라인의 일부로 오픈 소스 도구를 사용하여 취약점 스캔을 실행하는 AWS CodeBuild 프로젝트를 생성합니다. 중요 취약점이 발견되면 파이프라인이 실패하고 SNS 알림을 보내도록 구성합니다.` },
  ],
  answer: ['A'],
  vote: '90% A',
  explain: `<p><span class="mark-ok">✅ A — Amazon Inspector 향상된 스캔 + EventBridge + SNS</span></p><p>Amazon Inspector는 ECR과 직접 통합되어 이미지가 푸시될 때 자동으로 취약점 스캔을 수행합니다. 향상된 스캔(Enhanced Scanning)은 OS 패키지와 프로그래밍 언어 패키지 취약점 모두를 스캔합니다. EventBridge 규칙으로 CRITICAL 심각도 결과를 필터링하고 SNS를 통해 보안 팀에 자동 알림을 보냅니다. 모두 AWS 관리형 서비스로 추가 인프라가 필요 없습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 기본 스캔은 OS 패키지만 스캔하며, Lambda 함수 추가 구성이 필요하여 오버헤드가 높습니다.</p>
<p><span class="mark-no">❌ C</span> — 타사 도구는 EC2 인스턴스 관리 등 높은 운영 오버헤드가 필요합니다.</p>
<p><span class="mark-no">❌ D</span> — 파이프라인 내 스캔은 이미 빌드된 이미지가 ECR에 푸시된 후의 자동 스캔을 다루지 않습니다.</p>`,
  disc: [{ ans:'A (90%)', txt:'Inspector ECR 통합은 이미지 푸시 시 자동 스캔을 완전 관리형으로 제공, EventBridge로 결과 필터링하여 SNS 알림 전달이 최소 오버헤드 솔루션' }]
},
{
  n: 371,
  en: `A company is implementing a CI/CD pipeline for a containerized application. The pipeline builds Docker images and pushes them to Amazon Elastic Container Registry (Amazon ECR). The company wants to ensure that only images that pass security scans are deployed to production. The company uses AWS CodePipeline for the pipeline.<br>Which solution will meet these requirements?`,
  ko: `회사는 컨테이너화된 애플리케이션을 위한 CI/CD 파이프라인을 구현하고 있습니다. 파이프라인은 Docker 이미지를 빌드하고 Amazon Elastic Container Registry(Amazon ECR)로 푸시합니다. 회사는 보안 스캔을 통과한 이미지만 프로덕션에 배포되도록 해야 합니다. 회사는 파이프라인에 AWS CodePipeline을 사용합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`After pushing the image to ECR, add a stage in the CodePipeline pipeline that invokes an AWS Lambda function to check the ECR image scan results. If critical vulnerabilities are found, configure the Lambda function to fail the pipeline. Proceed with deployment only if no critical vulnerabilities are found.`, ko:`이미지를 ECR에 푸시한 후 AWS Lambda 함수를 호출하여 ECR 이미지 스캔 결과를 확인하는 스테이지를 CodePipeline 파이프라인에 추가합니다. 중요 취약점이 발견되면 Lambda 함수가 파이프라인을 실패하도록 구성합니다. 중요 취약점이 발견되지 않은 경우에만 배포를 진행합니다.` },
    { k:'B', en:`Configure Amazon Inspector to scan ECR images. Create an Amazon EventBridge rule to detect Inspector findings. When critical findings are found, configure the rule to trigger an SNS notification but allow the deployment to continue.`, ko:`ECR 이미지를 스캔하도록 Amazon Inspector를 구성합니다. Inspector 결과를 감지하는 Amazon EventBridge 규칙을 생성합니다. 중요 결과가 발견되면 규칙이 SNS 알림을 트리거하도록 구성하지만 배포는 계속 진행합니다.` },
