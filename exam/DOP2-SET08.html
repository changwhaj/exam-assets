  ko: `한 회사가 Amazon EC2 인스턴스에서 실행되는 백엔드를 가진 전자상거래 애플리케이션을 개발 중입니다. 이 애플리케이션은 Amazon S3 버킷에 호스팅되는 정적 프런트엔드 웹사이트를 사용합니다.<br><br>회사는 버전 관리를 위해 GitHub 저장소를 사용하며, 메인 브랜치에 코드가 푸시될 때마다 빌드 및 배포를 자동화해야 합니다. 또한 프런트엔드와 백엔드의 변경 사항은 서로 독립적으로 배포해야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create a single AWS CodePipeline pipeline to use for the frontend and the backend. Specify the GitHub repository as the source. Configure two build stages that use AWS CodeBuild as the action provider to build the frontend components and backend components, respectively. Configure two deployment stages that use AWS CodeDeploy as the action provider to deploy the frontend and backend, respectively.`, ko:`프런트엔드와 백엔드에 사용할 단일 AWS CodePipeline 파이프라인을 생성합니다. 소스로 GitHub 리포지토리를 지정합니다. AWS CodeBuild를 액션 프로바이더로 사용하여 프런트엔드 구성 요소와 백엔드 구성 요소를 각각 빌드하는 두 개의 빌드 단계를 구성합니다. AWS CodeDeploy를 액션 프로바이더로 사용하여 프런트엔드와 백엔드를 각각 배포하는 두 개의 배포 단계를 구성합니다.` },
    { k:'B', en:`Create a single AWS CodePipeline pipeline to use for the frontend and the backend. Specify the GitHub repository as the source. Configure two build stages that use AWS CodeBuild as the action provider to build the frontend components and backend components, respectively. Configure two deployment stages. For the backend stage, use AWS CodeDeploy as the action provider to deploy the backend to the EC2 instances. For the frontend stage, use Amazon S3 as the action provider to deploy the frontend to the S3 bucket.`, ko:`프런트엔드와 백엔드에 사용할 단일 AWS CodePipeline 파이프라인을 생성합니다. 소스로 GitHub 리포지토리를 지정합니다. AWS CodeBuild를 액션 프로바이더로 사용하여 프런트엔드 구성 요소와 백엔드 구성 요소를 각각 빌드하는 두 개의 빌드 단계를 구성합니다. 두 개의 배포 단계를 구성합니다. 백엔드 단계에서는 AWS CodeDeploy를 액션 프로바이더로 사용하여 백엔드를 EC2 인스턴스에 배포합니다. 프런트엔드 단계에서는 Amazon S3를 액션 프로바이더로 사용하여 프런트엔드를 S3 버킷에 배포합니다.` },
    { k:'C', en:`Create two AWS CodePipeline pipelines: one for the frontend and one for the backend. Specify the GitHub repository as the source. Configure a build stage that uses AWS CodeBuild as the action provider for each pipeline to build the frontend and the backend. Configure a deployment stage that uses AWS CodeDeploy as the action provider for each pipeline to deploy the frontend and the backend.`, ko:`프런트엔드용과 백엔드용으로 각각 하나씩, 총 두 개의 AWS CodePipeline 파이프라인을 생성합니다. 소스로는 GitHub 리포지토리를 지정합니다. 각 파이프라인에 대해 AWS CodeBuild를 액션 프로바이더로 사용하는 빌드 단계를 구성하여 프런트엔드와 백엔드를 빌드합니다. 또한, 각 파이프라인에 대해 AWS CodeDeploy를 액션 프로바이더로 사용하는 배포 단계를 구성하여 프런트엔드와 백엔드를 배포합니다.` },
    { k:'D', en:`Create two AWS CodePipeline pipelines: one for the frontend and one for the backend. Specify the GitHub repository as the source. Configure a build stage that uses AWS CodeBuild as the action provider for each pipeline to build the frontend and the backend. For the backend pipeline, use AWS CodeDeploy as the action provider to deploy the backend to the EC2 instances. For the frontend pipeline, use Amazon S3 as the action provider to deploy the frontend to the S3 bucket.`, ko:`AWS CodePipeline 파이프라인 두 개를 생성합니다. 하나는 프런트엔드용이고 다른 하나는 백엔드용입니다. 소스로는 GitHub 리포지토리를 지정합니다. 각 파이프라인에 대해 AWS CodeBuild를 액션 프로바이더로 사용하여 프런트엔드와 백엔드를 빌드하는 빌드 단계를 구성합니다. 백엔드 파이프라인의 경우, AWS CodeDeploy를 액션 프로바이더로 사용하여 백엔드를 EC2 인스턴스에 배포합니다. 프런트엔드 파이프라인의 경우, Amazon S3를 액션 프로바이더로 사용하여 프런트엔드를 S3 버킷에 배포합니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — 핵심 이유</span></p><p>프런트엔드와 백엔드를 독립적으로 배포하려면 별도의 파이프라인이 필요합니다. 프런트엔드(S3 정적 웹사이트)는 Amazon S3 액션 프로바이더로, 백엔드(EC2)는 AWS CodeDeploy 액션 프로바이더로 배포하는 것이 각 환경에 맞는 올바른 구성입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A/B</span> — 단일 파이프라인은 프런트엔드와 백엔드를 독립적으로 배포할 수 없습니다. 하나가 변경되면 다른 것도 함께 실행됩니다.</p><p><span class="mark-no">❌ C</span> — 두 파이프라인을 사용하지만 프런트엔드 배포에 CodeDeploy를 사용하는 것은 S3 정적 사이트에 부적합합니다.</p>`,
  disc: []
},
{
  n: 398,
  en: `A company has an RPO of 24 hours and an RTO of 10 minutes for a critical web application that runs on Amazon EC2 instances. The company uses AWS Organizations to manage its AWS account. The company wants to set up AWS Backup for its AWS environment.<br><br>A DevOps engineer configures AWS Organizations for AWS Backup. The DevOps engineer creates a new centralized AWS account to store the backups. Each EC2 instance has four Amazon Elastic Block Store (Amazon EBS) volumes attached.<br><br>Which solution will meet this requirement MOST securely?`,
  ko: `한 회사의 중요 웹 애플리케이션(Amazon EC2 인스턴스에서 실행됨)에 대해 RPO는 24시간, RTO는 10분입니다. 이 회사는 AWS Organizations를 사용하여 AWS 계정을 관리합니다. 이제 AWS 환경에 AWS Backup을 설정하려고 합니다.<br><br>DevOps 엔지니어가 AWS Backup을 위해 AWS Organizations를 구성하고, 백업을 저장할 새로운 중앙 집중식 AWS 계정을 생성합니다. 각 EC2 인스턴스에는 4개의 Amazon Elastic Block Store(Amazon EBS) 볼륨이 연결되어 있습니다.<br><br>이 요구 사항을 가장 안전하게 충족하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create encrypted backup vaults and customer managed AWS KMS keys in both accounts. Configure AWS Backup to create full EC2 backups as AMIs. Copy the backups to the centralized vault.`, ko:`두 계정 모두에 암호화된 백업 볼트와 고객 관리형 AWS KMS 키를 생성합니다. AWS Backup을 구성하여 전체 EC2 백업을 AMI로 생성합니다. 생성된 백업을 중앙 집중식 볼트로 복사합니다.` },
    { k:'B', en:`Create encrypted vaults in both accounts by using the source account's AWS KMS key. Configure AWS Backup to create EC2 AMIs. Copy the AMIs to the centralized vault.`, ko:`소스 계정의 AWS KMS 키를 사용하여 두 계정 모두에 암호화된 볼트를 생성합니다. AWS Backup을 구성하여 EC2 AMI를 생성합니다. 생성된 AMI를 중앙 집중식 볼트로 복사합니다.` },
    { k:'C', en:`Create backup vaults in both accounts. Use AWS managed keys for encryption. Configure AWS Backup to create EC2 AMIs. Copy the AMIs to the centralized vault.`, ko:`두 계정 모두에 백업 볼트를 생성합니다. 암호화에는 AWS 관리형 키를 사용합니다. AWS Backup이 EC2 AMI를 생성하도록 구성합니다. 생성된 AMI를 중앙 집중식 볼트로 복사합니다.` },
    { k:'D', en:`Create encrypted vaults in both accounts. Use a customer managed KMS key in the source account. Use an AWS managed key in the centralized account. Configure AWS Backup to create EC2 AMIs. Copy the AMIs to the centralized vault.`, ko:`두 계정 모두에 암호화된 볼트를 생성합니다. 소스 계정에는 고객 관리형 KMS 키를 사용하고, 중앙 집중식 계정에는 AWS 관리형 키를 사용합니다. AWS Backup을 구성하여 EC2 AMI를 생성하고, 생성된 AMI를 중앙 집중식 볼트로 복사합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p><p>가장 안전한 구성은 양쪽 계정 모두에 고객 관리형 KMS 키(CMK)를 사용하는 것입니다. CMK는 키 사용 정책, 키 회전, 접근 제어를 세밀하게 관리할 수 있어 AWS 관리형 키보다 보안성이 높습니다. EC2 전체 백업(AMI)으로 EBS 볼륨 4개를 포함한 완전한 복구가 가능하며 RTO 10분을 충족합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 소스 계정의 KMS 키만 사용하면 교차 계정 복사 시 키 정책 관리가 복잡해지고 보안상 취약점이 생깁니다.</p><p><span class="mark-no">❌ C</span> — AWS 관리형 키는 교차 계정 공유가 불가능하여 중앙 계정으로 백업 복사 시 문제가 발생합니다.</p><p><span class="mark-no">❌ D</span> — 혼합 키 사용은 일관성이 없으며, 중앙 계정에 AWS 관리형 키 사용 시 교차 계정 복사 제한이 있습니다.</p>`,
  disc: []

{
  n: 399,
  en: `A company wants to proactively monitor and respond to AWS service issues that might affect an application. The company must correlate AWS Health events with application performance metrics and must set up automated alerts. The solution must give the company the ability to archive events, test the application's latency in different scenarios, and create custom metrics.<br><br>Which solution will meet these requirements?`,
  ko: `한 기업이 애플리케이션에 영향을 미칠 수 있는 AWS 서비스 문제를 사전에 모니터링하고 대응하고자 합니다. AWS 상태 이벤트와 애플리케이션 성능 지표 간의 상관관계를 파악하고 자동화된 알림을 설정해야 합니다. 또한, 이벤트 아카이빙, 다양한 시나리오에서의 애플리케이션 지연 시간 테스트, 사용자 지정 지표 생성 기능도 제공해야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇일까요?`,

    { k:'B', en:`Use Amazon EventBridge to route AWS Health events to Amazon CloudWatch Logs. Create a metric filter for AWS Health events. Create custom metrics in CloudWatch that are based on application performance data. Set up CloudWatch alarms that correlate AWS Health events with the custom metrics.`, ko:`Amazon EventBridge를 사용하여 AWS Health 이벤트를 Amazon CloudWatch Logs로 라우팅합니다. AWS Health 이벤트에 대한 메트릭 필터를 생성합니다. 애플리케이션 성능 데이터를 기반으로 CloudWatch에 사용자 지정 메트릭을 생성합니다. AWS Health 이벤트와 사용자 지정 메트릭을 연관시키는 CloudWatch 알람을 설정합니다.` },
    { k:'C', en:`Configure the AWS Health Dashboard to send notifications to Amazon Simple Notification Service (Amazon SNS). Use AWS Lambda to correlate the notifications with metrics and to update custom metrics in Amazon CloudWatch. Set up CloudWatch alarms for the custom metrics. Use AWS Systems Manager for automated remediation.`, ko:`AWS Health Dashboard를 구성하여 Amazon Simple Notification Service(Amazon SNS)로 알림을 전송합니다. AWS Lambda를 사용하여 알림과 메트릭을 연관시키고 Amazon CloudWatch의 사용자 지정 메트릭을 업데이트합니다. 사용자 지정 메트릭에 대한 CloudWatch 알람을 설정합니다. AWS Systems Manager를 사용하여 자동화된 문제 해결을 수행합니다.` },
    { k:'D', en:`Configure AWS X-Ray to trace AWS Health events and application performance. Use Amazon QuickSight to visualize the correlations between events and metrics. Use Amazon GuardDuty to detect anomalies in the application's behavior and to provide alerts.`, ko:`AWS X-Ray를 구성하여 AWS Health 이벤트 및 애플리케이션 성능을 추적합니다. Amazon QuickSight를 사용하여 이벤트와 메트릭 간의 상관관계를 시각화합니다. Amazon GuardDuty를 사용하여 애플리케이션 동작의 이상 징후를 감지하고 경고를 제공합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p><p>EventBridge는 AWS Health 이벤트를 라우팅하고 아카이빙(이벤트 아카이브 기능)할 수 있습니다. CloudWatch Logs의 메트릭 필터로 Health 이벤트 기반 사용자 지정 메트릭을 생성하고, CloudWatch Synthetics 카나리로 지연 시간 테스트도 가능합니다. CloudWatch 알람으로 Health 이벤트와 성능 지표를 연관시켜 자동 알림을 설정합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CloudTrail은 AWS Health 이벤트 전용 로깅 도구가 아니며, Timestream 연동은 불필요한 복잡성을 더합니다.</p><p><span class="mark-no">❌ C</span> — Health Dashboard에서 SNS 직접 알림 구성은 지원되지 않으며, EventBridge를 거쳐야 합니다.</p><p><span class="mark-no">❌ D</span> — X-Ray는 AWS Health 이벤트 추적 도구가 아니며, GuardDuty는 보안 위협 탐지용입니다.</p>`,
  disc: []

  n: 400,
  en: `A company uses a CI/CD pipeline to deploy its workload in the ap-southeast-2 Region. The company receives images through a Network Load Balancer (NLB) and processes the images in AWS Fargate tasks on an Amazon Elastic Container Service (Amazon ECS) cluster.<br><br>An Amazon Elastic Container Registry (Amazon ECR) repository stores the images as Docker images. The company uses Amazon Route 53 to configure DNS. The company saves the images in an Amazon S3 bucket and saves the metadata from the images in an Amazon DynamoDB table.<br><br>The company wants to expand the workload to a second Region. A DevOps engineer needs to build a highly available and resilient design to expand the workload to the eu-west-2 Region.<br><br>Which combination of steps will meet these requirements with the FEWEST configuration changes? (Choose three.)`,
  ko: `한 회사가 CI/CD 파이프라인을 사용하여 ap-southeast-2 리전에 워크로드를 배포합니다. 회사는 네트워크 로드 밸런서(NLB)를 통해 이미지를 수신하고 Amazon Elastic Container Service(Amazon ECS) 클러스터의 AWS Fargate 태스크에서 이미지를 처리합니다.<br><br>Amazon Elastic Container Registry(Amazon ECR) 리포지토리에는 Docker 이미지가 저장됩니다. 회사는 Amazon Route 53을 사용하여 DNS를 구성합니다. 이미지는 Amazon S3 버킷에 저장하고 이미지의 메타데이터는 Amazon DynamoDB 테이블에 저장합니다.<br><br>이 회사는 워크로드를 두 번째 리전으로 확장하려고 합니다. DevOps 엔지니어는 워크로드를 eu-west-2 리전으로 확장하기 위한 고가용성 및 복원력 있는 설계를 구축해야 합니다.<br><br>최소한의 구성 변경으로 이러한 요구 사항을 충족하는 단계 조합은 무엇입니까? (세 가지를 선택하십시오.)`,

    { k:'B', en:`Configure the DynamoDB table as a global table with a replica in eu-west-2. Configure the Fargate tasks to interact with the DynamoDB table in ap-southeast-2.`, ko:`DynamoDB 테이블을 eu-west-2에 복제본을 가진 글로벌 테이블로 구성합니다. Fargate 태스크가 ap-southeast-2의 DynamoDB 테이블과 상호 작용하도록 구성합니다.` },
    { k:'C', en:`Configure the DynamoDB table as a global table with a replica in eu-west-2. Configure the Fargate tasks to interact with the DynamoDB table in the same Region that the tasks run in.`, ko:`DynamoDB 테이블을 eu-west-2 리전에 복제본을 가진 글로벌 테이블로 구성합니다. Fargate 태스크가 실행되는 리전과 동일한 리전의 DynamoDB 테이블과 상호 작용하도록 구성합니다.` },
    { k:'D', en:`Configure a new S3 bucket in eu-west-2. Configure data replication between the S3 bucket in ap-southeast-2 and the S3 bucket in eu-west-2. Configure the Fargate tasks to use the S3 bucket in the same Region that the tasks run in to perform S3 PUT operations and GET operations.`, ko:`eu-west-2 리전에 새 S3 버킷을 구성합니다. ap-southeast-2 리전의 S3 버킷과 eu-west-2 리전의 S3 버킷 간에 데이터 복제를 구성합니다. Fargate 태스크가 S3 PUT 및 GET 작업을 수행할 때 태스크가 실행되는 리전과 동일한 리전의 S3 버킷을 사용하도록 구성합니다.` },
    { k:'E', en:`Configure an S3 Multi-Region Access Point for the S3 bucket in ap-southeast-2 and a new S3 bucket in eu-west-2. Configure two-way replication on the S3 buckets. Configure the workloads to use the Multi-Region Access Point for S3 PUT operations and GET operations.`, ko:`ap-southeast-2의 S3 버킷과 eu-west-2의 새 S3 버킷에 대해 S3 멀티 리전 액세스 포인트를 구성합니다. S3 버킷에 양방향 복제를 구성합니다. 워크로드가 S3 PUT 및 GET 작업에 멀티 리전 액세스 포인트를 사용하도록 구성합니다.` },
    { k:'F', en:`Configure the CI/CD pipeline to deploy ECR images to both Regions. Configure an NLB in eu-west-2 that resolves to Fargate tasks in an ECS cluster in eu-west-2. Configure a failover routing policy in Route 53 for the two workloads.`, ko:`CI/CD 파이프라인을 구성하여 ECR 이미지를 두 리전 모두에 배포합니다. eu-west-2 리전에 있는 ECS 클러스터의 Fargate 태스크로 연결되는 NLB를 구성합니다. 두 워크로드에 대한 Route 53의 페일오버 라우팅 정책을 구성합니다.` },

  answer: ['A','C','E'],
  vote: '100% ACE',
  explain: `<p><span class="mark-ok">✅ A+C+E — 핵심 이유</span></p><p><strong>A</strong>: ECR 레지스트리 복제로 Docker 이미지를 eu-west-2에 자동 복제하고, NLB+ECS Fargate를 구성하며, Route 53 지연 시간 라우팅으로 사용자를 가장 가까운 리전으로 라우팅합니다.</p><p><strong>C</strong>: DynamoDB 글로벌 테이블로 양 리전에 메타데이터를 복제하고, 각 태스크가 로컬 리전 테이블과 통신하여 지연 시간을 최소화합니다.</p><p><strong>E</strong>: S3 멀티 리전 액세스 포인트는 애플리케이션 코드 변경 없이 단일 엔드포인트로 양 리전 S3에 접근하고, 양방향 복제로 데이터 일관성을 유지합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — eu-west-2 태스크가 ap-southeast-2 DynamoDB에 연결하면 교차 리전 지연이 발생하여 고가용성 설계에 부적합합니다.</p><p><span class="mark-no">❌ D</span> — 별도 버킷+복제 구성은 가능하나, 멀티 리전 액세스 포인트(E) 대비 애플리케이션 코드 변경이 필요합니다.</p><p><span class="mark-no">❌ F</span> — CI/CD 파이프라인을 양 리전에 배포하는 방식은 ECR 복제(A)보다 구성 변경이 많습니다.</p>`,
  disc: []

];
// ────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────
let curQ = 0;
let state = QS.map(() => ({ sel: [], done: false }));
let curLang = 'ko';

// ────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────
function init() {
  buildSelect();
  renderQ(0);
}

function buildSelect() {
  const sel = document.getElementById('q-select');
  sel.innerHTML = '';
  QS.forEach((q, i) => {
    const opt = document.createElement('option');
    opt.value = q.n;
    opt.textContent = `Q${String(q.n).padStart(3,'0')}`;
    sel.appendChild(opt);
  });
}

function updateSelectStatus() {
  const sel = document.getElementById('q-select');
  Array.from(sel.options).forEach((opt, i) => {
    const s = state[i];
    const q = QS[i];
    opt.className = '';
    if (s.done) {
      const correct = arraysEqual(s.sel.slice().sort(), q.answer.slice().sort());
      opt.textContent = `Q${String(q.n).padStart(3,'0')} ${correct ? '✓' : '✗'}`;
      opt.className = correct ? 'opt-correct' : 'opt-wrong';
    } else {
      opt.textContent = `Q${String(q.n).padStart(3,'0')}`;
    }
  });
  sel.value = QS[curQ].n;
}

// ────────────────────────────────────────────────
// RENDER
// ────────────────────────────────────────────────
function renderQ(idx) {
  if (idx < 0 || idx >= QS.length) return;
  curQ = idx;
  const q = QS[idx];
  const s = state[idx];

  // counter / progress
  document.getElementById('progress-fill').style.width = `${((idx+1)/QS.length)*100}%`;
  document.getElementById('q-num-badge').textContent = String(q.n).padStart(3,'0');

  // type badge
  const tb = document.getElementById('q-type-badge');
  if (q.type === 'multi') {
    tb.textContent = `복수 선택 (${q.multiCount}개)`;
    tb.className = 'q-type-badge multi';
  } else {
    tb.textContent = '단일 선택';
    tb.className = 'q-type-badge';
  }

  // question text
  document.getElementById('q-ko-text').innerHTML = q.ko;
  document.getElementById('q-en-text').innerHTML = q.en;

  // choices label
  document.getElementById('choices-label').textContent =
    q.type === 'multi' ? `선택지 — ${q.multiCount}개 선택` : '선택지 — 단일 선택';

  // choices
  const cc = document.getElementById('choices-container');
  cc.innerHTML = '';
  q.choices.forEach(ch => {
    const div = document.createElement('div');
    let cls = 'choice';
    if (s.done) {
      cls += ' disabled';
      if (q.answer.includes(ch.k)) cls += ' correct';
      else if (s.sel.includes(ch.k)) cls += ' wrong';
    } else if (s.sel.includes(ch.k)) {
      cls += ' selected';
    }
    div.className = cls;
    div.id = `choice-${idx}-${ch.k}`;

    let icon = '';
    if (s.done) {
      if (q.answer.includes(ch.k)) icon = '✓';
      else if (s.sel.includes(ch.k)) icon = '✗';
    }

    div.innerHTML = `
      <div class="choice-key">${ch.k}</div>
      <div class="choice-body">
        <div class="choice-text">${ch.ko}</div>
        <div class="choice-en">${ch.en}</div>
      </div>
      <div class="result-icon">${icon}</div>`;

    if (!s.done) div.onclick = () => doSelect(idx, ch.k);
    cc.appendChild(div);
    document.getElementById('btn-prev-top').disabled = idx === 0;
    document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
  });

  applyLang(curLang);

  // review button
  document.getElementById('btn-review').disabled = s.done || s.sel.length === 0;

  // hint
  const hint = document.getElementById('hint-text');
  if (s.done) {
    const correct = arraysEqual(s.sel.slice().sort(), q.answer.slice().sort());
    hint.textContent = correct ? '🎉 정답입니다!' : `❌ 오답입니다. 정답은 ${q.answer.join(', ')} 입니다.`;
  } else if (s.sel.length > 0) {
    const remaining = q.type === 'multi' ? q.multiCount - s.sel.length : 0;
    if (q.type === 'multi' && remaining > 0) {
      hint.textContent = `${s.sel.join(', ')}번 선택됨. ${remaining}개 더 선택하세요.`;
    } else {
      hint.textContent = `${s.sel.join(', ')}번을 선택했습니다. 정답 확인 버튼을 눌러주세요.`;
    }
  } else {
    hint.textContent = '선택지를 클릭하면 정답 확인 버튼이 활성화됩니다.';
  }

  // review panel
  const rp = document.getElementById('review-panel');
  if (s.done) { renderReview(q); rp.classList.add('show'); }
  else rp.classList.remove('show');

  // nav buttons
  document.getElementById('btn-prev-top').disabled = idx === 0;
  document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
  // document.getElementById('nav-info').textContent = `${idx+1} / ${QS.length} 문제`;

  // select 동기화
  updateSelectStatus();
}

function renderReview(q) {
  document.getElementById('review-answer-badge').textContent = '✓ ' + q.answer.join(', ');
  document.getElementById('review-vote-badge').innerHTML = `커뮤니티 투표 <span>${q.vote}</span>`;
  document.getElementById('review-explain').innerHTML = q.explain;

  const ws = document.getElementById('review-wrong');
  const wt = document.getElementById('wrong-section-title');
  if (q.wrong) { ws.innerHTML = q.wrong; ws.style.display=''; wt.style.display=''; }
  else { ws.style.display='none'; wt.style.display='none'; }

  const dl = document.getElementById('disc-list');
  dl.innerHTML = '';
  dl.classList.remove('show');
  (q.disc||[]).forEach(d => {
    dl.innerHTML += `<div class="disc-item"><div class="disc-ans">${d.ans}</div>${d.txt}</div>`;
  });
}

// ────────────────────────────────────────────────
// INTERACTION
// ────────────────────────────────────────────────
function doSelect(idx, key) {
  const q = QS[idx];
  const s = state[idx];
  if (s.done) return;
  if (q.type === 'single') {
    s.sel = [key];
  } else {
    const pos = s.sel.indexOf(key);
    if (pos >= 0) s.sel.splice(pos, 1);
    else if (s.sel.length < q.multiCount) s.sel.push(key);
  }
  renderQ(idx);
}

function doReview() {
  const s = state[curQ];
  if (s.sel.length === 0 || s.done) return;
  s.done = true;
  renderQ(curQ);
  document.getElementById('review-panel').scrollIntoView({behavior:'smooth',block:'start'});
}

function doReset() {
  state[curQ] = { sel: [], done: false };
  renderQ(curQ);
}

function goQ(idx) {
  idx = parseInt(idx);
  if (isNaN(idx) || idx < 0 || idx >= QS.length) return;
  renderQ(idx);
  window.scrollTo({top:0, behavior:'smooth'});
}

function goQWithReset(idx) {
  idx = parseInt(idx);
  if (isNaN(idx) || idx < 0 || idx >= QS.length) return;

  // 🔥 언어 강제 한국어
  curLang = 'ko';
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.lang-tab')[0].classList.add('active');

  // 🔥 해당 문제 상태 초기화
  state[idx] = { sel: [], done: false };

  renderQ(idx);
  window.scrollTo({top:0, behavior:'smooth'});
  document.getElementById('btn-prev-top').disabled = idx === 0;
  document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
}

// ────────────────────────────────────────────────
// LANG  (한국어 / 양국어)
// ────────────────────────────────────────────────
function setLang(lang, btn) {
  curLang = lang;
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  applyLang(lang);
}

function applyLang(lang) {
  // 문제 영어 텍스트 — 'both'일 때 block으로 명시해야 CSS display:none을 덮어씀
  const enQ = document.getElementById('q-en-text');
  enQ.style.display = (lang === 'both') ? 'block' : 'none';
  // 선택지 영어 텍스트
  document.querySelectorAll('.choice-en').forEach(e => {
    e.style.display = (lang === 'both') ? 'block' : 'none';
  });
}

// ────────────────────────────────────────────────
// THEME
// ────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('theme-icon').textContent = dark ? '☀️' : '🌙';
  document.getElementById('theme-label').textContent = dark ? '라이트' : '다크';
}

// ────────────────────────────────────────────────
// UTILS
// ────────────────────────────────────────────────
function arraysEqual(a, b) {
  return a.length === b.length && a.every((v,i) => v === b[i]);
}

init();
</script>
</body>
</html>
