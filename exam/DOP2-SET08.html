    { k:'C', en:`Add a manual approval stage in the CodePipeline pipeline after the ECR push. Require a security engineer to manually review ECR scan results before approving the deployment.`, ko:`ECR 푸시 후 CodePipeline 파이프라인에 수동 승인 스테이지를 추가합니다. 보안 엔지니어가 배포를 승인하기 전에 수동으로 ECR 스캔 결과를 검토하도록 요구합니다.` },
    { k:'D', en:`Configure ECR to run a scan when an image is pushed. Create an AWS Config rule to check that all ECR images have a scan status of <code>COMPLETE</code> with no critical findings before deployment.`, ko:`이미지가 푸시될 때 스캔을 실행하도록 ECR을 구성합니다. 배포 전에 모든 ECR 이미지의 스캔 상태가 중요 결과 없이 <code>COMPLETE</code>인지 확인하는 AWS Config 규칙을 생성합니다.` },
  ],
  answer: ['A'],
  vote: '87% A',
  explain: `<p><span class="mark-ok">✅ A — ECR 스캔 결과 확인 Lambda + 파이프라인 중단</span></p><p>ECR에 이미지 푸시 후 Lambda 함수로 스캔 결과를 프로그래매틱하게 확인하여 중요 취약점이 있으면 파이프라인을 실패시키는 방식이 완전 자동화된 게이트 역할을 합니다. ECR 이미지 스캔이 완료될 때까지 Lambda가 대기한 후 결과를 평가하고 CodePipeline에 성공/실패를 반환합니다. 보안 스캔을 통과한 이미지만 다음 스테이지(배포)로 진행됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — Inspector 결과에 대해 알림만 보내고 배포를 계속 허용하면 보안 스캔 통과 요구 사항을 충족하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — 수동 승인은 자동화 요구 사항에 맞지 않고 운영 오버헤드가 높습니다.</p>
<p><span class="mark-no">❌ D</span> — AWS Config는 규정 준수 감사 도구로 파이프라인 게이트 역할을 하기 어렵습니다.</p>`,
  disc: [{ ans:'A (87%)', txt:'ECR 스캔 결과를 확인하는 Lambda가 파이프라인 게이트 역할을 하여 취약한 이미지의 프로덕션 배포를 자동 차단' }]
},
{
  n: 372,
  en: `A company manages a large number of AWS Lambda functions. The company wants to standardize logging across all Lambda functions to send structured logs to Amazon CloudWatch Logs. The company also wants to ensure that all new Lambda functions automatically use this logging configuration without requiring developers to add logging code to each function.<br>Which solution will meet these requirements with the LEAST development effort?`,
  ko: `회사는 많은 수의 AWS Lambda 함수를 관리합니다. 회사는 모든 Lambda 함수에서 구조화된 로그를 Amazon CloudWatch Logs로 보내도록 로깅을 표준화하려고 합니다. 또한 개발자가 각 함수에 로깅 코드를 추가할 필요 없이 모든 새 Lambda 함수가 자동으로 이 로깅 구성을 사용하도록 해야 합니다.<br>최소한의 개발 노력으로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an AWS Lambda layer that contains a shared logging library. Attach the layer to all Lambda functions. Update all Lambda function code to import and use the shared logging library.`, ko:`공유 로깅 라이브러리가 포함된 AWS Lambda 레이어를 생성합니다. 모든 Lambda 함수에 레이어를 연결합니다. 공유 로깅 라이브러리를 가져와 사용하도록 모든 Lambda 함수 코드를 업데이트합니다.` },
    { k:'B', en:`Configure Lambda function URLs for all Lambda functions. Create an API Gateway that adds structured logging headers to all Lambda invocation requests. Configure CloudWatch Logs to parse the structured headers.`, ko:`모든 Lambda 함수에 대한 Lambda 함수 URL을 구성합니다. 모든 Lambda 호출 요청에 구조화된 로깅 헤더를 추가하는 API Gateway를 생성합니다. 구조화된 헤더를 구문 분석하도록 CloudWatch Logs를 구성합니다.` },
    { k:'C', en:`Enable AWS Lambda Advanced Logging Controls (ALC) for all Lambda functions. Configure the log format to JSON and set the log level to the desired level. Use CloudWatch Log Insights to query the structured JSON logs.`, ko:`모든 Lambda 함수에 대해 AWS Lambda 고급 로깅 컨트롤(ALC)을 활성화합니다. 로그 형식을 JSON으로 구성하고 로그 수준을 원하는 수준으로 설정합니다. 구조화된 JSON 로그를 쿼리하기 위해 CloudWatch Log Insights를 사용합니다.` },
    { k:'D', en:`Create an AWS CloudFormation template that includes logging configuration for Lambda functions. Require all developers to use this template when creating new Lambda functions. Add a pipeline validation step to verify the template is used.`, ko:`Lambda 함수에 대한 로깅 구성이 포함된 AWS CloudFormation 템플릿을 생성합니다. 모든 개발자가 새 Lambda 함수를 생성할 때 이 템플릿을 사용하도록 요구합니다. 템플릿이 사용되는지 확인하는 파이프라인 유효성 검사 단계를 추가합니다.` },
  ],
  answer: ['C'],
  vote: '84% C',
  explain: `<p><span class="mark-ok">✅ C — Lambda 고급 로깅 컨트롤(ALC)</span></p><p>AWS Lambda 고급 로깅 컨트롤(Advanced Logging Controls)은 Lambda 함수 수준에서 로그 형식(JSON/Text)과 로그 수준(DEBUG/INFO/WARN/ERROR/FATAL/TRACE)을 설정할 수 있는 기능입니다. JSON 형식으로 설정하면 코드 변경 없이 구조화된 로그가 자동으로 CloudWatch Logs로 전송됩니다. AWS Organizations 서비스 제어 정책(SCP)이나 AWS Config 규칙으로 이 설정을 강제할 수 있어 새 함수에도 자동 적용 가능합니다. 개발자가 코드를 수정할 필요가 없습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 레이어를 연결하더라도 각 함수의 코드를 수정해야 하므로 개발 노력이 필요합니다.</p>
<p><span class="mark-no">❌ B</span> — API Gateway 접근 방식은 Lambda 함수 URL과의 조합이 복잡하고 요구 사항과 맞지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — CloudFormation 템플릿 사용 강제는 거버넌스 측면에서 좋지만, 개발자 교육과 파이프라인 검증이 필요하여 오버헤드가 높습니다.</p>`,
  disc: [{ ans:'C (84%)', txt:'Lambda ALC는 코드 변경 없이 함수 설정만으로 구조화된 JSON 로깅을 표준화하는 가장 낮은 개발 노력 솔루션' }]
},
{
  n: 373,
  en: `A company has a multi-account AWS environment managed through AWS Organizations. The company's security team needs to audit all AWS API calls made across all accounts. The security team needs to store the audit logs centrally and ensure the logs cannot be deleted or modified by account administrators.<br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `회사는 AWS Organizations를 통해 관리되는 멀티 계정 AWS 환경을 보유하고 있습니다. 회사의 보안 팀은 모든 계정에서 수행된 모든 AWS API 호출을 감사해야 합니다. 보안 팀은 감사 로그를 중앙에 저장하고 계정 관리자가 로그를 삭제하거나 수정할 수 없도록 해야 합니다.<br>이 요구 사항을 충족하는 단계 조합은 무엇입니까? (두 가지 선택)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Create an AWS CloudTrail organization trail in the management account. Configure the trail to log events from all accounts in the organization. Store the logs in an Amazon S3 bucket in a dedicated security account.`, ko:`관리 계정에서 AWS CloudTrail 조직 트레일을 생성합니다. 조직의 모든 계정에서 이벤트를 기록하도록 트레일을 구성합니다. 전용 보안 계정의 Amazon S3 버킷에 로그를 저장합니다.` },
    { k:'B', en:`Enable AWS Config in all member accounts. Configure Config to deliver configuration changes to a central S3 bucket. Enable multi-region recording for all accounts.`, ko:`모든 멤버 계정에서 AWS Config를 활성화합니다. 구성 변경 사항을 중앙 S3 버킷에 전달하도록 Config를 구성합니다. 모든 계정에 대해 다중 리전 기록을 활성화합니다.` },
    { k:'C', en:`Configure the S3 bucket that stores the CloudTrail logs with a bucket policy that denies <code>s3:DeleteObject</code> and <code>s3:PutObject</code> permissions to all principals except the CloudTrail service. Enable S3 Object Lock on the bucket.`, ko:`CloudTrail 로그를 저장하는 S3 버킷에 CloudTrail 서비스를 제외한 모든 보안 주체의 <code>s3:DeleteObject</code> 및 <code>s3:PutObject</code> 권한을 거부하는 버킷 정책을 구성합니다. 버킷에서 S3 객체 잠금을 활성화합니다.` },
    { k:'D', en:`Enable AWS CloudTrail log file validation for all trails. Store validation digests in a separate S3 bucket accessible only to the security team.`, ko:`모든 트레일에 대해 AWS CloudTrail 로그 파일 검증을 활성화합니다. 보안 팀만 액세스할 수 있는 별도의 S3 버킷에 검증 다이제스트를 저장합니다.` },
    { k:'E', en:`Create an AWS Config rule to detect when CloudTrail logging is disabled. Configure automatic remediation to re-enable CloudTrail when it is disabled.`, ko:`CloudTrail 로깅이 비활성화될 때 감지하는 AWS Config 규칙을 생성합니다. 비활성화될 때 CloudTrail을 다시 활성화하도록 자동 수정을 구성합니다.` },
  ],
  answer: ['A','C'],
  vote: '88% AC',
  explain: `<p><span class="mark-ok">✅ A — CloudTrail 조직 트레일 + 전용 보안 계정 S3</span></p><p>조직 트레일은 관리 계정에서 한 번만 설정하면 조직의 모든 현재 및 미래 계정의 API 호출을 자동으로 기록합니다. 로그를 전용 보안 계정의 S3 버킷에 저장하면 멤버 계정 관리자가 접근할 수 없습니다.</p>
<p><span class="mark-ok">✅ C — S3 버킷 정책 + S3 객체 잠금</span></p><p>버킷 정책으로 CloudTrail 서비스 외 모든 보안 주체의 삭제/수정을 거부하고, S3 객체 잠금(Object Lock)으로 WORM(Write Once Read Many) 정책을 적용하면 로그 불변성을 보장합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — AWS Config는 API 감사가 아닌 리소스 구성 변경 추적에 사용됩니다.</p>
<p><span class="mark-no">❌ D</span> — 로그 파일 검증은 무결성 확인에는 유용하지만 삭제/수정을 방지하지는 않습니다.</p>
<p><span class="mark-no">❌ E</span> — CloudTrail 재활성화 자동화는 보조 수단이지 로그 보호의 핵심이 아닙니다.</p>`,
  disc: [{ ans:'AC (88%)', txt:'조직 트레일로 중앙 집중 수집, 보안 계정 S3 + 버킷 정책 + 객체 잠금으로 로그 불변성 보장' }]
},
{
  n: 374,
  en: `A company has an application deployed across multiple AWS Regions. The company uses AWS Route 53 for DNS routing. The company wants to implement a disaster recovery (DR) strategy that automatically fails over to a secondary Region when the primary Region becomes unavailable. The company needs the failover to happen automatically without manual intervention and requires the RTO to be less than 5 minutes.<br>Which solution will meet these requirements?`,
  ko: `회사는 여러 AWS 리전에 걸쳐 애플리케이션을 배포했습니다. 회사는 DNS 라우팅에 AWS Route 53을 사용합니다. 회사는 기본 리전을 사용할 수 없게 될 때 자동으로 보조 리전으로 장애 조치하는 재해 복구(DR) 전략을 구현하려고 합니다. 장애 조치는 수동 개입 없이 자동으로 발생해야 하며 RTO가 5분 미만이어야 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure Route 53 health checks for the primary Region endpoints. Set up an Active-Passive failover routing policy in Route 53. Configure the health check to evaluate the primary Region's availability every 10 seconds. When the primary endpoint fails, Route 53 automatically routes traffic to the secondary Region.`, ko:`기본 리전 엔드포인트에 대한 Route 53 상태 확인을 구성합니다. Route 53에서 액티브-패시브 장애 조치 라우팅 정책을 설정합니다. 10초마다 기본 리전의 가용성을 평가하도록 상태 확인을 구성합니다. 기본 엔드포인트가 실패하면 Route 53이 자동으로 트래픽을 보조 리전으로 라우팅합니다.` },
    { k:'B', en:`Set up AWS Global Accelerator with both Regions as endpoint groups. Configure health checks on Global Accelerator to detect primary Region failures. When the primary Region fails, Global Accelerator automatically routes traffic to the secondary Region within seconds.`, ko:`두 리전을 엔드포인트 그룹으로 사용하여 AWS Global Accelerator를 설정합니다. Global Accelerator에서 기본 리전 오류를 감지하도록 상태 확인을 구성합니다. 기본 리전이 오류가 발생하면 Global Accelerator가 몇 초 내에 자동으로 트래픽을 보조 리전으로 라우팅합니다.` },
    { k:'C', en:`Create an Amazon EventBridge rule that detects CloudWatch alarms for the primary Region. Configure the rule to invoke an AWS Lambda function that updates Route 53 DNS records to point to the secondary Region when the primary fails.`, ko:`기본 리전에 대한 CloudWatch 경보를 감지하는 Amazon EventBridge 규칙을 생성합니다. 기본 리전이 오류가 발생할 때 Route 53 DNS 레코드를 보조 리전으로 업데이트하는 AWS Lambda 함수를 호출하도록 규칙을 구성합니다.` },
    { k:'D', en:`Use AWS CloudFormation StackSets to deploy the application in both Regions. Configure an AWS Systems Manager runbook to manually trigger failover when the primary Region fails. Set the RTO target in the runbook to 5 minutes.`, ko:`AWS CloudFormation StackSets를 사용하여 두 리전 모두에 애플리케이션을 배포합니다. 기본 리전이 오류가 발생할 때 수동으로 장애 조치를 트리거하는 AWS Systems Manager 런북을 구성합니다. 런북에서 RTO 목표를 5분으로 설정합니다.` },
  ],
  answer: ['A'],
  vote: '78% A',
  explain: `<p><span class="mark-ok">✅ A — Route 53 상태 확인 + 액티브-패시브 장애 조치</span></p><p>Route 53의 상태 확인(Health Check)을 10초 간격으로 구성하면 기본 리전이 사용 불가능해질 때 빠르게 감지합니다. Route 53의 장애 조치 라우팅 정책(Active-Passive)은 기본 엔드포인트 상태 확인 실패 시 자동으로 보조 리전으로 DNS를 전환합니다. Route 53의 최소 TTL 설정과 함께 5분 이내 RTO 달성이 가능합니다. 완전 자동화되어 수동 개입이 필요 없습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — AWS Global Accelerator도 유효한 솔루션이지만, Route 53 상태 확인이 이미 요구 사항(5분 RTO, 자동 장애 조치)을 충족하며 비용이 더 낮습니다.</p>
<p><span class="mark-no">❌ C</span> — EventBridge + Lambda + Route 53 업데이트 조합은 추가 구성과 Lambda 실행 지연이 있어 5분 RTO를 보장하기 어렵습니다.</p>
<p><span class="mark-no">❌ D</span> — 수동 런북은 "수동 개입 없이" 요구 사항에 위배됩니다.</p>`,
  disc: [{ ans:'A (78%)', txt:'Route 53 상태 확인 + 장애 조치 라우팅 정책은 DNS 기반 자동 장애 조치의 표준 솔루션으로 5분 이내 RTO 달성 가능' }]
},
{
  n: 375,
  en: `A company needs to migrate its on-premises Microsoft SQL Server databases to AWS. The company wants to replicate the databases to AWS with minimal downtime during the migration. The company also wants to continue running the application while the migration is in progress.<br>Which solution will meet these requirements?`,
  ko: `회사는 온프레미스 Microsoft SQL Server 데이터베이스를 AWS로 마이그레이션해야 합니다. 회사는 마이그레이션 중 최소한의 다운타임으로 데이터베이스를 AWS에 복제하려고 합니다. 또한 마이그레이션이 진행되는 동안 애플리케이션을 계속 실행하려고 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use AWS Database Migration Service (AWS DMS) with a full load and change data capture (CDC) configuration. Create a replication instance and tasks to migrate the databases to Amazon RDS for SQL Server. Cut over to the new database when replication has caught up.`, ko:`전체 로드 및 변경 데이터 캡처(CDC) 구성으로 AWS Database Migration Service(AWS DMS)를 사용합니다. 복제 인스턴스와 태스크를 생성하여 데이터베이스를 Amazon RDS for SQL Server로 마이그레이션합니다. 복제가 따라잡으면 새 데이터베이스로 전환합니다.` },
    { k:'B', en:`Take a full backup of the on-premises SQL Server databases. Restore the backup to Amazon RDS for SQL Server. Update the application connection strings to point to the new RDS instance.`, ko:`온프레미스 SQL Server 데이터베이스의 전체 백업을 수행합니다. Amazon RDS for SQL Server에 백업을 복원합니다. 새 RDS 인스턴스를 가리키도록 애플리케이션 연결 문자열을 업데이트합니다.` },
    { k:'C', en:`Set up SQL Server log shipping from the on-premises database to Amazon RDS for SQL Server. Monitor the log shipping status and cut over when the logs are synchronized.`, ko:`온프레미스 데이터베이스에서 Amazon RDS for SQL Server로 SQL Server 로그 전달을 설정합니다. 로그 전달 상태를 모니터링하고 로그가 동기화되면 전환합니다.` },
    { k:'D', en:`Use AWS Server Migration Service (AWS SMS) to replicate the on-premises SQL Server to an Amazon EC2 instance. After replication is complete, upgrade the SQL Server edition if needed.`, ko:`AWS Server Migration Service(AWS SMS)를 사용하여 온프레미스 SQL Server를 Amazon EC2 인스턴스로 복제합니다. 복제가 완료된 후 필요한 경우 SQL Server 에디션을 업그레이드합니다.` },
  ],
  answer: ['A'],
  vote: '90% A',
  explain: `<p><span class="mark-ok">✅ A — AWS DMS 전체 로드 + CDC</span></p><p>AWS DMS(Database Migration Service)는 지속적 데이터 복제(CDC - Change Data Capture)를 지원하여 마이그레이션 중에도 소스 데이터베이스에서 발생하는 변경 사항을 실시간으로 대상으로 전달합니다. 전체 로드로 초기 데이터를 마이그레이션하고, CDC로 지속적으로 변경 사항을 동기화합니다. 애플리케이션이 계속 온프레미스 데이터베이스를 사용하면서 복제가 진행되며, 복제가 따라잡으면 짧은 다운타임으로 전환이 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 전체 백업 및 복원은 백업과 복원 사이의 데이터 변경 사항을 잃어버려 다운타임이 발생합니다.</p>
<p><span class="mark-no">❌ C</span> — SQL Server 로그 전달은 가능하지만 RDS for SQL Server에서 기본 지원이 제한적이며 DMS보다 복잡합니다.</p>
<p><span class="mark-no">❌ D</span> — AWS SMS는 VM 기반 서버 마이그레이션용이며 데이터베이스 마이그레이션에 특화된 도구가 아닙니다.</p>`,
  disc: [{ ans:'A (90%)', txt:'DMS CDC로 마이그레이션 중 애플리케이션 지속 운영을 보장하고 최소 다운타임으로 전환하는 AWS 표준 데이터베이스 마이그레이션 방법' }]
},
{
  n: 376,
  en: `A company uses Amazon Kinesis Data Streams to ingest real-time data. An AWS Lambda function processes records from the stream and writes results to Amazon DynamoDB. The Lambda function is experiencing throttling errors because DynamoDB write capacity is insufficient. A DevOps engineer needs to resolve the throttling while minimizing cost and maintaining real-time processing.<br>Which solution will meet these requirements?`,
  ko: `회사는 Amazon Kinesis Data Streams를 사용하여 실시간 데이터를 수집합니다. AWS Lambda 함수는 스트림에서 레코드를 처리하고 결과를 Amazon DynamoDB에 씁니다. Lambda 함수는 DynamoDB 쓰기 용량이 부족하여 제한 오류를 겪고 있습니다. DevOps 엔지니어는 비용을 최소화하면서 실시간 처리를 유지하며 제한을 해결해야 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Increase the DynamoDB table's provisioned write capacity units (WCU) to handle peak loads. Monitor the consumed capacity with CloudWatch and adjust the WCU manually based on demand.`, ko:`최대 부하를 처리하기 위해 DynamoDB 테이블의 프로비저닝된 쓰기 용량 단위(WCU)를 늘립니다. CloudWatch로 소비된 용량을 모니터링하고 수요에 따라 수동으로 WCU를 조정합니다.` },
    { k:'B', en:`Switch the DynamoDB table to on-demand capacity mode. On-demand mode automatically scales to accommodate varying workload demands without throttling.`, ko:`DynamoDB 테이블을 온디맨드 용량 모드로 전환합니다. 온디맨드 모드는 제한 없이 다양한 워크로드 요구에 맞게 자동으로 확장됩니다.` },
    { k:'C', en:`Enable DynamoDB auto scaling on the table with a target utilization of 70%. Configure the auto scaling policy to scale up when write throttle events are detected.`, ko:`대상 사용률 70%로 테이블에서 DynamoDB 자동 조정을 활성화합니다. 쓰기 제한 이벤트가 감지될 때 확장하도록 자동 조정 정책을 구성합니다.` },
    { k:'D', en:`Add an Amazon SQS queue between the Lambda function and DynamoDB. Configure the Lambda function to send records to the SQS queue. Create a second Lambda function that reads from the SQS queue and writes to DynamoDB at a controlled rate.`, ko:`Lambda 함수와 DynamoDB 사이에 Amazon SQS 큐를 추가합니다. 레코드를 SQS 큐로 보내도록 Lambda 함수를 구성합니다. SQS 큐에서 읽고 제어된 속도로 DynamoDB에 쓰는 두 번째 Lambda 함수를 생성합니다.` },
  ],
  answer: ['B'],
  vote: '72% B',
  explain: `<p><span class="mark-ok">✅ B — DynamoDB 온디맨드 모드</span></p><p>DynamoDB 온디맨드 용량 모드는 트래픽 패턴에 자동으로 적응하여 제한(throttling) 없이 워크로드를 처리합니다. 프로비저닝된 용량을 수동으로 관리할 필요가 없으며, 실제 사용량에 따라 요금이 부과됩니다. 실시간 처리를 유지하면서 피크 트래픽도 제한 없이 처리 가능합니다. 비용 관점에서 항상 최고 용량을 프로비저닝하는 것보다 실제 사용량 기반 온디맨드가 더 효율적입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 수동 WCU 조정은 운영 오버헤드가 높고 과프로비저닝으로 비용이 높아질 수 있습니다.</p>
<p><span class="mark-no">❌ C</span> — Auto Scaling은 응답에 수 분이 걸려 급격한 트래픽 급증 시 여전히 제한이 발생할 수 있습니다.</p>
<p><span class="mark-no">❌ D</span> — SQS 버퍼링은 실시간 처리 요구 사항(Kinesis → Lambda → DynamoDB)에 추가 지연을 도입합니다.</p>`,
  disc: [{ ans:'B (72%)', txt:'온디맨드 모드는 자동 용량 관리로 제한을 완전 제거하고 실제 사용량 기반 과금으로 비용 효율적' }]
},
{
  n: 377,
  en: `A company wants to monitor its AWS infrastructure for security threats in real time. The company needs to detect unauthorized API calls, potentially compromised instances, and reconnaissance activities. The company wants to receive automated alerts when threats are detected.<br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `회사는 AWS 인프라에서 보안 위협을 실시간으로 모니터링하려고 합니다. 회사는 무단 API 호출, 잠재적으로 손상된 인스턴스, 정찰 활동을 감지해야 합니다. 회사는 위협이 감지될 때 자동화된 경보를 받기를 원합니다.<br>최소한의 운영 오버헤드로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Enable Amazon GuardDuty in all AWS accounts. Configure an Amazon EventBridge rule to detect GuardDuty findings. Configure the rule to send notifications to an Amazon SNS topic when high-severity findings are detected.`, ko:`모든 AWS 계정에서 Amazon GuardDuty를 활성화합니다. GuardDuty 결과를 감지하는 Amazon EventBridge 규칙을 구성합니다. 높은 심각도 결과가 감지되면 Amazon SNS 토픽에 알림을 보내도록 규칙을 구성합니다.` },
    { k:'B', en:`Enable AWS CloudTrail in all accounts. Create custom CloudWatch Logs metric filters to detect specific API call patterns. Create CloudWatch alarms based on the metric filters to alert on suspicious activity.`, ko:`모든 계정에서 AWS CloudTrail을 활성화합니다. 특정 API 호출 패턴을 감지하는 사용자 지정 CloudWatch Logs 지표 필터를 생성합니다. 의심스러운 활동에 대해 경보를 보내기 위해 지표 필터를 기반으로 CloudWatch 경보를 생성합니다.` },
    { k:'C', en:`Deploy an AWS Security Hub in all accounts. Configure Security Hub to aggregate findings from all accounts. Create custom Security Hub insights to identify security threats and send notifications.`, ko:`모든 계정에서 AWS Security Hub를 배포합니다. 모든 계정의 결과를 집계하도록 Security Hub를 구성합니다. 보안 위협을 식별하고 알림을 보내는 사용자 지정 Security Hub 인사이트를 생성합니다.` },
    { k:'D', en:`Enable Amazon Macie for all S3 buckets. Configure VPC Flow Logs for all VPCs. Create custom scripts to analyze the logs and detect security threats. Set up SNS notifications when threats are found.`, ko:`모든 S3 버킷에 대해 Amazon Macie를 활성화합니다. 모든 VPC에 대해 VPC Flow Logs를 구성합니다. 로그를 분석하고 보안 위협을 감지하는 사용자 지정 스크립트를 생성합니다. 위협이 발견되면 SNS 알림을 설정합니다.` },
  ],
  answer: ['A'],
  vote: '93% A',
  explain: `<p><span class="mark-ok">✅ A — Amazon GuardDuty + EventBridge + SNS</span></p><p>Amazon GuardDuty는 AWS 계정, 워크로드, 데이터를 지속적으로 모니터링하는 완전 관리형 위협 감지 서비스입니다. CloudTrail 이벤트, VPC Flow Logs, DNS 로그를 분석하여 무단 API 호출, 손상된 인스턴스, 정찰 활동 등을 자동으로 감지합니다. 추가 로그 수집이나 복잡한 규칙 작성 없이 활성화만으로 작동합니다. EventBridge로 결과를 필터링하고 SNS로 알림을 발송하는 완전 자동화된 솔루션입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — CloudTrail + 사용자 지정 메트릭 필터는 GuardDuty보다 복잡하고 위협 감지 능력이 제한적입니다.</p>
<p><span class="mark-no">❌ C</span> — Security Hub는 GuardDuty 등 다른 서비스의 결과를 집계하는 도구로, 자체적인 위협 감지 기능이 GuardDuty만큼 강력하지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — Macie는 S3 데이터 보안에 특화되어 있으며, 사용자 지정 스크립트는 운영 오버헤드가 높습니다.</p>`,
  disc: [{ ans:'A (93%)', txt:'GuardDuty는 ML 기반 위협 감지로 무단 API 호출/손상된 인스턴스/정찰 활동 모두를 자동 탐지하는 완전 관리형 솔루션' }]
},
{
  n: 378,
  en: `A company is developing a microservices-based application on AWS. The application consists of AWS Lambda functions and Amazon Elastic Container Service (Amazon ECS) services that need to be deployed frequently. A DevOps engineer needs to implement a consistent deployment solution across all components of the application. The solution must automate the deployments, minimize downtime during updates, and manage configuration data for the application.<br>Which solution will meet these requirements with the LEAST development effort?`,
  ko: `회사는 AWS에서 마이크로서비스 기반 애플리케이션을 개발하고 있습니다. 애플리케이션은 자주 배포해야 하는 AWS Lambda 함수와 Amazon Elastic Container Service(Amazon ECS) 서비스로 구성됩니다. DevOps 엔지니어는 애플리케이션의 모든 컴포넌트에 걸쳐 일관된 배포 솔루션을 구현해야 합니다. 솔루션은 배포를 자동화하고, 업데이트 중 다운타임을 최소화하며, 애플리케이션의 구성 데이터를 관리해야 합니다.<br>최소한의 개발 노력으로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use AWS CloudFormation to define and provision the Lambda functions and ECS services. Implement stack updates with resource replacement for all components. Use AWS Secrets Manager to manage the configuration data.`, ko:`AWS CloudFormation을 사용하여 Lambda 함수와 ECS 서비스를 정의하고 프로비저닝합니다. 모든 컴포넌트에 대한 리소스 교체로 스택 업데이트를 구현합니다. 구성 데이터를 관리하기 위해 AWS Secrets Manager를 사용합니다.` },
    { k:'B', en:`Use AWS CodeDeploy to manage deployments for the Lambda functions and ECS services. Implement canary deployments for the Lambda functions. Implement blue/green deployments for the ECS services. Use AWS Systems Manager Parameter Store to manage configuration data.`, ko:`Lambda 함수와 ECS 서비스 배포를 관리하기 위해 AWS CodeDeploy를 사용합니다. Lambda 함수에 대한 카나리 배포를 구현합니다. ECS 서비스에 대한 블루/그린 배포를 구현합니다. 구성 데이터를 관리하기 위해 AWS Systems Manager Parameter Store를 사용합니다.` },
    { k:'C', en:`Use AWS Elastic Beanstalk to deploy and manage all application components. Configure rolling updates for Lambda functions and ECS services. Use Elastic Beanstalk environment variables to manage configuration data.`, ko:`모든 애플리케이션 컴포넌트를 배포하고 관리하기 위해 AWS Elastic Beanstalk를 사용합니다. Lambda 함수와 ECS 서비스에 대한 롤링 업데이트를 구성합니다. 구성 데이터를 관리하기 위해 Elastic Beanstalk 환경 변수를 사용합니다.` },
    { k:'D', en:`Use AWS Systems Manager to manage deployments for the Lambda functions and ECS services. Implement all-at-once deployments for the Lambda functions. Implement rolling updates for the ECS services. Use AWS Secrets Manager to manage the configuration data.`, ko:`Lambda 함수와 ECS 서비스 배포를 관리하기 위해 AWS Systems Manager를 사용합니다. Lambda 함수에 대한 한 번에 모두 배포를 구현합니다. ECS 서비스에 대한 롤링 업데이트를 구현합니다. 구성 데이터를 관리하기 위해 AWS Secrets Manager를 사용합니다.` },
  ],
  answer: ['B'],
  vote: '85% B',
  explain: `<p><span class="mark-ok">✅ B — AWS CodeDeploy (Lambda 카나리 + ECS 블루/그린) + Parameter Store</span></p><p>AWS CodeDeploy는 Lambda 함수와 ECS 서비스 모두에 대한 배포를 네이티브로 지원합니다. Lambda는 카나리(Canary) 또는 리니어(Linear) 배포로 점진적 트래픽 전환이 가능하며, ECS는 블루/그린 배포로 다운타임 없이 업데이트됩니다. Parameter Store는 애플리케이션 구성 데이터 관리에 적합한 완전 관리형 서비스입니다. 이 조합이 세 요구 사항(자동화, 최소 다운타임, 구성 관리)을 가장 적은 개발 노력으로 충족합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CloudFormation 스택 업데이트에서 리소스 교체는 다운타임을 발생시킬 수 있습니다.</p>
<p><span class="mark-no">❌ C</span> — Elastic Beanstalk는 Lambda를 직접 지원하지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — Systems Manager는 EC2 중심 도구로 Lambda/ECS 배포에 CodeDeploy만큼 특화되어 있지 않습니다. All-at-once는 다운타임 최소화 요구 사항에 맞지 않습니다.</p>`,
  disc: [{ ans:'B (85%)', txt:'CodeDeploy는 Lambda와 ECS 양쪽 배포를 네이티브 지원, 카나리/블루그린으로 무중단 배포 구현이 가장 적은 개발 노력' }]
},
{
  n: 379,
  en: `A company is implementing a CI/CD pipeline for an application by using AWS CodePipeline and AWS CodeBuild. The company needs a solution to run unit tests and automatically generate code coverage reports before any code is deployed to production. The CI/CD pipeline execution must fail if the code coverage is less than 80%.<br>Which solution will meet these requirements?`,
  ko: `회사는 AWS CodePipeline 및 AWS CodeBuild를 사용하여 애플리케이션을 위한 CI/CD 파이프라인을 구현하고 있습니다. 회사는 코드가 프로덕션에 배포되기 전에 단위 테스트를 실행하고 코드 커버리지 보고서를 자동으로 생성하는 솔루션이 필요합니다. 코드 커버리지가 80% 미만이면 CI/CD 파이프라인 실행이 실패해야 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  ko: `회사는 AWS CodePipeline 및 AWS CodeBuild를 사용하여 애플리케이션을 위한 CI/CD 파이프라인을 구현하고 있습니다. 회사는 코드가 프로덕션에 배포되기 전에 단위 테스트를 실행하고 코드 커버리지 보고서를 자동으로 생성하는 솔루션이 필요합니다. 코드 커버리지가 80% 미만이면 CI/CD 파이프라인 실행이 실패해야 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create an AWS Lambda function to run unit tests and generate code coverage reports. Add a Lambda invoke action to a stage in the CodePipeline pipeline. Create an Amazon EventBridge scheduled rule to run hourly to monitor the Lambda function's output. Configure the rule to fail the pipeline if coverage is less than 80%.`, ko:`단위 테스트를 실행하고 코드 커버리지 보고서를 생성하는 AWS Lambda 함수를 생성합니다. CodePipeline 파이프라인의 스테이지에 Lambda 호출 액션을 추가합니다. Lambda 함수의 출력을 매시간 모니터링하는 Amazon EventBridge 예약 규칙을 생성합니다. 커버리지가 80% 미만이면 파이프라인을 실패하도록 규칙을 구성합니다.` },
    { k:'B', en:`Create an AWS Step Functions workflow to run unit tests and generate code coverage reports. Add a Step Functions test action to a stage in the CodePipeline pipeline to invoke the workflow. Configure the workflow to fail the pipeline execution if coverage is less than 80%.`, ko:`단위 테스트를 실행하고 코드 커버리지 보고서를 생성하는 AWS Step Functions 워크플로우를 생성합니다. 워크플로우를 호출하기 위해 CodePipeline 파이프라인의 스테이지에 Step Functions 테스트 액션을 추가합니다. 커버리지가 80% 미만이면 파이프라인 실행을 실패하도록 워크플로우를 구성합니다.` },
    { k:'C', en:`Create a CodeBuild project with a <code>buildspec.yml</code> file that includes commands to run unit tests and generate code coverage reports. Add a CodeBuild test action to a stage in the CodePipeline pipeline. Configure the CodeBuild test action to use the source artifacts from the source action as input. Modify the <code>buildspec.yml</code> file to fail the build if coverage is less than 80%.`, ko:`단위 테스트를 실행하고 코드 커버리지 보고서를 생성하는 명령을 포함하는 <code>buildspec.yml</code> 파일로 CodeBuild 프로젝트를 생성합니다. CodePipeline 파이프라인의 스테이지에 CodeBuild 테스트 액션을 추가합니다. 소스 액션의 소스 아티팩트를 입력으로 사용하도록 CodeBuild 테스트 액션을 구성합니다. 커버리지가 80% 미만이면 빌드를 실패하도록 <code>buildspec.yml</code> 파일을 수정합니다.` },
    { k:'D', en:`Create a CodeBuild project with Jenkins installed. Configure Jenkins to run unit tests and generate code coverage reports. Add a Jenkins test action to a stage in the CodePipeline pipeline. Configure the Jenkins test action to output the coverage report as an output artifact. Configure an approval action to fail the pipeline if code coverage is less than 80%.`, ko:`Jenkins가 설치된 CodeBuild 프로젝트를 생성합니다. 단위 테스트를 실행하고 코드 커버리지 보고서를 생성하도록 Jenkins를 구성합니다. CodePipeline 파이프라인의 스테이지에 Jenkins 테스트 액션을 추가합니다. 커버리지 보고서를 출력 아티팩트로 출력하도록 Jenkins 테스트 액션을 구성합니다. 코드 커버리지가 80% 미만이면 파이프라인을 실패하도록 승인 액션을 구성합니다.` },
  ],
  answer: ['C'],
  vote: '92% C',
  explain: `<p><span class="mark-ok">✅ C — CodeBuild + buildspec.yml 커버리지 임계값 검사</span></p><p>AWS CodeBuild는 단위 테스트 실행과 코드 커버리지 보고서 생성에 최적화된 완전 관리형 빌드 서비스입니다. <code>buildspec.yml</code>에서 테스트 실행 후 커버리지 값을 확인하여 80% 미만이면 빌드를 실패(exit 1)시킵니다. CodeBuild 액션이 실패하면 CodePipeline 파이프라인도 자동으로 중단됩니다. CodeBuild는 테스트 보고서(Test Reports) 기능으로 커버리지 결과를 AWS 콘솔에서 시각화할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — EventBridge 예약 규칙으로 파이프라인 실행을 제어하는 방식은 복잡하고 실시간 파이프라인 제어에 적합하지 않습니다.</p>
<p><span class="mark-no">❌ B</span> — Step Functions는 이 목적에 불필요하게 복잡합니다.</p>
<p><span class="mark-no">❌ D</span> — Jenkins는 추가 관리가 필요하며 AWS 네이티브 CodeBuild보다 오버헤드가 높습니다.</p>`,
  disc: [{ ans:'C (92%)', txt:'CodeBuild buildspec.yml에서 커버리지 임계값 검사 및 빌드 실패 처리가 CodePipeline과 완벽히 통합되는 표준 패턴' }]
},
{
  n: 380,
  en: `A company runs a web application that receives varying traffic throughout the day. The application runs on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. The company wants to reduce costs by scaling down instances during low-traffic periods at night and scaling up before the expected morning traffic surge. The company has historical data showing traffic patterns are predictable.<br>Which solution will meet these requirements MOST cost-effectively?`,
  ko: `회사는 하루 종일 다양한 트래픽을 받는 웹 애플리케이션을 운영합니다. 애플리케이션은 Application Load Balancer 뒤의 Auto Scaling 그룹에 있는 Amazon EC2 인스턴스에서 실행됩니다. 회사는 밤 시간대 트래픽이 낮은 기간에 인스턴스를 축소하고 아침 예상 트래픽 급증 전에 확장하여 비용을 절감하려고 합니다. 회사는 트래픽 패턴이 예측 가능하다는 기록 데이터를 보유하고 있습니다.<br>이 요구 사항을 가장 비용 효율적으로 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure a target tracking scaling policy for the Auto Scaling group based on the ALB's <code>RequestCountPerTarget</code> metric. Set the target to match the expected number of requests per instance.`, ko:`ALB의 <code>RequestCountPerTarget</code> 지표를 기반으로 Auto Scaling 그룹에 대한 대상 추적 조정 정책을 구성합니다. 인스턴스당 예상 요청 수에 맞게 대상을 설정합니다.` },
    { k:'B', en:`Configure a scheduled scaling action to reduce the minimum and desired capacity at night and increase them before the morning traffic surge. Optionally combine with a dynamic scaling policy to handle unexpected traffic spikes.`, ko:`밤 시간대에 최소 및 원하는 용량을 줄이고 아침 트래픽 급증 전에 늘리는 예약 조정 액션을 구성합니다. 선택적으로 예상치 못한 트래픽 급증을 처리하기 위해 동적 조정 정책과 결합합니다.` },
    { k:'C', en:`Purchase Reserved Instances to match the expected minimum number of instances needed at all times. Use On-Demand Instances for additional capacity during peak hours.`, ko:`항상 필요한 예상 최소 인스턴스 수에 맞게 예약 인스턴스를 구매합니다. 피크 시간대에 추가 용량을 위해 온디맨드 인스턴스를 사용합니다.` },
    { k:'D', en:`Enable predictive scaling for the Auto Scaling group. Predictive scaling uses machine learning to forecast traffic patterns and proactively scale the fleet to handle demand before it arrives.`, ko:`Auto Scaling 그룹에 대한 예측 조정을 활성화합니다. 예측 조정은 머신 러닝을 사용하여 트래픽 패턴을 예측하고 수요가 도달하기 전에 플리트를 사전에 조정합니다.` },
  ],
  answer: ['D'],
  vote: '76% D',
  explain: `<p><span class="mark-ok">✅ D — 예측 조정(Predictive Scaling)</span></p><p>예측 조정(Predictive Scaling)은 기록 데이터를 기반으로 ML을 사용하여 트래픽 패턴을 예측하고 수요가 도달하기 전에 미리 인스턴스를 확장합니다. 트래픽 패턴이 예측 가능하다는 전제 조건을 정확히 활용하는 솔루션입니다. 예약 조정보다 더 정확하게 예측하며, 아침 트래픽 급증 전에 충분한 용량을 자동으로 준비하고 야간 저트래픽 시 자동으로 축소합니다. 수동 예약 설정 관리 없이 AWS가 최적 용량을 자동 결정합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 대상 추적 조정은 반응형으로 실제 트래픽이 증가한 후 확장하므로 급격한 트래픽 급증 시 지연이 발생할 수 있습니다.</p>
<p><span class="mark-no">❌ B</span> — 예약 조정은 수동으로 시간대를 정의해야 하며 예측 조정보다 덜 정밀합니다.</p>
<p><span class="mark-no">❌ C</span> — 예약 인스턴스는 장기 약정으로 비용을 절감하지만 자동 스케일링과 직접 관련이 없습니다.</p>`,
  disc: [{ ans:'D (76%)', txt:'예측 가능한 트래픽 패턴에는 예측 조정이 가장 적합 — ML로 사전 확장하여 성능과 비용 효율성 모두 최적화' }]
},
{
  n: 381,
  en: `A company has multiple AWS accounts managed through AWS Organizations. The company wants to implement a solution to automatically remediate non-compliant resources across all accounts. When an AWS Config rule detects a non-compliant resource in any member account, the company wants to automatically fix it using a standardized runbook stored in the central security account.<br>Which solution will meet these requirements?`,
  ko: `회사는 AWS Organizations를 통해 관리되는 여러 AWS 계정을 보유하고 있습니다. 회사는 모든 계정에 걸쳐 비준수 리소스를 자동으로 수정하는 솔루션을 구현하려고 합니다. AWS Config 규칙이 멤버 계정에서 비준수 리소스를 감지하면 중앙 보안 계정에 저장된 표준 런북을 사용하여 자동으로 수정하려고 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`In each member account, create AWS Config rules with automatic remediation actions that point to AWS Systems Manager Automation documents stored in that account. Maintain separate copies of the runbook in each account.`, ko:`각 멤버 계정에서 해당 계정에 저장된 AWS Systems Manager Automation 문서를 가리키는 자동 수정 액션이 있는 AWS Config 규칙을 생성합니다. 각 계정에서 런북의 별도 복사본을 유지합니다.` },
    { k:'B', en:`Create an AWS Config organization conformance pack from the management account. Configure the conformance pack with Config rules that have automatic remediation using AWS Systems Manager Automation documents stored in the central security account. Configure cross-account IAM roles to allow the remediation to run in member accounts.`, ko:`관리 계정에서 AWS Config 조직 준수 팩을 생성합니다. 중앙 보안 계정에 저장된 AWS Systems Manager Automation 문서를 사용하여 자동 수정이 있는 Config 규칙으로 준수 팩을 구성합니다. 수정이 멤버 계정에서 실행될 수 있도록 교차 계정 IAM 역할을 구성합니다.` },
    { k:'C', en:`Enable Amazon EventBridge event bus sharing across all accounts. Create EventBridge rules in member accounts to forward Config compliance change events to the central security account's event bus. Create an EventBridge rule in the security account to invoke a Lambda function that runs the remediation.`, ko:`모든 계정에서 Amazon EventBridge 이벤트 버스 공유를 활성화합니다. 멤버 계정에 EventBridge 규칙을 생성하여 Config 규정 준수 변경 이벤트를 중앙 보안 계정의 이벤트 버스로 전달합니다. 보안 계정에서 수정을 실행하는 Lambda 함수를 호출하는 EventBridge 규칙을 생성합니다.` },
    { k:'D', en:`Use AWS Systems Manager Explorer to view compliance status across all accounts. Create a Systems Manager runbook that scans all accounts for non-compliant resources and remediates them. Schedule the runbook to run every hour.`, ko:`AWS Systems Manager Explorer를 사용하여 모든 계정의 규정 준수 상태를 확인합니다. 모든 계정에서 비준수 리소스를 스캔하고 수정하는 Systems Manager 런북을 생성합니다. 런북을 매시간 실행하도록 예약합니다.` },
  ],
  answer: ['B'],
  vote: '80% B',
  explain: `<p><span class="mark-ok">✅ B — 조직 준수 팩 + 중앙 SSM 자동화 문서 + 교차 계정 IAM</span></p><p>AWS Config 조직 준수 팩을 관리 계정에서 배포하면 모든 멤버 계정에 일관된 Config 규칙이 적용됩니다. 중앙 보안 계정의 SSM Automation 문서를 수정 액션으로 지정하고, 교차 계정 IAM 역할로 멤버 계정에서 수정을 실행할 수 있습니다. 표준 런북을 한 곳에서 관리하면서 모든 계정의 비준수 리소스를 자동 수정하는 요구 사항을 충족합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 각 계정에 런북 복사본을 유지하면 중앙화된 표준 런북 요구 사항에 위배되고 운영 오버헤드가 높습니다.</p>
<p><span class="mark-no">❌ C</span> — EventBridge 전달 + Lambda 조합은 작동하지만 Config 준수 팩의 내장 수정 기능보다 복잡합니다.</p>
<p><span class="mark-no">❌ D</span> — 시간별 예약 스캔은 실시간 수정이 아니며 운영 오버헤드가 높습니다.</p>`,
  disc: [{ ans:'B (80%)', txt:'조직 준수 팩으로 중앙 Config 규칙을 배포하고 중앙 SSM 문서로 표준화된 수정을 교차 계정으로 실행하는 최적 솔루션' }]
},
{
  n: 382,
  en: `A company is implementing a CI/CD pipeline for an application by using AWS CodePipeline and AWS CodeBuild. The company needs a solution to run unit tests and automatically generate code coverage reports before any code is deployed to production. The CI/CD pipeline execution must fail if the code coverage is less than 80%.<br>A DevOps engineer has already configured a CodeBuild project that runs the tests. The engineer now needs to enforce the 80% coverage threshold in the pipeline.<br>Which solution will meet these requirements with the LEAST development effort?`,
  ko: `회사는 AWS CodePipeline 및 AWS CodeBuild를 사용하여 애플리케이션을 위한 CI/CD 파이프라인을 구현하고 있습니다. DevOps 엔지니어는 이미 테스트를 실행하는 CodeBuild 프로젝트를 구성했습니다. 엔지니어는 이제 파이프라인에서 80% 커버리지 임계값을 시행해야 합니다.<br>최소한의 개발 노력으로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Update the <code>buildspec.yml</code> file in the CodeBuild project to add a post_build phase command that reads the coverage report, checks the coverage percentage, and exits with a non-zero status code if the coverage is less than 80%.`, ko:`CodeBuild 프로젝트의 <code>buildspec.yml</code> 파일을 업데이트하여 커버리지 보고서를 읽고 커버리지 비율을 확인하며 커버리지가 80% 미만이면 0이 아닌 상태 코드로 종료하는 post_build 단계 명령을 추가합니다.` },
    { k:'B', en:`Create an AWS Lambda function that reads CodeBuild test reports, checks the coverage percentage, and fails the pipeline if the coverage is less than 80%. Add an invoke Lambda action after the CodeBuild test action in CodePipeline.`, ko:`CodeBuild 테스트 보고서를 읽고 커버리지 비율을 확인하며 커버리지가 80% 미만이면 파이프라인을 실패시키는 AWS Lambda 함수를 생성합니다. CodePipeline의 CodeBuild 테스트 액션 이후에 Lambda 호출 액션을 추가합니다.` },
    { k:'C', en:`Enable CodeBuild Test Reporting. Configure a coverage threshold of 80% in the CodeBuild project's test reporting settings. CodeBuild will automatically fail the build if coverage falls below the threshold.`, ko:`CodeBuild 테스트 보고를 활성화합니다. CodeBuild 프로젝트의 테스트 보고 설정에서 80% 커버리지 임계값을 구성합니다. CodeBuild는 커버리지가 임계값 아래로 떨어지면 자동으로 빌드를 실패시킵니다.` },
    { k:'D', en:`Create an Amazon EventBridge rule that triggers after each CodeBuild build. Configure the rule to invoke an AWS Lambda function that reads the CodeBuild logs, extracts the coverage percentage, and calls the CodePipeline API to stop the pipeline if coverage is less than 80%.`, ko:`각 CodeBuild 빌드 후에 트리거되는 Amazon EventBridge 규칙을 생성합니다. CodeBuild 로그를 읽고 커버리지 비율을 추출하며 커버리지가 80% 미만이면 파이프라인을 중지하기 위해 CodePipeline API를 호출하는 AWS Lambda 함수를 호출하도록 규칙을 구성합니다.` },
  ],
  answer: ['A'],
  vote: '83% A',
  explain: `<p><span class="mark-ok">✅ A — buildspec.yml post_build에서 커버리지 검사 후 비정상 종료</span></p><p>이미 구성된 CodeBuild 프로젝트의 <code>buildspec.yml</code>에 post_build 단계를 추가하는 것이 가장 적은 개발 노력입니다. 커버리지 보고서(예: coverage.xml, lcov.info)에서 커버리지 값을 읽어 80% 미만이면 <code>exit 1</code>로 빌드를 실패시킵니다. CodeBuild 빌드가 실패하면 CodePipeline도 자동으로 중단됩니다. 새 서비스나 함수를 추가할 필요 없이 기존 buildspec.yml 수정만으로 구현 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — Lambda 함수 추가는 개발 노력이 더 필요합니다.</p>
<p><span class="mark-no">❌ C</span> — CodeBuild Test Reporting의 커버리지 임계값 자동 실패 기능은 현재 직접 지원되지 않습니다. buildspec.yml에서 수동으로 처리해야 합니다.</p>
<p><span class="mark-no">❌ D</span> — EventBridge + Lambda 조합은 복잡하고 빌드 완료 후 파이프라인을 사후 중지하는 방식이라 더 복잡합니다.</p>`,
  disc: [{ ans:'A (83%)', txt:'기존 buildspec.yml에 post_build 커버리지 체크를 추가하는 것이 가장 적은 노력으로 CodeBuild 빌드 실패 → 파이프라인 중단을 구현' }]
},
{
  n: 383,
  en: `A company has an application that uses Amazon DynamoDB as the primary database. The company recently experienced a data corruption incident and needs to implement point-in-time recovery to restore the database to a specific point before the corruption occurred. The company also needs to ensure that this capability is always enabled going forward.<br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `회사는 Amazon DynamoDB를 기본 데이터베이스로 사용하는 애플리케이션을 보유하고 있습니다. 회사는 최근 데이터 손상 사고를 경험했으며 손상이 발생하기 전 특정 시점으로 데이터베이스를 복원하기 위해 특정 시점 복구를 구현해야 합니다. 또한 앞으로도 이 기능이 항상 활성화되도록 해야 합니다.<br>이 요구 사항을 충족하는 단계 조합은 무엇입니까? (두 가지 선택)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Enable point-in-time recovery (PITR) on the DynamoDB table. Restore the table to a specific point in time using the AWS Management Console or AWS CLI.`, ko:`DynamoDB 테이블에서 특정 시점 복구(PITR)를 활성화합니다. AWS Management Console 또는 AWS CLI를 사용하여 테이블을 특정 시점으로 복원합니다.` },
    { k:'B', en:`Create an AWS Config rule using the managed rule <code>dynamodb-pitr-enabled</code> to detect DynamoDB tables without PITR enabled. Configure automatic remediation to enable PITR on non-compliant tables.`, ko:`관리형 규칙 <code>dynamodb-pitr-enabled</code>를 사용하여 PITR이 활성화되지 않은 DynamoDB 테이블을 감지하는 AWS Config 규칙을 생성합니다. 비준수 테이블에서 PITR을 활성화하도록 자동 수정을 구성합니다.` },
    { k:'C', en:`Create AWS Backup plans to back up the DynamoDB table hourly to an Amazon S3 bucket. Restore the data from S3 when needed.`, ko:`DynamoDB 테이블을 매시간 Amazon S3 버킷에 백업하는 AWS Backup 계획을 생성합니다. 필요할 때 S3에서 데이터를 복원합니다.` },
    { k:'D', en:`Enable DynamoDB Streams on the table. Create an AWS Lambda function that archives all changes to Amazon S3. Use the S3 data to replay changes to a specific point in time.`, ko:`테이블에서 DynamoDB 스트림을 활성화합니다. 모든 변경 사항을 Amazon S3에 보관하는 AWS Lambda 함수를 생성합니다. S3 데이터를 사용하여 특정 시점까지 변경 사항을 재생합니다.` },
    { k:'E', en:`Create an Amazon EventBridge rule that detects DynamoDB table creation events. Configure the rule to invoke an AWS Lambda function that automatically enables PITR on newly created DynamoDB tables.`, ko:`DynamoDB 테이블 생성 이벤트를 감지하는 Amazon EventBridge 규칙을 생성합니다. 새로 생성된 DynamoDB 테이블에서 PITR을 자동으로 활성화하는 AWS Lambda 함수를 호출하도록 규칙을 구성합니다.` },
  ],
  answer: ['A','B'],
  vote: '87% AB',
  explain: `<p><span class="mark-ok">✅ A — PITR 활성화 및 복원</span></p><p>DynamoDB PITR(Point-In-Time Recovery)을 활성화하면 최근 35일 이내 임의의 시점으로 테이블을 복원할 수 있습니다. 데이터 손상 발생 전 특정 시점으로 복원하여 즉각적인 요구 사항을 해결합니다.</p>
<p><span class="mark-ok">✅ B — AWS Config 관리형 규칙으로 PITR 강제 적용</span></p><p><code>dynamodb-pitr-enabled</code> Config 관리형 규칙은 PITR이 비활성화된 테이블을 지속적으로 감지합니다. 자동 수정으로 비준수 테이블에 PITR을 자동 활성화하여 앞으로도 PITR이 항상 활성화되도록 보장합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ C</span> — S3 백업은 PITR의 세밀한 시점 복구(초 단위)보다 복구 정밀도가 낮습니다.</p>
<p><span class="mark-no">❌ D</span> — 스트림 기반 변경 재생은 복잡한 사용자 구현이 필요합니다.</p>
<p><span class="mark-no">❌ E</span> — 신규 테이블만 감지하며 기존 테이블의 PITR을 보장하지 못합니다. Config 자동 수정이 더 포괄적입니다.</p>`,
  disc: [{ ans:'AB (87%)', txt:'PITR로 즉각 복원, Config 관리형 규칙+자동 수정으로 지속적 PITR 강제 활성화 보장' }]
},
{
  n: 384,
  en: `A company has an AWS environment with multiple VPCs across different regions. The company needs to enable communication between resources in different VPCs and wants to centralize network management. The company also wants to apply consistent security policies across all VPCs. The company's network team should be the only team that can make changes to the network configuration.<br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `회사는 여러 리전에 걸쳐 여러 VPC가 있는 AWS 환경을 보유하고 있습니다. 회사는 서로 다른 VPC의 리소스 간 통신을 활성화하고 네트워크 관리를 중앙화하려고 합니다. 또한 모든 VPC에 걸쳐 일관된 보안 정책을 적용하려고 합니다. 회사의 네트워크 팀만 네트워크 구성을 변경할 수 있어야 합니다.<br>최소한의 운영 오버헤드로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use VPC peering connections between all VPCs to enable communication. Create route tables in each VPC to route traffic through the peering connections. Apply security groups and NACLs consistently across all VPCs.`, ko:`모든 VPC 간에 VPC 피어링 연결을 사용하여 통신을 활성화합니다. 각 VPC에 라우트 테이블을 생성하여 피어링 연결을 통해 트래픽을 라우팅합니다. 모든 VPC에 걸쳐 보안 그룹과 NACL을 일관되게 적용합니다.` },
    { k:'B', en:`Deploy AWS Transit Gateway to connect all VPCs. Use Transit Gateway route tables to control routing between VPCs. Use AWS Firewall Manager to apply consistent AWS Network Firewall policies across all VPCs. Use AWS Organizations SCPs to restrict network changes to the network team's IAM role.`, ko:`AWS Transit Gateway를 배포하여 모든 VPC를 연결합니다. Transit Gateway 라우트 테이블을 사용하여 VPC 간 라우팅을 제어합니다. AWS Firewall Manager를 사용하여 모든 VPC에 걸쳐 일관된 AWS Network Firewall 정책을 적용합니다. AWS Organizations SCP를 사용하여 네트워크 변경을 네트워크 팀의 IAM 역할로 제한합니다.` },
    { k:'C', en:`Create a shared VPC using AWS Resource Access Manager (RAM). Share the VPC subnets with all other accounts. Route all traffic through the shared VPC for centralized management.`, ko:`AWS Resource Access Manager(RAM)를 사용하여 공유 VPC를 생성합니다. VPC 서브넷을 다른 모든 계정과 공유합니다. 중앙 집중 관리를 위해 모든 트래픽을 공유 VPC를 통해 라우팅합니다.` },
    { k:'D', en:`Deploy a third-party software-defined networking (SDN) solution on EC2 instances to manage connectivity between VPCs. Implement access controls within the SDN solution to restrict network changes.`, ko:`EC2 인스턴스에 타사 소프트웨어 정의 네트워킹(SDN) 솔루션을 배포하여 VPC 간 연결을 관리합니다. SDN 솔루션 내에서 액세스 제어를 구현하여 네트워크 변경을 제한합니다.` },
  ],
  answer: ['B'],
  vote: '88% B',
  explain: `<p><span class="mark-ok">✅ B — Transit Gateway + Firewall Manager + SCP</span></p><p>AWS Transit Gateway는 허브-스포크 모델로 여러 VPC와 온프레미스 네트워크를 중앙에서 연결하는 완전 관리형 서비스입니다. VPC 피어링의 메시 구성 복잡성을 제거합니다. AWS Firewall Manager는 조직 전체에 Network Firewall 정책을 일관되게 적용합니다. SCP로 네트워크 팀만 네트워크 변경을 할 수 있도록 제한하여 거버넌스를 강화합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — VPC 피어링은 VPC 수가 많아질수록 연결 수가 기하급수적으로 증가하여 관리가 복잡합니다(전이적 라우팅 불가).</p>
<p><span class="mark-no">❌ C</span> — 공유 VPC는 계정 간 리소스 공유에 유용하지만 완전한 네트워크 중앙화 관리 솔루션이 아닙니다.</p>
<p><span class="mark-no">❌ D</span> — 타사 SDN은 EC2 인스턴스 관리 등 높은 운영 오버헤드가 필요합니다.</p>`,
  disc: [{ ans:'B (88%)', txt:'Transit Gateway로 중앙 연결 허브 구성, Firewall Manager로 일관된 보안 정책, SCP로 네트워크 팀 전용 변경 권한 부여' }]
},
{
  n: 385,
  en: `A company uses AWS CodeCommit to store its application source code. The company's security policy requires that all code changes undergo a security review before being merged to the main branch. The review process must be enforced automatically and cannot be bypassed by developers.<br>Which solution will meet these requirements?`,
  ko: `회사는 AWS CodeCommit을 사용하여 애플리케이션 소스 코드를 저장합니다. 회사의 보안 정책에는 모든 코드 변경 사항이 메인 브랜치에 병합되기 전에 보안 검토를 거쳐야 합니다. 검토 프로세스는 자동으로 시행되어야 하며 개발자가 우회할 수 없어야 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create branch protection rules in CodeCommit that require pull request reviews. Configure the rules to require at least one approval from a security team member before merging.`, ko:`풀 리퀘스트 검토를 요구하는 CodeCommit 브랜치 보호 규칙을 생성합니다. 병합 전에 보안 팀 구성원의 승인이 최소 1개 필요하도록 규칙을 구성합니다.` },
    { k:'B', en:`Create an approval rule template in CodeCommit. Configure the template to require approval from the security team for all pull requests to the main branch. Associate the template with the repository.`, ko:`CodeCommit에서 승인 규칙 템플릿을 생성합니다. 메인 브랜치에 대한 모든 풀 리퀘스트에 보안 팀의 승인이 필요하도록 템플릿을 구성합니다. 저장소에 템플릿을 연결합니다.` },
    { k:'C', en:`Use AWS IAM policies to restrict direct pushes to the main branch. Require all developers to create feature branches and submit pull requests. Conduct security reviews manually.`, ko:`AWS IAM 정책을 사용하여 메인 브랜치로의 직접 푸시를 제한합니다. 모든 개발자가 기능 브랜치를 만들고 풀 리퀘스트를 제출하도록 요구합니다. 보안 검토를 수동으로 수행합니다.` },
    { k:'D', en:`Create an Amazon EventBridge rule that triggers when code is pushed to CodeCommit. Configure the rule to invoke an AWS Lambda function that runs security checks and sends notifications to the security team. Allow merges only after the security team acknowledges the notification.`, ko:`코드가 CodeCommit에 푸시될 때 트리거되는 Amazon EventBridge 규칙을 생성합니다. 보안 검사를 실행하고 보안 팀에 알림을 보내는 AWS Lambda 함수를 호출하도록 규칙을 구성합니다. 보안 팀이 알림을 확인한 후에만 병합을 허용합니다.` },
  ],
  answer: ['B'],
  vote: '85% B',
  explain: `<p><span class="mark-ok">✅ B — CodeCommit 승인 규칙 템플릿</span></p><p>CodeCommit의 승인 규칙 템플릿(Approval Rule Template)은 저장소의 풀 리퀘스트에 자동으로 적용되는 승인 요구 사항을 정의합니다. 메인 브랜치 대상 모든 PR에 보안 팀 승인을 요구하도록 설정하면 코드 검토 프로세스가 자동으로 강제됩니다. 풀 리퀘스트 방식으로만 병합이 가능하며 승인 없이는 병합할 수 없으므로 개발자가 우회할 수 없습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CodeCommit에는 GitHub과 같은 브랜치 보호 규칙 기능이 없습니다. 승인 규칙 템플릿이 CodeCommit의 올바른 기능입니다.</p>
<p><span class="mark-no">❌ C</span> — IAM 정책으로 직접 푸시를 제한할 수 있지만, 수동 검토만으로는 자동 시행 요구 사항을 충족하지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — EventBridge + Lambda는 자동화되지만 보안 팀의 수동 확인 과정이 있어 구현이 복잡합니다. 승인 규칙 템플릿이 더 직접적입니다.</p>`,
  disc: [{ ans:'B (85%)', txt:'CodeCommit 승인 규칙 템플릿은 저장소에 연결하면 모든 PR에 자동 적용되어 보안 검토를 우회 불가능하게 강제하는 네이티브 기능' }]
},
{
  n: 386,
  en: `A company wants to implement a solution to automatically rotate database credentials for its Amazon RDS instances. The company wants to minimize the risk of credential exposure and ensure that the application can always access the database using the latest credentials. The solution must require minimal code changes to the application.<br>Which solution will meet these requirements?`,
  ko: `회사는 Amazon RDS 인스턴스의 데이터베이스 자격 증명을 자동으로 교체하는 솔루션을 구현하려고 합니다. 회사는 자격 증명 노출 위험을 최소화하고 애플리케이션이 항상 최신 자격 증명을 사용하여 데이터베이스에 액세스할 수 있도록 해야 합니다. 솔루션은 애플리케이션의 코드 변경을 최소화해야 합니다.<br>이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Store database credentials in AWS Systems Manager Parameter Store as secure strings. Create an AWS Lambda function to rotate the credentials on a schedule and update the Parameter Store values. Update the application to fetch credentials from Parameter Store on each database connection.`, ko:`데이터베이스 자격 증명을 보안 문자열로 AWS Systems Manager Parameter Store에 저장합니다. 예약된 일정에 따라 자격 증명을 교체하고 Parameter Store 값을 업데이트하는 AWS Lambda 함수를 생성합니다. 각 데이터베이스 연결 시 Parameter Store에서 자격 증명을 가져오도록 애플리케이션을 업데이트합니다.` },
    { k:'B', en:`Store database credentials in AWS Secrets Manager. Enable automatic rotation for the secret with a rotation schedule. Update the application to retrieve credentials from Secrets Manager using the AWS SDK. Secrets Manager handles the rotation without additional Lambda functions.`, ko:`데이터베이스 자격 증명을 AWS Secrets Manager에 저장합니다. 교체 일정을 사용하여 시크릿에 대한 자동 교체를 활성화합니다. AWS SDK를 사용하여 Secrets Manager에서 자격 증명을 검색하도록 애플리케이션을 업데이트합니다. Secrets Manager는 추가 Lambda 함수 없이 교체를 처리합니다.` },
    { k:'C', en:`Use IAM database authentication for the RDS instance. Configure the application to use IAM roles to generate temporary database tokens instead of username/password credentials. Rotate the IAM role credentials using AWS STS.`, ko:`RDS 인스턴스에 IAM 데이터베이스 인증을 사용합니다. 애플리케이션이 사용자 이름/비밀번호 자격 증명 대신 IAM 역할을 사용하여 임시 데이터베이스 토큰을 생성하도록 구성합니다. AWS STS를 사용하여 IAM 역할 자격 증명을 교체합니다.` },
    { k:'D', en:`Create a custom Lambda function that generates new database credentials and updates them in the RDS instance. Store the new credentials in an encrypted Amazon S3 bucket. Update the application to download and use credentials from the S3 bucket.`, ko:`새 데이터베이스 자격 증명을 생성하고 RDS 인스턴스에서 업데이트하는 사용자 지정 Lambda 함수를 생성합니다. 새 자격 증명을 암호화된 Amazon S3 버킷에 저장합니다. S3 버킷에서 자격 증명을 다운로드하고 사용하도록 애플리케이션을 업데이트합니다.` },
  ],
  answer: ['B'],
  vote: '92% B',
  explain: `<p><span class="mark-ok">✅ B — AWS Secrets Manager 자동 교체</span></p><p>AWS Secrets Manager는 RDS 데이터베이스 자격 증명의 자동 교체를 기본으로 지원합니다. 교체 일정을 설정하면 Secrets Manager가 내장 Lambda 함수를 사용하여 RDS 인스턴스의 비밀번호를 자동으로 교체하고 시크릿 값을 업데이트합니다. 애플리케이션은 SDK로 Secrets Manager를 호출하여 항상 최신 자격 증명을 가져옵니다. 비밀번호가 코드나 설정 파일에 노출되지 않으며 최소한의 코드 변경(Secrets Manager 호출 추가)만 필요합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Parameter Store는 자동 교체 기능이 없어 사용자 정의 Lambda를 만들어야 합니다.</p>
<p><span class="mark-no">❌ C</span> — IAM 데이터베이스 인증은 좋은 방법이지만 RDS 지원 엔진이 제한적이고 애플리케이션 코드 변경이 더 많이 필요합니다.</p>
<p><span class="mark-no">❌ D</span> — S3에 자격 증명을 저장하는 것은 보안적으로 바람직하지 않으며 사용자 지정 Lambda 개발이 필요합니다.</p>`,
  disc: [{ ans:'B (92%)', txt:'Secrets Manager는 RDS 자동 교체를 내장 지원하여 추가 Lambda 없이 안전한 자격 증명 관리와 자동 교체를 가장 간단하게 구현' }]
},
{
  n: 387,
  en: `A company runs a stateless web application on Amazon EC2 instances in an Auto Scaling group. The company stores session state in Amazon ElastiCache for Redis. The company needs to ensure high availability for the application and cache tier. The company must also minimize data loss if a cache node fails.<br>Which combination of steps will meet these requirements? (Choose two.)`,
  ko: `회사는 Auto Scaling 그룹의 Amazon EC2 인스턴스에서 상태 비저장 웹 애플리케이션을 실행합니다. 회사는 세션 상태를 Amazon ElastiCache for Redis에 저장합니다. 회사는 애플리케이션 및 캐시 계층의 고가용성을 보장해야 합니다. 또한 캐시 노드가 실패할 경우 데이터 손실을 최소화해야 합니다.<br>이 요구 사항을 충족하는 단계 조합은 무엇입니까? (두 가지 선택)`,
  type: 'multi',
  multiCount: 2,
  choices: [
    { k:'A', en:`Configure the Auto Scaling group to span at least two Availability Zones. Set the minimum capacity to ensure the application remains available even if one AZ fails.`, ko:`Auto Scaling 그룹이 최소 두 개의 가용 영역에 걸쳐 있도록 구성합니다. 하나의 AZ가 실패해도 애플리케이션이 계속 사용 가능하도록 최소 용량을 설정합니다.` },
    { k:'B', en:`Deploy ElastiCache for Redis in cluster mode with multi-AZ enabled. Configure automatic failover so that a read replica is promoted if the primary node fails.`, ko:`다중 AZ가 활성화된 클러스터 모드로 ElastiCache for Redis를 배포합니다. 기본 노드가 실패하면 읽기 복제본이 승격되도록 자동 장애 조치를 구성합니다.` },
    { k:'C', en:`Enable ElastiCache for Redis backup to Amazon S3. Configure daily snapshots and retain them for 7 days to enable point-in-time recovery.`, ko:`Amazon S3에 대한 ElastiCache for Redis 백업을 활성화합니다. 특정 시점 복구를 활성화하기 위해 일일 스냅샷을 구성하고 7일 동안 보존합니다.` },
    { k:'D', en:`Configure the ElastiCache Redis cluster with Multi-AZ and enable automatic backups. Use Redis persistence (AOF) to minimize data loss on node failure.`, ko:`다중 AZ로 ElastiCache Redis 클러스터를 구성하고 자동 백업을 활성화합니다. 노드 장애 시 데이터 손실을 최소화하기 위해 Redis 지속성(AOF)을 사용합니다.` },
    { k:'E', en:`Deploy a single-node ElastiCache Redis cluster in the primary Availability Zone. Configure the application to gracefully handle cache misses by falling back to the database.`, ko:`기본 가용 영역에 단일 노드 ElastiCache Redis 클러스터를 배포합니다. 데이터베이스로 폴백하여 캐시 미스를 적절하게 처리하도록 애플리케이션을 구성합니다.` },
  ],
  answer: ['A','B'],
  vote: '81% AB',
  explain: `<p><span class="mark-ok">✅ A — Auto Scaling 그룹 다중 AZ 구성</span></p><p>Auto Scaling 그룹을 최소 2개 AZ에 걸쳐 구성하면 한 AZ 장애 시에도 애플리케이션이 계속 서비스됩니다. 웹 계층의 고가용성을 보장합니다.</p>
<p><span class="mark-ok">✅ B — ElastiCache Redis 다중 AZ + 자동 장애 조치</span></p><p>ElastiCache for Redis의 다중 AZ 모드와 자동 장애 조치(Auto Failover)를 활성화하면 기본 노드 실패 시 자동으로 읽기 복제본이 기본 노드로 승격됩니다. 복제본 데이터가 유지되어 데이터 손실이 최소화됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ C</span> — 일일 스냅샷은 데이터 손실 최소화에 충분하지 않습니다(최대 24시간 데이터 손실 가능). 자동 장애 조치가 더 효과적입니다.</p>
<p><span class="mark-no">❌ D</span> — AOF는 Redis 독립형 배포에서는 유용하지만 ElastiCache의 Multi-AZ 자동 장애 조치와 조합하면 중복됩니다. 주요 요구 사항은 고가용성입니다.</p>
<p><span class="mark-no">❌ E</span> — 단일 노드는 고가용성을 제공하지 않습니다.</p>`,
  disc: [{ ans:'AB (81%)', txt:'웹 계층은 Auto Scaling 다중 AZ로, 캐시 계층은 ElastiCache 다중 AZ + 자동 장애 조치로 각각 고가용성과 데이터 손실 최소화 달성' }]
},
{
  n: 388,
  en: `A company uses AWS CodePipeline to deploy applications. The company wants to implement automated rollback when a deployment to production fails. The company also wants to receive notifications about deployment status changes.<br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `회사는 AWS CodePipeline을 사용하여 애플리케이션을 배포합니다. 회사는 프로덕션 배포가 실패할 때 자동 롤백을 구현하려고 합니다. 또한 배포 상태 변경에 대한 알림을 받으려고 합니다.<br>최소한의 운영 오버헤드로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure AWS CodeDeploy deployment groups with automatic rollback enabled. Set the rollback trigger to activate on deployment failure. Create an Amazon EventBridge rule that detects CodePipeline stage execution state changes. Configure the rule to send notifications to an Amazon SNS topic.`, ko:`자동 롤백이 활성화된 AWS CodeDeploy 배포 그룹을 구성합니다. 배포 실패 시 롤백 트리거가 활성화되도록 설정합니다. CodePipeline 스테이지 실행 상태 변경을 감지하는 Amazon EventBridge 규칙을 생성합니다. Amazon SNS 토픽에 알림을 보내도록 규칙을 구성합니다.` },
    { k:'B', en:`Create an AWS Lambda function that monitors CodePipeline execution status. When a failure is detected, the Lambda function triggers a new pipeline run with the previous version. Configure the Lambda function to send SNS notifications on failure.`, ko:`CodePipeline 실행 상태를 모니터링하는 AWS Lambda 함수를 생성합니다. 오류가 감지되면 Lambda 함수가 이전 버전으로 새 파이프라인 실행을 트리거합니다. 오류 시 SNS 알림을 보내도록 Lambda 함수를 구성합니다.` },
    { k:'C', en:`Enable CodePipeline notifications using Amazon CodeStar Notifications. Configure notifications for pipeline execution state changes. Implement rollback by adding a manual approval stage and rerunning the pipeline with the previous artifact.`, ko:`Amazon CodeStar Notifications를 사용하여 CodePipeline 알림을 활성화합니다. 파이프라인 실행 상태 변경에 대한 알림을 구성합니다. 수동 승인 스테이지를 추가하고 이전 아티팩트로 파이프라인을 재실행하여 롤백을 구현합니다.` },
    { k:'D', en:`Configure AWS CodeDeploy with automatic rollback on alarm. Create CloudWatch alarms based on application metrics. Set up Amazon SNS to receive notifications when the alarms trigger.`, ko:`경보 시 자동 롤백으로 AWS CodeDeploy를 구성합니다. 애플리케이션 지표를 기반으로 CloudWatch 경보를 생성합니다. 경보가 트리거될 때 알림을 받도록 Amazon SNS를 설정합니다.` },
  ],
  answer: ['A'],
  vote: '84% A',
  explain: `<p><span class="mark-ok">✅ A — CodeDeploy 자동 롤백 + EventBridge + SNS</span></p><p>CodeDeploy 배포 그룹의 자동 롤백 설정은 배포 실패 시 자동으로 이전 버전으로 롤백합니다. EventBridge를 사용하여 CodePipeline 스테이지 실행 상태 변경(성공, 실패, 중단)을 감지하고 SNS 토픽으로 알림을 발송합니다. 추가 Lambda 함수나 복잡한 로직 없이 AWS 기본 제공 기능만으로 두 요구 사항을 모두 충족합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — Lambda 모니터링과 수동 파이프라인 재실행은 복잡하고 오류가 발생하기 쉽습니다.</p>
<p><span class="mark-no">❌ C</span> — 수동 승인을 통한 롤백은 자동화 요구 사항에 맞지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — 경보 기반 자동 롤백은 유용하지만 배포 실패 자체가 아닌 메트릭 임계값에 의존하므로 배포 실패 시 즉각 롤백이 A보다 덜 직접적입니다.</p>`,
  disc: [{ ans:'A (84%)', txt:'CodeDeploy 내장 자동 롤백 + EventBridge/SNS 알림이 추가 서비스 없이 두 요구 사항을 가장 간단하게 충족' }]
},
{
  n: 389,
  en: `A company uses Amazon Elastic Kubernetes Service (Amazon EKS) to run its containerized workloads. The company wants to implement a GitOps workflow where changes to Kubernetes manifests in a Git repository automatically trigger deployments to the EKS cluster. The solution must support automatic rollback if a deployment causes issues.<br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `회사는 Amazon Elastic Kubernetes Service(Amazon EKS)를 사용하여 컨테이너화된 워크로드를 실행합니다. 회사는 Git 저장소의 Kubernetes 매니페스트 변경 사항이 자동으로 EKS 클러스터에 배포를 트리거하는 GitOps 워크플로우를 구현하려고 합니다. 솔루션은 배포가 문제를 일으킬 경우 자동 롤백을 지원해야 합니다.<br>최소한의 운영 오버헤드로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Set up an AWS CodePipeline pipeline that is triggered by CodeCommit repository changes. Use a CodeBuild project to apply Kubernetes manifests to the EKS cluster using <code>kubectl apply</code>. Configure CodeDeploy to handle rollbacks.`, ko:`CodeCommit 저장소 변경에 의해 트리거되는 AWS CodePipeline 파이프라인을 설정합니다. CodeBuild 프로젝트를 사용하여 <code>kubectl apply</code>를 사용하여 EKS 클러스터에 Kubernetes 매니페스트를 적용합니다. 롤백을 처리하도록 CodeDeploy를 구성합니다.` },
    { k:'B', en:`Install Argo CD on the EKS cluster. Configure Argo CD to watch a Git repository for changes to Kubernetes manifests. Argo CD automatically syncs changes to the cluster and supports rollback through its built-in history and rollback features.`, ko:`EKS 클러스터에 Argo CD를 설치합니다. Kubernetes 매니페스트의 변경 사항에 대한 Git 저장소를 감시하도록 Argo CD를 구성합니다. Argo CD는 자동으로 변경 사항을 클러스터에 동기화하고 내장 기록 및 롤백 기능을 통해 롤백을 지원합니다.` },
    { k:'C', en:`Create an Amazon EventBridge rule that monitors CodeCommit for pushes. Configure the rule to invoke a Lambda function that applies the Kubernetes manifests using the EKS API. Implement rollback logic in the Lambda function.`, ko:`푸시를 위해 CodeCommit을 모니터링하는 Amazon EventBridge 규칙을 생성합니다. EKS API를 사용하여 Kubernetes 매니페스트를 적용하는 Lambda 함수를 호출하도록 규칙을 구성합니다. Lambda 함수에서 롤백 로직을 구현합니다.` },
    { k:'D', en:`Use AWS Proton to define and manage the EKS service templates. Integrate Proton with CodeCommit to automatically deploy template updates when changes are detected.`, ko:`AWS Proton을 사용하여 EKS 서비스 템플릿을 정의하고 관리합니다. 변경 사항이 감지되면 템플릿 업데이트를 자동으로 배포하기 위해 Proton을 CodeCommit과 통합합니다.` },
  ],
  answer: ['B'],
  vote: '88% B',
  explain: `<p><span class="mark-ok">✅ B — Argo CD (GitOps 도구)</span></p><p>Argo CD는 Kubernetes용 선언적 GitOps 지속적 배포 도구입니다. Git 저장소를 진실의 원천(Source of Truth)으로 사용하여 매니페스트 변경을 자동으로 클러스터에 동기화합니다. 내장된 롤백 기능으로 이전 배포 상태로 한 번의 클릭이나 명령으로 롤백 가능합니다. AWS CodePipeline 기반 접근보다 Kubernetes 네이티브 GitOps 워크플로우를 더 적은 구성으로 구현합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CodePipeline + kubectl apply는 GitOps가 아닌 기존 CI/CD 방식으로, 클러스터 상태와 Git이 동기화되지 않을 수 있습니다. CodeDeploy는 ECS/Lambda용이며 EKS 롤백에 직접 적용하기 어렵습니다.</p>
<p><span class="mark-no">❌ C</span> — Lambda 기반 배포는 Argo CD의 상태 동기화, 자동 수정, 롤백 기능을 직접 구현해야 하므로 오버헤드가 높습니다.</p>
<p><span class="mark-no">❌ D</span> — AWS Proton은 인프라 템플릿 관리 도구로 Kubernetes GitOps 워크플로우에 적합하지 않습니다.</p>`,
  disc: [{ ans:'B (88%)', txt:'Argo CD는 EKS GitOps 워크플로우의 사실상 표준 도구로, Git 기반 자동 동기화와 내장 롤백으로 최소 오버헤드 구현' }]
},
{
  n: 390,
  en: `A company uses AWS CloudFormation to manage its infrastructure. The company has noticed that developers are sometimes making manual changes to resources that are managed by CloudFormation stacks. These changes cause configuration drift and lead to unexpected behavior. The company wants to detect and remediate drift automatically.<br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `회사는 AWS CloudFormation을 사용하여 인프라를 관리합니다. 회사는 개발자들이 때때로 CloudFormation 스택이 관리하는 리소스를 수동으로 변경한다는 것을 발견했습니다. 이러한 변경 사항은 구성 드리프트를 유발하고 예상치 못한 동작으로 이어집니다. 회사는 드리프트를 자동으로 감지하고 수정하려고 합니다.<br>최소한의 운영 오버헤드로 이 요구 사항을 충족하는 솔루션은 무엇입니까?`,
  type: 'single',
  choices: [
    { k:'A', en:`Schedule AWS Lambda functions using Amazon EventBridge to run CloudFormation drift detection on all stacks daily. If drift is detected, the Lambda function sends an SNS notification and automatically triggers a CloudFormation stack update to remediate the drift.`, ko:`Amazon EventBridge를 사용하여 AWS Lambda 함수를 예약하여 매일 모든 스택에서 CloudFormation 드리프트 감지를 실행합니다. 드리프트가 감지되면 Lambda 함수가 SNS 알림을 보내고 자동으로 CloudFormation 스택 업데이트를 트리거하여 드리프트를 수정합니다.` },
    { k:'B', en:`Enable AWS Config with the <code>cloudformation-stack-drift-detection-check</code> managed rule. Configure automatic remediation to run the CloudFormation DetectStackDrift API when non-compliant stacks are detected. Set up SNS notifications for compliance state changes.`, ko:`<code>cloudformation-stack-drift-detection-check</code> 관리형 규칙과 함께 AWS Config를 활성화합니다. 비준수 스택이 감지될 때 CloudFormation DetectStackDrift API를 실행하도록 자동 수정을 구성합니다. 규정 준수 상태 변경에 대한 SNS 알림을 설정합니다.` },
    { k:'C', en:`Use AWS CloudTrail to track API calls that modify CloudFormation-managed resources. Create EventBridge rules to detect direct resource modifications. Invoke a Lambda function that identifies the affected CloudFormation stack and runs a stack update to remediate drift.`, ko:`AWS CloudTrail을 사용하여 CloudFormation 관리 리소스를 수정하는 API 호출을 추적합니다. 직접 리소스 수정을 감지하는 EventBridge 규칙을 생성합니다. 영향 받은 CloudFormation 스택을 식별하고 드리프트를 수정하기 위해 스택 업데이트를 실행하는 Lambda 함수를 호출합니다.` },
    { k:'D', en:`Implement an AWS Service Control Policy (SCP) that prevents developers from modifying resources that are tagged with a CloudFormation stack tag. This prevents drift from occurring in the first place.`, ko:`CloudFormation 스택 태그로 태그된 리소스를 수정하는 것을 방지하는 AWS 서비스 제어 정책(SCP)을 구현합니다. 이렇게 하면 처음부터 드리프트가 발생하는 것을 방지합니다.` },
  ],
  answer: ['B'],
  vote: '77% B',
  explain: `<p><span class="mark-ok">✅ B — AWS Config 관리형 규칙 + 드리프트 감지 자동 수정</span></p><p>AWS Config의 <code>cloudformation-stack-drift-detection-check</code> 관리형 규칙은 CloudFormation 스택의 드리프트 상태를 지속적으로 모니터링합니다. 비준수 스택 감지 시 자동 수정으로 <code>DetectStackDrift</code> API를 호출하여 드리프트를 확인하고, SNS 알림으로 팀에 통보합니다. 추가 Lambda 함수나 복잡한 EventBridge 규칙 없이 Config 기본 기능으로 구현 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 스택 업데이트로 드리프트를 "수정"하는 것은 위험합니다. 드리프트 수정은 스택을 원래 템플릿 상태로 되돌려 의도적인 변경도 되돌릴 수 있습니다. 알림과 감지가 더 안전합니다.</p>
<p><span class="mark-no">❌ C</span> — CloudTrail API 추적 + Lambda 조합은 Config보다 복잡합니다.</p>
<p><span class="mark-no">❌ D</span> — SCP는 드리프트 방지에 도움되지만 자동 감지 및 수정 요구 사항을 충족하지 않습니다. 또한 합법적인 운영 작업도 차단할 수 있습니다.</p>`,
  disc: [{ ans:'B (77%)', txt:'Config 관리형 규칙으로 지속적 드리프트 모니터링, 자동 수정으로 DetectStackDrift 호출, SNS로 알림 — 최소 오버헤드 솔루션' }]
},
{
  n: 391,
  en: `A company manages environments for its application in multiple AWS accounts. Each environment account is in a different OU in AWS Organizations.<br><br>A DevOps team is responsible for the application deployment process across the environments. The deployment process uses an AWS CodePipeline pipeline in a Shared Services account. The DevOps team members are in the same user group. The team members have administrative access to all accounts through AWS IAM Identity Center.<br><br>A recent deployment problem in the development environment required the DevOps team to perform manual steps. The deployment to the production environment then resulted in an incident that caused the pipeline to fail, which blocked new deployments for several hours.<br><br>A DevOps engineer needs to ensure that only the pipeline can perform deployments in the production environment. The DevOps engineer must have access to the environment in case of an emergency.<br><br>Which solution will meet these requirements with the MOST operational efficiency?`,
  ko: `한 회사가 여러 AWS 계정에서 애플리케이션 환경을 관리합니다. 각 환경 계정은 AWS Organizations의 서로 다른 OU에 속해 있습니다.<br><br>DevOps 팀은 이러한 환경 전반에 걸친 애플리케이션 배포 프로세스를 담당합니다. 배포 프로세스는 공유 서비스 계정의 AWS CodePipeline 파이프라인을 사용합니다. DevOps 팀 구성원들은 모두 동일한 사용자 그룹에 속해 있으며, AWS IAM Identity Center를 통해 모든 계정에 대한 관리자 권한을 가지고 있습니다.<br><br>최근 개발 환경에서 발생한 배포 문제로 인해 DevOps 팀이 수동으로 작업을 수행해야 했습니다. 그 결과 프로덕션 환경으로의 배포 과정에서 파이프라인 오류가 발생하여 몇 시간 동안 새로운 배포가 중단되었습니다.<br><br>DevOps 엔지니어는 프로덕션 환경에서는 파이프라인을 통해서만 배포가 이루어지도록 해야 하며, 비상 상황 발생 시 해당 환경에 접근할 수 있어야 합니다.<br><br>이러한 요구 사항을 가장 효율적으로 충족하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Update the DevOps group to have the ReadOnlyAccess permission set for the production accounts. Configure the DevOps engineer user with a new permission set that has AdministratorAccess permissions and that allows the user to assume the pipeline role. Add an SCP that denies modification of resources by any entity other than the pipeline role.`, ko:`DevOps 그룹에 프로덕션 계정에 대한 읽기 전용 액세스(ReadOnlyAccess) 권한을 부여하도록 업데이트합니다. DevOps 엔지니어 사용자에게 관리자 액세스(AdministratorAccess) 권한을 포함하고 파이프라인 역할을 수행할 수 있도록 하는 새로운 권한 집합을 구성합니다. 파이프라인 역할 이외의 다른 주체가 리소스를 수정하지 못하도록 하는 SCP를 추가합니다.` },
    { k:'B', en:`Create an SCP that denies all write actions for the DevOps team members on the production OU. Configure a new user in IAM Identity Center for the DevOps engineer with a new permission set that has AdministratorAccess permissions. Add an SCP that denies modification of resources by any entity other than the pipeline role.`, ko:`프로덕션 OU에서 DevOps 팀 구성원의 모든 쓰기 작업을 거부하는 SCP를 생성합니다. DevOps 엔지니어를 위해 IAM Identity Center에서 관리자 액세스 권한이 있는 새 권한 집합을 가진 새 사용자를 구성합니다. 파이프라인 역할 이외의 모든 엔터티가 리소스를 수정하지 못하도록 하는 SCP를 추가합니다.` },
    { k:'C', en:`Update the DevOps group to be able to assume the pipeline role for the production accounts. Configure a new user in IAM Identity Center for the DevOps engineer with a new permission set that has AdministratorAccess permissions. Add an SCP that denies modification of resources by any entity other than the DevOps engineer.`, ko:`DevOps 그룹이 프로덕션 계정에 대한 파이프라인 역할을 수행할 수 있도록 업데이트합니다. DevOps 엔지니어를 위해 IAM Identity Center에서 관리자 액세스 권한이 있는 새 권한 집합을 가진 새 사용자를 구성합니다. DevOps 엔지니어 이외의 다른 주체가 리소스를 수정하지 못하도록 하는 SCP를 추가합니다.` },
    { k:'D', en:`Create an SCP that denies all write actions for the DevOps team members on the production OU. Use a specific tag to tag the resources that CodePipeline provisions. Add an SCP that denies modification of tagged resources by any entity other than the DevOps engineer.`, ko:`프로덕션 OU에서 DevOps 팀 구성원의 모든 쓰기 작업을 거부하는 SCP를 생성합니다. CodePipeline에서 프로비저닝하는 리소스에 특정 태그를 지정합니다. DevOps 엔지니어 이외의 다른 주체가 태그가 지정된 리소스를 수정하지 못하도록 하는 SCP를 추가합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p><p>A는 세 가지 요구사항을 모두 충족합니다. 첫째, 일반 DevOps 그룹은 ReadOnlyAccess만 가지므로 프로덕션에 직접 변경을 가할 수 없습니다. 둘째, SCP가 파이프라인 역할 외 모든 주체의 리소스 수정을 차단하므로 파이프라인을 통해서만 배포가 가능합니다. 셋째, DevOps 엔지니어는 별도의 새 권한 집합(AdministratorAccess + 파이프라인 역할 수임 가능)을 통해 비상 시에도 접근할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 새 사용자를 별도로 생성해야 하므로 운영 효율성이 낮고, SCP가 두 개 겹쳐 관리 복잡성이 증가합니다.</p><p><span class="mark-no">❌ C</span> — SCP가 DevOps 엔지니어 외 수정을 거부하므로 파이프라인 역할도 차단될 수 있어 요구사항 위반입니다.</p><p><span class="mark-no">❌ D</span> — 태그 기반 SCP는 파이프라인이 프로비저닝한 리소스 이외의 신규 리소스 보호가 어렵고, 비상 접근 권한 구성이 불완전합니다.</p>`,
  disc: [{ ans:'A', txt:'읽기 전용 그룹 + 별도 비상 권한 집합 + 파이프라인 역할만 허용하는 SCP 조합이 가장 명확하고 효율적인 구성입니다.' }]
},
{
  n: 392,
  en: `A company builds container images and stores them on Amazon Elastic Container Registry (Amazon ECR) in the company's primary AWS Region.<br><br>A DevOps engineer wants to replicate all the company's ECR repository images to a secondary Region. The DevOps engineer creates a new ECR repository in the secondary Region and configures permission on the new repository to allow replication.<br><br>Which solution will meet these requirements with the MOST operational efficiency?`,
  ko: `한 회사가 컨테이너 이미지를 빌드하여 자사 주 AWS 리전의 Amazon Elastic Container Registry(Amazon ECR)에 저장합니다.<br><br>DevOps 엔지니어는 회사 ECR 저장소에 있는 모든 이미지를 보조 리전으로 복제하려고 합니다. DevOps 엔지니어는 보조 리전에 새 ECR 저장소를 생성하고 복제를 허용하도록 권한을 구성합니다.<br><br>이러한 요구 사항을 가장 운영 효율적으로 충족하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Pull the existing primary ECR images and then push the images to the secondary ECR repository. Create a replication rule on the primary ECR registry to replicate the images to the secondary ECR registry.`, ko:`기존 기본 ECR 이미지를 가져온 다음 보조 ECR 저장소로 푸시합니다. 기본 ECR 레지스트리에 복제 규칙을 생성하여 이미지를 보조 ECR 레지스트리로 복제합니다.` },
    { k:'B', en:`Pull the existing primary ECR images and then push the images to the secondary ECR repository. Configure permission on the primary ECR registry to allow access from the secondary Region.`, ko:`기존 기본 ECR 이미지를 가져온 다음 보조 ECR 저장소로 푸시합니다. 보조 리전에서 액세스할 수 있도록 기본 ECR 레지스트리에 대한 권한을 구성합니다.` },
    { k:'C', en:`Configure permission on the primary ECR registry to allow access from the secondary Region. Create a replication rule on the primary ECR registry to replicate the images to the secondary ECR registry.`, ko:`보조 리전에서 접근할 수 있도록 기본 ECR 레지스트리에 대한 권한을 구성합니다. 기본 ECR 레지스트리에 복제 규칙을 생성하여 이미지를 보조 ECR 레지스트리로 복제합니다.` },
    { k:'D', en:`Configure an AWS Lambda function to automatically save the ECR images to an Amazon S3 bucket. Configure cross-Region replication for the S3 bucket. Configure a second Lambda function to push the images to ECR repositories in the replication destination Region when images are replicated to the S3 bucket.`, ko:`ECR 이미지를 Amazon S3 버킷에 자동으로 저장하는 AWS Lambda 함수를 구성합니다. S3 버킷에 대해 리전 간 복제를 구성합니다. 이미지가 S3 버킷으로 복제되면 복제 대상 리전의 ECR 리포지토리로 이미지를 푸시하는 두 번째 Lambda 함수를 구성합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p><p>Amazon ECR 복제는 "푸시 기반" 모델로, 복제 규칙 생성 이전에 존재하던 기존 이미지는 자동으로 복제되지 않습니다. 따라서 기존 이미지는 수동으로 pull → push하여 보조 리전에 복사하고, 이후 신규 이미지는 복제 규칙으로 자동 처리하는 두 단계가 필요합니다. A만이 이 두 단계를 모두 수행합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ C</span> — 복제 규칙만 생성하면 신규 이미지는 복제되지만, 기존 이미지는 복제되지 않으므로 "모든 이미지 복제" 요건을 충족하지 못합니다.</p><p><span class="mark-no">❌ B</span> — 권한 구성 없이 수동 push만 하므로 이후 신규 이미지가 자동 복제되지 않습니다.</p><p><span class="mark-no">❌ D</span> — Lambda + S3 + Kinesis 구조는 불필요하게 복잡하며 운영 오버헤드가 큽니다.</p>`,
  disc: [{ ans:'A', txt:'ECR 복제는 기존 이미지 소급 적용 불가 — 기존 이미지는 수동 pull/push, 이후 이미지는 복제 규칙으로 처리하는 A가 정답.' }]
},
{
  n: 393,
  en: `A company is experiencing failures in its AWS CodeDeploy deployments for a critical application. The application is deployed on Amazon EC2 instances. A DevOps engineer must analyze the failed deployments to identify the root cause of the failures.<br><br>Which solution will provide the appropriate information to troubleshoot the deployment issues?`,
  ko: `한 회사가 핵심 애플리케이션의 AWS CodeDeploy 배포에서 오류를 겪고 있습니다. 해당 애플리케이션은 Amazon EC2 인스턴스에 배포되어 있습니다. DevOps 엔지니어는 실패한 배포를 분석하여 근본 원인을 파악해야 합니다.<br><br>어떤 솔루션이 배포 문제를 해결하는 데 필요한 적절한 정보를 제공할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure VPC Flow Logs to monitor network traffic. Use Amazon Inspector to detect non-network deployment issues. Use Amazon Detective to analyze the findings.`, ko:`VPC Flow Logs를 구성하여 네트워크 트래픽을 모니터링합니다. Amazon Inspector를 사용하여 네트워크 관련이 아닌 배포 문제를 감지합니다. Amazon Detective를 사용하여 발견 사항을 분석합니다.` },
    { k:'B', en:`Enable detailed monitoring on the EC2 instances. Use AWS Systems Manager Run Command to run troubleshooting scripts on all the EC2 instances simultaneously. Analyze the results in AWS CloudTrail logs.`, ko:`EC2 인스턴스에 대한 상세 모니터링을 활성화합니다. AWS Systems Manager의 명령 실행 기능을 사용하여 모든 EC2 인스턴스에서 동시에 문제 해결 스크립트를 실행합니다. AWS CloudTrail 로그에서 결과를 분석합니다.` },
    { k:'C', en:`Use Amazon CloudWatch Logs to review application logs. Analyze CodeDeploy deployment logs in the /opt/codedeploy-agent/deployment-root/ directory on the EC2 instances. Use AWS X-Ray to trace requests through the application components.`, ko:`Amazon CloudWatch Logs를 사용하여 애플리케이션 로그를 검토합니다. EC2 인스턴스의 /opt/codedeploy-agent/deployment-root/ 디렉터리에 있는 CodeDeploy 배포 로그를 분석합니다. AWS X-Ray를 사용하여 애플리케이션 구성 요소를 통한 요청을 추적합니다.` },
    { k:'D', en:`Examine AWS Trusted Advisor checks for the CodeDeploy deployments. Use the AWS Health Dashboard to monitor application health. Analyze performance metrics in Amazon CloudWatch dashboards.`, ko:`CodeDeploy 배포에 대한 AWS Trusted Advisor 검사를 검토합니다. AWS Health 대시보드를 사용하여 애플리케이션 상태를 모니터링합니다. Amazon CloudWatch 대시보드에서 성능 지표를 분석합니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — 핵심 이유</span></p><p>CodeDeploy 배포 실패를 분석하는 가장 직접적인 방법은 CloudWatch Logs로 애플리케이션 로그를 검토하고, EC2 인스턴스의 <code>/opt/codedeploy-agent/deployment-root/</code> 디렉터리에서 CodeDeploy 에이전트 로그를 확인하는 것입니다. X-Ray는 배포 후 런타임 요청 추적에 활용됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — VPC Flow Logs와 Inspector/Detective는 네트워크/보안 분석 도구로, CodeDeploy 배포 실패 원인 파악에 적합하지 않습니다.</p><p><span class="mark-no">❌ B</span> — CloudTrail은 API 호출 감사용이며 배포 스크립트 실패 원인 분석에는 부적합합니다.</p><p><span class="mark-no">❌ D</span> — Trusted Advisor와 Health Dashboard는 CodeDeploy 배포 라이프사이클 이벤트 수준의 상세 로그를 제공하지 않습니다.</p>`,
  disc: []
},
{
  n: 394,
  en: `A company has developed a web application that conducts seasonal sales on public holidays. The web application is deployed on AWS and uses AWS services for storage, database, computing, and encryption. During seasonal sales, the company expects high network traffic from a large number of users. The company must receive insights regarding any unexpected behavior during the sale.<br><br>A DevOps team wants to review the insights upon detecting anomalous behaviors during the sale. The DevOps team wants to receive recommended actions to resolve the anomalous behaviors. The recommendations must be provided on the provisioned infrastructure to address the issues that might occur in the future.<br><br>Which combination of steps will meet these requirements with the LEAST operational overhead? (Choose two.)`,
  ko: `한 회사가 공휴일에 시즌 세일을 진행하는 웹 애플리케이션을 개발했습니다. 이 웹 애플리케이션은 AWS에 배포되어 있으며 스토리지, 데이터베이스, 컴퓨팅 및 암호화에 AWS 서비스를 사용합니다. 시즌 세일 기간 동안에는 많은 사용자로 인해 네트워크 트래픽이 급증할 것으로 예상됩니다. 회사는 세일 기간 중 발생할 수 있는 예상치 못한 동작에 대한 인사이트를 수집해야 합니다.<br><br>DevOps 팀은 세일 기간 중 이상 동작이 감지되면 이러한 인사이트를 검토하고, 이상 동작을 해결하기 위한 권장 조치를 받고자 합니다. 이러한 권장 사항은 향후 발생할 수 있는 문제를 해결하기 위해 프로비저닝된 인프라에 적용되어야 합니다.<br><br>이러한 요구 사항을 최소한의 운영 오버헤드로 충족하는 단계 조합은 무엇일까요? (두 가지를 선택하세요.)`,
  type: 'multi', multiCount: 2,
  choices: [
    { k:'A', en:`Enable Amazon DevOps Guru in the AWS account. Determine the coverage for DevOps Guru for all supported AWS resources in the account. Use the DevOps Guru dashboard to find the analysis, recommendations, and related metrics.`, ko:`AWS 계정에서 Amazon DevOps Guru를 활성화합니다. 계정 내 지원되는 모든 AWS 리소스에 대해 DevOps Guru 적용 범위를 설정합니다. DevOps Guru 대시보드를 사용하여 분석, 권장 사항 및 관련 지표를 확인합니다.` },
    { k:'B', en:`Create an Amazon Simple Notification Service (Amazon SNS) topic. Configure Amazon DevOps Guru to send notifications about important events to the company when anomalies are identified.`, ko:`Amazon Simple Notification Service(Amazon SNS) 토픽을 생성합니다. 이상 징후가 감지될 때 회사에 중요한 이벤트에 대한 알림을 보내도록 Amazon DevOps Guru를 구성합니다.` },
    { k:'C', en:`Create an Amazon S3 bucket. Store Amazon CloudWatch logs, AWS CloudTrail data, and AWS Config data in the S3 bucket. Use Amazon Athena to generate insights on the data. Create a dashboard by using Amazon QuickSight.`, ko:`Amazon S3 버킷을 생성합니다. Amazon CloudWatch 로그, AWS CloudTrail 데이터 및 AWS Config 데이터를 S3 버킷에 저장합니다. Amazon Athena를 사용하여 데이터에 대한 인사이트를 생성합니다. Amazon QuickSight를 사용하여 대시보드를 생성합니다.` },
    { k:'D', en:`Configure email message reports for an Amazon QuickSight dashboard. Schedule and send the email reports to the company.`, ko:`Amazon QuickSight 대시보드용 이메일 메시지 보고서를 구성합니다. 이메일 보고서를 예약하고 회사에 전송합니다.` },
    { k:'E', en:`Create an Amazon Simple Notification Service (Amazon SNS) topic. Configure Amazon Athena to send query results about important events to the company when anomalies are identified.`, ko:`Amazon Simple Notification Service(Amazon SNS) 토픽을 생성합니다. 이상 징후가 감지될 때 중요한 이벤트에 대한 쿼리 결과를 회사에 전송하도록 Amazon Athena를 구성합니다.` },
  ],
  answer: ['A','B'],
  vote: '100% AB',
  explain: `<p><span class="mark-ok">✅ A+B — 핵심 이유</span></p><p>Amazon DevOps Guru는 AWS 리소스의 이상 동작을 ML로 자동 감지하고 대시보드에서 분석·권장 조치를 제공합니다(A). SNS 토픽과 연동하면 이상 감지 시 즉시 알림을 받을 수 있어(B), 별도 로그 파이프라인 구축 없이도 최소 운영 오버헤드로 요구사항을 충족합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ C</span> — S3+Athena+QuickSight 구성은 운영 오버헤드가 크고 실시간 이상 감지가 어렵습니다.</p><p><span class="mark-no">❌ D</span> — 이메일 예약 보고서는 실시간 이상 감지 요건을 충족하지 못합니다.</p><p><span class="mark-no">❌ E</span> — Athena는 쿼리 실행 도구이며 이상 감지 시 자동 알림 기능이 없습니다.</p>`,
  disc: []
},
{
  n: 395,
  en: `A DevOps engineer needs to design a cloud-based solution to standardize deployment artifacts for AWS Cloud deployments and on-premises deployments. There is currently no routing traffic between the on-premises data center and the AWS environment.<br><br>The solution must be able to consume downstream packages from public repositories and must be highly available. Data must be encrypted in transit and at rest. The solution must store the deployment artifacts in object storage and deploy the deployment artifacts into Amazon Elastic Container Service (Amazon ECS). The deployment artifacts must be encrypted in transit if the deployment artifacts travel across the public internet.<br><br>The DevOps engineer needs to deploy this solution in less than two weeks.<br><br>Which solution will meet these requirements?`,
  ko: `DevOps 엔지니어는 AWS 클라우드 배포와 온프레미스 배포를 위한 배포 아티팩트를 표준화하는 클라우드 기반 솔루션을 설계해야 합니다. 현재 온프레미스 데이터 센터와 AWS 환경 간에는 라우팅 트래픽이 없습니다.<br><br>이 솔루션은 퍼블릭 리포지토리에서 다운스트림 패키지를 사용할 수 있어야 하며 고가용성을 보장해야 합니다. 데이터는 전송 중과 저장 시 모두 암호화되어야 합니다. 솔루션은 배포 아티팩트를 객체 스토리지에 저장하고 Amazon Elastic Container Service(Amazon ECS)에 배포해야 합니다. 배포 아티팩트가 공용 인터넷을 통해 전송되는 경우 전송 중에도 암호화되어야 합니다.<br><br>DevOps 엔지니어는 2주 이내에 이 솔루션을 배포해야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'B', en:`Use an AWS Direct Connect connection and a VPN connection to connect the on-premises data center to AWS. Deploy third-party artifact management software on Amazon EC2 instances.`, ko:`AWS Direct Connect 연결과 VPN 연결을 사용하여 온프레미스 데이터 센터를 AWS에 연결합니다. 타사 아티팩트 관리 소프트웨어를 Amazon EC2 인스턴스에 배포합니다.` },
    { k:'C', en:`Use two AWS VPN connections to connect the on-premises data center to AWS. Use AWS CodeArtifact to store the deployment artifacts.`, ko:`온프레미스 데이터 센터를 AWS에 연결하기 위해 두 개의 AWS VPN 연결을 사용합니다. 배포 아티팩트는 AWS CodeArtifact를 사용하여 저장합니다.` },
    { k:'D', en:`Use parallel AWS Direct Connect connections to connect the on-premises data center to AWS. Deploy third-party artifact management software on Amazon EC2 instances.`, ko:`병렬 AWS Direct Connect 연결을 사용하여 온프레미스 데이터 센터를 AWS에 연결합니다. 타사 아티팩트 관리 소프트웨어를 Amazon EC2 인스턴스에 배포합니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — 핵심 이유</span></p><p>AWS CodeArtifact는 완전 관리형 아티팩트 저장소로 퍼블릭 리포지토리 업스트림 연동, 고가용성, 전송 중·저장 시 암호화를 기본 제공합니다. VPN 두 개를 사용하면 고가용성 연결도 확보됩니다. 2주 내 배포 가능하며, 직접 코드 없이 관리형 서비스로 요구사항을 모두 충족합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — Direct Connect 프로비저닝은 수주가 소요되어 2주 내 배포 불가하며, 타사 소프트웨어 설치는 운영 오버헤드를 증가시킵니다.</p><p><span class="mark-no">❌ D</span> — 병렬 Direct Connect 역시 배포 기간 초과 및 타사 소프트웨어 관리 부담이 있습니다.</p>`,
  disc: []
},
{
  n: 396,
  en: `A DevOps engineer successfully creates an Amazon Elastic Kubernetes Service (Amazon EKS) cluster that includes managed node groups. When the DevOps engineer tries to add node groups to the cluster, the cluster returns an error that states, "NodeCreationFailure: Instances failed to join the Kubernetes cluster."<br><br>The DevOps engineer confirms that the EC2 worker nodes are running and that the EKS cluster is in an active state.<br><br>How should the DevOps engineer troubleshoot this issue?`,
  ko: `DevOps 엔지니어가 관리형 노드 그룹이 포함된 Amazon Elastic Kubernetes Service(Amazon EKS) 클러스터를 성공적으로 생성했습니다. 하지만 클러스터에 노드 그룹을 추가하려고 하면 "NodeCreationFailure: 인스턴스가 Kubernetes 클러스터에 참여하지 못했습니다."라는 오류가 발생합니다.<br><br>DevOps 엔지니어는 EC2 워커 노드가 실행 중이고 EKS 클러스터가 활성 상태임을 확인했습니다.<br><br>이 문제를 어떻게 해결해야 할까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Ensure that the EKS cluster's VPC subnets do not overlap with the 172.17.0.0/16 CIDR range.`, ko:`EKS 클러스터의 VPC 서브넷이 172.17.0.0/16 CIDR 범위와 겹치지 않도록 하십시오.` },
    { k:'B', en:`Use kubectl to update the kubeconfig file to use the credentials that created the cluster.`, ko:`kubectl 명령어를 사용하여 클러스터를 생성할 때 사용한 자격 증명을 사용하도록 kubeconfig 파일을 업데이트합니다.` },
    { k:'C', en:`Run the AWSSupport-TroubleshootEKSWorkerNode runbook.`, ko:`AWSSupport-TroubleshootEKSWorkerNode 런북을 실행합니다.` },
    { k:'D', en:`Create an AWS Identity and Access Management (IAM) OpenID Connect (OIDC) provider for the cluster.`, ko:`클러스터용 AWS Identity and Access Management(IAM) OpenID Connect(OIDC) 공급자를 생성합니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — 핵심 이유</span></p><p>"NodeCreationFailure: Instances failed to join the Kubernetes cluster" 오류는 네트워킹, IAM 권한, 사용자 데이터 구성 등 다양한 원인으로 발생할 수 있는 일반적인 오류입니다. AWS는 이 상황을 위해 <code>AWSSupport-TroubleshootEKSWorkerNode</code>라는 Systems Manager 자동화 런북을 제공하며, 가장 일반적인 원인을 자동으로 점검하여 체계적으로 문제를 진단합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CIDR 충돌은 한 가지 특정 원인만 점검하며, 포괄적인 문제 해결에 부족합니다.</p><p><span class="mark-no">❌ B</span> — kubeconfig 자격 증명 문제는 kubectl 접근 오류를 유발하지, 노드 클러스터 합류 실패와는 무관합니다.</p><p><span class="mark-no">❌ D</span> — OIDC 공급자는 서비스 계정용 IAM 역할 연동에 필요하며 노드 합류 실패의 직접적 원인이 아닙니다.</p>`,
  disc: [{ ans:'C', txt:'NodeCreationFailure는 다양한 원인을 가진 포괄적 오류 — AWS 공식 런북으로 체계적 진단이 올바른 접근입니다.' }]
},
{
  n: 397,
  en: `A company is developing an ecommerce application that has a backend that runs on Amazon EC2 instances. The application has a static frontend website that is hosted in an Amazon S3 bucket.<br><br>The company uses a GitHub repository for version control and must automate builds and deployments whenever code is pushed to the main branch. The company must deploy changes to the frontend and backend independently of each other.<br><br>Which solution will meet these requirements?`,
