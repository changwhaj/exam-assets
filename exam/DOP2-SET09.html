{
  n: 417,
  en: `A company's applications run on Amazon EC2 instances and use AWS Lambda functions in multiple AWS accounts. All EC2 instances have the Amazon CloudWatch agent installed. All accounts belong to the same organization in AWS Organizations. The company has created a dedicated central log account.<br><br>All logs that the applications produce must be sent to a central location. The logs must be encrypted with keys that the company manages.<br><br>Which solution meets these requirements with the LEAST operational overhead?`,
  ko: `이 회사의 애플리케이션은 여러 AWS 계정의 Amazon EC2 인스턴스와 AWS Lambda 함수에서 실행됩니다. 모든 EC2 인스턴스에는 Amazon CloudWatch 에이전트가 설치되어 있습니다. 모든 계정은 AWS Organizations에서 동일한 조직에 속해 있습니다. 회사는 전용 중앙 로그 계정을 생성했습니다.<br><br>애플리케이션에서 생성되는 모든 로그는 이 중앙 위치로 전송되어야 합니다. 또한, 로그는 회사가 관리하는 키로 암호화되어야 합니다.<br><br>이러한 요구 사항을 충족하면서 운영 오버헤드를 최소화하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`In the central log account, enable logs as the data source in CloudWatch. Add the organization ID to the source account list. Create a CloudFormation StackSet by using the template provided by CloudWatch to enable central monitoring in all the organization's accounts.`, ko:`중앙 로그 계정에서 CloudWatch의 데이터 소스로 로그를 활성화합니다. 소스 계정 목록에 조직 ID를 추가합니다. CloudWatch에서 제공하는 템플릿을 사용하여 CloudFormation StackSet을 생성하면 조직의 모든 계정에서 중앙 모니터링이 활성화됩니다.` },
    { k:'B', en:`Create an Amazon S3 bucket in the central log account. Create an Amazon Data Firehose stream in the central log account. Set the S3 bucket as the destination of the Firehose stream. Create a log subscription in the central log account. Set the Firehose stream as a target of the subscription. Store the subscription log ARN in AWS Systems Manager Parameter Store for each project to use to send logs to the S3 bucket.`, ko:`중앙 로그 계정에 Amazon S3 버킷을 생성합니다. 중앙 로그 계정에 Amazon Data Firehose 스트림을 생성합니다. S3 버킷을 Firehose 스트림의 대상으로 설정합니다. 중앙 로그 계정에 로그 구독을 생성합니다. Firehose 스트림을 구독의 대상으로 설정합니다. 각 프로젝트의 구독 로그 ARN을 AWS Systems Manager 파라미터 스토어에 저장하여 S3 버킷으로 로그를 전송하는 데 사용합니다.` },
    { k:'C', en:`Create an Amazon S3 bucket in each account. Create an Amazon OpenSearch Service cluster in the central log account. Create an Amazon Simple Queue Service (Amazon SQS) queue in the central log account. Create an S3 trigger that sends events to the SQS queue each time a new file is uploaded to the S3 bucket. Create a Lambda function that processes each file and sends each file to the OpenSearch Service cluster.`, ko:`각 계정에 Amazon S3 버킷을 생성합니다. 중앙 로그 계정에 Amazon OpenSearch Service 클러스터를 생성합니다. 중앙 로그 계정에 Amazon Simple Queue Service(Amazon SQS) 큐를 생성합니다. 새 파일이 S3 버킷에 업로드될 때마다 SQS 큐로 이벤트를 전송하는 S3 트리거를 생성합니다. 각 파일을 처리하고 OpenSearch Service 클러스터로 전송하는 Lambda 함수를 생성합니다.` },
    { k:'D', en:`Create an Amazon S3 bucket in the central log account. Create an Amazon Data Firehose stream in each account. Set the S3 bucket as the destination of the Firehose streams. Create a log subscription in each account with the Firehose streams as a target.`, ko:`중앙 로그 계정에 Amazon S3 버킷을 생성합니다. 각 계정에 Amazon Data Firehose 스트림을 생성합니다. S3 버킷을 Firehose 스트림의 대상으로 설정합니다. 각 계정에 Firehose 스트림을 대상으로 하는 로그 구독을 생성합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>CloudWatch의 <strong>교차 계정 관찰성(Cross-Account Observability)</strong> 기능은 중앙 계정에서 조직 ID를 소스로 추가하고 CloudFormation StackSet으로 모든 계정에 자동 배포하면, 각 계정의 로그가 중앙으로 수집됩니다. 고객 관리형 KMS 키로 CloudWatch Logs 암호화를 구성하여 키 관리 요건도 충족합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ D</span> — 각 계정에 Firehose 스트림을 개별 생성하는 방식은 계정 수에 비례하여 운영 오버헤드가 증가합니다.</p>
<p><span class="mark-no">❌ B</span> — 중앙 계정에만 구독을 생성하는 방식은 소스 계정 로그를 직접 중앙으로 전송하지 못합니다.</p>
<p><span class="mark-no">❌ C</span> — 계정별 S3 + OpenSearch + SQS + Lambda 구조는 과도하게 복잡합니다.</p>`,
  disc: []
},
{
  n: 418,
  en: `A DevOps engineer needs to implement a CI/CD pipeline in an AWS account. The pipeline must consume sensitive database credentials that are stored in an AWS Systems Manager Parameter Store parameter. The Parameter Store parameter is in a separate central account. The DevOps engineer needs to create and integrate the parameter with the CI/CD account.<br><br>Which combination of steps will meet these requirements? (Choose three.)`,
  ko: `DevOps 엔지니어가 AWS 계정에 CI/CD 파이프라인을 구현해야 합니다. 이 파이프라인은 AWS Systems Manager 파라미터 스토어에 저장된 민감한 데이터베이스 자격 증명을 사용해야 합니다. 파라미터 스토어 파라미터는 별도의 중앙 계정에 있습니다. DevOps 엔지니어는 해당 파라미터를 생성하고 CI/CD 계정과 통합해야 합니다.<br><br>다음 단계 중 어떤 조합이 이러한 요구 사항을 충족할까요? (세 가지를 선택하세요.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`Use an advanced tier Parameter Store parameter to store the database credentials in the central AWS account.`, ko:`고급 계층 파라미터 스토어 파라미터를 사용하여 데이터베이스 자격 증명을 중앙 AWS 계정에 저장합니다.` },
    { k:'B', en:`Create an IAM role in the AWS account that hosts the CI/CD pipeline. Add the full ARN of the parameter to the IAM policy that is associated with the IAM role.`, ko:`CI/CD 파이프라인을 호스팅하는 AWS 계정에 IAM 역할을 생성합니다. 해당 IAM 역할과 연결된 IAM 정책에 파라미터의 전체 ARN을 추가합니다.` },
    { k:'C', en:`Use a standard tier Parameter Store parameter to store the database credentials in the central AWS account.`, ko:`표준 계층 파라미터 스토어 파라미터를 사용하여 데이터베이스 자격 증명을 중앙 AWS 계정에 저장합니다.` },
    { k:'D', en:`Use an AWS KMS managed key to encrypt the parameter. Grant decrypt permissions for the KMS key to the AWS account that hosts the CI/CD pipeline.`, ko:`AWS KMS 관리형 키를 사용하여 파라미터를 암호화합니다. CI/CD 파이프라인을 호스팅하는 AWS 계정에 KMS 키에 대한 복호화 권한을 부여합니다.` },
    { k:'E', en:`Use a customer managed AWS KMS key to encrypt the parameter. Grant decrypt permissions for the customer managed key to the AWS account that hosts the CI/CD pipeline.`, ko:`고객 관리형 AWS KMS 키를 사용하여 파라미터를 암호화합니다. CI/CD 파이프라인을 호스팅하는 AWS 계정에 고객 관리형 키에 대한 복호화 권한을 부여합니다.` },
    { k:'F', en:`Create an AWS Resource Access Manager (AWS RAM) resource share in the central AWS account. Share the parameter with the account that hosts the CI/CD pipeline.`, ko:`중앙 AWS 계정에 AWS Resource Access Manager(AWS RAM) 리소스 공유를 생성합니다. CI/CD 파이프라인을 호스팅하는 계정과 파라미터를 공유합니다.` },
  ],
  answer: ['A','E','F'],
  vote: '100% AEF',
  explain: `<p><span class="mark-ok">✅ A+E+F — 핵심 이유</span></p>
<p><strong>A</strong>: 교차 계정 공유는 <strong>고급 계층(Advanced tier)</strong> 파라미터에서만 지원됩니다. 표준 계층은 AWS RAM 공유 불가.</p>
<p><strong>E</strong>: 교차 계정 암호화/복호화에는 <strong>고객 관리형 KMS 키(CMK)</strong>가 필요합니다. AWS 관리형 키는 동일 계정에서만 사용 가능하므로 교차 계정 권한 부여 불가.</p>
<p><strong>F</strong>: AWS RAM을 통해 파라미터를 CI/CD 계정과 공유하면, 해당 계정에서 직접 파라미터 값을 읽을 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ C</span> — 표준 계층 파라미터는 AWS RAM 공유를 지원하지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — AWS 관리형 키(aws/ssm)는 교차 계정 권한 부여가 불가능합니다.</p>
<p><span class="mark-no">❌ B</span> — CI/CD 계정 IAM 역할에 다른 계정 파라미터 ARN을 추가해도 RAM 공유 없이는 접근이 불가합니다.</p>`,
  disc: []
},
{
  n: 419,
  en: `A company is using the AWS Cloud Development Kit (AWS CDK) to develop a microservices-based application. The company needs to create reusable infrastructure components for three environments: development, staging, and production. The components must include networking resources, database resources, and serverless compute resources.<br><br>The company must implement a solution that provides consistent infrastructure across environments while offering the option for environment-specific customizations. The solution also must minimize code duplication.<br><br>Which solution will meet these requirements with the LEAST development overhead?`,
  ko: `한 회사가 AWS 클라우드 개발 키트(AWS CDK)를 사용하여 마이크로서비스 기반 애플리케이션을 개발하고 있습니다. 이 회사는 개발, 스테이징, 프로덕션의 세 가지 환경에서 재사용 가능한 인프라 구성 요소를 구축해야 합니다. 이러한 구성 요소에는 네트워킹 리소스, 데이터베이스 리소스, 서버리스 컴퓨팅 리소스가 포함되어야 합니다.<br><br>회사는 환경별 맞춤 설정 옵션을 제공하면서 환경 전반에 걸쳐 일관된 인프라를 제공하는 솔루션을 구현해야 합니다. 또한 코드 중복을 최소화해야 합니다.<br><br>이러한 요구 사항을 충족하면서 개발 오버헤드를 최소화하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Create custom Level 1 (L1) constructs out of Level 2 (L2) constructs where repeatable patterns exist. Create a single set of deployment stacks that takes the environment name as an argument upon instantiation. Deploy CDK applications for each environment.`, ko:`반복 가능한 패턴이 있는 경우 레벨 2(L2) 구조체를 기반으로 사용자 지정 레벨 1(L1) 구조체를 생성합니다. 인스턴스화 시 환경 이름을 인수로 받는 단일 배포 스택 세트를 생성합니다. 각 환경에 대해 CDK 애플리케이션을 배포합니다.` },
    { k:'B', en:`Create custom Level 1 (L1) constructs out of Level 2 (L2) constructs where repeatable patterns exist. Create separate deployment stacks for each environment. Use the CDK context command to determine which stacks to run when deploying to each environment.`, ko:`반복 가능한 패턴이 있는 경우 레벨 2(L2) 구성 요소를 기반으로 사용자 지정 레벨 1(L1) 구성 요소를 생성합니다. 각 환경에 대해 별도의 배포 스택을 생성합니다. CDK 컨텍스트 명령을 사용하여 각 환경에 배포할 때 실행할 스택을 결정합니다.` },
    { k:'C', en:`Create custom Level 3 (L3) constructs out of Level 2 (L2) constructs where repeatable patterns exist. Create a single set of deployment stacks that takes the environment name as an argument upon instantiation. Deploy CDK applications for each environment.`, ko:`반복 가능한 패턴이 있는 경우 레벨 2(L2) 구조체를 기반으로 사용자 지정 레벨 3(L3) 구조체를 생성합니다. 인스턴스화 시 환경 이름을 인수로 받는 단일 배포 스택 세트를 생성합니다. 각 환경에 대해 CDK 애플리케이션을 배포합니다.` },
    { k:'D', en:`Create custom Level 3 (L3) constructs out of Level 2 (L2) constructs where repeatable patterns exist. Create separate deployment stacks for each environment. Use the CDK context command to determine which stacks to run when deploying to each environment.`, ko:`반복 가능한 패턴이 있는 경우 레벨 2(L2) 구성 요소를 기반으로 사용자 지정 레벨 3(L3) 구성 요소를 생성합니다. 각 환경에 대해 별도의 배포 스택을 생성합니다. CDK 컨텍스트 명령을 사용하여 각 환경에 배포할 때 실행할 스택을 결정합니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — 핵심 이유</span></p>
<p><strong>L3(Level 3) Construct</strong>는 여러 L2 구성 요소를 묶어 완전한 아키텍처 패턴(예: VPC + RDS + Lambda 세트)을 재사용 가능한 단위로 캡슐화합니다. 환경 이름을 인수로 받는 단일 스택 세트를 사용하면 환경별 맞춤 설정이 가능하면서 코드 중복을 최소화합니다.</p>
<p>L1은 CloudFormation 리소스에 직접 매핑되는 저수준 Construct로 재사용성이 낮습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A/B</span> — L2 기반 L1 Construct 생성은 역방향 추상화로 CDK 설계 원칙에 반하며 코드 중복이 증가합니다.</p>
<p><span class="mark-no">❌ D</span> — 환경별 별도 스택 생성은 코드 중복을 유발합니다. 단일 스택 + 환경 인수 방식(C)이 더 효율적입니다.</p>`,
  disc: []
},
{
  n: 420,
  en: `A company runs an application on an Amazon Elastic Container Service (Amazon ECS) service by using the AWS Fargate launch type. The application consumes messages from an Amazon Simple Queue Service (Amazon SQS) queue. The application can take several minutes to process each message from the queue. When the application processes a message, the application reads a file from an Amazon S3 bucket and processes the data in the file. The application writes the processed output to a second S3 bucket. The company uses Amazon CloudWatch Logs to monitor processing errors and to ensure that the application processes messages successfully.<br><br>The SQS queue typically receives a low volume of messages. However, occasionally the queue receives higher volumes of messages. A DevOps engineer needs to implement a solution to reduce the processing time of message bursts.<br><br>Which solution will meet this requirement in the MOST cost-effective way?`,
  ko: `한 회사가 AWS Fargate 시작 유형을 사용하여 Amazon Elastic Container Service(Amazon ECS) 서비스에서 애플리케이션을 실행합니다. 이 애플리케이션은 Amazon Simple Queue Service(Amazon SQS) 큐에서 메시지를 수신합니다. 애플리케이션은 큐에서 메시지를 하나 처리하는 데 몇 분이 소요될 수 있습니다. 메시지를 처리할 때 애플리케이션은 Amazon S3 버킷에서 파일을 읽어 파일의 데이터를 처리합니다. 처리된 출력은 다른 S3 버킷에 저장됩니다. 이 회사는 Amazon CloudWatch Logs를 사용하여 처리 오류를 모니터링하고 애플리케이션이 메시지를 성공적으로 처리하는지 확인합니다.<br><br>SQS 큐는 일반적으로 적은 양의 메시지를 수신하지만, 때때로 많은 양의 메시지가 수신되는 경우가 있습니다. DevOps 엔지니어는 메시지 폭주 시 처리 시간을 단축하는 솔루션을 구현해야 합니다.<br><br>이 요구 사항을 가장 비용 효율적으로 충족하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Register the ECS service as a scalable target in AWS Application Auto Scaling. Configure a target tracking scaling policy to scale the service in response to the queue size.`, ko:`ECS 서비스를 AWS Application Auto Scaling의 확장 가능한 대상으로 등록합니다. 큐 크기에 따라 서비스가 확장되도록 대상 추적 확장 정책을 구성합니다.` },
    { k:'B', en:`Increase the maximum number of messages that Amazon SQS requests to batch messages together. Use long polling to minimize the number of API calls to Amazon SQS during periods of low traffic.`, ko:`Amazon SQS에서 메시지를 일괄 처리할 수 있도록 메시지 요청 최대 개수를 늘립니다. 트래픽이 적은 시간대에는 장기 폴링을 사용하여 Amazon SQS API 호출 횟수를 최소화합니다.` },
    { k:'C', en:`Send messages to an Amazon EventBridge event bus instead of the SQS queue. Replace the ECS service with an EventBridge rule that launches ECS tasks in response to matching events.`, ko:`SQS 큐 대신 Amazon EventBridge 이벤트 버스로 메시지를 보냅니다. ECS 서비스를 일치하는 이벤트에 대한 응답으로 ECS 작업을 시작하는 EventBridge 규칙으로 대체합니다.` },
    { k:'D', en:`Create an Auto Scaling group of EC2 instances. Create a capacity provider in the ECS cluster by using the Auto Scaling group. Change the ECS service to use the EC2 launch type.`, ko:`EC2 인스턴스로 구성된 자동 스케일링 그룹을 생성합니다. 자동 스케일링 그룹을 사용하여 ECS 클러스터에 용량 공급자를 생성합니다. ECS 서비스의 시작 유형을 EC2 인스턴스로 변경합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>Fargate 기반 ECS 서비스를 Application Auto Scaling의 확장 대상으로 등록하고, SQS 대기열 크기(<code>ApproximateNumberOfMessagesVisible</code>)를 기반으로 대상 추적 정책을 설정하면, 메시지 폭주 시 자동으로 태스크가 확장되어 처리 시간을 단축합니다. 평소에는 최소 태스크만 유지하므로 비용 효율적입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 배치 처리와 장기 폴링은 처리 속도를 높이지 않으며 메시지 폭주 문제를 해결하지 못합니다.</p>
<p><span class="mark-no">❌ C</span> — EventBridge로 전환하면 기존 SQS 아키텍처를 전면 변경해야 하며 메시지 처리 시간 보장이 어렵습니다.</p>
<p><span class="mark-no">❌ D</span> — EC2 시작 유형으로 변경하면 인스턴스 관리 오버헤드가 증가하고 Fargate 대비 비용 효율성이 낮아집니다.</p>`,
  disc: []
},
{
  n: 421,
  en: `A global company uses Amazon S3 to host its product catalog website in the us-east-1 Region. The company must improve website performance for users across different geographical regions and must reduce the load on the origin server. The company must implement a highly available cross-Region solution that uses Amazon CloudFront.<br><br>Which solution will meet these requirements with the LEAST operational effort?`,
  ko: `한 글로벌 기업이 Amazon S3를 사용하여 미국 동부 1 리전에 제품 카탈로그 웹사이트를 호스팅하고 있습니다. 이 기업은 지리적으로 다른 지역에 있는 사용자들을 위해 웹사이트 성능을 개선하고 원본 서버의 부하를 줄여야 합니다. 이를 위해 Amazon CloudFront를 활용한 고가용성 크로스 리전 솔루션을 구현해야 합니다.<br><br>이러한 요구 사항을 충족하면서 운영 노력이 가장 적은 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Set up multiple CloudFront distributions. Point each distribution to another S3 bucket in a different Region. Use Amazon Route 53 latency-based routing to direct users to the nearest distribution. Enable S3 replication between the S3 bucket in us-east-1 and the S3 bucket in the different Region.`, ko:`여러 개의 CloudFront 배포를 설정합니다. 각 배포가 다른 리전의 S3 버킷을 가리키도록 설정합니다. Amazon Route 53의 지연 시간 기반 라우팅을 사용하여 사용자를 가장 가까운 배포로 연결합니다. us-east-1 리전의 S3 버킷과 다른 리전의 S3 버킷 간에 S3 복제를 활성화합니다.` },
    { k:'B', en:`Enable CloudFront with Origin Shield in us-east-1. Configure global edge locations. Set up cache behaviors with optimal TTLs for static content and dynamic content. Configure origin failover to an S3 bucket in a different Region. Enable S3 replication between the S3 bucket in us-east-1 and the S3 bucket in the different Region.`, ko:`us-east-1 리전에서 Origin Shield를 사용하여 CloudFront를 활성화합니다. 글로벌 에지 로케이션을 구성합니다. 정적 콘텐츠와 동적 콘텐츠에 대해 최적의 TTL을 설정하여 캐시 동작을 구성합니다. 다른 리전의 S3 버킷으로 오리진 페일오버를 구성합니다. us-east-1 리전의 S3 버킷과 다른 리전의 S3 버킷 간의 S3 복제를 활성화합니다.` },
    { k:'C', en:`Enable CloudFront with Origin Shield in us-east-1. Configure Amazon ElastiCache clusters in multiple Regions to serve as a distributed caching layer between CloudFront and the S3 origin. Set up a replication script to synchronize the S3 bucket in us-east-1 to an S3 bucket in a different Region. Use Amazon EventBridge to schedule the script to run once a day.`, ko:`us-east-1 리전에서 Origin Shield를 사용하여 CloudFront를 활성화합니다. CloudFront와 S3 오리진 간의 분산 캐싱 계층 역할을 하도록 여러 리전에 Amazon ElastiCache 클러스터를 구성합니다. us-east-1 리전의 S3 버킷을 다른 리전의 S3 버킷과 동기화하는 복제 스크립트를 설정합니다. Amazon EventBridge를 사용하여 스크립트가 하루에 한 번 실행되도록 예약합니다.` },
    { k:'D', en:`Enable CloudFront with Origin Shield in the eu-west-1 Region. Configure Regional edge caches. Implement AWS Global Accelerator to route requests to the nearest Regional edge location. Enable S3 replication between the S3 bucket in us-east-1 and an S3 bucket in a different Region.`, ko:`eu-west-1 리전에서 Origin Shield를 사용하여 CloudFront를 활성화합니다. 리전 에지 캐시를 구성합니다. AWS Global Accelerator를 구현하여 요청을 가장 가까운 리전 에지 위치로 라우팅합니다. us-east-1 리전의 S3 버킷과 다른 리전의 S3 버킷 간에 S3 복제를 활성화합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>
<p><strong>Origin Shield</strong>는 CloudFront와 오리진 사이의 추가 캐싱 계층으로 오리진 부하를 최소화합니다. 단일 CloudFront 배포로 글로벌 에지 로케이션을 통해 성능을 개선하고, 오리진 페일오버(S3 복제 포함)로 고가용성을 확보합니다. 여러 배포나 별도 라우팅 설정 없이 단일 구성으로 모든 요건을 충족합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — 여러 CloudFront 배포 + Route 53 라우팅은 관리 복잡성이 증가하며, CloudFront 자체가 이미 글로벌 에지 캐싱을 제공하므로 중복입니다.</p>
<p><span class="mark-no">❌ C</span> — ElastiCache는 S3 정적 콘텐츠 캐싱에 불필요하며, 하루 1회 복제 스크립트는 데이터 최신성을 보장하지 못합니다.</p>
<p><span class="mark-no">❌ D</span> — Origin Shield는 오리진(us-east-1)과 가장 가까운 리전에 배치해야 효과적입니다. eu-west-1 설정은 비효율적입니다.</p>`,
  disc: []
},
{
  n: 422,
  en: `A company is using AWS CodeDeploy to deploy applications to a fleet of Amazon EC2 instances. During a recent deployment, several EC2 instances failed to update successfully.<br><br>A DevOps engineer must investigate the root cause of the failures and must determine which specific deployment lifecycle events encountered errors.<br><br>What is the MOST operationally efficient way to access and analyze the detailed deployment logs for troubleshooting?`,
  ko: `한 회사가 AWS CodeDeploy를 사용하여 Amazon EC2 인스턴스에 애플리케이션을 배포하고 있습니다. 최근 배포 과정에서 여러 EC2 인스턴스가 업데이트에 실패했습니다.<br><br>DevOps 엔지니어는 실패 원인을 조사하고 오류가 발생한 특정 배포 라이프사이클 이벤트를 파악해야 합니다.<br><br>문제 해결을 위해 상세 배포 로그에 접근하고 분석하는 가장 효율적인 방법은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use SSH to connect to each EC2 instance that failed to update successfully. Read the logs from the CodeDeploy agent.`, ko:`SSH를 사용하여 업데이트에 실패한 각 EC2 인스턴스에 연결합니다. CodeDeploy 에이전트에서 로그를 확인합니다.` },
    { k:'B', en:`Use AWS Systems Manager Session Manager to connect to each EC2 instance that failed to update successfully. Read the logs from the CodeDeploy agent.`, ko:`AWS Systems Manager 세션 관리자를 사용하여 업데이트에 실패한 각 EC2 인스턴스에 연결합니다. CodeDeploy 에이전트에서 로그를 확인합니다.` },
    { k:'C', en:`Create an Amazon S3 bucket to store CodeDeploy logs. Update the appspec.yml file to copy logs to the S3 bucket. Query the S3 bucket by using Amazon Athena.`, ko:`CodeDeploy 로그를 저장할 Amazon S3 버킷을 생성합니다. appspec.yml 파일을 수정하여 로그를 S3 버킷으로 복사하도록 합니다. Amazon Athena를 사용하여 S3 버킷을 조회합니다.` },
    { k:'D', en:`Send CodeDeploy agent logs to Amazon CloudWatch Logs by using the CloudWatch agent. Analyze the logs by using CloudWatch Logs Insights.`, ko:`CloudWatch 에이전트를 사용하여 CodeDeploy 에이전트 로그를 Amazon CloudWatch Logs로 전송합니다. CloudWatch Logs Insights를 사용하여 로그를 분석합니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — 핵심 이유</span></p>
<p>CloudWatch 에이전트로 CodeDeploy 에이전트 로그를 CloudWatch Logs로 중앙 수집하면, 여러 인스턴스의 로그를 CloudWatch Logs Insights에서 단일 쿼리로 동시에 분석할 수 있습니다. 인스턴스별 접속 없이 배포 라이프사이클 이벤트 오류를 신속하게 파악하는 가장 효율적인 방법입니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A/B</span> — 인스턴스별 개별 접속은 인스턴스가 많을수록 시간이 오래 걸리며 운영 효율이 낮습니다.</p>
<p><span class="mark-no">❌ C</span> — appspec.yml 수정 후 S3+Athena 구성은 사전 설정이 필요하며 이미 실패한 배포에는 소급 적용이 어렵습니다.</p>`,
  disc: []
},
{
  n: 423,
  en: `A company built its serverless infrastructure on AWS. The infrastructure consists of an Amazon API Gateway REST API, multiple AWS Lambda functions, and Amazon EventBridge.<br><br>The company wants to be aware of any new supply chain attacks that the company's CI/CD pipelines do not catch. The company needs a solution to detect malicious activity in the deployed application.<br><br>Which solution meets these requirements?`,
  ko: `한 회사가 AWS에 서버리스 인프라를 구축했습니다. 이 인프라는 Amazon API Gateway REST API, 여러 AWS Lambda 함수, 그리고 Amazon EventBridge로 구성됩니다.<br><br>이 회사는 CI/CD 파이프라인에서 감지하지 못하는 새로운 공급망 공격을 파악하고자 합니다. 배포된 애플리케이션에서 악성 활동을 탐지할 수 있는 솔루션이 필요합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Enable AWS WAF for the API Gateway REST API. Configure an AWS WAF ACL. Add the known bad inputs managed rule group.`, ko:`API Gateway REST API에 대해 AWS WAF를 활성화합니다. AWS WAF ACL을 구성합니다. 알려진 잘못된 입력 관리형 규칙 그룹을 추가합니다.` },
    { k:'B', en:`Enable Amazon GuardDuty. Enable Lambda Protection. Use EventBridge for event notifications.`, ko:`Amazon GuardDuty를 활성화합니다. Lambda Protection을 활성화합니다. 이벤트 알림을 위해 EventBridge를 사용합니다.` },
    { k:'C', en:`Deploy AWS CloudFormation Guard in the CI/CD pipelines. Write rules to catch the supply chain attacks.`, ko:`CI/CD 파이프라인에 AWS CloudFormation Guard를 배포합니다. 공급망 공격을 탐지하는 규칙을 작성합니다.` },
    { k:'D', en:`Create a firewall in AWS Network Firewall. Configure a policy. Add the managed rule for the Emerging Threats rule group.`, ko:`AWS 네트워크 방화벽에서 방화벽을 생성합니다. 정책을 구성합니다. 신흥 위협 규칙 그룹에 대한 관리형 규칙을 추가합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>
<p>Amazon GuardDuty의 <strong>Lambda Protection</strong>은 Lambda 함수 실행 시 런타임 동작을 모니터링하여 공급망 공격으로 인한 악성 코드 실행, 의심스러운 네트워크 통신 등을 실시간으로 탐지합니다. EventBridge를 통해 탐지 결과를 즉시 알림으로 전송합니다. CI/CD 파이프라인을 우회한 배포 후 공격도 감지 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — AWS WAF는 웹 요청 필터링(입력 검증)용으로, 배포된 Lambda 코드 내 악성 활동은 탐지하지 못합니다.</p>
<p><span class="mark-no">❌ C</span> — CloudFormation Guard는 IaC 템플릿 정적 분석 도구로 런타임 공격 탐지에 부적합합니다.</p>
<p><span class="mark-no">❌ D</span> — Network Firewall은 VPC 트래픽 기반 방화벽으로, 서버리스 Lambda 함수의 런타임 동작 탐지에는 적합하지 않습니다.</p>`,
  disc: []
},
{
  n: 424,
  en: `A company has a stateless web application that is deployed on Amazon EC2 instances. The EC2 instances are in a target group behind an Application Load Balancer (ALB). Amazon Route 53 manages the application domain.<br><br>The company updates the application UI and develops a beta version of the application. The company wants to test the beta version on 10% of its traffic.<br><br>Which solution will meet these requirements with the LEAST number of configuration changes?`,
  ko: `한 회사가 Amazon EC2 인스턴스에 배포된 상태 비저장 웹 애플리케이션을 보유하고 있습니다. 해당 EC2 인스턴스는 애플리케이션 로드 밸런서(ALB) 뒤의 타겟 그룹에 속해 있습니다. Amazon Route 53이 애플리케이션 도메인을 관리합니다.<br><br>회사는 애플리케이션 UI를 업데이트하고 베타 버전을 개발했습니다. 회사는 전체 트래픽의 10%를 대상으로 베타 버전을 테스트하고자 합니다.<br><br>이러한 요구 사항을 충족하면서 구성 변경 횟수를 최소화할 수 있는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Deploy the beta version to new EC2 instances in a new target group. Associate the new target group with a new ALB. Update the existing Route 53 record to use a weighted routing policy. Add a new Route 53 record that points to the new ALB with the same routing policy. Assign a weight of 90 to the existing record. Assign a weight of 10 to the new record.`, ko:`베타 버전을 새 대상 그룹의 새 EC2 인스턴스에 배포합니다. 새 대상 그룹을 새 ALB와 연결합니다. 기존 Route 53 레코드를 가중치 기반 라우팅 정책을 사용하도록 업데이트합니다. 동일한 라우팅 정책을 사용하여 새 ALB를 가리키는 새 Route 53 레코드를 추가합니다. 기존 레코드에 가중치 90을 할당하고, 새 레코드에 가중치 10을 할당합니다.` },
    { k:'B', en:`Deploy the beta version to new EC2 instances in a new target group. Associate the new target group with the same ALB listener rule. Assign a weight of 90 to the existing target group. Assign a weight of 10 to the new target group.`, ko:`새 대상 그룹의 새 EC2 인스턴스에 베타 버전을 배포합니다. 새 대상 그룹을 동일한 ALB 리스너 규칙에 연결합니다. 기존 대상 그룹에는 가중치 90을, 새 대상 그룹에는 가중치 10을 할당합니다.` },
    { k:'C', en:`Refactor the application to implement a feature flag for the beta version by using AWS AppConfig. Use the feature flag to enable the beta version for 10% of the EC2 instances.`, ko:`AWS AppConfig를 사용하여 베타 버전용 기능 플래그를 구현하도록 애플리케이션을 리팩토링합니다. 해당 기능 플래그를 사용하여 EC2 인스턴스의 10%에 대해 베타 버전을 활성화합니다.` },
    { k:'D', en:`Containerize and deploy the application on Amazon Elastic Container Service (Amazon ECS). Use AWS CodeDeploy to deploy the beta version by using the <code>CodeDeployDefault.ECSCanary10Percent15Minutes</code> deployment configuration.`, ko:`애플리케이션을 컨테이너화하고 Amazon Elastic Container Service(Amazon ECS)에 배포합니다. AWS CodeDeploy를 사용하여 <code>CodeDeployDefault.ECSCanary10Percent15Minutes</code> 배포 구성을 이용해 베타 버전을 배포합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>

{
  n: 425,
  en: `A company frequently creates Docker images of an application. The company stores the images in Amazon Elastic Container Registry (Amazon ECR). The company creates both tagged images and untagged images.<br><br>The company wants to implement a solution to automatically delete images that have not been updated for a long time and are not frequently used. The solution must retain at least a specified number of images.<br><br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `한 회사가 애플리케이션의 Docker 이미지를 자주 생성합니다. 이 회사는 생성된 이미지를 Amazon Elastic Container Registry(Amazon ECR)에 저장합니다. 태그가 지정된 이미지와 태그가 지정되지 않은 이미지를 모두 생성합니다.<br><br>이 회사는 오랫동안 업데이트되지 않았거나 사용 빈도가 낮은 이미지를 자동으로 삭제하는 솔루션을 구현하고자 합니다. 단, 최소한 지정된 개수의 이미지는 유지해야 합니다.<br><br>이러한 요구 사항을 충족하면서 운영 오버헤드를 최소화하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Use Amazon S3 Lifecycle policies on the ECR repository to automatically delete images based on image age or the absence of tags on the image.`, ko:`ECR 저장소에서 Amazon S3 수명 주기 정책을 사용하여 이미지 생성 시점 또는 이미지에 태그가 없는 경우를 기준으로 이미지를 자동으로 삭제합니다.` },
    { k:'B', en:`Use Amazon ECR lifecycle policies to delete images based on age or the number of images that need to be retained in the repository.`, ko:`Amazon ECR 수명 주기 정책을 사용하여 이미지 생성 시점 또는 저장소에 보존해야 하는 이미지 수에 따라 이미지를 삭제합니다.` },
    { k:'C', en:`Configure an AWS Lambda function to run a schedule to delete images based on age or the number of images that need to be retained in the repository.`, ko:`AWS Lambda 함수를 구성하여 이미지 생성 시점 또는 저장소에 보존해야 하는 이미지 수에 따라 이미지를 삭제하는 스케줄을 실행합니다.` },
    { k:'D', en:`Use AWS Systems Manager to run a script by using the <code>aws:executeScript</code> action to automatically delete images based on image age or the absence of tags on the image.`, ko:`AWS Systems Manager를 사용하여 <code>aws:executeScript</code> 액션을 실행하여 이미지 생성 시점 또는 이미지에 태그가 없는 경우를 기준으로 이미지를 자동으로 삭제하는 스크립트를 실행합니다.` },

  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>

<p><span class="mark-no">❌ C</span> — Lambda 함수 구현/유지보수는 ECR 수명 주기 정책 대비 운영 오버헤드가 큽니다.</p>

{
  n: 426,
  en: `A company is developing a web application that runs on Amazon EC2 Linux instances. The application requires monitoring of custom performance metrics. The company must collect metrics for API response times and database query latency across multiple instances.<br><br>Which solution will generate the custom metrics with the LEAST operational overhead?`,
  ko: `한 회사가 Amazon EC2 Linux 인스턴스에서 실행되는 웹 애플리케이션을 개발 중입니다. 이 애플리케이션은 사용자 지정 성능 지표 모니터링이 필요합니다. 회사는 여러 인스턴스에 걸쳐 API 응답 시간과 데이터베이스 쿼리 지연 시간에 대한 지표를 수집해야 합니다.<br><br>어떤 솔루션이 운영 오버헤드를 최소화하면서 사용자 지정 지표를 생성할 수 있을까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Install the Amazon CloudWatch agent on the instances. Configure the agent to collect the custom metrics. Instrument the application to send the metrics to the agent.`, ko:`인스턴스에 Amazon CloudWatch 에이전트를 설치합니다. 에이전트가 사용자 지정 메트릭을 수집하도록 구성합니다. 애플리케이션에 계측 기능을 추가하여 메트릭을 에이전트로 전송하도록 합니다.` },
    { k:'B', en:`Use Amazon Managed Service for Prometheus to scrape the custom metrics from the application. Use the Amazon CloudWatch agent to forward the metrics to CloudWatch.`, ko:`Amazon Managed Service for Prometheus를 사용하여 애플리케이션에서 사용자 지정 메트릭을 수집합니다. Amazon CloudWatch 에이전트를 사용하여 해당 메트릭을 CloudWatch로 전달합니다.` },
    { k:'C', en:`Create a custom AWS Lambda function that polls the application endpoints and database at regular intervals. Program the Lambda function to calculate the custom metrics and to send the metrics to Amazon CloudWatch by using PutMetricData API calls.`, ko:`애플리케이션 엔드포인트와 데이터베이스를 정기적으로 폴링하는 사용자 지정 AWS Lambda 함수를 생성합니다. Lambda 함수가 사용자 지정 메트릭을 계산하고 PutMetricData API 호출을 사용하여 해당 메트릭을 Amazon CloudWatch로 전송하도록 프로그래밍합니다.` },
    { k:'D', en:`Implement custom logging in the application code to record the custom metrics. Use Amazon CloudWatch Logs Insights to extract and analyze the metrics.`, ko:`사용자 지정 메트릭을 기록하기 위해 애플리케이션 코드에 사용자 지정 로깅을 구현합니다. Amazon CloudWatch Logs Insights를 사용하여 메트릭을 추출하고 분석합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>CloudWatch 에이전트는 EC2 인스턴스에 설치한 후 <strong>StatsD</strong> 또는 <strong>collectd</strong> 프로토콜을 통해 애플리케이션에서 전송한 사용자 지정 지표(API 응답 시간, DB 쿼리 지연 시간)를 수집하고 CloudWatch로 전송합니다. Systems Manager로 여러 인스턴스에 일괄 배포/구성 가능하여 운영 오버헤드가 최소화됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — Prometheus는 컨테이너/쿠버네티스 환경에 더 적합하며, EC2에서의 추가 구성이 A보다 복잡합니다.</p>
<p><span class="mark-no">❌ C</span> — Lambda 폴링 방식은 실시간성이 낮고, 애플리케이션 내부 지표 수집에 한계가 있습니다.</p>
<p><span class="mark-no">❌ D</span> — 로그 기반 지표 추출은 Logs Insights 쿼리 비용이 발생하고 실시간 알람 설정이 어렵습니다.</p>`,
  disc: []
},
{

  en: `A company uses AWS Lambda functions in the primary operating AWS Region of its AWS account. The company manually created the Lambda functions.<br><br>The company needs to use a Python-based AWS Cloud Development Kit (AWS CDK) application to manage the Lambda functions.<br><br>Which solution meets these requirements with the LEAST implementation effort?`,
  ko: `한 회사가 AWS 계정의 기본 운영 리전에서 AWS Lambda 함수를 사용하고 있습니다. 이 회사는 Lambda 함수를 수동으로 생성했습니다.<br><br>이제 이 Lambda 함수를 관리하기 위해 Python 기반 AWS 클라우드 개발 키트(AWS CDK) 애플리케이션을 사용해야 합니다.<br><br>이러한 요구 사항을 충족하면서 구현 노력이 가장 적은 솔루션은 무엇일까요?`,

    { k:'D', en:`Create a resource inventory by using AWS Config. Filter by the Lambda resource type. Export the inventory to a .csv file. Write an AWS CDK application that references the Lambda functions from the .csv file. For each Lambda function, set the <code>from_asset</code> parameter for the Lambda handler code object.`, ko:`AWS Config를 사용하여 리소스 인벤토리를 생성합니다. Lambda 리소스 유형으로 필터링합니다. 인벤토리를 .csv 파일로 내보냅니다. .csv 파일의 Lambda 함수를 참조하는 AWS CDK 애플리케이션을 작성합니다. 각 Lambda 함수에 대해 Lambda 핸들러 코드 객체의 <code>from_asset</code> 매개변수를 설정합니다.` },

  answer: ['A'],

  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>

{

{

  type: 'single',

    { k:'B', en:`Create an AWS CodeBuild project. Set the public repository as the source. Configure the artifacts section of the project to use the S3 bucket as the destination. Ensure that artifact encryption is enabled in the artifacts configuration. Configure an Amazon EventBridge rule to initiate the CodeBuild project on a daily schedule.`, ko:`AWS CodeBuild 프로젝트를 생성합니다. 소스로 공개 리포지토리를 설정합니다. 프로젝트의 아티팩트 섹션에서 대상으로 S3 버킷을 사용하도록 구성합니다. 아티팩트 구성에서 아티팩트 암호화가 활성화되어 있는지 확인합니다. Amazon EventBridge 규칙을 구성하여 CodeBuild 프로젝트를 매일 실행하도록 합니다.` },
    { k:'C', en:`Add a new stage to the end of the pipeline. Configure the stage to include an action to publish artifacts to the S3 bucket. Update the pipeline to run in response to pull requests to the public repository.`, ko:`파이프라인 끝에 새 단계를 추가합니다. 해당 단계에 S3 버킷에 아티팩트를 게시하는 작업을 포함하도록 구성합니다. 공개 저장소에 대한 풀 요청에 응답하여 파이프라인이 실행되도록 업데이트합니다.` },

  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>공개 저장소와 CodeBuild를 웹훅으로 연결하면 코드 푸시 시 자동으로 빌드가 트리거됩니다. 아티팩트를 S3에 직접 저장하고 <strong>암호화를 비활성화</strong>하면 S3 정적 웹사이트에서 공개적으로 접근 가능합니다(암호화된 객체는 공개 웹사이트에서 직접 제공 불가). 기존 CodePipeline을 수정하지 않고 새 CodeBuild 프로젝트만 추가하므로 운영 오버헤드가 최소화됩니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 암호화 활성화 상태에서는 S3 정적 웹사이트에서 공개 접근이 불가합니다. 또한 EventBridge 일일 스케줄은 코드 변경 즉시 빌드가 불가합니다.</p>
<p><span class="mark-no">❌ C/D</span> — 기존 CodePipeline에 단계를 추가하는 방식은 파이프라인 구조 변경이 필요하며, 공개 저장소 트리거 설정이 복잡합니다.</p>`,
  disc: [{ ans:'A (100%)', txt:'공개 S3 웹사이트 배포 시 암호화 비활성화 필수 — 웹훅 자동화 + CodeBuild 직접 S3 출력이 최소 오버헤드 정답입니다.' }]
},

// ────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────
let curQ = 0;
let state = QS.map(() => ({ sel: [], done: false }));
let curLang = 'ko';

// ────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────
function init() {
  buildSelect();
  renderQ(0);
  // 현재 SET 번호를 콤보박스에 반영
  syncSetSelect();
}

function syncSetSelect() {
  const fileName = window.location.pathname.split('/').pop();
  const match = fileName.match(/set(\d{2})/i);
  if (match) {
    document.getElementById('set-select').value = match[1];
  }
}

function buildSelect() {
  const sel = document.getElementById('q-select');
  sel.innerHTML = '';
  QS.forEach((q, i) => {
    const opt = document.createElement('option');
    opt.value = q.n;
    opt.textContent = `Q${String(q.n).padStart(3,'0')}`;
    sel.appendChild(opt);
  });
}

function updateSelectStatus() {
  const sel = document.getElementById('q-select');
  Array.from(sel.options).forEach((opt, i) => {
    const s = state[i];
    const q = QS[i];
    opt.className = '';
    if (s.done) {
      const correct = arraysEqual(s.sel.slice().sort(), q.answer.slice().sort());
      opt.textContent = `Q${String(q.n).padStart(3,'0')} ${correct ? '✓' : '✗'}`;
      opt.className = correct ? 'opt-correct' : 'opt-wrong';
    } else {
      opt.textContent = `Q${String(q.n).padStart(3,'0')}`;
    }
  });
  sel.value = QS[curQ].n;
}

// ────────────────────────────────────────────────
// RENDER
// ────────────────────────────────────────────────
function renderQ(idx) {
  if (idx < 0 || idx >= QS.length) return;
  curQ = idx;
  const q = QS[idx];
  const s = state[idx];

  // counter / progress
  document.getElementById('progress-fill').style.width = `${((idx+1)/QS.length)*100}%`;
  document.getElementById('q-num-badge').textContent = String(q.n).padStart(3,'0');

  // type badge
  const tb = document.getElementById('q-type-badge');
  if (q.type === 'multi') {
    tb.textContent = `복수 선택 (${q.multiCount}개)`;
    tb.className = 'q-type-badge multi';
  } else {
    tb.textContent = '단일 선택';
    tb.className = 'q-type-badge';
  }

  // question text
  document.getElementById('q-ko-text').innerHTML = q.ko;
  document.getElementById('q-en-text').innerHTML = q.en;

  // choices label
  document.getElementById('choices-label').textContent =
    q.type === 'multi' ? `선택지 — ${q.multiCount}개 선택` : '선택지 — 단일 선택';

  // choices
  const cc = document.getElementById('choices-container');
  cc.innerHTML = '';
  q.choices.forEach(ch => {
    const div = document.createElement('div');
    let cls = 'choice';
    if (s.done) {
      cls += ' disabled';
      if (q.answer.includes(ch.k)) cls += ' correct';
      else if (s.sel.includes(ch.k)) cls += ' wrong';
    } else if (s.sel.includes(ch.k)) {
      cls += ' selected';
    }
    div.className = cls;
    div.id = `choice-${idx}-${ch.k}`;

    let icon = '';
    if (s.done) {
      if (q.answer.includes(ch.k)) icon = '✓';
      else if (s.sel.includes(ch.k)) icon = '✗';
    }

    div.innerHTML = `
      <div class="choice-key">${ch.k}</div>
      <div class="choice-body">
        <div class="choice-text">${ch.ko}</div>
        <div class="choice-en">${ch.en}</div>
      </div>
      <div class="result-icon">${icon}</div>`;

    if (!s.done) div.onclick = () => doSelect(idx, ch.k);
    cc.appendChild(div);
    document.getElementById('btn-prev-top').disabled = idx === 0;
    document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
  });

  applyLang(curLang);

  // review button
  document.getElementById('btn-review').disabled = s.done || s.sel.length === 0;

  // hint
  const hint = document.getElementById('hint-text');
  if (s.done) {
    const correct = arraysEqual(s.sel.slice().sort(), q.answer.slice().sort());
    hint.textContent = correct ? '🎉 정답입니다!' : `❌ 오답입니다. 정답은 ${q.answer.join(', ')} 입니다.`;
  } else if (s.sel.length > 0) {
    const remaining = q.type === 'multi' ? q.multiCount - s.sel.length : 0;
    if (q.type === 'multi' && remaining > 0) {
      hint.textContent = `${s.sel.join(', ')}번 선택됨. ${remaining}개 더 선택하세요.`;
    } else {
      hint.textContent = `${s.sel.join(', ')}번을 선택했습니다. 정답 확인 버튼을 눌러주세요.`;
    }
  } else {
    hint.textContent = '선택지를 클릭하면 정답 확인 버튼이 활성화됩니다.';
  }

  // review panel
  const rp = document.getElementById('review-panel');
  if (s.done) { renderReview(q); rp.classList.add('show'); }
  else rp.classList.remove('show');

  // nav buttons
  document.getElementById('btn-prev-top').disabled = idx === 0;
  document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
  // document.getElementById('nav-info').textContent = `${idx+1} / ${QS.length} 문제`;

  // select 동기화
  updateSelectStatus();
}

function renderReview(q) {
  document.getElementById('review-answer-badge').textContent = '✓ ' + q.answer.join(', ');
  document.getElementById('review-vote-badge').innerHTML = `커뮤니티 투표 <span>${q.vote}</span>`;
  document.getElementById('review-explain').innerHTML = q.explain;

  const ws = document.getElementById('review-wrong');
  const wt = document.getElementById('wrong-section-title');
  if (q.wrong) { ws.innerHTML = q.wrong; ws.style.display=''; wt.style.display=''; }
  else { ws.style.display='none'; wt.style.display='none'; }

  const dl = document.getElementById('disc-list');
  dl.innerHTML = '';
  dl.classList.remove('show');
  (q.disc||[]).forEach(d => {
    dl.innerHTML += `<div class="disc-item"><div class="disc-ans">${d.ans}</div>${d.txt}</div>`;
  });
}

// ────────────────────────────────────────────────
// INTERACTION
// ────────────────────────────────────────────────
function doSelect(idx, key) {
  const q = QS[idx];
  const s = state[idx];
  if (s.done) return;
  if (q.type === 'single') {
    s.sel = [key];
  } else {
    const pos = s.sel.indexOf(key);
    if (pos >= 0) s.sel.splice(pos, 1);
    else if (s.sel.length < q.multiCount) s.sel.push(key);
  }
  renderQ(idx);
}

function doReview() {
  const s = state[curQ];
  if (s.sel.length === 0 || s.done) return;
  s.done = true;
  renderQ(curQ);
  document.getElementById('review-panel').scrollIntoView({behavior:'smooth',block:'start'});
}

function doReset() {
  state[curQ] = { sel: [], done: false };
  renderQ(curQ);
}

function goQ(idx) {
  idx = parseInt(idx);
  if (isNaN(idx) || idx < 0 || idx >= QS.length) return;
  renderQ(idx);
  window.scrollTo({top:0, behavior:'smooth'});
}

function goQWithReset(idx) {
  idx = parseInt(idx);
  if (isNaN(idx) || idx < 0 || idx >= QS.length) return;

  // 🔥 언어 강제 한국어
  curLang = 'ko';
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.lang-tab')[0].classList.add('active');

  // 🔥 해당 문제 상태 초기화
  state[idx] = { sel: [], done: false };

  renderQ(idx);
  window.scrollTo({top:0, behavior:'smooth'});
  document.getElementById('btn-prev-top').disabled = idx === 0;
  document.getElementById('btn-next-top').disabled = idx === QS.length - 1;
}

// ────────────────────────────────────────────────
// LANG  (한국어 / 양국어)
// ────────────────────────────────────────────────
function setLang(lang, btn) {
  curLang = lang;
  document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  applyLang(lang);
}

function applyLang(lang) {
  // 문제 영어 텍스트 — 'both'일 때 block으로 명시해야 CSS display:none을 덮어씀
  const enQ = document.getElementById('q-en-text');
  enQ.style.display = (lang === 'both') ? 'block' : 'none';
  // 선택지 영어 텍스트
  document.querySelectorAll('.choice-en').forEach(e => {
    e.style.display = (lang === 'both') ? 'block' : 'none';
  });
}

// ────────────────────────────────────────────────
// THEME
// ────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('theme-icon').textContent = dark ? '☀️' : '🌙';
  document.getElementById('theme-label').textContent = dark ? '라이트' : '다크';
}

// ────────────────────────────────────────────────
// UTILS
// ────────────────────────────────────────────────
function arraysEqual(a, b) {
  return a.length === b.length && a.every((v,i) => v === b[i]);
}

init();
</script>
</body>
</html>
