<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS DOP-C02 | SET 09 (Q401~Q429)</title>
<style>
[data-theme="dark"] {
  --bg:#0f1117; --surface:#1a1d27; --surface2:#222636; --border:#2e3347;
  --accent:#4f8ef7; --accent2:#38c9a0; --text:#e2e6f0; --text-muted:#7a83a0;
  --correct-bg:#112a22; --wrong-bg:#2a1111; --explain-bg:#1e2030;
  --hover-bg:#1e2236; --sel-bg:#1b2540;
}
[data-theme="light"] {
  --bg:#f0f2f8; --surface:#ffffff; --surface2:#f5f6fa; --border:#d0d5e8;
  --accent:#2e6fe0; --accent2:#1aaa7e; --text:#1a1d2e; --text-muted:#5a6280;
  --correct-bg:#e6faf4; --wrong-bg:#fde8e8; --explain-bg:#f0f2fa;
  --hover-bg:#eaf1ff; --sel-bg:#ddeaff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard','Noto Sans KR','Segoe UI',sans-serif;font-size:15px;line-height:1.75;min-height:100vh;transition:background .25s,color .25s;}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 60px;}

/* Topbar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}

/* ── SET 선택 콤보박스 ── */
.set-select-wrap{position:relative;display:inline-flex;align-items:center;}
.set-select{
  appearance:none;-webkit-appearance:none;
  background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  border:none;border-radius:20px;
  color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;
  padding:4px 28px 4px 12px;
  cursor:pointer;outline:none;
  transition:filter .2s,transform .1s;
  white-space:nowrap;
}
.set-select:hover{filter:brightness(1.12);transform:translateY(-1px);}
.set-select:focus{filter:brightness(1.08);outline:2px solid rgba(255,255,255,.5);outline-offset:2px;}
.set-select option{background:#1a1d27;color:#e2e6f0;font-size:13px;font-weight:600;}
/* 화살표 아이콘 */
.set-select-wrap::after{
  content:'▾';
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:#fff;font-size:10px;pointer-events:none;
}

.badge{background:linear-gradient(135deg,#4f8ef7,#38c9a0);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 12px;border-radius:20px;white-space:nowrap;}
.topbar-title{font-size:13px;color:var(--text-muted);flex:1;min-width:120px;}
.topbar-title strong{color:var(--text);font-size:15px;display:block;}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}

/* 문제 선택 콤보박스 */
.q-select-wrap{display:flex;align-items:center;gap:6px;}
.q-select-label{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.q-select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-weight:600;padding:5px 10px;cursor:pointer;outline:none;transition:border-color .2s;}
.q-select:focus,.q-select:hover{border-color:var(--accent);}
.q-select option.opt-correct{color:#1aaa7e;}
.q-select option.opt-wrong{color:#e05252;}

/* 상단 네비 버튼 + 문제 콤보 높이 통일 */
.topbar-right .btn-nav,
.topbar-right .q-select {
  height: 24px;
  padding: 0 14px;
  font-size: 13px;
}

/* 테마 버튼 */
.theme-btn{background:var(--surface2);border:1px solid var(--border);border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text-muted);transition:border-color .2s,color .2s;white-space:nowrap;}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}

/* Progress */
.progress-bar{background:var(--surface2);border-radius:4px;height:6px;margin-bottom:20px;overflow:hidden;}
.progress-fill{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:4px;transition:width .4s;}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:16px;transition:background .25s,border-color .25s;}

/* Lang Tabs */
.lang-tabs{display:flex;gap:8px;margin-bottom:20px;}
.lang-tab{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.04em;padding:5px 14px;transition:all .2s;}
.lang-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.lang-tab:hover:not(.active){border-color:var(--accent);color:var(--accent);}

/* Q Label */
.q-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-bottom:10px;}
.q-type-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:10px;margin-left:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);vertical-align:middle;}
.q-type-badge.multi{background:#ede9ff;color:#6d28d9;border-color:#c4b5fd;}
[data-theme="dark"] .q-type-badge.multi{background:#2a1f50;color:#a78bfa;border-color:#4c3a8c;}

/* Q Text */
.q-text{font-size:15px;color:var(--text);line-height:1.85;}
.q-text.en-text{
  font-size:14px;color:var(--text-muted);
  margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--border);
}
.q-text code{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:13px;font-family:'JetBrains Mono','Fira Code',monospace;color:var(--accent2);}

/* Choices */
.choices-section{margin-top:24px;}
.choices-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px;}
.choice{display:flex;align-items:flex-start;gap:14px;background:var(--surface2);border:2px solid var(--border);border-radius:10px;cursor:pointer;margin-bottom:10px;padding:14px 18px;transition:border-color .2s,background .2s;user-select:none;}
.choice:hover{border-color:var(--accent);background:var(--hover-bg);}
.choice.selected{border-color:var(--accent);background:var(--sel-bg);}
.choice.correct{border-color:#38c9a0!important;background:var(--correct-bg)!important;}
.choice.wrong{border-color:#f76f6f!important;background:var(--wrong-bg)!important;}
.choice.disabled{cursor:default;pointer-events:none;}
.choice-key{background:var(--border);border-radius:6px;color:var(--text);font-size:13px;font-weight:700;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:background .2s,color .2s;}
.choice.selected .choice-key{background:var(--accent);color:#fff;}
.choice.correct .choice-key{background:#38c9a0;color:#000;}
.choice.wrong .choice-key{background:#f76f6f;color:#fff;}
.choice-body{flex:1;}
.choice-text{font-size:14px;line-height:1.75;}
.choice-en{font-size:12px;color:var(--text-muted);margin-top:5px;display:none;font-style:italic;}
.result-icon{margin-left:auto;font-size:18px;flex-shrink:0;display:none;}
.choice.correct .result-icon,.choice.wrong .result-icon{display:block;}

/* Actions */
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center;}
.btn{border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.03em;padding:11px 24px;transition:opacity .2s,transform .1s;}
.btn:hover:not(:disabled){opacity:.88;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-nav{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:11px 18px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.hint-text{font-size:12px;color:var(--text-muted);margin-top:8px;min-height:18px;}

/* Review Panel */
.review-panel{display:none;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent2);border-radius:12px;padding:24px 28px;margin-bottom:16px;animation:fadeIn .35s ease;transition:background .25s;}
.review-panel.show{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.answer-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.answer-label{font-size:13px;color:var(--text-muted);}
.answer-badge{background:#38c9a0;color:#000;font-size:13px;font-weight:800;padding:4px 14px;border-radius:20px;}
.vote-badge{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);font-size:12px;padding:3px 10px;border-radius:20px;}
.vote-badge span{color:var(--accent);font-weight:700;}
.section-title{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent2);text-transform:uppercase;margin-bottom:10px;}
.explain-box{background:var(--explain-bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;font-size:14px;line-height:1.8;color:var(--text);}
.explain-box p{margin-bottom:8px;}
.explain-box p:last-child{margin-bottom:0;}
.mark-ok{color:#38c9a0;font-weight:700;}
.mark-no{color:#f76f6f;font-weight:600;}

/* Discussion */
.disc-toggle{background:transparent;border:1px dashed var(--border);border-radius:8px;color:var(--text-muted);cursor:pointer;font-size:13px;margin-top:8px;padding:9px 16px;width:100%;text-align:left;transition:border-color .2s,color .2s;}
.disc-toggle:hover{border-color:var(--accent);color:var(--accent);}
.disc-list{display:none;margin-top:10px;}
.disc-list.show{display:block;}
.disc-item{background:var(--surface2);border-left:3px solid var(--border);border-radius:0 6px 6px 0;font-size:13px;margin-bottom:8px;padding:10px 14px;color:var(--text-muted);line-height:1.7;}
.disc-ans{color:var(--accent);font-weight:700;font-size:12px;margin-bottom:3px;}

/* Bottom Nav */
.nav-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px;}
.nav-info{font-size:13px;color:var(--text-muted);text-align:center;flex:1;}

@media(max-width:600px){
  .card{padding:16px;}
  .btn{padding:10px 16px;font-size:13px;}
  .topbar{gap:8px;}
  .topbar-right{gap:6px;}
}

/* ── 패스워드 모달 ── */
.pw-overlay{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  /* 배경 블러 */
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  background:rgba(10,12,22,.55);
  transition:opacity .3s;
}
.pw-overlay.hidden{
  opacity:0;pointer-events:none;
}
.pw-modal{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 24px 64px rgba(0,0,0,.35);
  padding:40px 36px 34px;
  width:min(400px,90vw);
  display:flex;flex-direction:column;align-items:center;gap:0;
  animation:pwSlideIn .35s cubic-bezier(.22,.9,.36,1) both;
}
@keyframes pwSlideIn{
  from{opacity:0;transform:translateY(28px) scale(.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.pw-logo{
  width:54px;height:54px;border-radius:14px;
  background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;margin-bottom:20px;
  box-shadow:0 8px 24px rgba(79,142,247,.35);
}
.pw-title{
  font-size:18px;font-weight:800;color:var(--text);
  letter-spacing:-.01em;margin-bottom:6px;text-align:center;
}
.pw-sub{
  font-size:13px;color:var(--text-muted);margin-bottom:28px;text-align:center;line-height:1.6;
}
.pw-input-wrap{
  position:relative;width:100%;margin-bottom:14px;
}
.pw-input{
  width:100%;
  background:var(--surface2);
  border:2px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-size:16px;font-weight:700;
  letter-spacing:.15em;
  padding:13px 46px 13px 18px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
  text-align:center;
}
.pw-input::placeholder{letter-spacing:normal;font-weight:400;font-size:14px;}
.pw-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,142,247,.18);}
.pw-input.shake{animation:pwShake .38s ease;}
.pw-input.error{border-color:#f76f6f;box-shadow:0 0 0 3px rgba(247,111,111,.18);}
@keyframes pwShake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-6px);}
  80%{transform:translateX(6px);}
}
.pw-toggle{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:var(--text-muted);font-size:18px;padding:2px 4px;
  transition:color .2s;
}
.pw-toggle:hover{color:var(--accent);}
.pw-error-msg{
  font-size:12px;color:#f76f6f;font-weight:600;
  min-height:18px;margin-bottom:18px;text-align:center;
  transition:opacity .2s;
}
.pw-btn{
  width:100%;background:linear-gradient(135deg,#4f8ef7,#38c9a0);
  border:none;border-radius:10px;color:#fff;
  font-size:15px;font-weight:800;letter-spacing:.04em;
  padding:14px;cursor:pointer;
  transition:filter .2s,transform .1s,box-shadow .2s;
  box-shadow:0 6px 20px rgba(79,142,247,.3);
}
.pw-btn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 8px 28px rgba(79,142,247,.4);}
.pw-btn:active{transform:translateY(0);}
.pw-footer{
  font-size:11px;color:var(--text-muted);margin-top:20px;text-align:center;
}
</style>
</head>
<body>

<!-- ── 패스워드 모달 ── -->
<div class="pw-overlay" id="pw-overlay">
  <div class="pw-modal" role="dialog" aria-modal="true" aria-labelledby="pw-title">
    <div class="pw-logo">🔐</div>
    <div class="pw-title" id="pw-title">학습 콘텐츠 잠금</div>
    <div class="pw-sub">AWS DOP-C02 학습 자료에 접근하려면<br>패스워드를 입력해 주세요.</div>

    <div class="pw-input-wrap">
      <input
        class="pw-input" id="pw-input"
        type="password" placeholder="패스워드 입력"
        maxlength="20"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter') checkPw()"
      />
      <button class="pw-toggle" id="pw-toggle" onclick="togglePwVisible()" tabindex="-1" title="표시/숨김">👁</button>
    </div>

    <div class="pw-error-msg" id="pw-error"></div>

    <button class="pw-btn" onclick="checkPw()">확인</button>

    <div class="pw-footer">🍪 인증 후 쿠키에 저장되어 다음 방문 시 자동 로그인됩니다.</div>
  </div>
</div>

<div class="wrap">

  <!-- Topbar -->
  <div class="topbar">

    <!-- ── SET 선택 콤보박스 (badge 대체) ── -->
    <div class="set-select-wrap">
      <select class="set-select" id="set-select" onchange="goSet(this.value)">
        <option value="01" selected>DOP-C02 · SET 01</option>
        <option value="02">DOP-C02 · SET 02</option>
        <option value="03">DOP-C02 · SET 03</option>
        <option value="04">DOP-C02 · SET 04</option>
        <option value="05">DOP-C02 · SET 05</option>
        <option value="06">DOP-C02 · SET 06</option>
        <option value="07">DOP-C02 · SET 07</option>
        <option value="08">DOP-C02 · SET 08</option>
        <option value="09">DOP-C02 · SET 09</option>
      </select>
    </div>

    <div class="topbar-title">
      <strong>AWS Certified DevOps Engineer – Professional</strong>
      SET 09 · Q401~Q429 실전 학습
    </div>
    <div class="topbar-right">
      <!-- 상단 네비게이션 -->
      <button class="btn btn-nav" onclick="goQWithReset(curQ-1)" id="btn-prev-top">←</button>

      <!-- 문제 선택 콤보박스 -->
      <div class="q-select-wrap">
        <select class="q-select" id="q-select" onchange="goQWithReset(this.value-401)"></select>
      </div>
      <button class="btn btn-nav" onclick="goQWithReset(curQ+1)" id="btn-next-top">→</button>

      <!-- 테마 토글 -->
      <button class="theme-btn" onclick="toggleTheme()">
        <span id="theme-icon">☀️</span>
        <span id="theme-label">라이트</span>
      </button>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:5%"></div></div>

  <!-- Language Tabs -->
  <div class="lang-tabs">
    <button class="lang-tab active" onclick="setLang('ko',this)">한국어</button>
    <button class="lang-tab" onclick="setLang('both',this)">양국어</button>
  </div>

  <!-- Question Card -->
  <div class="card" id="q-card">
    <div class="q-label">
      문제 <span id="q-num-badge">001</span>
      <span id="q-type-badge" class="q-type-badge">단일 선택</span>
    </div>
    <!-- 한국어 문제 -->
    <div class="q-text" id="q-ko-text"></div>
    <!-- 영어 문제 (양국어 모드) -->
    <div class="q-text en-text" id="q-en-text"></div>

    <div class="choices-section">
      <div class="choices-label" id="choices-label">선택지</div>
      <div id="choices-container"></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btn-review" onclick="doReview()" disabled>📋 정답 확인</button>
      <button class="btn btn-secondary" onclick="doReset()">↺ 초기화</button>
    </div>
    <div class="hint-text" id="hint-text">선택지를 클릭하면 정답 확인 버튼이 활성화됩니다.</div>
  </div>

  <!-- Review Panel -->
  <div class="review-panel" id="review-panel">
    <div class="answer-row">
      <span class="answer-label">정답</span>
      <span class="answer-badge" id="review-answer-badge"></span>
      <span class="vote-badge" id="review-vote-badge"></span>
    </div>
    <div class="section-title">✦ 정답 해설</div>
    <div class="explain-box" id="review-explain"></div>
    <div class="section-title" style="margin-top:14px;" id="wrong-section-title">✦ 오답 분석</div>
    <div class="explain-box" id="review-wrong"></div>
    <button class="disc-toggle" onclick="document.getElementById('disc-list').classList.toggle('show')">💬 주요 토론 의견 보기 / 숨기기</button>
    <div class="disc-list" id="disc-list"></div>
  </div>

  <!-- Bottom Nav -->
  <!-- <div class="nav-bottom">
    <button class="btn btn-nav" onclick="goQ(curQ-1)" id="btn-prev">← 이전</button>
    <span class="nav-info" id="nav-info"></span>
    <button class="btn btn-nav" onclick="goQ(curQ+1)" id="btn-next">다음 →</button>
  </div> -->

</div>
<script>
// ────────────────────────────────────────────────
// 패스워드 / 쿠키 인증
// ────────────────────────────────────────────────
const PW_CORRECT  = 'DOP2';
const COOKIE_NAME = 'dop2_auth';
const COOKIE_DAYS = 30; // 쿠키 유효기간 (일)

function getCookie(name) {
  const cookies = document.cookie.split(';');
  for (let c of cookies) {
    const [k, v] = c.trim().split('=');
    if (k === name) return decodeURIComponent(v || '');
  }
  return null;
}

function setCookie(name, value, days) {
  const expires = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${expires};path=/;SameSite=Lax`;
}

function unlockPage() {
  const overlay = document.getElementById('pw-overlay');
  overlay.classList.add('hidden');
  // 완전히 숨긴 뒤 DOM에서 제거
  overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
}

function checkPw() {
  const input = document.getElementById('pw-input');
  const errEl = document.getElementById('pw-error');
  const val   = input.value.trim();

  if (val === PW_CORRECT) {
    setCookie(COOKIE_NAME, PW_CORRECT, COOKIE_DAYS);
    errEl.textContent = '';
    input.classList.remove('error');
    unlockPage();
  } else {
    errEl.textContent = '❌ 패스워드가 올바르지 않습니다. 다시 입력해 주세요.';
    input.classList.add('error', 'shake');
    input.select();
    input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
  }
}

function togglePwVisible() {
  const input  = document.getElementById('pw-input');
  const toggle = document.getElementById('pw-toggle');

// 실제 환경에 맞게 URL 패턴을 수정하세요.
// ────────────────────────────────────────────────
function goSet(setNum) {
  // 현재 페이지 파일명에서 set 번호만 교체
  const currentPath = window.location.pathname;
  const fileName = currentPath.split('/').pop(); // e.g. "DOP2-SET01.html"

  let newFileName;
  if (fileName && fileName.match(/DOP2-SET\d{2}/i)) {
    // 파일명에서 set 번호 교체
    newFileName = fileName.replace(/SET\d{2}/i, `SET${setNum}`);
  } else {
    // 파일명 패턴을 찾지 못한 경우 기본 패턴 사용
    newFileName = `DOP2-SET${setNum}.html`;
  }

  const newPath = currentPath.replace(fileName, newFileName);
  window.location.href = newPath;
}

<p><strong>A</strong>: S3 RTC(Replication Time Control)는 15분 SLA 내 복제를 보장합니다 — 15분 이내 복제 요건의 핵심입니다.</p>
<p><strong>B</strong>: S3 멀티 리전 액세스 포인트를 액티브-패시브로 생성하면 단일 엔드포인트로 장애 조치를 관리할 수 있습니다.</p>
<p><strong>C</strong>: <code>SubmitMultiRegionAccessPointRoutes</code> API로 트래픽 라우팅을 두 번째 리전으로 전환하여 장애 조치를 완료합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ D</span> — S3 Transfer Acceleration은 업로드 속도를 높이는 기능으로, 복제 시간 보장과는 무관합니다.</p>
<p><span class="mark-no">❌ E/F</span> — Route 53 Application Recovery Controller는 DNS/로드밸런서 기반 장애 조치 도구로, S3 버킷 직접 라우팅에는 적합하지 않습니다. S3 멀티 리전 액세스 포인트의 라우팅 API(C)가 더 적합합니다.</p>`,
  disc: []
},
{
  n: 405,
  en: `A company is developing a mobile app that requires extensive automated testing across multiple device types. The company is using AWS CodePipeline for its CI/CD pipeline.<br><br>The company must implement a scalable testing solution that can handle increased test loads as the app grows.<br><br>Which solution will meet these requirements with the LEAST management overhead?`,
  ko: `한 회사가 다양한 기기 유형에 걸쳐 광범위한 자동화 테스트가 필요한 모바일 앱을 개발 중입니다. 이 회사는 CI/CD 파이프라인에 AWS CodePipeline을 사용하고 있습니다.<br><br>앱 규모가 커짐에 따라 테스트 부하 증가를 처리할 수 있는 확장 가능한 테스트 솔루션을 구현해야 합니다.<br><br>이러한 요구 사항을 충족하면서 관리 오버헤드가 가장 적은 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Integrate AWS Device Farm with the pipeline to run the tests and scale as needed.`, ko:`AWS Device Farm을 파이프라인에 통합하여 테스트를 실행하고 필요에 따라 확장합니다.` },
    { k:'B', en:`Deploy a fleet of Amazon EC2 instances with various mobile device emulators and auto scaling to run the tests. Create a custom AWS Lambda function to invoke EC2 test runs.`, ko:`다양한 모바일 장치 에뮬레이터와 자동 스케일링을 사용하여 Amazon EC2 인스턴스를 배포하고 테스트를 실행합니다. EC2 테스트 실행을 호출하는 사용자 지정 AWS Lambda 함수를 생성합니다.` },
    { k:'C', en:`Implement a containerized testing solution that uses Amazon Elastic Container Service (Amazon ECS) with auto scaling. Configure the pipeline to invoke an AWS Lambda function to start the test runs on the ECS cluster.`, ko:`자동 스케일링 기능을 갖춘 Amazon Elastic Container Service(Amazon ECS)를 사용하는 컨테이너 기반 테스트 솔루션을 구현합니다. 파이프라인이 AWS Lambda 함수를 호출하여 ECS 클러스터에서 테스트 실행을 시작하도록 구성합니다.` },
    { k:'D', en:`Use AWS Lambda functions with custom runtime emulators to run the tests. Integrate the Lambda functions with the pipeline.`, ko:`사용자 지정 런타임 에뮬레이터를 사용하는 AWS Lambda 함수를 이용하여 테스트를 실행합니다. Lambda 함수를 파이프라인에 통합합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>AWS Device Farm은 실제 물리 기기 및 에뮬레이터에서 모바일 앱을 테스트할 수 있는 완전 관리형 서비스입니다. CodePipeline과 직접 통합되며, 테스트 부하에 따라 자동으로 확장됩니다. 인프라 관리가 필요 없어 관리 오버헤드가 가장 적습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — EC2 + 에뮬레이터 + Lambda 조합은 인프라 프로비저닝/관리 오버헤드가 매우 큽니다.</p>
<p><span class="mark-no">❌ C</span> — ECS 컨테이너는 실제 모바일 디바이스 환경 재현에 한계가 있으며 관리 복잡성도 높습니다.</p>
<p><span class="mark-no">❌ D</span> — Lambda의 런타임 제한(15분, 메모리)으로 모바일 앱 테스트에는 부적합합니다.</p>`,
  disc: []
},
{
  n: 406,
  en: `A company has an application that streams logs to an Amazon CloudWatch Logs log group. The logs must be available for the team to search in CloudWatch for at least 30 days. Logs must be accessible with low latency for at least 90 days. After 180 days, log retrieval is rare and latency is not important.<br><br>A DevOps engineer creates an Amazon S3 bucket to store the logs. Log availability metrics and data protection are important to the company.<br><br>Which solution will meet these requirements in the MOST cost-effective way?`,
  ko: `한 회사의 애플리케이션은 Amazon CloudWatch Logs 로그 그룹으로 로그를 스트리밍합니다. 팀에서 CloudWatch에서 로그를 검색할 수 있도록 최소 30일 동안 로그를 이용할 수 있어야 합니다. 또한 최소 90일 동안은 낮은 지연 시간으로 로그에 접근할 수 있어야 합니다. 180일 이후에는 로그 검색 빈도가 낮아 지연 시간은 중요하지 않습니다.<br><br>DevOps 엔지니어는 로그 저장을 위해 Amazon S3 버킷을 생성합니다. 로그 가용성 지표와 데이터 보호는 회사에 매우 중요합니다.<br><br>이러한 요구 사항을 가장 비용 효율적으로 충족하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure the log group to have a retention period of 30 days and to use the infrequent access log class. Create a CloudWatch metric stream that uses Amazon Kinesis Data Streams to send log events to the S3 bucket. Create an S3 Lifecycle policy to move objects to Amazon S3 Standard-Infrequent Access (S3 Standard-IA) after 90 days and to Amazon Glacier Flexible Retrieval after 180 days.`, ko:`로그 그룹의 보존 기간을 30일로 설정하고, '간헐적 액세스' 로그 클래스를 사용하도록 구성합니다. Amazon Kinesis Data Streams를 사용하여 로그 이벤트를 S3 버킷으로 전송하는 CloudWatch 메트릭 스트림을 생성합니다. 90일 후에는 객체를 Amazon S3 Standard-IA(간헐적 액세스)로, 180일 후에는 Amazon Glacier Flexible Retrieval로 이동하는 S3 수명 주기 정책을 생성합니다.` },
    { k:'B', en:`Configure the log group to have a retention period of 30 days and to use the infrequent access log class. Create a CloudWatch metric stream that uses Amazon Data Firehose to send log events to the S3 bucket. Create an S3 Lifecycle policy to move objects to Amazon S3 One Zone-Infrequent Access (S3 One Zone-IA) after 90 days and to Amazon S3 Glacier Flexible Retrieval after 180 days.`, ko:`로그 그룹의 보존 기간을 30일로 설정하고, '간헐적 액세스' 로그 클래스를 사용하도록 구성합니다. Amazon Data Firehose를 사용하여 로그 이벤트를 S3 버킷으로 전송하는 CloudWatch 메트릭 스트림을 생성합니다. 90일 후에는 객체를 Amazon S3 One Zone-Infrequent Access(S3 One Zone-IA)로, 180일 후에는 Amazon S3 Glacier Flexible Retrieval로 이동하는 S3 수명 주기 정책을 생성합니다.` },
    { k:'C', en:`Configure the log groups to have a retention period of 30 days. Create a CloudWatch subscription filter that uses Amazon Kinesis Data Streams to send log events to the S3 bucket by writing files. Create an S3 Lifecycle policy to move objects to Amazon S3 Standard-Infrequent Access (S3 Standard-IA) after 90 days and to Amazon S3 Glacier Instant Retrieval after 180 days.`, ko:`로그 그룹의 보존 기간을 30일로 구성합니다. Amazon Kinesis Data Streams를 사용하여 로그 이벤트를 파일에 기록하는 CloudWatch 구독 필터를 생성합니다. 90일 후에는 객체를 Amazon S3 Standard-IA(S3 Standard-Infrequent Access)로, 180일 후에는 Amazon S3 Glacier Instant Retrieval로 이동하는 S3 수명 주기 정책을 생성합니다.` },
    { k:'D', en:`Configure the log groups to have a retention period of 30 days. Create a CloudWatch subscription filter that uses Amazon Data Firehose to send log events to the S3 bucket. Create an S3 Lifecycle policy to move objects to Amazon S3 Standard-Infrequent Access (S3 Standard-IA) after 90 days and to Amazon S3 Glacier Deep Archive after 180 days.`, ko:`로그 그룹의 보존 기간을 30일로 구성합니다. Amazon Data Firehose를 사용하여 로그 이벤트를 S3 버킷으로 전송하는 CloudWatch 구독 필터를 생성합니다. 90일 후 객체를 Amazon S3 Standard-IA(S3 Standard-Infrequent Access)로, 180일 후 Amazon S3 Glacier Deep Archive로 이동하는 S3 수명 주기 정책을 생성합니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — 핵심 이유</span></p>
<p>CloudWatch <strong>구독 필터</strong> + <strong>Data Firehose</strong>가 로그를 S3로 전송하는 표준 패턴입니다(메트릭 스트림은 지표용). S3 Standard-IA는 90일 이상 저빈도 접근에 비용 효율적이며, 180일 이후 검색 빈도가 낮고 지연 허용 시 <strong>Glacier Deep Archive</strong>가 가장 저렴합니다. S3는 데이터 보호(가용성 99.999999999%)를 기본 제공합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A/B</span> — CloudWatch <strong>메트릭 스트림</strong>은 지표(metrics) 전송용이며 로그 이벤트 전송에는 부적합합니다. 구독 필터를 사용해야 합니다.</p>
<p><span class="mark-no">❌ B</span> — S3 One Zone-IA는 단일 AZ에만 저장되어 데이터 보호 요건 위반 가능성이 있습니다.</p>
<p><span class="mark-no">❌ C</span> — Glacier Instant Retrieval은 180일 이후 저빈도 접근에 Deep Archive보다 비용이 높습니다.</p>`,
  disc: []
},
{
  n: 407,
  en: `A company has an organization in AWS Organizations. The organization has all features enabled and has AWS CloudTrail trusted access configured for the management account. An Amazon Simple Notification Service (Amazon SNS) topic is configured for notifications.<br><br>The company needs all AWS events in all AWS Regions in the organization to be recorded and retained in an audit account. The company needs near real-time notifications of any failed login attempts.<br><br>A DevOps engineer has created an organization trail in the management account to log events for all Regions.<br><br>Which solution will meet these requirements with the LEAST operational effort?`,
  ko: `한 회사가 AWS Organizations에 조직을 보유하고 있습니다. 해당 조직은 모든 기능이 활성화되어 있으며 관리 계정에 AWS CloudTrail 신뢰 액세스가 구성되어 있습니다. 알림을 위해 Amazon Simple Notification Service(Amazon SNS) 토픽도 설정되어 있습니다.<br><br>이 회사는 조직 내 모든 AWS 리전에서 발생하는 모든 AWS 이벤트를 기록하고 감사 계정에 보관해야 합니다. 또한 로그인 시도 실패에 대한 거의 실시간 알림이 필요합니다.<br><br>DevOps 엔지니어는 모든 리전의 이벤트를 기록하기 위해 관리 계정에 조직 트레일을 생성했습니다.<br><br>이러한 요구 사항을 최소한의 운영 노력으로 충족할 수 있는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure the trail to publish logs to a new Amazon S3 bucket in the audit account. In the audit account, create an Amazon EventBridge rule that reacts to failed login events in CloudTrail. Configure the EventBridge rule to notify the SNS topic.`, ko:`CloudTrail이 감사 계정의 새 Amazon S3 버킷에 로그를 게시하도록 구성합니다. 감사 계정에서 CloudTrail의 로그인 실패 이벤트에 반응하는 Amazon EventBridge 규칙을 생성합니다. EventBridge 규칙이 SNS 토픽에 알림을 보내도록 구성합니다.` },
    { k:'B', en:`Configure the trail to publish logs to a new Amazon S3 bucket in the management account. Configure an Amazon Athena table to read from the new S3 bucket. Create an AWS Lambda function that queries the Athena table for failed login events and publishes the findings to the SNS topic. Create an Amazon EventBridge scheduled rule to invoke the Lambda function every 5 minutes.`, ko:`트레일이 관리 계정의 새 Amazon S3 버킷에 로그를 게시하도록 구성합니다. 새 S3 버킷에서 데이터를 읽도록 Amazon Athena 테이블을 구성합니다. 로그인 실패 이벤트를 Athena 테이블에서 쿼리하고 결과를 SNS 토픽에 게시하는 AWS Lambda 함수를 생성합니다. 5분마다 Lambda 함수를 실행하도록 Amazon EventBridge 예약 규칙을 생성합니다.` },
    { k:'C', en:`Configure the trail to publish logs to a new Amazon S3 bucket in the audit account and a new Amazon CloudWatch log group in the management account. Create a CloudWatch Logs metric filter on the log group to create a custom metric for failed logins. Configure a CloudWatch alarm that uses the custom metric and notifies the SNS topic.`, ko:`감사 계정의 새 Amazon S3 버킷과 관리 계정의 새 Amazon CloudWatch 로그 그룹에 로그를 게시하도록 트레일을 구성합니다. 로그 그룹에 CloudWatch Logs 메트릭 필터를 생성하여 로그인 실패에 대한 사용자 지정 메트릭을 만듭니다. 사용자 지정 메트릭을 사용하고 SNS 토픽에 알림을 보내는 CloudWatch 알람을 구성합니다.` },
    { k:'D', en:`Configure the trail to publish logs to a new Amazon CloudWatch log group in the audit account. Create an Amazon Kinesis data stream in the audit account. Configure a subscription filter on the log group to send the logs to the data stream. Use Amazon Managed Service for Apache Flink to filter the data stream for failed logins. Publish the results to the SNS topic.`, ko:`감사 계정의 새 Amazon CloudWatch 로그 그룹에 로그를 게시하도록 트레일을 구성합니다. 감사 계정에 Amazon Kinesis 데이터 스트림을 생성합니다. 로그 그룹에 구독 필터를 구성하여 로그를 데이터 스트림으로 전송합니다. Amazon Managed Service for Apache Flink를 사용하여 데이터 스트림에서 로그인 실패를 필터링합니다. 결과를 SNS 토픽에 게시합니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — 핵심 이유</span></p>
<p>두 요구사항을 동시에 충족합니다. ① S3(감사 계정)에 로그 보관 → 감사 요건 충족. ② CloudWatch 로그 그룹 + 메트릭 필터(로그인 실패 패턴 감지) + CloudWatch 알람 + SNS → 거의 실시간 알림. CloudWatch 메트릭 필터 방식은 추가 인프라 없이 간단히 구현 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — EventBridge는 CloudTrail 이벤트를 실시간으로 수신하지만, S3에 저장된 로그를 직접 스캔하지는 않아 로그인 실패 감지가 지연될 수 있습니다.</p>
<p><span class="mark-no">❌ B</span> — S3+Athena+Lambda 방식은 5분 주기 폴링으로 실시간 알림이 불가하고 운영 복잡성이 높습니다.</p>
<p><span class="mark-no">❌ D</span> — Kinesis + Flink 조합은 과도하게 복잡하며 운영 오버헤드가 큽니다.</p>`,
  disc: []
},
{
  n: 408,
  en: `A company runs a microservices application on Amazon Elastic Kubernetes Service (Amazon EKS). Users recently reported significant delays while accessing an account summary feature, particularly during peak business hours.<br><br>A DevOps engineer used Amazon CloudWatch metrics and logs to troubleshoot the issue. The logs indicated normal CPU and memory utilization on the EKS nodes. The DevOps engineer was not able to identify where the delays occurred within the microservices architecture.<br><br>The DevOps engineer needs to increase the observability of the application to pinpoint where the delays are occurring.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 Amazon Elastic Kubernetes Service(Amazon EKS)에서 마이크로서비스 애플리케이션을 운영하고 있습니다. 최근 사용자들이 계정 요약 기능에 접속할 때, 특히 업무량이 많은 시간대에 상당한 지연이 발생한다고 보고했습니다.<br><br>DevOps 엔지니어는 Amazon CloudWatch 메트릭과 로그를 사용하여 문제를 해결하려고 시도했습니다. 로그에는 EKS 노드의 CPU 및 메모리 사용률이 정상으로 나타났습니다. 하지만 DevOps 엔지니어는 마이크로서비스 아키텍처 내에서 지연이 발생하는 지점을 정확히 파악할 수 없었습니다.<br><br>DevOps 엔지니어는 지연 발생 지점을 정확히 찾아내기 위해 애플리케이션의 가시성을 높여야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Deploy the AWS X-Ray daemon as a DaemonSet in the EKS cluster. Use the X-Ray SDK to instrument the application code. Redeploy the application.`, ko:`AWS X-Ray 데몬을 EKS 클러스터에 DaemonSet으로 배포합니다. X-Ray SDK를 사용하여 애플리케이션 코드를 계측합니다. 애플리케이션을 다시 배포합니다.` },
    { k:'B', en:`Enable CloudWatch Container Insights for the EKS cluster. Use the Container Insights data to diagnose the delays.`, ko:`EKS 클러스터에 대해 CloudWatch Container Insights를 활성화합니다. Container Insights 데이터를 사용하여 지연 원인을 진단합니다.` },
    { k:'C', en:`Create alarms based on the existing CloudWatch metrics. Set up an Amazon Simple Notification Service (Amazon SNS) topic to send email alerts.`, ko:`기존 CloudWatch 지표를 기반으로 알람을 생성합니다. 이메일 알림을 보내도록 Amazon Simple Notification Service(Amazon SNS) 토픽을 설정합니다.` },
    { k:'D', en:`Increase the timeout settings in the application code for network operations to allow more time for operations to finish.`, ko:`네트워크 작업에 대한 애플리케이션 코드의 타임아웃 설정을 늘려 작업 완료에 더 많은 시간을 확보하십시오.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>CPU/메모리가 정상이고 CloudWatch 로그로도 지연 지점을 특정할 수 없는 상황에서, 필요한 것은 <strong>분산 추적(distributed tracing)</strong>입니다. X-Ray 데몬을 DaemonSet으로 배포하고 SDK로 코드를 계측하면 각 마이크로서비스 간 요청 흐름과 지연 시간을 서비스 맵으로 시각화하여 병목 지점을 정확히 파악할 수 있습니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — Container Insights는 이미 확인된 CPU/메모리 수준의 인프라 지표만 제공하며, 서비스 간 요청 추적은 불가합니다.</p>
<p><span class="mark-no">❌ C</span> — 기존 지표 기반 알람은 이미 문제가 발생한 후 알리는 것이며, 지연 원인 파악에 도움이 되지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — 타임아웃 증가는 근본 원인을 해결하지 않고 증상만 임시 완화합니다.</p>`,
  disc: []
},
{
  n: 409,
  en: `A company uses a pipeline in AWS CodePipeline to upload AWS CloudFormation templates to an Amazon S3 bucket. The pipeline uses the templates to deploy CloudFormation stacks that match the names of the templates.<br><br>The company has experienced issues when it tries to revert templates to a previous version. To prevent these issues, the company must have the ability to review template modifications before the modifications are deployed to production.<br><br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `한 회사가 AWS CodePipeline 파이프라인을 사용하여 AWS CloudFormation 템플릿을 Amazon S3 버킷에 업로드합니다. 이 파이프라인은 업로드된 템플릿을 사용하여 템플릿 이름과 일치하는 CloudFormation 스택을 배포합니다.<br><br>이 회사는 템플릿을 이전 버전으로 되돌리려고 할 때 문제가 발생하는 것을 경험했습니다. 이러한 문제를 방지하기 위해 회사는 수정된 템플릿이 프로덕션 환경에 배포되기 전에 수정 사항을 검토할 수 있어야 합니다.<br><br>이러한 요구 사항을 충족하면서 운영 오버헤드를 최소화하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure a connection in AWS CodeConnections to a Git repository. Store the templates in the Git repository. Configure a pull request workflow to review template modifications. Configure AWS CloudFormation Git sync for the stacks.`, ko:`AWS CodeConnections에서 Git 리포지토리에 대한 연결을 구성합니다. 템플릿을 Git 리포지토리에 저장합니다. 템플릿 수정 사항을 검토하는 풀 리퀘스트 워크플로를 구성합니다. 스택에 대한 AWS CloudFormation Git 동기화를 구성합니다.` },
    { k:'B', en:`Add a manual review action in the pipeline to review modifications to the template code before the stack deployments.`, ko:`스택 배포 전에 템플릿 코드 수정 사항을 검토하는 수동 검토 작업을 파이프라인에 추가합니다.` },
    { k:'C', en:`Update the pipeline to invoke an AWS Lambda function to check the template modifications before the stack deployments.`, ko:`스택 배포 전에 템플릿 수정 사항을 확인하기 위해 AWS Lambda 함수를 호출하도록 파이프라인을 업데이트합니다.` },
    { k:'D', en:`Configure a connection in AWS CodeConnections to a Git repository. Store the templates in the Git repository. Configure the pipeline to include a source action that uses the connection. Add a manual review action to the pipeline to review template modifications before the stack deployments.`, ko:`AWS CodeConnections에서 Git 리포지토리에 대한 연결을 구성합니다. 템플릿을 Git 리포지토리에 저장합니다. 파이프라인에 해당 연결을 사용하는 소스 작업을 포함하도록 구성합니다. 스택 배포 전에 템플릿 수정 사항을 검토하기 위해 파이프라인에 수동 검토 작업을 추가합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>AWS CloudFormation Git 동기화(Git sync)는 Git 리포지토리의 템플릿 변경을 자동으로 스택에 반영하는 기능입니다. PR 워크플로로 변경 사항을 검토(버전 관리 + 롤백 용이)하고, Git sync로 배포를 자동화하면 별도 파이프라인 수정 없이 최소 운영 오버헤드로 요구사항을 충족합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 수동 검토 액션 추가만으로는 버전 관리와 롤백 문제가 해결되지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — Lambda 함수로 템플릿 검증은 가능하지만 PR 기반 검토 워크플로와 버전 관리 기능이 없습니다.</p>
<p><span class="mark-no">❌ D</span> — Git 저장 + 파이프라인 소스 액션 + 수동 검토는 A보다 구성이 복잡하며 Git sync의 자동화 이점이 없습니다.</p>`,
  disc: []
},
{
  n: 410,
  en: `A company uses a trunk-based development branching strategy. The company has two AWS CodePipeline pipelines that are integrated with a Git provider. The <code>pull_request</code> pipeline has a branch filter that matches the feature branches. The <code>main_branch</code> pipeline has a branch filter that matches the main branch.<br><br>When pull requests are merged into the main branch, the pull requests are deployed by using the <code>main_branch</code> pipeline.<br><br>The company's developers need test results for all submitted pull requests as quickly as possible from the <code>pull_request</code> pipeline. The company wants to ensure that the <code>main_branch</code> pipeline's test results finish and that each deployment is complete before the next pipeline execution.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 트렁크 기반 개발 브랜칭 전략을 사용하고 있습니다. 이 회사는 Git 프로바이더와 통합된 두 개의 AWS CodePipeline 파이프라인을 보유하고 있습니다. <code>pull_request</code> 파이프라인에는 기능 브랜치와 일치하는 브랜치 필터가 설정되어 있고, <code>main_branch</code> 파이프라인에는 메인 브랜치와 일치하는 브랜치 필터가 설정되어 있습니다.<br><br>풀 리퀘스트가 메인 브랜치에 병합되면 <code>main_branch</code> 파이프라인을 사용하여 배포가 진행됩니다.<br><br>이 회사의 개발자들은 제출된 모든 풀 리퀘스트에 대한 테스트 결과를 <code>pull_request</code> 파이프라인에서 최대한 빠르게 받아야 합니다. 또한, 다음 파이프라인 실행 전에 <code>main_branch</code> 파이프라인의 테스트 결과가 완료되고 각 배포가 완료되도록 해야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure the <code>pull_request</code> pipeline to use PARALLEL mode. Configure the <code>main_branch</code> pipeline to use QUEUED mode.`, ko:`<code>pull_request</code> 파이프라인을 PARALLEL 모드로 구성하고, <code>main_branch</code> 파이프라인을 QUEUED 모드로 구성합니다.` },
    { k:'B', en:`Configure the <code>pull_request</code> pipeline to use SUPERSEDED mode. Configure the <code>main_branch</code> pipeline to use QUEUED mode.`, ko:`<code>pull_request</code> 파이프라인을 SUPERSEDED 모드로 구성하고, <code>main_branch</code> 파이프라인을 QUEUED 모드로 구성합니다.` },
    { k:'C', en:`Configure the <code>pull_request</code> pipeline to use PARALLEL mode. Configure the <code>main_branch</code> pipeline to use SUPERSEDED mode.`, ko:`<code>pull_request</code> 파이프라인을 PARALLEL 모드로 구성하고, <code>main_branch</code> 파이프라인을 SUPERSEDED 모드로 구성합니다.` },
    { k:'D', en:`Configure the <code>pull_request</code> pipeline to use QUEUED mode. Configure the <code>main_branch</code> pipeline to use SUPERSEDED mode.`, ko:`<code>pull_request</code> 파이프라인을 QUEUED 모드로 구성하고, <code>main_branch</code> 파이프라인을 SUPERSEDED 모드로 구성합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p><strong>PARALLEL 모드</strong>: 여러 PR 실행이 동시에(병렬로) 실행됩니다. 모든 PR에 대해 최대한 빠르게 테스트 결과를 받아야 하는 <code>pull_request</code> 파이프라인에 적합합니다.</p>
<p><strong>QUEUED 모드</strong>: 현재 실행이 완료될 때까지 다음 실행이 대기열에서 기다립니다. 각 배포가 완전히 완료된 후에만 다음 실행이 시작되어야 하는 <code>main_branch</code> 파이프라인에 적합합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — SUPERSEDED 모드는 새 실행이 시작되면 이전 실행을 중단하므로, PR 테스트 결과가 일부 누락될 수 있습니다.</p>
<p><span class="mark-no">❌ C</span> — main_branch에 SUPERSEDED 모드를 사용하면 이전 배포가 중단될 수 있어 불완전한 배포 상태가 발생할 위험이 있습니다.</p>
<p><span class="mark-no">❌ D</span> — pull_request에 QUEUED 모드를 사용하면 PR이 순차적으로 처리되어 빠른 테스트 결과 수신이 불가합니다.</p>`,
  disc: []
},
{
  n: 411,
  en: `A DevOps engineer needs to configure an AWS CodePipeline pipeline that publishes container images to an Amazon Elastic Container Registry (Amazon ECR) repository. The pipeline must wait for the previous run to finish and must run when new Git tags are pushed to a Git repository that is connected to AWS CodeConnections. An existing deployment pipeline needs to run in response to the publication of new container images.<br><br>Which solution will meet these requirements?`,
  ko: `DevOps 엔지니어는 컨테이너 이미지를 Amazon Elastic Container Registry(Amazon ECR) 리포지토리에 게시하는 AWS CodePipeline 파이프라인을 구성해야 합니다. 이 파이프라인은 이전 실행이 완료될 때까지 기다려야 하며, AWS CodeConnections에 연결된 Git 리포지토리에 새 Git 태그가 푸시될 때 실행되어야 합니다. 기존 배포 파이프라인은 새 컨테이너 이미지 게시 시 실행되어야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure a CodePipeline V2 type pipeline that uses QUEUED mode. Add a trigger filter to the pipeline definition that includes all tags. Configure an Amazon EventBridge rule that matches container image pushes to start the existing deployment pipeline.`, ko:`QUEUED 모드를 사용하는 CodePipeline V2 유형 파이프라인을 구성합니다. 모든 태그를 포함하는 트리거 필터를 파이프라인 정의에 추가합니다. 컨테이너 이미지 푸시와 일치하는 Amazon EventBridge 규칙을 구성하여 기존 배포 파이프라인을 시작합니다.` },
    { k:'B', en:`Configure a CodePipeline V2 type pipeline that uses SUPERSEDED mode. Add a trigger filter to the pipeline definition that includes all branches. Configure an Amazon EventBridge rule that matches container image pushes to start the existing deployment pipeline.`, ko:`SUPERSEDED 모드를 사용하는 CodePipeline V2 유형 파이프라인을 구성합니다. 모든 브랜치를 포함하는 트리거 필터를 파이프라인 정의에 추가합니다. 컨테이너 이미지 푸시와 일치하는 Amazon EventBridge 규칙을 구성하여 기존 배포 파이프라인을 시작합니다.` },
    { k:'C', en:`Configure a CodePipeline V1 type pipeline that uses SUPERSEDED mode. Add a trigger filter to the pipeline definition that includes all tags. Add a stage at the end of the pipeline to invoke the existing deployment pipeline.`, ko:`SUPERSEDED 모드를 사용하는 CodePipeline V1 유형 파이프라인을 구성합니다. 모든 태그를 포함하는 트리거 필터를 파이프라인 정의에 추가합니다. 기존 배포 파이프라인을 호출하는 단계를 파이프라인 끝에 추가합니다.` },
    { k:'D', en:`Configure a CodePipeline V1 type pipeline that uses QUEUED mode. Add a trigger filter to the pipeline definition that includes all branches. Add a stage at the end of the pipeline to invoke the existing deployment pipeline.`, ko:`QUEUED 모드를 사용하는 CodePipeline V1 유형의 파이프라인을 구성합니다. 모든 브랜치를 포함하는 트리거 필터를 파이프라인 정의에 추가합니다. 기존 배포 파이프라인을 호출하는 단계를 파이프라인 끝에 추가합니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>세 가지 요구사항을 모두 충족합니다.</p>
<ul>
<li><strong>V2 + QUEUED 모드</strong>: 이전 실행이 완료될 때까지 다음 실행이 대기합니다.</li>
<li><strong>태그 트리거 필터</strong>: V2 파이프라인은 Git 태그 기반 트리거 필터를 지원합니다(V1은 미지원).</li>
<li><strong>EventBridge 규칙</strong>: ECR 이미지 푸시 이벤트를 감지하여 기존 배포 파이프라인을 자동 시작합니다.</li>
</ul>`,
  wrong: `<p><span class="mark-no">❌ B</span> — 브랜치 필터가 아닌 태그 필터가 필요하며, SUPERSEDED는 이전 실행을 취소하므로 "대기" 요건 위반입니다.</p>
<p><span class="mark-no">❌ C/D</span> — CodePipeline V1은 태그 기반 트리거 필터를 지원하지 않습니다.</p>
<p><span class="mark-no">❌ C</span> — 파이프라인 끝에 배포 파이프라인 호출 단계를 추가하면 이미지 빌드 파이프라인과 배포 파이프라인이 결합되어 독립성이 떨어집니다.</p>`,
  disc: []
},
{
  n: 412,
  en: `A company is running an application on Amazon Elastic Kubernetes Service (Amazon EKS). The company needs to implement comprehensive logging for the control plane and the nodes. The company must analyze API requests to the Kubernetes control plane and must monitor container performance on the nodes.<br><br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `한 회사가 Amazon Elastic Kubernetes Service(Amazon EKS)에서 애플리케이션을 실행하고 있습니다. 이 회사는 컨트롤 플레인과 노드에 대한 포괄적인 로깅을 구현해야 합니다. Kubernetes 컨트롤 플레인에 대한 API 요청을 분석하고 노드에서 컨테이너 성능을 모니터링해야 합니다.<br><br>이러한 요구 사항을 충족하면서 운영 오버헤드를 최소화하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Enable AWS CloudTrail for control plane logging. Deploy Logstash as a ReplicaSet on the nodes to collect logs from the nodes. Use Amazon OpenSearch Service to store and analyze the logs for the control plane and the nodes.`, ko:`컨트롤 플레인 로깅을 위해 AWS CloudTrail을 활성화합니다. 노드에서 로그를 수집하기 위해 Logstash를 ReplicaSet으로 노드에 배포합니다. Amazon OpenSearch Service를 사용하여 컨트롤 플레인 및 노드의 로그를 저장하고 분석합니다.` },
    { k:'B', en:`Enable control plane logging for the EKS cluster. Send the logs to Amazon CloudWatch. Use CloudWatch Container Insights to collect logs for the nodes and the containers. Use CloudWatch Logs Insights to query and analyze the logs for the control plane and the nodes.`, ko:`EKS 클러스터에 대한 컨트롤 플레인 로깅을 활성화합니다. 로그를 Amazon CloudWatch로 전송합니다. CloudWatch Container Insights를 사용하여 노드 및 컨테이너에 대한 로그를 수집합니다. CloudWatch Logs Insights를 사용하여 컨트롤 플레인 및 노드에 대한 로그를 쿼리하고 분석합니다.` },
    { k:'C', en:`Enable API server control plane logging for the EKS cluster. Send the logs to Amazon S3. Deploy Kubernetes Event Exporter to the nodes to collect logs from the nodes. Send the logs to Amazon S3. Use Amazon Athena to query logs for the control plane and the nodes. Use Amazon QuickSight for visualization.`, ko:`EKS 클러스터에 대한 API 서버 제어 플레인 로깅을 활성화합니다. 로그를 Amazon S3로 전송합니다. 노드에 Kubernetes Event Exporter를 배포하여 노드에서 로그를 수집합니다. 수집된 로그를 Amazon S3로 전송합니다. Amazon Athena를 사용하여 제어 플레인 및 노드의 로그를 쿼리합니다. Amazon QuickSight를 사용하여 시각화합니다.` },
    { k:'D', en:`Use AWS Distro for OpenTelemetry to collect logs for the control plane and the nodes. Stream all the logs to Amazon Data Firehose. Use Amazon Redshift to analyze the aggregated log data for the control plane and the nodes.`, ko:`AWS Distro for OpenTelemetry를 사용하여 컨트롤 플레인과 노드의 로그를 수집합니다. 모든 로그를 Amazon Data Firehose로 스트리밍합니다. Amazon Redshift를 사용하여 컨트롤 플레인과 노드의 집계된 로그 데이터를 분석합니다.` },
  ],
  answer: ['B'],
  vote: '100% B',
  explain: `<p><span class="mark-ok">✅ B — 핵심 이유</span></p>
<p>EKS 컨트롤 플레인 로깅은 CloudWatch로 직접 전송 가능하며, CloudWatch Container Insights는 EKS 노드/컨테이너 성능 지표와 로그를 자동 수집합니다. CloudWatch Logs Insights로 두 소스의 로그를 단일 환경에서 분석할 수 있어 추가 인프라 없이 최소 운영 오버헤드로 요구사항을 충족합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — CloudTrail은 EKS 컨트롤 플레인 로그 전용이 아니며, Logstash + OpenSearch 구성은 운영 오버헤드가 큽니다.</p>
<p><span class="mark-no">❌ C</span> — S3 + Athena + QuickSight 파이프라인은 구성이 복잡하고 실시간 분석이 어렵습니다.</p>
<p><span class="mark-no">❌ D</span> — OpenTelemetry + Firehose + Redshift는 로그 분석보다 대용량 데이터 웨어하우징에 적합하며 불필요하게 복잡합니다.</p>`,

{
  n: 413,
  en: `A company wants to improve its security practices by enforcing least privilege across all projects. Developers must be able to access Amazon EC2 resources but not Amazon RDS resources. Database administrators must have access only to Amazon RDS resources.<br><br>Every employee has a unique IAM user. There are already pre-existing IAM policies for developer and database administrator job functions. All AWS resources are already tagged with appropriate project tags. All the IAM users are tagged with the appropriate project and job function.<br><br>The company must ensure that each employee can access only the project that the employee is working on.<br><br>Which solution will meet these requirements? (Choose three.)`,
  ko: `한 회사가 모든 프로젝트에 걸쳐 최소 권한 원칙을 적용하여 보안을 강화하고자 합니다. 개발자는 Amazon EC2 리소스에는 접근할 수 있어야 하지만 Amazon RDS 리소스에는 접근할 수 없어야 합니다. 데이터베이스 관리자는 Amazon RDS 리소스에만 접근할 수 있어야 합니다.<br><br>모든 직원은 고유한 IAM 사용자를 가지고 있습니다. 개발자와 데이터베이스 관리자 직무에 대한 기존 IAM 정책이 이미 마련되어 있습니다. 모든 AWS 리소스에는 적절한 프로젝트 태그가 지정되어 있습니다. 모든 IAM 사용자에게는 적절한 프로젝트 및 직무 태그가 지정되어 있습니다.<br><br>회사는 각 직원이 자신이 담당하는 프로젝트에만 접근할 수 있도록 보장해야 합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇입니까? (세 가지를 선택하십시오.)`,
  type: 'multi', multiCount: 3,
  choices: [
    { k:'A', en:`For each project, create one IAM role for developers and one IAM role for database administrators. Tag the IAM roles with the corresponding projects and job functions.`, ko:`각 프로젝트에 대해 개발자용 IAM 역할 하나와 데이터베이스 관리자용 IAM 역할 하나를 생성합니다. 해당 IAM 역할에 프로젝트 및 직무 기능을 태그로 지정합니다.` },
    { k:'B', en:`Modify the pre-existing IAM policies to include a StringEquals ResourceTag condition for projects that match the PrincipalTag value. Attach the modified policies to the IAM roles for each job function.`, ko:`기존 IAM 정책을 수정하여 PrincipalTag 값과 일치하는 프로젝트에 대해 StringEquals ResourceTag 조건을 추가합니다. 수정된 정책을 각 직무의 IAM 역할에 연결합니다.` },
    { k:'C', en:`Create an IAM policy that allows users to assume a role when the ResourceTag value matches the PrincipalTag value for project tags and job title tags. Attach the new policy to all IAM users.`, ko:`프로젝트 태그 및 직책 태그의 경우, ResourceTag 값이 PrincipalTag 값과 일치할 때 사용자가 역할을 수임할 수 있도록 하는 IAM 정책을 생성합니다. 새 정책을 모든 IAM 사용자에게 적용합니다.` },
    { k:'D', en:`Create an IAM policy that allows users to assume a role when the ResourceTag value matches the PrincipalTag value for project tags and job title tags. Attach the new policy to the IAM roles for each job function.`, ko:`프로젝트 태그 및 직책 태그의 경우, ResourceTag 값이 PrincipalTag 값과 일치할 때 사용자가 역할을 수임할 수 있도록 하는 IAM 정책을 생성합니다. 새 정책을 각 직무에 대한 IAM 역할에 연결합니다.` },
    { k:'E', en:`Tag the pre-existing IAM policies with the appropriate projects and job functions. Attach the modified policies to IAM roles for each job function.`, ko:`기존 IAM 정책에 적절한 프로젝트 및 직무 기능을 태그합니다. 수정된 정책을 각 직무 기능에 대한 IAM 역할에 연결합니다.` },
    { k:'F', en:`For each project, create one IAM group for developers and one IAM group for database administrators. Add the appropriate users to each group so the users can assume their respective IAM roles.`, ko:`각 프로젝트에 대해 개발자용 IAM 그룹 하나와 데이터베이스 관리자용 IAM 그룹 하나를 생성합니다. 각 그룹에 적절한 사용자를 추가하여 사용자가 해당 IAM 역할을 수행할 수 있도록 합니다.` },
  ],
  answer: ['A','B','C'],
  vote: '100% ABC',
  explain: `<p><span class="mark-ok">✅ A+B+C — 핵심 이유</span></p>
<p><strong>A</strong>: 프로젝트별 + 직무별 IAM 역할을 생성하고 태그를 지정하면, 태그 기반 조건부 역할 수임이 가능해집니다.</p>
<p><strong>B</strong>: 기존 정책에 <code>StringEquals aws:ResourceTag/project</code>와 <code>aws:PrincipalTag/project</code>가 일치할 때만 허용하는 조건을 추가하면, 사용자는 자신의 프로젝트 리소스에만 접근합니다.</p>
<p><strong>C</strong>: 사용자의 프로젝트/직무 태그와 역할 태그가 일치할 때만 역할 수임을 허용하는 정책을 모든 IAM 사용자에 연결하면, 올바른 역할만 수임 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ D</span> — 역할 수임 허용 정책을 역할에 연결하면 자기 자신이 자신을 수임하는 구조가 되어 논리적으로 부적합합니다. 사용자(principal)에 연결해야 합니다.</p>
<p><span class="mark-no">❌ E</span> — IAM 정책 자체에 태그를 지정해도 조건부 접근 제어에는 영향을 미치지 않습니다.</p>
<p><span class="mark-no">❌ F</span> — IAM 그룹은 태그 기반 조건부 역할 수임과 무관하며, 불필요한 그룹 관리 오버헤드를 추가합니다.</p>`,
  disc: []
},
{
  n: 414,
  en: `A company runs a development environment website and database on an Amazon EC2 instance that uses Amazon Elastic Block Store (Amazon EBS) storage. The company wants to make the instance more resilient to underlying hardware issues. The company wants to automatically recover the EC2 instance if AWS determines the instance has lost network connectivity.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 Amazon EBS(Amazon Elastic Block Store) 스토리지를 사용하는 Amazon EC2 인스턴스에서 개발 환경 웹사이트와 데이터베이스를 운영하고 있습니다. 이 회사는 하드웨어 문제에 대한 인스턴스의 복원력을 높이고자 합니다. 또한 AWS에서 인스턴스의 네트워크 연결이 끊어졌다고 판단할 경우 EC2 인스턴스를 자동으로 복구하기를 원합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Add the EC2 instance to an Auto Scaling group. Set the minimum, maximum, and desired capacity to 1.`, ko:`EC2 인스턴스를 자동 스케일링 그룹에 추가합니다. 최소, 최대 및 원하는 용량을 모두 1로 설정합니다.` },
    { k:'B', en:`Add the EC2 instance to an Auto Scaling group. Configure a lifecycle hook to detach the EBS volume if the EC2 instance shuts down or terminates.`, ko:`EC2 인스턴스를 자동 스케일링 그룹에 추가합니다. EC2 인스턴스가 종료되거나 종료될 경우 EBS 볼륨을 분리하도록 수명 주기 후크를 구성합니다.` },
    { k:'C', en:`Create an Amazon CloudWatch alarm for the <code>StatusCheckFailed_System</code> metric. Add an EC2 action to recover the instance when the alarm state is in ALARM.`, ko:`<code>StatusCheckFailed_System</code> 메트릭에 대한 Amazon CloudWatch 알람을 생성합니다. 알람 상태가 ALARM일 때 인스턴스를 복구하는 EC2 액션을 추가합니다.` },
    { k:'D', en:`Create an Amazon CloudWatch alarm for the <code>NetworkOut</code> metric. Add an EC2 action to recover the instance when the alarm state is in INSUFFICIENT_DATA.`, ko:`<code>NetworkOut</code> 메트릭에 대한 Amazon CloudWatch 알람을 생성합니다. 알람 상태가 INSUFFICIENT_DATA일 때 인스턴스를 복구하는 EC2 액션을 추가합니다.` },
  ],
  answer: ['C'],
  vote: '100% C',
  explain: `<p><span class="mark-ok">✅ C — 핵심 이유</span></p>
<p><code>StatusCheckFailed_System</code> 메트릭은 AWS가 인스턴스의 하드웨어 문제(네트워크 연결 손실 포함)를 감지할 때 트리거됩니다. CloudWatch 알람에 EC2 복구 액션을 추가하면 동일한 인스턴스 ID, EBS 볼륨, Elastic IP를 유지하면서 자동으로 인스턴스를 복구합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ A</span> — Auto Scaling 그룹은 인스턴스를 새로 교체하므로 EBS 볼륨, IP, 데이터가 보존되지 않을 수 있습니다.</p>
<p><span class="mark-no">❌ B</span> — EBS 분리 수명 주기 후크는 복구 기능을 제공하지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — NetworkOut 메트릭과 INSUFFICIENT_DATA 상태는 네트워크 연결 손실 감지에 부적합합니다.</p>`,
  disc: []
},
{
  n: 415,
  en: `A company operates a fleet of Amazon EC2 instances that host critical applications and handle sensitive data. The EC2 instances must have up-to-date security patches to protect against vulnerabilities and ensure compliance with industry standards and regulations. The company needs an automated solution to monitor and enforce security patch compliance across the EC2 fleet.<br><br>Which solution will meet these requirements?`,
  ko: `한 회사가 핵심 애플리케이션을 호스팅하고 민감한 데이터를 처리하는 Amazon EC2 인스턴스를 운영하고 있습니다. 이러한 EC2 인스턴스는 취약점으로부터 보호하고 업계 표준 및 규정을 준수하기 위해 최신 보안 패치가 적용되어야 합니다. 회사는 EC2 인스턴스 전체에 걸쳐 보안 패치 준수 여부를 모니터링하고 강제할 수 있는 자동화된 솔루션이 필요합니다.<br><br>이러한 요구 사항을 충족하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Configure AWS Systems Manager Patch Manager and AWS Config with defined patch baselines and compliance rules that run Systems Manager Automation documents.`, ko:`AWS Systems Manager Patch Manager 및 AWS Config를 구성하여 Systems Manager 자동화 문서를 실행하는 패치 기준선 및 규정 준수 규칙을 정의합니다.` },
    { k:'B', en:`Access each EC2 instance by using SSH keys. Check for and apply security updates by using package managers. Verify the installations.`, ko:`SSH 키를 사용하여 각 EC2 인스턴스에 접속합니다. 패키지 관리자를 사용하여 보안 업데이트를 확인하고 적용합니다. 설치가 제대로 되었는지 확인합니다.` },
    { k:'C', en:`Configure Auto Scaling groups that have scaling policies based on Amazon CloudWatch metrics. Configure Auto Scaling launch templates that launch new instances by using the latest AMIs that contain new security patches.`, ko:`Amazon CloudWatch 메트릭을 기반으로 하는 스케일링 정책이 있는 Auto Scaling 그룹을 구성합니다. 최신 보안 패치가 포함된 최신 AMI를 사용하여 새 인스턴스를 시작하는 Auto Scaling 시작 템플릿을 구성합니다.` },
    { k:'D', en:`Use AWS CloudFormation to recreate EC2 instances with the latest AMI every time a new patch becomes available. Use AWS CloudTrail logs to monitor patch compliance and to send alerts for non-compliant instances.`, ko:`새 패치가 제공될 때마다 AWS CloudFormation을 사용하여 최신 AMI로 EC2 인스턴스를 다시 생성합니다. AWS CloudTrail 로그를 사용하여 패치 준수 여부를 모니터링하고, 규정을 준수하지 않는 인스턴스에 대한 알림을 보냅니다.` },
  ],
  answer: ['A'],
  vote: '100% A',
  explain: `<p><span class="mark-ok">✅ A — 핵심 이유</span></p>
<p>AWS Systems Manager Patch Manager는 EC2 인스턴스의 패치 기준선 정의, 자동 패치 적용, 준수 여부 보고를 통합 관리합니다. AWS Config 규칙과 연동하면 비준수 인스턴스를 자동 탐지하고 Systems Manager Automation 문서로 자동 교정까지 가능합니다.</p>`,
  wrong: `<p><span class="mark-no">❌ B</span> — SSH 수동 접속은 자동화가 아니며 대규모 플릿 관리에 부적합합니다.</p>
<p><span class="mark-no">❌ C</span> — 새 인스턴스를 최신 AMI로 시작하는 방식은 기존 실행 중인 인스턴스의 패치 준수 여부를 보장하지 않습니다.</p>
<p><span class="mark-no">❌ D</span> — CloudFormation으로 인스턴스 재생성은 운영 중단을 유발하며, CloudTrail은 패치 준수 모니터링 전용 도구가 아닙니다.</p>`,
  disc: []
},
{
  n: 416,
  en: `A company has implemented a new microservices-based application on an Amazon Elastic Container Service (Amazon ECS) cluster. After each deployment, the company wants to validate the critical user journeys and API endpoints before routing traffic to the new application version.<br><br>The company must implement an automated solution to detect issues in the new deployment and to initiate a rollback if necessary.<br><br>Which solution will meet these requirements with the LEAST operational overhead?`,
  ko: `한 회사가 Amazon Elastic Container Service(Amazon ECS) 클러스터에 새로운 마이크로서비스 기반 애플리케이션을 구축했습니다. 회사는 배포 후 매번 핵심 사용자 여정과 API 엔드포인트를 검증한 다음 트래픽을 새 애플리케이션 버전으로 라우팅하려고 합니다.<br><br>새 배포에서 문제를 감지하고 필요한 경우 롤백을 시작하는 자동화된 솔루션을 구현해야 합니다.<br><br>이러한 요구 사항을 충족하면서 운영 오버헤드를 최소화하는 솔루션은 무엇일까요?`,
  type: 'single',
  choices: [
    { k:'A', en:`Set up Amazon CloudWatch Application Insights for the ECS cluster. Create an Amazon EventBridge rule to invoke an AWS Lambda function to analyze the task states. Program the Lambda function to use the ECS UpdateService API call to initiate a rollback if a specific percentage of tasks fail.`, ko:`ECS 클러스터에 Amazon CloudWatch Application Insights를 설정합니다. 작업 상태를 분석하는 AWS Lambda 함수를 호출하는 Amazon EventBridge 규칙을 생성합니다. 특정 비율의 작업이 실패할 경우 롤백을 시작하도록 Lambda 함수를 ECS UpdateService API 호출을 사용하도록 프로그래밍합니다.` },
    { k:'B', en:`Set up Amazon CloudWatch Application Insights for the ECS cluster. Configure Application Insights to monitor key performance indicators of the microservices in the critical user journeys and API calls. Create CloudWatch alarms based on the insights. Use Amazon EventBridge to invoke an AWS Step Functions workflow to evaluate the alarms. Configure the workflow to initiate a rollback if necessary by using the alarms' built-in integration with Amazon ECS.`, ko:`ECS 클러스터에 Amazon CloudWatch Application Insights를 설정합니다. Application Insights를 구성하여 주요 사용자 여정 및 API 호출에서 마이크로서비스의 핵심 성능 지표를 모니터링합니다. 인사이트를 기반으로 CloudWatch 알람을 생성합니다. Amazon EventBridge를 사용하여 AWS Step Functions 워크플로를 실행하고 알람을 평가합니다. Amazon ECS와의 내장 통합 기능을 활용하여 필요한 경우 롤백을 시작하도록 워크플로를 구성합니다.` },
    { k:'C', en:`Create CloudWatch Synthetics canaries that simulate critical user journeys and API calls. Implement AWS X-Ray tracing for all the microservices. Configure X-Ray to send traces to CloudWatch. Create CloudWatch alarms based on error rates and latency metrics. Create an AWS Lambda function to analyze the traces and to initiate a rollback if necessary by using the alarms' built-in integration with Amazon ECS.`, ko:`핵심 사용자 여정과 API 호출을 시뮬레이션하는 CloudWatch Synthetics 카나리를 생성합니다. 모든 마이크로서비스에 대해 AWS X-Ray 트레이싱을 구현하고, X-Ray가 CloudWatch로 트레이스를 전송하도록 구성합니다. 오류율 및 지연 시간 지표를 기반으로 CloudWatch 알람을 생성합니다. Amazon ECS와의 내장 통합 기능을 활용하여 트레이스를 분석하고 필요한 경우 롤백을 시작하는 AWS Lambda 함수를 생성합니다.` },
    { k:'D', en:`Create CloudWatch Synthetics canaries that simulate critical user journeys and API calls. Configure the canaries to run against the new deployment. Create CloudWatch alarms that are invoked when canaries fail. Use the alarms' built-in integration with Amazon ECS to initiate a rollback if the alarms are invoked before traffic is routed to the new deployment.`, ko:`중요한 사용자 여정과 API 호출을 시뮬레이션하는 CloudWatch Synthetics 카나리를 생성합니다. 새 배포 환경에서 실행되도록 카나리를 구성합니다. 카나리 실행 실패 시 호출되는 CloudWatch 알람을 생성합니다. 알람이 새 배포 환경으로 트래픽이 라우팅되기 전에 호출될 경우, Amazon ECS와의 내장 통합 기능을 사용하여 롤백을 시작합니다.` },
  ],
  answer: ['D'],
  vote: '100% D',
  explain: `<p><span class="mark-ok">✅ D — 핵심 이유</span></p>
<p>CloudWatch Synthetics 카나리는 실제 사용자 여정과 API를 자동으로 시뮬레이션합니다. 새 배포에 대해 카나리를 실행하고, 실패 시 CloudWatch 알람이 ECS와의 내장 통합을 통해 자동 롤백을 시작합니다. 이 흐름은 추가 Lambda나 Step Functions 없이 관리형 서비스만으로 완결되어 운영 오버헤드가 최소화됩니다.</p>`,

<p><span class="mark-no">❌ B</span> — Step Functions 워크플로 구성은 불필요하게 복잡합니다.</p>
<p><span class="mark-no">❌ C</span> — X-Ray 트레이싱은 사용자 여정 시뮬레이션(Synthetics)을 대체할 수 없으며, Lambda 분석 코드 작성이 추가로 필요합니다.</p>`,
